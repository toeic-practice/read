$('#importCsv').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCsv(await file.text());if(!rows.length||rows[0].slice(0,6).join('|')!==CSV_HEADER.join('|'))throw Error('欄位格式不符，請使用本網站匯出的 CSV');const incoming={};for(let i=1;i<rows.length;i++){const r=rows[i],id=Number(r[0]),q=QS.find(x=>x.id===id),choice=(r[2]||'').trim();if(r.length<6||!q||!/[A-D]/.test(choice)||choice.length!==1||String(q.part)!==r[1].trim())throw Error('第 '+(i+1)+' 列的題號、Part 或選項有誤');if(r[3].trim()!==q.answer)throw Error('第 '+(i+1)+' 列答案版本不同，已停止匯入');incoming[id]={choice,correct:q.answer?choice===q.answer:null,at:r[5]||''}}const count=Object.keys(incoming).length;if(!confirm('CSV 有 '+count+' 筆有效作答紀錄。匯入後會覆蓋相同題號的現有作答，其餘題目保留。是否繼續？'))return;await window.toeicCloud.importAnswers(incoming);mode='all';index=0;setTabs();render();alert('已成功匯入 '+count+' 筆紀錄。')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};render();

window.toeicApplyRemote=function(answers,starMap,excerptMap){records=answers;collectWrongAnswers();stars=starMap;excerpts=excerptMap||{};render()};
window.toeicClearRemote=function(){records=JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}')||{};collectWrongAnswers();stars=JSON.parse(localStorage.getItem(LOCAL_STAR_KEY)||'{}')||{};excerpts=JSON.parse(localStorage.getItem(LOCAL_EXCERPT_KEY)||'{}')||{};mode='all';index=0;showOverview=false;setTabs();render()};
</script>
<script>
/* Browser-offline fallback: Firebase is optional, local practice always works. */
(function(){
  if(window.toeicCloud) return;
  function persist(){
    localStorage.setItem(LOCAL_KEY,JSON.stringify(records));
    localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));
    localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts));
  }
  window.toeicCloud={ready:true,mode:'local',
    saveAnswer:async(id,data)=>{records[id]=data;persist();render()},
    deleteAnswer:async(id)=>{delete records[id];persist();render()},
    setStar:async(id,marked)=>{if(marked)stars[id]=true;else delete stars[id];persist();render()},
    saveExcerpts:async(id,items)=>{if(items.length)excerpts[id]=items;else delete excerpts[id];persist();render()},
    importAnswers:async(items)=>{records={...records,...items};persist();render()},
    resetAnswers:async()=>{records={};persist();render()}
  };
})();
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:'AIzaSyAA3gxE4CLmVsH3LXjzl4J0O-QhcN14laI',authDomain:'database-89162.firebaseapp.com',projectId:'database-89162',storageBucket:'database-89162.firebasestorage.app',messagingSenderId:'60538861815',appId:'1:60538861815:web:92aa03a61146f491cafbf2',measurementId:'G-JMEN6QNVQ8'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const allowed=['1000','0520','0608','0621','0000','1014'];
const input=document.getElementById('accountCode'),connect=document.getElementById('connectCode'),leave=document.getElementById('leaveCode'),notice=document.getElementById('cloudNotice');
let activeCode='',unsub=[],remoteAnswers={},remoteStars={},remoteExcerpts={},loadedA=false,loadedS=false,loadedE=false,generation=0;
const cloud={ready:false,mode:'local'};window.toeicCloud=cloud;
function info(msg){notice.textContent=msg}
function stopListeners(){generation++;unsub.forEach(fn=>fn());unsub=[];loadedA=false;loadedS=false;loadedE=false;remoteAnswers={};remoteStars={};remoteExcerpts={};cloud.ready=false}
function localSave(){localStorage.setItem(LOCAL_KEY,JSON.stringify(records));localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts))}
function root(type){if(!activeCode||!cloud.ready)throw Error('雲端資料尚未載入');return collection(db,'practiceCodes',activeCode,'test10_'+type)}
function sync(){if(!activeCode||!loadedA||!loadedS||!loadedE)return;cloud.ready=true;cloud.mode='cloud';window.toeicApplyRemote?.({...remoteAnswers},{...remoteStars},{...remoteExcerpts});info('第十回雲端模式：'+activeCode+'，第十回的作答、星號與筆記已載入。');connect.disabled=false;leave.hidden=false}
cloud.saveExcerpts=async(id,items)=>{if(!activeCode){if(items.length)excerpts[id]=items;else delete excerpts[id];localSave();render();return}const ref=doc(root('highlights'),String(id));if(items.length)await setDoc(ref,{items});else await deleteDoc(ref)};
cloud.deleteAnswer=async(id)=>{
  if(!activeCode){delete records[id];localSave();render();return}
  await deleteDoc(doc(root('answers'),String(id)));
};
cloud.saveAnswer=async(id,data)=>{if(!activeCode){records[id]=data;localSave();render();return}await setDoc(doc(root('answers'),String(id)),data)};
cloud.setStar=async(id,marked)=>{if(!activeCode){if(marked)stars[id]=true;else delete stars[id];localSave();render();return}const ref=doc(root('stars'),String(id));if(marked)await setDoc(ref,{marked:true});else await deleteDoc(ref)};
cloud.importAnswers=async(items)=>{if(!activeCode){records={...records,...items};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const entries=Object.entries(items);for(let i=0;i<entries.length;i+=400){const batch=writeBatch(db);for(const [id,data] of entries.slice(i,i+400))batch.set(doc(root('answers'),id),data);await batch.commit()}};
cloud.resetAnswers=async()=>{if(!activeCode){records={};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const ids=Object.keys(remoteAnswers);for(let i=0;i<ids.length;i+=400){const batch=writeBatch(db);ids.slice(i,i+400).forEach(id=>batch.delete(doc(root('answers'),id)));await batch.commit()}};
function goLocal(){stopListeners();activeCode='';cloud.mode='local';input.value='';input.disabled=false;connect.disabled=false;leave.hidden=true;window.toeicClearRemote?.();info('本機模式：未連線雲端，作答只保存在此瀏覽器。')}
leave.addEventListener('click',goLocal);
connect.addEventListener('click',async()=>{const code=input.value.trim();if(!allowed.includes(code)){info('代號無效。請輸入管理員提供的 4 位代號。');return}if(activeCode===code&&cloud.ready)return;stopListeners();activeCode=code;cloud.mode='loading';cloud.ready=false;window.toeicApplyRemote?.({},{});connect.disabled=true;leave.hidden=false;info('正在載入雲端歷史紀錄，請不要作答…');let token=generation;
try{if(!auth.currentUser)await signInAnonymously(auth);if(token!==generation)return;
const a=onSnapshot(collection(db,'practiceCodes',code,'test10_answers'),snap=>{if(token!==generation)return;remoteAnswers={};snap.forEach(d=>{if(/^\d+$/.test(d.id))remoteAnswers[d.id]=d.data()});loadedA=true;sync()},err=>{if(token===generation){info('讀取雲端失敗：'+err.message+'。請檢查匿名驗證與 Firestore 規則。');connect.disabled=false}});
unsub.push(a);
const b=onSnapshot(collection(db,'practiceCodes',code,'test10_stars'),snap=>{if(token!==generation)return;remoteStars={};snap.forEach(d=>{if(/^\d+$/.test(d.id)&&d.data().marked)remoteStars[d.id]=true});loadedS=true;sync()},err=>{if(token===generation){info('讀取星號失敗：'+err.message);connect.disabled=false}});unsub.push(b);
const c=onSnapshot(collection(db,'practiceCodes',code,'test10_highlights'),snap=>{if(token!==generation)return;remoteExcerpts={};snap.forEach(d=>{const items=d.data().items;if(/^\d+$/.test(d.id)&&Array.isArray(items))remoteExcerpts[d.id]=items.filter(x=>typeof x==='string')});loadedE=true;sync()},err=>{if(token===generation){info('讀取文字摘錄失敗：'+err.message+'。請更新 Firestore 規則。');connect.disabled=false}});unsub.push(c);
}catch(err){if(token===generation){info('Firebase 連線失敗：'+err.message);connect.disabled=false}}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();connect.click()}});
// 在雲端讀取期間禁用作答；已離線作答不會自動上傳。
const originalSave=cloud.saveAnswer,originalStar=cloud.setStar,originalImport=cloud.importAnswers,originalReset=cloud.resetAnswers;
for(const [name,fn] of [['saveAnswer',originalSave],['deleteAnswer',cloud.deleteAnswer],['setStar',originalStar],['importAnswers',originalImport],['resetAnswers',originalReset],['saveExcerpts',cloud.saveExcerpts]])cloud[name]=async(...args)=>{if(cloud.mode==='loading'||activeCode&&!cloud.ready)throw Error('雲端正在載入或連線異常，無法儲存；請退出雲端模式後使用本機練習。');return fn(...args)};
onAuthStateChanged(auth,user=>{if(!user&&activeCode){info('Firebase 驗證已中斷，請重新按「載入雲端紀錄」。');stopListeners();connect.disabled=false}});
</script></body></html>
