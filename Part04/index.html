譯」及以下題意解析。","reason":"這個句子有動詞（shake）和受詞（it），雖然沒有主詞，但因為是祈使句，所以已經具備所有必要的句子成分，而 - - - - - - - - - - - - - - - - - - - - ready 是修飾性的語句。修飾部分有動詞（have），所以能引導修飾子句的副詞子句連接詞 (A)、(C)、(D) 是可能的答案。因為句意是「準備好新的墨水匣時，搖晃它」，所以表示時間的副詞子句連接詞 (A) When（當……的時候）是正確答案。(C) Unless（除非……）、(D) As if（彷彿……一樣）用在這裡的話，意思會變成「除非準備好新的墨水匣，不然就要搖晃它」、「彷彿準備好新墨水匣一般地搖晃它」，所以不對。連接副詞 (B) Accordingly（因此）不能引導修飾子句。","vocab":"","paraphrase":""},"133":{"type":"名詞詞彙","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"句意是「確保均勻的色彩分布」，所以 (C) distribution（分布）是正確答案。(A) customization 表示「客製化，訂製」。(B) reservation 表示「預約」。(D) explanation 表示「說明，解釋」。","vocab":"","paraphrase":""},"134":{"type":"動詞詞彙 掌握上下文","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"句意是「墨水不會被釋出」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到，使用前必須撕下封住底部的保護膠帶，由此可知如果不撕掉膠帶，墨水就不會出來，所以動詞 release（釋放，釋出）的 p.p. 形 (B) released 是正確答案。(A) detect 表示「發現，偵測到」。(C) restore 表示「恢復」。(D) evaporate 表示「使蒸發」。\n\n135-138 題參照以下網頁。\n\nhttp://www.weissert.com\n\nHOME | ABOUT | ACCOUNT | HELP | CONTACT US\n\nWeissert Antivirus safeguards computers and networks. Since it was launched five years ago, it has become one of the leading forms of protection against viruses and malware. Download a free 135 version today. You'll get full access to our services on any single device for 90 days. At the end of this period, you can easily 136 the service. Simply choose a subscription plan, and enter your payment information. 137 We accept all major credit cards and can also do direct withdrawals. 138 90 days, we won't charge you at all. To start your installation, click here.\n\nWeissert 防毒軟體保護電腦與網路。自從 5 年前上市以來，它已經成為防禦病毒與惡意軟體的領先形式之一。135 今天就下載免費試用版。您會得到 90 天在任何單一設備上完整使用我們服務的權利。136 在這段期間結束時，您可以很容易地延長服務。只要選擇一個訂閱方案，並輸入您的付款資訊。137 我們接受所有主要信用卡，也可直接扣帳。就是這麼簡單。138 未滿 90 天，我們不會向您收取任何費用。要開始安裝，請點擊這裡。","vocab":"","paraphrase":""},"135":{"type":"形容詞詞彙 掌握上下文","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"句意是「今天就下載免費試用版」，(B)、(C)、(D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，會得到 90 天在任何單一設備上完整使用「我們」（Weisser s.\n\nAll you have to do is download Bell Tower Helper from an application store and create a user profile. Then log in, select some titles, and push the \"Order\" button. Having a profile allows you to save your payment details and check the status of your orders. As always, discounts are provided for bulk orders, though they vary depending on the books. Of course, you can still order at www.belltowerpublishing.com if you prefer.\n\n在 Bell Tower 出版社，我們長久以來以種類豐富的科學教科書、合理的價格與一流的顧客服務聞名。直到最近，我們的產品都只能在我們的網站上訂購。但現在向我們購買有更快、更便利的方法：Bell Tower Helper，一款手機與平板的應用程式。\n\n您只需要從應用程式商店下載 Bell Tower Helper 並建立使用者個人檔案。然後登入、選擇書籍，再按下「訂購」按鈕。擁有個人檔案，能讓您保存付款細節，並且查看訂單狀態。如同往常，我們提供大批訂購折扣，但折扣隨著書籍而各有不同。當然，如果您希望的話，仍然可以在 www.belltowerpublishing.com 訂購。","vocab":"a wide selection of phr. 種類豐富的　reasonable adj. 合理的　top-notch adj. 頂尖的，一流的　title n. 一本書　bulk order phr. 大批訂購","paraphrase":""},"153":{"type":"Not/True True 題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Bell Tower Publishing 有關的內容，並且對照選項判斷答案。(A) 在 we have long been known for our wide selection of science textbooks 的部分提到，「我們」（Bell Tower 出版社）長久以來以種類豐富的科學教科書聞名，不符合選項敘述。(B) 在文章裡沒有提到。(C) 在 As always, discounts are provided for bulk orders 的部分提到，如同往常提供大批訂購折扣，不符合選項敘述。(D) 在 Until recently, our products could only be ordered on our Web site. 的部分提到，直到最近，「我們」（Bell Tower 出版社）的產品都只能在網站上訂購，符合選項敘述，所以 (D) 是正確答案。","vocab":"","paraphrase":""},"154":{"type":"推論 細節資訊","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是和題目關鍵詞語 customers of Bell Tower Publishing ~ do if they have a user profile 有關的推論問題。Having a profile allows you to ~ check the status of your orders. 的部分提到，擁有個人檔案就可以查看訂單狀態，由此可以推知，有了使用者個人檔案應該就能查看購買物品的寄送狀態，所以 (A) 是正確答案。","vocab":"find out phr. 發現，查明　purchase n. 購買的物品　chat v. 聊天　earn v. 賺取，獲得","paraphrase":""},"155":{"type":"同義詞","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"topped 所在的語句 Last year's event topped all expectations 之中，topped 表示「超越」的意思，所以同樣能表示「超越」的 (D) 是正確答案。","vocab":"","paraphrase":""},"156":{"type 和 Schaeffer 小姐賣房時可能遇到的困難有關的部分。[3] 的上一句 There is no doubt ~ that these conditions will make it challenging to sell your home. 提到「這樣的情況」（目前房屋買家不多）無疑將使 Schaeffer 小姐賣房變得困難，而下一句 I guarantee that, if you hire me, you will no longer have to worry so much. 則說如果聘請「我」（Dekalb 先生），就不用再如此擔憂了。將句子填入 [3] 的位置之後，可以表達「雖然現在的情況下賣房很困難，但如果得到協助，並非不可能找到買家，只要聘請 Dekalb 先生就可以不用擔心這個問題」，文意通順，所以 (C) 是正確答案。\n\n165-167 題參照以下徵才廣告。\n\nTulsa College Seeks Research Assistant\n\nThe Tulsa College economics department is seeking a knowledgeable research assistant to help gather and analyze income data. The assistant must be willing to dedicate at least 40 hours a week to the job. Normal work hours are from Monday to Friday, from 8 A.M. to 5 P.M. The job will last six months and pays $18 per hour.\n\nJob responsibilities include:\n• Collecting income data from published research studies\n• Creating spreadsheets and infographics based on data\n• Writing reports on the progress of multiple ongoing projects\n\nAll applicants must:\n• Have at least a bachelor's degree in economics\n• Have earned at least a 3.5 GPA during college\n• Demonstrate knowledge of their field during an interview\n\nIf you are interested, please submit a resume and cover letter to the head of Tulsa College's economics department, Dr. William Ling, at w.ling@tulsacollege.edu. Successful applicants will be contacted by e-mail to arrange an interview date. All interviews will take place on-site with members of a hiring committee.\n\nTulsa 大學徵求研究助理\n\nTulsa 大學經濟學系正在徵求知識豐富的研究助理來協助收集並分析所得資料。助理必須願意每週投入至少 40 小時從事這份工作。正常工作時間為週一至週五上午 8 點到下午 5 點。這份工作為期 6 個月，時薪 18 元。\n\n職責包括：\n• 從已發表的研究收集所得資料\n• 依照資料製作試算表與資訊圖表\n• 撰寫多個進行中專案的進度報告\n\n所有應徵者必須：\n• 至少擁有經濟學學士學位\n• 大學期間 GPA 至少得到 3.5 分\n• 在面試時展現對於自身領域的知識\n\n如果您有興趣，請將履歷和推薦信寄到 w.ling@tulsacollege.edu 給 Tulsa 大學經濟系主任 William Ling 博士。符合資格的應徵者將以電子郵件聯絡安排面試日期。所有面試都將在現場與聘任委員會成員一起進行。","vocab":"seek v. 尋找　knowledgeable adj. 知識豐富的，博學的　gather v. 收集　analyze v. 分析　income n. 所得，收入　spreadsheet n. 試算表　infographic n. 資訊圖表　progress n. 進度　ongoing adj. 進行中的　bachelor's degree phr. 學士學位　earn v. 獲得，得到　demonstrate v. 表露，證明　successful applicant phr. 符合資格的申請／應徵者　on-site adv. 在現場　committee n. 委員會","paraphrase":""},"165":{"type":"同義詞","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"dedicate 所在的語句 The assistant must be willing to dedicate at least 40 hours a week to the job. 之中，dedicate 表示「投入」的意思，所以同樣能表示「投入」的 (C) 是正確答案。","vocab":"","paraphrase":""},"166":{"type":"Not/True True 題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是 Not/True 題型，要找出和關鍵詞語 the research assistant job 有關的內容，並且對照選項判斷答案。(A) 在 Normal work hours are from Monday to Friday, from 8 A.M. to 5 P.M. 的部分提到，正常工作時間是週一至週五上午 8 點到下午 5 點，不符合選項敘述。(B) 和 (D) 在文章中沒有提到。(C) 在 The job will last six months 的部分提到，這份工作為期 6 個月，符合選項敘述，所以 (C) 是正確答案。\n\nThe job will last six months 這份工作為期 6 個月 → It will only be a temporary job 它只會是臨時的工作","vocab":"credit n. 學分","paraphrase":""},"167":{"type":"wh-問題 What","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是問什麼（What）是對於工作人選的要求條件的 wh- 問題。和題目的關鍵詞語 a requirement for job candidates 有關的部分是 All interviews will take place on-site with members of a hiring committee. 這部分提到所有面試都將在現場與聘任委員會成員一起進行，所以 (B) 是正確答案。\n\nmembers of a hiring committee 聘任委員會的成員 → a panel 專家小組\n\n168-171 題參照以下通知。\n\nNotice to North Portal Street Residents\n\nRenwah Productions will be filming several scenes for an upcoming episode of QCC's television series Farther Gone on North Portal Street. — [1] —. Filming is set to take place from May 8 to May 12 at the following locations and times:\n\nMonday, May 8, & Tuesday, May 9: Charbonneau Café, 1542 North Portal Street, from 8:30 A.M. until 7:00 P.M.\n\nWednesday, May 10, & Thursday, May 11: Outside of Azalea Apartments, 1294 North Portal Street, from 5:00 A.M. to 3:00 P.M.\n\nFriday, May 12: Get-and-Grab Convenience, 1628 North Portal Street, from 10:00 A.M. to 9:00 P.M.\n\nIn order to accommodate the film crew's vehicles and equipment, \"NO PARKING\" signs will be set up near the filming locations on the relevant dates and times. — [2] —\n\nRenwah Productions has promised to keep traffic disruptions to a minimum. — [3] —. Please note that the first and third filming sites will be closed to the public while filming is under way. Access will be granted to the second location through its rear entrance only. — [4] —\n\nThank you for your understanding and cooperation.\n\n給 North Portal 街居民的通知\n\nRenwah 製作公司將在 North Portal 街為 QCC 的電視影集《Farther Gone》接下來的一集拍攝幾個場面。— [1] —。拍攝預定 5 月 8 日至 5 月 12 日於以下場所與時間進行：\n\n5 月 8 日星期一 & 5 月 9 日星期二：Charbonneau 咖啡廳，North Portal 街 1542 號，上午 8:30 至晚間 7:00\n\n5 月 10 日星期三 & 5 月 11 日星期四：Azalea 公寓外，North Portal 街 1294 號，上午 5:00 至下午 3:00\n\n5 月 12 日星期五：Get-and-Grab 便利商店，North Portal 街 1628 號，上午 10:00 至晚間 9:00\n\n為了提供空間給拍攝團隊的車輛與設備，在相關日期與時間，拍攝場所附近將設置「禁止停車」標誌。— [2] —\n\nRenwah 製作公司承諾將對交通的干擾減到最少。— [3] —。請注意第 1 和第 3 個拍攝地點在拍攝進行時將不開放公眾進入。第 2 個地點將只開放由後門進入。— [4] —\n\n感謝您的理解與配合。","vocab":"production n. 製作公司　film v. 拍攝　scene n. 場面，場景　upcoming adj. 即將到來的　accommodate v. 容納　relevant adj. 相關的　disruption n. 中斷，擾亂　under way phr. 進行中的　grant v. 准予　rear adj. 後方的","paraphrase":""},"168":{"type":"尋找主題／目的 文章的目的","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這一題問的是文章的目的，所以要注意文章開頭的部分。Renwah Productions will be filming several scenes for an ~ episode of ~ television series ~ on North Portal Street. 的部分提到，Renwah 製作公司將在 North Portal 街拍攝一集電視影集的幾個場面，接下來的部分則是詳細說明拍攝場所與時間等細節，所以 (B) 是正確答案。","vocab":"tenant n. 租戶，房客　report v. 舉報，告發　unauthorized adj. 未經許可的","paraphrase":""},"169":{"type":"推論 細節資訊","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是和題目關鍵詞語 Charbonneau Café 有關的推論問題。Tuesday, May 9: Charbonneau Café 的部分顯示，5 月 9 日星期二將在 Charbonneau 咖啡廳進行拍攝，而 In order to accommodate the film crew's vehicles and equipment, \"NO PARKING\" signs will be set up near the filming locations on the relevant dates and times. 的部分提到，為了提供空間給拍攝團隊的車輛與設備，在相關日期與時間，拍攝場所附近將設置「禁止停車」標誌。由此可以推知，5 月 9 日 Charbonneau 咖啡廳附近的停車空間會比平常少，所以 (B) 是正確答案。","vocab":"nearby adj. 附近的　previous adj. 之前的　serve v. 供應","paraphrase":""},"170":{"type":"Not/True True 題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是 Not/True 題型，要找出和關鍵詞語 residents of Azalea Apartments 有關的內容，並且對照選項判斷答案。(A)、(B)、(D) 在文章裡沒有提到。(C) 在 2. ~ Thursday, May 11: Outside of Azalea Apartments 的部分顯示，Azalea 公寓是第 2 個拍攝場所，拍攝日期是 5 月 11 日星期四，而 Access will be granted to the second location through its rear entrance only. 的部分提到第 2 個地點將只開放由後門進入，符合選項敘述，所以 (C) 是正確答案。","vocab":"reminder n. 提醒　pass through phr. 通過","paraphrase":""},"171":{"type":"選擇句子位置","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「不過，某些學校巴士的路線可能稍微調整」，所以應該會出現在和車輛通行有關的部分。[3] 前面的句子 Renwah Productions has promised to keep traffic disruptions to a minimum. 提到，Renwah 製作公司承諾將對交通的干擾減到最少。將句子填入 [3] 的位置之後，可以表達「Renwah 製作公司承諾將對交通的干擾減到最少，但某些學校巴士的路線可能稍微調整」，文意通順，所以 (C) 是正確答案。\n\n172-175 題參照以下訊息對話。\n\nJeff Hervey [10:35 A.M.] Rosanne, are you in the office now? I have a favor to ask.\n\nRosanne Rutherford [10:37 A.M.] Hey. Aren't you supposed to be at the house on Vermont Street replacing roof tiles?\n\nJeff Hervey [10:39 A.M.] That's the problem. I'm here now, and there's more work to do than expected. I must have made a mistake with my measurements last time. I need several people to come and help me.\n\nRosanne Rutherford [10:43 A.M.] I'm not in the office right now, but I can help you. Todd might be available too. The fencing job he was scheduled to do on Grant Street was canceled.\n\nJeff Hervey [10:45 A.M.] That's a relief. Thanks!\n\nJeff Hervey [10:46 A.M.] Todd, do you have time to help out on a roofing job at 62 Vermont Street? I may need you to bring extra tools.\n\nTodd Billings [10:48 A.M.] Hi, Jeff. Yes, I've got the time.\n\nJeff Hervey [10:49 A.M.] Thanks, Todd! Let me know how soon you can get here.\n\nRosanne Rutherford [10:52 A.M.] Jeff, I notified Ms. Richards, and she gave her approval for us to go over there. I'll be leaving shortly.\n\nTodd Billings [10:53 A.M.] OK, Jeff. I can be there in about 45 minutes.\n\nJeff Hervey [上午 10:35] Rosanne，你現在在辦公室嗎？我想請你幫個忙。\n\nRosanne Rutherford [上午 10:37] 嘿。你不是應該在 Vermont 街的房子換屋頂的瓦片嗎？\n\nJeff Hervey [上午 10:39] 那正是問題。我現在在這裡，而要做的工作比預期的多。我上次肯定是測量錯了。我需要幾個人來幫我。\n\nRosanne Rutherford [上午 10:43] 我現在不在辦公室，但我可以幫你。Todd 或許也可以去。他原本預定在 Grant 街做的圍籬施工取消了。\n\nJeff Hervey [上午 10:45] 真是鬆了口氣。謝謝！\n\nJeff Hervey [上午 10:46] Todd，你有時間幫忙 Vermont 街 62 號的屋頂施工嗎？我可能需要你帶額外的工具。\n\nTodd Billings [上午 10:48] 嗨，Jeff。是的，我有時間。\n\nJeff Hervey [上午 10:49] 謝謝，Todd！告訴我你多快可以到這裡。\n\nRosanne Rutherford [上午 10:52] Jeff，我通知了 Richards 小姐，她准許我們去那裡了。我很快就會出發。\n\nTodd Billings [上午 10:53] OK，Jeff。我可以在大約 45 分鐘之後到那裡。","vocab":"","paraphrase":""},"172":{"type":"推論 整體資訊","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是綜合文章各處的線索推測參與對話者所處業界的推論問題。Rosanne Rutherford 在 Aren't you supposed to be at the house on Vermont Street replacing roof tiles? 的部分問 Jeff Hervey「不是應該在 Vermont 街的房子換屋頂的瓦片嗎」，後面又提到 The fencing job he was scheduled to do on Grant Street was canceled，表示「他」（Todd Billings）原本預定在 Grant 街做的圍籬施工取消了，而更換屋頂瓦片和圍籬施工都和建設工程有關，所以 (C) 是正確答案。","vocab":"retail n. 零售（業）　manufacturing n. 製造（業）　landscaping n. 園藝造景","paraphrase":""},"173":{"type":"掌握意圖","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這一題問的是 Hervey 先生的訊息所表達的意圖，所以要掌握引用部分（That's a relief）前後文的情境。Hervey 先生說 I need several people to come and help me，表示需要幾個人來幫他，而 Rosanne Rutherford 回應 I can help you. Todd might be available too，表示自己可以幫忙，Todd 或許也可以去。對此，Hervey 先生回應 That's a relief（真是鬆了口氣），表示自己因為會得到幫助而感到高興，(B) 是正確答案。","vocab":"grateful adj. 感謝的　extend v. 延長，延伸","paraphrase":""},"174":{"type":"wh-問題 How many","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是問將會有多少（How many）人在 Vermont 街工作的 wh- 問題。和題目的關鍵詞語 working at Vermont Street 有關的部分是 Jeff Hervey 所說的 I need several people to come and help me，他提到自己需要幾個人來幫他，而 Rosanne Rutherford 回應 I can help you，表示自己可以幫忙。之後，Jeff Hervey 又問 Todd，do you have time to help out on a roofing job at 62 Vermont Street?，想知道 Todd Billings 是否有時間幫忙 Vermont 街 62 號的屋頂施工，而 Todd Billings 回答 Yes, I've got the time. 表示自己有時間。這些內容可以得知，Jeff Hervey、Rosanne Rutherford、Todd Billings 這 3 個人會在 Vermont 街工作，所以 (C) 是正確答案。","vocab":"","paraphrase":""},"175":{"type":"推論 細節資訊","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是和題目關鍵詞語 Ms. Richards 有關的推論問題。Rosanne Rutherford 在 I notified Ms. Richards, and she gave her approval for us to go over there 的部分提到自己通知了 Richards 小姐，而她准許「我們」（Rosanne Rutherford 和 Todd Billings）去「那裡」（Vermont 街 62 號）了，所以 (D) 是正確答案。","vocab":"supervisor n. 監督者，主管","paraphrase":""},"176":{"type":"尋找主題／目的 文章的目的","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這一題問的是電子郵件（第一篇文章）的目的。在電子郵件中，please do some investigating ~ and let me know when you find a suitable device 的部分要求對方做些調查，並且在找到適合的設備時告知，所以 (C) 是正確答案。","vocab":"inquiry n. 詢問　assign v. 指派","paraphrase":""},"177":{"type":"Not/True Not 題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是 Not/True 題型，要從提到目前投影機的電子郵件（第一篇文章）中找出和關鍵詞語 the current projector 有關的內容，並且對照選項判斷答案。(A) 在 the warranty expired last year 的部分提到保固去年到期了，符合選項敘述。(B) 在 I haven't been very pleased with the current projector ~ 的部分提到，「我」（Herzfeld 小姐）不太滿意目前的投影機，符合選項敘述。(C) 在 I haven't been very pleased with the current projector, so let's get a GelwayCo device this time around. 的部分，因為不太滿意目前的投影機，所以提議這次改買 GelwayCo 公司的設備，顯示目前的投影機並不是 GelwayCo 公司製造，不符合選項敘述，所以 (C) 是正確答案。(D) 在 the projector in the second-floor conference room isn't working properly 的部分提到，2 樓會議室裡的投影機故障了，符合選項敘述。\n\nthe warranty expired 保固到期了 → no longer covered under warranty 不再受到保固保障","vocab":"","paraphrase":""},"178":{"type":"推論 細節資訊","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是要找出和題目關鍵詞語 Ms. Herzfeld 相關內容的推論問題，所以要看 Herzfeld 小姐所寫的電子郵件（第一篇文章）。please do ~ investigating together with the other interns and let me know when you find a suitable device 的部分，要求收件者 Jake Boyne 和其他實習生一起做些調查，並且在找到適合的設備時告知，由此可以推知她會從實習生 Jake Boyne 那邊得知一項設備的選擇，所以 (D) 是正確答案。","vocab":"approve v. 批准　office supply phr. 辦公用品","paraphrase":""},"179":{"type":"wh-問題 多篇文章對照題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 the purchasing department not buy the DR-8，要問採購部為什麼（Why）不會買 DR-8，所以先看出現 DR-8 的廣告（第二篇文章）。\n線索1：廣告（第二篇文章）中，DR-8、Cost、$650 顯示 DR-8 的價格是 650 元，但看不出不購買的理由，所以還需要參考電子郵件的內容。\n線索2：電子郵件（第一篇文章）中，The maximum amount we can spend on this item is $600. 的部分提到能在這件物品上的最高金額是 600 元。\n綜合這兩個線索，可知要價 650 元的 DR-8 超過了採購投影機的預算 600 元，所以 (B) 是正確答案。\n\nThe maximum amount ~ can spend 可以花費的最高預算 → an available budget 可用的預算","vocab":"unsatisfactory adj. 不令人滿意的　exceed v. 超過，超出","paraphrase":""},"180":{"type":"Not/True True 題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是 Not/True 題型，要找出和關鍵詞語 GelwayCo 有關的內容，所以要看介紹 GelwayCo 公司產品與服務的廣告（第二篇文章）。(A) 和 (C) 在文章中沒有提到。(B) 在 Support is available ~ in person at any of our stores nationwide 的部分提到，在全國各地店面提供現場協助，符合選項敘述，所以 (B) 是正確答案。(D) 在 A GelwayCo projector may be just what your office needs! 的部分提到，GelwayCo 公司的投影機可能就是您的辦公室所需要的，而沒有提到是否製造家用設備，不符合選項敘述。","vocab":"office equipment phr. 辦公設備　hotline n. 熱線，電話專線","paraphrase":""},"181":{"type":"wh-問題 What","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是問 9 月 23 日發生了什麼（What）的 wh- 問題，所以要從題目的關鍵詞語 September 23 出現的第一篇文章找出相關的內容。第一篇文章中的 Concord Food & Drink Convention on September 23 提到 9 月 23 日的康科德食品飲料大會，所以 (C) 是正確答案。\n\nFood & Drink Convention 食品飲料大會 → An industry event 業界活動","vocab":"industry n. 業界　investor n. 投資者","paraphrase":""},"182":{"type":"wh-問題 Why","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是問根據文章（第一篇），康科德的咖啡廳為什麼（Why）要推出更多季節性飲料的 wh- 問題。文章中的 a group of café owners announced plans to add more seasonal drinks to their menus ~. They believe that, by doing so, they can turn Concord into a destination for coffee enthusiasts from neighboring areas. 提到，一群咖啡廳店主宣布了在菜單上增加更多季節性飲料，而他們認為藉由這樣的做法，可以將康科德變成鄰近地區咖啡愛好者的目的地，所以 (A) 是正確答案。\n\ncoffee enthusiasts from neighboring areas 來自鄰近地區的咖啡愛好者 → patrons from other places 來自其他地區的顧客","vocab":"patron n. 顧客，老主顧　make use of phr. 利用……　ingredient n. 材料　take advantage of phr. 利用（機會等）　nationwide adj. 全國性的","paraphrase":""},"183":{"type":"Not/True True 題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Chill's Coconut Java 有關的內容，所以要找提到 Coconut Java 的第一篇文章。(A)、(B)、(C) 在文章中沒有提到。(D) 從 September 30 edition 可以看出這是 9 月 30 日發行的內容，而 the coffee shop Chill will bring back its ~ Coconut Java, which debuted last March and was served until June 的部分提到 Chill 咖啡廳將重新推出 Coconut Java，以及它在今年 3 月登場、供應到 6 月為止，符合選項敘述，所以 (D) 是正確答案。\n\ndebuted ~ March and was served until June 在 3 月登場、供應到 6 月為止 → was offered for a limited time 曾經在限定期間供應","vocab":"a range of phr. 多種的　limited adj. （時間或數量）限定的","paraphrase":""},"184":{"type":"推論 多篇文章對照題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Ms. Lee 所寫的電子郵件。\n線索1：電子郵件（第二篇文章）中，I was excited to see that my coffee shop, Creative Cups, was mentioned in an article ~ This week, a few customers have already asked when we will start selling our new flavor. 的部分提到，看到自己的咖啡廳 Creative Cups 在文章中被提及，感到很興奮，而且這禮拜有些顧客已經詢問什麼時候會販售新口味，但沒有寫出新口味的名稱，所以還需要參考時事通訊文章的內容。\n線索2：時事通訊文章（第一篇文章）中，This year, they plan to introduce the Santa Latte. 的部分提到「他們」（Creative Cups）今年打算推出 Santa Latte。\n綜合這兩個線索，可知一些顧客向 Lee 小姐的咖啡廳 Creative Cups 詢問什麼時候會販賣的咖啡口味，名稱是 Santa Latte，所以 (C) 是正確答案。","vocab":"","paraphrase":""},"185":{"type":"wh-問題 What","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是問 Lee 小姐要求廣告部做什麼（What）的 wh- 問題，所以要看她所寫的電子郵件（第二篇文章）。電子郵件中的 As soon as you confirm that this is the correct amount, I will submit my payment. 提到，只要對方確認這（在網站上看到的定價 200 元）是正確的金額，自己就會付款，所以 (B) 是正確答案。","vocab":"subscriber n. 訂閱者　rate n. 費率，費用　print in color phr. 印成彩色","paraphrase":""},"186":{"type":"推論 整體資訊","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是綜合文章各處的線索推測公告對象的問題。公告中的 Are you a recent graduate with a bachelor's or master's degree? 問讀者「您是剛畢業的學士或碩士嗎」，接著就說明就業博覽會的內容，由此可知公告的對象是最近畢業的學生，(C) 是正確答案。","vocab":"faculty member phr. 教職員　executive n. 高層主管","paraphrase":""},"187":{"type":"wh-問題 What","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是問根據列表（第二篇文章），什麼（What）是在 Verity Care 公司工作的一項資格條件的 wh- 問題。列表中的 Verity Care、Seeking individuals qualified to work with children 顯示，Verity Care 公司在尋找有資格從事應對小孩工作的人，所以 (D) 是正確答案。\n\nqualified to work with children 有資格從事應對小孩的工作 → An ability to interact with children 和兒童互動的能力","vocab":"interact with phr. 和……互動","paraphrase":""},"188":{"type":"Not/True 多篇文章對照題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是需要對照兩篇文章內容的題目。這是 Not/True 題型，要找出和關鍵詞語 Brentura Diagnostics 有關的內容，並且對照選項判斷答案，所以先看出現 Brentura Diagnostics 的清單（第二篇文章）。\n線索1：清單（第二篇文章）中，Brentura Diagnostics、Seeking laboratory consultants with a master's degree in chemistry or biology, *prefer graduates from local universities 的部分顯示，Brentura Diagnostics 公司正在尋找有化學或生物學碩士學位的實驗室顧問，而且偏好當地大學的畢業生，但沒有提到那是什麼地方，所以還需要參考公告（第一篇文章）的內容。\n線索2：公告（第一篇文章）中，the City of Tampa has provided funding for the event 的部分提到坦帕市為活動提供了資金。\n綜合這兩個線索，可知 Brentura Diagnostics 公司希望找到坦帕市當地大學的化學或生物學碩士畢業生，所以 (B) 是正確答案。(A)、(C)、(D) 在文章中沒有提到。\n\na master's degree 碩士學位 → advanced degrees 高等學位","vocab":"advanced degree phr. （碩士、博士等的）高等學位","paraphrase":""},"189":{"type":"推論 多篇文章對照題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Ms. Bae 所寫的電子郵件。\n線索1：電子郵件（第三篇文章）中，Our plan is to hire several people as quickly as possible. Therefore, we will be screening applicants at the event. I would also like to conduct interviews on the same day. 的部分提到，「我們」（Bae 小姐的公司）的計畫是盡快雇用幾個人，所以將在活動上篩選應徵者，而且也想在同一天進行面試，由此可知 Bae 小姐正在為她的部門招募人員。\n線索2：清單（第二篇文章）中，Heston、Telecommunications、Seeking marketing graduates to fill various open positions、Eun-jung Bae 的部分顯示，Heston 公司正在尋找行銷科系畢業生來填補各種職缺，而公司代表是 Eun-jung Bae。\n綜合這兩個線索，可知 Bae 小姐是 Heston 公司的人事經理，正在為公司招募行銷科系畢業生，所以 (A) 是正確答案。(B)、(C)、(D) 在文章中沒有提到，或與文章內容不符（例如 Bae 小姐希望新加坡和日本的同事以虛擬方式參加面試，而不是她本人在現場面試所有行銷科系畢業生）。","vocab":"","paraphrase":""},"190":{"type":"推論 多篇文章對照題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Ms. Bae's company 所寫的電子郵件。\n線索1：電子郵件（第三篇文章）中，I'd like my colleagues in Singapore and Japan to participate in the process virtually. 的部分提到，Bae 小姐希望新加坡和日本的同事透過視訊（虛擬）方式參加這個過程，由此可知她的公司在新加坡和日本都有同事。\n線索2：清單（第二篇文章）中，Heston、Telecommunications、Seeking marketing graduates to fill various open positions、Eun-jung Bae 的部分顯示，Bae 小姐是 Heston 公司的代表。\n綜合這兩個線索，可知 Bae 小姐的公司（Heston）在新加坡和日本都有同事，也就是有多個海外辦公室，所以 (A) 是正確答案。(B) 在文章中沒有提到（清單提到的是 paid internship positions，即支薪實習職位）。(C) 在電子郵件中，Bae 小姐只詢問是否可能租用一間小會議室，而不是幾間。(D) 在電子郵件中，Bae 小姐詢問的是有 Wi-Fi 的小會議室，而不是要求攤位有網路連線。\n\n191-195 題參照以下文章、備忘錄與電子郵件。\n\nDowing Air Continues to Adapt\nBy Aaron Sheffield\n\nFor any given flight, it is almost guaranteed that some passengers with reservations will not show up. Unsurprisingly, most airlines attempt to fill the empty seats by overbooking. This method is not without controversy, however, as it occasionally results in more passengers than seats and some ticket holders having to make alternative travel arrangements.\n\nTo ease some of the stress faced by passengers who are forced to miss a flight, the international airline Dowing Air has recently changed its overbooking policy. Some affected passengers in economy class will be offered a business class seat on the next flight. If all else fails, Dowing Air will also offer some ticket holders up to $1,000 in compensation. \"We are confident that these measures will help us improve our customer satisfaction rate,\" said Dowing Air CEO Valery Suarez.\n\nDowing 航空公司持續調整\nAaron Sheffield 撰稿\n\n任何特定航班，幾乎都一定會有些預約乘客不出現。不意外地，大部分航空公司試圖藉由超額預訂（超賣）來填滿空位。不過，這個方法並非沒有爭議，因為偶爾會造成乘客比座位多，而一些有票的人必須做替代的旅行安排。\n\n為了減輕被迫錯過航班的旅客所面臨的壓力，國際航空公司 Dowing 航空最近改變了超額預訂政策。經濟艙某些受影響的乘客將得到下個航班的商務艙座位。如果其他所有方法都行不通，Dowing 航空也將提供某些持有機票者最高 1,000 元的補償。Dowing 航空執行長 Valery Suarez 表示：「我們相信這些措施將有助於我們改善顧客滿意度」。\n\nTo: All Dowing Air passenger service agents\nFrom: Dowing Air administration\nSubject: Overbooking policy reminders\nDate: November 5\n\nI'm sure you've all been briefed on the new policy by now, but here are some reminders just in case:\n\nIf a flight has been overbooked, offer SkySaver coupons to passengers who volunteer to take a later flight. They can use these to get reduced fares when booking future Dowing Air flights.\n\nIf the flight remains overbooked within 30 minutes of the departure time, offer passengers a business class seat on the next available flight and access to our VIP lounge while they wait.\n\nIf the issue has still not been resolved by the time that passengers are about to start boarding, you may offer the maximum compensation amount available for that flight.\n\n收件者：Dowing 航空公司所有乘客服務人員\n寄件者：Dowing 航空公司管理階層\n主旨：超額預訂政策提醒\n日期：11 月 5 日\n\n我相信你們現在都已經聽過關於新政策的簡報，但為防萬一，這裡有一些提醒：\n\n如果航班被超額預訂，提供 SkySaver 優惠券給自願搭乘較晚航班的乘客。他們可以在預訂未來 Dowing 航空航班時使用這些優惠券來獲得折扣票價。\n\n如果在離出發時間不到 30 分鐘時，航班仍然處於超額預訂狀態，就提供乘客下一個可利用航班的商務艙座位，以及等待時使用我們 VIP 休息室的權利。\n\n如果在乘客即將開始登機時，問題仍然沒有解決，可以提供當次航班可用的最高補償金額。\n\nTo: Joan Kreeger joan_kreeger@wentleco.com\nFrom: Lewis Hopps lew_hopps@wentleco.com\nSubject: Mr. Hunt's flight\nDate: November 10\nAttachment: Cost estimates\n\nHi, Joan,\n\nI just received a message from Mr. Hunt. He said the meeting he had yesterday with the Vorin Construction representative went well. He's at the airport in Roystonville now and said he'll arrive about an hour late. His 1:10 P.M. flight is overbooked, but Dowing Air has secured him a business class seat on a plane that'll be leaving at 2:05 PM. That'll give you more time to get to the airport. You can leave the office to pick him up at about 5:00 PM. Until then, please check the accuracy of the file I'm sending you.\n\nBest regards,\nLewis\n\n收件者：Joan Kreeger joan_kreeger@wentleco.com\n寄件者：Lewis Hopps lew_hopps@wentleco.com\n主旨：Hunt 先生的航班\n日期：11 月 10 日\n附件：費用估價\n\n嗨，Joan：\n\n我剛收到 Hunt 先生的訊息。他說昨天和 Vorin 建設公司的代表開會很順利。他現在在 Roystonville 的機場，且他會晚大約 1 小時到。他下午 1:10 的航班被超訂了，但 Dowing 航空公司幫他取得了下午 2:05 出發的航班上的商務艙座位。這樣你就有比較多時間去機場了。你可以在下午大約 5:00 的時候從辦公室出發去接他。在那之前，請檢查我寄給你的檔案的正確性。\n\nLewis\n文章1：adapt v. 適應，調整　given adj. 特定的　guaranteed adj. 必定的，肯定的　show up phr. 出現，現身　unsurprisingly adv. 不令人意外地　overbook v. 超額預訂　controversy n. 爭議　occasionally adv. 偶爾　alternative e about to start boarding 在乘客即將開始登機時","vocab":"sum n. 總額，金額　entry n. 進入（的權利）　extra adj. 額外的","paraphrase":""},"194":{"type":"推論 多篇文章對照題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Mr. Hunt 出現的電子郵件。\n線索1：電子郵件（第三篇文章）中的 His 1:10 P.M. flight is overbooked, but Dowing Air has secured him a business class seat on a plane that'll be leaving at 2:05 P.M. 提到，「他」（Hunt 先生）下午 1:10 的航班被超訂了，但 Dowing 航空公司幫他取得了下午 2:05 出發的航班上的商務艙座位，由此可知 Hunt 先生放棄了被超訂的航班。不過，這裡沒有提到除了獲得另一個航班的商務艙座位以外，還有什麼補償，所以還需要參考備忘錄中的相關內容。\n線索2：備忘錄（第二篇文章）中的 If the flight remains overbooked within 30 minutes of the departure time, offer passengers a business class seat on the next available flight and access to our VIP lounge while they wait. 提到，如果在離出發時間不到 30 分鐘時，航班仍然處於超額預訂狀態，就提供乘客下一個可利用航班的商務艙座位，以及等待時使用 VIP 休息室的權利。\n綜合這兩個線索，可知 Hunt 先生放棄了被超訂的航班，而獲得了下個航班的商務艙座位，以及使用 VIP 休息室的權利作為補償，所以 (D) 是正確答案。","vocab":"directly adv. 直接　reach an agreement phr. 達成協議　exclusive adj. 獨佔的，專用的","paraphrase":""},"195":{"type":"wh-問題 What","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是問 Hopps 先生要求 Kreeger 小姐做什麼（What）的 wh- 問題，所以要看 Hopps 先生寄給 Kreeger 小姐的電子郵件（第三篇文章）中的內容。電子郵件中的 please check the accuracy of the file I'm sending you 要求檢查所寄的檔案的正確性，所以 (A) 是正確答案。\n\ncheck the accuracy of the file 檢查檔案的正確性 → Ensure that a file is correct 確認檔案正確","vocab":"ensure v. 確認，確保　forward v. 轉寄　itinerary n. 旅行行程","paraphrase":""},"196":{"type":"尋找主題／目的 寫文章的理由","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這一題問的是 Walker 小姐聯絡 Fraser 醫師的理由，所以要看 Walker 小姐寄給 Fraser 醫師的電子郵件（第一篇文章）。在電子郵件中，I'd like to invite you to talk about your work ~ on the second day of the gathering 想邀請「您」（Fraser 醫師）在會議第二天談談自己的研究，所以 (C) 是正確答案。","vocab":"critique v. 評論，批評","paraphrase":""},"197":{"type":"推論 多篇文章對照題型","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是需要對照兩篇文章內容的推論題型，先看提到題目的關鍵詞語 the panel discussion on scanning technology 的公告。\n線索1：公告（第二篇文章）中，Panel Discussion、Scanning Technology、Dr. Hannah Brown、Dr. Bennet Fraser、Dr. Ellie Williams 的部分顯示，關於 <script>
/* Browser-offline fallback: Firebase is optional, local practice always works. */
(function(){
  if(window.toeicCloud) return;
  function persist(){
    localStorage.setItem(LOCAL_KEY,JSON.stringify(records));
    localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));
    localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts));
  }
  window.toeicCloud={ready:true,mode:'local',
    saveAnswer:async(id,data)=>{records[id]=data;persist();render()},
    deleteAnswer:async(id)=>{delete records[id];persist();render()},
    setStar:async(id,marked)=>{if(marked)stars[id]=true;else delete stars[id];persist();render()},
    saveExcerpts:async(id,items)=>{if(items.length)excerpts[id]=items;else delete excerpts[id];persist();render()},
    importAnswers:async(items)=>{records={...records,...items};persist();render()},
    resetAnswers:async()=>{records={};persist();render()}
  };
})();
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:'AIzaSyAA3gxE4CLmVsH3LXjzl4J0O-QhcN14laI',authDomain:'database-89162.firebaseapp.com',projectId:'database-89162',storageBucket:'database-89162.firebasestorage.app',messagingSenderId:'60538861815',appId:'1:60538861815:web:92aa03a61146f491cafbf2',measurementId:'G-JMEN6QNVQ8'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const allowed=['1000','0520','0608','0621','0000','1014'];
const input=document.getElementById('accountCode'),connect=document.getElementById('connectCode'),leave=document.getElementById('leaveCode'),notice=document.getElementById('cloudNotice');
let activeCode='',unsub=[],remoteAnswers={},remoteStars={},remoteExcerpts={},loadedA=false,loadedS=false,loadedE=false,generation=0;
const cloud={ready:false,mode:'local'};window.toeicCloud=cloud;
function info(msg){notice.textContent=msg}
function stopListeners(){generation++;unsub.forEach(fn=>fn());unsub=[];loadedA=false;loadedS=false;loadedE=false;remoteAnswers={};remoteStars={};remoteExcerpts={};cloud.ready=false}
function localSave(){localStorage.setItem(LOCAL_KEY,JSON.stringify(records));localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts))}
function root(type){if(!activeCode||!cloud.ready)throw Error('雲端資料尚未載入');return collection(db,'practiceCodes',activeCode,'test04_'+type)}
function sync(){if(!activeCode||!loadedA||!loadedS||!loadedE)return;cloud.ready=true;cloud.mode='cloud';window.toeicApplyRemote?.({...remoteAnswers},{...remoteStars},{...remoteExcerpts});info('第四回雲端模式：'+activeCode+'，第四回的作答、星號與筆記已載入。');connect.disabled=false;leave.hidden=false}
cloud.saveExcerpts=async(id,items)=>{if(!activeCode){if(items.length)excerpts[id]=items;else delete excerpts[id];localSave();render();return}const ref=doc(root('highlights'),String(id));if(items.length)await setDoc(ref,{items});else await deleteDoc(ref)};
cloud.deleteAnswer=async(id)=>{
  if(!activeCode){delete records[id];localSave();render();return}
  await deleteDoc(doc(root('answers'),String(id)));
};
cloud.saveAnswer=async(id,data)=>{if(!activeCode){records[id]=data;localSave();render();return}await setDoc(doc(root('answers'),String(id)),data)};
cloud.setStar=async(id,marked)=>{if(!activeCode){if(marked)stars[id]=true;else delete stars[id];localSave();render();return}const ref=doc(root('stars'),String(id));if(marked)await setDoc(ref,{marked:true});else await deleteDoc(ref)};
cloud.importAnswers=async(items)=>{if(!activeCode){records={...records,...items};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const entries=Object.entries(items);for(let i=0;i<entries.length;i+=400){const batch=writeBatch(db);for(const [id,data] of entries.slice(i,i+400))batch.set(doc(root('answers'),id),data);await batch.commit()}};
cloud.resetAnswers=async()=>{if(!activeCode){records={};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const ids=Object.keys(remoteAnswers);for(let i=0;i<ids.length;i+=400){const batch=writeBatch(db);ids.slice(i,i+400).forEach(id=>batch.delete(doc(root('answers'),id)));await batch.commit()}};
function goLocal(){stopListeners();activeCode='';cloud.mode='local';input.value='';input.disabled=false;connect.disabled=false;leave.hidden=true;window.toeicClearRemote?.();info('本機模式：未連線雲端，作答只保存在此瀏覽器。')}
leave.addEventListener('click',goLocal);
connect.addEventListener('click',async()=>{const code=input.value.trim();if(!allowed.includes(code)){info('代號無效。請輸入管理員提供的 4 位代號。');return}if(activeCode===code&&cloud.ready)return;stopListeners();activeCode=code;cloud.mode='loading';cloud.ready=false;window.toeicApplyRemote?.({},{});connect.disabled=true;leave.hidden=false;info('正在載入雲端歷史紀錄，請不要作答…');let token=generation;
try{if(!auth.currentUser)await signInAnonymously(auth);if(token!==generation)return;
const a=onSnapshot(collection(db,'practiceCodes',code,'test04_answers'),snap=>{if(token!==generation)return;remoteAnswers={};snap.forEach(d=>{if(/^\d+$/.test(d.id))remoteAnswers[d.id]=d.data()});loadedA=true;sync()},err=>{if(token===generation){info('讀取雲端失敗：'+err.message+'。請檢查匿名驗證與 Firestore 規則。');connect.disabled=false}});
unsub.push(a);
const b=onSnapshot(collection(db,'practiceCodes',code,'test04_stars'),snap=>{if(token!==generation)return;remoteStars={};snap.forEach(d=>{if(/^\d+$/.test(d.id)&&d.data().marked)remoteStars[d.id]=true});loadedS=true;sync()},err=>{if(token===generation){info('讀取星號失敗：'+err.message);connect.disabled=false}});unsub.push(b);
const c=onSnapshot(collection(db,'practiceCodes',code,'test04_highlights'),snap=>{if(token!==generation)return;remoteExcerpts={};snap.forEach(d=>{const items=d.data().items;if(/^\d+$/.test(d.id)&&Array.isArray(items))remoteExcerpts[d.id]=items.filter(x=>typeof x==='string')});loadedE=true;sync()},err=>{if(token===generation){info('讀取文字摘錄失敗：'+err.message+'。請更新 Firestore 規則。');connect.disabled=false}});unsub.push(c);
}catch(err){if(token===generation){info('Firebase 連線失敗：'+err.message);connect.disabled=false}}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();connect.click()}});
// 在雲端讀取期間禁用作答；已離線作答不會自動上傳。
const originalSave=cloud.saveAnswer,originalStar=cloud.setStar,originalImport=cloud.importAnswers,originalReset=cloud.resetAnswers;
for(const [name,fn] of [['saveAnswer',originalSave],['deleteAnswer',cloud.deleteAnswer],['setStar',originalStar],['importAnswers',originalImport],['resetAnswers',originalReset],['saveExcerpts',cloud.saveExcerpts]])cloud[name]=async(...args)=>{if(cloud.mode==='loading'||activeCode&&!cloud.ready)throw Error('雲端正在載入或連線異常，無法儲存；請退出雲端模式後使用本機練習。');return fn(...args)};
onAuthStateChanged(auth,user=>{if(!user&&activeCode){info('Firebase 驗證已中斷，請重新按「載入雲端紀錄」。');stopListeners();connect.disabled=false}});
</script></body></html>
