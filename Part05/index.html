 like the brakes shipped to me after I've moved, but I don't understand why I have to pay for shipping as the product was defective. Please let me know if there are any other options and how you wish to proceed.</p>\n<p>Erik Mercado</p>\n</div></section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>DOCUMENT 2 / 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO</span><span class=\"mail-value\">Erik Mercado erikmerc@coolmail.com</span></div><div><span class=\"mail-key\">FROM</span><span class=\"mail-value\">Jade Estrada jadee@framecaster.com</span></div><div><span class=\"mail-key\">SUBJECT</span><span class=\"mail-value\">Re: My purchase</span></div><div><span class=\"mail-key\">DATE</span><span class=\"mail-value\">April 29</span></div><div><span class=\"mail-key\">ATTACHMENT</span><span class=\"mail-value\">FrameCaster.v45-b</span></div></div><p>Dear Mr. Mercado,</p>\n<p>I am sorry to hear about the problem with your recent purchase of a Spin Genie 400. I have looked into the issue and discovered that our representative gave you incorrect information. We do not charge customers for shipping replacement parts on account of a product defect. We had such a fee last year, but our policies have changed since then, so the parts can be sent to you free of charge. I have informed our representative of the miscommunication, and she will undergo additional training so that this type of situation doesn't happen again.</p>\n<p>Please provide your new address, and I'll have the items sent right away. In addition, to make up for any inconvenience, I am attaching a voucher for $20 that you may use on a future purchase of any FrameCaster accessory.</p>\n<p>Thank you for your patience.</p>\n<p>Sincerely yours,</p>\n<p>Jade Estrada\nCustomer Service Chief\nFrameCaster Cycles</p>\n</div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 186-190 · 3 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>INTERNAL MEMO</span><small>DOCUMENT 1 / 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">From</span><span class=\"mail-value\">Dillon Zhou</span></div><div><span class=\"mail-key\">To</span><span class=\"mail-value\">All Staff</span></div><div><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Office visit</span></div><div><span class=\"mail-key\">Date</span><span class=\"mail-value\">February 20</span></div></div><p>A writer from The Sydney Sun is scheduled to visit our new office on March 1. She is writing a short article about our office design and employee benefits. No photographs will be taken as we have already sent some images for the piece. As the reporter is directed through our halls, feel free to interact with her at your discretion. One of our senior executives will briefly introduce our latest software development plan to her. The reporter is welcome to use all the leisure and entertainment facilities.</p>\n</div></section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>DOCUMENT 2 / 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">From</span><span class=\"mail-value\">Sela Singh s.singh@thesydneysun.au</span></div><div><span class=\"mail-key\">To</span><span class=\"mail-value\">Dillon Zhou d.zhou@zazoosoftware.com</span></div><div><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Article</span></div><div><span class=\"mail-key\">Date</span><span class=\"mail-value\">February 27</span></div></div><p>Dear Mr. Zhou,</p>\n<p>I apologize for the short notice, but I will not be able to return to Sydney on March 1 due to a travel emergency. If I can visit on another date, please contact my assistant, Dennis Worley, at d.worley@thesydneysun.au, and he will handle all the details. If not, please send a basic description of your new facilities in your reply to this e-mail.</p>\n<p>Also, some of the photos you have sent are not very clear. Could you send me larger copies of each? That would be very helpful.</p>\n<p>Thank you.</p>\n<p>Sincerely,</p>\n<p>Sela Singh\nThe Sydney Sun</p>\n</div></section><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE / NEWS</span><small>DOCUMENT 3 / 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Easing Office Stress at Zazoo</h2><p class=\"doc-byline\">\nMarch 8\nby Sela Singh</p>\n<p>The computer giant Zazoo Software recently opened its newest office in Sydney and has attracted much speculation about the benefits it provides employees. Known for providing a nurturing work environment, Zazoo Software has plenty of places to relax in its new office building. I was able to see these for myself on March 4, when I was given a tour of the facilities. Free food is available for employees in every cafeteria, and there are plenty of healthy options.</p>\n<p>In terms of exercise facilities, there is a basketball court, pool, and gym. In addition, plans call for the addition of a yoga and meditation studio by the end of the year. All these facilities help employees perform at high levels of efficiency, and I could see that this was true during my time at the office.</p>\n<p>\"We are currently in the final phase of designing our new software program,\" Cathy Sanchez said while showing me the plan for the project. \"Everyone is working under immense pressure, but our environment should help ease that stress and make things more fun.\"</p>\n</div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 191-195 · 3 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>INTERNAL MEMO</span><small>DOCUMENT 1 / 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>From the desk of Rosa Mengistu</strong></h2>\n<p>Hello, Mr. Fekade. I'm sorry you were unable to attend today's planning meeting. One thing we decided was that we require a photo of Dire Dawa Central Park. The photo needs to show people relaxing near the fountain during the daytime. It is up to you to find such an image, and keep in mind that it needs to be in high resolution. Please check our photo archive, as we may already have one that meets this description. Otherwise, you can search the collection of a photo agency such as Flash Photos or Baumgard Pics. If all else fails, you have the option of hiring a freelance photographer.</p>\n</div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / DOCUMENT</span><small>DOCUMENT 2 / 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Baumgard Pics</strong> ★ Your source for photos from around the world</h2>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>Customer:</strong></th>\n<th style=\"text-align:left\"><strong>Dawit Fekade</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Image Details:</td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Image Name:</td>\n<td style=\"text-align:left\">Crowd Watching Musical Performance</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Category:</td>\n<td style=\"text-align:left\">Outdoor activities</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Location:</td>\n<td style=\"text-align:left\">Fountain at Dire Dawa Central Park</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Image Code:</td>\n<td style=\"text-align:left\">HEWZYXP</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">File Size:</td>\n<td style=\"text-align:left\">20 megabytes</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Taken By:</td>\n<td style=\"text-align:left\">Delores Ashburn</td>\n</tr>\n</tbody>\n</table></div>\n<p>Our pricing is according to image size:\n□ Small $3.99 (500x449)\n□ Medium $4.99 (1000x899)\n□ Large $5.99 (2000x1798)\n□ Extra Large $6.99 (3172x2851)</p>\n<p>Buy Image Now!</p>\n</div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / DOCUMENT</span><small>DOCUMENT 3 / 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Thank you for choosing Baumgard Pics!</h2>\n<p>770 Hickory Street\nOmaha, Nebraska, US 68124\n(402) 555-2882\n<a href=\"http://baumgardpics.org/\" rel=\"noopener noreferrer\" target=\"_blank\">http://baumgardpics.org</a></p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>Image Code</strong></th>\n<th style=\"text-align:left\"><strong>Billing address</strong></th>\n<th style=\"text-align:left\"><strong>Amount paid</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">HEWZYXP</td>\n<td style=\"text-align:left\">Dawit Fekade, Aksum Services, 4 Adwa Street, Addis Ababa, Ethiopia</td>\n<td style=\"text-align:left\">Cost of photo $5.99, Taxes $0.59, Total $6.58</td>\n</tr>\n</tbody>\n</table></div>\n<p>To download your bill, log in at Baumgard Pics' Web site and click on the 'Purchase History' tab. Select the bills you would like to save, then click on the Download button.</p>\n<p>You may use your current order starting on June 25. Please be aware that your right to use the photo expires after five years. Should you wish to extend your period of usage, you may do so at our Web site.</p>\n</div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 196-200 · 3 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>OFFICIAL NOTICE</span><small>DOCUMENT 1 / 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Blue Ravine Medical School (BRMS) ANNOUNCEMENT: All students and faculty</strong></h2>\n<p>Please note that Dr. Janice Shen, from Kowloon University of Eastern Medicine (KUEM), will be presenting a lecture on September 4. Dr. Shen will describe successful treatments for spinal conditions. She is an expert in needle therapy and herbal medication, and she primarily treats back pain and spinal disease. For the past 12 years, she has been employed by KUEM, where she leads many different research projects.</p>\n<p>Her lecture will take place on the BRMS campus in the Fasthead Auditorium at 3 P.M. Seats are limited, so please make a booking by visiting the school events office, dialing extension #364, or sending an e-mail to Jayne Marche in the events office at jaynemarche@brms.edu. The lecture is free for all instructional staff and students at BRMS, but guests must pay $16.</p>\n</div></section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>DOCUMENT 2 / 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO</span><span class=\"mail-value\">Jayne Marche jaynemarche@brms.edu</span></div><div><span class=\"mail-key\">FROM</span><span class=\"mail-value\">Grayden Higgins graydenhiggins@brms.edu</span></div><div><span class=\"mail-key\">SUBJECT</span><span class=\"mail-value\">Request</span></div><div><span class=\"mail-key\">DATE</span><span class=\"mail-value\">August 19</span></div></div><p>Hello, Jayne.</p>\n<p>I'm teaching an advanced course in alternative medicine here at BRMS, and nine students are currently enrolled. I'd like to make a reservation for all ten of us to attend Dr. Shen's upcoming lecture. Let me know if you require all the students' names or if the seats can be booked under my name.</p>\n<p>Also, I was wondering if anyone will be making a video of the lecture. I would like to possibly share her talk with future students. Unfortunately, no one thought to record her previous visit, and I hope that will not be the case this time.</p>\n<p>Thanks, and I hope to hear from you soon.</p>\n<p>Dr. Grayden Higgins\nBRMS, Department of Skeletal and Muscular Disorders</p>\n</div></section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>DOCUMENT 3 / 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO</span><span class=\"mail-value\">Angelo Conti angeloconti@brms.edu</span></div><div><span class=\"mail-key\">FROM</span><span class=\"mail-value\">Jayne Marche jaynemarche@brms.edu</span></div><div><span class=\"mail-key\">SUBJECT</span><span class=\"mail-value\">Lecture event assignment</span></div><div><span class=\"mail-key\">DATE</span><span class=\"mail-value\">August 20</span></div></div><p>Hi, Angelo.</p>\n<p>A BRMS instructor has requested that a video be recorded of the lecture taking place on September 4. Please add this filming assignment to your schedule. Based on Dr. Shen's previous presentation, I'm guessing the lecture will last for about an hour and a half, and it will be followed by a question-and-answer session that should take 30 minutes. I think we should film the latter as well, so the video's total time should be about two hours.</p>\n<p>Try to finish editing the footage within three days and send me the video file. I will post it on the BRMS Web site, have it added to our multimedia library's collection, and forward it to the instructor who requested it. I'll make sure the auditorium is open an hour in advance so that you have time to set up.</p>\n<p>Thanks!\nJayne</p>\n</div></section></div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 131-134 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">部長們</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Ronaldo Reyes</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">明年的預算</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">5 月 15 日</span></div></div>\n<h2 class=\"doc-heading\">我們的每月部長會議將在 5 月 30 日星期三晚間 7 點舉行。如同往常，地點在 16 樓的會議室。</h2>\n<p>主要的討論主題是明年的部門預算。這是非常重要的主題。 所以，公司的執行長將會加入我們。 為了準備會議，我希望你們每個人都整理出一份報告，其中概述自己部門的年度花費，並強調可能需要對預算做的改變。 尤其要找出該去除的非必要花費，因為這樣會在整體上為公司省錢。</p>\n<p>請確認收到這份備忘錄。只要跟我的助理 Hertz 小姐確認出席就可以了。謝謝。</p>\n</div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 135-138 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-review type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><p>第一次到 True Colors 油漆用品店時，我享受到極佳的顧客服務。可惜第二次的經驗遠不如第一次。昨天進店時，店面前方竟然沒有員工。我看了十分鐘色卡，才終於有位員工走過來，但她幾乎立刻就為了接電話而離開。</p>\n<p>坦白說，目睹這麼不專業的行為讓我很震驚。更糟的是，好不容易有人協助，另一位員工卻弄錯我的訂單。我原本要的是「糖蘋果紅」（Candy Apple Red），收到的卻是「猩紅色」（Scarlet Red）。下次我會去另一家更重視顧客的商店購物。</p>\n</div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 139-142 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\"></span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\"></span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\"></span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\"></span></div></div>\n<p>親愛的 Evans 女士：</p>\n<p>我最近在 Wave 藝廊看見您的作品，對您的獨特風格印象非常深刻。我從未見過風格與您的畫作如此相似的作品。我寫這封信，是因為我經營一家小型藝術工作室，每週都會開設好幾次繪畫課程。我們偶爾邀請藝術家，教導學生基礎油畫或壓克力繪畫技巧以外的內容，所以想請問您是否有興趣擔任下一位客座講師。</p>\n<p>您在規劃課程方面將享有很大的彈性。身為授課教師，只有您能決定使用哪些材料、教授哪些概念。</p>\n<p>期待您的回覆。如果您有興趣，透過這個電子郵件地址與我聯絡最方便。</p>\n<p>敬祝順心\nDavid Whetzel\nArt Unlimited 總監</p>\n</div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 143-146 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">員工請注意：</h2>\n<p class=\"notice-subject\">Sebastian Hill 飯店整個 6 月都將關閉。這棟建築物需要一些整修，這些整修無法在住客在場時完成。</p>\n<p>由於 6 月是我們最繁忙時期的開始，所以在我們的合作據點有足夠的臨時職缺可以提供給各位。 所以，Sebastian Hill 的所有員工在這裡的最後一天（5 月 31 日）之後，將在 Daytona 飯店或 New Orleans 度假村開始工作。</p>\n<p>要是你對於想在哪間飯店工作有偏好，請在本週結束之前告訴分公司經理 Jim Stevens。 他不能保證滿足任何要求，但會謹慎考慮。 臨時工作地點將在 5 月 20 日前全部決定。</p>\n</div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 147-148 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-form type-translation type-catalog\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Global Engineering Monthly（GEM）工程月刊</strong></h2>\n<p>三十多年來，本刊一直是工程領域專業人士首選的刊物。每一期《Global Engineering Monthly》都包含設備評測、最新趨勢文章，以及成功工程師的人物專訪。</p>\n<p><strong>訂閱方案</strong></p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th>期間</th>\n<th style=\"text-align:right\">總價</th>\n<th style=\"text-align:right\">每期</th>\n<th style=\"text-align:center\">已選</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>六個月</td>\n<td style=\"text-align:right\">$36.00</td>\n<td style=\"text-align:right\">$6.00</td>\n<td style=\"text-align:center\">□</td>\n</tr>\n<tr>\n<td>一年</td>\n<td style=\"text-align:right\">$66.00</td>\n<td style=\"text-align:right\">$5.50</td>\n<td style=\"text-align:center\">■</td>\n</tr>\n<tr>\n<td>兩年</td>\n<td style=\"text-align:right\">$96.00</td>\n<td style=\"text-align:right\">$4.00</td>\n<td style=\"text-align:center\">□</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>是否訂閱每週電子郵件電子報？</strong> 是 □　否 ■</p>\n<p><strong>您的資料</strong></p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th>欄位</th>\n<th>內容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>姓名</td>\n<td>Lorenza Cassar</td>\n</tr>\n<tr>\n<td>地址</td>\n<td>17 Triq Annetto Caruana</td>\n</tr>\n<tr>\n<td>城市</td>\n<td>Qawra</td>\n</tr>\n<tr>\n<td>國家</td>\n<td>馬爾他</td>\n</tr>\n<tr>\n<td>郵遞區號</td>\n<td>SPB 1215</td>\n</tr>\n<tr>\n<td>電子郵件</td>\n<td>lorenza@rcengineering.com</td>\n</tr>\n</tbody>\n</table></div>\n<p>訂閱一年可免費獲得小型工具組！訂閱兩年則可免費獲得 5 月 9 日在紐約市舉行的跨國工程會議通行證。</p>\n<p><strong>前往結帳</strong></p>\n</div></section></div>","149-151":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 149-151 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">注意：</h2>\n<p>如果您經常失眠，或者懷疑您有睡眠障礙，您可能有資格參加在 Carson 醫學研究所進行的新研究。我們目前正在開發可能幫助人們擺脫失眠的藥物。在研究期間，您只需要在 2 週之中每晚定時服用藥物。然後，您會被要求填寫關於它對您睡眠的影響以及任何副作用的報告。</p>\n<p>如果您的年齡在 18 到 50 之間，就有資格參加這項研究。如欲報名，請寄 sleepstudy@cmi.org 聯絡我們。在電子郵件中，請說明您自身可能妨礙藥物（作用）的任何醫療方面問題。也請列出您的工作時間安排與其他義務。報名截止日期是 12 月 1 日。所有參加者都將獲得 200 元的參加費用。</p>\n</div></section></div>","152-153":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 152-153 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kathleen Massee</strong><time class=\"chat-time\">[下午6:18]</time></div><div class=\"message-text\">嗨，Evan。我剛注意到下禮拜的時間表已經貼出來了， 看起來我星期一上午應該工作，這很奇怪。我早上通常沒排班。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Evan Rosenblatt</strong><time class=\"chat-time\">[下午6:19]</time></div><div class=\"message-text\">我猜是 Ross 小姐需要有人在 Kovac 小姐休假時代替她。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kathleen Massee</strong><time class=\"chat-time\">[下午6:20]</time></div><div class=\"message-text\">原來是這樣。但無論如何， 我想知道你能不能代替我值那個班，因為我那天預約了看牙醫。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Evan Rosenblatt</strong><time class=\"chat-time\">[下午6:22]</time></div><div class=\"message-text\">完全沒問題。 反正我那時候沒有別的事情要做。我相信 Ross 小姐不會介意這個改變，但你應該在今天結束之前讓她知道，好讓她能修改時間表。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kathleen Massee</strong><time class=\"chat-time\">[下午6:23]</time></div><div class=\"message-text\">太感謝了。我欠你一次。</div></div></div>\n\n\n\n\n</div></section></div>","154-155":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 154-155 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-ad type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><p>今年夏天，本地用品店 Arts and Scraps 將在每週二及週四晚間 6:30 至 8:30 舉辦提供給成年學習者的營業時間後課程。這門課將提供多種技法的指導，包括玻璃彩繪、油氈版版畫，以及混合媒材拼貼製作。這門課將由插畫家 Maude Cumby 教授，她曾經有 10 年時間在紐約以藝術家身分工作，也是 Pulford 設計學院的畢業生。</p>\n<p>如果您在 5 月 2 日前預約名額，也就是課程開始的一個月前，這門 12 堂的課費用是 100 元。過了當天，則適用我們 130 元的一般費用。我們提供所有材料。請上 www.artsandscraps.com/classes 報名，或者在我們的一般營業時間上午 10 點至下午 6 點間來店報名。</p>\n</div></section></div>","156-158":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 156-158 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Corogo 公司員工調動政策</h2>\n<p class=\"notice-subject\">Corogo 公司支持員工的專業發展，也了解有些員工可能希望尋求公司內部的晉升機會。如果符合以下條件，Corogo 公司的員工可以在內部應徵發布於公司網站的職缺：</p>\n<p>• 已經在現職工作至少 12 個月*\n• 有其中一項職缺公告列出的最低資格條件或要求\n• 在過去 6 個月得到至少「令人滿意」的工作表現評價\n• 過去 12 個月沒有得到書面警告或預先警告。</p>\n<p>建議有意應徵不同職位的員工盡早通知目前的經理。正職員工提交應徵信前至少 2 週前必須通知主管。</p>\n<p>要是員工錄取不同部門的職位，之前獲得核准的休假計畫可能被改變。</p>\n<p>*只有在罕見的情況下，不符合上述要求的員工才會被考慮調職。在此情況下，Corogo 公司人事部的一名職員將與該員工現任主管會面，以判定調職是否恰當。</p>\n</div></section></div>","159-160":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 159-160 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>首頁｜每日精選比賽｜廣告服務｜聯絡表單</strong></h2>\n<p><strong>在 Contest Craze 刊登廣告</strong></p>\n<p>您正在替企業或組織宣傳比賽、抽獎或贈品活動嗎？如果需要協助宣傳，您來對地方了！只要寄來比賽說明，我們就能在首頁免費刊登一天。如果想獲得更多曝光，請選擇下列廣告方案，讓活動成為精選比賽。精選資訊會置頂於首頁，並收錄在每日寄給會員的電子郵件電子報中。</p>\n<p><strong>精選比賽廣告價格</strong></p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th>刊登時間</th>\n<th style=\"text-align:right\">費用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>一天</td>\n<td style=\"text-align:right\">$35</td>\n</tr>\n<tr>\n<td>兩天</td>\n<td style=\"text-align:right\">$65</td>\n</tr>\n<tr>\n<td>三天</td>\n<td style=\"text-align:right\">$90</td>\n</tr>\n<tr>\n<td>一週</td>\n<td style=\"text-align:right\">$200</td>\n</tr>\n</tbody>\n</table></div>\n<p>請注意：我們不刊登需要收取報名費的比賽資訊。</p>\n</div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 161-164 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><p>環境意識日贈送活動\n本社記者 Brenda Galway 撰稿</p>\n<p>為慶祝 5 月 1 日環境意識日，Winstonville 市將以先到者先得的方式發放 2,000 株免費樹苗給社區成員。本計畫是市政府為了改善該市永續性而種植 10,000 棵樹的承諾的一環。根據都市計畫負責人 Jane Stein 所說，上午 8:00 至 11:30 可以在 Fennel 路上的 Mulligan's 苗圃與中央市民社區中心領取。為了無法在上午到場的人，下午 4:30 到晚上 8:00 在 Clifton 大街上的 Home and Garden 商店也提供一些樹苗。</p>\n<p>Stein 小姐表示：「只要記得遵照本市網站上發布的指示來種植並照顧你領取的每棵樹。我們正在追蹤樹木的種植進度。我要很高興地說，根據官方的清單，我們目前為止已經在市中心種了 800 棵新樹木。」沒有自己的土地，但還是想要參加這個計畫的居民，可以參加當地非營利組織 Planet Plant 所舉辦的特別園藝活動。請上 www.winstonvillegov.org/parksandrecdept 了解更多詳情。</p>\n</div></section></div>","165-168":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 165-168 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">關於我們：</h2>\n<p>DPQ 交通公司是在全國每週 7 天、每天 24 小時提供服務的包租巴士公司。不管您是為了觀光還是公司靜修而需要載送團體，我們保證利用我們來旅行是正確的選擇。</p>\n<p>安全是我們的第一優先。所以，我們的司機訓練有素，具備多年駕駛經驗。— [1] —。此外，我們的車輛接受定期保養，以確保在出發時總是運作正常。</p>\n<p>我們也以舒適度與便利性自豪。— [2] —。除了有充足的腿部空間以外，我們車輛的每個可傾斜座椅都配備讓您的設備使用的電源插座，以及可調整的冷氣出風口。車上也提供免費無線網路。您也可以攜帶簡單的餐點或零食，或者安排在受歡迎的餐廳中途停車。— [3] —。</p>\n<p>最後，我們的巴士最多可以坐 56 個人，這意味著使用我們的服務是成本效益高的團體旅行方式。— [4] —。</p>\n<p>如果 DPQ 交通是適合您的選擇，請將您旅行的細節寄到 queries@dpqtransport.com。我們會在 24 小時以內回覆有競爭力的報價和旅程提案。</p>\n</div></section></div>","169-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 169-171 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">行動通訊基地台建設即將開始</h2>\n<p>海邊城鎮 Farview 新的行動通訊基地台建設工程不久即將開始，讓一些當地居民感到很沮喪。— [1] —。這項計畫一開始在 3 年前提出時，因為人們開始對於提議的地點在海邊停車場有疑慮而延遲了。許多人說基地台會破壞這個地區的自然美景。其他人則表達了擔憂，說它的存在可能對住在附近的人造成多種健康與安全問題，更別說降低房地產價值了。— [2] —</p>\n<p>對此，市府官員再次向大眾保證，基地台不但安全，而且每年將從租用它的每家無線通訊業者產生總計大約 20,000 元的高額租金收入。— [3] —。而且，每年夏天湧入 Farview 的觀光客意味著這座基地台因為實際的原因而越來越有必要。市議員 Fred White 表示：「我們有越多來客，就會有越多手機。」— [4] —。至於對建築結構外觀的疑慮，當地藝術家 Katherine Tatum 協助進行了基地台的設計，好讓它融入自然環境。</p>\n</div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 172-175 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Bryce Turner</strong><time class=\"chat-time\">[下午2:30]</time></div><div class=\"message-text\">你們聽說了嗎？我們公司的股東希望我們減少廢棄物嗎？我認為我們尊重他們的期望是很重要的，所以我想找到一些在 Meerson 公司這裡減少不可回收包裝材料使用量的方法。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sophie Moore</strong><time class=\"chat-time\">[下午2:31]</time></div><div class=\"message-text\">我們最近減少了 40% 放在箱子裡的發泡塑膠（保麗龍）用量。還有什麼我們能做的嗎？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Bryce Turner</strong><time class=\"chat-time\">[下午2:34]</time></div><div class=\"message-text\">我們有可能完全不用發泡塑膠，並且開始改用碎報紙嗎？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Randy Poehler</strong><time class=\"chat-time\">[下午2:35]</time></div><div class=\"message-text\">而且只有我們的易碎物品需要額外填充。例如我們的洗潔劑裝在塑膠瓶裡，所以不需要任何特別保護。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Randy Poehler</strong><time class=\"chat-time\">[下午2:36]</time></div><div class=\"message-text\">與其只著重於運送材料，不如我們也更換一些產品容器如何？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Bryce Turner</strong><time class=\"chat-time\">[下午2:38]</time></div><div class=\"message-text\">你是提議我們使用其他種類的容器材料嗎？我不知道還有什麼更好的材料。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Randy Poehler</strong><time class=\"chat-time\">[下午2:39]</time></div><div class=\"message-text\">不是。我只是說我們可以更有效率地使用塑膠。有些競爭業者販賣可以用來填充空瓶的袋裝洗潔劑。他們使用塑膠，但用量少很多。我們可以做同樣的事。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Bryce Turner</strong><time class=\"chat-time\">[下午2:41]</time></div><div class=\"message-text\">這樣實際上也會幫我們省錢。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sophie Moore</strong><time class=\"chat-time\">[下午2:42]</time></div><div class=\"message-text\">我會研究我們是否能這樣改變。</div></div></div>\n\n\n\n\n\n\n\n\n</div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 176-180 · 2 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Bentota Beach 飯店迎來強力領導者</strong></h2>\n<p>印度最受信賴的連鎖住宿業者之一 Gold Frond Resorts，已任命 Gareth Sunderland 擔任旗下最新據點 Bentota Beach Hotel 的旅客服務總監。Sunderland 先生將於 6 月 14 日上任，也就是度假村開始營運前三週。他擁有超過二十年的旅宿服務經驗，其中最近十年都在 Gold Frond Resorts 工作。最近他擔任該集團島嶼據點的前台經理。憑藉他在該據點的出色表現，預料能勝任更高階的旅客服務總監職務。</p>\n<p>在 Bentota Beach Hotel，他將督導所有直接服務旅客的員工，管理預訂及入住登記系統，並負責員工培訓以維持優質服務。他也會協調各種旅客休閒活動，從水上運動到文化參訪皆包括在內。</p>\n</div></section><section class=\"document-card type-ad type-translation type-catalog\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 2 / 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Gold Frond Resorts 人人都能找到喜愛的假期！</strong></h2>\n<p>隨著豪華的 Bentota Beach 據點開幕，我們在印度各地共有五間度假村可供選擇。無論您的預算、是想體驗刺激活動還是放鬆休息，我們都能提供理想的假期體驗。</p>\n<p><strong>旗下度假村</strong></p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th>度假村</th>\n<th>特色</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Komari Cove</td>\n<td>最初的據點；最近擴建至 315 間客房，比其他任何據點都多</td>\n</tr>\n<tr>\n<td>Matara Oceanside</td>\n<td>價格最實惠的選項；距印度本土一處熱門公共海灘只有幾步之遙</td>\n</tr>\n<tr>\n<td>Tangalle Retreat</td>\n<td>獲《Leisurist》雜誌選為最佳度假村；在本土海岸有 40 棟私人別墅</td>\n</tr>\n<tr>\n<td>Vergual Paradise</td>\n<td>從 Pondicherry 機場搭船約 20 分鐘；佔據整座島嶼</td>\n</tr>\n<tr>\n<td>Bentota Beach</td>\n<td>適合喜愛動態度假的旅客；位於印度本土一處熱門衝浪海灘</td>\n</tr>\n</tbody>\n</table></div>\n<p>可在 www.goldfrondresorts.com 查閱各度假村的活動資訊，也能線上預訂。</p>\n</div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 181-185 · 2 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">顧客服務 cservice@framecaster.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Erik Mercado erikmerc@coolmail.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">我的購買</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">4 月 28 日</span></div></div>\n<p>您好：</p>\n<p>我最近從貴公司的網站直接購買了你們的 Spin Genie 400，並且把它帶到本地的腳踏車店組裝。不過，在組裝腳踏車時，技工注意到兩組煞車都有瑕疵。</p>\n<p>對於這件事，我聯絡了你們的客服部，你們的專員 Nora Santos 告知我有兩個選擇。她說我可以去本地的 FrameCaster 產品零售店讓人免費更換煞車，或者我可以請你們把替換零件寄到我的地址，雖然這樣做意味著要付運費。</p>\n<p>我現在忙著為了搬家到舊金山打包，沒有時間去找零件。我希望你們在我搬完之後把煞車寄送給我，但我不明白為什麼我必須付運費，因為這個產品有瑕疵。請告訴我是否還有其他選項，以及你們希望怎樣進行。</p>\n</div></section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 2 / 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Erik Mercado erikmerc@coolmail.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Jade Estrada jadee@framecaster.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">回覆：我的購買</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">4 月 29 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">附件</span><span class=\"mail-value\">FrameCaster.v45-b</span></div></div>\n<p>親愛的 Mercado 先生：</p>\n<p>我很遺憾得知您最近購買的 Spin Genie 400 的問題。我已經深入了解這個問題，並且發現我們的專員傳達了不正確的資訊給您。如果是因為產品瑕疵，我們不對顧客收取運送替換零件的費用。我們去年有這項費用，但我們的政策在那之後已經改變，所以零件可以免費寄給您。我已經通知我們的專員這個溝通不良的情況，而她會接受額外訓練，好讓這種情況不再發生。</p>\n<p>請提供您的新地址，我會派人馬上把物品寄過去。此外，為了彌補您的不便，我附上您未來購買任何 FrameCaster 配件時可以使用的 20 元優惠券。</p>\n<p>謝謝您的耐心等候。</p>\n<p>客服部長</p>\n</div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 186-190 · 3 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Dillon Zhou</span></div><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">全體員工</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">辦公室參觀</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">2 月 20 日</span></div></div>\n<p>《The Sydney Sun》的記者預定在 3 月 1 日參觀我們的新辦公室。她正在寫關於我們辦公室設計與員工福利的短篇文章。因為我們已經寄了一些供這篇文章使用的圖片，所以不會拍照。在我們帶領記者通過走廊的時候，請自由和她互動。我們的一位資深主管將會向她簡單介紹我們最近的軟體開發專案。我們歡迎這位記者使用所有休閒娛樂設施。</p>\n</div></section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 2 / 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Sela Singh s.singh@thesydneysun.au</span></div><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Dillon Zhou d.zhou@zazoosoftware.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">文章</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">2 月 27 日</span></div></div>\n<p>親愛的 Zhou 先生：</p>\n<p>很抱歉臨時通知，但我因為旅行中的緊急情況而無法在 3 月 1 日回到雪梨。如果我可以在其他日期參觀，請寄 d.worley@thesydneysun.au 聯絡我的助理 Dennis Worley，他會處理所有細節。如果不行的話，請在回覆這封電子郵件時提供貴公司新設施的基本說明。</p>\n<p>還有，您所寄的照片中有一些不是很清楚。可以請您寄給我每張照片比較大的版本嗎？那樣會很有幫助。</p>\n<p>謝謝。</p>\n</div></section><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 3 / 3</small></div><div class=\"document-body source-passages\"><p>緩解 Zazoo 公司的辦公室壓力\n3 月 8 日\nSela Singh 撰稿</p>\n<p>電腦業界巨人 Zazoo 軟體公司最近在雪梨開設了最新的辦公室，吸引了許多對於提供給員工的福利的猜測。Zazoo 軟體公司以提供照料員工的工作環境而聞名，而在新的辦公大樓中有許多放鬆的地方。我在 3 月 4 日接受了設施的導覽，而能夠親眼看到這些地方。每間內部餐廳都為員工提供免費食物，也有很多健康的選擇。</p>\n<p>在運動設施方面，有籃球場、游泳池和健身房。此外，計畫在年底前增設瑜伽與冥想工作室。所有這些設施都能幫助員工有高效率的表現，而我在參觀辦公室的時候，可以看到這一點是真的。</p>\n<p>Cathy Sanchez 在讓我看專案的計畫時說：「我們目前在設計新軟體程式的最後階段。每個人都承受很大的壓力在工作，但我們的環境應該有助於緩解這個壓力，並且讓事情比較有趣。」</p>\n</div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 191-195 · 3 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Rosa Mengistu 的便條</strong></h2>\n<p>你好，Fekade 先生。很遺憾你未能參加今天的規劃會議。我們決定需要一張 Dire Dawa 中央公園的照片，必須呈現白天有人在噴泉附近休憩的情景。請你負責尋找這張高解析度照片。先查看我們的照片檔案庫，可能已經有符合條件的照片。否則，可以搜尋 Flash Photos 或 Baumgard Pics 等圖片機構的資料庫。如果仍找不到，也可以聘請自由接案攝影師。</p>\n</div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 2 / 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Baumgard Pics｜世界各地的照片來源</strong></h2>\n<p><strong>顧客：</strong> Dawit Fekade</p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th>照片資料</th>\n<th>內容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>照片名稱</td>\n<td>觀看音樂表演的人群</td>\n</tr>\n<tr>\n<td>類別</td>\n<td>戶外活動</td>\n</tr>\n<tr>\n<td>地點</td>\n<td>Dire Dawa 中央公園噴泉</td>\n</tr>\n<tr>\n<td>照片代碼</td>\n<td>HEWZYXP</td>\n</tr>\n<tr>\n<td>檔案大小</td>\n<td>20 MB</td>\n</tr>\n<tr>\n<td>攝影師</td>\n<td>Delores Ashburn</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>依圖片尺寸計價</strong></p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th>尺寸</th>\n<th>像素</th>\n<th style=\"text-align:right\">價格</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>小</td>\n<td>500×449</td>\n<td style=\"text-align:right\">$3.99</td>\n</tr>\n<tr>\n<td>中</td>\n<td>1000×899</td>\n<td style=\"text-align:right\">$4.99</td>\n</tr>\n<tr>\n<td>大</td>\n<td>2000×1798</td>\n<td style=\"text-align:right\">$5.99</td>\n</tr>\n<tr>\n<td>特大</td>\n<td>3172×2851</td>\n<td style=\"text-align:right\">$6.99</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>立即購買圖片！</strong></p>\n</div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 3 / 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>感謝您選擇 Baumgard Pics！</strong></h2>\n<p>770 Hickory Street, Omaha, Nebraska, US 68124\n電話：(402) 555-2882\n網站：http://baumgardpics.org/</p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th>項目</th>\n<th>明細</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>圖片代碼</td>\n<td>HEWZYXP</td>\n</tr>\n<tr>\n<td>帳單地址</td>\n<td>Dawit Fekade, Aksum Services, 4 Adwa Street, Addis Ababa, Ethiopia</td>\n</tr>\n<tr>\n<td>照片價格</td>\n<td>$5.99</td>\n</tr>\n<tr>\n<td>稅金</td>\n<td>$0.59</td>\n</tr>\n<tr>\n<td><strong>合計</strong></td>\n<td><strong>$6.58</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p>若要下載帳單，請登入 Baumgard Pics 網站並選擇「購買紀錄」分頁，勾選欲儲存的帳單後按下載按鈕。</p>\n<p>您可以從 6 月 25 日起使用本次購買的照片。照片使用權將在五年後到期。如想延長使用期限，可於網站辦理。</p>\n</div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 196-200 · 3 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 1 / 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Blue Ravine 醫學院（BRMS）公告：全體學生與教職員</h2>\n<p>請注意，Kowloon 東方醫藥大學（KUEM）的 Janice Shen 博士將於 9 月 4 日發表演說。Shen 博士將說明成功的脊椎疾病治療法。她是針灸與草藥治療的專家，主要治療背痛與脊椎疾病。過去 12 年，她受聘於 KUEM，在那裡主導許多不同的研究計畫。</p>\n<p>她的演說將於下午 3 點在 BRMS 校園的 Fasthead 禮堂舉行。座位有限，所以請到校內活動辦公室、撥打分機 #364 或寄電子郵件到 jaynemarche@brms.edu 給活動辦公室的 Jayne Marche 進行預約。BRMS 的所有教員與學生都可以免費參加這次演說，但外部訪客必須付 16 元。</p>\n</div></section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 2 / 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Jayne Marche jaynemarche@brms.edu</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Grayden Higgins graydenhiggins@brms.edu</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">申請</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">8 月 19 日</span></div></div>\n<p>哈囉，Jayne：</p>\n<p>我正在 BRMS 這裡教授替代醫學的進階課程，目前有 9 名學生。我想要為我們總共 10 個人預約參加 Shen 博士即將進行的演說。請告訴我是否需要所有學生的姓名，或者可以用我的名義預約座位。</p>\n<p>還有，我想知道會不會有人錄製演說的影片。可能的話，我想和未來的學生分享她的演說。遺憾的是，沒有人想到要把她的上次來訪錄下來，我希望這次不會再那樣了。</p>\n<p>謝謝，我希望很快收到回信。</p>\n<p>Grayden Higgins 博士\nBRMS，骨骼與肌肉疾病系</p>\n</div></section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯</span><small>DOCUMENT 3 / 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Angelo Conti angeloconti@brms.edu</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Jayne Marche jaynemarche@brms.edu</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">演講活動工作分配</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">8 月 20 日</span></div></div>\n<p>嗨，Angelo：</p>\n<p>一位 BRMS 的講師要求將 9 月 4 日舉行的講座錄影。請把這個拍攝工作加到你的行程裡。依照 Shen 博士上次的簡報來看，我猜演講會持續大約 1 小時半，之後會有應該長達 30 分鐘的問答時間。我認為我們也應該把後面的部分錄下來，所以影片總共應該會有大約 2 小時。</p>\n<p>請努力在 3 天內完成影片編輯，並且把影片檔案寄給我。我會把它發布到 BRMS 的網站、加入我們多媒體圖書館的館藏，並且把它轉寄給要求它的講師。我會確保禮堂提早 1 小時開門，讓你有時間設置機器。</p>\n<p>謝謝！</p>\n</div></section></div>"};const DETAILED_EXPLANATIONS={"101":{"type":"副詞位置","translation":"消費者調查顯示，人們願意花最多 1,200 美元購買一台新電腦。","reason":"能夠用在助動詞（would）和動詞原形（spend）之間，並且修飾動詞的副詞 (B) happily（樂意地）是正確答案。形容詞 (A) 和 (D)、名詞 (C) 都不能修飾動詞。","vocab":"consumer n. 消費者　survey n. （問卷）調查　happiness n. 幸福，快樂","paraphrase":""},"102":{"type":"所有格代名詞與所有格形容詞","translation":"一份條理分明的履歷能提高你獲得工作面試的機會。","reason":"空格緊接在名詞 chances（機會）之前，需要能直接修飾名詞的所有格限定詞。選 (B) your，形成 your chances of obtaining a job interview（你獲得面試的機會）。(A) you 是主格／受格，不能直接置於 chances 前；(C) yours 是獨立所有格代名詞，不能再接名詞；(D) yourself 是反身代名詞，也不能修飾 chances。完整句意：一份條理分明的履歷能提高你獲得工作面試的機會。","vocab":"well-organized adj. 有條理的　résumé n. 履歷　boost v. 提高，增加　chance n. 可能性，機會","paraphrase":""},"103":{"type":"現在完成式的被動語態","translation":"Alicia Doone 的插畫已刊登在市內各地的雜誌上。","reason":"主詞 Alicia Doone’s illustrations（插畫）是「被刊登」，而非主動出版他物。have been 後接過去分詞 (C) published，組成 have been published（已被刊登）。(D) publishing 為現在分詞，會使插畫成為主動進行出版的主體；(A) publisher 是表示出版者的名詞，(B) publish 是原形動詞，都不合此處的被動結構。","vocab":"illustration n. 插畫　publisher n. 出版者，出版社","paraphrase":""},"104":{"type":"接 to 不定詞的動詞","translation":"這家慈善商店設有 24 小時衣物捐贈箱，讓人們可以在方便的時候捐贈舊衣服。","reason":"空格前面的動詞 allow（使……可以做……），後面可以接 to 不定詞當受詞補語，所以 to 不定詞 (A) to donate 是正確答案。第三人稱單數動詞 (B)、動名詞或現在分詞 (C)、名詞 (D) 不能用在 allow 的受詞補語（to 不定詞）位置。就算想把現在分詞 (C) 看成修飾前面名詞（people）的成分，但因為 allow 是第 5 類句型動詞，這樣會使句子缺少句型所需要的受詞補語，所以不對。雖然也可以把 allow 看成第 4 類句型動詞的用法「容許，給予」，並且使用選項 (D) donation 而構成「allow + 間接受詞（people）+ 直接受詞（donation）」；但缺少了能連結後面名詞 used clothes 的連接詞，所以不對。","vocab":"charity n. 慈善，慈善團體　used adj. 用過的，二手的　donate v. 捐贈　donation n. 捐款，捐獻","paraphrase":""},"105":{"type":"固定搭配 an assortment of","translation":"Chemie’s 冰淇淋店提供各式各樣的產品，而且每季都會更換品項。","reason":"an assortment of products 是固定名詞片語，意思是「各式各樣的商品」。因此選 (B) assortment。句子強調 Chemie’s Ice Cream 每季更換其商品組合；其他選項 interest（興趣）、advent（到來）、influence（影響）無法與 of products 構成符合文意的搭配。","vocab":"offer v. 提供","paraphrase":""},"106":{"type":"副詞比較級","translation":"使用新的 Perspectiva Plus 信用卡，旅客可以比以往更快累積獎勵點數。","reason":"空格後面有 than ever before（比以往任何時候），所以需要比較級副詞 (C) more quickly 是正確答案。原級副詞 (B) 不能和 than 連用。形容詞 (A) 不能修飾動詞。最高級副詞 (D) 不能和 than 連用。","vocab":"reward points phr. 紅利點數　credit card phr. 信用卡","paraphrase":""},"107":{"type":"題意解析","translation":"根據從用餐顧客蒐集的意見回饋，大多數顧客都對這家餐廳的新菜單感到滿意。","reason":"句意是「根據從用餐者收集到的回饋意見」，所以名詞 (C) feedback（回饋意見）是正確答案。(A) content 表示「內容」，(B) procedure 表示「程序」，(D) investigation 表示「調查」。","vocab":"diner n. 用餐者　be satisfied with phr. 對……感到滿意","paraphrase":""},"108":{"type":"介系詞選位置","translation":"Sally’s 糖果店位於 Grant 街，從主要廣場數過來的第三棟建築物。","reason":"句意是「Sally's 糖果店是 Grant 街上從主廣場數來的第三棟建築物」，所以表示起點的介系詞 (A) from（從……）是正確答案。(B) among 表示「在……之中」，(C) under 表示「在……之下」，(D) above 表示「在……上方」。","vocab":"main square phr. 主廣場","paraphrase":""},"109":{"type":"攝影大賽的優勝者將由 5 名知名評審組成的評審團決定。","translation":"攝影比賽的優勝者將由五位傑出評審組成的評審團選出。","reason":"句意是「大賽的優勝者會由評審團決定」，所以動詞 determine（決定）的 p.p. 形 (B) determined 是正確答案。(A) contain 表示「包含，含有」，(C) implement 表示「實施」，(D) interpret 表示「詮釋」。","vocab":"competition n. 比賽，競爭　panel of judges phr. 評審團　distinguished adj. 著名的","paraphrase":""},"110":{"type":"時間副詞 early next year","translation":"Emblem Motor 的新車系列將於明年年初的芝加哥年度車展上公開亮相。","reason":"正確搭配是 early next year（明年初），這裡的 early 修飾時間表達，選 (C)。它不表示車展通常在每年初舉行；句意是新車陣容將在明年初舉行的芝加哥車展亮相。previously、typically、highly 都不符合該時間語意。","vocab":"unveil v. 揭露，發表（新計畫、產品等）　annual adj. 年度的，每年的","paraphrase":""},"111":{"type":"【動詞位置】主動態與被動態的區分","translation":"當 Springs 小姐度假結束返回辦公室時，部門主管將指派一項新專案給她。","reason":"when 引導的從屬子句（when she ~ vacation）只有主詞（she），缺少了動詞，所以動詞 (A) 和 (D) 是可能的答案。因為要表達「在 Springs 小姐休假完回到辦公室的時候」的主動意義，所以主動態 (A) returns 是正確答案。另外，表時間的副詞子句連接詞（when）後面，會用現在式表示未來的情況。如果使用被動態 (D) 的話，意思會變成「Springs 小姐從休假中被歸還」，所以不對。動名詞或現在分詞 (B) 和 to 不定詞 (C) 不能用在動詞的位置。","vocab":"","paraphrase":""},"112":{"type":"介系詞選位置","translation":"當企業將顧客需求置於其他一切之上時，通常能吸引顧客再次消費。","reason":"When 引導的副詞子句（When companies ~ else）是已經具備主詞（companies）、動詞（prioritize）、受詞（their customers' needs）的完整子句，所以 all else 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表達「最優先看待顧客的需求」，所以表示位置的介系詞 (A) above（在……之上）是正確答案。(C) within 表示位置或範圍「在……之內」，(D) toward 表示方向「往……」。 (B) where 不能引導修飾片語。","vocab":"prioritize v. 優先考慮　need n. 需求　generate v. 產生　repeat business phr. 回頭客帶來的生意（再度購買）","paraphrase":""},"113":{"type":"名詞位置","translation":"工程師表示，稍微修改現有的太陽能板，就能提高其效能。","reason":"空格在不定冠詞（a）後面，而且被形容詞（slight）修飾，所以名詞 (D) modification（修改）是正確答案。動詞 (A)、過去式動詞或過去分詞 (B)、形容詞 (C) 不能用在名詞位置。","vocab":"claim v. 主張　slight adj. 稍微的　existing adj. 現有的　solar adj. 太陽的　modify v. 修改　modifiable adj. 可修改的","paraphrase":""},"114":{"type":"動詞慣用表達方式","translation":"居住在 Waterford 公寓的房客必須在每個月的第一天繳交房租。","reason":"句意是「居住在 Waterford 公寓的房客」，所以能和空格後面的介系詞（in）構成 reside in（居住在……）的動詞 (C) reside（居住）是正確答案。(A) occupy（佔據，住）意義上似乎說得通，但因為是及物動詞，所以不能和介系詞 in 一起使用。(B) engage 和空格後面的介系詞（in）連用而形成 engage in 時，表示「參與……」，意思不對。(D) visit 表示「拜訪」。","vocab":"tenant n. 租戶　rent n. 租金","paraphrase":""},"115":{"type":"形容詞","translation":"如果沒有足夠的公共資金，Scott 基金會就必須從私人來源募集更多款項。","reason":"句意是「沒有足夠的公眾注資，必須從民間來源募集更多錢」，所以形容詞 (A) adequate（足夠的，適當的）是正確答案。(B) incompetent 表示「無能的」，(C) receptive 表示「善於接受的」，(D) delightful 表示「令人愉快的」。","vocab":"raise v. 募集　private adj. 私人的，民間的","paraphrase":""},"116":{"type":"讓步連接詞","translation":"儘管 Black 先生只有兩年工作經驗，仍獲任命為 TVD 公司的區域業務主管。","reason":"前後兩個子句呈現「雖然……但是……」的讓步關係，因此選 (A) Even though（即使／雖然）。Even though 後面接有主詞與動詞的完整子句；其餘連接語若無法表示這層轉折，就不能填入。","vocab":"experience n. 經歷，經驗 v. 經歷　name v. 任命　regional adj. 地區的","paraphrase":""},"117":{"type":"副詞位置","translation":"一位顧客不小心被重複收費兩次，因此款項已退回她的信用卡。","reason":"空格修飾後面的過去分詞（charged），所以副詞 (B) accidentally（意外地）是正確答案。形容詞 (A)、名詞 (C) 和 (D) 不能修飾過去分詞。","vocab":"charge v. 收費　refund n. 退款　issue v. 發行，發出","paraphrase":""},"118":{"type":"Manuel 公司的員工現在將獲得人壽保險保障，作為其雇用福利之一。","translation":"Manuel 公司員工現在將享有人壽保險保障，作為員工福利之一。","reason":"句意是「作為其雇用福利之一」，所以名詞 (B) benefits（福利）是正確答案。(A) skills 表示「技能」，(C) concerns 表示「關切的事」，(D) deductions 表示「扣除額」。","vocab":"life insurance coverage phr. 人壽保險保障　employment n. 雇用","paraphrase":""},"119":{"type":"Jung 小姐得知自己將被調到休士頓辦公室時感到不悅，因為她從未要求調動。","translation":"Jung 小姐得知自己將被調往休士頓辦公室時感到不滿，因為她從未提出調職要求。","reason":"句意是「因為她從未要求調動」，所以副詞 (D) never（從未）是正確答案。(A) before 表示「之前」，(B) already 表示「已經」，(C) often 表示「經常」。","vocab":"displeased adj. 不悅的　transfer v. 調動","paraphrase":""},"120":{"type":"介系詞 notwithstanding","translation":"儘管天氣預報顯示可能下雨，本週末的鳳凰城馬拉松仍將按原定計畫舉行。","reason":"notwithstanding 後可直接接名詞片語（the forecast of rain 等），意為「儘管」。句子要表達即使預報有雨，馬拉松仍照原訂計畫舉辦，因此選 (B)。它在此是讓步介系詞，不是表示原因或時間。","vocab":"marathon n. 馬拉松　take place phr. 舉行　forecast n. 預報","paraphrase":""},"121":{"type":"形容詞","translation":"Shiller 兒童博物館非常歡迎參觀者與展示中的物品互動。","reason":"句意是「歡迎參觀者和展示品互動」，所以形容詞 (B) welcome（受到歡迎的，被允許的）是正確答案。(A) pleasant（令人愉快的）意思似乎說得通，但它不能表達人的感情，而應該改用 pleased（高興的）來表達才對。(C) obvious 表示「明顯的」。(D) brilliant 表示「傑出的」。","vocab":"interact v. 互動　on display phr. 展示中的","paraphrase":""},"122":{"type":"對等連接詞","translation":"Paulson 電子公司可以透過一般郵件或須額外付費的快速配送服務寄送商品。","reason":"介系詞（by）的受詞是 regular mail 和 express delivery 這兩個名詞片語，中間需要用對等連接詞連接，而且要表達「用一般郵件或快速運送產品」，所以對等連接詞 (D) or（或者）是正確答案。(A) so（所以）只能連接兩個子句，而不能連接單字或片語，所以不對。(B) up 表示「往……上」。(C) at 表示「在……」。","vocab":"ship v. 運送　express adj. 快速的，快捷的　involve v. 涉及，需要　charge n. 收費","paraphrase":""},"123":{"type":"類似意義的名詞","translation":"電視廣告播出後，Seaborn 郵輪公司收到了大量潛在乘客的詢問。","reason":"句意是「收到大量來自潛在乘客的詢問」，所以名詞 (D) volume（量）是正確答案。(A) size（規模，大小）意思似乎說得通，但它是表示事物或現象的大小，而不是數量。(B) result 表示「結果」。(C) majority（多數）似乎意思接近，但它是表示特定群體中的多數，所以不對。","vocab":"commercial n. 廣告 adj. 商業的　air v. 透過廣播、電視等方式播送　inquiry n. 詢問　potential adj. 潛在的，可能的　passenger n. 乘客","paraphrase":""},"124":{"type":"【引導修飾性語句的成分】副詞子句連接詞時間","translation":"當舞台正在搭建時，音樂家們在後方的房間練習。","reason":"這個句子已經有具備主詞（The musicians）和動詞（practiced）的完整子句，所以 ~ set up 是修飾性的語句。修飾部分有動詞（was being set up），所以能引導修飾子句的副詞子句連接詞 (B) 和 (D) 是可能的答案。因為要表達「舞台搭建時，樂手們在後面的房間練習」，所以表示時間的副詞子句連接詞 (B) as（當……時）是正確答案。如果使用 (D) unless（除非……），意思會變成「除非舞台正在被搭建，不然樂手們就會在後面的房間練習」，不符合要表達的意思。(A) in order to（為了……）後面要接原形動詞，介系詞 (C) during 不能引導修飾子句。","vocab":"practice v. 練習　back room phr. 後面、後台的房間　set up phr. 設置，搭建","paraphrase":""},"125":{"type":"題意解析","translation":"藉由回收電池而非將其丟棄，可以減少進入垃圾掩埋場的有毒物質數量。","reason":"句意是「藉由回收電池，就有可能減少有毒物質總量」，所以 (B) reduce（減少）是正確答案。(A) seize 表示「抓住」，(C) satisfy 表示「滿足」，(D) reserve 表示「預約」。","vocab":"rather than phr. 而不是　discard v. 丟棄　toxic adj. 有毒的　landfill n. 垃圾掩埋場","paraphrase":""},"126":{"type":"every + 數字 + 複數時間名詞","translation":"Folza 酒吧餐廳的服務生每兩週領一次薪水，時薪為 9 美元。","reason":"every two weeks 表示「每隔兩週」，等於 once every two weeks，選 (C) every。請注意 every 雖常接單數名詞（every week），但在 every two weeks 這類表示固定間隔的結構中，數字後使用複數 weeks 是正確的。","vocab":"","paraphrase":""},"127":{"type":"【引導修飾性語句的成分】現在分詞 vs. 過去分詞","translation":"根據真實事件改編的小說，往往受到各年齡層讀者的歡迎。","reason":"這個句子已經有具備主詞（Novels）、動詞（are）和補語（popular）的完整子句，所以 ~ events 是修飾性的語句。修飾部分修飾空格前面的名詞（Novels），所以能引導修飾性語句，同時在名詞後面做修飾的過去分詞 (A) 和現在分詞 (D) 是可能的答案。因為被修飾的名詞（Novels）和分詞之間是「小說被建立在事實的基礎上」的被動關係，所以動詞 base（把……建立在某個基礎上）的過去分詞 (A) based 是正確答案。如果使用現在分詞 (D)，意思會變成「在進行建立基礎這個行為的小說」，所以不對。動詞 (B)、動詞或名詞 (C) 不能在名詞後面做修飾。","vocab":"popular adj. 受歡迎的　age group phr. 年齡層","paraphrase":""},"128":{"type":"【形容詞】","translation":"這項訓練課程將涵蓋工作的各個面向，設計目標是盡可能全面完整。","reason":"句意是「在被設計得盡可能全面的訓練課程中，這份工作的所有方面都會被介紹到」，所以形容詞 (C) comprehensive（全面的）是正確答案。(A) decorative 表示「裝飾的」。(B) protective 表示「保護的」。(D) tentative 表示「暫定的，試驗性的」。","vocab":"aspect n. 方面　cover v. 涵蓋，包括　training course phr. 訓練課程","paraphrase":""},"129":{"type":"【名詞位置】可數名詞與不可數名詞","translation":"總統會見了該國幾家頂尖製造商，討論供應短缺問題可能的解決方案。","reason":"空格前面的形容詞可以修飾名詞，所以名詞 (A)、(C)、(D) 是可能的答案。因為空格前面有表達數量的 several of the，所以複數可數名詞 (D) manufacturers（製造業者們）是正確答案。(A) manufacturer（製造業者）是單數可數名詞，而 (C) manufacture 是不可數名詞，所以不對。另外，(C) 如果表示「產品」的話，是可數名詞，而會有複數形。動詞或過去分詞 (B) 不能被形容詞修飾。","vocab":"president n. 總統，總裁　shortage n. 短缺","paraphrase":""},"130":{"type":"未正確提交納稅申報單，可能會收到國稅局的修正要求。","translation":"未正確填報納稅申報表，可能會收到國家稅務機關要求修正的通知。","reason":"句意是「沒有正確提交納稅申報單」，所以 (D) properly（適當地，正確地）是正確答案。(B) moderately（適度地）似乎意思相近，但實際上是用來表達程度不過度、數量適中而不過多的意思。(A) nearly 表示「幾乎」，(C) narrowly 表示「勉強地，差一點地」。","vocab":"file v. 提交　tax form phr. 納稅申報單　amendment n. 修正","paraphrase":""},"131":{"type":"選出適當的句子","translation":"第 131 題：選出最適合填入閱讀文章第 131 處空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的內容提到會議的主要討論主題是明年的部門預算，而上一句 This is a subject of vital importance. 這是非常重要的主題，所以空格的內容應該和會議討論主題的重要性有關，(D) Therefore, the company's CEO will join us 是正確答案。(A) 雖然也和會議要討論的預算有關，但因為是要討論明年的預算，所以應該不會是已經決定了，而不能選這個答案。","vocab":"recognized adj. 公認的　expert n. 專家　temporary adj. 暫時的　setback n. 挫折","paraphrase":""},"132":{"type":"主動態與被動態的區分","translation":"第 132 題：選出最適合填入閱讀文章第 132 處空格的選項。","reason":"動詞 need 後面可以接 to 不定詞當受詞，所以能和空格前的 to 組成 to 不定詞的動詞原形 (A)、包含動詞原形的 (C) 和 (D) 是可能的答案。另外，請注意 need 所在的 that 子句（that ~ budget）是由主格關係代名詞 that 引導的關係子句，修飾先行詞（changes）。因為空格後面沒有受詞，而且要表達「需要被做出的改變」，所以被動態 (C) be made 是正確答案。主動態 (A) 和 (D) 後面必須要有受詞，而且意思會變成「變化做～／變化正在做～」的意思，所以不對。過去式動詞或過去分詞 (B) 不能形成 to 不定詞。","vocab":"","paraphrase":""},"133":{"type":"名詞位置","translation":"第 133 題：選出最適合填入閱讀文章第 133 處空格的選項。","reason":"空格被前面的形容詞（unnecessary）修飾，所以名詞 (D) expenses（花費）是正確答案。過去式動詞或過去分詞 (A)、動詞 (B)、形容詞 (C) 不能用在名詞的位置。","vocab":"expend v. 花費　expensive adj. 貴的","paraphrase":""},"134":{"type":"動詞詞彙 掌握上下文","translation":"第 134 題：選出最適合填入閱讀文章第 134 處空格的選項。","reason":"句意是「確認收到備忘錄」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，只要跟助理 Hertz 小姐確認出席就可以了，由此可知寄件者希望收件者通知 Hertz 小姐並確認出席，(D) acknowledge（確認收到）是正確答案。(A) explain 表示「說明」，(B) confide 表示「吐露（秘密）」，(C) remember 表示「記得」。","vocab":"","paraphrase":""},"135":{"type":"形容詞詞彙 掌握上下文","translation":"第 135 題：選出最適合填入閱讀文章第 135 處空格的選項。","reason":"句意是「得到了優秀的顧客服務」，所以 (B) excellent（優秀的）是正確答案。(A) questionable 表示「有問題的」，(C) deficient 表示「缺乏的」，(D) gradual 表示「逐漸的」。","vocab":"customer service phr. 顧客服務　not nearly phr. 一點也不……　approach v. 接近　excuse oneself phr. 請求准予離開　immediately adv. 馬上，立即　mistake n. 錯誤，失誤　attention n. 注意","paraphrase":""},"136":{"type":"選出適當的句子","translation":"第 136 題：選出最適合填入閱讀文章第 136 處空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的部分提到進去的時候，店裡的櫃台沒有任何員工，等了 10 分鐘才有人走近，而空格的上一句 However, she excused herself almost immediately in order to go answer the phone. 說那個人幾乎是馬上就說要接電話而離開了，所以空格的內容應該和顧客遇到這種情況的反應有關，(C) Honestly, I was shocked to witness such unprofessional behavior 是正確答案。","vocab":"importantly adv. 重要地　loyal adj. 忠實的　witness v. 目擊，見證 n. 目擊者，見證人　various adj. 各種的，多樣的","paraphrase":""},"137":{"type":"過去完成式","translation":"第 137 題：選出最適合填入閱讀文章第 137 處空格的選項。","reason":"主要子句（I ~ Candy Apple Red）發生的事「顧客要求 Candy Apple Red」，發生的時間比 but 引導的子句（but ~ instead）「得到 Scarlet Red」來得早。注意 but 引導的子句（but ~ instead）省略了重複的主詞（I）。因為 but 子句是過去式（was given），所以表示過去特定時間點之前曾經發生什麼的過去完成式 (C) had asked 是正確答案。過去式 (A)、現在進行式 (B)、未來式 (D) 不能表示過去特定時間點之前發生的事。","vocab":"","paraphrase":""},"138":{"type":"慣用的詞彙搭配","translation":"第 138 題：選出最適合填入閱讀文章第 138 處空格的選項。","reason":"句意是「在比較關心顧客的店購物」，所以能和空格後面的 attention to 構成 pay attention to「關注……」的動詞 pay（付出）的第三人稱單數形 (A) pays 是正確答案。如果使用 (D) 的 draw（引起「注意」），意思會變成「去引起顧客關注的店購物」，不符合文章要表達的意思。而且，draw 的表達方式應該是 draw attention from（引起……的關注）才對。(B) consider 表示「考慮」，(C) understand 表示「理解」。","vocab":"","paraphrase":""},"139":{"type":"選出適當的句子","translation":"第 139 題：選出最適合填入閱讀文章第 139 處空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 I recently saw your work at Wave Gallery and wanted to tell you that I was very impressed by your unique style. 提到，「我」（Whetzel 先生）最近在 Wave 藝廊看到 Evans 小姐的作品，想要表達自己對她獨特的風格印象深刻，所以空格的內容應該和看到作品的感想有關，(D) I've never seen paintings that look quite like yours 是正確答案。","vocab":"","paraphrase":""},"140":{"type":"【引導修飾性語句的成分】關係代名詞的位置與用法","translation":"第 140 題：選出最適合填入閱讀文章第 140 處空格的選項。","reason":"as 開頭的從屬子句（as ~ week），是具備主詞（I）、動詞（run）和受詞（a small art studio）的完整子句，所以 ~ week 是修飾性的語句。修飾部分是修飾空格前面的名詞（art studio），所以包含可修飾名詞的主格關係代名詞與關係子句動詞的 (B)、包含現在分詞的 (D) 是可能的答案。因為要表達「每週舉辦幾次繪畫課的小型藝術工作室」，所以能夠引導以 art studio 為先行詞的關係子句，而且包括在關係子句中擔任主詞的主格關係代名詞、關係子句中的動詞的 (B) that holds 是正確答案。包含現在分詞的 (D) 是被動態，所以後面不能接受詞（painting classes）。動詞 (A) 和 (C) 不能在名詞後面做修飾。","vocab":"","paraphrase":""},"141":{"type":"名詞詞彙 掌握上下文","translation":"第 141 題：選出最適合填入閱讀文章第 141 處空格的選項。","reason":"句意是「您在規劃課程方面有許多＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到身為老師，「您」（Evans 小姐）會獨自決定要使用的材料，以及要教的概念，所以名詞 (A) flexibility（彈性）是正確答案。(B) assistance 表示「協助」，(C) restriction 表示「限制」，(D) demonstration 表示「示範操作」。","vocab":"","paraphrase":""},"142":{"type":"【引導修飾性語句的成分】副詞子句連接詞條件","translation":"第 142 題：選出最適合填入閱讀文章第 142 處空格的選項。","reason":"這個句子已經有具備主詞（This e-mail address）、動詞（is）和補語（the best way）的完整子句，所以 ~ interested 是修飾性的語句。修飾部分有動詞（are interested），所以需要填入能引導修飾子句的成分，而所有選項都是副詞子句連接詞，也都是可能的答案。因為要表達「要是您有興趣的話，這個電子郵件位址是聯絡我的最佳方式」，所以表示條件的副詞子句連接詞 (D) in case（假使……）是正確答案。(A) before 表示時間「在……之前」，(B) so that 表示目的「以便……」，(C) because 表示理由「因為……」。","vocab":"","paraphrase":""},"143":{"type":"【引導修飾性語句的成分】介系詞選擇 掌握上下文","translation":"第 143 題：選出最適合填入閱讀文章第 143 處空格的選項。","reason":"這個句子已經有具備主詞（The Sebastian Hill Hotel）和動詞（is going to be closed）的完整子句，所以 ~ June 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。後面的部分提到，由於 6 月是最繁忙時期的開始，所以在合作據點有足夠的臨時職缺可以提供，由此可知這間飯店應該是在 6 月暫時關閉，所以表示期間的 (C) throughout（在……的整個期間）是正確答案。(A) except for 表示例外「除了……」。(D) following 表示「在……之後」，雖然本身的意義是合理的，但用在這裡表示「飯店 6 月後關閉，而會請合作據點在 6 月提供臨時職缺」，不合邏輯。副詞子句連接詞 (B) as long as（只要……）引導修飾子句而不是片語。","vocab":"renovation n. 翻修　seasonal adj. 季節性的，季節的　job opening phr. 職缺　preference n. 偏好　branch n. 分公司，分店　fulfill v. 滿足，履行　consider v. 考慮","paraphrase":""},"144":{"type":"未來式 掌握上下文","translation":"第 144 題：選出最適合填入閱讀文章第 144 處空格的選項。","reason":"句意是「Sebastian Hill 的所有員工在 5 月 31 日之後開始工作」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到 6 月是最繁忙時期的開始，所以在合作據點有足夠的臨時職缺可以提供，而下一句說如果有偏好工作的飯店，要在本週結束之前告訴分公司經理，所以開始在合作據點工作是未來的事情，未來式 (A) will begin 是正確答案。現在完成式 (B) 表示過去事件的影響持續至今、剛完成的事或者過去經驗，所以不對。過去式 (C) 和過去進行式 (D) 不能表達未來發生的事。","vocab":"","paraphrase":""},"145":{"type":"名詞詞彙 掌握上下文","translation":"第 145 題：選出最適合填入閱讀文章第 145 處空格的選項。","reason":"句意是「他不能保證滿足任何＿＿，但會謹慎考慮」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到，如果有偏好工作的飯店，要在本週結束之前告訴分公司經理，由此可知分公司經理會考慮員工對於工作地點的要求，所以名詞 (C) requests（要求）是正確答案。(A) contract 表示「合約」，(B) commitment 表示「投入，奉獻」，(D) offer 表示「提議，提案」。","vocab":"","paraphrase":""},"146":{"type":"選出適當的句子","translation":"第 146 題：選出最適合填入閱讀文章第 146 處空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的部分提到如果有偏好工作的飯店，要在本週結束之前告訴分公司經理，而空格的上一句 He cannot promise to fulfill any (requests) but will consider them carefully. 則說他不能保證滿足任何要求，但會謹慎考慮，所以空格的內容應該和分配工作地點的結果有關，(D) All decisions about temporary work locations will be made by May 20 是正確答案。","vocab":"complain v. 抱怨　candidate n. 人選，候選者　temporary adj. 臨時的，暫時的","paraphrase":""},"147":{"type":"Not/True True 題型","translation":"關於《Global Engineering Monthly》（全球工程月刊），文中指出什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Global Engineering Monthly 有關的內容，並且對照選項判斷答案。(A)、(B)、(D) 在文章裡沒有提到。(C) 在 we've been the publication of choice for professionals in the engineering field 的部分 ","vocab":"tourism n. 觀光業　rental fee phr. 租賃費用　usage n. 使用","paraphrase":""},"171":{"type":"選擇句子位置","translation":"以下句子最適合插入文章標示的 [1]、[2]、[3]、[4] 哪個位置？","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「這意味著會有更多的手機服務需求」，所以應該會出現在和需要手機服務有關的部分。[4] 的上一句 The more visitors we have, the more phones there are 提到有越多來客，就會有越多手機。將句子填入 [4] 的位置之後，可以表達「有越多來客，就會有越多手機，這也意味著會有更多的手機服務需求」，文意通順，所以 (D) 是正確答案。","vocab":"shareholder n. 股東　cut down on phr. 削減……　packaging n. 包裝　lessen v. 減少　plastic foam phr. 發泡塑膠（保麗龍）　eliminate v. 排除，消除　shred v. 切碎　fragile adj. 易碎的，脆弱的　padding n. 墊充，填料　detergent n. 洗潔劑　container n. 容器　efficiently adv. 有效率地　competitor n. 競爭者，競爭業者","paraphrase":""},"172":{"type":"wh-問題 What","translation":"Turner 先生想要減少什麼？","reason":"這是問 Turner 先生想減少什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Turner want to reduce 有關的部分是 Bryce Turner 所說的 I'd like to find some ways to reduce the amount of non-recyclable packaging materials we use，他設想要找到一些減少不可回收包裝材料量的方法，所以 (B) 是正確答案。","vocab":"distribution network phr. 流通網絡","paraphrase":""},"173":{"type":"推論 細節資訊","translation":"關於 Meerson 公司，文中指出什麼？","reason":"這是和題目關鍵詞語 Meerson 有關的推論問題。Randy Poehler 在 only our fragile items need the extra padding. Our detergents ~ don't need any special protection. 的部分提到，只有易碎物品需要額外填充，洗潔劑則不需要任何特別保護，由此可以推知 Meerson 公司有些產品不需要填充物，所以 (D) 是正確答案。","vocab":"seek v. 尋求，尋找　cut v. 減少　warehouse n. 倉庫","paraphrase":""},"174":{"type":"推論 細節資訊","translation":"關於這些軟袋包裝，可以推知什麼？","reason":"這是和題目關鍵詞語 the pouches 有關的推論問題。Randy Poehler 在 Some of our competitors sell detergents in pouches that can be used to refill empty bottles. 的部分提到，有些競爭業者販賣可以用來填充空瓶的袋裝洗潔劑，然後又說 They're using plastic，表示競爭業者使用塑膠，由此可以推知袋子是用塑膠做的，所以 (A) 是正確答案。","vocab":"","paraphrase":""},"175":{"type":"掌握意圖","translation":"下午 2:39，Poehler 先生說「We could do the same」是什麼意思？","reason":"這一題問的是 Poehler 先生的訊息所表達的意圖，所以要掌握引用部分（We could do the same）前後文的情境。Poehler 先生說 Our detergents ~ come in plastic bottles ~，表示公司的洗潔劑裝在塑膠瓶裡，之後又提到 Some of our competitors sell detergents in pouches that can be used to refill empty bottles.，表示有些競爭業者販賣可以用來填充空瓶的袋裝洗潔劑，最後則表明 We could do the same.（我們可以做同樣的事），意味著他希望像競爭業者一樣使用袋裝補充包來裝洗潔劑，和目前的瓶裝不同，所以 (B) 是正確答案。","vocab":"cooperate with phr. 和……合作","paraphrase":""},"176":{"type":"尋找主題／目的 文章的主題","translation":"這則公告的主要主題是什麼？","reason":"這一題問的是公告（第一篇文章）的主題，所以要注意文章開頭的部分。Gold Frond Resorts ~ has chosen Gareth Sunderland as visitor services director at its newest property 的部分提到，Gold Frond 度假村選擇了 Gareth Sunderland 擔任最新設施的訪客服務主任，接下來的部分則是詳細說明將要升上這個職位的 Gareth Sunderland，所以 (C) 是正確答案。","vocab":"","paraphrase":""},"177":{"type":"Not/True Not 題型","translation":"根據公告，下列哪一項不是訪客服務主任的職責？","reason":"這是 Not/True 題型，要從公告（第一篇文章）中找出和關鍵詞語 a responsibility of the visitor services director 有關的內容，並且對照選項判斷答案。(A) 在 He will be in charge of our reservation ~ systems. 的部分提到，「他」（升職為訪客服務主任的 Sunderland 先生）將負責預約系統，符合選項敘述。(B) 在 he will help coordinate a range of fun pursuits for guests 的部分提到，Sunderland 先生將協助為住客安排一系列有趣的休閒活動，符合選項敘述。(C) 在 he will be responsible for staff training in order to ~ maintain quality service 的部分提到，Sunderland 先生將負責員工訓練，以維持高品質的服務，符合選項敘述。(D) 在文章中沒有提到，所以 (D) 是正確答案。\n變換表達方式\nbe in charge of our reservation ~ systems 負責預約系統 → Managing a booking system 管理預訂系統\ncoordinate ~ fun pursuits 安排有趣的休閒活動 → Organizing leisure activities 安排休閒活動","vocab":"handle v. 處理　facility n. 設施","paraphrase":""},"178":{"type":"推論 多篇文章對照題型","translation":"關於 Sunderland 先生，可以推知什麼？","reason":"這是需要對照兩篇文章內容的推論題型，先看介紹題目關鍵詞語 Mr. Sunderland 的公告。\n線索1：公告（第一篇文章）中，he has served as the front office manager at our island location 的部分提到，Sunderland 先生之前在「我們」（Gold Frond 度假村）的島嶼據點擔任客務部經理，但沒有寫出那個據點的名稱，所以還需要參考廣告的內容。\n線索2：廣告（第二篇文章）中，Vergual Paradise、occupies an entire island 的部分顯示 Vergual Paradise 佔據整座島。\n綜合這兩個線索，可知 Sunderland 先生之前受雇於 Vergual Paradise，所以 (C) 是正確答案。","vocab":"career n. 職業生涯　employ v. 雇用，使用　graduate v. 畢業","paraphrase":""},"179":{"type":"Not/True True 題型","translation":"關於 Gold Frond Resorts，何者正確？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Gold Frond Resorts 有關的內容，所以要看介紹 Gold Frond 度假村的廣告（第一篇文章）。(A) 在 Our original property; recently expanded to 315 rooms 的部分提到，Gold Frond 最初的據點最近擴建至 315 間客房，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章中沒有提到。\n變換表達方式\nexpanded to 315 rooms 擴建至 315 間客房 → increased its capacity 增加容納空間","vocab":"capacity n. 容量，容納的能力　establish v. 建立，設立","paraphrase":""},"180":{"type":"wh-問題 How","translation":"人們可以如何取得度假村活動的資訊？","reason":"這是問人們可以怎樣（How）獲得度假村活動資訊的 wh- 問題，所以要從和題目的關鍵詞語 people get information on resort activities 有關的廣告（第二篇文章）找出相關的內容。廣告中的 You can find information on activities available at each resort at www.goldfrondresorts.com 提到可以在網站找到每座度假村可提供活動的資訊，所以 (A) 是正確答案。","vocab":"travel agent phr. 旅行社代辦人員","paraphrase":""},"181":{"type":"推論 細節資訊","translation":"關於 Spin Genie 400，可以推知什麼？","reason":"這是要找出和題目關鍵詞語 the Spin Genie 400 相關內容的推論問題，所以要看提到 Spin Genie 400 的第一封電子郵件。I recently bought your company's Spin Genie 400 ~ and took it to a local bike shop for assembly 的部分提到，最近買了 FrameCaster Cycles 公司的 Spin Genie 400，並且把它帶到本地的腳踏車店組裝，由此可以推知可以購買未組裝的 Spin Genie 400 並自行組裝，所以 (A) 是正確答案。","vocab":"be made of phr. 以……製成　lightweight adj. 輕量的　special offer phr. 特別優惠","paraphrase":""},"182":{"type":"Not/True True 題型","translation":"關於 Mercado 先生，文中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Mr. Mercado 有關的內容，所以要看 Mercado 先生所寫的第一封電子郵件。(A) 在 I recently bought your company's Spin Genie 400 directly from your Web site 的部分提到，他最近在「貴公司」（FrameCaster Cycles）的網站直接購買了 Spin Genie 400，不符合選項敘述。(B) 和 (D) 在文章中沒有提到。(C) 在 I contacted your customer service department about the issue, and your representative informed me that I have two options. 的部分提到，Mercado 先生聯絡了 FrameCaster Cycles 的客服部，而客服專員告知他有兩個選擇，符合選項敘述，所以 (C) 是正確答案。","vocab":"express adj. 快捷的，快速的　a couple of phr. 兩個……，幾個……","paraphrase":""},"183":{"type":"尋找主題／目的 寫文章的理由","translation":"為什麼要寫第二封電子郵件？","reason":"這一題問的是寫第二封電子郵件的理由。I am sorry to hear about the problem with your recent purchase of a Spin Genie 400. I have looked into the issue and discovered that our representative gave you incorrect information. 的部分表明，很遺憾得知「您」（Mercado 先生）最近購買的 Spin Genie 400 的問題，並且已經深入了解這個問題，發現客服專員傳達了不正確的資訊，之後則是說明解決這個情況的辦法，所以 (B) 是正確答案。","vocab":"investigate v. 調查　attempt to do phr. 試圖做到……　validity n. 正當性　impose v. 強加，施加　penalty n. 處罰，罰款","paraphrase":""},"184":{"type":"wh-問題 多篇文章對照題型","translation":"Nora Santos 將做什麼？","reason":"這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 Nora Santos，要問 Nora Santos 將會做什麼（What），所以先看提到 Nora Santos 的第一封電子郵件。\n線索1：第一封電子郵件中，I contacted your customer service department ~ and your representative Nora Santos informed me that I have two options. 的部分提到，寄件者 Mercado 先生聯絡了 FrameCaster Cycles 的客服部，而專員 Nora Santos 告知他有兩個選擇，但沒提到 Nora Santos 將會做什麼，所以還需要參考第二封電子郵件的內容。\n線索2：第二封電子郵件中，I have looked into the issue and discovered that our representative gave you incorrect information. 的部分提到，寄件者 Estrada 小姐已經深入了解這個問題，並且發現專員（Nora Santos）傳達了不正確的資訊給 Mercado 先生，之後 I have informed our representative of the miscommunication, and she will undergo additional training 的部分說已經通知 Nora Santos 這個溝通不良的情況，而她會接受額外訓練。\n綜合這兩個線索，可知傳達了不正確的資訊給 Mercado 先生的 Nora Santos 將會接受額外訓練，所以 (B) 是正確答案。\n變換表達方式\nundergo additional training 接受額外訓練 → Get further training 接受進一步的訓練","vocab":"further adj. 進一步的 adv. 進一步地　salesperson n. 銷售員，業務員","paraphrase":""},"185":{"type":"wh-問題 What","translation":"根據第二封電子郵件，Mercado 先生已經收到什麼？","reason":"這是問根據第二封電子郵件，Mercado 先生得到了什麼（What）的 wh- 問題，要從中找出相關的內容。第二封電子郵件中的 I am attaching a voucher ~ that you may use on a future purchase of any FrameCaster accessory 提到，在這封信附上了未來購買任何 FrameCaster 配件時可以使用的 20 元優惠券，所以 (D) 是正確答案。","vocab":"partial adj. 部分的　directory n. 名錄，姓名住址簿","paraphrase":""},"186":{"type":"Not/True True 題型","translation":"備忘錄中關於訪客指出什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 the visitor 有關的內容，並且對照選項判斷答案，所以看提到會有訪客的備忘錄（第一篇文章）。(A) 在 As the reporter is directed through our halls, feel free to interact with her at your discretion. 的部分請員工在記者被帶領通過走廊的時候自由互動，不符合選項敘述。(B) 在文章中沒有提到。(C) 在 No photographs will be taken 的部分提到不會拍照片，符合選項敘述，所以 (C) 是正確答案。(D) 在 She is writing a short article about our office design and employee benefits. 的部分提到，她正在寫關於公司的辦公室設計與員工福利的短篇文章，不符合選項敘述。","vocab":"","paraphrase":""},"187":{"type":"推論 多篇文章對照題型","translation":"關於 Zhou 先生，可以推知什麼？","reason":"這是需要對照兩篇文章內容的推論題型，先看寄給題目的關鍵詞語 Mr. Zhou 的電子郵件。\n線索1：電子郵件（第二篇文章）中的 I will not be able to return to Sydney on March 1 due to a travel emergency. If I can visit on another date, please contact my assistant, Dennis Worley, at d.worley@thesydneyun.au 提到，「我」（Singh 小姐）因為旅行中的緊急情況而無法在 3 月 1 日回到雪梨，如果可以在其他日期參觀，就寄電子郵件聯絡助理 Dennis Worley。不過，從這裡看不出來 Zhou 先生是否有寄電子郵件給 Dennis Worley，所以還需要參考文章的相關內容。\n線索2：文章（第三篇文章）中的 I was able to see these for myself on March 4, when I was given a tour of the facilities. 提到，「我」（Singh 小姐）在 3 月 4 日接受了設施的導覽，而能夠親眼看到 Zazoo 軟體公司的這些休閒設施空間。\n綜合這兩個線索，可知因為 Zhou 先生寄了電子郵件給 Worley 先生討論時間安排，而讓 Singh 小姐可以改在 3 月 4 日參觀公司，所以 (C) 是正確答案。","vocab":"arrangement n. 安排　base v. 以……為基地　headquarters n. 總部","paraphrase":""},"188":{"type":"推論 多篇文章對照題型","translation":"Sanchez 小姐最有可能是什麼人？","reason":"這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Ms. Sanchez 出現的文章。\n線索1：文章（第三篇文章）中的 “We are currently in the final phase of designing our new software program,” Cathy Sanchez said while showing me the plan for the project. 提到，在讓記者看專案的計畫時，Cathy Sanchez 說他們目前在設計新軟體程式的最後階段。不過，這裡沒有具體說明 Sanchez 小姐是什麼人，所以還需要參考備忘錄中的相關內容。\n線索2：備忘錄（第一篇文章）中的 One of our senior executives will ~ introduce our latest software development plan to her. 提到，一位資深主管將會向記者簡單介紹最近的軟體開發專案。\n綜合這兩個線索，可知 Sanchez 小姐是向記者介紹最近軟體開發專案的資深主管，所以 (D) 是正確答案。","vocab":"","paraphrase":""},"189":{"type":"wh-問題 What","translation":"根據文章，在 Zazoo Software 的工作環境中有什麼好處？","reason":"這是問根據文章（第三篇文章），Zazoo 軟體公司工作環境的一項好處是什麼（What）的 wh- 問題。文章中的 All these facilities help employees perform at high levels of efficiency, and I could see that this was true during my time at the office. 提到，這些設施全都能幫助員工有高效率的表現，而在參觀辦公室的時候，可以看到這一點是真的，所以 (C) 是正確答案。\n變換表達方式\nhelp employees perform at high levels of efficiency 幫助員工有高效率的表現 → improves the performance of staff 改善員工的表現","vocab":"cooperation n. 合作　injury n. 受傷","paraphrase":""},"190":{"type":"Not/True Not 題型","tran function csvCell(x){const t=String(x??'');return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function parseCsv(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quotes=false;for(let i=0;i<text.length;i++){let c=text[i];if(quotes){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quotes=false;else field+=c}else if(c==='"')quotes=true;else if(c===','){row.push(field);field=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(quotes)throw Error('CSV 引號未關閉');row.push(field);if(row.some(x=>x!==''))rows.push(row);return rows}

$('#importCsv').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCsv(await file.text());if(!rows.length||rows[0].slice(0,6).join('|')!==CSV_HEADER.join('|'))throw Error('欄位格式不符，請使用本網站匯出的 CSV');const incoming={};for(let i=1;i<rows.length;i++){const r=rows[i],id=Number(r[0]),q=QS.find(x=>x.id===id),choice=(r[2]||'').trim();if(r.length<6||!q||!/[A-D]/.test(choice)||choice.length!==1||String(q.part)!==r[1].trim())throw Error('第 '+(i+1)+' 列的題號、Part 或選項有誤');if(r[3].trim()!==q.answer)throw Error('第 '+(i+1)+' 列答案版本不同，已停止匯入');incoming[id]={choice,correct:q.answer?choice===q.answer:null,at:r[5]||''}}const count=Object.keys(incoming).length;if(!confirm('CSV 有 '+count+' 筆有效作答紀錄。匯入後會覆蓋相同題號的現有作答，其餘題目保留。是否繼續？'))return;await window.toeicCloud.importAnswers(incoming);mode='all';index=0;setTabs();render();alert('已成功匯入 '+count+' 筆紀錄。')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};render();

<script>
/* Browser-offline fallback: Firebase is optional, local practice always works. */
(function(){
  if(window.toeicCloud) return;
  function persist(){
    localStorage.setItem(LOCAL_KEY,JSON.stringify(records));
    localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));
    localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts));
  }
  window.toeicCloud={ready:true,mode:'local',
    saveAnswer:async(id,data)=>{records[id]=data;persist();render()},
    deleteAnswer:async(id)=>{delete records[id];persist();render()},
    setStar:async(id,marked)=>{if(marked)stars[id]=true;else delete stars[id];persist();render()},
    saveExcerpts:async(id,items)=>{if(items.length)excerpts[id]=items;else delete excerpts[id];persist();render()},
    importAnswers:async(items)=>{records={...records,...items};persist();render()},
    resetAnswers:async()=>{records={};persist();render()}
  };
})();
</script>
