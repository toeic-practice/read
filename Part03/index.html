const DATA={"questions":[{"id":101,"part":5,"stem":"Ms. Ortega ______ a financial advisor to seek help with her investment portfolio.","choices":["consulting","consultation","consulted","consulter"],"answer":"C","explanation":"正確答案：(C) consulted"},{"id":102,"part":5,"stem":"Minors are welcome to attend the concert ______ must be accompanied by a parent or guardian.","choices":["so","for","with","but"],"answer":"D","explanation":"正確答案：(D) but"},{"id":103,"part":5,"stem":"Ms. Conner did not win the Employee of the Year Award because a colleague's sales record was better than ______ .","choices":["hers","herself","her","she"],"answer":"A","explanation":"正確答案：(A) hers"},{"id":104,"part":5,"stem":"Everyone at yesterday's seminar ______ to put their electronic devices in silent mode.","choices":["asking","was asked","is asked","would ask"],"answer":"B","explanation":"正確答案：(B) was asked"},{"id":105,"part":5,"stem":"Ruby Cakes' staff handed out ______ samples of baked goods to celebrate the grand opening.","choices":["proportional","complimentary","contradictory","intensive"],"answer":"B","explanation":"正確答案：(B) complimentary"},{"id":106,"part":5,"stem":"Ms. Koenig agreed to transfer to Norway for a year, believing it would be an excellent learning ______ .","choices":["compensation","feature","relationship","opportunity"],"answer":"D","explanation":"正確答案：(D) opportunity"},{"id":107,"part":5,"stem":"The script for the film adaptation of the best-selling novel Vaunted was taken ______ from the book.","choices":["directly","direction","directing","director"],"answer":"A","explanation":"正確答案：(A) directly"},{"id":108,"part":5,"stem":"A photography exhibition entitled The Awakening is currently ______ in the Pulsen Gallery's main hall.","choices":["expressed","transformed","displayed","reflected"],"answer":"C","explanation":"正確答案：(C) displayed"},{"id":109,"part":5,"stem":"The municipal government has promised that it will take ______ to reduce downtown traffic.","choices":["acting","action","activation","activists"],"answer":"B","explanation":"正確答案：(B) action"},{"id":110,"part":5,"stem":"Soft drink manufacturer Fizz Life ______ a backlash from customers after changing its recipe for Ricochet Cola last year.","choices":["was faced","has been faced","faced","to face"],"answer":"C","explanation":"正確答案：(C) faced"},{"id":111,"part":5,"stem":"As a branch manager, Mr. Finley finds resolving staff conflicts ______ of his duties.","choices":["difficult","more difficult","the most difficult","difficultly"],"answer":"C","explanation":"正確答案：(C) the most difficult"},{"id":112,"part":5,"stem":"The dinner plates and utensils manufactured by Tessio are suitable for any ______ .","choices":["leisure","occasion","performance","effect"],"answer":"B","explanation":"正確答案：(B) occasion"},{"id":113,"part":5,"stem":"The Villier Resort struggles to attract visitors these days, but it was ______ a very popular vacation destination.","choices":["about","once","last","as"],"answer":"B","explanation":"正確答案：(B) once"},{"id":114,"part":5,"stem":"The bank's loan officer determined how much money Ms. Demers would be eligible to ______ for her new home.","choices":["purchase","borrow","earn","donate"],"answer":"B","explanation":"正確答案：(B) borrow"},{"id":115,"part":5,"stem":"The manager decided to provide the employees with additional training, ______ their weaknesses.","choices":["addressing","addressed","address","addresses"],"answer":"A","explanation":"正確答案：(A) addressing"},{"id":116,"part":5,"stem":"Contributing to discussions ______ meetings is a good way to show initiative.","choices":["from","along","against","during"],"answer":"D","explanation":"正確答案：(D) during"},{"id":117,"part":5,"stem":"Business owners in the town have been ______ to keep their shops open after 7 p.m.","choices":["optimal","reluctant","elaborate","preferable"],"answer":"B","explanation":"正確答案：(B) reluctant"},{"id":118,"part":5,"stem":"Ms. Diaz will be able to attend the conference ______ her train arrives on time.","choices":["as long as","otherwise","as a result of","by means of"],"answer":"A","explanation":"正確答案：(A) as long as"},{"id":119,"part":5,"stem":"Although Mr. Miller had been given clear directions to the conference venue, he drove right ______ it.","choices":["toward","over","past","out"],"answer":"C","explanation":"正確答案：(C) past"},{"id":120,"part":5,"stem":"Participants at the swimming competition will be divided into four different age ______ .","choices":["categorizes","categorical","categorized","categories"],"answer":"D","explanation":"正確答案：(D) categories"},{"id":121,"part":5,"stem":"New recruits are required to join a training course ______ they have relevant work experience.","choices":["in spite of","even if","as though","in case"],"answer":"B","explanation":"正確答案：(B) even if"},{"id":122,"part":5,"stem":"All the team members will be traveling together aside from Ms. Bateman, who will be flying out ______ tomorrow.","choices":["physically","partially","separately","commonly"],"answer":"C","explanation":"正確答案：(C) separately"},{"id":123,"part":5,"stem":"The office expansion will be approved if the suggested budget is ______ to investors.","choices":["ready","permanent","definite","acceptable"],"answer":"D","explanation":"正確答案：(D) acceptable"},{"id":124,"part":5,"stem":"A company that adopts telecommuting practices allows its staff members to work ______ their location.","choices":["regardless of","rather than","on behalf of","in exchange for"],"answer":"A","explanation":"正確答案：(A) regardless of"},{"id":125,"part":5,"stem":"The head chef of a restaurant takes care of a ______ of tasks, including menu planning.","choices":["condition","variety","notification","renewal"],"answer":"B","explanation":"正確答案：(B) variety"},{"id":126,"part":5,"stem":"Ms. Turner downloaded a free trial version of the program ______ she could test its features.","choices":["as if","so that","in order to","because of"],"answer":"B","explanation":"正確答案：(B) so that"},{"id":12 erence"],"answer":"C","explanation":"正確答案：(C) vehicle","group":"135-138"},{"id":136,"part":6,"stem":"請選擇最適合填入文章第 136 號空格的選項。","choices":["issue","renew","cancel","present"],"answer":"D","explanation":"正確答案：(D) present","group":"135-138"},{"id":137,"part":6,"stem":"請選擇最適合填入文章第 137 號空格的選項。","choices":["This should occur about half an hour prior to departure.","It is advisable to remain seated while the ferry is docking.","Please check our Web site for changes to travel schedules.","Parking permits are available at Swansea Ferries' main office."],"answer":"A","explanation":"正確答案：(A) This should occur about half an hour prior to departure.","group":"135-138"},{"id":138,"part":6,"stem":"請選擇最適合填入文章第 138 號空格的選項。","choices":["aside","between","onto","throughout"],"answer":"C","explanation":"正確答案：(C) onto","group":"135-138"},{"id":139,"part":6,"stem":"請選擇最適合填入文章第 139 號空格的選項。","choices":["position","trend","focus","criticism"],"answer":"C","explanation":"正確答案：(C) focus","group":"139-142"},{"id":140,"part":6,"stem":"請選擇最適合填入文章第 140 號空格的選項。","choices":["His course, which was intended for professionals, took place on the final day.","So far, sales of the item have failed to live up to his high expectations.","The admission fee has been raised by €5 due to the venue rental cost.","Critics in attendance agreed that they were unlike anything else on display."],"answer":"D","explanation":"正確答案：(D) Critics in attendance agreed that they were unlike anything else on display.","group":"139-142"},{"id":141,"part":6,"stem":"請選擇最適合填入文章第 141 號空格的選項。","choices":["modern","spacious","historic","spotless"],"answer":"A","explanation":"正確答案：(A) modern","group":"139-142"},{"id":142,"part":6,"stem":"請選擇最適合填入文章第 142 號空格的選項。","choices":["succeeded","success","succeeds","successful"],"answer":"B","explanation":"正確答案：(B) success","group":"139-142"},{"id":143,"part":6,"stem":"請選擇最適合填入文章第 143 號空格的選項。","choices":["itself","yours","them","theirs"],"answer":"C","explanation":"正確答案：(C) them","group":"143-1 ailable in November.","group":"186-190"},{"id":187,"part":7,"stem":"Which feature of the Lawrence Tower unit does NOT meet Mr. Hasbun's requirements?","choices":["Floor number","Parking conditions","Number of bedrooms","Square footage"],"answer":"B","explanation":"正確答案：(B) Parking conditions","group":"186-190"},{"id":188,"part":7,"stem":"Which property is not in Lakeview?","choices":["Georgian Apartments","Peterson Residences","Lawrence Tower","Sunnyside Apartments"],"answer":"D","explanation":"正確答案：(D) Sunnyside Apartments","group":"186-190"},{"id":189,"part":7,"stem":"What did some of Mr. Kern's renters do?","choices":["Asked to extend their lease","Helped to refurbish a building","Spoke to a newspaper reporter","Volunteered at a community center"],"answer":"B","explanation":"正確答案：(B) Helped to refurbish a building","group":"186-190"},{"id":190,"part":7,"stem":"What is suggested about Sunnyside Apartments?","choices":["Some of the units are currently vacant.","It has not increased rents in decades.","It is managed by a corporation.","Some rentals are fully furnished."],"answer":"A","explanation":"正確答案：(A) Some of the units are currently vacant.","group":"186-190"},{"id":191,"part":7,"stem":"What is NOT true about the Winwright Gallery?","choices":["It added a section for exhibiting the work of new artists.","It is offering free tours to all visitors.","It underwent some construction work.","It is adjacent to a public square."],"answer":"B","explanation":"正確答案：(B) It is offering free tours to all visitors.","group":"191-195"},{"id":192,"part":7,"stem":"What does the Web page mention about the Enthusiast membership?","choices":["It is recommended for emerging artists.","It grants access to advance viewing of exhibits.","It includes discounts at partner museums.","It has to be paid for on a monthly basis."],"answer":"B","explanation":"正確答案：(B) It grants access to advance viewing of exhibits.","group":"191-195"},{"id":193,"part":7,"stem":"What is indicated about Colum 's order?","choices":["It was sent to a residence.","It was also ordered the year before.","It was delivered within two days.","It was labeled incorrectly."],"answer":"C","explanation":"正確答案：(C) It was delivered within two days.","group":"196-200"}],"groups":{}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 131–134 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>BUSINESS LETTER<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><p>December 8<\/p><p>Dear Ms. Ambrosio,<\/p><p>We are very selective about the products we provide our guests here at Dane County Resort. However, we were surprised with the toothpaste sample you sent us. <strong class=\"blank-number\">131<\/strong> having a refreshing scent, it was gentler on the gums than many of the other brands we've tried.<\/p><p>Therefore, we've <strong class=\"blank-number\">132<\/strong> to include your toothpaste in our new hotel toiletries package. This decision means that it will be provided to all of our guests on a daily basis. <strong class=\"blank-number\">133<\/strong>, we would like you to ship us 500 units for January. <strong class=\"blank-number\">134<\/strong> As we intend on repeating this order in the future, we would also like to know whether a discount can be applied.<\/p><p>Yours truly,<br>Teddy Lawrence<br>General Manager<br>Dane County Resort<\/p><\/div><\/section><\/div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 135–138 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>TRAVEL INFORMATION<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><h2>Swansea Ferries<\/h2><div class=\"notice-content\"><h2>Advice for Passengers<\/h2><p>When you arrive at Swansea Terminal, follow the signs to the <strong class=\"blank-number\">135<\/strong> check-in booth. Here, an officer will check your booking number, and you will be provided with a boarding card indicating the section of the ferry you will be parking in. If you are traveling to an international destination, you will also need to <strong class=\"blank-number\">136<\/strong> your passport at this time. If you are traveling domestically, however, you will be asked to show your driver's license instead. Before boarding time, there will be an announcement. <strong class=\"blank-number\">137<\/strong> You should proceed to the boarding lane, where staff will help guide your car <strong class=\"blank-number\">138<\/strong> the ferry.<\/p><\/div><\/div><\/section><\/div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 139–142 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>MAGAZINE ARTICLE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><h2>Young African Designer Wins Acclaim<\/h2><div class=\"byline\">Futuristic Furniture Magazine · By Rhonda Thiessen<\/div><p>In the weeks leading up to this year's Basel Decor Fair, veteran designers received most of the media attention. But once the event started, the <strong class=\"blank-number\">139<\/strong> suddenly shifted to a little-known designer, Harry Mashaba. He was showing his creations at a space in the main hall. <strong class=\"blank-number\">140<\/strong><\/p><p>“Mr. Mashaba's work is very unique. He's managed to update traditional South African furniture so that it's attractive and convenient for people today,” said Lara Dahn, a fair organizer. “His pieces fit perfectly in a <strong class=\"blank-number\">141<\/strong> living room.”<\/p><p>Owing to his <strong class=\"blank-number\">142<\/strong> at the fair, Mr. Mashaba has been hired to design a dining set for Swiss furniture maker Rulesten. It will be released in Europe this fall.<\/p><\/div><\/section><\/div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 143–146 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">ENTERTAINMENT · STREAMING<\/div><h2>AVENUU<\/h2><p>Stream what you love.<\/p><\/div><p>Introducing Avenuu, the best streaming service out there. See hundreds of popular TV series, movies, kids' shows, and live concerts. Stream <strong class=\"blank-number\">143<\/strong> in high quality on any device, including smartphones, tablets, and computers. Avenuu also gives you recommendations based on your <strong class=\"blank-number\">144<\/strong>. The more you use it, the more we learn what you like. So, stop scrolling through menus and <strong class=\"blank-number\">145<\/strong> your time. Sign up today to watch high-quality content.<\/p><p><strong class=\"blank-number\">146<\/strong> Try our ad-supported service for $5.99 a month, or go ad-free for $10.99 a month. Visit www.avenuu.com today!<\/p><\/div><\/section><\/div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 147–148 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>STAFF NOTICE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"notice-content\"><h2>STAFF ENTRANCE NOTICE<\/h2><p>The staff entrance of Wilson Mall was damaged by last week's storm and will be repaired on August 2. Mall employees may enter using the emergency exit on the south side of the building. Your identification badges will be automatically updated in the security system to give you access to this door. Swipe your badge at this entrance as you normally would. Note, though, that you will not be able to enter the mall at this location after August 2.<\/p><\/div><\/div><\/section><\/div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 149–150 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>All staff<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Eun-jung Cho<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>3 November<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>Cornerstone Solutions Account<\/span><\/div><\/div><p>Dear colleagues,<\/p><p>We are in the midst of achieving one of our goals for this year. Senior officials from Cornerstone Solutions will be coming in next week to discuss details and, hopefully, to sign a contract. If they sign with us, we will have a multimillion-dollar account on our hands. This would mean increased revenue along with more responsibilities. We would either need to hire extra temporary staff or expand the duties of current staff. Further details will be discussed in our scheduled meeting tomorrow. If you are interested in handling this new account, please e-mail me so that I can send you a preliminary overview of what the position will involve. That way, you will be able to look through the information before tomorrow's meeting.<\/p><p>Thanks,<br>Eun-jung Cho<br>Director, Cho &amp; Associates<\/p><\/div><\/section><\/div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 151–152 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>TEXT MESSAGES<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"conversation\"><div class=\"bubble \"><div class=\"bubble-meta\"><b>Farrah Keller<\/b><time>10:43 A.M.<\/time><\/div><p>I just spoke to Janice Catering regarding tonight's event. They are running late due to another client. They can't deliver the food until 6:30 P.M.<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Teddy Park<\/b><time>10:45 A.M.<\/time><\/div><p>Oh, but we are supposed to start serving appetisers at 6 P.M.<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Farrah Keller<\/b><time>10:46 A.M.<\/time><\/div><p>How about we pick up the food ourselves?<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Teddy Park<\/b><time>10:47 A.M.<\/time><\/div><p>Smart! Can you ask them if that's possible?<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Farrah Keller<\/b><time>10:49 A.M.<\/time><\/div><p>I'll do that right away. I can also ask for a price reduction based on our contract.<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Teddy Park<\/b><time>10:51 A.M.<\/time><\/div><p>OK. Let me know what they say. In the meantime, I'll get the company truck ready.<\/p><\/div><\/div><\/div><\/section><\/div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 153–154 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-flyer\"><div class=\"doc-ribbon\"><span>EVENT LISTING<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">ATHENS COLLEGE · EVENT LISTING<\/div><h2>Artist Spotlight<\/h2><\/div><p>While our last few Artist Spotlight events have featured accomplished painters, this month's guest will be a self-taught animator named Grant Marek. He will present his latest film, Coloratura, which was screened at the Global Animation Festival. The Georgia Sentinel calls Mr. Marek's newest movie \"an uplifting and masterful interplay of sight and sound.\" The film screening will include a live narrator and sound effects, and a quartet of musicians led by professor Wallace Herbert. After the screening, audience members will have a chance to ask Mr. Marek questions about his film. He will also participate in a panel discussion a day after the screening on Friday, February 12, at 7 p.m. in the Watkins Auditorium.<\/p><p>Admission: Free and Open to the Public<br>Date and time: Thursday, February 11, at 6:30 p.m.<br>Venue: Charles Theater<\/p><div class=\"notice-emphasis\"><b>PUBLIC EVENT<\/b><span>Thursday, February 11 · 6:30 P.M. · Charles Theater · FREE<\/span><\/div><\/div><\/section><\/div>","155-157":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 155–157 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>TRAVEL ADVERTISEMENT<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">CALIFORNIA NATIONAL PARKS<\/div><h2>Palm Creek Tours<\/h2><\/div><p>No visit to California is complete without a trip to one of its dozen national parks. Each year, millions of visitors from around the world come to enjoy the state's stunning natural vistas and wide range of outdoor activities. — [1] —<\/p><p>Palm Creek Tours specializes in planning fully customizable tours of California's national parks. We offer everything from single-day packages to multiday trips to one or more locations. — [2] —. You can sleep in a tent, in a five-star resort, or anything in between. Should you require a guide for any activity, we can arrange one for you at an added cost. Our multilingual guides can help you and your companions feel comfortable and ensure that your trip goes smoothly. — [3] —.<\/p><p>Tour packages start at $150 per person for a single-day trip including meals and transportation. All packages require a minimum of four people. — [4] —. Call Palm Creek Tours today at 555-8012, or visit www.palmcreektours.com.<\/p><\/div><\/section><\/div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 158–160 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-brochure\"><div class=\"doc-ribbon\"><span>SERVICE BROCHURE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">REPAIR · MAINTENANCE · SUPPLIES<\/div><h2>Biz-Equip Repair Services<\/h2><\/div><p>The cost of replacing broken or malfunctioning office equipment can be high! Before you rush out to buy a new printer, photocopier, projector, computer, or other office device, call Biz-Equip Repair Services!<\/p><p>Equipment Repair<\/p><p>We have a team of experienced specialists who can visit to check your machine. If it's possible to fix your item on the spot, we will. If it requires major repairs, your equipment will be taken to our service center and returned to you in good working order. Most types of repairs are done within just 48 hours!<\/p><p>Equipment Maintenance<\/p><p>Biz-Equip also provides companies and other organizations with regular maintenance services. Our technicians can conduct weekly inspections of your equipment to ensure that everything is functioning properly.<\/p><p>Equipment Cartridge Supply<\/p><p>In addition, Biz-Equip has a selection of ink and toner cartridges that fit most office printers and photocopiers. Prices vary according to brand and type. For details, visit www.bizequiprepairservices.com/products.<\/p><p>To book an appointment with a technician, call our toll-free number at 1-800-555-9288. Provide the address of your office or business establishment, and we'll send someone as soon as possible.<\/p><\/div><\/section><\/div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 161–164 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>NEWS ARTICLE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><h2>Murals Bring Life and Color to Downtown Core<\/h2><p>Charlotte, October 19— When the city of Charlotte launched a mural program last June in the downtown core, the idea was to revitalize and brighten up the area. The large, artistic images are being painted directly onto building walls and are nearing completion. — [1] —. Plans call for all the murals to be finished within two months. The project has transformed the city center into an outdoor art gallery, and it will be important to maintain all the artwork. The Axon Arts Group is in charge of the project and will also be under contract for the next five years to maintain the murals. — [2] —.<\/p><p>Axon Arts Group was chosen to carry out the project as it has been holding art workshops at local schools and community centers for the past 20 years. — [3] —. The group was eager to accept the offer when it was first proposed by Charlotte's planning committee last spring. \"Many local artists are excited about this project,\" said Axon Arts Group cofounder Matthew Stewart. \"It's a once-in-a-lifetime opportunity for many of them.\" The initial funding was a $50,000 grant supplied by the Community Initiative Foundation. — [4] —. The Charlotte Tourism Board matched that contribution shortly thereafter. \"Now when people come to visit our city,\" said Tourism Board director Jill Myers, \"they'll see it bursting with positivity and inspiration, and they'll want to come back.\"<\/p><\/div><\/section><\/div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 165–167 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>All employees &lt;staff@portlandvalleyjournal.com&gt;<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Isaac Dyer &lt;isdyer@portlandvalleyjournal.com&gt;<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>January edition<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>December 2<\/span><\/div><\/div><p>Hello, everyone.<\/p><p>Our January edition is always special because it sets the tone for our magazine for the rest of the year. I have already started working on the layout for our articles and features. The head reporters and I agreed that it would be good to have more interaction between our staff and readers next year. So, the January cover will be determined through a photography competition that both our readers and employees can take part in. I've already sent out a press release to the local paper about it. I will also put up the contest rules and guidelines on our Web site by the end of the day.<\/p><p>As I mentioned, the competition will be open to employees. Unfortunately, this does not apply to our photographers as they would have an unfair advantage. However, I talked with Brianna Griffin, our lead photographer, and we decided that they can serve as contest judges. There is no prize other than the winning photo being featured on the cover.<\/p><p>I hope everyone takes part if they can. Please e-mail your submission to me by December 10. The winner will be announced on December 20.<\/p><p>Good luck!<\/p><p>Isaac Dyer, Managing Editor<br>Portland Valley Journal<\/p><\/div><\/section><\/div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 168–171 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>ONLINE CHAT<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"conversation\"><div class=\"bubble \"><div class=\"bubble-meta\"><b>Lenny Vogler<\/b><time>11:57 A.M.<\/time><\/div><p>Hi, everyone. I'm worried that our online marketing isn't working. Is there a way for us to improve our online visibility?<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Dorothy Hughes<\/b><time>11:57 A.M.<\/time><\/div><p>What about expanding our social media page?<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Lenny Vogler<\/b><time>11:58 A.M.<\/time><\/div><p>Our social media page hasn't been very successful in getting images of our products out there for consumers to see. Pictures really help in promoting our product lines.<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Burl Seaver<\/b><time>11:58 A.M.<\/time><\/div><p>Perhaps we should start a Momento-Pic account. It's a photo-sharing application people use to share and comment on pictures. It would also allow us to post links to our social media page.<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Anya Pearson<\/b><time>11:59 A.M.<\/time><\/div><p>I've heard of that. But businesses have to pay a fee.<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Lenny Vogler<\/b><time>11:59 A.M.<\/time><\/div><p>If the monthly fee is reasonable, it should be within our marketing budget. Should we go ahead and set up an account?<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Burl Seaver<\/b><time>12:00 P.M.<\/time><\/div><p>We may also want to check out other popular image-sharing applications before we do that.<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Dorothy Hughes<\/b><time>12:01 P.M.<\/time><\/div><p>I agree. There are other image-sharing programs that have even more subscribers than Momento-Pic.<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Lenny Vogler<\/b><time>12:02 P.M.<\/time><\/div><p>I see. Well, could I get one of you to come up with a list of applications that could be beneficial to join? Please also find out about their fees and functions.<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Anya Pearson<\/b><time>12:03 P.M.<\/time><\/div><p>I can take care of that right now. I'll send you an e-mail with the information this afternoon.<\/p><\/div><\/div><\/div><\/section><\/div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 172–175 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>CLASS SCHEDULE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">NEW CLASSES · WEEK OF MAY 11<\/div><h2>Anderson Community Center<\/h2><\/div><p>Looking to learn a new skill or start a new hobby? Check out what's coming to the Anderson Community Center starting from the week of May 11!<\/p><div class=\"course-grid\"><div class=\"course-card\"><h3>Baking Extravaganza<\/h3><div class=\"course-time\">Mondays, 6–8 P.M., $35 per session<\/div><p>Discover how to make simple baked goods from one of the city's pastry chefs. Each week, we learn a new recipe with a different guest teacher. All ingredients are provided.<\/p><\/div><div class=\"course-card\"><h3>Piano for Adults<\/h3><div class=\"course-time\">Tuesdays, 5–6 P.M., $15 per session<\/div><p>Learn the basics of playing the piano from classical pianist Susan Dickinson. No experience is necessary. No materials are required.<\/p><\/div><div class=\"course-card\"><h3>Short Story Writing<\/h3><div class=\"course-time\">Wednesdays, 7–9 P.M., $25 per session<\/div><p>Develop your writing skills with published author William Davis. This engaging weekly seminar is intended for novice writers. Please bring a pen and paper or a laptop computer.<\/p><\/div><div class=\"course-card\"><h3>Introductory Knitting<\/h3><div class=\"course-time\">Thursdays, 5:30–7 P.M., $30 per session<\/div><p>Make gloves, scarves, socks, and many other items in this crafting class taught by Paula Booker. Yarn and equipment are provided. However, if you prefer to knit with a specific color of yarn, you are welcome to bring your own.<\/p><\/div><\/div><\/div><\/section><\/div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 176–180 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>BUSINESS NEWS<\/span><small>DOCUMENT 1 / 2<\/small><\/div><div class=\"document-body\"><h2>Colfer Inc.'s Fruit Juice Sales Dry Up<\/h2><p>Beverage manufacturer Colfer Inc. experienced a 12 percent decline in fruit juice sales between July and September this year. According to company representative Fred Hines, multiple factors contributed to the decline in sales of these products, which typically account for over $500,000 of the company's annual profits. \"The summer was not as warm as normal, so fewer people bought our juices to cool down,\" he said. \"Furthermore, some of Colfer's juice drinks rose in price due to an increase in the cost of ingredients. The price of grapes, for example, has gone up, so the manufacturing cost of our grape-flavored beverages has as well,\" Mr. Hines explained.<\/p><p>An increase in competition has also affected Colfer Inc.'s sales. Colfer Inc. and other large companies are losing ground to smaller brands that offer healthier alternatives. In fact, research data has indicated that natural juices with no added sugar have been continually increasing in popularity. In an attempt to address changing consumer preferences, Colfer Inc. has begun establishing affiliations with a large number of fast-growing companies that make healthy foods and beverages. It has also replaced the blue bottles its fruit juices have long been packaged in with redesigned red ones. The company believes that this will help to change its brand image.<\/p><\/div><\/section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>INTERNAL MEMO<\/span><small>DOCUMENT 2 / 2<\/small><\/div><div class=\"document-body\"><div class=\"memo-title\"><strong>COLFER INC.<\/strong>INTERNAL MEMO<\/div><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>Colfer Inc. board of directors<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Carl Bryant, president, Colfer Inc.<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>Changes<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>November 30<\/span><\/div><\/div><p>I know that the last few months have been difficult, but I'm confident that we're getting back on track. Our affiliation with Friendly Farm Foods and Natgreen Cereals has helped in this regard, but I think that Colfer Inc. will ultimately need to change with the times. Therefore, at our meeting this week, I'd like to discuss developing new flavors and expanding the price range of our products. Also, I think we need to reintroduce our original juice bottles as the new color and design have not been popular with consumers. Let's focus on offering unique, high-quality products. That's how we'll meet our goals for the coming year.<\/p><\/div><\/section><\/div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 181–185 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL<\/span><small>DOCUMENT 1 / 2<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>George Billings &lt;g.billings@southernbakedgoods.com&gt;<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Lane Emerson &lt;l.emerson@gourmetdessert.com&gt;<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>RE: Gourmet Dessert Fair<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>October 27<\/span><\/div><\/div><p>Dear Mr. Billings,<\/p><p>Thank you for your interest in selling cakes at the 16th Gourmet Dessert Fair, which has earned the distinction of being the largest and most successful event of its kind. To answer your question, a space costs $55 regardless of size unless you are a member of the Canadian Specialty Food Association (CSFA). For members, the price is $45. Also, all sellers can enjoy the free use of a computer and access to our Privileged Vendor program, through which sellers are introduced to potential buyers.<\/p><p>Please note that the prices above are for priority booking and only apply to applications and payments sent to us by November 30. In December, booth charges increase to $65 for members and $75 for nonmembers.<\/p><p>Sincerely,<br>Lane Emerson<br>Event Coordinator<\/p><\/div><\/section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>REGISTRATION FORM<\/span><small>DOCUMENT 2 / 2<\/small><\/div><div class=\"document-body\"><div class=\"stationery-brand\">16th Gourmet Dessert Fair<small>January 4 to 8 | Vancouver, Canada<\/small><\/div><div class=\"table-wrap\"><table><thead><tr><th>Registration field<\/th><th>Details<\/th><\/tr><\/thead><tbody><tr><td>Business<\/td><td>Southern Baked Goods<\/td><\/tr><tr><td>Representative<\/td><td>George Billings<\/td><\/tr><tr><td>Telephone<\/td><td>555-5497<\/td><\/tr><tr><td>E-mail<\/td><td>g.billings@southernbakedgoods.com<\/td><\/tr><\/tbody><\/table><\/div><div class=\"form-section\"><b>☒ Mark here if you are a CSFA member<\/b><\/div><div class=\"form-section\"><b>Booth preference<\/b><div class=\"choice-row\"><span>☐ Standard<\/span><span>☐ Double<\/span><span>☒ Corner<\/span><\/div><p>Only priority bookings are guaranteed their booth preferences. All booths include a table, chairs, and signage.<\/p><\/div><div class=\"form-section\"><b>Optional Inclusions<\/b><div class=\"choice-row\"><span>☐ Exhibitor lunch (January 8)<\/span><span>☒ Privileged Vendor program<\/span><\/div><\/div><div class=\"table-wrap\"><table><thead><tr><th>Payment<\/th><th>Details<\/th><\/tr><\/thead><tbody><tr><td>Payment Enclosed<\/td><td>$45.00<\/td><\/tr><tr><td>Date of Registration<\/td><td>November 16<\/td><\/tr><\/tbody><\/table><\/div><p>All checks must be payable to the Gourmet Dessert Fair.<\/p><\/div><\/section><\/div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 186–190 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL 1<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>Fiona Bezark &lt;fiona.bezark@wallacerealty.com&gt;<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Ronald Hasbun &lt;rhasbun@myemail.com&gt;<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>Rental Property<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>October 12<\/span><\/div><\/div><p>Dear Ms. Bezark,<\/p><p>Thank you for taking the time to speak with me on the phone yesterday. As I mentioned, I am looking for an apartment in the Lakeview neighborhood with a lease starting December 1. My current apartment is approximately 1,200 square feet. I need a larger place with at least two bedrooms and two bathrooms. I would also prefer an apartment that is located on the first or second floor and has an assigned parking space.<\/p><p>I will be out of town on business for all of November, so I was hoping to see some apartments this month. My schedule is fairly flexible since I work from home as a freelance journalist. Please let me know what times and dates might work best for you.<\/p><p>Sincerely,<br>Ronald Hasbun<\/p><\/div><\/section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL 2 · PROPERTY COMPARISON<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>Ronald Hasbun &lt;rhasbun@myemail.com&gt;<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Fiona Bezark &lt;fiona.bezark@wallacerealty.com&gt;<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>RE: Rental Property<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>October 15<\/span><\/div><\/div><p>Mr. Hasbun,<\/p><p>Thank you for your recent inquiry regarding available apartments. I have four properties in mind that I think might work for you. Below is a list of basic information about each one. One meets all of your requirements, while the others have a few of the aspects you requested. All except one are in your desired neighborhood. I included it on the list because it is the only property to have undergone a full renovation recently. It is a beautiful, old building in the Edgewater district.<\/p><p>If you are interested in touring one or more of these apartments, I can show them to you sometime next week.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Property<\/th><th>Beds / Baths<\/th><th>Floor<\/th><th>Sq. Ft.<\/th><th>Details<\/th><\/tr><\/thead><tbody><tr><td>Georgian Apartments<\/td><td>3 / 2<\/td><td>1st<\/td><td>1,400<\/td><td>Parking space included<\/td><\/tr><tr><td>Peterson Residences<\/td><td>3 / 1<\/td><td>15th<\/td><td>1,600<\/td><td>In-unit washer/dryer; parking for a fee<\/td><\/tr><tr><td>Lawrence Tower<\/td><td>2 / 2<\/td><td>2nd<\/td><td>1,300<\/td><td>Street parking only (city sticker required)<\/td><\/tr><tr><td>Sunnyside Apartments<\/td><td>2 / 2<\/td><td>2nd<\/td><td>1,700<\/td><td>New appliances; parking space included<\/td><\/tr><\/tbody><\/table><\/div><p>Sincerely,<br>Fiona Bezark<br>Wallace Realty<\/p><\/div><\/section><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>NEWS ARTICLE<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body\"><h2>Sunnyside Apartments Gets a New Look<\/h2><div class=\"byline\">By Leslie Reed<\/div><p>CHICAGO (October 10)— The renovation of Sunnyside Apartments, located at 123 Wilson Boulevard, was finally completed last week. The building had been undergoing improvements for over a year. Mr. Robert Kern, who has been running the apartment complex for the past two decades, wanted to completely renovate the building without displacing any of the tenants. As it turns out, some of them actually volunteered their time to help Mr. Kern with the renovation work, including painting, plumbing, and repairs. The building has been fully transformed, and several of the units are now available for rent. Interested parties should contact Ms. Fiona Bezark at Wallace Realty by calling 555-9888.<\/p><\/div><\/section><\/div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 191–195 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>EVENT ADVERTISEMENT<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">MARCH 1 · 5 P.M. – MIDNIGHT<\/div><h2>Come to the Winwright Gallery Reopening!<\/h2><\/div><p>Don't miss the Winwright Gallery's opening celebration, which is scheduled for 5 p.m. to midnight on Saturday, March 1. Live music will be played in the city plaza outside the building, and anyone who has donated funds to the gallery will be invited to join a tour.<\/p><p>The Winwright Gallery will welcome the public for the first time since closing for renovations last July. In addition to significant upgrades to exhibition spaces and IT infrastructure, the Winwright Gallery has added a brand-new wing. While the wing is devoted to displaying the work of emerging artists, it is also home to the gallery's only dining facility, Column.<\/p><p>For more information about the event and the gallery's upcoming exhibitions, visit www.winwrightgallery.com.<\/p><\/div><\/section><section class=\"document-card type-webpage\"><div class=\"doc-ribbon\"><span>MEMBERSHIP WEB PAGE<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body\"><div class=\"browser-chrome\">www.winwrightgallery.com/membership<\/div><div class=\"site-head\"><div class=\"site-name\">Winwright Gallery<\/div><div class=\"site-nav\"><span>Visit<\/span><span>Exhibitions<\/span><span>Membership<\/span><\/div><\/div><h2>Annual Membership Plans<\/h2><p>Members of the Winwright Gallery receive exclusive benefits. Choose one of the options below and click “SELECT.”<\/p><div class=\"table-wrap\"><table><thead><tr><th>Type<\/th><th>Price<\/th><th>Benefits<\/th><\/tr><\/thead><tbody><tr><td>Individual<\/td><td>$100<\/td><td>Free admission to all exhibit spaces; 20% discount on lectures<\/td><\/tr><tr><td>Family<\/td><td>$200<\/td><td>Free admission for member + 1 guest; 20% discount on lectures and children’s classes<\/td><\/tr><tr><td>Enthusiast<\/td><td>$600<\/td><td>Free admission for member + 2 guests; 20% off lectures and museum store merchandise; priority event tickets; invitations to previews of special displays<\/td><\/tr><tr><td>Connoisseur<\/td><td>$1,000<\/td><td>Invitation to Annual Holiday Luncheon; free admission for member + up to 4 guests; 20% off lectures, museum store and restaurant dishes; free admission to more than 30 partner museums in North America<\/td><\/tr><\/tbody><\/table><\/div><div class=\"web-cta\">SELECT<\/div><\/div><\/section><section class=\"document-card type-review\"><div class=\"doc-ribbon\"><span>VISITOR REVIEW<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body\"><div class=\"browser-chrome\">www.triptips.com/attractions/reviews/winwrightgallery<\/div><div class=\"review-header\"><b>Tania Swanson<\/b><span>Reviewed on April 9<\/span><strong>★★★★☆<\/strong><\/div><h2>A great evening<\/h2><p>I was excited when a friend invited me to visit the Winwright Gallery with her today. It was fascinating to watch a presentation and be shown techniques for making abstract art. I just wish it hadn't been so crowded. We spent about two hours walking around and then dined at the restaurant in the new wing of the gallery. We sat on the patio, which has a view of the sculpture garden below. The food was excellent, and because my friend is a member, we even got a discount on our bill. Reservations are available but not necessary.<\/p><\/div><\/section><\/div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 196–200 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-webpage\"><div class=\"doc-ribbon\"><span>COMPANY WEB PAGE<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body\"><div class=\"browser-chrome\">www.nilsoncandy.com<\/div><div class=\"ad-hero\"><div class=\"ad-kicker\">NILSON CANDY COMPANY<\/div><h2>Keep Your Business Sweet<\/h2><\/div><p>The Nilson Candy Company provides bulk candy for hotels, transportation companies, business conventions, and more.<br>Buy your favorite candies today!<\/p><p>Choose from hundreds of popular treats, including:<br>Mints<br>Caramels<br>Chocolates<br>Lollipops<\/p><p>Spend over $250 on your entire order, and your purchases can be personalized with your company name and logo on the packaging at no additional charge!<br>Gift baskets and candy bouquets are also available.<br>Give your clients and customers a sweet treat they won't forget!<\/p><p>Call our automated order hotline at 555-9635 or use our online chat to speak to a Nilson Candy representative.<br>Don't forget to request a copy of our holiday catalog for access to special products and to sign up for our newsletter to learn about additional discounts!<\/p><p>Please note that chocolate items will be shipped in our patented GOOD-SEAL packs. These can prevent melting for up to four days. If you anticipate any problems receiving a delivery, please let us know so that we can adjust the delivery date.<\/p><\/div><\/section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>ORDER CONFIRMATION E-MAIL<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>Lisa Choi &lt;lisachoi@starsoftware.com&gt;<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Nilson Candy &lt;orders@nilsoncandy.com&gt;<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>June 16<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>Your order was received<\/span><\/div><\/div><p>Thank you for placing an order with Nilson Candy Company! Please review your order details below.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Order field<\/th><th>Details<\/th><th>Order field<\/th><th>Details<\/th><\/tr><\/thead><tbody><tr><td>Order number<\/td><td>34V8K<\/td><td>Ship to<\/td><td>Star Software<\/td><\/tr><tr><td>Contact<\/td><td>Lisa Choi<\/td><td>Phone<\/td><td>555-3202<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table><thead><tr><th>Item<\/th><th>Quantity<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td>Peppermints<\/td><td>10 kg – BULK<\/td><td>$99.00<\/td><\/tr><tr><td>Chocolates<\/td><td>5 kg – BULK<\/td><td>$79.00<\/td><\/tr><tr><td>Caramels<\/td><td>5 kg – BULK<\/td><td>$89.00<\/td><\/tr><tr><td>Small candy bouquets<\/td><td>50 items<\/td><td>$225.00<\/td><\/tr><tr><td>Shipping fee<\/td><td><\/td><td>$50.00<\/td><\/tr><tr><td>TOTAL COST<\/td><td><\/td><td>$542.00<\/td><\/tr><\/tbody><\/table><\/div><p>Our standard shipping time for all orders is 2 days. However, if you have requested personalized labels, shipping may take up to 7 days.<\/p><\/div><\/section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>CUSTOMER FEEDBACK<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body\"><div class=\"browser-chrome\">www.nilsoncandy.com<\/div><h2>Online Feedback Form<\/h2><div class=\"form-answer\">My name is Lisa Choi. Overall, I was satisfied with my order. The delivery was made on time and the items were complete. However, although most of the candy arrived intact, a few of the caramels were crushed during shipping. Still, I think the packaging did a great job of preserving the items even though it was left outside for almost two hours. And our customers very much enjoyed all of the candy! I was not able to try the personalization option because of a lack of time, but I would definitely like to try it in the future.<\/div><\/div><\/section><\/div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 131–134 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><p>12 月 8 日<\/p><p>親愛的 Ambrosio 女士：<\/p><p>Dane County 度假村在選擇提供給住客的產品時一向非常謹慎。然而，您寄來的牙膏試用品令我們感到驚喜。除了具有清新的香氣之外，它對牙齦也比我們試用過的許多其他品牌更加溫和。<\/p><p>因此，我們決定將您的牙膏納入飯店的新款盥洗用品組合。這項決定表示我們每天都會向所有住客提供這款牙膏。初步我們希望您在一月寄送 500 個單位的產品。請儘快提供這批數量的報價。由於我們打算在未來重複訂購，也想了解是否能提供折扣。<\/p><p>敬祝商祺<br>Teddy Lawrence<br>總經理<br>Dane County 度假村<\/p><\/div><\/section><\/div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 135–138 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"notice-content\"><h2>Swansea 渡輪公司｜乘客須知<\/h2><p>當您抵達 Swansea 渡輪碼頭時，請按照指示牌前往車輛報到櫃台。工作人員會在那裡核對您的訂位號碼，並提供登船卡，卡上將標明您車輛應停放在渡輪上的區域。<\/p><p>如果您前往國際目的地，此時也必須出示護照；如果是國內旅程，則改為出示駕照。登船前會有廣播通知，通常約在出發前半小時進行。接著請駛往登船車道，工作人員會引導您的車輛開上渡輪。<\/p><\/div><\/div><\/section><\/div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 139–142 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><h2>年輕非洲設計師獲得讚譽<\/h2><div class=\"byline\">《未來家具雜誌》 · Rhonda Thiessen 撰稿<\/div><p>在今年巴塞爾裝飾展開幕前的幾週，資深設計師獲得了大部分媒體的關注。但活動一開始，焦點突然轉向一位鮮為人知的設計師 Harry Mashaba。他在主展廳的一處展位展示自己的創作。到場的評論家一致認為，這些作品與現場其他展品截然不同。<\/p><p>展覽主辦人 Lara Dahn 表示：「Mashaba 先生的作品非常獨特。他成功地將傳統南非家具加以現代化，使其對今日的人們而言既美觀又實用。他的作品非常適合現代客廳。」<\/p><p>由於在展覽中大獲成功，Mashaba 先生獲瑞士家具製造商 Rulesten 聘請，設計一組餐廳家具。這組家具將在今年秋天於歐洲上市。<\/p><\/div><\/section><\/div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 143–146 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">娛樂串流服務<\/div><h2>AVENUU<\/h2><\/div><p>為您介紹最出色的串流服務 Avenuu！您可以觀看數百部熱門電視影集、電影、兒童節目和現場演唱會。透過智慧型手機、平板電腦、電腦等任何裝置，都能以高畫質串流播放這些內容。<\/p><p>Avenuu 也會根據您的觀看紀錄提供推薦。您使用得越多，我們就越了解您的喜好。所以別再花時間不停地捲動選單、浪費寶貴時間了！今天就註冊，開始觀賞高品質內容吧。<\/p><p>您甚至可以自行選擇訂閱方式：每月 5.99 美元可使用含廣告方案，或以每月 10.99 美元享受無廣告方案。今天就造訪 www.avenuu.com！<\/p><\/div><\/section><\/div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 147–148 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"notice-content\"><h2>員工出入口臨時調整通知<\/h2><p>Wilson 購物中心的員工入口在上週的暴風雨中受損，將於 8 月 2 日進行維修。在這段期間，購物中心員工可以使用建築物南側的緊急出口進入。<\/p><p>您的識別證權限會在保全系統中自動更新，讓您得以使用這扇門。請像平常一樣在此入口刷識別證。不過請注意，8 月 2 日之後便無法再由這個位置進入購物中心。<\/p><\/div><\/div><\/section><\/div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 149–150 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>全體員工<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Eun-jung Cho<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>11 月 3 日<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>Cornerstone Solutions 客戶案<\/span><\/div><\/div><p>各位同事好：<\/p><p>我們正準備達成今年的一項目標。Cornerstone Solutions 的高階主管下週將前來商談細節，並希望能簽訂合約。如果他們與我們簽約，我們就會獲得一筆價值數百萬美元的客戶業務。這代表營收將增加，但職責也會更加繁重。<\/p><p>我們可能需要額外雇用臨時人員，或擴大現有員工的工作範圍。詳細事項會在明天已安排的會議中討論。如果您有興趣負責這位新客戶，請寄電子郵件給我，我會將這份職務涉及內容的初步概述傳給您，好讓您在明天會議前先閱讀資料。<\/p><p>謝謝<br>Eun-jung Cho<br>Cho &amp; Associates 主任<\/p><\/div><\/section><\/div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 151–152 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"conversation\"><div class=\"bubble \"><div class=\"bubble-meta\"><b>Farrah Keller<\/b><time>上午 10:43<\/time><\/div><p>我剛和 Janice 外燴公司談過今晚的活動。他們因為另一位客戶而耽誤了，無法在下午六點半以前送餐。<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Teddy Park<\/b><time>上午 10:45<\/time><\/div><p>可是我們預定下午六點開始供應開胃菜。<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Farrah Keller<\/b><time>上午 10:46<\/time><\/div><p>不如我們自己去取餐，怎麼樣？<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Teddy Park<\/b><time>上午 10:47<\/time><\/div><p>好主意！妳能問問他們可不可以這樣做嗎？<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Farrah Keller<\/b><time>上午 10:49<\/time><\/div><p>我馬上問。我也可以依照合約要求降低價格。<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Teddy Park<\/b><time>上午 10:51<\/time><\/div><p>好，問完告訴我他們怎麼說。同時我會先把公司的卡車準備好。<\/p><\/div><\/div><\/div><\/section><\/div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 153–154 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-flyer type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">ATHENS 學院活動一覽<\/div><h2>藝術焦點 Artist Spotlight<\/h2><\/div><p>雖然過去幾場「藝術焦點」活動介紹的都是技藝精湛的畫家，本月的來賓則是一位自學成才的動畫師 Grant Marek。他將播放最新作品《Coloratura》，這部電影曾於全球動畫影展放映。《Georgia Sentinel》稱他的新片是「視覺與聲音令人振奮、技藝純熟的精彩交融」。<\/p><p>電影放映會有現場旁白與音效，還有由 Wallace Herbert 教授帶領的四重奏樂團演出。放映結束後，觀眾可向 Marek 先生提問。他也將在放映隔天，也就是 2 月 12 日星期五晚間 7 點，於 Watkins 禮堂參加座談會。<\/p><p>入場：免費，對大眾開放<br>日期與時間：2 月 11 日星期四，下午 6:30<br>地點：Charles 劇院<\/p><\/div><\/section><\/div>","155-157":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 155–157 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">加州國家公園客製化行程<\/div><h2>Palm Creek Tours<\/h2><\/div><p>造訪加州，如果沒有到其十二座國家公園中的至少一座走走，就不算完整的旅程。每年數百萬名來自世界各地的遊客前來欣賞加州壯麗的自然景觀，以及種類豐富的戶外活動。— [1] —<\/p><p>Palm Creek 旅行社專門規劃完全客製化的加州國家公園旅遊行程，從單日套裝行程，到前往一處或多處景點的多日行程，我們都能安排。— [2] — 您可以住在帳篷、五星級度假村，或兩者之間的各種住宿場所。若活動需要導遊，我們可以額外收費為您安排。多語導遊會協助您和旅伴自在地旅行，並確保行程順利進行。— [3] —<\/p><p>單日套裝行程每人 150 美元起，包含餐點與交通。所有行程至少須四人才能成團。— [4] —立即致電 555-8012 聯絡 Palm Creek 旅行社，或瀏覽 www.palmcreektours.com。<\/p><\/div><\/section><\/div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 158–160 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-brochure type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">設備維修 · 保養 · 耗材<\/div><h2>Biz-Equip 維修服務<\/h2><\/div><p>更換故障或損壞的辦公設備可能所費不貲！在您急著買新印表機、影印機、投影機、電腦或其他辦公設備以前，請先聯絡 Biz-Equip 維修服務。<\/p><p>設備維修<br>我們有經驗豐富的專業團隊，可到府或到公司檢查您的機器。如果能在現場修好，我們就會直接修理；如果需要大幅維修，設備會送至服務中心，修復並確認正常運作後再交還給您。多數維修只需 48 小時內就能完成。<\/p><p>設備保養<br>Biz-Equip 也為公司及其他組織提供定期保養服務。技術人員可每週檢查您的設備，確保所有設備運作正常。<\/p><p>設備墨水與碳粉匣供應<br>此外，Biz-Equip 供應適用於多數辦公室印表機及影印機的墨水匣和碳粉匣，價格會因品牌與類型而異。詳情請查看 www.bizequiprepairservices.com/products。<\/p><p>若要預約技術人員到訪，請撥打免付費電話 1-800-555-9288，並提供您的辦公室或營業場所地址，我們會儘快派員前往。<\/p><\/div><\/section><\/div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 161–164 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><h2>壁畫為市中心帶來活力與色彩<\/h2><p>夏洛特市，10 月 19 日——夏洛特市今年六月於市中心啟動壁畫計畫，目的是讓這一帶恢復活力、增添色彩。大型藝術圖像直接繪製在建築外牆上，目前已接近完成。— [1] — 計畫預定在兩個月內完成所有壁畫。這項工程已使市中心化身為戶外美術館，因此維護全部作品非常重要。Axon 藝術團體負責這項計畫，並將依照未來五年的合約持續維護壁畫。— [2] —<\/p><p>Axon 藝術團體獲選承辦此計畫，是因為過去二十年來一直在當地學校和社區中心舉辦藝術工作坊。— [3] — 夏洛特市規劃委員會去年春季首次提出這項計畫時，該團體就熱切希望承接。共同創辦人 Matthew Stewart 說：「許多當地藝術家對這個計畫相當興奮。對其中許多人來說，這是一生難得的機會。」最初經費由社區倡議基金會補助五萬美元。— [4] — 夏洛特市觀光局隨後也提供相同金額。觀光局主任 Jill Myers 表示：「未來人們到訪我們的城市時，會看見這裡充滿正能量和靈感，並想要再次前來。」<\/p><\/div><\/section><\/div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 165–167 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>全體員工 &lt;staff@portlandvalleyjournal.com&gt;<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Isaac Dyer &lt;isdyer@portlandvalleyjournal.com&gt;<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>一月號<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>12 月 2 日<\/span><\/div><\/div><p>各位好：<\/p><p>我們的一月號向來特別重要，因為它會為這一年剩餘時間的雜誌風格定調。我已經開始規劃文章及專題的版面。資深記者們和我都認為，明年應增加員工與讀者之間的互動。因此，一月號封面將透過攝影比賽選出作品，讀者和員工都可以參加。我已經向當地報紙發布了這項活動的新聞稿，也會在今天結束前把比賽規則和指引放到我們的網站。<\/p><p>如前所述，員工可以參賽。不過，攝影師因具備不公平的優勢，無法參加。我已和首席攝影師 Brianna Griffin 討論過，我們決定讓攝影師擔任比賽評審。除了得獎照片將刊登在封面外，沒有其他獎品。<\/p><p>希望大家有機會都能參加。請在 12 月 10 日前以電子郵件將投稿作品寄給我。得獎者將於 12 月 20 日公布。<\/p><p>祝好運！<br>Isaac Dyer，執行編輯<br>《Portland Valley Journal》<\/p><\/div><\/section><\/div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 168–171 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"conversation\"><div class=\"bubble \"><div class=\"bubble-meta\"><b>Lenny Vogler<\/b><time>上午 11:57<\/time><\/div><p>大家好。我擔心我們的網路行銷沒有發揮效果。有什麼方法能提升我們在網路上的能見度嗎？<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Dorothy Hughes<\/b><time>上午 11:57<\/time><\/div><p>擴充我們的社群媒體頁面如何？<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Lenny Vogler<\/b><time>上午 11:58<\/time><\/div><p>我們的社群頁面在讓消費者看到產品圖片這件事上，效果一直不太理想。圖片其實很有助於推廣產品系列。<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Burl Seaver<\/b><time>上午 11:58<\/time><\/div><p>或許可以開設 Momento-Pic 帳號。這是一個供人分享及評論照片的應用程式，也能讓我們貼出社群頁面的連結。<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Anya Pearson<\/b><time>上午 11:59<\/time><\/div><p>我聽說過那個服務，不過企業使用需要付費。<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Lenny Vogler<\/b><time>上午 11:59<\/time><\/div><p>只要月費合理，應該不會超過我們的行銷預算。我們現在就開帳號嗎？<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Burl Seaver<\/b><time>中午 12:00<\/time><\/div><p>在那之前，我們或許也應該先看看其他熱門的圖片分享應用程式。<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Dorothy Hughes<\/b><time>中午 12:01<\/time><\/div><p>我同意。有些其他圖片分享程式的訂閱人數甚至比 Momento-Pic 更多。<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Lenny Vogler<\/b><time>中午 12:02<\/time><\/div><p>了解。有人可以整理一份值得加入的應用程式清單嗎？也請查明各自的費用和功能。<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Anya Pearson<\/b><time>中午 12:03<\/time><\/div><p>我可以立刻處理。今天下午會把資料用電子郵件寄給您。<\/p><\/div><\/div><\/div><\/section><\/div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 172–175 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-schedule type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">5 月 11 日當週起的新課程<\/div><h2>Anderson 社區中心<\/h2><\/div><p>想學習新技能或培養新嗜好嗎？看看 Anderson 社區中心從 5 月 11 日當週開始有哪些新課程吧！<\/p><div class=\"course-grid\"><div class=\"course-card\"><h3>烘焙盛會<\/h3><div class=\"course-time\">每週一 18:00–20:00｜每堂 35 美元<\/div><p>跟隨本市糕點師傅學習製作簡單的烘焙食品。每週都有不同的客座講師教授一份新食譜，所有食材都會提供。<\/p><\/div><div class=\"course-card\"><h3>成人鋼琴<\/h3><div class=\"course-time\">每週二 17:00–18:00｜每堂 15 美元<\/div><p>向古典鋼琴家 Susan Dickinson 學習鋼琴演奏基礎。無須任何經驗，也不用準備教材。<\/p><\/div><div class=\"course-card\"><h3>短篇小說寫作<\/h3><div class=\"course-time\">每週三 19:00–21:00｜每堂 25 美元<\/div><p>跟隨出版過作品的作家 William Davis 提升寫作技巧。這門每週舉行、內容生動的課程專為初學者設計。請自備紙筆或筆記型電腦。<\/p><\/div><div class=\"course-card\"><h3>編織入門<\/h3><div class=\"course-time\">每週四 17:30–19:00｜每堂 30 美元<\/div><p>在 Paula Booker 教授的手工藝課程中，學習製作手套、圍巾、襪子等物品。課程提供毛線及器材；如偏好特定顏色，也歡迎自備毛線。<\/p><\/div><\/div><\/div><\/section><\/div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 176–180 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 2<\/small><\/div><div class=\"document-body\"><h2>Colfer 公司果汁銷售量下降<\/h2><p>飲料製造商 Colfer 公司今年七月至九月間的果汁銷售量下降了 12%。公司代表 Fred Hines 表示，多項因素造成這類產品銷量下滑，而這些產品通常每年為公司貢獻超過五十萬美元的利潤。他說：「今年夏季不如往年炎熱，所以較少人購買我們的果汁來消暑。此外，部分 Colfer 果汁因原料成本上升而漲價。以葡萄為例，葡萄價格已上漲，因此葡萄口味飲料的製造成本也提高了。」<\/p><p>市場競爭加劇同樣影響了 Colfer 的銷售。Colfer 和其他大型公司正逐漸流失市占率給提供較健康替代產品的小品牌。事實上，研究資料顯示不添加糖的天然果汁越來越受歡迎。為因應消費者喜好的改變，Colfer 開始與許多快速成長、製造健康食品與飲料的公司建立合作關係。公司也把果汁長年使用的藍色瓶子改成重新設計的紅色瓶子，希望藉此改變品牌形象。<\/p><\/div><\/section><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 2 / 2<\/small><\/div><div class=\"document-body\"><div class=\"memo-title\"><strong>COLFER INC.<\/strong>公司內部備忘錄<\/div><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>Colfer 公司董事會<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Carl Bryant，Colfer 公司總裁<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>變革<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>11 月 30 日<\/span><\/div><\/div><p>我知道過去幾個月的情況很艱難，但我有信心我們正逐漸重回正軌。與 Friendly Farm Foods 和 Natgreen Cereals 的合作在這方面有所幫助，不過我認為 Colfer 最終必須與時俱進。<\/p><p>因此，我想在本週的會議上討論開發新口味，以及擴大產品價格區間。此外，新瓶子的顏色及設計並不受消費者歡迎，所以我認為應該重新採用原本的果汁瓶。讓我們專注於提供獨特且高品質的產品，這樣才能達成來年的目標。<\/p><\/div><\/section><\/div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 181–185 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 2<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>George Billings &lt;g.billings@southernbakedgoods.com&gt;<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Lane Emerson &lt;l.emerson@gourmetdessert.com&gt;<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>回覆：高級甜點展<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>10 月 27 日<\/span><\/div><\/div><p>親愛的 Billings 先生：<\/p><p>感謝您有興趣在第十六屆高級甜點展販售蛋糕。這項展會享有同類活動中規模最大、最成功的美譽。針對您的問題，無論攤位大小，租金一律為 55 美元；但若您是加拿大特色食品協會（CSFA）的會員，價格則是 45 美元。此外，所有攤商均可免費使用電腦，也能參與「優先供應商計畫」，透過這項計畫認識潛在買家。<\/p><p>請注意，上述價格為優先報名價格，僅適用於 11 月 30 日以前送交申請並完成付款者。十二月的攤位費會調漲至會員 65 美元、非會員 75 美元。<\/p><p>敬祝商祺<br>Lane Emerson<br>活動協調員<\/p><\/div><\/section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 2 / 2<\/small><\/div><div class=\"document-body\"><div class=\"stationery-brand\">第十六屆高級甜點展<small>1 月 4–8 日｜加拿大溫哥華<\/small><\/div><div class=\"table-wrap\"><table><thead><tr><th>報名欄位<\/th><th>資料<\/th><\/tr><\/thead><tbody><tr><td>業者<\/td><td>Southern Baked Goods<\/td><\/tr><tr><td>代表人<\/td><td>George Billings<\/td><\/tr><tr><td>電話<\/td><td>555-5497<\/td><\/tr><tr><td>電子郵件<\/td><td>g.billings@southernbakedgoods.com<\/td><\/tr><\/tbody><\/table><\/div><div class=\"form-section\"><b>☒ 我是 CSFA 會員<\/b><\/div><div class=\"form-section\"><b>攤位偏好<\/b><div class=\"choice-row\"><span>☐ 標準攤位<\/span><span>☐ 雙倍攤位<\/span><span>☒ 角落攤位<\/span><\/div><p>只有優先報名者能保證取得偏好的攤位。所有攤位均附桌子、椅子和招牌。<\/p><\/div><div class=\"form-section\"><b>選擇性附加項目<\/b><div class=\"choice-row\"><span>☐ 參展者午餐（1 月 8 日）<\/span><span>☒ 優先供應商計畫<\/span><\/div><\/div><div class=\"table-wrap\"><table><thead><tr><th>付款項目<\/th><th>資料<\/th><\/tr><\/thead><tbody><tr><td>隨附付款金額<\/td><td>45.00 美元<\/td><\/tr><tr><td>報名日期<\/td><td>11 月 16 日<\/td><\/tr><\/tbody><\/table><\/div><p>所有支票的受款人均應填寫 Gourmet Dessert Fair。<\/p><\/div><\/section><\/div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 186–190 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>Fiona Bezark &lt;fiona.bezark@wallacerealty.com&gt;<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Ronald Hasbun &lt;rhasbun@myemail.com&gt;<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>租屋物件<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>10 月 12 日<\/span><\/div><\/div><p>親愛的 Bezark 女士：<\/p><p>感謝您昨天抽空與我電話交談。如先前所說，我正在尋找 Lakeview 社區的一間公寓，希望租約從 12 月 1 日開始。我現在住的公寓約有 1,200 平方英尺，希望找一間更大、至少有兩間臥室及兩間浴室的房子。我也偏好位於一樓或二樓、附有指定停車位的公寓。<\/p><p>我整個十一月都會到外地出差，因此希望能在這個月看房。由於我是在家工作的自由接案記者，時間安排相當彈性。請告訴我您方便的看房日期和時段。<\/p><p>敬上<br>Ronald Hasbun<\/p><\/div><\/section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>Ronald Hasbun &lt;rhasbun@myemail.com&gt;<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Fiona Bezark &lt;fiona.bezark@wallacerealty.com&gt;<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>回覆：租屋物件<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>10 月 15 日<\/span><\/div><\/div><p>Hasbun 先生：<\/p><p>感謝您最近詢問可出租的公寓。我想到四個可能適合您的物件，以下列出各物件的基本資訊。其中一個符合您的全部條件，其他物件則符合部分要求。除了其中一棟之外，其他都位於您想找的社區。我仍將那棟列入清單，因為它是唯一近期全面翻修過的物件，是 Edgewater 區一棟漂亮的老建築。<\/p><p>如果您想參觀其中一間或多間公寓，下週我可以帶您前往看房。<\/p><div class=\"table-wrap\"><table><thead><tr><th>物件<\/th><th>臥室 / 浴室<\/th><th>樓層<\/th><th>平方英尺<\/th><th>詳情<\/th><\/tr><\/thead><tbody><tr><td>Georgian 公寓<\/td><td>3 / 2<\/td><td>1 樓<\/td><td>1,400<\/td><td>含停車位<\/td><\/tr><tr><td>Peterson 住宅<\/td><td>3 / 1<\/td><td>15 樓<\/td><td>1,600<\/td><td>屋內附洗衣機及烘乾機；停車須另付費<\/td><\/tr><tr><td>Lawrence 大樓<\/td><td>2 / 2<\/td><td>2 樓<\/td><td>1,300<\/td><td>僅有路邊停車（須有市政府停車貼紙）<\/td><\/tr><tr><td>Sunnyside 公寓<\/td><td>2 / 2<\/td><td>2 樓<\/td><td>1,700<\/td><td>新家電；含停車位<\/td><\/tr><\/tbody><\/table><\/div><p>敬祝順心<br>Fiona Bezark<br>Wallace Realty<\/p><\/div><\/section><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body\"><h2>Sunnyside 公寓煥然一新<\/h2><div class=\"byline\">Leslie Reed 撰稿<\/div><p>芝加哥（10 月 10 日）——位於 Wilson 大道 123 號的 Sunnyside 公寓，歷時一年多的翻修工程終於在上週完工。過去二十年一直管理這座公寓的 Robert Kern 先生，希望能在不讓任何租客被迫搬離的情況下，將整棟建築徹底翻新。<\/p><p>事實上，部分住戶還自願撥出時間協助 Kern 先生進行粉刷、水管施工及修繕。如今建築已全面改頭換面，並有數個單位可供出租。有興趣的人士請致電 555-9888，聯絡 Wallace Realty 的 Fiona Bezark 女士。<\/p><\/div><\/section><\/div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 191–195 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">3 月 1 日下午 5 點至午夜<\/div><h2>歡迎參加 Winwright 美術館重新開幕！<\/h2><\/div><p>別錯過 Winwright 美術館的重新開幕慶祝活動，將於 3 月 1 日星期六下午五點至午夜舉行。館外的市立廣場將有現場音樂演奏，凡曾捐款給美術館的人都會受邀參加導覽。<\/p><p>自去年七月封館整修以來，美術館即將首次重新對大眾開放。除了大幅改善展覽空間與資訊科技設施，美術館也增建了一整個新翼。新翼專門展示新興藝術家的作品，同時也設有館內唯一的餐飲設施 Column。<\/p><p>欲了解活動和即將舉行的展覽，請瀏覽 www.winwrightgallery.com。<\/p><\/div><\/section><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body\"><div class=\"browser-chrome\">www.winwrightgallery.com/membership<\/div><div class=\"site-head\"><div class=\"site-name\">Winwright 美術館<\/div><div class=\"site-nav\"><span>參觀<\/span><span>展覽<\/span><span>會員<\/span><\/div><\/div><h2>年度會員方案<\/h2><p>Winwright 美術館會員享有專屬福利。請在下方選擇一項方案，並按下「選擇」。<\/p><div class=\"table-wrap\"><table><thead><tr><th>會員類型<\/th><th>價格<\/th><th>福利<\/th><\/tr><\/thead><tbody><tr><td>個人會員<\/td><td>100 美元<\/td><td>可免費參觀所有展區；講座享八折<\/td><\/tr><tr><td>家庭會員<\/td><td>200 美元<\/td><td>本人加一名來賓免費參觀所有展區；講座及兒童課程八折<\/td><\/tr><tr><td>愛好者會員<\/td><td>600 美元<\/td><td>本人加兩名來賓免費參觀所有展區；講座及美術館商店商品八折；活動優先票券及特別展預展邀請<\/td><\/tr><tr><td>鑑賞家會員<\/td><td>1,000 美元<\/td><td>受邀參加美術館年度節慶午宴；本人最多帶四名來賓免費參觀展區；講座、美術館商店商品與餐廳餐點八折；北美洲超過三十座合作博物館免費入場<\/td><\/tr><\/tbody><\/table><\/div><div class=\"web-cta\">選擇 SELECT<\/div><\/div><\/section><section class=\"document-card type-review type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body\"><div class=\"browser-chrome\">www.triptips.com/attractions/reviews/winwrightgallery<\/div><div class=\"review-header\"><b>Tania Swanson<\/b><span>4 月 9 日評論<\/span><strong>★★★★☆<\/strong><\/div><h2>美好的夜晚<\/h2><p>今天朋友邀請我和她一起參觀 Winwright 美術館，我非常興奮。觀看簡報和欣賞抽象藝術製作技巧的示範十分有趣，只可惜現場有點擁擠。<\/p><p>我們花了大約兩個小時參觀，之後到美術館新翼的餐廳用餐。我們坐在露台，能從那裡俯瞰下方的雕塑花園。食物非常美味，而且因為我朋友是會員，我們的帳單還享有折扣。這間餐廳接受訂位，但沒有強制預約。<\/p><\/div><\/section><\/div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 196–200 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body\"><div class=\"browser-chrome\">www.nilsoncandy.com<\/div><div class=\"ad-hero\"><div class=\"ad-kicker\">NILSON CANDY 公司<\/div><h2>讓您的事業甜甜蜜蜜<\/h2><\/div><p>Nilson Candy 公司為飯店、運輸業者、商務會議及其他客戶提供大宗糖果。今天就來購買您最喜歡的糖果吧！<\/p><p>我們有數百種受歡迎的甜點可供選擇，包括薄荷糖、焦糖糖果、巧克力和棒棒糖。<\/p><p>單筆訂單總額超過 250 美元，即可免費在商品包裝上印製您的公司名稱和標誌，享受客製化服務。另有禮籃和糖果花束可供選購，讓客戶及顧客留下難忘的甜蜜回憶！<\/p><p>請撥打自動訂購專線 555-9635，或透過線上聊天與 Nilson Candy 客服代表聯繫。也別忘了索取我們的節慶商品目錄，以取得特殊產品資訊，並訂閱電子報，掌握更多折扣消息。<\/p><p>請注意，巧克力產品均使用我們獲得專利的 GOOD-SEAL 包裝寄送，能在長達四天內防止巧克力融化。如果您預期收貨會遇到問題，請事先告知，以便我們調整配送日期。<\/p><\/div><\/section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>Lisa Choi &lt;lisachoi@starsoftware.com&gt;<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Nilson Candy &lt;orders@nilsoncandy.com&gt;<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>6 月 16 日<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>已收到您的訂單<\/span><\/div><\/div><p>感謝您向 Nilson Candy 公司訂購商品！請確認下方的訂單資料。<\/p><div class=\"table-wrap\"><table><thead><tr><th>訂單欄位<\/th><th>資料<\/th><th>訂單欄位<\/th><th>資料<\/th><\/tr><\/thead><tbody><tr><td>訂單號碼<\/td><td>34V8K<\/td><td>送貨對象<\/td><td>Star Software 公司<\/td><\/tr><tr><td>聯絡人<\/td><td>Lisa Choi<\/td><td>電話<\/td><td>555-3202<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table><thead><tr><th>商品<\/th><th>數量<\/th><th>價格<\/th><\/tr><\/thead><tbody><tr><td>薄荷糖<\/td><td>10 公斤，大宗<\/td><td>99.00 美元<\/td><\/tr><tr><td>巧克力<\/td><td>5 公斤，大宗<\/td><td>79.00 美元<\/td><\/tr><tr><td>焦糖糖果<\/td><td>5 公斤，大宗<\/td><td>89.00 美元<\/td><\/tr><tr><td>小型糖果花束<\/td><td>50 件<\/td><td>225.00 美元<\/td><\/tr><tr><td>運費<\/td><td><\/td><td>50.00 美元<\/td><\/tr><tr><td>訂單總額<\/td><td><\/td><td>542.00 美元<\/td><\/tr><\/tbody><\/table><\/div><p>所有訂單的一般配送時間為兩天。不過，如果您要求客製化標籤，寄送時間可能延長至七天。<\/p><\/div><\/section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body\"><div class=\"browser-chrome\">www.nilsoncandy.com<\/div><h2>線上意見回饋表<\/h2><div class=\"form-answer\">我叫 Lisa Choi。整體而言，我對這次的訂單很滿意。商品準時送達，而且品項都齊全。不過，雖然大部分糖果送達時完好無損，仍有幾顆焦糖糖果在運送途中被壓碎了。儘管如此，我認為包裝的保護效果很好，因為整箱糖果即使在戶外放了將近兩個小時，商品大致仍維持良好狀態。我們的顧客也非常喜歡這些糖果！由於時間不足，我這次沒能使用客製化選項，但將來一定很想試試看。<\/div><\/div><\/section><\/div>"};const DETAILED_EXPLANATIONS={"101":{"type":"動詞位置","translation":"Ortega 女士向財務顧問諮詢，希望獲得投資組合方面的協助。","reason":"句子裡有主詞（Ms. Ortega），但缺少動詞，所以動詞 consult（諮詢）的過去式 (C) consulted 是正確答案。動名詞或形容詞 (A)、名詞 (B) 和 (D) 不能用在動詞的位置。","vocab":"financial adj. 財務的　advisor n. 顧問　seek v. 尋求　investment n. 投資　portfolio n. 投資組合　consulting n. 諮詢 adj. 諮詢的　consultation n. 諮詢　consulter n. 諮詢者","paraphrase":""},"102":{"type":"對等連接詞","translation":"未成年人可以參加這場音樂會，但必須由父母或監護人陪同。","reason":"能將子句（Minors ~ concert）和子句（must ~ guardian）對等連接的對等連接詞 (A)、(B)、(D) 是可能的答案。句意是「未成年人可以參加音樂會，但必須要有父母或監護人陪同」，所以 (D) but（但是）是正確答案。另外，因為對等連接詞連接的子句可以省略重複的主詞，所以第二個子句（must ~ guardian）省略了主詞（Minors）。對等連接詞 (A) so 表示「所以」，(B) for 表示「因為」，意思不恰當。介系詞 (C) with（和……一起）不能連接兩個子句。","vocab":"minor n. 未成年人 adj. 較小的，少數的　be accompanied by phr. 由……陪伴　guardian n. 監護人","paraphrase":""},"103":{"type":"【受詞位置】人稱代名詞的格","translation":"Conner 女士未能獲得年度最佳員工獎，因為一名同事的銷售業績比她的更好。","reason":"介系詞 than（比起……）受詞位置上可能出現的所有格代名詞 (A)、反身代名詞 (B)、受格人稱代名詞 (C) 是可能的答案。因為要表達的是「同事的銷售業績比她的銷售業績好」，所以所有格代名詞 (A) hers 是正確答案。反身代名詞 (B) 用於受詞和主詞表示相同對象的時候，在這裡因為從屬子句（because ~）的主詞（a colleague's sales record）和受詞不同，所以不能使用。如果使用受格人稱代名詞 (C)，則會變成「同事的銷售業績比她這個人（表示 Conner 小姐，而不是 Conner 小姐的銷售業績）來得好」，意思不正確。主格人稱代名詞 (D) 不能用在介系詞的受詞位置。","vocab":"win v. 贏，贏得（獎項等）　colleague n. 同事　sales record phr. 銷售業績","paraphrase":""},"104":{"type":"【動詞位置】動詞的數、語態、時態一致","translation":"昨天研討會的所有參加者都被要求將電子裝置設為靜音模式。","reason":"句子裡有主詞（Everyone），但缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。句意是「研討會上每個人都被要求把電子設備設定成靜音模式」，而且有表示過去時間的詞語（yesterday），所以過去式被動態 (B) was asked 是正確答案。現在式 (C) 不能搭配表示過去時間的詞語一起使用。如果使用主動態 (D) 的話，意思會變成「研討會上每個人都會要求把電子設備設定成靜音模式」，所以不對。動名詞或現在分詞 (A) 不能用在動詞位置。","vocab":"electronic device phr. 電子設備　silent adj. 無聲的　mode n. 模式","paraphrase":""},"105":{"type":"形容詞","translation":"Ruby Cakes 的員工在盛大開幕時發放免費烘焙食品試吃品以示慶祝。","reason":"句意是「分發了烘焙產品的免費試吃品」，所以形容詞 (B) complimentary（免費贈送的）是正確答案。(A) proportional 表示「比例的，成比例的」，(C) contradictory 表示「矛盾的」，(D) intensive 表示「加強的」。","vocab":"hand out phr. 分發　celebrate v. 慶祝　grand opening phr. 盛大開幕","paraphrase":""},"106":{"type":"名詞","translation":"Koenig 女士同意調職至挪威一年，認為這會是絕佳的學習機會。","reason":"句意是「因為認為會是很好的學習機會，所以同意調職」，所以名詞 (D) opportunity（機會）是正確答案。(A) compensation 表示「補償」，(B) feature 表示「特徵，特色」，(C) relationship 表示「關係」。","vocab":"transfer v. 調動　excellent adj. 優秀的，非常好的","paraphrase":""},"107":{"type":"題型與文意解析","translation":"暢銷小說《Vaunted》改編電影的劇本直接取材自原著。","reason":"能修飾空格前面動詞（was taken）的是副詞，(A) directly（直接地）是正確答案。名詞 (B) 和 (D)、動名詞或現在分詞 (C) 不能修飾動詞。","vocab":"script n. 劇本　film n. 電影　adaptation n. 改編　direction n. 方向，指導　direct v. 指導 adj. 直接的　director n. 導演，主任","paraphrase":""},"108":{"type":"動詞","translation":"名為《The Awakening》的攝影展，目前正在 Pulsen 藝廊的大廳展出。","reason":"句意是「攝影展目前展示中」，所以動詞 display（展出）的 p.p. 形 (C) displayed 是正確答案。(A) express 表示「表達」，(B) transform 表示「使改變」，(D) reflect 表示「反映」。","vocab":"entitled adj. 標題被命名為……的　currently adv. 目前","paraphrase":""},"109":{"type":"容易混淆的名詞","translation":"市政府承諾將採取行動減少市中心的交通流量。","reason":"句意是「承諾會採取行動來減少交通量」，所以名詞 (B) action（行動）是正確答案。另外，請把 take action（採取行動）當成慣用語記起來。","vocab":"municipal government phr. 市政府　promise v. 承諾　reduce v. 減少　downtown adj. 市中心的　traffic n. 交通（量）","paraphrase":""},"110":{"type":"【動詞位置】主動態與被動態的區分","translation":"汽水製造商 Fizz Life 去年更改 Ricochet Cola 的配方後，遭到顧客強烈反彈。","reason":"句子裡有主詞（Soft drink manufacturer Fizz Life），但缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。因為空格後面有受詞（backlash），而且要表達的是主動意義「面臨顧客的強烈反彈」，所以主動態 (C) faced 是正確答案。被動態 (A) 和 (B) 後面不能接受詞，所以不對。to 不定詞 (D) 不能用在動詞的位置。","vocab":"soft drink phr. 無酒精飲料，汽水類飲料　manufacturer n. 製造業者　backlash n. 強烈反對　recipe n. 食譜，製造方法　face v. 面對","paraphrase":""},"111":{"type":"【補語位置】最高級","translation":"身為分行經理，Finley 先生認為化解員工衝突是他的職責中最困難的一項。","reason":"第 5 類句型動詞 find 後面會接受詞和受詞補語，而這裡的動詞（find）後面有受詞（resolving staff conflicts），所以空格是受詞補語的位置，可以用在補語位置的形容詞 (A)、比較級形容詞 (B)、最高級形容詞 (C) 是可能的答案。最高級可以和表示範圍的「of / in + 名詞」連用，表示「……之中最……」，所以在這裡能表示「在他的職責中，解決衝突是最難的」的最高級 (C) the most difficult 是正確答案。形容詞 (A) 是原級，不適合和表示範圍的「of / in + 名詞」連用。比較級形容詞 (B) 應該和 than 一起使用。副詞 (D) 不能用在補語位置。","vocab":"branch manager phr. 分店／分行經理　resolve v. 解決　conflict n. 衝突　duty n. 職責，職務　difficultly adv. 困難地","paraphrase":""},"112":{"type":"名詞","translation":"Tessio 生產的餐盤和餐具適合各種場合使用。","reason":"適當的句意是「適合任何場合」，所以名詞 (B
