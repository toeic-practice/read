) occasion（場合）是正確答案。(A) leisure 表示「閒暇」，(C) performance 表示「表演」，(D) effect 表示「影響」。","vocab":"utensil n. 器皿，用具　suitable adj. 適合的","paraphrase":""},"113":{"type":"副詞選時間副詞","translation":"Villier 度假村最近難以吸引遊客，但它曾經是非常熱門的度假勝地。","reason":"句意是「Villier 度假村這陣子很難吸引訪客，但它曾經是非常受歡迎的度假地點」，所以表示時間的副詞 (B) once（曾經）是正確答案。(A) about 表示「大約」，(C) last 表示「最後」，(D) as 表示「作為……」。","vocab":"struggle v. 很困難地進行　attract v. 吸引　vacation destination phr. 度假地點","paraphrase":""},"114":{"type":"動詞","translation":"銀行貸款專員評估了 Demers 女士為購買新居可以借貸多少金額。","reason":"句意是「核貸人員判定 Demers 小姐有資格為新房子借多少」，所以動詞 (B) borrow（借）是正確答案。(A) purchase 表示「購買」，(C) earn 表示「賺」，(D) donate 表示「捐」。","vocab":"loan n. 貸款　determine v. 判定　be eligible to do phr. 有資格做……","paraphrase":""},"115":{"type":"題型與文意解析","translation":"經理決定為員工提供額外訓練，以改善他們的弱點。","reason":"這個句子已經有具備主詞（The manager）、動詞（decided）和受詞（to provide the employees with additional training）的完整子句，所以 their weaknesses 是修飾性的語句，能形成分詞構句的現在分詞 (A) 和過去分詞 (B) 是可能的答案。因為空格後面有受詞（their weaknesses），而且主要子句的主詞（The manager）和分詞構句表示「經理處理……」的主動關係，所以動詞 address（處理）的現在分詞 (A) addressing 是正確答案。過去分詞 (B) addressed 表示被動意義，所以不對。動詞或名詞 (C) 和 (D) 不能引導修飾性語句。","vocab":"weakness n. 弱點　address v. 處理 n. 地址","paraphrase":""},"116":{"type":"介系詞","translation":"在會議中參與討論，是展現積極主動態度的好方法。","reason":"句意是「在會議中參與討論，是展現主動性的好方法」，所以表示期間的介系詞 (D) during（在……期間）是正確答案。(A) from 表示時間點或方向「從……」，(B) along 表示方向「沿著……」，(C) against 表示「對著……，反對……」。","vocab":"contribute v. 貢獻（在此指在討論中提出意見）　discussion n. 討論　initiative n. 主動性，進取心","paraphrase":""},"117":{"type":"形容詞慣用表達方式","translation":"鎮上的店主一直不願意在晚上七點之後繼續營業。","reason":"句意是「業主不太想在晚上 7 點之後讓商店繼續營業」，所以能和空格前面的 be 動詞（been）、後面的 to 不定詞構成 be reluctant to（不情願做……）的形容詞 (B) reluctant（不情願的）是正確答案。(A) optimal 表示「最佳的」，(C) elaborate 表示「精心製作的」，(D) preferable 表示「比較合適的」，用在這裡會變成「業主是比較合適的，而在晚上 7 點之後讓商店繼續營業」，意思不恰當。另外，在 it is preferable to do... 的句型中，preferable 表示「比較合適的」，而如果 preferable 後面接介系詞 to，則是「比……來得好」的意思。","vocab":"business owner phr. 業主","paraphrase":""},"118":{"type":"【引導修飾性語句的成分】副詞子句連接詞條件","translation":"只要火車準時抵達，Diaz 女士就能參加會議。","reason":"這個句子已經有具備主詞（Ms. Diaz）、動詞（will be able to attend）、受詞（the conference）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - on time 是修飾性的語句。修飾部分有動詞（arrives），所以能引導修飾子句的副詞子句連接詞 (A) as long as（只要……）是正確答案。副詞 (B) otherwise（不然的話）不能引導修飾性的語句。介系詞 (C) as a result of（由於……）和 (D) by means of（藉由……）引導的是修飾片語，而不是子句。","vocab":"on time phr. 準時","paraphrase":""},"119":{"type":"介系詞選位置","translation":"儘管 Miller 先生已收到清楚的會場路線指示，他仍開車經過了目的地。","reason":"句意是「雖然已經得到前往會議場地的清楚指引，但開車還是開過頭了」，所以表示位置的介系詞 (C) past（經過……，越過……）是正確答案。(A) toward 表示方向「往……」，(B) over 表示期間或位置「在……期間，在……上方」，(D) out 常以 out of 的形式使用，表示方向「往……的外面」。","vocab":"venue n. 場所","paraphrase":""},"120":{"type":"複合名詞","translation":"游泳比賽的參賽者將依年齡分成四個不同組別。","reason":"空格是介系詞（into）的受詞，而且被形容詞（four, different）修飾，所以能和空格前面的名詞 age（年齡）構成複合名詞 age category（年齡組別）的名詞複數形 (D) categories 是正確答案。動詞 (A)、形容詞 (B)、動詞或過去分詞 (C) 不能用在名詞位置。過去分詞 (C) 因為沒有受詞或者連用的介系詞片語，所以也無法當成在名詞（age）後面做修飾的分詞。","vocab":"divide v. 分開　categorize v. 分類　categorical adj. 明確的，絕對的","paraphrase":""},"121":{"type":"副詞子句連接詞讓步","translation":"即使新進人員具備相關工作經驗，仍須參加訓練課程。","reason":"這個句子已經有具備主詞（New recruits）、動詞（are required）、補語（to join a training course）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - they have relevant work experience 是修飾性的語句。修飾部分有主詞（they）和動詞（have），所以能引導修飾子句的副詞子句連接詞 (B) even if（即使……）是正確答案。(A) in spite of（儘管……）是介系詞，後面要接名詞或動名詞，不能接子句。(C) as though（好像……）表示比喻，意思不恰當。(D) in case（以防……）表示預防，意思也不恰當。","vocab":"recruit n. 新進人員　relevant adj. 相關的　experience n. 經驗","paraphrase":""},"122":{"type":"副詞","translation":"除了 Bateman 女士明天將獨自搭機出發，其他團隊成員都會一同旅行。","reason":"句意是「除了 Bateman 小姐明天將單獨飛出去以外，所有團隊成員將會一起旅行」，所以副詞 (C) separately（單獨地，分別地）是正確答案。(A) physically 表示「身體上地」，(B) partially 表示「部分地」，(D) commonly 表示「共同地，通常」。","vocab":"aside from phr. 除了……以外　fly out phr. 飛出去","paraphrase":""},"123":{"type":"形容詞","translation":"如果提議的預算能讓投資人接受，辦公室擴建計畫就會獲得批准。","reason":"句意是「如果建議的預算能讓投資者接受，辦公室擴建就會被批准」，所以形容詞 (D) acceptable（可接受的）是正確答案。(A) ready 表示「準備好的」，(B) permanent 表示「永久的」，(C) definite 表示「明確的」。","vocab":"expansion n. 擴建　approve v. 批准　investor n. 投資者","paraphrase":""},"124":{"type":"介系詞片語","translation":"採用遠距工作制度的公司，允許員工不受所在地限制地工作。","reason":"句意是「採用遠距工作措施的公司，允許員工不論地點工作」，所以介系詞片語 (A) regardless of（不論……）是正確答案。(B) rather than 表示「而不是……」，(C) on behalf of 表示「代表……」，(D) in exchange for 表示「交換……」。","vocab":"adopt v. 採用　telecommuting n. 遠距工作　location n. 地點","paraphrase":""},"125":{"type":"名詞慣用表達方式","translation":"餐廳主廚負責多種工作，包括菜單規劃。","reason":"句意是「主廚要處理各種工作」，所以能和空格前面的不定冠詞（a）、後面的介系詞（of）構成 a variety of（各種……）的 (B) variety（多樣，多種）是正確答案。(A) condition 表示「狀態，條件」，(C) notification 表示「通知」，(D) renewal 表示「更新」。","vocab":"take care of phr. 照顧……，處理……　task n. 任務，工作　planning n. 計劃，企劃","paraphrase":""},"126":{"type":"【引導修飾性語句的成分】副詞子句連接詞目的","translation":"Turner 女士下載了程式的免費試用版，以便測試各項功能。","reason":"這個句子已經有具備主詞（Ms. Turner）、動詞（downloaded）和受詞（a free trial version）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - she could test its features 是修飾性的語句。修飾部分有動詞（could test），所以能引導修飾子句的副詞子句連接詞 (A) 和 (B) 是可能的答案。因為句意是「下載了程式的免費試用版，好讓她能測試它的功能」，所以表示目的的副詞子句連接詞 (B) so that（好讓……）是正確答案。(A) as if 表示「彷彿……」，(C) in order to（為了……）後面是接原形動詞，而介系詞 (D) because of（因為……）引導的是修飾片語而不是修飾子句。","vocab":"feature n. 功能，特徵","paraphrase":""},"127":{"type":"副詞位置","translation":"編輯的工作職責包括檢查拼字與文法錯誤，並確認資訊在事實上正確無誤。","reason":"空格修飾後面的形容詞（accurate），所以副詞 (D) factually（在事實方面）是正確答案。形容詞 (A)、名詞 (B) 和 (C) 不能修飾形容詞。","vocab":"editor n. 編輯　consist of phr. 由……構成　spelling n. 拼字　grammar n. 文法　verify v. 證實，核對　accurate adj. 精確的　factual adj. 事實的　factuality n. 事實性","paraphrase":""},"128":{"type":"名詞子句連接詞 複合關係代名詞 whomever","translation":"在下次小組專案中，學生可以自由選擇任何想合作的人組隊。","reason":"介系詞（with）的受詞是一個子句（they want），引導這個子句的應該是名詞子句連接詞，所以能扮演這個角色的複合關係代名詞 (A) 和 (D)、疑問代名詞 (B) 是可能的答案。句意是「學生可以自由和他們想要的任何人組成小組」，所以 (A) whomever（任何人）是正確答案。疑問代名詞 (B) which（某個東西）和複合關係代名詞 (D) whatever（任何東西）用在這裡的話，意思會變成「學生和想要的東西／任何想要的東西組成小組」，意思不正確。請記得 which 和 whatever 是指事物而不是人。複合關係副詞 (C) however（不管如何……，不管怎樣……）不能引導名詞子句。","vocab":"free to do phr. 自由地做……　team up phr. 組成小組","paraphrase":""},"129":{"type":"類似意義的動詞","translation":"如果政治人物未履行承諾，就會失去公信力，聲譽也會受損。","reason":"句意是「如果政治人物無法實現承諾，他們的名聲會受損」，所以動詞 (D) suffer（受苦，受損）是正確答案。(A) injure（傷害）雖然看起來類似，但因為是及物動詞，所以是「使……受傷」的意思，後面要接受詞。(B) reject 表示「拒絕」，(C) endure 表示「忍耐，持續」。","vocab":"politician n. 政治人物　fail v. 失敗，無法做到　follow through on phr. 將……進行到底　promise n. 承諾　lose v. 失去　credibility n. 可信性　reputation n. 名聲","paraphrase":""},"130":{"type":"【主詞位置】動名詞 vs. 名詞","translation":"經常在工作場所抱怨很不專業，也會讓同事感到不自在。","reason":"空格所在的子句（~ unprofessional）有動詞（is），但缺少主詞，所以能當主詞的名詞 (B) 和動名詞 (D) 是可能的答案。因為空格後面有副詞（frequently），而且要表示「經常在職場抱怨的行為很不專業」，所以動詞 complain（抱怨）的動名詞 (D) Complaining 是正確答案。請記得動名詞會用副詞修飾，而不是用形容詞修飾。名詞 (B) 不能被副詞修飾。動詞或過去分詞 (A) 和動詞 (C) 不能當主詞。","vocab":"frequently adv. 經常　unprofessional adj. 不專業的　coworker n. 同事　uncomfortable adj. 不自在的　complaint n. 抱怨","paraphrase":""},"131":{"type":"【引導修飾性語句的成分】介系詞選項附加","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這個句子已經有具備主詞（it）、動詞（was）和補語（gentler）的完整子句，所以 ~ scent 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(B)、(D) 是可能的答案。句意是「除了有清爽的香味以外，它對牙齦也比我們試過的其他許多品牌來得溫和」，所以介系詞 (B) In addition to（除了……以外還有）是正確答案。(A) Less than 表示「少於……」，(D) Notwithstanding 表示讓步「儘管……」，(C) Not only 經常以相關連接詞 not only A but (also) B（不止 A，還有 B）的形式使用。","vocab":"","paraphrase":""},"132":{"type":"動詞詞彙 掌握上下文","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"句意是「我們已經將您的牙膏包括在我們新的飯店盥洗用品套組中」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，這個決定意味著它（牙膏）將會每天提供給住客，由此可知牙膏已經被決定納入飯店的盥洗用品套組了，動詞 choose（選擇）的 p.p. 形 (A) chosen 是正確答案。(B) remember 表示「記得」，(C) attempt 表示「試圖」，(D) decline 表示「拒絕」。","vocab":"","paraphrase":""},"133":{"type":"連接副詞 掌握上下文","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"空格是連同逗號一起出現在句首的連接副詞位置，所以需要掌握空格所在句子和前面內容的關係來選擇答案。前面提到已經選擇將對方的牙膏包括在飯店盥洗用品套組中，而空格所在的句子則希望對方在 1 月時寄送 500 個，所以表示依照前述狀況，一開始會怎樣的連接副詞 (C) Initially（起初，一開始）是正確答案。(A) Meanwhile 表示「與此同時」，(B) Likewise 表示「同樣地」，(D) Nonetheless 表示「儘管如此」。","vocab":"","paraphrase":""},"134":{"type":"選出適當的句子","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 we would like you to ship us 500 units for January 希望對方 1 月時寄送 500 個，而下一句 As we intend on repeating this order in the future, we would also like to know whether a discount can be applied. 因為未來想要再次訂購，所以也想知道是否可以打折。因此，空格的內容應該和訂購物品的金額有關。(D) Please send me a quote for this amount as soon as possible 是正確答案。","vocab":"competitor n. 競爭業者　standard adj. 一般的　shipment n. 運輸，出貨　inspect v. 檢查，檢閱　quote n. 報價","paraphrase":""},"135":{"type":"名詞詞彙 掌握上下文","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"句意是「抵達渡輪站時，請跟隨指示牌前往報到手續櫃台」，(A)、(B)、(C) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句將會得到標明在渡輪上停車區域的登船卡，而整篇文章都在說明開車登船的程序，所以空格所在的句子應該是說要跟隨指示牌前往車輛報到手續櫃台，所以名詞 (C) vehicle（車輛）是正確答案。(A) hotel 表示「飯店」，(B) luggage 表示「行李」，(D) conference 表示「會議」。","vocab":"","paraphrase":""},"136":{"type":"動詞詞彙 掌握上下文","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"句意是「如果要前往國外目的地，也需要在這個時候＿＿護照」，(A)、(B)、(D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到會有人查看預約號碼，下一句則提到如果是在國內旅行，取而代之的是會被要求出示駕照，所以空格所在的句子應該是要表達旅行到國外時，需要「出示」護照，(D) present（出示）是正確答案。(A) issue 表示「發行」，(B) renew 表示「更新」，(C) cancel 表示「取消」。","vocab":"","paraphrase":""},"137":{"type":"選出適當的句子","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Before boarding time, there will be an announcement. 提到登船時間前將會有通知，而下一句 You should proceed to the boarding lane 則提到應該前往登船車道，所以空格的內容應該和登船通知有關，(A) This should occur about half an hour prior to departure 是正確答案。","vocab":"occur v. 發生　prior to phr. 在……之前　advisable adj. 適當的，明智的　remain v. 維持，保持　dock v. 停靠碼頭　permit n. 許可證","paraphrase":""},"138":{"type":"【引導修飾性語句的成分】介系詞選位置","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"where 引導的關係副詞子句（where ~ ferry）是已具備主詞（staff）和動詞（will help）的完整子句，所以 the ferry 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (B)、(C)、(D) 是可能的答案。句意是「協助引導您的車登上渡輪」，所以表示位置的介系詞 (C) onto（往……上）是正確答案。(B) between 表示位置「在……之間」，常以 between A and B（在 A 和 B 之間）的形式使用。(D) throughout 表示期間或位置「在……的整個期間，遍及……」。副詞 (A) aside（在旁）不能引導修飾片語。","vocab":"sign n. 指示牌，看板　check-in n. 登船／登機報到，行李運送，飯店入住　boarding n. 登船，登機　indicate v. 標示　section n. 區域　international adj. 國際的　domestically adv. 在國內　announcement n. 公告　proceed to phr. 前往……　lane n. 車道　guide v. 引導，指導","paraphrase":""},"139":{"type":"名詞詞彙 掌握上下文","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"句意是「但活動開始後，突然轉移到鮮為人知的設計師身上」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到展覽開始前的幾週，資深設計師獲得了大部分的媒體關注，所以空格所在的句子應該是要表達在活動開始後，「焦點」突然轉移到鮮為人知的設計師身上，(C) focus（焦點）是正確答案。(A) position 表示「位置」，(B) trend 表示「趨勢」，(D) criticism 表示「批評」。","vocab":"","paraphrase":""},"140":{"type":"選出適當的句子","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面提到活動開始後，焦點突然轉移到鮮為人知的設計師 Harry Mashaba 身上，而空格的上一句 He was showing his creations at a space in the main hall. 提到他在主展示廳的空間展示他的創作，所以空格的內容應該和活動開始後獲得關注的 Mashaba 先生的作品有關，(D) Critics in attendance agreed that they were unlike anything else on display 是正確答案。","vocab":"professional n. 專業人士　so far phr. 目前為止　live up to phr. 達到（期待等）　expectation n. 期待　admission fee phr. 入場費　raise v. 提高　due to phr. 由於……　rental cost phr. 租賃費用，租金　critic n. 評論家　in attendance phr. 參加的　unlike adj. 和……不同的　on display phr. 展出的","paraphrase":""},"141":{"type":"形容詞詞義 掌握上下文","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"句意是「他的作品非常適合客廳」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到他（Mashaba 先生）成功讓傳統南非家具與時俱進，而對於現代人顯得有魅力又方便，由此可知他的現代化家具應該很適合現代的客廳，(A) modern（現代的）是正確答案。(B) spacious 表示「寬敞的」，(C) historic 表示「有歷史意義的」，(D) spotless 表示「一塵不染的」。","vocab":"","paraphrase":""},"142":{"type":"名詞位置","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"空格被前面的所有格人稱代名詞（his）修飾，所以名詞 (B) success（成功）是正確答案。動詞或過去分詞 (A)、動詞 (C)、形容詞 (D) 都不能被所有格人稱代名詞修飾。","vocab":"succeed v. 成功","paraphrase":""},"143":{"type":"名詞／代名詞位置 掌握上下文","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"句意是「在任何設備上串流播放」，(B)、(C)、(D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到可以觀看數百個電視影集、電影、兒童節目與現場演唱會，所以能夠指稱這些節目的第三人稱複數受格人稱代名詞 (C) them 是正確答案。第二人稱所有代名詞 (B) yours 和第三人稱複數所有代名詞 (D) theirs 用在這裡，意思會變成「在任何設備上串流播放你的東西／他們的東西」，所以不對。單數反身代名詞 (A) itself 用來指稱和主詞相同的事物。","vocab":"","paraphrase":""},"144":{"type":"名詞 掌握上下文","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"句意是「根據您的＿＿提供推薦」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到越常使用的話，這個服務就會越了解使用者的喜好，由此可知應該是依照使用者的觀看歷史紀錄提供推薦，名詞 (B) history（歷史紀錄）是正確答案。(A) budget 表示「預算」，(C) location 表示「地點」，(D) schedule 表示「時間表」。","vocab":"","paraphrase":""},"145":{"type":"題型與文意解析","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"句意是「不再滑選單，也不再浪費時間」，所以對等連接詞（and）應該是連接前面的動名詞（scrolling）和後面的另一個動名詞。前面的動名詞（scrolling）是動詞（stop）的受詞，後面的動名詞也一樣，正確答案是動名詞 (C) wasting。動詞原形 (A)、過去式動詞或過去分詞 (B)、to 不定詞 (D) 都不能和動名詞對等連接。","vocab":"","paraphrase":""},"146":{"type":"選出適當的句子","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。下一句 Try our ad-supported service for $5.99 a month, or go ad-free for $10.99 a month. 提到可以試用每月 5.99 元的有廣告服務，或者選擇每月 10.99 元的無廣告服務，所以空格的內容應該和訂閱方式有關，(B) You can even choose how you want to subscribe 是正確答案。","vocab":"stream v. 串流（在網路上播放）　recommendation n. 推薦　based on phr. 根據……　scroll v. 滾動，滑動（顯示長篇內容的畫面）　ad-supported adj. 由廣告支持服務的　ad-free adj. 無廣告的　charge v. 請款　account n. 帳戶　subscribe v. 訂閱　promotional adj. 宣傳的，促銷的　concern n. 擔心，憂慮的事情　handle v. 處理　agent n. 代辦人員","paraphrase":""},"147":{"type":"題型與文意解析","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這一題問的是通知的理由，所以要注意文章開頭的部分。The staff entrance of Wilson Mall was damaged by last week's storm and will be repaired ~. Mall employees may enter using the emergency exit ~ 的部分提到，Wilson 購物中心的員工入口因為上週的風暴而受損，並且將會維修，而購物中心員工可以利用緊急出口進入，接下來則是和員工入口暫時變更有關的細節，所以 (D) 是正確答案。","vocab":"report v. 報告　status n. 狀況，狀態　construction n. 建設（工程）　remind v. 提醒　extended adj. 延長的　instruction n. 指示，說明　emergency situation phr. 緊急狀況　temporary adj. 暫時的","paraphrase":""},"148":{"type":"推論 細節資訊","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是和題目關鍵詞語 Wilson Mall 有關的推論問題。you will not be able to enter the mall at this location after August 2 的部分提到，8 月 2 日之後就無法從這裡（建築物南邊的緊急出口）進入購物中心。由此可以推知，建築物南邊的緊急出口通常是受到限制的，所以 (A) 是正確答案。","vocab":"restricted adj. 受到限制的　wear v. 穿戴　security guard phr. 警衛　renovation n. 翻修","paraphrase":""},"149":{"type":"Not/True True 題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Cornerstone Solutions 有關的內容，並且對照選項判斷答案。(A)、(B)、(D) 在文章裡沒有提到。(C) 在 Senior officials from Cornerstone Solutions will be coming in ~ hopefully, to sign a contract. If they sign with us, we will have a multimillion-dollar account on our hands. 的部分提到，Cornerstone Solutions 公司的資深主管有希望和「我們」（Cho & Associates 公司）簽訂合約，而可能成為價值數百萬元的客戶，符合選項敘述，所以 (C) 是正確答案。","vocab":"withdraw from phr. 從……退出　negotiation n. 協商，談判　fund n. 資金，基金　secure v. 取得　make an offer phr. 出價　purchase v. 購買","paraphrase":""},"150":{"type":"wh-問題 What","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是問 Cho 小姐要求她的員工做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Cho ask her employees to do 有關的部分是 If you are interested in handling ~ new account, please e-mail me so that I can send you a preliminary overview of what the position will involve. 這部分說如果員工有興趣處理新的客戶，請寄電子郵件給「我」（Cho 小姐），以便寄出這個職務涉及事項的初步概要，所以 (B) 是正確答案。","vocab":"term n. 條款，條件　assess v. 評價　set up phr. 準備，安排……","paraphrase":""},"151":{"type":"掌握意圖","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這一題問的是 Park 先生的訊息所表達的意圖，所以要掌握引用部分（Smart）前後文的情境。Farrah Keller 說 How about we pick up the food ourselves?，提議自己去拿食物，對此 Park 先生表示 Smart（真聰明），然後說 Can you ask them if that's possible?，請對方問他們（外燴公司）是否可以這樣做，所以 Park 先生是要表達自己對同事的主意感到欽佩，(B) 是正確答案。","vocab":"wise adj. 明智的，有智慧的　notify v. 通知　impress v. 使印象深刻，使欽佩","paraphrase":""},"152":{"type":"推論 細節資訊","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是和題目關鍵詞語 Janice Catering 有關的推論問題。I can ~ ask for a price reduction based on our contract. 的部分提到，可以根據合約要求降價，由此可以推知合約中提到了折扣方面的事，所以 (C) 是正確答案。","vocab":"specialize in phr. 專門從事……　operate v. 營運","paraphrase":""},"153":{"type":"推論 細節資訊","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是和題目關鍵詞語 Athens College's Artist Spotlight 有關的推論問題。our last few Artist Spotlight events have featured accomplished painters 的部分提到，過去幾次 Artist Spotlight 活動請來了很有才華的畫家，由此可知 Artist Spotlight 是舉辦多次的活動，(A) 是正確答案。","vocab":"","paraphrase":""},"154":{"type":"Not/True Not 題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Mr. Marek 有關的內容，並且對照選項判斷答案。(A) Athens College Event Listing 顯示這是 Athens 大學的活動介紹，而 After the screening, audience members will have a chance to ask Mr. Marek questions ~. He will also participate in a panel discussion a day after the screening 的部分提到，放映後觀眾將有機會問 Marek 先生關於他的電影的問題，而他還會參加放映後隔天的座談會，所以 Marek 先生會參加在 Athens 大學超過一場的活動，符合選項敘述。(B) 在 a self-taught animator named Grant Marek 的部分提到，Marek 先生是自學的動畫師，也就是沒有受過正式動畫訓練的意思，符合選項敘述。(C) 在文章中沒有提到，所以 (C) 是正確答案。(D) 在 his latest film ~ which was screened at the Global Animation Festival 的部分提到，他的最新電影曾經在世界動畫節上映，符合選項敘述。\n\n---","vocab":"dozen n. 12 個　national park phr. 國家公園　stunning adj. 令人驚豔的　vista n. 景色　outdoor adj. 戶外的　fully adv. 完全　customizable adj. 可客製的　arrange v. 安排　multilingual adj. 多國語的　companion n. 同伴　ensure v. 確保　smoothly adv. 順利地　minimum n. 最小的數量","paraphrase":""},"155":{"type":"推論 細節資訊","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是和題目關鍵詞語 the tour packages 有關的推論問題。Should you require a guide for any activity, we can arrange one ~ at an added cost. 的部分提到，要是需要活動的導遊，可以追加費用請旅行社安排。由此可以推知，套裝旅遊方案本身不包括導遊，所以 (B) 是正確答案。","vocab":"limited adj. 有限的，限定的　inclusive adj. 包含的　in advance phr. 事先，預先　book v. 預約","paraphrase":""},"156":{"type":"Not/True True 題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Palm Creek Tours 有關的內容，並且對照選項判 "請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「這將涉及視需求清潔及修飾它們」，所以應該會出現在這篇文章和壁畫管理工作有關的部分。[2] 前面的句子 The Axon Arts Group ~ will also be under contract ~ to maintain the murals. 提到，Axon 藝術團體將依照契約維護壁畫。將句子填入 [2] 的位置之後，可以表達「Axon 藝術團體將維護壁畫，內容包括視需求清潔及修飾壁畫」，文意通順，所以 (B) 是正確答案。","vocab":"touch up phr. 潤色","paraphrase":""},"165":{"type":"題型與文意解析","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這一題問寫電子郵件的理由，而這封電子郵件要觀察整體的內容才能確定目的。the January cover will be determined through a photography competition that both our readers and employees can take part in 的部分提到，1 月號的封面將由讀者和員工都能參加的攝影比賽決定，而 I hope everyone takes part if they can. Please e-mail your submission to me ~ 的部分希望每個人都參加，並且要求寄電子郵件投稿，所以 (C) 是正確答案。","vocab":"publication n. 出版　regarding prep. 關於……","paraphrase":""},"166":{"type":"Not/True Not 題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Mr. Dyer ~ done yet 有關的內容，並且對照選項判斷答案。(A) 在 I've already sent out a press release to the local paper 的部分提到，「我」（Dyer 先生）已經把新聞稿寄給本地的報社了。(B) 在 I will ~ put up the contest rules ~ on our Web site by the end of the day. 的部分提到，會在今天結束之前把比賽規則放上網站，表示還沒做這件事，所以 (B) 是正確答案。(C) 在 The head reporters and I agreed that it would be good to have more interaction between our staff and readers 的部分提到，資深記者和 Dyer 先生都同意，明年員工和讀者之間有更多互動會是件好事，顯示他諮詢過一些記者的意見。(D) 在 I have already started working on the layout for our articles and features. 的部分提到，已經開始製作文章與特輯的版型了。","vocab":"newspaper n. 報社　post v. 發布　consult v. 諮詢","paraphrase":""},"167":{"type":"推論 細節資訊","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是和題目關鍵詞語 Ms. Griffin 有關的推論問題。I talked with Brianna Griffin, our lead photographer, and we decided that they can serve as contest judges. 的部分提到，和首席攝影師 Brianna Griffin 談過了，決定他們（攝影師）可以擔任比賽的評審，由此可以推知首席攝影師 Brianna Griffin 應該也會擔任評審，所以 (B) 是正確答案。\n\n---","vocab":"","paraphrase":""},"168":{"type":"wh-問題 What","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是問 Vogler 先生關心什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Vogler concerned about 有關的部分是 I'm worried that our online marketing isn't working. Is there a way for us to improve our online visibility? 在這裡 Vogler 先生說他對於網路行銷沒效果感到擔心，並且問是否有辦法改善在網路上的能見度，之後也說 Our social media page hasn't been very successful in getting images of our products out there，表示他認為公司的社交媒體頁面在呈現產品形象這方面不太成功，所以 (B) 是正確答案。","vocab":"draw v. 吸引　potential adj. 潛在的　showroom n. （產品的）展示間　awareness n. 意識　efficiency n. 效率　launch v. 發動，使上市","paraphrase":""},"169":{"type":"推論 細節資訊","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是和題目關鍵詞語 Momento-Pic 有關的推論問題。Anya Pearson 在 I've heard of that. ~ businesses have to pay a fee. 的部分提到，她聽說過「那個」（Momento-Pic），但企業必須付費，由此可知 Momento-Pic 對企業收取加入的費用，所以 (B) 是正確答案。","vocab":"trial period phr. 試用期間　charge v. 收取（費用）　sign up phr. 加入　edit v. 編輯","paraphrase":""},"170":{"type":"推論 細節資訊","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是和題目關鍵詞語 department ~ the people ~ work 有關的推論問題。Vogler 先生在 I'm worried that our online marketing isn't working. Is there a way for us to improve our online visibility? 的部分提到，他對於網路行銷沒效果感到擔心，並且問是否有辦法改善在網路上的能見度，之後也說 If the monthly fee is reasonable, it should be within our marketing budget. 表示如果月費合理的話，應該會在他們的行銷預算之內，由此可以推知他們應該在行銷部工作，所以 (A) 是正確答案。","vocab":"department n. 部門　development n. 開發","paraphrase":""},"171":{"type":"掌握意圖","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這一題問的是 Hughes 小姐的訊息所表達的意圖，所以要掌握引用部分（I agree）前後文的情境。Burl Seaver 說 We may also want to check out other popular image sharing applications before we do that.，建議在開設 Momento-Pic 帳號之前，先看看其他受歡迎的圖片分享應用程式，而 Hughes 小姐回應 I agree. There are other image sharing programs that have even more subscribers than Momento-Pic.，表示她同意，並且說還有其他訂戶比 Momento-Pic 更多的圖片分享程式，所以 (C) 是正確答案。","vocab":"subscriber n. 訂閱者","paraphrase":""},"172":{"type":"題型與文意解析","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這一題問的是這篇資訊的目的，所以要注意文章開頭的部分。Looking to learn a new skill or start a new hobby? Check out what's coming to the Anderson Community Center starting from the week of May 11! 的部分，問讀者是否想學新的技能，或者開始新的嗜好，並且請讀者看看 Anderson 社區中心從 5 月 11 日當週開始有什麼活動，接下來則是說明 Anderson 社區中心的課程內容，所以 (D) 是正確答案。","vocab":"business hours phr. 營業時間　describe v. 說明　handmade adj. 手工製作的　enrollment n. 註冊，入學","paraphrase":""},"173":{"type":"wh-問題 Which","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是問哪個（Which）課程有多名講師的 wh- 問題。和題目的關鍵詞語 class ~ have multiple instructors 有關的部分是 Baking Extravaganza、Each week, we learn a new recipe with a different guest teacher. 這部分顯示「烘焙盛會」每週都會和不同的客座講師學習新的食譜，所以 (A) 是正確答案。","vocab":"","paraphrase":""},"174":{"type":"Not/True True 題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Mr. Davis 有關的內容，並且對照選項判斷答案。(A) 在文章中沒有提到。(B) 在 This ~ seminar is intended for novice writers. 的部分提到，Davis 先生主持的這個每週研討會是設計給新手寫作者的，符合選項敘述，所以 (B) 是正確答案。(C) 從 Wednesdays 可以看出，Davis 先生主持的這門課是每週三進行，不符合選項敘述。(D) 在 Please bring a pen and paper or a laptop computer. 的部分提到，要帶紙筆或者筆記型電腦，不符合選項敘述。","vocab":"inexperienced adj. 缺乏經驗的　supply v. 供應","paraphrase":""},"175":{"type":"Not/True True 題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是 Not/True 題型，要找出和關鍵詞語 the Anderson Community Center 有關的內容，並且對照選項判斷答案。(A) 和 (B) 在文章中沒有提到。(C) 從 5-6 P.M.、5:30-7 P.M. 可以看出，成人鋼琴課是 1 小時，編織入門是 1 小時半，不符合選項敘述。(D) 從 Mondays、Tuesdays、Wednesdays、Thursdays 可以看出，四門課分別是每週一、每週二、每週三、每週四進行，符合選項敘述，所以 (D) 是正確答案。","vocab":"last v. 持續　meet v. 見面，會面","paraphrase":""},"176":{"type":"題型與文意解析","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這一題問的是文章（第一篇文章）的目的，所以要注意文章開頭的部分。在文章中，Beverage manufacturer Colfer Inc. experienced a ~ decline in fruit juice sales 的部分提到飲料製造業者 Colfer 公司果汁銷售下降，之後的內容則是說明銷售下降的相關細節，所以 (D) 是正確答案。","vocab":"","paraphrase":""},"177":{"type":"Not/True True 題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是 Not/True 題型，要從文章中找出提到問題的內容，並且對照選項判斷答案。(A)、(B)、(D) 在文章中沒有提到。(C) 在 The summer was not as warm as normal, so fewer people bought our juices to cool down 的部分提到，今年夏天不如平常熱，所以比較少人買果汁來消暑，符合選項敘述，所以 (C) 是正確答案。","vocab":"distribution cost phr. 分銷／流通費用　competitor n. 競爭者","paraphrase":""},"178":{"type":"Not/True True 題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是 Not/True 題型，要從說明 Colfer 公司情況的文章中找出和關鍵詞語 Colfer Inc. 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章中沒有提到。(B) 在 Colfer Inc. has begun establishing affiliations with ~ companies that make healthy foods and beverages. 的部分提到，Colfer 公司已經開始和許多製造健康食品與飲料的公司建立合作關係，符合選項敘述，所以 (B) 是正確答案。","vocab":"partner v. 合夥，合作　operate v. 營運　lose money phr. 虧錢，損失","paraphrase":""},"179":{"type":"wh-問題 多篇文章對照題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 Mr. Bryant believe ~ Colfer Inc. should do，要問 Bryant 先生認為 Colfer 公司應該做什麼（What），所以先看 Bryant 先生所寫的備忘錄。\n線索1：備忘錄（第二篇文章）中，I think we need to reintroduce our original juice bottles as the new color and design have not been popular with consumers 的部分提到，他認為需要重新採用原本的果汁瓶，因為新的顏色與設計不受消費者歡迎，但沒有提到原本的果汁瓶是什麼樣子，所以還需要參考文章的内容。\n線索2：文章（第一篇文章）中，It has also replaced the blue bottles its fruit juices have long been packaged in with redesigned red ones. 的部分提到 Colfer 公司也將果汁長久以來的藍瓶包裝替換為重新設計的紅瓶。\n綜合這兩個線索，可知 Bryant 先生認為因為新的紅色瓶子不受消費者歡迎，因此應該換回原本的藍色，所以 (A) 是正確答案。","vocab":"collaborate v. 合作","paraphrase":""},"180":{"type":"同義詞","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"在備忘錄（第二篇文章），meet 所在的語句 That's how we'll meet our goals for the coming year. 之中，meet 表示「達成（目標）」的意思，所以同樣能表示「達成目標」的 (C) 是正確答案。\n\n---","vocab":"","paraphrase":""},"181":{"type":"題型與文意解析","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這一題問的是 Emerson 小姐寫電子郵件（第一篇文章）的理由，所以要注意開頭的部分。在電子郵件中，Thank you for your interest in selling cakes at the ~ Gourmet Dessert Fair 的部分說感謝對方（George Billings）有興趣在第 16 屆高級甜點展販售蛋糕，然後 To answer your question, a space costs $55 regardless of size unless you are a member of the Canadian Specialty Food Association ~。又提到要回答對方的問題，說不論大小，一個攤位的費用是 55 元，除非是加拿大特色食品協會的會員，所以 (B) 是正確答案。","vocab":"inquiry n. 詢問　describe v. 描述，說明　process n. 程序，過程　solicit v. 請求，索求","paraphrase":""},"182":{"type":"同義詞","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"在電子郵件（第一篇文章），distinction 所在的語句 the 16th Gourmet Dessert Fair, which has earned the distinction of being the largest and most successful event of its kind 之中，distinction 表示「聲譽」，所以同樣能表示「聲譽」的 (D) 是正確答案。","vocab":"","paraphrase":""},"183":{"type":"Not/True True 題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是 Not/True 題型，要從電子郵件中找出和關鍵詞語 booth prices 有關的內容，並且對照選項判斷答案。(B)、(C)、(D) 在文章中沒有提到。(A) 在 ~ a space costs $55 regardless of size ~ 的部分提到，不論大小，一個攤位的費用是 55 元，符合選項敘述，所以 (A) 是正確答案。","vocab":"unaffected adj. 不受影響的　vary v. 不同　depending on phr. 取決於……","paraphrase":""},"184":{"type":"wh-問題 多篇文章對照題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 Southern Baked Goods do at the event，要問 Southern 烘焙產品可以在活動中做什麼（What），所以先看 Southern 烘焙產品的報名表單。\n線索1：表單（第二篇文章）中，Optional Inclusions ■ Privileged Vendor program 的部分顯示 Southern 烘焙產品選了 Privileged Vendor 計畫，但沒有提到 Privileged Vendor 計畫是什麼，所以還需要參考電子郵件的内容。\n線索2：電子郵件（第一篇文章）中，Privileged Vendor program, through which sellers are introduced to potential buyers 的部分提到 Privileged Vendor 計畫會向潛在買家介紹販賣者。\n綜合這兩個線索，可知 Southern 烘焙產品將透過 Privileged Vendor 計畫遇到潛在顧客，所以 (D) 是正確答案。","vocab":"demonstration n. 示範操作","paraphrase":""},"185":{"type":"推論 多篇文章對照題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Mr. Billings 所填寫的表單。\n線索1：表單（第二篇文章）中，only those with priority bookings are guaranteed their booth preferences 的部分提到只能保證優先預訂者的攤位偏好，而 Payment Enclosed: $45.00、Date of Registration: November 16 的部分顯示 Billings 先生在 11 月 16 日付了 45 元的費用，但這篇文章沒有明確顯示 Billings 先生是否為優先預訂，所以還需要參考電子郵件的内容。\n線索2：電子郵件（第一篇文章）中，the prices above are for priority booking and only apply to applications and payments sent to us by November 30 的部分提到以上（55 或 45 元）為優先預訂價格，且只適用於 11 月 30 日前寄送並付費的申請。\n綜合這兩個線索，可知 Billings 先生在優先預訂期限 11 月 30 日前的 11 月 16 日支付攤位租用費，所以對於攤位的選擇會得到保障，(B) 是正確答案。\n\n---","vocab":"","paraphrase":""},"186":{"type":"Not/True True 題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Mr. Hasbun 有關的內容，所以要看他所寫的第一封電子郵件。(A)、(C)、(D) 在文章中沒有提到。(B) 在 will be out of town on business for all of November 的部分提到，他整個 11 月都會在市外出差，符合選項敘述，所以 (B) 是正確答案。","vocab":"unavailable adj. （人）沒空的","paraphrase":""},"187":{"type":"Not/True 多篇文章對照題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是需要對照兩篇文章內容的題目。這是 Not/True 題型，要找出和關鍵詞語 the Lawrence Tower unit ~ meet Mr. Hasbun's requirements 有關的內容，並且對照選項判斷答案，所以先看 Hasbun 先生所寫的第一封電子郵件。\n線索1：第一封電子郵件中，My current apartment is approximately 1,200 square feet. I need a larger place with at least two bedrooms and two bathrooms. I would ~ prefer an apartment that is located on the first or second floor and has an assigned parking space. 的部分提到，「我」（Hasbun 先生）目前的公寓大約 1,200 平方英尺，並且需要比較大、至少有 2 間臥室和 2 間浴室的地方，而且偏好位於 1 樓或 2 樓、有指定停車位的公寓，但從這裡無法得知 Lawrence 大樓的物件不符合哪個條件，所以還需要參考第二封電子郵件的內容。\n線索2：第二封電子郵件中，Lawrence Tower、2 bedrooms、2nd、1,300、Street parking only 的部分顯示 Lawrence 大樓的物件有 2 間臥室、位於 2 樓、大小為 1,300 平方英尺，並且只有路邊停車。\n綜合這兩個線索，可知因為 Lawrence 大樓的物件有 2 間臥室、位於 2 樓、大小為 1,300 平方英尺，所以符合 (A)、(C)、(D) 這些條件，而只能路邊停車不符合 Hasbun 先生對於停車位的要求，所以 (B) 是正確答案。","vocab":"condition n. 條件","paraphrase":""},"188":{"type":"wh-問題 多篇文章對照題型","translation":"請點選閱讀資料旁的「中文翻譯」，可閱讀同一份文章、電子郵件、表格或對話的完整繁體中文內容。","reason":"這是需要對照三篇文章內容的題目。題目的關鍵詞語是 property is not in Lakeview，要問哪個（Which）建築物不位於 Lakeview，所以先看提到 Lakeview 的第一封電子郵件。\n線索1：第一封電子郵件中，I am looking for an apartment in the Lakeview neighborhood 的部分提到「我」（Hasbun 先生）正在找 Lakeview 地區的公寓，但還不知道哪些建築物位於 Lakeview，所以還需要參考第二封電子郵件的内容。\n線索2：第二封電子郵件中，All except one are in your desired neighborhood. I include document.addEventListener('keydown', function(event) {
  const target = event.target;
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      target?.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(target?.tagName)) return;
  if (window.getSelection()?.toString()) return;
  // 鍵盤：←／Z 上一題，→／X 下一題；輸入欄位和文字選取時不啟用。
  const key = event.key.toLowerCase();

    event.preventDefault(); $('#next').click();
  } else if ((key === 'arrowleft' || key === 'z') && !$('#prev').disabled) {
    event.preventDefault(); $('#prev').click();
  }
});

let swipeStart = null;
const swipeArea = '#quiz .stem, #quiz .answers, #quiz .feedback, #quiz .undo-answer-row';
const quizTouch = document.getElementById('quiz');
quizTouch.addEventListener('touchstart', event => {
  swipeStart = null;
  if (event.touches.length !== 1 || !event.target.closest(swipeArea)) return;
  if (event.target.closest('a, input, textarea, select')) return;
  const touch = event.touches[0];
  swipeStart = {x:touch.clientX, y:touch.clientY, time:Date.now()};
}, {passive:true});
quizTouch.addEventListener('touchend', event => {
  if (!swipeStart || event.changedTouches.length !== 1) {swipeStart=null;return;}
  const start = swipeStart; swipeStart=null;
  const touch=event.changedTouches[0];
  const dx=touch.clientX-start.x, dy=touch.clientY-start.y;
  // 至少水平移動 65px，且水平位移須明顯大於垂直位移。
  if (Math.abs(dx)<65 || Math.abs(dx)<Math.abs(dy)*1.6 || Date.now()-start.time>1500) return;
  if (window.getSelection()?.toString()) return;
  if (dx<0 && !$('#next').disabled) $('#next').click();
  else if (dx>0 && !$('#prev').disabled) $('#prev').click();
}, {passive:true});

function parseCsv(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quotes=false;for(let i=0;i<text.length;i++){let c=text[i];if(quotes){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quotes=false;else field+=c}else if(c==='"')quotes=true;else if(c===','){row.push(field);field=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(quotes)throw Error('CSV 引號未關閉');row.push(field);if(row.some(x=>x!==''))rows.push(row);return rows}

$('#importCsv').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCsv(await file.text());if(!rows.length||rows[0].slice(0,6).join('|')!==CSV_HEADER.join('|'))throw Error('欄位格式不符，請使用本網站匯出的 CSV');const incoming={};for(let i=1;i<rows.length;i++){const r=rows[i],id=Number(r[0]),q=QS.find(x=>x.id===id),choice=(r[2]||'').trim();if(r.length<6||!q||!/[A-D]/.test(choice)||choice.length!==1||String(q.part)!==r[1].trim())throw Error('第 '+(i+1)+' 列的題號、Part 或選項有誤');if(r[3].trim()!==q.answer)throw Error('第 '+(i+1)+' 列答案版本不同，已停止匯入');incoming[id]={choice,correct:q.answer?choice===q.answer:null,at:r[5]||''}}const count=Object.keys(incoming).length;if(!confirm('CSV 有 '+count+' 筆有效作答紀錄。匯入後會覆蓋相同題號的現有作答，其餘題目保留。是否繼續？'))return;await window.toeicCloud.importAnswers(incoming);mode='all';index=0;setTabs();render();alert('已成功匯入 '+count+' 筆紀錄。')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};render();

window.toeicApplyRemote=function(answers,starMap,excerptMap){records=answers;collectWrongAnswers();stars=starMap;excerpts=excerptMap||{};render()};
window.toeicClearRemote=function(){records=JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}')||{};collectWrongAnswers();stars=JSON.parse(localStorage.getItem(LOCAL_STAR_KEY)||'{}')||{};excerpts=JSON.parse(localStorage.getItem(LOCAL_EXCERPT_KEY)||'{}')||{};mode='all';index=0;showOverview=false;setTabs();render()};
</script>
<script>
/* Browser-offline fallback: Firebase is optional, local practice always works. */
(function(){
  if(window.toeicCloud) return;
  function persist(){
    localStorage.setItem(LOCAL_KEY,JSON.stringify(records));
    localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));
    localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts));
  }
  window.toeicCloud={ready:true,mode:'local',
    saveAnswer:async(id,data)=>{records[id]=data;persist();render()},
    deleteAnswer:async(id)=>{delete records[id];persist();render()},
    setStar:async(id,marked)=>{if(marked)stars[id]=true;else delete stars[id];persist();render()},
    saveExcerpts:async(id,items)=>{if(items.length)excerpts[id]=items;else delete excerpts[id];persist();render()},
    importAnswers:async(items)=>{records={...records,...items};persist();render()},
    resetAnswers:async()=>{records={};persist();render()}
  };
})();
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:'AIzaSyAA3gxE4CLmVsH3LXjzl4J0O-QhcN14laI',authDomain:'database-89162.firebaseapp.com',projectId:'database-89162',storageBucket:'database-89162.firebasestorage.app',messagingSenderId:'60538861815',appId:'1:60538861815:web:92aa03a61146f491cafbf2',measurementId:'G-JMEN6QNVQ8'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const allowed=['1000','0520','0608','0621','0000','1014'];
const input=document.getElementById('accountCode'),connect=document.getElementById('connectCode'),leave=document.getElementById('leaveCode'),notice=document.getElementById('cloudNotice');
let activeCode='',unsub=[],remoteAnswers={},remoteStars={},remoteExcerpts={},loadedA=false,loadedS=false,loadedE=false,generation=0;
const cloud={ready:false,mode:'local'};window.toeicCloud=cloud;
function info(msg){notice.textContent=msg}
function stopListeners(){generation++;unsub.forEach(fn=>fn());unsub=[];loadedA=false;loadedS=false;loadedE=false;remoteAnswers={};remoteStars={};remoteExcerpts={};cloud.ready=false}
function localSave(){localStorage.setItem(LOCAL_KEY,JSON.stringify(records));localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts))}
function root(type){if(!activeCode||!cloud.ready)throw Error('雲端資料尚未載入');return collection(db,'practiceCodes',activeCode,type)}
function sync(){if(!activeCode||!loadedA||!loadedS||!loadedE)return;cloud.ready=true;cloud.mode='cloud';window.toeicApplyRemote?.({...remoteAnswers},{...remoteStars},{...remoteExcerpts});info('第三回雲端模式：'+activeCode+'，第三回的作答、星號與筆記已載入。');connect.disabled=false;leave.hidden=false}
cloud.saveExcerpts=async(id,items)=>{if(!activeCode){if(items.length)excerpts[id]=items;else delete excerpts[id];localSave();render();return}const ref=doc(root('highlights'),String(id));if(items.length)await setDoc(ref,{items});else await deleteDoc(ref)};
cloud.deleteAnswer=async(id)=>{
  if(!activeCode){delete records[id];localSave();render();return}
  await deleteDoc(doc(root('answers'),String(id)));
};
cloud.saveAnswer=async(id,data)=>{if(!activeCode){records[id]=data;localSave();render();return}await setDoc(doc(root('answers'),String(id)),data)};
cloud.setStar=async(id,marked)=>{if(!activeCode){if(marked)stars[id]=true;else delete stars[id];localSave();render();return}const ref=doc(root('stars'),String(id));if(marked)await setDoc(ref,{marked:true});else await deleteDoc(ref)};
cloud.importAnswers=async(items)=>{if(!activeCode){records={...records,...items};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const entries=Object.entries(items);for(let i=0;i<entries.length;i+=400){const batch=writeBatch(db);for(const [id,data] of entries.slice(i,i+400))batch.set(doc(root('answers'),id),data);await batch.commit()}};
cloud.resetAnswers=async()=>{if(!activeCode){records={};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const ids=Object.keys(remoteAnswers);for(let i=0;i<ids.length;i+=400){const batch=writeBatch(db);ids.slice(i,i+400).forEach(id=>batch.delete(doc(root('answers'),id)));await batch.commit()}};
function goLocal(){stopListeners();activeCode='';cloud.mode='local';input.value='';input.disabled=false;connect.disabled=false;leave.hidden=true;window.toeicClearRemote?.();info('本機模式：未連線雲端，作答只保存在此瀏覽器。')}
leave.addEventListener('click',goLocal);
connect.addEventListener('click',async()=>{const code=input.value.trim();if(!allowed.includes(code)){info('代號無效。請輸入管理員提供的 4 位代號。');return}if(activeCode===code&&cloud.ready)return;stopListeners();activeCode=code;cloud.mode='loading';cloud.ready=false;window.toeicApplyRemote?.({},{});connect.disabled=true;leave.hidden=false;info('正在載入雲端歷史紀錄，請不要作答…');let token=generation;
try{if(!auth.currentUser)await signInAnonymously(auth);if(token!==generation)return;
const a=onSnapshot(collection(db,'practiceCodes',code,'answers'),snap=>{if(token!==generation)return;remoteAnswers={};snap.forEach(d=>{if(/^\d+$/.test(d.id))remoteAnswers[d.id]=d.data()});loadedA=true;sync()},err=>{if(token===generation){info('讀取雲端失敗：'+err.message+'。請檢查匿名驗證與 Firestore 規則。');connect.disabled=false}});
unsub.push(a);
const b=onSnapshot(collection(db,'practiceCodes',code,'stars'),snap=>{if(token!==generation)return;remoteStars={};snap.forEach(d=>{if(/^\d+$/.test(d.id)&&d.data().marked)remoteStars[d.id]=true});loadedS=true;sync()},err=>{if(token===generation){info('讀取星號失敗：'+err.message);connect.disabled=false}});unsub.push(b);
const c=onSnapshot(collection(db,'practiceCodes',code,'highlights'),snap=>{if(token!==generation)return;remoteExcerpts={};snap.forEach(d=>{const items=d.data().items;if(/^\d+$/.test(d.id)&&Array.isArray(items))remoteExcerpts[d.id]=items.filter(x=>typeof x==='string')});loadedE=true;sync()},err=>{if(token===generation){info('讀取文字摘錄失敗：'+err.message+'。請更新 Firestore 規則。');connect.disabled=false}});unsub.push(c);
}catch(err){if(token===generation){info('Firebase 連線失敗：'+err.message);connect.disabled=false}}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();connect.click()}});
// 在雲端讀取期間禁用作答；已離線作答不會自動上傳。
const originalSave=cloud.saveAnswer,originalStar=cloud.setStar,originalImport=cloud.importAnswers,originalReset=cloud.resetAnswers;
for(const [name,fn] of [['saveAnswer',originalSave],['deleteAnswer',cloud.deleteAnswer],['setStar',originalStar],['importAnswers',originalImport],['resetAnswers',originalReset],['saveExcerpts',cloud.saveExcerpts]])cloud[name]=async(...args)=>{if(cloud.mode==='loading'||activeCode&&!cloud.ready)throw Error('雲端正在載入或連線異常，無法儲存；請退出雲端模式後使用本機練習。');return fn(...args)};
onAuthStateChanged(auth,user=>{if(!user&&activeCode){info('Firebase 驗證已中斷，請重新按「載入雲端紀錄」。');stopListeners();connect.disabled=false}});
