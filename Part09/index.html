</style><style id="read-lock-style">body.read-locked>main{visibility:hidden!important;pointer-events:none!important}#readingAccessGate{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:18px;background:#0e2d45ed;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}#readingAccessGate[hidden]{display:none!important}#readingAccessGate .rg-card{width:min(440px,100%);background:#fff;color:#193451;border-radius:16px;padding:25px;box-shadow:0 20px 60px #07172c66}#readingAccessGate h2{margin:0 0 10px;font-size:22px}#readingAccessGate p{font-size:14px;color:#59718a;line-height:1.6}#readingAccessGate input{display:block;width:100%;border:1px solid #a9bdd2;border-radius:9px;padding:12px;margin:12px 0;font-size:18px;letter-spacing:2px}#readingAccessGate button{display:block;width:100%;background:#2159a8;color:#fff;border:0;border-radius:9px;padding:12px;font-weight:800;cursor:pointer}#readingAccessGate button:disabled{opacity:.5;cursor:wait}#readingAccessGate .rg-status{margin-top:11px;min-height:36px;font-size:13px;color:#36566e}</style></head><body class="read-locked"><section id="readingAccessGate" role="dialog" aria-modal="true" aria-labelledby="rgTitle"><div class="rg-card"><h2 id="rgTitle">🔒 TOEIC 閱讀練習｜代號驗證</h2><input id="rgCode" type="text" inputmode="text" maxlength="32" autocomplete="off" placeholder="使用者代號" aria-label="使用者代號"><button id="rgEnter" type="button">驗證並進入練習</button><div id="rgStatus" class="rg-status" role="status">請輸入使用者代號。</div></div></section><main class="shell"><section id="accountToolbar" class="panel" style="margin:0 0 14px"><div class="account-line"><label for="accountCode"><strong>使用者代號</strong></label><input id="accountCode" type="text" inputmode="text" maxlength="32" autocomplete="off" placeholder="輸入使用者代號"><button id="connectCode" type="button">載入紀錄</button><button id="leaveCode" type="button" hidden>退出雲端模式</button><a class="home-link" href="../index.html" title="返回 TOEIC 練習中心首頁">🏠 回首頁</a><a class="exam-link" href="exam.html" title="前往第九回擬真模擬考（100 題計時測驗）">📝 擬真試題</a></div><p id="cloudNotice" role="status" class="small">未輸入代號：使用本機暫存。</p></section><header><h1>TOEIC 多益線上練習｜第九回</h1></header><section class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="right">0</b><span>答對</span></div><div class="stat"><b id="wrong">0</b><span>答錯</span></div><div class="stat"><b id="accuracy">0%</b><span>正確率</span></div></section><div class="toolbar"><select id="part"><option value="all">全部 Part</option><option value="5">Part 5</option><option value="6">Part 6</option><option value="7">Part 7</option></select><button id="all" class="active">全部題目</button><button id="missed">錯題專項練習 <span id="drillCount"></span></button><button id="starred">★ 星號題目</button><button id="overview">錯題總覽</button><button id="excerptsView" type="button">文字摘錄</button><button id="exportWrong">匯出錯題</button><button id="export">匯出作答 CSV</button><label class="import-button" for="importCsv">匯入作答 CSV</label><input id="importCsv" type="file" accept=".csv,text/csv" hidden><button id="reset">重新作答</button></div><div class="answer-pref"><label for="explainMode">作答後解析：</label><select id="explainMode" aria-label="選擇答題後解析開啟方式"><option value="auto">自動展開</option><option value="manual">點擊展開</option></select><span>解析依第九回答案詳解整理；閱讀文章可切換中英文全文</span></div><section id="drillTools" class="panel" hidden><div class="drill-toolbar"><strong>錯題專項練習</strong><span id="drillInfo"></span><button type="button" id="drillRestart">重新練習全部錯題</button><button type="button" id="drillRemove">手動移除此題</button></div><p class="small">錯題不會因答對而消失；作答後立即顯示正解與詳細解析。此模式完全不修改正式測驗的作答紀錄。</p></section><section id="wrongOverview" class="panel" hidden></section><section id="excerptOverview" class="panel" hidden></section><section id="quiz"></section><button type="button" id="selectionSave" aria-label="儲存選取的文字摘錄">✎ 儲存摘錄</button><div class="nav"><button id="prev">← 上一題</button><button id="next">下一題 →</button></div><section class="panel"><div class="head"><b>題號總覽</b><span class="small">綠色答對・紅色答錯・★ 已標記</span></div><div id="numbers" class="numbers"></div></section></main><script>
const DATA={"questions":[{"id":101,"part":5,"stem":"The former tenants will be ______ the property later this afternoon.","choices":["vacated","vacancy","vacating","vacate"],"answer":"C","explanation":"正確答案：(C) vacating。 空格接在 be 動詞（be）後面，所以能形成被動態的 p.p. 形 (A)、名詞 (B)、能形成進行式的 -ing 形 (C) 是可能的答案。因為空格後面有受詞，而且要表達「前房客會把建築物清空」，所以能和 be 動詞一起構成進行式的 -ing 形 (C) vacating 是正確答案。p.p. 形 (A) 可以和空格前面的 be 動詞（be）構成被動態，但這時候後面不能再接受詞。名詞 (B) 可以接在 be 動詞後面，但作為補語，表示和主詞相同的人或事物，也就是「前房客會是空位」，所以不對。動詞原形 (D) 不能接在 be 動詞後面。"},{"id":102,"part":5,"stem":"Team members introduced ______ to one another at the start of the first project meeting.","choices":["they","them","their","themselves"],"answer":"D","explanation":"正確答案：(D) themselves。 空格是動詞（introduced）的受詞位置，所以人稱代名詞 (B) 和反身代名詞 (D) 是可能的答案。因為要表達「組員對彼此自我介紹」，所以表示受詞和主詞（Team members）相同的反身代名詞 (D) themselves 是正確答案。如果只是使用受格人稱代名詞 (B) them，意思就變成「組員對彼此介紹他們（不是組員的其他人）」，所以不對。主格人稱代名詞 (A) they 和所有格人稱代名詞 (C) their 不能當受詞。另外，請記得 introduce oneself（自我介紹）這個慣用說法。"},{"id":103,"part":5,"stem":"Thanks to a city council budget surplus, it is ______ possible that Davondale Bridge will be replaced this year.","choices":["certain","certainty","certainly","certitude"],"answer":"C","explanation":"正確答案：(C) certainly。 空格修飾後面的形容詞（possible），所以副詞 (C) certainly（當然，毫無疑問地）是正確答案。形容詞 (A)、名詞 (B) 和 (D) 不能修飾形容詞。"},{"id":104,"part":5,"stem":"Ticket holders were provided with refunds but were not told ______ the concert had been canceled.","choices":["why","where","who","which"],"answer":"A","explanation":"正確答案：(A) why。 空格前面的動詞 tell（告訴，向 A 說 B 這件事）是可以接兩個受詞的第 4 類句型動詞，在它的被動態句子裡，間接受詞（Ticket holders）成為主詞，所以 ~ canceled 是直接受詞。直接受詞的部分有子句（~ canceled），其中有完整的主詞（the concert）與動詞（had been canceled）結構，所以後面可以接完整名詞子句的疑問副詞 (A) 和 (B) 是可能的答案。因為要表達「沒有被告知演唱會為什麼被取消」，所以疑問副詞 (A) why（為什麼）是正確答案。如果使用疑問副詞 (B) where（在哪裡），意思會變成「沒有被告知演唱會在哪裡被取消」，所以不對。疑問代名詞 (C) who 和 (D) which 後面會接缺少了主詞、受詞或補語的子句。就算把 (D) which 當成疑問形容詞，修飾後面的名詞（the concert）、引導子句也不行，因為它應該直接接在名詞 concert 前面，中間不會插入冠詞（the）。"},{"id":105,"part":5,"stem":"To promote Gaspard Carlock's puppet show, advertisements will be ______ around the city.","choices":["packed","posted","priced","practiced"],"answer":"B","explanation":"正確答案：(B) posted。 句意是「在市內各地張貼廣告」，所以動詞 post（張貼）的 p.p. 形 (B) posted 是正確答案。(A) pack 表示「包裝」，(C) price 表示「定價」，(D) practice 表示「練習」。"},{"id":106,"part":5,"stem":"Since the two programs have a number of similar elements, viewers have drawn ______ between them.","choices":["comparisons","comparing","comparative","comparable"],"answer":"A","explanation":"正確答案：(A) comparisons。 空格是及物動詞（have drawn）的受詞位置，所以名詞 (A) 和有名詞功能的動名詞 (B) 是可能的答案。因為要表達「觀眾把兩者互相比較」，所以能和空格前面的 draw 構成 draw comparisons（互相比較）的 (A) comparisons（比較）是正確答案。如果使用動詞 compare（比較）的動名詞形 (B) comparing 的話，就只是「劃定比較行為」而已，不是正確的表達方式。形容詞 (C) 和 (D) 不能當受詞。"},{"id":107,"part":5,"stem":"Attendees found the computer tutorial offered by Offenburg Community Center to be ______ helpful.","choices":["fast","enough","quite","soon"],"answer":"C","explanation":"正確答案：(C) quite。 因為要表達「覺得電腦個別指導很有幫助」，所以副詞 (C) quite（相當，很）是正確答案。(A) fast 表示「快速地」，(D) soon 表示「不久，很快」。(B) enough（足夠地）當副詞時，是在形容詞（helpful）後面做修飾才對。另外，請注意這個句子使用後面可接受詞和受詞補語的第 5 類句型動詞 find，它的受詞是 the computer ~ Center，受詞補語是 to be ~ helpful。"},{"id":108,"part":5,"stem":"To find his printer's model number, Mr. Jansen turned it ______ and checked the bottom.","choices":["past","against","in","over"],"answer":"D","explanation":"正確答案：(D) over。 因為要表達「把印表機翻過來查看底部」，所以能和空格前面的動詞 turn 構成 turn over（把……翻過來）的介系詞 (D) over 是正確答案。(A) past 表示「經過，通過……」，(B) against 會構成 turn against「反對……」，(C) 會構成 turn in（提交……），意思都不恰當。"},{"id":109,"part":5,"stem":"Earth Preserve hopes that everyone ______ to a fund-raiser held in the coming week.","choices":["contributing","will contribute","contributed","had contributed"],"answer":"B","explanation":"正確答案：(B) will contribute。 that 子句（that ~ week）只有主詞（everyone），還缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。因為有表示未來時間的詞語（in the coming week），所以未來式 (B) will contribute 是正確答案。過去式 (C)、過去完成式 (D) 不能搭配表示未來時間的詞語使用。動名詞或現在分詞 (A) 不能當動詞。另外，請注意 held in the coming week 修飾先行詞（a fund-raiser）。"},{"id":110,"part":5,"stem":"Several local ski lodges have delayed opening ______ mid-November due to the warm weather.","choices":["about","despite","until","across"],"answer":"C","explanation":"正確答案：(C) until。 因為要表達「幾間滑雪度假屋把開始營業日期延到 11 月中」，所以表示時間點的介系詞 (C) until（直到……為止）是正確答案。(A) about 表示「關於……」，(B) despite 表示「儘管……」，(D) across 表示「跨越……」。"},{"id":111,"part":5,"stem":"Some employees may have to work overtime during the final ______ of the project.","choices":["figure","judgment","phase","piece"],"answer":"C","explanation":"正確答案：(C) phase。 句意是「可能必須在專案的最後階段加班工作」，所以名詞 (C) phase（階段）是正確答案。(A) figure 表示「數字」。(B) judgment 表示「判斷」。(D) piece 表示「一片」。"},{"id":112,"part":5,"stem":"The vocabulary in Words in Russian becomes ______ harder after the first section of the book.","choices":["progressive","progressively","progress","progressed"],"answer":"B","explanation":"正確答案：(B) progressively。 空格修飾後面的形容詞比較級（harder），所以副詞 (B) progressively（逐漸地）是正確答案。形容詞 (A)、名詞或動詞 (C)、動詞或過去分詞 (D) 不能修飾形容詞。"},{"id":113,"part":5,"stem":"The ______ trail Ms. Vigneux had ever hiked was located in Flint Valley National Park.","choices":["roughly","rougher","roughest","rough"],"answer":"C","explanation":"正確答案：(C) roughest。 空格修飾後面的名詞（trail），所以形容詞 (B)、(C)、(D) 是可能的答案。因為要表達「Vigneux 小姐走過最崎嶇的登山步道位於某座國家公園」，而且空格前面有定冠詞（The），所以形容詞 rough（高低不平的，崎嶇的）的最高級 (C) roughest 是正確答案。另外，請記得最高級經常和強調最高級的副詞 ever（在任何時候，至今）連用。比較級 (B) 會搭配 than 使用，表示兩者之中的一方程度較高。原級 (D) 的意思是「Vigneux 小姐走過的步道中那條崎嶇的」，但走過的崎嶇步道應該不會只有一條，所以不對。副詞 (A) 不能修飾名詞。"},{"id":114,"part":5,"stem":"As a result of an exclusivity agreement, the drink Nitro-Sip is available ______ at Duggarti Foods.","choices":["densely","fully","solely","fairly"],"answer":"C","explanation":"正確答案：(C) solely。 句意是「獨佔合約造成的結果是，特定飲料只能在 Duggarti Foods 買到」，所以 (C) solely（僅，唯獨）是正確答案。(A) densely 表示「密集地」，(B) fully 表示「完全地，充分地」，(D) fairly 表示「相當，頗為」。"},{"id":115,"part":5,"stem":"Accounting department employees had to work longer hours during the ______ , which took nearly a month.","choices":["auditor","auditorial","audited","audit"],"answer":"D","explanation":"正確答案：(D) audit。 空格前面接冠詞（the），而且是介系詞（during）的受詞，所以名詞 (A) 和 (D) 是可能的答案。因為要表達「會計部員工在查帳期間不得不工作比較長的時間」，所以抽象名詞 (D) audit（查帳）是正確答案。如果使用人物名詞 (A) auditor（查帳者），意思會變成「會計部員工在查帳者期間不得不工作比較長的時間」，所以不對。形容詞 (B)、動詞或過去分詞 (C) 不能用在名詞位置。"},{"id":116,"part":5,"stem":"Though the ______ findings suggested that the medication was effective, further research proved otherwise.","choices":["congested","upcoming","hazardous","original"],"answer":"D","explanation":"正確答案：(D) original。 句意是「原本的研究結果暗示藥物有效，但進一步研究證實並不是」，所以 (D) original（原始的，原本的）是正確答案。(A) congested 表示「擁擠的，堵塞的」。(B) upcoming 表示「即將到來的」。(C) hazardous 表示「危險的」。"},{"id":117,"part":5,"stem":"If Mr. Alton ______ for the conference in advance, he will receive a 15 percent discount on the price of admission.","choices":["registers","had registered","will register","registered"],"answer":"A","explanation":"正確答案：(A) registers。 If 子句（If ~ advance）缺少動詞，而每個選項都是動詞，所以都是可能的答案。主要子句（he ~ admission）的動詞（will receive）是未來式，而且要表達「預先登記報名會議，就會得到入場費的折扣」的意思，而在 if 引導的從屬子句（條件副詞子句）中，會用現在式表示未來（而不是用未來式），所以現在式 (A) registers 是正確答案。過去完成式 (B)、未來式 (C)、過去式 (D) 不能用在表示未來的條件副詞子句裡。"},{"id":118,"part":5,"stem":"Mr. Isaac manages the store and his ______ include handling staff concerns.","choices":["responsive","responsible","responsibility","responsibilities"],"answer":"D","explanation":"正確答案：(D) responsibilities。 空格被前面的所有格人稱代名詞（his）修飾，所以名詞 (C) 和 (D) 是可能的答案。因為空格後面的動詞（include）是複數形，而且要表達「他的職責包括處理員工關切的事」，這裡的 responsibility 表示「職責」，是可數名詞，所以複數形 (D) responsibilities 是正確答案。單數形 (C) 必須搭配單數動詞使用。形容詞 (A) 和 (B) 不能用在名詞位置。另外，請記得 responsibility 表示「職責」時是可數名詞，表示「負責」時則是不可數名詞。"},{"id":119,"part":5,"stem":"Ahead of his retirement, Director John Bailey ______ his colleague Vanessa Gail as his successor.","choices":["consented","estimated","amended","nominated"],"answer":"D","explanation":"正確答案：(D) nominated。 句意是「董事指定同事擔任繼任者」，所以動詞 nominate（任命，指定）的過去形 (D) nominated 是正確答案。(A) consent（同意）意思好像說得通，但它應該搭配 to 使用，表示「同意……這件事」。(B) estimate（評價）只看中文意思好像也解釋得通，但這個動詞可以「評價」的是人的個性、能力等方面，而不是人本身，所以不對。(C) amend 表示「修訂，修正」。"},{"id":120,"part":5,"stem":"The company's new workplace safety policy is high ______ the agenda for tomorrow's meeting.","choices":["of","to","at","on"],"answer":"D","explanation":"正確答案：(D) on。 句意是「公司新的工作場所安全政策在明天會議的議程中佔有重要地位」，所以能和形容詞 high 結合成 high on the agenda（在議程中佔有重要地位）的介系詞 (D) on 是正確答案。"},{"id":121,"part":5,"stem":"The head of the National Medical Association also ______ as the director of a private hospital.","choices":["accepts","serves","answers","regards"],"answer":"B","explanation":"正確答案：(B) serves。 句意是「全國醫學協會會長也擔任一家私人醫院的院長」，所以能和空格後面的 as 構成 serve as（擔任……）的動詞 (B) serves 是正確答案。(A) accept 表示「接受」，(C) answer 表示「回答」，(D) regard 表示「認為」。"},{"id":122,"part":5,"stem":"Students are ______ arguing for the renovation of Central Library, which is now over 50 years old.","choices":["immeasurably","strongly","mutually","inadvertently"],"answer":"B","explanation":"正確答案：(B) strongly。 句意是「學生強烈主張中央圖書館應該翻修」，所以副詞 (B) strongly（強烈地）是正確答案。(A) immeasurably 表示「無法計量地」，(C) mutually 表示「互相地」，(D) inadvertently 表示「不經意地」。"},{"id":123,"part":5,"stem":"______ they are entered into the payroll system, new employees must provide the finance department with some banking information.","choices":["As if","During","Before","Instead of"],"answer":"C","explanation":"正確答案：(C) Before。 這個句子已經有具備主詞（new employees）和動詞（must provide）的完整子句，所以 ~ they are entered into the payroll system 是修飾性的語句。修飾部分有主詞（they）和動詞（are entered），所以能引導修飾子句的副詞子句連接詞 (A) 和 (C) 是可能的答案。因為要表達「新員工在被輸入薪資系統之前，必須提供財務部一些銀行資訊」，所以表示時間的副詞子句連接詞 (C) Before（在……之前）是正確答案。(A) As if 表示「彷彿……」，意思不恰當。介系詞 (B) During（在……期間）和 (D) Instead of（而不是……）不能引導修飾子句。"},{"id":124,"part":5,"stem":"______ you complete this form, bring it to the front desk and leave it with the secretary.","choices":["Once","Or","Since","Either"],"answer":"A","explanation":"正確答案：(A) Once。 這個句子的主要子句是沒有主詞的祈使句，已經具備動詞（bring, leave）和受詞（it），是完整的子句，所以 ~ form 是修飾性的語句。修飾部分有動詞（complete），所以能引導修飾子句的連接詞 (A) 和 (C) 是可能的答案。因為要表達「填好表後交給秘書」，所以表示時間的副詞子句連接詞 (A) Once（一……就～，一旦……）是正確答案。使用 (C) Since（由於……）的話，意思會變成「由於你（平常都、習慣……）填好這張表，要交給秘書」，所以不對。對等連接詞 (B) Or（或）、形容詞或代名詞 (D) Either（（兩個之中的）任何一個）不能引導修飾性語句。"},{"id":125,"part":5,"stem":"Due to the success of his prototypes, the inventor currently has a ______ reputation for innovation.","choices":["grown","growing","grower","growth"],"answer":"B","explanation":"正確答案：(B) growing。 空格修飾後面的名詞（reputation），所以有形容詞功能的過去分詞 (A) 和現在分詞 (B) 是可能的答案。因為被修飾的名詞（reputation）和分詞表示「增加中的名聲」的主動意義，所以現在分詞 (B) growing 是正確答案。如果使用過去分詞 (A) grown 的話，雖然意思好像也說得通，但 grow 表示「增加」是不及物動詞的用法，所以不能使用表示被動的過去分詞。grown 雖然也有形容詞用法「（因為發育等等而）長大了的，成熟的」，但「長大了的名聲」仍然不恰當。名詞 (C) 和 (D) 不能修飾名詞。"},{"id":126,"part":5,"stem":"Roscast Communications employees may work from home, but it is ______ for them to have a reliable Internet connection.","choices":["definite","necessary","optimistic","absolute"],"answer":"B","explanation":"正確答案：(B) necessary。 句意是「員工可以在家工作，但必須要有穩定的網路連線」，所以 (B) necessary（必要的）是正確答案。(A) definite 表示「明確的」，(C) optimistic 表示「樂觀的」，(D) absolute 表示「絕對的，完全的」。"},{"id":127,"part":5,"stem":"The ______ of LRB Pharmaceuticals and Hough Laboratories may result in the elimination of some positions.","choices":["merger","potential","dedication","obligation"],"answer":"A","explanation":"正確答案：(A) merger。 句意是「合併可能造成一些職位的淘汰」，所以 (A) merger（合併）是正確答案。(B) potential 表示「潛力，可能性」，(C) dedication 表示「奉獻」，(D) obligation 表示「義務」。"},{"id":128,"part":5,"stem":"Amberview Beach Resort is a popular summer destination, but it is open for business all ______ the year.","choices":["among","without","through","beyond"],"answer":"C","explanation":"正確答案：(C) through。 句意是「Amberview 海灘度假村是很受歡迎的夏季旅遊地點，但一整年都營業」，所以能和空格後面的 the year 構成 all through the year（一整年）的介系詞 (C) through 是正確答案。(A) among 表示「在……之中」，(B) without 表示「沒有……」，(D) beyond 表示「超越……」。"},{"id":129,"part":5,"stem":"Ms. Ross acquired the ______ number of new customers in May, falling behind all the other sales representatives.","choices":["steadiest","brightest","longest","smallest"],"answer":"D","explanation":"正確答案：(D) smallest。 句意是「Ross 小姐在 5 月開發的新顧客數量最少，落後於所有其他業務代表」，所以形容詞 (D) smallest（最少的）是正確答案。(A) steadiest 表示「最穩定的」，(B) brightest 表示「最明亮的，最聰明的」，(C) longest 表示「最長的」。"},{"id":130,"part":5,"stem":"Completing an important project under a time ______ calls for careful scheduling.","choices":["constraint","relief","quality","proposal"],"answer":"A","explanation":"正確答案：(A) constraint。 句意是「在時間限制下完成重要專案需要仔細的時程安排」，所以能和空格前面的 time 構成 time constraint（時間限制）的 (A) constraint（限制）是正確答案。(B) relief 表示「緩解」，(C) quality 表示「品質」，(D) proposal 表示「提案」。"},{"id":131,"part":6,"stem":"Choose the best answer for blank 131 in the passage.","choices":["However","Thus","In fact","Otherwise"],"answer":"C","explanation":"正確答案：(C) In fact。 空格伴隨逗號一起出現在句首，是連接副詞的位置，所以要掌握空格所在的句子和上一句的關係來判斷答案。前面部分提到顧客的攪拌機連接配件轉不緊，以及擔心這件事很有道理，而空格所在的句子說鬆動的連接配件會造成安全上的風險，以及很高興對方告知這個問題，所以表示對前述內容做補充說明的 (C) In fact 是正確答案。(A) However 表示「然而」。(B) Thus 表示「所以」。(D) Otherwise 表示「否則，不然」，意思都不恰當。","group":"131-134"},{"id":132,"part":6,"stem":"Choose the best answer for blank 132 in the passage.","choices":["causes","caused","was causing","was caused"],"answer":"D","explanation":"正確答案：(D) was caused。 動詞 cause 是及物動詞「引起，導致」，但空格後面沒有受詞，而且使用被動句型「這個缺陷是在最近的生產過程中（被）造成的」，所以被動態 (D) was caused 是正確答案。主動態 (A)、(B)、(C) 都不對。","group":"131-134"},{"id":133,"part":6,"stem":"Choose the best answer for blank 133 in the passage.","choices":["repair","replace","refund","return"],"answer":"A","explanation":"正確答案：(A) repair。 句意是「想要為您＿＿您的機器」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，只要到任何一間服務中心，技術人員會免費幫忙修理，由此可知寄件者是想要幫忙修理，(A) repair（修理）是正確答案。(B) replace 表示「取代」，(C) refund 表示「退款」，(D) return 表示「退回，返回」。","group":"131-134"},{"id":134,"part":6,"stem":"Choose the best answer for blank 134 in the passage.","choices":["Our receptionist can direct you to the billing department.","Your recommendations will be taken into consideration.","Damage that results from user error is not covered by the warranty.","Simply type it into our Web site at checkout when shopping online."],"answer":"D","explanation":"正確答案：(D) Simply type it into our Web site at checkout when shopping online.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 please also accept the following coupon code for $25 off your next CucinaAid purchase 提到，也請接收下次購買時可用的優惠券代碼，所以空格的內容應該和優惠代碼的使用方法有關，(D) Simply type it into our Web site at checkout when shopping online 是正確答案。 選項翻譯 (A) 我們的接待人員可以告訴您怎麼去請款部門。 (B) 我們會考慮您的建議。 (C) 因使用者的錯誤造成的損傷，不在保固範圍內。 (D) 只要在網路購物時，在我們網站的結帳頁面輸入代碼即可。","group":"131-134"},{"id":135,"part":6,"stem":"Choose the best answer for blank 135 in the passage.","choices":["crisis","reduction","transformation","inspection"],"answer":"C","explanation":"正確答案：(C) transformation。 文意為「購物中心正在經歷重大的＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到購物中心已經關閉一個月，經營團隊透露改裝正順利進行，以及 House Lab 已經同意租用 7,000 平方英尺，由此可知購物中心正在經歷重大的轉變，(C) transformation（轉變）是正確答案。(A) crisis 表示「危機」，(B) reduction 表示「減少」，(D) inspection 表示「檢查」。","group":"135-138"},{"id":136,"part":6,"stem":"Choose the best answer for blank 136 in the passage.","choices":["The mall's final floor plan was released to the press early last week.","Given its profit-making potential, it will likely have a prime location.","Hundreds of customers attended its grand opening ceremony.","Based in Texas, its main store is more than 15,000 square feet."],"answer":"B","explanation":"正確答案：(B) Given its profit-making potential, it will likely have a prime location.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 House Lab, a top appliance retailer, will no doubt attract plenty of people to the mall. 提到，家電零售業者龍頭之一的 House Lab 無疑將吸引許多人前往購物中心，而下一句 There has already been speculation that it will occupy the space to the left of the main entrance. 則說，已經有人猜測「它」（House Lab）將佔據正門左邊的空間，所以空格的內容應該和 House Lab 在購物中心裡的位置有關，(B) Given its profit-making potential, it will likely have a prime location 是正確答案。 選項翻譯 (A) 購物中心最終的樓層平面圖已於上週初向媒體公布。 (B) 考慮到它的獲利潛能，它可能會擁有最好的位置。 (C) 數百名顧客參加了它的開幕典禮。 (D) 它的總店位於德州，面積超過 15,000 平方英尺。","group":"135-138"},{"id":137,"part":6,"stem":"Choose the best answer for blank 137 in the passage.","choices":["few","much","many","little"],"answer":"D","explanation":"正確答案：(D) little。 能修飾空格後面不可數名詞（information）的數量形容詞 (B) 和 (D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，目前還不知道美食廣場是否終於要進行迫切需要的擴張，而後面的部分又說預期更多細節將在下個月的記者會公開，所以關於改裝的其他資訊應該是很少的，(D) little（很少，幾乎沒有）是正確答案。(B) much 表示「多」。(A) few 表示「很少，幾乎沒有」，(C) many 表示「多」，但兩者都是用來修飾複數可數名詞。","group":"135-138"},{"id":138,"part":6,"stem":"Choose the best answer for blank 138 in the passage.","choices":["What","Whether","This","Who"],"answer":"B","explanation":"正確答案：(B) Whether。 空格所在的子句（~ expansion）是動詞（is）的主詞，所以能引導名詞子句，使子句成為主詞的名詞子句連接詞 (A)、(B)、(D) 是可能的答案。因為空格所在的子句是已經具備主詞（the food court）、動詞（will ~ undergo）、受詞（a ~ expansion）的完整子句，所以後面接完整子句的 (B) Whether（是否……）是正確答案。疑問詞 (A) What（什麼）和 (D) Who（誰）同時也會成為名詞子句中的主詞、受詞或補語，所以後面接的內容會缺少其中一個成分。(A) What 也不能視為修飾後面名詞的疑問形容詞，因為疑問形容詞修飾名詞時，中間不會插入定冠詞（the）。代名詞 (C) This（這個）不能引導名詞子句。","group":"135-138"},{"id":139,"part":6,"stem":"Choose the best answer for blank 139 in the passage.","choices":["Formerly","Conversely","Meanwhile","Appropriately"],"answer":"A","explanation":"正確答案：(A) Formerly。 空格和逗號一起出現在句子開頭的連接副詞位置，所以要掌握上一句和空格所在句子之間的關係，才能判斷答案。上一句提到會將標準年度獎金增加到年薪的 2%，而空格所在的句子說在這之前的獎金是 1%，所以表達在上一句的事情之前狀況的連接副詞 (A) Formerly（以前）是正確答案。(B) Conversely 表示「相反地」，(C) Meanwhile 表示「同時」，(D) Appropriately 表示「適當地」。另外，請記得 Meanwhile 是用來表達在某件事發生時，另一件事同時發生的情況。","group":"139-142"},{"id":140,"part":6,"stem":"Choose the best answer for blank 140 in the passage.","choices":["This is our highest profit increase in the past decade.","The company will be donating to a charitable organization.","The chosen candidate will sometimes have to work extra hours.","It will be included in your last paycheck of the year."],"answer":"D","explanation":"正確答案：(D) It will be included in your last paycheck of the year.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的部分提到，銷售額高於預期，所以能回饋更多獎金，也就是將標準年度獎金增加到年薪的 2%，所以空格的內容應該和即將發放的獎金有關，(D) It will be included in your last paycheck of the year 是正確答案。 選項翻譯 (A) 這是我們過去十年來最高的利潤成長。 (B) 公司將會捐款給慈善組織。 (C) 獲選的人有時必須加班。 (D) 它將會包含在你今年最後一筆薪水裡。","group":"139-142"},{"id":141,"part":6,"stem":"Choose the best answer for blank 141 in the passage.","choices":["price","position","salary","quality"],"answer":"C","explanation":"正確答案：(C) salary。 句意是「獎金將以新的、比較高的薪水計算」，所以 (C) salary（薪水）是正確答案。(A) price 表示「價格」，(B) position 表示「位置，職位」，(D) quality 表示「品質，特質」。","group":"139-142"},{"id":142,"part":6,"stem":"Choose the best answer for blank 142 in the passage.","choices":["let","will let","to let","lets"],"answer":"C","explanation":"正確答案：(C) to let。 以 Please 開頭的子句（Please ~ know）不需要主詞，而且已經有動詞（come, see）和受詞（me），所以 to let me know 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語，並且表示目的「為了讓我知道」的 to 不定詞 (C) to let 是正確答案。動詞 (A)、(B)、(D) 都不能引導修飾片語。另外，請注意這裡的原形不定詞（沒有 to 的不定詞）know 是使役動詞 let 的受詞補語。","group":"139-142"},{"id":143,"part":6,"stem":"Choose the best answer for blank 143 in the passage.","choices":["would have come","is coming","came","has come"],"answer":"B","explanation":"正確答案：(B) is coming。 句意是「Harlington 即興劇團（HIP）將來到 Ferris Greene 表演藝術中心」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到不要錯過本週六登台表演的人，由此可知他們來到表演藝術中心是未來的事，能表達未來事件的現在進行式 (B) is coming 是正確答案。請記得現在進行式（be + -ing）可以表達預定的事，或者即將發生的事。","group":"143-146"},{"id":144,"part":6,"stem":"Choose the best answer for blank 144 in the passage.","choices":["delivers","reaches","meets","fulfills"],"answer":"A","explanation":"正確答案：(A) delivers。 句意是「HIP 利用來自觀眾的現場建議為靈感，藉以進行表演」，所以能和名詞 performance（表演）連用，構成 deliver a performance（進行表演，演出表演）的動詞 deliver（進行〔演講、表演等〕）的第三人稱單數形 (A) delivers 是正確答案。(B) reach 表示「到達，抵達」，(C) meet 表示「遇見，見面」。(D) fulfill（履行，滿足）意思好像說得通，但實際上是用來表示「履行承諾、義務」才對。","group":"143-146"},{"id":145,"part":6,"stem":"Choose the best answer for blank 145 in the passage.","choices":["They are seeking talented comedians to join their group.","All of the performances have been sold out for months.","This means that every single one of their shows is unique.","A list of their upcoming appearances is available online."],"answer":"C","explanation":"正確答案：(C) This means that every single one of their shows is unique.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 HIP (delivers) performances by using on-the-spot suggestions from the audience as inspiration 提到，HIP 利用來自觀眾的現場建議為靈感，藉以進行表演，所以空格的內容應該和 HIP 的表演有關。(C) This means that every single one of their shows is unique 是正確答案。(B) 雖然也和表演有關，但文章其他部分還在請讀者預約座位，所以應該不是所有表演的門票都賣完了。 選項翻譯 (A) 他們正在尋找有才華的喜劇演員加入他們的團體。 (B) 所有表演的門票都已經賣完好幾個月了。 (C) 這意味著他們的每一場表演都是獨一無二的。 (D) 他們即將登場的演出清單可以在網路上查到。","group":"143-146"},{"id":146,"part":6,"stem":"Choose the best answer for blank 146 in the passage.","choices":["Proceeded","Proceeding","Proceed","Proceeds"],"answer":"D","explanation":"正確答案：(D) Proceeds。 句子裡只有動詞（will go），缺少主詞，所以能當主詞的名詞 (B) 和 (D) 是可能的答案。因為要表達「售票收入將用來資助 Harlington 市立高中的藝術相關課後活動」，所以名詞 (D) Proceeds（收入）是正確答案。請記得 proceed 當名詞、表示「收入」時，要使用複數形。如果使用 (B) Proceeding（訴訟程序，進行）的話，意思會變成「來自售票的訴訟程序／進行，將用來資助 Harlington 市立高中的藝術相關課後活動」，所以不對。動詞或過去分詞 (A) 和動詞 (C) 不能當主詞。","group":"143-146"},{"id":147,"part":7,"stem":"What type of event most likely took place at Central Valley Financial Partners?","choices":["A retirement celebration","A product release party","An opening ceremony","A welcome reception"],"answer":"A","explanation":"正確答案：(A) A retirement celebration。 這是和題目關鍵詞語 type of event ~ at Central Valley Financial Partners 有關的推論問題。表單中的 Notes: Celebration for Richard Dugas、1 retirement card 顯示這是為 Richard Dugas 舉辦的慶祝活動，而且購買了 1 張退休賀卡，由此可以推知這是退休慶祝活動，所以 (A) 是正確答案。","group":"147-148"},{"id":148,"part":7,"stem":"What did Mr. Rhodes most likely do on December 10?","choices":["Told a team member to purchase some party supplies","Authorized the repayment of some money to an employee","Sent a reservation deposit to a catering company","Attended a special event at a banquet hall"],"answer":"B","explanation":"正確答案：(B) Authorized the repayment of some money to an employee。 這是和題目關鍵詞語 Mr. Rhodes do on December 10 有關的推論問題。表單中的 Authorized by: Patrick Rhodes、Signature: Patrick Rhodes、Date: December 10 顯示 Rhodes 先生在 12 月 10 日批准了這份報銷申請表，而這份表單是 Central Valley Financial Partners 公司的報銷申請表，金額為 185 元，由此可以推知 Rhodes 先生批准退還一些錢給員工，所以 (B) 是正確答案。","group":"147-148"},{"id":149,"part":7,"stem":"What kind of business does Pearson & Lennox most likely engage in?","choices":["Travel accommodations","Business consulting","Consumer research","Fashion retail"],"answer":"D","explanation":"正確答案：(D) Fashion retail。 這是和題目關鍵詞語 Pearson & Lennox ~ engage in 有關的推論問題。You must have proven sales experience in the high-end clothing sector 的部分提到，「您」（應徵 Pearson & Lennox 公司銷售顧問的人）必須在高級服飾領域有經證實的銷售經驗，而 Experience in the menswear industry is an advantage. 的部分又說在男裝產業的經驗是一項有利條件，由此可以推知 Pearson & Lennox 公司經營時尚零售業務，所以 (D) 是正確答案。","group":"149-150"},{"id":150,"part":7,"stem":"What is indicated about applicants for the positions?","choices":["They will need to attend an interview in person.","They must have expertise in men's clothing.","They must state their preferred workhours amount.","They will all be eligible for the same salaries."],"answer":"C","explanation":"正確答案：(C) They must state their preferred workhours amount.。 這是 Not/True 題型，要找出和關鍵詞語 applicants for the positions 有關的內容，並且對照選項判斷答案。(A) 和 (D) 在文章裡沒有提到。(B) 在 Experience in the menswear industry is an advantage. 的部分提到，在男裝產業的經驗是一項有利條件，但要注意這並不是必要的條件，所以不符合選項敘述。(C) 在 specifying whether you would like to work half or full days 的部分，要求註明想工作半天或整天，符合選項敘述，所以 (C) 是正確答案。","group":"149-150"},{"id":151,"part":7,"stem":"At 4:48 P.M., what does Ms. Perry most likely mean when she writes, \"That works out better for me\"?","choices":["She is pleased with the outcome of a meeting.","She intends to see clients at the start of the week.","She has time to take care of another task.","She prefers to be contacted by e-mail."],"answer":"C","explanation":"正確答案：(C) She has time to take care of another task.。 這一題問的是 Perry 小姐的訊息所表達的意圖，所以要掌握引用部分（That works out better for me）前後文的情境。Melvin Stuckey 說 Mr. Zhang asked that it be rescheduled to Wednesday，表示 Zhang 先生要求把會議改到星期三，對此 Perry 小姐回應 That works out better for me.（那樣對我來說比較方便），然後補充說 I can meet the engineering team on Tuesday，表示這樣一來她星期二就可以和工程團隊會面了。因此，Perry 小姐要表達的意思是會議改期之後，她就有時間處理其他工作了，(C) 是正確答案。","group":"151-152"},{"id":152,"part":7,"stem":"Why does Mr. Lucas need more time to prepare the handouts?","choices":["A printer is not working.","An employee is on leave.","Some pages have been misplaced.","Some data needs to be corrected."],"answer":"D","explanation":"正確答案：(D) Some data needs to be corrected.。 這是問為什麼（Why）Lucas 先生需要更多時間準備印刷物的 wh- 問題。和題目的關鍵詞語 Mr. Lucas need more time to prepare the handouts 有關的部分是 He called to say they'll be delayed. He noticed errors in the figures and has to reprint some pages.，這部分提到「他」（Lucas 先生）打電話來說會有所延誤，以及注意到數字的錯誤，必須重印一些頁面，所以 (D) 是正確答案。 變換表達方式 figures 數字 → data 數據","group":"151-152"},{"id":153,"part":7,"stem":"Why was the notice written?","choices":["To announce an additional market location","To inform clients about a price increase","To specify participant requirements","To provide details about booth changes"],"answer":"C","explanation":"正確答案：(C) To specify participant requirements。 這一題問的是寫這篇文章的理由，所以要注意文章開頭的部分。Green City Farmers' Market、Admission Guidelines 的部分顯示這是 Green City 農夫市集的參加指南，而 Any new farms wishing to rent a booth must do the following 的部分則提到，希望租用攤位的任何新農場都必須符合以下條件，之後則是具體的條件內容，所以 (C) 是正確答案。","group":"153-154"},{"id":154,"part":7,"stem":"What must a farm do to sell produce at the market?","choices":["Obtain a certificate issued by the government","Pay a fee through online banking","Submit a price list for items","Send some samples to the market management"],"answer":"A","explanation":"正確答案：(A) Obtain a certificate issued by the government。 這是問要在市集販售農產品，農場必須做什麼（What）的 wh- 問題。和題目的關鍵詞語 a farm do to sell produce at the market 有關的部分是 Receive an organic label from the state-run Organic Certification Services，這部分提到要獲得國營有機認證服務的有機標章，所以 (A) 是正確答案。 變換表達方式 an organic label from the state-run Organic Certification Services 國營有機認證服務的有機標章 → a certificate issued by the government 政府發行的證書","group":"153-154"},{"id":155,"part":7,"stem":"W he inspected Drexco's office.","She will be going back to university soon."],"answer":"D","explanation":"正確答案：(D) She will be going back to university soon.。 這是需要對照兩篇文章內容的推論題型，先看寄給題目關鍵詞語 Ms. Millstone 的第一封電子郵件。 線索1：第一封電子郵件（第一篇文章）中，I'd like to offer you the permanent full-time position of junior creative coordinator ~ 的部分提到，想提供初階創意統籌這個正式全職職位給 Millstone 小姐。不過，從這裡看不出來 Millstone 小姐是否接受了這個工作機會，所以還需要參考第二封電子郵件的內容。 線索2：第二封電子郵件（第二篇文章）中，he offered it to one of his interns, but she turned it down because she is returning to school for graduate studies next month 的部分提到，雖然「他」（Pruitt 先生）向一位實習生提出了這個工作機會（初階創意統籌），但她因為下個月要回學校上研究所而拒絕了。 綜合這兩個線索，可知 Millstone 小姐雖然得到 Pruitt 先生提出的工作機會，但因為要接著回學校上研究所而拒絕了，所以 (D) 是正確答案。","group":"186-190"},{"id":189,"part":7,"stem":"What is suggested about the junior creative coordinator position?","choices":["It has remained vacant for over a month.","It was not filled by an intern.","It will involve monthly business trips.","It does not require commuting to an office."],"answer":"B","explanation":"正確答案：(B) It was not filled by an intern.。 這是需要對照兩篇文章內容的推論題型，先看提到題目關鍵詞語 the junior creative coordinator position 相關內容的備忘錄。 線索1：備忘錄（第三篇文章）中，Wendy Sommers will be our new junior creative coordinator. Based on her aptitude test score, I believe that she will be a valuable addition to our department. 的部分提到，Wendy Sommers 將成為「我們」（Drexco 公司）新的初階創意統籌，也根據她的性向測驗分數，相信她會是部門中很有價值的新人。不過，這裡沒有提到她接受性向測驗的原因，所以還需要參考第二封電子郵件的內容。 線索2：第二封電子郵件（第二篇文章）中，If we ~ hire an outside candidate, this person will have to take our aptitude test. Note, though, that this would not apply to an intern who was promoted. 的部分提到，如果「我們」（人事部）雇用外部的人選，這個人必須接受性向測驗，但這不適用於升職的實習生（升職的實習生不需要做性向測驗）。 綜合這兩個線索，可知接下初階創意統籌這個職位的 Wendy Sommers 不是實習生，所以接受了性向測驗，(B) 是正確答案。","group":"186-190"},{"id":190,"part":7,"stem":"Why does Mr. Pruitt want the advertising staff to contact him?","choices":["To confirm their attendance at a party","To suggest local eating establishments","To provide training tips for a new employee","To volunteer to set up an office space"],"answer":"B","explanation":"正確答案：(B) To suggest local eating establishments。 這是問 Pruitt 先生為什麼（Why）希望廣告部員工聯絡他的 wh- 問題，所以要看寄給題目關鍵詞語 the advertising staff 的備忘錄（第三篇文章）。文章中的 I was thinking we could go to a restaurant in the area ~, so please let me know ~ if you have any preferences. 提到，正在考慮可以一下班就去附近的餐廳，要求如果有偏好（的餐廳）就告知，所以 (B) 是正確答案。 變換表達方式 a restaurant in the area 那個地區的餐廳 → local eating establishments 當地的餐廳","group":"186-190"},{"id":191,"part":7,"stem":"What is the main purpose of the memo?","choices":["To offer an incentive","To schedule a test","To provide an update","To request feedback"],"answer":"C","explanation":"正確答案：(C) To provide an update。 這一題問的是備忘錄（第一篇文章）的目的。Work has been coming along well on our newest fitness tracker 的部分提到，最新款健康追蹤器的相關工作進行得很順利，之後則提到產品候選名稱與測試者名單等方面的最新資訊，所以 (C) 是正確答案。","group":"191-195"},{"id":192,"part":7,"stem":"Which subject was probably added to the testing schedule?","choices":["Dorothy Glen","Farid Saman","Michael Flint","Pat Durban"],"answer":"A","explanation":"正確答案：(A) Dorothy Glen。 這是需要對照兩篇文章內容的推論題型，先看提到題目的關鍵詞語 subject was ~ added to the testing schedule 相關事項的備忘錄。 線索1：備忘錄（第一篇文章）中，When I went through our testing schedule, I noticed that all of them are in their 20s or 30s. I would like to have ~ subjects who are in their 40s or 50s 的部分提到，在瀏覽測試時間表的時候，注意到測試者全都是 20 幾或 30 幾歲，所以希望至少有一兩個測試者是 40 幾或 50 幾歲。不過，從這裡看不出追加測試者的情況，所以還需要參考測試時間表的內容。 線索2：測試時間表（第二篇文章）中，Subject: Dorothy Glen、Age and gender: 57/female 的部分顯示測試者 Dorothy Glen 的年齡是 57 歲。 綜合這兩個線索，可知 57 歲的 Dorothy Glen 是後來追加到測試時間表上的，所以 (A) 是正確答案。","group":"191-195"},{"id":193,"part":7,"stem":"What aspect of the product was tested at Oak Mountain?","choices":["The heart-rate monitor","Product durability","Water resistance","The pacing function"],"answer":"B","explanation":"正確答案：(B) Product durability。 這是問在 Oak 山測試了產品的什麼（What）方面的 wh- 問題，所以要看和題目關鍵詞語 aspect of the product was tested at Oak Mountain 有關的測試時間表（第二篇文章）。測試時間表中的 Location: Oak Mountain、Focus: Testing the ability to withstand shocks 顯示，在 Oak 山會測試抗衝擊能力，所以 (B) 是正確答案。 變換表達方式 the ability to withstand shocks 抗衝擊能力 → durability 耐用性","group":"191-195"},{"id":194,"part":7,"stem":"What is suggested about the Z-Model device?","choices":["It was popular among most of the test subjects.","The marketing team was unable to select a name for it.","It was given to test participants for free.","The researchers suggested changing its launch schedule."],"answer":"B","explanation":"正確答案：(B) The marketing team was unable to select a name for it.。 這是需要對照兩篇文章內容的推論題型，先看提到題目關鍵詞語 Z-Model device 相關內容的備忘錄。 線索1：備忘錄（第一篇文章）中，If the marketing department is unable to make a final decision on the name ~, we will ask survey respondents for their opinions. 的部分提到，如果行銷部無法做出名稱的最終決定，就會向問卷調查回答者詢問意見。不過，從這裡看不出來行銷部最後的決定如何，所以還需要參考表單的內容。 線索2：表單（第三篇文章）中，What do you think the product should be called? 的部分問回答問卷的人認為產品應該叫什麼名字。 綜合這兩個線索，可知因為行銷部無法做出最終決定，所以請回答問卷的人選擇產品的名稱，(B) 是正確答案。","group":"191-195"},{"id":195,"part":7,"stem":"What does Mr. Flint indicate about the prototype?","choices":["Its strap needs to be improved.","Its battery does not last long.","Its signals are not loud enough.","Its screen is difficult to adjust."],"answer":"A","explanation":"正確答案：(A) Its strap needs to be improved.。 這是要找出和題目關鍵詞語 Mr. Flint indicate about the prototype 相關內容的推論問題，所以要看 Flint 先生填寫的表單（第三篇文章）。Though I tightened the band to the maximum level, it still felt loose around my wrist. 的部分提到，就算把腕帶調到最緊，還是覺得在手腕上鬆鬆的，由此可以推知 Flint 先生認為腕帶需要改善，所以 (A) 是正確答案。","group":"191-195"},{"id":196,"part":7,"stem":"What problem is mentioned in the article?","choices":["A technical manual contained an error.","A production deadline was difficult to meet.","Assembly line equipment was out of operation.","New products were not sufficiently tested."],"answer":"D","explanation":"正確答案：(D) New products were not sufficiently tested.。 這是問文章（第一篇文章）中提到什麼（What）問題的 wh- 問題。this problem occurred because tests of newly manufactured vacuum cleaners were not being carried out comprehensively enough 的部分提到，「這個問題」（內含有缺陷的零件）之所以發生，是因為新生產吸塵器的測試執行得不徹底，所以 (D) 是正確答案。","group":"196-200"},{"id":197,"part":7,"stem":"In the article, the phrase \"carried out\" in paragraph 2, line 2, is closest in meaning to","choices":["transported","influenced","performed","negotiated"],"answer":"C","explanation":"正確答案：(C) performed。 文章（第一篇文章）中，carried out 所在的語句 tests of newly assembled vacuum cleaners were not being carried out comprehensively enough 之中，carried out 表示「被執行的」，所以同樣能表示「被執行的」的 (C) 是正確答案。","group":"196-200"},{"id":198,"part":7,"stem":"What will happen on November 3?","choices":["Mr. Gooding will plan an inspection of the Westland plant.","Mr. Sheeran will assess the quality of some components.","Ms. Clark will attend a meeting at Verta's headquarters.","Mr. Aduba will conduct some training."],"answer":"D","explanation":"正確答案：(D) Mr. Aduba will conduct some training.。 這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 happen on November 3，要問 11 月 3 日會發生什麼事（What），所以先看提到 11 月 3 日的文章。 線索1：文章（第一篇文章）中，The company has decided to stop production at all plants on November 3 的部分提到，公司已經決定 11 月 3 日停止在所有工廠的生產。不過，這裡沒有提到什麼事會隨著停止生產而發生，所以還需要參考備忘錄的內容。 線索2：備忘錄（第三篇文章）中，we will be shutting down production for one day. During this time, I will be teaching factory workers new testing processes 的部分提到，「我們」（Verta 公司）會停止生產一天，而在這段時間，「我」（Aduba 先生）會教導工廠員工新的測試程序。 綜合這兩個線索，可知 11 月 3 日 Verta 公司停止生產的時候，Aduba 先生會教導工廠員工新的測試程序，所以 (D) 是正確答案。","group":"196-200"},{"id":199,"part":7,"stem":"What is mentioned about BGW Group?","choices":["It is receiving advice from a consultant.","It has owned Verta products for less than a year.","It has had to replace some of its cleaning staff.","It is located in the largest city in the region."],"answer":"B","explanation":"正確答案：(B) It has owned Verta products for less than a year.。 這是 Not/True 題型，要找出和關鍵詞語 BGW Group 有關的內容，並且對照選項判斷答案，所以看 BGW Group 內部的電子郵件（第二篇文章）。(A)、(C)、(D) 在文章中沒有提到。(B) 在 no problems have been reported in the six months we've had them 的部分提到，在「我們」（BGW Group）擁有「它們」（Verta 公司的吸塵器）的 6 個月期間，沒有人報告過有關問題，符合選項敘述，所以 (B) 是正確答案。 變換表達方式 six months we've had them 我們擁有它們的 6 個月 → owned ~ for less than a year 擁有不到一年","group":"196-200"},{"id":200,"part":7,"stem":"Where will Ms. Clark tell employees to take some devices?","choices":["To 367 Van Dam Avenue","To 184 Southhaven Circle","To 2956 Marina Boulevard","To 5631 Campus Passage"],"answer":"C","explanation":"正確答案：(C) To 2956 Marina Boulevard。 這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 Ms. Clark tell employees to take some devices，問 Clark 小姐會叫員工把一些設備送到哪裡（Where），所以先看 Clark 小姐所寫的電子郵件。 線索1：電子郵件（第二篇文章）中，Please ~ find out exactly where the vacuum cleaners need to be taken. I'm not sure there's a Verta service center here in Blythville 的部分請對方具體了解必須把吸塵器送到哪裡，因為不確定他們所在的 Blythville 有沒有 Verta 公司的服務中心，而最後 let me know as soon as possible, so I can provide the relevant staff with the necessary information 又請對方盡快告知，好讓她把必要的資訊提供給相關員工。不過，這裡看不出來 Blythville 有沒有 Verta 公司的服務中心，所以還需要參考備忘錄的內容。 線索2：備忘錄（第三篇文章）中，Verta Service Center Locations、Blythville、2956 Marina Boulevard 的部分顯示 Verta 公司在 Blythville 有服務中心，地址是 Marina 大道 2956 號。 綜合這兩個線索，可知 Clark 小姐會叫員工把吸塵器送到位於 Blythville 的 Verta 公司服務中心，地址是 Marina 大道 2956 號，所以 (C) 是正確答案。","group":"196-200"}],"groups":{}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>131-134 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Paige Lagarde paigelagarde@peoplemail.com</strong></div><div class=\"doc-field\"><span>From</span><strong>Brad Jeong jeongbrad@cucinaaid.com</strong></div><div class=\"doc-field\"><span>Date</span><strong>March 2</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Re: CucinaAid mixer problem</strong></div></div><p>Dear Ms. Lagarde,</p><p>You wrote to let us know that the whisk attachment for your CucinaAid mixer isn't tight enough when you screw it on. You have every reason to be concerned. <span class=\"reading-blank\">〔131〕</span> attachments pose a safety risk, and we are glad that you brought the matter to our attention.</p><p>We believe that the defect <span class=\"reading-blank\">〔132〕</span> during a recent production run, when we may have used the wrong parts by mistake. We are very sorry and would like to offer to <span class=\"reading-blank\">〔133〕</span> your machine. Just stop by any of our service centers, and one of our technicians will be glad to fix it for you at no charge. To make up for the inconvenience, please also accept the following coupon code for $25 off your next CucinaAid purchase: UW3-G6BQ1. <span class=\"reading-blank\">〔134〕</span></p><p>Sincerely,<br/>Brad Jeong<br/>CucinaAid, Customer Service Agent</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>135-138 · 1/1</small></div><div class=\"document-body\"><p>As local shoppers are aware, Diamond Plaza Mall is currently undergoing a major <span class=\"reading-blank\">〔135〕</span>. Now that it has been closed for a month, its management has revealed that the renovation is going smoothly and that House Lab has agreed to lease 7,000 square feet. House Lab, a top appliance retailer, will no doubt attract plenty of people to the mall. <span class=\"reading-blank\">〔136〕</span> There has already been speculation that it will occupy the space to the left of the main entrance. While this is certainly significant news, <span class=\"reading-blank\">〔137〕</span> other information about the renovation has been released yet. <span class=\"reading-blank\">〔138〕</span> the food court will finally undergo a much-needed expansion, for instance, is still unknown. More details are expected to be disclosed at a press conference next month.</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>139-142 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All staff</strong></div><div class=\"doc-field\"><span>From</span><strong>Robert Valdez, Management Department</strong></div><div class=\"doc-field\"><span>Subject</span><strong>End of the Year</strong></div><div class=\"doc-field\"><span>Date</span><strong>December 1</strong></div></div><p>As the year comes to an end, the managers at Voyager Communications would like to thank everyone for their hard work and perseverance. Because of your efforts, sales were higher than anticipated, allowing us to reward you with larger bonuses. We will be increasing the standard annual bonus to 2 percent of your salary. <span class=\"reading-blank\">〔139〕</span>, the bonus was 1 percent. <span class=\"reading-blank\">〔140〕</span></p><p>Also, in case you are wondering if the well-deserved pay raise many of you received last week will be factored into the bonus amount, the answer is yes. The bonus will be calculated using your new, higher <span class=\"reading-blank\">〔141〕</span>.</p><p>Please come and see me in my office <span class=\"reading-blank\">〔142〕</span> me know if you have any questions.</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▣ NOTICE</span><small>143-146 · 1/1</small></div><div class=\"document-body\"><p>The Harlington Improvisation Players (HIP) <span class=\"reading-blank\">〔143〕</span> to the Ferris Greene Performing Arts Center on July 9. If you like to laugh, don't miss Liza Smythe, Dennis Armstrong, Jackson Parcell, and Charlie Cousins as they take the stage on this Saturday. As always, HIP <span class=\"reading-blank\">〔144〕</span> performances by using on-the-spot suggestions from the audience as inspiration. <span class=\"reading-blank\">〔145〕</span> And they will make you smile for a good cause. <span class=\"reading-blank\">〔146〕</span> from ticket sales will go to benefit extracurricular art-related activities at Harlington City High School. Visit www.ferrisgreenepac.com/shows to reserve your seats and get more information.</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>▦ FORM</span><small>147-148 · 1/1</small></div><div class=\"document-body\"><h4>Central Valley Financial Partners REIMBURSEMENT REQUEST FORM</h4><h4>Number: 382625</h4><h4>Purchases:</h4><div class=\"doc-table-wrap\"><table class=\"doc-table\"><tr><th>Description of Items</th><th>Amount</th></tr><tr><td>8 pizzas ($15 each)</td><td>$120</td></tr><tr><td>Balloons and decorations</td><td>$22</td></tr><tr><td>1 decorated cake</td><td>$38</td></tr><tr><td>1 retirement card</td><td>$5</td></tr><tr><td>Total amount</td><td>$185</td></tr></table></div><h4>Notes: Celebration for Richard Dugas on December 9</h4><p>Submitted by: Elisa Cooper<br/>Signature: Elisa Cooper<br/>Date: December 10</p><p>Authorized by: Patrick Rhodes<br/>Signature: Patrick Rhodes<br/>Date: December 10</p><h4>Please submit receipts with this request form.</h4></div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement\"><div class=\"doc-ribbon\"><span>▣ ADVERTISEMENT</span><small>149-150 · 1/1</small></div><div class=\"document-body\"><h4>Pearson &amp; Lennox</h4><h4>Dorney—Full-time and Part-time Sales Consultants</h4><p>As a premium brand, we take pride in our reputation for providing exemplary customer service to all of our clients. Currently, we are seeking two full-time and two part-time sales consultants with a passion for customer service to work at our store on Village Road in Dorney.</p><p>You must have proven sales experience in the high-end clothing sector as well as enthusiasm, an outgoing personality, and a unique sense of style. Experience in the menswear industry is an advantage.</p><p>If you are interested in joining our team, please send your résumé to recruitment@pearsonlennox.com, specifying whether you would like to work half or full days.</p><h4>Pearson &amp; Lennox</h4></div></section></div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 151-152</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>▤ MESSAGES</span><small>151-152 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-thread\"><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Melvin Stuckey</b><time>4:47 P.M.</time></div><div class=\"chat-content\">Did you get my message about the meeting with the Chinese investors? Mr. Zhang asked that it be rescheduled to Wednesday.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Rhonda Perry</b><time>4:48 P.M.</time></div><div class=\"chat-content\">I just read it. That works out better for me. I can meet the engineering team on Tuesday.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Melvin Stuckey</b><time>4:48 P.M.</time></div><div class=\"chat-content\">All right. I'll confirm with Mr. Zhang.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Rhonda Perry</b><time>4:50 P.M.</time></div><div class=\"chat-content\">One more thing. Has Mr. Lucas been in touch? I asked him to turn in the handouts for the investors meeting by Monday morning.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Melvin Stuckey</b><time>4:51 P.M.</time></div><div class=\"chat-content\">He called to say they'll be delayed. He noticed errors in the figures and has to reprint some pages. They'll be here Tuesday afternoon.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Rhonda Perry</b><time>4:51 P.M.</time></div><div class=\"chat-content\">That shouldn't be a problem. Thank you, Melvin. I'll see you on Monday.</div></div></div></div></section></div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 153-154</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▣ NOTICE</span><small>153-154 · 1/1</small></div><div class=\"document-body\"><p>Green City Farmers' Market<br/>Admission Guidelines</p><p>Green City Farmers' Market prides itself on being a traditional West Hollywood institution with the highest standards. Any new farms wishing to rent a booth must do the following:</p><ul class=\"doc-bullets\"><li>Receive an organic label from the state-run Organic Certification Services (OCS)</li><li>Undergo a water inspection by the Green City Farmers' Market management</li><li>Pay the vendor fee for the whole season</li></ul><p>To inquire about specific rental options, please e-mail the market coordinator, Cathy Keller, at c.keller@greencityfm.org.</p></div></section></div>","155-157":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 155-157</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>155-157 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Jacob Lee jc.lee@penmail.com</strong></div><div class=\"doc-field\"><span>From</span><strong>Amy Narvasa a.narvasa@naturewatch.org</strong></div><div class=\"doc-field\"><span>Subject</span><strong>We value your membership</strong></div><div class=\"doc-field\"><span>Date</span><strong>November 18</strong></div></div><p>Dear Mr. Lee,</p><p>Your support has been crucial to our work. Thanks to you and others like you, we have been able to protect and restore over 500 square kilometers of vital natural resources in eight different countries. As we approach the end of another year, we hope we can count on you to renew your commitment once again.</p><p>Please visit our Web site to complete our secure online renewal form. With your renewal, you will receive a monthly copy of our award-winning magazine Inside Nature, which is filled with photos and stories about the work you have helped make possible. As a member, you'll also be able to track our projects and get involved in various ways by using our mobile application.</p><p>You can feel confident that your contributions are being put to good use. Nature Watch receives high ratings in charity assessments performed by groups such as Conscious Business, the Smart Giving Alliance, and the American Philanthropic Society.</p><p>Sincerely,</p><p>Amy Narvasa<br/>Member Relations</p></div></section></div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 158-160</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>158-160 · 1/1</small></div><div class=\"document-body\"><p>Sachs Export Furnishings MEMO</p><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All department managers</strong></div><div class=\"doc-field\"><span>From</span><strong>Hilda Marley, IT director</strong></div><div class=\"doc-field\"><span>Subject</span><strong>CRM software</strong></div><div class=\"doc-field\"><span>Date</span><strong>March 20</strong></div></div><p>As you know, I am shopping for customer relationship management (CRM) software to replace our current system, which is not computerized. The need for CRM software has become increasingly apparent as our client list has expanded. It should allow us to better manage customer data, leading to enhanced customer service, streamlined order processing, and improved product development, among other things. — [1] —</p><p>In connection with the above, I would like each of you to select two members from your department to take part in product trials. I have narrowed down our options to three vendors. — [2] — Each vendor's product will be tested over a 30-day period. At the end of this time, trial participants will provide feedback in a report.</p><p>Once we have selected appropriate software, I will also need your help with implementing its use. — [3] — We want to make sure that all staff are aware of the benefits of the CRM software and how easy it is to use.</p><p>Please e-mail me your recommendations by tomorrow. — [4] — We will meet on Friday and hopefully begin testing by early April.</p></div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 161-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>▤ MESSAGES</span><small>161-164 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-thread\"><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Oskar Jensen</b><time>9:18 A.M.</time></div><div class=\"chat-content\">Good morning, team. Just checking in to see if you have any last-minute concerns about the career fair.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Emma Blom</b><time>9:21 A.M.</time></div><div class=\"chat-content\">None on my part, Oskar. The layout has been finalized and approved by all corporate participants. I'm holding a final meeting with the volunteers in two days to go over various procedures.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Lilly Mattson</b><time>9:24 A.M.</time></div><div class=\"chat-content\">Same here. People are continuing to register through our Web site and download our mobile application. We're also seeing a lot of activity on social media.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Emma Blom</b><time>9:25 A.M.</time></div><div class=\"chat-content\">Oh, I actually do have one concern. Any news on my request for Chinese language interpreters?</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Oskar Jensen</b><time>9:27 A.M.</time></div><div class=\"chat-content\">Yes, Emma. I put your request in. I'm still waiting to hear back from Axel. He needs to approve the additional cost.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Lilly Mattson</b><time>9:29 A.M.</time></div><div class=\"chat-content\">I just saw him walk in. Let me get him to join the discussion.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Axel Lofgren</b><time>9:35 A.M.</time></div><div class=\"chat-content\">Hi, everyone. I'm happy to report that the request was approved.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Oskar Jensen</b><time>9:36 A.M.</time></div><div class=\"chat-content\">Thank you, Axel. Emma, please go ahead and make arrangements with Exalan Interpretation Agency.</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Emma Blom</b><time>9:39 A.M.</time></div><div class=\"chat-content\">Already on it. Thanks.</div></div></div></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>✉ LETTER</span><small>165-167 · 1/1</small></div><div class=\"document-body\"><p>City of Columbus</p><p>January 23</p><p>CEO Julia Peron<br/>Mindmatter<br/>1135 Enos Lane<br/>Bakersfield, CA 93314</p><p>Dear Ms. Peron,</p><p>I am writing in support of Columbus's bid to become the site of Mindmatter's second corporate headquarters. I strongly believe that our city would be an ideal location.</p><p>To begin with, Columbus is business friendly and has a history of fostering companies in industries as diverse as telecommunications, health care, and software development. As a leading online retailer, Mindmatter would no doubt appreciate the various forms of infrastructure that we have in place. For instance, our air, road, and rail links provide convenient access to cities around the world as well as to neighboring regions. In addition, Columbus offers an abundance of cultural attractions, entertainment facilities, and outdoor spaces to help your employees enjoy a healthy work-life balance. And speaking of employees, the population here is well educated, with our world-class universities promising a deep pool of future talent to tap into. Best of all, Columbus provides all of the above without the high property costs typical of other cities.</p><p>I am confident that you will recognize the advantages of establishing a headquarters in Columbus, and I would be glad to arrange a meeting to discuss specific sites. Thank you for your consideration.</p><p>Sincerely,</p><p>Tom Vickers<br/>Mayor of Columbus</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▣ NOTICE</span><small>168-171 · 1/1</small></div><div class=\"document-body\"><h4>NOTICE</h4><p>Following the approval of Springdale City Council, construction of a 10,000-square-meter community center will soon be under way. — [1] —. The center's main facilities will be a children's playground, a library, and a senior center. It will also contain an event space with a catering kitchen. Future plans involve adding a full-size gymnasium for indoor sports.</p><p>A groundbreaking ceremony is set for March 20 at the corner of Thompson Street and Huntsville Avenue. — [2] —. The center will open in the fall of next year and the gymnasium the year after that. After the center opens next year, free public access will be granted to all the facilities except for the event space, which will have an hourly rental fee. However, a discount on this will be given to anyone who presents proof of local residency. — [3] —.</p><p>More information about this project can be found at www.springdale.gov/communitycenter. — [4] —. Residents are encouraged to visit this site to submit their ideas for the name of the center. The winning name will be announced prior to the center's opening.</p></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>172-175 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Mazzi Milk Makes a Comeback</h2><p>NAIROBI, October 4— Mazzi is back in the spotlight several decades after it first appeared on store shelves. Sales of the sweetened milk rose 32 percent in September, according to results announced yesterday by Kamba Foods, the company that makes the product.</p><p>\"Traditionally, we have not invested heavily in Mazzi,\" said Kamba Foods CEO Roger Bivott. \"The product was successful at the start, but sales slowly stopped rising over time.\"</p><p>According to Sophie Oduya, a market analyst with Food Web Africa, Kamba Foods has responded to a regional trend. \"More and more people want something quick and easy that they can pick up at a supermarket or convenience store. It's no surprise then that Mazzi has enjoyed strong sales.\" In its original form, which is still available, consumers must add water to Mazzi powder. The newly fashionable Mazzi comes in bottles, ready-to-drink.</p><p>Mr. Bivott credits the new Mazzi with helping to push Kamba Foods' total sales up by 4.1 percent for the year. Although this is slightly lower than last year's figure, stock analysts believe year-end results will be much higher. So far, shares have risen 3.6 percent since the results were announced.</p></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-web\"><div class=\"doc-ribbon\"><span>◎ WEBSITE</span><small>176-180 · 1/2</small></div><div class=\"document-body\"><p>www.chersterville.gov/commercialbicycling</p><p>City of Chesterville Commercial Bicycling</p><p>Cyclists can deliver food, mail, and other items to locations around the city. To help reduce congestion and to avoid traffic problems, the following legislation for cyclists and the businesses that employ them has been implemented.</p><p>Requirements for Businesses<br/>• Businesses must ensure that cyclists have received a commercial biking permit from the Transportation Office at City Hall. This card will feature a three-digit ID number.<br/>• Cyclists must be provided with protective headgear and reflective vests that display the name of the business and the employee's ID number.<br/>• Businesses must keep a list of all their current and former cyclists and update it regularly. Templates for this list can be downloaded here.</p><p>Requirements for Cyclists<br/>• While working, commercial cyclists must carry the card featuring their ID number.<br/>• Commercial cyclists are personally responsible for completing Chesterville's Bicycle Safety Course. It can be taken for free here.</p><p>Penalties<br/>Failure to comply with any of these requirements will result in a $100 fine. The fine will be doubled to $200 if the same violation is repeated.</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>▦ FORM</span><small>176-180 · 2/2</small></div><div class=\"document-body\"><h4>Commercial Bicyclist List</h4><h2 class=\"doc-heading enhanced-heading\">Business/Address: East Street Diner, 367 East Street, Chesterville</h2><div class=\"doc-table-wrap\"><table class=\"doc-table\"><tr><th>Name:</th><th>Tony Esposito</th></tr><tr><td>ID Number:</td><td>983</td></tr><tr><td>Address:</td><td>26 Lauder Street, Chesterville</td></tr><tr><td>Bicycle Safety Course Completion:</td><td>Yes</td></tr><tr><td>Shift Hours:</td><td>8 A.M. – 3 P.M. Monday–Friday</td></tr><tr><td>Notes:</td><td>Weekend hours may be available upon request</td></tr><tr><td>Name:</td><td>Gina Doncaster</td></tr><tr><td>ID Number:</td><td>979</td></tr><tr><td>Address:</td><td>745 Cranston Lane, Chesterville</td></tr><tr><td>Bicycle Safety Course Completion:</td><td>Yes</td></tr><tr><td>Shift Hours:</td><td>3 P.M. – 9 P.M. Monday–Friday; 8 A.M. – 3 P.M. Saturday</td></tr><tr><td>Notes:</td><td>Final paycheck issued August 30</td></tr><tr><td>Name:</td><td>Freddy Velasquez</td></tr><tr><td>ID Number:</td><td>993</td></tr><tr><td>Address:</td><td>347 Prescott Boulevard, Chesterville</td></tr><tr><td>Bicycle Safety Course Completion:</td><td>No</td></tr><tr><td>Shift Hours:</td><td>3 P.M. – 9 P.M. Monday–Friday; 8 A.M. – 3 P.M. Saturday</td></tr><tr><td>Notes:</td><td>May be available to work extra shifts</td></tr></table></div></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement\"><div class=\"doc-ribbon\"><span>▣ ADVERTISEMENT</span><small>181-185 · 1/2</small></div><div class=\"document-body\"><p>ADBG's 10th Annual Baseball Game<br/>June 23<br/>Portez Stadium, Atlanta, Georgia</p><p>Over the past 10 years, the Atlanta Downtown Business Group (ADBG) baseball game has been an engaging way to provide small business owners with the opportunity to promote and market themselves in the community. The ADBG is pleased to offer the following levels of sponsorship for the fund-raising game:</p><div class=\"doc-table-wrap\"><table class=\"doc-table\"><tr><th>Sponsorship Level</th><th>Price</th><th>Benefits</th></tr><tr><td>1st Base</td><td>$250</td><td>A 24x36 inch company poster put up at the stadium entrance</td></tr><tr><td>2nd Base</td><td>$500</td><td>The benefit of 1st Base level; A 5x2 foot company display stand set up at the ticket office</td></tr><tr><td>3rd Base</td><td>$750</td><td>All the benefits of 2nd Base level; A 4x5 foot company banner hung at the baseball field</td></tr><tr><td>Home Plate</td><td>$1,000</td><td>All the benefits of 3rd Base level; A 10x12 foot billboard next to viewer seats; Company logo printed on one of the team's uniforms</td></tr></table></div><p>Please contact our office manager, Tessa Reynolds, at treynolds@adbg.org if you are interested in becoming a sponsor.</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>181-185 · 2/2</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Rajiv Patel rajiv.patel@nstflorists.com</strong></div><div class=\"doc-field\"><span>From</span><strong>Tessa Reynolds treynolds@adbg.org</strong></div><div class=\"doc-field\"><span>Date</span><strong>April 30</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Thank you</strong></div></div><p>Dear Mr. Patel,</p><p>Thank you for registering North Street Florists as a sponsor for our upcoming baseball game. I was pleased to hear that your sponsorship of this event in previous years was beneficial to your business.</p><p>I received the design you e-mailed me, and I have already forwarded it to the company that makes the banners. After they're printed, they'll be delivered to the address provided. However, I forgot to ask you one question when we spoke yesterday. The Atlanta Bears and Charleston Raptors are the two teams that have volunteered to play the game.</p><p>Do you have a preference regarding which team wears your logo? Please let me know as soon as possible. Thank you!</p><p>Sincerely, Tessa Reynolds</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>186-190 · 1/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Catherine Millstone catherinemillstone@drexco.com</strong></div><div class=\"doc-field\"><span>From</span><strong>Ron Pruitt ronpruitt@drexco.com</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Your internship</strong></div><div class=\"doc-field\"><span>Date</span><strong>August 13</strong></div></div><p>Dear Catherine,</p><p>As I'm sure you're aware, your internship with Drexco's advertising department will be ending on September 3. During your time with us, you've worked hard and taken your job seriously. That's why I'd like to offer you the permanent full-time position of junior creative coordinator here. Please take some time to consider this offer carefully. I'll be leaving today to attend a media conference that begins tomorrow, but I'll be back on Friday. I'd appreciate it if you could drop by my office then to let me know your decision.</p><p>Best,</p><p>Ron Pruitt<br/>Director of Advertising</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>186-190 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Ginger Rollins gingerrollins@drexco.com</strong></div><div class=\"doc-field\"><span>From</span><strong>Harry Shute harryshute@drexco.com</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Open advertising department position</strong></div><div class=\"doc-field\"><span>Date</span><strong>August 16</strong></div></div><p>Dear Ms. Rollins,</p><p>Ron Pruitt just got back from the Los Angeles conference today, and I spoke to him about the open junior creative coordinator position. It seems that he offered it to one of his interns, but she turned it down because she is returning to school for graduate studies next month.</p><p>Mr. Pruitt has indicated that he may offer the job to another of his interns but only after conducting some evaluations on September 3. If Mr. Pruitt decides not to make this offer, you may post some advertisements on employment Web sites. If we go ahead and hire an outside candidate, this person will have to take our aptitude test. Note, though, that this would not apply to an intern who was promoted.</p><p>Thanks,</p><p>Harry Shute<br/>Director of Human Resources</p></div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>186-190 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All staff in Drexco's advertising department</strong></div><div class=\"doc-field\"><span>From</span><strong>Ron Pruitt</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Tomorrow</strong></div><div class=\"doc-field\"><span>Date</span><strong>September 11</strong></div></div><p>I am pleased to announce that Wendy Sommers will be our new junior creative coordinator. Based on her aptitude test score, I believe that she will be a valuable addition to our department. She will begin working in our office tomorrow, and I would like to do something to make her feel welcome. I was thinking we could go to a restaurant in the area after work, so please let me know by 5 P.M. today if you have any preferences.</p><p>Best,<br/>Ron Pruitt</p></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>191-195 · 1/3</small></div><div class=\"document-body\"><p>Fitness Friends Memo</p><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Testing division</strong></div><div class=\"doc-field\"><span>From</span><strong>Ed Burtoft</strong></div><div class=\"doc-field\"><span>Date</span><strong>August 2</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Research for Z-Model</strong></div></div><p>Work has been coming along well on our newest fitness tracker, which we are currently referring to by its temporary name, Z-Model. Chief marketing officer Signe Jepsen has shared a short list of possible final names for the product, including Trail Blazer and Split Second. If the marketing department is unable to make a final decision on the name by August 11, we will ask survey respondents for their opinions.</p><p>On Thursday, you will be given a prototype of the Z-Model from the research department for testing. First, though, we need to finalize our list of test subjects. When I went through our testing schedule, I noticed that all of them are in their 20s or 30s. I would like to have at least one or two subjects who are in their 40s or 50s in order to get responses from users who are a bit older.</p></div></section><section class=\"document-card type-table\"><div class=\"doc-ribbon\"><span>▦ SCHEDULE</span><small>191-195 · 2/3</small></div><div class=\"document-body\"><h4>Testing Schedule for Z-Model</h4><div class=\"doc-table-wrap\"><table class=\"doc-table\"><tr><th>Time</th><th>Subject</th><th>Age and gender</th><th>Location</th><th>Activity</th><th>Focus</th></tr><tr><td>9:30 A.M.</td><td>Dorothy Glen</td><td>57/female</td><td>Grand Park</td><td>Walking</td><td>Testing the heart-rate function</td></tr><tr><td>11:30 A.M.</td><td>Farid Saman</td><td>23/female</td><td>Caribou Lake</td><td>Running</td><td>Testing the pacing feature</td></tr><tr><td>2:30 P.M.</td><td>Michael Flint</td><td>37/male</td><td>Parklane Community Swimming Pool</td><td>Swimming</td><td>Testing the waterproofing</td></tr><tr><td>4:30 P.M.</td><td>Pat Durban</td><td>32/female</td><td>Oak Mountain</td><td>Cycling</td><td>Testing the ability to withstand shocks</td></tr></table></div></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>▦ FORM</span><small>191-195 · 3/3</small></div><div class=\"document-body\"><h4>Survey of Test Subject</h4><h4>Name: Michael Flint</h4><h2 class=\"doc-heading enhanced-heading\">Now that you've tested the prototype for our next fitness tracker, we'd like to learn more about your impressions.</h2><p>The product was comfortable to wear.<br/>Strongly agree / Agree / Neither agree nor disagree / Disagree / Strongly disagree</p><p>The product was easy to use.<br/>Strongly agree / Agree / Neither agree nor disagree / Disagree / Strongly disagree</p><p>What did you like about the product?<br/>It was easy to change the information that was displayed using the buttons on the side. The battery seemed to last a long time—it was at 98 percent at the start of my 60-minute workout and when I finished, it was down to 90 percent.</p><p>What did you dislike about the product?<br/>Though I tightened the band to the maximum level, it still felt loose around my wrist. Whenever I raised my left arm, the fitness tracker moved around, which was uncomfortable.</p><p>What do you think the product should be called?<br/>Trail Blazer / Split Second / Mad Dash / Fast Track</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>196-200 · 1/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Verta Recalls Vacuums</h2><p>Appliance manufacturer Verta has requested that 5,000 vacuum cleaners be brought to service centers for inspection. According to Verta, the model in question—the Zurupat A7—contains a faulty part. \"This problem could potentially cause the device to overheat,\" said Verta product designer Bryce Gooding. \"Thankfully, none of our customers have reported any incidents yet.\"</p><p>Verta has revealed that this problem occurred because tests of newly manufactured vacuum cleaners were not being carried out comprehensively enough. The company has decided to stop production at all plants on November 3 to address the situation.</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>196-200 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Kenneth Sheeran k_sheeran@bgwgroup.com</strong></div><div class=\"doc-field\"><span>From</span><strong>Deanna Clark d_clark@bgwgroup.com</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Vacuum cleaners</strong></div><div class=\"doc-field\"><span>Date</span><strong>October 30</strong></div><div class=\"doc-field\"><span>Attachment</span><strong>Verta_Inspection_Notice</strong></div></div><p>Hi, Kenneth.</p><p>I received a notice today stating that all the Zurupat A7 vacuum cleaners we bought for our headquarters need to be brought to a Verta service center. There's a problem with one of the parts, it seems, though no problems have been reported in the six months we've had them.</p><p>The attached notice contains the manufacturer's contact information. Please call the service number for the Westland region and find out exactly where the vacuum cleaners need to be taken. I'm not sure there's a Verta service center here in Blythville, so BGW Group staff might have to take them to a different city. In any case, let me know as soon as possible, so I can provide the relevant staff with the necessary information.</p><p>Thanks,<br/>Deanna Clark, Office Administrator<br/>BGW Group</p></div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>196-200 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All staff</strong></div><div class=\"doc-field\"><span>From</span><strong>Ben Aduba, Westland Regional Manager, Verta</strong></div><div class=\"doc-field\"><span>Date</span><strong>October 28</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Update</strong></div></div><p>As you all know, we will be shutting down production for one day. During this time, I will be teaching factory workers new testing processes. Also, I have received a list of locations where people can take their Zurupat A7 vacuum cleaners to be inspected. When answering any inquiries, please be sure to refer to it in order to provide customers with information.</p><div class=\"doc-table-wrap\"><table class=\"doc-table\"><tr><th>City</th><th>Verta Service Center Locations</th></tr><tr><td>East Granyard</td><td>367 Van Dam Avenue</td></tr><tr><td>Bellmeadow</td><td>184 Southhaven Circle</td></tr><tr><td>Blythville</td><td>2956 Marina Boulevard</td></tr><tr><td>Woodebourne</td><td>5631 Campus Passage</td></tr></table></div></div></section></div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>131-134 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Paige Lagarde paigelagarde@peoplemail.com
