<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142c53">
<title>TOEIC 多益練習中心｜第 1～10 回</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#1b2b45;background:#f0f4fa;line-height:1.6}*{box-sizing:border-box}body{margin:0}.container{max-width:1050px;margin:auto;padding:24px 16px 56px}.hero{background:linear-gradient(120deg,#142b52,#28568c);color:#fff;border-radius:18px;padding:36px 30px;border-bottom:6px solid #eab94e}.hero h1{font-size:clamp(26px,4vw,38px);margin:0 0 9px}.hero p{margin:0;color:#e2ecfc;font-size:16px}.intro{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:27px 0 14px}.intro h2{font-size:21px;margin:0}.intro span{color:#697991;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.chapter{background:#fff;border:1px solid #dce5f0;border-radius:14px;padding:23px;display:flex;flex-direction:column;gap:11px;box-shadow:0 5px 18px #18334f0a}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.chapter h3{margin:0;font-size:23px;color:#1b3c68}.badge{font-size:12px;border-radius:20px;padding:4px 10px;background:#f0f3f7;color:#68778a;white-space:nowrap}.badge.ready{background:#e4f5e9;color:#186a40}.desc{margin:0;color:#586a82;font-size:14px;min-height:23px}.action{display:block;text-align:center;text-decoration:none;background:#2455a4;color:white;border-radius:9px;font-size:15px;font-weight:700;padding:12px 16px;transition:background .18s}.action:hover{background:#173e7c}.action.disabled{background:#e8edf4;color:#7b8797;cursor:not-allowed}.note{background:#fff;border:1px solid #dce5f0;border-radius:12px;padding:17px 20px;margin-top:24px;color:#52627a;font-size:14px}.note strong{color:#263f67}.footer{text-align:center;margin-top:24px;color:#8090a6;font-size:13px}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding:27px 21px}.container{padding:14px 12px 36px}.intro{align-items:start;flex-direction:column;gap:2px}.chapter{padding:19px}}
</style>
</head>
<body>
<main class="container">
<header class="hero"><h1>TOEIC 多益線上練習中心</h1><p>選擇練習回次｜詳細解析・閱讀中英切換・錯題複習・雲端作答紀錄</p></header>
<section class="intro"><h2>選擇練習回次</h2><span>第 1～10 回</span></section>
<section class="grid" id="chapterGrid" aria-label="練習回次列表"></section>
<section class="note"><strong>使用說明：</strong>點選已開放的回次即可開始作答。每回可在題目頁自行輸入雲端紀錄代號；不輸入時使用本機模式。未來新增回次，只要上傳相對應的 <code>Part02/index.html</code> 等檔案，並把本頁設定中的 <code>available</code> 改為 <code>true</code> 即可開放。</section>
<footer class="footer">TOEIC 練習中心｜自主練習使用</footer>
</main>
<script>
// 章節管理：未來新回次準備完成，把相對應的 available 改為 true 即可開放。
const CHAPTERS = [
  {number:1, title:'第 1 回', description:'101～200 題｜完整題庫', path:'Part01/', available:true},
  {number:2, title:'第 2 回', description:'題庫準備中', path:'Part02/', available:false},
  {number:3, title:'第 3 回', description:'題庫準備中', path:'Part03/', available:false},
  {number:4, title:'第 4 回', description:'題庫準備中', path:'Part04/', available:false},
  {number:5, title:'第 5 回', description:'題庫準備中', path:'Part05/', available:false},
  {number:6, title:'第 6 回', description:'題庫準備中', path:'Part06/', available:false},
  {number:7, title:'第 7 回', description:'題庫準備中', path:'Part07/', available:false},
  {number:8, title:'第 8 回', description:'題庫準備中', path:'Part08/', available:false},
  {number:9, title:'第 9 回', description:'題庫準備中', path:'Part09/', available:false},
  {number:10,title:'第 10 回',description:'題庫準備中', path:'Part10/', available:false}
];
const grid=document.getElementById('chapterGrid');
for(const item of CHAPTERS){
  const card=document.createElement('article');card.className='chapter';
  const top=document.createElement('div');top.className='top';
  const title=document.createElement('h3');title.textContent=item.title;
  const badge=document.createElement('span');badge.className='badge'+(item.available?' ready':'');badge.textContent=item.available?'已開放':'尚未開放';
  top.append(title,badge);
  const description=document.createElement('p');description.className='desc';description.textContent=item.description;
  const action=document.createElement(item.available?'a':'span');action.className='action'+(item.available?'':' disabled');action.textContent=item.available?'進入練習 →':'敬請期待';
  if(item.available)action.href=item.path;
  card.append(top,description,action);grid.append(card);
}
</script>
</body>
</html>
