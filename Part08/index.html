</style><style id="read-lock-style">body.read-locked>main{visibility:hidden!important;pointer-events:none!important}#readingAccessGate{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:18px;background:#0e2d45ed;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}#readingAccessGate[hidden]{display:none!important}#readingAccessGate .rg-card{width:min(440px,100%);background:#fff;color:#193451;border-radius:16px;padding:25px;box-shadow:0 20px 60px #07172c66}#readingAccessGate h2{margin:0 0 10px;font-size:22px}#readingAccessGate p{font-size:14px;color:#59718a;line-height:1.6}#readingAccessGate input{display:block;width:100%;border:1px solid #a9bdd2;border-radius:9px;padding:12px;margin:12px 0;font-size:18px;letter-spacing:2px}#readingAccessGate button{display:block;width:100%;background:#2159a8;color:#fff;border:0;border-radius:9px;padding:12px;font-weight:800;cursor:pointer}#readingAccessGate button:disabled{opacity:.5;cursor:wait}#readingAccessGate .rg-status{margin-top:11px;min-height:36px;font-size:13px;color:#36566e}</style></head><body class="read-locked"><section id="readingAccessGate" role="dialog" aria-modal="true" aria-labelledby="rgTitle"><div class="rg-card"><h2 id="rgTitle">🔒 TOEIC 閱讀練習｜代號驗證</h2><input id="rgCode" type="text" inputmode="text" maxlength="32" autocomplete="off" placeholder="使用者代號" aria-label="使用者代號"><button id="rgEnter" type="button">驗證並進入練習</button><div id="rgStatus" class="rg-status" role="status">請輸入使用者代號。</div></div></section><main class="shell"><section id="accountToolbar" class="panel" style="margin:0 0 14px"><div class="account-line"><label for="accountCode"><strong>使用者代號</strong></label><input id="accountCode" type="text" inputmode="text" maxlength="32" autocomplete="off" placeholder="輸入使用者代號"><button id="connectCode" type="button">載入紀錄</button><button id="leaveCode" type="button" hidden>退出雲端模式</button><a class="home-link" href="../index.html" title="返回 TOEIC 練習中心首頁">🏠 回首頁</a><a class="exam-link" href="exam.html" title="前往第八回擬真模擬考（100 題計時測驗）">📝 擬真試題</a></div><p id="cloudNotice" role="status" class="small">未輸入代號：使用本機暫存。</p></section><header><h1>TOEIC 多益線上練習｜第八回</h1></header><section class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="right">0</b><span>答對</span></div><div class="stat"><b id="wrong">0</b><span>答錯</span></div><div class="stat"><b id="accuracy">0%</b><span>正確率</span></div></section><div class="toolbar"><select id="part"><option value="all">全部 Part</option><option value="5">Part 5</option><option value="6">Part 6</option><option value="7">Part 7</option></select><button id="all" class="active">全部題目</button><button id="missed">錯題專項練習 <span id="drillCount"></span></button><button id="starred">★ 星號題目</button><button id="overview">錯題總覽</button><button id="excerptsView" type="button">文字摘錄</button><button id="exportWrong">匯出錯題</button><button id="export">匯出作答 CSV</button><label class="import-button" for="importCsv">匯入作答 CSV</label><input id="importCsv" type="file" accept=".csv,text/csv" hidden><button id="reset">重新作答</button></div><div class="answer-pref"><label for="explainMode">作答後解析：</label><select id="explainMode" aria-label="選擇答題後解析開啟方式"><option value="auto">自動展開</option><option value="manual">點擊展開</option></select><span>解析依第八回答案詳解整理；閱讀文章可切換中英文全文</span></div><section id="drillTools" class="panel" hidden><div class="drill-toolbar"><strong>錯題專項練習</strong><span id="drillInfo"></span><button type="button" id="drillRestart">重新練習全部錯題</button><button type="button" id="drillRemove">手動移除此題</button></div><p class="small">錯題不會因答對而消失；作答後立即顯示正解與詳細解析。此模式完全不修改正式測驗的作答紀錄。</p></section><section id="wrongOverview" class="panel" hidden></section><section id="excerptOverview" class="panel" hidden></section><section id="quiz"></section><button type="button" id="selectionSave" aria-label="儲存選取的文字摘錄">✎ 儲存摘錄</button><div class="nav"><button id="prev">← 上一題</button><button id="next">下一題 →</button></div><section class="panel"><div class="head"><b>題號總覽</b><span class="small">綠色答對・紅色答錯・★ 已標記</span></div><div id="numbers" class="numbers"></div></section></main><script>
const DATA={"questions":[{"id":101,"part":5,"stem":"According to the news report, Philby Corporation ______ a new office in Utah at present.","choices":["is building","to build","will build","building"],"answer":"A","explanation":"正確答案：(A) is building。 句子（Philby Corporation ~ present）裡缺少動詞，所以動詞 (A) 和 (C) 是可能的答案。因為有表示現在時間的詞語（at present），所以表示現在進行中的事的現在進行式 (A) is building 是正確答案。未來式 (C) 表示未來發生的事、對於未來狀況的推測，或者意志。to 不定詞 (B) 和現在分詞 (D) 不能用在動詞位置。"},{"id":102,"part":5,"stem":"Ms. Wendt wanted to meet Mr. Andrews in person but had to call ______ instead.","choices":["his","himself","him","he"],"answer":"C","explanation":"正確答案：(C) him。 空格是動詞（call）的受詞，所以反身代名詞 (B) 和受格人稱代名詞 (C) 是可能的答案。因為要表達「Wendt 小姐想要親自見 Andrews 先生，但不得不改為打電話給他」，所以受格人稱代名詞 (C) him 是正確答案。反身代名詞 (B) 當受詞，表示和主詞相同的人或事物，而這裡的主詞（Ms. Wendt）和受詞並不是同一個人，所以不對。所有格人稱代名詞 (A) 和主格人稱代名詞 (D) 不能當受詞。就算把 (A) 當成所有代名詞「他的東西」，意思變成「Wendt 小姐不得不打電話給他的東西」，也說不通。"},{"id":103,"part":5,"stem":"Ms. Myers trained all the new staff and ______ offered to mentor anyone needing extra help.","choices":["well","both","even","too"],"answer":"C","explanation":"正確答案：(C) even。 因為要表達「除了訓練所有新員工以外，甚至還主動提議指導任何需要額外幫助的人」，所以在單字或片語前面做強調的 (C) even（甚至）是正確答案。副詞 (A) well（很好地），通常在動詞後面做修飾，而在這裡意思會變成「很好地提議去指導」，也不恰當。副詞 (D) too（太……）通常在形容詞或副詞前面做強調，或是在句尾表示「也……」的意思。代名詞 (B) both（兩者都）在這個句子裡沒有適當的指稱對象。"},{"id":104,"part":5,"stem":"The contractor asked that payment for his services be ______ by Friday afternoon.","choices":["making","made","make","have made"],"answer":"B","explanation":"正確答案：(B) made。 空格在 be 動詞（be）後面，所以能形成進行式的 -ing 形 (A) 和被動態的 p.p. 形 (B) 是可能的答案。因為要表達「付款被支付」的意思，所以能和空格前的 be 動詞形成被動態的動詞 make（做……）p.p. 形 (B) made 是正確答案。-ing 形構成現在進行式後，意思會變成「付款正在做……」，所以不對。動詞原形 (C) 和包含動詞 have 的原形的 (D) 不能接在 be 動詞後面。另外，請記得 suggest（建議）、ask（要求）、demand（要求）等等表示提議、要求、義務的動詞後面接 that 子句當受詞時，that 子句會使用動詞原形。"},{"id":105,"part":5,"stem":"The Portland Bearcats have ______ qualified to play in the regional hockey championship.","choices":["narrowed","narrowness","narrowly","narrow"],"answer":"C","explanation":"正確答案：(C) narrowly。 可以修飾動詞（have qualified）的是副詞，所以副詞 (C) narrowly（勉強地，差一點）是正確答案。動詞或過去分詞 (A)、名詞 (B)、動詞或形容詞 (D) 都不能修飾動詞。另外，請記得副詞修飾完成式（have + p.p.）時，副詞會出現在 have 和 p.p. 之間或後面。"},{"id":106,"part":5,"stem":"The city's ______ population growth has resulted in a scarcity of available housing.","choices":["rapid","tight","tedious","affluent"],"answer":"A","explanation":"正確答案：(A) rapid。 句意是「迅速的人口成長造成住宅缺乏」，所以形容詞 (A) rapid（迅速的）是正確答案。(B) tight 表示「緊的」，(C) tedious 表示「冗長乏味的」，(D) affluent 表示「富裕的」。另外，請記得 result in（導致……）這個慣用表達方式。"},{"id":107,"part":5,"stem":"______ her many achievements as an opera singer, Gloria Donahue has not yet won any major awards.","choices":["Next to","Far from","Because of","In spite of"],"answer":"D","explanation":"正確答案：(D) In spite of。 因為要表達「儘管有許多身為歌劇歌手的成就，但還沒得過任何重大獎項」，所以表讓步的介系詞 (D) In spite of（儘管有……）是正確答案。(A) Next to 表示位置「在……旁」。(B) Far from 表示「遠離……，完全不是……」，(C) Because of 表示理由「因為……」。"},{"id":108,"part":5,"stem":"The travel agency's ______ for increasing sales is to post customer testimonials on its Web site.","choices":["landmark","portfolio","strategy","approval"],"answer":"C","explanation":"正確答案：(C) strategy。 句意是「旅行社增加銷售的策略是在網站上刊登顧客的見證文」，所以名詞 (C) strategy（策略）是正確答案。(A) landmark 表示「地標，重大事件」，(B) portfolio 表示「作品集，投資組合」，(D) approval 表示「批准，贊成」。"},{"id":109,"part":5,"stem":"The ______ of the Rolstein Literary Prize will be selected by a number of literature enthusiasts.","choices":["received","receipt","recipient","receiving"],"answer":"C","explanation":"正確答案：(C) recipient。 空格在定冠詞（The）和介系詞（of）之間，所以名詞 (B) 和 (C)、功能相當於名詞的動名詞 (D) 是可能的答案。因為要表達「文學獎的得獎者將由一些文學熱愛者選出」，所以人物名詞 (C) recipient（接受者）是正確答案。事物名詞 (B) receipt（收據）和動名詞 (D) receiving（收到）會使意思變成「收據／收到將由一些文學熱愛者選出」，所以不對。動詞或過去分詞 (A) 不能用在名詞的位置。"},{"id":110,"part":5,"stem":"Mr. McGuire needs only one more issue of a rare comic book series to have a ______ set.","choices":["completion","complete","completer","completeness"],"answer":"B","explanation":"正確答案：(B) complete。 空格修飾後面的名詞（set），所以答案是形容詞 (B) complete（完整的）。名詞 (A)、(C)、(D) 不能修飾這裡的名詞。"},{"id":111,"part":5,"stem":"Unable to keep up with rising costs, many airlines have opted to ______ the in-flight meal service on domestic flights.","choices":["recover","eliminate","calculate","recognize"],"answer":"B","explanation":"正確答案：(B) eliminate。 句意是「由於無法跟上逐漸上升的成本，許多航空公司選擇去除國內航班的飛機餐服務」，所以 (B) eliminate（排除）是正確答案。(A) recover 表示「恢復，找回」，(C) calculate 表示「計算」，(D) recognize 表示「認出，認可」。"},{"id":112,"part":5,"stem":"Conference participants can receive a complimentary lunch by ______ the voucher in their welcome package.","choices":["redeem","redeeming","redeemed","redeems"],"answer":"B","explanation":"正確答案：(B) redeeming。 空格前面有介系詞（by），所以能當介系詞受詞的動詞 redeem（兌換〔優惠券等〕）轉為動名詞的形態 (B) redeeming 是正確答案。動詞 (A) 和 (D)、動詞或過去分詞 (C) 不能當介系詞的受詞。"},{"id":113,"part":5,"stem":"Factory robots have made it possible to carry out manufacturing tasks more quickly and ______.","choices":["assertively","statistically","accurately","intentionally"],"answer":"C","explanation":"正確答案：(C) accurately。 句意是「機器人使得更快速且精確地執行製造工作成為可能」，所以副詞 (C) accurately（精確地）是正確答案。(A) assertively 表示「果斷地」，(B) statistically 表示「統計上」，(D) intentionally 表示「有意地，故意」。"},{"id":114,"part":5,"stem":"In the event that the competition results in a tie, the prize money will be divided ______ both contestants.","choices":["within","off","along","between"],"answer":"D","explanation":"正確答案：(D) between。 因為要表達「獎金會被平分給兩位參賽者」，所以表示兩個對象間的位置或關係的介系詞 (D) between（在……之間）是正確答案。(A) within（在……之內）看中文翻譯似乎說得通，但它其實是表示期間或場所的範圍，所以不對。(B) off 表示位置「離開……」。(C) along 表示方向「沿著……」。就算把 off 和空格前面的動詞 divide 結合成動詞片語 divide off（把……分隔開）也不行，因為形成被動態（will be divided off）之後，就沒有可以接後面的名詞（both contestants）當受詞的成分了。"},{"id":115,"part":5,"stem":"Passengers ______ luggage in the airport's arrivals area should note that many bags look alike.","choices":["claiming","claim","claims","claimed"],"answer":"A","explanation":"正確答案：(A) claiming。 這個句子已經有具備主詞（Passengers）、動詞（should note）和受詞（that many bags look alike）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - luggage ~ arrival area 是修飾性的語句。修飾部分是修飾空格前面的名詞（Passengers），所以能引導修飾語句、在名詞後面做修飾的現在分詞 (A) 和過去分詞 (D) 是可能的答案。因為空格後面有受詞（luggage），而且被修飾的名詞（Passengers）和分詞在意義上是主動的關係「乘客領取行李」，所以動詞 claim（認領）的現在分詞 (A) claiming 是正確答案。過去分詞 (D) claimed 表示被動意義，而且後面不能接受詞，所以不對。動詞 (B) 和 (C) 不能引導修飾語句。"},{"id":116,"part":5,"stem":"Mr. Chen has nearly 30 years of advertising experience, making him a ______ professional in his field.","choices":["seasons","seasonal","seasoned","seasonally"],"answer":"C","explanation":"正確答案：(C) seasoned。 空格修飾後面的名詞（professional），所以形容詞 (B) 和 (C) 是可能的答案。因為要表達「將近 30 年的廣告經驗，使他成為自己領域中經驗豐富的專家」，所以形容詞 (C) seasoned（經驗豐富的）是正確答案。如果使用 (B) seasonal（季節性的），意思會變成「將近 30 年的廣告經驗，使他成為自己領域中季節性的專家」，所以不對。名詞或動詞 (A)、副詞 (D) 不能修飾名詞。"},{"id":117,"part":5,"stem":"Emperor Fabrics has signed a number of profitable ______ since Ms. Shane took over as a company director.","choices":["quotes","deals","petitions","applications"],"answer":"B","explanation":"正確答案：(B) deals。 句意是「Emperor Fabrics 公司簽了一些有利潤的協議」，所以名詞 (B) deals（協議）是正確答案。另外，請記得 sign a deal（簽定協議）這個慣用表達方式。(A) quote 表示「報價，引用」。(C) petition 表示「請願（書）」。(D) application 表示「申請（書），應徵」。"},{"id":118,"part":5,"stem":"The new bridge must be ______ enough to withstand the frequent storms that pass through the area.","choices":["severe","separate","genuine","sturdy"],"answer":"D","explanation":"正確答案：(D) sturdy。 句意是「新的橋必須夠堅固」，所以形容詞 (D) sturdy（堅固的）是正確答案。(A) severe 表示「嚴重的，嚴厲的」。(B) separate 表示「個別的，分開的」。(C) genuine 表示「真正的」。"},{"id":119,"part":5,"stem":"In ______ with the mall's policies, security guards will be given an access badge once training is complete.","choices":["compliance","comply","complied","complies"],"answer":"A","explanation":"正確答案：(A) compliance。 空格在介系詞（In）和介系詞（with）之間，所以名詞 (A) compliance（遵守，依從）是正確答案。另外，請記得 compliance 經常以 in compliance with（遵守，依照……）的形式使用。動詞 (B) 和 (D)、動詞或過去分詞 (C) 不能用在名詞的位置。"},{"id":120,"part":5,"stem":"The town of Hamilton has seven parks, all of ______ have hosted outdoor concerts at one time or another.","choices":["them","those","which","theirs"],"answer":"C","explanation":"正確答案：(C) which。 這個句子已經有具備主詞（The town of Hamilton）、動詞（has）和受詞（seven parks）的完整子句，所以 all of - - - - - - - - - - - - - - - - - - - - at one time or another 是修飾性的語句。因為修飾部分的開頭有數量表達方式 all of，所以能接在數量表達方式後面，同時引導修飾部分的受格關係代名詞 (C) which 是正確答案。受格人稱代名詞 (A)、指示代名詞 (B)、所有代名詞 (D) 都不能引導修飾語句。"},{"id":121,"part":5,"stem":"______ the annual Media Conference in Athens, most downtown hotels are fully booked.","choices":["Due to","As soon as","Besides","Such as"],"answer":"A","explanation":"正確答案：(A) Due to。 這個句子已經有具備主詞（most downtown hotels）和動詞（are ~ booked）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - ~ Athens 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表達「由於在雅典舉行的年度媒體會議，大部分的市區飯店都預約滿了」，所以介系詞 (A) Due to（由於……）是正確答案。(C) Besides 表示「除了……還有」，(D) Such as 表示「例如……」。 (B) As soon as（一……就）引導的是修飾子句而不是片語。"},{"id":122,"part":5,"stem":"Mr. Morgan ______ for an electrical installation job at Cuthright Tower by a former employer who was pleased with his work.","choices":["recommends","has recommended","was recommended","is recommending"],"answer":"C","explanation":"正確答案：(C) was recommended。 空格後面有使用於被動態的 by，而且句意是「Morgan 先生受推薦擔任電力設備安裝工作」，所以被動態 (C) was recommended 是正確答案。另外，請注意 recommend（推薦）經常以 recommend A for B（把 A 推薦給 B）的形式使用，但這個句子的動詞 recommend 使用被動態，所以原本的受詞（Mr. Morgan）變成了主詞。"},{"id":123,"part":5,"stem":"Level Field Landscaping has recently been ______ by the city for disposing of yard waste improperly.","choices":["commenced","accelerated","measured","fined"],"answer":"D","explanation":"正確答案：(D) fined。 句意是「因為垃圾處理不當而遭到罰款」，所以動詞 fine（罰款）的 p.p. 形 (D) fined 是正確答案。(A) commence 表示「開始」，(B) accelerate 表示「加速」，(C) measure 表示「測量」。"},{"id":124,"part":5,"stem":"The assembly plant is on schedule to exceed its quota of tractors, ______ it did last month.","choices":["just as","in fact","thus","until"],"answer":"A","explanation":"正確答案：(A) just as。 這個句子已經有具備主詞（The assembly plant）、動詞（is）和介系詞片語（on schedule）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - it ~ last month 是修飾性的語句。修飾部分有動詞（did），所以能引導修飾子句的副詞子句連接詞 (A) 和 (D) 是可能的答案。因為要表達「就像上個月一樣超過曳引機的配額」，所以副詞子句連接詞 (A) just as（就像……一樣）是正確答案。(D) until 表示時間點「到……為止」。連接副詞 (B) in fact（事實上）和 (C) thus（因此）不能引導修飾子句。另外，請記得 be 動詞使用第 1 類句型（S + V）的時候，要有介系詞片語等副詞性質的修飾語句，才是完整的句子。"},{"id":125,"part":5,"stem":"In her inspirational talk, Denise Camic argues that the ______ a company is, the greater its success.","choices":["more creative","creativity","creative","most creative"],"answer":"A","explanation":"正確答案：(A) more creative。 因為要表達「公司越有創意就越成功」，所以能形成兩個子句（the ~ company is，the greater ~ success）對等連接句型「the + 比較級……，the + 比較級～」的比較級 (A) more creative 是正確答案。名詞 (B)、原級形容詞 (C)、最高級形容詞 (D) 不能用在這裡的比較級位置。"},{"id":126,"part":5,"stem":"In order to ensure that information is stored ______, files in the database cannot be accessed without a password.","choices":["productively","confidentially","unanimously","voluntarily"],"answer":"B","explanation":"正確答案：(B) confidentially。 句意是「為了確保資訊被保密地儲存，資料庫裡的檔案沒有密碼無法存取」，所以副詞 (B) confidentially（秘密地，機密地）是正確答案。(A) productively 表示「有生產力地」，(C) unanimously 表示「全體一致地」，(D) voluntarily 表示「自發性地」。"},{"id":127,"part":5,"stem":"During his acceptance speech for the Businessperson of the Year Award, Mr. Gordon expressed ______ for his dedicated team members.","choices":["commitment","interest","tribute","appreciation"],"answer":"D","explanation":"正確答案：(D) appreciation。 句意是「對專注於工作的團隊成員表達了感謝」，所以能和空格後面的介系詞（for）組成 appreciation for（對……的感謝）的名詞 (D) appreciation（感謝）是正確答案。(A) commitment 表示「奉獻，投入」，常搭配介系詞 to 使用。(B) interest 表示「興趣」，但要表達「對……的興趣」時，通常搭配介系詞 in 使用。(C) tribute 表示「讚揚，敬意」，意思似乎說得通，但要表達「讚揚，稱頌……」時，應該使用 pay tribute to 的句型。"},{"id":128,"part":5,"stem":"Visitors are not allowed in certain sections of the building, ______ are they permitted to wander around without a guide.","choices":["so","during","nor","though"],"answer":"C","explanation":"正確答案：(C) nor。 空格後面的子句（are they ~ guide）中，主詞（they）和動詞（are）倒裝，所以能引導倒裝句的 (A) 和 (C) 是可能的答案。空格前面的句子（Visitors ~ building）是有否定詞（not）的否定句，所以能在有否定詞的子句後面引導倒裝句的 (C) nor（也不……）是正確答案。(A) so 雖然也可以引導倒裝句，但是用在肯定句後面，表示「也一樣……」，所以不對。介系詞 (B) during（在……期間）和副詞 (D) though（雖然）不能引導倒裝句。"},{"id":129,"part":5,"stem":"Rand's Organic Farm was able to increase its customer base ______ a radio advertisement.","choices":["in common with","in addition to","on behalf of","by means of"],"answer":"D","explanation":"正確答案：(D) by means of。 句意是「Rand's 有機農場藉由一支廣播廣告增加了顧客群」，所以表示手段的介系詞片語 (D) by means of（藉由……）是正確答案。(A) in common with 表示「與……共同」，(B) in addition to 表示「除了……以外」，(C) on behalf of 表示「代表……」。"},{"id":130,"part":5,"stem":"Several of the call center employees received outstanding annual evaluations and got a ______ as a result.","choices":["proximity","raise","setback","premiere"],"answer":"B","explanation":"正確答案：(B) raise。 句意是「幾位客服中心員工獲得了傑出的年度評價，並且因此獲得了加薪」，所以名詞 (B) raise（加薪）是正確答案。(A) proximity 表示「接近」，(C) setback 表示「挫折」，(D) premiere 表示「首映」。"},{"id":131,"part":6,"stem":"Choose the best answer for blank 131 in the passage.","choices":["nearest","nearer","nearly","nearby"],"answer":"C","explanation":"正確答案：(C) nearly。 空格修飾數量形容詞（15），所以副詞 (C) 和 (D) 是可能的答案。因為要表達「這個月的辦公室公用事業帳單比去年同月貴將近 15%」，所以副詞 (C) nearly（將近……）是正確答案。(D) nearby 表示位置「在附近」。形容詞的最高級 (A) 和比較級 (B) 不能修飾形容詞。就算把 near 當成「接近」的意思，使用最高級 (A) 和比較級 (B) 的句意變成「（物理位置上）最接近／比較接近 15%」，也不恰當。","group":"131-134"},{"id":132,"part":6,"stem":"Choose the best answer for blank 132 in the passage.","choices":["implementing","will implement","will have implemented","has implemented"],"answer":"D","explanation":"正確答案：(D) has implemented。 空格所在的句子缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。句意是「公司實施一些節省費用措施」，因為只看空格所在的句子無法判斷哪個動詞時態才正確，所以需要參考前後或整篇文章的內容。上一句請員工注意，這個月的辦公室公用事業帳單比去年同月貴將近 15%，而下一句提到措施包括在去年秋天整修時安裝了能源效率佳的燈和窗戶，由此可知「實施一些節省費用措施」是從過去持續到現在的事。因此，表達過去發生的事到現在仍有影響，或者剛完成的事的現在完成式 (D) has implemented 是正確答案。未來式 (B) 表示未來發生的事、對未來狀況的推測，或者意志。未來完成式 (C) 表示在未來特定時間點之前發生的行為，會在未來的這個時間點完成。動名詞或現在分詞 (A) 不能用在動詞位置。","group":"131-134"},{"id":133,"part":6,"stem":"Choose the best answer for blank 133 in the passage.","choices":["sensible","honest","impartial","tolerant"],"answer":"A","explanation":"正確答案：(A) sensible。 句意是「我想提醒各位要＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到只要有一點理性和好的判斷，就能採取措施來減少花費，所以這裡應該是想提醒員工了解問題，形容詞 (A) sensible（明智的，覺知到的）是正確答案。(B) honest 表示「誠實的」，(C) impartial 表示「公正的」，(D) tolerant 表示「寬容的」。","group":"131-134"},{"id":134,"part":6,"stem":"Choose the best answer for blank 134 in the passage.","choices":["Given the opportunity, I am sure many of you would volunteer.","If in doubt, simply refer to the meeting agenda that's posted online.","To start, we can all make sure to turn off anything that's not in use.","As a result, we will no longer qualify for our current service discount."],"answer":"C","explanation":"正確答案：(C) To start, we can all make sure to turn off anything that's not in use.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 With just a bit of rationality and good judgment, I am confident we can take steps to reduce our expenses. 提到，只要有一點理性和好的判斷，就能採取措施來減少花費，而下一句 if you have any other ideas for saving energy, please let me know 則說，還有其他節能的主意請告知，所以空格的內容應該和減少花費的方法有關，(C) To start, we can all make sure to turn off anything that's not in use 是正確答案。","group":"131-134"},{"id":135,"part":6,"stem":"Choose the best answer for blank 135 in the passage.","choices":["ultimate","consecutive","controversial","introductory"],"answer":"D","explanation":"正確答案：(D) introductory。 句意是「這系列的第一集將在 7 月 15 日播出」，所以表示「入門的，介紹性的」的形容詞 (D) introductory 是正確答案。(A) ultimate 表示「最終的」，(B) consecutive 表示「連續的」，(C) controversial 表示「有爭議的」。","group":"135-138"},{"id":136,"part":6,"stem":"Choose the best answer for blank 136 in the passage.","choices":["review","workshop","episode","poster"],"answer":"C","explanation":"正確答案：(C) episode。 句意是「接下來的每一＿＿都將聚焦於單一的小說上」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到，這系列的第一集將在 7 月 15 日播出，而空格的上一句則提到第一集將討論這個類型最近受歡迎的情況，並探討歷史與小說之間有趣的關係，所以接下來會聚焦於單一小說的應該是其他的集數，正確答案是名詞 (C) episode（一集）。(A) review 表示「評論」，(B) workshop 表示「工作坊，研習會」，(D) poster 表示「海報」。","group":"135-138"},{"id":137,"part":6,"stem":"Choose the best answer for blank 137 in the passage.","choices":["Subscribers will have access to already archived shows.","The books that are chosen will all be new releases.","Thus, electronic versions have gained popularity.","Listeners were invited to call in and ask questions."],"answer":"B","explanation":"正確答案：(B) The books that are chosen will all be new releases.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Each subsequent (episode) will focus on a single novel. 提到，接下來的每一集都將聚焦於單一的小說上，所以空格中的內容應該和每一集討論的小說有關，(B) The books that are chosen will all be new releases 是正確答案。","group":"135-138"},{"id":138,"part":6,"stem":"Choose the best answer for blank 138 in the passage.","choices":["individualistic","individuality","individual","individually"],"answer":"C","explanation":"正確答案：(C) individual。 空格被前面的指示形容詞（this）修飾，所以名詞 (B) 和 (C) 是可能的答案。因為要表達「這個人主演過幾部電影」，所以答案是人物名詞 (C) individual（個人）。如果使用 (B) individuality（個性，特徵）的話，意思會變成「這個個性主演過幾部電影」，所以不對。形容詞 (A) 和副詞 (D) 不能用在名詞位置。","group":"135-138"},{"id":139,"part":6,"stem":"Choose the best answer for blank 139 in the passage.","choices":["lasted","lasts","has lasted","to last"],"answer":"B","explanation":"正確答案：(B) lasts。 空格所在的句子缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。句意是「休假持續到星期五」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句問假期過得怎麼樣，而下一句說想知道對方是否能在那天（星期五）回來上班，由此可知假期是現在持續到未來的星期五，所以也能表示未來的現在式 (B) lasts 是正確答案。過去式 (A) 表示已經結束的過去動作或狀態，現在完成式 (C) 則用來表達過去開始、剛剛完成的事，或者過去發生的事影響持續到現在。to 不定詞 (D) 不能用在動詞的位置。","group":"139-142"},{"id":140,"part":6,"stem":"Choose the best answer for blank 140 in the passage.","choices":["They will do all of the revisions again from the beginning.","Apparently, doing that would be against our corporate regulations.","That is the day when our contractor agreement expires.","This is surprising as they seemed happy with it last week."],"answer":"D","explanation":"正確答案：(D) This is surprising as they seemed happy with it last week.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Nektar Beverages suddenly wants us to make some changes to the advertisement it commissioned 提到，Nektar Beverages 公司突然要求對於它委託的廣告做些改變，所以空格的內容應該和 Nektar Beverages 公司所要求的廣告修改有關，  the best answer for blank 145 in the passage.","choices":["Notwithstanding","In fact","Meanwhile","Instead"],"answer":"B","explanation":"正確答案：(B) In fact。 空格和逗號一起出現在句子開頭的連接副詞位置，所以要掌握上一句和空格所在句子之間的關係，才能判斷答案。上一句提到這個技術開發先驅創造了利用地質工程學的創新方式，並且在這個領域實現了無數的進展，而空格所在的句子說沒有它的努力，數百萬人每天使用的資料收集系統與追蹤工具就不會存在，所以可以用來對上一句附加說明的 (B) In fact（事實上）是正確答案。(A) Notwithstanding 表示「儘管如此」，(C) Meanwhile 表示「與此同時」，(D) Instead 表示「取而代之」。","group":"143-146"},{"id":146,"part":6,"stem":"Choose the best answer for blank 146 in the passage.","choices":["experiment","relocation","policy","expansion"],"answer":"D","explanation":"正確答案：(D) expansion。 句意是「這次＿＿的主要目的是促進與倫敦技術中心的合作」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到 GEOnet Solutions 公司宣布將拓展業務範圍至海外，將在倫敦開設附屬分公司，而空格所在句子的下一句提到雙方相信它們的合作將對彼此有利，因此可知促進與倫敦技術中心合作的是海外擴張的行動，名詞 (D) expansion（擴張）是正確答案。(A) experiment 表示「實驗」，(B) relocation 表示「遷移」，(C) policy 表示「政策」。","group":"143-146"},{"id":147,"part":7,"stem":"What is indicated about the challenge?","choices":["It will be repeated.","It was unsuccessful.","Its deadline was extended.","Its participants were anonymous."],"answer":"A","explanation":"正確答案：(A) It will be repeated.。 這是 Not/True 題型，要找出和關鍵詞語 the challenge 有關的內容，並且對照選項判斷答案。(A) 在 Thank you all for contributing to the monthly sales challenge. 的部分提到，要感謝所有人對每月銷售挑戰的貢獻，而 the executive team has decided to hold this initiative again in the future 的部分提到執行團隊已經決定未來再度舉辦這項企畫，符合選項敘述，所以 (A) 是正確答案。(B) 在 We acquired several new clients due to your hard work. 的部分提到由於大家的努力，而獲得了幾個新客戶，所以活動是成功的，不符合選項敘述。(C) 和 (D) 在文章裡沒有提到。","group":"147-148"},{"id":148,"part":7,"stem":"What does Ms. Seiko want her staff members to do?","choices":["Evaluate team members' performances","Recommend some potential rewards","Submit a preferred date for some time off","Send some personal documents by e-mail"],"answer":"B","explanation":"正確答案：(B) Recommend some potential rewards。 這是問 Seiko 小姐希望員工做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Seiko want her staff members to do 有關的部分是 Please e-mail me some new prize 52"},{"id":152,"part":7,"stem":"What does Ms. Mills ask Mr. Pollard to do?","choices":["Sweep a driveway outside a home","Meet with some potential clients","Turn off a security system","Park his vehicle on a street"],"answer":"D","explanation":"正確答案：(D) Park his vehicle on a street。 這是問 Mills 小姐要求 Pollard 先生做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Mills ask Mr. Pollard to do 有關的部分是 Mills 小姐所說的 please park around the corner. I saw a few empty parking spaces along the sidewalk there.，她在這部分要求在街角附近停車，並且提到那裡的人行道旁有幾個空著的停車位，所以 (D) 是正確答案。","group":"151-152"},{"id":153,"part":7,"stem":"What is mentioned about Descending Cherub?","choices":["It was exhibited for about a year.","It was dropped while being moved.","It was sculpted by Ms. Hyman.","It was loaned to a museum."],"answer":"D","explanation":"正確答案：(D) It was loaned to a museum.。 這是 Not/True 題型，要找出和關鍵詞語 Descending Cherub 有關的內容，並且對照選項判斷答案。(A) 和 (C) 在文章裡沒有提到。(B) 在 Our staff were in the process of moving all the works in the outdoor sculpture garden ~. Unfortunately, they did not get to your statue in time. A strong wind caused it to fall from its pedestal 的部分提到，工作人員正在搬動戶外雕塑花園的所有作品，但沒有及時照顧到那件雕塑品（《Descending Cherub》），而一陣強風造成它從底座倒下來，不符合選項敘述。(D) 在 Descending Cherub, the statue you so generously lent us 的部分提到，《Descending Cherub》是 Jansen 先生大方出借給「我們」（Brugeri 美術館）的雕塑品，符合選項敘述，所以 (D) 是正確答案。","group":"153-154"},{"id":154,"part":7,"stem":"What has been included with the letter?","choices":["An entrance ticket to a gallery","Photographs of some damage","Insurance claim documents","A reimbursement check"],"answer":"B","explanation":"正確答案：(B) Photographs of some damage。 這是問這封信附上了什麼（What）的 wh- 問題。和題目的關鍵詞語 included with the letter 有關的部分是 I have enclosed some pictures of the broken area.，這部分提到附上了破損區域的一些照片，所以 (B) 是正確答案。","group":"153-154"},{"id":155,"part":7,"stem":"What is one purpose of the article?","choices":["To report on the state of a region's infrastructure","To provide details about the global steel industry","To give information about a country's exports","To announce the opening of a new factory"],"answer":"D","explanation":"正確答案：(D) To announce the opening of a new factory。 這一題問的是這篇文章的目的，所以要注意文章開頭的部分。Steel Works Inc. has begun operations at its new plant. 的部分提到，Steel Works 公司已經開始新工廠的營運，所以 (D) 是正確答案。","group":"155-157"},{"id":156,"part":7,"stem":"What does the article suggest about the plant in Rembau?","choices":["It no longer produces steel for local use.","It was taken over by a foreign company.","It formerly caused some harm to the environment.","It has begun manufacturing plastic products."],"answer":"A","explanation":"正確答案：(A) It no longer produces steel for local use.。 這是和題目關鍵詞語 the plant in Rembau 有關的推論問題。Its first mill in Rembau now exclusively exports its products to other Asian countries, though it once met almost half of Malaysia's steel demand. 的部分提到，位於 Rembau 的第一座煉鋼廠，現在只將產品出口到其他亞洲國家，雖然它曾經滿足馬來西亞將近一半的鋼鐵需求。由此可以推知，Rembau 的工廠現在已經不生產馬來西亞國內使用的鋼鐵製品，而是完全外銷，所以 (A) 是正確答案。","group":"155-157"},{"id":157,"part":7,"stem":"What is NOT stated about Steel Works?","choices":["It now has multiple steel mills in operation.","Its new facility will aid Malaysia's urban development.","Its market share will double.","It makes use of up-to-date technology."],"answer":"C","explanation":"正確答案：(C) Its market share will double.。 這是 Not/True 題型，要找出和關鍵詞語 Steel Works 有關的內容，並且對照選項判斷答案。(A) 在 The plant is Steel Works' second. Its first mill in Rembau now exclusively exports its products to other Asian countries. 的部分提到，這座工廠（Kampung Tebing 廠）是 Steel Works 公司的第二座，而它位於 Rembau 的第一座煉鋼廠，現在只將產品出口到其他亞洲國家，所以 Steel Works 公司有複數的煉鋼廠，符合選項敘述。(B) 在 The plant will help Malaysian cities develop their infrastructure 的部分提到，Kampung Tebing 廠將幫助馬來西亞城市發展基礎建設，符合選項敘述。(C) 在 Steel Works' market share in Malaysia is expected to rise to 72 percent 的部分提到，Steel Works 公司在馬來西亞的市佔率預期將上升至 72%，但不知道是不是過去的兩倍，所以 (C) 是正確答案。(D) 在 Steel Works' plants utilize the latest technology 的部分提到，Steel Works 公司的工廠運用最新技術，符合選項敘述。","group":"155-157"},{"id":158,"part":7,"stem":"According to the e-mail, how can employees get directions to a facility?","choices":["By calling an event organizer","By listening to an announcement","By checking an e-mail","By looking at a bulletin board"],"answer":"C","explanation":"正確答案：(C) By checking an e-mail。 這是問員工可以怎樣（How）獲得往某個設施的路線指引的 wh- 問題。和題目的關鍵詞語 employees get directions to a facility 有關的部分是 Directions to the Wilmington Conference Center were provided in a previous e-mail.，這部分提到往 Wilmington 會議中心的交通路線指引已經在上一封電子郵件提供了，所以 (C) 是正確答案。","group":"158-160"},{"id":159,"part":7,"stem":"What is suggested about Whitaker's Sports Apparel?","choices":["It has sent representatives to revise a contract.","It recently made a deal with Ms. Marks's company.","It reimburses its staff for transportation costs.","It is looking for a new accounting manager."],"answer":"B","explanation":"正確答案：(B) It recently made a deal with Ms. Marks's company.。 這是和題目關鍵詞語 Whitaker's Sports Apparel 有關的推論問題。~ Whitaker's Sports Apparel, the client we acquired last week ~ 的部分提到，Whitaker's 運動服裝公司是「我們」（Marks 小姐的公司）最近獲得的客戶，由此可以推知，Whitaker's 運動服裝公司最近和 Marks 小姐的公司達成了協議，所以 (B) 是正確答案。","group":"158-160"},{"id":160,"part":7,"stem":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"However, they would like to stop by since they will be in town for the day.\"","choices":["[1]","[2]","[3]","[4]"],"answer":"D","explanation":"正確答案：(D) [4]。 這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「不過，他們還是想要順道來訪，因為他們那天會在本市」，所以應該會出現在和「他們」（Whitaker's 運動服裝公司的代表）造訪有關的部分。[4] 前面的部分 the representatives from Whitaker's Sports Apparel ~ will be visiting the office around 10 A.M. 提到，Whitaker's 運動服裝的代表將在上午 10 點左右造訪公司，而 [4] 的上一句 I have already advised them that the office will be almost empty due to the conference. 說已經告知他們因為會議的關係，辦公室幾乎會是空的。將句子填入 [4] 的位置之後，可以表達「Whitaker's 運動服裝的代表將造訪公司，雖然已經告知辦公室幾乎會是空的，但他們因為當天會在市內，所以還是想要順道來訪」，文意通順，所以 (D) 是正確答案。","group":"158-160"},{"id":161,"part":7,"stem":"At 11:09 A.M., what does Ms. Bingham mean when she writes, \"Of course\"?","choices":["She will send a memo to employees.","She thinks a new policy is fair.","She is willing to update Mr. O'Toole.","She intends to complete some paperwork."],"answer":"C","explanation":"正確答案：(C) She is willing to update Mr. O'Toole.。 這一題問的是 Bingham 小姐的訊息所表達的意圖，所以要掌握引用部分（Of course）前後文的情境。Ned O'Toole 說 I'd like to ask about the changes to our overtime work policy，表示自己想詢問加班政策的改變，而 Bingham 小姐回應 Of course.（當然可以），表示 Bingham 小姐願意告知 Ned O'Toole 關於加班政策的最新消息，所以 (C) 是正確答案。","group":"161-164"},{"id":162,"part":7,"stem":"What is mentioned about the overtime document?","choices":["It can be downloaded from a Web site.","It was difficult for some staff to complete.","It will be modified by department supervisors.","It is in the process of being rewritten."],"answer":"B","explanation":"正確答案：(B) It was difficult for some staff to complete.。 這是 Not/True 題型，要找出和關鍵詞語 the overtime document 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章裡沒有提到。(B) 在 Karen Bingham 所說的 they didn't submit the official overtime document. Many found the form to be too complicated. 提到，過去員工沒有提交正式的加班文件，而很多人覺得那張表太複雜，符合選項敘述，所以 (B) 是正確答案。","group":"161-164"},{"id":163,"part":7,"stem":"What will happen on December 1?","choices":["Some personnel will have to work late.","A company manual will be distributed.","Some conflicts will be discussed.","A policy change will take effect."],"answer":"D","explanation":"正確答案：(D) A policy change will take effect.。 這是問 12 月 1 日會發生什麼（What）的 wh- 問題。和題目的關鍵詞語 December 1 有關的部分包括 Ned O'Toole 所說的 I'd like to ask about the changes to our overtime work policy，這部分表達想詢問加班政策的改變，以及 Karen Bingham 所說的 it's effective as of 9 A.M., December 1，表示前述的加班政策從 12 月 1 日上午 9 點開始實施，所以 (D) 是正確答案。","group":"161-164"},{"id":164,"part":7,"stem":"What is suggested about Mr. O'Toole?","choices":["He misunderstood what he heard at a meeting.","He has made some complaints about a procedure.","He expects to work overtime in the near future.","He has not yet been paid for a recently completed project."],"answer":"C","explanation":"正確答案：(C) He expects to work overtime in the near future.。 這是和題目關鍵詞語 Mr. O'Toole 有關的推論問題。Gene Shipley 說 anyone who works over 40 hours a week automatically receives extra pay，表示任何一週工作超過 40 小時的人都會自動獲得額外的薪水，而 O'Toole 先生說 That's good to know, especially considering the big project that I'll be working on in the coming weeks，表示這是個好消息，因為他在接下來幾週要處理大型專案，由此可以推知 O'Toole 先生接下來應該會加班，而受惠於一週工作超過 40 小時自動獲得加班費的政策，(C) 是正確答案。","group":"161-164"},{"id":165,"part":7,"stem":"Why will Franklin Airport be renovated?","choices":["To address safety concerns","To spend a budget surplus","To create space for retail businesses","To compete with a larger airport"],"answer":"A","explanation":"正確答案：(A) To address safety concerns。 這是問 Franklin 機場為什麼（Why）要整修的 wh- 問題。和題目的關鍵詞語 Franklin Airport be renovated 有關的部分是 The Denver Transportation Authority (DTA) has announced a $50 million renovation plan for Franklin Airport ~. The announcement comes as a result of the National Airlines Group (NAG) having labeled its runway as dangerous for large aircraft，這部分提到丹佛交通局宣布了 Franklin 機場耗資 5 千萬元的整修計畫，而之所以有這公告，是因為全國航空公司團體將這座機場的跑道判定為對大型飛機有危險，所以 (A) 是正確答案。","group":"165-167"},{"id":166,"part":7,"stem":"What is true about the renovation project?","choices":["It has been a goal of the DTA for over a decade.","It is being funded through private donations.","It will be managed by the NAG.","It will take longer than expected."],"answer":"A","explanation":"正確答案：(A) It has been a goal of the DTA for over a decade.。 這是 Not/True 題型，要找出和關鍵詞語 the renovation project 有關的內容，並且對照選項判斷答案。(A) 在 When we took over Franklin Airport 11 years ago, we intended to begin rebuilding it right away. Unfortunately, we encountered numerous budget-related delays. We will finally be able to repair our runway and expand our terminals 的部分提到，「我們」（DTA）11 年前接管 Franklin 機場時，本來打算立即重新建設，但遭遇了許多預算造成的延誤，而現在終於能夠修補跑道並擴建航廈，符合選項敘述，所以 (A) 是正確答案。(B) 在 we have managed to secure federal funding 的部分提到，DTA 設法獲得了聯邦政府的資金，不符合選項敘述。(C) 和 (D) 在文章裡沒有提到。","group":"165-167"},{"id":167,"part":7,"stem":"What is implied about Franklin Airport?","choices":["It won a customer satisfaction award.","It is connected to a city by a subway line.","It is currently used only by domestic airlines.","It will be completely shut down during renovations."],"answer":"C","explanation":"正確答案：(C) It is currently used only by domestic airlines.。 這是和題目關鍵詞語 Franklin Airport 有關的推論問題。After the project has concluded, Franklin Airport will begin serving as a point of arrival and departure for international flights. 的部分提到，計畫完成後，Franklin 機場將成為國際航班的抵達與出發點，由此可以推知，這座機場目前只有國內航線，所以 (C) 是正確答案。","group":"165-167"},{"id":168,"part":7,"stem":"The word \"immediate\" in paragraph 2, line 4, is closest in meaning to","choices":["sudden","nearby","critical","prompt"],"answer":"B","explanation":"正確答案：(B) nearby。 immediate 所在的語句 When you are done, you must stay in the immediate area until you are called for the second part of the interview. 之中，immediate 表示「附近的」的意思，所以同樣能表示「附近的」的 (B) 是正確答案。","group":"168-171"},{"id":169,"part":7,"stem":"What is an important qualification for the job?","choices":["The ability to cooperate with others","Extensive knowledge of international law","A willingness to work long hours","Experience with specific software"],"answer":"A","explanation":"正確答案：(A) The ability to cooperate with others。 這是問對於這份工作，什麼（What）是重要資格條件的 wh- 問題。和題目的關鍵詞語 an important qualification for the job 有關的部分是 This activity will be used to evaluate your communication skills and ability to work with coworkers.，這部分提到面試的一項活動將被用來評價溝通技能，以及和同事合作的能力，所以 (A) 是正確答案。","group":"168-171"},{"id":170,"part":7,"stem":"What are applicants required to do?","choices":["Submit additional work references","Send a reply by e-mail","Present a recommendation letter","Create a profile on a firm's Web site"],"answer":"B","explanation":"正確答案：(B) Send a reply by e-mail。 這是問應徵者被要求做什麼（What）的 wh- 問題。和題目的關鍵詞語 applicants required to do 有關的部分是 Please confirm your participation by replying to this e-mail.，這部分要求回覆這封電子郵件來確認參加，所以 (B) 是正確答案。","group":"168-171"},{"id":171,"part":7,"stem":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"You will therefore not need to bring any materials of your own.\"","choices":["[1]","[2]","[3]","[4]"],"answer":"D","explanation":"正確答案：(D) [4]。 這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「所以您不需要自行攜帶任何用品」，所以句子填入的部分應該和面試時提供的東西有關。[4] 的上一句 We will supply everything you need to complete the process, including paper, pens, and access to selected law books from our library. 提到，將供應完成這個程序所需的一切，包括紙、筆，以及從圖書館中挑選的一些法律書籍的使用權。將句子填入 [4] 的位置之後，可以表達「因為供應了包括紙、筆以及法律書籍等所需的一切，所以您不需要自行攜帶任何用品」，文意通順，所以 (D) 是正確答案。","group":"168-171"},{"id":172,"part":7,"stem":"What is one purpose of the notice?","choices":["To share some budget calculations","To request participation in a fund-raiser","To announce the fulfillment of a goal","To recruit some volunteers"],"answer":"B","explanation":"正確答案：(B) To request participation in a fund-raiser。 這一題問的是通知的目的，所以要注意文章開頭的部分。Here at the Highland Employment Center, we need your support for our Tech Training initiative，we hope to raise enough funds 的部分提到，Highland 就業服務中心需要對 Tech Training 計畫的支持，以及希望募集足夠的資金，後面則詳細說明募款活動的內容，所以 (B) 是正確答案。","group":"172-175"},{"id":173,"part":7,"stem":"According to the notice, what can race participants do?","choices":["Sample some dishes","Wear unusual clothing","Submit route suggestions","Select a preferred running distance"],"answer":"B","explanation":"正確答案：(B) Wear unusual clothing。 這是問根據通知，路跑參加者可以做什麼（What）的 wh- 問題。和題目的關鍵詞語 race participants do 有關的部分是 Those who run in a creative costume will be eligible to win a $100 voucher for Harlan Foods.，這部分提到穿著創意服裝跑步的人有機會贏得 Harlan Foods 的 100 元禮券，所以 (B) 是正確答案。","group":"172-175"},{"id":174,"part":7,"stem":"What is indicated about the event?","choices":["It must be signed up for a month in advance.","Its entry fee varies depending on the registration date.","Its organizer will deliver a speech.","It will be filmed by a television camera crew."],"answer":"B","explanation":"正確答案：(B) Its entry fee varies depending on the registration date.。 這是 Not/True 題型，要找出和關鍵詞語 the event 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章裡沒有提到。(B) 在 The entry fee is $40 throughout July, $45 from August 1–14, and $50 on the day of the race. 的部分提到，參加費在整個 7 月都是 40 元，8 月 1–14 日是 45 元，路跑當日 50 元，符合選項敘述，所以 (B) 是正確答案。","group":"172-175"},{"id":175,"part":7,"stem":"What will those who complete the run within two hours receive?","choices":["A personalized T-shirt","A certificate of achievement","A gift voucher for groceries","A souvenir photograph"],"answer":"D","explanation":"正確答案：(D) A souvenir photograph。 這是問兩小時內跑完的人會得到什麼（What）的 wh- 問題。和題目的關鍵詞語 those who complete the run within two hours receive 有關的部分是 Those who finish within the two-hour time limit will receive a photograph of themselves crossing the finish line.，這部分提到在兩小時的時間限制內跑完的人，將得到自己通過終點線的照片，所以 (D) 是正確答案。","group":"172-175"},{"id":176,"part":7,"stem":"Why did Ms. Duval send the e-mail?","choices":["To describe some garments","To discuss publication details","To finalize the topic of an article","To assess a set of photographs"],"answer":"B","explanation":"正確答案：(B) To discuss publication details。\n\n🎯 題型與完整解題理由\n第一份電子郵件中，總編輯 Rachel Duval 向 John Hassan 表示九月號雜誌雖然已有進度，但「we still have some decisions to make」。接著逐一要求確認封面人物、處理 Russo Shampoo 取消廣告後空出的第 58～59 頁、接洽 SameSide Cosmetics，以及核實設計師 David Burns 專訪中的事實。四件事都屬於雜誌出版前的編輯與廣告安排，並非只討論一篇文章。\n\n🔎 其餘選項判斷\n(A) 信中沒有描述服裝；(C) 只是部分文章需要核查，並不是定案文章主題；(D) 沒有要求評估照片組。\n\n📌 原文定位與同義改寫\npublication details＝出版相關細節；decisions to make＝仍有待決定的事項。","group":"176-180"},{"id":177,"part":7,"stem":"In the e-mail, the phrase \"drive up\" in paragraph 1, line 4, is closest in meaning to","choices":["operate","motivate","stimulate","travel"],"answer":"C","explanation":"正確答案：(C) stimulate。\n\n🎯 題型與完整解題理由\n信件第一段提議讓電影即將上映的 Su-min Yoo 再次擔任封面人物，理由是「having her on the cover would likely drive up magazine sales」。上下文是利用知名演員帶動九月號銷量，因此 drive up 是讓數量、銷售額「上升、增加」的意思。\n\n🔎 其餘選項判斷\n(A) operate 是操作或經營；(B) motivate 著重激勵人，不是推高銷售額的最直接替換；(D) travel 是旅行，均無法替換這裡的 drive up。\n\n📌 原文定位與同義改寫\ndrive up magazine sales＝stimulate magazine sales＝推升雜誌銷售。","group":"176-180"},{"id":178,"part":7,"stem":"According to the e-mail, what is SameSide Cosmetics interested in doing?","choices":["Developing a new product line","Holding a product demonstration in October","Launching a campaign against chemical ingredients","Buying some advertising space"],"answer":"D","explanation":"正確答案：(D) Buying some advertising space。\n\n🎯 題型與完整解題理由\n第一封信第二段說 Russo Shampoo 突然決定不在九月號刊登廣告，導致第 58 和 59 頁需要立即填補。總編輯提及「SameSide Cosmetics was interested in running an advertisement in our magazine」，並要求 John 確認對方是否願意利用這次機會，甚至可提供 20% 折扣。由此可知其意向是購買雜誌的廣告版面。\n\n🔎 其餘選項判斷\n(A) 新有機護膚霜產品系列已在開發，文中詢問的是廣告；(B) 未提到產品示範會；(C) 產品環保不等於發起反化學成分活動。\n\n📌 原文定位與同義改寫\nrun an advertisement＝buy advertising space＝刊登／購買廣告版面。","group":"176-180"},{"id":179,"part":7,"stem":"What can be inferred about Ms. Duval?","choices":["Her choice for a cover model was unavailable.","She wrote an editorial about a craftsperson.","She is scheduled to attend a clothing fair.","She wants to increase a subscription fee."],"answer":"A","explanation":"正確答案：(A) Her choice for a cover model was unavailable.。\n\n🎯 題型與完整解題理由\n本題必須將總編輯電子郵件與九月號目錄對照。第一份信說 Rachel 想再次合作 Su-min Yoo，請 John 聯繫她的經紀人安排封面拍攝；然而第二份已編成的九月號目錄卻把第 16 頁封面專訪列為「Michelle Ford talks about her upcoming Broadway stage debut」。封面人物與原提議不同，合理推論最初想合作的藝人未能按計畫參與。\n\n🔎 其餘選項判斷\n(B) 雜誌有關於裁縫師的文章，但不能推論是 Rachel 親自撰寫；(C) 沒有服飾展行程；(D) 沒有訂閱價格調漲資訊。\n\n📌 原文定位與同義改寫\nHow about working with Su-min Yoo again?（提議）→ Cover Story Interview: Michelle Ford（最終目錄）→ 原提議人選未能使用。","group":"176-180"},{"id":180,"part":7,"stem":"On which page does the article about Mr. Burns appear?","choices":["Page 16","Page 35","Page 52","Page 78"],"answer":"C","explanation":"正確答案：(C) Page 52。\n\n🎯 題型與完整解題理由\n第一份電子郵件最後明確要求確認「our article on the Canadian designer David Burns」的事實是否正確。再看第二份九月號目錄，第 52 頁是「Profile: Canada’s number one designer reflects on his career ahead of retirement」，唯一對應加拿大設計師的人物專訪，因此答案為第 52 頁。\n\n🔎 其餘選項判斷\n(A) 第 16 頁是 Michelle Ford 的封面專訪；(B) 第 35 頁介紹紐約裁縫師；(D) 第 78 頁介紹印度當代時尚。\n\n📌 原文定位與同義改寫\nCanadian designer David Burns ↔ Canada’s number one designer；Profile＝人物專訪。","group":"176-180"},{"id":181,"part":7,"stem":"What is the information mainly about?","choices":["A newly opened showroom","A volunteer recruitment session","An event in support of small businesses","A tax incentive for companies"],"answer":"C","explanation":"正確答案：(C) An event in support of small businesses。\n\n🎯 題型與完整解題理由\n第一份宣傳資訊的標題是「Go Shopping and Make a Difference!」，並指出 Bristol 在 4 月 28 日舉辦 Support Your Local Business Day，鼓勵市民改到住家附近的獨立小店購物，而不是全國連鎖店。文章還說參與商家會捐出當日部分利潤給 Bristol Business Association，繼續支持在地公益，所以主題是扶助小型地方企業的一日活動。\n\n🔎 其餘選項判斷\n(A) 並非新開的展示中心；(B) 沒有招募志工的場次；(D) 並未介紹公司稅負優惠。\n\n📌 原文定位與同義改寫\nSupport Your Local Business Day＝an event in support of small businesses。","group":"181-185"},{"id":182,"part":7,"stem":"What is indicated about the BBA?","choices":["It operates a major retail chain.","It has raised its membership fee by 10 percent.","It is opposed to a tax on imported goods.","It contributes to the local community."],"answer":"D","explanation":"正確答案：(D) It contributes to the local community.。\n\n🎯 題型與完整解題理由\n第一份資訊指出 Birdy Beets、Tinker Time 和 Kara Lee’s 等參加店家，願把活動當天利潤的 10% 捐給 Bristol Business Association（BBA）。接著明說 BBA 將用這些收入「continue carrying out charitable projects in the area」。這證明 BBA 透過慈善計畫回饋當地社區。\n\n🔎 其餘選項判斷\n(A) BBA 是協會而非大型連鎖店；(B) 10% 指商家捐出的利潤比例，不是會員費調漲；(C) 沒提進口稅立場。\n\n📌 原文定位與同義改寫\ncharitable projects in the area＝contributes to the local community。","group":"181-185"},{"id":183,"part":7,"stem":"What information will Mr. Perez include in his speech?","choices":["The reasons for a construction","The plans of an organization","The cost of a campaign","The date of a reopening"],"answer":"B","explanation":"正確答案：(B) The plans of an organization。\n\n🎯 題型與完整解題理由\n第二份活動時程表列出上午 9:00～9:30 的「Message for Community Members」，地點為 Anchor Square，主講人 Emmanuel Perez 是 BBA 主席。活動敘述提到他不只會講地方商店的重要性，「He will also talk about some of the BBA’s upcoming efforts」，也就是介紹該組織接下來要採取的行動與計畫。\n\n🔎 其餘選項判斷\n(A) 沒有指定要談建築原因；(C) 沒提某項運動的成本；(D) 沒有重新開幕日期。\n\n📌 原文定位與同義改寫\nupcoming efforts＝future plans；BBA president＝organization leader。","group":"181-185"},{"id":184,"part":7,"stem":"What is NOT one of the activities planned for April 28?","choices":["A cooking demonstration by a famous chef","A walk through a historic neighborhood","Some outdoor performances by musicians","Some instructional sessions for children"],"answer":"A","explanation":"正確答案：(A) A cooking demonstration by a famous chef。\n\n🎯 題型與完整解題理由\n這是 NOT 題，應用活動表逐項核對。上午的 Walking Tour 會走訪 Dalton Street 的歷史建築，對應 (B)；中午 Music on the Green 有地方樂團的露天演出，對應 (C)；同一活動旁的帳棚提供孩童藝術手作課程，對應 (D)。整份時程沒有名廚的料理示範。\n\n🔎 其餘選項判斷\n(A) famous chef cooking demonstration 是沒有安排的活動，因此為正確答案；其餘三項都能在時程表找到明確對應。\n\n📌 原文定位與同義改寫\nWalking Tour＝walk through a historic neighborhood；arts and crafts workshops＝instructional sessions for children。","group":"181-185"},{"id":185,"part":7,"stem":"Where most likely can visitors make use of a coupon?","choices":["Birdy Beets","Tinker Time","Kara Lee's","Wayfair House"],"answer":"A","explanation":"正確答案：(A) Birdy Beets。\n\n🎯 題型與完整解題理由\n第二份時程表的「Shop for Your Lunch」規定，在三家不同的本地獨立商店消費後，持收據到旅客服務處即可獲得參與餐廳的免費午餐優惠券。第一份資訊列出的參與業者包含餐廳 Birdy Beets、手工藝店 Tinker Time、服飾店 Kara Lee’s；而 Wayfair House 是歷史建築，不是餐廳。因此可使用午餐券的地點最可能是 Birdy Beets。\n\n🔎 其餘選項判斷\n(B) Tinker Time 是手工藝店；(C) Kara Lee’s 是服飾店；(D) Wayfair House 是步行導覽景點。\n\n📌 原文定位與同義改寫\nparticipating restaurant ↔ Birdy Beets；coupon for a free lunch＝免費午餐優惠券。","group":"181-185"},{"id":186,"part":7,"stem":"What did Mayor Wilkins do on February 10?","choices":["Presented at a tourism conference","Showed visitors around an office","Spoke about an infrastructure project","Apologized for a traffic accident"],"answer":"C","explanation":"正確答案：(C) Spoke about an infrastructure project。\n\n🎯 題型與完整解題理由\n第一篇新聞開頭寫「At a press conference on February 10, Mayor David Wilkins announced the planned construction of a new four-lane bridge」。市長在 2 月 10 日記者會公開將興建新的四線道橋樑、施工日期與交通影響，這些都屬於公共基礎建設計畫。\n\n🔎 其餘選項判斷\n(A) 不是觀光會議；(B) 沒有帶領訪客參觀辦公室；(D) 並非就交通事故道歉。\n\n📌 原文定位與同義改寫\nplanned construction of a new bridge＝an infrastructure project；announced at a press conference＝公開發表。","group":"186-190"},{"id":187,"part":7,"stem":"According to the article, why should some commuters visit a Web site?","choices":["To find people to carpool with","To check some route information","To give feedback about a policy","To evaluate public transit"],"answer":"B","explanation":"正確答案：(B) To check some route information。\n\n🎯 題型與完整解題理由\n第一篇新聞先說橋樑工程會使原本交通擁堵情況暫時惡化，接著列出 Harris Road、Oak Boulevard、Center Avenue 和 Harbor Way 各自的封閉日期。文章最後明確提醒常走這些道路的通勤者，到交通部門網站查看「information about alternatives」，也就是替代行車路線。\n\n🔎 其餘選項判斷\n(A) 沒提共乘媒合；(C) 沒邀請對政策提供意見；(D) 沒說要評估大眾運輸。\n\n📌 原文定位與同義改寫\ninformation about alternatives＝route information／替代路線資訊。","group":"186-190"},{"id":188,"part":7,"stem":"Where is Bellwood Sporting Goods probably located?","choices":["On Harris Road","On Oak Boulevard","On Center Avenue","On Harbor Way"],"answer":"C","explanation":"正確答案：(C) On Center Avenue。\n\n🎯 題型與完整解題理由\n這是新聞與商店備忘錄的跨篇題。新聞列出 Center Avenue 將於「August 5 to October 10」禁止車輛通行；第二份備忘錄的商店經理表示店門前的道路「starting from August 5」開始封閉，因此可以用相同的開始日期鎖定店址。其他道路的封閉起點分別是 5 月 14 日或 10 月 12 日，均不符合。\n\n🔎 其餘選項判斷\n(A) Harris Road 與 (B) Oak Boulevard 自 5 月 14 日封閉；(D) Harbor Way 自 10 月 12 日封閉。\n\n📌 原文定位與同義改寫\nclosure starting from August 5 ↔ Center Avenue inaccessible from August 5。","group":"186-190"},{"id":189,"part":7,"stem":"What is suggested about Mr. Adams's order?","choices":["It was ineligible for a promotional discount.","Its color was different from the one requested.","It is no longer being manufactured.","It will be shipped to a work address."],"answer":"A","explanation":"正確答案：(A) It was ineligible for a promotional discount.。\n\n🎯 題型與完整解題理由\n第二份備忘錄表示 Bellwood Sporting Goods 的兩項促銷為「All footwear ... marked down by 15 percent」及「anyone who places an order online will receive free shipping」。第三份 Jeff Adams 的郵件明言自己在 8 月 9 日透過網站購買的是一件 jacket（外套）。外套不是 footwear（鞋類），所以不能套用 15% 的商品折扣；但網路購買符合免運資格。\n\n🔎 其餘選項判斷\n(B) 郵件討論的是尺寸選錯，而非收到不同顏色；(C) 未說停產；(D) 沒提送到工作地址。\n\n📌 原文定位與同義改寫\nfootwear＝鞋類；jacket＝外套；a promotional discount 指 15% 鞋類優惠而非所有商品。","group":"186-190"},{"id":190,"part":7,"stem":"What will Mr. Adams do if an item cannot be replaced?","choices":["Delete a customer account","Visit a manufacturer's Web site","Fill out a complaint form","Start a process over again"],"answer":"D","explanation":"正確答案：(D) Start a process over again。\n\n🎯 題型與完整解題理由\n第三份信中 Jeff Adams 說自己買外套時選成 large，實際想要 extra large。他希望在出貨前直接更換，避免收到商品後退貨；最後提出備案：「If not, I guess I will have to cancel my original order and place a new one」。因此若店家無法直接更換商品，他會取消原訂單並重新下單，等同重新開始訂購流程。\n\n🔎 其餘選項判斷\n(A) 不是刪除帳戶；(B) 未說去製造商網站；(C) 沒提填寫客訴表。\n\n📌 原文定位與同義改寫\ncancel my original order and place a new one＝start the ordering process over again。","group":"186-190"},{"id":191,"part":7,"stem":"According to the e-mail, what information was Mr. Richards unable to find on a Web site?","choices":["A class schedule","A service fee","A facility location","A testing process"],"answer":"D","explanation":"正確答案：(D) A testing process。\n\n🎯 題型與完整解題理由\nJason Richards 在第一封電子郵件說自己已透過語言學習軟體學過中文，希望在報名之前先參加程度測驗，以確認流利程度。他問「Please let me know the procedure for this as I was unable to find information about it on your Web site」，此處的 this 指前一句的程度測驗程序，而不是開課時間。\n\n🔎 其餘選項判斷\n(A) 他說自己已在網站查過上課時間，代表並非找不到時間表；(B) 不在詢問服務費；(C) 沒問學院地址。\n\n📌 原文定位與同義改寫\ntake a test to determine my fluency level → testing process。","group":"191-195"},{"id":192,"part":7,"stem":"What is NOT stated about Zhong Academy?","choices":["It allows scheduling changes.","It has lessons for beginners.","It only holds weekday classes.","It offers discounts for referrals."],"answer":"C","explanation":"正確答案：(C) It only holds weekday classes.。\n\n🎯 題型與完整解題理由\n這是 NOT 題，需要比對學院報名表。報名表顯示 Jason 的程度為 Beginner，因此學院有初級班；另有「Preferred Class Time: Sundays 10 A.M.–11:30 A.M.」，證明週日有課。表單還說可到櫃檯申請更改時間，介紹新學員成功入學可獲下次課程 15% 折扣。所以只有「只在平日開課」與資料相反。\n\n🔎 其餘選項判斷\n(A) 改時段可提出申請；(B) Beginner 就是初級程度；(D) 推薦新學員有 15% 折扣，三項都有資料支持。\n\n📌 原文定位與同義改寫\nSundays＝星期日 → 並非 only weekday classes。","group":"191-195"},{"id":193,"part":7,"stem":"Which film did Mr. Richards's friend most likely watch?","choices":["Summer Shore","Washing Away","Grave Mistakes","River Goddess"],"answer":"D","explanation":"正確答案：(D) River Goddess。\n\n🎯 題型與完整解題理由\n第一封信日期為 11 月 20 日，Jason 說朋友參加了 11 月 12 日的院內免費電影放映；第三份 12 月 1 日電子報回顧「last month after our showing of River Goddess」，表示上個月放映的影片是 River Goddess。由於「上個月」相對於 12 月 1 日就是 11 月，可和朋友 11 月 12 日的觀影日期對上。\n\n🔎 其餘選項判斷\n(A) Summer Shore 是導演 Xu Yue 之前的作品；(B) Washing Away 是即將上映的影展新片；(C) Grave Mistakes 將於 12 月 28 日放映。\n\n📌 原文定位與同義改寫\nlast month（以 Dec. 1 為基準）＝November；showing of River Goddess＝十一月場次。","group":"191-195"},{"id":194,"part":7,"stem":"What is true about Ms. Xu?","choices":["Her first movie will be screened at a festival.","She will spend a night at the Cloudbank Hotel.","Her projects are funded by a firm based in Shanghai.","She has received positive reviews from critics."],"answer":"D","explanation":"正確答案：(D) She has received positive reviews from critics.。\n\n🎯 題型與完整解題理由\n12 月電子報說 Bright Lights Film Festival 將放映 Xu Yue 執導的新片 Washing Away，並稱她是「the director of the critically acclaimed film Summer Shore」。critically acclaimed 的意思是受到影評人高度肯定或好評，由此可知她過去的作品得到評論界的正面評價。\n\n🔎 其餘選項判斷\n(A) Summer Shore 不是她的第一部電影的明確證據；(B) Cloudbank Hotel 是影展場地，沒說她住過；(C) 沒提任何上海企業投資她的計畫。\n\n📌 原文定位與同義改寫\ncritically acclaimed＝received positive reviews from critics。","group":"191-195"},{"id":195,"part":7,"stem":"What can be inferred about Mr. Richards?","choices":["He used to work at a language school.","He bought tickets for an upcoming festival.","He cannot attend a free screening in December.","He went on a business trip to China."],"answer":"C","explanation":"正確答案：(C) He cannot attend a free screening in December.。\n\n🎯 題型與完整解題理由\n這是三份文件對照推論。Jason 的第一封郵件表達想參加下個月的院內免費電影；第二份報名表卻記錄測驗等級是「Beginner」；第三份電子報明確規定學院免費放映「strictly for students enrolled in intermediate or advanced classes」。因 Jason 目前屬初級班，不符合中級或高級班限定資格，故無法參加十二月的免費放映。\n\n🔎 其餘選項判斷\n(A) 沒提他曾任語言學校員工；(B) 沒有證據他買了影展票；(D) 沒有出差中國的資訊。\n\n📌 原文定位與同義改寫\nBeginner ≠ intermediate or advanced；strictly for＝僅限。","group":"191-195"},{"id":196,"part":7,"stem":"What is NOT mentioned about The Good Old Days?","choices":["It includes recorded interviews.","It focuses on old towns.","It features a regular host.","It is sponsored by a travel agency."],"answer":"D","explanation":"正確答案：(D) It is sponsored by a travel agency.。\n\n🎯 題型與完整解題理由\n第一份公告說《The Good Old Days》是得獎紀錄片系列，由 Janet Leslie 固定主持，以錄影訪談和實地拍攝介紹貝里斯的歷史城鎮。這些可分別支持 (A) 錄製訪問、(B) 老城鎮主題、(C) 固定主持人。全文沒有說旅遊業者贊助節目。\n\n🔎 其餘選項判斷\n(A) video interviews；(B) historic towns；(C) hosted by Janet Leslie 都有來源，只有 (D) travel agency sponsorship 沒有提到。\n\n📌 原文定位與同義改寫\nNOT mentioned＝找出未獲原文支持的選項。","group":"196-200"},{"id":197,"part":7,"stem":"What is most likely true about Pepita de Oro?","choices":["It used to have a large public plaza.","It is celebrating an anniversary this year.","It is a popular destination for foreign tourists.","It was covered in the 10th episode of a show."],"answer":"D","explanation":"正確答案：(D) It was covered in the 10th episode of a show.。\n\n🎯 題型與完整解題理由\n公告指出《The Good Old Days》第一季共有 10 集，第二季才從 10 集增加為 12 集；Elaine Kershaw 在第二份郵件表示自己喜歡「last season’s finale on Pepita de Oro」。finale 是最後一集，因此上一季的完結篇是第 10 集，內容是 Pepita de Oro。\n\n🔎 其餘選項判斷\n(A) 沒說該鎮有大廣場；(B) 沒提週年慶；(C) 沒有外國觀光客歡迎度的資料。\n\n📌 原文定位與同義改寫\nlast season’s finale＝上一季最後一集；season 1 有 10 episodes → episode 10。","group":"196-200"},{"id":198,"part":7,"stem":"Who did Ms. Kershaw's grandfather buy some paintings from?","choices":["Hector Almonte","Janet Leslie","Chloe Benbow","A local artist"],"answer":"D","explanation":"正確答案：(D) A local artist。\n\n🎯 題型與完整解題理由\n第二份 Elaine Kershaw 的郵件明確描述祖父擔任 Emerald Falls 市長時收集的照片和畫作，並寫「My grandfather purchased the paintings from a local artist」。句子主詞是祖父、受詞是那些畫作、from 後面的對象就是賣畫的人，因此是當地藝術家。\n\n🔎 其餘選項判斷\n(A) Hector Almonte 是紀錄片導演；(B) Janet Leslie 是主持人；(C) Chloe Benbow 是導演助理；都不是出售畫作的人。\n\n📌 原文定位與同義改寫\npurchased ... from＝向……購買；a local artist＝當地藝術家。","group":"196-200"},{"id":199,"part":7,"stem":"What is suggested about Mr. Almonte?","choices":["He wrote a book about a journey.","He examined some artwork in Maracuyá.","He held a press conference in October.","He has lent out a collection of artifacts."],"answer":"B","explanation":"正確答案：(B) He examined some artwork in Maracuyá.。\n\n🎯 題型與完整解題理由\nElaine 在電子郵件說高價畫作必須留在 Maracuyá 的家中，但如果導演 Hector Almonte 想拍攝，可以親自前往。第三份新聞則指出 Emerald Falls 的最新一集確實出現畫作「Plaza Esperanza」的畫面。因此，導演製作節目時很可能已安排拍攝她家中的藝術品，從而到 Maracuyá 接觸、查看這些畫作。\n\n🔎 其餘選項判斷\n(A) 沒提導演寫書；(C) 沒提十月記者會；(D) 沒有借出藝術藏品的描述，Elaine 反而表示畫作不能外借。\n\n📌 原文定位與同義改寫\npainting must remain in my home ＋ shown in the episode＝曾前往拍攝／檢視的合理推論。","group":"196-200"},{"id":200,"part":7,"stem":"What was Emerald Falls mainly famous for?","choices":["Its educational standards","Its natural scenery","Its mineral resources","Its charity auctions"],"answer":"C","explanation":"正確答案：(C) Its mineral resources。\n\n🎯 題型與完整解題理由\n第三份新聞將 Emerald Falls 定位為「a once thriving mining community」，並指出該鎮過去著名的「mineral deposits」如今已經耗盡。mining 指採礦，mineral deposits 指礦床或礦物蘊藏，因此該鎮昔日以礦產資源聞名，不能只看鎮名 Falls 就猜是瀑布風光。\n\n🔎 其餘選項判斷\n(A) 沒提教育水準；(B) Falls 在名稱中不代表以風景出名；(D) 沒提慈善拍賣。\n\n📌 原文定位與同義改寫\nthriving mining community／celebrated mineral deposits＝famous for mineral resources。","group":"196-200"}],"groups":{}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>MEMO</span><small>131-134 · 1/1</small></div><div class=\"document-body\"><p>MEMO</p><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All staff</strong></div><div class=\"doc-field\"><span>From</span><strong>Warren Harris, Office Manager</strong></div><div class=\"doc-field\"><span>Date</span><strong>August 15</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Electricity use</strong></div></div><p>I would like to bring your attention to the fact that the office utilities bill was <span class=\"reading-blank\">〔131〕</span> 15 percent higher this month than it was at the same time last year. I feel this is unacceptable, especially as the company <span class=\"reading-blank\">〔132〕</span> a number of cost-saving measures. These include the installation of energy-efficient lights and windows during our renovation last fall. I would, therefore, like to remind you all to be <span class=\"reading-blank\">〔133〕</span>. With just a bit of rationality and good judgment, I am confident we can take steps to reduce our expenses. <span class=\"reading-blank\">〔134〕</span> Thank you for your understanding, and if you have any other ideas for saving energy, please let me know.</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-press\"><div class=\"doc-ribbon\"><span>ANNOUNCEMENT</span><small>135-138 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">PRESS RELEASE—Basinet Books</h2><p>Basinet Books to Launch Its Own Podcast</p><p>The publishing company Basinet Books will soon begin producing a weekly podcast for fans of historical fiction. The <span class=\"reading-blank\">〔135〕</span> installment of the series will air on July 15. This first show will discuss the recent popularity of the genre and explore the fascinating relationship between history and fiction. Each subsequent <span class=\"reading-blank\">〔136〕</span> will focus on a single novel. <span class=\"reading-blank\">〔137〕</span> As for who will host it, Basinet Books has hinted that they have hired a prominent actor. Reportedly, this <span class=\"reading-blank\">〔138〕</span> has starred in several movie adaptations of novels. Each podcast file will be available through the StarLadder mobile application.</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>139-142 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Belinda Wright bw4637@advertx.com</strong></div><div class=\"doc-field\"><span>From</span><strong>Jamie Garnett jg4548@advertx.com</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Urgent request</strong></div><div class=\"doc-field\"><span>Date</span><strong>February 11</strong></div></div><p>Hello, Belinda.</p><p>How is your vacation going? I know that your time off <span class=\"reading-blank\">〔139〕</span> until Friday, February 14. However, I'm wondering if you can return to work that day. It turns out that Nektar Beverages suddenly wants us to make some changes to the advertisement it commissioned. Since you were the lead designer, I feel like you'd be the best person to handle the final revisions. The task will probably take five or six hours.</p><p><span class=\"reading-blank\">〔140〕</span> To <span class=\"reading-blank\">〔141〕</span> you, we would pay you the standard overtime rate on February 14. We would also <span class=\"reading-blank\">〔142〕</span> an extra vacation day.</p><p>Thank you in advance.<br/>Jamie</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE</span><small>143-146 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">New Horizons for GEOnet Solutions</h2><p>BOSTON (October 9)— GEOnet Solutions has announced that it will be extending its reach overseas. <span class=\"reading-blank\">〔143〕</span> For over 20 years, this Boston-based <span class=\"reading-blank\">〔144〕</span> in technology development has created innovative ways to use geotechnology and has made countless advances in the field. <span class=\"reading-blank\">〔145〕</span>, the data collection systems and tracking tools used by millions of people every day would not exist without its efforts. In a statement released yesterday, GEOnet Solutions representative Tomas Fuller said that the primary goal of the <span class=\"reading-blank\">〔146〕</span> is to facilitate cooperation with the London Technology Center. The two believe that their collaboration will be mutually beneficial.</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>MEMO</span><small>147-148 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All staff</strong></div><div class=\"doc-field\"><span>From</span><strong>Nadori Seiko, CEO</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Monthly sales challenge</strong></div><div class=\"doc-field\"><span>Date</span><strong>December 2</strong></div></div><p>Thank you all for contributing to the monthly sales challenge. We acquired several new clients due to your hard work. The sales challenge started as an individual effort and evolved into a positive team experience. Aaron and Marisol had the highest sales. Thus, they will both get a gift certificate for Spanto Restaurant.</p><p>Because I was surprised by the amount of enthusiasm and team spirit this challenge has created, I will offer each of you an additional day off. Furthermore, the executive team has decided to hold this initiative again in the future. Please e-mail me some new prize ideas, which can be for individual staff members or entire teams.</p></div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>149-150 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Cole Theater Membership Information:</h2><p>To become a Cole Theater member, apply at www.coletheater.com/join or visit one of our box office booths. Membership cards must be renewed after 12 months.</p><p>Membership Benefits:</p><p>• Tickets to our exclusive movie premieres, which are attended by famous actors<br/>• $6 entry for morning showings<br/>• 10 percent discount for afternoon, evening, and weekend showings<br/>• Free concession stand items or movie tickets in exchange for reward points</p><p>For more information, e-mail extras@coletheater.com.</p></div></section></div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 151-152</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>CHAT</span><small>151-152 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>11:33 A.M.</time></div><div class=\"message-text\">Are you doing an open house for the two-bedroom home on Kent Street today?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Connie Mills</strong><time>11:35 A.M.</time></div><div class=\"message-text\">It starts in less than half an hour. I'm here setting up now. Why?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>11:36 A.M.</time></div><div class=\"message-text\">I forgot the key to the apartment at 182 North Avenue. I'm in the car at the moment, and I know you usually have a spare. I'm driving past the Sydney Mountain Mall.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Connie Mills</strong><time>11:38 A.M.</time></div><div class=\"message-text\">I do. Come get it anytime before noon. I want the driveway to be available for potential buyers who might get here early, so please park around the corner. I saw a few empty parking spaces along the sidewalk there.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>11:41 A.M.</time></div><div class=\"message-text\">Perfect! Thanks so much.</div></div></div></div></section></div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 153-154</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>LETTER</span><small>153-154 · 1/1</small></div><div class=\"document-body\"><p>Brugeri Museum of Fine Art<br/>856 Empire Street<br/>Grants Pass, OR 97527</p><p>September 9</p><p>Robert Jansen<br/>3111 Helmsview Drive<br/>Arcata, CA 95521</p><p>Dear Mr. Jansen,</p><p>I am sorry to report that Descending Cherub, the statue you so generously lent us from your personal collection this year, was damaged yesterday. Our staff were in the process of moving all the works in the outdoor sculpture garden into the main exhibition hall when the weather changed suddenly. Unfortunately, they did not get to your statue in time. A strong wind caused it to fall from its pedestal, breaking the left hand off. I have enclosed some pictures of the broken area.</p><p>Our insurance company will, of course, financially compensate you for the damage. In addition, we will cover the cost of having it expertly repaired. With your consent, we can ask a professional to do this. If you prefer to use someone of your own choosing, simply let us know, and we will ship the item to you right away.</p><p>Once again, I apologize for this regrettable accident. I will await your reply.</p><p>Mia Hyman<br/>Curator, Brugeri Museum of Fine Art</p><p>Enclosure</p></div></section></div>","155-157":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 155-157</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE</span><small>155-157 · 1/1</small></div><div class=\"document-body\"><p>Steel Works Inc. has begun operations at its new plant. The mill, built at a cost of $60 million, will contribute to the growth of Malaysia's construction industry. It will be able to produce about 1 million tons of reinforced steel per year.</p><p>Established in Kampung Tebing, Steel Works' factory will ship steel bars to various parts of the country, according to company CEO Aiman Musa. \"The plant will help Malaysian cities develop their infrastructure,\" he added.</p><p>The plant is Steel Works' second. Its first mill in Rembau now exclusively exports its products to other Asian countries, though it once met almost half of Malaysia's steel demand. The Rembau plant was upgraded last year and is considered one of Asia's most modern steel plants. Steel Works' plants utilize the latest technology to ensure not only that production is efficient but that it has a low environmental impact.</p><p>With the establishment of its Kampung Tebing plant, Steel Works' market share in Malaysia is expected to rise to 72 percent. The value of its shares on the local stock exchange increased by 24 percent with the opening of the new plant.</p></div></section></div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 158-160</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>158-160 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All marketing officers</strong></div><div class=\"doc-field\"><span>From</span><strong>Linda Marks</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Conference transportation</strong></div><div class=\"doc-field\"><span>Date</span><strong>October 14</strong></div></div><p>Dear Colleagues,</p><p>Many of you will be attending the social media conference in Wilmington on Friday. — [1] —. If you are planning on taking the company-chartered bus, we will meet in Parking Lot A and leave promptly at 8:30 A.M. The alternatives are to drive or take public transportation. Directions to the Wilmington Conference Center were provided in a previous e-mail. — [2] —.</p><p>For those of you who will not be attending, the representatives from Whitaker's Sports Apparel, the client we acquired last week, will be visiting the office around 10 A.M. — [3] —. I have already advised them that the office will be almost empty due to the conference. — [4] —. Robert Buck in the accounting department will be meeting with them and giving them a quick tour. Be sure to introduce yourself if you get the chance.</p><p>Thank you.</p><p>Linda Marks</p></div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 161-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>CHAT</span><small>161-164 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>11:08 A.M.</time></div><div class=\"message-text\">I was late yesterday for our beginning-of-November meeting, so I'd like to ask about the changes to our overtime work policy.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>11:09 A.M.</time></div><div class=\"message-text\">Of course. But didn't you get the memo Mr. Ward sent a little while ago? It summarizes the new rules.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>11:10 A.M.</time></div><div class=\"message-text\">I only glanced at it briefly, but I saw something about a streamlined process. Does that mean we don't have to turn in the request form anymore?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>11:12 A.M.</time></div><div class=\"message-text\">Yes. In the past, a lot of employees worked extra hours to finish projects but only received their regular salary. This happened because they didn't submit the official overtime document. Many found the form to be too complicated.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Gene Shipley</strong><time>11:13 A.M.</time></div><div class=\"message-text\">Now, Ned, anyone who works over 40 hours a week automatically receives extra pay. All we have to do is enter the information into the payroll system.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>11:13 A.M.</time></div><div class=\"message-text\">Right. And it's effective as of 9 A.M., December 1. At the end of every month, your supervisor will review what you inputted. Unless there's a problem that needs to be discussed, it'll be approved at that point.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>11:15 A.M.</time></div><div class=\"message-text\">That's good to know, especially considering the big project that I'll be working on in the coming weeks. Thanks!</div></div></div></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE</span><small>165-167 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">DTA Readies for Airport Overhaul</h2><p>The Denver Transportation Authority (DTA) has announced a $50 million renovation plan for Franklin Airport, on the outskirts of Denver. The announcement comes as a result of the National Airlines Group (NAG) having labeled its runway as dangerous for large aircraft. The NAG sets safety regulations for all US airports.</p><p>\"When we took over Franklin Airport 11 years ago, we intended to begin rebuilding it right away. Unfortunately, we encountered numerous budget-related delays. However, in light of the NAG's recent judgment, we have managed to secure federal funding and will finally be able to repair our runway and expand our terminals,\" said DTA chief Elaine Webster.</p><p>The DTA has hired several construction companies to carry out the project, which is expected to be completed within 18 months. Work will start on Terminal B only after the expansion of Terminal A is finished, which will leave the airport fully functional the whole time. After the project has concluded, Franklin Airport will begin serving as a point of arrival and departure for international flights.</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>168-171 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Joan Stendhal joan.stendhal@mynextmail.com</strong></div><div class=\"doc-field\"><span>From</span><strong>Robert Hamilton r.hamilton@pichaipartners.com</strong></div><div class=\"doc-field\"><span>Date</span><strong>September 18</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Your application</strong></div></div><p>Dear Ms. Stendhal,</p><p>Congratulations! Out of hundreds of applicants, we have selected you to move on to the next stage of the process and participate in an interview at our office. [1]</p><p>The interview is scheduled for Friday, September 23, from 1 P.M. to 5 P.M. All applicants will be allowed to take 30-minute breaks between activities. The interview will consist of two parts. During the first part of the interview, you will answer questions from a panel of executives. When you are done, you must stay in the immediate area until you are called for the second part of the interview. For the second part, you will be asked to analyse actual legal cases that our firm has worked on in the past. You will be given an hour to work on one case by yourself. [2] — Then, you and the other applicants will form groups of two to work on the second case. This activity will be used to evaluate your communication skills and ability to work with coworkers. Further details will be provided on the day of the interview. [3] —</p><p>We will supply everything you need to complete the process, including paper, pens, and access to selected law books from our library. [4] — We will also provide refreshments.</p><p>Please confirm your participation by replying to this e-mail. You can also call me at 555-4883 if you have any questions.</p><p>Sincerely,<br/>Robert Hamilton</p></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>172-175 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Run for a Good Cause!</h2><p>Here at the Highland Employment Center, we need your support for our Tech Training initiative. Many individuals struggle to find work because they lack basic computer skills. Thus, we hope to raise enough funds to hire a computer instructor to run weekly workshops at our center for a full year. Job seekers will be able to attend these sessions for free. By gaining computer proficiency, they will stand a better chance of finding a position and will be able to earn more than they did in the past.</p><p>You can help us achieve our goal by participating in a 10-kilometer race in Arthur Park on August 15. The entry fee is $40 throughout July, $45 from August 1-14, and $50 on the day of the race. Those who run in a creative costume will be eligible to win a $100 voucher for Harlan Foods. The costume contest winner will be announced after the race.</p><p>Runners will be given packets that include a race bib and storage bag for personal possessions. Those who finish within the two-hour time limit will receive a photograph of themselves crossing the finish line. Go to www.highlandec.com/10k to sign up today!</p></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>176-180 · 1/2</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>From</span><strong>Rachel Duval rduval@pfmagazine.com</strong></div><div class=\"doc-field\"><span>To</span><strong>John Hassan j.hassan@pfmagazine.com</strong></div><div class=\"doc-field\"><span>Date</span><strong>July 29</strong></div><div class=\"doc-field\"><span>Subject</span><strong>September issue</strong></div></div><p>Hello, John.</p><p>Though we have made a lot of progress with the September issue, we still have some decisions to make. First, we have to choose a model for the cover. Since this is typically the most popular issue of the year, we need to get a big celebrity. How about working with Su-min Yoo aga
