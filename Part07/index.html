<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>MEMO 備忘錄</span><small>181-185 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">COMPANY MEMO</h2><p>TO: All team leaders<br/>FROM: Helen Malone, CEO, Daisy Corp.<br/>DATE: April 21<br/>SUBJECT: Upcoming Employee Evaluations</p><p>Although many of you are already familiar with this process, I'd like to remind you of a few details concerning our annual evaluations for staff members, which will begin on June 1. Next Monday, human resources staff will be e-mailing you information about each member of your team including their start dates at the company and their past evaluation results. Take some time to review this information before the end of May.</p><p>If an employee receives a positive performance evaluation and has not gotten a raise or bonus within the past three months, that staff member is eligible for a 5.5 percent salary increase. For questions or concerns, get in touch with Gail Cullen in the human resources department.</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 電子郵件</span><small>181-185 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">TO</span><span class=\"mail-value\">Gail Cullen gail.cullen@daisycorp.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">FROM</span><span class=\"mail-value\">Cody Long cody.long@daisycorp.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">DATE</span><span class=\"mail-value\">April 24</span></div><div class=\"mail-row\"><span class=\"mail-key\">SUBJECT</span><span class=\"mail-value\">Need Assistance</span></div></div><p>Dear Ms. Cullen,</p><p>I have a question regarding Shayla Barrie, one of the employees I'll be evaluating this coming June. Ms. Barrie does an excellent job as a software engineer on my team and has held that position for two years. Last month, she was awarded a bonus for successfully completing her part of a demanding 10-week project.</p><p>I figure she deserves a raise for being such a valuable member of my team. I'm wondering if I could request an exception for Ms. Barrie in this case. Just let me know what steps I should take. Also, if possible, I'd like to give her a larger pay increase than the standard rate. Please tell me if that's acceptable as well.</p><p>I appreciate your assistance.</p><p>Kind regards,</p><p>Cody Long<br/>Software Engineering Team Leader</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>LETTER 信件</span><small>186-190 · 1</small></div><div class=\"document-body source-passages\"><p>August 28</p><p>Mount Llanberis Park Office<br/>122 High Street<br/>Llanberis, Gwynedd LL55 4HB</p><p>To Whom It May Concern,</p><p>Ever since I was a teenager, I've visited Mount Llanberis Park to participate in some of my favorite activities. While at the park in recent months, I've witnessed some changes that concern me. There used to be a moderate number of people, but the park has begun attracting large crowds during the summer months. With the growing popularity of the area, a number of rules should be introduced.</p><p>For instance, I've seen a lot of people leaving the marked trails lately. I recommend that you create a regulation that prohibits people from doing so. Also, at the rock climbing area, I've noticed inexperienced climbers attempting the challenging routes. In order to prevent accidents, learners should be carefully monitored. I also believe that visitors should be required to fill out permission forms in order to engage in adventurous activities.</p><p>Thank you for your time.</p><p>Regards,<br/>Glenda Ree</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / TABLE 表單</span><small>186-190 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Mount Llanberis Park—Adventure Sports Registration Form</h2><p>Please submit this form to Mount Llanberis Park Ranger Station. You will be allowed to proceed only if your application has been approved by the ranger on duty. First-time visitors will not be allowed to proceed unless accompanied by a certified guide. Please inquire with us if you need to rent any gear.</p><p>Name: Branwen Pearse<br/>Group size: 4<br/>Date and time of visit: October 19 / 9:30 A.M.<br/>Expected duration of visit: 6 hours<br/>Is this your first visit? X Yes No</p><p>Planned activity and location:</p><div class=\"document-table-wrap\"><table class=\"document-table\"><tr><td>Rock climbing</td><td>Hiking</td><td>Mountain biking</td></tr><tr><td>Giant's Wall</td><td>Lloyd Peak X</td><td>Harlech Slope</td></tr><tr><td>Zipper Descent</td><td></td><td></td></tr><tr><td>Rules to keep in mind:</td></tr><tr><td>(1) Do not litter.</td></tr><tr><td>(2) The park is open from 6 A.M. to 6 P.M. Visitors must return to the park office by closing time.</td></tr><tr><td>(3) Always stay on marked trails.</td></tr><tr><td>(4) Do not feed the wildlife.</td></tr></table></div><p>** Violators will be subject to a $30 fine.<br/>** For assistance or to report violations of park regulations, call 555-2129.</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / TABLE 表單</span><small>186-190 · 3</small></div><div class=\"document-body source-passages\"><p>Mount Llanberis Park Ranger Station<br/>Visitors Taking Part in Adventure Sports on October 19</p><div class=\"document-table-wrap\"><table class=\"document-table\"><tr><td>Reservation time</td><td>Location visited</td><td>Name</td><td>Notes</td><td>Time of return</td></tr><tr><td>7:45 A.M.–3:45 P.M.</td><td>Giant's Wall</td><td>Bryn Hughes</td><td>Group of three people</td><td>3:40 P.M.</td></tr><tr><td>8:00 A.M.–10:15 A.M.</td><td>Zipper Descent</td><td>Gweneth Edwards</td><td>Mountain bike rented</td><td>11:00 A.M.</td></tr><tr><td>9:30 A.M.–3:30 P.M.</td><td>Lloyd Peak</td><td>Branwen Pearse</td><td>Accompanied by guide; Group of four people</td><td>2:45 P.M.</td></tr><tr><td>11:15 A.M.–4:00 P.M.</td><td>Giant's Wall</td><td>Dennis Roberts</td><td>Group of three people</td><td>3:55 P.M.</td></tr><tr><td>12:30 P.M.–5:00 P.M.</td><td>Harlech Slope</td><td>Owen Price</td><td>Hiking poles rented</td><td>6:10 P.M.</td></tr><tr><td>* Note for staff: Do not forget to record the times when visitors return.</td></tr></table></div></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-catalog\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT 廣告</span><small>191-195 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Viu Athleisure Shop</h2><p>Athleisure wear is popular for its versatility. We carry 10 brands and are currently offering special promotions until July 31. All discounts apply both online and in our store.</p><div class=\"catalog-grid\"><div class=\"catalog-item\"><h3>Bemba Team</h3><p>Bemba Team sells synthetic clothes made with advanced fibers. The material is extremely moisture-absorbent and dries quickly. Enjoy a 20 percent discount on selected products.</p><span class=\"offer-badge\">20% OFF</span></div><div class=\"catalog-item\"><h3>Ventra</h3><p>Ventra specializes in athletic shoes for a variety of sports. Ventra is new in our store and is offering an introductory discount of 30 percent.</p><span class=\"offer-badge\">30% OFF</span></div><div class=\"catalog-item\"><h3>Upstar Athletics</h3><p>Upstar Athletics manufactures its clothing using polyester made from recycled plastic water bottles. It is offering a general discount of 10 percent.</p><span class=\"offer-badge\">10% OFF</span></div><div class=\"catalog-item\"><h3>Yogana</h3><p>Yogana manufactures yoga apparel in many patterns and colors. Yoga shorts are currently on sale for 40 percent.</p><span class=\"offer-badge\">40% OFF</span></div></div><p>Enjoy free shipping on all orders over $80. Custom printing on apparel items is available for an added charge. Visit our store at 449 South State Street in Minneapolis or go to our Web site at www.viuathleisure.com.</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / TABLE 表單</span><small>191-195 · 2</small></div><div class=\"document-body source-passages\"><p>www.viuathleisure.com/contactus</p><p>Contact Form</p><p>Please reach out to us if you have any questions regarding our products and services. We promise to respond to your inquiry within 48 hours.</p><p>Name: Maria Cortez<br/>E-mail: maria@evanstonbball.com<br/>Date submitted: July 13</p><p>Comment:</p><p>I am interested in buying 35 sets of matching shirts and shorts for an amateur basketball team that I coach. As the team is composed of individuals from middle school and high school, I will need a range of sizes. Also, I was wondering if we could get a bulk discount in addition to the sales your store is running.</p></div></section><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE 文章</span><small>191-195 · 3</small></div><div class=\"document-body source-passages\"><p>http://www.upstar.com<br/>Review posted on August 4<br/>Author: Maria Cortez</p><p>Upstar Athletics is a great company, and their clothes are fantastic. The fabric stretches well and is perfect for sports. Unfortunately, I reached out to a store that carries Upstar Athletics among other brands, and they did not respond to my inquiry. So, I decided to contact Upstar Athletics directly. They sent 35 shirts and shorts in individual sizes with a generous quantity discount and printed our team's name on the clothes for free.</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-webpage\"><div class=\"doc-ribbon\"><span>ARTICLE 文章</span><small>196-200 · 1</small></div><div class=\"document-body source-passages\"><p>https://www.visionbath.com/serviceinquiry</p><p>Vision Bath</p><p>Vision Bath is an independent bathroom contractor that aims to provide customers with the best overall home renovation experience. Whether you wish to add a new bathroom to your home or remodel an existing one, we guarantee that our work is high quality. If you want to have the bathroom of your dreams, you'll first need to complete a brief questionnaire to let us know what you're looking for. Within 24 hours, one of our skilled designers will contact you by phone to discuss your preferences further. You'll receive a product catalog and will be able to schedule a face-to-face meeting when you're ready. During this consultation, your designer will present you with a contract, and work will commence shortly thereafter. Click here to begin the process.</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / TABLE 表單</span><small>196-200 · 2</small></div><div class=\"document-body source-passages\"><p>https://www.visionbath.com/questionnaire</p><p>Vision Bath Questionnaire</p><p>Name: Margaret Collins<br/>Phone: 555-9911<br/>E-mail Address: margcollins@wyohi.com</p><p>Why do you want a new or remodeled bathroom?<br/>My family is too large to continue sharing a single bathroom, so we need another one built.</p><p>Which term best describes the style of bathroom you want?<br/>☑ Contemporary　☐ Traditional　☐ Luxurious</p><p>What colors do you want to be used? Blue and White</p><p>What type of floor material are you interested in?<br/>☐ Tile　☑ Hardwood　☐ Vinyl　☐ Other</p><p>What type of countertop would you like?<br/>☐ Granite　☑ Porcelain　☐ Glass　☐ Other</p><p>When would you like this project to begin? Early May</p><p>What is your budget? Between $10,000 and $15,000</p><p>SEND</p></div></section><section class=\"document-card type-review\"><div class=\"doc-ribbon\"><span>ARTICLE 文章</span><small>196-200 · 3</small></div><div class=\"document-body source-passages\"><p>https://www.businessreviews.com/visionbath</p><p>★★★★★ Margaret Collins May 25</p><p>I'm extremely impressed with Vision Bath. After submitting my questionnaire, I was contacted by a helpful designer named Sandra Reynolds. She had excellent ideas for everything from sink faucets to cabinet handles and was very patient with me. I spent quite a while studying Vision Bath's catalog and when she visited my home, we went over my selections together. I'm especially glad that she helped me choose the granite countertop. Although it cost more than my original choice, it looks better than I could've imagined.</p><p>Vision Bath</p></div></section></div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>通知</span><small>131-134</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">旅行者請注意</h2><p>自 10 月 5 日起，Barings 機場將開始建設新航廈來容納國際航班。132 新航廈的加入總計將增加我們的容量達百分之 40。新航廈稱為第 5 航廈，將位於和目前營運中的 4 座航廈不同的建築物。所以，它只能透過輕軌或接駁巴士前往。133 這兩種選項在其他四座航廈都將可以利用。134 機場部分區域可能也將暫時關閉，包括第 4 航廈某些部分。不過，所有航廈明年都將完全開放。</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-announcement type-translation\"><div class=\"doc-ribbon\"><span>公告</span><small>135-138</small></div><div class=\"document-body source-passages\"><p>杜魯斯大戲院很榮幸宣布，將於10月22日星期四晚上7點首映 Elwood Barker 的紀錄片《Gideon's Revenge》。活動總長3小時，影片放映115分鐘，接著 Barker 先生將利用剩餘時間回答觀眾提問。這應能讓影迷更加了解他的創作過程。</p><p>《Gideon's Revenge》取材自 Barker 先生四年來廣泛遊歷敘利亞、黎巴嫩與伊拉克的經歷。如果您想觀看這部關於中東生活的第一手紀錄，請儘快行動。門票數量有限。</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>信件</span><small>139-142</small></div><div class=\"document-body source-passages\"><p>3月17日<br/>Clara Rodriguez<br/>644 Lockley Street<br/>Galt City, Ontario N1R 3Y8</p><p>親愛的 Rodriguez 小姐：</p><p>我們寫信是關於您未支付上期網路服務費的情況。我們曾多次試著打電話聯絡您，卻都沒有成功。請注意，您在 Loft Net 尚欠的63.97元已於3月15日到期。根據我們的政策，付款期限過後一週內仍可繳款而不收取額外費用。超過該期限後，我們就必須收取利息。由於我們十分珍惜您的惠顧，希望您儘快處理此事。若要結清帳單，請撥打555-7843，並準備好您的信用卡。</p><p>此致<br/>Albert Sanders<br/>Loft Net 客服部</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>備忘錄</span><small>143-146</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Mila Larson，行銷傳播部主管</span></div><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">全體員工</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">Liang 公司宣傳活動</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">7月25日</span></div></div><h2 class=\"doc-heading\">各位同仁：</h2><p>感謝大家共同為 Liang 公司的促銷宣傳活動提出企劃案。Liang 公司的主管對我們的設計印象非常深刻，已決定雇用我們。至於電視廣告，我們將需要所有人參與。接下來幾週會有許多工作，因此各位的合作至關重要。我已安排大家於7月27日與 Liang 公司執行長會面，以便制定詳細時程。我們也將討論雜誌跨頁廣告的規劃。</p><p>如果您有任何意見或額外想法，請準備好在會議中提出。</p><p>謝謝！<br/>Mila Larson</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>對話</span><small>147-148</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>寄件者：555-8164</strong><time class=\"chat-time\">上午10:59</time></div><div class=\"message-text\">嗨，Jackson。我收到你電子報的最新草稿了。以下是我的想法。首先，謝謝你嘗試了我的建議。新的設計看起來很現代，應該會吸引我們的目標讀者。不過，現在看起來跟我們的網站太不一樣了。我認為品牌一致性很重要。我會建議使用和網站一樣的顏色。也可以請你換掉最後一張照片嗎？我們不能用那個，因為太舊了。我今天下午會用電子郵件寄另一張給你。你做好的時候，再寄給我下一張草稿。再次感謝！</div></div></div></div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>文章</span><small>149-150</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Sandi Vincent 將負責開球</h2><p>3 月 21 日— 鄉村音樂明星 Sandi Vincent 下個月將拜訪 Warwick，幫我們的棒球隊 Harpoons 開始新的球季。市長 Belinda Cutter 邀請 Vincent 小姐在 4 月 7 日的開幕賽開球（投第一顆球）。</p><p>Vincent 小姐靠著第三張專輯《Prairies and Plains》的成功，獲得了全國性的知名度。而在最近，她在電影《Uncle Trevor's Farm》獻出了演員身分的處女秀。</p><p>由於忙碌的巡迴演出行程，Vincent 小姐無法發表意見，但她的經紀人表示：「Sandi 很期待首次拜訪 Warwick。她是熱情的棒球迷，我相信她會玩得很開心。希望她投出幸運的一球，讓 Harpoons 有一個成功的球季。」</p></div></section></div>","151-153":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 151-153</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>通知</span><small>151-153</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Rumfax 共享園地即將開放</h2><p>Rumfax 共享園地（RSG）今年的種植季是 3 月 31 日至 9 月 15 日，所以現在就是您登記申請個人園地區塊的時候。再度申請的去年度園丁將支付 40 元會員費用，而新園丁將被收取 55 元。*歡迎任何居住於 Rumfax 的人士在 www.rumfaxgarden.com 申請。不過，請務必注意以下規定。</p><p>每位園丁有責任維護自己的地塊。這包括所有必要的澆水、除草與收成。除非經過 RSG 協調者特別同意，否則地塊不能擴張。增設於地塊的任何構造物在設置前也必須得到我們人員的同意。RSG 會員只能在自己的地塊種植，且必須確保種植的東西不會遮蔽鄰人植物（的陽光）。儲物小屋有工具供所有人使用，但事後必須歸還。</p><p>*會員費用於支付水、土壤與肥料的費用。</p></div></section></div>","154-155":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 154-155</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>對話</span><small>154-155</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Juliet Pau</strong> <time>[下午3:45]</time></div><div class=\"message-text\">你看過我們公司吉祥物的提案了嗎？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Chris Cormier</strong> <time>[下午3:48]</time></div><div class=\"message-text\">我午餐過後就看了。我想，Barrow 小姐把我們的想法詮釋得很好。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Juliet Pau</strong> <time>[下午3:49]</time></div><div class=\"message-text\">我也這麼認為。在三張草圖中，我真的很喜歡她在 A 案中畫角色服裝和身體的方式。但我對臉不太確定。你認為呢？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Chris Cormier</strong> <time>[下午3:50]</time></div><div class=\"message-text\">我算是同意。眼睛應該再大許多。C 案的臉比較接近我們想要的。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Juliet Pau</strong> <time>[下午3:51]</time></div><div class=\"message-text\">我知道了。我們 5 點開會，跟團隊其他人討論這些圖吧。Barrow 小姐明天會來聽取我們對於她作品的回饋意見。我們必須決定要求她改變什麼。</div></div></div></div></section></div>","156-158":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 156-158</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>文章</span><small>156-158</small></div><div class=\"document-body source-passages\"><p>沙蘭港（4 月 19 日）— Touchstone Ventures 公司昨天宣布收購了坦尚尼亞鐵路公司（TTL）。這是 Touchstone 公司於 2 月中收購 Umoja Transport 公司後又一次的收購交易。</p><p>公司領導人 Mieke de Graaf 表示：「我們對 TTL 的收購，將幫助我們進軍其他東非國家。在這個時間點，Touchstone 公司必須大膽拓展到迅速發展中的地區。— [1] —。」</p><p>TTL 先前為國營鐵路公司，難以維持獲利，而其部分鐵路急需修繕。Arusha 商業大學教授 Patrick Maguli 博士表示：「Touchstone 公司將必須大量投資於升級 TTL 的基礎設施。」</p><p>Maguli 博士補充：「根據我的研究，有越來越多坦尚尼亞人選擇開車或搭巴士，而不是搭火車。— [2] —。Touchstone 公司的挑戰在於扭轉這個趨勢。」</p><p>Touchstone 公司的計畫有四個部分。它的第一優先是修理並升級已建設的鐵路。然後，它計畫從柴油動力列車轉換為電車。第三階段則是建設新的路線，藉由與鄰國逐漸成長的往來貨物量獲利。— [3] —。最後，Touchstone Ventures 公司的目標是為了觀光目的發展 TTL 的鐵路網。例如，它可能開始提供蒸氣動力古董列車的觀景旅行。— [4] —。</p></div></section></div>","159-160":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 159-160</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-translation\"><div class=\"doc-ribbon\"><span>廣告</span><small>159-160</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Goliath 倉儲：您超量持有物品的安全便利空間！</h2><p>您的家裡或者公司已經滿到讓人不舒服了？那麼，與其搬家，請了解一下 Goliath 倉儲，位於 East Island 路 452 號，就在多倫多外圍。我們有超過 800 個倉儲單元，並且提供月租或年租的優惠價。長期租約可協商。您可以放心自己的物品會很安全——我們有最先進的（監視）攝影系統與 24 小時值勤的保全人員。對於本地企業，我們也有 10 個冷藏倉儲單位可租用，非常適合保存需要冷藏的商品。僅限 12 月當月，透過我們公司為儲藏物品購買保險者，將獲得 20% 的保險折扣！欲詢問可租用單位、價格與規定，請上 www.goliathstorage.on.ca。</p></div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 161-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>161-164</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">&lt;會員列表&gt;</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">info@windsorbiz.org</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">通知</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">12 月 2 日</span></div></div><p>親愛的會員們：</p><p>我們感謝各位持續作為本地業者會員參與 Windsor 商會。請參加我們接下來的免費研討會。— [1] —。在上個月的節約用電主題之後，本月的主題是減少水的浪費。研討會將於 12 月 13 日上午 10 點至中午 12 點於 Windsor 商務中心 B 室舉行。— [2] —。</p><p>生態學家暨節水專家 Calvin Randall 將會說明，本地業者能怎樣採取措施來減少成本並幫助保護環境。他將提供可遵循的簡單訣竅與技術。他也將在研討會後提供免費一對一諮詢。</p><p>Randall 先生是備受敬重的科學家，並且曾經在這幾年出演許多電視與廣播節目。— [3] —。這將是學習能如何同時減少水費並保護地球的好機會。另外也建議本地事業主攜帶最近的公用事業帳單明細，了解能節省的各種不同領域。</p><p>要報名參加這個月的研討會，請回覆這封電子郵件。— [4] —。謝謝。</p><p>Windsor 商會</p></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單／表格</span><small>165-167</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Arturo 不動產—顧客滿意度調查</h2><p>感謝您利用 Arturo 不動產。我們想要知道我們的服務滿足您需求的效果如何，所以請花一點時間填好這份問卷。</p><p>我當時在求購不動產<br/>我當時在求售不動產 X</p><p>為什麼選擇和我們合作？</p><p>我聯絡了幾家不動產仲介公司，但你們的公司最快回覆。另外，Hamlin 先生能夠很詳細地回答我一開始的問題。</p><p>您對我們服務的什麼方面最滿意？</p><p>在我接受買家的出價之後，Hamlin 先生在交易的每個步驟都持續告訴我消息。他定期打電話給我，讓我知道正在進行什麼事。</p><p>您對我們服務的什麼方面最失望？</p><p>我會希望潛在買家來看我家的時候，我能更早收到通知。至少 1 小時前收到通知會比較方便。</p><p>您會向家人或朋友推薦我們的服務嗎？</p><p>會 X 不會</p><p>您的姓名：Rosemary Woodard</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>對話</span><small>168-171</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Maria Sanchez</strong> <time>[中午12:06]</time></div><div class=\"message-text\">過去幾季銷售情況令人失望，線上和我們的店面都是。有什麼我們能扭轉局勢的主意？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>William Behar</strong> <time>[中午12:09]</time></div><div class=\"message-text\">我們和名人合作家具與家飾系列怎麼樣？我們需要有名又很有時尚品味的人。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Robert Gillibrand</strong> <time>[中午12:12]</time></div><div class=\"message-text\">Fiona Connolly 或許可以。她是有名的室內設計師。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>William Behar</strong> <time>[中午12:13]</time></div><div class=\"message-text\">那會很適合的。她的電視實境節目現在很受歡迎，我想她以前沒跟別的零售店合作過。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Maria Sanchez</strong> <time>[中午12:14]</time></div><div class=\"message-text\">還有，她在社交媒體有很多追蹤者。有任何想法，Gabrielle？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Gabrielle Shepard</strong> <time>[中午12:15]</time></div><div class=\"message-text\">我喜歡這個主意。我可以和她合作設計新的家具，但給她選擇布料的自由。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>William Behar</strong> <time>[中午12:17]</time></div><div class=\"message-text\">沒錯。或者舉例來說，你們可以合作設計一張新的床，她可以設計床單與枕套之類的相關物品。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Robert Gillibrand</strong> <time>[中午12:18]</time></div><div class=\"message-text\">OK。我會聯絡她的代表人。如果順利的話，可能會發展成持久的夥伴關係。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Maria Sanchez</strong> <time>[中午12:19]</time></div><div class=\"message-text\">我們也應該想想其他人選，以防萬一她拒絕我們。</div></div></div></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>信件</span><small>172-175</small></div><div class=\"document-body source-passages\"><p>Corrigan Technology 公司總部<br/>Shirlington 大道 703 號<br/>阿靈頓，維吉尼亞州 22206</p><p>10 月 20 日</p><p>敬啟者：</p><p>為了感謝您定期訂購我們的商品，我們想邀請您參加即將上市的產品系列非公開預覽活動。這些產品將在明年初發售，而且還沒有對大眾公開。</p><p>活動將於 11 月 9 日下午 5 點至 9 點，在這封信頂部提供的地址舉行。Corrigan Technology 公司執行長 Bill Schriver 將發表開場致詞，然後設計團隊主任 Pete Wellington 將簡報介紹我們新系列的家電。顧客不能拍照或錄影拍攝活動。傍晚 6:30 將供應晚餐，然後來賓將看到新產品的實際操作示範。</p><p>如果您打算出席，請在 10 月 27 日前撥打電話 555-4498 聯絡 Louise Geisler。如果她在那天之前沒有接到您的回覆，我們就視為您不會出席，並且將您的門票號碼從來賓名單中刪除。</p><p>門票號碼將被包括在特別抽獎活動中。獲獎號碼將在當晚結束時宣布，所以請務必攜帶這封信。</p><p>中獎者將得到優惠券，持有優惠券者在我們的新產品系列發售時可以獲得折扣。優惠券可以在全國各地的店頭使用。</p><p>希望您加入我們。</p><p>Matthew Schenk<br/>公共關係部長</p></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>通知</span><small>176-180 · 1</small></div><div class=\"document-body source-passages\"><p class=\"notice-subject\">Ludlow 航海博物館的特別通知<br/>5 月 14 日</p><p>我們很遺憾地宣布，Ludlow 航海博物館目前暫停對外開放。這是因為我們牆壁的隔熱材料需要替換。為了在整修期間保護我們的收藏品，我們已經將其中許多搬到 3 樓儲藏室。</p><p>下週，博物館館長 Ken Lin 將和董事會開會，決定重新開放的日期，希望會是夏季末的時候。如果您想收到關於我們工程進度的最新消息，請在 www.ludlownautical.org/emailsubscription 訂閱我們的電子報。</p><p>為了對於造成不便表示歉意，將寄給會員 Crescent Bay 水族館的折價券，它也是由 Ludlow 觀光組織所營運的。同時，將會郵寄我們紀念品店的免費鑰匙圈給被取消事先預約的每位來賓。</p><p>謝謝您的諒解。</p></div></section><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>176-180 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Andrea Smith andreasmith@sunshineheights.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Ken Lin kenlin@ludlownautical.org</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">5 月 15 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">博物館關閉</span></div><div class=\"mail-row\"><span class=\"mail-key\">附件</span><span class=\"mail-value\">Ludlow 通知</span></div></div><p>親愛的 Smith 小姐：</p><p>我的紀錄顯示，您安排了來自 Sunshine Heights 的年長者團體在下週二參觀 Ludlow 航海博物館。遺憾的是，博物館必須關閉進行整修。我附上了關於目前狀況的通知。</p><p>我們希望您星期二能將出遊安排在不同的地點。我個人推薦 Crescent Bay 水族館。</p><p>如果您想在我們重新開放後再次安排參觀，到時候請聯絡我們。</p><p>Ken Lin<br/>Ludlow 航海博物館館長</p></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>備忘錄</span><small>181-185 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">公司備忘錄</h2><p>收件者：所有團隊領導人<br/>寄件者：Helen Malone，執行長，Daisy 公司<br/>日期：4 月 21 日<br/>主旨：即將到來的員工評價</p><p>雖然你們有很多人已經熟悉這個過程，但我想提醒你們一些關於年度員工評價的細節，評價將從 6 月 1 日開始。下週一，人事部員工將會把關於各位的團隊中每個成員的資訊用電子郵件寄給你們，其中包括他們進公司的日期和過去的評價結果。請在 5 月底前花些時間檢視這些資訊。</p><p>如果員工獲得正面的表現評價，而在過去 3 個月不曾獲得加薪或獎金，該員工有資格獲得 5.5% 的加薪。如果有問題或在意的事，請聯絡人事部的 Gail Cullen。</p></div></section><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>181-185 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Gail Cullen gail.cullen@daisycorp.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Cody Long cody.long@daisycorp.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">4 月 24 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">需要協助</span></div></div><p>親愛的 Cullen 小姐：</p><p>我有個關於 Shayla Barrie 的問題，她是我在這個 6 月要評價的一位員工。Barrie 小姐在我的團隊擔任軟體工程師的工作表現傑出，她在這個職位任職 2 年了。上個月，她因為在長達 10 週、費時費力的專案中成功完成她的任務而獲得了獎金。</p><p>我認為她是我的團隊很寶貴的成員，而應該得到加薪。我想知道在這個情況下，我是否可以申請把 Barrie 小姐當成例外。請告訴我應該採取什麼步驟。還有，如果可能的話，我想要給她多於標準比率的加薪。也請告訴我那是否可以接受。</p><p>謝謝你的協助。</p><p>Cody Long<br/>軟體工程團隊領導人</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>信件</span><small>186-190 · 1</small></div><div class=\"document-body source-passages\"><p>蘭貝里斯山公園辦公室<br/>High 街 122 號<br/>蘭貝里斯，圭內德 LL55 4HB</p><p>敬啟者：</p><p>我十幾歲開始，我就會去蘭貝里斯山公園參加一些我最愛的活動。最近幾個月，我在公園看到一些令我擔心的變化。以前的人數中等，但在夏季月份，公園開始吸引更多的人潮。隨著這個地區越來越受歡迎，應該採取一些規定。</p><p>例如，最近我看到許多人脫離標示的路徑。我建議你們訂定禁止人們這麼做的規定。另外，在攀岩區，我注意到缺乏經驗的攀登者嘗試困難的路線。為了預防意外事故，初學者應該受到謹慎的監控。我也認為遊客應該被要求填好申請許可的表單，才能從事冒險的活動。</p><p>感謝您撥空閱讀。</p><p>Glenda Ree</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單／表格</span><small>186-190 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">蘭貝里斯山公園—冒險運動登記表</h2><p>請將這張表提交到蘭貝里斯山公園巡守站。只有在您的申請獲得執勤巡守員批准時，才能繼續前進。除非有認證導遊同行，否則初次到訪者不得繼續前進。如果需要租用任何裝備，請詢問我們。</p><p>姓名：Branwen Pearse<br/>團體人數：4<br/>造訪日期與時間：10 月 19 日／上午 9:30<br/>預計造訪時間長度：6 小時<br/>這是您第一次造訪？X 是　否</p><p>預定活動與地點：</p><div class=\"document-table-wrap\"><table class=\"document-table\"><tr><td>攀岩</td><td>登山健行</td><td>越野單車</td></tr><tr><td>Giant's Wall</td><td>Lloyd Peak X</td><td>Harlech Slope</td></tr><tr><td>Zipper Descent</td><td></td><td></td></tr><tr><td>請記住以下規定：</td></tr><tr><td>(1) 勿亂丟垃圾。</td></tr><tr><td>(2) 公園上午 6 點開放至下午 6 點。訪客必須在關閉時間前回到公園辦公室。</td></tr><tr><td>(3) 務必行走標示的路徑（不要脫離）。</td></tr><tr><td>(4) 勿餵食野生動物。</td></tr></table></div><p>** 違反者將被罰款 30 元。<br/>** 如需協助，或者要檢舉違反公園規定，請撥打 555-2129。</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單／表格</span><small>186-190 · 3</small></div><div class=\"document-body source-passages\"><p>蘭貝里斯山公園巡守站<br/>10 月 19 日進行冒險運動的訪客</p><div class=\"document-table-wrap\"><table class=\"document-table\"><tr><td>預約時間</td><td>造訪地點</td><td>姓名</td><td>備註</td><td>返回時間</td></tr><tr><td>上午7:45至下午3:45</td><td>Giant's Wall</td><td>Bryn Hughes</td><td>3 人團體</td><td>下午3:40</td></tr><tr><td>上午8:00至上午10:15</td><td>Zipper Descent</td><td>Gweneth Edwards</td><td>租用了登山車</td><td>上午11:00</td></tr><tr><td>上午9:30至下午3:30</td><td>Lloyd Peak</td><td>Branwen Pearse</td><td>有導遊同行；4 人團體</td><td>下午2:45</td></tr><tr><td>上午11:15至下午4:00</td><td>Giant's Wall</td><td>Dennis Roberts</td><td>3 人團體</td><td>下午3:55</td></tr><tr><td>中午12:30至下午5:00</td><td>Harlech Slope</td><td>Owen Price</td><td>租用了登山杖</td><td>下午6:10</td></tr><tr><td>* 請員工注意：不要忘了記錄訪客返回的時間。</td></tr><tr><td>文章1：participate v. 參與　witness v. 目擊 n. 目擊者　concern v. 使憂心　moderate adj. 中等的，不過度的　popularity n. 受歡迎的程度　mark v. 標記　trail n. 小徑，路徑　prohibit v. 禁止　inexperienced adj. 缺乏經驗的　challenging adj. 困難的，挑戰性的　prevent v. 預防　monitor v. 監控　permission n. 許可，允許　engage in phr. 參與，從事　adventurous adj. 冒險的</td></tr><tr><td>文章2：submit v. 提交　approve v. 批准　ranger n. （森林、國家公園）巡守員　on duty phr. 值勤中的　accompany v. 和……同行，伴隨……　certified adj. 經認證的　inquire v. 詢問　gear n. 裝備　duration n. 持續時間，期間　litter v. 亂丟垃圾　be subject to phr. 受到……的支配　fine n. 罰金 v. 對……處以罰金　violation n. 違反　regulation n. 規定</td></tr><tr><td>文章3：take part in phr. 參與　hiking pole phr. 登山杖　record v. 記錄 n. 紀錄</td></tr></table></div></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-translation type-catalog\"><div class=\"doc-ribbon\"><span>廣告</span><small>191-195 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Viu 運動休閒商店</h2><p>運動休閒服飾因為適合多種場合而受到歡迎。我們販售 10 個品牌，目前提供特別促銷活動至 7 月 31 日止。所有折扣在線上、店面都適用。</p><div class=\"catalog-grid\"><div class=\"catalog-item\"><h3>Bemba Team</h3><p>Bemba Team 販售高級纖維製成的合成面料服裝。這種材質非常吸濕而快乾。精選產品可享 20% 折扣。</p><span class=\"offer-badge\">20% 折扣</span></div><div class=\"catalog-item\"><h3>Ventra</h3><p>Ventra 專門製作各種運動項目的運動鞋。Ventra 是我們店內的新品牌，現正提供 30% 的新品牌介紹折扣。</p><span class=\"offer-badge\">30% 折扣</span></div><div class=\"catalog-item\"><h3>Upstar Athletics</h3><p>Upstar Athletics 用回收塑膠水瓶製成的聚酯纖維製造衣服。現正提供 10% 的一般折扣。</p><span class=\"offer-badge\">10% 折扣</span></div><div class=\"catalog-item\"><h3>Yogana</h3><p>Yogana 製造多種花樣與色彩的瑜伽服裝。瑜伽短褲目前 40% 折價特賣中。</p><span class=\"offer-badge\">40% 折扣</span></div></div><p>所有超過 80 元的訂單享有免運費。額外付費可利用服裝的客製印刷服務。請到我們位於明尼亞波利斯 South State 街 449 號的店面，或者上我們的網站 www.viuathleisure.com。</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單／表格</span><small>191-195 · 2</small></div><div class=\"document-body source-passages\"><p>www.viuathleisure.com/contactus</p><p>聯絡表單</p><p>如果您有任何關於我們產品與服務的問題，請聯絡我們。我們保證會在 48 小時內回覆您的詢問。</p><p>姓名：Maria Cortez<br/>電子郵件：maria@evanstonbball.com<br/>提交日期：7 月 13 日</p><p>意見：</p><p>我想為我擔任教練的業餘籃球隊購買 35 套上衣和短褲。因為球隊是國中和高中生組成的，所以我需要各種尺寸。還有，我也想知道除了貴店目前提供的折扣以外，我們是否能獲得大量訂購的折扣。</p><p>評論</p></div></section><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>文章</span><small>191-195 · 3</small></div><div class=\"document-body source-passages\"><p>8 月 4 日發表的評論<br/>作者：Maria Cortez</p><p>Upstar Athletics 是很好的公司，他們的衣服也很棒。布料很有彈性，也很適合運動。可惜的是，我聯絡了一家販售 Upstar Athletics 和其他品牌的店，而他們沒有答覆我的詢問。所以，我決定直接聯絡 Upstar Athletics。他們寄了尺寸各自不同的 35 件上衣和短褲，也提供很大的大量訂購折扣，並且免費在衣服上印了我們的隊名。<br/>文章1：athleisure n. 運動休閒（結合運動與休閒服飾的一種時裝風格）　versatility n. 多用途，適用多種目的　synthetic adj. 合成的，人造的　material n. 材料，原料　moisture-absorbent adj. 吸濕的　specialize in phr. 專門從事／製造……　introductory adj. 介紹的　manufacture v. 製造，生產　apparel n. 衣服（總稱）<br/>文章2：inquiry n. 詢問　compose of phr. 以……構成　bulk adj. 大量的<br/>文章3：stretch v. 伸縮，伸展　reach out phr. 聯絡……　generous adj. 慷慨的，大方的</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation type-webpage\"><div class=\"doc-ribbon\"><span>文章</span><small>196-200 · 1</small></div><div class=\"document-body source-passages\"><p>Vision Bath 是以顧客提供最佳住宅整修體驗為目標的獨立浴室（施工）承包商。不管您是希望為您的家增設新浴室，還是改造現有的浴室，我們都保證高品質的施工。如果您想要擁有夢想中的浴室，首先您需要填好一份簡短的問卷，讓我們知道您追求的是什麼。在 24 小時之內，我們熟練的設計師會打電話聯絡您，進一步討論您的偏好。您將收到一份產品目錄，並且能在您準備好的時候安排面對面會議。在諮詢過程中，您的設計師將向您出示一份合約，不久之後施工就會開始。點擊此處開始這個過程。</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單／表格</span><small>196-200 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Vision Bath 問卷</h2><p>姓名：Margaret Collins<br/>電話：555-9911<br/>電子郵件位址：margcollins@wyohi.com</p><p>為什麼您想要新浴室或改造浴室？<br/>我家裡人數太多了，很難繼續共用一間浴室，所以我們需要蓋另一間。</p><p>哪個詞最能形容您想要的浴室風格？<br/>☑ 現代的　☐ 傳統的　☐ 奢華的</p><p>您想要使用什麼顏色？藍色和白色</p><p>您對於哪一種地板材質有興趣？<br/>☐ 瓷磚　☑ 硬木　☐ 塑膠　☐ 其他</p><p>您想要哪一種檯面？<br/>☐ 花崗岩　☑ 陶瓷　☐ 玻璃　☐ 其他</p><p>您希望工程什麼時候開始？5 月初</p><p>您的預算有多少？10,000 到 15,000 元之間</p><p>送出</p></div></section><section class=\"document-card type-translation type-review\"><div class=\"doc-ribbon\"><span>文章</span><small>196-200 · 3</small></div><div class=\"document-body source-passages\"><p>★★★★★ Margaret Collins 5 月 25 日</p><p>我對 Vision Bath 感到非常滿意。提交問卷之後，就有一位名叫 Sandra Reynolds、樂於幫忙的設計師聯絡我。從洗手台水龍頭到櫃子的把手，她對每樣東西都有很棒的主意，而且對我非常耐心。我花了頗長的時間研究 Vision Bath 的目錄，而當她來我家的時候，我們一起把我的選擇檢視了一遍。我特別感謝她幫我選擇了花崗岩的檯面。雖然花的錢比我原本的選擇要多，但它看起來比我所能想像的更好。<br/>文章1：independent adj. 獨立的　contractor n. 承包商　remodel v. 改造　guarantee v. 保證　brief adj. 簡短的　skilled adj. 熟練的　preference n. 偏好　consultation n. 諮詢　commence v. 開始　thereafter adv. 在那之後<br/>文章2：term n. 用語，措詞　describe v. 形容，描述　contemporary adj. 現代的，當代的　luxurious adj. 奢華的　hardwood n. 硬木　countertop n. 檯面　granite n. 花崗岩　porcelain n. 陶瓷<br/>文章3：extremely adv. 極度地，非常　helpful adj. 有幫助的，樂於助人的　faucet n. 水龍頭　cabinet n. 櫃子　go over phr. 看過一遍，檢視</p></div></section></div>"};const DETAILED_EXPLANATIONS={"101":{"type":"副詞位置","translation":"消費者調查顯示，人們願意花最多 1,200 元在新電腦上。","reason":"能夠用在助動詞（would）和動詞原形（spend）之間，並且修飾動詞的副詞 (B) happily（樂意地）是正確答案。形容詞 (A) 和 (D)、名詞 (C) 都不能修飾動詞。","vocab":"consumer n. 消費者　survey n. （問卷）調查　happiness n. 幸福，快樂","paraphrase":""},"102":{"type":"人稱代名詞的格","translation":"人稱代名詞的格","reason":"可以在名詞（chances）前面做修飾，功能相當於形容詞的所有格人稱代名詞 (B) your 是正確答案。主格或受格人稱代名詞 (A)、所有代名詞 (C)、反身代名詞 (D) 都不能修飾名詞。","vocab":"well-organized adj. 有條理的　résumé n. 履歷　boost v. 提高，增加　chance n. 可能性，機會","paraphrase":""},"103":{"type":"【可以接在 be 動詞後面的成分】被動態（be + p.p.）","translation":"","reason":"空格接在 be 動詞後面，所以名詞 (A)、能構成被動態的 p.p. 形 (C)、能構成進行式的 -ing 形 (D) 是可能的答案。因為要表達插畫被刊載在雜誌上的被動意義，所以能和空格前面的 be 動詞（been）構成被動態的 p.p. 形 (C) published 是正確答案。名詞 (A) 雖然可以接在 be 動詞後面當補語，但因為表示和主詞相同的對象，所以意思會變成「插畫曾經是出版者」，並不恰當。如果使用 -ing 形 (D)，則會形成現在完成進行式，意思變成「插畫曾經在進行出版的行為」，所以不對。動詞原形 (B) 不能接在 be 動詞後面。","vocab":"illustration n. 插畫　publisher n. 出版者，出版社","paraphrase":""},"104":{"type":"接 to 不定詞的動詞","translation":"慈善商店的 24 小時投入箱，讓人們能夠在方便的時候隨時捐贈二手衣物。 接 to 不定詞的動詞","reason":"空格前面的動詞 allow（使……可以做……），後面可以接 to 不定詞當受詞補語，所以 to 不定詞 (A) to donate 是正確答案。第三人稱單數動詞 (B)、動名詞或現在分詞 (C)、名詞 (D) 不能用在 allow 的受詞補語（to 不定詞）位置。就算想把現在分詞 (C) 看成修飾前面名詞（people）的成分，但因為 allow 是第 5 類句型動詞，這樣會使句子缺少句型所需要的受詞補語，所以不對。雖然也可以把 allow 看成第 4 類句型動詞的用法「容許，給予」，並且使用選項 (D) donation 而構成「allow + 間接受詞（people）+ 直接受詞（donation）」；但缺少了能連結後面名詞 used clothes 的連接詞，所以不對。","vocab":"charity n. 慈善，慈善團體　used adj. 用過的，二手的　donate v. 捐贈　donation n. 捐款，捐獻","paraphrase":""},"105":{"type":"名詞慣用表達方式","translation":"Chemie's 冰淇淋提供每個季節不同的各種產品。","reason":"句意是「提供各種產品」，所以能和空格前面的不定冠詞（an）、後面的介系詞（of）構成 an assortment of（各種的）的名詞 (B) assortment（各種各樣的混合）是正確答案。(A) interest 表示「興趣」，(C) advent 表示「到來，出現」，(D) influence 表示「影響」。","vocab":"offer v. 提供","paraphrase":""},"106":{"type":"副詞比較級","translation":"","reason":"空格後面有 than ever before（比以往任何時候），所以需要比較級副詞 (C) more quickly 是正確答案。原級副詞 (B) 不能和 than 連用。形容詞 (A) 不能修飾動詞。最高級副詞 (D) 不能和 than 連用。","vocab":"reward points phr. 紅利點數　credit card phr. 信用卡","paraphrase":""},"107":{"type":"題意解析","translation":"","reason":"句意是「根據從用餐者收集到的回饋意見」，所以名詞 (C) feedback（回饋意見）是正確答案。(A) content 表示「內容」，(B) procedure 表示「程序」，(D) investigation 表示「調查」。","vocab":"diner n. 用餐者　be satisfied with phr. 對……感到滿意","paraphrase":""},"108":{"type":"介系詞選位置","translation":"","reason":"句意是「Sally's 糖果店是 Grant 街上從主廣場數來的第三棟建築物」，所以表示起點的介系詞 (A) from（從……）是正確答案。(B) among 表示「在……之中」，(C) under 表示「在……之下」，(D) above 表示「在……上方」。","vocab":"main square phr. 主廣場","paraphrase":""},"109":{"type":"攝影大賽的優勝者將由 5 名知名評審組成的評審團決定。","translation":"攝影大賽的優勝者將由 5 名知名評審組成的評審團決定。","reason":"句意是「大賽的優勝者會由評審團決定」，所以動詞 determine（決定）的 p.p. 形 (B) determined 是正確答案。(A) contain 表示「包含，含有」，(C) implement 表示「實施」，(D) interpret 表示「詮釋」。","vocab":"competition n. 比賽，競爭　panel of judges phr. 評審團　distinguished adj. 著名的","paraphrase":""},"110":{"type":"題意解析","translation":"","reason":"句意是「新車陣容將在明年初的車展揭曉」，所以副詞 (C) early（在初期）是正確答案。(A) previously 表示「之前」，(B) typically 表示「典型地，一般」，(D) highly 表示「非常」。","vocab":"unveil v. 揭露，發表（新計畫、產品等）　annual adj. 年度的，每年的","paraphrase":""},"111":{"type":"【動詞位置】主動態與被動態的區分","translation":"","reason":"when 引導的從屬子句（when she ~ vacation）只有主詞（she），缺少了動詞，所以動詞 (A) 和 (D) 是可能的答案。因為要表達「在 Springs 小姐休假完回到辦公室的時候」的主動意義，所以主動態 (A) returns 是正確答案。另外，表時間的副詞子句連接詞（when）後面，會用現在式表示未來的情況。如果使用被動態 (D) 的話，意思會變成「Springs 小姐從休假中被歸還」，所以不對。動名詞或現在分詞 (B) 和 to 不定詞 (C) 不能用在動詞的位置。","vocab":"","paraphrase":""},"112":{"type":"介系詞選位置","translation":"當公司最優先看待顧客的需求時，通常會帶來回頭客的生意。","reason":"When 引導的副詞子句（When companies ~ else）是已經具備主詞（companies）、動詞（prioritize）、受詞（their customers' needs）的完整子句，所以 all else 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表達「最優先看待顧客的需求」，所以表示位置的介系詞 (A) above（在……之上）是正確答案。(C) within 表示位置或範圍「在……之內」，(D) toward 表示方向「往……」。 (B) where 不能引導修飾片語。","vocab":"prioritize v. 優先考慮　need n. 需求　generate v. 產生　repeat business phr. 回頭客帶來的生意（再度購買）","paraphrase":""},"113":{"type":"名詞位置","translation":"工程師主張，對現有的太陽能板稍微修改，會使它們更有效。","reason":"空格在不定冠詞（a）後面，而且被形容詞（slight）修飾，所以名詞 (D) modification（修改）是正確答案。動詞 (A)、過去式動詞或過去分詞 (B)、形容詞 (C) 不能用在名詞位置。","vocab":"claim v. 主張　slight adj. 稍微的　existing adj. 現有的　solar adj. 太陽的　modify v. 修改　modifiable adj. 可修改的","paraphrase":""},"114":{"type":"動詞慣用表達方式","translation":"居住在 Waterford 公寓的房客，必須在每月 1 日支付房租。","reason":"句意是「居住在 Waterford 公寓的房客」，所以能和空格後面的介系詞（in）構成 reside in（居住在……）的動詞 (C) reside（居住）是正確答案。(A) occupy（佔據，住）意義上似乎說得通，但因為是及物動詞，所以不能和介系詞 in 一起使用。(B) engage 和空格後面的介系詞（in）連用而形成 engage in 時，表示「參與……」，意思不對。(D) visit 表示「拜訪」。","vocab":"tenant n. 租戶　rent n. 租金","paraphrase":""},"115":{"type":"形容詞","translation":"沒有足夠的公眾注資，Scott 基金會就必須從民間來源募集更多錢。","reason":"句意是「沒有足夠的公眾注資，必須從民間來源募集更多錢」，所以形容詞 (A) adequate（足夠的，適當的）是正確答案。(B) incompetent 表示「無能的」，(C) receptive 表示「善於接受的」，(D) delightful 表示「令人愉快的」。","vocab":"raise v. 募集　private adj. 私人的，民間的","paraphrase":""},"116":{"type":"【引導修飾性語句的成分】副詞子句連接詞","translation":"即使只有 2 年經驗，Black 先生還是被任命為 TVD 公司的區域業務主任。","reason":"這個句子已經有具備主詞（Mr. Black）、動詞（was named）、補語（the regional sales director）的完整子句，所以 ~ experience 是修飾性的語句。修飾部分有動詞（had），所以能引導修飾子句的副詞子句連接詞 (A) Even though（即使……）是正確答案。介系詞 (B) As a result of（因為……而造成結果）、(C) In spite of（儘管……）引導的是修飾片語，而不是子句。(D) So as to（為了……）後面要接動詞原形。","vocab":"experience n. 經歷，經驗 v. 經歷　name v. 任命　regional adj. 地區的","paraphrase":""},"117":{"type":"副詞位置","translation":"","reason":"空格修飾後面的過去分詞（charged），所以副詞 (B) accidentally（意外地）是正確答案。形容詞 (A)、名詞 (C) 和 (D) 不能修飾過去分詞。","vocab":"charge v. 收費　refund n. 退款　issue v. 發行，發出","paraphrase":""},"118":{"type":"Manuel 公司的員工現在將獲得人壽保險保障，作為其雇用福利之一。","translation":"Manuel 公司的員工現在將獲得人壽保險保障，作為其雇用福利之一。","reason":"句意是「作為其雇用福利之一」，所以名詞 (B) benefits（福利）是正確答案。(A) skills 表示「技能」，(C) concerns 表示「關切的事」，(D) deductions 表示「扣除額」。","vocab":"life insurance coverage phr. 人壽保險保障　employment n. 雇用","paraphrase":""},"119":{"type":"Jung 小姐得知自己將被調到休士頓辦公室時感到不悅，因為她從未要求調動。","translation":"Jung 小姐得知自己將被調到休士頓辦公室時感到不悅，因為她從未要求調動。","reason":"句意是「因為她從未要求調動」，所以副詞 (D) never（從未）是正確答案。(A) before 表示「之前」，(B) already 表示「已經」，(C) often 表示「經常」。","vocab":"displeased adj. 不悅的　transfer v. 調動","paraphrase":""},"120":{"type":"介系詞","translation":"","reason":"句意是「儘管天氣預報會下雨，本週末的鳳凰城馬拉松仍將按計畫舉行」，所以表示讓步的介系詞 (B) notwithstanding（儘管……）是正確答案。(A) aside from 表示「除了……以外」，(C) regarding 表示「關於……」，(D) according to 表示「根據……」。","vocab":"marathon n. 馬拉松　take place phr. 舉行　forecast n. 預報","paraphrase":""},"121":{"type":"形容詞","translation":"非常歡迎 Shiller 兒童博物館的參觀者和展示品互動。","reason":"句意是「歡迎參觀者和展示品互動」，所以形容詞 (B) welcome（受到歡迎的，被允許的）是正確答案。(A) pleasant（令人愉快的）意思似乎說得通，但它不能表達人的感情，而應該改用 pleased（高興的）來表達才對。(C) obvious 表示「明顯的」。(D) brilliant 表示「傑出的」。","vocab":"interact v. 互動　on display phr. 展示中的","paraphrase":""},"122":{"type":"對等連接詞","translation":"Paulson 電子公司可以用一般郵件或額外收費的快速運送產品。","reason":"介系詞（by）的受詞是 regular mail 和 express delivery 這兩個名詞片語，中間需要用對等連接詞連接，而且要表達「用一般郵件或快速運送產品」，所以對等連接詞 (D) or（或者）是正確答案。(A) so（所以）只能連接兩個子句，而不能連接單字或片語，所以不對。(B) up 表示「往……上」。(C) at 表示「在……」。","vocab":"ship v. 運送　express adj. 快速的，快捷的　involve v. 涉及，需要　charge n. 收費","paraphrase":""},"123":{"type":"類似意義的名詞","translation":"電視廣告播放後，Seaborn Cruises 公司收到大量來自潛在乘客的詢問。 類似意義的名詞","reason":"句意是「收到大量來自潛在乘客的詢問」，所以名詞 (D) volume（量）是正確答案。(A) size（規模，大小）意思似乎說得通，但它是表示事物或現象的大小，而不是數量。(B) result 表示「結果」。(C) majority（多數）似乎意思接近，但它是表示特定群體中的多數，所以不對。","vocab":"commercial n. 廣告 adj. 商業的　air v. 透過廣播、電視等方式播送　inquiry n. 詢問　potential adj. 潛在的，可能的　passenger n. 乘客","paraphrase":""},"124":{"type":"【引導修飾性語句的成分】副詞子句連接詞時間","translation":"","reason":"這個句子已經有具備主詞（The musicians）和動詞（practiced）的完整子句，所以 ~ set up 是修飾性的語句。修飾部分有動詞（was being set up），所以能引導修飾子句的副詞子句連接詞 (B) 和 (D) 是可能的答案。因為要表達「舞台搭建時，樂手們在後面的房間練習」，所以表示時間的副詞子句連接詞 (B) as（當……時）是正確答案。如果使用 (D) unless（除非……），意思會變成「除非舞台正在被搭建，不然樂手們就會在後面的房間練習」，不符合要表達的意思。(A) in order to（為了……）後面要接原形動詞，介系詞 (C) during 不能引導修飾子句。","vocab":"practice v. 練習　back room phr. 後面、後台的房間　set up phr. 設置，搭建","paraphrase":""},"125":{"type":"題意解析","translation":"","reason":"句意是「藉由回收電池，就有可能減少有毒物質總量」，所以 (B) reduce（減少）是正確答案。(A) seize 表示「抓住」，(C) satisfy 表示「滿足」，(D) reserve 表示「預約」。","vocab":"rather than phr. 而不是　discard v. 丟棄　toxic adj. 有毒的　landfill n. 垃圾掩埋場","paraphrase":""},"126":{"type":"數量表達方式","translation":"","reason":"能夠修飾空格後面複數可數名詞（two weeks）的數量詞 (A)、(B)、(C) 是可能的答案。因為要表達「服務生每 2 週領一次薪水，時薪 9 元」，所以數量詞 (C) every（每……）是正確答案。另外，請記得 every 表示「全體」的意思時，後面要接單數可數名詞。(A) most（大部分的）、(B) all（全部的）用在這裡會變成「大部分的／全部的 2 週」，不符合要表達的意思。限定詞 (D) either 表示兩個之中的任何一個，後面必須接單數名詞，也會搭配 or 以相關連接詞 either A or B（不是 A 就是 B）的形式使用。","vocab":"","paraphrase":""},"127":{"type":"【引導修飾性語句的成分】現在分詞 vs. 過去分詞","translation":"","reason":"這個句子已經有具備主詞（Novels）、動詞（are）和補語（popular）的完整子句，所以 ~ events 是修飾性的語句。修飾部分修飾空格前面的名詞（Novels），所以能引導修飾性語句，同時在名詞後面做修飾的過去分詞 (A) 和現在分詞 (D) 是可能的答案。因為被修飾的名詞（Novels）和分詞之間是「小說被建立在事實的基礎上」的被動關係，所以動詞 base（把……建立在某個基礎上）的過去分詞 (A) based 是正確答案。如果使用現在分詞 (D)，意思會變成「在進行建立基礎這個行為的小說」，所以不對。動詞 (B)、動詞或名詞 (C) 不能在名詞後面做修飾。","vocab":"popular adj. 受歡迎的　age group phr. 年齡層","paraphrase":""},"128":{"type":"【形容詞】","translation":"","reason":"句意是「在被設計得盡可能全面的訓練課程中，這份工作的所有方面都會被介紹到」，所以形容詞 (C) comprehensive（全面的）是正確答案。(A) decorative 表示「裝飾的」。(B) protective 表示「保護的」。(D) tentative 表示「暫定的，試驗性的」。","vocab":"aspect n. 方面　cover v. 涵蓋，包括　training course phr. 訓練課程","paraphrase":""},"129":{"type":"【名詞位置】可數名詞與不可數名詞","translation":"為了討論供給短缺的可能解決方法，總統會見了國內幾個最大的製造業者。","reason":"空格前面的形容詞可以修飾名詞，所以名詞 (A)、(C)、(D) 是可能的答案。因為空格前面有表達數量的 several of the，所以複數可數名詞 (D) manufacturers（製造業者們）是正確答案。(A) manufacturer（製造業者）是單數可數名詞，而 (C) manufacture 是不可數名詞，所以不對。另外，(C) 如果表示「產品」的話，是可數名詞，而會有複數形。動詞或過去分詞 (B) 不能被形容詞修飾。","vocab":"president n. 總統，總裁　shortage n. 短缺","paraphrase":""},"130":{"type":"未正確提交納稅申報單，可能會收到國稅局的修正要求。","translation":"未正確提交納稅申報單，可能會收到國稅局的修正要求。","reason":"句意是「沒有正確提交納稅申報單」，所以 (D) properly（適當地，正確地）是正確答案。(B) moderately（適度地）似乎意思相近，但實際上是用來表達程度不過度、數量適中而不過多的意思。(A) nearly 表示「幾乎」，(C) narrowly 表示「勉強地，差一點地」。","vocab":"file v. 提交　tax form phr. 納稅申報單　amendment n. 修正","paraphrase":""},"131":{"type":"選出適當的句子","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的內容提到會議的主要討論主題是明年的部門預算，而上一句 This is a subject of vital importance. 這是非常重要的主題，所以空格的內容應該和會議討論主題的重要性有關，(D) Therefore, the company's CEO will join us 是正確答案。(A) 雖然也和會議要討論的預算有關，但因為是要討論明年的預算，所以應該不會是已經決定了，而不能選這個答案。","vocab":"recognized adj. 公認的　expert n. 專家　temporary adj. 暫時的　setback n. 挫折","paraphrase":""},"132":{"type":"主動態與被動態的區分","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"動詞 need 後面可以接 to 不定詞當受詞，所以能和空格前的 to 組成 to 不定詞的動詞原形 (A)、包含動詞原形的 (C) 和 (D) 是可能的答案。另外，請注意 need 所在的 that 子句（that ~ budget）是由主格關係代名詞 that 引導的關係子句，修飾先行詞（changes）。因為空格後面沒有受詞，而且要表達「需要被做出的改變」，所以被動態 (C) be made 是正確答案。主動態 (A) 和 (D) 後面必須要有受詞，而且意思會變成「變化做～／變化正在做～」的意思，所以不對。過去式動詞或過去分詞 (B) 不能形成 to 不定詞。","vocab":"","paraphrase":""},"133":{"type":"名詞位置","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"空格被前面的形容詞（unnecessary）修飾，所以名詞 (D) expenses（花費）是正確答案。過去式動詞或過去分詞 (A)、動詞 (B)、形容詞 (C) 不能用在名詞的位置。","vocab":"expend v. 花費　expensive adj. 貴的","paraphrase":""},"134":{"type":"動詞詞彙 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「確認收到備忘錄」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，只要跟助理 Hertz 小姐確認出席就可以了，由此可知寄件者希望收件者通知 Hertz 小姐並確認出席，(D) acknowledge（確認收到）是正確答案。(A) explain 表示「說明」，(B) confide 表示「吐露（秘密）」，(C) remember 表示「記得」。\n\n135-138 題參照以下評論。\n\nThe first time I went to True Colors Paint Supply, I received 135 customer service. Unfortunately, my second experience with them was not nearly as good. Yesterday when I went in, there were no employees at the front of the store. After ten minutes of looking at color samples, an employee finally approached me. However, she excused herself almost immediately in order to go answer the phone. 136 If that weren't bad enough, someone else made a mistake on my order when I finally got some help. I 137 for Candy Apple Red but was given Scarlet Red instead. Next time, I will shop at another store that 138 more attention to its customers.\n\n135 我第一次到 True Colors 油漆用品店時，得到了優秀的顧客服務。遺憾的是，我在那裡的第二次經驗遠不如上次那麼好。昨天我進去的時候，店裡的櫃台沒有任何員工。我看了 10 分鐘的色票之後，終於有一名員工走近我。不過，她幾乎是馬上就說要接電話而離開了。136 說實話，看到這麼不專業的行為，讓我感到很震驚。更糟的是，在我終於得到幫助的時候，另一個人在我的訂單方面犯了錯。137 我要求了 Candy Apple Red，卻得到了 Scarlet Red。138 下一次，我會在比較關心顧客的店購物。","vocab":"","paraphrase":""},"135":{"type":"形容詞詞彙 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「得到了優秀的顧客服務」，所以 (B) excellent（優秀的）是正確答案。(A) questionable 表示「有問題的」，(C) deficient 表示「缺乏的」，(D) gradual 表示「逐漸的」。","vocab":"customer service phr. 顧客服務　not nearly phr. 一點也不……　approach v. 接近　excuse oneself phr. 請求准予離開　immediately adv. 馬上，立即　mistake n. 錯誤，失誤　attention n. 注意","paraphrase":""},"136":{"type":"選出適當的句子","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的部分提到進去的時候，店裡的櫃台沒有任何員工，等了 10 分鐘才有人走近，而空格的上一句 However, she excused herself almost immediately in order to go answer the phone. 說那個人幾乎是馬上就說要接電話而離開了，所以空格的內容應該和顧客遇到這種情況的反應有關，(C) Honestly, I was shocked to witness such unprofessional behavior 是正確答案。","vocab":"importantly adv. 重要地　loyal adj. 忠實的　witness v. 目擊，見證 n. 目擊者，見證人　various adj. 各種的，多樣的","paraphrase":""},"137":{"type":"過去完成式","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"主要子句（I ~ Candy Apple Red）發生的事「顧客要求 Candy Apple Red」，發生的時間比 but 引導的子句（but ~ instead）「得到 Scarlet Red」來得早。注意 but 引導的子句（but ~ instead）省略了重複的主詞（I）。因為 but 子句是過去式（was given），所以表示過去特定時間點之前曾經發生什麼的過去完成式 (C) had asked 是正確答案。過去式 (A)、現在進行式 (B)、未來式 (D) 不能表示過去特定時間點之前發生的事。","vocab":"","paraphrase":""},"138":{"type":"慣用的詞彙搭配","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「在比較關心顧客的店購物」，所以能和空格後面的 attention to 構成 pay attention to「關注……」的動詞 pay（付出）的第三人稱單數形 (A) pays 是正確答案。如果使用 (D) 的 draw（引起「注意」），意思會變成「去引起顧客關注的店購物」，不符合文章要表達的意思。而且，draw 的表達方式應該是 draw attention from（引起……的關注）才對。(B) consider 表示「考慮」，(C) understand 表示「理解」。\n\n139-142 題參照以下電子郵件。\n\nTo: Julie Evans julie@juliepaints.com\nFrom: David Whetzel director@artunlimited.com\nSubject: Art class\nDate: February 12\n\nDear Ms. Evans,\n\nI recently saw your work at Wave Gallery and wanted to tell you that I was very impressed by your unique style. 139 I'm writing today as I run a small art studio 140 painting classes several times a week. We occasionally invite artists who can teach our students something other than basic oil or acrylic painting techniques, and I was wondering whether you would be interested in being our next guest instructor. You would have a lot of 141 in planning the class. As the teacher, you alone would decide on the materials to use and the concepts to teach.\n\nI look forward to hearing from you. This e-mail address is the best way to contact me 142 you are interested.\n\nSincerely,\nDavid Whetzel\nDirector of Art Unlimited\n\n收件者：Julie Evans julie@juliepaints.com\n寄件者：David Whetzel director@artunlimited.com\n主旨：藝術課\n日期：2 月 12 日\n\n親愛的 Evans 小姐：\n\n我最近在 Wave 藝廊看到您的作品，想要告訴您，我對您獨特的風格印象深刻。139 我從來沒看過跟您的作品一樣的畫。140 我今天之所以寫信，是因為我經營一個每週舉辦幾次繪畫課的小型藝術工作室。我們偶爾會邀請可以教學生在基礎油畫或壓克力顏料畫技法以外的東西的藝術家，而我想知道您是否有興趣擔任我們下一位客座講師。141 您在規劃課程方面會有許多彈性。身為老師，您會獨自決定要使用的材料，以及要教的概念。\n\n期待您的回覆。142 要是您有興趣的話，這個電子郵件位址是聯絡我的最佳方式。\n\nDavid Whetzel\nArt Unlimited 總監","vocab":"","paraphrase":""},"139":{"type":"選出適當的句子","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 I recently saw your work at Wave Gallery and wanted to tell you that I was very impressed by your unique style. 提到，「我」（Whetzel 先生）最近在 Wave 藝廊看到 Evans 小姐的作品，想要表達自己對她獨特的風格印象深刻，所以空格的內容應該和看到作品的感想有關，(D) I've never seen paintings that look quite like yours 是正確答案。","vocab":"","paraphrase":""},"140":{"type":"【引導修飾性語句的成分】關係代名詞的位置與用法","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"as 開頭的從屬子句（as ~ week），是具備主詞（I）、動詞（run）和受詞（a small art studio）的完整子句，所以 ~ week 是修飾性的語句。修飾部分是修飾空格前面的名詞（art studio），所以包含可修飾名詞的主格關係代名詞與關係子句動詞的 (B)、包含現在分詞的 (D) 是可能的答案。因為要表達「每週舉辦幾次繪畫課的小型藝術工作室」，所以能夠引導以 art studio 為先行詞的關係子句，而且包括在關係子句中擔任主詞的主格關係代名詞、關係子句中的動詞的 (B) that holds 是正確答案。包含現在分詞的 (D) 是被動態，所以後面不能接受詞（painting classes）。動詞 (A) 和 (C) 不能在名詞後面做修飾。","vocab":"","paraphrase":""},"141":{"type":"名詞詞彙 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「您在規劃課程方面有許多＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到身為老師，「您」（Evans 小姐）會獨自決定要使用的材料，以及要教的概念，所以名詞 (A) flexibility（彈性）是正確答案。(B) assistance 表示「協助」，(C) restriction 表示「限制」，(D) demonstration 表示「示範操作」。","vocab":"","paraphrase":""},"142":{"type":"【引導修飾性語句的成分】副詞子句連接詞條件","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這個句子已經有具備主詞（This e-mail address）、動詞（is）和補語（the best way）的完整子句，所以 ~ interested 是修飾性的語句。修飾部分有動詞（are interested），所以需要填入能引導修飾子句的成分，而所有選項都是副詞子句連接詞，也都是可能的答案。因為要表達「要是您有興趣的話，這個電子郵件位址是聯絡我的最佳方式」，所以表示條件的副詞子句連接詞 (D) in case（假使……）是正確答案。(A) before 表示時間「在……之前」，(B) so that 表示目的「以便……」，(C) because 表示理由「因為……」。\n\n143-146 題參照以下通知。\n\nATTENTION EMPLOYEES:\n\nThe Sebastian Hill Hotel is going to be closed 143 the month of June. The building is in need of some renovations that cannot be completed while guests are here.\n\nSince June is the start of our busiest period, there are enough temporary job openings for everyone at our partner locations. Therefore, all Sebastian Hill staff members 144 their work at either the Daytona Hotel or the New Orleans resort after their final day here, on May 31.\n\nShould you have a preference for which hotel you would like to work at, please tell Jim Stevens, the branch manager, before the end of this week. He cannot promise to fulfill any 145, but will consider them carefully. 146\n\n員工請注意：\n\nSebastian Hill 飯店整個 6 月都將關閉。這棟建築物需要一些整修，這些整修無法在住客在場時完成。\n\n由於 6 月是我們最繁忙時期的開始，所以在我們的合作據點有足夠的臨時職缺可以提供給各位。144 所以，Sebastian Hill 的所有員工在這裡的最後一天（5 月 31 日）之後，將在 Daytona 飯店或 New Orleans 度假村開始工作。\n\n要是你對於想在哪間飯店工作有偏好，請在本週結束之前告訴分公司經理 Jim Stevens。145 他不能保證滿足任何要求，但會謹慎考慮。146 臨時工作地點將在 5 月 20 日前全部決定。","vocab":"","paraphrase":""},"143":{"type":"【引導修飾性語句的成分】介系詞選擇 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這個句子已經有具備主詞（The Sebastian Hill Hotel）和動詞（is going to be closed）的完整子句，所以 ~ June 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。後面的部分提到，由於 6 月是最繁忙時期的開始，所以在合作據點有足夠的臨時職缺可以提供，由此可知這間飯店應該是在 6 月暫時關閉，所以表示期間的 (C) throughout（在……的整個期間）是正確答案。(A) except for 表示例外「除了……」。(D) following 表示「在……之後」，雖然本身的意義是合理的，但用在這裡表示「飯店 6 月後關閉，而會請合作據點在 6 月提供臨時職缺」，不合邏輯。副詞子句連接詞 (B) as long as（只要……）引導修飾子句而不是片語。","vocab":"renovation n. 翻修　seasonal adj. 季節性的，季節的　job opening phr. 職缺　preference n. 偏好　branch n. 分公司，分店　fulfill v. 滿足，履行　consider v. 考慮","paraphrase":""},"144":{"type":"未來式 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「Sebastian Hill 的所有員工在 5 月 31 日之後開始工作」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到 6 月是最繁忙時期的開始，所以在合作據點有足夠的臨時職缺可以提供，而下 urrently developing a drug that may help rid people of insomnia. During the study, all you have to do is take it at a regular time every night for two weeks.，這部分「我們」（Carson 醫學研究所）目前正在開發可能幫助人們擺脫失眠的藥物。在研究期間，「您」（參加研究的人）只需要在 2 週之中每晚定時服用藥物，所以 (B) 是正確答案。","vocab":"","paraphrase":""},"150":{"type":"同義詞","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"regular 所在的語句 all you have to do is take it at a regular time every night for two weeks 之中，regular 表示「固定」的意思，所以同樣能表示「固定」的 (A) 是正確答案。","vocab":"","paraphrase":""},"151":{"type":"wh-問題 What","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問人們應該在電子郵件中說明什麼（What）的 wh- 問題。和題目的關鍵詞語 specify in the e-mail 有關的部分是 In the e-mail, please specify any medical problems you have that may interfere with the drug. Please also list your work schedule and other obligations.。這部分要求在電子郵件中說明自身可能妨礙藥物（作用）的醫療方面問題，並且列出工作時間安排與其他義務，所以 (C) 是正確答案。\n變換表達方式\nwork schedule and other obligations 工作時間安排與其他義務 → time commitments 時間上的義務","vocab":"familiarity n. 熟悉　treatment n. 治療，處理　method n. 方法　commitment n. 承擔的義務","paraphrase":""},"152":{"type":"推論 細節資訊","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是和題目關鍵詞語 Ms. Kovac 有關的推論問題。Kathleen Massee 在 it seems that I'm supposed to work Monday morning, which is strange. I don't usually get morning shifts. 的部分提到，自己星期一上午似乎要工作，這件事很奇怪，因為她早上通常沒排班，而 Evan Rosenblatt 回應 I guess Ms. Ross needs someone to replace Ms. Kovac while she's away on vacation. 猜測是 Ross 小姐需要有人在 Kovac 小姐休假時代替她，由此可知 Kovac 小姐應該是值早班，所以 (C) 是正確答案。","vocab":"","paraphrase":""},"153":{"type":"掌握意圖","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這一題問的是 Rosenblatt 先生的訊息所表達的意圖，所以要掌握引用部分（Not a problem at all）前後文的情境。Kathleen Massee 說 I was wondering if you'd be able to take that shift for me because I made a dentist appointment for that day，想知道「你」（Rosenblatt 先生）能不能代替值班，因為她那天預約了看牙醫，而 Rosenblatt 先生回應 Not a problem at all.（完全沒問題），表示他願意值 Kathleen Massee 的班，所以 (A) 是正確答案。","vocab":"colleague n. 同事　expense n. 費用，花費　procedure n. 過程，程序　conflict n. 衝突","paraphrase":""},"154":{"type"  Furthermore, our vehicles are maintained regularly to ensure they are always functioning properly at the time of departure.\n\nWe also pride ourselves on comfort and convenience. — [2] —. Along with having plenty of legroom, each of the reclining seats in our vehicles is fitted with electrical sockets for your devices as well as adjustable air conditioning vents. Free wireless Internet is also available. You can also bring small meals or snacks with you or schedule a stop at a popular restaurant. — [3] —.\n\nFinally, our buses can seat up to 56 people, meaning that using our service is a cost-effective way to travel as a group. — [4] —.\n\nIf DPQ Transport is the right choice for you, send the details of your trip to queries@dpqtransport.com. We'll respond with a competitive quote and a proposed itinerary within 24 hours.\n\nwww.dpqtransport.com/aboutus\n\n關於我們：\n\nDPQ 交通公司是在全國每週 7 天、每天 24 小時提供服務的包租巴士公司。不管您是為了觀光還是公司靜修而需要載送團體，我們保證利用我們來旅行是正確的選擇。\n\n安全是我們的第一優先。所以，我們的司機訓練有素，具備多年駕駛經驗。— [1] —。此外，我們的車輛接受定期保養，以確保在出發時總是運作正常。\n\n我們也以舒適度與便利性自豪。— [2] —。除了有充足的腿部空間以外，我們車輛的每個可傾斜座椅都配備讓您的設備使用的電源插座，以及可調整的冷氣出風口。車上也提供免費無線網路。您也可以攜帶簡單的餐點或零食，或者安排在受歡迎的餐廳中途停車。— [3] —。\n\n最後，我們的巴士最多可以坐 56 個人，這意味著使用我們的服務是成本效益高的團體旅行方式。— [4] —。\n\n如果 DPQ 交通是適合您的選擇，請將您旅行的細節寄到 queries@dpqtransport.com。我們會在 24 小時以內回覆有競爭力的報價和旅程提案。","vocab":"charter bus phr. 包租巴士　nationwide adv. 在全國 adj. 全國的　retreat n. （公司的）靜修度假活動　guarantee v. 保障　priority n. 優先　accordingly adv. 因此　behind the wheel phr. 開著車　pride oneself on phr. 以……自豪　legroom n. 腿部可以伸展的空間　recline v. （椅背）往後傾斜（好讓人坐起來更舒適）　socket n. 插座　adjustable adj. 可調整的　vent n. 通風口　cost-effective adj. 有成本效益的　competitive adj. （價格）有競爭力的　quote n. 報價　itinerary n. 旅行行程","paraphrase":""},"165":{"type":"Not/True True 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 DPQ Transport 有關的內容，並且對照選項判斷答案。(A) 在 DPQ Transport is a charter bus rental company that provides service nationwide ~ 的部分提到，DPQ 交通公司是在全國提供服務的包租巴士公司，而不是提供國際服務，不符合選項敘述。(B) 在 Whether you need to transport a group for a tour or a business retreat, we guarantee that traveling with us is the right choice. 的部分提到，不管是為了觀光還是公司靜修而需要載送團體，都保證利用「我們」（DPQ 交通公司）來旅行是正確的選擇，而不是只為觀光團體服務，不符合選項敘述。(C) 在文章裡沒有提到。(D) 在 DPQ Transport ~ provides service ~ 24 hours a day. 的部分提到，DPQ 交通公司提供每天 24 小時服務，符合選項敘述，所以 (D) 是正確答案。\n變換表達方式\nprovides service ~ 24 hours a day 提供每天 24 小時服務 → operates at all hours of the day 一整天營運","vocab":"exclusively adv. 獨佔地　cater to phr. 為……服務，迎合……　launch v. 開始，發動　express adj. 快遞的，快捷的","paraphrase":""},"166":{"type":"Not/True Not 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 DPQ Transport vehicle seats 有關的內容，並且對照選項判斷答案。(A) 在 having plenty of legroom 的部分提到有充足的腿部空間，符合選項敘述。(B) 和 (D) 在 each of the ~ seats in our vehicles is fitted with electrical sockets for your devices as well as adjustable air conditioning vents 的部分提到，車輛的每個可傾斜座椅都配備讓設備使用的電源插座，以及可調整的冷氣出風口，符合選項敘述。(C) 在文章裡沒有提到，所以 (C) 是正確答案。\n變換表達方式\nplenty of legroom 充足的腿部空間 → spacious 寬敞的\nelectrical sockets 電源插座 → outlets 插座\nadjustable air conditioning vents 可調整的冷氣出風口 → a temperature control feature 溫度控制功能","vocab":"spacious adj. 寬敞的　outlet n. 插座　built-in adj. 內建的","paraphrase":""},"167":{"type":"wh-問題 What","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問根據網頁，人們可以透過電子郵件做什麼（What）的 wh- 問題。和題目的關鍵詞語 people do through e-mail 有關的部分是 send the details of your trip to queries@dpqtransport.com. We'll respond with a competitive quote，這部分請讀者將旅行的細節寄到 queries@dpqtransport.com，而 DPQ 交通公司會回覆有競爭力的報價，所以 (B) 是正確答案。\n變換表達方式\nquote 報價 → cost estimate 費用估計","vocab":"specific adj. 特定的　cost estimate phr. 費用估計，估價　customize v. 訂製，客製化","paraphrase":""},"168":{"type":"選擇句子位置","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「他們在受雇後會經過徹底審查，並且必須通過每年的評價」，所以應該會出現在和受雇員工資格與能力有關的部分。[1] 的上一句 our drivers are highly trained individuals with many years of experience behind the wheel 提到「我們」（DPQ 交通公司）的司機訓練有素，具備多年駕駛經驗。將句子填入 [1] 的位置之後，可以表達「司機訓練有素、具備多年駕駛經驗，而且受雇後會經過徹底審查，並且必須通過每年的評價」，文意通順，所以 (A) 是正確答案。","vocab":"thoroughly adv. 徹底地　screen v. 篩選，審查","paraphrase":""},"169":{"type":"Not/True Not 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 a concern about the tower 有關的內容，並且對照選項判斷答案。(A) 在文章裡沒有提到，所以 (A) 是正確答案。(B) 和 (C) 在 Others voiced fears that its presence might cause various health ~ issues for those who live near the site, not to mention lower property values. 的部分提到其他人的擔憂，是它的存在可能對住在附近的人造成多種健康問題，以及降低房地產價值，符合選項敘述。(D) 在 Many said the tower would spoil the area's natural beauty. 的部分提到，許多人說基地台會破壞這個地區的自然美景，符合選項敘述。","vocab":"wildlife n. 野生生物　pose v. 造成　real estate phr. 不動產　unattractive adj. 不吸引人的","paraphrase":""},"170":{"type":"推論 細節資訊","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是和題目關鍵詞語 Farview 有關的推論問題。city officials reassured the public that the tower will ~ generate substantial rental revenue in the amount of approximately $20,000 per year 的部分提到，市府官員再次向大眾保證，基地台每年將產生總計大約 20,000 元的高額租金收入，由此可以推知 Farview 市將透過新的建築物賺錢，所以 (D) 是正確答案。\n變換表達方式\ngenerate ~ revenue 產生收入 → earn money 賺錢","vocab":"tourism n. 觀光業　rental fee phr. 租賃費用　usage n. 使用","paraphrase":""},"171":{"type":"選擇句子位置","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「這意味著會有更多的手機服務需求」，所以應該會出現在和需要手機服務有關的部分。[4] 的上一句 The more visitors we have, the more phones there are 提到有越多來客，就會有越多手機。將句子填入 [4] 的位置之後，可以表達「有越多來客，就會有越多手機，這也意味著會有更多的手機服務需求」，文意通順，所以 (D) 是正確答案。\n\n172-175 題參照以下線上聊天。\n\nBryce Turner [2:30 P.M.]\nDid you hear that our company's shareholders want us to cut down on waste? I think it's important for us to respect their wishes, so I'd like to find some ways to reduce the amount of non-recyclable packaging materials we use here at Meerson.\n\nSophie Moore [2:31 P.M.]\nWe recently lessened the amount of plastic foam we put inside boxes by 40 percent. Is there anything else we can do?\n\nBryce Turner [2:34 P.M.]\nCould we eliminate the foam completely and start using shredded newspaper instead?\n\nRandy Poehler [2:35 P.M.]\nAnd only our fragile items need the extra padding. Our detergents, for instance, come in plastic bottles, so they don't need any special protection.\n\nRandy Poehler [2:36 P.M.]\nInstead of focusing only on the shipping materials, what if we also changed some of our product containers?\n\nBryce Turner [2:38 P.M.]\nAre you proposing we use some other type of material for our containers? I don't see how that would be any better.\n\nRandy Poehler [2:39 P.M.]\nNo. I'm just saying that we could use plastic more efficiently. Some of our competitors sell detergents in pouches that can be used to refill empty bottles. They're using plastic but far less of it. We could do the same.\n\nBryce Turner [2:41 P.M.]\nThat would actually save us money, too.\n\nSophie Moore [2:42 P.M.]\nI'll look into whether we can make that change.\n\nBryce Turner [下午2:30]\n你們聽說了嗎？我們公司的股東希望我們減少廢棄物嗎？我認為我們尊重他們的期望是很重要的，所以我想找到一些在 Meerson 公司這裡減少不可回收包裝材料使用量的方法。\n\nSophie Moore [下午2:31]\n我們最近減少了 40% 放在箱子裡的發泡塑膠（保麗龍）用量。還有什麼我們能做的嗎？\n\nBryce Turner [下午2:34]\n我們有可能完全不用發泡塑膠，並且開始改用碎報紙嗎？\n\nRandy Poehler [下午2:35]\n而且只有我們的易碎物品需要額外填充。例如我們的洗潔劑裝在塑膠瓶裡，所以不需要任何特別保護。\n\nRandy Poehler [下午2:36]\n與其只著重於運送材料，不如我們也更換一些產品容器如何？\n\nBryce Turner [下午2:38]\n你是提議我們使用其他種類的容器材料嗎？我不知道還有什麼更好的材料。\n\nRandy Poehler [下午2:39]\n不是。我只是說我們可以更有效率地使用塑膠。有些競爭業者販賣可以用來填充空瓶的袋裝洗潔劑。他們使用塑膠，但用量少很多。我們可以做同樣的事。\n\nBryce Turner [下午2:41]\n這樣實際上也會幫我們省錢。\n\nSophie Moore [下午2:42]\n我會研究我們是否能這樣改變。","vocab":"shareholder n. 股東　cut down on phr. 削減……　packaging n. 包裝　lessen v. 減少　plastic foam phr. 發泡塑膠（保麗龍）　eliminate v. 排除，消除　shred v. 切碎　fragile adj. 易碎的，脆弱的　padding n. 墊充，填料　detergent n. 洗潔劑　container n. 容器　efficiently adv. 有效率地　competitor n. 競爭者，競爭業者","paraphrase":""},"172":{"type":"wh-問題 What","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問 Turner 先生想減少什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Turner want to reduce 有關的部分是 Bryce Turner 所說的 I'd like to find some ways to reduce the amount of non-recyclable packaging materials we use，他設想要找到一些減少不可回收包裝材料量的方法，所以 (B) 是正確答案。","vocab":"distribution network phr. 流通網絡","paraphrase":""}," land 先生將負責員工訓練，以維持高品質的服務，符合選項敘述。(D) 在文章中沒有提到，所以 (D) 是正確答案。\n變換表達方式\nbe in charge of our reservation ~ systems 負責預約系統 → Managing a booking system 管理預訂系統\ncoordinate ~ fun pursuits 安排有趣的休閒活動 → Organizing leisure activities 安排休閒活動","vocab":"handle v. 處理　facility n. 設施","paraphrase":""},"178":{"type":"推論 多篇文章對照題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是需要對照兩篇文章內容的推論題型，先看介紹題目關鍵詞語 Mr. Sunderland 的公告。\n線索1：公告（第一篇文章）中，he has served as the front office manager at our island location 的部分提到，Sunderland 先生之前在「我們」（Gold Frond 度假村）的島嶼據點擔任客務部經理，但沒有寫出那個據點的名稱，所以還需要參考廣告的內容。\n線索2：廣告（第二篇文章）中，Vergual Paradise、occupies an entire island 的部分顯示 Vergual Paradise 佔據整座島。\n綜合這兩個線索，可知 Sunderland 先生之前受雇於 Vergual Paradise，所以 (C) 是正確答案。","vocab":"career n. 職業生涯　employ v. 雇用，使用　graduate v. 畢業","paraphrase":""},"179":{"type":"Not/True True 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Gold Frond Resorts 有關的內容，所以要看介紹 Gold Frond 度假村的廣告（第一篇文章）。(A) 在 Our original property; recently expanded to 315 rooms 的部分提到，Gold Frond 最初的據點最近擴建至 315 間客房，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章中沒有提到。\n變換表達方式\nexpanded to 315 rooms 擴建至 315 間客房 → increased its capacity 增加容納空間","vocab":"capacity n. 容量，容納的能力　establish v. 建立，設立","paraphrase":""},"180":{"type":"wh-問題 How","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問人們可以怎樣（How）獲得度假村活動資訊的 wh- 問題，所以要從和題目的關鍵詞語 people get information on resort activities 有關的廣告（第二篇文章）找出相關的內容。廣告中的 You can find information on activities available at each resort at www.goldfrondresorts.com 提到可以在網站找到每座度假村可提供活動的資訊，所以 (A) 是正確答案。","vocab":"travel agent phr. 旅行社代辦人員","paraphrase":""},"181":{"type":"推論 細節資訊","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是要找出和題目關鍵詞語 the Spin Genie 400 相關內容的推論問題，所以要看提到 Spin Genie 400 的第一封電子郵件。I recently bought your company's Spin Genie 400 ~ and took it to a local bike shop for assembly 的部分提到，最近買了 FrameCaster Cycles 公司的 Spin Genie 400，並且把它帶到本地的腳踏車店組裝，由此可以推知可以購買未組裝的 Spin Genie 400 並自行組裝，所以 (A) 是正確答案。","vocab":"be made of phr. 以……製成　lightweig ur new software program,” Cathy Sanchez said while showing me the plan for the project. 提到，在讓記者看專案的計畫時，Cathy Sanchez 說他們目前在設計新軟體程式的最後階段。不過，這裡沒有具體說明 Sanchez 小姐是什麼人，所以還需要參考備忘錄中的相關內容。\n線索2：備忘錄（第一篇文章）中的 One of our senior executives will ~ introduce our latest software development plan to her. 提到，一位資深主管將會向記者簡單介紹最近的軟體開發專案。\n綜合這兩個線索，可知 Sanchez 小姐是向記者介紹最近軟體開發專案的資深主管，所以 (D) 是正確答案。","vocab":"","paraphrase":""},"189":{"type":"wh-問題 What","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問根據文章（第三篇文章），Zazoo 軟體公司工作環境的一項好處是什麼（What）的 wh- 問題。文章中的 All these facilities help employees perform at high levels of efficiency, and I could see that this was true during my time at the office. 提到，這些設施全都能幫助員工有高效率的表現，而在參觀辦公室的時候，可以看到這一點是真的，所以 (C) 是正確答案。\n變換表達方式\nhelp employees perform at high levels of efficiency 幫助員工有高效率的表現 → improves the performance of staff 改善員工的表現","vocab":"cooperation n. 合作　injury n. 受傷","paraphrase":""},"190":{"type":"Not/True Not 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 facility ~ opened at the Zazoo Software's newest office 有關的內容，並且對照選項判斷答案，所以看介紹 Zazoo 軟體公司最新辦公室設施的文章（第三篇文章）。(A) 在 plans call for the addition of a yoga ~ studio by the end of the year 的部分提到，計畫在年底前增設瑜伽與冥想工作室，表示還沒開放，所以 (A) 是正確答案。(B) 在 Free food is available for employees in every cafeteria 的部分提到，每間內部餐廳都為員工提供免費食物，表示已經開放員工餐廳。(C) 和 (D) 在 In terms of exercise facilities, there is ~ pool, and gym 的部分提到，運動設施方面有游泳池和健身房，符合選項內容。\n\n191-195 題參照以下便條、表單與帳單。\n\nFrom the desk of Rosa Mengistu\n\nHello, Mr. Fekade. I'm sorry you were unable to attend today's planning meeting. One thing we decided was that we require a photo of Dire Dawa Central Park. The photo needs to show people relaxing near the fountain during the daytime. It is up to you to find such an image, and keep in mind that it needs to be in high resolution. Please check our photo archive, as we may already have one that meets this description. Otherwise, you can search the collection of a photo agency such as Flash Photos or Baumg function saveCsv(rows,name){const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

 for(const q of QS){const r=records[q.id];if(r?.correct!==false)continue;const d=DETAILED_EXPLANATIONS[q.id];const c=r.choice;
 rows.push([q.id,q.part,q.stem||'篇章填空',c,q.choices['ABCD'.indexOf(c)],q.answer,q.choices['ABCD'.indexOf(q.answer)],d?.translation||'',d?[d.type,d.reason,d.paraphrase,d.vocab].filter(Boolean).join('；'):q.explanation,stars[q.id]?'是':'否',r.at||'']);}

function csvCell(x){const t=String(x??'');return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function parseCsv(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quotes=false;for(let i=0;i<text.length;i++){let c=text[i];if(quotes){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quotes=false;else field+=c}else if(c==='"')quotes=true;else if(c===','){row.push(field);field=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(quotes)throw Error('CSV 引號未關閉');row.push(field);if(row.some(x=>x!==''))rows.push(row);return rows}
$('#export').onclick=()=>{const rows=[CSV_HEADER];for(const q of QS){const r=records[q.id];if(!r)continue;rows.push([q.id,q.part,r.choice,q.answer,r.correct===true?'正確':r.correct===false?'錯誤':'未核定',r.at||''])}const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toeic-作答紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#importCsv').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCsv(await file.text());if(!rows.length||rows[0].slice(0,6).join('|')!==CSV_HEADER.join('|'))throw Error('欄位格式不符，請使用本網站匯出的 CSV');const incoming={};for(let i=1;i<rows.length;i++){const r=rows[i],id=Number(r[0]),q=QS.find(x=>x.id===id),choice=(r[2]||'').trim();if(r.length<6||!q||!/[A-D]/.test(choice)||choice.length!==1||String(q.part)!==r[1].trim())throw Error('第 '+(i+1)+' 列的題號、Part 或選項有誤');if(r[3].trim()!==q.answer)throw Error('第 '+(i+1)+' 列答案版本不同，已停止匯入');incoming[id]={choice,correct:q.answer?choice===q.answer:null,at:r[5]||''}}const count=Object.keys(incoming).length;if(!confirm('CSV 有 '+count+' 筆有效作答紀錄。匯入後會覆蓋相同題號的現有作答，其餘題目保留。是否繼續？'))return;await window.toeicCloud.importAnswers(incoming);mode='all';index=0;setTabs();render();alert('已成功匯入 '+count+' 筆紀錄。')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};render();

<script>
/* Browser-offline fallback: Firebase is optional, local practice always works. */
(function(){
  if(window.toeicCloud) return;
  function persist(){
    localStorage.setItem(LOCAL_KEY,JSON.stringify(records));
    localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));
    localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts));
  }
  window.toeicCloud={ready:true,mode:'local',
    saveAnswer:async(id,data)=>{records[id]=data;persist();render()},
    deleteAnswer:async(id)=>{delete records[id];persist();render()},
    setStar:async(id,marked)=>{if(marked)stars[id]=true;else delete stars[id];persist();render()},
    saveExcerpts:async(id,items)=>{if(items.length)excerpts[id]=items;else delete excerpts[id];persist();render()},
    importAnswers:async(items)=>{records={...records,...items};persist();render()},
    resetAnswers:async()=>{records={};persist();render()}
  };
})();
</script>
