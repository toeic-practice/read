on":"居民預期，規劃中的新市立圖書館興建工程將於一個月後動工。","reason":"能修飾空格後面名詞（construction project）的是形容詞，所以能充當形容詞的過去分詞 (B) 和現在分詞 (C) 是可能的答案。因為被修飾的名詞（construction project）和分詞要表示被動關係「被提出的建設計畫」，所以動詞 propose（提議）的過去分詞 (B) proposed 是正確答案。如果使用現在分詞 (C) proposing 的話，則是主動的意思「進行提議的建設計畫」，所以不對。名詞 (A) 和動詞 (D) 不能修飾名詞。","paraphrase":"","vocab":""},"127":{"type":"考點解析","translation":"Andrea Griffin 博士因鑑定出一種新的南美洲蝴蝶物種，而獲頒科學成就獎。","reason":"句意是「因為鑑定出一種新的南美洲蝴蝶物種，而獲得了科學成就獎」，所以名詞 (D) identification（鑑定，識別）是正確答案。(A) translation 表示「翻譯」、(B) acceptance 表示「接受」、(C) dedication 表示「奉獻，致力」。","paraphrase":"","vocab":""},"128":{"type":"考點解析","translation":"Kowalski 女士的行銷團隊為準備簡報資料，勤奮工作了一整晚。","reason":"句意是「為了準備簡報資料，勤奮地工作了一整晚」，所以副詞 (C) diligently（勤奮地）是正確答案。(A) currently 表示「目前」、(B) especially 表示「尤其」、(D) entirely 表示「完全地」。","paraphrase":"","vocab":""},"129":{"type":"考點解析","translation":"為了補償工作場所受傷，Galvert 先生獲得三個月帶薪休假。","reason":"句意是「由於工作場所的傷害，獲得了三個月的帶薪休假」，所以表示「作為…的補償」的介系詞片語 (B) In compensation for 是正確答案。(A) On behalf of 表示「代表…」、(C) To the extent of 表示「達到…的程度」、(D) In preference to 表示「優先於…」。","paraphrase":"","vocab":""},"130":{"type":"考點解析","translation":"在預報嚴冬即將來臨後，Forest Fleece 夾克的銷售紀錄顯示業績有所成長。","reason":"句意是「在天氣預報會有一個嚴冬之後，Forest Fleece 夾克的銷售紀錄顯示出成長」，所以名詞 (A) improvement（改善，成長）是正確答案。(B) attraction 表示「吸引力」、(C) occupation 表示「職業，佔據」、(D) absence 表示「缺席，缺乏」。","paraphrase":"","vocab":""},"131":{"type":"考點解析","translation":"","reason":"句意是「這座中心是本市為 8 至 18 歲者規劃的 4 座設施中＿＿建築物」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到還有 3 座會在未來幾年建設，由此可知目前要開幕的是第一座設施，形容詞 (A) first（第一個的）是正確答案。(B) tallest 是形容詞 tall（高的）的最高級，表示「最高的」。(C) last 表示「最後的」。(D) finest 是形容詞 fine（好的）的最高級，表示「最好的」。","paraphrase":"","vocab":""},"132":{"type":"考點解析","translation":"","reason":"適當的句意是「整體上，儀式進行得相當順利」，所以副詞 (B) rather（相當）是正確答案。(A) enough（足夠地）要在副詞 well 後面做修飾，而不是前面。如果使用 (C) so far（目前為止）的話，意思會變成「整體上，儀式到目前為止進行得很順利」，但儀式是昨天晚上已經完成的事，而不是現在還在進行中，所以這不是正確答案。(D) right 表示「正好，就…」。","paraphrase":"","vocab":""},"133":{"type":"考點解析","translation":"","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Important members of the community came in large numbers to show their support. 提到當地社區許多重要成員到場展現支持，所以空格的內容應該和活動參加者有關，(D) Several celebrities were present, too 是正確答案。","paraphrase":"","vocab":""},"134":{"type":"考點解析","translation":"","reason":"和第一個子句（The mayor thanked ~ center）以對等連接詞（and）連接的第二個子句（~ ribbon）還缺少動詞，所以動詞 (A)、(C)、(D) 是可能的答案。因為句意是昨晚「市長感謝每個人對中心的貢獻，並且在剪綵時邀請一群當地孩童上台協助」，所以答案是動詞 invite（邀請）的過去式 (C) invited。現在式 (A) 通常表示重複性的行為或習慣，未來式 (D) 表示尚未發生的未來。動名詞或現在分詞 (B) 不能當動詞使用。","paraphrase":"","vocab":""},"135":{"type":"考點解析","translation":"","reason":"句意是「每次飛行（搭乘飛機）都會獲得點數」，所以 award（給予，授予）的 p.p. 形 (D) awarded 是正確答案。(A) praise 表示「稱讚」，(B) admire 表示「欣賞，欽佩」，(C) elevate 表示「提高，抬起」。","paraphrase":"","vocab":""},"136":{"type":"考點解析","translation":"","reason":"句意是「如果您累積超過 10 萬點，就有資格獲得我們白金等級會員的＿＿福利」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到福利包括只有最高等級的持卡者才能使用的白金休息室使用權，由此可知累積 10 萬點可以得到白金等級會員的專屬福利，形容詞 (C) exclusive（獨佔的，專用的）是正確答案。(A) necessary 表示「必要的」，(B) residual 表示「剩餘的」，(D) mutual 表示「相互的」。","paraphrase":"","vocab":""},"137":{"type":"考點解析","translation":"","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Your membership card has been included with this letter, along with a temporary access code for your online account. 提到會員卡包含在這封信中，而且附上了線上帳戶的臨時登入密碼，所以空格中的內容應該和線上帳戶的臨時登入密碼有關，(D) Please use it to log in and then change your password 是正確答案。","paraphrase":"","vocab":""},"138":{"type":"考點解析","translation":"","reason":"能當介系詞（about）受詞的是名詞，所以名詞 (B) 和動名詞 (C) 是可能的答案。能接空格後面的受詞（points）的是動名詞，所以動詞 acquire（獲得，取得）的動名詞形 (C) acquiring 是正確答案。名詞 (B) 後面不能接受詞。動詞 (A) 和 to 不定詞 (D) 不能當介系詞的受詞。","paraphrase":"","vocab":""},"139":{"type":"考點解析","translation":"","reason":"適當的句意是「想要感謝顧客讓網路商店持續營運」，所以能和空格後面的名詞 business 結合成 in business（營業中）的介系詞 (C) in 是正確答案。(A) below 表示位置「在…下面」，(B) out of 表示方向「往…外」，而 out of business 則是「停止營業中」或「倒閉」的意思。(D) over 表示期間或位置「在…期間」或「在…上方」。","paraphrase":"","vocab":""},"140":{"type":"考點解析","translation":"","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 We'd like to thank our loyal customers for keeping our online store (in) business 提到要感謝忠實顧客讓網路商店持續營運，所以空格的內容應該和對忠實顧客的感謝有關，(C) Your support has allowed us to finally have a physical store 是正確答案。","paraphrase":"","vocab":""},"141":{"type":"考點解析","translation":"","reason":"因為空格所在的句子還缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。句意是「開幕活動將在位於 Main 街 623 號的精品店舉行」，但只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到歡迎前往試香、觀看香水製造過程的示範，並且和創辦人 Carly Brown 小姐見面，由此可知開幕是未來即將舉行的活動，所以未來式 (A) will be held 是正確答案。過去式 (B) 和現在完成式 (C) 都不能表示未來的事情。to 不定詞 (D) 不能用在動詞位置。","paraphrase":"","vocab":""},"142":{"type":"考點解析","translation":"","reason":"句意是「接受＿＿至 2 月 22 日止」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到需要多個值班時段的 3 名銷售員，由此可知在 2 月 22 日前接受的是應徵申請，名詞 (C) Applications（申請）是正確答案。(A) Proposal 表示「提案」，(B) Coupon 表示「優惠券」，(D) Check 表示「支票」。","paraphrase":"","vocab":""},"143":{"type":"考點解析","translation":"","reason":"空格是連同逗號一起出現在句首的連接副詞位置，所以需要掌握空格所在句子和上一句的關係來選擇答案。上一句提到在企業家之中，難以製作並維持正確帳務紀錄的情況很常見，而空格所在的句子則說如果聘請像是 Shane McGovern 這樣有經驗的會計師，就能幫助了解會計的基礎，並且預防造成昂貴代價的錯誤，所以表示語意轉折、闡述不同情況時使用的連接副詞 (B) However（不過，然而）是正確答案。(A) Specifically 表示「具體來說，尤其」，(C) In fact 表示「事實上」，(D) Otherwise 表示「不然，否則」。","paraphrase":"","vocab":""},"144":{"type":"考點解析","translation":"","reason":"句意是「McGovern 先生曾經協助無數企業主」，所以能和空格前面的 have 動詞（has）構成現在完成式的動詞 assist（協助）p.p. 形 (D) assisted 是正確答案。第三人稱單數形 (A)、動詞原形 (B)、現在分詞 (C) 不能搭配 have 動詞使用。就算把空格前面的動詞（has）當成表示「擁有」的一般動詞，並且把 (A) 和 (B) 當成表示「幫助」的名詞，也無法把名詞和後面的名詞片語（countless business owners）連結在一起，所以這兩個選項不對。","paraphrase":"","vocab":""},"145":{"type":"考點解析","translation":"","reason":"句意是「他提供客製化的組織系統」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到 McGovern 先生曾經協助無數企業主提交稅務表單、記帳以及管理財務，而下一句則提到「這項服務」尤其受到許多著名企業主的讚賞，所以這一句適當的表達方式應該是他「也」提供客製化的組織系統，副詞 (B) also（也）是正確答案。(A) barely 表示「很少，幾乎不」，(C) never 表示「從不」，(D) only 表示「僅」。","paraphrase":"","vocab":""},"146":{"type":"考點解析","translation":"","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Still not sure if Shane McGovern Accounting can help you with your business? 問讀者是否還不確定 Shane McGovern 會計事務所能否對自己的事業有幫助，所以空格的內容應該和確認 Shane McGovern 會計事務所能帶來的幫助有關，(C) Call today to schedule a free consultation 是正確答案。","paraphrase":"","vocab":""},"147":{"type":"考點解析","translation":"","reason":"這是 Not/True 題型，要找出和關鍵詞語 Kiley and Julien 有關的內容，並且對照選項判斷答案。(A) 在 We also have smaller outlets at the following locations: 350 Acrewood Street, Alexandria, 119 Indianwoods Lane, Alexandria 的部分顯示，Kiley and Julien 在亞力山卓有兩間比較小的專賣店，符合選項敘述。(B) 在 Our main store in Ohio, By bus, Take bus 34. 的部分提到，可以搭 34 路線公車到俄亥俄州的總店，符合選項敘述。(C) 在 Regular hours for all outlets are Monday to Saturday, 9 A.M. to 8 P.M., and Sunday, 10 A.M. to 7 P.M. 的部分提到，所有專賣店週一至週六營業至晚上 8 點，週日營業至晚上 7 點，符合選項敘述。(D) 在文章裡沒有提到，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"148":{"type":"考點解析","translation":"","reason":"這是問顧客可以做什麼（What）來獲得快速回應的 wh- 問題。和題目的關鍵詞語 a customer do to get a fast response 有關的部分是 You may ~ open a chat dialogue ~ if you need a prompt response，表示如果需要即時回應，可以開啟聊天對話，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"149":{"type":"考點解析","translation":"","reason":"這一題問的是 Lee 先生聯絡 Vasquez 小姐的目的，所以要注意文章開頭的部分。Lee 先生在 Is there a chance you can go and pick up the brochures ~? 的部分問你（Vasquez 小姐）是否可以去拿小冊子，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"150":{"type":"考點解析","translation":"","reason":"這一題問的是 Vasquez 小姐的訊息所表達的意圖，所以要掌握引用部分（There's no need for that）前後文的情境。Marvin Lee 說 I don't remember the exact address, but I can look it up，表示自己不記得確切的地址，但可以查查看，而 Vasquez 小姐回應 There's no need for that（不需要做那件事），且補充 I've worked with them before，表示以前曾經和他們合作，所以 Lee 先生不需要查詢地址，(D) 是正確答案。","paraphrase":"","vocab":""},"151":{"type":"考點解析","translation":"","reason":"這是 Not/True 題型，要找出和關鍵詞語 local business owners 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章裡沒有提到。(B) 在 local business owners could not have been happier about their additional profits 的部分提到當地企業主對於額外的獲利感到非常高興，符合選項敘述，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"152":{"type":"考點解析","translation":"","reason":"這是 Not/True 題型，要找出和關鍵詞語 Ms. Nowak 有關的內容，並且對照選項判斷答案。(A) 在 She referred to \"perfect snow conditions\" for skiers, and her prediction helped attract tourists to the Boulder area 的部分提到，她（Nowak 小姐）說會有對滑雪客而言「完美的下雪狀態」，而她的預測也幫助吸引觀光客到 Boulder 地區，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章裡沒有提到。","paraphrase":"","vocab":""},"153":{"type":"考點解析","translation":"","reason":"這是 Not/True 題型，要找出和關鍵詞語 Excellent Publications 有關的內容，並且對照選項判斷答案。(A)、(B)、(C) 在文章裡沒有提到。(D) 在 readers subscribed to ~ our monthly print magazine ~. However, it was discontinued and, instead, readers had access to the first online version of the magazine 的部分提到，讀者過去訂閱了「我們」（Excellent 出版社）每月印行的雜誌，但現在這本雜誌已經停刊，而讀者可以閱讀這本雜誌的第一個線上版本；後面又提到 It has been one year since that change，表示這項變化至今已經過了一年，符合選項敘述，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"154":{"type":"考點解析","translation":"","reason":"這是和題目關鍵詞語 the print issue of The Thinker 有關的推論問題。Excellent Publications has continued to offer subscribers the same outstanding articles as before, only exclusively on the Internet 的部分提到，Excellent 出版社目前只在網路上為訂戶提供文章，而 The print issue will include our most popular articles from the previous 12 months. 的部分則提到未來的印刷版本將包括過去 12 個月最受歡迎的文章，由此可知《The Thinker》將會收錄曾經在網路上發布的文章，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"155":{"type":"考點解析","translation":"","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「在這短短的時間裡，《The Thinker》的讀者數已經超過 2 倍」，所以應該會出現在和某段時間裡讀者增加有關的部分。[3] 前面的句子 It has been one year since that change 提到這項改變（雜誌印刷版改為線上版）至今已經過了一年，後面的句子 Though the new electronic news magazine is continuing to grow in popularity, some readers are still requesting that the traditional printed version be brought back. 則提到雖然新的電子新聞雜誌越來越受歡迎，但有些讀者仍然請求傳統的印刷版本回歸。將句子填入 [3] 的位置之後，可以表達「雜誌印刷版改為線上版已經過了一年，《The Thinker》的讀者數在這短短的時間裡已經超過 2 倍，但儘管電子版新聞雜誌越來越受歡迎，還是有些讀者希望傳統的印刷版本回歸」，文意通順，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"156":{"type":"考點解析","translation":"","reason":"這一題問的是電子郵件的目的，但在這篇文章裡，主要的目的在後半才出現。I'm looking for a volunteer 的部分提到正在尋找自願參加者，而 the volunteer will have to present on this subject 的部分提到自願參加者必須針對這個主題（企鵝遷徙模式）發表簡報，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"157":{"type":"考點解析","translation":"","reason":"這是和題目關鍵詞語 Wildlife Research Institute 有關的推論問題。We usually choose one representative at random to attend the conference. However, this year ~ the person who attends will have more responsibilities than usual. 的部分提到，通常會隨機選出一名代表出席會議，但今年要尋找自願參加的人，因為這次出席的人將背負比往常更多的責任，由此可知除了今年以外，這個研究所以前也參加過鳥類保育會議，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"158":{"type":"考點解析","translation":"","reason":"這一題問通知主要是關於什麼，所以要注意文章開頭的部分。We organised today's activity to choose 20 dancers for Hannah Levi's upcoming concert tour. Some adjustments have been made 的部分提到，為了替 Hannah Levi 即將舉行的巡迴演唱會選出 20 名舞者，籌辦了今天的活動，而活動內容做了一些調整。接下來則是說明選拔舞者的詳細程序，所以 (A) 是正確答案。","paraphrase":"","vocab":""},"159":{"type":"考點解析","translation":"","reason":"advance 所在的語句 if you are chosen to advance to the next round 之中，advance 表示「前進」的意思，所以同樣表示「前進」的 (D) 是正確答案。","paraphrase":"","vocab":""},"160":{"type":"考點解析","translation":"","reason":"這是和題目關鍵詞語 the final announcement 有關的推論問題。In the second round, dancers will work with our lead choreographer. Afterward, the remaining candidates will undergo one more round in the evening before the final announcement is made. 的部分提到，在第二輪，舞者將和首席編舞家合作，而在最終宣布之前，留下來的人還將在傍晚再進行一輪選拔。由此可以推知，最終宣布是在第三輪之後進行，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"161":{"type":"考點解析","translation":"","reason":"這是 Not/True 題型，要找出和關鍵詞語 Reliance 7 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章中沒有提到。(B) 在 You'll love the rich colors and clear images on the high-resolution screen. 的部分提到，顧客會愛上高解析度螢幕的豐富色彩與清晰圖像，符合選項敘述，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"162":{"type":"考點解析","translation":"","reason":"這是 Not/True 題型，要找出和關鍵詞語 Top Crafter 有關的內容，並且對照選項判斷答案。(A)、(B)、(D) 在文章中沒有提到。(C) 在 Reliance has partnered with the bag designer Top Crafter 的部分提到，Reliance 公司和包袋設計公司 Top Crafter 合作，符合選項敘述，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"163":{"type":"考點解析","translation":"","reason":"這是 Not/True 題型，要找出和關鍵詞語 the pouch 有關的內容，並且對照選項判斷答案。(A) 在文章中沒有提到，所以 (A) 是正確答案。(B) 和 (D) 在 This is a limited edition item—only 1,000 pieces have been made, each one stamped with a serial number. 的部分提到，收納包是限定版商品，只製造了 1,000 個，而且每個都打印了序號，符合選項敘述。(C) 在 This brand has created a fashionable pouch for the Reliance 7 的部分提到，這個品牌（Top Crafter 公司）為 Reliance 7 設計了時尚的收納包，符合選項敘述。","paraphrase":"","vocab":""},"164":{"type":"考點解析","translation":"","reason":"這是問顧客被鼓勵在網站上做什麼（What）的 wh- 問題。和題目的關鍵詞語 customers encouraged to do on the Web site 有關的部分是 eager customers can preorder them on our Web site ~. Reserve yours on our site today!，這部分提醒渴望入手的顧客，可以在網站上預約 Reliance 7 平板電腦，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"165":{"type":"考點解析","translation":"","reason":"這是和題目關鍵詞語 Mr. Warburton 有關的推論問題。The Returning, the third and final book of his Lost Sanctuary series 的部分提到，《The Returning》是他（Warburton 先生）Lost Sanctuary 系列中第三本，也是最後一本書，由此可知 Warburton 先生寫了 Lost Sanctuary 這個三本書為一套的系列，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"166":{"type":"考點解析","translation":"","reason":"這是問 Gleason 先生自己不確定什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Gleason say he is uncertain about 有關的部分是 I am not entirely sure how to get permission to use the quotation.，表示他不是非常確定如何取得引用許可，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"167":{"type":"考點解析","translation":"","reason":"這是問 Gleason 先生請 Debonair 出版社提供什麼（What）資訊的 wh- 問題。和題目的關鍵詞語 Mr. Gleason ask Debonair Publishing to provide 有關的部分是 please inform me of ~ how much I can expect to pay，這部分是請對方告知預期將支付的費用，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"168":{"type":"考點解析","translation":"","reason":"這是問根據這篇文章，Muller 先生做了什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Muller do 有關的部分是 Mr. Muller was a wealthy industrialist who opened the first factories here.，這部分提到 Muller 先生是一位富有的工業家，在「這裡」（Western Point 市）開設了第一座工廠，所以 (A) 是正確答案。","paraphrase":"","vocab":""},"169":{"type":"考點解析","translation":"","reason":"這是 Not/True 題型，要找出和關鍵詞語 Mr. Hunt 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文中沒有提到。(B) 在 Sam Hunt, who has worked on similar restoration projects such as the Rosenberg Monument in Washington, DC 的部分，提到 Sam Hunt 曾進行華盛頓特區 Rosenberg 紀念碑之類的類似修復工程，符合選項敘述，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"170":{"type":"考點解析","translation":"","reason":"這是 Not/True 題型，要找出和關鍵詞語 the sculpture garden 有關的內容，並且對照選項判斷答案。(A) 和 (C) 在文中沒有提到。(B) 在 During this time, the ~ sculpture garden ~ will remain freely accessible ~ 的部分，提到在這段期間（鐘樓修復期間），大眾仍然可以自由利用鄰近的雕塑花園，不符合選項敘述。(D) 在 During this time, the ~ sculpture garden ~ will remain freely accessible to the public. 的部分，提到大眾仍然可以自由利用鄰近的雕塑花園，符合選項敘述，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"171":{"type":"考點解析","translation":"","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「他是這個領域頂尖的專業人士之一」，所以應該會出現在這篇文章介紹 Sam Hunt 的部分。[3] 前面的句子 Sam Hunt, who has worked on similar restoration projects such as the Rosenberg Monument in Washington, DC 提到 Sam Hunt，說他曾進行華盛頓特區 Rosenberg 紀念碑之類的類似修復工程。將句子填入 [3] 的位置之後，可以表達「Sam Hunt 曾進行華盛頓特區 Rosenberg 紀念碑之類的類似修復工程，是這個領域頂尖的專業人士之一」，文意通順，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"172":{"type":"考點解析","translation":"","reason":"這是問 Foster 小姐想做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Foster want to do 有關的部分是 Andrew Marks 所說的 I think Ms. Foster from GDE Motors is ready to conclude negotiations. She wants to meet with Mr. Mueller next week to work out the terms of a contract.，表示他認為 GDE Motors 公司的 Foster 小姐準備好要完成談判了，並且提到她想在下週和 Mueller 先生會面，決定合約的條款，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"173":{"type":"考點解析","translation":"","reason":"這是問 West 小姐建議什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. West recommend 有關的部分是 West 小姐所說的 Why don't we schedule an appointment for Ms. Foster with Deanna Lane?，她建議安排 Foster 小姐跟 Deanna Lane 會面，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"174":{"type":"考點解析","translation":"","reason":"這一題問的是 West 小姐的訊息所表達的意圖，所以要掌握引用部分（That could work）前後文的情境。Andrew Marks 說 She wants to meet with Mr. Mueller next week ~，表示她（Foster 小姐）想在下週和 Mueller 先生會面，而 West 小姐回應 He won't be here next week，表示 Mueller 先生下週不在。於是 Robert Crane 說 Could we ask Mr. Mueller to do a videoconference ~?，提議請 Mueller 先生進行視訊會議，而 West 小姐回答 That could work.（那樣或許可以）I don't think the client would mind doing that（我想客戶不會介意那樣做），表示對於 Mueller 先生下週不在而無法和 Foster 小姐會面的問題，West 小姐認為可以用視訊會議的方式解決，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"175":{"type":"考點解析","translation":"","reason":"這是問 Marks 先生接下來會做什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Marks do next 有關的部分是 I'll go talk with Mr. Mueller right now and find out if he'd be willing to do that，表示他會馬上跟 Mueller 先生談，且了解他是否願意那樣做（和 Foster 小姐進行視訊會議），所以 (C) 是正確答案。","paraphrase":"","vocab":""},"176":{"type":"考點解析","translation":"","reason":"這是和題目關鍵詞語 Kitchen-Max 有關的推論問題，所以要在介紹到 Kitchen-Max 公司的（第一篇文章）找出相關的內容。The ColdPro 2000 refrigerator is top-notch, like all of Kitchen-Max's appliances 的部分提到，ColdPro 2000 冰箱是頂尖的產品，就像 Kitchen-Max 的所有家電一樣，可以推知 Kitchen-Max 公司專門製造高品質的家電，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"177":{"type":"考點解析","translation":"","reason":"這是問根據產品評論（第一篇文章），什麼（What）是 ColdPro 2000 的特色的 wh- 問題。the company has kept ~ contemporary design 的部分提到，這家公司保留了現代設計，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"178":{"type":"考點解析","translation":"","reason":"這是問 Ling 先生建議什麼（What）的 wh- 問題，所以要看 Ling 先生所寫的（第一篇文章）。Reviewed by Roger Ling on January 5 的部分顯示 Ling 先生在 1 月 5 日發表了這篇評論，而 it will introduce the next model in its refrigerator line this coming February. I'd suggest holding off until then 的部分則提到 Kitchen-Max 公司將在接下來的 2 月推出下一款冰箱系列的產品，因而建議在那之前暫緩（購買），所以 (C) 是正確答案。","paraphrase":"","vocab":""},"179":{"type":"考點解析","translation":"","reason":"這是需要對照兩篇文章內容的題目。題目的關鍵詞是 ColdPro 2000 and ColdPro 3000 have in common，要問 ColdPro 2000 和 ColdPro 3000 有什麼（What）共同點，所以先看提到 ColdPro 2000 和 ColdPro 3000 的廣告。\n線索1：廣告（第二篇文章）中，The appliance has all the useful functions of our previous model, the ColdPro 2000 的部分提到這款家電產品（ColdPro 3000）具備上一款 ColdPro 2000 所有有用的功能，但沒有提到 ColdPro 2000 的具體功能，所以還需要參考評論的內容。\n線索2：評論（第一篇文章）中，It has ~ a convenient water dispenser. 的部分提到 ColdPro 2000 有便利的飲水機。\n綜合這兩個線索，可知 ColdPro 3000 和 ColdPro 2000 一樣有飲水機，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"180":{"type":"考點解析","translation":"","reason":"這是問 2 月 25 日會發生什麼事（What）的 wh- 問題，所以要看題目的關鍵詞 February 25 出現的廣告（第二篇文章）。Kitchen-Max is proud to introduce its newest ~ refrigerator, the ColdPro 3000. 的部分提到，Kitchen-Max 公司要介紹最新款的冰箱 ColdPro 3000，而 The ColdPro 3000 will be available starting February 25 at a retailer near you! 的部分提到 ColdPro 3000 將從 2 月 25 日起在「您」（顧客）家附近的零售店發售，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"181":{"type":"考點解析","translation":"","reason":"這一題問的是信件（第一篇文章）的目的，所以要注意文章開頭的部分。在信件中，Please review the proposed contract enclosed with this letter. It has been modified to include the new terms you requested. 的部分請對方（Simon 小姐）檢閱這封信所附的合約提案，而這份合約已經修改而包括了對方所要求的新條款，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"182":{"type":"考點解析","translation":"","reason":"這是需要對照兩篇文章內容的推論題型。要找出和題目的關鍵詞語 the office on North Avenue 有關的內容，所以先看提到這個地方的信件。\n線索1：信件（第一篇文章）中的 The owner of the North Avenue office space—the only one in Atlanta that fully met your needs—has accepted your offer. 提到，亞特蘭大唯一完全符合對方（Simon 小姐）需求、位於 North 大街的辦公空間的業主接受了出價，但這裡沒有提到辦公室的特色，所以還需要參考備忘錄中的相關內容。\n線索2：備忘錄（第二篇文章）中的 Mr. Horowitz ~ has helped us rent the office in Atlanta that meets all our requirements. There is a train station just five minutes away on foot 提到，從這個滿足所有要求條件的辦公室走路只要 5 分鐘就有車站。\n綜合這兩個線索，可知位於 North 大街、滿足所有要求條件的亞特蘭大辦公室附近有車站，所以 (A) 是正確答案。","paraphrase":"","vocab":""},"183":{"type":"考點解析","translation":"","reason":"在備忘錄（第二篇文章），positive 所在的語句 I am positive that all of you will be pleased. 之中，positive 表示「相信」的意思，所以同樣能表示「相信」的 (C) 是正確答案。","paraphrase":"","vocab":""},"184":{"type":"考點解析","translation":"","reason":"這是問 Simon 小姐的公司將以何種方式（How）從搬遷中受益的 wh- 問題，相關的內容出現在備忘錄（第二篇文章）。備忘錄中的 this change will allow us to be closer to ~ clients 提到，這個改變（公司搬遷）將能讓「我們」（Simon 小姐的公司）離現有的客戶更近，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"185":{"type":"考點解析","translation":"","reason":"這是需要對照兩篇文章內容的推論題型。要找出和題目的關鍵詞 April 1 有關的內容，先從備忘錄尋找相關的內容。\n線索1：備忘錄（第二篇文章）中的 Most things in the new office are being taken care of by the owner, but some essential appliances are not provided. We will have those appliances set up on April 1 提到，新辦公室大部分的東西由業主管理，但不提供一些必要器具，而 4 月 1 日會請人安裝，但沒有提到不提供的是什麼，所以還需要參考信件。\n線索2：信件（第一篇文章）中的 the owner will ~ fix anything necessary before then. However, you will need to arrange the air cooling system on your own. 提到，業主會在那時候（4 月 1 日）之前處理好任何必要的東西，但 Simon 小姐的公司必須自行準備冷氣系統。\n綜合這兩個線索，可知 4 月 1 日會安裝業主不提供的冷氣，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"186":{"type":"考點解析","translation":"","reason":"這一題問的是 Sward 先生聯絡 McDaniel 小姐的原因，所以要注意 Sward 先生所寫的電子郵件（第一篇文章）開頭的部分。在電子郵件中，You mentioned ~ that it would be great to take a cooking class together during our trip to Adelaide ~ I've followed up on this and found a culinary school that offers half-day sessions. 提到對方（McDaniel 小姐）提到，兩人去阿得雷德旅行的時候，一起去上烹飪課會很不錯，而他研究了這件事，找到了提供半天課程的烹飪學校，所以 (A) 是正確答案。","paraphrase":"","vocab":""},"187":{"type":"考點解析","translation":"","reason":"這是需要對照兩篇文章內容的推論題型。要找出和題目的關鍵詞語 Mr. Sward ~ attend a class at Buxton Cooking School 有關的內容，所以先看提到相關事項的電子郵件。\n線索1：電子郵件（第一篇文章）中的 we'll have to take a weekday class ~ He's teaching one of the courses, so we could actually meet him in person. 提到，他們必須上平日的課，而且「他」（Joel Denton）教其中一門課，所以能實際見到他本人。但這裡沒有提到 Joel Denton 教的課是哪時候，所以還需要參考時間表中的相關內容。\n線索2：時間表（第二篇文章）中的 Wednesday ~ Baking Bread (Joel Denton) 顯示 Joel Denton 平日的麵包課是星期三。\n綜合這兩個線索，可知 Sward 先生會上 Joel Denton 星期三的麵包課，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"188":{"type":"考點解析","translation":"","reason":"這是 Not/True 題型，要從時間表中找出和關鍵詞語 Buxton Cooking School 有關的內容，並且對照選項判斷答案。(A) 在文章中沒有提到。(B) 從 Friday、Saturday、Making Sauces 可以看出，醬料製作課在週五和週六進行，不符合選項敘述。(C) 在 No classes are held on Mondays 的部分提到週一不開課，符合選項敘述，所以 (C) 是正確答案。(D) 從 Using Vegetables (Martin Ames) 可以看出，「運用蔬菜」這門課的老師只有 Martin Ames，不符合選項敘述。","paraphrase":"","vocab":""},"189":{"type":"考點解析","translation":"","reason":"這是問根據通知，一些攤販業主要求什麼（What），所以要從通知（第三篇文章）找出相關的內容。通知中的 stall owners have asked that tour group leaders and cooking class instructors keep their groups moving from one stall to the next 提到，攤販業主們要求參觀團體的領隊與烹飪課教師保持團體持續往下一個攤位移動，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"190":{"type":"考點解析","translation":"","reason":"這是需要對照兩篇文章內容的推論題型。要找出和題目的關鍵詞語 students in Buxton Cooking School's morning classes 有關的內容，所以先看提到上午課程的時間表。\n線索1：時間表（第二篇文章）中的 Morning classes include a visit to Pinkston Food Market, where a talk will be given. 顯示，上午的課包括前往 Pinkston 食品市場，且將在當地進行說明。不過，因為沒有提到參觀 Pinkston 食品市場的其他細節，所以還需要參考通知中的相關內容。\n線索2：通知（第三篇文章）中的 Guides wishing to give short talks to their groups are kindly asked to do so in our food court. 請求領隊在「我們」（Pinkston 食品市場）的美食廣場進行簡短說明。\n綜合這兩個線索，可知參加 Buxton 烹飪學校上午課程的學生，會在 Pinkston 食品市場的美食廣場聽說明，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"191":{"type":"考點解析","translation":"","reason":"這一題問的是寫文章（第一篇）的理由，所以要注意文章開頭的部分。The Westburg City Council has announced an initiative to lessen water usage. 的部分提到，Westburg 市議會宣布了減少用水量的計畫，接下來說明計畫的細節，所以 (A) 是正確答案。","paraphrase":"","vocab":""},"192":{"type":"考點解析","translation":"","reason":"這是問根據文章（第一篇），是什麼（What）造成水的價格上升的 wh- 問題。Unusually low precipitation has led to serious water shortages in the city ~ Due to that, water prices have soared 的部分提到，異常低的降水量導致了該市嚴重缺水，因而水價大漲，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"193":{"type":"考點解析","translation":"","reason":"這是問 Home-Vert 公司的員工會為顧客做什麼（What）的 wh- 問題，所以要看和題目的關鍵詞語 Home-Vert staff do for its customers 有關聯的廣告（第二篇文章）中的內容。廣告中的 Our staff will also show you ~ how to maintain it. 提到，我們（Home-Vert 公司）的員工會說明系統如何維護，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"194":{"type":"考點解析","translation":"","reason":"這是需要對照兩篇文章內容的推論題型，先看寄給題目的關鍵詞語 Mr. Bircher 的電子郵件。\n線索1：電子郵件（第三篇文章）中的 DATE: July 15 顯示這是 7 月 15 日寄的郵件，而 Thank you for filling out our form for having a water recycling system installed. We would be very happy to send a representative to your home at ~ Westburg, next Monday 的部分感謝 Bircher 先生填寫「我們」（Home-Vert 公司）的表單，申請安裝水循環再利用系統，以及很樂意在下週一派專員到他在 Westburg 市的住宅。不過，這裡沒有提到關於安裝的其他細節，所以還需要參考文章中的相關內容。\n線索2：文章（第一篇）中的 the city will offer a rebate to homeowners who install a water recycling system, though the system must be functioning by August at the latest 提到，將會部分退款給安裝水循環再利用系統、在 8 月前啟用的屋主。\n綜合這兩個線索，可知在 7 月中申請安裝水循環再利用系統的 Bircher 先生應該可以得到部分退款，所以 (A) 是正確答案。","paraphrase":"","vocab":""},"195":{"type":"考點解析","translation":"","reason":"這是需要對照兩篇文章內容的推論題型，先看提到題目關鍵詞語 Bade Hardware 的電子郵件。\n線索1：電子郵件（第三篇文章）中的 To thank you for completing the request form, we have attached a voucher from Bade Hardware worth $50. 提到，為了感謝填寫申請表，「我們」（Home-Vert 公司）附上了 Bade Hardware 價值 50 元的優惠券。不過，這裡沒有提到關於贈送優惠券的其他細節，所以還需要參考廣告中的相關內容。\n線索2：廣告（第二篇文章）中的 Everyone who submits a completed form will receive a voucher worth $50 from one of our many local business partners! 提到，每一位提交填寫完成的申請表的人，都將收到「我們」（Home-Vert 公司）許多本地合作業者之一的 50 元優惠券。\n綜合這兩個線索，可知因為 Bade Hardware 和 Home-Vert 公司有合作關係，所以贈送了 Bade Hardware 的 50 元優惠券，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"196":{"type":"考點解析","translation":"","reason":"這是要在表單（第一篇文章）找出和題目關鍵詞語 Ponderosa Clothing 相關內容的推論問題。I have a Web site, but it only contains a brief description of my business, some information about our best-selling products, and a map. I would like to have the site upgraded so that customers can use it to order items. 的部分提到網站（Ponderosa Clothing 的網站）只有事業簡介、暢銷產品資訊和地圖，而想請對方升級網站，讓顧客可以用它訂購產品，由此可以推知原本的網站不能銷售商品，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"197":{"type":"考點解析","translation":"","reason":"這一題問的是電子郵件（第二篇文章）的目的，所以要注意文章開頭的部分。在電子郵件中，One of our designers has reviewed your current Web site and compiled a project estimate ~. The total cost for designing www.ponderosaclothing.com ~ is expected to be $1,250. 提到一名設計師檢視了目前的網站，並製作了專案估價單，而設計費預計為 1,250 元，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"198":{"type":"考點解析","translation":"","reason":"這是需要對照兩篇文章內容的推論題型。要找出和題目的關鍵詞語 shown on Ponderosa Clothing's new Web site 有關的內容，先看電子郵件中寫了什麼。\n線索1：電子郵件（第二篇文章）中的 you will need to send a picture of your store as it will appear on the main page of the Web site 提到必須寄一張「您的商店」（Ponderosa Clothing）的照片，因為它會出現在網站的首頁。不過，這裡沒有提到關於店面的其他細節，所以還需要參考表單中的相關內容。\n線索2：表單（第一篇文章）中的 Address, 31 North Pima Road, Scottsdale, AZ 顯示 Ponderosa Clothing 位於 North Pima 路。\n綜合這兩個線索，可知網站的首頁將會有位於 North Pima 路的 Ponderosa Clothing 店面照片，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"199":{"type":"考點解析","tra const quizTouch = document.getElementById('quiz');
quizTouch.addEventListener('touchstart', event => {

  if (!swipeStart || event.changedTouches.length !== 1) {swipeStart=null;return;}

  const dx=touch.clientX-start.x, dy=touch.clientY-start.y;

  if (Math.abs(dx)<65 || Math.abs(dx)<Math.abs(dy)*1.6 || Date.now()-start.time>1500) return;

const b=onSnapshot(collection(db,'practiceCodes',code,'test02_stars'),snap=>{if(token!==generation)return;remoteStars={};snap.forEach(d=>{if(/^\d+$/.test(d.id)&&d.data().marked)remoteStars[d.id]=true});loadedS=true;sync()},err=>{if(token===generation){info('讀取星號失敗：'+err.message);connect.disabled=false}});unsub.push(b);
const c=onSnapshot(collection(db,'practiceCodes',code,'test02_highlights'),snap=>{if(token!==generation)return;remoteExcerpts={};snap.forEach(d=>{const items=d.data().items;if(/^\d+$/.test(d.id)&&Array.isArray(items))remoteExcerpts[d.id]=items.filter(x=>typeof x==='string')});loadedE=true;sync()},err=>{if(token===generation){info('讀取文字摘錄失敗：'+err.message+'。請更新 Firestore 規則。');connect.disabled=false}});unsub.push(c);
const d=onSnapshot(doc(db,'practiceCodes',code,'test02_drill','state'),snap=>{if(token!==generation)return;remoteDrill=snap.exists()?snap.data():{};loadedD=true;sync()},err=>{if(token===generation){info('讀取錯題練習失敗：'+err.message+'。請先更新 Firebase Rules。');connect.disabled=false}});unsub.push(d);
}catch(err){if(token===generation){info('Firebase 連線失敗：'+err.message);connect.disabled=false}}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();connect.click()}});
// 在雲端讀取期間禁用作答；已離線作答不會自動上傳。
const originalSave=cloud.saveAnswer,originalStar=cloud.setStar,originalImport=cloud.importAnswers,originalReset=cloud.resetAnswers;
for(const [name,fn] of [['saveAnswer',originalSave],['deleteAnswer',cloud.deleteAnswer],['setStar',originalStar],['importAnswers',originalImport],['resetAnswers',originalReset],['saveExcerpts',cloud.saveExcerpts]])cloud[name]=async(...args)=>{if(cloud.mode==='loading'||activeCode&&!cloud.ready)throw Error('雲端正在載入或連線異常，無法儲存；請退出雲端模式後使用本機練習。');return fn(...args)};
onAuthStateChanged(auth,user=>{if(!user&&activeCode){window.readingGate?.lock();info('Firebase 驗證已中斷，請重新按「載入雲端紀錄」。');stopListeners();connect.disabled=false}});
</script></body></html>
