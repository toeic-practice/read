</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Brad Jeong jeongbrad@cucinaaid.com</strong></div><div class=\"doc-field\"><span>日期</span><strong>3月2日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>回覆：CucinaAid 攪拌機問題</strong></div></div><p>親愛的 Lagarde 小姐：</p><p>您來信告知，CucinaAid 攪拌機的打蛋器配件旋上後無法固定緊密。您完全有理由擔心。<span class=\"reading-blank\">〔131〕</span>〕鬆動的配件存在安全風險，很感謝您向我們反映這件事。</p><p>我們相信這項瑕疵〔<span class=\"reading-blank\">〔132〕</span>〕於最近一次生產期間，當時可能誤用了不正確的零件。我們非常抱歉，希望為您〔<span class=\"reading-blank\">〔133〕</span>〕這台機器。請帶機器至我們任一服務中心，技術人員將免費替您修理。為補償造成的不便，也請收下下次購買 CucinaAid 商品時折抵 25 美元的優惠代碼：UW3-G6BQ1。<span class=\"reading-blank\">〔134〕</span></p><p>此致<br/>Brad Jeong<br/>CucinaAid 客戶服務專員</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>135-138 · 1/1</small></div><div class=\"document-body\"><p>本地消費者都知道，Diamond Plaza 購物中心目前正在進行重大〔<span class=\"reading-blank\">〔135〕</span>。停業整整一個月後，經營團隊表示裝修進展順利，並且 House Lab 已同意租用 7,000 平方英尺的空間。House Lab 是領先的家電零售商，無疑會為購物中心吸引大量顧客。<span class=\"reading-blank\">〔136〕</span>〕有人猜測，它將進駐正門左側的位置。雖然這確實是重大消息，但目前發布的其他裝修資訊仍然〔<span class=\"reading-blank\">〔137〕</span>。舉例而言，美食廣場〔<span class=\"reading-blank\">〔138〕</span>〕終於會進行迫切需要的擴建，現在仍不得而知。預計下個月的記者會將揭露更多細節。</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>139-142 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>全體員工</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Robert Valdez，管理部</strong></div><div class=\"doc-field\"><span>主旨</span><strong>年終事項</strong></div><div class=\"doc-field\"><span>日期</span><strong>12月1日</strong></div></div><p>值此年末，Voyager Communications 的管理團隊感謝大家的努力與毅力。由於各位的付出，銷售成績優於預期，因此我們能發放更高額的獎金。我們將把標準年度獎金提高至薪資的 2%。<span class=\"reading-blank\">〔139〕</span>〕以前的比例是 1%。<span class=\"reading-blank\">〔140〕</span></p><p>另外，如果各位想知道上週許多人獲得的加薪是否會計入獎金計算，答案是肯定的。獎金將依新的、較高的〔<span class=\"reading-blank\">〔141〕</span>〕計算。</p><p>如果有任何問題，請到我的辦公室來見我，<span class=\"reading-blank\">〔142〕</span>〕讓我知道。</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▣ NOTICE</span><small>143-146 · 1/1</small></div><div class=\"document-body\"><p>Harlington 即興劇團（HIP）將於 7 月 9 日〔<span class=\"reading-blank\">〔143〕</span>〕Ferris Greene 表演藝術中心。如果您喜歡歡笑，千萬別錯過本週六登台的 Liza Smythe、Dennis Armstrong、Jackson Parcell 與 Charlie Cousins。和往常一樣，HIP 會依據觀眾當場提出的建議汲取靈感，<span class=\"reading-blank\">〔144〕</span>〕精彩表演。<span class=\"reading-blank\">〔145〕</span>〕而且這次演出也是為了公益。售票〔<span class=\"reading-blank\">〔146〕</span>〕將用於支持 Harlington City 高中的藝術相關課外活動。請至 www.ferrisgreenepac.com/shows 預訂座位並取得更多資訊。</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>▦ FORM</span><small>147-148 · 1/1</small></div><div class=\"document-body\"><h4>Central Valley Financial Partners 公司報銷申請表</h4><h4>編號：382625</h4><h4>購買品項：</h4><div class=\"doc-table-wrap\"><table class=\"doc-table\"><tr><th>品項說明</th><th>金額</th></tr><tr><td>8 張披薩（每張 15 元）</td><td>120 元</td></tr><tr><td>氣球與裝飾</td><td>22 元</td></tr><tr><td>1 個裝飾蛋糕</td><td>38 元</td></tr><tr><td>1 張退休賀卡</td><td>5 元</td></tr><tr><td>總金額</td><td>185 元</td></tr></table></div><h4>備註：12 月 9 日為 Richard Dugas 慶祝的活動</h4><div class=\"doc-fields\"><div class=\"doc-field\"><span>提交者</span><strong>Elisa Cooper</strong></div><div class=\"doc-field\"><span>簽名</span><strong>Elisa Cooper</strong></div><div class=\"doc-field\"><span>日期</span><strong>12 月 10 日</strong></div></div><div class=\"doc-fields\"><div class=\"doc-field\"><span>批准者</span><strong>Patrick Rhodes</strong></div><div class=\"doc-field\"><span>簽名</span><strong>Patrick Rhodes</strong></div><div class=\"doc-field\"><span>日期</span><strong>12 月 10 日</strong></div></div><h4>請將收據連同本申請表一併提交。</h4></div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement\"><div class=\"doc-ribbon\"><span>▣ ADVERTISEMENT</span><small>149-150 · 1/1</small></div><div class=\"document-body\"><h4>Dorney—正職與兼職銷售顧問</h4><h2 class=\"doc-heading enhanced-heading\">作為高級品牌，我們對所有客戶提供優異顧客服務的名聲，我們引以為榮。目前，我們正在尋找對顧客服務有熱情的兩名正職與兩名兼職銷售顧問，到我們位於 Dorney 市 Village 路的店鋪工作。</h2><h4>您必須在高級服飾領域擁有經證實的銷售經驗，以及熱情、外向的個性與獨特的時尚品味。在男裝產業的經驗是一項有利條件。</h4><p>如果您有興趣加入我們的團隊，請將您的履歷寄到 recruitment@pearsonlennox.com，註明您想工作半天或整天。</p></div></section></div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 151-152</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>▤ MESSAGES</span><small>151-152 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-thread\"><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Melvin Stuckey</b><time>下午4:47</time></div><div class=\"chat-content\">你收到我關於和中國投資人開會的訊息了嗎？Zhang 先生要求把會議改到星期三。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Rhonda Perry</b><time>下午4:48</time></div><div class=\"chat-content\">我剛讀了。那樣對我來說比較方便。我星期二可以和工程團隊會面了。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Melvin Stuckey</b><time>下午4:48</time></div><div class=\"chat-content\">好。我會跟 Zhang 先生確認。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Rhonda Perry</b><time>下午4:50</time></div><div class=\"chat-content\">還有一件事。你和 Lucas 先生有聯絡嗎？我請他在星期一上午前交出投資人會議用的列印資料。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Melvin Stuckey</b><time>下午4:51</time></div><div class=\"chat-content\">他打電話來說會有所延誤。他注意到數字的錯誤，必須重印一些頁面。列印資料會在星期二下午送到這裡。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Rhonda Perry</b><time>下午4:51</time></div><div class=\"chat-content\">那樣應該不會有問題。謝謝，Melvin。星期一見。</div></div></div></div></section></div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 153-154</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▣ NOTICE</span><small>153-154 · 1/1</small></div><div class=\"document-body\"><h4>Green City 農夫市集參加指南</h4><h2 class=\"doc-heading enhanced-heading\">Green City 農夫市集對於身為 West Hollywood 有最高標準的一個傳統習俗而自豪。希望租用攤位的任何新農場都必須符合以下條件：</h2><ul class=\"doc-bullets\"><li>獲得國營有機認證服務（OCS）的有機標章</li><li>接受由 Green City 農夫市集經營團隊所進行的水質檢查</li><li>付一整季的攤販費用</li></ul><h4>要詢問具體的租用選項，請寄電子郵件到 c.keller@greencityfm.org 聯絡市集總籌 Cathy Keller。</h4></div></section></div>","155-157":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 155-157</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>155-157 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Jacob Lee jc.lee@penmail.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Amy Narvasa a.narvasa@naturewatch.org</strong></div><div class=\"doc-field\"><span>主旨</span><strong>我們重視您的會員資格</strong></div><div class=\"doc-field\"><span>日期</span><strong>11 月 18 日</strong></div></div><p>親愛的 Lee 先生：</p><p>您的支持對我們的工作至關重要。多虧有您和其他像您一樣的人，我們得以在 8 個不同國家保護並恢復超過 500 平方公里的重要天然資源。又快到年底的時候，我們希望您能再度延續您的貢獻。</p><p>請到我們的網站填寫安全的線上續會表單。當您續會時，您將收到我們得獎雜誌《Inside Nature》的一本月刊，其中有許多您幫助實現的工作相關照片與報導。身為會員，您也可以用我們的行動應用程式來追蹤我們專案的狀況，並且以各種方式參與其中。</p><p>您可以確信自己的捐款得到妥善的利用。Nature Watch 在 Conscious Business、Smart Giving Alliance、American Philanthropic Society 之類的團體所執行的慈善團體評鑑中獲得很高的評分。</p><p>Amy Narvasa<br/>會員關係部</p></div></section></div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 158-160</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>158-160 · 1/1</small></div><div class=\"document-body\"><p>Sachs Export 家具公司 備忘錄</p><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>所有部門經理</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Hilda Marley，IT 總監</strong></div><div class=\"doc-field\"><span>主旨</span><strong>CRM 軟體</strong></div><div class=\"doc-field\"><span>日期</span><strong>3 月 20 日</strong></div></div><h4>如各位所知，我正在選購顧客關係管理（CRM）軟體，來取代沒有電腦化的現行體系。隨著我們的客戶名單擴張，CRM 軟體的必要性就越來越明顯。它應該能讓我們把顧客資料管理得更好，進而提升顧客服務、簡化訂單處理並改善產品開發。— [1] —</h4><p>和上述事項有關的是，我希望你們每個人都從自己的部門選擇 2 位成員來參加產品試用。我已經把選項縮小到 3 家（軟體）供應商。— [2] — 每家供應商的產品都將在 30 天的期間接受試用。試用期結束時，試用參加者將以報告形式提供回饋意見。</p><h4>一旦我們選定適當的軟體，我也會需要你們幫忙推行軟體的使用。— [3] — 我們想要確保所有員工都知道 CRM 軟體的好處，以及使用起來有多容易。</h4><p>請在明天之前把你們的推薦用電子郵件寄給我。— [4] — 我們會在星期五開會，希望可以在 4 月初開始測試。</p></div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 161-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>▤ MESSAGES</span><small>161-164 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-thread\"><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Oskar Jensen</b><time>9:18 A.M.</time></div><div class=\"chat-content\">大家早安。我只是想確認你們對於就業博覽會有沒有在最後一刻關切的事。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Emma Blom</b><time>9:21 A.M.</time></div><div class=\"chat-content\">Oskar，我這邊沒有。空間配置已經定案，並且獲得所有企業參加者的認可。我兩天後會和志工開最後一次會，把各種程序檢視一遍。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Lilly Mattson</b><time>9:24 A.M.</time></div><div class=\"chat-content\">我也一樣。人們持續透過我們的網站報名，並下載我們的行動應用程式。我們在社交媒體上也看到很多活動。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Emma Blom</b><time>9:25 A.M.</time></div><div class=\"chat-content\">噢，我其實確實有一件關切的事。我申請華語口譯員的事有任何消息嗎？</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Oskar Jensen</b><time>9:27 A.M.</time></div><div class=\"chat-content\">有的，Emma。我把你的申請提交出去了。我還在等 Axel 回覆。他需要批准額外的費用。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Lilly Mattson</b><time>9:29 A.M.</time></div><div class=\"chat-content\">我剛看到他走進來。我讓他加入討論。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Axel Lofgren</b><time>9:35 A.M.</time></div><div class=\"chat-content\">大家好。我很高興報告，這項申請已經獲得批准。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Oskar Jensen</b><time>9:36 A.M.</time></div><div class=\"chat-content\">謝謝你，Axel。Emma，請你繼續和 Exalan 口譯社做安排。</div></div><div class=\"chat-msg\"><div class=\"chat-meta\"><b>Emma Blom</b><time>9:39 A.M.</time></div><div class=\"chat-content\">已經在處理了。謝謝。</div></div></div></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>✉ LETTER</span><small>165-167 · 1/1</small></div><div class=\"document-body\"><p>哥倫布市</p><p>1 月 23 日</p><p>執行長 Julia Peron<br/>Mindmatter 公司<br/>Enos 路 1135 號<br/>貝克斯菲爾德，加州 93314</p><p>親愛的 Peron 小姐：</p><p>我寫這封信是要支持哥倫布市爭取成為 Mindmatter 公司第二座企業總部的所在地。我強烈相信本市會是理想的地點。</p><p>首先，哥倫布市對企業友善，並且有扶植電信、醫療服務、軟體開發等多種業界公司的歷史。身為領先的網路零售業者，Mindmatter 公司一定會欣賞我們已經具備的各種基礎建設。舉例來說，我們的航空、道路與鐵路交通連結提供世界各地城市與鄰近地區的便利性。此外，哥倫布市提供豐富的文化名勝、娛樂設施與戶外空間，幫助貴公司員工享受健康的工作與生活平衡。說到員工，這裡的人口教育水準高，而我們世界級的大學也確保未來有深厚的人才儲備可供利用。最好的一點是，哥倫布市提供以上這一切，卻沒有其他城市通常會有的高額不動產成本。</p><p>我相信您會認知到將總部設立於哥倫布市的優勢，我也很樂意安排會議來討論具體地點。謝謝您的考慮。</p><p>Tom Vickers<br/>Tom Vickers<br/>哥倫布市市長</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▣ NOTICE</span><small>168-171 · 1/1</small></div><div class=\"document-body\"><h4>通知</h4><p>經過 Springdale 市議會的批准，佔地 10,000 平方公尺的社區中心建設工作很快將開始進行。— [1] —。這座中心的主要設施將有兒童遊戲場、圖書館與老人活動中心。社區中心也將包含附有外燴廚房的活動空間。未來計畫包括增設室內運動用的完整尺寸（大型）體育館。</p><p>動土典禮預定 3 月 20 日在 Thompson 街與 Huntsville 大街路口舉行。— [2] —。中心將在明年秋季開幕，而體育館則在次年開幕。明年中心開幕後，所有設施都提供大眾免費使用，除了將收取每小時租用費的活動空間以外。不過，對於任何出示本地居住證明的人，將提供這項費用的折扣。— [3] —。</p><p>關於這個計畫的更多資訊可以在 www.springdale.gov/communitycenter 找到。— [4] —。我們鼓勵居民上網站提出對於中心名稱的主意。獲選的名稱將在中心開幕前公布。</p></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>172-175 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Mazzi 牛奶東山再起</h2><p>奈洛比，10 月 4 日— 在首次出現在商店貨架上的數十年後，Mazzi 重新成為注目焦點。根據製造該產品的 Kamba 食品公司昨天發表的業績，這種甜味牛奶的銷售額在 9 月上升了 32%。</p><p>Kamba 食品公司執行長 Roger Bivott 表示：「傳統上，我們沒有對 Mazzi 投資太多。這項產品一開始很成功，但銷售額隨著時間過去而慢慢停止上升。」</p><p>根據 Food Web Africa 市場分析師 Sophie Oduya 的說法，Kamba 食品公司回應了地區性的趨勢。「越來越多人想要能在超市或便利商店購買、既快速又方便的東西。所以 Mazzi 經歷強勁的銷售情況不令人意外。」以現在仍然可以買到的原始形式，消費者必須把水加入 Mazzi 的粉末。新流行的 Mazzi 則是瓶裝，馬上就可以喝。</p><p>Bivott 先生表示新的 Mazzi 幫助將 Kamba 食品公司今年的總銷售額推升了 4.1%。雖然（銷售額增幅）稍微低於去年的數字，但股票分析師們相信年底的業績將高出許多。目前為止，股價在業績發表後已經上升 3.6%。</p></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-web\"><div class=\"doc-ribbon\"><span>◎ WEBSITE</span><small>176-180 · 1/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Chesterville 市 商用自行車使用</h2><p>自行車騎士可配送食物、郵件與其他物品至全市各地。為幫助減少交通阻塞及避免交通問題，現已實施以下針對自行車騎士與其雇用業者之法律。</p><p>對於業者之規定事項<br/>• 業者必須確保自行車騎士取得市政府交通局發行之商用自行車使用許可。許可證將有 3 位數識別號碼。<br/>• 必須向自行車騎士提供保護頭盔與顯示業者名稱及員工識別號碼的反光背心。<br/>• 業者必須保有所有現任與曾任自行車騎士之人員名單，並定期更新。名單樣版可於此處下載。</p><p>對於自行車騎士之規定事項<br/>• 工作時，商用自行車騎士必須攜帶包含識別號碼的卡片。<br/>• 商用自行車騎士個人有責任修畢 Chesterville 市的自行車安全課程。可於此處免費上課。</p><p>處罰<br/>不遵守以上任何規定，將遭罰款 100 元。若再犯相同規定，罰金將加倍為 200 元。</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>▦ FORM</span><small>176-180 · 2/2</small></div><div class=\"document-body\"><h4>商用自行車騎士名單</h4><h4>業者／地址：East Street 餐廳，East 街 367 號，Chesterville 市</h4><div class=\"doc-table-wrap\"><table class=\"doc-table\"><tr><th>姓名：</th><th>Tony Esposito</th></tr><tr><td>識別號碼：</td><td>983</td></tr><tr><td>地址：</td><td>26 Lauder Street, Chesterville</td></tr><tr><td>自行車安全課程修畢：</td><td>是</td></tr><tr><td>值班時間：</td><td>週一至週五上午 8 點至下午 3 點</td></tr><tr><td>備註：</td><td>週末時段可依要求提供</td></tr><tr><td>姓名：</td><td>Gina Doncaster</td></tr><tr><td>識別號碼：</td><td>979</td></tr><tr><td>地址：</td><td>745 Cranston Lane, Chesterville</td></tr><tr><td>自行車安全課程修畢：</td><td>是</td></tr><tr><td>值班時間：</td><td>週一至週五下午 3 點至晚上 9 點；週六上午 8 點至下午 3 點</td></tr><tr><td>備註：</td><td>最後一張薪水支票於 8 月 30 日發放</td></tr><tr><td>姓名：</td><td>Freddy Velasquez</td></tr><tr><td>識別號碼：</td><td>993</td></tr><tr><td>地址：</td><td>347 Prescott Boulevard, Chesterville</td></tr><tr><td>自行車安全課程修畢：</td><td>否</td></tr><tr><td>值班時間：</td><td>週一至週五下午 3 點至晚上 9 點；週六上午 8 點至下午 3 點</td></tr><tr><td>備註：</td><td>可能可以加班</td></tr></table></div></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement\"><div class=\"doc-ribbon\"><span>▣ ADVERTISEMENT</span><small>181-185 · 1/2</small></div><div class=\"document-body\"><p>ADBG 第 10 屆年度棒球賽<br/>6 月 23 日<br/>Portez 體育場，亞特蘭大，喬治亞州</p><h4>過去 10 年，亞特蘭大市中心商業團體（ADBG）棒球賽一直是個有吸引力的方式，為小企業主提供在本地社會宣傳與行銷自身的機會。ADBG 很樂意提供這場募款球賽的以下各級贊助方案：</h4><div class=\"doc-table-wrap\"><table class=\"doc-table\"><tr><th>贊助等級</th><th>價格</th><th>回饋</th></tr><tr><td>一壘</td><td>250 元</td><td>張貼於體育場入口的 24x36 吋公司海報</td></tr><tr><td>二壘</td><td>500 元</td><td>一壘等級的回饋；設置於售票處的 5x2 呎公司展示架</td></tr><tr><td>三壘</td><td>750 元</td><td>二壘等級的所有回饋；懸掛於棒球場的 4x5 呎公司橫幅廣告</td></tr><tr><td>本壘</td><td>1,000 元</td><td>三壘等級的所有回饋；觀眾席旁的 10x12 呎廣告看板；印在其中一隊制服上的公司標誌</td></tr></table></div><h4>如果您有興趣成為贊助者，請寄 treynolds@adbg.org 聯絡我們的辦公室經理 Tessa Reynolds。</h4></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>181-185 · 2/2</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Rajiv Patel rajiv.patel@nstflorists.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Tessa Reynolds treynolds@adbg.org</strong></div><div class=\"doc-field\"><span>日期</span><strong>4 月 30 日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>謝謝</strong></div></div><p>親愛的 Patel 先生：</p><p>謝謝您登記 North Street 花店成為即將到來的棒球賽的贊助者。我很高興得知您過去幾年對這個活動的贊助，對您的事業有所助益。</p><p>我收到了您用電子郵件寄給我的設計，也已經轉寄給製作廣告橫幅的公司。廣告橫幅印製出來之後，會被送到您提供的地址。不過，我們昨天討論時，我忘了問您一個問題。自願出賽的兩隊是 Atlanta Bears 和 Charleston Raptors。</p><p>關於哪一隊穿上您的標誌（穿著有公司標誌的球衣），您有偏好嗎？請儘快告訴我。謝謝！</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>186-190 · 1/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Catherine Millstone catherinemillstone@drexco.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Ron Pruitt ronpruitt@drexco.com</strong></div><div class=\"doc-field\"><span>主旨</span><strong>你的實習</strong></div><div class=\"doc-field\"><span>日期</span><strong>8 月 13 日</strong></div></div><p>親愛的 Catherine：</p><p>我相信你已經知道，你在 Drexco 公司廣告部門的實習將在 9 月 3 日結束。在與我們共事的期間，你很努力，也認真對待工作。所以，我想提供這裡的初階創意統籌這個正式全職職位給你。請花點時間仔細考慮這個工作機會。我今天會出發前往參加明天開始的媒體大會，星期五會回來。希望你到時候能來我的辦公室，告訴我你的決定。</p><p>Ron Pruitt<br/>廣告部長</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>186-190 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Ginger Rollins gingerrollins@drexco.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Harry Shute harryshute@drexco.com</strong></div><div class=\"doc-field\"><span>主旨</span><strong>廣告部職缺</strong></div><div class=\"doc-field\"><span>日期</span><strong>8 月 16 日</strong></div></div><p>親愛的 Rollins 小姐：</p><p>Ron Pruitt 今天剛從洛杉磯的大會回來了，我跟他談了關於初階創意統籌職缺的事。看起來，雖然他向一位實習生提出了這個工作機會，但她因為下個月要回學校上研究所而拒絕了。</p><p>Pruitt 先生提到，他可能會把工作機會給他的另一位實習生，但要等到 9 月 3 日進行了一些評估以後。如果 Pruitt 先生決定不給出這個工作機會，你可以在求職網站發一些廣告。如果我們繼續進行並雇用外部的人選，這個人必須接受我們的性向測驗。但請注意，這不適用於升職的實習生（升職的實習生不需要做性向測驗）。</p><p>謝謝</p><p>Harry Shute<br/>人事部長</p></div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>186-190 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Drexco 公司廣告部門全體員工</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Ron Pruitt</strong></div><div class=\"doc-field\"><span>主旨</span><strong>明天</strong></div><div class=\"doc-field\"><span>日期</span><strong>9 月 11 日</strong></div></div><p>我很高興宣布 Wendy Sommers 將成為我們的初階創意統籌。根據她的性向測驗分數，我相信她會是我們部門很有價值的新人。她明天會開始在我們的辦公室工作，我想做些什麼來讓她感覺到歡迎。我在想，我們可以一下班就去附近的餐廳，所以如果有偏好的餐廳，請在今天下午 5 點前告訴我。</p><p>Ron Pruitt</p></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>191-195 · 1/3</small></div><div class=\"document-body\"><p>Fitness Friends 公司 備忘錄</p><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>測試部</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Ed Burtoft</strong></div><div class=\"doc-field\"><span>日期</span><strong>8 月 2 日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>Z-Model 的研究</strong></div></div><p>我們最新款健康追蹤器的相關工作進行得很順利，我們目前以暫定名 Z-Model 稱呼它。行銷負責人 Signe Jepsen 分享了這款產品最終可能名稱的候選名單，這些名稱包括 Trail Blazer 和 Split Second 等等。如果行銷部無法在 8 月 11 日前做出名稱的最終決定，我們就會向問卷調查回答者詢問意見。</p><p>星期四，大家會從研究部那收到 Z-Model 的原型以供測試。但首先，我們必須確定測試者的名單。當我瀏覽我們的測試時間表，我注意到他們全都是 20 或 30 幾歲。我希望至少有一兩個測試者是 40 或 50 幾歲，以獲得較年長使用者的反應。</p></div></section><section class=\"document-card type-table\"><div class=\"doc-ribbon\"><span>▦ SCHEDULE</span><small>191-195 · 2/3</small></div><div class=\"document-body\"><h4>Z-Model 測試時間表</h4><div class=\"doc-table-wrap\"><table class=\"doc-table\"><tr><th>時間</th><th>測試者</th><th>年齡與性別</th><th>地點</th><th>活動</th><th>關注重點</th></tr><tr><td>上午9:30</td><td>Dorothy Glen</td><td>57 歲／女</td><td>Grand 公園</td><td>步行</td><td>測試心率功能</td></tr><tr><td>上午11:30</td><td>Farid Saman</td><td>23 歲／女</td><td>Caribou 湖</td><td>跑步</td><td>測試配速功能</td></tr><tr><td>下午2:30</td><td>Michael Flint</td><td>37 歲／男</td><td>Parklane 社區游泳池</td><td>游泳</td><td>測試防水</td></tr><tr><td>下午4:30</td><td>Pat Durban</td><td>32 歲／女</td><td>Oak 山</td><td>騎自行車</td><td>測試抗衝擊能力</td></tr></table></div></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>▦ FORM</span><small>191-195 · 3/3</small></div><div class=\"document-body\"><h4>測試者問卷調查</h4><h4>姓名：Michael Flint</h4><h4>您已經測試了我們下一款健康追蹤器的原型，所以我們想進一步了解您的印象。</h4><p>這項產品戴起來很舒服。<br/>非常同意／同意／不同意也不反對／不同意／非常不同意</p><p>這項產品容易使用。<br/>非常同意／同意／不同意也不反對／不同意／非常不同意</p><p>您喜歡這項產品的什麼地方？<br/>用側邊的按鈕改變顯示資訊很簡單。電池似乎可以持續很久——在我 60 分鐘的運動開始時是 98%，而在我結束時降到 90%。</p><p>您不喜歡這項產品的什麼地方？<br/>就算把腕帶調到最緊，我還是覺得在我的手腕上鬆鬆的。每次我舉起左手臂，健康追蹤器就會滑動，這讓人感覺不舒服。</p><p>您認為這項產品應該叫什麼？<br/>Trail Blazer / Split Second / Mad Dash / Fast Track</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>196-200 · 1/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Verta 公司召回吸塵器</h2><p>家電製造商 Verta 公司已經要求（消費者）將 5,000 台吸塵器帶到服務中心檢查。根據 Verta 公司的說法，召回的型號 Zurupat A7 內含有缺陷的零件。Verta 公司的產品設計師 Bryce Gooding 表示：「這個問題可能導致設備過熱。幸好，還沒有顧客報告意外事故（發生）。」</p><p>Verta 公司透露，這個問題之所以發生，是因為新生產吸塵器的測試執行得不徹底。為了解決這個情況，該公司已經決定 11 月 3 日停止在所有工廠的生產。</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>196-200 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Kenneth Sheeran k_sheeran@bgwgroup.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Deanna Clark d_clark@bgwgroup.com</strong></div><div class=\"doc-field\"><span>主旨</span><strong>吸塵器</strong></div><div class=\"doc-field\"><span>日期</span><strong>10 月 30 日</strong></div><div class=\"doc-field\"><span>附件</span><strong>Verta_檢查_通知</strong></div></div><p>嗨，Kenneth：</p><p>我今天收到通知，我們為總部購買的所有 Zurupat A7 吸塵器都必須送到 Verta 公司的服務中心。似乎是其中一個零件有問題，雖然在我們有吸塵器的 6 個月期間，沒有人報告過有問題。</p><p>附上的通知包含製造商的聯絡資訊。請撥打 Westland 地區的服務電話號碼，具體了解必須把吸塵器送到哪裡。我不確定 Blythville 這裡有沒有 Verta 公司的服務中心，所以 BGW Group 的員工可能必須把它們送到其他城市。不管怎樣，請盡快告訴我，好讓我能把必要的資訊提供給相關員工。</p><p>Deanna Clark，辦公室管理人<br/>BGW Group</p></div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>196-200 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>全體員工</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Ben Aduba，Westland 地區經理，Verta 公司</strong></div><div class=\"doc-field\"><span>日期</span><strong>10 月 28 日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>最新消息</strong></div></div><p>如同各位所知，我們會停止生產一天。在這段時間，我會教導工廠員工新的測試程序。我也收到了人們可以把他們的 Zurupat A7 吸塵器送去檢查的地點列表。回答詢問的時候，請務必參考列表，為顧客提供資訊。</p><div class=\"doc-table-wrap\"><table class=\"doc-table\"><tr><th>城市</th><th>Verta 公司服務中心地點</th></tr><tr><td>East Granyard</td><td>Van Dam 大街 367 號</td></tr><tr><td>Bellmeadow</td><td>Southhaven 圓環 184 號</td></tr><tr><td>Blythville</td><td>Marina 大道 2956 號</td></tr><tr><td>Woodebourne</td><td>Campus 路 5631 號</td></tr></table></div></div></section></div>"};const DETAILED_EXPLANATIONS={"101":{"type":"【可以接在 be 動詞後面的成分】進行式（be + -ing）","translation":"前房客會在今天下午稍晚的時候把建築物清空。","reason":"正確答案：(C) vacating。 空格接在 be 動詞（be）後面，所以能形成被動態的 p.p. 形 (A)、名詞 (B)、能形成進行式的 -ing 形 (C) 是可能的答案。因為空格後面有受詞，而且要表達「前房客會把建築物清空」，所以能和 be 動詞一起構成進行式的 -ing 形 (C) vacating 是正確答案。p.p. 形 (A) 可以和空格前面的 be 動詞（be）構成被動態，但這時候後面不能再接受詞。名詞 (B) 可以接在 be 動詞後面，但作為補語，表示和主詞相同的人或事物，也就是「前房客會是空位」，所以不對。動詞原形 (D) 不能接在 be 動詞後面。","vocab":"vacate v. 清空，空出（建築物、房間等）　vacancy n. 空位，空缺","paraphrase":""},"102":{"type":"【補語位置】反身代名詞","translation":"在第一次專案會議開始時，組員對彼此自我介紹。","reason":"正確答案：(D) themselves。 空格是動詞（introduced）的受詞位置，所以人稱代名詞 (B) 和反身代名詞 (D) 是可能的答案。因為要表達「組員對彼此自我介紹」，所以表示受詞和主詞（Team members）相同的反身代名詞 (D) themselves 是正確答案。如果只是使用受格人稱代名詞 (B) them，意思就變成「組員對彼此介紹他們（不是組員的其他人）」，所以不對。主格人稱代名詞 (A) they 和所有格人稱代名詞 (C) their 不能當受詞。另外，請記得 introduce oneself（自我介紹）這個慣用說法。","vocab":"one another phr. 彼此","paraphrase":""},"103":{"type":"副詞位置","translation":"多虧市議會的預算有剩餘，今年改建 Davondale 橋肯定是有可能的。","reason":"正確答案：(C) certainly。 空格修飾後面的形容詞（possible），所以副詞 (C) certainly（當然，毫無疑問地）是正確答案。形容詞 (A)、名詞 (B) 和 (D) 不能修飾形容詞。","vocab":"surplus n. 剩餘，餘額　certain adj. 確定的　certainty n. 確定的事　certitude n. 確定，確信","paraphrase":""},"104":{"type":"名詞子句連接詞 疑問詞 why","translation":"持票者得到了退款，但沒有被告知演唱會為什麼被取消。","reason":"正確答案：(A) why。 空格前面的動詞 tell（告訴，向 A 說 B 這件事）是可以接兩個受詞的第 4 類句型動詞，在它的被動態句子裡，間接受詞（Ticket holders）成為主詞，所以 ~ canceled 是直接受詞。直接受詞的部分有子句（~ canceled），其中有完整的主詞（the concert）與動詞（had been canceled）結構，所以後面可以接完整名詞子句的疑問副詞 (A) 和 (B) 是可能的答案。因為要表達「沒有被告知演唱會為什麼被取消」，所以疑問副詞 (A) why（為什麼）是正確答案。如果使用疑問副詞 (B) where（在哪裡），意思會變成「沒有被告知演唱會在哪裡被取消」，所以不對。疑問代名詞 (C) who 和 (D) which 後面會接缺少了主詞、受詞或補語的子句。就算把 (D) which 當成疑問形容詞，修飾後面的名詞（the concert）、引導子句也不行，因為它應該直接接在名詞 concert 前面，中間不會插入冠詞（the）。","vocab":"refund n. 退款 v. 退款","paraphrase":""},"105":{"type":"動詞詞彙","translation":"為了宣傳 Gaspard Carlock 的人偶秀，將在市內各地張貼廣告。","reason":"正確答案：(B) posted。 句意是「在市內各地張貼廣告」，所以動詞 post（張貼）的 p.p. 形 (B) posted 是正確答案。(A) pack 表示「包裝」，(C) price 表示「定價」，(D) practice 表示「練習」。","vocab":"puppet show phr. 人偶秀，布偶戲","paraphrase":""},"106":{"type":"【受詞位置】動名詞 vs. 名詞","translation":"因為這兩個節目有一些相似要素，所以觀眾會把兩者互相比較。","reason":"正確答案：(A) comparisons。 空格是及物動詞（have drawn）的受詞位置，所以名詞 (A) 和有名詞功能的動名詞 (B) 是可能的答案。因為要表達「觀眾把兩者互相比較」，所以能和空格前面的 draw 構成 draw comparisons（互相比較）的 (A) comparisons（比較）是正確答案。如果使用動詞 compare（比較）的動名詞形 (B) comparing 的話，就只是「劃定比較行為」而已，不是正確的表達方式。形容詞 (C) 和 (D) 不能當受詞。","vocab":"element n. 要素，元素　comparative adj. 比較的　comparable adj. 可比較的，比得上的","paraphrase":""},"107":{"type":"副詞選擇","translation":"參加者覺得 Offenburg 社區中心提供的電腦個別指導很有幫助。","reason":"正確答案：(C) quite。 因為要表達「覺得電腦個別指導很有幫助」，所以副詞 (C) quite（相當，很）是正確答案。(A) fast 表示「快速地」，(D) soon 表示「不久，很快」。(B) enough（足夠地）當副詞時，是在形容詞（helpful）後面做修飾才對。另外，請注意這個句子使用後面可接受詞和受詞補語的第 5 類句型動詞 find，它的受詞是 the computer ~ Center，受詞補語是 to be ~ helpful。","vocab":"tutorial n. 個別指導","paraphrase":""},"108":{"type":"動詞慣用表達方式","translation":"為了找到他的印表機型號，Jansen 先生把它翻過來查看底部。","reason":"正確答案：(D) over。 因為要表達「把印表機翻過來查看底部」，所以能和空格前面的動詞 turn 構成 turn over（把……翻過來）的介系詞 (D) over 是正確答案。(A) past 表示「經過，通過……」，(B) against 會構成 turn against「反對……」，(C) 會構成 turn in（提交……），意思都不恰當。","vocab":"bottom n. 底部","paraphrase":""},"109":{"type":"【動詞位置】時態一致","translation":"Earth Preserve 公司希望每個人都會在下週舉辦的募款活動捐獻。","reason":"正確答案：(B) will contribute。 that 子句（that ~ week）只有主詞（everyone），還缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。因為有表示未來時間的詞語（in the coming week），所以未來式 (B) will contribute 是正確答案。過去式 (C)、過去完成式 (D) 不能搭配表示未來時間的詞語使用。動名詞或現在分詞 (A) 不能當動詞。另外，請注意 held in the coming week 修飾先行詞（a fund-raiser）。","vocab":"fund-raiser n. 募款活動　contribute v. 捐贈，貢獻","paraphrase":""},"110":{"type":"介系詞選擇 時間點","translation":"由於溫暖的天氣，當地幾間滑雪度假屋把開始營業日期延到 11 月中了。","reason":"正確答案：(C) until。 因為要表達「幾間滑雪度假屋把開始營業日期延到 11 月中」，所以表示時間點的介系詞 (C) until（直到……為止）是正確答案。(A) about 表示「關於……」，(B) despite 表示「儘管……」，(D) across 表示「跨越……」。","vocab":"","paraphrase":""},"111":{"type":"名詞","translation":"有些員工可能必須在專案的最後階段加班工作。","reason":"正確答案：(C) phase。 句意是「可能必須在專案的最後階段加班工作」，所以名詞 (C) phase（階段）是正確答案。(A) figure 表示「數字」。(B) judgment 表示「判斷」。(D) piece 表示「一片」。","vocab":"overtime n. 加班","paraphrase":""},"112":{"type":"副詞位置","translation":"副詞位置","reason":"正確答案：(B) progressively。 空格修飾後面的形容詞比較級（harder），所以副詞 (B) progressively（逐漸地）是正確答案。形容詞 (A)、名詞或動詞 (C)、動詞或過去分詞 (D) 不能修飾形容詞。","vocab":"vocabulary n. 詞彙（總）　section n. 部分　progressive adj. 逐漸的　progress n. 進行 v. 進行","paraphrase":""},"113":{"type":"【形容詞位置】最高級","translation":"【形容詞位置】最高級","reason":"正確答案：(C) roughest。 空格修飾後面的名詞（trail），所以形容詞 (B)、(C)、(D) 是可能的答案。因為要表達「Vigneux 小姐走過最崎嶇的登山步道位於某座國家公園」，而且空格前面有定冠詞（The），所以形容詞 rough（高低不平的，崎嶇的）的最高級 (C) roughest 是正確答案。另外，請記得最高級經常和強調最高級的副詞 ever（在任何時候，至今）連用。比較級 (B) 會搭配 than 使用，表示兩者之中的一方程度較高。原級 (D) 的意思是「Vigneux 小姐走過的步道中那條崎嶇的」，但走過的崎嶇步道應該不會只有一條，所以不對。副詞 (A) 不能修飾名詞。","vocab":"trail n. （山林中的）小徑　national park phr. 國家公園　roughly adv. 大約","paraphrase":""},"114":{"type":"副詞","translation":"副詞","reason":"正確答案：(C) solely。 句意是「獨佔合約造成的結果是，特定飲料只能在 Duggarti Foods 買到」，所以 (C) solely（僅，唯獨）是正確答案。(A) densely 表示「密集地」，(B) fully 表示「完全地，充分地」，(D) fairly 表示「相當，頗為」。","vocab":"exclusivity agreement phr. 獨佔合約　available adj. 可得的，買得到的","paraphrase":""},"115":{"type":"【名詞位置】人物名詞 vs. 抽象名詞","translation":"【名詞位置】人物名詞 vs. 抽象名詞","reason":"正確答案：(D) audit。 空格前面接冠詞（the），而且是介系詞（during）的受詞，所以名詞 (A) 和 (D) 是可能的答案。因為要表達「會計部員工在查帳期間不得不工作比較長的時間」，所以抽象名詞 (D) audit（查帳）是正確答案。如果使用人物名詞 (A) auditor（查帳者），意思會變成「會計部員工在查帳者期間不得不工作比較長的時間」，所以不對。形容詞 (B)、動詞或過去分詞 (C) 不能用在名詞位置。","vocab":"accounting n. 會計　nearly adv. 將近，幾乎　auditorial adj. 查帳的　audit n. 查帳 v. 查帳","paraphrase":""},"116":{"type":"形容詞","translation":"雖然原本的研究結果暗示這種藥物有效，但進一步研究證實並非如此。","reason":"正確答案：(D) original。 句意是「原本的研究結果暗示藥物有效，但進一步研究證實並不是」，所以 (D) original（原始的，原本的）是正確答案。(A) congested 表示「擁擠的，堵塞的」。(B) upcoming 表示「即將到來的」。(C) hazardous 表示「危險的」。","vocab":"finding n. （調查、研究等的）結果　suggest v. 暗示　medication n. 藥物　effective adj. 有效的　further adj. 進一步的　prove v. 證明　otherwise adj. 完全不是那樣的","paraphrase":""},"117":{"type":"現在式","translation":"如果 Alton 先生預先登記報名會議，就會得到入場費 15% 的折扣。","reason":"正確答案：(A) registers。 If 子句（If ~ advance）缺少動詞，而每個選項都是動詞，所以都是可能的答案。主要子句（he ~ admission）的動詞（will receive）是未來式，而且要表達「預先登記報名會議，就會得到入場費的折扣」的意思，而在 if 引導的從屬子句（條件副詞子句）中，會用現在式表示未來（而不是用未來式），所以現在式 (A) registers 是正確答案。過去完成式 (B)、未來式 (C)、過去式 (D) 不能用在表示未來的條件副詞子句裡。","vocab":"in advance phr. 預先，事先　admission n. 入場，入場費　register v. 登記（報名）","paraphrase":""},"118":{"type":"【名詞位置】可數名詞與不可數名詞","translation":"Isaac 先生管理這間店，而他的職責包括處理員工關切的事。","reason":"正確答案：(D) responsibilities。 空格被前面的所有格人稱代名詞（his）修飾，所以名詞 (C) 和 (D) 是可能的答案。因為空格後面的動詞（include）是複數形，而且要表達「他的職責包括處理員工關切的事」，這裡的 responsibility 表示「職責」，是可數名詞，所以複數形 (D) responsibilities 是正確答案。單數形 (C) 必須搭配單數動詞使用。形容詞 (A) 和 (B) 不能用在名詞位置。另外，請記得 responsibility 表示「職責」時是可數名詞，表示「負責」時則是不可數名詞。","vocab":"manage v. 管理，經營　handle v. 處理　concern n. 關心，關心的事　responsive adj. 反應的，回答的　responsible adj. （對於……）負有責任的","paraphrase":""},"119":{"type":"動詞詞彙","translation":"動詞詞彙","reason":"正確答案：(D) nominated。 句意是「董事指定同事擔任繼任者」，所以動詞 nominate（任命，指定）的過去形 (D) nominated 是正確答案。(A) consent（同意）意思好像說得通，但它應該搭配 to 使用，表示「同意……這件事」。(B) estimate（評價）只看中文意思好像也解釋得通，但這個動詞可以「評價」的是人的個性、能力等方面，而不是人本身，所以不對。(C) amend 表示「修訂，修正」。","vocab":"ahead of phr. 在……之前　retirement n. 退休　colleague n. 同事　successor n. 繼任者","paraphrase":""},"120":{"type":"介系詞","translation":"介系詞","reason":"正確答案：(D) on。 句意是「公司新的工作場所安全政策在明天會議的議程中佔有重要地位」，所以能和形容詞 high 結合成 high on the agenda（在議程中佔有重要地位）的介系詞 (D) on 是正確答案。","vocab":"workplace safety policy phr. 工作場所安全政策　agenda n. 議程","paraphrase":""},"121":{"type":"動詞慣用表達方式","translation":"動詞慣用表達方式","reason":"正確答案：(B) serves。 句意是「全國醫學協會會長也擔任一家私人醫院的院長」，所以能和空格後面的 as 構成 serve as（擔任……）的動詞 (B) serves 是正確答案。(A) accept 表示「接受」，(C) answer 表示「回答」，(D) regard 表示「認為」。","vocab":"association n. 協會　director n. 院長，主任","paraphrase":""},"122":{"type":"副詞","translation":"副詞","reason":"正確答案：(B) strongly。 句意是「學生強烈主張中央圖書館應該翻修」，所以副詞 (B) strongly（強烈地）是正確答案。(A) immeasurably 表示「無法計量地」，(C) mutually 表示「互相地」，(D) inadvertently 表示「不經意地」。","vocab":"argue for phr. 主張……　renovation n. 翻修","paraphrase":""},"123":{"type":"【引導修飾性語句的成分】副詞子句連接詞 時間","translation":"【引導修飾性語句的成分】副詞子句連接詞 時間","reason":"正確答案：(C) Before。 這個句子已經有具備主詞（new employees）和動詞（must provide）的完整子句，所以 ~ they are entered into the payroll system 是修飾性的語句。修飾部分有主詞（they）和動詞（are entered），所以能引導修飾子句的副詞子句連接詞 (A) 和 (C) 是可能的答案。因為要表達「新員工在被輸入薪資系統之前，必須提供財務部一些銀行資訊」，所以表示時間的副詞子句連接詞 (C) Before（在……之前）是正確答案。(A) As if 表示「彷彿……」，意思不恰當。介系詞 (B) During（在……期間）和 (D) Instead of（而不是……）不能引導修飾子句。","vocab":"payroll system phr. 薪資系統　finance department phr. 財務部","paraphrase":""},"124":{"type":"【引導修飾性語句的成分】副詞子句連接詞","translation":"你一旦填好這張表，就請您把它拿到櫃台並交給秘書。","reason":"正確答案：(A) Once。 這個句子的主要子句是沒有主詞的祈使句，已經具備動詞（bring, leave）和受詞（it），是完整的子句，所以 ~ form 是修飾性的語句。修飾部分有動詞（complete），所以能引導修飾子句的連接詞 (A) 和 (C) 是可能的答案。因為要表達「填好表後交給秘書」，所以表示時間的副詞子句連接詞 (A) Once（一……就～，一旦……）是正確答案。使用 (C) Since（由於……）的話，意思會變成「由於你（平常都、習慣……）填好這張表，要交給秘書」，所以不對。對等連接詞 (B) Or（或）、形容詞或代名詞 (D) Either（（兩個之中的）任何一個）不能引導修飾性語句。","vocab":"complete v. 填好（表單等）　leave with phr. 把東西交給……　secretary n. 秘書","paraphrase":""},"125":{"type":"【形容詞位置】現在分詞 vs. 過去分詞","translation":"由於原型的成功，這位發明家目前在創新方面的名聲越來越大。","reason":"正確答案：(B) growing。 空格修飾後面的名詞（reputation），所以有形容詞功能的過去分詞 (A) 和現在分詞 (B) 是可能的答案。因為被修飾的名詞（reputation）和分詞表示「增加中的名聲」的主動意義，所以現在分詞 (B) growing 是正確答案。如果使用過去分詞 (A) grown 的話，雖然意思好像也說得通，但 grow 表示「增加」是不及物動詞的用法，所以不能使用表示被動的過去分詞。grown 雖然也有形容詞用法「（因為發育等等而）長大了的，成熟的」，但「長大了的名聲」仍然不恰當。名詞 (C) 和 (D) 不能修飾名詞。","vocab":"prototype n. 原型，樣品　inventor n. 發明者　reputation n. 名 document.addEventListener('keydown', function(event) {

  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      target?.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(target?.tagName)) return;
  if (window.getSelection()?.toString()) return;
  // 鍵盤：←／Z 上一題，→／X 下一題；輸入欄位和文字選取時不啟用。
  const key = event.key.toLowerCase();

    event.preventDefault(); $('#next').click();
  } else if ((key === 'arrowleft' || key === 'z') && !$('#prev').disabled) {
    event.preventDefault(); $('#prev').click();

});

let swipeStart = null;
const swipeArea = '#quiz .stem, #quiz .answers, #quiz .feedback, #quiz .undo-answer-row';
const quizTouch = document.getElementById('quiz');
quizTouch.addEventListener('touchstart', event => {
  swipeStart = null;
  if (event.touches.length !== 1 || !event.target.closest(swipeArea)) return;
  if (event.target.closest('a, input, textarea, select')) return;
  const touch = event.touches[0];
  swipeStart = {x:touch.clientX, y:touch.clientY, time:Date.now()};
}, {passive:true});
quizTouch.addEventListener('touchend', event => {
  if (!swipeStart || event.changedTouches.length !== 1) {swipeStart=null;return;}
  const start = swipeStart; swipeStart=null;
  const touch=event.changedTouches[0];
  const dx=touch.clientX-start.x, dy=touch.clientY-start.y;
  // 至少水平移動 65px，且水平位移須明顯大於垂直位移。
  if (Math.abs(dx)<65 || Math.abs(dx)<Math.abs(dy)*1.6 || Date.now()-start.time>1500) return;
  if (window.getSelection()?.toString()) return;
  if (dx<0 && !$('#next').disabled) $('#next').click();

}, {passive:true});

$('#importCsv').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCsv(await file.text());if(!rows.length||rows[0].slice(0,6).join('|')!==CSV_HEADER.join('|'))throw Error('欄位格式不符，請使用本網站匯出的 CSV');const incoming={};for(let i=1;i<rows.length;i++){const r=rows[i],id=Number(r[0]),q=QS.find(x=>x.id===id),choice=(r[2]||'').trim();if(r.length<6||!q||!/[A-D]/.test(choice)||choice.length!==1||String(q.part)!==r[1].trim())throw Error('第 '+(i+1)+' 列的題號、Part 或選項有誤');if(r[3].trim()!==q.answer)throw Error('第 '+(i+1)+' 列答案版本不同，已停止匯入');incoming[id]={choice,correct:q.answer?choice===q.answer:null,at:r[5]||''}}const count=Object.keys(incoming).length;if(!confirm('CSV 有 '+count+' 筆有效作答紀錄。匯入後會覆蓋相同題號的現有作答，其餘題目保留。是否繼續？'))return;await window.toeicCloud.importAnswers(incoming);mode='all';index=0;setTabs();render();alert('已成功匯入 '+count+' 筆紀錄。')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};render();

<script>
/* Browser-offline fallback: Firebase is optional, local practice always works. */
(function(){
  if(window.toeicCloud) return;
  function persist(){
    localStorage.setItem(LOCAL_KEY,JSON.stringify(records));
    localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));
    localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts));
  }
  window.toeicCloud={ready:true,mode:'local',
    saveAnswer:async(id,data)=>{records[id]=data;persist();render()},
    deleteAnswer:async(id)=>{delete records[id];persist();render()},
    setStar:async(id,marked)=>{if(marked)stars[id]=true;else delete stars[id];persist();render()},
    saveExcerpts:async(id,items)=>{if(items.length)excerpts[id]=items;else delete excerpts[id];persist();render()},
    importAnswers:async(items)=>{records={...records,...items};persist();render()},
    resetAnswers:async()=>{records={};persist();render()}
  };
})();
</script>
<script id="reading-gate-script">(function(){const gate=document.getElementById('readingAccessGate'),input=document.getElementById('rgCode'),button=document.getElementById('rgEnter'),status=document.getElementById('rgStatus'),notice=document.getElementById('cloudNotice'),account=document.getElementById('accountCode');function lock(){document.body.classList.add('read-locked');gate.hidden=false;button.disabled=false}function unlock(){document.body.classList.remove('read-locked');gate.hidden=true;button.disabled=false}window.readingGate={lock,unlock};button.addEventListener('click',()=>{const code=input.value.trim();if(!code||code.length>32){status.textContent='請輸入使用者代號。';return}account.value=code;button.disabled=true;status.textContent='正在驗證代號並載入 Firebase 雲端資料…';document.getElementById('connectCode').click()});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();button.click()}});const observer=new MutationObserver(()=>{if(!gate.hidden){status.textContent=notice.textContent||'正在驗證…';if(!/正在載入|連線中|請不要作答/.test(notice.textContent))button.disabled=false}});observer.observe(notice,{childList:true,characterData:true,subtree:true});lock()})();</script><script type="module">

cloud.importAnswers=async(items)=>{if(!activeCode){records={...records,...items};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const entries=Object.entries(items);for(let i=0;i<entries.length;i+=400){const batch=writeBatch(db);for(const [id,data] of entries.slice(i,i+400))batch.set(doc(root('answers'),id),data);await batch.commit()}};
