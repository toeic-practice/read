頁</a><a class="exam-link" href="exam.html" title="前往第七回擬真模擬考（100 題計時測驗）">📝 擬真試題</a></div><p id="cloudNotice" role="status" class="small">未輸入代號：使用本機暫存。</p></section><header><h1>TOEIC 多益線上練習｜第七回</h1></header><section class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="right">0</b><span>答對</span></div><div class="stat"><b id="wrong">0</b><span>答錯</span></div><div class="stat"><b id="accuracy">0%</b><span>正確率</span></div></section><div class="toolbar"><select id="part"><option value="all">全部 Part</option><option value="5">Part 5</option><option value="6">Part 6</option><option value="7">Part 7</option></select><button id="all" class="active">全部題目</button><button id="missed">錯題專項練習 <span id="drillCount"></span></button><button id="starred">★ 星號題目</button><button id="overview">錯題總覽</button><button id="excerptsView" type="button">文字摘錄</button><button id="exportWrong">匯出錯題</button><button id="export">匯出作答 CSV</button><label class="import-button" for="importCsv">匯入作答 CSV</label><input id="importCsv" type="file" accept=".csv,text/csv" hidden><button id="reset">重新作答</button></div><div class="answer-pref"><label for="explainMode">作答後解析：</label><select id="explainMode" aria-label="選擇答題後解析開啟方式"><option value="auto">自動展開</option><option value="manual">點擊展開</option></select><span>解析依第七回答案詳解整理；閱讀文章可切換中英文全文</span></div><section id="drillTools" class="panel" hidden><div class="drill-toolbar"><strong>錯題專項練習</strong><span id="drillInfo"></span><button type="button" id="drillRestart">重新練習全部錯題</button><button type="button" id="drillRemove">手動移除此題</button></div><p class="small">錯題不會因答對而消失；作答後立即顯示正解與詳細解析。此模式完全不修改正式測驗的作答紀錄。</p></section><section id="wrongOverview" class="panel" hidden></section><section id="excerptOverview" class="panel" hidden></section><section id="quiz"></section><button type="button" id="selectionSave" aria-label="儲存選取的文字摘錄">✎ 儲存摘錄</button><div class="nav"><button id="prev">← 上一題</button><button id="next">下一題 →</button></div><section class="panel"><div class="head"><b>題號總覽</b><span class="small">綠色答對・紅色答錯・★ 已標記</span></div><div id="numbers" class="numbers"></div></section></main><script>
const DATA={"questions":[{"id":101,"part":5,"stem":"Ms. Ament called to notify ______ that she would be late for the meeting.","choices":["we","ourselves","our","us"],"answer":"D","explanation":"正確答案：(D) us。可以當及物動詞（notify）受詞的反身代名詞 (B) 和受格人稱代名詞 (D) 是可能的答案。因為要表達「Ament 小姐打電話通知我們，她會遲到會議」，所以受格人稱代名詞 (D) us 是正確答案。如果使用反身代名詞 (B) ourselves，會變成「Ament 小姐打電話通知我們自己」，而且不符合文法。反身代名詞是用在受詞指稱的對象與主詞相同的時候，或者加入句子裡強調主詞或受詞。主格人稱代名詞 (A) 和所有格人稱代名詞 (C) 不能用在受詞位置。"},{"id":102,"part":5,"stem":"Everyone is cordially invited to the grand opening of Camellia Café, which is located ______ the City Hall subway station.","choices":["throughout","about","into","beside"],"answer":"D","explanation":"正確答案：(D) beside。因為要表達「位於地下鐵市政府站旁」，所以表示位置的介系詞 (D) beside（在……旁）是正確答案。(A) throughout 表示位置或期間「遍及……，貫穿……，在……的整個期間」。(B) about 表示「關於……」，(C) into 表示方向「往……裡面」。"},{"id":103,"part":5,"stem":"A personal assistant ______ Ms. Petrovsky's daily schedule every morning after reviewing a list of her appointments.","choices":["update","updates","is updated","updating"],"answer":"B","explanation":"正確答案：(B) updates。句中缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。主詞（A personal assistant）是單數，而且空格後面接受詞（Ms. Petrovsky's daily schedule），所以動詞單數形主動態 (B) updates（更新）是正確答案。動詞複數形 (A) 要搭配複數主詞使用。被動態 (C) 會讓句意變成「個人助理被更新」，所以不對，而且這個被動態後面也不能接受詞。動名詞或現在分詞 (D) 不能用在動詞位置。"},{"id":104,"part":5,"stem":"The resort's watersports equipment may only be rented ______ two hours at a time.","choices":["up to","versus","despite","as of"],"answer":"A","explanation":"正確答案：(A) up to。因為要表達「最多租用兩小時」，所以介系詞 (A) up to（最高……，最多……）是正確答案。(B) versus 表示兩者中相對的對象「對上……」，(C) despite 表示讓步「儘管……」，(D) as of 表示「（時間上）……開始」。"},{"id":105,"part":5,"stem":"Ms. McCabe is a ______ employee who can work without direct supervision.","choices":["capable","capability","capableness","capably"],"answer":"A","explanation":"正確答案：(A) capable。空格要修飾後面的名詞（employee），所以形容詞 (A) capable（有能力的，能幹的）是正確答案。名詞 (B) 和 (C)、副詞 (D) 都不能修飾名詞。就算把名詞 (B) 和 (C) 當成 be 動詞（is）的補語，也會因為缺少連接詞，而無法和空格後面的部分連接起來，所以不對。"},{"id":106,"part":5,"stem":"Mr. Coulter is used to waking up early, so he wants to take the morning shift ______ the night shift.","choices":["instead of","aside","due to","regardless of"],"answer":"A","explanation":"正確答案：(A) instead of。句中包含的子句（he ~ night shift）是已經具備主詞（he）、動詞（wants）和受詞（to take the morning shift）的完整子句，所以 the night shift 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表達「想值早班而不是晚班」，所以介系詞 (A) instead of（而不是……）是正確答案。(C) due to 表示理由「由於……」，(D) regardless of 表示「不管，不顧……」。(B) aside（在旁，到旁）不能引導修飾片語。另外，請記得 aside 如果和 from 結合成 aside from，就可以接名詞而形成表示「除了……以外」的介系詞片語。"},{"id":107,"part":5,"stem":"Investing in safe financial products can protect ______ from experiencing significant losses.","choices":["retire","retiree","retirees","retired"],"answer":"C","explanation":"正確答案：(C) retirees。空格是動詞（protect）的受詞，所以名詞 (B) 和 (C) 是可能的答案。句意是「保護退休者免於重大的損失」，而且空格前面沒有冠詞，所以複數名詞 (C) retirees 是正確答案。單數名詞 (B) 必須加上冠詞。動詞 (A)、動詞或過去分詞 (D) 不能用在受詞位置。"},{"id":108,"part":5,"stem":"Bell Lake Inc. ______ became the largest company in the area when it hired 150 additional employees.","choices":["continuously","commonly","recently","occasionally"],"answer":"C","explanation":"正確答案：(C) recently。句意是「Bell Lake 公司最近成為了這個地區最大的公司」，所以 (C) recently（最近）是正確答案。(A) continuously 表示「持續地」。(B) commonly 表示「經常地，通常」。(D) occasionally 表示「偶爾」。"},{"id":109,"part":5,"stem":"The flight attendant asked that all headphones ______ returned before landing.","choices":["are","be","were","to be"],"answer":"B","explanation":"正確答案：(B) be。主要子句（The flight attendant asked）有表示要求的動詞（asked），所以 that 子句（that all headphones ~ landing）的動詞要使用原形，動詞原形 (B) be 是正確答案。be 動詞的複數形 (A) 和過去形 (C)、to 不定詞 (D) 不能用在動詞原形的位置。"},{"id":110,"part":5,"stem":"Solomo Industries will implement a new quality-control ______ at its main factory.","choices":["process","processing","processed","procession"],"answer":"A","explanation":"正確答案：(A) process。空格是及物動詞（implement）的受詞位置，所以名詞 (A) 和 (D)、有名詞功能的動名詞 (B) 是可能的答案。因為要表達「實施新的品管程序」，所以名詞 (A) process（程序，過程）是正確答案。如果使用 (D) procession（行進隊伍）的話，意思會變成「在工廠實施新的品管行進隊伍」，所以不對。動名詞 (B) 不能接在不定冠詞（a）後面。動詞過去式或過去分詞 (C) 不能用在名詞位置。"},{"id":111,"part":5,"stem":"Maintenance workers cannot ______ fix a machine while the power is still on.","choices":["save","safely","safety","safe"],"answer":"B","explanation":"正確答案：(B) safely。可以用在助動詞（cannot）和動詞原形（fix）之間，並且修飾動詞的副詞 (B) safely（安全地）是正確答案。動詞 (A)、名詞 (C)、形容詞 (D) 都不能修飾動詞。就算把 (A) save（拯救，留下）當成助動詞（cannot）後面的動詞原形，也會因為後面的 fix（修理）不能被視為名詞，而是接受詞（a machine）的及物動詞，而不能形成文法正確的句子。"},{"id":112,"part":5,"stem":"Residents are deeply divided on ______ to support during the next mayoral election.","choices":["that","whom","which","whose"],"answer":"B","explanation":"正確答案：(B) whom。空格之後的部分（~ election）是介系詞 on 的受詞，所以能引導名詞子句，而且後面可以接 to 不定詞的疑問詞 (B)、(C)、(D) 是可能的答案。因為要表達「對於選舉時支持誰，居民的意見非常分歧」，所以受格疑問代名詞 (B) whom（對誰）是正確答案。另外，這個句子使用「疑問詞 + to 不定詞」的結構當名詞子句，但也可以使用「疑問詞 + 主詞 + should + 動詞」的結構，也就是 whom they should support。如果使用 (C) which（哪個東西）、(D) whose（誰的東西）的話，意思會變成「對於選舉時支持哪個東西／誰的東西，居民的意見非常分歧」，所以不對。連接詞 (A) that 雖然也能引導名詞子句，但不能當介系詞的受詞；這裡也不可能把 that 當成關係代名詞，因為不能接在介系詞或逗號後面。"},{"id":113,"part":5,"stem":"Studies show that managers ______ in conflict resolution build stronger and more effective teams.","choices":["signed","submitted","trained","thanked"],"answer":"C","explanation":"正確答案：(C) trained。句意是「受過衝突解決訓練的經理能建立比較強大而有效的團隊」，所以動詞 train（訓練）的 p.p. 形 (C) trained 是正確答案。(A) sign 表示「簽名，簽署」，(B) submit 表示「提交」，(D) thank 表示「感謝」。"},{"id":114,"part":5,"stem":"New employees of Hislop Industries must complete ______ training courses within their first month of employment.","choices":["attentive","intelligent","permanent","mandatory"],"answer":"D","explanation":"正確答案：(D) mandatory。句意是「必須完成義務性的訓練課程」，所以形容詞 (D) mandatory（強制的）是正確答案。(A) attentive 表示「關心的」，(B) intelligent 表示「聰明的」，(C) permanent 表示「永久的」。"},{"id":115,"part":5,"stem":"Gamberetti is very busy ______ the only other Italian restaurant in Vervaille has closed down.","choices":["unless","in order that","owing to","now that"],"answer":"D","explanation":"正確答案：(D) now that。這個句子已經有具備主詞（Gamberetti）、動詞（is）和補語（busy）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - closed down 是修飾性的語句。修飾部分有動詞（has closed down），所以能引導修飾子句的副詞子句連接詞 (A)、(B)、(D) 是可能的答案。因為要表達「由於另一家義式餐廳停業，所以 Gamberetti 非常忙碌」，所以表示理由的副詞子句連接詞 (D) now that（既然……，因為……）是正確答案。(A) unless 表示條件「除非……」，(B) in order that 表示目的「為了……」。介系詞 (C) owing to（由於……）不能引導修飾子句，而是引導修飾片語。"},{"id":116,"part":5,"stem":"Hundreds of vehicles had to be recalled, as they did not meet the government's emission ______ .","choices":["broadcasts","standards","reminders","licenses"],"answer":"B","explanation":"正確答案：(B) standards。句意是「車不符合政府的排放標準」，所以名詞 (B) standards（標準）是正確答案。(A) broadcast 表示「廣播」，(C) reminder 表示「作為提醒的事物，催促信」，(D) license 表示「許可證」。"},{"id":117,"part":5,"stem":"Ventera Inc. is ______ for a Chinese translator who can accompany executives on a business trip to Beijing.","choices":["ordering","dispatching","referring","searching"],"answer":"D","explanation":"正確答案：(D) searching。句意是「Ventera 公司正在尋找中文翻譯」，所以能和空格後的介系詞 for 形成動詞片語 search for（尋找……）的 search 動詞 -ing 形 (D) searching 是正確答案。(B) dispatch（派遣）意思也合理，但因為是及物動詞，所以後面不能接介系詞 for。(A) order 表示「命令」，(C) refer 表示「談到，參考」。"},{"id":118,"part":5,"stem":"The CEO of Victory Holdings spoke ______ about his vision for the firm's future after its expansion into Europe.","choices":["assure","assured","assuredly","assurance"],"answer":"C","explanation":"正確答案：(C) assuredly。空格修飾前面的動詞（spoke），所以副詞 (C) assuredly（自信地）是正確答案。動詞 (A)、動詞或過去分詞 (B)、名詞 (D) 都不能修飾動詞。如果把名詞 (D) 當成動詞 spoke 的受詞，意思會變成「執行長保證」，而且這也不是「保證……」的正確表達方式，所以不對。"},{"id":119,"part":5,"stem":"The customer made an inquiry ______ the order she had placed on October 13.","choices":["along","between","regarding","through"],"answer":"C","explanation":"正確答案：(C) regarding。因為要表達「提出關於訂單的詢問」，所以介系詞 (C) regarding（關於……）是正確答案。(A) along 表示場所或方向「沿著……」。 (B) between（在……之間）表示兩個對象之間的位置或時間關係，通常以 between A and B 的形式使用。(D) through 表示方向「穿過……，通過……」。"},{"id":120,"part":5,"stem":"Meals at the downtown restaurant Chez Jacques are so ______ that they are worth the wait.","choices":["effective","ready","exceptional","defective"],"answer":"C","explanation":"正確答案：(C) exceptional。句意是「餐點很優秀，所以值得等待」，所以形容詞 (C) exceptional（優秀的）是正確答案。(A) effective 表示「有效的」。(B) ready 表示「備好的」。(D) defective 表示「有缺陷的」。"},{"id":121,"part":5,"stem":"Customers who place bulk orders of Blossom Kitchen's items can ______ for a discount.","choices":["diminish","target","consider","negotiate"],"answer":"D","explanation":"正確答案：(D) negotiate。句意是「大量訂購產品的顧客可以協商折扣」，所以動詞 (D) negotiate（協商）是正確答案。(A) diminish 表示「減少，縮減」。(B) target 表示「以……為目標」。(C) consider（考慮）的意思也說得通，但因為是及物動詞，所以後面必須直接接受詞。"},{"id":122,"part":5,"stem":"Although Mr. McIntyre felt nervous during his presentation, his discomfort was not ______ to anyone present.","choices":["evidently","evident","evidence","evidences"],"answer":"B","explanation":"正確答案：(B) evident。空格是 be 動詞（was）的補語位置，所以能當補語的形容詞 (B)、名詞 (C) 和 (D) 是可能的答案。因為句意是「他的不安對所有人都不明顯」，而且補語說明主詞（his discomfort）的狀態，所以形容詞 (B) evident（明顯的）是正確答案。如果使用名詞 (C) evidence（證據）或 (D) evidences 的話，則是表示主詞本身，也就是「他的不安不是證據」，不符合要表達的意思。副詞 (A) 不能當補語。"},{"id":123,"part":5,"stem":"The product sample was analyzed ______ to identify every possible area in need of improvement.","choices":["instinctively","partially","abstractly","thoroughly"],"answer":"D","explanation":"正確答案：(D) thoroughly。句意是「產品樣品接受徹底分析，以找出每個可能需要改進的部分」，所以副詞 (D) thoroughly（徹底地）是正確答案。(A) instinctively 表示「本能地，直覺地」。(B) partially 表示「部分地」。(C) abstractly 表示「抽象地」。"},{"id":124,"part":5,"stem":"The performance last night featured graceful dancers showing ______ movements.","choices":["effortless","effort","effortlessly","efforts"],"answer":"A","explanation":"正確答案：(A) effortless。空格修飾後面的名詞（movements），所以形容詞 (A) effortless（不費力的）是正確答案。名詞 (B) 和 (D)、副詞 (C) 不能修飾名詞。"},{"id":125,"part":5,"stem":"The meeting room on the 10th floor is ______ used, so it might be converted to serve a more practical purpose.","choices":["seldom","almost","always","maybe"],"answer":"A","explanation":"正確答案：(A) seldom。因為要表達「會議室很少使用，所以可能被改裝作為更實際的用途」，所以頻率副詞 (A) seldom（很少……）是正確答案。使用副詞 (B) almost（幾乎）、(C) always（總是）、(D) maybe（或許）的話，意思會變成「會議室幾乎被使用／總是被使用／或許被使用」，所以不對。"},{"id":126,"part":5,"stem":"The director of operations aims to ______ the aquarium with a state-of-the-art filtration system.","choices":["oblige","equip","certify","revolve"],"answer":"B","explanation":"正確答案：(B) equip。句意是「目標是為水族館配備最先進的過濾系統」，所以動詞 (B) equip（為……配備）是正確答案。(A) oblige 表示「強迫」，(C) certify 表示「證明，保證」，(D) revolve 表示「旋轉」。另外，請記得 equip 的用法是 equip A with B（使 A 配備 B）。"},{"id":127,"part":5,"stem":"Accepting merchandise returns more than 30 days after purchase is ______ to store policy.","choices":["reverse","dependent","contrary","negative"],"answer":"C","explanation":"正確答案：(C) contrary。句意是「接受購買超過 30 天後的退貨，是違背商店政策的」，所以能和空格前面的 be 動詞（is）、後面的 to 構成 be contrary to（和……相反）的 (C) contrary（相反的）是正確答案。(A) reverse（相反的）意思也類似，但當形容詞時只能在名詞前面做修飾。(B) dependent 表示「依賴的」，通常以 dependent on 的形式使用。(D) negative 表示「負面的」。"},{"id":128,"part":5,"stem":"The inspector listed some ______ that still needed to be met before the bakery could open.","choices":["require","requirements","requiring","requires"],"answer":"B","explanation":"正確答案：(B) requirements。空格被前面的數量形容詞（some）修飾，所以名詞 (B) requirements（必要條件）是正確答案。動詞 (A) 和 (D) 不能用在名詞位置。動名詞 (C) 不能用形容詞修飾，而要用副詞修飾。"},{"id":129,"part":5,"stem":"______ Mr. Jackson wants to eat an affordable lunch, he goes to the food court at Central Market.","choices":["As though","Rather than","Until","Whenever"],"answer":"D","explanation":"正確答案：(D) Whenever。這個句子已經有具備主詞（he）和動詞（goes）的完整子句，所以 ~ lunch 是修飾性的語句，而能夠引導空格後的子句（Mr. Jackson wants to eat an affordable lunch），形成副詞子句並表達「每當 Jackson 先生想吃價格低廉的午餐時，就會去美食廣場」的複合關係副詞 (D) Whenever（每當……）是正確答案。如果使用副詞子句連接詞 (A) As though（彷彿……）、(B) Rather than（而不是……）、(C) Until（直到……）的話，意思會變成「彷彿／不是／直到 Jackson 先生想吃價格低廉的午餐，他去美食廣場」，所以不對。"},{"id":130,"part":5,"stem":"Restaurants have been opening near the new apartment complex with increasing ______ to serve the residents.","choices":["disagreement","frequency","knowledge","limitation"],"answer":"B","explanation":"正確答案：(B) frequency。句意是「越來越頻繁地開設餐廳來服務居民」，所以能和空格前面的 with、increasing 構成 with increasing frequency（越來越頻繁地）的 (B) frequency（頻率）是正確答案。(A) disagreement 表示「不一致，意見不合」，(C) knowledge 表示「知識」，(D) limitation 表示「限制」。"},{"id":131,"part":6,"stem":"Choose the best answer for blank 131 in the passage.","choices":["propose","transmit","reassure","accommodate"],"answer":"D","explanation":"正確答案：(D) accommodate。句意是「將開始建設容納國際航班的新航廈」，所以動詞 (D) accommodate（容納）是正確答案。(A) propose 表示「提議」。(B) transmit 表示「傳送」。(C) reassure 表示「使放心」。","group":"131-134"},{"id":132,"part":6,"stem":"Choose the best answer for blank 132 in the passage.","choices":["In all","Then again","Even so","To repeat"],"answer":"A","explanation":"正確答案：(A) In all。空格伴隨逗號一起出現在句首，是連接副詞的位置，所以要掌握空格所在的句子和上一句的關係來判斷答案。上一句提到 Barings 機場將開始建設容納國際航班的新航廈，而空格所在的句子說新航廈的加入將增加容量達百分之 40，所以表示要提及前述事物的具體數字，且追加說明的 (A) In all（總計）是正確答案。(B) Then again 表示「但另一方面」。(C) Even so 表示「儘管如此」。(D) To repeat 表示「再次重申」，意思都不恰當。","group":"131-134"},{"id":133,"part":6,"stem":"Choose the best answer for blank 133 in the passage.","choices":["Reported delays will be reflected on flight message boards.","Both options will be available from the other four terminals.","Passengers are advised to stay seated throughout the flight.","A valid ticket is required to enter the airline's lounge."],"answer":"B","explanation":"正確答案：(B) Both options will be available from the other four terminals.。這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Consequently, it will only be accessible by light rail train or shuttle bus. 提到，它（第 5 航廈）只能透過輕軌或接駁巴士前往，所以空格的內容應該和前往第 5 航廈的方法有關。(B) Both options will be available from the other four terminals 是正確答案。","group":"131-134"},{"id":134,"part":6,"stem":"Choose the best answer for blank 134 in the passage.","choices":["later","meanwhile","according to","including"],"answer":"D","explanation":"正確答案：(D) including。句意是「機場部分區域可能也將暫時關閉，包括第 4 航廈某些部分」，所以表示「包括……」的介系詞 (D) including 是正確答案。(A) later 表示「之後」，(B) meanwhile 表示「同時」，(C) according to 表示「根據……」。","group":"131-134"},{"id":135,"part":6,"stem":"Choose the best answer for blank 135 in the passage.","choices":["premiering","was premiering","premiered","is premiering"],"answer":"D","explanation":"正確答案：(D) is premiering。that 子句（that ~ at 7:00 P.M.）裡只有主詞（it），缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到活動總共將進行 3 小時，其中電影放映時間為 115 分鐘，表示是未來的活動，所以能夠表示未來的現在進行式 (D) is premiering 是正確答案。請記得現在進行式（be + -ing）可以表示預定或即將發生的事。過去進行式 (B) 和過去式 (C) 不能表示未來的事。動名詞或現在分詞 (A) 不能充當動詞。","group":"135-138"},{"id":136,"part":6,"stem":"Choose the best answer for blank 136 in the passage.","choices":["Mr. Barker attended the event with members of his family.","Distributing copies of the film is strictly prohibited by law.","This should give fans some insight into his creative process.","We open at 4:00 P.M. on weekdays and 2:00 P.M. on weekends."],"answer":"C","explanation":"正確答案：(C) This should give fans some insight into his creative process.。這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Mr. Barker will then answer audience questions for the remaining time. 提到，Barker 先生將在剩下的時間回答觀眾的問題，所以空格的內容應該和觀眾提問時間有關，(C) This should give fans some insight into his creative process 是正確答案。","group":"135-138"},{"id":137,"part":6,"stem":"Choose the best answer for blank 137 in the passage.","choices":["temporary","upcoming","extensive","concise"],"answer":"C","explanation":"正確答案：(C) extensive。句意是「基於 Barker 先生在 4 年間遊歷敘利亞、黎巴嫩和伊拉克的廣泛範圍旅行」，所以形容詞 (C) extensive（廣闊的，大範圍的）是正確答案。(A) temporary 表示「暫時的，臨時的」，(B) upcoming 表示「即將到來的」，(D) concise 表示「簡潔的」。","group":"135-138"},{"id":138,"part":6,"stem":"Choose the best answer for blank 138 in the passage.","choices":["professionally","naturally","responsibly","quickly"],"answer":"D","explanation":"正確答案：(D) quickly。句意是「如果您有興趣觀賞中東生活的第一手紀錄，請＿＿行動」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到門票數量有限，所以副詞 (D) quickly（快速地）是正確答案。(A) professionally 表示「專業地」，(B) naturally 表示「自然地」，(C) responsibly 表示「負責地」。","group":"135-138"},{"id":139,"part":6,"stem":"Choose the best answer for blank 139 in the passage.","choices":["decision","failure","demand","record"],"answer":"B","explanation":"正確答案：(B) failure。句意是「我們寫這封信是關於您＿＿上—期網路服務費」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到數次試圖打電話通知，但沒有聯絡上，之後又提到在 Loft Net 的待繳餘額已經在 3 月 15 日到期，所以名詞 (B) failure（失敗，沒有做到）是正確答案。(A) decision 表示「決定」，(C) demand 表示「要求」，(D) record 表示「紀錄」。","group":"139-142"},{"id":140,"part":6,"stem":"Choose the best answer for blank 140 in the passage.","choices":["changed","received","lost","due"],"answer":"D","explanation":"正確答案：(D) due。句意是「在 Loft Net 的（待繳）餘額已經在 3 月 15 日＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到政策是接受在截止期限後一週內付款，而不會有額外的費用，由此可知 3 月 15 日是付款的期限，形容詞 (D) due（到期的）是正確答案。(A) changed 表示「改變了的」，(B) received 表示「被收到的」，(C) lost 表示「失去的，遺失的」。","group":"139-142"},{"id":141,"part":6,"stem":"Choose the best answer for blank 141 in the passage.","choices":["After that, we are forced to charge interest.","The credit card we have on file has expired.","Alternatively, you could send a wire transfer.","Please update your contact details immediately."],"answer":"A","explanation":"正確答案：(A) After that, we are forced to charge interest.。這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 It is our policy to accept payments without applying additional fees for a week following the deadline. 提到，政策是接受在截止期限後一週內付款，而不會有額外的費用，而下一句 we would appreciate your prompt attention to this matter 則說希望對方儘快處理這件事，所以空格的內容應該和超過付款截止期限一週後會發生的事有關，(A) After that, we are forced to charge interest 是正確答案。","group":"139-142"},{"id":142,"part":6,"stem":"Choose the best answer for blank 142 in the passage.","choices":["Settles","Having settled","To settle","Has settled"],"answer":"C","explanation":"正確答案：(C) To settle。這個句子是祈使句，所以沒有主詞，而句中已經有動詞（contact, have）和受詞（555-7843, your credit card），是完整的子句，所以 the bill 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語、含有現在分詞的 (B) 和 to 不定詞 (C) To settle 是可能的答案。因為要表達「為了付清帳單而聯絡」，所以表示目的的是 to 不定詞 (C) To settle 是正確答案。含有現在分詞的 (B) 會形成分詞構句「已經付清……」，表示時間、理由、條件、連續動作，不符合文意。動詞 (A) 和 (D) 不能引導修飾片語。","group":"139-142"},{"id":143,"part":6,"stem":"Choose the best answer for blank 143 in the passage.","choices":["high","higher","highly","highest"],"answer":"C","explanation":"正確答案：(C) highly。能修飾動詞（are impressed）的是副詞，所以副詞 (C) highly（非常）是正確答案。形容詞 (A)、形容詞的比較級 (B)、形容詞的最高級 (D) 都不能修飾動詞。就算想把 (A) 當成副詞「高高地」，或者把 (B) 和 (D) 當成副詞用法的比較級、最高級也不行，因為 high 的副詞用法只能在動詞後面做修飾。","group":"143-146"},{"id":144,"part":6,"stem":"Choose the best answer for blank 144 in the passage.","choices":["will need","needed","have needed","needing"],"answer":"A","explanation":"正確答案：(A) will need。句中缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。句意是「需要每個人參加」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到未來幾週會有許多工作，所以大家的配合很重要，由此可知「每個人參加」是未來會發生的事，所以未來式 (A) will need 是正確答案。過去式 (B) 和現在完成式 (C) 不能表示未來的事情。動名詞或現在分詞 (D) 不能當動詞用。","group":"143-146"},{"id":145,"part":6,"stem":"Choose the best answer for blank 145 in the passage.","choices":["I agree that their suggestions were better than ours.","The advertisement will be airing then for the first time.","This discussion resolved several important issues.","We will also discuss plans for the magazine spread."],"answer":"D","explanation":"正確答案：(D) We will also discuss plans for the magazine spread.。這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 I have arranged for us all to meet with Liang Inc.'s CEO on July 27 so that we can figure out a detailed timeline. 提到，已經安排所有人和 Liang 公司的執行長會面，釐清詳細的時程規劃，所以空格的內容應該和與執行長會面討論的內容有關，所以 (D) We will also discuss plans for the magazine spread 是正確答案。","group":"143-146"},{"id":146,"part":6,"stem":"Choose the best answer for blank 146 in the passage.","choices":["be prepared","preparing","in preparation of","having prepared"],"answer":"A","explanation":"正確答案：(A) be prepared。這個句子是祈使句，沒有主詞，所以能當祈使句動詞的原形 (A) be prepared（準備好）是正確答案。動名詞或現在分詞 (B)、介系詞片語 (C)、包含現在分詞的 (D) 都不能當祈使句的動詞。","group":"143-146"},{"id":147,"part":7,"stem":"Why was the message sent?","choices":["To comment on some changes","To request a copy of a file","To ask for a cost estimate","To explain a company procedure"],"answer":"A","explanation":"正確答案：(A) To comment on some changes。這一題問的是傳這則訊息的原因，所以要注意文章開頭的部分。I got your latest draft of the newsletter. Here are my thoughts. First, thanks for trying my suggestions. 的部分，收到了電子報的最新草稿，且感謝對方嘗試了自己的建議，接下來則是表達自己對於最新草稿的意見，所以 (A) 是正確答案。","group":"147-148"},{"id":148,"part":7,"stem":"What is indicated about a newsletter?","choices":["It is supported by advertisements.","It includes inaccurate information.","It has too many pages.","It requires a new photo."],"answer":"D","explanation":"正確答案：(D) It requires a new photo.。這是 Not/True 題型，要找出和關鍵詞語 a newsletter 有關的內容，並且對照選項判斷答案。(A)、(B)、(C) 在文章裡沒有提到。(D) 在 Could you also replace the last photo? We can't use it because it's too outdated. 的部分，問對方能不能換掉最後一張照片，因為照片太舊了，符合選項敘述，所以 (D) 是正確答案。","group":"147-148"},{"id":149,"part":7,"stem":"What is the article mainly about?","choices":["The admission of a team into a league","A musician's recent performance","The successful premiere of a movie","A celebrity's participation in an event"],"answer":"D","explanation":"正確答案：(D) A celebrity's participation in an event。這一題問的是這篇文章的目的，所以要注意文章開頭的部分。Country music star Sandi Vincent will visit Warwick next month to help our baseball team ~ start the new season. 的部分提到，鄉村音樂明星 Sandi Vincent 下個月將拜訪 Warwick，為棒球隊開始新的球季，之後則說明與開球活動相關的事項，所以 (D) 是正確答案。","group":"149-150"},{"id":150,"part":7,"stem":"What is suggested about Ms. Vincent?","choices":["She hoped to become an athlete.","She has recorded several albums.","She visits Warwick on a regular basis.","She appeared in a television advertisement."],"answer":"B","explanation":"正確答案：(B) She has recorded several albums.。這是和題目關鍵詞語 Ms. Vincent 有關的推論問題。Ms. Vincent gained nationwide fame through ~ her third album 的部分提到，Vincent 小姐靠著第三張專輯的成功，獲得了全國性的知名度，由此可以推知，Vincent 小姐錄製了至少三張專輯，(B) 是正確答案。","group":"149-150"},{"id":151,"part":7,"stem":"What is indicated about Rumfax Shared Garden?","choices":["It can be used by residents of a certain area.","Its produce is sold at a local market.","It receives part of its funding from a corporation.","It helps other communities introduce similar programs."],"answer":"A","explanation":"正確答案：(A) It can be used by residents of a certain area.。這是和題目關鍵詞語 Rumfax Shared Garden 有關的推論問題。Anyone who lives in Rumfax is welcome to apply 的部分提到，歡迎任何居住於 Rumfax 的人申請，由此可以推知，Rumfax 的居民可以使用 Rumfax 共享園地，(A) 是正確答案。","group":"151-153"},{"id":152,"part":7,"stem":"According to the notice, when can plots be expanded?","choices":["When neighboring gardens create shade","When gardeners pay an extra fee","When staff members give permission","When additional structures are completed"],"answer":"C","explanation":"正確答案：(C) When staff members give permission。這是問地塊在什麼時候（When）可以擴張的 wh- 問題。和題目的關鍵詞語 plots be expanded 有關的部分是 Plots may not be expanded unless RSG coordinators grant special consent.，這部分說除非經過 RSG 協調者特別同意，否則地塊不能擴張，所以 (C) 是正確答案。","group":"151-153"},{"id":153,"part":7,"stem":"Why does Rumfax Shared Garden have to charge for membership?","choices":["To purchase advertising space","To buy construction materials","To provide wages to employees","To pay for necessary supplies"],"answer":"D","explanation":"正確答案：(D) To pay for necessary supplies。這是問為什麼（Why）Rumfax 共享園地必須收取會員費的 wh- 問題。和題目的關鍵詞語 Rumfax Shared Garden ~ charge for membership 有關的部分是 The membership fee is used to pay for water, soil, and fertilizer.，這部分提到會員費用於支付水、土壤與肥料的費用，所以 (D) 是正確答案。","group":"151-153"},{"id":154,"part":7,"stem":"Who most likely is Ms. Barrow?","choices":["A fashion designer","A marketing specialist","A contract negotiator","A graphic artist"],"answer":"D","explanation":"正確答案：(D) A graphic artist。這是和題目關鍵詞語 Ms. Barrow 有關的推論問題。Juliet Pau 說 Have you had a chance to inspect the proposal for our company mascot? 問對方是否看過公司吉祥物的提案，而 Chris Cormier 回應 Ms. Barrow interpreted our idea fairly well，表示 Barrow 小姐把他們的想法詮釋得很好，然後 Juliet Pau 又補充 I really like how she drew the character's outfit and body in Option A，表示自己真的很喜歡她（Barrow 小姐）在 A 案中畫角色服裝和身體的方式，由此可以推知 Barrow 小姐是負責製作吉祥物草圖的插畫家，(D) 是正確答案。","group":"154-155"},{"id":155,"part":7,"stem":"At 3:50 P.M., what does Mr. Cormier most likely mean when he writes, \"I'm inclined to agree\"?","choices":["He has no choice but to follow his supervisor's orders.","He does not like an aspect of a sketch.","He thinks a task needs to be simplified.","He believes it is important to reach a group decision."],"answer":"B","explanation":"正確答案：(B) He does not like an aspect of a sketch.。這一題問的是 Cormier 先生的訊息所表達的意圖，所以要掌握引用部分（I'm inclined to agree）前後文的情境。Juliet Pau 說 I'm not sure about the face ~. What do you think?，表示自己對於臉的部分不太確定（呈現的樣子是否理想），對此 Cormier 先生回應 I'm inclined to agree.（我算是同意），且說 The eyes should be significantly larger，表示自己認為眼睛應該再大上許多，可知 Cormier 先生同樣對於臉的部分不太滿意，所以 (B) 是正確答案。","group":"154-155"},{"id":156,"part":7,"stem":"What is NOT true about Touchstone Ventures?","choices":["It owns Umoja Transport.","It has organized a project into stages.","It was previously owned by the government.","It aims to deal in cargo transport."],"answer":"C","explanation":"正確答案：(C) It was previously owned by the government.。這是 Not/True 題型，要找出和關鍵詞語 Touchstone Ventures 有關的內容，並且對照選項判斷答案。(A) 在 Touchstone's takeover of Umoja Transport in mid-February 的部分提到，Touchstone 公司在 2 月中收購了 Umoja Transport 公司，符合選項敘述。(B) 在 Touchstone's plan has four parts. 的部分提到，Touchstone 公司的計畫有四個部分，符合選項敘述。(C) 在文章裡沒有提到，所以 (C) 是正確答案。(D) 在 The third phase will be ~ to take advantage of the growing cargo traffic to and from neighboring countries. 的部分提到，Touchstone 公司計畫的第三階段是藉由與鄰國逐漸成長的往來貨物量獲利，符合選項敘述。","group":"156-158"},{"id":157,"part":7,"stem":"What is suggested about Dr. Maguli?","choices":["He has traveled to a construction site.","He has studied Tanzanian transportation trends.","He does consulting work for corporations.","He is working to develop a new technology."],"answer":"B","explanation":"正確答案：(B) He has studied Tanzanian transportation trends.。這是和題目關鍵詞語 Dr. Maguli 有關的推論問題。According to my research, a growing number of Tanzanians are choosing to drive or take a bus rather than a ride in a train. 的部分提到，根據「我」（Maguli 博士）的研究，有越來越多坦尚尼亞人選擇開車或搭巴士，而不是搭火車；後面的 Touchstone's challenge will be to reverse this tendency 又提到 Touchstone 公司的挑戰在於扭轉這個趨勢。由此可以推知，Maguli 博士研究過坦尚尼亞的運輸趨勢，所以 (B) 是正確答案。","group":"156-158"},{"id":158,"part":7,"stem":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"These are expected to appeal to travelers who want to see the country's landscapes at a leisurely pace.\"","choices":["[1]","[2]","[3]","[4]"],"answer":"D","explanation":"正確答案：(D) [4]。這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「它們（這些東西）被預期將吸引想要以悠閒的步調欣賞國內景色的旅客」，所以句子填入的部分應該和觀賞風景的旅行有關。[4] 的上一句 it may begin offering scenic journeys on steam-powered heritage trains 提到「它」（Touchstone Ventures 公司）可能開始提供蒸氣動力古董列車的觀景旅行。將句子填入 [4] 的位置之後，可以表達「Touchstone Ventures 公司將開始提供蒸氣動力古董列車的觀景旅行，而這些旅行被預期將吸引想要以悠閒的步調欣賞國內景色的旅客」，文意通順，所以 (D) 是正確答案。","group":"156-158"},{"id":159,"part":7,"stem":"For whom is the advertisement most likely intended?","choices":["Someone who needs to find an apartment","Someone who prefers to use a private workplace","Someone who wants to begin exporting products","Someone who is running out of storage space"],"answer":"D","explanation":"正確答案：(D) Someone who is running out of storage space。這是需要綜合文中各處的線索，推論廣告對象的問題。Has your home or business become uncomfortably full? Well, rather than relocating, check out Goliath Storage 的部分問讀者家裡或者公司是否已經滿到讓人不舒服，並且建議不要搬家，而是了解一下 Goliath 倉儲，之後的內容則是介紹這家業者提供的倉儲保管服務。因此可以推知，這則廣告的對象是物品存放空間不足的人，(D) 是正確答案。","group":"159-160"},{"id":160,"part":7,"stem":"What is being offered as part of a promotion?","choices":["Discounts on monthly fees","Upgrades to larger sizes","Complimentary pickup of belongings","Lower prices for insurance"],"answer":"D","explanation":"正確答案：(D) Lower prices for insurance。這是問正在提供什麼（What）作為促銷的 wh- 問題。和題目的關鍵詞語 offered as part of a promotion 有關的部分是 For the month of December only, those purchasing insurance for their stored items through our office will receive a 20 percent discount on their policy!，這部分提到僅限 12 月當月，透過「我們公司」（Goliath 公司）為儲藏物品購買保險者，將獲得 20% 的保險折扣，所以 (D) 是正確答案。","group":"159-160"},{"id":161,"part":7,"stem":"What is indicated about the Windsor Business Association?","choices":["It recently accepted new members.","It relocated its head office.","It regularly offers seminars.","It partnered with an environmental group."],"answer":"C","explanation":"正確答案：(C) It regularly offers seminars.。這是和題目關鍵詞語 the Windsor Business Association 有關的推論問題。Following last month's topic on conserving electricity, this month's topic is about reducing water waste. 的部分提到，在上個月的節約用電主題之後，本月的主題是減少水的浪費，由此可以推知，Windsor 商會定期提供研討會，所以 (C) 是正確答案。","group":"161-164"},{"id":162,"part":7,"stem":"The word \"steps\" in paragraph 2, line 2, is closest in meaning to","choices":["cases","movements","instructions","actions"],"answer":"D","explanation":"正確答案：(D) actions。steps 所在的語句 Calvin Randall will explain how local businesses can take steps to reduce costs 之中，steps 表示「措施」的意思，所以同樣能表示「措施」的 (D) 是正確答案。","group":"161-164"},{"id":163,"part":7,"stem":"What are interested participants asked to bring?","choices":["Photo identification","Proof of registration","Recent water bills","Business cards"],"answer":"C","explanation":"正確答案：(C) Recent water bills。這是問有興趣的參加者被要求帶什麼（What）的 wh- 問題。和題目的關鍵詞語 interested participants asked to bring 有關的部分是 It will be a good opportunity to learn how you can cut your water expenses and protect our planet at the same time. Local business owners are also encouraged to bring along recent utility statements to learn about the different areas where savings are possible.，這部分提到研討會將是學習能如何同時減少水費並保護地球的好機會，並且建議本地事業主攜帶最近的公用事業帳單明細，了解能節省的各種不同領域，其中應該就包含水費帳單，所以 (C) 是正確答案。","group":"161-164"},{"id":164,"part":7,"stem":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"That's why you shouldn't miss this seminar.\"","choices":["[1]","[2]","[3]","[4]"],"answer":"C","explanation":"正確答案：(C) [3]。這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「這就是您不該錯過這次研討會的理由」，所以應該會出現在和參加研討會的理由有關的部分。[3] 的上一句 Mr. Randall is a highly respected scientist and has appeared on numerous television and radio programs over the years. 提到，Randall 先生是備受敬重的科學家，並且曾經在這幾年出演許多電視與廣播節目。將句子填入 [3] 的位置之後，可以表達「Randall 先生是備受敬重的科學家，並且曾經在這幾年出演許多電視與廣播節目，而這就是您不該錯過這次研討會的理由」，文意通順，所以 (C) 是正確答案。","group":"161-164"},{"id":165,"part":7,"stem":"What did Ms. Woodard do before choosing Arturo Realty?","choices":["Compared the prices of various houses","Talked to a previous customer","Visited a company Web site","Contacted several realtors"],"answer":"D","explanation":"正確答案：(D) Contacted several realtors。這是問 Woodard 小姐在選擇 Arturo 不動產之前做了什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Woodard do before choosing Arturo Realty 有關的部分是針對 Why did you choose to work with us?（為什麼您選擇和我們合作？）這個問題的回答：I got in touch with several real estate agencies, but yours responded the most promptly.，這部分提到「我」（Woodard 小姐）聯絡了幾家不動產仲介公司，但「你們的公司」（Arturo 不動產）最快回覆，所以 (D) 是正確答案。","group":"165-167"},{"id":166,"part":7,"stem":"With what statement would Ms. Woodard probably agree?","choices":["Mr. Hamlin has an extensive network of contacts.","Arturo Realty complies with local regulations.","Mr. Hamlin provides frequent updates.","Arturo Realty's office is conveniently located."],"answer":"C","explanation":"正確答案：(C) Mr. Hamlin provides frequent updates.。這是和題目關鍵詞語 statement would Ms. Woodard ~ agree 有關的推論問題。Mr. Hamlin kept me informed during every step of the transaction. He called me regularly to let me know what was going on. 的部分提到，Hamlin 先生在交易的每個步驟都持續告訴「我」（Woodard 小姐）消息，也定期打電話告知正在進行什麼事，由此可以推知 Woodard 小姐認為 Hamlin 先生經常提供最新資訊，所以 (C) 是正確答案。","group":"165-167"},{"id":167,"part":7,"stem":"What aspect of Arturo Realty's service was Ms. Woodard unsatisfied with?","choices":["An agent was sometimes unavailable to meet in person.","Notifications about visits were not given early enough.","Some negotiations were not conducted efficiently.","Some personal information was not kept confidential."],"answer":"B","explanation":"正確答案：(B) Notifications about visits were not given early enough.。這是問 Woodard 小姐對於 Arturo 不動產服務的什麼（What）方面不滿意的 wh- 問題。和題目的關鍵詞語 aspect of Arturo Realty's service ~ Ms. Woodard unsatisfied with 有關的部分是 I would have preferred receiving more advance notice when potential buyers came to look at my house.，這部分提到希望潛在買家來看房的時候，「我」（Woodard 小姐）能更早收到通知，所以 (B) 是正確答案。","group":"165-167"},{"id":168,"part":7,"stem":"Why did Ms. Sanchez send the message?","choices":["To solicit some recommendations","To request feedback on a campaign","To propose a change of strategy","To schedule a store inspection"],"answer":"A","explanation":"正確答案：(A) To solicit some recommendations。這一題問的是 Sanchez 小姐傳訊息的理由，所以要注意文章開頭的部分。Sanchez 小姐在 Sales have been disappointing these last few quarters, both online and at our stores. Any ideas how we might turn things around? 的部分提到，過去幾季銷售情況令人失望，線上和店面都是，並且問有什麼能扭轉局勢的主意，所以 (A) 是正確答案。","group":"168-171"},{"id":169,"part":7,"stem":"At 12:13 P.M., what does Mr. Behar mean when he writes, \"That would be a great fit\"?","choices":["He wants to transfer to another location.","He prefers a specific set of fabrics.","He is interested in custom-made pieces.","He agrees with a choice of design partner."],"answer":"D","explanation":"正確答案：(D) He agrees with a choice of design partner.。這一題問的是 Behar 先生的訊息所表達的意圖，所以要掌握引用部分（That would be a great fit）前後文的情境。Behar 先生說 How about working with a celebrity on a collection of furniture and home accessories?，詢問大家對於和名人合作家具與家飾系列的意見，對此 Robert Gillibrand 提議 Fiona Connolly might work. She's a famous interior decorator.，表示 Fiona Connolly 或許可以，因為她是有名的室內設計師。Behar 先生則回應 That would be a great fit.（那會很適合的），然後又補充 Her reality television show is popular right now, and I don't think she's worked with another retail store before，表示她的電視實境節目現在很受歡迎，以及認為她以前沒跟別的零售店合作過。因此，Behar 先生要表達的意思是他同意選擇這位設計師來合作，所以 (D) 是正確答案。","group":"168-171"},{"id":170,"part":7,"stem":"What can be inferred about Ms. Shepard?","choices":["She has many followers on social media.","She has worked on a reality television show.","She is responsible for creating designs.","She is not sure about a collaboration."],"answer":"C","explanation":"正確答案：(C) She is responsible for creating designs.。這是和題目關鍵詞語 Ms. Shepard 有關的推論問題。Shepard 小姐說 I can collaborate with her on designing new furniture pieces，表示自己可以和「她」（Fiona Connolly）合作設計新的家具，由此可以推知，Shepard 小姐負責創作設計，所以 (C) 是正確答案。","group":"168-171"},{"id":171,"part":7,"stem":"What does Ms. Sanchez want to do?","choices":["Release more than one collection","Come up with some alternatives","Establish a long-term partnership","Speak with a manager directly"],"answer":"B","explanation":"正確答案：(B) Come up with some alternatives。這是問 Sanchez 小姐想做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Sanchez want to do 有關的部分是 Sanchez 小姐所說的 We should also think of other candidates in case she turns us down，她說也應該想想其他人選，以防萬一「她」（Fiona Connolly）拒絕，所以 (B) 是正確答案。","group":"168-171"},{"id":172,"part":7,"stem":"What is the purpose of the letter?","choices":["To thank an organization for hosting a function","To request feedback on a newly released product","To ask certain clients to attend an event","To provide a quarterly update to stockholders"],"answer":"C","explanation":"正確答案：(C) To ask certain clients to attend an event。這一題問的是文章的目的，所以要注意文章開頭的部分。To thank you for placing regular orders of our goods, we would like to invite you to a private preview of our upcoming product line 的部分提到，為了感謝收件者定期訂購商品，所以想邀請參加即將上市的產品系列非公開預覽活動，(C) 是正確答案。","group":"172-175"},{"id":173,"part":7,"stem":"What is suggested about the new line of products?","choices":["It has not been advertised.","It is still being designed.","It is completely sold out.","Its launch will be delayed."],"answer":"A","explanation":"正確答案：(A) It has not been advertised.。這是和題目關鍵詞語 the new line of products 有關的推論問題。These items will be released early next year and have not yet been revealed to the public. 的部分提到，這些產品將在明年初發售，而且還沒有對大眾公開，由此可以推知，新系列的產品還沒有被宣傳過，所以 (A) 是正確答案。","group":"172-175"},{"id":174,"part":7,"stem":"What is NOT indicated about the preview?","choices":["It will take place in November.","It will be held at a branch office.","It will be attended by past customers.","It will include a meal."],"answer":"B","explanation":"正確答案：(B) It will be held at a branch office.。這是 Not/True 題型，要找出和關鍵詞語 the preview 有關的內容，並且對照選項判斷答案。(A) 在 The event will fall on November 9 的部分提到，活動將於 11 月 9 日舉行，符合選項敘述。(B) 信件頂部的 Corrigan Technology Headquarters 顯示由 Corrigan Technology 總部寄出，而 The event will fall on November 9 ~ at the address given at the top of this letter. 的部分提到，11 月 9 日將在信件頂部提供的地址舉行活動，也就是在總部舉行，不符合選項敘述，所以 (B) 是正確答案。(C) 在 To thank you for placing regular orders of our goods, we would like to invite you to a private preview of our upcoming product line. 的部分提到，為了感謝定期訂購商品，想邀請收件者參加即將上市的產品系列非公開預覽活動，符合選項敘述。(D) 在 A dinner will be served 的部分提到將供應晚餐，符合選項敘述。","group":"172-175"},{"id":175,"part":7,"stem":"How can attendees receive a voucher?","choices":["By presenting a letter","By buying multiple items","By answering a questionnaire","By being selected in a draw"],"answer":"D","explanation":"正確答案：(D) By being selected in a draw。這是問參加者怎樣（How）可以獲得優惠券的 wh- 問題。和題目的關鍵詞語 attendees receive a voucher 有關的部分是 Ticket numbers will be included in a special draw，這部分提到門票號碼將被包括在特別抽獎活動中，而中獎者將得到優惠券，所以 (D) 是正確答案。","group":"172-175"},{"id":176,"part":7,"stem":"According to the notice, why have some objects been moved to the third floor?","choices":["To prepare the building for a special exhibit","To protect them from potential damage","To restore their original colors","To respond to a seasonal drop in tourism"],"answer":"B","explanation":"正確答案：(B) To protect them from potential damage。這是問根據通知（第一篇文章），為什麼（Why）有些物品被搬到 3 樓的 wh- 問題。To protect the objects in our collection during the renovation, we have moved many of them to a third-floor storage room. 的部分提到，為了在整修期間保護收藏品，已經將其中許多搬到 3 樓儲藏室，所以 (B) 是正確答案。","group":"176-180"},{"id":177,"part":7,"stem":"What will Mr. Lin discuss with the board of trustees?","choices":["What activities will take place at an event","How to improve a newsletter","When operations will resume","Where artifacts should be displayed"],"answer":"C","explanation":"正確答案：(C) When operations will resume。這是問 Lin 先生會跟董事會討論什麼（What）的 wh- 問題，所以要從提到和董事會討論的通知（第一篇文章）找出和題目關鍵詞語 Mr. Lin discuss with the board of trustees 相關的內容。museum director Ken Lin will meet with the board of trustees and decide on the date of our reopening 的部分提到，博物館館長 Ken Lin 將和董事會開會，決定重新開放的日期，所以 (C) 是正確答案。","group":"176-180"},{"id":178,"part":7,"stem":"What is mentioned about Ms. Smith?","choices":["She volunteers at a local museum.","She is supervising a renovation project.","She serves on a government committee.","She planned an outing for senior citizens."],"answer":"D","explanation":"正確答案：(D) She planned an outing for senior citizens.。這是 Not/True 題型，要找出和關鍵詞語 Ms. Smith 有關的內容，並且對照選項判斷答案，所以看寄給 Smith 小姐的電子郵件（第二篇文章）的內容。(A)、(B)、(C) 在文章中沒有提到。(D) 在 you scheduled a visit to Ludlow Nautical Museum ~ for a group of senior citizens 的部分提到，「您」（Smith 小姐）安排了年長者團體在下週二參觀 Ludlow 航海博物館，符合選項敘述，所以 (D) 是正確答案。","group":"176-180"},{"id":179,"part":7,"stem":"What does Mr. Lin recommend?","choices":["Visiting a site run by the Ludlow Tourism Organization","Canceling a workshop at Sunshine Heights","Changing the date of a personal appointment","Checking the performance schedule of a theater"],"answer":"A","explanation":"正確答案：(A) Visiting a site run by the Ludlow Tourism Organization。這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 Mr. Lin recommend，要問 Lin 先生推薦什麼（What），所以先看 Lin 先生所寫的電子郵件。 線索1：電子郵件（第二篇文章）中，We hope that you are able to arrange an outing to a different site ~. My personal recommendation is Crescent Bay Aquarium. 的部分提到，希望星期二能將出遊安排在不同的地點，且推薦 Crescent Bay 水族館。不過，這裡沒有提到 Crescent Bay 水族館的其他細節，所以還需要參考通知的內容。 線索2：通知（第一篇文章）中，Crescent Bay Aquarium, which is ~ operated by the Ludlow Tourism Organization 的部分提到 Crescent Bay 水族館由 Ludlow 觀光組織營運。 綜合這兩個線索，可知 Lin 先生推薦前往 Ludlow 觀光組織營運的 Crescent Bay 水族館，所以 (A) 是正確答案。","group":"176-180"},{"id":180,"part":7,"stem":"What will Ms. Smith most likely receive?","choices":["A refunded deposit","An item from a gift shop","A season's pass","An invoice for repairs"],"answer":"B","explanation":"正確答案：(B) An item from a gift shop。這是需要對照兩篇文章內容的推論題型，先看和題目的關鍵詞語 Ms. Smith ~ receive 有關的電子郵件。 線索1：電子郵件（第二篇文章）中，you scheduled a visit to Ludlow Nautical Museum next Tuesday ~ 的部分提到，安排了下週二參觀 Ludlow 航海博物館，然後 the museum had to close for renovations 又提到博物館必須關閉進行整修。不過，這裡沒有提到無法去博物館時會收到什麼，所以還需要參考通知的內容。 線索2：通知（第一篇文章）中，a free key chain from our souvenir store will be mailed to each guest whose advance reservation has been canceled 的部分提到，將會郵寄紀念品店的免費鑰匙圈給被取消事先預約的每位來賓。 綜合這兩個線索，可知 Smith 小姐因為參觀的預約被取消了，所以會收到紀念品店的鑰匙圈，(B) 是正確答案。","group":"176-180"},{"id":181,"part":7,"stem":"What is the purpose of the memo?","choices":["To clarify a policy change","To announce a job opening","To answer some questions","To describe a procedure"],"answer":"D","explanation":"正確答案：(D) To describe a procedure。這一題問的是備忘錄（第一篇文章）的目的。在備忘錄中，I'd like to remind you of a few details concerning our annual evaluations for staff members 的部分提到，要提醒一些關於年度員工評價的細節，之後就詳細說明相關事項，所以 (D) 是正確答案。","group":"181-185"},{"id":182,"part":7,"stem":"What is mentioned about human resources staff?","choices":["They will send evaluation information.","They will be screening applicants in May.","They began using new payroll software.","They updated a salary database."],"answer":"A","explanation":"正確答案：(A) They will send evaluation information.。這是 Not/True 題型，要找出和關鍵詞語 human resources staff 有關的內容，並且對照選項判斷答案，所以看提到人事部的備忘錄（第一篇文章）。(A) 在 human resources staff will be e-mailing you information about each member of your team including their start dates at the company and their past evaluation results 的部分提到，人事部員工將會用電子郵件寄送團隊中每個成員的資訊，其中包括他們進公司的日期和過去的評價結果，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章中沒有提到。","group":"181-185"},{"id":183,"part":7,"stem":"According to Ms. Malone, what can Ms. Cullen do?","choices":["Interview potential candidates","Fix a technical issue","Respond to inquiries from managers","Approve promotions of employees"],"answer":"C","explanation":"正確答案：(C) Respond to inquiries from managers。這是問根據 Malone 小姐的說法，Cullen 小姐可以做什麼（What）的 wh- 問題，所以要從 Malone 小姐所寫的備忘錄（第一篇文章）找出相關的內容。備忘錄中的 TO: All team leaders 顯示這是寫給所有團隊領導人看的，而 For questions or concerns, get in touch with Gail Cullen in the human resources department. 的部分提到，如果有問題或在意的事，請聯絡人事部的 Gail Cullen，由此可知 Gail Cullen 會答覆管理者的詢問，所以 (C) 是正確答案。","group":"181-185"},{"id":184,"part":7,"stem":"In the e-mail, the word \"figure\" in paragraph 2, line 1, is closest in meaning to","choices":["compute","depict","suppose","represent"],"answer":"C","explanation":"正確答案：(C) suppose。在電子郵件（第二篇文章）中，figure 所在的語句 I figure she deserves a raise for being such a valuable member of my team. 之中，figure 表示「認為」的意思，所以同樣能表示「認為」的 (C) 是正確答案。","group":"181-185"},{"id":185,"part":7,"stem":"What factor makes Ms. Barrie ineligible for a raise?","choices":["What sort of work arrangements she requires","Who she is in charge of supervising","How long she has held her current position","When she was last given a bonus"],"answer":"D","explanation":"正確答案：(D) When she was last given a bonus。這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 factor makes Ms. Barrie ineligible for a raise，要問什麼（What）因素使得 Barrie 小姐沒有資格獲得加薪，所以先看提到加薪資格的備忘錄。 線索1：備忘錄（第一篇文章）中，If an employee receives a positive performance evaluation and has not gotten a raise or bonus within the past three months, that staff member is eligible for a 5.5 percent salary increase. 的部分提到，如果員工獲得正面的表現評價，而在過去 3 個月不曾獲得加薪或獎金，該員工有資格獲得 5.5% 的加薪。不過，這裡沒有提到 Barrie 小姐的情況，所以還需要參考電子郵件的內容。 線索2：電子郵件（第二篇文章）中，Last month, she was awarded a bonus for successfully completing her part of a demanding 10-week project. 的部分提到，上個月「她」（Barrie 小姐）因為在長達 10 週、費時費力的專案中成功完成任務而獲得了獎金。 綜合這兩個線索，可知 Barrie 小姐因為在過去 3 個月內曾經獲得獎金，所以沒有資格獲得加薪，(D) 是正確答案。","group":"181-185"},{"id":186,"part":7,"stem":"Why was the letter written?","choices":["To raise concerns about park usage","To request an extension of a hiking trail","To propose a new route to a campsite","To recommend that wildlife be protected"],"answer":"A","explanation":"正確答案：(A) To raise concerns about park usage。這一題問的是寫信件（第一篇文章）的理由。While at the park in recent months, I've witnessed some changes that concern me. 的部分提到，最近幾個月在公園看到一些令寄件者擔心的變化，With the growing popularity of the area, a number of rules should be introduced. 的部分則補充，隨著這個地區（蘭貝里斯山公園）越來越受歡迎，應該採取一些規定，後面則提到對於公園使用的擔憂，所以 (A) 是正確答案。","group":"186-190"},{"id":187,"part":7,"stem":"Which rule was probably newly adopted by Mount Llanberis Park?","choices":["Rule (1)","Rule (2)","Rule (3)","Rule (4)"],"answer":"C","explanation":"正確答案：(C) Rule (3)。這是需要對照兩篇文章內容的推論題型，先看針對題目關鍵詞語 rule was ~ newly adopted by Mount Llanberis Park 提供了建議的信件。 線索1：信件（第一篇文章）中的 I've seen a lot of people leaving the marked trails lately. I recommend that you create a regulation that prohibits people from doing so. 提到，最近看到許多人脫離標示的路徑，所以建議訂定禁止人們這麼做的規定。不過，這裡無法看出公園是否制定了這個規定，以及是規定中的第幾項，所以還需要參考登記表的相關內容。 線索2：登記表（第二篇文章）中的 (3) Always stay on marked trails. 顯示第 3 條規則是務必行走標示的路徑。 綜合這兩個線索，可知要求行走標示路徑的第 3 條規則，可能是因為信件的建議而新增的，(C) 是正確答案。","group":"186-190"},{"id":188,"part":7,"stem":"According to the registration form, what is Ms. Pearse required to do?","choices":["Hike with a certified guide","Pay a deposit in order to borrow an item","Enroll in some rock climbing classes","Present identification documents at a ranger station"],"answer":"A","explanation":"正確答案：(A) Hike with a certified guide。這是問 Pearse 小姐必須做什麼（What）的 wh- 問題，要從她填寫的登記表（第二篇文章）找出相關的內容。First-time visitors will not be allowed to proceed unless accompanied by a certified guide. 的部分提到，除非有認證導遊同行，否則初次到訪者不得繼續前進，而 Is this your first visit? X Yes 的部分顯示 Pearse 小姐是第一次到訪，所以 (A) 是正確答案。","group":"186-190"},{"id":189,"part":7,"stem":"According to the schedule, which location was visited by two groups on October 19?","choices":["Giant's Wall","Lloyd Peak","Harlech Slope","Zipper Descent"],"answer":"A","explanation":"正確答案：(A) Giant's Wall。這是問哪個（Which）地點在 10 月 19 日有兩組人到訪的 wh- 問題，要從時間表（第三篇文章）找出相關的內容。時間表中的 Visitors Taking Part in Adventure Sports on October 19、Giant's Wall、Bryn Hughes、Dennis Roberts 顯示 10 月 19 日有 Bryn Hughes 和 Dennis Roberts 代表的兩組人去 Giant's Wall，所以 (A) 是正確答案。","group":"186-190"},{"id":190,"part":7,"stem":"What can be inferred about Mr. Price?","choices":["He bought hiking poles at a ranger station.","He didn't inform a ranger of a rule violation.","He may have paid a financial penalty.","He encountered some inclement weather."],"answer":"C","explanation":"正確答案：(C) He may have paid a financial penalty.。這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Mr. Price 出現的時間表。 線索1：時間表（第三篇文章）中，Owen Price、Time of return、6:10 P.M. 顯示 Price 先生在下午 6:10 返回。不過，這裡看不出來在 6:10 返回會怎樣，所以還需要參考登記表的內容。 線索2：登記表（第二篇文章）中，The park is open from 6 A.M. to 6 P.M. Visitors must return to the park office by closing time. Violators will be subject to a $30 fine. 提到公園從上午 6 點開放至下午 6 點，訪客必須在關閉時間前回到公園辦公室，如果違反規定會被罰款 30 元。 綜合這兩個線索，可知 Price 先生超過規定的時間才返回，所以可能必須付罰款，(C) 是正確答案。","group":"186-190"},{"id":191,"part":7,"stem":"Which brand is newly offered at Viu Athleisure?","choices":["Bemba Team","Ventra","Upstar Athletics","Yogana"],"answer":"B","explanation":"正確答案：(B) Ventra。這是問哪個（Which）品牌是 Viu 運動休閒商店新提供的 wh- 問題，所以要看提供和題目關鍵詞語 brand ~ newly offered at Viu Athleisure 相關內容的廣告（第一篇文章）。廣告中的 Ventra is new in our store 提到 Ventra 是店裡的新品牌，所以 (B) 是正確答案。","group":"191-195"},{"id":192,"part":7,"stem":"What is true about Viu Athleisure's products?","choices":["They are only sold online.","They can be shipped overseas.","They sell four brands of clothing.","They can be personalized for a fee."],"answer":"D","explanation":"正確答案：(D) They can be personalized for a fee.。這是 Not/True 題型，要找出和關鍵詞語 Viu Athleisure's products 有關的內容，並且對照選項判斷答案，所以要看介紹 Viu 運動休閒商店販售產品的廣告（第一篇文章）。(A) 在 Visit our store at 449 South State Street in Minneapolis 的部分提到，可以去位於明尼亞波利斯 South State 街 449 號的店面，不符合選項敘述。(B) 在文章中沒有提到。(C) 在 We carry 10 brands 的部分提到販售 10 個品牌，不符合選項敘述。(D) 在 Custom printing on apparel items is available for an added charge. 的部分提到，額外付費可利用服裝的客製印刷服務，符合選項敘述，所以 (D) 是正確答案。","group":"191-195"},{"id":193,"part":7,"stem":"What does Ms. Cortez mention about the basketball team?","choices":["It has produced famous athletes.","It won a championship game.","It has players of different ages.","It has been active for many years."],"answer":"C","explanation":"正確答案：(C) It has players of different ages.。這是 Not/True 題型，要找出和關鍵詞語 the basketball team 有關的內容，並且對照選項判斷答案，所以要看 Cortez 小姐提到籃球隊相關細節的網路表單（第二篇文章）。(A)、(B)、(D) 在文章中沒有提到。(C) 在 the team is composed of individuals from middle school and high school 的部分提到，球隊是國中和高中生組成的，符合選項敘述，所以 (C) 是正確答案。","group":"191-195"},{"id":194,"part":7,"stem":"What is indicated about Ms. Cortez's purchase?","choices":["It was paid with store credit.","It included clothes made of eco-friendly materials.","It qualified for a membership discount.","It can be returned within 30 days."],"answer":"B","explanation":"正確答案：(B) It included clothes made of eco-friendly materials.。這是 Not/True 題型，要找出和關鍵詞語 Ms. Cortez's purchase 有關的內容，並且對照選項判斷答案，所以要看提到購買行為的評論（第三篇文章）。(A)、(C)、(D) 在文章中沒有提到。(B) 在 Upstar Athletics is a great company, and their clothes are fantastic. ~ They sent 35 shirts and shorts 的部分提到，Upstar Athletics 是很好的公司，他們的衣服也很棒，而且「他們」（Upstar Athletics）寄了 35 件上衣和短褲，再從廣告中的 Upstar Athletics manufactures its clothing using polyester made from recycled plastic water bottles 可知，Upstar Athletics 用回收塑膠水瓶製成的聚酯纖維製造衣服，符合選項敘述，所以 (B) 是正確答案。","group":"191-195"},{"id":195,"part":7,"stem":"What can be inferred about Viu Athleisure Shop?","choices":["It did not follow its own policy.","It is trying to open another location.","It ships all items within 48 hours.","It will modify clothes to fit."],"answer":"A","explanation":"正確答案：(A) It did not follow its own policy.。這是需要對照兩篇文章內容的推論題型，先看題目關鍵詞語 Viu Athleisure Shop 的網路表單。 線索1：網路表單（第二篇文章）中的 We promise to respond to your inquiry within 48 hours. 提到，「我們」（Viu 運動休閒商店）保證會在 48 小時內回覆詢問，而 Name: Maria Cortez、I was wondering if we could get a bulk discount 的部分顯示 Maria Cortez 想要詢問是否能獲得大量訂購的折扣。不過，這裡看不到回覆的情況，所以還需要參考評論中的相關內容。 線索2：評論（第三篇文章）中的 Author: Maria Cortez、I reached out to a store that carries Upstar Athletics among other brands, and they did not respond to my inquiry 顯示，Maria Cortez 聯絡了販售 Upstar Athletics 產品的店，而他們沒有答覆詢問。 綜合這兩個線索，可知雖然 Viu 運動休閒商店保證會在 48 小時內回覆詢問，但當 Cortez 小姐詢問的時候，他們沒有答覆，所以 (A) 是正確答案。","group":"191-195"},{"id":196,"part":7,"stem":"For whom is the Web page most likely intended?","choices":["Homeowners","Interior decorators","Hotel managers","Marketing professionals"],"answer":"A","explanation":"正確答案：(A) Homeowners。這是要綜合網頁（第一篇文章）各處的內容，推論廣告對象的推論問題。Whether you wish to add a new bathroom to your home or remodel an existing one, we guarantee that our work is high quality. 的部分提到，不管是希望為自己的家增設新浴室，還是改造現有的浴室，「我們」（Vision Bath）都保證高品質的施工，之後則說明增設或改造浴室的程序，由此可以推論網頁上的內容是給想要增設或改造浴室的屋主看的，(A) 是正確答案。","group":"196-200"},{"id":197,"part":7,"stem":"According to the questionnaire, why was Ms. Collins dissatisfied with her home?","choices":["It had a faulty plumbing system.","It was not built in a modern style.","It contained only one bathroom.","It was furnished with dark panels."],"answer":"C","explanation":"正確答案：(C) It contained only one bathroom.。這是問根據問卷（第二篇文章），Collins 小姐為什麼（Why）不滿意她的房子的 wh- 問題。問卷中的 My family is too large to continue sharing a single bathroom, so we need another one built. 提到，「我」（Collins 小姐）家裡人數太多了，很難繼續共用一間浴室，所以需要蓋另一間，(C) 是正確答案。","group":"196-200"},{"id":198,"part":7,"stem":"What information is NOT included on the questionnaire?","choices":["A maximum cost","A preferred floor material","A completion deadline","A design style"],"answer":"C","explanation":"正確答案：(C) A completion deadline。這是 Not/True 題型，要找出問卷（第二篇文章）中不包含的資訊。(A) 在 What is your budget? Between $10,000 and $15,000 的部分顯示預算是 10,000 到 15,000 元，是符合選項的內容。(B) 在 What type of floor material are you interested in? ☑ Hardwood 的部分顯示偏好的地板材質是硬木，是符合選項的內容。(C) 在文章中沒有提到，所以 (C) 是正確答案。(D) 在 Which term best describes the style of bathroom you want? ☑ Contemporary 的部分顯示，想要的浴室風格是現代風，是符合選項的內容。","group":"196-200"},{"id":199,"part":7,"stem":"What did Ms. Reynolds most likely do when she visited Ms. Collins?","choices":["Delivered a catalog","Offered a contract","Took some photographs","Collected a payment"],"answer":"B","explanation":"正確答案：(B) Offered a contract。這是需要對照兩篇文章內容的推論題型，先看提到題目關鍵詞語 Ms. Reynolds ~ do when she visited Ms. Collins 相關內容的網路評論。 線索1：網路評論（第三篇文章）中的 I was contacted by a helpful designer named Sandra Reynolds、she visited my home 提到，有一位名叫 Sandra Reynolds、樂於幫忙的設計師聯絡並且到「我」（Collins 小姐）的家。不過，這裡沒有提到 Reynolds 小姐拜訪 Collins 小姐的時候做了什麼，所以還需要參考網頁的內容。 線索2：網頁（第一篇文章）中的 You'll ~ be able to schedule a face-to-face meeting ~. During this consultation, your designer will present you with a contract 提到，顧客將能夠安排面對面會議，而在諮詢過程中，設計師將出示一份合約。 綜合這兩個線索，可知 Reynolds 小姐到 Collins 小姐的家提供諮詢時，應該出示了合約，所以 (B) 是正確答案。","group":"196-200"},{"id":200,"part":7,"stem":"What is indicated about the porcelain countertop?","choices":["It was featured in a brochure.","It is sold with accompanying items.","It is cheaper than the granite model.","It contains storage compartments."],"answer":"C","explanation":"正確答案：(C) It is cheaper than the granite model.。這是需要對照兩篇文章內容的題目。這是 Not/True 題型，要找出和關鍵詞語 porcelain countertop 有關的內容，並且對照選項判斷答案，所以先看提到陶瓷檯面的問卷。(A)、(B)、(D) 在文章中沒有提到。(C) 在問卷（第二篇文章）中 What type of countertop would you like? Porcelain 的部分顯示，Collins 小姐選擇了陶瓷檯面，但在網路評論中，she helped me choose the granite countertop. ~ it cost more than my original choice 的部分又提到「她」（Reynolds 小姐）幫「我」（Collins 小姐）選擇了花崗岩的檯面，而花的比原本的選擇要多。因此可以推知，Collins 小姐原本選擇的陶瓷檯面比花崗岩款便宜，所以 (C) 是正確答案。","group":"196-200"}],"groups":{}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE 通知</span><small>131-134</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">ATTENTION TRAVELERS</h2><p>Beginning October 5, Barings Airport will begin constructing a new terminal to 131 international flights. 132 the addition of the terminal will increase our capacity by 40 percent. The new terminal, called Terminal 5, will be located in a separate building from the four that currently operate. Consequently, it will only be accessible by light rail train or shuttle bus. 133 Some sections of the airport may also experience temporary closures, 134 portions of Terminal 4. However, all terminals will fully open by next year.</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-announcement\"><div class=\"doc-ribbon\"><span>ANNOUNCEMENT 公告</span><small>135-138</small></div><div class=\"document-body source-passages\"><p>Duluth Grand Cinema is proud to announce that it 135 Elwood Barker's documentary, Gideon's Revenge, on Thursday, October 22, at 7:00 P.M. The event will last three hours in total, with the movie running for 115 minutes. Mr. Barker will then answer audience questions for the remaining time. 136</p><p>Gideon's Revenge is based on Mr. Barker's 137 travel through Syria, Lebanon, and Iraq over the course of four years. If you are interested in viewing this first-hand account of life in the Middle East, act 138. Only a limited number of tickets are available.</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>LETTER 信件</span><small>139-142</small></div><div class=\"document-body source-passages\"><p>March 17</p><p>Clara Rodriguez<br/>644 Lockley Street<br/>Galt City, Ontario N1R 3Y8</p><p>Dear Ms. Rodriguez,</p><p>We are writing about your 139 to make your last Internet service payment. We attempted to reach you several times by telephone but were unsuccessful. Please note that your balance with Loft Net, in the amount of $63.97, was 140 on March 15. It is our policy to accept payments without applying additional fees for a week following the deadline. 141 As we value your business, we would appreciate your prompt attention to this matter. 142 the bill, contact 555-7843, and have your credit card handy.</p><p>Sincerely,</p><p>Albert Sanders<br/>Loft Net Customer Service</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>MEMO 備忘錄</span><small>143-146</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">From</span><span class=\"mail-value\">Mila Larson, Head of Marketing Communications</span></div><div class=\"mail-row\"><span class=\"mail-key\">To</span><span class=\"mail-value\">All employees</span></div><div class=\"mail-row\"><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Liang Inc. campaign</span></div><div class=\"mail-row\"><span class=\"mail-key\">Date</span><span class=\"mail-value\">July 25</span></div></div><h2 class=\"doc-heading\">Dear Staff,</h2><p>I'd like to thank everyone for contributing to the Liang Inc. promotional campaign proposal. The executives at Liang Inc. are 143 impressed with our designs and have decided to hire us. For the television commercial, we 144 everyone to participate. There is going to be a lot of work over the next few weeks, so your cooperation is vital. I have arranged for us all to meet with Liang Inc.'s CEO on July 27 so that we can figure out a detailed timeline. 145</p><p>If you have any input or additional ideas, 146 to present them during the meeting.</p><p>Thank you,<br/>Mila Larson</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>MESSAGE 對話</span><small>147-148</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sender: 555-8164</strong><time class=\"chat-time\">10:59 A.M.</time></div><div class=\"message-text\">Hi, Jackson. I got your latest draft of the newsletter. Here are my thoughts. First, thanks for trying my suggestions. The new design looks very modern and should appeal to our target audience. However, now it looks too different from our Web site. I think brand consistency is important. I would suggest using the same colors as the Web site. Could you also replace the last photo? We can't use it because it's too outdated. I will send you another one by e-mail this afternoon. Send me the next draft when you're done. Thanks again!</div></div></div></div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE 文章</span><small>149-150</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Sandi Vincent to Throw First Pitch</h2><p>March 21— Country music star Sandi Vincent will visit Warwick next month to help our baseball team, the Harpoons, start the new season. Mayor Belinda Cutter invited Ms. Vincent to throw the first pitch at the opening game on April 7.</p><p>Ms. Vincent gained nationwide fame through the success of her third album, Prairies and Plains. More recently, she made her acting debut in the film Uncle Trevor's Farm.</p><p>Due to her busy touring schedule, Ms. Vincent was unavailable for comment, but her manager stated, \"Sandi is looking forward to visiting Warwick for the first time. She's a huge baseball fan, and I'm sure she'll enjoy herself. Let's hope she throws a lucky pitch so that the Harpoons have a successful season.\"</p></div></section></div>","151-153":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 151-153</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE 通知</span><small>151-153</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Rumfax Shared Garden Opening Soon</h2><p>The growing season for Rumfax Shared Garden (RSG) is from March 31 to September 15 this year, so now is the time to register for your own garden plot. Returning gardeners from last year will pay $40 for membership, while new gardeners will be charged $55.* Anyone who lives in Rumfax is welcome to apply at www.rumfaxgarden.com. However, be sure to note the following regulations.</p><p>Each gardener is responsible for maintaining his or her plot. This includes doing all the necessary watering, weeding, and harvesting. Plots may not be expanded unless RSG coordinators grant special consent. Our personnel must also approve any structures added to plots before they are put in. RSG members may only plant in their own plots and must ensure that what they grow does not shade a neighbor's plants. Tools are available in the storage shed for all to use, but they must be returned afterward.</p><p class=\"fine-print\">*The membership fee is used to pay for water, soil, and fertilizer.</p></div></section></div>","154-155":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 154-155</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>MESSAGE 對話</span><small>154-155</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Juliet Pau</strong> <time>[3:45 P.M.]</time></div><div class=\"message-text\">Have you had a chance to inspect the proposal for our company mascot?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Chris Cormier</strong> <time>[3:48 P.M.]</time></div><div class=\"message-text\">I took a look right after lunch. Ms. Barrow interpreted our idea fairly well, I believe.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Juliet Pau</strong> <time>[3:49 P.M.]</time></div><div class=\"message-text\">I think so too. Among the three sketches, I really like how she drew the character's outfit and body in Option A. I'm not sure about the face, though. What do you think?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Chris Cormier</strong> <time>[3:50 P.M.]</time></div><div class=\"message-text\">I'm inclined to agree. The eyes should be significantly larger. The face in Option C is closer to what we want.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Juliet Pau</strong> <time>[3:51 P.M.]</time></div><div class=\"message-text\">Noted. Let's meet at 5 P.M. to go over the drawings with the rest of the team. Ms. Barrow is coming in tomorrow to get our feedback on her work. We need to decide what we're going to ask her to change.</div></div></div></div></section></div>","156-158":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 156-158</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE 文章</span><small>156-158</small></div><div class=\"document-body source-passages\"><p>DAR ES SALAAM (April 19)— Touchstone Ventures announced yesterday that it had acquired Tanzania Train Lines (TTL). This deal follows Touchstone's takeover of Umoja Transport in mid-February.</p><p>\"Our acquisition of TTL will help us move into other East African nations,\" said company chief Mieke de Graaf. \"At this point, Touchstone has to venture out into rapidly developing regions. — [1] —.\"</p><p>TTL is a formerly state-owned railway company that has struggled to remain profitable, and some of its rail lines are in urgent need of repair. \"Touchstone will need to invest heavily in upgrading TTL's infrastructure,\" said Dr. Patrick Maguli, a professor at Arusha Business University.</p><p>\"According to my research, a growing number of Tanzanians are choosing to drive or take a bus rather than a ride in a train. — [2] —. Touchstone's challenge will be to reverse this tendency,\" Dr. Maguli added.</p><p>Touchstone's plan has four parts. Its first priority will be to repair and upgrade established rail lines. After that, it plans to switch from diesel-powered trains to electric ones. The third phase will be to build new routes in order to take advantage of the growing cargo traffic to and from neighboring countries. — [3] —. Finally, Touchstone Ventures aims to develop TTL's rail network for tourism purposes. For instance, it may begin offering scenic journeys on steam-powered heritage trains. — [4] —.</p></div></section></div>","159-160":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 159-160</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT 廣告</span><small>159-160</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Goliath Storage: Secure and Convenient Spaces for Your Extra Belongings!</h2><p>Has your home or business become uncomfortably full? Well, rather than relocating, check out Goliath Storage, located at 452 East Island Way, just outside of Toronto. We have more than 800 units and offer great prices on monthly or yearly leases. Long-term leases are negotiable. You can rest assured that your belongings will be safe—we have a state-of-the-art camera system and security guards on duty 24 hours a day. For local businesses, we also have ten cold-storage units for lease, perfect for keeping goods requiring refrigeration. For the month of December only, those purchasing insurance for their stored items through our office will receive a 20 percent discount on their policy! To inquire about our unit availability, prices, and regulations, go to www.goliathstorage.on.ca.</p></div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 161-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 電子郵件</span><small>161-164</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">To</span><span class=\"mail-value\">&lt;Member List&gt;</span></div><div class=\"mail-row\"><span class=\"mail-key\">From</span><span class=\"mail-value\">info@windsorbiz.org</span></div><div class=\"mail-row\"><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Notification</span></div><div class=\"mail-row\"><span class=\"mail-key\">Date</span><span class=\"mail-value\">December 2</span></div></div><p>Dear Members,</p><p>We appreciate your continued membership as local businesses in the Windsor Business Association. Please join us for our upcoming free seminar. — [1] —. Following last month's topic on conserving electricity, this month's topic is about reducing water waste. The seminar will take place on December 13 from 10 A.M. to 12 P.M. in Room B of the Windsor Business Centre. — [2] —.</p><p>Ecologist and water conservation expert Calvin Randall will explain how local businesses can take steps to reduce costs and help preserve the environment. He will provide simple tips and techniques to follow. He will also offer free one-on-one consultations after the seminar.</p><p>Mr. Randall is a highly respected scientist and has appeared on numerous television and radio programs over the years. — [3] —. It will be a good opportunity to learn how you can cut your water expenses and protect our planet at the same time. Local business owners are also encouraged to bring along recent utility statements to learn about the different areas where savings are possible.</p><p>To sign up for this month's seminar, please reply to this e-mail. — [4] —. Thank you.</p><p>Windsor Business Association</p></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / TABLE 表單</span><small>165-167</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Arturo Realty - Customer Satisfaction Survey</h2><p>Thank you for using Arturo Realty. We want to know how effectively our services met your needs, so please take a few moments to fill out this survey.</p><p>I was buying a property<br/>I was selling a property X</p><p class=\"form-question\">Why did you choose to work with us?</p><p>I got in touch with several real estate agencies, but yours responded the most promptly. Also, Mr. Hamlin was able to answer my initial questions thoroughly.</p><p class=\"form-question\">What aspect of our services were you most pleased with?</p><p>After I accepted the buyer's offer, Mr. Hamlin kept me informed during every step of the transaction. He called me regularly to let me know what was going on.</p><p class=\"form-question\">What aspect of our services were you most disappointed with?</p><p>I would have preferred receiving more advance notice when potential buyers came to look at my house. It would have been convenient to receive at least one hour's notice.</p><p class=\"form-question\">Would you recommend our services to your family or friends?</p><p>Yes X No</p><p>Your name: Rosemary Woodard</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>MESSAGE 對話</span><small>168-171</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Maria Sanchez</strong> <time>[12:06 P.M.]</time></div><div class=\"message-text\">Sales have been disappointing these last few quarters, both online and at our stores. Any ideas how we might turn things around?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>William Behar</strong> <time>[12:09 P.M.]</time></div><div class=\"message-text\">How about working with a celebrity on a collection of furniture and home accessories? We'd need someone that is well-known and has a great sense of style.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Robert Gillibrand</strong> <time>[12:12 P.M.]</time></div><div class=\"message-text\">Fiona Connolly might work. She's a famous interior decorator.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>William Behar</strong> <time>[12:13 P.M.]</time></div><div class=\"message-text\">That would be a great fit. Her reality television show is popular right now, and I don't think she's worked with another retail store before.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Maria Sanchez</strong> <time>[12:14 P.M.]</time></div><div class=\"message-text\">Also, she has a large following on social media. Any thoughts, Gabrielle?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Gabrielle Shepard</strong> <time>[12:15 P.M.]</time></div><div class=\"message-text\">I like the idea. I can collaborate with her on designing new furniture pieces but give her the freedom to choose fabrics.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>William Behar</strong> <time>[12:17 P.M.]</time></div><div class=\"message-text\">Right. Or you could work together on designing a new bed, for example, and she could design related items like bed linens.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Robert Gillibrand</strong> <time>[12:18 P.M.]</time></div><div class=\"message-text\">OK. I'll reach out to her representative. If this works out, it could develop into a long-lasting partnership.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Maria Sanchez</strong> <time>[12:19 P.M.]</time></div><div class=\"message-text\">We should also think of other candidates in case she turns us down.</div></div></div></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>LETTER 信件</span><small>172-175</small></div><div class=\"document-body source-passages\"><p>TICKET NUMBER: 251077</p><p>Corrigan Technology Headquarters<br/>703 Shirlington Boulevard<br/>Arlington, VA 22206</p><p>October 20</p><p>Dear Sir or Madam,</p><p>To thank you for placing regular orders of our goods, we would like to invite you to a private preview of our upcoming product line. These items will be released early next year and have not yet been revealed to the public.</p><p>The event will fall on November 9, from 5 to 9 P.M., at the address given at the top of this letter. Corrigan Technology CEO Bill Schriver will deliver an introductory talk, after which design team chief Pete Wellington will present our new line of home appliances. Customers are not permitted to take pictures or record the event. A dinner will be served at 6:30 P.M., and then guests will be given a hands-on demonstration of the new products.</p><p>If you plan to attend, please call Louise Geisler at 555-4498 by October 27. If she does not hear from you by that date, we will assume that you will not be attending and remove your ticket number from our guest list.</p><p>Ticket numbers will be included in a special draw. The winning numbers will be announced at the end of the evening, so make sure to have this letter with you.</p><p>Winners will receive vouchers that entitle them to a discount when our new product line is released. The vouchers may be used at stores around the country.</p><p>We hope you can join us.</p><p>Best wishes,</p><p>Matthew Schenk<br/>Public Relations Head</p></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE 通知</span><small>176-180 · 1</small></div><div class=\"document-body source-passages\"><p class=\"notice-subject\">SPECIAL NOTICE FROM THE LUDLOW NAUTICAL MUSEUM<br/>May 14</p><p>We are sorry to announce that the Ludlow Nautical Museum is temporarily closed to the public. This is because the insulation material in our walls needs to be replaced. To protect the objects in our collection during the renovation, we have moved many of them to a third-floor storage room.</p><p>Next week, museum director Ken Lin will meet with the board of trustees and decide on the date of our reopening, which will hopefully be at the end of the summer. If you would like to receive updates on the progress of our work, please subscribe to our electronic newsletter at www.ludlownautical.org/emailsubscription.</p><p>To apologize for the inconvenience, our members will be sent a discount coupon for Crescent Bay Aquarium, which is also operated by the Ludlow Tourism Organization. Meanwhile, a free key chain from our souvenir store will be mailed to each guest whose advance reservation has been canceled.</p><p>Thank you for your understanding.</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 電子郵件</span><small>176-180 · 2</small></div><div class=\"document-body source-passages\"><div
