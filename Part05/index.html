</style></head><body><main class="shell"><section id="accountToolbar" class="panel" style="margin:0 0 14px"><div class="account-line"><label for="accountCode"><strong>使用者代號</strong></label><input id="accountCode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="自行輸入 4 位代號"><button id="connectCode" type="button">載入紀錄</button><button id="leaveCode" type="button" hidden>退出雲端模式</button><a class="home-link" href="../index.html" title="返回 TOEIC 練習中心首頁">🏠 回首頁</a><a class="exam-link" href="exam.html" title="前往第五回擬真模擬考（100 題計時測驗）">📝 擬真試題</a></div><p id="cloudNotice" role="status" class="small">未輸入代號：使用本機暫存。</p></section><header><h1>TOEIC 多益線上練習｜第五回</h1></header><section class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="right">0</b><span>答對</span></div><div class="stat"><b id="wrong">0</b><span>答錯</span></div><div class="stat"><b id="accuracy">0%</b><span>正確率</span></div></section><div class="toolbar"><select id="part"><option value="all">全部 Part</option><option value="5">Part 5</option><option value="6">Part 6</option><option value="7">Part 7</option></select><button id="all" class="active">全部題目</button><button id="missed">錯題專項練習 <span id="drillCount"></span></button><button id="starred">★ 星號題目</button><button id="overview">錯題總覽</button><button id="excerptsView" type="button">文字摘錄</button><button id="exportWrong">匯出錯題</button><button id="export">匯出作答 CSV</button><label class="import-button" for="importCsv">匯入作答 CSV</label><input id="importCsv" type="file" accept=".csv,text/csv" hidden><button id="reset">重新作答</button></div><div class="answer-pref"><label for="explainMode">作答後解析：</label><select id="explainMode" aria-label="選擇答題後解析開啟方式"><option value="auto">自動展開</option><option value="manual">點擊展開</option></select><span>解析依第五回答案詳解整理；閱讀文章可切換中英文全文</span></div><section id="drillTools" class="panel" hidden><div class="drill-toolbar"><strong>錯題專項練習</strong><span id="drillInfo"></span><button type="button" id const DATA={"questions":[{"id":101,"part":5,"stem":"Consumer surveys show that people would ______ spend up to $1,200 on a new computer.","choices":["happy","happily","happiness","happier"],"answer":"B","explanation":"正確答案：(B) happily。\n能夠用在助動詞（would）和動詞原形（spend）之間，並且修飾動詞的副詞 (B) happily（樂意地）是正確答案。形容詞 (A) 和 (D)、名詞 (C) 都不能修飾動詞。"},{"id":102,"part":5,"stem":"A well-organized resume can boost ______ chances of obtaining a job interview.","choices":["you","your","yours","yourself"],"answer":"B","explanation":"正確答案：(B) your。\n空格緊接在名詞 chances（機會）之前，需要能直接修飾名詞的所有格限定詞。選 (B) your，形成 your chances of obtaining a job interview（你獲得面試的機會）。(A) you 是主格／受格，不能直接置於 chances 前；(C) yours 是獨立所有格代名詞，不能再接名詞；(D) yourself 是反身代名詞，也不能修飾 chances。完整句意：一份條理分明的履歷能提高你獲得工作面試的機會。"},{"id":103,"part":5,"stem":"Alicia Doone's illustrations have been ______ in magazines around the city.","choices":["publisher","publish","published","publishing"],"answer":"C","explanation":"正確答案：(C) published。\n主詞 Alicia Doone’s illustrations（插畫）是「被刊登」，而非主動出版他物。have been 後接過去分詞 (C) published，組成 have been published（已被刊登）。(D) publishing 為現在分詞，會使插畫成為主動進行出版的主體；(A) publisher 是表示出版者的名詞，(B) publish 是原形動詞，都不合此處的被動結構。"},{"id":104,"part":5,"stem":"The charity shop's 24-hour drop box allows people ______ used clothes whenever it is convenient for them.","choices":["to donate","donates","donating","donation"],"answer":"A","explanation":"正確答案：(A) to donate。\n空格前面的動詞 allow（使……可以做……），後面可以接 to 不定詞當受詞補語，所以 to 不定詞 (A) to donate 是正確答案。第三人稱單數動詞 (B)、動名詞或現在分詞 (C)、名詞 (D) 不能用在 allow 的受詞補語（to 不定詞）位置。就算想把現在分詞 (C) 看成修飾前面名詞（people）的成分，但因為 allow 是第 5 類句型動詞，這樣會使句子缺少句型所需要的受詞補語，所以不對。雖然也可以把 allow 看成第 4 類句型動詞的用法「容許，給予」，並且使用選項 (D) donation 而構成「allow + 間接受詞（people）+ 直接受詞（donation）」；但缺少了能連結後面名詞 used clothes 的連接詞，所以不對。"},{"id":105,"part":5,"stem":"Chemie's Ice Cream offers an ______ of products that it changes every season.","choices":["interest","assortment","advent","influence"],"answer":"B","explanation":"正確答案：(B) assortment。\nan assortment of products 是固定名詞片語，意思是「各式各樣的商品」。因此選 (B) assortment。句子強調 Chemie’s Ice Cream 每季更換其商品組合；其他選項 interest（興趣）、advent（到來）、influence（影響）無法與 of products 構成符合文意的搭配。"},{"id":106,"part":5,"stem":"Travelers can earn reward points ______ than ever before with the new Perspectiva Plus credit card.","choices":["quick","quickly","more quickly","most quickly"],"answer":"C","explanation":"正確答案：(C) more quickly。\n空格後面有 than ever before（比以往任何時候），所以需要比較級副詞 (C) more quickly 是正確答案。原級副詞 (B) 不能和 than 連用。形容詞 (A) 不能修飾動詞。最高級副詞 (D) 不能和 than 連用。"},{"id":107,"part":5,"stem":"According to ______ collected from diners, most customers are satisfied with the restaurant's new menu.","choices":["content","procedure","feedback","investigation"],"answer":"C","explanation":"正確答案：(C) feedback。\n句意是「根據從用餐者收集到的回饋意見」，所以名詞 (C) feedback（回饋意見）是正確答案。(A) content 表示「內容」，(B) procedure 表示「程序」，(D) investigation 表示「調查」。"},{"id":108,"part":5,"stem":"Sally's Candy Shop is the third building ______ the main square on Grant Street.","choices":["from","among","under","above"],"answer":"A","explanation":"正確答案：(A) from。\n句意是「Sally's 糖果店是 Grant 街上從主廣場數來的第三棟建築物」，所以表示起點的介系詞 (A) from（從……）是正確答案。(B) among 表示「在……之中」，(C) under 表示「在……之下」，(D) above 表示「在……上方」。"},{"id":109,"part":5,"stem":"The winner of the photography competition will be ______ by a panel of five distinguished judges.","choices":["contained","determined","implemented","interpreted"],"answer":"B","explanation":"正確答案：(B) determined。\n句意是「大賽的優勝者會由評審團決定」，所以動詞 determine（決定）的 p.p. 形 (B) determined 是正確答案。(A) contain 表示「包含，含有」，(C) implement 表示「實施」，(D) interpret 表示「詮釋」。"},{"id":110,"part":5,"stem":"Emblem Motor's new car lineup will be unveiled at the annual Chicago Auto Show ______ next year.","choices":["previously","typically","early","highly"],"answer":"C","explanation":"正確答案：(C) early。\n正確搭配是 early next year（明年初），這裡的 early 修飾時間表達，選 (C)。它不表示車展通常在每年初舉行；句意是新車陣容將在明年初舉行的芝加哥車展亮相。previously、typically、highly 都不符合該時間語意。"},{"id":111,"part":5,"stem":"The department head will assign a new project to Ms. Springs when she ______ to the office from her vacation.","choices":["returns","returning","to return","is returned"],"answer":"A","explanation":"正確答案：(A) returns。\nwhen 引導的從屬子句（when she ~ vacation）只有主詞（she），缺少了動詞，所以動詞 (A) 和 (D) 是可能的答案。因為要表達「在 Springs 小姐休假完回到辦公室的時候」的主動意義，所以主動態 (A) returns 是正確答案。另外，表時間的副詞子句連接詞（when）後面，會用現在式表示未來的情況。如果使用被動態 (D) 的話，意思會變成「Springs 小姐從休假中被歸還」，所以不對。動名詞或現在分詞 (B) 和 to 不定詞 (C) 不能用在動詞的位置。"},{"id":112,"part":5,"stem":"When companies prioritize their customers' needs ______ all else, they tend to generate repeat business.","choices":["above","where","within","toward"],"answer":"A","explanation":"正確答案：(A) above。\nWhen 引導的副詞子句（When companies ~ else）是已經具備主詞（companies）、動詞（prioritize）、受詞（their customers' needs）的完整子句，所以 all else 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表達「最優先看待顧客的需求」，所以表示位置的介系詞 (A) above（在……之上）是正確答案。(C) within 表示位置或範圍「在……之內」，(D) toward 表示方向「往……」。 (B) where 不能引導修飾片語。"},{"id":113,"part":5,"stem":"The engineers claimed that making a slight ______ to the existing solar panels would make them more effective.","choices":["modify","modified","modifiable","modification"],"answer":"D","explanation":"正確答案：(D) modification。\n空格在不定冠詞（a）後面，而且被形容詞（slight）修飾，所以名詞 (D) modification（修改）是正確答案。動詞 (A)、過去式動詞或過去分詞 (B)、形容詞 (C) 不能用在名詞位置。"},{"id":114,"part":5,"stem":"Tenants who ______ in Waterford Apartments must pay their rent on the first of the month.","choices":["occupy","engage","reside","visit"],"answer":"C","explanation":"正確答案：(C) reside。\n句意是「居住在 Waterford 公寓的房客」，所以能和空格後面的介系詞（in）構成 reside in（居住在……）的動詞 (C) reside（居住）是正確答案。(A) occupy（佔據，住）意義上似乎說得通，但因為是及物動詞，所以不能和介系詞 in 一起使用。(B) engage 和空格後面的介系詞（in）連用而形成 engage in 時，表示「參與……」，意思不對。(D) visit 表示「拜訪」。"},{"id":115,"part":5,"stem":"Without ______ public funding, the Scott Foundation will need to raise more money from private sources.","choices":["adequate","incompetent","receptive","delightful"],"answer":"A","explanation":"正確答案：(A) adequate。\n句意是「沒有足夠的公眾注資，必須從民間來源募集更多錢」，所以形容詞 (A) adequate（足夠的，適當的）是正確答案。(B) incompetent 表示「無能的」，(C) receptive 表示「善於接受的」，(D) delightful 表示「令人愉快的」。"},{"id":116,"part":5,"stem":"______ he had only two years of experience, Mr. Black was named the regional sales director of TVD Incorporated.","choices":["Even though","As a result of","In spite of","So as to"],"answer":"A","explanation":"正確答案：(A) Even though。\n前後兩個子句呈現「雖然……但是……」的讓步關係，因此選 (A) Even though（即使／雖然）。Even though 後面接有主詞與動詞的完整子句；其餘連接語若無法表示這層轉折，就不能填入。"},{"id":117,"part":5,"stem":"A customer was ______ charged twice, so a refund was issued to her credit card.","choices":["accidental","accidentally","accident","accidents"],"answer":"B","explanation":"正確答案：(B) accidentally。\n空格修飾後面的過去分詞（charged），所以副詞 (B) accidentally（意外地）是正確答案。形容詞 (A)、名詞 (C) 和 (D) 不能修飾過去分詞。"},{"id":118,"part":5,"stem":"Manuel Corporation workers will now receive life insurance coverage as one of their employment ______ .","choices":["skills","benefits","concerns","deductions"],"answer":"B","explanation":"正確答案：(B) benefits。\n句意是「作為其雇用福利之一」，所以名詞 (B) benefits（福利）是正確答案。(A) skills 表示「技能」，(C) concerns 表示「關切的事」，(D) deductions 表示「扣除額」。"},{"id":119,"part":5,"stem":"Ms. Jung was displeased to learn that she was being transferred to the Houston office as she had ______ asked to move.","choices":["before","already","often","never"],"answer":"D","explanation":"正確答案：(D) never。\n句意是「因為她從未要求調動」，所以副詞 (D) never（從未）是正確答案。(A) before 表示「之前」，(B) already 表示「已經」，(C) often 表示「經常」。"},{"id":120,"part":5,"stem":"This weekend's Phoenix Marathon is going to take place as planned ______ the forecast of rainy weather.","choices":["aside from","notwithstanding","regarding","according to"],"answer":"B","explanation":"正確答案：(B) notwithstanding。\nnotwithstanding 後可直接接名詞片語（the forecast of rain 等），意為「儘管」。句子要表達即使預報有雨，馬拉松仍照原訂計畫舉辦，因此選 (B)。它在此是讓步介系詞，不是表示原因或時間。"},{"id":121,"part":5,"stem":"Visitors to the Shiller Children's Museum are more than ______ to interact with the items on display.","choices":["pleasant","welcome","obvious","brilliant"],"answer":"B","explanation":"正確答案：(B) welcome。\n句意是「歡迎參觀者和展示品互動」，所以形容詞 (B) welcome（受到歡迎的，被允許的）是正確答案。(A) pleasant（令人愉快的）意思似乎說得通，但它不能表達人的感情，而應該改用 pleased（高興的）來表達才對。(C) obvious 表示「明顯的」。(D) brilliant 表示「傑出的」。"},{"id":122,"part":5,"stem":"Paulson Electronics can ship the products by regular mail ______ express delivery, which involves an extra charge.","choices":["so","up","at","or"],"answer":"D","explanation":"正確答案：(D) or。\n介系詞（by）的受詞是 regular mail 和 express delivery 這兩個名詞片語，中間需要用對等連接詞連接，而且要表達「用一般郵件或快速運送產品」，所以對等連接詞 (D) or（或者）是正確答案。(A) so（所以）只能連接兩個子句，而不能連接單字或片語，所以不對。(B) up 表示「往……上」。(C) at 表示「在……」。"},{"id":123,"part":5,"stem":"After its television commercial aired, Seaborn Cruises received a large ______ of inquiries from potential passengers.","choices":["size","result","majority","volume"],"answer":"D","explanation":"正確答案：(D) volume。\n句意是「收到大量來自潛在乘客的詢問」，所以名詞 (D) volume（量）是正確答案。(A) size（規模，大小）意思似乎說得通，但它是表示事物或現象的大小，而不是數量。(B) result 表示「結果」。(C) majority（多數）似乎意思接近，但它是表示特定群體中的多數，所以不對。"},{"id":124,"part":5,"stem":"The musicians practiced in the back room ______ the stage was being set up.","choices":["in order to","as","during","unless"],"answer":"B","explanation":"正確答案：(B) as。\n這個句子已經有具備主詞（The musicians）和動詞（practiced）的完整子句，所以 ~ set up 是修飾性的語句。修飾部分有動詞（was being set up），所以能引導修飾子句的副詞子句連接詞 (B) 和 (D) 是可能的答案。因為要表達「舞台搭建時，樂手們在後面的房間練習」，所以表示時間的副詞子句連接詞 (B) as（當……時）是正確答案。如果使用 (D) unless（除非……），意思會變成「除非舞台正在被搭建，不然樂手們就會在後面的房間練習」，不符合要表達的意思。(A) in order to（為了……）後面要接原形動詞，介系詞 (C) during 不能引導修飾子句。"},{"id":125,"part":5,"stem":"By recycling batteries rather than discarding them, it is possible to ______ the amount of toxic materials entering landfills.","choices":["seize","reduce","satisfy","reserve"],"answer":"B","explanation":"正確答案：(B) reduce。\n句意是「藉由回收電池，就有可能減少有毒物質總量」，所以 (B) reduce（減少）是正確答案。(A) seize 表示「抓住」，(C) satisfy 表示「滿足」，(D) reserve 表示「預約」。"},{"id":126,"part":5,"stem":"Waiters at Folza Bar and Grill are paid ______ two weeks at a rate of $9 per hour.","choices":["most","all","every","either"],"answer":"C","explanation":"正確答案：(C) every。\nevery two weeks 表示「每隔兩週」，等於 once every two weeks，選 (C) every。請注意 every 雖常接單數名詞（every week），但在 every two weeks 這類表示固定間隔的結構中，數字後使用複數 weeks 是正確的。"},{"id":127,"part":5,"stem":"Novels ______ on actual events are often very popular with readers of all age groups.","choices":["based","are based","base","basing"],"answer":"A","explanation":"正確答案：(A) based。\n這個句子已經有具備主詞（Novels）、動詞（are）和補語（popular）的完整子句，所以 ~ events 是修飾性的語句。修飾部分修飾空格前面的名詞（Novels），所以能引導修飾性語句，同時在名詞後面做修飾的過去分詞 (A) 和現在分詞 (D) 是可能的答案。因為被修飾的名詞（Novels）和分詞之間是「小說被建立在事實的基礎上」的被動關係，所以動詞 base（把……建立在某個基礎上）的過去分詞 (A) based 是正確答案。如果使用現在分詞 (D)，意思會變成「在進行建立基礎這個行為的小說」，所以不對。動詞 (B)、動詞或名詞 (C) 不能在名詞後面做修飾。"},{"id":128,"part":5,"stem":"All aspects of the job will be covered during the training course, which was designed to be as ______ as possible.","choices":["decorative","protective","comprehensive","tentative"],"answer":"C","explanation":"正確答案：(C) comprehensive。\n句意是「在被設計得盡可能全面的訓練課程中，這份工作的所有方面都會被介紹到」，所以形容詞 (C) comprehensive（全面的）是正確答案。(A) decorative 表示「裝飾的」。(B) protective 表示「保護的」。(D) tentative 表示「暫定的，試驗性的」。"},{"id":129,"part":5,"stem":"The president met with several of the country's top ______ to discuss possible solutions to the supply shortage.","choices":["manufacturer","manufactured","manufacture","manufacturers"],"answer":"D","explanation":"正確答案：(D) manufacturers。\n空格前面的形容詞可以修飾名詞，所以名詞 (A)、(C)、(D) 是可能的答案。因為空格前面有表達數量的 several of the，所以複數可數名詞 (D) manufacturers（製造業者們）是正確答案。(A) manufacturer（製造業者）是單數可數名詞，而 (C) manufacture 是不可數名詞，所以不對。另外，(C) 如果表示「產品」的話，是可數名詞，而會有複數形。動詞或過去分詞 (B) 不能被形容詞修飾。"},{"id":130,"part":5,"stem":"Failing to file your tax form ______ may lead to an amendment request from the National Tax Office.","choices":["nearly","moderately","narrowly","properly"],"answer":"D","explanation":"正確答案：(D) properly。\n句意是「沒有正確提交納稅申報單」，所以 (D) properly（適當地，正確地）是正確答案。(B) moderately（適度地）似乎意思相近，但實際上是用來表達程度不過度、數量適中而不過多的意思。(A) nearly 表示「幾乎」，(C) narrowly 表示「勉強地，差一點地」。"},{"id":131,"part":6,"stem":"Select the best option for blank 131 in the passage.","choices":["The budget has already been decided.","Our invited speakers are recognized experts.","However, this is only a temporary setback.","Therefore, the company's CEO will join us."],"group":"131-134","answer":"D","explanation":"正確答案：(D) Therefore, the company's CEO will join us.。\n這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的內容提到會議的主要討論主題是明年的部門預算，而上一句 This is a subject of vital importance. 這是非常重要的主題，所以空格的內容應該和會議討論主題的重要性有關，(D) Therefore, the company's CEO will join us 是正確答案。(A) 雖然也和會議要討論的預算有關，但因為是要討論明年的預算，所以應該不會是已經決定了，而不能選這個答案。"},{"id":132,"part":6,"stem":"Select the best option for blank 132 in the passage.","choices":["make","made","be made","be making"],"group":"131-134","answer":"C","explanation":"正確答案：(C) be made。\n動詞 need 後面可以接 to 不定詞當受詞，所以能和空格前的 to 組成 to 不定詞的動詞原形 (A)、包含動詞原形的 (C) 和 (D) 是可能的答案。另外，請注意 need 所在的 that 子句（that ~ budget）是由主格關係代名詞 that 引導的關係子句，修飾先行詞（changes）。因為空格後面沒有受詞，而且要表達「需要被做出的改變」，所以被動態 (C) be made 是正確答案。主動態 (A) 和 (D) 後面必須要有受詞，而且意思會變成「變化做～／變化正在做～」的意思，所以不對。過去式動詞或過去分詞 (B) 不能形成 to 不定詞。"},{"id":133,"part":6,"stem":"Select the best option for blank 133 in the passage.","choices":["expended","expends","expensive","expenses"],"group":"131-134","answer":"D","explanation":"正確答案：(D) expenses。\n空格被前面的形容詞（unnecessary）修飾，所以名詞 (D) expenses（花費）是正確答案。過去式動詞或過去分詞 (A)、動詞 (B)、形容詞 (C) 不能用在名詞的位置。"},{"id":134,"part":6,"stem":"Select the best option for blank 134 in the passage.","choices":["explain","confide","remember","acknowledge"],"group":"131-134","answer":"D","explanation":"正確答案：(D) acknowledge。\n句意是「確認收到備忘錄」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，只要跟助理 Hertz 小姐確認出席就可以了，由此可知寄件者希望收件者通知 Hertz 小姐並確認出席，(D) acknowledge（確認收到）是正確答案。(A) explain 表示「說明」，(B) confide 表示「吐露（秘密）」，(C) remember 表示「記得」。"},{"id":135,"part":6,"stem":"Select the best option for blank 135 in the passage.","choices":["questionable","excellent","deficient","gradual"],"group":"135-138","answer":"B","explanation":"正確答案：(B) excellent。\n句意是「得到了優秀的顧客服務」，所以 (B) excellent（優秀的）是正確答案。(A) questionable 表示「有問題的」，(C) deficient 表示「缺乏的」，(D) gradual 表示「逐漸的」。"},{"id":136,"part":6,"stem":"Select the best option for blank 136 in the passage.","choices":["Most importantly, I have been a loyal customer for many years.","The managers who answer the phones are usually very friendly.","Honestly, I was shocked to witness such unprofessional behavior.","I've used their products for various home improvement projects."],"group":"135-138","answer":"C","explanation":"正確答案：(C) Honestly, I was shocked to witness such unprofessional behavior.。\n這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的部分提到進去的時候，店裡的櫃台沒有任何員工，等了 10 分鐘才有人走近，而空格的上一句 However, she excused herself almost immediately in order to go answer the phone. 說那個人幾乎是馬上就說要接電話而離開了，所以空格的內容應該和顧客遇到這種情況的反應有關，(C) Honestly, I was shocked to witness such unprofessional behavior 是正確答案。\n選項翻譯\n(A) 最重要的是，我是多年的忠實顧客。\n(B) 接電話的經理通常非常友善。\n(C) 說實話，看到這麼不專業的行為，我感到很震驚。\n(D) 我在各種住宅改善工程中使用了他們的產品。"},{"id":137,"part":6,"stem":"Select the best option for blank 137 in the passage.","choices":["could ask","am asking","had asked","will ask"],"group":"135-138","answer":"C","explanation":"正確答案：(C) had asked。\n主要子句（I ~ Candy Apple Red）發生的事「顧客要求 Candy Apple Red」，發生的時間比 but 引導的子句（but ~ instead）「得到 Scarlet Red」來得早。注意 but 引導的子句（but ~ instead）省略了重複的主詞（I）。因為 but 子句是過去式（was given），所以表示過去特定時間點之前曾經發生什麼的過去完成式 (C) had asked 是正確答案。過去式 (A)、現在進行式 (B)、未來式 (D) 不能表示過去特定時間點之前發生的事。"},{"id":138,"part":6,"stem":"Select the best option for blank 138 in the passage.","choices":["pays","considers","understands","draws"],"group":"135-138","answer":"A","explanation":"正確答案：(A) pays。\n句意是「在比較關心顧客的店購物」，所以能和空格後面的 attention to 構成 pay attention to「關注……」的動詞 pay（付出）的第三人稱單數形 (A) pays 是正確答案。如果使用 (D) 的 draw（引起「注意」），意思會變成「去引起顧客關注的店購物」，不符合文章要表達的意思。而且，draw 的表達方式應該是 draw attention from（引起……的關注）才對。(B) consider 表示「考慮」，(C) understand 表示「理解」。"},{"id":139,"part":6,"stem":"Select the best option for blank 139 in the passage.","choices":["Thank you for inviting me to the museum opening.","The gallery will now be closing at 6 P.M. on weekdays.","I am excited to begin working together at the studio.","I've never seen paintings that look quite like yours."],"group":"139-142","answer":"D","explanation":"正確答案：(D) I've never seen paintings that look quite like yours.。\n這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 I recently saw your work at Wave Gallery and wanted to tell you that I was very impressed by your unique style. 提到，「我」（Whetzel 先生）最近在 Wave 藝廊看到 Evans 小姐的作品，想要表達自己對她獨特的風格印象深刻，所以空格的內容應該和看到作品的感想有關，(D) I've never seen paintings that look quite like yours 是正確答案。\n選項翻譯\n(A) 謝謝您邀請我參加博物館開幕。\n(B) 該藝廊現在週末將在下午 6 點關閉。\n(C) 我很興奮能在工作室開始一起工作。\n(D) 我從未見過像您這樣的畫作。"},{"id":140,"part":6,"stem":"Select the best option for blank 140 in the passage.","choices":["will hold","that holds","is holding","being held"],"group":"139-142","answer":"B","explanation":"正確答案：(B) that holds。\nas 開頭的從屬子句（as ~ week），是具備主詞（I）、動詞（run）和受詞（a small art studio）的完整子句，所以 ~ week 是修飾性的語句。修飾部分是修飾空格前面的名詞（art studio），所以包含可修飾名詞的主格關係代名詞與關係子句動詞的 (B)、包含現在分詞的 (D) 是可能的答案。因為要表達「每週舉辦幾次繪畫課的小型藝術工作室」，所以能夠引導以 art studio 為先行詞的關係子句，而且包括在關係子句中擔任主詞的主格關係代名詞、關係子句中的動詞的 (B) that holds 是正確答案。包含現在分詞的 (D) 是被動態，所以後面不能接受詞（painting classes）。動詞 (A) 和 (C) 不能在名詞後面做修飾。"},{"id":141,"part":6,"stem":"Select the best option for blank 141 in the passage.","choices":["flexibility","assistance","restrictions","demonstrations"],"group":"139-142","answer":"A","explanation":"正確答案：(A) flexibility。\n句意是「您在規劃課程方面有許多＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到身為老師，「您」（Evans 小姐）會獨自決定要使用的材料，以及要教的概念，所以名詞 (A) flexibility（彈性）是正確答案。(B) assistance 表示「協助」，(C) restriction 表示「限制」，(D) demonstration 表示「示範操作」。"},{"id":142,"part":6,"stem":"Select the best option for blank 142 in the passage.","choices":["before","so that","because","in case"],"group":"139-142","answer":"D","explanation":"正確答案：(D) in case。\n這個句子已經有具備主詞（This e-mail address）、動詞（is）和補語（the best way）的完整子句，所以 ~ interested 是修飾性的語句。修飾部分有動詞（are interested），所以需要填入能引導修飾子句的成分，而所有選項都是副詞子句連接詞，也都是可能的答案。因為要表達「要是您有興趣的話，這個電子郵件位址是聯絡我的最佳方式」，所以表示條件的副詞子句連接詞 (D) in case（假使……）是正確答案。(A) before 表示時間「在……之前」，(B) so that 表示目的「以便……」，(C) because 表示理由「因為……」。"},{"id":143,"part":6,"stem":"Select the best option for blank 143 in the passage.","choices":["except for","as long as","throughout","following"],"group":"143-146","answer":"C","explanation":"正確答案：(C) throughout。\n這個句子已經有具備主詞（The Sebastian Hill Hotel）和動詞（is going to be closed）的完整子句，所以 ~ June 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。後面的部分提到，由於 6 月是最繁忙時期的開始，所以在合作據點有足夠的臨時職缺可以提供，由此可知這間飯店應該是在 6 月暫時關閉，所以表示期間的 (C) throughout（在……的整個期間）是正確答案。(A) except for 表示例外「除了……」。(D) following 表示「在……之後」，雖然本身的意義是合理的，但用在這裡表示「飯店 6 月後關閉，而會請合作據點在 6 月提供臨時職缺」，不合邏輯。副詞子句連接詞 (B) as long as（只要……）引導修飾子句而不是片語。"},{"id":144,"part":6,"stem":"Select the best option for blank 144 in the passage.","choices":["will begin","have begun","began","were beginning"],"group":"143-146","answer":"A","explanation":"正確答案：(A) will begin。\n句意是「Sebastian Hill 的所有員工在 5 月 31 日之後開始工作」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到 6 月是最繁忙時期的開始，所以在合作據點有足夠的臨時職缺可以提供，而下一句說如果有偏好工作的飯店，要在本週結束之前告訴分公司經理，所以開始在合作據點工作是未來的事情，未來式 (A) will begin 是正確答案。現在完成式 (B) 表示過去事件的影響持續至今、剛完成的事或者過去經驗，所以不對。過去式 (C) 和過去進行式 (D) 不能表達未來發生的事。"},{"id":145,"part":6,"stem":"Select the best option for blank 145 in the passage.","choices":["contracts","commitments","requests","offers"],"group":"143-146","answer":"C","explanation":"正確答案：(C) requests。\n句意是「他不能保證滿足任何＿＿，但會謹慎考慮」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到，如果有偏好工作的飯店，要在本週結束之前告訴分公司經理，由此可知分公司經理會考慮員工對於工作地點的要求，所以名詞 (C) requests（要求）是正確答案。(A) contract 表示「合約」，(B) commitment 表示「投入，奉獻」，(D) offer 表示「提議，提案」。"},{"id":146,"part":6,"stem":"Select the best option for blank 146 in the passage.","choices":["Some of the guests might complain about the construction work.","We hope this will be followed by many more overseas locations.","We interviewed candidates for seasonal positions that start in June.","All decisions about temporary work locations will be made by May 20."],"group":"143-146","answer":"D","explanation":"正確答案：(D) All decisions about temporary work locations will be made by May 20.。\n這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的部分提到如果有偏好工作的飯店，要在本週結束之前告訴分公司經理，而空格的上一句 He cannot promise to fulfill any (requests) but will consider them carefully. 則說他不能保證滿足任何要求，但會謹慎考慮，所以空格的內容應該和分配工作地點的結果有關，(D) All decisions about temporary work locations will be made by May 20 是正確答案。\n選項翻譯\n(A) 有些住客可能會抱怨工程。\n(B) 我們希望在這之後會有更多海外據點。\n(C) 我們面試了從 6 月開始的季節性職缺人選。\n(D) 臨時工作地點將在 5 月 20 日前全部決定。"},{"id":147,"part":7,"stem":"What is indicated about Global Engineering Monthly?","choices":["It sells individual issues at a discount.","It sponsors engineering conferences.","Its readership includes experts in their field.","Its publisher prints other magazine titles as well."],"group":"147-148","answer":"C","explanation":"正確答案：(C) Its readership includes experts in their field.。\n這是 Not/True 題型，要找出和關鍵詞語 Global Engineering Monthly 有關的內容，並且對照選項判斷答案。(A)、(B)、(D) 在文章裡沒有提到。(C) 在 we've been the publication of choice for professionals in the engineering field 的部分提到，「我們」（Global Engineering 月刊）一直是工程領域專家喜好的刊物，符合選項敘述，所以 (C) 是正確答案。\n變換表達方式\nprofessionals in the engineering field 工程領域專家 → experts in their field 在自己領域中的專家"},{"id":148,"part":7,"stem":"What will Ms. Cassar receive with her subscription?","choices":["A weekly newsletter","A ticket to a conference","A small tool kit","A special edition"],"group":"147-148","answer":"C","explanation":"正確答案：(C) A small tool kit。\n這是問 Cassar 小姐訂閱會獲得什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Cassar receive with her subscription 有關的部分包括 One-year subscription ■，由此可知她要訂閱 1 年，而 Customers who order a one-year subscription receive a free compact tool kit! 的部分顯示訂閱 1 年的訂戶將獲得免費的小型工具組，所以 (C) 是正確答案。"},{"id":149,"part":7,"stem":"What is the Carson Medical Institute planning to do?","choices":["Open a research center","Test a drug","Hire new staff members","Launch an advertisement"],"group":"149-151","answer":"B","explanation":"正確答案：(B) Test a drug。\n這是問 Carson 醫學研究所打算做什麼（What）的 wh- 問題。和題目的關鍵詞語 the Carson Medical Institute planning to do 有關的部分是 We are currently developing a drug that may help rid people of insomnia. During the study, all you have to do is take it at a regular time every night for two weeks.，這部分「我們」（Carson 醫學研究所）目前正在開發可能幫助人們擺脫失眠的藥物。在研究期間，「您」（參加研究的人）只需要在 2 週之中每晚定時服用藥物，所以 (B) 是正確答案。"},{"id":150,"part":7,"stem":"The word \"regular\" in paragraph 1, line 4, is closest in meaning to","choices":["fixed","orderly","straight","ordinary"],"group":"149-151","answer":"A","explanation":"正確答案：(A) fixed。\n文中的 regular time 指「固定的時間」，因此答案 (A) fixed。此處不是「常規班次」、「普通的」等其他意思，而是說每天晚上在相同的時間服藥。"},{"id":151,"part":7,"stem":"What should people specify in the e-mail?","choices":["Their familiarity with a drug","Their preferred treatment method","Their time commitments","Their participation in previous studies"],"group":"149-151","answer":"C","explanation":"正確答案：(C) Their time commitments。\n這是問人們應該在電子郵件中說明什麼（What）的 wh- 問題。和題目的關鍵詞語 specify in the e-mail 有關的部分是 In the e-mail, please specify any medical problems you have that may interfere with the drug. Please also list your work schedule and other obligations.。這部分要求在電子郵件中說明自身可能妨礙藥物（作用）的醫療方面問題，並且列出工作時間安排與其他義務，所以 (C) 是正確答案。\n變換表達方式\nwork schedule and other obligations 工作時間安排與其他義務 → time commitments 時間上的義務"},{"id":152,"part":7,"stem":"What is suggested about Ms. Kovac?","choices":["She will be requesting some vacation time.","She does not want to contact her manager.","She normally takes morning shifts.","She will be transferred to another branch."],"group":"152-153","answer":"C","explanation":"正確答案：(C) She normally takes morning shifts.。\n這是和題目關鍵詞語 Ms. Kovac 有關的推論問題。Kathleen Massee 在 it seems that I'm supposed to work Monday morning, which is strange. I don't usually get morning shifts. 的部分提到，自己星期一上午似乎要工作，這件事很奇怪，因為她早上通常沒排班，而 Evan Rosenblatt 回應 I guess Ms. Ross needs someone to replace Ms. Kovac while she's away on vacation. 猜測是 Ross 小姐需要有人在 Kovac 小姐休假時代替她，由此可知 Kovac 小姐應該是值早班，所以 (C) 是正確答案。"},{"id":153,"part":7,"stem":"At 6:22 p.m., what does Mr. Rosenblatt mean when he writes, \"Not a problem at all\"?","choices":["He is willing to take a colleague's work shift.","An expense has already been covered by Ms. Ross.","A dental procedure will not take long.","He has not heard about any recent schedule conflicts."],"group":"152-153","answer":"A","explanation":"正確答案：(A) He is willing to take a colleague's work shift.。\n這一題問的是 Rosenblatt 先生的訊息所表達的意圖，所以要掌握引用部分（Not a problem at all）前後文的情境。Kathleen Massee 說 I was wondering if you'd be able to take that shift for me because I made a dentist appointment for that day，想知道「你」（Rosenblatt 先生）能不能代替值班，因為她那天預約了看牙醫，而 Rosenblatt 先生回應 Not a problem at all.（完全沒問題），表示他願意值 Kathleen Massee 的班，所以 (A) 是正確答案。"},{"id":154,"part":7,"stem":"What is indicated about Arts and Scraps?","choices":["It is located in New York.","It is owned by Ms. Cumby.","It closes at 6:30 p.m.","It will hold two class sessions per week."],"group":"154-155","answer":"D","explanation":"正確答案：(D) It will hold two class sessions per week.。\n這是 Not/True 題型，要找出和關鍵詞語 Arts and Scraps 有關的內容，並且對照選項判斷答案。(A) 和 (B) 在文章裡沒有提到。(C) 在 our normal hours of 10 A.M. through 6 P.M. 的部分提到，一般營業時間是上午 10 點至下午 6 點，不符合選項敘述。(D) 在 Arts and Scraps will be holding a ~ after-hours class ~ every Tuesday and Thursday 的部分提到，Arts and Scraps 將在每週二及週四舉辦營業時間後的課程，符合選項敘述，所以 (D) 是正確答案。\n變換表達方式\nevery Tuesday and Thursday 每週二及週四 → two class sessions per week 每週 2 堂課"},{"id":155,"part":7,"stem":"What is mentioned about the upcoming course?","choices":["It will be taught by a recent design graduate.","Its fees do not include class materials.","It will take place in May.","Its rates vary depending on the registration date."],"group":"154-155","answer":"D","explanation":"正確答案：(D) Its rates vary depending on the registration date.。\n這是 Not/True 題型，要找出和關鍵詞語 the upcoming course 有關的內容，並且對照選項判斷答案。(A) 在文章裡沒有提到。(B) 在 All materials are provided. 的部分提到會提供所有材料，不符合選項敘述。(C) 在 May 2, which is a month before classes start. 的部分提到 5 月 2 日是課程開始一個月前，不符合選項敘述。(D) 在 The cost of the 12-session course is $100 if you book your spot before May 2 ~ 的部分提到，如果在 5 月 2 日前預約名額，這門 12 堂的課費用是 100 元，而 After that date, our regular fee of $130 applies. 的部分則說在那之後是一般費用 130 元，符合選項敘述，所以 (D) 是正確答案。"},{"id":156,"part":7,"stem":"What is indicated about Corogo Inc.?","choices":["It offers staff professional development classes.","It is looking to hire a manager from within.","It lists available positions on its Web site.","It reviews staff members once a year."],"group":"156-158","answer":"C","explanation":"正確答案：(C) It lists available positions on its Web site.。\n這是 Not/True 題型，要找出和關鍵詞語 Corogo Inc. 有關的內容，並且對照選項判斷答案。(A)、(B)、(D) 在文章裡沒有提到。(C) 在 ~ open positions posted on the company Web site ~ 的部分提到發布於公司網站的職缺，符合選項敘述，所以 (C) 是正確答案。\n變換表達方式\nopen positions posted 被發布的職缺 → lists available positions 列出可應徵的職位"},{"id":157,"part":7,"stem":"What might change for transferred staff members?","choices":["Their parking spots","Their monthly salary","Their vacation days","Their working hours"],"group":"156-158","answer":"C","explanation":"正確答案：(C) Their vacation days。\n這是和題目關鍵詞語 change for transferred staff members 有關的推論問題。Should an employee be accepted for a position in a different department, previously approved plans for holidays will be subject to change. 的部分提到，要是員工錄取不同部門的職位，之前獲得核准的休假計畫可能被改變，由此可以推知，被調動員工的假日可能會改變，所以 (C) 是正確答案。\n變換表達方式\nplans for holidays 休假計畫 → vacation days 假日"},{"id":158,"part":7,"stem":"According to the information, on what occasion might a supervisor and a human resources employee meet?","choices":["When a disciplinary notice has been canceled","When a candidate has held a current position for under a year","When a performance review is inaccurate","When a training period is coming to an end"],"group":"156-158","answer":"B","explanation":"正確答案：(B) When a candidate has held a current position for under a year。\n這是和題目關鍵詞語 occasion ~ a supervisor and a human resources employee meet 有關的 答案。"},{"id":173,"part":7,"stem":"What is indicated about Meerson?","choices":["It plans to seek feedback from shareholders.","Some of its bottles are made of recycled plastic.","It is cutting staff in the warehouse department.","Some of its products do not require padding."],"group":"172-175","answer":"D","explanation":"正確答案：(D) Some of its products do not require padding.。\n這是和題目關鍵詞語 Meerson 有關的推論問題。Randy Poehler 在 only our fragile items need the extra padding. Our detergents ~ don't need any special protection. 的部分提到，只有易碎物品需要額外填充，洗潔劑則不需要任何特別保護，由此可以推知 Meerson 公司有些產品不需要填充物，所以 (D) 是正確答案。"},{"id":174,"part":7,"stem":"What is suggested about the pouches?","choices":["They are made of plastic.","They take longer to produce than bottles.","They come in a variety of sizes.","They were patented by Meerson."],"group":"172-175","answer":"A","explanation":"正確答案：(A) They are made of plastic.。\n這是和題目關鍵詞語 the pouches 有關的推論問題。Randy Poehler 在 Some of our competitors sell detergents in pouches that can be used to refill empty bottles. 的部分提到，有些競爭業者販賣可以用來填充空瓶的袋裝洗潔劑，然後又說 They're using plastic，表示競爭業者使用塑膠，由此可以推知袋子是用塑膠做的，所以 (A) 是正確答案。"},{"id":175,"part":7,"stem":"At 2:39 P.M., what does Mr. Poehler mean when he writes, \"We could do the same\"?","choices":["He has an idea for eliminating all plastic packaging.","He hopes to use a different type of container.","He proposes that some detergents be improved.","He wants to start cooperating with a competitor."],"group":"172-175","answer":"B","explanation":"正確答案：(B) He hopes to use a different type of container.。\n這一題問的是 Poehler 先生的訊息所表達的意圖，所以要掌握引用部分（We could do the same）前後文的情境。Poehler 先生說 Our detergents ~ come in plastic bottles ~，表示公司的洗潔劑裝在塑膠瓶裡，之後又提到 Some of our competitors sell detergents in pouches that can be used to refill empty bottles.，表示有些競爭業者販賣可以用來填充空瓶的袋裝洗潔劑，最後則表明 We could do the same.（我們可以做同樣的事），意味著他希望像競爭業者一樣使用袋裝補充包來裝洗潔劑，和目前的瓶裝不同，所以 (B) 是正確答案。"},{"id":176,"part":7,"stem":"What is the main topic of the announcement?","choices":["A delay with a building's opening","A company event taking place","An employee receiving a promotion","A new staff training program"],"group":"176-180","answer":"C","explanation":"正確答案：(C) An employee receiving a promotion。\n這一題問的是公告（第一篇文章）的主題，所以要注意文章開頭的部分。Gold Frond Resorts ~ has chosen Gareth Sunderland as visitor services director at its newest property 的部分提到，Gold Frond 度假村選擇了 Gareth Sunderland 擔任最新設施的訪客服務主任，接下來的部分則是詳細說明將要升上這個職位的 Gareth Sunderland，所以 (C) 是正確答案。"},{"id":177,"part":7,"stem":"According to the announcement, what is NOT a responsibility of the visitor services director?","choices":["Managing a booking system","Organizing leisure activities","Providing service training to staff","Handling complaints about facilities"],"group":"176-180","answer":"D","explanation":"正確答案：(D) Handling complaints about facilities。\n這是 Not/True 題型，要從公告（第一篇文章）中找出和關鍵詞語 a responsibility of the visitor services director 有關的內容，並且對照選項判斷答案。(A) 在 He will be in charge of our reservation ~ systems. 的部分提到，「他」（升職為訪客服務主任的 Sunderland 先生）將負責預約系統，符合選項敘述。(B) 在 he will help coordinate a range of fun pursuits for guests 的部分提到，Sunderland 先生將協助為住客安排一系列有趣的休閒活動，符合選項敘述。(C) 在 he will be responsible for staff training in order to ~ maintain quality service 的部分提到，Sunderland 先生將負責員工訓練，以維持高品質的服務，符合選項敘述。(D) 在文章中沒有提到，所以 (D) 是正確答案。\n變換表達方式\nbe in charge of our reservation ~ systems 負責預約系統 → Managing a booking system 管理預訂系統\ncoordinate ~ fun pursuits 安排有趣的休閒活動 → Organizing leisure activities 安排休閒活動"},{"id":178,"part":7,"stem":"What is suggested about Mr. Sunderland?","choices":["He began his career with Gold Frond Resorts.","He developed a business expansion plan.","He was employed at Vergual Paradise.","He graduated with a degree in tourism."],"group":"176-180","answer":"C","explanation":"正確答案：(C) He was employed at Vergual Paradise.。\n這是需要對照兩篇文章內容的推論題型，先看介紹題目關鍵詞語 Mr. Sunderland 的公告。\n線索1：公告（第一篇文章）中，he has served as the front office manager at our island location 的部分提到，Sunderland 先生之前在「我們」（Gold Frond 度假村）的島嶼據點擔任客務部經理，但沒有寫出那個據點的名稱，所以還需要參考廣告的內容。\n線索2：廣告（第二篇文章）中，Vergual Paradise、occupies an entire island 的部分顯示 Vergual Paradise 佔據整座島。\n綜合這兩個線索，可知 Sunderland 先生之前受雇於 Vergual Paradise，所以 (C) 是正確答案。"},{"id":179,"part":7,"stem":"What is true about Gold Frond Resorts?","choices":["Its first location recently increased its capacity.","It is preferred by visitors who intend to go shopping.","It plans to establish a budget resort.","Its resorts all have private beaches."],"group":"176-180","answer":"A","explanation":"正確答案：(A) Its first location recently increased its capacity.。\n這是 Not/True 題型，要找出和關鍵詞語 Gold Frond Resorts 有關的內容，所以要看介紹 Gold Frond 度假村的廣告（第一篇文章）。(A) 在 Our original property; recently expanded to 315 rooms 的部分提到，Gold Frond 最初的據點最近擴建至 315 間客房，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章中沒有提到。\n變換表達方式\nexpanded to 315 rooms 擴建至 315 間客房 → increased its capacity 增加容納空間"},{"id":180,"part":7,"stem":"How can people get information on resort activities?","choices":["By checking a Web site","By calling a contact number","By contacting a travel agent","By sending a text message"],"group":"176-180","answer":"A","explanation":"正確答案：(A) By checking a Web site。\n這是問人們可以怎樣（How）獲得度假村活動資訊的 wh- 問題，所以要從和題目的關鍵詞語 people get information on resort activities 有關的廣告（第二篇文章）找出相關的內容。廣告中的 You can find information on activities available at each resort at www.goldfrondresorts.com 提到可以在網站找到每座度假村可提供活動的資訊，所以 (A) 是正確答案。"},{"id":181,"part":7,"stem":"What is suggested about the Spin Genie 400?","choices":["It can be purchased unassembled.","It is manufactured at a facility in San Francisco.","It is made of lightweight materials.","It was included in a special offer."],"group":"181-185","answer":"A","explanation":"正確答案：(A) It can be purchased unassembled.。\n這是要找出和題目關鍵詞語 the Spin Genie 400 相關內容的推論問題，所以要看提到 Spin Genie 400 的第一封電子郵件。I recently bought your company's Spin Genie 400 ~ and took it to a local bike shop for assembly 的部分提到，最近買了 FrameCaster Cycles 公司的 Spin Genie 400，並且把它帶到本地的腳踏車店組裝，由此可以推知可以購買未組裝的 Spin Genie 400 並自行組裝，所以 (A) 是正確答案。"},{"id":182,"part":7,"stem":"What is mentioned about Mr. Mercado?","choices":["He purchased a bicycle from a local store.","He paid an extra fee for express delivery.","He has a couple of replacement options.","He had an item assembled for free."],"group":"181-185","answer":"C","explanation":"正確答案：(C) He has a couple of replacement options.。\n這是 Not/True 題型，要找出和關鍵詞語 Mr. Mercado 有關的內容，所以要看 Mercado 先生所寫的第一封電子郵件。(A) 在 I recently bought your company's Spin Genie 400 directly from your Web site 的部分提到，他最近在「貴公司」（FrameCaster Cycles）的網站直接購買了 Spin Genie 400，不符合選項敘述。(B) 和 (D) 在文章中沒有提到。(C) 在 I contacted your customer service department about the issue, and your representative informed me that I have two options. 的部分提到，Mercado 先生聯絡了 FrameCaster Cycles 的客服部，而客服專員告知他有兩個選擇，符合選項敘述，所以 (C) 是正確答案。"},{"id":183,"part":7,"stem":"Why was the second e-mail written?","choices":["To investigate the cause of an error","To attempt to resolve a situation","To question the validity of a rule","To suggest imposing a penalty"],"group":"181-185","answer":"B","explanation":"正確答案：(B) To attempt to resolve a situation。\n這一題問的是寫第二封電子郵件的理由。I am sorry to hear about the problem with your recent purchase of a Spin Genie 400. I have looked into the issue and discovered that our representative gave you incorrect information. 的部分表明，很遺憾得知「您」（Mercado 先生）最近購買的 Spin Genie 400 的問題，並且已經深入了解這個問題，發現客服專員傳達了不正確的資訊，之後則是說明解決這個情況的辦法，所以 (B) 是正確答案。"},{"id":184,"part":7,"stem":"What will Nora Santos do?","choices":["Write an apology to a customer","Get further training","Send an item to an updated address","Speak with a salesperson"],"group":"181-185","answer":"B","explanation":"正確答案：(B) Get further training。\n這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 Nora Santos，要問 Nora Santos 將會做什麼（What），所以先看提到 Nora Santos 的第一封電子郵件。\n線索1：第一封電子郵件中，I contacted your customer service department ~ and your representative Nora Santos informed me that I have two options. 的部分提到，寄件者 Mercado 先生聯絡了 FrameCaster Cycles 的客服部，而專員 Nora Santos 告知他有兩個選擇，但沒提到 Nora Santos 將會做什麼，所以還需要參考第二封電子郵件的內容。\n線索2：第二封電子郵件中，I have looked into the issue and discovered that our representative gave you incorrect information. 的部分提到，寄件者 Estrada 小姐已經深入了解這個問題，並且發現專員（Nora Santos）傳達了不正確的資訊給 Mercado 先生，之後 I have informed our representative of the miscommunication, and she will undergo additional training 的部分說已經通知 Nora Santos 這個溝通不良的情況，而她會接受額外訓練。\n綜合這兩個線索，可知傳達了不正確的資訊給 Mercado 先生的 Nora Santos 將會接受額外訓練，所以 (B) 是正確答案。\n變換表達方式\nundergo additional training 接受額外訓練 → Get further training 接受進一步的訓練"},{"id":185,"part":7,"stem":"According to the second e-mail, what has been provided to Mr. Mercado?","choices":["A partial refund","A store directory","A bicycle accessory","A product voucher"],"group":"181-185","answer":"D","explanation":"正確答案：(D) A product voucher。\n這是問根據第二封電子郵件，Mercado 先生得到了什麼（What）的 wh- 問題，要從中找出相關的內容。第二封電子郵件中的 I am attaching a voucher ~ that you may use on a future purchase of any FrameCaster accessory 提到，在這封信附上了未來購買任何 FrameCaster 配件時可以使用的 20 元優惠券，所以 (D) 是正確答案。"},{"id":186,"part":7,"stem":"What does the memo indicate about the visitor?","choices":["She will not speak with employees.","She will start her visit at a leisure facility.","She will not take any pictures.","She will write about some sales strategies."],"group":"186-190","answer":"C","explanation":"正確答案：(C) She will not take any pictures.。\n這是 Not/True 題型，要找出和關鍵詞語 the visitor 有關的內容，並且對照選項判斷答案，所以看提到會有訪客的備忘錄（第一篇文章）。(A) 在 As the reporter is directed through our halls, feel free to interact with her at your discretion. 的部分請員工在記者被帶領通過走廊的時候自由互動，不符合選項敘述。(B) 在文章中沒有提到。(C) 在 No photographs will be taken 的部分提到不會拍照片，符合選項敘述，所以 (C) 是正確答案。(D) 在 She is writing a short article about our office design and employee benefits. 的部分提到，她正在寫關於公司的辦公室設計與員工福利的短篇文章，不符合選項敘述。"},{"id":187,"part":7,"stem":"What is suggested about Mr. Zhou?","choices":["He had his picture taken by a journalist.","He met with Ms. Singh to make arrangements.","He e-mailed Mr. Worley regarding a schedule.","He is not based at Zazoo Software's headquarters."],"group":"186-190","answer":"C","explanation":"正確答案：(C) He e-mailed Mr. Worley regarding a schedule.。\n這是需要對照兩篇文章內容的推論題型，先看寄給題目的關鍵詞語 Mr. Zhou 的電子郵件。\n線索1：電子郵件（第二篇文章）中的 I will not be able to return to Sydney on March 1 due to a travel emergency. If I can visit on another date, please contact my assistant, Dennis Worley, at d.worley@thesydneyun.au 提到，「我」（Singh 小姐）因為旅行中的緊急情況而無法在 3 月 1 日回到雪梨，如果可以在其他日期參觀，就寄電子郵件聯絡助理 Dennis Worley。不過，從這裡看不出來 Zhou 先生是否有寄電子郵件給 Dennis Worley，所以還需要參考文章的相關內容。\n線索2：文章（第三篇文章）中的 I was able to see these for myself on March 4, when I was given a tour of the facilities. 提到，「我」（Singh 小姐）在 3 月 4 日接受了設施的導覽，而能夠親眼看到 Zazoo 軟體公司的這些休閒設施空間。\n綜合這兩個線索，可知因為 Zhou 先生寄了電子郵件給 Worley 先生討論時間安排，而讓 Singh 小姐可以改在 3 月 4 日參觀公司，所以 (C) 是正確答案。"},{"id":188,"part":7,"stem":"Who most likely is Ms. Sanchez?","choices":["A local newspaper reporter","An architect of a new office building","A building administrator","An executive at a software company"],"group":"186-190","answer":"D","explanation":"正確答案：(D) An executive at a software company。\n這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Ms. Sanchez 出現的文章。\n線索1：文章（第三篇文章）中的 “We are currently in the final phase of designing our new software program,” Cathy Sanchez said while showing me the plan for the project. 提到，在讓記者看專案的計畫時，Cathy Sanchez 說他們目前在設計新軟體程式的最後階段。不過，這裡沒有具體說明 Sanchez 小姐是什麼人，所以還需要參考備忘錄中的相關內容。\n線索2：備忘錄（第一篇文章）中的 One of our senior executives will ~ introduce our latest software development plan to her. 提到，一位資深主管將會向記者簡單介紹最近的軟體開發專案。\n綜合這兩個線索，可知 Sanchez 小姐是向記者介紹最近軟體開發專案的資深主管，所以 (D) 是正確答案。"},{"id":189,"part":7,"stem":"According to the article, what is a benefit of Zazoo Software's work environment?","choices":["It promotes cooperation among team members.","It is designed to reduce workplace injuries.","It improves the performance of staff.","It offers large spaces for meeting with clients."],"group":"186-190","answer":"C","explanation":"正確答案：(C) It improves the performance of staff.。\n這是問根據文章（第三篇文章），Zazoo 軟體公司工作環境的一項好處是什麼（What）的 wh- 問題。文章中的 All these facilities help employees perform at high levels of efficiency, and I could see that this was true during my time at the office. 提到，這些設施全都能幫助員工有高效率的表現，而在參觀辦公室的時候，可以看到這一點是真的，所以 (C) 是正確答案。\n變換表達方式\nhelp employees perform at high levels of efficiency 幫助員工有高效率的表現 → improves the performance of staff 改善員工的表現"},{"id":190,"part":7,"stem":"Which facility has NOT yet been opened at the Zazoo Software's newest office?","choices":["A yoga studio","A staff cafeteria","An office gym","A swimming pool"],"group":"186-190","answer":"A","explanation":"正確答案：(A) A yoga studio。\n這是 Not/True 題型，要找出和關鍵詞語 facility ~ opened at the Zazoo Software's newest office 有關的內容，並且對照選項判斷答案，所以看介紹 Zazoo 軟體公司最新辦公室設施的文章（第三篇文章）。(A) 在 plans call for the addition of a yoga ~ studio by the end of the year 的部分提到，計畫在年底前增設瑜伽與冥想工作室，表示還沒開放，所以 (A) 是正確答案。(B) 在 Free food is available for employees in every cafeteria 的部分提到，每間內部餐廳都為員工提供免費食物，表示已經開放員工餐廳。(C) 和 (D) 在 In terms of exercise facilities, there is ~ pool, and gym 的部分提到，運動設施方面有游泳池和健身房，符合選項內容。"},{"id":191,"part":7,"stem":"Why was the note written?","choices":["To assign a task","To express disappointment","To recommend a device","To seek advice"],"group":"191-195","answer":"A","explanation":"正確答案：(A) To assign a task。\n這一題問的是寫便條（第一篇文章）的理由。在便條中，we require a photo of Dire Dawa Central Park 提到需要 Dire Dawa 中央公園的照片，然後 It is up to you to find such an image 的部分表明找這樣的照片是「你」（Fekade 先生）的責任，所以 (A) 是正確答案。"},{"id":192,"part":7,"stem":"What information is NOT included on the form?","choices":["The subject of a photo","The location where an image was taken","A client's contact information","The name of a photographer"],"group":"191-195","answer":"C","explanation":"正確答案：(C) A client's contact information。\n這是 Not/True 題型，要從表單（第二篇文章）找出相關的內容。題目沒有特殊的關鍵詞語，而是要利用選項的關鍵詞語找出各自的相關內容。(A) 對應 Image Name: Crowd Watching Musical Performance，顯示照片名稱是看著音樂表演的人們，是符合選項的內容。(B) 對應 Location: Fountain at Dire Dawa Central Park，顯示地點是 Dire Dawa 中央公園的噴泉，是符合選項的內容。(C) 在文章中沒有提到，所以 (C) 是正確答案。(D) 對應 Taken By: Delores Ashburn，表示攝影者是 Delores Ashburn，是符合選項的內容。"},{"id":193,"part":7,"stem":"What can be inferred about Mr. Fekade?","choices":["He has permission to negotiate contracts with agencies.","He was unable to find a suitable image at his workplace.","He is still undergoing training for recently hired personnel.","He submitted some images taken at an incorrect location."],"group":"191-195","answer":"B","explanation":"正確答案：(B) He was unable to find a suitable image at his workplace.。\n這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Mr. Fekade 出現的便條。\n線索1：便條（第一篇文章）中的 Please check our photo archive, as we may already have one that meets this description. Otherwise, you can search the collection of a photo agency such as ~ Baumgard Pics. 提到，要請 Fekade 先生查看「我們」（Fekade 先生的公司）的照片檔案庫，因為可能有符合這種描述的照片，而要是沒有的話，可以搜尋 Baumgard Pics 之類照片供應商的照片集。不過，這裡看不出來 Fekade 先生會在哪裡找到照片，所以還需要參考表單中的相關內容。\n線索2：表單（第二篇文章）中的 Baumgard Pics、Customer: Dawit Fekade 顯示，Fekade 先生在 Baumgard Pics 找到並購買了照片。\n綜合這兩個線索，可知 Fekade 先生在 Baumgard Pics 找符合條件的照片，是因為在公司的照片檔案庫找不到，所以 (B) 是正確答案。"},{"id":194,"part":7,"stem":"What size of image did Mr. Fekade purchase?","choices":["Small","Medium","Large","Extra large"],"group":"191-195","answer":"C","explanation":"正確答案：(C) Large。\n必須把第一份需求文件提出的圖片用途與第二份圖片選購／授權資料的尺寸選項對照，才能確定 Mr. Fekade 所購買的尺寸。正確選 (C) Large。不能只看單篇文字中的尺寸名稱而忽略用途及需求。"},{"id":195,"part":7,"stem":"According to the bill, what will happen after five years have passed?","choices":["A photography supplier will update a user agreement.","A company will replace its source of photos.","A Web site membership will expire.","A customer will no longer be entitled to use a picture."],"group":"191-195","answer":"D","explanation":"正確答案：(D) A customer will no longer be entitled to use a picture.。\n這是問根據帳單（第三篇文章），5 年後會發生什麼事（What）的 wh- 問題，要從中找出和關鍵詞語 happen after five years have passed 有關的內容。Please be aware that your right to use the photo expires after five years. 的部分提到，照片使用權將於 5 年後到期，所以 (D) 是正確答案。\n變換表達方式\nright to use the photo expires 照片使用權到期 → no longer be entitled to use a picture 不再有資格使用照片"},{"id":196,"part":7,"stem":"What type of work does Dr. Shen currently do?","choices":["She develops medications for a company.","She supervises projects at a university.","She operates a physical therapy clinic.","She writes health-care textbooks."],"group":"196-200","answer":"B","explanation":"正確答案：(B) She supervises projects at a university.。\n這是問 Shen 博士目前做什麼（What）類型工作的 wh- 問題，所以要從介紹題目的關鍵詞語 Dr. Shen 的公告（第一篇文章）找出相關的內容。公告中的 she has been employed by KUEM, where she leads ~ research projects 提到，「她」（Shen 博士）受聘於 KUEM，並且在那裡主導研究計畫，所以 (B) 是正確答案。\n變換表達方式\nleads 領導 → supervises 監督"},{"id":197,"part":7,"stem":"According to the announcement, what is NOT a booking method for the upcoming lecture?","choices":["Visiting an office","Calling a number","Completing an online form","Sending an e-mail"],"group":"196-200","answer":"C","explanation":"正確答案：(C) Completing an online form。\n這是 Not/True 題型，要從公告（第一篇文章）中找出和關鍵詞語 a booking method for the upcoming lecture 有關的內容，並且對照選項判斷答案。(A)、(B)、(D) 在 please make a booking by visiting the school events office, dialing extension #364, or sending an e-mail to Jayne Marche 的部分提到，要用到校內活動辦公室、撥打分機 #364 或寄電子郵件給 Jayne Marche 等其中一種方式進行預約，符合選項敘述。(C) 在文章中沒有提到，所以 (C) 是正確答案。"},{"id":198,"part":7,"stem":"What is indicated about Dr. Higgins's students?","choices":["They are in their final year of a medical program.","They are exchange students from another university.","They will be submitting reports following a talk.","They will attend a lecture free of charge."],"group":"196-200","answer":"D","explanation":"正確答案：(D) They will attend a lecture free of charge.。\n這是需要對照兩篇文章內容的推論題型，先看和題目的關鍵詞語 Dr. Higgins's students 有關的第一封電子郵件。\n線索1：第一封電子郵件（第二篇文章）中，I'm teaching an advanced course in alternative medicine here at BRMS, and nine students are currently enrolled. I'd like to make a reservation for all ten of us to attend Dr. Shen's upcoming lecture. 的部分提到，「我」（Higgins 博士）正在 BRMS 教授替代醫學的進階課程，目前有 9 名學生，想要為自己和學生總共 10 個人預約參加 Shen 博士即將進行的演說。不過，這裡沒有提到演說的細節，所以還需要參考公告的內容。\n線索2：公告（第一篇文章）中，The lecture is free for all instructional staff and students at BRMS 的部分提到 BRMS 的所有教員與學生都可以免費參加這次演說。\n綜合這兩個線索，可知 Higgins 博士在 BRMS 的學生會免費參加演說，所以 (D) 是正確答案。"},{"id":199,"part":7,"stem":"What will happen at the end of Dr. Shen's lecture?","choices":["A video will be shown.","Questions will be responded to.","Assignments will be given.","Certificates will be presented."],"group":"196-200","answer":"B","explanation":"正確答案：(B) Questions will be responded to.。\n這是問 Shen 博士演說的最後會發生什麼事（What）的 wh- 問題，所以要看談到和題目關鍵詞語 happen at the end of Dr. Shen's lecture 相關內容的第二封電子郵件（第三篇文章）。第二封電子郵件中的 the lecture will last for about an hour and a half, and it will be followed by a question-and-answer session that should take 30 minutes 提到，演說會持續大約 1 小時半，之後會有應該長達 30 分鐘的問答時間，所以 (B) 是正確答案。\n變換表達方式\na question-and-answer session 問答時間 → Questions will be responded to 問題將會被回答"},{"id":200,"part":7,"stem":"What will Ms. Marche most likely do after September 4?","choices":["Share a video recording with Dr. Higgins","Attend a special medical seminar at KUEM","Extend another invitation to Dr. Shen","Meet with a department head at BRMS"],"group":"196-200","answer":"A","explanation":"正確答案：(A) Share a video recording with Dr. Higgins。\n這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Ms. Marche 所寫的第二封電子郵件。\n線索1：第二封電子郵件（第三篇文章）中，A BRMS instructor has requested that a video be recorded of the lecture taking place on September 4. 的部分提到，一位 BRMS 的講師要求將 9 月 4 日舉行的演說錄影，然後 Try to finish editing the footage within three days ~. I will ~ forward it to the instructor who requested it. 的部分要求對方在 3 天內完成影片編輯，然後 Marche 小姐會把完成的影片轉寄給要求影片的講師。不過，這裡沒有寫出要求影片的講師是誰，所以還需要參考第一封電子郵件的内容。\n線索2：第一封電子郵件（第二篇文章）中，I was wondering if anyone will be making a video of the lecture. I would like to possibly share her talk with future students. 的部分提到，「我」（寄件人 Higgins 博士）想知道會不會有人錄製演說的影片，以及想和未來的學生分享她的演說。\n綜合這兩個線索，可知 Marche 小姐將在 9 月 4 日的演說之後，把製作完成的演說影片轉寄給 Higgins 博士，所以 (A) 是正確答案。\n變換表達方式\nforward 轉寄 → Share 分享"}],"groups":{}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 131-134 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>INTERNAL MEMO</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">To</span><span class=\"mail-value\">Department heads</span></div><div><span class=\"mail-key\">From</span><span class=\"mail-value\">Ronaldo Reyes</span></div><div><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Next year's budgets</span></div><div><span class=\"mail-key\">Date</span><span class=\"mail-value\">May 15</span></div></div><p>Our monthly department head meeting will be held on Wednesday, May 30, at 7 P.M. As always, it will be in the conference room on the 16th floor.</p>\n<p>The main topic of discussion will be our departmental budgets for next year. This is a subject of vital importance. <strong class=\"blank-number\">131</strong> In preparation for the meeting, I'd like each of you to put together a report that summarizes your department's annual costs and highlights changes that may need to <strong class=\"blank-number\">132</strong> to your budget. Specifically, look for unnecessary <strong class=\"blank-number\">133</strong> to eliminate as this will save the company money overall.</p>\n<p>Please <strong class=\"blank-number\">134</strong> that you have received this memo. You may do this simply by confirming your attendance with my assistant Ms. Hertz. Thank you.</p>\n</div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 135-138 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-review\"><div class=\"doc-ribbon\"><span>CUSTOMER REVIEW</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><p>The first time I went to True Colors Paint Supply, I received <strong class=\"blank-number\">135</strong> customer service. Unfortunately, my second experience with them was not nearly as good. Yesterday when I went in, there were no employees at the front of the store. After ten minutes of looking at color samples, an employee finally approached me. However, she excused herself almost immediately in order to go answer the phone. <strong class=\"blank-number\">136</strong> If that weren't bad enough, someone else made a mistake on my order when I finally got some help. I <strong class=\"blank-number\">137</strong> for Candy Apple Red but was given Scarlet Red instead. Next time, I will shop at another store that <strong class=\"blank-number\">138</strong> more attention to its customers.</p>\n</div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 139-142 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">To</span><span class=\"mail-value\">Julie Evans &lt;julie@juliepaints.com&gt;</span></div><div><span class=\"mail-key\">From</span><span class=\"mail-value\">David Whetzel &lt;director@artunlimited.com&gt;</span></div><div><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Art class</span></div><div><span class=\"mail-key\">Date</span><span class=\"mail-value\">February 12</span></div></div><p>Dear Ms. Evans,</p>\n<p>I recently saw your work at Wave Gallery and wanted to tell you that I was very impressed by your unique style. <strong class=\"blank-number\">139</strong> I'm writing today as I run a small art studio <strong class=\"blank-number\">140</strong> painting classes several times a week. We occasionally invite artists who can teach our students something other than basic oil or acrylic painting techniques, and I was wondering whether you would be interested in being our next guest instructor. You would have a lot of <strong class=\"blank-number\">141</strong> in planning the class. As the teacher, you alone would decide on the materials to use and the concepts to teach.</p>\n<p>I look forward to hearing from you. This e-mail address is the best way to contact me <strong class=\"blank-number\">142</strong> you are interested.</p>\n<p>Sincerely,\nDavid Whetzel\nDirector of Art Unlimited</p>\n</div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 143-146 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>OFFICIAL NOTICE</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>ATTENTION EMPLOYEES:</strong></h2>\n<p>The Sebastian Hill Hotel is going to be closed <strong class=\"blank-number\">143</strong> the month of June. The building is in need of some renovations that cannot be completed while guests are here.</p>\n<p>Since June is the start of our busiest period, there are enough temporary job openings for everyone at our partner locations. Therefore, all Sebastian Hill staff members <strong class=\"blank-number\">144</strong> their work at either the Daytona Hotel or the New Orleans resort after their final day here, on May 31.</p>\n<p>Should you have a preference for which hotel you would like to work at, please tell Jim Stevens, the branch manager, before the end of this week. He cannot promise to fulfill any <strong class=\"blank-number\">145</strong>, but will consider them carefully. <strong class=\"blank-number\">146</strong></p>\n</div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 147-148 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-form type-catalog\"><div class=\"doc-ribbon\"><span>FORM / DOCUMENT</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Global Engineering Monthly (GEM)</strong></h2>\n<p>For over 30 years, we've been the publication of choice for professionals in the engineering field. Each issue of Global Engineering Monthly includes equipment reviews, articles on current trends, and profiles of successful engineers.</p>\n<p><strong>Subscription Packages</strong></p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th>Subscription</th>\n<th style=\"text-align:right\">Price</th>\n<th style=\"text-align:right\">Per issue</th>\n<th style=\"text-align:center\">Chosen</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Six-month</td>\n<td style=\"text-align:right\">$36.00</td>\n<td style=\"text-align:right\">$6.00</td>\n<td style=\"text-align:center\">□</td>\n</tr>\n<tr>\n<td>One-year</td>\n<td style=\"text-align:right\">$66.00</td>\n<td style=\"text-align:right\">$5.50</td>\n<td style=\"text-align:center\">■</td>\n</tr>\n<tr>\n<td>Two-year</td>\n<td style=\"text-align:right\">$96.00</td>\n<td style=\"text-align:right\">$4.00</td>\n<td style=\"text-align:center\">□</td>\n</tr>\n</tbody>\n</table></div>\n<p>Would you like to subscribe to GEM's weekly newsletter, delivered conveniently by e-mail?\nYes □　No ■</p>\n<p><strong>Your Details</strong></p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>Name</strong></th>\n<th style=\"text-align:left\"><strong>Lorenza Cassar</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Address</td>\n<td style=\"text-align:left\">17 Triq Annetto Caruana</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">City</td>\n<td style=\"text-align:left\">Qawra</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Country</td>\n<td style=\"text-align:left\">Malta</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Postal Code</td>\n<td style=\"text-align:left\">SPB 1215</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">E-mail Address</td>\n<td style=\"text-align:left\">lorenza@rcengineering.com</td>\n</tr>\n</tbody>\n</table></div>\n<p>*Customers who order a one-year subscription receive a free compact tool kit!</p>\n<p>*Customers who order a two-year subscription receive a free pass to the Transnational Engineering Conference in New York City on May 9!</p>\n<p>Go to Billing</p>\n</div></section></div>","149-151":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 149-151 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>OFFICIAL NOTICE</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><p><strong>Attention:</strong></p>\n<p>If you frequently suffer from insomnia or suspect that you have a sleeping disorder, you may be qualified to participate in a new study taking place at the Carson Medical Institute. We are currently developing a drug that may help rid people of insomnia. During the study, all you have to do is take it at a <strong>regular</strong> time every night for two weeks. Then, you will be asked to complete a report about its effects on your sleep as well as any side effects.</p>\n<p>If you are between the ages of 18 and 50, you are eligible to take part in this study. To sign up, please contact us at sleepstudy@cmi.org. In the e-mail, please specify any medical problems you have that may interfere with the drug. Please also list your work schedule and other obligations. The deadline to sign up is December 1. All participants will be paid $200 for their time.</p>\n</div></section></div>","152-153":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 152-153 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>ONLINE CHAT</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kathleen Massee</strong><time class=\"chat-time\">[6:18 p.m.]</time></div><div class=\"message-text\">Hi, Evan. I just noticed that the schedule for next week has already been posted, and it seems that I'm supposed to work Monday morning, which is strange. I don't usually get morning shifts.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Evan Rosenblatt</strong><time class=\"chat-time\">[6:19 p.m.]</time></div><div class=\"message-text\">I guess Ms. Ross needs someone to replace Ms. Kovac while she's away on vacation.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kathleen Massee</strong><time class=\"chat-time\">[6:20 p.m.]</time></div><div class=\"message-text\">I see. Well, in any case, I was wondering if you'd be able to take that shift for me because I made a dentist appointment for that day.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Evan Rosenblatt</strong><time class=\"chat-time\">[6:22 p.m.]</time></div><div class=\"message-text\">Not a problem at all. I don't have anything else to do at that time anyway. I'm sure Ms. Ross will be fine with the change, but you should let her know about it before the end of the day so that she can modify the schedule.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kathleen Massee</strong><time class=\"chat-time\">[6:23 p.m.]</time></div><div class=\"message-text\">Thanks so much. I owe you one.</div></div></div>\n\n\n\n\n</div></section></div>","154-155":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 154-155 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Arts and Crafts Are Not Just for Kids!</strong></h2>\n<p>This summer, local supply store Arts and Scraps will be holding a small after-hours class for adult learners every Tuesday and Thursday from 6:30 p.m. to 8:30 p.m. The class will provide instruction in a variety of techniques, including glass painting, linoleum block printing, and mixed media collage making. It will be taught by illustrator Maude Cumby, who worked in New York as an artist for 10 years and is a graduate of the Pulford Academy of Design.</p>\n<p>The cost of the 12-session course is $100 if you book your spot before May 2, which is a month before classes start. After that date, our regular fee of $130 applies. All materials are provided. Visit <a href=\"https://www.artsandscraps.com/classes\" rel=\"noopener noreferrer\" target=\"_blank\">www.artsandscraps.com/classes</a> to sign up, or drop by our store and register during our normal hours of 10 a.m. through 6 p.m.</p>\n</div></section></div>","156-158":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 156-158 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>OFFICIAL NOTICE</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Corogo Inc. Employee Transfer Policy</strong></h2>\n<p>Corogo Inc. supports the professional development of its staff and recognizes that some employees may wish to pursue advancement opportunities within the company. Corogo Inc. employees may apply internally for open positions posted on the company Web site if they:</p>\n<p>• have worked in their current position for at least 12 months*\n• possess the minimum qualifications or requirements listed in one of our job postings\n• have received a performance review level of at least \"satisfactory\" within the last six months\n• have received no written warnings or notices within the last 12 months</p>\n<p>Employees who are interested in applying for a different position are advised to notify their current managers as soon as possible. Regular full-time staff members are required to give their supervisors a minimum of two weeks' notice before submitting an application.</p>\n<p>Should an employee be accepted for a position in a different department, previously approved plans for holidays will be subject to change.</p>\n<p>*Only in rare circumstances will employees who do not meet the requirements above be considered for a transfer. In this situation, a Corogo Inc. human resources employee will meet with the staff member's current supervisor to determine whether a transfer is appropriate.</p>\n</div></section></div>","159-160":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 159-160 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-webpage\"><div class=\"doc-ribbon\"><span>WEB PAGE</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><div class=\"browser-chrome\"><span class=\"browser-dots\">● ● ●</span><span>WEB DOCUMENT</span></div><h2 class=\"doc-heading\">HOME | DAILY FEATURED CONTESTS | ADVERTISE | CONTACT FORM</h2>\n<p><strong>Advertising on Contest Craze:</strong></p>\n<p>Are you promoting a contest, draw, or giveaway for your business or organization? If you need help getting the word out, you've come to the right place. If you have a contest you think people should know about, send us a description, and we'll post it on our homepage for free for one day. If you'd like even more exposure, select one of our advertising options below to make your post a featured contest. This means that it will stay at the top of our homepage and be included in the daily e-mail newsletter sent to our members.</p>\n<p>Prices for featuring a contest:</p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>One day</strong></th>\n<th style=\"text-align:left\"><strong>$35</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Two days</td>\n<td style=\"text-align:left\">$65</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Three days</td>\n<td style=\"text-align:left\">$90</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">One week</td>\n<td style=\"text-align:left\">$200</td>\n</tr>\n</tbody>\n</table></div>\n<p>Please note that we do not post information about contests that require an entry fee.</p>\n</div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 161-164 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE / NEWS</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Environmental Awareness Day Giveaway</strong>\nBy Brenda Galway, staff reporter</h2>\n<p>To celebrate Environmental Awareness Day on May 1, Winstonville will be giving away 2,000 free young trees to members of the community on a first-come, first-served basis. This initiative is part of the municipal government's pledge to plant 10,000 trees in order to improve the sustainability of the city. According to urban planning manager Jane Stein, trees can be picked up at Mulligan's Nursery on Fennel Road and Central City Community Center from 8:00 A.M. to 11:30 A.M. A number of trees will also be available at the Home and Garden Shop on Clifton Avenue from 4:30 P.M. to 8:00 P.M. for those who can't make it in the morning.</p>\n<p>\"Just remember to follow the directions posted on the city's Web site for planting and caring for each tree you take,\" said Ms. Stein. \"We're <strong>tracking</strong> the growth progress of the trees. I'm pleased to say that, according to the official list, we have already planted 800 new trees in the city so far.\" Residents who don't have their own property but still want to participate in the initiative can join special gardening events held by local nonprofit organization Planet Plant. Visit <a href=\"https://www.winstonvillegov.org/parksandrecdept\" rel=\"noopener noreferrer\" target=\"_blank\">www.winstonvillegov.org/parksandrecdept</a> for more details.</p>\n</div></section></div>","165-168":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 165-168 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-webpage\"><div class=\"doc-ribbon\"><span>WEB PAGE</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><div class=\"browser-chrome\"><span class=\"browser-dots\">● ● ●</span><span>WEB DOCUMENT</span></div><p><a href=\"https://www.dpqtransport.com/aboutus\" rel=\"noopener noreferrer\" target=\"_blank\">www.dpqtransport.com/aboutus</a></p>\n<p><strong>About Us:</strong></p>\n<p>DPQ Transport is a charter bus rental company that provides service nationwide seven days a week, 24 hours a day. Whether you need to transport a group for a tour or a business retreat, we guarantee that traveling with us is the right choice.</p>\n<p>Safety is our number one priority. Accordingly, our drivers are highly trained individuals with many years of experience behind the wheel. — [1] —. Furthermore, our vehicles are maintained regularly to ensure they are always functioning properly at the time of departure.</p>\n<p>We also pride ourselves on comfort and convenience. — [2] —. Along with having plenty of legroom, each of the reclining seats in our vehicles is fitted with electrical sockets for your devices as well as adjustable air conditioning vents. Free wireless Internet is also available. You can also bring small meals or snacks with you or schedule a stop at a popular restaurant. — [3] —.</p>\n<p>Finally, our buses can seat up to 56 people, meaning that using our service is a cost-effective way to travel as a group. — [4] —.</p>\n<p>If DPQ Transport is the right choice for you, send the details of your trip to queries@dpqtransport.com. We'll respond with a competitive quote and a proposed itinerary within 24 hours.</p>\n</div></section></div>","169-171":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 169-171 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE / NEWS</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Cell Phone Tower Construction to Begin Soon</strong></h2>\n<p>The construction of a new cell phone tower in the seaside town of Farview is set to begin shortly, much to the dismay of some local residents. [1] —. First proposed three years ago, the project was stalled when people began to raise concerns about its proposed location at a beachfront parking lot. Many said the tower would spoil the area's natural beauty. Others voiced fears that its presence might cause various health and safety issues for those who live near the site, not to mention lower property values. [2] —</p>\n<p>In this regard, city officials reassured the public that the tower will not only be safe but will also generate substantial rental revenue in the amount of approximately $20,000 per year from each wireless carrier that rents space on it. [3] —. Furthermore, the influx of tourists to Farview each summer means that the tower is becoming increasingly necessary for practical reasons. \"The more visitors we have, the more phones there are,\" said city council member Fred White. [4] —. As for concerns about the structure's appearance, local artist Katherine Tatum helped with its design so that the tower will blend in well with the natural surroundings.</p>\n</div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 172-175 · 1 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>ONLINE CHAT</span><small>DOCUMENT 1 / 1</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Bryce Turner</strong><time class=\"chat-time\">2:30 P.M.</time></div><div class=\"message-text\">Did you hear that our company's shareholders want us to cut down on waste? I think it's important for us to respect their wishes, so I'd like to find some ways to reduce the amount of non-recyclable packaging materials we use here at Meerson.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sophie Moore</strong><time class=\"chat-time\">2:31 P.M.</time></div><div class=\"message-text\">We recently lessened the amount of plastic foam we put inside boxes by 40 percent. Is there anything else we can do?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Bryce Turner</strong><time class=\"chat-time\">2:34 P.M.</time></div><div class=\"message-text\">Could we eliminate the foam completely and start using shredded newspaper instead?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Randy Poehler</strong><time class=\"chat-time\">2:35 P.M.</time></div><div class=\"message-text\">And only our fragile items need the extra padding. Our detergents, for instance, come in plastic bottles, so they don't need any special protection.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Randy Poehler</strong><time class=\"chat-time\">2:36 P.M.</time></div><div class=\"message-text\">Instead of focusing only on the shipping materials, what if we also changed some of our product containers?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Bryce Turner</strong><time class=\"chat-time\">2:38 P.M.</time></div><div class=\"message-text\">Are you proposing we use some other type of material for our containers? I don't see how that would be any better.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Randy Poehler</strong><time class=\"chat-time\">2:39 P.M.</time></div><div class=\"message-text\">No. I'm just saying that we could use plastic more efficiently. Some of our competitors sell detergents in pouches that can be used to refill empty bottles. They're using plastic but far less of it. We could do the same.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Bryce Turner</strong><time class=\"chat-time\">2:41 P.M.</time></div><div class=\"message-text\">That would actually save us money, too.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sophie Moore</strong><time class=\"chat-time\">2:42 P.M.</time></div><div class=\"message-text\">I'll look into whether we can make that change.</div></div></div></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 176-180 · 2 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE / NEWS</span><small>DOCUMENT 1 / 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Bentota Beach Hotel Gains Strong Leadership</strong></h2>\n<p>Gold Frond Resorts, one of India's most trusted accommodation chains, has chosen Gareth Sunderland as visitor services director at its newest property, Bentota Beach Hotel. Mr. Sunderland will assume his new role on June 14—three weeks before the resort begins operating. He has over 20 years of hospitality experience, with the last decade of his career having been spent with Gold Frond Resorts. Most recently, he has served as the front office manager at our island location. Due to his accomplishments there, he is expected to excel in the higher position of visitor services director.</p>\n<p>At Bentota Beach Hotel, Mr. Sunderland will be supervising all staff members who deal directly with customers. He will be in charge of our reservation and check-in systems. Also, he will be responsible for staff training in order to help us maintain quality service. And last but not least, he will help coordinate a range of fun pursuits for guests, from water sports to cultural excursions.</p>\n</div></section><section class=\"document-card type-ad type-catalog\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT</span><small>DOCUMENT 2 / 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\"><strong>Gold Frond Resorts has something for everyone!</strong></h2>\n<p>With the opening of our luxurious Bentota Beach location, we now have a total of five resorts to choose from throughout India. Whatever your budget, whether you're looking for excitement or relaxation, we can provide your ideal experience.</p>\n<p>Our resorts:</p>\n<div class=\"responsive-table\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>Komari Cove</strong></th>\n<th style=\"text-align:left\"><strong>Our original property; recently expanded to 315 rooms—more than any of our other locations</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Matara Oceanside</td>\n<td style=\"text-align:left\">Our most affordable option; a short walk from a popular public beach on the mainland</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Tangalle Retreat</td>\n<td style=\"text-align:left\">Named Best Resort by Leisurist Magazine; consists of 40 private villas on the mainland shore</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Vergual Paradise</td>\n<td style=\"text-align:left\">A 20-minute boat ride from Pondicherry Airport; occupies an entire island</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Bentota Beach</td>\n<td style=\"text-align:left\">Best suited for those who like to have an active vacation; located on a popular mainland surfing beach</td>\n</tr>\n</tbody>\n</table></div>\n<p>You can find information on activities available at each resort at <a href=\"https://www.goldfrondresorts.com/\" rel=\"noopener noreferrer\" target=\"_blank\">www.goldfrondresorts.com</a>, and you can conveniently make an online reservation as well.</p>\n</div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 181-185 · 2 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>DOCUMENT 1 / 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO</span><span class=\"mail-value\">Customer Service cservice@framecaster.com</span></div><div><span class=\"mail-key\">FROM</span><span class=\"mail-value\">Erik Mercado erikmerc@coolmail.com</span></div><div><span class=\"mail-key\">SUBJECT</span><span class=\"mail-value\">My purchase</span></div><div><span class=\"mail-key\">DATE</span><span class=\"mail-value\">April 28</span></div></div><p>To Whom It May Concern,</p>\n<p>I recently bought your company's Spin Genie 400 directly from your Web site and took it to a local bike shop for assembly. However, while putting the bike together, the mechanic noticed that both sets of brakes are defective.</p>\n<p>I contacted your customer service department about the issue, and your representative Nora Santos informed me that I have two options. She said I can go to a local retailer of FrameCaster products to have the brakes replaced for free or I can have the replacement parts sent to my address, though this would mean paying for shipping.</p>\n<p>I am busy packing for a move to San Francisco right now and don't have the time to look for parts. I would
