section class="panel"><div class="head"><b>題號總覽</b><span class="small">綠色答對・紅色答錯・★ 已標記</span></div><div id="numbers" class="numbers"></div></section></main><script>
const DATA={"questions":[{"id":101,"part":5,"stem":"The interns will work ______ the direction of the research department manager.","choices":["beyond","among","under","beside"],"answer":"C","explanation":"正確答案是 (C) under。原題與解析請對照第二回 PDF 第 2 頁。"},{"id":102,"part":5,"stem":"The historic house on Ambrose Road has changed ______ since it was built 150 years ago.","choices":["considered","considerably","considerable","considering"],"answer":"B","explanation":"正確答案是 (B) considerably。原題與解析請對照第二回 PDF 第 2 頁。"},{"id":103,"part":5,"stem":"The directors of PenTex are meeting with executives from DRW Corporation, which ______ have talked about merging with.","choices":["them","themselves","their","they"],"answer":"D","explanation":"正確答案是 (D) they。原題與解析請對照第二回 PDF 第 2 頁。"},{"id":104,"part":5,"stem":"Tenants who wish to end their lease should ______ the proprietor a minimum of 30 days before moving out.","choices":["notify","notified","notifying","notifies"],"answer":"A","explanation":"正確答案是 (A) notify。原題與解析請對照第二回 PDF 第 2 頁。"},{"id":105,"part":5,"stem":"Sylvia Lyman graduated at the top of her class and was immediately hired by a ______ law firm.","choices":["practical","prestigious","deliberate","supplemental"],"answer":"B","explanation":"正確答案是 (B) prestigious。原題與解析請對照第二回 PDF 第 2 頁。"},{"id":106,"part":5,"stem":"Comparing samples can help customers ______ the perfect tiles for their bathroom walls and floors.","choices":["select","complete","harm","reveal"],"answer":"A","explanation":"正確答案是 (A) select。原題與解析請對照第二回 PDF 第 2 頁。"},{"id":107,"part":5,"stem":"Hotel managers communicate ______ with their staff to ensure operations are running in a smooth manner.","choices":["regular","regularity","regulars","regularly"],"answer":"D","explanation":"正確答案是 (D) regularly。原題與解析請對照第二回 PDF 第 2 頁。"},{"id":108,"part":5,"stem":"Arrow Publicity produced a campaign that is designed to ______ audiences between the ages of 18 and 25.","choices":["appeal to","approve of","point out","result from"],"answer":"A","explanation":"正確答案是 (A) appeal to。原題與解析請對照第二回 PDF 第 2 頁。"},{"id":109,"part":5,"stem":"The company will provide training to new recruits, so neither experience ______ a degree is required.","choices":["and","but","nor","or"],"answer":"C","explanation":"正確答案是 (C) nor。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":110,"part":5,"stem":"Meta Rail passengers are entitled to full ticket refunds ______ their train is canceled or delayed.","choices":["along with","except for","as though","provided that"],"answer":"D","explanation":"正確答案是 (D) provided that。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":111,"part":5,"stem":"Analysts have predicted that the price of oil ______ by approximately 30 percent in the coming year.","choices":["increase","will increase","were increased","have increased"],"answer":"B","explanation":"正確答案是 (B) will increase。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":112,"part":5,"stem":"Employees will now be offered the ______ of working from home for up to half of their weekly hours.","choices":["benefit","benefited","beneficial","benefiting"],"answer":"A","explanation":"正確答案是 (A) benefit。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":113,"part":5,"stem":"Knoll Consulting tries to hire staff ______ personal values match the company's.","choices":["whom","which","whose","who"],"answer":"C","explanation":"正確答案是 (C) whose。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":114,"part":5,"stem":"Unlike ______ mobile phones, Tektone's innovative TX-81 can be repaired with parts produced by other companies.","choices":["habitual","defective","appropriate","conventional"],"answer":"D","explanation":"正確答案是 (D) conventional。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":115,"part":5,"stem":"Colora house paints are 50 percent more ______ to weather damage than similar products on the market.","choices":["resist","resists","resistant","resistance"],"answer":"C","explanation":"正確答案是 (C) resistant。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":116,"part":5,"stem":"Some of the new office furniture is ______ sized and does not fit in the intended office space.","choices":["silently","awkwardly","solidly","sharply"],"answer":"B","explanation":"正確答案是 (B) awkwardly。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":117,"part":5,"stem":"Housing costs in New York are far higher than ______ in its neighboring state, New Jersey.","choices":["anyone","other","that","those"],"answer":"D","explanation":"正確答案是 (D) those。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":118,"part":5,"stem":"The Martinsburg Fine Arts Museum is ______ known for its collection of classical paintings.","choices":["widely","wide","wider","widen"],"answer":"A","explanation":"正確答案是 (A) widely。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":119,"part":5,"stem":"Making surveys anonymous is a good way to get honest ______ from consumers.","choices":["opinions","clues","chances","decisions"],"answer":"A","explanation":"正確答案是 (A) opinions。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":120,"part":5,"stem":"Having made a reservation, Mr. Quinn and his colleagues were seated immediately ______ arriving at the restaurant.","choices":["up","in","upon","to"],"answer":"C","explanation":"正確答案是 (C) upon。原題與解析請對照第二回 PDF 第 3 頁。"},{"id":121,"part":5,"stem":"The contract can be legally ______ if one party fails to satisfy the terms of the agreement.","choices":["terminated","recovered","designated","disconnected"],"answer":"A","explanation":"正確答案是 (A) terminated。原題與解析請對照第二回 PDF 第 4 頁。"},{"id":122,"part":5,"stem":"During her first year as editor-in-chief, Ms. Reed expanded The National Gazette's ______ to over 250,000.","choices":["read","readers","reading","readership"],"answer":"D","explanation":"正確答案是 (D) readership。原題與解析請對照第二回 PDF 第 4 頁。"},{"id":123,"part":5,"stem":"To conserve paper, Florence Media Productions has placed ______ on the number of photocopies employees can make each day.","choices":["limit","limitless","limitations","limited"],"answer":"C","explanation":"正確答案是 (C) limitations。原題與解析請對照第二回 PDF 第 4 頁。"},{"id":124,"part":5,"stem":"People who are ______ to wear eyeglasses when driving can be penalized for not doing so.","choices":["obligate", ystem.","He serves on a municipal budget committee.","He missed the payment deadline for a water bill.","He learned about Home-Vert from Mr. Brandt."],"answer":"A","explanation":"正確答案是 (A) He will be partly reimbursed for installing a system.。原題與解析請對照第二回 PDF 第 27 頁。","group":"191-195"},{"id":195,"part":7,"stem":"What can be inferred about Bade Hardware?","choices":["It supplies water filtration systems.","It is affiliated with Home-Vert.","It will accept vouchers starting from December.","It is discounting some of its products."],"answer":"B","explanation":"正確答案是 (B) It is affiliated with Home-Vert.。原題與解析請對照第二回 PDF 第 27 頁。","group":"191-195"},{"id":196,"part":7,"stem":"In the form, what can be inferred about Ponderosa Clothing?","choices":["It has several branches in the Southwest.","It hired Web Site Wizards previously to create a logo.","Its original Web site did not allow for the sale of merchandise.","It sends most of its orders to overseas customers."],"answer":"C","explanation":"正確答案是 (C) Its original Web site did not allow for the sale of merchandise.。原題與解析請對照第二回 PDF 第 29 頁。","group":"196-200"},{"id":197,"part":7,"stem":"What is one purpose of the e-mail?","choices":["To propose a strategy for raising sales","To offer a catalog of available items","To inquire about product prices","To discuss redesigning a Web page"],"answer":"D","explanation":"正確答案是 (D) To discuss redesigning a Web page。原題與解析請對照第二回 PDF 第 29 頁。","group":"196-200"},{"id":198,"part":7,"stem":"What is most likely shown on Ponderosa Clothing's new Web site?","choices":["A diagram of a process for making dye","A picture of a shop on North Pima Road","A counter indicating the total number of shirts sold","A photograph of Mr. Grayson"],"answer":"B","explanation":"正確答案是 (B) A picture of a shop on North Pima Road。原題與解析請對照第二回 PDF 第 29 頁。","group":"196-200"},{"id":199,"part":7,"stem":"What did Mr. Grayson probably do?","choices":["Rejected a project quote","Added a number of new products to his store","Removed a map from his Web site","Contacted a customer service department"],"answer":"D","explanation":"正確答案是 (D) Contacted a customer service department。原題與解析請對照第二回 PDF 第 29 頁。","group":"196-200"},{"id":200,"part":7,"stem":"What is stated about Ponderosa Clothing's products?","choices":["They were featured in a tourist brochure.","They are made with a traditional process.","They can be shipped free if purchased in bulk.","They are designed by a local artist group."],"answer":"B","explanation":"正確答案是 (B) They are made with a traditional process.。原題與解析請對照第二回 PDF 第 29 頁。","group":"196-200"}],"groups":{}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 131–134 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article \"><div class=\"doc-ribbon\"><span>NEWS ARTICLE<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><p>A ribbon-cutting ceremony for the Palm Lane Youth Center took place in downtown Jalisco yesterday evening. The center is the <strong class=\"blank-number\">131<\/strong> building of the city's four planned facilities for people aged 8 to 18. Three more will be built over the coming years, fulfilling the mayor's campaign promise to provide recreational and educational opportunities to the city's children and teenagers.<\/p><p>Overall, the ceremony went <strong class=\"blank-number\">132<\/strong> well. Important members of the community came in large numbers to show their support. <strong class=\"blank-number\">133<\/strong> The mayor thanked everyone for their contributions to the center and <strong class=\"blank-number\">134<\/strong> a group of local children onto the stage to help him when it came time to cut the ribbon.<\/p><\/div><\/section><\/div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 135–138 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-letter \"><div class=\"doc-ribbon\"><span>LETTER<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><p>Vince Johnson\n4897 Buford Street\nAtlanta, GA 30329<\/p><p>Dear Mr. Johnson,<\/p><p>Welcome to Skyspan Airlines' loyalty program, Skyspan Rewards. As a member, you will be <strong class=\"blank-number\">135<\/strong> points every time you fly with us.<\/p><p>Once you have collected over 50,000 points, you will be entitled to a free round-trip domestic ticket on Skyspan Airlines. If you accumulate over 100,000 points, you will qualify for the <strong class=\"blank-number\">136<\/strong> benefits of our platinum-level membership. These include the full use of our special luxury Platinum Lounge, which is only accessible to our highest-ranking card carriers.<\/p><p>Your membership card has been included with this letter, along with a temporary access code for your online account. <strong class=\"blank-number\">137<\/strong> You can learn more about <strong class=\"blank-number\">138<\/strong> points and how to keep track of them on the Web site.<\/p><p>Respectfully,\nKaren Lawson\nMembership Coordinator<\/p><\/div><\/section><\/div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 139–142 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-flyer \"><div class=\"doc-ribbon\"><span>ANNOUNCEMENT<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><p>Valentine Fragrances is very happy to announce that our boutique in Verona is officially opening on <b>March 2 at 10:00 A.M.<\/b> We'd like to thank our loyal customers for keeping our online store <strong class=\"blank-number\">139<\/strong> business for these last two years. <strong class=\"blank-number\">140<\/strong><\/p><p>A grand opening event <strong class=\"blank-number\">141<\/strong> at the boutique, which is located at <b>623 Main Street<\/b>. All are welcome to stop by and try some samples, watch a demonstration on the process of making fragrances, and meet the founder, Ms. Carly Brown.<\/p><div class=\"notice-emphasis\"><b>WE ARE HIRING<\/b><span>3 Sales Associates · Various Shifts<\/span><\/div><p>Additionally, Valentine Fragrances requires three sales associates for various shifts. <strong class=\"blank-number\">142<\/strong> will be accepted until February 22.<\/p><\/div><\/section><\/div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 143–146 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-webpage \"><div class=\"doc-ribbon\"><span>WEB PAGE<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><div class=\"site-head\"><div class=\"site-name\">Shane McGovern Accounting<\/div><div class=\"site-tagline\">www.shanemcgovernaccounting.com<\/div><div class=\"site-nav\"><span>Services<\/span><span>Testimonials<\/span><span>Contact<\/span><\/div><\/div><p>Struggling to create and maintain accurate records is more common among entrepreneurs than you might think. <strong class=\"blank-number\">143<\/strong>, hiring an experienced accountant like Shane McGovern can help you understand the basics of accounting and prevent costly mistakes from being made.<\/p><p>Mr. McGovern has <strong class=\"blank-number\">144<\/strong> countless business owners in filing tax forms, maintaining records, and managing finances. He <strong class=\"blank-number\">145<\/strong> offers customized organization systems. This service in particular has been appreciated by many prominent business owners.<\/p><p>Check out feedback from previous customers here: <span class=\"linkish\">Testimonials<\/span>.<\/p><div class=\"web-cta\">Still not sure if Shane McGovern Accounting can help you with your business? <strong class=\"blank-number\">146<\/strong><\/div><\/div><\/section><\/div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 147–148 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-webpage \"><div class=\"doc-ribbon\"><span>WEB PAGE<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><div class=\"site-head\"><div class=\"site-name\">KILEY AND JULIEN<\/div><div class=\"site-tagline\">kileyandjulien.com / alexandria / contactus<\/div><div class=\"site-nav\"><span>HOME<\/span><span>PRODUCTS<\/span><span>SPECIAL OFFERS<\/span><span>CONTACT US<\/span><\/div><\/div><p class=\"subtitle\">Stylish Clothes for Kids<\/p><p>Our main store in Ohio is located at 5250 Harville Boulevard, Alexandria, OH 43002. To visit us, follow these directions:<\/p><div class=\"route-grid\"><div><h3>By car<\/h3><ol><li>Take Highway 43, and exit onto Maple Street.<\/li><li>Turn right onto Harville Boulevard.<\/li><li>The shop will be on the right-hand side.<\/li><\/ol><\/div><div><h3>By bus<\/h3><ol><li>Take bus 34.<\/li><li>Get off at the Harville Boulevard bus stop.<\/li><\/ol><\/div><\/div><p>We also have smaller outlets at the following locations:<\/p><ul><li>350 Acrewood Street, Alexandria 45249 (directions)<\/li><li>119 Indianwoods Lane, Alexandria 45249 (directions)<\/li><\/ul><div class=\"business-hours\"><b>Regular hours<\/b><p>Monday to Saturday: 9 A.M. – 8 P.M.<br>Sunday: 10 A.M. – 7 P.M.<br>Stores close for all national holidays.<\/p><\/div><p>For any inquiries or concerns, you may contact us at:<br>Telephone: 614-555-3010<br>E-mail: jenwoods@kileyandjulien.com<\/p><div class=\"web-cta\">You may also open a chat dialogue here if you need a prompt response to a question.<\/div><\/div><\/section><\/div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 149–150 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat \"><div class=\"doc-ribbon\"><span>TEXT MESSAGES<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><div class=\"conversation\"><div class=\"bubble \"><div class=\"bubble-meta\"><b>Marvin Lee<\/b><time>1:46 P.M.<\/time><\/div><p>Hi Sandra. This meeting might go on for a while. Is there a chance you can go and pick up the brochures for the development on State Avenue?<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Sandra Vasquez<\/b><time>1:47 P.M.<\/time><\/div><p>Sure. Did you go with Harry's Prints down the street?<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Marvin Lee<\/b><time>1:48 P.M.<\/time><\/div><p>No. They couldn't do it. I chose the shop on Dearborn Avenue. It's called Simple Printing. I don't remember the exact address, but I can look it up.<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Sandra Vasquez<\/b><time>1:50 P.M.<\/time><\/div><p>There's no need for that. I've worked with them before. I can leave in about 10 minutes. Do you need them at the office or somewhere else?<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Marvin Lee<\/b><time>1:51 P.M.<\/time><\/div><p>The office is fine. Thank you so much.<\/p><\/div><\/div><\/div><\/section><\/div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 151–152 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article \"><div class=\"doc-ribbon\"><span>NEWS ARTICLE<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><div class=\"byline\">By Pete Jenkins · February 28<\/div><p>According to research conducted by the Boulder Tourism Bureau, more people visited the city and surrounding ski lodges this past December and January than in any winter in the past five decades. More tourists mean that the area’s economy experienced an unexpected boost. Of course, local business owners could not have been happier about their additional profits.<\/p><p>Well-known local meteorologist Laura Nowak forecast that the area would have several weeks of light, powdery snow in zero degree weather. She referred to “perfect snow conditions” for skiers, and her prediction helped attract tourists to the Boulder area in record-breaking numbers this season. Nowak also expects similar conditions for next winter, and possibly for winters after that. This is welcome news for hotels and ski resorts in the region. Bookings are already filling up for next year, and most local businesses are hopeful that the tourism boom will continue.<\/p><\/div><\/section><\/div>","153-155":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 153–155 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice \"><div class=\"doc-ribbon\"><span>SUBSCRIBER NOTICE<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><p><b>To all subscribers of Excellent Publications:<\/b><\/p><p>— <b class=\"insertion\">[1]<\/b> — For over 50 years, readers subscribed to <em>The World Today<\/em>, our monthly print magazine, for articles about global events. However, it was discontinued and, instead, readers had access to the first online version of the magazine, which we renamed <em>The Thinker<\/em>, soon after the last print issue was released. — <b class=\"insertion\">[2]<\/b> —<\/p><p>It has been one year since that change, and Excellent Publications has continued to offer subscribers the same outstanding articles as before, only exclusively on the Internet. — <b class=\"insertion\">[3]<\/b> — Though the new electronic news magazine is continuing to grow in popularity, some readers are still requesting that the traditional printed version be brought back. So, we have decided to put out an annual print edition of <em>The Thinker<\/em>, beginning this year.<\/p><p>The print issue will include our most popular articles from the previous 12 months. — <b class=\"insertion\">[4]<\/b> — It will be delivered to all digital subscribers’ homes as a bonus at the end of the year. For any questions regarding the annual print issue, please visit <span class=\"linkish\">www.thethinker.com/bonusprint<\/span>.<\/p><\/div><\/section><\/div>","156-157":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 156–157 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail \"><div class=\"doc-ribbon\"><span>E-MAIL<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>All Staff<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Carl Eklund<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>Conference<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>July 1<\/span><\/div><\/div><p>Hello, everyone.<\/p><p>I just wanted to provide you all with an update on the 11th annual Bird Conservation Conference, which will take place this year from August 7 to 9 in Montreal. We usually choose one representative at random to attend the conference. However, this year I'm looking for a volunteer because the person who attends will have more responsibilities than usual. I'll be at the research center in Antarctica at the time, so I'm unable to volunteer myself.<\/p><p>The head of the conference, Georgia Proctor, reached out to me asking if someone from our institute could give a presentation this year. She was particularly interested in our findings about penguin migration patterns in Antarctica. So, the volunteer will have to present on this subject.<\/p><p>If you are interested in this opportunity, please let me know as soon as possible.<\/p><p>Sincerely,\nCarl Eklund\nLead Researcher\nWildlife Research Institute<\/p><\/div><\/section><\/div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 158–160 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice \"><div class=\"doc-ribbon\"><span>NOTICE<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><h2>Notice<\/h2><div class=\"notice-content\"><p>Thank you for coming today. We organised today's activity to choose 20 dancers for Hannah Levi's upcoming concert tour. Some adjustments have been made due to the overwhelming response to our advertisement.<\/p><p>We will no longer hold individual sessions with each dancer. Instead, we will see groups of six at a time. When you step into the audition room, please put your résumé and photograph on the judge's desk. All six dancers will then perform a dance to one of Ms. Levi's songs together.<\/p><p>You will be notified if you are chosen to advance to the next round. If selected, please stay in the vicinity. In the second round, dancers will work with our lead choreographer. Afterward, the remaining candidates will undergo one more round in the evening before the final announcement is made. Good luck!<\/p><\/div><\/div><\/section><\/div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 161–164 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad \"><div class=\"doc-ribbon\"><span>ADVERTISEMENT<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">NEW TABLET · LIMITED EDITION<\/div><h2>Reliance 7 to Be Released!<\/h2><div class=\"ad-specs\"><span>THIN & LIGHT<\/span><span>HIGH-RESOLUTION SCREEN<\/span><span>STYLUS<\/span><\/div><\/div><p>Productivity on the go is essential in today's world. We made the Reliance 7 tablet so thin and light that you can take it anywhere!<\/p><p>Our tablet has a sleek design and all the tools you need at your fingertips. You'll love the rich colors and clear images on the high-resolution screen. Also, this new tablet comes with a uniquely designed stylus.<\/p><p>To stand out from the competition, Reliance has partnered with the bag designer Top Crafter. This brand has created a fashionable pouch for the Reliance 7 that will be sold for just $30. This is a limited edition item—only 1,000 pieces have been made, each one stamped with a serial number.<\/p><div class=\"ad-cta\">The Reliance 7 will be available at retail outlets starting January 12, but eager customers can preorder them on our Web site, www.reliance.com. Reserve yours on our site today!<\/div><\/div><\/section><\/div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 165–167 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-letter \"><div class=\"doc-ribbon\"><span>FORMAL LETTER<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><p>January 6<\/p><p>Debonair Publishing\n1800 Dundee Street\nToronto, ON\nM6J 1X7<\/p><p>To Whom It May Concern:<\/p><p>I have been a big fan of Brian Warburton's work for a long time now, and his books have been a real inspiration to me over the years. I just finished writing a novel of my own, and I would very much like to quote two lines from <em>The Returning<\/em>, the third and final book of his <em>Lost Sanctuary<\/em> series. These lines have always had deep meaning for me. Because of that, I'd like the quotation to appear at the beginning of my novel, after the title and dedication pages.<\/p><p>I am not entirely sure how to get permission to use the quotation. I checked my copy of Mr. Warburton's book and saw that your company was the copyright owner the year it was printed. If you still own the rights, could you let me know if I may use the quotation? If so, please inform me of how to proceed and how much I can expect to pay. If your company no longer owns the rights, can you please provide me with the e-mail address or phone number of the person or company who does?<\/p><p>Thank you, and I look forward to your response.<\/p><p>Chester M. Gleason<\/p><\/div><\/section><\/div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 168–171 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article \"><div class=\"doc-ribbon\"><span>FEATURE ARTICLE<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><div class=\"byline\">By Mary Harding<\/div><p>Roughly 50 years ago, the city of Western Point constructed an elaborate memorial park to remember one of its early residents, Lester Muller. Mr. Muller was a wealthy industrialist who opened the first factories here. — <b class=\"insertion\">[1]<\/b> — The park, with its famous clock tower, has become a popular destination for visitors, bringing in over 20,000 people annually.<\/p><p>Over the years, however, the park has suffered from maintenance issues. — <b class=\"insertion\">[2]<\/b> — The clock in the tower no longer works, and the building's interior paint has faded. Consequently, the committee that oversees the park's operations has decided to close the tower for a two-month restoration. It has hired a team of experts from HC Architects. The team includes Sam Hunt, who has worked on similar restoration projects such as the Rosenberg Monument in Washington, DC. — <b class=\"insertion\">[3]<\/b> — Over the next two months, he will supervise the necessary repairs.<\/p><p>During this time, the adjacent sculpture garden and other sections of the park will remain freely accessible to the public. — <b class=\"insertion\">[4]<\/b> — Opening hours are from Tuesday to Sunday, 8 a.m. to 7 p.m. The clock tower's repairs should be completed by October 1.<\/p><\/div><\/section><\/div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 172–175 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat \"><div class=\"doc-ribbon\"><span>ONLINE CHAT<\/span><small>DOCUMENT  1 / 1 <\/small><\/div><div class=\"document-body\"><div class=\"conversation\"><div class=\"bubble \"><div class=\"bubble-meta\"><b>Andrew Marks<\/b><time>5:09 P.M.<\/time><\/div><p>So, following up on our meeting, I think Ms. Foster from GDE Motors is ready to conclude negotiations. She wants to meet with Mr. Mueller next week to work out the terms of a contract.<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Robert Crane<\/b><time>5:11 P.M.<\/time><\/div><p>Won't Mr. Mueller be on a business trip to New Zealand next week?<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Allison West<\/b><time>5:12 P.M.<\/time><\/div><p>Right. He won't be here next week. Why don't we schedule an appointment for Ms. Foster with Deanna Lane?<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Andrew Marks<\/b><time>5:13 P.M.<\/time><\/div><p>She already has a very heavy workload. I don't think she has time for the appointment.<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Robert Crane<\/b><time>5:15 P.M.<\/time><\/div><p>Could we ask Mr. Mueller to do a videoconference from New Zealand?<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Allison West<\/b><time>5:16 P.M.<\/time><\/div><p>That could work. And I don't think the client would mind doing that.<\/p><\/div><div class=\"bubble \"><div class=\"bubble-meta\"><b>Andrew Marks<\/b><time>5:18 P.M.<\/time><\/div><p>I'll go talk with Mr. Mueller right now and find out if he'd be willing to do that. If so, you can arrange a date and time with Ms. Foster, Allison.<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Allison West<\/b><time>5:19 P.M.<\/time><\/div><p>No problem. I'll wait until I hear from you.<\/p><\/div><\/div><\/div><\/section><\/div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 176–180 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-review \"><div class=\"doc-ribbon\"><span>PRODUCT REVIEW<\/span><small>DOCUMENT  1 / 2 <\/small><\/div><div class=\"document-body\"><div class=\"browser-chrome\"><span class=\"browser-dots\">● ● ●<\/span>www.reviews.com/refrigerators00071<\/div><h2>ColdPro 2000 by Kitchen-Max<\/h2><div class=\"byline\">Reviewed by Roger Ling on January 5<\/div><p>The ColdPro 2000 refrigerator is top-notch, like all of Kitchen-Max's appliances. In the second version of the ColdPro, the company has kept the same stainless steel, contemporary design that matches well with most kitchens. It has several extra functions, including a convenient water dispenser.<\/p><p>However, one major weakness of this model is the placement of the water filter. It is hidden behind a shelf, making it difficult to change. According to the user manual, the filter should be replaced every three months, which could become burdensome for owners.<\/p><p>Overall, this is a great refrigerator, though it is relatively expensive. But Kitchen-Max announced at a press conference in December that it will introduce the next model in its refrigerator line this coming February. I'd suggest holding off until then, as the price of the ColdPro 2000 is expected to be lowered at that time.<\/p><\/div><\/section><section class=\"document-card type-ad \"><div class=\"doc-ribbon\"><span>ADVERTISEMENT<\/span><small>DOCUMENT  2 / 2 <\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">KITCHEN-MAX · NEW ARRIVAL<\/div><h2>The Future of Appliances: Kitchen-Max's ColdPro 3000 Refrigerator!<\/h2><div class=\"ad-specs\"><span>WATER DISPENSER<\/span><span>ICE MAKER<\/span><span>CONTROLLED STORAGE<\/span><\/div><\/div><p>Kitchen-Max is proud to introduce its newest state-of-the-art refrigerator, the ColdPro 3000. The appliance has all the useful functions of our previous model, the ColdPro 2000, and also includes an ice-making feature and temperature-controlled storage drawers for produce.<\/p><div class=\"ad-cta\">Find out more about this innovative appliance by visiting www.kitchenmax.com/refrigerators. The ColdPro 3000 will be available starting February 25 at a retailer near you! Find a list of locations where Kitchen-Max products are sold by visiting our Web site.<\/div><\/div><\/section><\/div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 181–185 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-letter \"><div class=\"doc-ribbon\"><span>LETTER<\/span><small>DOCUMENT  1 / 2 <\/small><\/div><div class=\"document-body\"><div class=\"stationery-brand\">ALLEN REALTY <small>www.allenrealty.com<\/small><\/div><p><span class=\"right-date\">March 5<\/span><\/p><p>Michelle Simon\nSimon Digital Consulting\n5883 Dunn Road\nMableton, GA 30126<\/p><p>Dear Ms. Simon,<\/p><p>Congratulations! The owner of the North Avenue office space—the only one in Atlanta that fully met your needs—has accepted your offer. Please review the proposed contract enclosed with this letter. It has been modified to include the new terms you requested. Rent has been lowered by $220 a month, conditional on your agreement to occupy the space for three years beginning April 1. Additionally, the owner will check the floor tiles and fix anything necessary before then. However, you will need to arrange the air cooling system on your own.<\/p><p>If you are satisfied, send a signed copy of the contract back to me. Otherwise, we can discuss matters further.<\/p><p>Sincerely,\nDamien Horowitz\nProperty Consultant<\/p><p><b>Enclosure:<\/b> Contract<\/p><\/div><\/section><section class=\"document-card type-memo \"><div class=\"doc-ribbon\"><span>OFFICE MEMO<\/span><small>DOCUMENT  2 / 2 <\/small><\/div><div class=\"document-body\"><div class=\"memo-title\">SIMON DIGITAL CONSULTING <strong>MEMO<\/strong><\/div><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>All staff<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Michelle Simon<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>Move<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>March 7<\/span><\/div><\/div><p>I have good news. Mr. Horowitz, our realtor, has helped us rent the office in Atlanta that meets all our requirements. We will be moving into our new office next month. As I said before, this change will allow us to be closer to existing clients, pursue new business opportunities, and accommodate additional staff members. I am positive that all of you will be pleased. There is a train station just five minutes away on foot and several restaurants in the area.<\/p><p>Most things in the new office are being taken care of by the owner, but some essential appliances are not provided. So, before the sales team's equipment and office furniture are moved into the new space on April 2, we will have those appliances set up on April 1. The sales staff will begin working in the new space on April 3. The administration and accounting teams will begin doing so on April 15. The production team will be last since their editing equipment cannot be installed until May 1. So, their move will take place on May 2.<\/p><\/div><\/section><\/div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 186–190 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL<\/span><small>DOCUMENT  1 / 3 <\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>Elsie McDaniel &lt;emd333@weblively.com&gt;<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Wayne Sward &lt;wsward@bluescreen.au&gt;<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>Trip to Adelaide<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>August 14<\/span><\/div><div><span class=\"mail-key\">ATTACHMENT<\/span><span>Buxton classes<\/span><\/div><\/div><p>Dear Elsie,<\/p><p>You mentioned last week that it would be great to take a cooking class together during our trip to Adelaide in September. I've followed up on this and found a culinary school that offers half-day sessions. It's called Buxton Cooking School, and it's just around the corner from our hotel.<\/p><p>They have four courses we could take, but given our schedule, we'll have to take a weekday class. I know you have Joel Denton's cookbook and are a big fan of his recipes. He's teaching one of the courses, so we could actually meet him in person.<\/p><p>I'm attaching a schedule for you from the Buxton Cooking School. Please check it and get back to me. I'll register for a class as soon as I hear back from you.<\/p><p>Best regards,\nWayne<\/p><\/div><\/section><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>CLASS SCHEDULE<\/span><small>DOCUMENT  2 / 3 <\/small><\/div><div class=\"document-body\"><h2>Buxton Cooking School<\/h2><p><b>Class Schedule for September<\/b><\/p><div class=\"table-wrap\"><table><thead><tr><th>Day<\/th><th>8 A.M.–11 A.M.<\/th><th>1 P.M.–4 P.M.<\/th><th>4 P.M.–7 P.M.<\/th><\/tr><\/thead><tbody><tr><td>Tuesday<\/td><td>—<\/td><td>Exploring Seafood (Sheila Ryer)<\/td><td>Using Vegetables (Martin Ames)<\/td><\/tr><tr><td>Wednesday<\/td><td>Baking Bread (Joel Denton)<\/td><td>—<\/td><td>Using Vegetables (Martin Ames)<\/td><\/tr><tr><td>Thursday<\/td><td>—<\/td><td>Exploring Seafood (Sheila Ryer)<\/td><td>—<\/td><\/tr><tr><td>Friday<\/td><td>—<\/td><td>—<\/td><td>Making Sauces (Marie Pierre)<\/td><\/tr><tr><td>Saturday<\/td><td>Exploring Seafood (Sheila Ryer)<\/td><td>Baking Bread (Joel Denton)<\/td><td>Making Sauces (Marie Pierre)<\/td><\/tr><tr><td>Sunday<\/td><td>Using Vegetables (Martin Ames)<\/td><td>—<\/td><td>Baking Bread (Joel Denton)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"schedule-note\"><strong>Remarks:<\/strong><ul><li>No classes are held on Mondays.<\/li><li>The minimum class size is 5; the maximum class size is 20.<\/li><li>Morning classes include a visit to Pinkston Food Market, where a talk will be given.<\/li><\/ul><\/div><\/div><\/section><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>MARKET NOTICE<\/span><small>DOCUMENT  3 / 3 <\/small><\/div><div class=\"document-body\"><h2>Attention Group Visitors to Pinkston Food Market<\/h2><div class=\"notice-content\"><p>While Pinkston Food Market welcomes everyone—shoppers and browsers alike—some stall owners have recently complained about groups of five or more people blocking the aisles and preventing regular customers from gaining access. Thus, stall owners have asked that tour group leaders and cooking class instructors keep their groups moving from one stall to the next. Guides wishing to give short talks to their groups are kindly asked to do so in our food court. There are lots of seats and it is equipped to deal with high numbers of visitors. Also, attendees can try free samples of local specialties at the food court.<\/p><\/div><\/div><\/section><\/div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 191–195 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article \"><div class=\"doc-ribbon\"><span>NEWS ARTICLE<\/span><small>DOCUMENT  1 / 3 <\/small><\/div><div class=\"document-body\"><h2>Westburg Announces Water-Saving Initiative<\/h2><div class=\"byline\">By Augustus Brandt<\/div><p>The Westburg City Council has announced an initiative to lessen water usage. The plans include subsidizing businesses and residences that install water recycling systems. “One major way to reduce water consumption is by reusing water,” said Mayor Arnell Lee. She explained that the city will offer a rebate to homeowners who install a water recycling system, though the system must be functioning by August at the latest.<\/p><p>Unusually low precipitation has led to serious water shortages in the city over the past decade. Due to that, water prices have soared, and the cost of keeping all of Westburg's public spaces green has forced the city to increase local property taxes. The city has budgeted about $8.9 million for addressing the water supply issues.<\/p><\/div><\/section><section class=\"document-card type-ad \"><div class=\"doc-ribbon\"><span>ADVERTISEMENT<\/span><small>DOCUMENT  2 / 3 <\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">WATER CONSERVATION<\/div><h2>Save Money With a Home-Vert Water Recycling System!<\/h2><\/div><p>Lower your bills and help conserve water by installing a Home-Vert Water Recycling System!<\/p><ul class=\"benefit-list\"><li>We install systems in homes or businesses.<\/li><li>We can help you cut down on utility bills.<\/li><li>Depending on the location, we can complete the installation within 1–3 days.<\/li><\/ul><p>Our staff will also show you how the system works and how to maintain it. Visit <span class=\"linkish\">www.home-vert.com<\/span> to complete a request form for installation. Everyone who submits a completed form will receive a voucher worth <b>$50<\/b> from one of our many local business partners!<\/p><\/div><\/section><section class=\"document-card type-mail \"><div class=\"doc-ribbon\"><span>E-MAIL<\/span><small>DOCUMENT  3 / 3 <\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>Edward Bircher &lt;edbirch@sspmail.com&gt;<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Karl Hutcherson &lt;karlh@home-vert.com&gt;<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>Re: Installation request<\/span><\/div><div><span class=\"mail-key\">ATTACHMENT<\/span><span>Badevoucher<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>July 15<\/span><\/div><\/div><p>Dear Mr. Bircher,<\/p><p>Thank you for filling out our form for having a water recycling system installed. We would be very happy to send a representative to your home at 17 Wilmont Street, Westburg, next Monday at 10:30 A.M. Let me know if that day and time work for you. To thank you for completing the request form, we have attached a voucher from Bade Hardware worth $50. The voucher is valid until December.<\/p><p>Regards,\nKarl Hutcherson<\/p><\/div><\/section><\/div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 196–200 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-form \"><div class=\"doc-ribbon\"><span>WEB FORM<\/span><small>DOCUMENT  1 / 3 <\/small><\/div><div class=\"document-body\"><div class=\"browser-chrome\"><span class=\"browser-dots\">● ● ●<\/span>www.websitewizards.com/contact_us/<\/div><div class=\"site-head\"><div class=\"site-name\">Web Site Wizards<\/div><div class=\"site-nav\"><span>Home<\/span><span>About Us<\/span><span>Services<\/span><span>Portfolio<\/span><span>FAQ<\/span><span>Jobs<\/span><\/div><\/div><div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Details<\/th><th>Field<\/th><th>Details<\/th><\/tr><\/thead><tbody><tr><td>First name<\/td><td>Brady<\/td><td>E-mail address<\/td><td>brady@ponderosaclothing.com<\/td><\/tr><tr><td>Surname<\/td><td>Grayson<\/td><td>Phone number<\/td><td>555-3786<\/td><\/tr><tr><td>Current Web site<\/td><td>www.ponderosaclothing.com<\/td><td>Address<\/td><td>31 North Pima Road, Scottsdale, AZ<\/td><\/tr><\/tbody><\/table><\/div><h3>Tell us about the work you would like us to do for you.<\/h3><div class=\"form-answer\">I run a store called Ponderosa Clothing that specializes in T-shirts. I have a Web site, but it only contains a brief description of my business, some information about our best-selling products, and a map. I would like to have the site upgraded so that customers can use it to order items.<\/div><h3>How would you like us to contact you?<\/h3><div class=\"choice-row\"><span>■ By e-mail<\/span><span>□ By phone<\/span><\/div><h3>Which of the following services are you seeking?<\/h3><div class=\"services-grid\"><span>■ Site design<\/span><span>■ Internet advertising<\/span><span>□ Promotional videos<\/span><span>■ E-commerce setup<\/span><span>□ Logo design<\/span><span>□ E-mail marketing<\/span><span>■ Web site traffic analytics<\/span><span>□ Web site security<\/span><span>□ Mobile application design<\/span><\/div><p>Select the services you need, and we will send you a price estimate.<\/p><\/div><\/section><section class=\"document-card type-mail \"><div class=\"doc-ribbon\"><span>E-MAIL<\/span><small>DOCUMENT  2 / 3 <\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">TO<\/span><span>Brady Grayson &lt;brady@ponderosaclothing.com&gt;<\/span><\/div><div><span class=\"mail-key\">FROM<\/span><span>Anita Hernandez &lt;customerservice@websitewizards.com&gt;<\/span><\/div><div><span class=\"mail-key\">SUBJECT<\/span><span>Request for quote<\/span><\/div><div><span class=\"mail-key\">DATE<\/span><span>August 2<\/span><\/div><div><span class=\"mail-key\">ATTACHMENT<\/span><span>Project estimate<\/span><\/div><\/div><p>Dear Mr. Grayson,<\/p><p>Thank you for contacting Web Site Wizards. One of our designers has reviewed your current Web site and compiled a project estimate, which I have attached. The total cost for designing www.ponderosaclothing.com and setting up e-commerce functions is expected to be $1,250.<\/p><p>If you are satisfied with our estimate, send us some links to Web sites you like. We will review these and try to use similar design elements in the new version of your Web site. Also, you will need to send a picture of your store as it will appear on the main page of the Web site.<\/p><p>If you change your mind and choose to add other services, such as the development of promotional videos or a mobile application, please e-mail our customer services department so that they can recalculate your quote.<\/p><p>Yours truly,\nAnita Hernandez<\/p><\/div><\/section><section class=\"document-card type-webpage \"><div class=\"doc-ribbon\"><span>STORE WEB PAGE<\/span><small>DOCUMENT  3 / 3 <\/small><\/div><div class=\"document-body\"><div class=\"site-head\"><div class=\"site-name\">PONDEROSA CLOTHING<\/div><div class=\"site-tagline\">www.ponderosaclothing.com<\/div><div class=\"site-nav\"><span>Collection<\/span><span>About<\/span><span>Contact<\/span><span>Shop<\/span><\/div><\/div><div class=\"ad-hero\"><div class=\"ad-kicker\">AUTHENTIC SOUTHWEST STYLE<\/div><h2>Ponderosa Clothing: A Perfect Memory from Scottsdale!<\/h2><\/div><p>Looking for an authentic, one-of-a-kind souvenir to remember your time in Scottsdale? Then why not check out some of Ponderosa Clothing's offerings? Many items feature artistic patterns found in the American Southwest, and only plant-based dyes are used in all our clothing. We do this in order to preserve a regional tradition from centuries ago.<\/p><p>Ponderosa Clothing products are available at our store in Scottsdale, on our newly redesigned Web site, and through our downloadable mobile application! Visit www.ponderosaclothing.com to check out our promotional videos, browse our most popular products, and use our new shopping cart function to make purchases. Domestic shipping is free for all online orders, but there are charges for international purchases.<\/p><\/div><\/section><\/div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 131–134 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><p>Palm Lane 青少年中心剪綵儀式昨晚在 Jalisco 市中心區舉行。這座中心是本市為 8 至 18 歲者規劃的 4 座設施中第 1 棟建築物。還有 3 座會在未來幾年建設，實現市長為本市兒童及青少年提供娛樂與教育機會的競選承諾。<\/p><p>整體上，儀式進行得相當順利。當地社區許多重要成員到場展現支持。也有幾位名人出席。市長感謝每個人對中心的貢獻，並且在剪綵時邀請一群當地孩童上台協助。<\/p><\/div><\/section><\/div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 135–138 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><p>Vince Johnson<br/>Buford 街 4897 號<br/>亞特蘭大，喬治亞州 30329<\/p><p>親愛的 Johnson 先生：<\/p><p>歡迎您加入 Skyspan 航空公司的顧客忠誠計畫 Skyspan Rewards。身為會員，您每次搭乘我們的航班都會獲得點數。<\/p><p>一旦您集滿超過 5 萬點，就可以得到 Skyspan 航空公司的國內線免費來回機票。如果您累積超過 10 萬點，就有資格獲得我們白金等級會員的專屬福利。福利包括我們奢華的特別白金休息室的完整使用權，這個休息室只有最高等級的持卡者才能使用。<\/p><p>您的會員卡包含在這封信中，也附上了您線上帳戶的臨時登入密碼。請用這個密碼登入，然後變更您的密碼。您可以在網站上了解更多關於獲得點數與如何追蹤點數的訊息。<\/p><p>Karen Lawson<br/>會員協調專員<\/p><\/div><\/section><\/div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 139–142 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-flyer type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">繁體中文全文翻譯<\/div><h2>Valentine Fragrances｜新店開幕公告<\/h2><\/div><p>Valentine Fragrances 很高興宣布，我們在 Verona 的精品店即將於 3 月 2 日上午 10:00 正式開幕。我們想要感謝我們忠實的顧客，在過去 2 年讓我們網路商店持續營運。你們的支持讓我們終於能擁有一間實體店面。開幕活動將在位於 Main 街 623 號的精品店舉行。歡迎所有人前往試香、觀看香水製造過程的示範，並且和我們的創辦人 Carly Brown 小姐見面。另外，Valentine Fragrances 需要多個值班時段的 3 名銷售員。我們接受應徵申請至 2 月 22 日止。<\/p><\/div><\/section><\/div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 143–146 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><p>www.shanemcgovernaccounting.com<\/p><p>對企業家而言，難以建立並維持準確的紀錄，比你想像的更加常見。然而，聘請像 Shane McGovern 這樣經驗豐富的會計師，可以幫助你了解會計基礎，並避免發生代價高昂的錯誤。<\/p><p>McGovern 先生曾協助無數企業主申報稅務、保存紀錄並管理財務。他也提供客製化的組織管理系統。這項服務尤其受到許多知名企業主的讚賞。你可以在「顧客評價」頁面查看以往客戶的回饋。<\/p><p>仍不確定 Shane McGovern 會計事務所能否協助你的企業嗎？今天就來電預約免費諮詢。<\/p><\/div><\/section><\/div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 147–148 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><div class=\"site-head\"><div class=\"site-name\">KILEY AND JULIEN<\/div><div class=\"site-tagline\">時尚童裝<\/div><div class=\"site-nav\"><span>首頁<\/span><span>商品<\/span><span>優惠活動<\/span><span>聯絡我們<\/span><\/div><\/div>\n<p>我們位於俄亥俄州的主要門市地址為 Alexandria 的 Harville Boulevard 5250 號（郵遞區號 43002）。前往本店可依下列路線：<\/p>\n<div class=\"route-grid\"><div><h3>開車前往<\/h3><ol><li>行駛 43 號公路，在 Maple Street 出口離開。<\/li><li>右轉進入 Harville Boulevard。<\/li><li>本店位於道路右側。<\/li><\/ol><\/div><div><h3>搭乘公車<\/h3><ol><li>搭乘 34 路公車。<\/li><li>在 Harville Boulevard 站下車。<\/li><\/ol><\/div><\/div>\n<p>我們在以下地點也設有規模較小的門市：<\/p><ul><li>Alexandria，Acrewood Street 350 號（45249）— 路線指引<\/li><li>Alexandria，Indianwoods Lane 119 號（45249）— 路線指引<\/li><\/ul>\n<div class=\"business-hours\"><b>門市營業時間<\/b><p>週一至週六：上午 9 點至晚上 8 點<br/>週日：上午 10 點至晚上 7 點<br/>國定假日所有門市皆不營業。<\/p><\/div>\n<p>如有任何問題或疑慮，歡迎聯絡我們：<br/>電話：614-555-3010<br/>電子郵件：jenwoods@kileyandjulien.com<\/p>\n<div class=\"web-cta\">如需迅速取得問題的回覆，也可以在本頁開啟即時聊天對話。<\/div><\/div><\/section><\/div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 149–150 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><div class=\"conversation\"><div class=\"bubble\"><div class=\"bubble-meta\"><b>Marvin Lee<\/b><time>下午1:46<\/time><\/div><p>嗨，Sandra。會議可能會繼續開一陣子。你可以去拿 State 大街開發案的小冊子嗎？<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Sandra Vasquez<\/b><time>下午1:47<\/time><\/div><p>當然。你找的是這條街另一頭的 Harry 印刷嗎？<\/p><\/div><div class=\"bubble\"><div class=\"bubble-meta\"><b>Marvin Lee<\/b><time>下午1:48<\/time><\/div><p>不是。他們沒辦法印。我選了 Dearborn 大街上的店。它叫 Simple 印刷。我不記得確切的地址，但我可以查查看。<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Sandra Vasquez<\/b><time>下午1:50<\/time><\/div><p>不需要。我以前曾經和他們合作。我大約 10 分鐘後可以出發。你需要那些小冊子放在辦公室還是其他地方？<\/p><\/div><div class=\"bubble\"><div class=\"bubble-meta\"><b>Marvin Lee<\/b><time>下午1:51<\/time><\/div><p>辦公室就好了。非常感謝。<\/p><\/div><\/div><\/div><\/section><\/div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 151–152 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><h2>雪季觀光人數暴增！<\/h2><div class=\"byline\">Pete Jenkins 撰稿｜2 月 28 日<\/div><p>2 月 28 日—根據 Boulder 觀光局進行的研究，在剛過去的 12 月和 1 月，拜訪這座城市與周圍滑雪屋的人數比過去 50 年的每個冬天都來得多。較多的觀光客，意味著這個地區的經濟經歷意料之外的成長。當然，當地企業主也對於額外的獲利感到樂不可支。<\/p><p>當地知名氣象學者 Laura Nowak 曾預測，該地區將有幾週 0 度天氣的微微細雪。她說這對於滑雪客而言是「完美的下雪狀態」，而她的預測也幫助在冬季吸引人數破紀錄的觀光客到 Boulder 地區。Nowak 也預期下個冬季會是類似的天氣狀況，或許之後幾年的冬季也一樣。這對該地區的飯店與滑雪場而言是好消息。明年的預訂已經逐漸額滿，大部分的當地業者也希望觀光盛況將會持續下去。<\/p><\/div><\/section><\/div>","153-155":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 153–155 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><p>致 Excellent 出版社的所有訂戶：<\/p><p>—[1]—。超過 50 年來，讀者們訂閱了我們每月印行的雜誌《The World Today》來讀關於全球事件的文章。不過，這本雜誌已經停刊，取而代之的是，在最後一期印刷版本發行不久後，讀者得以閱讀這本雜誌的第一個線上版本，我們重新命名為《The Thinker》。—[2]—<\/p><p>153- D/這項改變至今已經過了一年，而 Excellent 出版社持續為訂戶提供和過去同樣出色的文章，只有在網路上才看得到。—[3]—。雖然新的電子新聞雜誌越來越受歡迎，但有些讀者仍然請求讓傳統的印刷版本回歸。所以，我們已經決定從今年開始發行《The Thinker》的年度印刷版本。印刷版本將包括過去 12 個月最受歡迎的文章。—[4]—。它將作為額外贈禮在年底寄送到所有數位版訂戶的家裡。對於年度印刷版有任何問題，請上 www.thethinker.com/bonusprint。<\/p><\/div><\/section><\/div>","156-157":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 156–157 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>全體員工<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Carl Eklund<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>會議<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>7 月 1 日<\/span><\/div><\/div><p>大家好。<\/p><p>我想要提供大家關於第 11 屆年度鳥類保育會議的最新消息，這個會議今年將於 8 月 7 日至 9 日在蒙特婁舉行。我們通常會隨機選出一名代表出席會議。不過，今年 我正在尋找自願參加的人，因為這次出席的人將背負比往常更多的責任。那時候我會在南極大陸的研究中心，所以我自己無法自願參加。<\/p><p>會議的負責人 Georgia Proctor 聯絡我，問今年我們研究所是否有人可以發表簡報。她對我們關於南極大陸企鵝遷徙模式的研究結果特別感興趣。所以，自願參加者必須針對這個主題發表簡報。<\/p><p>如果你對這個機會有興趣，請盡快告訴我。<\/p><p>Carl Eklund<br/>首席研究員<br/>野生動物研究所<\/p><\/div><\/section><\/div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 158–160 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><h2>舞者甄選通知<\/h2>\n<div class=\"notice-content\"><p>感謝各位今天前來。為了替 Hannah Levi 即將舉行的巡迴演唱會選出 20 名舞者，我們舉辦了今天的活動。由於招募廣告獲得非常熱烈的回響，甄選方式已有一些調整。<\/p>\n<p>我們將不再逐一為每名舞者安排個別試演，而是每次讓六人一組參加甄選。進入試演室時，請先將履歷及照片放在評審桌上。接著，六名舞者將一起隨著 Levi 女士的一首歌曲表演舞蹈。<\/p>\n<p>如果您獲選晉級下一輪，我們將通知您。獲選者請留在附近等候。第二輪甄選時，舞者將與我們的首席編舞師合作。隨後，留下的候選人會在傍晚再進行一輪甄選，然後才會公布最終結果。祝各位好運！<\/p><\/div><\/div><\/section><\/div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 161–164 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">繁體中文全文翻譯<\/div><h2>Reliance 7 即將上市！<\/h2><\/div><p>在今日的世界，行動生產力是必要的。我們將 Reliance 7 平板電腦打造得又薄又輕，讓您能夠帶它到任何地方！<\/p><p>我們的平板電腦具有俐落的設計，以及您隨手可用的所有必需工具。您將會愛上高解析度螢幕的豐富色彩與清晰圖像。而且，這款新的平板電腦附有獨特設計的觸控筆。<\/p><p>為了在競爭中脫穎而出，Reliance 公司和包袋設計公司 Top Crafter 合作。這個品牌為 Reliance 7 設計了只賣 30 元的時尚收納包。這是限定版商品—只製造了 1,000 個，每個都打印了序號。<\/p><p>1 月 12 日起，Reliance 7 將可在零售店購買，但 渴望入手的顧客可以在我們的網站 www.reliance.com 預訂。今天就在我們的網站預約你的平板電腦！<\/p><\/div><\/section><\/div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 165–167 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><p>1 月 6 日<\/p><p>Debonair 出版社<br/>Dundee 街 1800 號<br/>多倫多，安大略省 M6J 1X7<\/p><p>敬啟者：<\/p><p>我是 Brian Warburton 長久以來的書迷，這些年他的書帶給我很多靈感。我剛寫完自己的小說，很想引用 The Lost Sanctuary 系列中第三本，也是最後一本書《The Returning》的其中兩行。這兩行對我而言一直有很深刻的意義。因此，我希望讓這段引用出現在我小說的開頭，在書名與贈獻頁後面。<\/p><p>我不是非常確定如何取得引用許可。我查看了自己手頭這本 Warburton 先生的書，看到貴公司是印刷當年的版權持有者。如果貴公司仍然擁有權利，可以讓我知道是否能引用？如果可以的話，請告知我如何進行，以及我預計要付多少錢。如果貴公司已經沒有版權，可以請你們提供版權持有人或公司的電子郵件位址或電話號碼嗎？<\/p><p>謝謝，也期盼你們的回覆。<\/p><p>Chester M. Gleason<\/p><\/div><\/section><\/div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 168–171 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><h2>修復工程正式展開<\/h2><div class=\"byline\">Mary Harding 撰稿<\/div><p>大約 50 年前，Western Point 市建設了一座精心打造的紀念公園，紀念一位早期的居民 Lester Muller。Muller 先生是一位富有的工業家，他在這裡開設了第一座工廠。— [1] —。這座擁有知名鐘樓的公園，成為了受到訪客歡迎的目的地，每年吸引超過 2 萬人。<\/p><p>然而，公園在過去幾年遭遇維護上的問題。— [2] —。鐘樓的時鐘不再運作，建築物內部的油漆也褪色了。結果，監督公園營運的委員會決定關閉鐘樓，以進行 2 個月的修復工作。委員會聘請了 HC 建築師事務所的專家團隊。該團隊包括 Sam Hunt，他曾進行華盛頓特區 Rosenberg 紀念碑之類的類似修復工程。— [3] —。在接下來的 2 個月，他會監督必要的修繕。<\/p><p>在這段期間，大眾仍然可以自由利用附近的雕塑花園以及公園其他區域。— [4] —。開放時間是週二至週日上午 8 點至晚間 7 點。鐘樓的維修預計在 10 月 1 日前完成。<\/p><\/div><\/section><\/div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 172–175 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 1 份<\/small><\/div><div class=\"document-body\"><div class=\"conversation\"><div class=\"bubble\"><div class=\"bubble-meta\"><b>Andrew Marks<\/b><time>下午5:09<\/time><\/div><p>所以，延續我們的會議所討論的，我認為 GDE Motors 公司的 Foster 小姐準備好要完成談判了。她想在下週和 Mueller 先生會面，決定合約的條款。<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Robert Crane<\/b><time>下午5:11<\/time><\/div><p>Mueller 先生下禮拜不是要出差到紐西蘭嗎？<\/p><\/div><div class=\"bubble\"><div class=\"bubble-meta\"><b>Allison West<\/b><time>下午5:12<\/time><\/div><p>對。他下週不會在這裡。我們何不安排 Foster 小姐跟 Deanna Lane 會面呢？<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Andrew Marks<\/b><time>下午5:13<\/time><\/div><p>她的工作量已經很重了。我想她沒有時間會面。<\/p><\/div><div class=\"bubble\"><div class=\"bubble-meta\"><b>Robert Crane<\/b><time>下午5:15<\/time><\/div><p>我們可以請 Mueller 先生在紐西蘭進行視訊會議嗎？<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Allison West<\/b><time>下午5:16<\/time><\/div><p>那樣或許可以。我想客戶不會介意那樣做。<\/p><\/div><div class=\"bubble\"><div class=\"bubble-meta\"><b>Andrew Marks<\/b><time>下午5:18<\/time><\/div><p>我現在馬上跟 Mueller 先生談，並且了解他是否願意那樣做。如果他願意的話，你就可以跟 Foster 小姐安排日期和時間了，Allison。<\/p><\/div><div class=\"bubble bubble-alt\"><div class=\"bubble-meta\"><b>Allison West<\/b><time>下午5:19<\/time><\/div><p>沒問題。我會等你聯絡。<\/p><\/div><\/div><\/div><\/section><\/div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 176–180 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-review type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 2 份<\/small><\/div><div class=\"document-body\"><h2>ColdPro 2000｜產品評論<\/h2><div class=\"byline\">Roger Ling｜1 月 5 日<\/div><p>ColdPro 2000 冰箱是頂尖的產品，就像 Kitchen-Max 的所有家電一樣。在 ColdPro 的第二個版本，這家公司保留了很適合大部分廚房、相同的不鏽鋼現代設計。它有幾項額外功能，包括便利的飲水機。<\/p><p>不過，這個款式的一項重大缺點是淨水濾芯的配置。它藏在架子後面，使得它很難更換。根據使用手冊，濾芯應該每 3 個月更換，這對於擁有冰箱的人可能變得麻煩。<\/p><p>整體而言，這是很好的冰箱，雖然相對較貴。但 Kitchen-Max 公司在 12 月的記者會宣布，將在接下來的 2 月推出下一款冰箱系列的產品。我會建議在那之前暫緩（購買），因為 ColdPro 2000 預期將在那時候降價。<\/p><\/div><\/section><section class=\"document-card type-ad type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 2 / 2 份<\/small><\/div><div class=\"document-body\"><p>家電的未來：Kitchen-Max 公司的 ColdPro 3000 冰箱！<\/p><p>Kitchen-Max 很自豪地介紹最新款、最先進的冰箱 ColdPro 3000。這款家電產品具備我們上一款 ColdPro 2000 所有有用的功能，也包括製冰功能與蔬果（農產品）用的控溫儲藏室。<\/p><p>請上 www.kitchenmax.com/refrigerators 查看這款創新家電的更多資訊。ColdPro 3000 將從 2 月 25 日起在您家附近的零售店發售！請上我們的網站查看 Kitchen-Max 產品販售據點列表。<\/p><\/div><\/section><\/div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 181–185 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 2 份<\/small><\/div><div class=\"document-body\"><p>3 月 5 日<\/p><p>Michelle Simon<br/>Simon Digital 顧問公司<br/>Dunn 路 5883 號<br/>Mableton，喬治亞州 30126<\/p><p>親愛的 Simon 小姐：<\/p><p>恭喜！North 大街辦公室空間的業主—那裡是亞特蘭大唯一完全符合您的需求的地方—接受了您的出價。請檢閱這封信所附的合約提案。它已經修改過而包括了您所要求的新條款。月租調降了 220 元，條件是您同意從 4 月 1 日起租用這個空間 3 年。另外，業主會在那之前確認地板，且處理好任何必要的東西。不過，您必須自行準備冷氣系統。<\/p><p>如果您滿意的話，請把一份簽名的合約寄回給我。如果不滿意，我們可以進一步討論相關事項。<\/p><p>Damien Horowitz<br/>不動產顧問<\/p><p>附件：合約書<\/p><\/div><\/section><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 2 / 2 份<\/small><\/div><div class=\"document-body\"><p><div class=\"memo-title\">SIMON DIGITAL CONSULTING<strong>備忘錄 · MEMO<\/strong><\/div><\/p><p>收件者：全體員工<br/>寄件者：Michelle Simon<br/>主旨：遷移<br/>日期：3 月 7 日<\/p><p>我有個好消息。我們的不動產仲介 Horowitz 先生幫我們租到了符合我們所有要求的亞特蘭大辦公室。我們將在下個月搬到新辦公室。如同我之前所說的，這個改變將能讓我們離現有的客戶更近、追求新的事業機會，且容納額外的員工。我相信各位都會滿意。在那個地區有只要走路 5 分鐘就會到的車站，還有幾家餐廳。<\/p><p>新辦公室大部分的東西由業主管理，但不提供一些必要器具。所以，在 4 月 2 日業務團隊的設備和辦公室家具搬進新的空間之前，我們 4 月 1 日會請人安裝好那些器具。業務人員將從 4 月 3 日開始在新的空間工作。管理與會計團隊則會從 4 月 15 日開始。製作團隊會在最後，因為他們的編輯設備要到 5 月 1 日才能安裝。所以，他們的搬遷會在 5 月 2 日進行。<\/p><\/div><\/section><\/div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 186–190 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 3 份<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>Elsie McDaniel emd333@weblively.com<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Wayne Sward wsward@bluescreen.au<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>阿得雷德之旅<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>8 月 14 日<\/span><\/div><div><span class=\"mail-key\">附件<\/span><span>Buxton 課程<\/span><\/div><\/div><p>親愛的 Elsie：<\/p><p>你上禮拜提到，我們 9 月去阿得雷德旅行的時候，一起去上烹飪課會很不錯。我研究了這件事，找到了提供半天課程的烹飪學校。它叫 Buxton 烹飪學校，就在我們的飯店附近。<\/p><p>它們有 4 門我們可以上的課，但考慮到我們的行程，我們必須上平日的課。我知道你有 Joel Denton 的食譜書，而且很喜歡他的食譜。他會教其中一門課，所以我們可以實際見到他本人。<\/p><p>我附上了 Buxton 烹飪學校的時間表給你。請查看並且回覆我。一收到你的回覆，我就會報名課程。<\/p><p>Wayne<\/p><\/div><\/section><section class=\"document-card type-schedule type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 2 / 3 份<\/small><\/div><div class=\"document-body\"><h2>Buxton 烹飪學校｜九月份課程表<\/h2><div class=\"table-wrap\"><table><thead><tr><th>日期<\/th><th>上午 8–11 點<\/th><th>下午 1–4 點<\/th><th>下午 4–7 點<\/th><\/tr><\/thead><tbody><tr><td>星期二<\/td><td>—<\/td><td>探索海鮮（Sheila Ryer）<\/td><td>運用蔬菜（Martin Ames）<\/td><\/tr><tr><td>星期三<\/td><td>烘焙麵包（Joel Denton）<\/td><td>—<\/td><td>運用蔬菜（Martin Ames）<\/td><\/tr><tr><td>星期四<\/td><td>—<\/td><td>探索海鮮（Sheila Ryer）<\/td><td>—<\/td><\/tr><tr><td>星期五<\/td><td>—<\/td><td>—<\/td><td>製作醬料（Marie Pierre）<\/td><\/tr><tr><td>星期六<\/td><td>探索海鮮（Sheila Ryer）<\/td><td>烘焙麵包（Joel Denton）<\/td><td>製作醬料（Marie Pierre）<\/td><\/tr><tr><td>星期日<\/td><td>運用蔬菜（Martin Ames）<\/td><td>—<\/td><td>烘焙麵包（Joel Denton）<\/td><\/tr><\/tbody><\/table><\/div><div class=\"schedule-note\"><strong>備註：<\/strong><ul><li>星期一不開課。<\/li><li>每班最少 5 人，最多 20 人。<\/li><li>上午的課程包含參觀 Pinkston 食品市場，並於市場內進行簡短講解。<\/li><\/ul><\/div><\/div><\/section><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 3 / 3 份<\/small><\/div><div class=\"document-body\"><p>Pinkston 食品市場的團體訪客請注意<\/p><p>Pinkston 食品市場歡迎所有人，不管是購物還是單純逛逛的人，但最近有些攤販業主投訴 5 人以上團體擋住通道並妨礙一般顧客通行。所以，攤販業主們要求參觀團體的領隊與烹飪課教師保持團體持續往下一個攤位移動。想要對團體進行簡短說明的領隊，請在我們的美食廣場進行。那裡有許多座位，而且有應對大量來客的設備。另外，到場的人也可以在美食廣場免費試吃本地特產。<\/p><\/div><\/section><\/div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 191–195 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 3 份<\/small><\/div><div class=\"document-body\"><h2>Westburg 宣布節水計畫<\/h2><div class=\"byline\">Augustus Brandt 撰稿<\/div><p>Westburg 市議會宣布了減少用水量的計畫。計畫包含補助安裝水循環再利用系統的業者與住宅。市長 Arnell Lee 表示：「減少耗水量的一個主要方法是將水再利用。」她說明 該市將部分退款給安裝水循環再利用系統的屋主，不過系統最晚必須在 8 月前啟用。<\/p><p>異常低的降水量導致了該市在過去 10 年嚴重缺水。因此，水價大漲，而保持 Westburg 所有公共空間都有綠色植物的費用，迫使該市提高地方財產稅。該市已編列約 890 萬元的預算處理供水問題。<\/p><\/div><\/section><section class=\"document-card type-ad type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 2 / 3 份<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">繁體中文全文翻譯<\/div><h2>Home-Vert 水回收系統｜省錢又節水<\/h2><\/div><p>藉由安裝 Home-Vert 水循環再利用系統，降低您的帳單並幫助節水！<br/>• 我們在家庭或企業安裝系統。<br/>• 我們能幫您減少公用事業費用（水費）。<br/>• 取決於地點，我們能在 1-3 天內完成安裝。<\/p><p>我們的員工會為您說明系統運作方式，以及如何維護。請上 www.home-vert.com 填寫安裝申請表。每一位提交填寫完成的申請表的人，都將收到我們許多本地合作業者之一的 50 元優惠券！<\/p><\/div><\/section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 3 / 3 份<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>Edward Bircher edbirch@sspmail.com<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Karl Hutcherson karlh@home-vert.com<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>回覆：安裝申請<\/span><\/div><div><span class=\"mail-key\">附件<\/span><span>Badevoucher<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>7 月 15 日<\/span><\/div><\/div><p>親愛的 Bircher 先生：<\/p><p>謝謝您填寫我們的表單申請安裝水循環再利用系統。我們很樂意在下週一上午 10:30 派專員到您在 Westburg 市 Wilmont 街 17 號的住宅。請告訴我這個日期和時間對您而言是否方便。為了感謝您填寫申請表，我們附上了 Bade Hardware 價值 50 元的優惠券。優惠券有效期限至 12 月為止。<\/p><p>Karl Hutcherson<\/p><\/div><\/section><\/div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 196–200 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 1 / 3 份<\/small><\/div><div class=\"document-body\"><div class=\"site-head\"><div class=\"site-name\">Web Site Wizards<\/div><div class=\"site-nav\"><span>首頁<\/span><span>關於我們<\/span><span>服務<\/span><span>作品集<\/span><span>常見問題<\/span><span>職缺<\/span><\/div><\/div><div class=\"table-wrap\"><table><thead><tr><th>欄位<\/th><th>資料<\/th><th>欄位<\/th><th>資料<\/th><\/tr><\/thead><tbody><tr><td>名<\/td><td>Brady<\/td><td>電子郵件<\/td><td>brady@ponderosaclothing.com<\/td><\/tr><tr><td>姓<\/td><td>Grayson<\/td><td>電話<\/td><td>555-3786<\/td><\/tr><tr><td>原網站<\/td><td>www.ponderosaclothing.com<\/td><td>地址<\/td><td>31 North Pima Road, Scottsdale, AZ<\/td><\/tr><\/tbody><\/table><\/div><h3>請說明您希望我們提供的服務<\/h3><div class=\"form-answer\">我經營一家名為 Ponderosa Clothing、專門銷售 T 恤的商店。我已有網站，但網站只有簡短的公司介紹、熱銷產品資料和地圖。我希望升級網站，讓顧客可以直接在線上訂購商品。<\/div><h3>您希望我們如何聯絡您？<\/h3><div class=\"choice-row\"><span>■ 電子郵件<\/span><span>□ 電話<\/span><\/div><h3>您需要哪些服務？<\/h3><div class=\"services-grid\"><span>■ 網站設計<\/span><span>■ 網路廣告<\/span><span>□ 宣傳影片<\/span><span>■ 電子商務建置<\/span><span>□ 標誌設計<\/span><span>□ 電子郵件行銷<\/span><span>■ 網站流量分析<\/span><span>□ 網站安全<\/span><span>□ 行動應用程式設計<\/span><\/div><p>請勾選需要的服務，我們將提供報價估算。<\/p><\/div><\/section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 2 / 3 份<\/small><\/div><div class=\"document-body\"><div class=\"mail-meta\"><div><span class=\"mail-key\">收件者<\/span><span>Brady Grayson brady@ponderosaclothing.com<\/span><\/div><div><span class=\"mail-key\">寄件者<\/span><span>Anita Hernandez customerservice@websitewizards.com<\/span><\/div><div><span class=\"mail-key\">主旨<\/span><span>報價申請<\/span><\/div><div><span class=\"mail-key\">日期<\/span><span>8 月 2 日<\/span><\/div><div><span class=\"mail-key\">附件<\/span><span>專案估價<\/span><\/div><\/div><p>親愛的 Grayson 先生：<\/p><p>感謝您聯絡 Web Site Wizards 公司。我們的一名設計師檢視了您目前的網站，並製作了專案估價單，我已經附在這封郵件裡了。設計 www.ponderosaclothing.com 並建置電子商務功能的總費用，預計為 1,250 元。<\/p><p>如果您對我們的估價滿意，請寄給我們一些您喜歡的網站連結。我們會檢視這些網站，並且試圖在您網站的新版本使用類似的設計元素。另外，您必須寄一張您商店的照片，因為它會出現在您網站的首頁。<\/p><p>如果您改變心意，且選擇增加其他服務，例如宣傳影片或行動應用程式開發，請寄電子郵件到我們的客服部門，好讓他們能重新計算您的報價。<\/p><p>Anita Hernandez<\/p><\/div><\/section><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>第 3 / 3 份<\/small><\/div><div class=\"document-body\"><div class=\"ad-hero\"><div class=\"ad-kicker\">繁體中文全文翻譯<\/div><h2>Ponderosa Clothing｜來自斯科茨代爾的獨特紀念品<\/h2><\/div><p>您在找真正的、獨一無二的紀念品來紀念您在斯科茨代爾的時光嗎？那麼何不看 Ponderosa Clothing 所販賣的商品呢？許多品項都有美國西南部的藝術花樣，而且 我們的所有衣服都只使用植物性染料。我們這麼做是為了保存幾個世紀以前流傳下來的地區傳統。<\/p><p>Ponderosa Clothing 的產品可以在我們位於斯科茨代爾的店面、我們新設計的網站，以及透過我們可下載的行動應用程式購買！請上 www.ponderosaclothing.com 觀看我們的宣傳影片、瀏覽我們最受歡迎的產品，並且用我們新的購物車功能來購買。所有網路訂單免國內運費，但海外購買將另外收費。<\/p><\/div><\/section><\/div>"};const DETAILED_EXPLANATIONS={"101":{"type":"介系詞慣用語","translation":"實習生將在研究部門經理的指導下工作。","reason":"依句意「在經理指導下工作」，應選 (C) under。under the direction of 是固定搭配，表示「在……的指導／指揮下」；beyond（超出）、among（在……之中）、beside（在……旁邊）均不合句意。","paraphrase":"","vocab":""},"102":{"type":"副詞修飾動詞","translation":"Ambrose 路上的那棟歷史建築，自150年前興建以來已發生相當大的變化。","reason":"changed 是動詞，應以副詞 considerably（顯著地、相當大幅度地）加以修飾，因此選 (B)。considerable 為形容詞，其餘選項也不能放在此處修飾 changed。","paraphrase":"","vocab":""},"103":{"type":"考點解析","translation":"PenTex 的董事正與 DRW 公司的高階主管會面，而 PenTex 董事之前曾與 DRW 討論合併事宜。","reason":"which 引導的關係子句（which ~ with）缺少主詞，所以答案是可以當主詞的主格人稱代名詞 (D) they。受格人稱代名詞 (A)、反身代名詞 (B)、所有格人稱代名詞 (C) 都不能當主詞。另外，關係子句（which ~ with）修飾的先行詞（DRW Corporation），是關係子句中動名詞片語 merging with 的受詞。","paraphrase":"","vocab":""},"104":{"type":"考點解析","translation":"希望終止租約的房客，應至少在搬離前30天通知房東。","reason":"助動詞（should）後面要接動詞原形，所以 (A) notify（通知）是正確答案。過去式動詞或過去分詞 (B)、動名詞或現在分詞 (C)、第三人稱單數形動詞 (D) 不能接在助動詞後面。另外，who wish to ~ lease 是修飾先行詞（Tenants）的關係子句。","paraphrase":"","vocab":""},"105":{"type":"考點解析","translation":"Sylvia Lyman 以全班第一名的成績畢業，隨即受一家聲望卓著的律師事務所聘用。","reason":"合適的句意是「馬上就獲得很有名望的法律事務所聘用」，所以形容詞 (B) prestigious（有名望的）是正確答案。(A) practical 表示「實際的」、(C) deliberate 表示「慎重的，故意的」、(D) supplemental 表示「補充的」。","paraphrase":"","vocab":""},"106":{"type":"考點解析","translation":"比較樣品可以幫助顧客選出適合浴室牆面與地板的最佳磁磚。","reason":"合適的句意是「幫助顧客選擇完美的瓷磚」，所以動詞 (A) select（選擇）是正確答案。(B) complete 表示「完成」、(C) harm 表示「傷害」、(D) reveal 表示「揭露」。","paraphrase":"","vocab":""},"107":{"type":"考點解析","translation":"飯店經理定期與員工溝通，以確保營運順暢。","reason":"能修飾空格前面動詞（communicate）的是副詞，所以副詞 (D) regularly 是正確答案。形容詞或名詞 (A)、名詞 (B) 和 (C) 不能修飾動詞。","paraphrase":"","vocab":""},"108":{"type":"考點解析","translation":"Arrow Publicity 製作了一項宣傳活動，旨在吸引18至25歲的觀眾。","reason":"句意是「為了吸引 18 至 25 歲觀眾的廣告活動」，所以片語動詞 (A) appeal to（吸引…）是正確答案。(B) approve of 表示「贊成，批准」，(C) point out 表示「指出…」，(D) result from 表示「（結果）由…造成」。","paraphrase":"","vocab":""},"109":{"type":"考點解析","translation":"公司將為新進人員提供訓練，因此不要求工作經驗或學位。","reason":"可以和空格前面的 neither 構成相關連接詞 neither A nor B（不是 A 也不是 B）的 (C) nor 是正確答案。另外，當主詞是 neither A nor B 時，動詞的數與 B（a degree）一致，所以這裡使用單數動詞（is required）。","paraphrase":"","vocab":""},"110":{"type":"考點解析","translation":"只要列車取消或延誤，Meta Rail 的乘客就有權獲得全額退票。","reason":"這個句子已經有具備主詞（Meta Rail passengers）和動詞（are entitled）的完整子句，所以 their train is canceled or delayed 是修飾性的語句。修飾部分有動詞（is canceled、delayed），所以能引導修飾子句的副詞子句連接詞 (C) 和 (D) 是可能的答案。句意是「只要列車被取消或延誤，就有權獲得車票全額退款」，所以表示條件的副詞子句連接詞 (D) provided that（只要…就是）是正確答案。如果使用 (C) as though（好像…一樣）的話，意思會變成「好像列車被取消或延誤一般，有權獲得車票全額退款」，所以不對。(A) along with（和…一起）和 (B) except for（除了…以外）引導的是修飾片語，而不是子句。","paraphrase":"","vocab":""},"111":{"type":"考點解析","translation":"分析師預測明年油價將上漲約30%。","reason":"that 引導的名詞子句（that the price of oil ~ in the coming year）裡面缺少動詞，所以動詞 (A)、(B)、(C)、(D) 都是可能的答案。句意是「油價將在明年上漲約 30%」，所以未來式 (B) will increase 是正確答案。現在式 (A) 通常表示重複性的行為或習慣，過去式 (C) 表示過去發生的事，現在完成式 (D) 表示過去發生的事持續到現在，都不符合句意。","paraphrase":"","vocab":""},"112":{"type":"考點解析","translation":"員工現在可享有每週最多一半工時在家工作的福利。","reason":"可以放在定冠詞（the）和介系詞（of）之間的是名詞，所以名詞 (A) 和動名詞 (D) 是可能的答案。因為句意是「最多每週一半時數在家工作的福利」，所以名詞 (A) benefit（福利）是正確答案。使用動名詞 (D) 的話，意思會變成「在家工作的有益」，並不恰當。動詞或過去分詞 (B) 和形容詞 (C) 不能用在名詞位置。","paraphrase":"","vocab":""},"113":{"type":"考點解析","translation":"Knoll 顧問公司希望聘用個人價值觀與公司理念相符的員工。","reason":"這個句子已經有具備主詞（Knoll Consulting）、動詞（tries）和受詞（to hire staff）的完整子句，所以 ~ company's 是修飾性的語句。因為是修飾空格前面先行詞（staff）的關係子句，所以需要填入關係代名詞，所有選項都是可能的答案。這個關係子句（~ company's）裡面已經有主詞（personal values），所以能夠修飾這個主詞的所有格關係代名詞 (C) whose（…的）是正確答案。受格關係代名詞 (A) whom 和主格關係代名詞 (D) who 會成為關係子句中的受詞、主詞，但這裡的關係子句已經有主詞和受詞了。主格或受格關係代名詞 (B) which 是用在先行詞為事物的情況。","paraphrase":"","vocab":""},"114":{"type":"考點解析","translation":"不同於傳統手機，Tektone 新推出的 TX-81 能使用其他公司生產的零件維修。","reason":"句意是「和普通的行動電話不同，Tektone 公司創新的 TX-81 可以用其他公司生產的零件修理」，所以形容詞 (D) conventional（普通的，傳統的）是正確答案。(A) habitual 表示「習慣性的」，(B) defective 表示「有缺陷的」，(C) appropriate 表示「適當的」。","paraphrase":"","vocab":""},"115":{"type":"考點解析","translation":"與市場上的類似產品相比，Colora 室內油漆對天候損害的抵抗力高出50%。","reason":"空格是 be 動詞（are）的補語位置，所以能當補語的形容詞 (C) 和名詞 (D) 是可能的答案。句意是「和類似產品相比，Colora 住宅用漆比較能抵抗惡劣天氣造成的損壞」，所以形容詞 (C) resistant（抵抗的）是正確答案。請記住 resistant to（抵抗…的）這個慣用說法。如果使用名詞 (D) resistance（抵抗）的話，會變成等於主詞（Colora house paints）的意思「Colora 住宅用漆是抵抗」，所以不對。動詞 (A) 和 (B) 不能用在這個補語位置。另外，50 percent 在這裡的性質是副詞片語「以 50% 的程度」，和比較級的 more 一起修飾空格中的形容詞 resistant。","paraphrase":"","vocab":""},"116":{"type":"考點解析","translation":"部分新辦公家具的尺寸不合適，無法放進預定的辦公空間。","reason":"句意是「尺寸尷尬，不適合預期放的辦公室空間」，所以副詞 (B) awkwardly（尷尬地）是正確答案。(A) silently 表示「安靜地」，(C) solidly 表示「堅固地」，(D) sharply 表示「尖銳地」。","paraphrase":"","vocab":""},"117":{"type":"考點解析","translation":"紐約的居住成本遠高於鄰近的紐澤西州。","reason":"句意是「紐約的居住成本比鄰近的紐澤西州高出許多」，所以能代替前面出現過的複數名詞（Housing costs）的 (D) those 是正確答案。不定代名詞 (A) anyone 表示「任何人」，指非特定的人物。(B) other（其他的）當形容詞時表示已經提過的對象以外的，而當代名詞時會以 others 或 the other(s) 的形態使用，分別表示「（已經提過的對象以外的）其他人或事物」、「其餘的全部」。指示代名詞 (C) that 是用來代替前面出現過的單數名詞或不可數名詞。","paraphrase":"","vocab":""},"118":{"type":"考點解析","translation":"Martinsburg 美術館以收藏古典繪畫作品而廣為人知。","reason":"能修飾動詞（is known）的是副詞，所以副詞 (A) widely（廣泛地）是正確答案。形容詞 (B)、形容詞的比較級 (C)、動詞 (D) 都不能修飾動詞。就算把 (B) 和 (C) 當成 be 動詞（is）的補語，也無法和空格後面的 known 連用。請記住 be widely known（廣為人知）這個慣用表達方式。","paraphrase":"","vocab":""},"119":{"type":"考點解析","translation":"採用匿名問卷調查，是取得消費者真實意見的好方法。","reason":"句意是「獲得消費者誠實意見的好方法」，所以 (A) opinions（意見）是正確答案。(B) clue 表示「線索」、(C) chance 表示「機會」、(D) decision 表示「決定」。","paraphrase":"","vocab":""},"120":{"type":"考點解析","translation":"Quinn 先生及同事已事先訂位，因此一到餐廳便立即獲安排入座。","reason":"句意是「一到餐廳就立刻被安排入座」，所以表示時間點的介系詞 (C) upon（一…就）是正確答案。(A) up 表示位置「在…之上」，(B) in 表示時間或場所「在…之中」，(D) to 表示方向「往…」。","paraphrase":"","vocab":""},"121":{"type":"考點解析","translation":"如果一方未履行協議條款，該合約可以依法終止。","reason":"句意是「如果其中一方無法履行協議的條款，合約可以被合法終止」，所以動詞 terminate（終止）的 p.p. 形 (A) terminated 是正確答案。(D) disconnect（中斷）雖然看起來類似，但主要是表示中斷瓦斯、水管、電力等管線的供給，所以不對。(B) recover 表示「恢復，找回」，(C) designate 表示「指定，指派」。","paraphrase":"","vocab":""},"122":{"type":"考點解析","translation":"Reed 女士擔任總編輯的第一年，便將《The National Gazette》的讀者人數提升至25萬人以上。","reason":"能當動詞（expanded）的受詞，而且被所有格（The National Gazette's）修飾的是名詞，所以名詞 (B)、(C)、(D) 是可能的答案。句意是「將讀者數增加到超過 25 萬人」，所以抽象名詞 (D) readership（讀者數，讀者層）是正確答案。人物名詞 (B) readers（讀者）雖然意思很像，但 expand 是指拓展範圍、大小、事業等等，而不會接人物名詞當受詞，所以不對。如果使用抽象名詞 (C) reading（閱讀），意思會變成「將閱讀拓展到超過 25 萬」，意義不明。動詞 (A) 不能用在名詞的位置。","paraphrase":"","vocab":""},"123":{"type":"考點解析","translation":"為了節省紙張，Florence Media Productions 限制員工每天可影印的份數。","reason":"空格是及物動詞（has placed）的受詞，所以名詞 (A) 和 (C) 是可能的答案。句意是「對影印的張數做了限制」，所以名詞 (C) limitations（限制）是正確答案。(A) limit（限制）是可數名詞，必須使用複數型或者和冠詞一起使用。形容詞 (B)、動詞或過去分詞 (D) 不能用在名詞的位置。另外，請把 place a limit on（對…做出限制）這個慣用表達方式記起來。","paraphrase":"","vocab":""},"124":{"type":"考點解析","translation":"駕駛時依法必須戴眼鏡的人，若未佩戴可能遭到處罰。","reason":"句意是「有義務戴眼鏡的人」，所以能和空格前面的 be 動詞（are）、後面的 to 結合成 be obligated to（有義務做～）的形容詞 (C) obligated（有義務的）是正確答案。原形動詞 (A) obligate（使…有義務）不能直接用在 be 動詞後面。就算把 obligate 當成形容詞「有義務的」，也不能搭配 to 不定詞使用，所以不對。名詞 (B) obligation（義務）雖然可以接在 be 動詞後面當補語，但表達的會是「等於主詞（People）」，而變成「是義務的人」這種錯的意思。如果使用 -ing 形 (D)，則會變成進行式「be 動詞（are）+ -ing」，但及物動詞 obligate（使…有義務）必須要有人物受詞，所以用在這裡不恰當。另外，這裡 who ~ driving 的部分是修飾先行詞（People）的關係子句。","paraphrase":"","vocab":""},"125":{"type":"考點解析","translation":"Laudner Holdings 的 Duchene 先生寄出的電子郵件，正是 Coleman 女士一直在等待的消息。","reason":"空格之後的部分（~ was waiting for）是 be 動詞（is）的補語，也就是名詞子句，而所有選項都可以當引導名詞子句的連接詞使用。因為句意是「電子郵件是 Coleman 小姐之前在等待的東西」，而空格所在子句（~ was waiting for）中的動詞片語（was waiting for）缺少受詞，所以能作為名詞子句中的受詞，同時又能引導這個名詞子句的疑問代名詞 (B) what（…的事物）是正確答案。如果使用疑問代名詞 (A) who（…的人），意思會變成「電子郵件是 Coleman 小姐之前在等待的人」，所以不對。疑問副詞 (C) how（如何）與 (D) when（何時）後面會接完整的子句，但在這個題目裡，空格所在的子句還缺少了動詞片語（was waiting for）的受詞，所以不能選這兩個選項。","paraphrase":"","vocab":""},"126":{"type":"考點解析","translati
