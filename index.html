<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 多益線上練習｜101–200</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",Arial,sans-serif;color:#182238;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1000px;margin:auto;padding:24px 16px 60px}header{background:#152d58;color:#fff;padding:27px 20px;border-radius:17px}h1{margin:0 0 7px;font-size:27px}header p{margin:0;color:#d5e5ff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat,.panel{background:white;border:1px solid #dfe6f1;border-radius:14px;padding:16px}.stat b{display:block;font-size:25px;color:#1e4a99}.stat span{font-size:13px;color:#556278}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar button,.toolbar select{border:1px solid #cbd6e8;border-radius:9px;background:white;padding:10px 12px;color:#25385d;cursor:pointer}.toolbar button.active{background:#2453a6;color:white}.panel{margin-top:15px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{color:#476899;background:#eaf1ff;border-radius:30px;padding:5px 11px;font-size:12px}.passage{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fc;border-left:4px solid #557bba;padding:17px;margin:14px 0;line-height:1.65;font-size:15px}.stem{white-space:pre-wrap;line-height:1.75;font-size:17px;margin:15px 0}.answers{display:grid;gap:9px}.choice{text-align:left;border:1px solid #c9d5e8;border-radius:9px;padding:13px;background:white;color:#182238;font:inherit;cursor:pointer;line-height:1.5}.choice:hover:not(:disabled){background:#edf4ff}.choice.correct{border-color:#22a266;background:#e5f8ed}.choice.wrong{border-color:#d84c5b;background:#fff0f0}.choice:disabled{cursor:default;opacity:1}.feedback{margin-top:13px;padding:12px;border-radius:9px;background:#f1f5fa}.nav{display:flex;gap:10px;justify-content:space-between;margin:18px 0}.nav button,.primary{background:#2453a6;border:0;color:white;padding:12px 20px;border-radius:9px;cursor:pointer}.nav button:disabled{opacity:.45;cursor:default}.small{font-size:13px;color:#61708a}.numbers{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:7px;margin-top:12px}.number{border-radius:8px;border:1px solid #c9d5e8;background:#fff;padding:9px 0;cursor:pointer}.number.current{outline:2px solid #2354ac}.number.right{background:#e2f7e9;border-color:#6db78a}.number.bad{background:#ffe7e7;border-color:#dd9696}.warning{background:#fff6db;border:1px solid #e9d59b;border-radius:10px;padding:12px;margin:14px 0;font-size:14px}.footer{margin-top:20px;font-size:13px;color:#64728a}@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}.shell{padding:12px}.stat{padding:12px}}

/* Editorial test-booklet layout */
:root{font-family:Arial,"Noto Sans TC",sans-serif;color:#18243b;background:#edf1f6}
.shell{max-width:1080px}header{border-radius:8px;background:linear-gradient(120deg,#11294e,#24518a);border-bottom:6px solid #e6ad31}
.panel,.stat{border-radius:9px}.panel{padding:clamp(14px,3.5vw,28px)}.stat b{font-variant-numeric:tabular-nums}
#quiz h2{margin:0;font-size:22px}.stem{font-family:Arial,"Times New Roman",serif;font-size:18px;line-height:1.72;border-top:1px solid #dce4ef;padding-top:16px}
.reading-intro{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 10px;color:#637189;font-size:12px;letter-spacing:.02em}

.reading-stack{display:grid;gap:24px;margin-bottom:24px}
.document-card{background:#fff;border:1px solid #bbc6d4;border-radius:3px;overflow:hidden;box-shadow:0 3px 10px #233b5712;color:#20242c}
.doc-ribbon{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#e8edf3;color:#35445a;border-bottom:1px solid #d1dae4;padding:8px 16px;font-size:11px;font-weight:bold;letter-spacing:.14em}
.doc-ribbon small{font-size:10px;letter-spacing:.04em;font-weight:normal}
.document-body{padding:24px clamp(16px,3vw,32px);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.68;overflow-wrap:anywhere}
.document-body p{margin:0 0 13px}.document-body p:last-child{margin-bottom:0}.document-body h2{font-family:Georgia,"Times New Roman",serif!important;text-align:center;font-size:23px!important;margin:0 0 20px!important;line-height:1.28;letter-spacing:.01em}.document-body h3{font-size:16px;margin:23px 0 9px;border-bottom:1px solid #bbb;padding-bottom:5px}
.document-body ul{padding-left:22px;margin:10px 0 15px}.document-body li{margin:6px 0}
.document-body table{width:100%;border-collapse:collapse;line-height:1.45;font-size:13px;margin:14px 0;background:white;display:block;overflow-x:auto}
.document-body th,.document-body td{border:1px solid #687589;padding:10px 9px;text-align:left;min-width:65px}.document-body th{background:#e7ecf2;font-weight:700}.document-body tbody tr:nth-child(even){background:#f7f9fb}
.document-body a{color:#164e88;text-decoration:underline}.document-body strong.blank-number{border:1px solid #8c99aa;background:#f2f5f9;padding:1px 7px;white-space:nowrap}
.type-mail{border-color:#9eafbd}.type-mail .doc-ribbon{background:#dce7f0}.type-mail .document-body>p:first-child{background:#f2f6f9;padding:15px;border-bottom:2px solid #90a4ba;line-height:2.0;margin:-1px -4px 21px}.mail-key{display:inline-block;min-width:75px;color:#526277;letter-spacing:.04em;font-size:12px}
.type-chat{background:#f2f5f8}.type-chat .document-body{background:linear-gradient(#f5f7f9,#e9eff4);padding:22px}.type-chat .document-body p{background:white;border-radius:4px 15px 15px 15px;box-shadow:0 1px 3px #17345519;padding:12px 16px;margin:0 5% 14px 0;border-left:3px solid #638db4}.type-chat .document-body p:nth-child(even){margin-left:8%;margin-right:0;border-left-color:#cba558;background:#fffefa}.chat-sender{color:#23476e}.chat-time{color:#6b7280;font-size:12px;white-space:nowrap}
.type-article .doc-ribbon{background:#f0ede6}.type-article .document-body{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.78}.type-article .document-body p{text-align:justify}.type-article .document-body h2{font-size:26px!important;text-align:left;border-bottom:3px double #4e5660;padding-bottom:12px}
.type-notice .document-body h2,.type-flyer .document-body h2,.type-ad .document-body h2{font-family:Arial,sans-serif!important;letter-spacing:.04em;text-transform:uppercase}.type-notice .document-body{border:7px double #ebeff4;margin:12px;padding:19px}.type-ad .document-body{border-top:7px solid #304e71}.type-flyer .document-body{background:#fbfaf5}.type-flyer .document-body h2{color:#2d506c}
.type-form .document-body{background:#fcfcfa}.type-form .document-body h2{background:#e8edf0;text-align:left;padding:12px}.type-form .document-body table{font-family:Arial,sans-serif}
.type-report .document-body{background:#fff}.type-report .document-body h2{text-transform:uppercase;font-family:Arial,sans-serif!important}.type-letter .document-body{padding:34px 38px}
.type-webpage .document-body{padding-top:0}.browser-chrome{display:flex;gap:20px;align-items:center;font:11px Arial;background:#e9edf1;border-bottom:1px solid #cbd6de;color:#586779;margin:0 -32px 20px;padding:9px 17px}.browser-dots{color:#b27676;letter-spacing:.16em}.type-webpage .document-body h2{font-family:Arial,sans-serif!important;text-align:left;color:#1e4c77}.type-webpage .document-body h2:before{content:'⌂  ';color:#b08d45}
.type-sms .document-body{background:#e9eff4;padding:20px}.sms-bubble{background:#fff;border-radius:18px 18px 18px 5px;max-width:90%;padding:18px 20px;box-shadow:0 2px 6px #17294318}
.type-manual .document-body h2{text-align:left;font-family:Arial,sans-serif!important;border-bottom:2px solid #263d5a;padding-bottom:10px}
.type-schedule .document-body{background:#fdfefe}.type-schedule .document-body th{background:#334e6e;color:white}
.choice{font-family:Arial,sans-serif;font-size:16px;min-height:50px;border-radius:6px}.choice b{display:inline-block;min-width:37px}.feedback{font-size:15px}.warning{line-height:1.5}
@media(max-width:600px){.document-body{padding:17px 14px;font-size:14px}.document-body table{font-size:12px}.document-body th,.document-body td{padding:8px 7px}.document-body h2{font-size:20px!important}.type-notice .document-body{margin:7px;border-width:4px;padding:12px}.type-letter .document-body{padding:22px 19px}.browser-chrome{margin:0 -14px 17px}.reading-intro{flex-wrap:wrap}.type-article .document-body{font-size:15px}}
.explanation{margin-top:18px;background:#f6faff;border:1px solid #cbdcf1;border-left:5px solid #3464a1;border-radius:12px;padding:18px 20px;color:#182d45;line-height:1.8}.answer-status{font-size:17px;font-weight:750;margin-bottom:5px}.correct-answer{padding:8px 0 10px;font-size:16px}.correct-answer strong{color:#0d6547}.answer-reason{border-top:1px solid #dbe5f2;padding-top:12px}.answer-reason>strong{color:#1c447a}.answer-reason p{margin:6px 0 0;font-size:16px;line-height:1.85}.review-warning{margin:12px 0 0;padding:10px 12px;background:#fff7e6;color:#77500f;border-radius:8px;font-size:14px}.feedback.explanation{display:block}@media(max-width:600px){.explanation{padding:14px}.answer-reason p{font-size:15px}}
.stem-number{color:#183d6b;font-family:Arial,sans-serif;margin-right:8px;font-weight:800}.import-button{display:inline-flex;align-items:center;border:1px solid #cbd6e8;border-radius:9px;background:#fff;padding:10px 12px;color:#25385d;cursor:pointer;font-size:14px}.import-button:hover{background:#eaf1fa}
.type-webpage .document-body table{display:table;table-layout:auto;width:100%}.type-webpage .document-body table th:nth-child(1){min-width:210px}.type-webpage .document-body table th{white-space:nowrap}.type-webpage .document-body table td{white-space:nowrap}.type-webpage .document-body{overflow-x:auto}
@media(max-width:700px){.type-webpage .document-body table{display:block;overflow-x:auto}.stem-number{margin-right:5px}}
</style></head><body><main class="shell"><header><h1>TOEIC 多益線上練習</h1><p>Part 5 · Part 6 · Part 7｜閱讀試卷風格・即時批改・自動記錄</p></header><section class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="right">0</b><span>答對</span></div><div class="stat"><b id="wrong">0</b><span>答錯</span></div><div class="stat"><b id="accuracy">0%</b><span>正確率</span></div></section><div class="toolbar"><select id="part"><option value="all">全部 Part</option><option value="5">Part 5</option><option value="6">Part 6</option><option value="7">Part 7</option></select><button id="all" class="active">全部題目</button><button id="missed">錯題本</button><button id="unanswered">未作答</button><button id="export">匯出作答 CSV</button><label class="import-button" for="importCsv">匯入作答 CSV</label><input id="importCsv" type="file" accept=".csv,text/csv" hidden><button id="reset">重新作答</button></div><div class="warning">作答資料儲存於目前瀏覽器。可匯出 CSV 備份，再於其他裝置匯入接續練習。答案與說明依提供的解答整理，非官方核定版本。</div><section id="quiz" class="panel"></section><div class="nav"><button id="prev">← 上一題</button><button id="next">下一題 →</button></div><section class="panel"><div class="head"><b>題號總覽</b><span class="small">綠色答對・紅色答錯</span></div><div id="numbers" class="numbers"></div></section><p class="footer">儲存於目前瀏覽器。更換裝置、清除網站資料或使用無痕模式，可能失去紀錄。答案為依題目推定，並非官方提供的答案表。</p></main><script>
const DATA={"questions": [{"id": 101, "part": 5, "stem": "The CEO will ______ meet with clients during his visit to Berlin.", "choices": ["brief", "briefing", "briefest", "briefly"], "answer": "D", "explanation": "空格在 will 與原形動詞 meet 之間，需填副詞修飾動詞，故選 briefly（短暫地）。形容詞、名詞、最高級不能修飾動詞。"}, {"id": 102, "part": 5, "stem": "The Lee Valley Fire Department launched an ______ to determine what caused the forest fire.", "choices": ["investigation", "investigatory", "investigate", "investigative"], "answer": "A", "explanation": "空格為 launched 的受詞，不定冠詞 an 後應接名詞；launch an investigation 為「展開調查」。"}, {"id": 103, "part": 5, "stem": "Please ______ some snacks for the hike as it will take about four hours to complete.", "choices": ["promote", "pack", "mark", "balance"], "answer": "B", "explanation": "句意為「為健行準備一些零食」，pack 表示裝進行李、準備；其他選項語意不合。"}, {"id": 104, "part": 5, "stem": "Ms. Ewing ______ the results of last month's survey and then produce a summary next week.", "choices": ["collected", "collecting", "had collected", "will collect"], "answer": "D", "explanation": "and 連接對等結構，後方表示下週的動作 produce，前方應用 will collect 表示未來。"}, {"id": 105, "part": 5, "stem": "Charles Hayes is ______ the top chess players in England, having defeated many former champions.", "choices": ["around", "between", "among", "inside"], "answer": "C", "explanation": "among 表示「在……之中」，意為英格蘭頂尖棋手之一；between 通常指兩者之間。"}, {"id": 106, "part": 5, "stem": "______ workers find in the concert hall will remain in the lost and found center for only one week.", "choices": ["Few", "Several", "Anything", "Most"], "answer": "C", "explanation": "Anything 表示「任何東西」，指員工在音樂廳發現的物品只保留一週。"}, {"id": 107, "part": 5, "stem": "Mr. Robinson fulfilled all of the company's requirements and is therefore ______ to apply for a permanent position.", "choices": ["qualify", "qualifying", "qualifies", "qualified"], "answer": "D", "explanation": "is 後需形容詞補語；qualified 表示「有資格的」，be qualified to apply 為常用結構。"}, {"id": 108, "part": 5, "stem": "The play Middle of Summer had a ______ ending, with an unexpected twist that left audiences in shock.", "choices": ["conventional", "memorable", "marginal", "prosperous"], "answer": "B", "explanation": "意外轉折令觀眾震驚，故是令人難忘（memorable）的結局。"}, {"id": 109, "part": 5, "stem": "______ Mactran Corporation established a comprehensive recycling program last year, many staff members don't follow the guidelines properly.", "choices": ["Although", "Until", "If", "Before"], "answer": "A", "explanation": "前後句形成讓步關係：「雖然」已建立回收計畫，員工仍不遵守，故選 Although。"}, {"id": 110, "part": 5, "stem": "The route for the New Year's Day Parade has been outlined, but organizers are still ______ the details.", "choices": ["finalize", "finalizes", "finalizing", "finalized"], "answer": "C", "explanation": "are 後接 V-ing 形成現在進行式，且後有受詞 the details，故選 finalizing。"}, {"id": 111, "part": 5, "stem": "At the Wilkinsburg city council meeting, there was a ______ consensus that property taxes should be raised.", "choices": ["generalization", "generally", "generalize", "general"], "answer": "D", "explanation": "consensus 是名詞，前面應由形容詞 general 修飾。"}, {"id": 112, "part": 5, "stem": "A million new units of the video game console ______ at CX's factories right now to meet customer demand.", "choices": ["to manufacture", "would have manufactured", "had been manufactured", "are being manufactured"], "answer": "D", "explanation": "right now 表示正在發生；複數主詞 units 為被製造，需現在進行被動式 are being manufactured。"}, {"id": 113, "part": 5, "stem": "Anyone with a camera is eligible to ______ in the Sydney 48-Hour Photography Competition.", "choices": ["result", "obtain", "participate", "choose"], "answer": "C", "explanation": "participate in 為固定搭配，表示「參加比賽」。"}, {"id": 114, "part": 5, "stem": "______ weather forecasts, the town of Wilshire can expect up to eight inches of snow tomorrow.", "choices": ["Provided that", "According to", "Other than", "Along with"], "answer": "B", "explanation": "According to weather forecasts 表示「根據天氣預報」。"}, {"id": 115, "part": 5, "stem": "Staff members will ______ Harmon Inc.'s latest kitchen appliances on stage at this weekend's Food Expo.", "choices": ["demonstrate", "implement", "conceive", "express"], "answer": "A", "explanation": "在食品展舞台上「示範操作」家電，應選 demonstrate。"}, {"id": 116, "part": 5, "stem": "Because of his extensive experience, board members consider Mr. Peters the ______ candidate for the CEO position.", "choices": ["inferior", "factual", "ideal", "polite"], "answer": "C", "explanation": "ideal candidate 指「理想人選」，符合董事會對 CEO 候選人的評價。"}, {"id": 117, "part": 5, "stem": "All applications to Florian University's Master's in Business Administration Program are due ______ January 1.", "choices": ["through", "with", "by", "into"], "answer": "C", "explanation": "by January 1 表示「不晚於一月一日」，符合申請截止日。"}, {"id": 118, "part": 5, "stem": "The company shifted ______ from its old business model to a fully digital one.", "choices": ["radicalizing", "radically", "radicalize", "radical"], "answer": "B", "explanation": "修飾動詞 shifted 須使用副詞 radically（徹底地、大幅地）。"}, {"id": 119, "part": 5, "stem": "Priyanka Reddy is the youngest ______ ever to receive the prestigious Clinton Film Award.", "choices": ["director", "directly", "directed", "direction"], "answer": "A", "explanation": "youngest 後須接人物名詞 director，表示最年輕的獲獎導演。"}, {"id": 120, "part": 5, "stem": "Reporters ______ don't carry an official press badge will not be allowed into the venue.", "choices": ["what", "who", "which", "they"], "answer": "B", "explanation": "先行詞 Reporters 指人，且關係子句缺主詞，應用 who。"}, {"id": 121, "part": 5, "stem": "The waiter was very ______ since the food wasn't being served in a timely manner.", "choices": ["appropriate", "succinct", "apologetic", "competent"], "answer": "C", "explanation": "因餐點沒有及時送上而感到抱歉，apologetic 意為「表示歉意的」。"}, {"id": 122, "part": 5, "stem": "______ the product warranty has expired, Jassen Manufacturing will not repair the customer's item for free.", "choices": ["As though", "Given that", "Besides", "Nevertheless"], "answer": "B", "explanation": "Given that 表示「鑑於、由於」保固已過期，因此不免費維修。"}, {"id": 123, "part": 5, "stem": "Over the past decade, much ______ has been made in stem cell research, leading to many medical breakthroughs.", "choices": ["approval", "efficiency", "progress", "preference"], "answer": "C", "explanation": "make progress 為固定搭配，表示「取得進展」。"}, {"id": 124, "part": 5, "stem": "Johnny Baker has ______ declined the offer to host the televised Channel 10 Holiday Show.", "choices": ["repeatedly", "repeats", "repetition", "repeated"], "answer": "A", "explanation": "修飾 declined 需副詞 repeatedly，表示「一再地」。"}, {"id": 125, "part": 5, "stem": "Members of the loyalty program may take advantage of discount offers ______ earn points for their purchases.", "choices": ["in case", "so that", "regarding", "as well as"], "answer": "D", "explanation": "as well as 連接兩項活動：利用折扣優惠及累積購物點數。"}, {"id": 126, "part": 5, "stem": "The product must ______ further testing before it can be released to the public.", "choices": ["undergo", "perceive", "discover", "examine"], "answer": "A", "explanation": "undergo further testing 表示「接受進一步測試」。"}, {"id": 127, "part": 5, "stem": "______ all the cities that the pop singer visited during her recent world tour, Seoul was her favorite.", "choices": ["Of", "About", "To", "Upon"], "answer": "A", "explanation": "Of all the cities 表示「在所有城市之中」。"}, {"id": 128, "part": 5, "stem": "The chef often reminds viewers that they can replace hard-to-find items with ______ ingredients they have available.", "choices": ["either", "both", "another", "whichever"], "answer": "D", "explanation": "whichever 可修飾 ingredients，表示「手邊有哪種食材就用哪種」。"}, {"id": 129, "part": 5, "stem": "During his award acceptance speech, Mitchell Cummings thanked his investors for their ______ support.", "choices": ["continuously", "continuity", "continuous", "continue"], "answer": "C", "explanation": "support 是名詞，前面應接形容詞 continuous（持續的）。"}, {"id": 130, "part": 5, "stem": "The resort has had to ______ discount its room rates to attract visitors
