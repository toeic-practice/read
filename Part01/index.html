\n</table>\n<p>Writers' workshops rely upon regular attendance. Attendees who miss more than two workshops without prior notice may be dropped from the register.</p>\n<p>If you are interested in a more casual environment, the Southern Ohio Writers' Guild hosts a weekly coffee hour for writers on Wednesdays from 4 to 5 p.m. at the Blueberry Café and Bakery. No preregistration is required, and all walk-ins are welcome!</p>\n</div></section><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>SCHEDULE</span><small>READING MATERIAL 2 / 2</small></div><div class=\"document-body\"><p><strong>To:</strong> Barbara Espinoza barbespin@capomail.com<br />\n<strong>From:</strong> Lola Nicholson linicholson@sowg.org<br />\n<strong>Date:</strong> November 27<br />\n<strong>Subject:</strong> Re: Workshop</p>\n<p>Hi, Barbara! I have enrolled you in your requested workshop. The first session is scheduled for December 18 at 1 p.m. However, please arrive at least 10 minutes early to receive your workshop materials. Your workshop will be held in the same location at the Kilwin City Library as the literacy workshop you attended last summer.</p>\n<p>Laptop computers are not needed for the workshop, but participants are welcome to bring one. If you are willing to have your work reviewed, we encourage you to bring some samples as well, but please limit these to a few short selections.</p>\n<p>Please let me know if you have any other questions!</p>\n<p>Sincerely,<br />\nLola Nicholson<br />\nOutreach Coordinator<br />\nSouthern Ohio Writers' Guild</p>\n</div></section></div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 131–134 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><blockquote>\n<p><strong>Carmel Tower 住戶通知</strong><br>\n7 月 20 日，Carmel Tower 將會 <strong>131</strong> 大樓走廊的整修工程。這項工程將花費四週完成。在這段期間，施工人員將需要進入大樓。<strong>132</strong> 服務電梯的使用將暫時受到限制。請放心，將會盡力避免對大樓住戶造成 <strong>133</strong>。不過，預期將會有若干噪音與粉塵。<strong>134</strong> 如果您有任何疑慮，請聯絡大樓管理辦公室。</p>\n</blockquote>\n</div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 135–138 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>安裝 Audipro SL-2</strong><br>\n恭喜您購買 Audipro SL-2 音響系統。SL-2 <strong>135</strong> 的設計目的，是在容易安裝的包裝中提供強而有力的家庭音響裝置。<br>\n要開始安裝（的過程），請下載 Audipro app 並登錄您的音響。然後，<strong>136</strong> 同樣在 app 上，將音響連線到您的 Wi-Fi 網路。音響將 <strong>137</strong> 偵測您的網路上相容的媒體播放器或電視。請依照 app 的指示連線每個裝置。SL-2 也可以使用箱內所附的連接線手動連接。<strong>138</strong></p>\n</blockquote>\n</div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 139–142 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p>收件者：Beth Carlin bcarlin@eduswiftsystems.org<br>\n寄件者：John Statler statler@agpfoundation.org<br>\n日期：10 月 22 日<br>\n主旨：AGP 非營利組織獎</p>\n<p>親愛的 Carlin 小姐：</p>\n<p><strong>139</strong> 我很榮幸代表 AGP 通知您，EduSwift Systems 入選了 AGP 年度非營利組織的入圍名單。年終頒獎宴會的邀請函不久將會寄達。我們非常歡迎您的 <strong>140</strong> 出席。這場活動將提供與類似組織成員建立人脈的機會。另外，知名刊物如《The National Herald》每年都會 <strong>141</strong> 各個入圍組織的代表。所以，這場活動將有助於提高媒體關注度。</p>\n<p>請回覆這封電子郵件進行確認。<strong>142</strong> 我們可以為您保留這場活動最多 8 個座位。</p>\n<p>再次恭喜<br>\nJohn Statler<br>\nAGP 基金會</p>\n</blockquote>\n</div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 143–146 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p>（BRANSON）— 本地兒童慈善團體 Riley's Kids <strong>143</strong> 到了 100 萬美元捐款。Riley's Kids 執行長 Amber Thomas 對於上個月初的捐款表達了謝意。<strong>144</strong> 據說這筆捐款來自一位匿名的捐款者。Thomas 小姐表示：「我們以前也有過來自未透露來源的捐款，但從來沒有這麼大的金額。」Thomas 提到，這筆捐款將使 Riley's Kids 能夠繼續擴建市中心的 Branson 青少年中心。<strong>145</strong> 那裡很快將有新的圖書館與籃球場。<strong>146</strong> 現在，這座中心最早可望在明年 4 月開放。</p>\n</blockquote>\n</div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 147–148 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>通勤者請注意</strong><br>\n目前在 Rider Hollow 站，<strong>147</strong> 由於一些掉落到軌道上的樹枝，造成地鐵紫線大幅度的延誤。<br>\n我們的人員正在進行樹枝移除作業。在移除完成之前，北上與南下列車將於 Rider Hollow 與 Clint Village 站間共用單一軌道。<br>\n要得到關於延誤的定期更新訊息，以及其他地鐵資訊，請上 <a href=\"https://www.shelbyvillesubway.com/\">www.shelbyvillesubway.com</a> 或下載我們的列車追蹤應用程式 Shelbyville Ride Tracker。<strong>148</strong></p>\n</blockquote>\n</div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 149–150 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p>Jim Leonard [上午 10:18] 嗨，Tricia。我是 Jim。我剛剛收到你的訊息，說你公寓裡的烤箱不能運作。</p>\n<p>Tricia Madison [上午 10:21] 嗨，Jim。是啊，我昨晚把它調到 350 度要烤餅乾，但 30 分鐘後它還是冷的。它似乎完全沒在運作。</p>\n<p>Jim Leonard [上午 10:22] OK。<strong>149</strong> 你知道母火是否熄滅了？</p>\n<p>Tricia Madison [上午 10:23] <strong>149</strong> 事實上，我沒有查看。我想現在去看，但我正在上班。</p>\n<p>Jim Leonard [上午 10:25] 嗯，<strong>150</strong> 我有每一戶的鑰匙，所以我今天下午可以去查看母火。如果問題比較嚴重的話，我就得打電話找修理的人了。</p>\n<p>Tricia Madison [上午 10:28] 好。我希望可以很快修好。很感謝你快速處理這個問題！</p>\n</blockquote>\n</div></section></div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 151–152 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>Snappeshop</strong><br>\n姓名：Gabe Edwards<br>\n您會向其他人推薦本公司？是／否<br>\n對於下列問題，請從 1 到 5 之間選擇，5 表示最高分。</p>\n<p>您對於我們服務的滿意程度如何？ 1 2 3 4 5<br>\n我們配送服務的效率如何？ 1 2 3 4 5<br>\n您對我們顧客服務的評價如何？ 1 2 3 4 5<br>\n您對我們的商品目錄有什麼想法？<br>\n<strong>151</strong> 和其他網路店家相比，你們沒有種類廣泛的品項。<br>\n您對於我們的顧客服務有什麼想法？<br>\n我打電話給客服的時候，他們一直把我轉到不同的部門。<br>\n<strong>152</strong> 您最喜歡我們服務的哪個方面？<br>\n<strong>152</strong> 我喜歡便宜的運費和配送的速度。</p>\n</blockquote>\n</div></section></div>","153-155":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 153–155 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>HISTORIC LONDON 旅行社：招募導遊</strong><br>\n你認為自己是本地歷史的專家？你是有魅力的演說家？你對這個城市充滿熱情？如果是的話，請考慮應徵 Historic London 旅行社的導遊。我們是這個城市歷史最久，也最受歡迎的旅行社。<strong>153</strong> 我們每年為數千名來訪者籌劃巴士、乘船與徒步旅行。目前，我們正在尋找五名幫助我們帶領徒步旅行的人。</p>\n<p><strong>154</strong> 應徵者必須：</p>\n<ul>\n<li>接受 30 分鐘的測驗，展現對於這座城市歷史的透徹知識</li>\n<li>針對自己選擇的城市地區，發表 10 分鐘的簡報</li>\n<li>通過背景調查</li>\n</ul>\n<p><strong>155</strong> 獲得錄用者每週將工作 25 至 30 小時，包括週末，而夏季期間會有額外的工作時數。標準時薪為 14 英鎊，假日支付時薪 21 英鎊。我們提供正職雇用福利。</p>\n<p>如欲應徵，請上 <a href=\"https://www.historiclondon.co.uk/jobs\">www.historiclondon.co.uk/jobs</a> 並提交履歷以及說明自己為何會是理想人選的求職信。應徵截止期限是 3 月 31 日。</p>\n</blockquote>\n</div></section></div>","156-157":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 156–157 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p>發送者：Swift Link (555-4278)<br>\n送出時間：5 月 18 日，中午 12:10</p>\n<p><strong>156</strong> 這是您的國際旅遊方案已經開通的通知。在 5 月 18 日至 5 月 25 日期間，您將在波蘭接收到行動電話服務。這個服務範圍的費用是每天 10 美元。<strong>157</strong> 注意，如果您超過 5GB 的數據量，將被收取額外的費用，所以我們建議關掉會使用許多數據的應用程式。要轉換到數據量較多的方案，請使用 Swift Link 的行動應用程式。謝謝。</p>\n</blockquote>\n</div></section></div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 158–160 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>Paisley Park 餐廳改變管理層</strong><br>\n數十年來，Paisley Park 餐廳一直是印第安納波利斯最具代表性的餐廳之一。<strong>158-A</strong> 它充滿老式物品、色彩繽紛的內裝讓人想起過去的純真年代。根據《Indianapolis Now》雜誌報導，<strong>158-B</strong> 它也以這座城市最友善的服務人員與最好的蘋果派而自豪。</p>\n<p><strong>160</strong> 現在，創業者暨長久以來的經理 Guy Hubert 決定卸任。— <strong>[1]</strong> — <strong>160</strong> 72 歲的 Hubert 先生準備好要拋開經營餐廳的壓力，並且期盼享受退休生活。他 38 歲的兒子 Gavin 將會接替他。Hubert 先生說：「Gavin 已經在餐廳擔任主廚超過 15 年。」— <strong>[2]</strong> —「我非常相信他知道要怎樣保持這個地方順利營運。」</p>\n<p>年輕的 Hubert 先生表示，他打算完整保留這家餐廳的核心方面。— <strong>[3]</strong> — 不過，他想要在菜單中加入超越傳統美式食物的國際菜色。— <strong>[4]</strong> — <strong>159</strong> 他也以提供特定菜色外送為目標。</p>\n</blockquote>\n</div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 161–164 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>Fumiko Suzuki</strong> [上午 10:51] 我希望得到大家對於員工滿意度的意見。<strong>161</strong> 在我們的員工調查中，有幾位員工抱怨工作太多。這一點所造成的壓力影響了整體生產力。有什麼解決方法呢？</p>\n<p><strong>Jintao Bang</strong> [上午 10:52] <strong>162</strong> 我認為在辦公室關閉後停止發送與工作相關的電子郵件會是個好主意。</p>\n<p><strong>Hendrick Schulz</strong> [上午 10:54] 這應該有幫助。而且，也應該鼓勵更多休息。或許甚至在辦公室提供團隊建立活動。和同事進行社交互動，已經被證實會消除或減少壓力。</p>\n<p><strong>Fumiko Suzuki</strong> [上午 10:56] 這些是很好的建議。我會向董事會提起這些建議，並且爭取改革。我知道其他辦公室也提供類似的福利與便利設施。</p>\n<p><strong>Hendrick Schulz</strong> [上午 10:58] 是的，但是用意並不在於模仿其他公司。這些事情實際上有助於留住並吸引非常有能力的人才。這陣子，維持員工與雇主之間的互惠關係很重要。</p>\n<p><strong>Fumiko Suzuki</strong> [上午 10:59] <strong>163</strong> 我們上一季也有多出的預算。我建議我們投資在其他的改善上。舉例來說，我們可以更新公司餐廳的內裝，或者增加一些新的菜單選擇。</p>\n<p><strong>Jintao Bang</strong> [上午 11:01] 我喜歡改變菜單的主意。這會帶來每個人的正面反應。我可以諮詢我認識的人 Stacy Hill。<strong>164-B</strong> 她以前經營自己的外燴事業。現在，她在寫一本健康食譜的書。</p>\n<p><strong>Fumiko Suzuki</strong> [上午 11:02] 我們所有人都再思考一下這些想法，然後在明天上午開會進一步討論吧。</p>\n</blockquote>\n</div></section></div>","165-168":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 165–168 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p>收件者：Harry Riley h.riley@webmail.com<br>\n寄件者：Brenda O'Connell b.oconnell@secondcity.com<br>\n主旨：資訊<br>\n日期：6 月 18 日</p>\n<p>親愛的 Riley 先生：</p>\n<p>感謝您提交履歷到 Second City Temp 仲介公司。<strong>165</strong> 我相信我們已經找到符合您技能的工作。— <strong>[1]</strong> —</p>\n<p>The Ross and Donahue 法律事務所在尋找協助資料輸入的助理。他們在一週前發布了公告。基本上，您將會更新這家事務所的客戶資料庫。<strong>166-B/168</strong> 根據您的履歷，您在大學時操作過多種資料庫程式，包括 HX2 與 Organizer。— <strong>[2]</strong> — <strong>168</strong> 各方面來看，您具有這份工作所需的合適經驗。</p>\n<p>如果得到您的許可，我會接著將您的資料提交給 Ross and Donahue 法律事務所。— <strong>[3]</strong> — 他們現在正在面試應徵者，並且會在 6 月 28 日前做決定。如果您得到面試的機會，<strong>167</strong> 我強烈建議上這家事務所的網站，閱讀他們的使命，以及他們的專長是哪種法律。— <strong>[4]</strong> — 如果您希望我寄出您的應徵申請，請告訴我。</p>\n<p>誠摯地，<br>\nBrenda O'Connell</p>\n</blockquote>\n</div></section></div>","169-171":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 169–171 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p>收件者：Gelson Cable 公司 customerservice@gelsoncable.com<br>\n寄件者：Candice Novak c.novak@raymailer.com<br>\n日期：2 月 13 日<br>\n主旨：訂閱</p>\n<p>您好：</p>\n<p>我最近為了要跟你們的專員談我有線電視訂閱的問題，在電話線上等了 50 分鐘。這不是第一次發生了，我也受夠了。<strong>169</strong> 我想要立刻取消我的訂閱。</p>\n<p>這些年來，我一直打電話反應我大樓裡的訊號品質，但你們的專員忽視了我的抱怨。而且，<strong>170</strong> 他們並沒有解釋為什麼有些我最愛的有線電視頻道突然從訂閱中被抽走了。當我打電話想要了解這件事的時候，我被告知它們現在只在高級方案中提供。</p>\n<p>當了超過十年的忠實顧客之後，我已經不想再多付一個月的服務費用了。<strong>171</strong> 我也強烈建議你們開始改變對待訂戶的方式。</p>\n<p>誠摯地，<br>\nCandice Novak</p>\n</blockquote>\n</div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 172–175 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>BookED 執行長為公司故事開啟新篇章</strong><br>\n8 月 26 日 — <strong>172</strong> 1 月接任 BookED 執行長的 Lisa Wang，已經為這個受歡迎的線上應用程式帶來重大的改變。目前以訂閱制為基礎的模式，使用者能夠閱讀一些沒有受到大型出版社支援的作者所寫的散文、書籍與其他出版物。這些獨立發行作品由 BookED 的文學專家團隊挑選，並且以個人化推薦的方式呈現給顧客。</p>\n<p><strong>174</strong> 現在，BookED 即將出版自己的原創內容。他們已經直接委託獨立記者與小說家創作將下個月開始發行的內容。這也伴隨著應用程式的點數系統啟用。<strong>175</strong> BookED 設計了讓顧客能藉由在社交媒體平台推薦該公司的新內容賺取點數的系統。點數可以用於閱覽應用程式提供的其他所有內容。BookED 表示將會持續開發使用者賺取點數的新方法。</p>\n<p><strong>175</strong> 業界觀察家表示，這些改變將增加應用程式的顧客群。他們也相信 BookED 可能將明年起開始提供大眾購買該公司股份的機會。</p>\n</blockquote>\n</div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 176–180 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>第一封</strong><br>\n收件者：Sally Hartley sally.hartley@southgeorgiafinancial.com<br>\n寄件者：Raymond Moran raymond@trebeldesigns.com<br>\n主旨：訂單 #7190-1715<br>\n日期：4 月 1 日</p>\n<p>親愛的 Hartley 小姐：</p>\n<p>很高興您選擇 Trebel Designs 為貴公司製作客製化行銷用品。<strong>176/179</strong> 您訂購的 500 枝筆已經在昨天出貨，<strong>176</strong> 應該會在 1 到 2 個工作天內送達。<strong>177</strong> 您可以在我們的網站查看發票。就像上面所提到的，<strong>177</strong> 因為您是第一次訂購的顧客，所以得到了 10% 的折扣。</p>\n<p>連同您訂購的物品，我也附上了我們提供的所有產品的目錄。我們的許多客戶發現，發送 T 恤、帽子、咖啡馬克杯、筆、包包或其他有公司標誌的物品，是行銷自家事業的有效方法。Trebel Designs 可以使用您寄給我們的任何標誌設計，或者 <strong>180</strong> 我們也很樂意用我們其中一種樣版設計來為您創造新的標誌。請注意我們需要一個禮拜來製作設計。</p>\n<p>感謝您的惠顧，我們也期待未來再度與您合作。</p>\n<p>誠摯地，<br>\nRaymond Moran</p>\n<p><strong>第二封</strong><br>\n收件者：Raymond Moran raymond@trebeldesigns.com<br>\n寄件者：Sally Hartley sally.hartley@southgeorgiafinancial.com<br>\n主旨：回覆：訂單 #7190-1715<br>\n日期：4 月 2 日</p>\n<p>親愛的 Moran 先生：</p>\n<p>我想要感謝你們優秀的顧客服務。我們今天早上收到訂購的物品了，而且每個看起來都很棒。事實上，<strong>178</strong> 我們有些人員將參加下個月的就業博覽會以招募一些新員工，所以 <strong>179</strong> 我想要再訂購 300 件同樣的物品。</p>\n<p><strong>180-A/B</strong> 我也想請你們為我們正在策劃的新員工訓練計畫設計標誌。你們能馬上開始進行這件事嗎？我想在我們董事會下次開會時對他們公開（標誌）。我已經在另一封電子郵件裡把細節資訊寄出了。</p>\n<p>再次感謝。</p>\n<p>Sally Hartley<br>\n資深行銷總監<br>\nSouth Georgia Financial</p>\n</blockquote>\n</div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 181–185 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>Bull Run 滑雪度假村體育用品店 設備出租資訊</strong><br>\n除了銷售幾家製造商的裝備以外，Bull Run 滑雪度假村的體育用品店也出租各種裝備，讓您能夠享受在滑雪道上的時光。</p>\n<p>我們有：</p>\n<ul>\n<li>包含滑雪板、滑雪鞋與滑雪杖的滑雪套組，每天 50 元起或每週 150 元起</li>\n<li>滑雪外套與長褲，每天 30 元起或每週 90 元起</li>\n<li><strong>181-B</strong> 頭盔每天 15 元或每週 45 元</li>\n<li>護目鏡每天 10 元或每週 30 元</li>\n<li>手套每天 5 元或每週 15 元</li>\n</ul>\n<p>我們提供兒童與成人的各種尺寸。<strong>182</strong> 櫃台提供幫助您依照身高與體重來判定正確尺寸的尺寸表。所有出租費用都必須立即付款。<strong>185</strong> Bull Run 滑雪度假村的住宿客享有 15% 的折扣。</p>\n<p><strong>181-B</strong> 為了安全，所有滑雪者在滑雪道上都必須佩戴頭盔。</p>\n<p><strong>Bull Run 滑雪度假村體育用品店 設備出租表</strong><br>\n姓名：Marcus Carver<br>\n住址：945 Elgin 大街，溫尼伯，MB R3E 1B3，加拿大<br>\n電話號碼：555-9708<br>\n日期：2 月 15 日<br>\n<strong>185</strong> 出租期間：1 天</p>\n<p>信用卡號碼：********************<br>\n請款地址：同上</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>品項</strong></th>\n<th style=\"text-align:left\"><strong>數量</strong></th>\n<th style=\"text-align:left\"><strong>單價</strong></th>\n<th style=\"text-align:left\"><strong>費用</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><strong>184</strong> 滑雪套組</td>\n<td style=\"text-align:left\"><strong>184</strong> 2</td>\n<td style=\"text-align:left\">$50</td>\n<td style=\"text-align:left\">$100</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>184</strong> 頭盔</td>\n<td style=\"text-align:left\"><strong>184</strong> 2</td>\n<td style=\"text-align:left\">$15</td>\n<td style=\"text-align:left\">$30</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>184</strong> 護目鏡</td>\n<td style=\"text-align:left\"><strong>184</strong> 2</td>\n<td style=\"text-align:left\">$10</td>\n<td style=\"text-align:left\">$20</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>184</strong> 手套</td>\n<td style=\"text-align:left\"><strong>184</strong> 2</td>\n<td style=\"text-align:left\">$5</td>\n<td style=\"text-align:left\">$10</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>小計</strong></td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"><strong>$160</strong></td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>185</strong> 15% 折扣</td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"><strong>-$24</strong></td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>應付總金額</strong></td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"><strong>$136</strong></td>\n</tr>\n</tbody>\n</table>\n<p>請注意：為期一天的出租，必須在出租當日使用。出租不退費。</p>\n</blockquote>\n</div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 186–190 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>ROSENSTEIN 不動產</strong><br>\n首頁 | 關於我們 | 仲介 | 聯絡</p>\n<p><strong>186-C</strong> Rosenstein 不動產是芝加哥地區最受到信賴的不動產仲介業者之一。雖然我們能幫助您尋找本市與鄰近郊區任何地方的不動產，但 <strong>186-C</strong> 我們的專長是在本市北部與西北部尋找高級住宅。</p>\n<p><strong>187</strong> 當您利用我們尋找不動產時，您不僅可以得到不動產的徹底導覽，也會接收到能幫助您做出最佳決定的全面資訊。我們提供對於不動產的便利設施的詳細報告，以及當地歷史的概要。</p>\n<p>這裡可以取得我們代理的所有不動產列表。<strong>188-A/B/C/D</strong> 芝加哥市內的不動產由不動產仲介 George Rosenstein 與 Mary Kowalski 代理。周圍地區的不動產由 Karl Mitchell 代理。</p>\n<p><strong>1 月 1 日起由 Rosenstein 不動產代理的不動產</strong></p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>地址</strong></th>\n<th style=\"text-align:left\"><strong>價格</strong></th>\n<th style=\"text-align:left\"><strong>臥室</strong></th>\n<th style=\"text-align:left\"><strong>浴室</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><strong>188-A</strong> Boston 街 980 號，芝加哥，伊利諾州</td>\n<td style=\"text-align:left\">$380,000</td>\n<td style=\"text-align:left\">3</td>\n<td style=\"text-align:left\">2</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>188-B</strong> Michigan 街 118 號，芝加哥，伊利諾州</td>\n<td style=\"text-align:left\">$410,100</td>\n<td style=\"text-align:left\">4</td>\n<td style=\"text-align:left\">3</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>188-C</strong> Lipton 街 1001 號，埃文斯頓，伊利諾州</td>\n<td style=\"text-align:left\">$360,500</td>\n<td style=\"text-align:left\">2</td>\n<td style=\"text-align:left\">2</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>188-D</strong> Irving 街 280 號，芝加哥，伊利諾州</td>\n<td style=\"text-align:left\">$550,400</td>\n<td style=\"text-align:left\">4</td>\n<td style=\"text-align:left\">3</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Sherman 路 190 號，芝加哥，伊利諾州</td>\n<td style=\"text-align:left\">$290,900</td>\n<td style=\"text-align:left\">2</td>\n<td style=\"text-align:left\">1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>190</strong> 請撥打 555-3928 安排帶看。我們平日上午 9 點到下午 6 點提供服務。</p>\n<p><strong>電子郵件</strong><br>\n收件者：Rosenstein Real Estate inquiries@rosenstein.com<br>\n寄件者：Anne Dahlberg anned98@mittermail.com<br>\n主旨：公寓<br>\n日期：1 月 3 日</p>\n<p>您好：</p>\n<p><strong>189</strong> 我和丈夫最近接下了芝加哥 Northbrook 大學的教職。我們打算下個月和兒子一起搬到這個城市。我們已經瀏覽不動產案件一陣子了。理想上，我們想要價格不到 40 萬、有 2 間臥室和 2 間浴室的公寓。不過，我們對於這些需求條件有些彈性。Sherman 路 190 號的公寓很吸引人。我們喜歡它離大學的距離。那間公寓還在出售中嗎？如果是的話，<strong>190</strong> 我們想要安排帶看，最好是這個週末，那時候我和丈夫會在市中心。請通知我。</p>\n<p>祝好，<br>\nAnne Dahlberg</p>\n</blockquote>\n</div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 191–195 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>通知</strong><br>\n<strong>191</strong> Crystal 公寓將從 1 月 6 日到 10 日檢查所有單位。設施管理者將陪同 FailSafe Home Inspections 公司的技術人員巡視建築物。每項檢查將花費約 60 分鐘。</p>\n<p>檢查將包含以下項目的檢視：</p>\n<ul>\n<li>蟲害</li>\n<li>水管問題</li>\n<li>瓦斯外漏</li>\n</ul>\n<p><strong>191</strong> 您將在信箱收到額外資訊，讓您知道您的檢查安排在什麼時候。在檢查當天，您也會收到簡訊提醒，通知您技術人員什麼時候進入及離開您的單位。</p>\n<p>單位 1 至 20 的住戶將在 1 月 11 日收到檢查報告。<br>\n<strong>193</strong> 單位 21 至 40 的住戶將在 1 月 15 日收到檢查報告。</p>\n<p><strong>信件</strong><br>\n<strong>193</strong> Alyssa Matthews 小姐<br>\n<strong>193/194</strong> 單位 38</p>\n<p>親愛的 Matthews 小姐：</p>\n<p><strong>192/194</strong> 您的檢查安排在 1 月 10 日上午 10 點。設施管理者將為技術人員打開您單位的門鎖，並且在技術人員離開時重新鎖上。</p>\n<p>我們建議您在檢查時離開您的單位，讓技術人員能夠自由進行工作。如果您在預定的時間必須在家，請儘快通知設施管理者。</p>\n<p>也請告知設施管理者您的任何問題。</p>\n<p>誠摯地，<br>\n管理室</p>\n<p><strong>Crystal 公寓檢查報告</strong><br>\n以下是您的公寓單位最近檢查的結果。請仔細檢視這份報告。</p>\n<p><strong>194</strong> 檢查日期：1 月 10 日<br>\n<strong>194</strong> 抵達時間：上午 10:30<br>\n<strong>194</strong> 單位：38<br>\n<strong>194</strong> 技術人員：Allen Scott</p>\n<p>檢查標示說明：<br>\nA – 沒有發現問題<br>\nB – 發現輕微問題<br>\nC – 發現重大問題</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>項目</strong></th>\n<th style=\"text-align:left\"><strong>等級</strong></th>\n<th style=\"text-align:left\"><strong>問題</strong></th>\n<th style=\"text-align:left\"><strong>建議措施</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">窗戶</td>\n<td style=\"text-align:left\">A</td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">牆壁／天花板</td>\n<td style=\"text-align:left\">B</td>\n<td style=\"text-align:left\">餐廳天花板有細微龜裂</td>\n<td style=\"text-align:left\">不需採取措施</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">警報系統</td>\n<td style=\"text-align:left\">A</td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">煙霧偵測器</td>\n<td style=\"text-align:left\">B</td>\n<td style=\"text-align:left\">三台設備已更換電池</td>\n<td style=\"text-align:left\">不需採取進一步措施</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">一氧化碳偵測器</td>\n<td style=\"text-align:left\">A</td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>195</strong> 水管</td>\n<td style=\"text-align:left\">B</td>\n<td style=\"text-align:left\">廚房水槽下的水管有輕微漏水</td>\n<td style=\"text-align:left\"><strong>195</strong> 聯絡設施管理者安排修理</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">瓦斯</td>\n<td style=\"text-align:left\">A</td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">電力</td>\n<td style=\"text-align:left\">A</td>\n<td style=\"text-align:left\"></td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">昆蟲</td>\n<td style=\"text-align:left\">B</td>\n<td style=\"text-align:left\">餐廳有幾隻螞蟻</td>\n<td style=\"text-align:left\">聯絡設施管理者安排驅蟲業者</td>\n</tr>\n</tbody>\n</table>\n<p>意見：單位 38 大致上狀況良好。不過，住戶應聯絡設施管理者安排廚房漏水水管的修繕。單位 38 也應該接受驅蟲服務，預防未來的昆蟲問題。</p>\n</blockquote>\n</div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">中文翻譯</span><span>Questions 196–200 · 繁體中文</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation\"><div class=\"doc-ribbon\"><span>中文閱讀資料</span><small>TRANSLATED READING MATERIAL</small></div><div class=\"document-body\"><ul>\n<li></li>\n</ul>\n<blockquote>\n<p><strong>作家工作坊 11 月 17 日 Kilwin 市立圖書館</strong><br>\n您總是夢想出版自己的小說或詩集？您想知道自己是否具備成為作家的條件？是時候夢想成真了！</p>\n<p><strong>198</strong> 加入我們的作家工作坊系列，由南俄亥俄州作家協會贊助。</p>\n<p><strong>198</strong> 工作坊於 Kilwin 市立圖書館舉行。現場將供應由 Blueberry 烘焙坊與咖啡店提供的輕食茶點。<strong>198</strong> 所有由南俄亥俄州作家協會推出的工作坊，都免費供參加者利用。不過，空間有限，所以今天就報名吧！</p>\n<p>請詢問我們的圖書館員以獲得更多資訊，或者寄信到 linicholson@sowg.org 聯絡南俄亥俄州作家協會的 Lola Nicholson。</p>\n<p><strong>Kilwin 市立圖書館作家工作坊時間表</strong></p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>工作坊名稱</strong></th>\n<th style=\"text-align:left\"><strong>日期</strong></th>\n<th style=\"text-align:left\"><strong>時間</strong></th>\n<th style=\"text-align:left\"><strong>地點</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">偉大美國小說</td>\n<td style=\"text-align:left\">12 月 1 日至 2 月 13 日</td>\n<td style=\"text-align:left\">每週一、晚上 6 到 8 點</td>\n<td style=\"text-align:left\">會議室 A</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>199</strong> 簡化十四行詩</td>\n<td style=\"text-align:left\"><strong>199</strong> 12 月 18 日至 2 月 13 日</td>\n<td style=\"text-align:left\"><strong>199</strong> 每週四、下午 1 到 2 點</td>\n<td style=\"text-align:left\">會議室 A</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">英文詩</td>\n<td style=\"text-align:left\">12 月 19 日至 2 月 14 日</td>\n<td style=\"text-align:left\">每週五、下午 3 到 4 點</td>\n<td style=\"text-align:left\">主講堂</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">青少年散文寫作</td>\n<td style=\"text-align:left\">12 月 20 日至 2 月 15 日</td>\n<td style=\"text-align:left\">每週六、下午 3 到 4 點</td>\n<td style=\"text-align:left\">兒童室</td>\n</tr>\n</tbody>\n</table>\n<p>作家工作坊需要規律出席。<strong>196</strong> 沒有事先通知而缺席工作坊超過兩次的參加者可能被除名。</p>\n<p><strong>196</strong> 如果您對於比較不拘禮節的環境有興趣，南俄亥俄州作家協會每週三下午 4 點至 5 點在 Blueberry 咖啡店與烘焙坊為作家舉辦每週咖啡時間。<strong>196</strong> 不需要事先報名，也歡迎所有無預約的參加者！</p>\n<p><strong>電子郵件</strong><br>\n收件者：Barbara Espinoza barbespin@capomail.com<br>\n寄件者：Lola Nicholson linicholson@sowg.org<br>\n日期：11 月 27 日<br>\n主旨：回覆：工作坊</p>\n<p>嗨，Barbara！<strong>197/199</strong> 我已經為您登記參加您所要求的工作坊。<strong>199</strong> 第一場預定在 12 月 18 日下午 1 點。不過，請至少提前 10 分鐘到場領取工作坊資料。<strong>198</strong> 您的工作坊將和您去年夏天參加過的素養工作坊一樣，在 Kilwin 市立圖書館的相同場所舉行。</p>\n<p>工作坊不需要使用筆記型電腦，但也歡迎參加者攜帶。<strong>200</strong> 如果您願意自己的作品接受審閱，我們也鼓勵您攜帶一些供試讀的文字，但請限制在幾篇挑選出來的簡短作品。</p>\n<p>如果還有其他問題，請告訴我！</p>\n<p>誠摯地，<br>\nLola Nicholson<br>\n推廣活動協調員<br>\n<strong>198</strong> 南俄亥俄州作家協會</p>\n</blockquote>\n</div></section></div>"};const DETAILED_EXPLANATIONS={"101":{"type":"副詞位置","translation":"CEO 造訪柏林期間，將與客戶短會面。","reason":"空格在助動詞（will）與原形動詞（meet）之間，因此答案是能修飾動詞的副詞（D）briefly（短暫地）。形容詞（A）、名詞（B）、形容詞最高級（C）不能修飾動詞。\n讀 client n. 客戶 briefing n. 簡報","paraphrase":"","vocab":""},"102":{"type":"名詞位置","translation":"Lee Valley 消防署展開調查來判定引起森林火災的原因。","reason":"空格是及物動詞（launched）的受詞，而不定冠詞（an）之後應該接名詞，所以答案是名詞（A）investigation（調查）。另外，請把 launch an investigation（展開調查）當成慣用表達方式記起來。形容詞（B）和（D）、動詞（C）不能用在名詞的位置。\n讀 investigatory adj. 調查的 investigate v. 調查 investigative adj. 調查的，研究性的","paraphrase":"","vocab":""},"103":{"type":"動詞位置","translation":"請為健行準備一些零食，因為走完大約會花4小時。","reason":"句意是「為健行準備一些零食」，所以答案是動詞（B）pack（裝進行李，表示準備的意思）。(A) promote 表示「宣傳，促進」。(C) mark 表示「做記號」。(D) balance 表示「平衡」。\n讀 hike n. 登山健行 complete v. 完成","paraphrase":"","vocab":""},"104":{"type":"對等連接句型","translation":"Ewing 小姐將會收集上個月的調查結果，然後在下週製作概要。","reason":"因為有對等連接詞（and），所以能得知和動詞（produce）並列的空格內容也是動詞。因為後面的動詞（produce）是原形動詞，所以答案是助動詞（will）後接原形動詞（collect）的（D）will collect。過去式動詞（A）、動名詞或現在分詞（B）和過去完成式動詞（C）不能和原形動詞並列。\n讀 result n. 結果 survey n.（意見）調查 summary n. 概要，摘要 collect v. 收集","paraphrase":"","vocab":""},"105":{"type":"介系詞選","translation":"Charles Hayes 是英格蘭的頂尖棋手之一，他曾經打敗許多過去的冠軍。","reason":"答案 (C)。句意是「Charles Hayes 是英格蘭的頂尖棋手之一」，所以答案是介系詞 (C) among（可表示「在…的其中之一」）。(A) around 表示位置「在…周圍」。(B) between「在…之間」表示兩個對象之間的關係、位置或時間，通常以 between A and B（A 和 B 之間）的形式使用。(D) inside 表示位置「在…裡面」。","paraphrase":"","vocab":"詞 defeat v. 打敗 former adj. 以前的，前任的 champion n. 冠軍"},"106":{"type":"不定代名詞","translation":"員工在音樂廳發現的任何東西，都只會在失物招領中心保留一週。","reason":"答案 (C)。句意是「在音樂廳發現的任何東西，只會在失物招領中心保留一週」，所以答案是不定代名詞 (C) Anything（任何東西）。代名詞 (A)、(B)、(D) 分別表示「（許多東西中的）少數／幾個／大部分」，不符合句子要表達的意思。","paraphrase":"","vocab":"詞 lost and found phr. 失物招領處"},"107":{"type":"【補語位置】現在分詞 vs. 過去分詞","translation":"Robinson 先生滿足公司的所有要求條件，所以有資格應徵正職職位。","reason":"答案 (D)。空格是 be 動詞（is）的補語位置，所以可以出現在補語位置、扮演形容詞角色的 (B) 和 (D) 是可能的答案。句意是「Robinson 先生有資格應徵正職職位」，而動詞 qualify（使…有資格）會以過去分詞的形式表示某人「有資格」，所以過去分詞 (D) qualified 是正確答案。如果用現在分詞 (B) 的話，則會變成「Robinson 先生使人有資格」的意思。動詞 (A) 和 (C) 不能用在補語的位置。","paraphrase":"","vocab":"詞 fulfill v. 滿足，實現 requirement n. 要求條件 permanent position phr. 正職職位 qualify v. 使…有資格"},"108":{"type":"形容詞","translation":"舞台劇《Middle of Summer》有令人難忘的結局，它意料之外的轉折讓觀眾感到震驚。","reason":"答案 (B)。句意是「令人難忘的結局，有讓觀眾震驚的意外轉折」，所以答案是 (B) memorable（難忘的）。(A) conventional 表示「慣常的」。(C) marginal 表示「微小的，不重要的」。(D) prosperous 表示「繁榮的，興旺的」。","paraphrase":"","vocab":"詞 unexpected adj. 意料之外的 twist n.（故事、事件等）意料之外的轉折"},"109":{"type":"副詞子句連接詞","translation":"雖然 Mactran 公司去年建立了全面性的回收計畫，但許多員工並沒有好好遵守指導原則。","reason":"答案 (A)。每個選項都可以連接子句（\\~ last year）和子句（many \\~ properly）。句意是「雖然 Mactran 公司去年建立了全面性的回收計畫，但許多員工並沒有好好遵守指導原則」，所以表讓步的副詞子句連接詞 (A) Although（雖然…）是正確答案。如果用其他副詞子句連接詞 (B) Until（到…為止）、(C) If（如果…）、(D) Before（在…之前），則會變成「直到 Mactran 公司去年建立了全面性的回收計畫為止／如果 Mactran 公司去年建立了全面性的回收計畫／在 Mactran 公司去年建立全面性的回收計畫之前」等錯的意思。","paraphrase":"","vocab":"詞彙 establish v. 建立，成立 comprehensive adj. 全面性的 recycling n. 資源回收 guideline n. 指導原則 properly adv. 恰當地"},"110":{"type":"【可以接在 be 動詞後面的成分】進行式（be + -ing）","translation":"新年遊行的路線已經大概定好，但主辦人員還在對細節做最後確認。","reason":"答案 (C)。空格接在 be 動詞（are）後面，所以能構成進行式的 -ing 形 (C)、能構成被動態的 p.p. 形 (D) 是可能的答案。因為空格後面有受詞（the details），所以能和 be 動詞構成進行式的 -ing 形 (C) finalizing 是正確答案。如果用 p.p. 形 (D) 和 be 動詞（are）構成被動態的話，後面就不能接受詞了。動詞原形 (A) 和第三人稱單數動詞 (B) 不能接在 be 動詞後面。","paraphrase":"","vocab":"詞彙 route n. 路線 outline v. 畫…的（大概）輪廓 organizer n. 主辦者，組織者 detail n. 細節 finalize v. 最後確定"},"111":{"type":"形容詞位置","translation":"在 Wilkinsburg 市議會的會議上，全體大致同意房地產稅應該提高。","reason":"答案 (D)。只有形容詞可以修飾空格後面的名詞（consensus），所以答案是形容詞 (D) general（大致的）。名詞 (A)、副詞 (B)、動詞 (C) 不能修飾名詞。","paraphrase":"","vocab":"詞彙 city council phr. 市議會 consensus n. 一致的意思，共識 property tax phr. 房地產稅 generalization n. 概括，歸納陳述 generalize v. 概括，歸納"},"112":{"type":"【動詞位置】現在進行式","translation":"為了滿足顧客需求，CX 公司的工廠正在製造一百萬台新的遊戲機。","reason":"答案 (D)。句中（A million \\~ demand）缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。因為句子裡有表示現在時間的詞彙（right now），所以答案是表示現在進行中的現在進行式 (D) are being manufactured。過去式助動詞和完成式組成的 (B) would have manufactured 會出現在與過去事實相反假設句的主要子句。過去完成式 (C) had been manufactured 是表達過去特定時間點之前發生的事。to 不定詞 (A) to manufacture 不能用在需要動詞的位置。","paraphrase":"","vocab":"詞彙 video game console phr. 電玩遊戲機 demand n. 需求，要求 manufacture v. 製造"},"113":{"type":"動詞慣用表達方式","translation":"任何有相機的人，都有資格參加雪梨 48 小時攝影比賽。","reason":"答案 (C)。句意是「任何有相機的人，都有資格參加比賽」，所以答案是可以和空格後的介系詞 in 構成 participate in，表示「參加…」的 (C) participate。(A) result 表示「結果…」(B) obtain 表示「得到，獲得」(D) choose 表示「選擇」。","paraphrase":"","vocab":"詞 be eligible to do phr. 有資格 photography n. 攝影，照相 competition n. 比賽"},"114":{"type":"【引導修飾性語句的成分】介系詞選","translation":"根據天氣預報，Wilshire 鎮明天預計會有最高 8 英寸的降雪。","reason":"答案 (B)。這個句子已經有具備主詞（the town of Wilshire）和動詞（can expect）的完整子句，所以 weather forecasts 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (B)、(C)、(D) 是可能的答案。句意是「根據天氣預報，Wilshire 鎮明天預計會有最高 8 英寸的降雪」，所以介系詞 (B) According to（根據…）是正確答案。(C) Other than 表示「在…以外」，(D) Along with 表示「和…一起」。副詞子句連接詞 (A) Provided that（只要…就（以…為條件））引導的是修飾子句，而不是片語。","paraphrase":"","vocab":"詞 weather forecast phr. 天氣預報 up to phr. 最高…"},"115":{"type":"動詞","translation":"員工將在本週末的食品博覽會上台示範操作 Harmon 公司最新的廚房家電。","reason":"答案 (A)。句意是「員工將會上台示範操作 Harmon 公司最新的廚房家電」，所以答案是動詞 (A) demonstrate（示範操作）。(B) implement 表示「實行」(C) conceive 表示「構想，想像」(D) express 表示「表達」。","paraphrase":"","vocab":"詞 kitchen appliance phr. 廚房家電"},"116":{"type":"形容詞","translation":"因為他廣泛的經驗，所以董事們認為 Peters 先生是 CEO 職位的理想人選。","reason":"答案 (C)。句意是「因為他廣泛的經驗，所以董事們認為 Peters 先生是 CEO 職位的理想人選」，所以答案是 (C) ideal（理想的）。(A) inferior 表示「比較差的」。(B) factual 表示「（根據）事實的」，應該用來形容事物才對。(D) polite 表示「禮貌的」。","paraphrase":"","vocab":"詞 extensive adj. 廣泛的 experience n. 經驗 candidate n. 人選，候選者"},"117":{"type":"介系詞選","translation":"所有對於 Florian 大學企業管理碩士學程的申請至 1 月 1 日截止。","reason":"答案 (C)。句意是「申請至 1 月 1 日截止」，所以答案是表示時間點的介系詞 (C) by（到…的時候，早於…）。(A) through 表示期間「在…的整個期間」。(B) with 表示「和…一起」。(D) into 表示方向「往…裡面」。","paraphrase":"","vocab":"詞 application n. 申請（書） due adj. 到期的"},"118":{"type":"副詞位置","translation":"這家公司激進地從舊的商業模式轉變為完全數位化的模式。","reason":"答案 (B)。只有副詞能修飾空格前面的動詞（shifted），所以答案是副詞 (B) radically（激進地）。現在分詞 (A)、動詞 (C)、名詞或形容詞 (D) 不能修飾動詞。","paraphrase":"","vocab":"詞 shift v. 轉變 radicalize v. 使…變得激進、極端 radical n. 激進分子 adj. 激進的"},"119":{"type":"【名詞位置】人物名詞 vs. 事物／抽象名詞","translation":"Pryanka Reddy 是頗具盛名的 Clinton 電影獎史上最年輕的獲獎導演。","reason":"只有名詞可以被空格前面的形容詞最高級（youngest）修飾，所以名詞 (A) 和 (D) 是可能的答案。句意是「Pryanka Reddy 是 Clinton 電影獎最年輕的獲獎導演」，所以答案是人物名詞 (A) director（導演）。如果使用抽象名詞 (D) direction（執導「行為」），就會變成錯誤的意思「Pryanka Reddy 是 Clinton 電影獎最年輕的獲獎執導」了。副詞 (B)、動詞或過去分詞 (C) 不能放在名詞的位置。","paraphrase":"","vocab":"詞 prestigious adj. 有聲望的"},"120":{"type":"【引導修飾性語句的成分】關係代名詞的選擇與格","translation":"未攜帶正式媒體證的記者，將不被允許進入會場。","reason":"這個句子已經有具備主詞（Reporters）和動詞（will not be allowed）的完整子句，所以 \\~ badge 是修飾性的語句。修飾部分有動詞（don't carry），但少了主詞，所以主格關係代名詞 (B) 和 (C) 是可能的答案。先行詞（Reporters）是人而非事物，所以答案是人物關係代名詞 (B) who。關係代名詞 (C) which 則是用在先行詞為事物的時候。名詞子句連接詞 (A) what 本身就是可以主詞或受詞，而 what 引導的子句也是句子裡的主詞或受詞，而非修飾語。主格人稱代名詞 (D) they 不能引導修飾性的語句。","paraphrase":"","vocab":"詞 reporter n. 記者 official adj. 正式的 press n. 報刊，新聞媒體 badge n. 識別證 venue n. 地點，場地"},"121":{"type":"形容詞","translation":"服務生因為食物沒有準時送上而非常抱歉。","reason":"答案 (C)。句意是「服務生因為食物沒有準時送上而非常抱歉」，所以答案是形容詞 (C) apologetic（表示歉意的）。(A) appropriate 表示「適當的，合適的」，(B) succinct 表示「簡明扼要的，簡潔的」，(D) competent 表示「有能力的，能幹的」。","paraphrase":"","vocab":""},"122":{"type":"（引導修飾性語句的成分）副詞子句連接詞理由","translation":"由於產品保固已經到期，Jassen 製造公司將不會免費修理那位顧客的產品。","reason":"答案 (B)。這個句子已經有具備主詞（Jassen Manufacturing）和動詞（will not repair）、受詞（the customer's item）的完整子句，所以 \\~ expired 是修飾性的語句。修飾部分有動詞（has expired），所以能引導修飾子句的副詞子句連接詞 (A) 和 (B) 是可能的答案。句意是「由於產品保固已經到期，Jassen 製造公司將不會免費修理那位顧客的產品」，所以答案是表示理由的副詞子句連接詞 (B) Given that（考慮到…）。(A) As though（彷彿…）會使句子變成「彷彿產品保固已經到期一般，Jassen 製造公司將不會免費修理那位顧客的產品」的錯誤意義。連接副詞 (C) Besides（而且）和 (D) Nevertheless（儘管如此）不能引導修飾性語句。","paraphrase":"","vocab":"詞 warranty n. 保證書，保固 expire v. 到期 repair v. 修理 for free phr. 免費地"},"123":{"type":"名詞","translation":"過去十年間，幹細胞研究有許多進展，促成許多醫學上的突破。","reason":"答案 (C)。句意是「幹細胞研究有許多進展，促成許多醫學上的突破」，所以答案是名詞 (C) progress（進展）。(A) approval 表示「批准，贊同」，(B) efficiency 表示「效率」，(D) preference 表示「偏好」。","paraphrase":"","vocab":"詞 decade n. 十年 stem cell phr. 幹細胞 breakthrough n. 突破"},"124":{"type":"副詞位置","translation":"Johnny Baker 再三拒絕了主持電視節目《Channel 10 Holiday Show》的工作邀約。","reason":"答案 (A)。可以修飾動詞（has declined）的是副詞，所以答案是副詞 (A) repeatedly（反覆地，一再）。動詞或名詞 (B)、名詞 (C)、動詞或過去分詞 (D) 不能修飾動詞。","paraphrase":"","vocab":"詞 decline v. 拒絕 offer n. 提議 v. 提議 host v. 主持 televise v. 透過電視播送 repetition n. 重複，反覆"},"125":{"type":"相關連接詞","translation":"顧客忠誠計畫的會員除了賺取購物的點數以外，也可以利用折扣優惠。","reason":"答案 (D)。可以將助動詞（may）後面的動詞原形（take advantage of）和動詞原形（earn）對等連接，而且能表示「會員除了獲得購物的點數以外，也可以利用折扣優惠」的是 B as well as A（除了 A 還有 B），所以相關連接詞 (D) as well as 是正確答案。副詞子句連接詞 (A) 和 (B) 後面要接有主詞和動詞的子句，但空格後面缺少主詞，所以這兩個選項不會是正確答案。介系詞 (C) 後面要接名詞。","paraphrase":"","vocab":"詞 loyalty program phr. 顧客忠誠計畫（變動顧客持續消費的制度） take advantage of phr. 利用… earn v. 賺取"},"126":{"type":"動詞","translation":"產品在發表之前必須接受進一步的測試。","reason":"答案 (A)。句意是「產品在發表之前必須接受進一步的測試」，所以動詞 (A) undergo（接受，經歷）是正確答案。(B) perceive 表示「感知，察覺」，(C) discover 表示「發現」，(D) examine 表示「檢查」。","paraphrase":"","vocab":"詞 further adj. 進一步的 release v. 發行，發表 public n. 大眾，公眾"},"127":{"type":"介系詞選","translation":"在流行歌手最近世界巡迴造訪的所有城市中，首爾是她的最愛。","reason":"答案 (A)。句意是「在造訪的所有城市中，首爾是她的最愛」，所以介系詞 (A) Of（…之中的）是正確答案。(B) About 表示「關於…」，(C) To 表示方向「往…」，(D) Upon 表示位置或時間點「在…之上，…之後」。","paraphrase":"","vocab":"詞 favorite n. 最愛的事物 adj. 最愛的"},"128":{"type":"名詞子句連接詞複合關係形容詞 whichever","translation":"主廚經常提醒觀眾，他們可以用手邊現有的任何食材來取代很難找到的食材。","reason":"答案 (D)。介系詞（with）後面接名詞子句（\\~ available）作為受詞，能夠引導這個名詞子句，同時修飾空格後名詞（ingredients）的複合關係形容詞 (D) whichever（無論哪個…）是正確答案。限定詞 (A) either 表示「兩者中的任何一個…」，後面要接單數名詞，也會和 or（或者）一起使用，形成 either A or B（A 或 B 中任何一個）的形態。(B) both（兩者都）和 (C) another（另外一個）不能引導名詞子句，而且 (C) 後面必須接單數名詞，所以不對。","paraphrase":"","vocab":"詞 chef n. 廚師 remind v. 提醒 replace v. 取代 hard-to-find adj. 很難找到的 ingredient n. 材料"},"129":{"type":"形容詞位置","translation":"Mitchell Cummings 在得獎感言中感謝投資者持續的支持。","reason":"答案 (C)。只有形容詞可以修飾空格後面的名詞（support），所以答案是形容詞 (C) continuous（持續的）。副詞 (A)、名詞 (B)、動詞 (D) 不能修飾名詞。","paraphrase":"","vocab":"詞 award acceptance speech phr. 得獎感言 investor n. 投資者 continuity n. 持續性"},"130":{"type":"副詞","translation":"這家度假村在去年不得不將房價大幅打折來吸引遊客。","reason":"答案 (B)。句意是「為了吸引遊客而不得不將房價大幅打折」，所以副詞 (B) heavily（大量地，大幅地）是正確答案。(A) neatly 表示「整齊地」，(C) densely 表示「密集地」，(D) evenly 表示「平均地」。","paraphrase":"","vocab":"詞 attract v. 吸引 visitor n. 參觀者"},"131":{"type":"動詞詞彙 掌握上下文","translation":"","reason":"句意是「將會 ______ 大樓的走廊整修工程」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到工程將花費 4 週完成，所以要表達的應該是即將開始進行工程，答案是 (B) initiate（開始）。(A) interrupt 表示「打斷」，(C) postpone 表示「延期」，(D) conclude 表示「完成」。","paraphrase":"","vocab":""},"135":{"type":"主動態與被動態的區分","translation":"恭喜您購買 Audipro SL-2 音響系統。SL-2 的設計目的，是在容易安裝的包裝中提供強而有力的家庭音響裝置。","reason":"答案 (C)。design（設計）是及物動詞，但空格後沒有受詞，所以被動態 (C) is designed 是正確答案，而主動態 (A)、(B)、(D) 不對。","paraphrase":"","vocab":""},"136":{"type":"選出適當的句子","translation":"要開始安裝（的過程），請下載 Audipro app 登錄您的音響。然後，同樣在 app 上，將音響連線到您的 Wi-Fi 網路。","reason":"答案 (A)。這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 To begin the setup process, download the Audipro app and register your speaker. 提到要下載 Audipro app 來登錄音響，所以空格的內容應該和在 app 中登錄音響有關，表示登錄方法的 (A) This can be done by entering the product number on the box 是正確答案。","paraphrase":"","vocab":"詞彙 reset v. 重置（將運作不正常的裝置強制恢復初始狀態） additional adj. 額外的 modification n. 修改 component n. 部件，元件 separately adv. 分別地"},"137":{"type":"副詞詞彙 掌握上下文","translation":"音響將自動偵測您的網路上相容的媒體播放器或電視。","reason":"答案 (D)。句意是「音響將 ______ 偵測網路上相容的媒體播放器或電視」，(B)、(C)、(D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到用 app 將音響連線到 Wi-Fi 網路，下一句提到依照 app 的指示連線裝置，所以音響連上網路後，應該會「自動」偵測網路上的媒體播放器與電視等裝置，以便隨後逐一連線，(D) automatically（自動地）是正確答案。(A) hardly 表示「幾乎不」，(B) randomly 表示「隨機地」，(C) occasionally 表示「偶爾」。","paraphrase":"","vocab":""},"138":{"type":"名詞詞彙 掌握上下文","translation":"請依照 app 的指示連線每個裝置。SL-2 也可以使用箱內所附的連接線手動連接。","reason":"文章前一句說音響會偵測網路上的「compatible media players or televisions」，下一句要求使用者透過 App 連線到每個裝置；media players 與 televisions 都屬於 devices，因此 (B) device 是正確答案。其他選項 outlet（插座）、video（影片）、account（帳戶）都不是此處要逐一連線的網路裝置。","paraphrase":"","vocab":""},"139":{"type":"與動詞、形容詞、名詞連用的介系詞慣用表達方式","translation":"我很榮幸代表 AGP 通知您，EduSwift Systems 入選了 AGP 年度非營利組織的入圍名單。","reason":"答案 (D)。句意是「很榮幸代表 AGP 通知您，EduSwift Systems 入選了 AGP 年度非營利組織的入圍名單」，所以介系詞的慣用表達方式 (D) On behalf of（代表…）是正確答案。(A) Including 表示「包含…」，(B) Without 表示「沒有…」，(C) As for 表示「至於…」。","paraphrase":"","vocab":""},"140":{"type":"名詞詞彙 掌握上下文","translation":"年終頒獎宴會的邀請函不久將會寄達。我們非常歡迎您出席。","reason":"答案 (C)。句意是「將會很歡迎您的 ______」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到年終頒獎宴會的邀請函不久將會寄達，所以這個句子應該是表達歡迎「出席」，(C) attendance（出席）是正確答案。(A) support 表示「支持」，(B) insight 表示「洞見，洞察力」，(D) investment 表示「投資」。","paraphrase":"","vocab":""},"141":{"type":"（動詞位置）單數主詞後面使用單數動詞，複數主詞後面使用複數動詞","translation":"另外，知名刊物如《The National Herald》每年都會採訪各個入圍組織的代表。","reason":"真正的主詞是複數名詞 prominent publications（知名刊物），such as The National Herald 只是插入說明例子，不能誤認 Herald 為主詞。every year 表示習慣性、定期發生的事情，使用現在簡單式；複數主詞搭配原形動詞 interview，因此選 (A)。interviews 是第三人稱單數形式；is interviewing 是單數進行式；interviewing 單獨不能作主要動詞。","paraphrase":"","vocab":""},"142":{"type":"選出適當的句子","translation":"請回覆這封電子郵件進行確認。請註明您一行人的人數。我們可以為您保留這場活動最多 8 個座位。","reason":"答案 (D)。這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 To confirm, please reply to this e-mail. 提到要回覆這封電子郵件進行確認，而下一句 We can reserve up to eight seats for you at the event. 提到可以保留這場活動最多 8 個座位，所以空格的內容應該和參加人數有關，(D) Please indicate the number of people in your party 是正確答案。\n選項翻譯：(A) 請告訴我們您希望將它配送到哪裡。(B) 菜單上將會有多種料理風格的菜色。(C) 您會接到雜誌社代表的電話。(D) 請註明您一行人的人數。","paraphrase":"","vocab":"詞彙 deliver v. 配送 cuisine n. 烹飪（風格） indicate v. 表明，指出 party n. 團體，一行人"},"143":{"type":"【動詞位置】現在完成式 掌握上下文","translation":"本地兒童慈善團體 Riley's Kids 收到了 100 萬美元捐款。","reason":"答案 (A)。句中缺少動詞，所以動詞 (A) 和 (B) 是可能的答案。句意是「本地兒童慈善團體 Riley's Kids 收到 100 萬美元捐款」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到 Riley's Kids 的執行長 Amber Thomas 對上個月的捐款表達了謝意，由此可知 100 萬美元捐款是過去發生的事，所以表示過去發生的事對現在仍有影響，或者表示剛剛完成的事的現在完成式 (A) has received 是正確答案。未來式 (B) 表示未來發生的事，對於未來狀況的預測或意志。動名詞或現在分詞 (C) 和 to 不定詞 (D) 不能用在動詞的位置。","paraphrase":"","vocab":""},"144":{"type":"形容詞 掌握上下文","translation":"據說這筆捐款來自一位匿名的捐款者。","reason":"答案 (C)。句意是「據說這筆捐款來自一位 ______ 的捐款者」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到以前也有過來自未透露來源的捐款，但從來沒有這麼大的金額，由此可知這次的捐款者是匿名的，所以形容詞 (C) anonymous（匿名的）是正確答案。(A) well-known 表示「知名的，著名的」。(B) frequent 表示「頻繁的」。(D) influential 表示「有影響力的」。","paraphrase":"","vocab":""},"145":{"type":"名詞—代名詞—一致 掌握上下文","translation":"Thomas 提到，這筆捐款將使 Riley's Kids 能夠繼續擴建市中心的 Branson 青少年中心。那裡很快將有新的圖書館與籃球場。","reason":"答案 (A)。句意是「很快將有新的圖書館與籃球場」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到捐款將使 Riley's Kids 能夠繼續擴建市中心的 Branson 青少年中心，所以指稱 Branson 青少年中心的第三人稱單數主格人稱代名詞 (A) It 是正確答案。第三人稱複數主格人稱代名詞 (B) They 和第一人稱複數主格代名詞 (C) We 不能指稱單數名詞（Branson Youth Center），而第三人稱單數主格人稱代名詞 (D) She 指稱的對象限女性，所以不對。","paraphrase":"","vocab":""},"146":{"type":"選出適當的句子","translation":"現在，這座中心最早可望在明年 4 月開放。","reason":"答案 (B)。這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 (It) will soon have a new library and basketball court. 提到「它」（Branson 青少年中心）很快將有新的圖書館與籃球場，而下一句 Now the center may open as early as April of next year. 提到這座中心最早可望在明年 4 月開放，所以空格的內容應該和 Branson 青少年中心擴建的時程有關。(B) The work was halted last year due to a budget shortfall 是正確答案。\n選項翻譯：(A) 捐贈的書將必須先分類。(B) 這項工程因為預算不足而在去年中斷。(C) 中心訪客必須在接待處簽名登記。(D) 多家企業同意贊助年度活動。","paraphrase":"","vocab":"詞 sort v. 分類 halt v. 停止 budget n. 預算 shortfall n. 不足 sign in phr. 在進入某場所前簽名登記 reception desk phr. 接待處 sponsor v. 贊助 annual adj. 年度的，每年的"},"147":{"type":"Why is the purple line experiencing delays?","translation":"目前在 Rider Hollow 站由於一些掉落到軌道上的樹枝，造成地鐵紫線大幅度的延誤。","reason":"(A) A storm caused damage to a track.\n(B) Some debris fell in the way of trains.\n(C) A mechanical failure caused a train to get stuck.\n(D) There was overcrowding at a station.\n答案 (B)。這是問紫線為什麼（Why）延誤的 wh- 問句，而和問句關鍵語 the purple line experiencing delays 有關的部分 there are significant delays on the subway's purple line due to some tree branches that have fallen onto the tracks 提到，掉落到軌道上的樹枝造成地鐵紫線大幅度的延誤，所以 (B) 是正確答案。","paraphrase":"tree branches that have fallen onto the tracks 掉落到軌道上的樹枝 → debris fell in the way of trains 碎片掉落到列車線路","vocab":"詞 debris n. 碎片，殘骸 mechanical adj. 機械的 failure n. 故障 overcrowding n. 過度擁擠"},"148":{"type":"What is true about the purple line?","translation":"要得到關於延誤的定期更新訊息，以及其他地鐵資訊，請上 www.shelbyvillesubway.com 或下載我們的列車追蹤應用程式 Shelbyville Ride Tracker。","reason": const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const allowed=['1000','0520','0608','0621','0000','1014'];
const input=document.getElementById('accountCode'),connect=document.getElementById('connectCode'),leave=document.getElementById('leaveCode'),notice=document.getElementById('cloudNotice');
let activeCode='',unsub=[],remoteAnswers={},remoteStars={},remoteExcerpts={},loadedA=false,loadedS=false,loadedE=false,generation=0;
const cloud={ready:false,mode:'local'};window.toeicCloud=cloud;
function info(msg){notice.textContent=msg}
function stopListeners(){generation++;unsub.forEach(fn=>fn());unsub=[];loadedA=false;loadedS=false;loadedE=false;remoteAnswers={};remoteStars={};remoteExcerpts={};cloud.ready=false}
function localSave(){localStorage.setItem(LOCAL_KEY,JSON.stringify(records));localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts))}
function root(type){if(!activeCode||!cloud.ready)throw Error('雲端資料尚未載入');return collection(db,'practiceCodes',activeCode,type)}
function sync(){if(!activeCode||!loadedA||!loadedS||!loadedE)return;cloud.ready=true;cloud.mode='cloud';window.toeicApplyRemote?.({...remoteAnswers},{...remoteStars},{...remoteExcerpts});info('雲端模式：'+activeCode+'，歷史作答與星號已載入並同步。');connect.disabled=false;leave.hidden=false}
cloud.saveExcerpts=async(id,items)=>{if(!activeCode){if(items.length)excerpts[id]=items;else delete excerpts[id];localSave();render();return}const ref=doc(root('highlights'),String(id));if(items.length)await setDoc(ref,{items});else await deleteDoc(ref)};
cloud.deleteAnswer=async(id)=>{
  if(!activeCode){delete records[id];localSave();render();return}
  await deleteDoc(doc(root('answers'),String(id)));
};
cloud.saveAnswer=async(id,data)=>{if(!activeCode){records[id]=data;localSave();render();return}await setDoc(doc(root('answers'),String(id)),data)};
cloud.setStar=async(id,marked)=>{if(!activeCode){if(marked)stars[id]=true;else delete stars[id];localSave();render();return}const ref=doc(root('stars'),String(id));if(marked)await setDoc(ref,{marked:true});else await deleteDoc(ref)};
cloud.importAnswers=async(items)=>{if(!activeCode){records={...records,...items};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const entries=Object.entries(items);for(let i=0;i<entries.length;i+=400){const batch=writeBatch(db);for(const [id,data] of entries.slice(i,i+400))batch.set(doc(root('answers'),id),data);await batch.commit()}};
cloud.resetAnswers=async()=>{if(!activeCode){records={};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const ids=Object.keys(remoteAnswers);for(let i=0;i<ids.length;i+=400){const batch=writeBatch(db);ids.slice(i,i+400).forEach(id=>batch.delete(doc(root('answers'),id)));await batch.commit()}};
function goLocal(){stopListeners();activeCode='';cloud.mode='local';input.value='';input.disabled=false;connect.disabled=false;leave.hidden=true;window.toeicClearRemote?.();info('本機模式：未連線雲端，作答只保存在此瀏覽器。')}
leave.addEventListener('click',goLocal);
connect.addEventListener('click',async()=>{const code=input.value.trim();if(!allowed.includes(code)){info('代號無效。請輸入管理員提供的 4 位代號。');return}if(activeCode===code&&cloud.ready)return;stopListeners();activeCode=code;cloud.mode='loading';cloud.ready=false;window.toeicApplyRemote?.({},{});connect.disabled=true;leave.hidden=false;info('正在載入雲端歷史紀錄，請不要作答…');let token=generation;
try{if(!auth.currentUser)await signInAnonymously(auth);if(token!==generation)return;
const a=onSnapshot(collection(db,'practiceCodes',code,'answers'),snap=>{if(token!==generation)return;remoteAnswers={};snap.forEach(d=>{if(/^\d+$/.test(d.id))remoteAnswers[d.id]=d.data()});loadedA=true;sync()},err=>{if(token===generation){info('讀取雲端失敗：'+err.message+'。請檢查匿名驗證與 Firestore 規則。');connect.disabled=false}});
unsub.push(a);
const b=onSnapshot(collection(db,'practiceCodes',code,'stars'),snap=>{if(token!==generation)return;remoteStars={};snap.forEach(d=>{if(/^\d+$/.test(d.id)&&d.data().marked)remoteStars[d.id]=true});loadedS=true;sync()},err=>{if(token===generation){info('讀取星號失敗：'+err.message);connect.disabled=false}});unsub.push(b);
const c=onSnapshot(collection(db,'practiceCodes',code,'highlights'),snap=>{if(token!==generation)return;remoteExcerpts={};snap.forEach(d=>{const items=d.data().items;if(/^\d+$/.test(d.id)&&Array.isArray(items))remoteExcerpts[d.id]=items.filter(x=>typeof x==='string')});loadedE=true;sync()},err=>{if(token===generation){info('讀取文字摘錄失敗：'+err.message+'。請更新 Firestore 規則。');connect.disabled=false}});unsub.push(c);
}catch(err){if(token===generation){info('Firebase 連線失敗：'+err.message);connect.disabled=false}}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();connect.click()}});
// 在雲端讀取期間禁用作答；已離線作答不會自動上傳。
const originalSave=cloud.saveAnswer,originalStar=cloud.setStar,originalImport=cloud.importAnswers,originalReset=cloud.resetAnswers;
for(const [name,fn] of [['saveAnswer',originalSave],['deleteAnswer',cloud.deleteAnswer],['setStar',originalStar],['importAnswers',originalImport],['resetAnswers',originalReset],['saveExcerpts',cloud.saveExcerpts]])cloud[name]=async(...args)=>{if(cloud.mode==='loading'||activeCode&&!cloud.ready)throw Error('雲端正在載入或連線異常，無法儲存；請退出雲端模式後使用本機練習。');return fn(...args)};
onAuthStateChanged(auth,user=>{if(!user&&activeCode){info('Firebase 驗證已中斷，請重新按「載入雲端紀錄」。');stopListeners();connect.disabled=false}});
</script></body></html>
