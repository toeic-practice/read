Condominiums residents", "Building maintenance workers"], "group": "191-195", "answer": "C", "explanation": "公告對住戶說明各戶檢查與簡訊提醒安排。"}, {"id": 192, "part": 7, "stem": "What information can be found in the letter?", "choices": ["The date of an inspection", "The name of a technician", "The details of a problem", "The location of an office"], "group": "191-195", "answer": "A", "explanation": "通知信載明檢查日期為一月十日。"}, {"id": 193, "part": 7, "stem": "When did Ms. Matthews most likely receive her inspection report?", "choices": ["January 6", "January 10", "January 11", "January 15"], "group": "191-195", "answer": "D", "explanation": "38 號住戶屬 21～40 號，應於一月十五日收到報告。"}, {"id": 194, "part": 7, "stem": "What is suggested about Mr. Scott?", "choices": ["He arrived late for his appointment.", "He performed simple plumbing repairs.", "He left the apartment before 11 a.m.", "He was informed about some problems in advance."], "group": "191-195", "answer": "A", "explanation": "預約上午十點，報告載明十點半抵達，因此遲到。"}, {"id": 195, "part": 7, "stem": "According to the report, which item requires further action?", "choices": ["The windows", "The walls", "The alarm system", "The plumbing"], "group": "191-195", "answer": "D", "explanation": "廚房水管有輕微漏水，需聯絡管理員安排修理。"}, {"id": 196, "part": 7, "stem": "According to the schedule, what is indicated about the Southern Ohio Writers' Guild weekly coffee hour?", "choices": ["Individuals who want to attend must reserve seats in advance.", "Writers are not required to attend each session.", "Guests are not permitted to visit these meetings.", "Students can receive complimentary coffee or tea."], "group": "196-200", "answer": "B", "explanation": "咖啡聚會無需預先報名，隨時可參加，並非每次都必須出席。"}, {"id": 197, "part": 7, "stem": "What is the purpose of the e-mail?", "choices": ["To confirm an enrollment", "To announce new expenses", "To report a change of schedule", "To introduce a speaker"], "group": "196-200", "answer": "A", "explanation": "信件確認已為收件人完成工作坊報名。"}, {"id": 198, "part": 7, "stem": "What is suggested about the Kilwin City Library?", "choices": ["It rents out laptop computers.", "It was the former workplace of Ms. Nicholson.", "It owns a collection of works by local authors.", "It held a free event in the past."], "group": "196-200", "answer": "D", "explanation": "收件人去年夏天曾在同一地點參加工作坊；依題目脈絡推知該圖書館曾舉辦免費活動。"}, {"id": 199, "part": 7, "stem": "What workshop has Ms. Espinoza enrolled in?", "choices": ["The Great American Novel", "Simplifying Sonnets", "English Poetry", "Teen Essay Writing"], "group": "196-200", "answer": "B", "explanation": "十二月十八日下午一點對應 Simplifying Sonnets。"}, {"id": 200, "part": 7, "stem": "According to the e-mail, what are workshop participants encouraged to do?", "choices": ["Join a separate seminar", "Download some information", "Leave a detailed review", "Bring examples of personal work"], "group": "196-200", "answer": "D", "explanation": "願意讓作品被評論的學員，受鼓勵攜帶少量自己的作品範例。"}], "groups": {"131-134": "**Notice for Carmel Tower Residents**\\\nOn July 20, Carmel Tower will - **131** - work on a refurbishment of the building's hallways. The project will take four weeks to complete. During this period, work crews will need to enter the building. - **132** - access to the service elevator will be temporarily limited. Rest assured, efforts will be made to avoid - **133** - to building occupants. However, some noise and dust may be anticipated. - **134** - Contact the building management office if you have any concerns.", "135-138": "**Setting up the Audipro SL-2**\\\nCongratulations on your purchase of the Audipro SL-2 speaker system. The SL-2 - **135** - to deliver powerful home audio in a package that is easy to install.\\\nTo begin the setup process, download the Audipro app and register your speaker. Then, - **136** - while still on the app, connect the speaker to your Wi-Fi network. The speaker will - **137** - compatible media players or televisions on your network. Follow the instructions on the app to connect to each. The SL-2 can also be connected manually by using the cables enclosed - **138** - within the box.", "139-142": "**TO:** Beth Carlin bcarlin\\@eduswiftsystems.org\\\n**FROM:** John Statler statler\\@agpfoundation.org\\\n**DATE:** October 22\\\n**SUBJECT:** AGP Nonprofit Awards\n\nDear Ms. Carlin,\n\n- **139** - AGP, it is my honor to inform you that EduSwift Systems has been shortlisted for the AGP Nonprofit of the Year Award. An invitation to the year-end awards banquet will be forthcoming. Your - **140** - would be greatly appreciated. The event will provide an opportunity to network with members of similar organizations. Also, prominent publications such as The National Herald - **141** - representatives from each finalist every year. So, the event will be good for increasing publicity.\\\n  To confirm, please reply to this e-mail. We can reserve up to eight seats for you at the event. - **142** -\\\n  Congratulations again,\\\n  John Statler\\\n  AGP Foundation", "143-146": "(BRANSON) - Local children's charity Riley's Kids - **143** - a donation of $1 million. Riley's Kids CEO Amber Thomas expressed gratitude for the donation that was made early last month. Evidently, it came from a single - **144** - donor. \"We've had donations come from undisclosed sources before,\" Thomas said, \"but never one of this size.\" Thomas said that the donation will allow Riley's Kids to continue expanding its downtown Branson Youth Center. - **145** - will soon have a new library and basketball court. - **146** - Now the center may open as early as April of next year.", "147-148": "**ATTENTION COMMUTERS**\\\nCurrently, there are significant delays on the subway's purple line due to some tree branches that have fallen onto the tracks at the Rider Hollow Station.\\\nOur crews are working on removing the branches. Until that is complete, both northbound and southbound trains will be sharing a single track between the Rider Hollow and Clint Village Stations.\\\nFor regular updates on the delays, as well as other subway information, go to [www.shelbyvillesubway.com](https://www.shelbyvillesubway.com/) or download our train-tracking application, Shelbyville Ride Tracker.", "149-150": "**Jim Leonard** [10:18 A.M.]\\\nHi, Tricia. This is Jim. I got your text earlier saying that the oven in your apartment isn't working.\n\n**Tricia Madison** [10:21 A.M.]\\\nHi, Jim. Yeah, I turned it up to 350 degrees last night to bake some cookies, but it was still cold after 30 minutes. It doesn't seem to be working at all.\n\n**Jim Leonard** [10:22 A.M.]\\\nOK. Do you know if the pilot light has gone out?\n\n**Tricia Madison** [10:23 A.M.]\\\nActually, I didn't check. I would do that now, but I'm at work.\n\n**Jim Leonard** [10:25 A.M.]\\\nWell, I have the keys to everyone's units, so I can stop by this afternoon to check on the pilot light. If the problem is more serious, I'll have to call a repair person.\n\n**Tricia Madison** [10:28 A.M.]\\\nSounds great. I hope it can be fixed soon. Thanks so much for dealing with this issue promptly!", "151-152": "**Snappeshop**\\\nName: Gabe Edwards\\\nWould you recommend our company to others? Y / N\\\nFor the questions below, please select an option from 1 to 5 with 5 being the highest.\n\nHow satisfied are you with our service?\\\n1 2 3 4 5\n\nHow efficient is our delivery service?\\\n1 2 3 4 5\n\nHow would you rank our customer service?\\\n1 2 3 4 5\n\nWhat do you think about our catalog?\\\nCompared to other online outlets, you don't have a wide range of items.\n\nWhat do you think about our customer service?\\\nWhen I called customer service, they kept passing me around to different departments.\n\nWhich aspect of our service do you like the most?\\\nI like the low shipping fees and the speed of delivery.", "153-155": "**HISTORIC LONDON TOURS: GUIDES WANTED**\\\nDo you consider yourself a local history expert? Are you an engaging public speaker? Are you passionate about the city? If so, consider applying to be a guide at Historic London Tours. We are the oldest and most popular tour agency in the city. We organise bus, boat, and walking tours for thousands of visitors a year. Right now, we are looking for five individuals to help us conduct our walking tours.\n\nApplicants must:\n\n- Show a thorough knowledge of the city's history by taking a 30-minute exam\n- Deliver a 10-minute presentation on a neighbourhood of the city of their choosing\n- Pass a background check\n\nThe successful candidates will work 25 to 30 hours per week including weekends, with extra hours added during the summer. The standard pay is £14 per hour, and we pay £21 per hour on holidays. Full employment benefits are provided.\n\nTo apply, go to [www.historiclondon.co.uk/jobs](https://www.historiclondon.co.uk/jobs) and submit a résumé and cover letter explaining why you would be the ideal candidate. The deadline for applications is March 31.", "156-157": "**FROM:** Swift Link (555-4278)\\\n**SENT:** May 18, 12:10 P.M.\n\nThis is a notification that your International Travel Plan has been activated. Between May 18 and May 25, you will receive cellular service within Poland. The cost of this coverage is $10 per day. Note that you will be charged extra if you exceed five gigabytes of data, so we suggest turning off applications that use lots of data. To switch to a plan with more data, please use the Swift Link mobile application. Thank you.", "158-160": "**Paisley Park Diner Changes Management**\\\nFor decades, Paisley Park Diner has been one of the most iconic restaurants in Indianapolis. Its colorful interior filled with vintage items evokes an innocent, bygone era. According to Indianapolis Now magazine, it also boasts the city's friendliest servers and best apple pie.\n\nNow, founder and longtime manager Guy Hubert has decided to step down. — **[1]** —. At 72, Mr. Hubert is ready to leave the stresses of running the restaurant behind and looks forward to enjoying his retirement. Succeeding him will be his 38-year-old son, Gavin. \"Gavin has been working at the diner as head chef for over 15 years,\" says Mr. Hubert. — **[2]** —. \"I have every confidence that he knows what it takes to keep the place running smoothly.\"\n\nThe younger Hubert says he plans to keep the core aspects of the diner fully intact. — **[3]** —. However, he wants to add international dishes to the menu that go beyond traditional American fare. — **[4]** —. He also aims to make selected menu items available for delivery.", "161-164": "**Fumiko Suzuki** [10:51 A.M.] I would like your input on employee satisfaction. In our staff survey, several employees complained about having too much work. The stress this has caused has affected overall productivity. What could be some solutions?\n\n**Jintao Bang** [10:52 A.M.] I think one good idea would be to stop sending work-related e-mails after the office has closed.\n\n**Hendrick Schulz** [10:54 A.M.] That would be beneficial. Moreover, more breaks should be encouraged. Maybe even offer a team-building activity at the office. Engaging socially with colleagues has been proven to eliminate or reduce stress.\n\n**Fumiko Suzuki** [10:56 A.M.] Those are great suggestions. I'll bring them up with the board of directors and push for reforms. I know other offices offer similar perks and amenities, too.\n\n**Hendrick Schulz** [10:58 A.M.] Yes, but it's not about copying other companies. Those things actually help retain and attract highly skilled talent. These days, it's important to maintain a mutually beneficial relationship between employees and employers.\n\n**Fumiko Suzuki** [10:59 A.M.] We also had a budget surplus last quarter. I recommend we invest in other improvements. For instance, we could update the cafeteria interior or add some new menu choices.\n\n**Jintao Bang** [11:01 A.M.] I like the idea of changing the menu. That would bring about positive reactions from everyone. I can consult with an acquaintance, Stacy Hill. She used to run her own catering business. Now, she's writing a book of healthy recipes.\n\n**Fumiko Suzuki** [11:02 A.M.] Let's all think about these ideas some more and meet tomorrow morning to discuss them further.", "165-168": "**TO:** Harry Riley h.riley\\@webmail.com\\\n**FROM:** Brenda O'Connell b.oconnell\\@secondcity.com\\\n**SUBJECT:** Info\\\n**DATE:** June 18\n\nDear Mr. Riley,\n\nThank you for submitting your résumé to the Second City Temp Agency. I believe we have found a job that matches your skills. - **[1]** -\n\nThe Ross and Donahue Law Firm is seeking an assistant to help with data entry. They posted the announcement a week ago. Essentially, you would be updating the firm's database of clients. According to your résumé, you worked with a variety of database programs, including HX2 and Organizer, throughout your time in college. - **[2]** - . By all indications, you have the right experience for the job.\n\nWith your permission, I will go ahead and submit your materials to the Ross and Donahue Law Firm. - **[3]** - . They are interviewing applicants now and will make a decision by June 28. If you are offered an interview, I would strongly suggest going on the firm's Web site and reading about their mission and what type of law they specialize in. - **[4]** - . Please let me know if you want me to send in your application.\n\nSincerely,\\\nBrenda O'Connell", "169-171": "**To:** Gelson Cable customerservice\\@gelsoncable.com\\\n**From:** Candice Novak c.novak\\@raymailer.com\\\n**Date:** February 13\\\n**Subject:** Subscription\n\nTo Whom It May Concern,\n\nI recently spent 50 minutes waiting on the phone to talk to one of your representatives about a problem with my cable subscription. This is not the first time this has happened, and I have had enough. I would like to cancel my subscription, effective immediately.\n\nOver the years, I have regularly called about the quality of the signal in my building, but your representatives have ignored my complaints. Furthermore, they did not explain why some of my favorite cable channels were suddenly dropped from my subscription. When I called to find out about this, I was informed that they were only available in the Premium Package now.\n\nAfter having been a loyal customer for more than a decade, I have no interest in paying for another month of service. I also strongly suggest that you start treating your subscribers differently.\n\nSincerely,\\\nCandice Novak", "172-175": "**BookED CEO Opens New Chapter in Company's Story**\\\nAugust 26- BookED CEO Lisa Wang, who took over the role in January, has already introduced significant changes to the popular online application. The existing subscription-based model allows users to read a selection of essays, books, and other publications by authors who are not backed by large publishing houses. These independent releases are curated by BookED's team of literary experts and presented to customers as personalized recommendations.\n\nNow, BookED is publishing its own original material. They have directly commissioned freelance journalists and novelists to create content to be released starting next month. This has been accompanied by the application's launch of a points system. BookED has engineered a system that allows customers to earn points by recommending the company's new content on social media platforms. The points may be used to access any other content provided on the application. BookED has said it will continuously develop new methods for its users to earn points.\n\nIndustry observers say the changes will grow the application's customer base. They also believe BookED may begin offering the public a chance to buy shares of stock in the company beginning next year.", "176-180": "**To:** Sally Hartley sally.hartley\\@southgeorgiafinancial.com\\\n**From:** Raymond Moran raymond\\@trebeldesigns.com\\\n**Subject:** Order #7190-1715\\\n**Date:** April 1\n\nDear Ms. Hartley,\n\nWe are very happy that you chose Trebel Designs to create personalized marketing items for your company. Your order of 500 pens was shipped yesterday, and it should arrive within one to two business days. You may view the invoice on our Web site. As mentioned, you received a 10 percent discount for being a first-time customer.\n\nWith your order, I have also included a catalog of all the products we offer. Many of our customers have found that handing out T-shirts, hats, coffee mugs, pens, bags, or other items with a company logo on them is an effective way to market their businesses. Trebel Designs can use any logo design you send us, or we'd be happy to create a new one for you using one of our template designs. Please note that it will take us one week to create the design.\n\nThank you for your business, and we look forward to working with you again in the future.\n\nSincerely,\\\nRaymond Moran\n\n**To:** Raymond Moran raymond\\@trebeldesigns.com\\\n**From:** Sally Hartley sally.hartley\\@southgeorgiafinancial.com\\\n**Subject:** RE: Order #7190-1715\\\n**Date:** April 2\n\nDear Mr. Moran,\n\nI would like to thank you for the great customer service. We received our order this morning, and everything looks fantastic. In fact, some of us will be attending a career expo next month to recruit some new employees, so I would like to place an order for 300 more of the same item.\n\nI'd also like you to design a logo for a training program we are planning for new staff. Could you start working on this immediately? I'd like to unveil it to our board at their next meeting. I've sent the details in a separate e-mail.\n\nThank you again.\n\nSally Hartley\\\nSenior Marketing Director\\\nSouth Georgia Financial", "181-185": "**Bull Run Ski Resort Sports Shop Equipment Rental Information**\\\nIn addition to selling equipment by several manufacturers, the Bull Run Ski Resort's sports shop rents out a variety of equipment so you can enjoy your time on the ski slopes.\n\nWe have:\n\n- Ski packages including skis, boots, and poles from $50 per day or $150 per week\n- Ski jackets and pants from $30 per day or $90 per week\n- Helmets for $15 per day or $45 per week\\*\n- Goggles for $10 per day or $30 per week\n- Gloves for $5 per day or $15 per week\n\nWe offer various sizes for children and adults. Sizing charts to help you determine the correct sizes based on height and weight are available at the counter. All rental bills must be settled immediately. A 15 percent discount is offered to guests staying at the Bull Run Ski Resort.\n\n\\*For safety reasons, all skiers must wear a helmet while on the slopes.\n\n**Bull Run Ski Resort Sports Shop Equipment Rental Form**\\\nName: Marcus Carver\\\nAddress: 945 Elgin Avenue, Winnipeg, MB R3E 1B3, Canada\\\nPhone Number: 555-9708\\\nDate: February 15\\\nRental Period: 1 day\n\nCredit Card Number: \\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\\nBilling Address: Same as above\n\n| **Item**      | **Quantity** | **Price per Item** | **Cost** |\n| :------------ | :----------- | :----------------- | :------- |\n| Ski package   | 2            | $50                | $100     |\n| Helmet        | 2            | $15                | $30      |\n| Goggles       | 2            | $10                | $20      |\n| Gloves        | 2            | $5                 | $10      |\n| **Subtotal**  |              |                    | **$160** |\n| 15% discount  |              |                    | -$24     |\n| **Total due** |              |                    | **$136** |\n\nPlease note: One-day rentals must be used on the day they are rented. There are no refunds for rentals.", "186-190": "**ROSENSTEIN REAL ESTATE**\\\nHome | About Us | Agents | Contact\n\nRosenstein Real Estate is among the most trusted real estate agencies in the Chicago area. Though we can help you find properties anywhere in the city and its neighboring suburbs, we specialize in locating upscale housing in the city's north and northwestern areas.\n\nWhen you use us to find a property, you not only get a thorough tour of the premises, but you also receive extensive information to help you make the best decision. We provide a complete rundown of a property's amenities and an overview of its history.\n\nA list of all of the properties we represent is available here. Properties within Chicago are represented by real estate agents George Rosenstein and Mary Kowalski. Those in surrounding areas are represented by Karl Mitchell.\n\nProperties represented by Rosenstein Real Estate as of January 1\n\n| **Address**                      | **Price** | **Bedrooms** | **Bathrooms** |\n| :------------------------------- | :-------- | :----------- | :------------ |\n| 980 Boston Street, Chicago, IL   | $380,000  | 3            | 2             |\n| 118 Michigan Street, Chicago, IL | $410,100  | 4            | 3             |\n| 1001 Lipton Street, Evanston, IL | $360,500  | 2            | 2             |\n| 280 Irving Street, Chicago, IL   | $550,400  | 4            | 3             |\n| 190 Sherman Road, Chicago, IL    | $290,900  | 2            | 1             |\n\nCall 555-3928 to schedule a tour. We are available from 9 A.M. to 6 P.M. on weekdays.\n\n**TO:** Rosenstein Real Estate inquiries\\@rosenstein.com\\\n**FROM:** Anne Dahlberg anned98\\@mittermail.com\\\n**SUBJECT:** Apartment\\\n**DATE:** January 3\n\nTo Whom It May Concern,\n\nMy husband and I recently accepted teaching positions at Northbrook University in Chicago. Along with our son, we plan on moving to the city next month. We've been browsing real estate listings for a while now. Ideally, we'd like an apartment that costs under $400,000, and has two bedrooms and two bathrooms. However, we're somewhat flexible with those requirements. The apartment at 190 Sherman Road is quite appealing. We like how close it is to our university. Is that apartment still available? If so, we'd love to arrange a tour of it, preferably this upcoming weekend, when my husband and I will be in the city. Please let me know.\n\nBest,\\\nAnne Dahlberg", "191-195": "**NOTICE**\\\nCrystal Condominiums will be inspecting all units from January 6 to 10. The facilities manager will accompany a technician from FailSafe Home Inspections as he tours the building. Each inspection will take approximately 60 minutes.\n\nThe inspection will include a check for the following:\n\n- Insect infestation\n- Plumbing problems\n- Gas leaks\n\nYou will receive additional information in your mailbox to let you know when your inspection is scheduled. On the day of the inspection, you'll also receive text-message alerts notifying you when the technician enters and exits your unit.\n\nResidents of Units 1 to 20 will receive their inspection report on January 11. Residents of Units 21 to 40 will receive their inspection report on January 15.\n\n\nMs. Alyssa Matthews\\\nUnit 38\n\nDear Ms. Matthews,\n\nYour inspection is scheduled for January 10 at 10 a.m. The facilities manager will unlock your unit for the technician and relock the unit when the technician leaves.\n\nWe encourage you to leave your unit during the inspection to allow the technician to work freely. If it's necessary for you to be at home during your scheduled time, please notify the facilities manager as soon as possible.\n\nPlease also notify the facilities manager of any concerns you may have.\n\nSincerely,\\\nThe Management\n\n\n**Crystal Condominiums Inspection Report**\\\nBelow are the results of your recent condominium unit inspection. Please review this report carefully.\n\nInspection date: January 10\\\nArrival time: 10:30 a.m.\\\nUnit: 38\\\nTechnician: Allen Scott\n\nInspection Key:\\\nA - No problems detected\\\nB - Minor problems detected\\\nC - Major problems detected\n\n| **Items**                 | **Grade** | **Issue**                                | **Recommended Action**                                 |\n| :------------------------ | :-------- | :--------------------------------------- | :----------------------------------------------------- |\n| Windows                   | A         |                                          |                                                        |\n| Walls/Ceilings            | B         | Minor crack in dining room ceiling       | No action needed                                       |\n| Alarm system              | A         |                                          |                                                        |\n| Smoke detectors           | B         | Batteries in three devices replaced      | No further action needed                               |\n| Carbon monoxide detectors | A         |                                          |                                                        |\n| Plumbing                  | B         | Minor leak in pipes beneath kitchen sink | Contact facilities manager to arrange repair           |\n| Gas                       | A         |                                          |                                                        |\n| Electricity               | A         |                                          |                                                        |\n| Insects                   | B         | Several ants in dining room              | Contact facilities manager to arrange for exterminator |\n\nComments: Unit 38 is in good shape overall. However, the resident should reach out to the facilities manager to arrange for repair of a leaking pipe in the kitchen. Unit 38 should also receive extermination services to prevent future insect problems.", "196-200": "**Writers' Workshops November 17 Kilwin City Library**\\\nHave you always dreamed of publishing your own novel or poetry collection? Are you curious to learn if you have what it takes to become a writer? It's time to make this dream a reality!\n\nJoin us for our writers' workshop series, sponsored by the Southern Ohio Writers' Guild.\n\nWorkshops are hosted at the Kilwin City Library. Light refreshments will be provided, courtesy of Blueberry Bakery and Café. All workshops presented by the Southern Ohio Writers' Guild are available at no cost to participants. However, space is limited, so sign up today!\n\nAsk one of our librarians for more information or contact Lola Nicholson at the Southern Ohio Writers' Guild at linicholson\\@sowg.org.\n\n**Kilwin City Library Writers' Workshop Schedule**\n\n| **Workshop Title**       | **Dates**        | **Times**              | **Location**      |\n| :----------------------- | :--------------- | :--------------------- | :---------------- |\n| The Great American Novel | Dec 1 to Feb 13  | Mondays, 6 to 8 p.m.   | Conference Room A |\n| Simplifying Sonnets      | Dec 18 to Feb 13 | Thursdays, 1 to 2 p.m. | Conference Room A |\n| English Poetry           | Dec 19 to Feb 14 | Fridays, 3 to 4 p.m.   | Main Lecture Hall |\n| Teen Essay Writing       | Dec 20 to Feb 15 | Saturdays, 3 to 4 p.m. | Children's Room   |\n\nWriters' workshops rely upon regular attendance. Attendees who miss more than two workshops without prior notice may be dropped from the register.\n\nIf you are interested in a more casual environment, the Southern Ohio Writers' Guild hosts a weekly coffee hour for writers on Wednesdays from 4 to 5 p.m. at the Blueberry Café and Bakery. No preregistration is required, and all walk-ins are welcome!\n\n\n**To:** Barbara Espinoza barbespin\\@capomail.com\\\n**From:** Lola Nicholson linicholson\\@sowg.org\\\n**Date:** November 27\\\n**Subject:** Re: Workshop\n\nHi, Barbara! I have enrolled you in your requested workshop. The first session is scheduled for December 18 at 1 p.m. However, please arrive at least 10 minutes early to receive your workshop materials. Your workshop will be held in the same location at the Kilwin City Library as the literacy workshop you attended last summer.\n\nLaptop computers are not needed for the workshop, but participants are welcome to bring one. If you are willing to have your work reviewed, we encourage you to bring some samples as well, but please limit these to a few short selections.\n\nPlease let me know if you have any other questions!\n\nSincerely,\\\nLola Nicholson\\\nOutreach Coordinator\\\nSouthern Ohio Writers' Guild"}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 131–134 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong>Notice for Carmel Tower Residents</strong><br />\nOn July 20, Carmel Tower will  <strong class=\"blank-number\">131</strong>  work on a refurbishment of the building's hallways. The project will take four weeks to complete. During this period, work crews will need to enter the building.  <strong class=\"blank-number\">132</strong>  access to the service elevator will be temporarily limited. Rest assured, efforts will be made to avoid  <strong class=\"blank-number\">133</strong>  to building occupants. However, some noise and dust may be anticipated.  <strong class=\"blank-number\">134</strong>  Contact the building management office if you have any concerns.</p>\n</div></section></div>", "135-138": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 135–138 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-manual\"><div class=\"doc-ribbon\"><span>PRODUCT INSTRUCTIONS</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong>Setting up the Audipro SL-2</strong><br />\nCongratulations on your purchase of the Audipro SL-2 speaker system. The SL-2  <strong class=\"blank-number\">135</strong>  to deliver powerful home audio in a package that is easy to install.<br />\nTo begin the setup process, download the Audipro app and register your speaker. Then,  <strong class=\"blank-number\">136</strong>  while still on the app, connect the speaker to your Wi-Fi network. The speaker will  <strong class=\"blank-number\">137</strong>  compatible media players or televisions on your network. Follow the instructions on the app to connect to each. The SL-2 can also be connected manually by using the cables enclosed  <strong class=\"blank-number\">138</strong>  within the box.</p>\n</div></section></div>", "139-142": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 139–142 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong class=\"mail-key\">TO:</strong> Beth Carlin bcarlin@eduswiftsystems.org<br />\n<strong class=\"mail-key\">FROM:</strong> John Statler statler@agpfoundation.org<br />\n<strong class=\"mail-key\">DATE:</strong> October 22<br />\n<strong class=\"mail-key\">SUBJECT:</strong> AGP Nonprofit Awards</p>\n<p>Dear Ms. Carlin,</p>\n<p><strong class=\"blank-number\">139</strong>  AGP, it is my honor to inform you that EduSwift Systems has been shortlisted for the AGP Nonprofit of the Year Award. An invitation to the year-end awards banquet will be forthcoming. Your  <strong class=\"blank-number\">140</strong>  would be greatly appreciated. The event will provide an opportunity to network with members of similar organizations. Also, prominent publications such as The National Herald  <strong class=\"blank-number\">141</strong>  representatives from each finalist every year. So, the event will be good for increasing publicity.<br />\nTo confirm, please reply to this e-mail. We can reserve up to eight seats for you at the event.  <strong class=\"blank-number\">142</strong><br />\nCongratulations again,<br />\nJohn Statler<br />\nAGP Foundation</p>\n</div></section></div>", "143-146": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 143–146 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>NEWS ARTICLE</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p>(BRANSON) - Local children's charity Riley's Kids  <strong class=\"blank-number\">143</strong>  a donation of $1 million. Riley's Kids CEO Amber Thomas expressed gratitude for the donation that was made early last month. Evidently, it came from a single  <strong class=\"blank-number\">144</strong>  donor. &quot;We've had donations come from undisclosed sources before,&quot; Thomas said, &quot;but never one of this size.&quot; Thomas said that the donation will allow Riley's Kids to continue expanding its downtown Branson Youth Center.  <strong class=\"blank-number\">145</strong>  will soon have a new library and basketball court.  <strong class=\"blank-number\">146</strong>  Now the center may open as early as April of next year.</p>\n</div></section></div>", "147-148": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 147–148 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong>ATTENTION COMMUTERS</strong><br />\nCurrently, there are significant delays on the subway's purple line due to some tree branches that have fallen onto the tracks at the Rider Hollow Station.<br />\nOur crews are working on removing the branches. Until that is complete, both northbound and southbound trains will be sharing a single track between the Rider Hollow and Clint Village Stations.<br />\nFor regular updates on the delays, as well as other subway information, go to <a href=\"https://www.shelbyvillesubway.com/\">www.shelbyvillesubway.com</a> or download our train-tracking application, Shelbyville Ride Tracker.</p>\n</div></section></div>", "149-150": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 149–150 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>MESSAGES</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong class=\"chat-sender\">Jim Leonard</strong> <span class=\"chat-time\">10:18 A.M.</span><br />\nHi, Tricia. This is Jim. I got your text earlier saying that the oven in your apartment isn't working.</p>\n<p><strong class=\"chat-sender\">Tricia Madison</strong> <span class=\"chat-time\">10:21 A.M.</span><br />\nHi, Jim. Yeah, I turned it up to 350 degrees last night to bake some cookies, but it was still cold after 30 minutes. It doesn't seem to be working at all.</p>\n<p><strong class=\"chat-sender\">Jim Leonard</strong> <span class=\"chat-time\">10:22 A.M.</span><br />\nOK. Do you know if the pilot light has gone out?</p>\n<p><strong class=\"chat-sender\">Tricia Madison</strong> <span class=\"chat-time\">10:23 A.M.</span><br />\nActually, I didn't check. I would do that now, but I'm at work.</p>\n<p><strong class=\"chat-sender\">Jim Leonard</strong> <span class=\"chat-time\">10:25 A.M.</span><br />\nWell, I have the keys to everyone's units, so I can stop by this afternoon to check on the pilot light. If the problem is more serious, I'll have to call a repair person.</p>\n<p><strong class=\"chat-sender\">Tricia Madison</strong> <span class=\"chat-time\">10:28 A.M.</span><br />\nSounds great. I hope it can be fixed soon. Thanks so much for dealing with this issue promptly!</p>\n</div></section></div>", "151-152": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 151–152 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong>Snappeshop</strong><br />\nName: Gabe Edwards<br />\nWould you recommend our company to others? Y / N<br />\nFor the questions below, please select an option from 1 to 5 with 5 being the highest.</p>\n<p>How satisfied are you with our service?<br />\n1 2 3 4 5</p>\n<p>How efficient is our delivery service?<br />\n1 2 3 4 5</p>\n<p>How would you rank our customer service?<br />\n1 2 3 4 5</p>\n<p>What do you think about our catalog?<br />\nCompared to other online outlets, you don't have a wide range of items.</p>\n<p>What do you think about our customer service?<br />\nWhen I called customer service, they kept passing me around to different departments.</p>\n<p>Which aspect of our service do you like the most?<br />\nI like the low shipping fees and the speed of delivery.</p>\n</div></section></div>", "153-155": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 153–155 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>JOB ADVERTISEMENT</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong>HISTORIC LONDON TOURS: GUIDES WANTED</strong><br />\nDo you consider yourself a local history expert? Are you an engaging public speaker? Are you passionate about the city? If so, consider applying to be a guide at Historic London Tours. We are the oldest and most popular tour agency in the city. We organise bus, boat, and walking tours for thousands of visitors a year. Right now, we are looking for five individuals to help us conduct our walking tours.</p>\n<p>Applicants must:</p>\n<ul>\n<li>Show a thorough knowledge of the city's history by taking a 30-minute exam</li>\n<li>Deliver a 10-minute presentation on a neighbourhood of the city of their choosing</li>\n<li>Pass a background check</li>\n</ul>\n<p>The successful candidates will work 25 to 30 hours per week including weekends, with extra hours added during the summer. The standard pay is £14 per hour, and we pay £21 per hour on holidays. Full employment benefits are provided.</p>\n<p>To apply, go to <a href=\"https://www.historiclondon.co.uk/jobs\">www.historiclondon.co.uk/jobs</a> and submit a résumé and cover letter explaining why you would be the ideal candidate. The deadline for applications is March 31.</p>\n</div></section></div>", "156-157": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 156–157 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-sms\"><div class=\"doc-ribbon\"><span>TEXT MESSAGE</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><div class=\"sms-bubble\"><p><strong>FROM:</strong> Swift Link (555-4278)<br />\n<strong>SENT:</strong> May 18, 12:10 P.M.</p>\n<p>This is a notification that your International Travel Plan has been activated. Between May 18 and May 25, you will receive cellular service within Poland. The cost of this coverage is $10 per day. Note that you will be charged extra if you exceed five gigabytes of data, so we suggest turning off applications that use lots of data. To switch to a plan with more data, please use the Swift Link mobile application. Thank you.</p>\n</div></div></section></div>", "158-160": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 158–160 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>NEWS ARTICLE</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong>Paisley Park Diner Changes Management</strong><br />\nFor decades, Paisley Park Diner has been one of the most iconic restaurants in Indianapolis. Its colorful interior filled with vintage items evokes an innocent, bygone era. According to Indianapolis Now magazine, it also boasts the city's friendliest servers and best apple pie.</p>\n<p>Now, founder and longtime manager Guy Hubert has decided to step down. — <strong>[1]</strong> —. At 72, Mr. Hubert is ready to leave the stresses of running the restaurant behind and looks forward to enjoying his retirement. Succeeding him will be his 38-year-old son, Gavin. &quot;Gavin has been working at the diner as head chef for over 15 years,&quot; says Mr. Hubert. — <strong>[2]</strong> —. &quot;I have every confidence that he knows what it takes to keep the place running smoothly.&quot;</p>\n<p>The younger Hubert says he plans to keep the core aspects of the diner fully intact. — <strong>[3]</strong> —. However, he wants to add international dishes to the menu that go beyond traditional American fare. — <strong>[4]</strong> —. He also aims to make selected menu items available for delivery.</p>\n</div></section></div>", "161-164": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 161–164 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>MESSAGES</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong class=\"chat-sender\">Fumiko Suzuki</strong> <span class=\"chat-time\">10:51 A.M.</span> I would like your input on employee satisfaction. In our staff survey, several employees complained about having too much work. The stress this has caused has affected overall productivity. What could be some solutions?</p>\n<p><strong class=\"chat-sender\">Jintao Bang</strong> <span class=\"chat-time\">10:52 A.M.</span> I think one good idea would be to stop sending work-related e-mails after the office has closed.</p>\n<p><strong class=\"chat-sender\">Hendrick Schulz</strong> <span class=\"chat-time\">10:54 A.M.</span> That would be beneficial. Moreover, more breaks should be encouraged. Maybe even offer a team-building activity at the office. Engaging socially with colleagues has been proven to eliminate or reduce stress.</p>\n<p><strong class=\"chat-sender\">Fumiko Suzuki</strong> <span class=\"chat-time\">10:56 A.M.</span> Those are great suggestions. I'll bring them up with the board of directors and push for reforms. I know other offices offer similar perks and amenities, too.</p>\n<p><strong class=\"chat-sender\">Hendrick Schulz</strong> <span class=\"chat-time\">10:58 A.M.</span> Yes, but it's not about copying other companies. Those things actually help retain and attract highly skilled talent. These days, it's important to maintain a mutually beneficial relationship between employees and employers.</p>\n<p><strong class=\"chat-sender\">Fumiko Suzuki</strong> <span class=\"chat-time\">10:59 A.M.</span> We also had a budget surplus last quarter. I recommend we invest in other improvements. For instance, we could update the cafeteria interior or add some new menu choices.</p>\n<p><strong class=\"chat-sender\">Jintao Bang</strong> <span class=\"chat-time\">11:01 A.M.</span> I like the idea of changing the menu. That would bring about positive reactions from everyone. I can consult with an acquaintance, Stacy Hill. She used to run her own catering business. Now, she's writing a book of healthy recipes.</p>\n<p><strong class=\"chat-sender\">Fumiko Suzuki</strong> <span class=\"chat-time\">11:02 A.M.</span> Let's all think about these ideas some more and meet tomorrow morning to discuss them further.</p>\n</div></section></div>", "165-168": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 165–168 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong class=\"mail-key\">TO:</strong> Harry Riley h.riley@webmail.com<br />\n<strong class=\"mail-key\">FROM:</strong> Brenda O'Connell b.oconnell@secondcity.com<br />\n<strong class=\"mail-key\">SUBJECT:</strong> Info<br />\n<strong class=\"mail-key\">DATE:</strong> June 18</p>\n<p>Dear Mr. Riley,</p>\n<p>Thank you for submitting your résumé to the Second City Temp Agency. I believe we have found a job that matches your skills. - <strong>[1]</strong> -</p>\n<p>The Ross and Donahue Law Firm is seeking an assistant to help with data entry. They posted the announcement a week ago. Essentially, you would be updating the firm's database of clients. According to your résumé, you worked with a variety of database programs, including HX2 and Organizer, throughout your time in college. - <strong>[2]</strong> - . By all indications, you have the right experience for the job.</p>\n<p>With your permission, I will go ahead and submit your materials to the Ross and Donahue Law Firm. - <strong>[3]</strong> - . They are interviewing applicants now and will make a decision by June 28. If you are offered an interview, I would strongly suggest going on the firm's Web site and reading about their mission and what type of law they specialize in. - <strong>[4]</strong> - . Please let me know if you want me to send in your application.</p>\n<p>Sincerely,<br />\nBrenda O'Connell</p>\n</div></section></div>", "169-171": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 169–171 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong class=\"mail-key\">TO:</strong> Gelson Cable customerservice@gelsoncable.com<br />\n<strong class=\"mail-key\">FROM:</strong> Candice Novak c.novak@raymailer.com<br />\n<strong class=\"mail-key\">DATE:</strong> February 13<br />\n<strong class=\"mail-key\">SUBJECT:</strong> Subscription</p>\n<p>To Whom It May Concern,</p>\n<p>I recently spent 50 minutes waiting on the phone to talk to one of your representatives about a problem with my cable subscription. This is not the first time this has happened, and I have had enough. I would like to cancel my subscription, effective immediately.</p>\n<p>Over the years, I have regularly called about the quality of the signal in my building, but your representatives have ignored my complaints. Furthermore, they did not explain why some of my favorite cable channels were suddenly dropped from my subscription. When I called to find out about this, I was informed that they were only available in the Premium Package now.</p>\n<p>After having been a loyal customer for more than a decade, I have no interest in paying for another month of service. I also strongly suggest that you start treating your subscribers differently.</p>\n<p>Sincerely,<br />\nCandice Novak</p>\n</div></section></div>", "172-175": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 172–175 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>NEWS ARTICLE</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong>BookED CEO Opens New Chapter in Company's Story</strong><br />\nAugust 26- BookED CEO Lisa Wang, who took over the role in January, has already introduced significant changes to the popular online application. The existing subscription-based model allows users to read a selection of essays, books, and other publications by authors who are not backed by large publishing houses. These independent releases are curated by BookED's team of literary experts and presented to customers as personalized recommendations.</p>\n<p>Now, BookED is publishing its own original material. They have directly commissioned freelance journalists and novelists to create content to be released starting next month. This has been accompanied by the application's launch of a points system. BookED has engineered a system that allows customers to earn points by recommending the company's new content on social media platforms. The points may be used to access any other content provided on the application. BookED has said it will continuously develop new methods for its users to earn points.</p>\n<p>Industry observers say the changes will grow the application's customer base. They also believe BookED may begin offering the public a chance to buy shares of stock in the company beginning next year.</p>\n</div></section></div>", "176-180": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 176–180 · 2 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>READING MATERIAL 1 / 2</small></div><div class=\"document-body\"><p><strong class=\"mail-key\">TO:</strong> Sally Hartley sally.hartley@southgeorgiafinancial.com<br />\n<strong class=\"mail-key\">FROM:</strong> Raymond Moran raymond@trebeldesigns.com<br />\n<strong class=\"mail-key\">SUBJECT:</strong> Order #7190-1715<br />\n<strong class=\"mail-key\">DATE:</strong> April 1</p>\n<p>Dear Ms. Hartley,</p>\n<p>We are very happy that you chose Trebel Designs to create personalized marketing items for your company. Your order of 500 pens was shipped yesterday, and it should arrive within one to two business days. You may view the invoice on our Web site. As mentioned, you received a 10 percent discount for being a first-time customer.</p>\n<p>With your order, I have also included a catalog of all the products we offer. Many of our customers have found that handing out T-shirts, hats, coffee mugs, pens, bags, or other items with a company logo on them is an effective way to market their businesses. Trebel Designs can use any logo design you send us, or we'd be happy to create a new one for you using one of our template designs. Please note that it will take us one week to create the design.</p>\n<p>Thank you for your business, and we look forward to working with you again in the future.</p>\n<p>Sincerely,<br />\nRaymond Moran</p>\n</div></section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>READING MATERIAL 2 / 2</small></div><div class=\"document-body\"><p><strong class=\"mail-key\">TO:</strong> Raymond Moran raymond@trebeldesigns.com<br />\n<strong class=\"mail-key\">FROM:</strong> Sally Hartley sally.hartley@southgeorgiafinancial.com<br />\n<strong class=\"mail-key\">SUBJECT:</strong> RE: Order #7190-1715<br />\n<strong class=\"mail-key\">DATE:</strong> April 2</p>\n<p>Dear Mr. Moran,</p>\n<p>I would like to thank you for the great customer service. We received our order this morning, and everything looks fantastic. In fact, some of us will be attending a career expo next month to recruit some new employees, so I would like to place an order for 300 more of the same item.</p>\n<p>I'd also like you to design a logo for a training program we are planning for new staff. Could you start working on this immediately? I'd like to unveil it to our board at their next meeting. I've sent the details in a separate e-mail.</p>\n<p>Thank you again.</p>\n<p>Sally Hartley<br />\nSenior Marketing Director<br />\nSouth Georgia Financial</p>\n</div></section></div>", "181-185": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 181–185 · 1 document</span></div><div class=\"reading-stack\"><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM</span><small>READING MATERIAL 1 / 1</small></div><div class=\"document-body\"><p><strong>Bull Run Ski Resort Sports Shop Equipment Rental Information</strong><br />\nIn addition to selling equipment by several manufacturers, the Bull Run Ski Resort's sports shop rents out a variety of equipment so you can enjoy your time on the ski slopes.</p>\n<p>We have:</p>\n<ul>\n<li>Ski packages including skis, boots, and poles from $50 per day or $150 per week</li>\n<li>Ski jackets and pants from $30 per day or $90 per week</li>\n<li>Helmets for $15 per day or $45 per week*</li>\n<li>Goggles for $10 per day or $30 per week</li>\n<li>Gloves for $5 per day or $15 per week</li>\n</ul>\n<p>We offer various sizes for children and adults. Sizing charts to help you determine the correct sizes based on height and weight are available at the counter. All rental bills must be settled immediately. A 15 percent discount is offered to guests staying at the Bull Run Ski Resort.</p>\n<p>*For safety reasons, all skiers must wear a helmet while on the slopes.</p>\n<p><strong>Bull Run Ski Resort Sports Shop Equipment Rental Form</strong><br />\nName: Marcus Carver<br />\nAddress: 945 Elgin Avenue, Winnipeg, MB R3E 1B3, Canada<br />\nPhone Number: 555-9708<br />\nDate: February 15<br />\nRental Period: 1 day</p>\n<p>Credit Card Number: ********************<br />\nBilling Address: Same as above</p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\"><strong>Item</strong></th>\n  <th style=\"text-align:left\"><strong>Quantity</strong></th>\n  <th style=\"text-align:left\"><strong>Price per Item</strong></th>\n  <th style=\"text-align:left\"><strong>Cost</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">Ski package</td>\n  <td style=\"text-align:left\">2</td>\n  <td style=\"text-align:left\">$50</td>\n  <td style=\"text-align:left\">$100</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Helmet</td>\n  <td style=\"text-align:left\">2</td>\n  <td style=\"text-align:left\">$15</td>\n  <td style=\"text-align:left\">$30</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Goggles</td>\n  <td style=\"text-align:left\">2</td>\n  <td style=\"text-align:left\">$10</td>\n  <td style=\"text-align:left\">$20</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Gloves</td>\n  <td style=\"text-align:left\">2</td>\n  <td style=\"text-align:left\">$5</td>\n  <td style=\"text-align:left\">$10</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\"><strong>Subtotal</strong></td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\"><strong>$160</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">15% discount</td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\">-$24</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\"><strong>Total due</strong></td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\"><strong>$136</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Please note: One-day rentals must be used on the day they are rented. There are no refunds for rentals.</p>\n</div></section></div>", "186-190": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 186–190 · 2 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-webpage\"><div class=\"doc-ribbon\"><span>WEB PAGE</span><small>READING MATERIAL 1 / 2</small></div><div class=\"document-body\"><div class=\"browser-chrome\"><span class=\"browser-dots\">● ● ●</span><span>ROSENSTEIN REAL ESTATE · PROPERTY LISTINGS</span></div><p><strong>ROSENSTEIN REAL ESTATE</strong><br />\nHome | About Us | Agents | Contact</p>\n<p>Rosenstein Real Estate is among the most trusted real estate agencies in the Chicago area. Though we can help you find properties anywhere in the city and its neighboring suburbs, we specialize in locating upscale housing in the city's north and northwestern areas.</p>\n<p>When you use us to find a property, you not only get a thorough tour of the premises, but you also receive extensive information to help you make the best decision. We provide a complete rundown of a property's amenities and an overview of its history.</p>\n<p>A list of all of the properties we represent is available here. Properties within Chicago are represented by real estate agents George Rosenstein and Mary Kowalski. Those in surrounding areas are represented by Karl Mitchell.</p>\n<p>Properties represented by Rosenstein Real Estate as of January 1</p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\"><strong>Address</strong></th>\n  <th style=\"text-align:left\"><strong>Price</strong></th>\n  <th style=\"text-align:left\"><strong>Bedrooms</strong></th>\n  <th style=\"text-align:left\"><strong>Bathrooms</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">980 Boston Street, Chicago, IL</td>\n  <td style=\"text-align:left\">$380,000</td>\n  <td style=\"text-align:left\">3</td>\n  <td style=\"text-align:left\">2</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">118 Michigan Street, Chicago, IL</td>\n  <td style=\"text-align:left\">$410,100</td>\n  <td style=\"text-align:left\">4</td>\n  <td style=\"text-align:left\">3</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">1001 Lipton Street, Evanston, IL</td>\n  <td style=\"text-align:left\">$360,500</td>\n  <td style=\"text-align:left\">2</td>\n  <td style=\"text-align:left\">2</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">280 Irving Street, Chicago, IL</td>\n  <td style=\"text-align:left\">$550,400</td>\n  <td style=\"text-align:left\">4</td>\n  <td style=\"text-align:left\">3</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">190 Sherman Road, Chicago, IL</td>\n  <td style=\"text-align:left\">$290,900</td>\n  <td style=\"text-align:left\">2</td>\n  <td style=\"text-align:left\">1</td>\n</tr>\n</tbody>\n</table>\n<p>Call 555-3928 to schedule a tour. We are available from 9 A.M. to 6 P.M. on weekdays.</p>\n</div></section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>READING MATERIAL 2 / 2</small></div><div class=\"document-body\"><p><strong class=\"mail-key\">TO:</strong> Rosenstein Real Estate inquiries@rosenstein.com<br />\n<strong class=\"mail-key\">FROM:</strong> Anne Dahlberg anned98@mittermail.com<br />\n<strong class=\"mail-key\">SUBJECT:</strong> Apartment<br />\n<strong class=\"mail-key\">DATE:</strong> January 3</p>\n<p>To Whom It May Concern,</p>\n<p>My husband and I recently accepted teaching positions at Northbrook University in Chicago. Along with our son, we plan on moving to the city next month. We've been browsing real estate listings for a while now. Ideally, we'd like an apartment that costs under $400,000, and has two bedrooms and two bathrooms. However, we're somewhat flexible with those requirements. The apartment at 190 Sherman Road is quite appealing. We like how close it is to our university. Is that apartment still available? If so, we'd love to arrange a tour of it, preferably this upcoming weekend, when my husband and I will be in the city. Please let me know.</p>\n<p>Best,<br />\nAnne Dahlberg</p>\n</div></section></div>", "191-195": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 191–195 · 2 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>READING MATERIAL 1 / 2</small></div><div class=\"document-body\"><p><strong>NOTICE</strong><br />\nCrystal Condominiums will be inspecting all units from January 6 to 10. The facilities manager will accompany a technician from FailSafe Home Inspections as he tours the building. Each inspection will take approximately 60 minutes.</p>\n<p>The inspection will include a check for the following:</p>\n<ul>\n<li>Insect infestation</li>\n<li>Plumbing problems</li>\n<li>Gas leaks</li>\n</ul>\n<p>You will receive additional information in your mailbox to let you know when your inspection is scheduled. On the day of the inspection, you'll also receive text-message alerts notifying you when the technician enters and exits your unit.</p>\n<p>Residents of Units 1 to 20 will receive their inspection report on January 11. Residents of Units 21 to 40 will receive their inspection report on January 15.</p>\n</div></section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL</span><small>READING MATERIAL 2 / 2</small></div><div class=\"document-body\"><p>Ms. Alyssa Matthews<br />\nUnit 38</p>\n<p>Dear Ms. Matthews,</p>\n<p>Your inspection is scheduled for January 10 at 10 a.m. The facilities manager will unlock your unit for the technician and relock the unit when the technician leaves.</p>\n<p>We encourage you to leave your unit during the inspection to allow the technician to work freely. If it's necessary for you to be at home during your scheduled time, please notify the facilities manager as soon as possible.</p>\n<p>Please also notify the facilities manager of any concerns you may have.</p>\n<p>Sincerely,<br />\nThe Management</p>\n<p><strong>Crystal Condominiums Inspection Report</strong><br />\nBelow are the results of your recent condominium unit inspection. Please review this report carefully.</p>\n<p>Inspection date: January 10<br />\nArrival time: 10:30 a.m.<br />\nUnit: 38<br />\nTechnician: Allen Scott</p>\n<p>Inspection Key:<br />\nA - No problems detected<br />\nB - Minor problems detected<br />\nC - Major problems detected</p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\"><strong>Items</strong></th>\n  <th style=\"text-align:left\"><strong>Grade</strong></th>\n  <th style=\"text-align:left\"><strong>Issue</strong></th>\n  <th style=\"text-align:left\"><strong>Recommended Action</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">Windows</td>\n  <td style=\"text-align:left\">A</td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\"></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Walls/Ceilings</td>\n  <td style=\"text-align:left\">B</td>\n  <td style=\"text-align:left\">Minor crack in dining room ceiling</td>\n  <td style=\"text-align:left\">No action needed</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Alarm system</td>\n  <td style=\"text-align:left\">A</td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\"></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Smoke detectors</td>\n  <td style=\"text-align:left\">B</td>\n  <td style=\"text-align:left\">Batteries in three devices replaced</td>\n  <td style=\"text-align:left\">No further action needed</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Carbon monoxide detectors</td>\n  <td style=\"text-align:left\">A</td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\"></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Plumbing</td>\n  <td style=\"text-align:left\">B</td>\n  <td style=\"text-align:left\">Minor leak in pipes beneath kitchen sink</td>\n  <td style=\"text-align:left\">Contact facilities manager to arrange repair</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Gas</td>\n  <td style=\"text-align:left\">A</td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\"></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Electricity</td>\n  <td style=\"text-align:left\">A</td>\n  <td style=\"text-align:left\"></td>\n  <td style=\"text-align:left\"></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Insects</td>\n  <td style=\"text-align:left\">B</td>\n  <td style=\"text-align:left\">Several ants in dining room</td>\n  <td style=\"text-align:left\">Contact facilities manager to arrange for exterminator</td>\n</tr>\n</tbody>\n</table>\n<p>Comments: Unit 38 is in good shape overall. However, the resident should reach out to the facilities manager to arrange for repair of a leaking pipe in the kitchen. Unit 38 should also receive extermination services to prevent future insect problems.</p>\n</div></section></div>", "196-200": "<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料</span><span>Questions 196–200 · 2 documents</span></div><div class=\"reading-stack\"><section class=\"document-card type-flyer\"><div class=\"doc-ribbon\"><span>EVENT FLYER</span><small>READING MATERIAL 1 / 2</small></div><div class=\"document-body\"><p><strong>Writers' Workshops November 17 Kilwin City Library</strong><br />\nHave you always dreamed of publishing your own novel or poetry collection? Are you curious to learn if you have what it takes to become a writer? It's time to make this dream a reality!</p>\n<p>Join us for our writers' workshop series, sponsored by the Southern Ohio Writers' Guild.</p>\n<p>Workshops are hosted at the Kilwin City Library. Light refreshments will be provided, courtesy of Blueberry Bakery and Café. All workshops presented by the Southern Ohio Writers' Guild are available at no cost to participants. However, space is limited, so sign up today!</p>\n<p>Ask one of our librarians for more information or contact Lola Nicholson at the Southern Ohio Writers' Guild at linicholson@sowg.org.</p>\n<p><strong>Kilwin City Library Writers' Workshop Schedule</strong></p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\"><strong>Workshop Title</strong></th>\n  <th style=\"text-align:left\"><strong>Dates</strong></th>\n  <th style=\"text-align:left\"><strong>Times</strong></th>\n  <th style=\"text-align:left\"><strong>Location</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">The Great American Novel</td>\n  <td style=\"text-align:left\">Dec 1 to Feb 13</td>\n  <td style=\"text-align:left\">Mondays, 6 to 8 p.m.</td>\n  <td style=\"text-align:left\">Conference Room A</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Simplifying Sonnets</td>\n  <td style=\"text-align:left\">Dec 18 to Feb 13</td>\n  <td style=\"text-align:left\">Thursdays, 1 to 2 p.m.</td>\n  <td style=\"text-align:left\">Conference Room A</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">English Poetry</td>\n  <td style=\"text-align:left\">Dec 19 to Feb 14</td>\n  <td style=\"text-align:left\">Fridays, 3 to 4 p.m.</td>\n  <td style=\"text-align:left\">Main Lecture Hall</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">Teen Essay Writing</td>\n  <td style=\"text-align:left\">Dec 20 to Feb 15</td>\n  <td style=\"text-align:left\">Saturdays, 3 to 4 p.m.</td>\n  <td style=\"text-align:left\">Children's Room</td>\n</tr>\n</tbody>\n</table>\n<p>Writers' workshops rely upon regular attendance. Attendees who miss more than two workshops without prior notice may be dropped from the register.</p>\n<p>If you are interested in a more casual environment, the Southern Ohio Writers' Guild hosts a weekly coffee hour for writers on Wednesdays from 4 to 5 p.m. at the Blueberry Café and Bakery. No preregistration is required, and all walk-ins are welcome!</p>\n</div></section><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>SCHEDULE</span><small>READING MATERIAL 2 / 2</small></div><div class=\"document-body\"><p><strong>To:</strong> Barbara Espinoza barbespin@capomail.com<br />\n<strong>From:</strong> Lola Nicholson linicholson@sowg.org<br />\n<strong>Date:</strong> November 27<br />\n<strong>Subject:</strong> Re: Workshop</p>\n<p>Hi, Barbara! I have enrolled you in your requested workshop. The first session is scheduled for December 18 at 1 p.m. However, please arrive at least 10 minutes early to receive your workshop materials. Your workshop will be held in the same location at the Kilwin City Library as the literacy workshop you attended last summer.</p>\n<p>Laptop computers are not needed for the workshop, but participants are welcome to bring one. If you are willing to have your work reviewed, we encourage you to bring some samples as well, but please limit these to a few short selections.</p>\n<p>Please let me know if you have any other questions!</p>\n<p>Sincerely,<br />\nLola Nicholson<br />\nOutreach Coordinator<br />\nSouthern Ohio Writers' Guild</p>\n</div></section></div>"};const KEY='toeic-practice-101-200-v1';let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};let mode='all',index=0;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function filtered(){return QS.filter(q=>($('#part').value==='all'||q.part===$('#part').value)&& (mode==='all'||mode==='missed'&&records[q.id]?.correct===false||mode==='unanswered'&&!records[q.id]))}function current(){const a=filtered();index=Math.max(0,Math.min(index,a.length-1));return a[index]}function render(){const total=Object.values(records).filter(v=>v.correct!==null),right=total.filter(v=>v.correct),wrong=total.filter(v=>!v.correct);$('#done').textContent=Object.keys(records).length;$('#right').textContent=right.length;$('#wrong').textContent=wrong.length;$('#accuracy').textContent=(total.length?Math.round(right.length/total.length*100):0)+'%';const q=current(),arr=filtered();if(!q){$('#quiz').innerHTML='<p>這個篩選條件下沒有題目。</p>'}else{const r=records[q.id];const group=q.group?GROUP_HTML[q.group]:'';let result=r?'<section class="feedback explanation" aria-live="polite"><div class="answer-status">'+(r.correct?'✅ 回答正確':'❌ 回答錯誤')+'</div><div class="correct-answer">正確答案：<strong>('+q.answer+') '+esc(q.choices['ABCD'.indexOf(q.answer)])+'</strong></div><div class="answer-reason"><strong>解析說明</strong><p>'+esc(q.explanation)+'</p></div>'+(q.needsReview?'<p class="review-warning">⚠️ 此題原始題目有疑義或內容不全，暫以提供的答案顯示，建議核對原題。</p>':'')+'</section>':'';$('#quiz').innerHTML='<div class="head"><h2>Part '+q.part+' · TOEIC Reading</h2><span class="tag">第 '+(index+1)+' / '+arr.length+' 題</span></div>'+group+'<p class="stem"><strong class="stem-number">'+q.id+'.</strong> '+esc(q.stem)+'</p><div class="answers">'+q.choices.map((v,i)=>{let letter='ABCD'[i],cls=r&&q.answer===letter?' correct':r&&r.choice===letter&&r.correct===false?' wrong':'';return '<button class="choice'+cls+'" data-choice="'+letter+'" '+(r?'disabled':'')+'><b>('+letter+')</b> '+esc(v)+'</button>'}).join('')+'</div>'+result;document.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>answer(q,btn.dataset.choice))}$('#prev').disabled=index===0||!arr.length;$('#next').disabled=index>=arr.length-1||!arr.length;$('#numbers').innerHTML=QS.filter(q=>$('#part').value==='all'||q.part===$('#part').value).map(q=>'<button class="number '+(q.id===current()?.id?'current ':'')+(records[q.id]?.correct===true?'right':records[q.id]?.correct===false?'bad':'')+'" data-id="'+q.id+'">'+q.id+'</button>').join('');document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=()=>{mode='all';setTabs();index=filtered().findIndex(q=>q.id===Number(btn.dataset.id));render()})}function answer(q,letter){if(records[q.id])return;records[q.id]={choice:letter,correct:q.answer?q.answer===letter:null,at:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(records));render()}function setTabs(){['all','missed','unanswered'].forEach(s=>$('#'+s).classList.toggle('active',mode===s))}['all','missed','unanswered'].forEach(s=>$('#'+s).onclick=()=>{mode=s;index=0;setTabs();render()});$('#part').onchange=()=>{index=0;render()};$('#prev').onclick=()=>{index--;render()};$('#next').onclick=()=>{index++;render()};$('#reset').onclick=()=>{if(confirm('確定清除所有作答紀錄嗎？')){records={};localStorage.removeItem(KEY);mode='all';index=0;setTabs();render()}};const CSV_HEADER=['題號','Part','作答選項','正確答案','答題結果','作答時間'];
function csvCell(x){const t=String(x??'');return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function parseCsv(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quotes=false;for(let i=0;i<text.length;i++){let c=text[i];if(quotes){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quotes=false;else field+=c}else if(c==='"')quotes=true;else if(c===','){row.push(field);field=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(quotes)throw Error('CSV 引號未關閉');row.push(field);if(row.some(x=>x!==''))rows.push(row);return rows}
$('#export').onclick=()=>{const rows=[CSV_HEADER];for(const q of QS){const r=records[q.id];if(!r)continue;rows.push([q.id,q.part,r.choice,q.answer,r.correct===true?'正確':r.correct===false?'錯誤':'未核定',r.at||''])}const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toeic-作答紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#importCsv').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCsv(await file.text());if(!rows.length||rows[0].slice(0,6).join('|')!==CSV_HEADER.join('|'))throw Error('欄位格式不符，請使用本網站匯出的 CSV');const incoming={};for(let i=1;i<rows.length;i++){const r=rows[i],id=Number(r[0]),q=QS.find(x=>x.id===id),choice=(r[2]||'').trim();if(r.length<6||!q||!/[A-D]/.test(choice)||choice.length!==1||String(q.part)!==r[1].trim())throw Error('第 '+(i+1)+' 列的題號、Part 或選項有誤');if(r[3].trim()!==q.answer)throw Error('第 '+(i+1)+' 列答案版本不同，已停止匯入');incoming[id]={choice,correct:q.answer?choice===q.answer:null,at:r[5]||''}}const count=Object.keys(incoming).length;if(!confirm('CSV 有 '+count+' 筆有效作答紀錄。匯入後會覆蓋相同題號的現有作答，其餘題目保留。是否繼續？'))return;records={...records,...incoming};localStorage.setItem(KEY,JSON.stringify(records));mode='all';index=0;setTabs();render();alert('已成功匯入 '+count+' 筆紀錄。')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};render();
