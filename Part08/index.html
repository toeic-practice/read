</style></head><body><main class="shell"><section id="accountToolbar" class="panel" style="margin:0 0 14px"><div class="account-line"><label for="accountCode"><strong>使用者代號</strong></label><input id="accountCode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="自行輸入 4 位代號"><button id="connectCode" type="button">載入紀錄</button><button id="leaveCode" type="button" hidden>退出雲端模式</button><a class="home-link" href="../index.html" title="返回 TOEIC 練習中心首頁">🏠 回首頁</a><a class="exam-link" href="exam.html" title="前往第八回擬真模擬考（100 題計時測驗）">📝 擬真試題</a></div><p id="cloudNotice" role="status" class="small">未輸入代號：使用本機暫存。</p></section><header><h1>TOEIC 多益線上練習｜第八回</h1></header><section class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="right">0</b><span>答對</span></div><div class="stat"><b id="wrong">0</b><span>答錯</span></div><div class="stat"><b id="accuracy">0%</b><span>正確率</span></div></section><div class="toolbar"><select id="part"><option value="all">全部 Part</option><option value="5">Part 5</option><option value="6">Part 6</option><option value="7">Part 7</option></select><button id="all" class="active">全部題目</button><button id="missed">錯題專項練習 <span id="drillCount"></span></button><button id="starred">★ 星號題目</button><button id="overview">錯題總覽</button><button id="excerptsView" type="button">文字摘錄</button><button id="exportWrong">匯出錯題</button><button id="export">匯出作答 CSV</button><label class="import-button" for="importCsv">匯入作答 CSV</label><input id="importCsv" type="file" accept=".csv,text/csv" hidden><button id="reset">重新作答</button></div><div class="answer-pref"><label for="explainMode">作答後解析：</label><select id="explainMode" aria-label="選擇答題後解析開啟方式"><option value="auto">自動展開</option><option value="manual">點擊展開</option></select><span>解析依第八回答案詳解整理；閱讀文章可切換中英文全文</span></div><section id="drillTools" class="panel" hidden><div class="drill-toolbar"><strong>錯題專項練習</strong><span id="drillInfo"></span><button type="button" id="drillRestart">重新練習全部錯題</button><button type="button" id="drillRemove">手動移除此題</button></div><p class="small">錯題不會因答對而消失；作答後立即顯示正解與詳細解析。此模式完全不修改正式測驗的作答紀錄。</p></section><section id="wrongOverview" class="panel" hidden></section><section id="excerptOverview" class="panel" hidden></section><section id="quiz"></section><button type="button" id="selectionSave" aria-label="儲存選取的文字摘錄">✎ 儲存摘錄</button><div class="nav"><button id="prev">← 上一題</button><button id="next">下一題 →</button></div><section class="panel"><div class="head"><b>題號總覽</b><span class="small">綠色答對・紅色答錯・★ 已標記</span></div><div id="numbers" class="numbers"></div></section></main><script>
const DATA={"questions":[{"id":101,"part":5,"stem":"According to the news report, Philby Corporation ______ a new office in Utah at present.","choices":["is building","to build","will build","building"],"answer":"A","explanation":"正確答案：(A) is building。 句子（Philby Corporation ~ present）裡缺少動詞，所以動詞 (A) 和 (C) 是可能的答案。因為有表示現在時間的詞語（at present），所以表示現在進行中的事的現在進行式 (A) is building 是正確答案。未來式 (C) 表示未來發生的事、對於未來狀況的推測，或者意志。to 不定詞 (B) 和現在分詞 (D) 不能用在動詞位置。"},{"id":102,"part":5,"stem":"Ms. Wendt wanted to meet Mr. Andrews in person but had to call ______ instead.","choices":["his","himself","him","he"],"answer":"C","explanation":"正確答案：(C) him。 空格是動詞（call）的受詞，所以反身代名詞 (B) 和受格人稱代名詞 (C) 是可能的答案。因為要表達「Wendt 小姐想要親自見 Andrews 先生，但不得不改為打電話給他」，所以受格人稱代名詞 (C) him 是正確答案。反身代名詞 (B) 當受詞，表示和主詞相同的人或事物，而這裡的主詞（Ms. Wendt）和受詞並不是同一個人，所以不對。所有格人稱代名詞 (A) 和主格人稱代名詞 (D) 不能當受詞。就算把 (A) 當成所有代名詞「他的東西」，意思變成「Wendt 小姐不得不打電話給他的東西」，也說不通。"},{"id":103,"part":5,"stem":"Ms. Myers trained all the new staff and ______ offered to mentor anyone needing extra help.","choices":["well","both","even","too"],"answer":"C","explanation":"正確答案：(C) even。 因為要表達「除了訓練所有新員工以外，甚至還主動提議指導任何需要額外幫助的人」，所以在單字或片語前面做強調的 (C) even（甚至）是正確答案。副詞 (A) well（很好地），通常在動詞後面做修飾，而在這裡意思會變成「很好地提議去指導」，也不恰當。副詞 (D) too（太……）通常在形容詞或副詞前面做強調，或是在句尾表示「也……」的意思。代名詞 (B) both（兩者都）在這個句子裡沒有適當的指稱對象。"},{"id":104,"part":5,"stem":"The contractor asked that payment for his services be ______ by Friday afternoon.","choices":["making","made","make","have made"],"answer":"B","explanation":"正確答案：(B) made。 空格在 be 動詞（be）後面，所以能形成進行式的 -ing 形 (A) 和被動態的 p.p. 形 (B) 是可能的答案。因為要表達「付款被支付」的意思，所以能和空格前的 be 動詞形成被動態的動詞 make（做……）p.p. 形 (B) made 是正確答案。-ing 形構成現在進行式後，意思會變成「付款正在做……」，所以不對。動詞原形 (C) 和包含動詞 have 的原形的 (D) 不能接在 be 動詞後面。另外，請記得 suggest（建議）、ask（要求）、demand（要求）等等表示提議、要求、義務的動詞後面接 that 子句當受詞時，that 子句會使用動詞原形。"},{"id":105,"part":5,"stem":"The Portland Bearcats have ______ qualified to play in the regional hockey championship.","choices":["narrowed","narrowness","narrowly","narrow"],"answer":"C","explanation":"正確答案：(C) narrowly。 可以修飾動詞（have qualified）的是副詞，所以副詞 (C) narrowly（勉強地，差一點）是正確答案。動詞或過去分詞 (A)、名詞 (B)、動詞或形容詞 (D) 都不能修飾動詞。另外，請記得副詞修飾完成式（have + p.p.）時，副詞會出現在 have 和 p.p. 之間或後面。"},{"id":106,"part":5,"stem":"The city's ______ population growth has resulted in a scarcity of available housing.","choices":["rapid","tight","tedious","affluent"],"answer":"A","explanation":"正確答案：(A) rapid。 句意是「迅速的人口成長造成住宅缺乏」，所以形容詞 (A) rapid（迅速的）是正確答案。(B) tight 表示「緊的」，(C) tedious 表示「冗長乏味的」，(D) affluent 表示「富裕的」。另外，請記得 result in（導致……）這個慣用表達方式。"},{"id":107,"part":5,"stem":"______ her many achievements as an opera singer, Gloria Donahue has not yet won any major awards.","choices":["Next to","Far from","Because of","In spite of"],"answer":"D","explanation":"正確答案：(D) In spite of。 因為要表達「儘管有許多身為歌劇歌手的成就，但還沒得過任何重大獎項」，所以表讓步的介系詞 (D) In spite of（儘管有……）是正確答案。(A) Next to 表示位置「在……旁」。(B) Far from 表示「遠離……，完全不是……」，(C) Because of 表示理由「因為……」。"},{"id":108,"part":5,"stem":"The travel agency's ______ for increasing sales is to post customer testimonials on its Web site.","choices":["landmark","portfolio","strategy","approval"],"answer":"C","explanation":"正確答案：(C) strategy。 句意是「旅行社增加銷售的策略是在網站上刊登顧客的見證文」，所以名詞 (C) strategy（策略）是正確答案。(A) landmark 表示「地標，重大事件」，(B) portfolio 表示「作品集，投資組合」，(D) approval 表示「批准，贊成」。"},{"id":109,"part":5,"stem":"The ______ of the Rolstein Literary Prize will be selected by a number of literature enthusiasts.","choices":["received","receipt","recipient","receiving"],"answer":"C","explanation":"正確答案：(C) recipient。 空格在定冠詞（The）和介系詞（of）之間，所以名詞 (B) 和 (C)、功能相當於名詞的動名詞 (D) 是可能的答案。因為要表達「文學獎的得獎者將由一些文學熱愛者選出」，所以人物名詞 (C) recipient（接受者）是正確答案。事物名詞 (B) receipt（收據）和動名詞 (D) receiving（收到）會使意思變成「收據／收到將由一些文學熱愛者選出」，所以不對。動詞或過去分詞 (A) 不能用在名詞的位置。"},{"id":110,"part":5,"stem":"Mr. McGuire needs only one more issue of a rare comic book series to have a ______ set.","choices":["completion","complete","completer","completeness"],"answer":"B","explanation":"正確答案：(B) complete。 空格修飾後面的名詞（set），所以答案是形容詞 (B) complete（完整的）。名詞 (A)、(C)、(D) 不能修飾這裡的名詞。"},{"id":111,"part":5,"stem":"Unable to keep up with rising costs, many airlines have opted to ______ the in-flight meal service on domestic flights.","choices":["recover","eliminate","calculate","recognize"],"answer":"B","explanation":"正確答案：(B) eliminate。 句意是「由於無法跟上逐漸上升的成本，許多航空公司選擇去除國內航班的飛機餐服務」，所以 (B) eliminate（排除）是正確答案。(A) recover 表示「恢復，找回」，(C) calculate 表示「計算」，(D) recognize 表示「認出，認可」。"},{"id":112,"part":5,"stem":"Conference participants can receive a complimentary lunch by ______ the voucher in their welcome package.","choices":["redeem","redeeming","redeemed","redeems"],"answer":"B","explanation":"正確答案：(B) redeeming。 空格前面有介系詞（by），所以能當介系詞受詞的動詞 redeem（兌換〔優惠券等〕）轉為動名詞的形態 (B) redeeming 是正確答案。動詞 (A) 和 (D)、動詞或過去分詞 (C) 不能當介系詞的受詞。"},{"id":113,"part":5,"stem":"Factory robots have made it possible to carry out manufacturing tasks more quickly and ______.","choices":["assertively","statistically","accurately","intentionally"],"answer":"C","explanation":"正確答案：(C) accurately。 句意是「機器人使得更快速且精確地執行製造工作成為可能」，所以副詞 (C) accurately（精確地）是正確答案。(A) assertively 表示「果斷地」，(B) statistically 表示「統計上」，(D) intentionally 表示「有意地，故意」。"},{"id":114,"part":5,"stem":"In the event that the competition results in a tie, the prize money will be divided ______ both contestants.","choices":["within","off","along","between"],"answer":"D","explanation":"正確答案：(D) between。 因為要表達「獎金會被平分給兩位參賽者」，所以表示兩個對象間的位置或關係的介系詞 (D) between（在……之間）是正確答案。(A) within（在……之內）看中文翻譯似乎說得通，但它其實是表示期間或場所的範圍，所以不對。(B) off 表示位置「離開……」。(C) along 表示方向「沿著……」。就算把 off 和空格前面的動詞 divide 結合成動詞片語 divide off（把……分隔開）也不行，因為形成被動態（will be divided off）之後，就沒有可以接後面的名詞（both contestants）當受詞的成分了。"},{"id":115,"part":5,"stem":"Passengers ______ luggage in the airport's arrivals area should note that many bags look alike.","choices":["claiming","claim","claims","claimed"],"answer":"A","explanation":"正確答案：(A) claiming。 這個句子已經有具備主詞（Passengers）、動詞（should note）和受詞（that many bags look alike）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - luggage ~ arrival area 是修飾性的語句。修飾部分是修飾空格前面的名詞（Passengers），所以能引導修飾語句、在名詞後面做修飾的現在分詞 (A) 和過去分詞 (D) 是可能的答案。因為空格後面有受詞（luggage），而且被修飾的名詞（Passengers）和分詞在意義上是主動的關係「乘客領取行李」，所以動詞 claim（認領）的現在分詞 (A) claiming 是正確答案。過去分詞 (D) claimed 表示被動意義，而且後面不能接受詞，所以不對。動詞 (B) 和 (C) 不能引導修飾語句。"},{"id":116,"part":5,"stem":"Mr. Chen has nearly 30 years of advertising experience, making him a ______ professional in his field.","choices":["seasons","seasonal","seasoned","seasonally"],"answer":"C","explanation":"正確答案：(C) seasoned。 空格修飾後面的名詞（professional），所以形容詞 (B) 和 (C) 是可能的答案。因為要表達「將近 30 年的廣告經驗，使他成為自己領域中經驗豐富的專家」，所以形容詞 (C) seasoned（經驗豐富的）是正確答案。如果使用 (B) seasonal（季節性的），意思會變成「將近 30 年的廣告經驗，使他成為自己領域中季節性的專家」，所以不對。名詞或動詞 (A)、副詞 (D) 不能修飾名詞。"},{"id":117,"part":5,"stem":"Emperor Fabrics has signed a number of profitable ______ since Ms. Shane took over as a company director.","choices":["quotes","deals","petitions","applications"],"answer":"B","explanation":"正確答案：(B) deals。 句意是「Emperor Fabrics 公司簽了一些有利潤的協議」，所以名詞 (B) deals（協議）是正確答案。另外，請記得 sign a deal（簽定協議）這個慣用表達方式。(A) quote 表示「報價，引用」。(C) petition 表示「請願（書）」。(D) application 表示「申請（書），應徵」。"},{"id":118,"part":5,"stem":"The new bridge must be ______ enough to withstand the frequent storms that pass through the area.","choices":["severe","separate","genuine","sturdy"],"answer":"D","explanation":"正確答案：(D) sturdy。 句意是「新的橋必須夠堅固」，所以形容詞 (D) sturdy（堅固的）是正確答案。(A) severe 表示「嚴重的，嚴厲的」。(B) separate 表示「個別的，分開的」。(C) genuine 表示「真正的」。"},{"id":119,"part":5,"stem":"In ______ with the mall's policies, security guards will be given an access badge once training is complete.","choices":["compliance","comply","complied","complies"],"answer":"A","explanation":"正確答案：(A) compliance。 空格在介系詞（In）和介系詞（with）之間，所以名詞 (A) compliance（遵守，依從）是正確答案。另外，請記得 compliance 經常以 in compliance with（遵守，依照……）的形式使用。動詞 (B) 和 (D)、動詞或過去分詞 (C) 不能用在名詞的位置。"},{"id":120,"part":5,"stem":"The town of Hamilton has seven parks, all of ______ have hosted outdoor concerts at one time or another.","choices":["them","those","which","theirs"],"answer":"C","explanation":"正確答案：(C) which。 這個句子已經有具備主詞（The town of Hamilton）、動詞（has）和受詞（seven parks）的完整子句，所以 all of - - - - - - - - - - - - - - - - - - - - at one time or another 是修飾性的語句。因為修飾部分的開頭有數量表達方式 all of，所以能接在數量表達方式後面，同時引導修飾部分的受格關係代名詞 (C) which 是正確答案。受格人稱代名詞 (A)、指示代名詞 (B)、所有代名詞 (D) 都不能引導修飾語句。"},{"id":121,"part":5,"stem":"______ the annual Media Conference in Athens, most downtown hotels are fully booked.","choices":["Due to","As soon as","Besides","Such as"],"answer":"A","explanation":"正確答案：(A) Due to。 這個句子已經有具備主詞（most downtown hotels）和動詞（are ~ booked）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - ~ Athens 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表達「由於在雅典舉行的年度媒體會議，大部分的市區飯店都預約滿了」，所以介系詞 (A) Due to（由於……）是正確答案。(C) Besides 表示「除了……還有」，(D) Such as 表示「例如……」。 (B) As soon as（一……就）引導的是修飾子句而不是片語。"},{"id":122,"part":5,"stem":"Mr. Morgan ______ for an electrical installation job at Cuthright Tower by a former employer who was pleased with his work.","choices":["recommends","has recommended","was recommended","is recommending"],"answer":"C","explanation":"正確答案：(C) was recommended。 空格後面有使用於被動態的 by，而且句意是「Morgan 先生受推薦擔任電力設備安裝工作」，所以被動態 (C) was recommended 是正確答案。另外，請注意 recommend（推薦）經常以 recommend A for B（把 A 推薦給 B）的形式使用，但這個句子的動詞 recommend 使用被動態，所以原本的受詞（Mr. Morgan）變成了主詞。"},{"id":123,"part":5,"stem":"Level Field Landscaping has recently been ______ by the city for disposing of yard waste improperly.","choices":["commenced","accelerated","measured","fined"],"answer":"D","explanation":"正確答案：(D) fined。 句意是「因為垃圾處理不當而遭到罰款」，所以動詞 fine（罰款）的 p.p. 形 (D) fined 是正確答案。(A) commence 表示「開始」，(B) accelerate 表示「加速」，(C) measure 表示「測量」。"},{"id":124,"part":5,"stem":"The assembly plant is on schedule to exceed its quota of tractors, ______ it did last month.","choices":["just as","in fact","thus","until"],"answer":"A","explanation":"正確答案：(A) just as。 這個句子已經有具備主詞（The assembly plant）、動詞（is）和介系詞片語（on schedule）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - it ~ last month 是修飾性的語句。修飾部分有動詞（did），所以能引導修飾子句的副詞子句連接詞 (A) 和 (D) 是可能的答案。因為要表達「就像上個月一樣超過曳引機的配額」，所以副詞子句連接詞 (A) just as（就像……一樣）是正確答案。(D) until 表示時間點「到……為止」。連接副詞 (B) in fact（事實上）和 (C) thus（因此）不能引導修飾子句。另外，請記得 be 動詞使用第 1 類句型（S + V）的時候，要有介系詞片語等副詞性質的修飾語句，才是完整的句子。"},{"id":125,"part":5,"stem":"In her inspirational talk, Denise Camic argues that the ______ a company is, the greater its success.","choices":["more creative","creativity","creative","most creative"],"answer":"A","explanation":"正確答案：(A) more creative。 因為要表達「公司越有創意就越成功」，所以能形成兩個子句（the ~ company is，the greater ~ success）對等連接句型「the + 比較級……，the + 比較級～」的比較級 (A) more creative 是正確答案。名詞 (B)、原級形容詞 (C)、最高級形容詞 (D) 不能用在這裡的比較級位置。"},{"id":126,"part":5,"stem":"In order to ensure that information is stored ______, files in the database cannot be accessed without a password.","choices":["productively","confidentially","unanimously","voluntarily"],"answer":"B","explanation":"正確答案：(B) confidentially。 句意是「為了確保資訊被保密地儲存，資料庫裡的檔案沒有密碼無法存取」，所以副詞 (B) confidentially（秘密地，機密地）是正確答案。(A) productively 表示「有生產力地」，(C) unanimously 表示「全體一致地」，(D) voluntarily 表示「自發性地」。"},{"id":127,"part":5,"stem":"During his acceptance speech for the Businessperson of the Year Award, Mr. Gordon expressed ______ for his dedicated team members.","choices":["commitment","interest","tribute","appreciation"],"answer":"D","explanation":"正確答案：(D) appreciation。 句意是「對專注於工作的團隊成員表達了感謝」，所以能和空格後面的介系詞（for）組成 appreciation for（對……的感謝）的名詞 (D) appreciation（感謝）是正確答案。(A) commitment 表示「奉獻，投入」，常搭配介系詞 to 使用。(B) interest 表示「興趣」，但要表達「對……的興趣」時，通常搭配介系詞 in 使用。(C) tribute 表示「讚揚，敬意」，意思似乎說得通，但要表達「讚揚，稱頌……」時，應該使用 pay tribute to 的句型。"},{"id":128,"part":5,"stem":"Visitors are not allowed in certain sections of the building, ______ are they permitted to wander around without a guide.","choices":["so","during","nor","though"],"answer":"C","explanation":"正確答案：(C) nor。 空格後面的子句（are they ~ guide）中，主詞（they）和動詞（are）倒裝，所以能引導倒裝句的 (A) 和 (C) 是可能的答案。空格前面的句子（Visitors ~ building）是有否定詞（not）的否定句，所以能在有否定詞的子句後面引導倒裝句的 (C) nor（也不……）是正確答案。(A) so 雖然也可以引導倒裝句，但是用在肯定句後面，表示「也一樣……」，所以不對。介系詞 (B) during（在……期間）和副詞 (D) though（雖然）不能引導倒裝句。"},{"id":129,"part":5,"stem":"Rand's Organic Farm was able to increase its customer base ______ a radio advertisement.","choices":["in common with","in addition to","on behalf of","by means of"],"answer":"D","explanation":"正確答案：(D) by means of。 句意是「Rand's 有機農場藉由一支廣播廣告增加了顧客群」，所以表示手段的介系詞片語 (D) by means of（藉由……）是正確答案。(A) in common with 表示「與……共同」，(B) in addition to 表示「除了……以外」，(C) on behalf of 表示「代表……」。"},{"id":130,"part":5,"stem":"Several of the call center employees received outstanding annual evaluations and got a ______ as a result.","choices":["proximity","raise","setback","premiere"],"answer":"B","explanation":"正確答案：(B) raise。 句意是「幾位客服中心員工獲得了傑出的年度評價，並且因此獲得了加薪」，所以名詞 (B) raise（加薪）是正確答案。(A) proximity 表示「接近」，(C) setback 表示「挫折」，(D) premiere 表示「首映」。"},{"id":131,"part":6,"stem":"Choose the best answer for blank 131 in the passage.","choices":["nearest","nearer","nearly","nearby"],"answer":"C","explanation":"正確答案：(C) nearly。 空格修飾數量形容詞（15），所以副詞 (C) 和 (D) 是可能的答案。因為要表達「這個月的辦公室公用事業帳單比去年同月貴將近 15%」，所以副詞 (C) nearly（將近……）是正確答案。(D) nearby 表示位置「在附近」。形容詞的最高級 (A) 和比較級 (B) 不能修飾形容詞。就算把 near 當成「接近」的意思，使用最高級 (A) 和比較級 (B) 的句意變成「（物理位置上）最接近／比較接近 15%」，也不恰當。","group":"131-134"},{"id":132,"part":6,"stem":"Choose the best answer for blank 132 in the passage.","choices":["implementing","will implement","will have implemented","has implemented"],"answer":"D","explanation":"正確答案：(D) has implemented。 空格所在的句子缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。句意是「公司實施一些節省費用措施」，因為只看空格所在的句子無法判斷哪個動詞時態才正確，所以需要參考前後或整篇文章的內容。上一句請員工注意，這個月的辦公室公用事業帳單比去年同月貴將近 15%，而下一句提到措施包括在去年秋天整修時安裝了能源效率佳的燈和窗戶，由此可知「實施一些節省費用措施」是從過去持續到現在的事。因此，表達過去發生的事到現在仍有影響，或者剛完成的事的現在完成式 (D) has implemented 是正確答案。未來式 (B) 表示未來發生的事、對未來狀況的推測，或者意志。未來完成式 (C) 表示在未來特定時間點之前發生的行為，會在未來的這個時間點完成。動名詞或現在分詞 (A) 不能用在動詞位置。","group":"131-134"},{"id":133,"part":6,"stem":"Choose the best answer for blank 133 in the passage.","choices":["sensible","honest","impartial","tolerant"],"answer":"A","explanation":"正確答案：(A) sensible。 句意是「我想提醒各位要＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到只要有一點理性和好的判斷，就能採取措施來減少花費，所以這裡應該是想提醒員工了解問題，形容詞 (A) sensible（明智的，覺知到的）是正確答案。(B) honest 表示「誠實的」，(C) impartial 表示「公正的」，(D) tolerant 表示「寬容的」。","group":"131-134"},{"id":134,"part":6,"stem":"Choose the best answer for blank 134 in the passage.","choices":["Given the opportunity, I am sure many of you would volunteer.","If in doubt, simply refer to the meeting agenda that's posted online.","To start, we can all make sure to turn off anything that's not in use.","As a result, we will no longer qualify for our current service discount."],"answer":"C","explanation":"正確答案：(C) To start, we can all make sure to turn off anything that's not in use.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 With just a bit of rationality and good judgment, I am confident we can take steps to reduce our expenses. 提到，只要有一點理性和好的判斷，就能採取措施來減少花費，而下一句 if you have any other ideas for saving energy, please let me know 則說，還有其他節能的主意請告知，所以空格的內容應該和減少花費的方法有關，(C) To start, we can all make sure to turn off anything that's not in use 是正確答案。","group":"131-134"},{"id":135,"part":6,"stem":"Choose the best answer for blank 135 in the passage.","choices":["ultimate","consecutive","controversial","introductory"],"answer":"D","explanation":"正確答案：(D) introductory。 句意是「這系列的第一集將在 7 月 15 日播出」，所以表示「入門的，介紹性的」的形容詞 (D) introductory 是正確答案。(A) ultimate 表示「最終的」，(B) consecutive 表示「連續的」，(C) controversial 表示「有爭議的」。","group":"135-138"},{"id":136,"part":6,"stem":"Choose the best answer for blank 136 in the passage.","choices":["review","workshop","episode","poster"],"answer":"C","explanation":"正確答案：(C) episode。 句意是「接下來的每一＿＿都將聚焦於單一的小說上」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到，這系列的第一集將在 7 月 15 日播出，而空格的上一句則提到第一集將討論這個類型最近受歡迎的情況，並探討歷史與小說之間有趣的關係，所以接下來會聚焦於單一小說的應該是其他的集數，正確答案是名詞 (C) episode（一集）。(A) review 表示「評論」，(B) workshop 表示「工作坊，研習會」，(D) poster 表示「海報」。","group":"135-138"},{"id":137,"part":6,"stem":"Choose the best answer for blank 137 in the passage.","choices":["Subscribers will have access to already archived shows.","The books that are chosen will all be new releases.","Thus, electronic versions have gained popularity.","Listeners were invited to call in and ask questions."],"answer":"B","explanation":"正確答案：(B) The books that are chosen will all be new releases.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Each subsequent (episode) will focus on a single novel. 提到，接下來的每一集都將聚焦於單一的小說上，所以空格中的內容應該和每一集討論的小說有關，(B) The books that are chosen will all be new releases 是正確答案。","group":"135-138"},{"id":138,"part":6,"stem":"Choose the best answer for blank 138 in the passage.","choices":["individualistic","individuality","individual","individually"],"answer":"C","explanation":"正確答案：(C) individual。 空格被前面的指示形容詞（this）修飾，所以名詞 (B) 和 (C) 是可能的答案。因為要表達「這個人主演過幾部電影」，所以答案是人物名詞 (C) individual（個人）。如果使用 (B) individuality（個性，特徵）的話，意思會變成「這個個性主演過幾部電影」，所以不對。形容詞 (A) 和副詞 (D) 不能用在名詞位置。","group":"135-138"},{"id":139,"part":6,"stem":"Choose the best answer for blank 139 in the passage.","choices":["lasted","lasts","has lasted","to last"],"answer":"B","explanation":"正確答案：(B) lasts。 空格所在的句子缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。句意是「休假持續到星期五」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句問假期過得怎麼樣，而下一句說想知道對方是否能在那天（星期五）回來上班，由此可知假期是現在持續到未來的星期五，所以也能表示未來的現在式 (B) lasts 是正確答案。過去式 (A) 表示已經結束的過去動作或狀態，現在完成式 (C) 則用來表達過去開始、剛剛完成的事，或者過去發生的事影響持續到現在。to 不定詞 (D) 不能用在動詞的位置。","group":"139-142"},{"id":140,"part":6,"stem":"Choose the best answer for blank 140 in the passage.","choices":["They will do all of the revisions again from the beginning.","Apparently, doing that would be against our corporate regulations.","That is the day when our contractor agreement expires.","This is surprising as they seemed happy with it last week."],"answer":"D","explanation":"正確答案：(D) This is surprising as they seemed happy with it last week.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Nektar Beverages suddenly wants us to make some changes to the advertisement it commissioned 提到，Nektar Beverages 公司突然要求對於它委託的廣告做些改變，所以空格的內容應該和 Nektar Beverages 公司所要求的廣告修改有關，(D) This is surprising as they seemed happy with it last week 是正確答案。(A) 雖然也和變更有關，但這句話「他們」（Nektar Beverages）進行修改，而事實上是廣告公司 Advert X 要進行修改才對。","group":"139-142"},{"id":141,"part":6,"stem":"Choose the best answer for blank 141 in the passage.","choices":["compensator","compensate","compensating","compensation"],"answer":"B","explanation":"正確答案：(B) compensate。 空格前面有 to，而且句意是「為了補償你，我們會付你標準加班費」，所以能和空格前面的 to 形成 to 不定詞的動詞原形 (B) compensate（補償）是正確答案。名詞 (A) 和 (D)、動名詞或現在分詞 (C) 不能用在動詞原形的位置。","group":"139-142"},{"id":142,"part":6,"stem":"Choose the best answer for blank 142 in the passage.","choices":["require","record","provide","prohibit"],"answer":"C","explanation":"正確答案：(C) provide。 句意是「也會＿＿額外的一天休假」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到會付標準加班費，所以這一句應該也是補償的方式之一，所以動詞 (C) provide（提供）是正確答案。(A) require 表示「要求，需要」，(B) record 表示「記錄」，(D) prohibit 表示「禁止」。 ---","group":"139-142"},{"id":143,"part":6,"stem":"Choose the best answer for blank 143 in the passage.","choices":["Customers will now be able to place orders online.","This increase is a result of growing demand worldwide.","The market is already too crowded to open another branch.","The company will be opening a satellite branch in London."],"answer":"D","explanation":"正確答案：(D) The company will be opening a satellite branch in London.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 GEOnet Solutions has announced that it will be extending its reach overseas. 提到，GEOnet Solutions 公司宣布將拓展業務範圍至海外，所以空格的內容應該和 GEOnet Solutions 公司的海外擴張有關，(D) The company will be opening a satellite branch in London 是正確答案。","group":"143-146"},{"id":144,"part":6,"stem":"Choose the best answer for blank 144 in the passage.","choices":["pioneering","pioneer","pioneered","pioneers"],"answer":"B","explanation":"正確答案：(B) pioneer。 能和空格前面的指示形容詞（this）連用，並且可以當單數動詞（has created）主詞的單數名詞 (B) pioneer（先驅）是正確答案。動名詞或現在分詞 (A) 會使意思變成「這個技術開發的先驅行為，創造了創新的方式」，而如果當成分詞的話，也無法視為句子的主詞。動詞或過去分詞 (C) 不能用在主詞位置。複數名詞 (D) 不能搭配單數動詞或指示形容詞 this 使用。","group":"143-146"},{"id":145,"part":6,"stem":"Choose the best answer for blank 145 in the passage.","choices":["Notwithstanding","In fact","Meanwhile","Instead"],"answer":"B","explanation":"正確答案：(B) In fact。 空格和逗號一起出現在句子開頭的連接副詞位置，所以要掌握上一句和空格所在句子之間的關係，才能判斷答案。上一句提到這個技術開發先驅創造了利用地質工程學的創新方式，並且在這個領域實現了無數的進展，而空格所在的句子說沒有它的努力，數百萬人每天使用的資料收集系統與追蹤工具就不會存在，所以可以用來對上一句附加說明的 (B) In fact（事實上）是正確答案。(A) Notwithstanding 表示「儘管如此」，(C) Meanwhile 表示「與此同時」，(D) Instead 表示「取而代之」。","group":"143-146"},{"id":146,"part":6,"stem":"Choose the best answer for blank 146 in the passage.","choices":["experiment","relocation","policy","expansion"],"answer":"D","explanation":"正確答案：(D) expansion。 句意是「這次＿＿的主要目的是促進與倫敦技術中心的合作」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到 GEOnet Solutions 公司宣布將拓展業務範圍至海外，將在倫敦開設附屬分公司，而空格所在句子的下一句提到雙方相信它們的合作將對彼此有利，因此可知促進與倫敦技術中心合作的是海外擴張的行動，名詞 (D) expansion（擴張）是正確答案。(A) experiment 表示「實驗」，(B) relocation 表示「遷移」，(C) policy 表示「政策」。 ---","group":"143-146"},{"id":147,"part":7,"stem":"What is indicated about the challenge?","choices":["It will be repeated.","It was unsuccessful.","Its deadline was extended.","Its participants were anonymous."],"answer":"A","explanation":"正確答案：(A) It will be repeated.。 這是 Not/True 題型，要找出和關鍵詞語 the challenge 有關的內容，並且對照選項判斷答案。(A) 在 Thank you all for contributing to the monthly sales challenge. 的部分提到，要感謝所有人對每月銷售挑戰的貢獻，而 the executive team has decided to hold this initiative again in the future 的部分提到執行團隊已經決定未來再度舉辦這項企畫，符合選項敘述，所以 (A) 是正確答案。(B) 在 We acquired several new clients due to your hard work. 的部分提到由於大家的努力，而獲得了幾個新客戶，所以活動是成功的，不符合選項敘述。(C) 和 (D) 在文章裡沒有提到。","group":"147-148"},{"id":148,"part":7,"stem":"What does Ms. Seiko want her staff members to do?","choices":["Evaluate team members' performances","Recommend some potential rewards","Submit a preferred date for some time off","Send some personal documents by e-mail"],"answer":"B","explanation":"正確答案：(B) Recommend some potential rewards。 這是問 Seiko 小姐希望員工做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Seiko want her staff members to do 有關的部分是 Please e-mail me some new prize ideas，這部分請員工用電子郵件寄一些新的獎品意見，所以 (B) 是正確答案。","group":"147-148"},{"id":149,"part":7,"stem":"What is NOT mentioned about members of Cole Theater?","choices":["They receive a reduced rate at night.","They have to renew a card once a year.","They may redeem points for snacks.","They are required to pay a monthly fee."],"answer":"D","explanation":"正確答案：(D) They are required to pay a monthly fee.。 這是 Not/True 題型，要找出和關鍵詞語 members of Cole Theater 有關的內容，並且對照選項判斷答案。(A) 在 10 percent discount for ~ evening ~ showings 的部分提到，可以得到晚間場次的 10% 折扣，符合選項敘述。(B) 在 Membership cards must be renewed after 12 months. 的部分提到，會員卡必須在 12 個月後更新，符合選項敘述。(C) 在 Free concession stand items ~ in exchange for reward points 的部分提到，可以用回饋點數免費兌換飲食攤位商品，符合選項敘述。(D) 在文章裡沒有提到，所以 (D) 是正確答案。","group":"149-150"},{"id":150,"part":7,"stem":"What is stated about Cole Theater?","choices":["It holds a local film festival.","It has installed new ticket machines.","It appeared in a television documentary.","It hosts visits by celebrities."],"answer":"D","explanation":"正確答案：(D) It hosts visits by celebrities.。 這是 Not/True 題型，要找出和關鍵詞語 Cole Theater 有關的內容，並且對照選項判斷答案。(A)、(B)、(C) 在文章裡沒有提到。(D) 在 Tickets to our exclusive movie premieres, which are attended by famous actors 的部分提到知名演員出席的獨家電影首映會門票，符合選項敘述，所以 (D) 是正確答案。","group":"149-150"},{"id":151,"part":7,"stem":"At 11:36 A.M., what does Mr. Pollard mean when he writes, \"I know you usually have a spare\"?","choices":["He needs a key to a property.","He was told about a coworker's routine.","He wants to borrow a car.","He is unable to visit a storage room."],"answer":"A","explanation":"正確答案：(A) He needs a key to a property.。 這一題問的是 Pollard 先生的訊息所表達的意圖，所以要掌握引用部分（I know you usually have a spare）前後文的情境。Pollard 先生說 I forgot the key to the apartment at 182 North Avenue.，表示自己忘了帶 North 大街 182 號公寓的鑰匙，並且接著說 I know you usually have a spare（我知道你通常會有備用鑰匙），對此 Connie Mills 回應 I do. Come get it anytime before noon.，表示自己的確有備用鑰匙，並且要 Pollard 先生在中午前去拿。因此，Pollard 先生要表達的意思是他需要建築物的鑰匙，(A) 是正確答案。","group":"151-152"},{"id":152,"part":7,"stem":"What does Ms. Mills ask Mr. Pollard to do?","choices":["Sweep a driveway outside a home","Meet with some potential clients","Turn off a security system","Park his vehicle on a street"],"answer":"D","explanation":"正確答案：(D) Park his vehicle on a street。 這是問 Mills 小姐要求 Pollard 先生做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Mills ask Mr. Pollard to do 有關的部分是 Mills 小姐所說的 please park around the corner. I saw a few empty parking spaces along the sidewalk there.，她在這部分要求在街角附近停車，並且提到那裡的人行道旁有幾個空著的停車位，所以 (D) 是正確答案。 ---","group":"151-152"},{"id":153,"part":7,"stem":"What is mentioned about Descending Cherub?","choices":["It was exhibited for about a year.","It was dropped while being moved.","It was sculpted by Ms. Hyman.","It was loaned to a museum."],"answer":"D","explanation":"正確答案：(D) It was loaned to a museum.。 這是 Not/True 題型，要找出和關鍵詞語 Descending Cherub 有關的內容，並且對照選項判斷答案。(A) 和 (C) 在文章裡沒有提到。(B) 在 Our staff were in the process of moving all the works in the outdoor sculpture garden ~. Unfortunately, they did not get to your statue in time. A strong wind caused it to fall from its pedestal 的部分提到，工作人員正在搬動戶外雕塑花園的所有作品，但沒有及時照顧到那件雕塑品（《Descending Cherub》），而一陣強風造成它從底座倒下來，不符合選項敘述。(D) 在 Descending Cherub, the statue you so generously lent us 的部分提到，《Descending Cherub》是 Jansen 先生大方出借給「我們」（Brugeri 美術館）的雕塑品，符合選項敘述，所以 (D) 是正確答案。","group":"153-154"},{"id":154,"part":7,"stem":"What has been included with the letter?","choices":["An entrance ticket to a gallery","Photographs of some damage","Insurance claim documents","A reimbursement check"],"answer":"B","explanation":"正確答案：(B) Photographs of some damage。 這是問這封信附上了什麼（What）的 wh- 問題。和題目的關鍵詞語 included with the letter 有關的部分是 I have enclosed some pictures of the broken area.，這部分提到附上了破損區域的一些照片，所以 (B) 是正確答案。","group":"153-154"},{"id":155,"part":7,"stem":"What is one purpose of the article?","choices":["To report on the state of a region's infrastructure","To provide details about the global steel industry","To give information about a country's exports","To announce the opening of a new factory"],"answer":"D","explanation":"正確答案：(D) To announce the opening of a new factory。 這一題問的是這篇文章的目的，所以要注意文章開頭的部分。Steel Works Inc. has begun operations at its new plant. 的部分提到，Steel Works 公司已經開始新工廠的營運，所以 (D) 是正確答案。","group":"155-157"},{"id":156,"part":7,"stem":"What does the article suggest about the plant in Rembau?","choices":["It no longer produces steel for local use.","It was taken over by a foreign company.","It formerly caused some harm to the environment.","It has begun manufacturing plastic products."],"answer":"A","explanation":"正確答案：(A) It no longer produces steel for local use.。 這是和題目關鍵詞語 the plant in Rembau 有關的推論問題。Its first mill in Rembau now exclusively exports its products to other Asian countries, though it once met almost half of Malaysia's steel demand. 的部分提到，位於 Rembau 的第一座煉鋼廠，現在只將產品出口到其他亞洲國家，雖然它曾經滿足馬來西亞將近一半的鋼鐵需求。由此可以推知，Rembau 的工廠現在已經不生產馬來西亞國內使用的鋼鐵製品，而是完全外銷，所以 (A) 是正確答案。","group":"155-157"},{"id":157,"part":7,"stem":"What is NOT stated about Steel Works?","choices":["It now has multiple steel mills in operation.","Its new facility will aid Malaysia's urban development.","Its market share will double.","It makes use of up-to-date technology."],"answer":"C","explanation":"正確答案：(C) Its market share will double.。 這是 Not/True 題型，要找出和關鍵詞語 Steel Works 有關的內容，並且對照選項判斷答案。(A) 在 The plant is Steel Works' second. Its first mill in Rembau now exclusively exports its products to other Asian countries. 的部分提到，這座工廠（Kampung Tebing 廠）是 Steel Works 公司的第二座，而它位於 Rembau 的第一座煉鋼廠，現在只將產品出口到其他亞洲國家，所以 Steel Works 公司有複數的煉鋼廠，符合選項敘述。(B) 在 The plant will help Malaysian cities develop their infrastructure 的部分提到，Kampung Tebing 廠將幫助馬來西亞城市發展基礎建設，符合選項敘述。(C) 在 Steel Works' market share in Malaysia is expected to rise to 72 percent 的部分提到，Steel Works 公司在馬來西亞的市佔率預期將上升至 72%，但不知道是不是過去的兩倍，所以 (C) 是正確答案。(D) 在 Steel Works' plants utilize the latest technology 的部分提到，Steel Works 公司的工廠運用最新技術，符合選項敘述。","group":"155-157"},{"id":158,"par writes, \"Of course\"?","choices":["She will send a memo to employees.","She thinks a new policy is fair.","She is willing to update Mr. O'Toole.","She intends to complete some paperwork."],"answer":"C","explanation":"正確答案：(C) She is willing to update Mr. O'Toole.。 這一題問的是 Bingham 小姐的訊息所表達的意圖，所以要掌握引用部分（Of course）前後文的情境。Ned O'Toole 說 I'd like to ask about the changes to our overtime work policy，表示自己想詢問加班政策的改變，而 Bingham 小姐回應 Of course.（當然可以），表示 Bingham 小姐願意告知 Ned O'Toole 關於加班政策的最新消息，所以 (C) 是正確答案。","group":"161-164"},{"id":162,"part":7,"stem":"What is mentioned about the overtime document?","choices":["It can be downloaded from a Web site.","It was difficult for some staff to complete.","It will be modified by department supervisors.","It is in the process of being rewritten."],"answer":"B","explanation":"正確答案：(B) It was difficult for some staff to complete.。 這是 Not/True 題型，要找出和關鍵詞語 the overtime document 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章裡沒有提到。(B) 在 Karen Bingham 所說的 they didn't submit the official overtime document. Many found the form to be too complicated. 提到，過去員工沒有提交正式的加班文件，而很多人覺得那張表太複雜，符合選項敘述，所以 (B) 是正確答案。","group":"161-164"},{"id":163,"part":7,"stem":"What will happen on December 1?","choices":["Some personnel will have to work late.","A company manual will be distributed.","Some conflicts will be discussed.","A policy change will take effect."],"answer":"D","explanation":"正確答案：(D) A policy change will take effect.。 這是問 12 月 1 日會發生什麼（What）的 wh- 問題。和題目的關鍵詞語 December 1 有關的部分包括 Ned O'Toole 所說的 I'd like to ask about the changes to our overtime work policy，這部分表達想詢問加班政策的改變，以及 Karen Bingham 所說的 it's effective as of 9 A.M., December 1，表示前述的加班政策從 12 月 1 日上午 9 點開始實施，所以 (D) 是正確答案。","group":"161-164"},{"id":164,"part":7,"stem":"What is suggested about Mr. O'Toole?","choices":["He misunderstood what he heard at a meeting.","He has made some complaints about a procedure.","He expects to work overtime in the near future.","He has not yet been paid for a recently completed project."],"answer":"C","explanation":"正確答案：(C) He expects to work overtime in the near future.。 這是和題目關鍵詞語 Mr. O'Toole 有關的推論問題。Gene Shipley 說 anyone who works over 40 hours a week automatically receives extra pay，表示任何一週工作超過 40 小時的人都會自動獲得額外的薪水，而 O'Toole 先生說 That's good to know, especially considering the big project that I'll be working on in the coming weeks，表示這是個好消息，因為他在接下來幾週要處理大型專案，由此可以推知 O'Toole 先生接下來應該會加班，而受惠於一週工作超過 40 小時自動獲得加班費的政策，(C) 是正確答案。","group":"161-164"},{"id":165,"part":7,"stem":"Why will Franklin Airport be renovated?","choices":["To address safety concerns","To spend a budget surplus","To create space for retail businesses","To compete with a larger airport"],"answer":"A","explanation":"正確答案：(A) To address safety concerns。 這是問 Franklin 機場為什麼（Why）要整修的 wh- 問題。和題目的關鍵詞語 Franklin Airport be renovated 有關的部分是 The Denver Transportation Authority (DTA) has announced a $50 million renovation plan for Franklin Airport ~. The announcement comes as a result of the National Airlines Group (NAG) having labeled its runway as dangerous for large aircraft，這部分提到丹佛交通局宣布了 Franklin 機場耗資 5 千萬元的整修計畫，而之所以有這公告，是因為全國航空公司團體將這座機場的跑道判定為對大型飛機有危險，所以 (A) 是正確答案。","group":"165-167"},{"id":166,"part":7,"stem":"What is true about the renovation project?","choices":["It has been a goal of the DTA for over a decade.","It is being funded through private donations.","It will be managed by the NAG.","It will take longer than expected."],"answer":"A","explanation":"正確答案：(A) It has been a goal of the DTA for over a decade.。 這是 Not/True 題型，要找出和關鍵詞語 the renovation project 有關的內容，並且對照選項判斷答案。(A) 在 When we took over Franklin Airport 11 years ago, we intended to begin rebuilding it right away. Unfortunately, we encountered numerous budget-related delays. We will finally be able to repair our runway and expand our terminals 的部分提到，「我們」（DTA）11 年前接管 Franklin 機場時，本來打算立即重新建設，但遭遇了許多預算造成的延誤，而現在終於能夠修補跑道並擴建航廈，符合選項敘述，所以 (A) 是正確答案。(B) 在 we have managed to secure federal funding 的部分提到，DTA 設法獲得了聯邦政府的資金，不符合選項敘述。(C) 和 (D) 在文章裡沒有提到。","group":"165-167"},{"id":167,"part":7,"stem":"What is implied about Franklin Airport?","choices":["It won a customer satisfaction award.","It is connected to a city by a subway line.","It is currently used only by domestic airlines.","It will be completely shut down during renovations."],"answer":"C","explanation":"正確答案：(C) It is currently used only by domestic airlines.。 這是和題目關鍵詞語 Franklin Airport 有關的推論問題。After the project has concluded, Franklin Airport will begin serving as a point of arrival and departure for international flights. 的部分提到，計畫完成後，Franklin 機場將成為國際航班的抵達與出發點，由此可以推知，這座機場目前只有國內航線，所以 (C) 是正確答案。","group":"165-167"},{"id":168,"part":7,"stem":"The word \"immediate\" in paragraph 2, line 4, is closest in meaning to","choices":["sudden","nearby","critical","prompt"],"answer":"B","explanation":"正確答案：(B) nearby。 immediate 所在的語句 When you are done, you must stay in the immediate area until you are called for the second part of the interview. 之中，immediate 表示「附近的」的意思，所以同樣能表示「附近的」的 (B) 是正確答案。","group":"168-171"},{"id":169,"part":7,"stem":"What is an important qualification for the job?","choices":["The ability to cooperate with others","Extensive knowledge of international law","A willingness to work long hours","Experience with specific software"],"answer":"A","explanation":"正確答案：(A) The ability to cooperate with others。 這是問對於這份工作，什麼（What）是重要資格條件的 wh- 問題。和題目的關鍵詞語 an important qualification for the job 有關的部分是 This activity will be used to evaluate your communication skills and ability to work with coworkers.，這部分提到面試的一項活動將被用來評價溝通技能，以及和同事合作的能力，所以 (A) 是正確答案。","group":"168-171"},{"id":170,"part":7,"stem":"What are applicants required to do?","choices":["Submit additional work references","Send a reply by e-mail","Present a recommendation letter","Create a profile on a firm's Web site"],"answer":"B","explanation":"正確答案：(B) Send a reply by e-mail。 這是問應徵者被要求做什麼（What）的 wh- 問題。和題目的關鍵詞語 applicants required to do 有關的部分是 Please confirm your participation by replying to this e-mail.，這部分要求回覆這封電子郵件來確認參加，所以 (B) 是正確答案。","group":"168-171"},{"id":171,"part":7,"stem":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"You will therefore not need to bring any materials of your own.\"","choices":["[1]","[2]","[3]","[4]"],"answer":"D","explanation":"正確答案：(D) [4]。 這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「所以您不需要自行攜帶任何用品」，所以句子填入的部分應該和面試時提供的東西有關。[4] 的上一句 We will supply everything you need to complete the process, including paper, pens, and access to selected law books from our library. 提到，將供應完成這個程序所需的一切，包括紙、筆，以及從圖書館中挑選的一些法律書籍的使用權。將句子填入 [4] 的位置之後，可以表達「因為供應了包括紙、筆以及法律書籍等所需的一切，所以您不需要自行攜帶任何用品」，文意通順，所以 (D) 是正確答案。 ---","group":"168-171"},{"id":172,"part":7,"stem":"What is one purpose of the notice?","choices":["To share some budget calculations","To request participation in a fund-raiser","To announce the fulfillment of a goal","To recruit some volunteers"],"answer":"B","explanation":"正確答案：(B) To request participation in a fund-raiser。 這一題問的是通知的目的，所以要注意文章開頭的部分。Here at the Highland Employment Center, we need your support for our Tech Training initiative，we hope to raise enough funds 的部分提到，Highland 就業服務中心需要對 Tech Training 計畫的支持，以及希望募集足夠的資金，後面則詳細說明募款活動的內容，所以 (B) 是正確答案。","group":"172-175"},{"id":173,"part":7,"stem":"According to the notice, what can race participants do?","choices":["Sample some dishes","Wear unusual clothing","Submit route suggestions","Select a preferred running distance"],"answer":"B","explanation":"正確答案：(B) Wear unusual clothing。 這是問根據通知，路跑參加者可以做什麼（What）的 wh- 問題。和題目的關鍵詞語 race participants do 有關的部分是 Those who run in a creative costume will be eligible to win a $100 voucher for Harlan Foods.，這部分提到穿著創意服裝跑步的人有機會贏得 Harlan Foods 的 100 元禮券，所以 (B) 是正確答案。","group":"172-175"},{"id":174,"part":7,"stem":"What is indicated about the event?","choices":["It must be signed up for a month in advance.","Its entry fee varies depending on the registration date.","Its organizer will deliver a speech.","It will be filmed by a television camera crew."],"answer":"B","explanation":"正確答案：(B) Its entry fee varies depending on the registration date.。 這是 Not/True 題型，要找出和關鍵詞語 the event 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章裡沒有提到。(B) 在 The entry fee is $40 throughout July, $45 from August 1–14, and $50 on the day of the race. 的部分提到，參加費在整個 7 月都是 40 元，8 月 1–14 日是 45 元，路跑當日 50 元，符合選項敘述，所以 (B) 是正確答案。","group":"172-175"},{"id":175,"part":7,"stem":"What will those who complete the run within two hours receive?","choices":["A personalized T-shirt","A certificate of achievement","A gift voucher for groceries","A souvenir photograph"],"answer":"D","explanation":"正確答案：(D) A souvenir photograph。 這是問兩小時內跑完的人會得到什麼（What）的 wh- 問題。和題目的關鍵詞語 those who complete the run within two hours receive 有關的部分是 Those who finish within the two-hour time limit will receive a photograph of themselves crossing the finish line.，這部分提到在兩小時的時間限制內跑完的人，將得到自己通過終點線的照片，所以 (D) 是正確答案。","group":"172-175"},{"id":176,"part":7,"stem":"Why did Ms. Duval send the e-mail?","choices":["To describe some garments","To discuss publication details","To finalize the topic of an article","To assess a set of photographs"],"answer":"B","explanation":"正確答案：(B) To discuss publication details。信中討論九月號封面人物、廣告頁面及人物報導校對，因此是在協商出版細節。","group":"176-180"},{"id":177,"part":7,"stem":"In the e-mail, the phrase \"drive up\" in paragraph 1, line 4, is closest in meaning to","choices":["operate","motivate","stimulate","travel"],"answer":"C","explanation":"正確答案：(C) stimulate。drive up sales 指促進銷售成長，與 stimulate（刺激、促進）意思相近。","group":"176-180"},{"id":178,"part":7,"stem":"According to the e-mail, what is SameSide Cosmetics interested in doing?","choices":["Developing a new product line","Holding a product demonstration in October","Launching a campaign against chemical ingredients","Buying some advertising space"],"answer":"D","explanation":"正確答案：(D) Buying some advertising space。信中提到 SameSide Cosmetics 有意刊登廣告，並詢問是否願意利用空出的58、59頁。","group":"176-180"},{"id":179,"part":7,"stem":"What can be inferred about Ms. Duval?","choices":["Her choice for a cover model was unavailable.","She wrote an editorial about a craftsperson.","She is scheduled to attend a clothing fair.","She wants to increase a subscription fee."],"answer":"A","explanation":"正確答案：(A) Her choice for a cover model was unavailable.。信中建議邀請 Su-min Yoo 上封面，但實際目錄顯示的是 Michelle Ford，可推知原本屬意人選未能採用。","group":"176-180"},{"id":180,"part":7,"stem":"On which page does the article about Mr. Burns appear?","choices":["Page 16","Page 35","Page 52","Page 78"],"answer":"C","explanation":"正確答案：(C) Page 52。電子郵件提到加拿大設計師 David Burns；目錄中加拿大首席設計師的介紹列在第52頁。","group":"176-180"},{"id":181,"part":7,"stem":"What is the information mainly about?","choices":["A newly opened showroom","A volunteer recruitment session","An event in support of small businesses","A tax incentive for companies"],"answer":"C","explanation":"正確答案：(C) An event in support of small businesses。公告鼓勵4月28日到在地小商店購物，以支持小型業者及地方經濟。","group":"181-185"},{"id":182,"part":7,"stem":"What is indicated about the BBA?","choices":["It operates a major retail chain.","It has raised its membership fee by 10 percent.","It is opposed to a tax on imported goods.","It contributes to the local community."],"answer":"D","explanation":"正確答案：(D) It contributes to the local community.。參與店家捐出部分獲利給BBA，協會用這筆款項推動當地慈善計畫。","group":"181-185"},{"id":183,"part":7,"stem":"What information will Mr. Perez include in his speech?","choices":["The reasons for a construction","The plans of an organization","The cost of a campaign","The date of a reopening"],"answer":"B","explanation":"正確答案：(B) The plans of an organization。行程寫明 Perez 將說明在地企業重要性，以及商業協會未來的工作。","group":"181-185"},{"id":184,"part":7,"stem":"What is NOT one of the activities planned for April 28?","choices":["A cooking demonstration by a famous chef","A walk through a historic neighborhood","Some outdoor performances by musicians","Some instructional sessions for children"],"answer":"A","explanation":"正確答案：(A) A cooking demonstration by a famous chef。行程有徒步導覽、戶外樂團及兒童美術工作坊，沒有名廚烹飪示範。","group":"181-185"},{"id":185,"part":7,"stem":"Where most likely can visitors make use of a coupon?","choices":["Birdy Beets","Tinker Time","Kara Lee's","Wayfair House"],"answer":"A","explanation":"正確答案：(A) Birdy Beets。完成三家在地商店的購物要求可以領取參與餐廳的午餐券；Birdy Beets 為參與餐廳。","group":"181-185"},{"id":186,"part":7,"stem":"What did Mayor Wilkins do on February 10?","choices":["Presented at a tourism conference","Showed visitors around an office","Spoke about an infrastructure project","Apologized for a traffic accident"],"answer":"C","explanation":"正確答案：(C) Spoke about an infrastructure project。新聞記載市長2月10日在記者會公布一座四車道新橋工程。","group":"186-190"},{"id":187,"part":7,"stem":"According to the article, why should some commuters visit a Web site?","choices":["To find people to carpool with","To check some route information","To give feedback about a policy","To evaluate public transit"],"answer":"B","explanation":"正確答案：(B) To check some route information。交通部網站提供道路封閉期間的替代路線資訊，讓通勤者查詢。","group":"186-190"},{"id":188,"part":7,"stem":"Where is Bellwood Sporting Goods probably located?","choices":["On Harris Road","On Oak Boulevard","On Center Avenue","On Harbor Way"],"answer":"C","explanation":"正確答案：(C) On Center Avenue。備忘錄指出店前道路8月5日封閉；新聞指出 Center Avenue 正是在該日開始封閉。","group":"186-190"},{"id":189,"part":7,"stem":"What is suggested about Mr. Adams's order?","choices":["It was ineligible for a promotional discount.","Its color was different from the one requested.","It is no longer being manufactured.","It will be shipped to a work address."],"answer":"A","explanation":"正確答案：(A) It was ineligible for a promotional discount.。8月9日的外套訂單並非促銷鞋類產品，不能享有15%的鞋類折扣。","group":"186-190"},{"id":190,"part":7,"stem":"What will Mr. Adams do if an item cannot be replaced?","choices":["Delete a customer account","Visit a manufacturer's Web site","Fill out a complaint form","Start a process over again"],"answer":"D","explanation":"正確答案：(D) Start a process over again。Jeff Adams 表示如不能直接更換商品，就必須取消原訂單並重新下單。","group":"186-190"},{"id":191,"part":7,"stem":"According to the e-mail, what information was Mr. Richards unable to find on a Web site?","choices":["A class schedule","A service fee","A facility location","A testing process"],"answer":"D","explanation":"正確答案：(D) A testing process。Richard 在郵件中表示找不到報名前如何進行中文程度測驗的說明。","group":"191-195"},{"id":192,"part":7,"stem":"What is NOT stated about Zhong Academy?","choices":["It allows scheduling changes.","It has lessons for beginners.","It only holds weekday classes.","It offers discounts for referrals."],"answer":"C","explanation":"正確答案：(C) It only holds weekday classes.。登記表有星期日課程，因此「只開平日課程」不是正確敘述。","group":"191-195"},{"id":193,"part":7,"stem":"Which film did Mr. Richards's friend most likely watch?","choices":["Summer Shore","Washing Away","Grave Mistakes","River Goddess"],"answer":"D","explanation":"正確答案：(D) River Goddess。朋友看的是11月12日上映的電影，月刊說上月播映的片名為 River Goddess。","group":"191-195"},{"id":194,"part":7,"stem":"What is true about Ms. Xu?","choices":["Her first movie will be screened at a festival.","She will spend a night at the Cloudbank Hotel.","Her projects are funded by a firm based in Shanghai.","She has received positive reviews from critics."],"answer":"D","explanation":"正確答案：(D) She has received positive reviews from critics.。月刊稱 Xu Yue 曾執導獲影評肯定的 Summer Shore，表示得到正面評價。","group":"191-195"},{"id":195,"part":7,"stem":"What can be inferred about Mr. Richards?","choices":["He used to work at a language school.","He bought tickets for an upcoming festival.","He cannot attend a free screening in December.","He went on a business trip to China."],"answer":"C","explanation":"正確答案：(C) He cannot attend a free screening in December.。Richard 的登記結果為初級班；12月院內免費放映只准中級及高級學生參加。","group":"191-195"},{"id":196,"part":7,"stem":"What is NOT mentioned about The Good Old Days?","choices":["It includes recorded interviews.","It focuses on old towns.","It features a regular host.","It is sponsored by a travel agency."],"answer":"D","explanation":"正確答案：(D) It is sponsored by a travel agency.。介紹提到訪談、歷史城鎮及固定主持人，未提及旅行社贊助。","group":"196-200"},{"id":197,"part":7,"stem":"What is most likely true about Pepita de Oro?","choices":["It used to have a large public plaza.","It is celebrating an anniversary this year.","It is a popular destination for foreign tourists.","It was covered in the 10th episode of a show."],"answer":"D","explanation":"正確答案：(D) It was covered in the 10th episode of a show.。第一季共有10集，Kershaw 說最後一集介紹 Pepita de Oro，因此是第10集。","group":"196-200"},{"id":198,"part":7,"stem":"Who did Ms. Kershaw's grandfather buy some paintings from?","choices":["Hector Almonte","Janet Leslie","Chloe Benbow","A local artist"],"answer":"D","explanation":"正確答案：(D) A local artist。Kershaw 的郵件直接寫明祖父向當地藝術家購買了那些畫作。","group":"196-200"},{"id":199,"part":7,"stem":"What is suggested about Mr. Almonte?","choices":["He wrote a book about a journey.","He examined some artwork in Maracuyá.","He held a press conference in October.","He has lent out a collection of artifacts."],"answer":"B","explanation":"正確答案：(B) He examined some artwork in Maracuyá.。她邀請導演到 Maracuyá 家中拍攝無法外借的畫；後續報導顯示作品入鏡。","group":"196-200"},{"id":200,"part":7,"stem":"What was Emerald Falls mainly famous for?","choices":["Its educational standards","Its natural scenery","Its mineral resources","Its charity auctions"],"answer":"C","explanation":"正確答案：(C) Its mineral resources。新聞提到 Emerald Falls 曾是繁榮礦業社區，以礦藏聞名，後來礦產耗盡。","group":"196-200"}],"groups":{}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>MEMO</span><small>131-134 · 1/1</small></div><div class=\"document-body\"><p>MEMO</p><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All staff</strong></div><div class=\"doc-field\"><span>From</span><strong>Warren Harris, Office Manager</strong></div><div class=\"doc-field\"><span>Date</span><strong>August 15</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Electricity use</strong></div></div><p>I would like to bring your attention to the fact that the office utilities bill was <span class=\"reading-blank\">〔131〕</span> 15 percent higher this month than it was at the same time last year. I feel this is unacceptable, especially as the company <span class=\"reading-blank\">〔132〕</span> a number of cost-saving measures. These include the installation of energy-efficient lights and windows during our renovation last fall. I would, therefore, like to remind you all to be <span class=\"reading-blank\">〔133〕</span>. With just a bit of rationality and good judgment, I am confident we can take steps to reduce our expenses. <span class=\"reading-blank\">〔134〕</span> Thank you for your understanding, and if you have any other ideas for saving energy, please let me know.</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-press\"><div class=\"doc-ribbon\"><span>ANNOUNCEMENT</span><small>135-138 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">PRESS RELEASE—Basinet Books</h2><p>Basinet Books to Launch Its Own Podcast</p><p>The publishing company Basinet Books will soon begin producing a weekly podcast for fans of historical fiction. The <span class=\"reading-blank\">〔135〕</span> installment of the series will air on July 15. This first show will discuss the recent popularity of the genre and explore the fascinating relationship between history and fiction. Each subsequent <span class=\"reading-blank\">〔136〕</span> will focus on a single novel. <span class=\"reading-blank\">〔137〕</span> As for who will host it, Basinet Books has hinted that they have hired a prominent actor. Reportedly, this <span class=\"reading-blank\">〔138〕</span> has starred in several movie adaptations of novels. Each podcast file will be available through the StarLadder mobile application.</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>139-142 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Belinda Wright bw4637@advertx.com</strong></div><div class=\"doc-field\"><span>From</span><strong>Jamie Garnett jg4548@advertx.com</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Urgent request</strong></div><div class=\"doc-field\"><span>Date</span><strong>February 11</strong></div></div><p>Hello, Belinda.</p><p>How is your vacation going? I know that your time off <span class=\"reading-blank\">〔139〕</span> until Friday, February 14. However, I'm wondering if you can return to work that day. It turns out that Nektar Beverages suddenly wants us to make some changes to the advertisement it commissioned. Since you were the lead designer, I feel like you'd be the best person to handle the final revisions. The task will probably take five or six hours.</p><p><span class=\"reading-blank\">〔140〕</span> To <span class=\"reading-blank\">〔141〕</span> you, we would pay you the standard overtime rate on February 14. We would also <span class=\"reading-blank\">〔142〕</span> an extra vacation day.</p><p>Thank you in advance.<br/>Jamie</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE</span><small>143-146 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">New Horizons for GEOnet Solutions</h2><p>BOSTON (October 9)— GEOnet Solutions has announced that it will be extending its reach overseas. <span class=\"reading-blank\">〔143〕</span> For over 20 years, this Boston-based <span class=\"reading-blank\">〔144〕</span> in technology development has created innovative ways to use geotechnology and has made countless advances in the field. <span class=\"reading-blank\">〔145〕</span>, the data collection systems and tracking tools used by millions of people every day would not exist without its efforts. In a statement released yesterday, GEOnet Solutions representative Tomas Fuller said that the primary goal of the <span class=\"reading-blank\">〔146〕</span> is to facilitate cooperation with the London Technology Center. The two believe that their collaboration will be mutually beneficial.</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>MEMO</span><small>147-148 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All staff</strong></div><div class=\"doc-field\"><span>From</span><strong>Nadori Seiko, CEO</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Monthly sales challenge</strong></div><div class=\"doc-field\"><span>Date</span><strong>December 2</strong></div></div><p>Thank you all for contributing to the monthly sales challenge. We acquired several new clients due to your hard work. The sales challenge started as an individual effort and evolved into a positive team experience. Aaron and Marisol had the highest sales. Thus, they will both get a gift certificate for Spanto Restaurant.</p><p>Because I was surprised by the amount of enthusiasm and team spirit this challenge has created, I will offer each of you an additional day off. Furthermore, the executive team has decided to hold this initiative again in the future. Please e-mail me some new prize ideas, which can be for individual staff members or entire teams.</p></div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>149-150 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Cole Theater Membership Information:</h2><p>To become a Cole Theater member, apply at www.coletheater.com/join or visit one of our box office booths. Membership cards must be renewed after 12 months.</p><p>Membership Benefits:</p><p>• Tickets to our exclusive movie premieres, which are attended by famous actors<br/>• $6 entry for morning showings<br/>• 10 percent discount for afternoon, evening, and weekend showings<br/>• Free concession stand items or movie tickets in exchange for reward points</p><p>For more information, e-mail extras@coletheater.com.</p></div></section></div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 151-152</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>CHAT</span><small>151-152 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>11:33 A.M.</time></div><div class=\"message-text\">Are you doing an open house for the two-bedroom home on Kent Street today?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Connie Mills</strong><time>11:35 A.M.</time></div><div class=\"message-text\">It starts in less than half an hour. I'm here setting up now. Why?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>11:36 A.M.</time></div><div class=\"message-text\">I forgot the key to the apartment at 182 North Avenue. I'm in the car at the moment, and I know you usually have a spare. I'm driving past the Sydney Mountain Mall.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Connie Mills</strong><time>11:38 A.M.</time></div><div class=\"message-text\">I do. Come get it anytime before noon. I want the driveway to be available for potential buyers who might get here early, so please park around the corner. I saw a few empty parking spaces along the sidewalk there.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>11:41 A.M.</time></div><div class=\"message-text\">Perfect! Thanks so much.</div></div></div></div></section></div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 153-154</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>LETTER</span><small>153-154 · 1/1</small></div><div class=\"document-body\"><p>Brugeri Museum of Fine Art<br/>856 Empire Street<br/>Grants Pass, OR 97527</p><p>September 9</p><p>Robert Jansen<br/>3111 Helmsview Drive<br/>Arcata, CA 95521</p><p>Dear Mr. Jansen,</p><p>I am sorry to report that Descending Cherub, the statue you so generously lent us from your personal collection this year, was damaged yesterday. Our staff were in the process of moving all the works in the outdoor sculpture garden into the main exhibition hall when the weather changed suddenly. Unfortunately, they did not get to your statue in time. A strong wind caused it to fall from its pedestal, breaking the left hand off. I have enclosed some pictures of the broken area.</p><p>Our insurance company will, of course, financially compensate you for the damage. In addition, we will cover the cost of having it expertly repaired. With your consent, we can ask a professional to do this. If you prefer to use someone of your own choosing, simply let us know, and we will ship the item to you right away.</p><p>Once again, I apologize for this regrettable accident. I will await your reply.</p><p>Mia Hyman<br/>Curator, Brugeri Museum of Fine Art</p><p>Enclosure</p></div></section></div>","155-157":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 155-157</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE</span><small>155-157 · 1/1</small></div><div class=\"document-body\"><p>Steel Works Inc. has begun operations at its new plant. The mill, built at a cost of $60 million, will contribute to the growth of Malaysia's construction industry. It will be able to produce about 1 million tons of reinforced steel per year.</p><p>Established in Kampung Tebing, Steel Works' factory will ship steel bars to various parts of the country, according to company CEO Aiman Musa. \"The plant will help Malaysian cities develop their infrastructure,\" he added.</p><p>The plant is Steel Works' second. Its first mill in Rembau now exclusively exports its products to other Asian countries, though it once met almost half of Malaysia's steel demand. The Rembau plant was upgraded last year and is considered one of Asia's most modern steel plants. Steel Works' plants utilize the latest technology to ensure not only that production is efficient but that it has a low environmental impact.</p><p>With the establishment of its Kampung Tebing plant, Steel Works' market share in Malaysia is expected to rise to 72 percent. The value of its shares on the local stock exchange increased by 24 percent with the opening of the new plant.</p></div></section></div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 158-160</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>158-160 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All marketing officers</strong></div><div class=\"doc-field\"><span>From</span><strong>Linda Marks</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Conference transportation</strong></div><div class=\"doc-field\"><span>Date</span><strong>October 14</strong></div></div><p>Dear Colleagues,</p><p>Many of you will be attending the social media conference in Wilmington on Friday. — [1] —. If you are planning on taking the company-chartered bus, we will meet in Parking Lot A and leave promptly at 8:30 A.M. The alternatives are to drive or take public transportation. Directions to the Wilmington Conference Center were provided in a previous e-mail. — [2] —.</p><p>For those of you who will not be attending, the representatives from Whitaker's Sports Apparel, the client we acquired last week, will be visiting the office around 10 A.M. — [3] —. I have already advised them that the office will be almost empty due to the conference. — [4] —. Robert Buck in the accounting department will be meeting with them and giving them a quick tour. Be sure to introduce yourself if you get the chance.</p><p>Thank you.</p><p>Linda Marks</p></div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 161-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>CHAT</span><small>161-164 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>11:08 A.M.</time></div><div class=\"message-text\">I was late yesterday for our beginning-of-November meeting, so I'd like to ask about the changes to our overtime work policy.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>11:09 A.M.</time></div><div class=\"message-text\">Of course. But didn't you get the memo Mr. Ward sent a little while ago? It summarizes the new rules.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>11:10 A.M.</time></div><div class=\"message-text\">I only glanced at it briefly, but I saw something about a streamlined process. Does that mean we don't have to turn in the request form anymore?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>11:12 A.M.</time></div><div class=\"message-text\">Yes. In the past, a lot of employees worked extra hours to finish projects but only received their regular salary. This happened because they didn't submit the official overtime document. Many found the form to be too complicated.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Gene Shipley</strong><time>11:13 A.M.</time></div><div class=\"message-text\">Now, Ned, anyone who works over 40 hours a week automatically receives extra pay. All we have to do is enter the information into the payroll system.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>11:13 A.M.</time></div><div class=\"message-text\">Right. And it's effective as of 9 A.M., December 1. At the end of every month, your supervisor will review what you inputted. Unless there's a problem that needs to be discussed, it'll be approved at that point.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>11:15 A.M.</time></div><div class=\"message-text\">That's good to know, especially considering the big project that I'll be working on in the coming weeks. Thanks!</div></div></div></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE</span><small>165-167 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">DTA Readies for Airport Overhaul</h2><p>The Denver Transportation Authority (DTA) has announced a $50 million renovation plan for Franklin Airport, on the outskirts of Denver. The announcement comes as a result of the National Airlines Group (NAG) having labeled its runway as dangerous for large aircraft. The NAG sets safety regulations for all US airports.</p><p>\"When we took over Franklin Airport 11 years ago, we intended to begin rebuilding it right away. Unfortunately, we encountered numerous budget-related delays. However, in light of the NAG's recent judgment, we have managed to secure federal funding and will finally be able to repair our runway and expand our terminals,\" said DTA chief Elaine Webster.</p><p>The DTA has hired several construction companies to carry out the project, which is expected to be completed within 18 months. Work will start on Terminal B only after the expansion of Terminal A is finished, which will leave the airport fully functional the whole time. After the project has concluded, Franklin Airport will begin serving as a point of arrival and departure for international flights.</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>168-171 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Joan Stendhal joan.stendhal@mynextmail.com</strong></div><div class=\"doc-field\"><span>From</span><strong>Robert Hamilton r.hamilton@pichaipartners.com</strong></div><div class=\"doc-field\"><span>Date</span><strong>September 18</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Your application</strong></div></div><p>Dear Ms. Stendhal,</p><p>Congratulations! Out of hundreds of applicants, we have selected you to move on to the next stage of the process and participate in an interview at our office. [1]</p><p>The interview is scheduled for Friday, September 23, from 1 P.M. to 5 P.M. All applicants will be allowed to take 30-minute breaks between activities. The interview will consist of two parts. During the first part of the interview, you will answer questions from a panel of executives. When you are done, you must stay in the immediate area until you are called for the second part of the interview. For the second part, you will be asked to analyse actual legal cases that our firm has worked on in the past. You will be given an hour to work on one case by yourself. [2] — Then, you and the other applicants will form groups of two to work on the second case. This activity will be used to evaluate your communication skills and ability to work with coworkers. Further details will be provided on the day of the interview. [3] —</p><p>We will supply everything you need to complete the process, including paper, pens, and access to selected law books from our library. [4] — We will also provide refreshments.</p><p>Please confirm your participation by replying to this e-mail. You can also call me at 555-4883 if you have any questions.</p><p>Sincerely,<br/>Robert Hamilton</p></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>172-175 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Run for a Good Cause!</h2><p>Here at the Highland Employment Center, we need your support for our Tech Training initiative. Many individuals struggle to find work because they lack basic computer skills. Thus, we hope to raise enough funds to hire a computer instructor to run weekly workshops at our center for a full year. Job seekers will be able to attend these sessions for free. By gaining computer proficiency, they will stand a better chance of finding a position and will be able to earn more than they did in the past.</p><p>You can help us achieve our goal by participating in a 10-kilometer race in Arthur Park on August 15. The entry fee is $40 throughout July, $45 from August 1-14, and $50 on the day of the race. Those who run in a creative costume will be eligible to win a $100 voucher for Harlan Foods. The costume contest winner will be announced after the race.</p><p>Runners will be given packets that include a race bib and storage bag for personal possessions. Those who finish within the two-hour time limit will receive a photograph of themselves crossing the finish line. Go to www.highlandec.com/10k to sign up today!</p></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>176-180 · 1/2</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>From</span><strong>Rachel Duval rduval@pfmagazine.com</strong></div><div class=\"doc-field\"><span>To</span><strong>John Hassan j.hassan@pfmagazine.com</strong></div><div class=\"doc-field\"><span>Date</span><strong>July 29</strong></div><div class=\"doc-field\"><span>Subject</span><strong>September issue</strong></div></div><p>Hello, John.</p><p>Though we have made a lot of progress with the September issue, we still have some decisions to make. First, we have to choose a model for the cover. Since this is typically the most popular issue of the year, we need to get a big celebrity. How about working with Su-min Yoo again? She has a new blockbuster movie coming out in October, and having her on the cover would likely drive up magazine sales. Please contact her agent and try to make an arrangement.</p><p>Second, Russo Shampoo abruptly decided not to advertise in the September issue after all. Thus, we urgently need to fill pages 58 and 59. You mentioned that SameSide Cosmetics was interested in running an advertisement in our magazine. This would be for their new line of organic, environmentally friendly skin creams, which will be debuting in October. Could you confirm whether the company wants to take advantage of this opportunity? We could offer them a 20 percent discount.</p><p>Lastly, I'd like you to thoroughly check the facts mentioned in our article on the Canadian designer David Burns for the September issue.</p><p>Thanks,</p><p>Rachel Duval<br/>Editor in Chief<br/>PopFashion Magazine</p></div></section><section class=\"document-card type-catalog\"><div class=\"doc-ribbon\"><span>CATALOG</span><small>176-180 · 2/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">PopFashion Magazine September Issue</h2><div class=\"document-table-wrap\"><table><tr><td>Page</td><td>Content</td></tr><tr><td>11</td><td>Seasonal Beauty Trends: Read our reviews of new cosmetics products</td></tr><tr><td>16</td><td>Cover Story Interview: Michelle Ford talks about her upcoming Broadway stage debut</td></tr><tr><td>25</td><td>Fashion Industry Editorial: Meet seven of the most innovative US designers</td></tr><tr><td>35</td><td>Fashion Industry Editorial: Explore the work of New York's most prestigious tailor</td></tr><tr><td>48</td><td>Article: Learn why Berlin is becoming the fashion capital of Europe</td></tr><tr><td>52</td><td>Profile: Canada's number one designer reflects on his career ahead of retirement</td></tr><tr><td>60</td><td>Advice Fashion Quest: Find the best clothing items for your body type</td></tr><tr><td>68</td><td>Hairstyling Workshop: Follow our step-by-step guide to using hair dye</td></tr><tr><td>78</td><td>Special Feature Journey: Explore India's contemporary fashion scene</td></tr></table></div></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>181-185 · 1/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Go Shopping and Make a Difference!</h2><p>This year, Bristol's Support Your Local Business Day falls on Saturday, April 28. Instead of visiting nationwide chain stores on this day, shop at some of the smaller stores in your neighborhood. By doing so, you'll help the local economy since the revenue earned by such businesses remains in our town. In addition, a group of participating businesses, including the restaurant Birdy Beets, the crafts shop Tinker Time, and the clothing boutique Kara Lee's, have agreed to give 10 percent of their profits from this day to the Bristol Business Association (BBA). The BBA will use these proceeds to continue carrying out charitable projects in the area.</p><p>Along with the shopping opportunities, Support Your Local Business Day will feature special programs. Check www.bristolsylbd.com for a list of participating businesses and a schedule of events.</p></div></section><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>SCHEDULE</span><small>181-185 · 2/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">Support Your Local Business Day<br/>April 28 in Bristol</h2><p>Message for Community Members 9:00 A.M. to 9:30 A.M.<br/>Location: Anchor Square<br/>Emmanuel Perez, president of the Bristol Business Association (BBA), will give a speech about why local businesses are so important. He will also talk about some of the BBA's upcoming efforts.</p><p>Walking Tour 9:40 A.M. to 10:15 A.M.<br/>Meeting place: Craft Street Antiques<br/>Take a stroll down Dalton Street and learn about the history of its buildings. The last stop is Wayfair House, one of the oldest buildings in Bristol, which will be open to the public for the first time. Admission to Wayfair House is free.</p><p>Shop for Your Lunch 10:30 A.M. to 1:00 P.M.<br/>Location: Downtown Shopping District<br/>If you make a purchase in three different locally owned businesses, you will receive a coupon for a free lunch at a participating restaurant. Present your receipts at the visitors' bureau by 1:30 P.M.</p><p>Music on the Green 12:00 P.M. to 4:00 P.M.<br/>Location: Downtown Green Park<br/>Local bands will play 30-minute concerts on the stage at Green Park. At a tent nearby, plenty of fun arts and crafts workshops for kids will be offered.</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE</span><small>186-190 · 1/3</small></div><div class=\"document-body\"><p>February 12— At a press conference on February 10, Mayor David Wilkins announced the planned construction of a new four-lane bridge. The work is scheduled to begin on May 14 and end on December 23. It is expected to relieve traffic congestion in the city, particularly for commuters trying to reach the north side of the city from the downtown area. However, the traffic situation will likely worsen while the new bridge is under construction due to a number of temporary road closures.</p><p>Harris Road and Oak Boulevard will be closed from May 14 to August 1. In addition, Center Avenue will be inaccessible to motorists from August 5 to October 10, and Harbor Way will be shut down from October 12 to December 20. Commuters who regularly use these streets should visit the Department of Transportation's Web site for information about alternatives.</p></div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>MEMO</span><small>186-190 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All Bellwood Sporting Goods Employees</strong></div><div class=\"doc-field\"><span>From</span><strong>Beth Ferrell, Manager</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Response plan</strong></div><div class=\"doc-field\"><span>Date</span><strong>July 10</strong></div></div><p>As I informed everyone in the staff meeting yesterday, the closure of the street in front of our store starting from August 5 will likely have a serious impact on in-store sales. As a result, I have decided to hold two online promotions during that period. Hopefully, we can generate enough sales through our Web site to compensate for having fewer customers coming into the store. All footwear in the shop and online will be marked down by 15 percent. In addition, anyone who places an order online will receive free shipping. Please make sure to tell our customers about these promotions.</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>186-190 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>customerservice@bellwood.com</strong></div><div class=\"doc-field\"><span>From</span><strong>jadams@ezmail.com</strong></div><div class=\"doc-field\"><span>Date</span><strong>August 12</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Order Number 029384</strong></div></div><p>On August 9, I bought a jacket on your Web site. Unfortunately, I just realized that the size I selected was a large rather than an extra large. I'd like to change this before the order is shipped so that I don't have to return the jacket. Would it be possible for you to just replace the item with the one I originally ordered? If not, I guess I will have to
