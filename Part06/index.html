need the vehicle for 48 hours. I will notify the staff if I decide to use it for longer.</td></tr></table></div></div></section><section class=\"document-card type-webpage\"><div class=\"doc-ribbon\"><span>WEB PAGE 網頁</span><small>191-195 · 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">BOSTON &gt; CLASSIFIEDS &gt; FOR SALE</h2>\n<p>Craft Magazine is moving to a new location with new equipment, so we'll have some items for sale. These include a DX color printer, a XRM6 fax machine, a five-year-old Vista Plus laptop, a 20-inch computer monitor, and five keyboards. If you are interested in any of these items, please contact Alicia Mendez at a.mendez@craftmagazine.com. Prices are negotiable. We're even willing to give away some items for free. Please note that these items will not be available for pickup until the third and last day of our move on May 3. That is when we are putting the last items in a moving truck and shutting down our old office for good.</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-webpage\"><div class=\"doc-ribbon\"><span>WEB PAGE 網頁</span><small>196-200 · 1</small></div><div class=\"document-body source-passages\"><p>http://www.rolandoesteban.com</p>\n<p>About Rolando Esteban</p>\n<p>Rolando Esteban is a visual artist who has earned praise for his clean brush lines, dynamic composition, and vivid colors.</p>\n<p>Growing up in Manila, Mr. Esteban was exposed to various forms of American popular culture and became inspired by the noted comic-book illustrator Chad Grohl. Mr. Esteban taught himself to draw and, despite the lack of formal training, produced many iconic movie and travel posters. He left Manila in his 30s to pursue a painting scholarship in Madrid, where he eventually developed his signature painting style.</p>\n<p>Now, Madrid's Vivi Gallery will hold an exhibit that covers Mr. Esteban's later work. The exhibit, titled Brush and Line, opens publicly on August 22, with a reception scheduled for August 21.</p></div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>MEMO 備忘錄</span><small>196-200 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Vivi Gallery of Visual Arts MEMO</h2>\n<div class=\"field-row\">To: Leon Aguilar</div>\n<div class=\"field-row\">From: Esther Hernandez</div>\n<div class=\"field-row\">Subject: Brush and Line</div>\n<div class=\"field-row\">Date: July 20</div>\n<p>We need to move Brush and Line because the exhibit hall needs to undergo some quick renovations. The only time we can schedule this work to begin is on the day of the reception. I've spoken to the artist and he has agreed to a new opening date of August 30. This means we'll have to reschedule the reception for August 28. The next scheduled exhibit will also need to be moved, so I would like you to communicate with the artist to find out which new dates are acceptable.</p></div></section><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>SCHEDULE 行程表</span><small>196-200 · 3</small></div><div class=\"document-body source-passages\"><p>Vivi Gallery of Visual Arts EXHIBITION SCHEDULE</p>\n<p>Gallery hours are from Tuesday to Saturday, 10 A.M. to 6 P.M. Receptions are held on Mondays from 6 P.M. to 8 P.M.</p>\n<p>July 12 to July 29 Delia Romano: Of One Mind Reception on July 10</p>\n<p>August 2 to August 19 Tom Moskowitz: Ba Bi Bo Bu Reception on July 31</p>\n<p>August 30 to September 20 Rolando Esteban: Brush and Line Reception on August 28</p>\n<p>September 27 to October 14 Remy Artaud: Up is Down Reception on September 25</p>\n<p>http://www.rolandoesteban.com</p></div></section></div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-translation\"><div class=\"doc-ribbon\"><span>廣告</span><small>131-134</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">時尚騎行</h2>\n<p>如果你熱愛騎自行車，現在就該選擇 Bango。我們的安全帽不僅時尚，還能保護你的安全。安全帽採用三層堅固耐用的材料製作，具有優異的衝擊吸收能力，符合國家安全委員會的要求。它們也為經常騎車的人提供便利。例如，安全帽可以整齊折疊成小巧的尺寸，方便收納。今天就試用 Bango 安全帽吧！現在購買就能享有特別優惠。若以原價購買一頂安全帽，第二頂可享五折優惠。請瀏覽 www.bangohelmets.com，和 Bango 一起展開下一趟自行車旅程。</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>135-138</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Hampton Institute accountmanage@hamptoninstitute.org</span></div><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Kate Whitman k.whitman@braxton.ca</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">付款方案</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">5 月 25 日</span></div></div>\n<p>親愛的 Whitman 小姐：</p>\n<p>這封訊息是要確認您已報名 Hampton Institute 於 6 月 30 日至 8 月 31 日舉辦的程式設計研習班。由於您選擇分期付款，我們將每月向您收費。第一張發票將於 7 月 1 日以電子郵件寄出。您隨時可以變更付款方案，只要登入帳戶並選擇「變更方案」即可；您也可以在此處變更。請注意，我們提供的最長付款方案為 18 個月。如果您遇到任何困難，請立即寄電子郵件給我，我很樂意協助。</p>\n<p>敬上， Hampton Institute 帳戶管理團隊</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>公告</span><small>139-142</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Lake 郡動物協會將舉辦募款大會</h2>\n<p class=\"notice-subject\">Lake 郡動物協會感謝大家多年來的貢獻。139 這些貢獻讓組織得以為數百隻動物提供食物與住處。</p>\n<p>請參加我們 12 月 11 日在 Morrissey Civic 中心的募款大會。這將會是個有良善目標、好玩的夜晚。140 我們將招待參加者享受晚餐與現場娛樂表演。入場券每張只要 100 元就能購買。141 活動收入將主要用於修繕本團體在 Willoughby 的設施，因為建築物的屋頂需要替換。142 不過，一部分收入也將用於擴大鼓勵人們在我們的收容所擔任志工的計畫。這些活動對於維持社區對我們工作的認知是必要的。</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>公告</span><small>143-146</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Jefferson 運動中心通知</h2>\n<p>143 從 4 月 8 日開始，室內游泳池將關閉一週。游泳池需要完全將水排空，然後清掃、修繕並且消毒。這是為每個人提供安全、衛生的環境而必須進行的年度程序。144 在這段時間，其他室內設施可以繼續使用。145 這些設施包括三溫暖、健身房與養生會館。室外游泳池也可以使用。我們對於這項工作可能造成的任何不便致歉。146 工作完成後，就會恢復正常營運。想知道更多消息與更新資訊，請在社交媒體上追蹤我們。</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-translation\"><div class=\"doc-ribbon\"><span>廣告</span><small>147-148</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">大部分的化妝品都會讓您起疹子或皮膚發癢嗎？Betteskin Cosmetics 公司正在找人來測試專為敏感肌的人所設計的新產品系列。</h2>\n<p>要報名參加，請上 www.betteskin.com。請在 6 月 30 日前回答簡短的線上問卷調查，幫助我們判定您的肌膚問題。我們會將產品試用品連同詳細說明寄到您家。每件產品都必須測試一週。作為回報，參加者將得到我們網站的 25 元優惠券。</p></div></section></div>","149-151":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 149-151</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>公告</span><small>149-151</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">給 Charlotte 食品雜貨店所有購物客的通知</h2>\n<p class=\"notice-subject\">Charlotte 食品雜貨店已經停止 Hero Coco Water 在店面的販售。由於在全世界的產品回收，這項商品目前無法取得，但只要回收命令解除就會重新進貨。</p>\n<p>目前，我們推薦試試看 Cocolait 與 Biba 品牌的椰子水。我們全國的店面都有販售這兩個品牌。與我們店面販售的所有產品相同，它們經過有機認證機構的認證，並且符合所有食品安全監管的要求。</p>\n<p>很抱歉造成不便。關於此事有任何疑慮，請到離您最近店面的顧客服務台。請記得在 www.charlottegrocer.com 註冊您的電子郵件位址，以獲得我們包含促銷優惠的每週電子報。</p></div></section></div>","152-153":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 152-153</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>對話訊息</span><small>152-153</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Christina Sanchez</strong><time class=\"chat-time\">[中午12:23]</time></div><div class=\"message-text\">Kenichi，可以請你延後我下午的會議嗎？我正在和 Kim 小姐吃午餐，她似乎準備好對 Lakewood 的房子出價了。所以，我不久就會開車載她到那間房子，希望我們會簽約。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kenichi Yamamoto</strong><time class=\"chat-time\">[中午12:24]</time></div><div class=\"message-text\">真是好消息。好，我可以把 Zhou 先生改到明天上午。你上午 9 點有空檔。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Christina Sanchez</strong><time class=\"chat-time\">[中午12:26]</time></div><div class=\"message-text\">我可以。請直接打電話給 Zhou 先生，不要寄電子郵件，因為這是臨時的變更。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kenichi Yamamoto</strong><time class=\"chat-time\">[中午12:27]</time></div><div class=\"message-text\">我會的。我面前有他的電話號碼。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Christina Sanchez</strong><time class=\"chat-time\">[中午12:29]</time></div><div class=\"message-text\">非常感謝你。除非有急事，不然請對其他任何打電話來的人都說我明天會回公司。</div></div></div></div></section></div>","154-155":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 154-155</span></div><div class=\"reading-stack\"><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>154-155</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Dennis Gunther d.gunther@bauerhoffarms.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Karina Schneider k.schneider@bauerhoffarms.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">最近的作物</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">8 月 19 日</span></div></div>\n<p>親愛的 Dennis：</p>\n<p>這一季，我們收穫的番茄似乎異常地多。數量遠遠超過我們的固定客戶在這一季開始前同意購買的。所以，我們需要想出賣掉多餘部分的方法。目前，我正在製作或許能在臨時通知的情況下接收我們多餘農作物的餐廳、飯店與小型食品雜貨店列表。同時，我希望你在我們本地的農夫市集販賣比平常更多的量。如果你認為有助於我們賣出更多番茄，就儘管降價。如果到了這禮拜的結尾，我們還是有太多番茄的話，我們可以把剩下的捐給社區中心或慈善團體。告訴我你是否有其他主意。我希望我們能將利潤最大化。</p>\n<p>Karina</p></div></section></div>","156-157":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 156-157</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>文章</span><small>156-157</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">共享經濟正走向盡頭？</h2>\n<p>4 月 23 日— 孟買正在採取措施，處理所謂共享經濟中的公司問題。昨天，孟買當局發布了針對公寓共享應用程式 Househunt 與運輸服務 CallAuto 之類公司的新規定。這兩家公司和其他類似公司，現在必須符合更嚴格的要求，才能在市內營運。例如，Househunt 將必須符合與市內飯店相同的衛生與安全標準，並且可能被限定於特定地區。至於 CallAuto，它將必須以對正職員工的方式對待它的司機，並且提供他們有薪假與健康保險。受影響的公司曾主張這些措施會傷害獲利能力。不過，官員反駁說，這些規定對於改善公眾安全與福利是必要的。</p></div></section></div>","158-161":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 158-161</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-translation\"><div class=\"doc-ribbon\"><span>廣告</span><small>158-161</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">介紹 Peacelid</h2>\n<p>Peacelid 是販賣可重複使用的杯子、吸管、用具的環保公司。我們的產品由 100% 竹子製造。Peacelid 的產品也是可生物分解的，所以它們在被丟棄後會安全且自然地分解。</p>\n<p>此外，Peacelid 提倡環保消費的實踐，並且將每次購買的 3% 捐給積極預防濫伐森林的組織。</p>\n<p>請上 www.peacelid.com 查看我們的產品目錄。新顧客第一次訂購可以在結帳頁面輸入代碼「PEACE20」享受 20% 折扣。此外，每筆 200 元以上訂單將附送免費可重複使用吸管。</p></div></section></div>","162-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 162-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>公告</span><small>162-164</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Gymspan 的顧客請注意</h2>\n<p class=\"notice-subject\">8 月開始，訂閱了 Gymspan 應用程式的使用者將無法在它的附屬健身中心網絡利用無限運動服務。我們對這項變更致歉，但這是必要的成本削減措施。</p>\n<p>目前加入無限量會員方案的顧客，可以繼續使用會員福利到目前的收費週期結束為止。之後，將自動被轉移到另一個方案。— [1] —。為了彌補這個改變，Gymspan 將贈送 500 點忠誠點數，它可以用來購買其他產品與服務。— [2] —。</p>\n<p>此外，Gymspan 已經對應用程式做了些改善。每個月，顧客都可以選擇輕鬆地轉換方案。您也可以在出國時暫時停止付款。— [3] —。最後，您有更多快速賺點數的方法。這些改善的用意是讓 Gymspan 的會員資格真正具有彈性，並且回應您的需求。— [4] —。欲知更多資訊，請上 www.gymspan.com，或者今天就下載應用程式。</p></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>信件</span><small>165-167</small></div><div class=\"document-body source-passages\"><p>11 月 20 日</p>\n<p>Bernard Davidson Whitfield 路 180 號 愛德蒙頓，亞伯達省 T5A 0A2</p>\n<p>親愛的 Davidson 先生：</p>\n<p>恭喜！在審閱您的申請資料後，我們決定頒發工程學學生的 Clark Newman 獎學金給您。這將能讓您在亞伯達技術學院追求機械工程學位時，獲得全額學費補助。</p>\n<p>如您所知，這項獎學金每年只頒發給 5 名申請者。申請者是依據其傑出的學業成績與對工程學的熱情而選出的。所有獲獎者是從超過 1,000 名申請者中選出的。</p>\n<p>在亞伯達技術學院的第一年，您會和其他工程學學生一起住在 Kensing House 這間小宿舍。它位於離工程大樓本館 Mitchell 館只有幾步路的地方。下週，我們會寄給您學生證和更多關於您居住環境的資訊。再次恭喜您！</p>\n<p>Donald Neilson 工程學院院長 亞伯達技術學院</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>文章</span><small>168-171</small></div><div class=\"document-body source-passages\"><p>聖莫尼卡（3 月 30 日）— 過去幾個月，一家提供客製化香水的新概念商店吸引了許多關注。它位於第 3 街觀光客頻繁往來的地點。顧客可以創造自己的香水，或者從數十種有獨特香氣組合的預製香水中購買。所有香水都使用天然精油。</p>\n<p>過去 4 年，店主 Sarah McKellen 靠著她關於香水的影片在社交媒體上培養了一群追隨者。— [1] —。去年，她開始在網路販賣她的創作。這項新創事業的成功，促使她在 1 月開設了第一家 Freesha 店面。令她驚訝的是，她在一週之內賣完了所有庫存。— [2] —。</p>\n<p>根據 McKellen 小姐的說法，大部分顧客喜歡創作香水這個主意。— [3] —。因此，她增設了最多可以讓 4 名來客同時觀看香水製作過程的小房間。未來 McKellen 小姐計畫擴展空間，以便舉辦較大團體的實作工作坊。— [4] —。</p></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>對話訊息</span><small>172-175</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">上午9:22</time></div><div class=\"message-text\">如你們所知道的，明天有為我們的植物園舉辦的重大募款活動。可以的話，我希望你們兩個在傍晚 6 點之前到。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sarah Chen</strong><time class=\"chat-time\">上午9:24</time></div><div class=\"message-text\">當然好。其實我打算提早到那裡。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Frank Daniels</strong><time class=\"chat-time\">上午9:27</time></div><div class=\"message-text\">我要到接近開始時間的時候才能到場，因為我必須在 Fry Factory 工作到傍晚 6:30。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">上午9:28</time></div><div class=\"message-text\">OK，謝謝你告訴我，Frank。Sarah，既然你會提早到，我想知道你能不能幫我擺設桌椅。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sarah Chen</strong><time class=\"chat-time\">上午9:30</time></div><div class=\"message-text\">我很樂意。我們決定好佈局配置了嗎？</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">上午9:31</time></div><div class=\"message-text\">好了。我會把房間應該呈現什麼樣子的圖片用電子郵件寄給你。Frank，既然你會在開始時間左右到這裡，可以請你在入口分發節目單嗎？</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Frank Daniels</strong><time class=\"chat-time\">上午9:32</time></div><div class=\"message-text\">好啊，當然。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">上午9:34</time></div><div class=\"message-text\">準備好迎接參加者，並且幫忙他們處理關於活動或如何捐款的任何問題。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Frank Daniels</strong><time class=\"chat-time\">上午9:35</time></div><div class=\"message-text\">知道了。我會在傍晚 6:45 前到那裡，也就是活動開始的 15 分鐘前。</div></div></div></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>176-180 · 1</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Olivia Brunelli olivia@nathalieresort.fr</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Roger Keller roger.keller@lowefinances.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">3 月 21 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">詢問</span></div></div>\n<p>親愛的 Brunelli 小姐：</p>\n<p>去年休假期間，我偶然發現您在羅謝莫爾美麗的僻靜度假場所。我當時預約了按摩，也十分享受那次經驗。我負責籌辦公司今年 5 月的旅遊，想要跟您預約。我們會迎接幾名來自海外的投資者，並且想要集體在那裡度過放鬆的時光。</p>\n<p>我們將在 5 月 3 日到 7 日住宿度假村。我們會在 5 月 3 日比較晚的晚上抵達，並且在 5 月 7 日比較早的時候離開。您可以為我們的投資者預約 5 月 4 日的 spa 療程嗎？他們總共有 8 個人。在那之後是晚餐。如果天氣允許的話，我們想要坐在室外安靜的區域。</p>\n<p>在旅行期間，我們需要 12 間單人房。我們也對品酒和參觀薰衣草農園有興趣。</p>\n<p>請回覆這封電子郵件，告訴我這一切是否都可行。期待和您進一步檢討預約的內容。</p>\n<p>Roger Keller Lowe Finances 公司</p></div></section><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>176-180 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Roger Keller roger.keller@lowefinances.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Olivia Brunelli olivia@nathalieresort.fr</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">3 月 25 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">您的詢問</span></div></div>\n<p>Keller 先生：</p>\n<p>感謝您很棒的訊息。我很高興您上次造訪時過得很愉快。很開心跟您報告，我們可以為您的團體提供住宿。我們可以為您的晚餐預留整個室外區域。不過，如果您（的安排）有彈性的話，這必須改到隔天晚上。您提出的日期已經被預約了。當然，我們也有室內的用餐空間。</p>\n<p>此外，我們同時只能接受 6 個 spa 預約。關於其他活動，可以在您到達以後預約。</p>\n<p>請告訴我們您希望如何進行。</p>\n<p>Olivia Brunelli 度假村經理 Nathalie 度假村與 spa</p></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單</span><small>181-185 · 1</small></div><div class=\"document-body source-passages\"><p>表單</p>\n<p>所有入境乘客都必須填妥下表。如果您和家人一起旅行，請填寫一張代表團體。入境時，請向海關人員連同護照出示本表。</p>\n<div class=\"responsive-table\"><table><tr><th>欄位</th><th>填寫內容</th></tr><tr><td>姓</td><td>Larson</td></tr><tr><td>名</td><td>Harry</td></tr><tr><td>中間名</td><td>Hughes</td></tr><tr><td>同行家人數</td><td>3</td></tr><tr><td>住址</td><td>Pingree 路 88 號，史丹福，康乃狄克州 06831</td></tr><tr><td>護照發行國家</td><td>美國</td></tr><tr><td>本次旅行拜訪國家</td><td>西班牙、葡萄牙</td></tr></table></div><p class=\"form-answer\">本次旅行目的：□ 商務　□ 度假　☑ 其他</p>\n<div class=\"field-row\">□ 商務</div>\n<div class=\"field-row\">□ 度假</div>\n<div class=\"field-row\">☑ 其他</div>\n<p>其他目的請說明：我的家人和我飛到西班牙幫爸爸搬進新家。然後我們去葡萄牙進行了短暫的觀光。</p>\n<p>您是否攜帶任何水果、肉類或動物？</p>\n<div class=\"field-row\">□ 是</div>\n<div class=\"field-row\">□ 否</div>\n<p>若是，請在此列出：不適用</p>\n<p>簽名：Harry Larson</p></div></section><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>181-185 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Harry Larson harrylarson@worldmail.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">顧客服務 service@internationalairlines.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">回覆：要求</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">7 月 28 日</span></div></div>\n<p>親愛的 Larson 先生：</p>\n<p>謝謝您寫信告訴我們您遺失了旅行袋。在大範圍搜尋後，我們終於找到它，而我們將會寄送到您的住家地址。很抱歉造成您的不便。</p>\n<p>為了補償您遺失旅行袋這件事，我們會在您的帳戶增加 8,000 個飛行點數。根據我們的紀錄，這意味著您現在有資格兌換一組國內來回機票。您可以隨時利用這個優惠。要使用這個優惠，請上我們的網站，並且在結帳過程中點擊「兌換我的飛行點數」。</p>\n<p>國際航空公司客服部</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-brochure type-translation type-catalog\"><div class=\"doc-ribbon\"><span>介紹手冊</span><small>186-190 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Mario's 地中海料理外燴服務</h2>\n<p>Mario's 已經營業超過 30 年。它仍然為創辦人 Mario Robledo 所擁有，但目前由他的弟弟 Sandro 經營。這家外燴公司供應種類廣泛的菜色。另外，它在 Market 街 7738 號還擁有包括室內與室外座位的活動空間。室外露台在 5 月 1 日至 9 月 30 日間開放。</p>\n<p>Mario's 也可以配合所有飲食需求與食物過敏的情況。</p>\n<p>可利用的菜單如下：</p>\n<div class=\"responsive-table\"><table><thead><tr><th>菜單</th><th>菜色種類</th><th>每人價格</th></tr></thead><tbody><tr><td>菜單 A</td><td>2 道開胃菜、2 道主菜、1 道甜點</td><td>30 元</td></tr><tr><td>菜單 B</td><td>菜單 A + 1 道開胃菜</td><td>35 元</td></tr><tr><td>菜單 C</td><td>菜單 B + 1 道主菜</td><td>40 元</td></tr><tr><td>菜單 D</td><td>菜單 C + 1 道甜點</td><td>45 元</td></tr></tbody></table></div>\n<div class=\"field-row\">* 40 人以上團體適用 20% 折扣</div>\n<p>除非另外標示，不然所有菜單都包含蔬菜選項。如果有特別要求，或者要完成預訂，請上 www.marios.com。</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單</span><small>186-190 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Mario's 外燴申請表</h2>\n<p>聯絡人姓名：Marissa Thomas 團體：Madison 私人銀行 電子郵件：m.thomas@madisonprivatebank.com 活動日期：8 月 28 日 活動時間：傍晚 7 點 賓客人數：45</p>\n<p>設施：Mario's X 其他 其他地點請在此說明：Madison 私人銀行辦公室</p>\n<p>偏好菜單： 菜單 A 菜單 B 菜單 C 菜單 D X</p>\n<p>備註： 我不記得我們在去年的活動吃了哪些菜，但非常美味。今年的客戶感謝晚宴來點不太一樣的也不錯，什麼都可以。請務必包含至少一份純素開胃菜和主菜。</p></div></section><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>186-190 · 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">團隊</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Marissa Thomas</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">8 月 25 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">即將到來的晚宴</span></div></div>\n<p>我想提醒各位，我們的年度客戶感謝晚宴在 9 月 3 日星期三舉行。請注意日期變更了。我們預期這次大部分是新客戶，我也相信他們會喜歡供應的東西。其中一位客戶 Kim 小姐是純素食者，所以我確保了會有她可以吃的一份主菜和一份開胃菜。而且，除了一般的點心以外，我也追加了我認為你們都會喜歡的水果拼盤。請務必穿著正式服裝，因為這被認為是商務場合。期待在那裡見到各位。</p></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>191-195 · 1</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">全體員工 staff@craftmagazine.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Alicia Mendez a.mendez@craftmagazine.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">搬遷</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">4 月 23 日</span></div></div>\n<p>親愛的員工：</p>\n<p>在漫長的尋找之後，我們終於決定了這家雜誌社新的辦公室。它是位於奧爾斯頓 Grant 街 82 號 5 樓的辦公室。它比我們目前的地點寬敞許多，所以能容納我們過去幾週雇用的新寫手與廣告宣傳員工。此外，它位於公車站附近，樓下有披薩店，也有眺望美麗的 Charles 河的窗景。</p>\n<p>我們將在租約開始的 5 月 1 日開始搬到新的辦公室。如果你在那個星期六有空，而且能幫忙的話，請告訴我。我原本會租兩輛卡車，但如果有人有大型廂型車或皮卡車能讓我們使用，我就只需要租一輛。如果有可以使用的車輛，請馬上告訴我。</p>\n<p>Alicia Mendez 總編輯，Craft 雜誌社</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單</span><small>191-195 · 2</small></div><div class=\"document-body source-passages\"><p>www.bostontruckhire.com</p>\n<p>波士頓卡車租用</p>\n<div class=\"responsive-table\"><table><tr><th>租車項目</th><th>填寫內容</th></tr><tr><td>姓名</td><td>Alicia Mendez</td></tr><tr><td>電話號碼</td><td>555-9182</td></tr><tr><td>駕照號碼</td><td>013403412</td></tr><tr><td>租用日期</td><td>5 月 1、2 日</td></tr><tr><td>車輛數</td><td>1</td></tr><tr><td>預估行駛距離</td><td>10 英里</td></tr><tr><td>領車地點</td><td>Cooper 街 32 號，波士頓</td></tr><tr><td>還車地點</td><td>West Harding 街 918 號，波士頓</td></tr><tr><td>備註</td><td>目前，我需要用車 48 小時。如果我決定使用更長的時間，我會通知工作人員。</td></tr></table></div></div></section><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>網頁</span><small>191-195 · 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">波士頓 &gt; 分類廣告 &gt; 出售</h2>\n<p>Craft 雜誌正在搬往新地點，並更換設備，所以我們有一些物品要出售。其中包括 DX 彩色印表機、XRM6 傳真機、機齡 5 年的 Vista Plus 筆記型電腦、20 吋電腦螢幕、5 個鍵盤。如果您對這些物品有興趣，請寄信到 a.mendez@craftmagazine.com 聯絡 Alicia Mendez。價錢可以商量。我們甚至願意免費贈送一些物品。請注意，這些物品要到我們搬遷的第三天，也就是最後一天的 5 月 3 日才能取走。那一天我們會把最後一批東西裝進搬家卡車，並且永久關閉我們的舊辦公室。</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>網頁</span><small>196-200 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">關於 Rolando Esteban</h2>\n<p>Rolando Esteban 是一位視覺藝術家，他因為俐落的筆刷線條、動態的構圖與生動的色彩而贏得了讚賞。</p>\n<p>成長於馬尼拉，Esteban 先生接觸了各種形式的美國流行文化，並且受到著名漫畫插畫家 Chad Grohl 的啟發。Esteban 先生自學畫畫，儘管缺少正式訓練，他還是創作了許多代表性的電影與旅遊海報。他在 30 歲時離開馬尼拉，到馬德里追求繪畫獎學金，他最終在那裡發展了自己標誌性的繪畫風格。</p>\n<p>現在，馬德里的 Vivi 美術館將舉辦涵蓋 Esteban 先生後期作品的展覽。名為「Brush and Line」的這場展覽預定 8 月 21 日舉行開幕茶會，並且在 8 月 22 日開放大眾參觀。</p></div></section><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>備忘錄</span><small>196-200 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Vivi 視覺藝術美術館 備忘錄</h2>\n<p>收件者：Leon Aguilar 寄件者：Esther Hernandez 主旨：Brush and Line 日期：7 月 20 日</p>\n<p>我們必須將「Brush and Line」改期，因為展覽廳必須進行一些短暫的整修。我們唯一能安排這項工程開始的時間是開幕茶會當天。我跟藝術家談過了，他同意了 8 月 30 日這個新的開幕日期。這意味著我們必須把開幕茶會的日期改到 8 月 28 日。下一場預定的展覽也必須改期，所以我希望你跟那位藝術家溝通，看看哪些新日期是可以接受的。</p></div></section><section class=\"document-card type-schedule type-translation\"><div class=\"doc-ribbon\"><span>日期表</span><small>196-200 · 3</small></div><div class=\"document-body source-passages\"><p>Vivi 視覺藝術美術館 展覽檔期表</p>\n<p>美術館開放時間為週二至週六上午 10 點至下午 6 點。開幕茶會於週一下午 6 點至晚間 8 點舉行。</p>\n<p>7 月 12 日至 7 月 29 日 Delia Romano: Of One Mind 開幕茶會 7 月 10 日</p>\n<p>8 月 2 日至 8 月 19 日 Tom Moskowitz: Ba Bi Bo Bu 開幕茶會 7 月 31 日</p>\n<p>8 月 30 日至 9 月 20 日 Rolando Esteban: Brush and Line 開幕茶會 8 月 28 日</p>\n<p>9 月 27 日至 10 月 14 日 Remy Artaud: Up is Down 開幕茶會 9 月 25 日</p></div></section></div>"};const DETAILED_EXPLANATIONS={"101":{"type":"副詞位置","translation":"消費者調查顯示，人們願意花最多 1,200 元在新電腦上。","reason":"能夠用在助動詞（would）和動詞原形（spend）之間，並且修飾動詞的副詞 (B) happily（樂意地）是正確答案。形容詞 (A) 和 (D)、名詞 (C) 都不能修飾動詞。","vocab":"consumer n. 消費者　survey n. （問卷）調查　happiness n. 幸福，快樂","paraphrase":""},"102":{"type":"人稱代名詞的格","translation":"人稱代名詞的格","reason":"可以在名詞（chances）前面做修飾，功能相當於形容詞的所有格人稱代名詞 (B) your 是正確答案。主格或受格人稱代名詞 (A)、所有代名詞 (C)、反身代名詞 (D) 都不能修飾名詞。","vocab":"well-organized adj. 有條理的　résumé n. 履歷　boost v. 提高，增加　chance n. 可能性，機會","paraphrase":""},"103":{"type":"【可以接在 be 動詞後面的成分】被動態（be + p.p.）","translation":"","reason":"空格接在 be 動詞後面，所以名詞 (A)、能構成被動態的 p.p. 形 (C)、能構成進行式的 -ing 形 (D) 是可能的答案。因為要表達插畫被刊載在雜誌上的被動意義，所以能和空格前面的 be 動詞（been）構成被動態的 p.p. 形 (C) published 是正確答案。名詞 (A) 雖然可以接在 be 動詞後面當補語，但因為表示和主詞相同的對象，所以意思會變成「插畫曾經是出版者」，並不恰當。如果使用 -ing 形 (D)，則會形成現在完成進行式，意思變成「插畫曾經在進行出版的行為」，所以不對。動詞原形 (B) 不能接在 be 動詞後面。","vocab":"illustration n. 插畫　publisher n. 出版者，出版社","paraphrase":""},"104":{"type":"接 to 不定詞的動詞","translation":"慈善商店的 24 小時投入箱，讓人們能夠在方便的時候隨時捐贈二手衣物。 接 to 不定詞的動詞","reason":"空格前面的動詞 allow（使……可以做……），後面可以接 to 不定詞當受詞補語，所以 to 不定詞 (A) to donate 是正確答案。第三人稱單數動詞 (B)、動名詞或現在分詞 (C)、名詞 (D) 不能用在 allow 的受詞補語（to 不定詞）位置。就算想把現在分詞 (C) 看成修飾前面名詞（people）的成分，但因為 allow 是第 5 類句型動詞，這樣會使句子缺少句型所需要的受詞補語，所以不對。雖然也可以把 allow 看成第 4 類句型動詞的用法「容許，給予」，並且使用選項 (D) donation 而構成「allow + 間接受詞（people）+ 直接受詞（donation）」；但缺少了能連結後面名詞 used clothes 的連接詞，所以不對。","vocab":"charity n. 慈善，慈善團體　used adj. 用過的，二手的　donate v. 捐贈　donation n. 捐款，捐獻","paraphrase":""},"105":{"type":"名詞慣用表達方式","translation":"Chemie's 冰淇淋提供每個季節不同的各種產品。","reason":"句意是「提供各種產品」，所以能和空格前面的不定冠詞（an）、後面的介系詞（of）構成 an assortment of（各種的）的名詞 (B) assortment（各種各樣的混合）是正確答案。(A) interest 表示「興趣」，(C) advent 表示「到來，出現」，(D) influence 表示「影響」。","vocab":"offer v. 提供","paraphrase":""},"106":{"type":"副詞比較級","translation":"","reason":"空格後面有 than ever before（比以往任何時候），所以需要比較級副詞 (C) more quickly 是正確答案。原級副詞 (B) 不能和 than 連用。形容詞 (A) 不能修飾動詞。最高級副詞 (D) 不能和 than 連用。","vocab":"reward points phr. 紅利點數　credit card phr. 信用卡","paraphrase":""},"107":{"type":"題意解析","translation":"","reason":"句意是「根據從用餐者收集到的回饋意見」，所以名詞 (C) feedback（回饋意見）是正確答案。(A) content 表示「內容」，(B) procedure 表示「程序」，(D) investigation 表示「調查」。","vocab":"diner n. 用餐者　be satisfied with phr. 對……感到滿意","paraphrase":""},"108":{"type":"介系詞選位置","translation":"","reason":"句意是「Sally's 糖果店是 Grant 街上從主廣場數來的第三棟建築物」，所以表示起點的介系詞 (A) from（從……）是正確答案。(B) among 表示「在……之中」，(C) under 表示「在……之下」，(D) above 表示「在……上方」。","vocab":"main square phr. 主廣場","paraphrase":""},"109":{"type":"攝影大賽的優勝者將由 5 名知名評審組成的評審團決定。","translation":"攝影大賽的優勝者將由 5 名知名評審組成的評審團決定。","reason":"句意是「大賽的優勝者會由評審團決定」，所以動詞 determine（決定）的 p.p. 形 (B) determined 是正確答案。(A) contain 表示「包含，含有」，(C) implement 表示「實施」，(D) interpret 表示「詮釋」。","vocab":"competition n. 比賽，競爭　panel of judges phr. 評審團　distinguished adj. 著名的","paraphrase":""},"110":{"type":"題意解析","translation":"","reason":"句意是「新車陣容將在明年初的車展揭曉」，所以副詞 (C) early（在初期）是正確答案。(A) previously 表示「之前」，(B) typically 表示「典型地，一般」，(D) highly 表示「非常」。","vocab":"unveil v. 揭露，發表（新計畫、產品等）　annual adj. 年度的，每年的","paraphrase":""},"111":{"type":"【動詞位置】主動態與被動態的區分","translation":"","reason":"when 引導的從屬子句（when she ~ vacation）只有主詞（she），缺少了動詞，所以動詞 (A) 和 (D) 是可能的答案。因為要表達「在 Springs 小姐休假完回到辦公室的時候」的主動意義，所以主動態 (A) returns 是正確答案。另外，表時間的副詞子句連接詞（when）後面，會用現在式表示未來的情況。如果使用被動態 (D) 的話，意思會變成「Springs 小姐從休假中被歸還」，所以不對。動名詞或現在分詞 (B) 和 to 不定詞 (C) 不能用在動詞的位置。","vocab":"","paraphrase":""},"112":{"type":"介系詞選位置","translation":"當公司最優先看待顧客的需求時，通常會帶來回頭客的生意。","reason":"When 引導的副詞子句（When companies ~ else）是已經具備主詞（companies）、動詞（prioritize）、受詞（their customers' needs）的完整子句，所以 all else 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表達「最優先看待顧客的需求」，所以表示位置的介系詞 (A) above（在……之上）是正確答案。(C) within 表示位置或範圍「在……之內」，(D) toward 表示方向「往……」。 (B) where 不能引導修飾片語。","vocab":"prioritize v. 優先考慮　need n. 需求　generate v. 產生　repeat business phr. 回頭客帶來的生意（再度購買）","paraphrase":""},"113":{"type":"名詞位置","translation":"工程師主張，對現有的太陽能板稍微修改，會使它們更有效。","reason":"空格在不定冠詞（a）後面，而且被形容詞（slight）修飾，所以名詞 (D) modification（修改）是正確答案。動詞 (A)、過去式動詞或過去分詞 (B)、形容詞 (C) 不能用在名詞位置。","vocab":"claim v. 主張　slight adj. 稍微的　existing adj. 現有的　solar adj. 太陽的　modify v. 修改　modifiable adj. 可修改的","paraphrase":""},"114":{"type":"動詞慣用表達方式","translation":"居住在 Waterford 公寓的房客，必須在每月 1 日支付房租。","reason":"句意是「居住在 Waterford 公寓的房客」，所以能和空格後面的介系詞（in）構成 reside in（居住在……）的動詞 (C) reside（居住）是正確答案。(A) occupy（佔據，住）意義上似乎說得通，但因為是及物動詞，所以不能和介系詞 in 一起使用。(B) engage 和空格後面的介系詞（in）連用而形成 engage in 時，表示「參與……」，意思不對。(D) visit 表示「拜訪」。","vocab":"tenant n. 租戶　rent n. 租金","paraphrase":""},"115":{"type":"形容詞","translation":"沒有足夠的公眾注資，Scott 基金會就必須從民間來源募集更多錢。","reason":"句意是「沒有足夠的公眾注資，必須從民間來源募集更多錢」，所以形容詞 (A) adequate（足夠的，適當的）是正確答案。(B) incompetent 表示「無能的」，(C) receptive 表示「善於接受的」，(D) delightful 表示「令人愉快的」。","vocab":"raise v. 募集　private adj. 私人的，民間的","paraphrase":""},"116":{"type":"【引導修飾性語句的成分】副詞子句連接詞","translation":"即使只有 2 年經驗，Black 先生還是被任命為 TVD 公司的區域業務主任。","reason":"這個句子已經有具備主詞（Mr. Black）、動詞（was named）、補語（the regional sales director）的完整子句，所以 ~ experience 是修飾性的語句。修飾部分有動詞（had），所以能引導修飾子句的副詞子句連接詞 (A) Even though（即使……）是正確答案。介系詞 (B) As a result of（因為……而造成結果）、(C) In spite of（儘管……）引導的是修飾片語，而不是子句。(D) So as to（為了……）後面要接動詞原形。","vocab":"experience n. 經歷，經驗 v. 經歷　name v. 任命　regional adj. 地區的","paraphrase":""},"117":{"type":"副詞位置","translation":"","reason":"空格修飾後面的過去分詞（charged），所以副詞 (B) accidentally（意外地）是正確答案。形容詞 (A)、名詞 (C) 和 (D) 不能修飾過去分詞。","vocab":"charge v. 收費　refund n. 退款　issue v. 發行，發出","paraphrase":""},"118":{"type":"Manuel 公司的員工現在將獲得人壽保險保障，作為其雇用福利之一。","translation":"Manuel 公司的員工現在將獲得人壽保險保障，作為其雇用福利之一。","reason":"句意是「作為其雇用福利之一」，所以名詞 (B) benefits（福利）是正確答案。(A) skills 表示「技能」，(C) concerns 表示「關切的事」，(D) deductions 表示「扣除額」。","vocab":"life insurance coverage phr. 人壽保險保障　employment n. 雇用","paraphrase":""},"119":{"type":"Jung 小姐得知自己將被調到休士頓辦公室時感到不悅，因為她從未要求調動。","translation":"Jung 小姐得知自己將被調到休士頓辦公室時感到不悅，因為她從未要求調動。","reason":"句意是「因為她從未要求調動」，所以副詞 (D) never（從未）是正確答案。(A) before 表示「之前」，(B) already 表示「已經」，(C) often 表示「經常」。","vocab":"displeased adj. 不悅的　transfer v. 調動","paraphrase":""},"120":{"type":"介系詞","translation":"","reason":"句意是「儘管天氣預報會下雨，本週末的鳳凰城馬拉松仍將按計畫舉行」，所以表示讓步的介系詞 (B) notwithstanding（儘管……）是正確答案。(A) aside from 表示「除了……以外」，(C) regarding 表示「關於……」，(D) according to 表示「根據……」。","vocab":"marathon n. 馬拉松　take place phr. 舉行　forecast n. 預報","paraphrase":""},"121":{"type":"形容詞","translation":"非常歡迎 Shiller 兒童博物館的參觀者和展示品互動。","reason":"句意是「歡迎參觀者和展示品互動」，所以形容詞 (B) welcome（受到歡迎的，被允許的）是正確答案。(A) pleasant（令人愉快的）意思似乎說得通，但它不能表達人的感情，而應該改用 pleased（高興的）來表達才對。(C) obvious 表示「明顯的」。(D) brilliant 表示「傑出的」。","vocab":"interact v. 互動　on display phr. 展示中的","paraphrase":""},"122":{"type":"對等連接詞","translation":"Paulson 電子公司可以用一般郵件或額外收費的快速運送產品。","reason":"介系詞（by）的受詞是 regular mail 和 express delivery 這兩個名詞片語，中間需要用對等連接詞連接，而且要表達「用一般郵件或快速運送產品」，所以對等連接詞 (D) or（或者）是正確答案。(A) so（所以）只能連接兩個子句，而不能連接單字或片語，所以不對。(B) up 表示「往……上」。(C) at 表示「在……」。","vocab":"ship v. 運送　express adj. 快速的，快捷的　involve v. 涉及，需要　charge n. 收費","paraphrase":""},"123":{"type":"類似意義的名詞","translation":"電視廣告播放後，Seaborn Cruises 公司收到大量來自潛在乘客的詢問。 類似意義的名詞","reason":"句意是「收到大量來自潛在乘客的詢問」，所以名詞 (D) volume（量）是正確答案。(A) size（規模，大小）意思似乎說得通，但它是表示事物或現象的大小，而不是數量。(B) result 表示「結果」。(C) majority（多數）似乎意思接近，但它是表示特定群體中的多數，所以不對。","vocab":"commercial n. 廣告 adj. 商業的　air v. 透過廣播、電視等方式播送　inquiry n. 詢問　potential adj. 潛在的，可能的　passenger n. 乘客","paraphrase":""},"124":{"type":"【引導修飾性語句的成分】副詞子句連接詞時間","translation":"","reason":"這個句子已經有具備主詞（The musicians）和動詞（practiced）的完整子句，所以 ~ set up 是修飾性的語句。修飾部分有動詞（was being set up），所以能引導修飾子句的副詞子句連接詞 (B) 和 (D) 是可能的答案。因為要表達「舞台搭建時，樂手們在後面的房間練習」，所以表示時間的副詞子句連接詞 (B) as（當……時）是正確答案。如果使用 (D) unless（除非……），意思會變成「除非舞台正在被搭建，不然樂手們就會在後面的房間練習」，不符合要表達的意思。(A) in order to（為了……）後面要接原形動詞，介系詞 (C) during 不能引導修飾子句。","vocab":"practice v. 練習　back room phr. 後面、後台的房間　set up phr. 設置，搭建","paraphrase":""},"125":{"type":"題意解析","translation":"","reason":"句意是「藉由回收電池，就有可能減少有毒物質總量」，所以 (B) reduce（減少）是正確答案。(A) seize 表示「抓住」，(C) satisfy 表示「滿足」，(D) reserve 表示「預約」。","vocab":"rather than phr. 而不是　discard v. 丟棄　toxic adj. 有毒的　landfill n. 垃圾掩埋場","paraphrase":""},"126":{"type":"數量表達方式","translation":"","reason":"能夠修飾空格後面複數可數名詞（two weeks）的數量詞 (A)、(B)、(C) 是可能的答案。因為要表達「服務生每 2 週領一次薪水，時薪 9 元」，所以數量詞 (C) every（每……）是正確答案。另外，請記得 every 表示「全體」的意思時，後面要接單數可數名詞。(A) most（大部分的）、(B) all（全部的）用在這裡會變成「大部分的／全部的 2 週」，不符合要表達的意思。限定詞 (D) either 表示兩個之中的任何一個，後面必須接單數名詞，也會搭配 or 以相關連接詞 either A or B（不是 A 就是 B）的形式使用。","vocab":"","paraphrase":""},"127":{"type":"【引導修飾性語句的成分】現在分詞 vs. 過去分詞","translation":"","reason":"這個句子已經有具備主詞（Novels）、動詞（are）和補語（popular）的完整子句，所以 ~ events 是修飾性的語句。修飾部分修飾空格前面的名詞（Novels），所以能引導修飾性語句，同時在名詞後面做修飾的過去分詞 (A) 和現在分詞 (D) 是可能的答案。因為被修飾的名詞（Novels）和分詞之間是「小說被建立在事實的基礎上」的被動關係，所以動詞 base（把……建立在某個基礎上）的過去分詞 (A) based 是正確答案。如果使用現在分詞 (D)，意思會變成「在進行建立基礎這個行為的小說」，所以不對。動詞 (B)、動詞或名詞 (C) 不能在名詞後面做修飾。","vocab":"popular adj. 受歡迎的　age group phr. 年齡層","paraphrase":""},"128":{"type":"【形容詞】","translation":"","reason":"句意是「在被設計得盡可能全面的訓練課程中，這份工作的所有方面都會被介紹到」，所以形容詞 (C) comprehensive（全面的）是正確答案。(A) decorative 表示「裝飾的」。(B) protective 表示「保護的」。(D) tentative 表示「暫定的，試驗性的」。","vocab":"aspect n. 方面　cover v. 涵蓋，包括　training course phr. 訓練課程","paraphrase":""},"129":{"type":"【名詞位置】可數名詞與不可數名詞","translation":"為了討論供給短缺的可能解決方法，總統會見了國內幾個最大的製造業者。","reason":"空格前面的形容詞可以修飾名詞，所以名詞 (A)、(C)、(D) 是可能的答案。因為空格前面有表達數量的 several of the，所以複數可數名詞 (D) manufacturers（製造業者們）是正確答案。(A) manufacturer（製造業者）是單數可數名詞，而 (C) manufacture 是不可數名詞，所以不對。另外，(C) 如果表示「產品」的話，是可數名詞，而會有複數形。動詞或過去分詞 (B) 不能被形容詞修飾。","vocab":"president n. 總統，總裁　shortage n. 短缺","paraphrase":""},"130":{"type":"未正確提交納稅申報單，可能會收到國稅局的修正要求。","translation":"未正確提交納稅申報單，可能會收到國稅局的修正要求。","reason":"句意是「沒有正確提交納稅申報單」，所以 (D) properly（適當地，正確地）是正確答案。(B) moderately（適度地）似乎意思相近，但實際上是用來表達程度不過度、數量適中而不過多的意思。(A) nearly 表示「幾乎」，(C) narrowly 表示「勉強地，差一點地」。","vocab":"file v. 提交　tax form phr. 納稅申報單　amendment n. 修正","paraphrase":""},"131":{"type":"選出適當的句子","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的內容提到會議的主要討論主題是明年的部門預算，而上一句 This is a subject of vital importance. 這是非常重要的主題，所以空格的內容應該和會議討論主題的重要性有關，(D) Therefore, the company's CEO will join us 是正確答案。(A) 雖然也和會議要討論的預算有關，但因為是要討論明年的預算，所以應該不會是已經決定了，而不能選這個答案。","vocab":"recognized adj. 公認的　expert n. 專家　temporary adj. 暫時的　setback n. 挫折","paraphrase":""},"132":{"type":"主動態與被動態的區分","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"動詞 need 後面可以接 to 不定詞當受詞，所以能和空格前的 to 組成 to 不定詞的動詞原形 (A)、包含動詞原形的 (C) 和 (D) 是可能的答案。另外，請注意 need 所在的 that 子句（that ~ budget）是由主格關係代名詞 that 引導的關係子句，修飾先行詞（changes）。因為空格後面沒有受詞，而且要表達「需要被做出的改變」，所以被動態 (C) be made 是正確答案。主動態 (A) 和 (D) 後面必須要有受詞，而且意思會變成「變化做～／變化正在做～」的意思，所以不對。過去式動詞或過去分詞 (B) 不能形成 to 不定詞。","vocab":"","paraphrase":""},"133":{"type":"名詞位置","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"空格被前面的形容詞（unnecessary）修飾，所以名詞 (D) expenses（花費）是正確答案。過去式動詞或過去分詞 (A)、動詞 (B)、形容詞 (C) 不能用在名詞的位置。","vocab":"expend v. 花費　expensive adj. 貴的","paraphrase":""},"134":{"type":"動詞詞彙 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「確認收到備忘錄」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，只要跟助理 Hertz 小姐確認出席就可以了，由此可知寄件者希望收件者通知 Hertz 小姐並確認出席，(D) acknowledge（確認收到）是正確答案。(A) explain 表示「說明」，(B) confide 表示「吐露（秘密）」，(C) remember 表示「記得」。\n\n135-138 題參照以下評論。\n\nThe first time I went to True Colors Paint Supply, I received 135 customer service. Unfortunately, my second experience with them was not nearly as good. Yesterday when I went in, there were no employees at the front of the store. After ten minutes of looking at color samples, an employee finally approached me. However, she excused herself almost immediately in order to go answer the phone. 136 If that weren't bad enough, someone else made a mistake on my order when I finally got some help. I 137 for Candy Apple Red but was given Scarlet Red instead. Next time, I will shop at another store that 138 more attention to its customers.\n\n135 我第一次到 True Colors 油漆用品店時，得到了優秀的顧客服務。遺憾的是，我在那裡的第二次經驗遠不如上次那麼好。昨天我進去的時候，店裡的櫃台沒有任何員工。我看了 10 分鐘的色票之後，終於有一名員工走近我。不過，她幾乎是馬上就說要接電話而離開了。136 說實話，看到這麼不專業的行為，讓我感到很震驚。更糟的是，在我終於得到幫助的時候，另一個人在我的訂單方面犯了錯。137 我要求了 Candy Apple Red，卻得到了 Scarlet Red。138 下一次，我會在比較關心顧客的店購物。","vocab":"","paraphrase":""},"135":{"type":"形容詞詞彙 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「得到了優秀的顧客服務」，所以 (B) excellent（優秀的）是正確答案。(A) questionable 表示「有問題的」，(C) deficient 表示「缺乏的」，(D) gradual 表示「逐漸的」。","vocab":"customer service phr. 顧客服務　not nearly phr. 一點也不……　approach v. 接近　excuse oneself phr. 請求准予離開　immediately adv. 馬上，立即　mistake n. 錯誤，失誤　attention n. 注意","paraphrase":""},"136":{"type":"選出適當的句子","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的部分提到進去的時候，店裡的櫃台沒有任何員工，等了 10 分鐘才有人走近，而空格的上一句 However, she excused herself almost immediately in order to go answer the phone. 說那個人幾乎是馬上就說要接電話而離開了，所以空格的內容應該和顧客遇到這種情況的反應有關，(C) Honestly, I was shocked to witness such unprofessional behavior 是正確答案。","vocab":"importantly adv. 重要地　loyal adj. 忠實的　witness v. 目擊，見證 n. 目擊者，見證人　various adj. 各種的，多樣的","paraphrase":""},"137":{"type":"過去完成式","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"主要子句（I ~ Candy Apple Red）發生的事「顧客要求 Candy Apple Red」，發生的時間比 but 引導的子句（but ~ instead）「得到 Scarlet Red」來得早。注意 but 引導的子句（but ~ instead）省略了重複的主詞（I）。因為 but 子句是過去式（was given），所以表示過去特定時間點之前曾經發生什麼的過去完成式 (C) had asked 是正確答案。過去式 (A)、現在進行式 (B)、未來式 (D) 不能表示過去特定時間點之前發生的事。","vocab":"","paraphrase":""},"138":{"type":"慣用的詞彙搭配","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「在比較關心顧客的店購物」，所以能和空格後面的 attention to 構成 pay attention to「關注……」的動詞 pay（付出）的第三人稱單數形 (A) pays 是正確答案。如果使用 (D) 的 draw（引起「注意」），意思會變成「去引起顧客關注的店購物」，不符合文章要表達的意思。而且，draw 的表達方式應該是 draw attention from（引起……的關注）才對。(B) consider 表示「考慮」，(C) understand 表示「理解」。\n\n139-142 題參照以下電子郵件。\n\nTo: Julie Evans julie@juliepaints.com\nFrom: David Whetzel director@artunlimited.com\nSubject: Art class\nDate: February 12\n\nDear Ms. Evans,\n\nI recently saw your work at Wave Gallery and wanted to tell you that I was very impressed by your unique style. 139 I'm writing today as I run a small art studio 140 painting classes several times a week. We occasionally invite artists who can teach our students something other than basic oil or acrylic painting techniques, and I was wondering whether you would be interested in being our next guest instructor. You would have a lot of 141 in planning the class. As the teacher, you alone would decide on the materials to use and the concepts to teach.\n\nI look forward to hearing from you. This e-mail address is the best way to contact me 142 you are interested.\n\nSincerely,\nDavid Whetzel\nDirector of Art Unlimited\n\n收件者：Julie Evans julie@juliepaints.com\n寄件者：David Whetzel director@artunlimited.com\n主旨：藝術課\n日期：2 月 12 日\n\n親愛的 Evans 小姐：\n\n我最近在 Wave 藝廊看到您的作品，想要告訴您，我對您獨特的風格印象深刻。139 我從來沒看過跟您的作品一樣的畫。140 我今天之所以寫信，是因為我經營一個每週舉辦幾次繪畫課的小型藝術工作室。我們偶爾會邀請可以教學生在基礎油畫或壓克力顏料畫技法以外的東西的藝術家，而我想知道您是否有興趣擔任我們下一位客座講師。141 您在規劃課程方面會有許多彈性。身為老師，您會獨自決定要使用的材料，以及要教的概念。\n\n期待您的回覆。142 要是您有興趣的話，這個電子郵件位址是聯絡我的最佳方式。\n\nDavid Whetzel\nArt Unlimited 總監","vocab":"","paraphrase":""},"139":{"type":"選出適當的句子","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 I recently saw your work at Wave Gallery and wanted to tell you that I was very impressed by your unique style. 提到，「我」（Whetzel 先生）最近在 Wave 藝廊看到 Evans 小姐的作品，想要表達自己對她獨特的風格印象深刻，所以空格的內容應該和看到作品的感想有關，(D) I've never seen paintings that look quite like yours 是正確答案。","vocab":"","paraphrase":""},"140":{"type":"【引導修飾性語句的成分】關係代名詞的位置與用法","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"as 開頭的從屬子句（as ~ week），是具備主詞（I）、動詞（run）和受詞（a small art studio）的完整子句，所以 ~ week 是修飾性的語句。修飾部分是修飾空格前面的名詞（art studio），所以包含可修飾名詞的主格關係代名詞與關係子句動詞的 (B)、包含現在分詞的 (D) 是可能的答案。因為要表達「每週舉辦幾次繪畫課的小型藝術工作室」，所以能夠引導以 art studio 為先行詞的關係子句，而且包括在關係子句中擔任主詞的主格關係代名詞、關係子句中的動詞的 (B) that holds 是正確答案。包含現在分詞的 (D) 是被動態，所以後面不能接受詞（painting classes）。動詞 (A) 和 (C) 不能在名詞後面做修飾。","vocab":"","paraphrase":""},"141":{"type":"名詞詞彙 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「您在規劃課程方面有許多＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到身為老師，「您」（Evans 小姐）會獨自決定要使用的材料，以及要教的概念，所以名詞 (A) flexibility（彈性）是正確答案。(B) assistance 表示「協助」，(C) restriction 表示「限制」，(D) demonstration 表示「示範操作」。","vocab":"","paraphrase":""},"142":{"type":"【引導修飾性語句的成分】副詞子句連接詞條件","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這個句子已經有具備主詞（This e-mail address）、動詞（is）和補語（the best way）的完整子句，所以 ~ interested 是修飾性的語句。修飾部分有動詞（are interested），所以需要填入能引導修飾子句的成分，而所有選項都是副詞子句連接詞，也 ment's pledge to plant ~ trees in order to improve the sustainability of the city. 的部分提到，Winstonville 市將發放 2,000 株免費樹苗給社區成員，而這個計畫是市政府為了改善該市永續性而種植 10,000 棵樹的承諾的一環，接下來則繼續說明市府的種樹計畫，所以 (B) 是正確答案。","vocab":"","paraphrase":""},"162":{"type":"Not/True True 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 the free trees 有關的內容，並且對照選項判斷答案。(A) 在 A number of trees will ~ be available ~ from 4:30 P.M. to 8:00 P.M. for those who can't make it in the morning. 的部分提到，為了無法在上午到場的人，下午 4:30 到晚上 8:00 也提供一些樹苗，不符合選項敘述。(B) 和 (C) 在文章中沒有提到。(D) 在 Winstonville will be giving away 2,000 free young trees to members of the community on a first-come, first-served basis. 的部分提到，Winstonville 市將以先到者先得的方式發放 2,000 株免費樹苗給社區成員，符合選項敘述，所以 (D) 是正確答案。","vocab":"distribute v. 分發　come with phr. 附有……　limited adj. 有限的，限量的　quantity n. 數量","paraphrase":""},"163":{"type":"wh-問題 What","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問 Stein 小姐提醒人們做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Stein remind people to do 有關的部分是 Just remember to follow the directions posted on the city's Web site for planting and caring for each tree you take，她提醒民眾記得遵照市府網站上發布的指示來種植並照顧領到的樹，所以 (C) 是正確答案。\n變換表達方式\nfollow the directions posted on the ~ Web site 遵照網站上發布的指示 → Visit a Web site to find some instructions 上網站找說明","vocab":"prepare v. 安排，準備　permission n. 許可，允許","paraphrase":""},"164":{"type":"同義詞","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"tracking 所在的語句 We're tracking the growth progress of the trees. 之中，tracking 表示「追蹤」的意思，所以同樣能表示「追蹤」的 (B) 是正確答案。(D) pursue（追求，追趕）中文字面上似乎相近，但它是用來表示在物理上追趕某個對象，或者追求某個想要達到的目標。\n\n165-168 題參照以下網頁。\n\nwww.dpqtransport.com/aboutus\n\nAbout Us:\n\nDPQ Transport is a charter bus rental company that provides service nationwide seven days a week, 24 hours a day. Whether you need to transport a group for a tour or a business retreat, we guarantee that traveling with us is the right choice.\n\nSafety is our number one priority. Accordingly, our drivers are highly trained individuals with many years of experience behind the wheel. — [1] —. Furthermore, our vehicles are maintained regularly to ensure they are always functioning properly at the time of departure.\n\nWe also pride ourselves on comfort and convenience. — [2] —. Along with having plenty of legroom, each of the reclining seats in our vehicles is fitted with electrical sockets for your devices as well as adjustable air conditioning vents. Free wireless Internet is also available. You can also bring small meals or snacks with you or schedule a stop at a popular restaurant. — [3] —.\n\nFinally, our buses can seat up to 56 people, meaning that using our service is a cost-effective way to travel as a group. — [4] —.\n\nIf DPQ Transport is the right choice for you, send the details of your trip to queries@dpqtransport.com. We'll respond with a competitive quote and a proposed itinerary within 24 hours.\n\nwww.dpqtransport.com/aboutus\n\n關於我們：\n\nDPQ 交通公司是在全國每週 7 天、每天 24 小時提供服務的包租巴士公司。不管您是為了觀光還是公司靜修而需要載送團體，我們保證利用我們來旅行是正確的選擇。\n\n安全是我們的第一優先。所以，我們的司機訓練有素，具備多年駕駛經驗。— [1] —。此外，我們的車輛接受定期保養，以確保在出發時總是運作正常。\n\n我們也以舒適度與便利性自豪。— [2] —。除了有充足的腿部空間以外，我們車輛的每個可傾斜座椅都配備讓您的設備使用的電源插座，以及可調整的冷氣出風口。車上也提供免費無線網路。您也可以攜帶簡單的餐點或零食，或者安排在受歡迎的餐廳中途停車。— [3] —。\n\n最後，我們的巴士最多可以坐 56 個人，這意味著使用我們的服務是成本效益高的團體旅行方式。— [4] —。\n\n如果 DPQ 交通是適合您的選擇，請將您旅行的細節寄到 queries@dpqtransport.com。我們會在 24 小時以內回覆有競爭力的報價和旅程提案。","vocab":"charter bus phr. 包租巴士　nationwide adv. 在全國 adj. 全國的　retreat n. （公司的）靜修度假活動　guarantee v. 保障　priority n. 優先　accordingly adv. 因此　behind the wheel phr. 開著車　pride oneself on phr. 以……自豪　legroom n. 腿部可以伸展的空間　recline v. （椅背）往後傾斜（好讓人坐起來更舒適）　socket n. 插座　adjustable adj. 可調整的　vent n. 通風口　cost-effective adj. 有成本效益的　competitive adj. （價格）有競爭力的　quote n. 報價　itinerary n. 旅行行程","paraphrase":""},"165":{"type":"Not/True True 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 DPQ Transport 有關的內容，並且對照選項判斷答案。(A) 在 DPQ Transport is a charter bus rental company that provides service nationwide ~ 的部分提到，DPQ 交通公司是在全國提供服務的包租巴士公司，而不是提供國際服務，不符合選項敘述。(B) 在 Whether you need to transport a group for a tour or a business retreat, we guarantee that traveling with us is the right choice. 的部分提到，不管是為了觀光還是公司靜修而需要載送團體，都保證利用「我們」（DPQ 交通公司）來旅行是正確的選擇，而不是只為觀光團體服務，不符合選項敘述。(C) 在文章裡沒有提到。(D) 在 DPQ Transport ~ provides service ~ 24 hours a day. 的部分提到，DPQ 交通公司提供每天 24 小時服務，符合選項敘述，所以 (D) 是正確答案。\n變換表達方式\nprovides service ~ 24 hours a day 提供每天 24 小時服務 → operates at all hours of the day 一整天營運","vocab":"exclusively adv. 獨佔地　cater to phr. 為……服務，迎合……　launch v. 開始，發動　express adj. 快遞的，快捷的","paraphrase":""},"166":{"type":"Not/True Not 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 DPQ Transport vehicle seats 有關的內容，並且對照選項判斷答案。(A) 在 having plenty of legroom 的部分提到有充足的腿部空間，符合選項敘述。(B) 和 (D) 在 each of the ~ seats in our vehicles is fitted with electrical sockets for your devices as well as adjustable air conditioning vents 的部分提到，車輛的每個可傾斜座椅都配備讓設備使用的電源插座，以及可調整的冷氣出風口，符合選項敘述。(C) 在文章裡沒有提到，所以 (C) 是正確答案。\n變換表達方式\nplenty of legroom 充足的腿部空間 → spacious 寬敞的\nelectrical sockets 電源插座 → outlets 插座\nadjustable air conditioning vents 可調整的冷氣出風口 → a temperature control feature 溫度控制功能","vocab":"spacious adj. 寬敞的　outlet n. 插座　built-in adj. 內建的","paraphrase":""},"167":{"type":"wh-問題 What","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問根據網頁，人們可以透過電子郵件做什麼（What）的 wh- 問題。和題目的關鍵詞語 people do through e-mail 有關的部分是 send the details of your trip to queries@dpqtransport.com. We'll respond with a competitive quote，這部分請讀者將旅行的細節寄到 queries@dpqtransport.com，而 DPQ 交通公司會回覆有競爭力的報價，所以 (B) 是正確答案。\n變換表達方式\nquote 報價 → cost estimate 費用估計","vocab":"specific adj. 特定的　cost estimate phr. 費用估計，估價　customize v. 訂製，客製化","paraphrase":""},"168":{"type":"選擇句子位置","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「他們在受雇後會經過徹底審查，並且必須通過每年的評價」，所以應該會出現在和受雇員工資格與能力有關的部分。[1] 的上一句 our drivers are highly trained individuals with many years of experience behind the wheel 提到「我們」（DPQ 交通公司）的司機訓練有素，具備多年駕駛經驗。將句子填入 [1] 的位置之後，可以表達「司機訓練有素、具備多年駕駛經驗，而且受雇後會經過徹底審查，並且必須通過每年的評價」，文意通順，所以 (A) 是正確答案。","vocab":"thoroughly adv. 徹底地　screen v. 篩選，審查","paraphrase":""},"169":{"type":"Not/True Not 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 a concern about the tower 有關的內容，並且對照選項判斷答案。(A) 在文章裡沒有提到，所以 (A) 是正確答案。(B) 和 (C) 在 Others voiced fears that its presence might cause various health ~ issues for those who live near the site, not to mention lower property values. 的部分提到其他人的擔憂，是它的存在可能對住在附近的人造成多種健康問題，以及降低房地產價值，符合選項敘述。(D) 在 Many said the tower would spoil the area's natural beauty. 的部分提到，許多人說基地台會破壞這個地區的自然美景，符合選項敘述。","vocab":"wildlife n. 野生生物　pose v. 造成　real estate phr. 不動產　unattractive adj. 不吸引人的","paraphrase":""},"170":{"type":"推論 細節資訊","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是和題目關鍵詞語 Farview 有關的推論問題。city officials reassured the public that the tower will ~ generate substantial rental revenue in the amount of approximately $20,000 per year 的部分提到，市府官員再次向大眾保證，基地台每年將產生總計大約 20,000 元的高額租金收入，由此可以推知 Farview 市將透過新的建築物賺錢，所以 (D) 是正確答案。\n變換表達方式\ngenerate ~ revenue 產生收入 → earn money 賺錢","vocab":"tourism n. 觀光業　rental fee phr. 租賃費用　usage n. 使用","paraphrase":""},"171":{"type":"選擇句子位置","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「這意味著會有更多的手機服務需求」，所以應該會出現在和需要手機服務有關的部分。[4] 的上一句 The more visitors we have, the more phones there are 提到有越多來客，就會有越多手機。將句子填入 [4] 的位置之後，可以表達「有越多來客，就會有越多手機，這也意味著會有更多的手機服務需求」，文意通順，所以 (D) 是正確答案。\n\n172-175 題參照以下線上聊天。\n\nBryce Turner [2:30 P.M.]\nDid you hear that our company's shareholders want us to cut down on waste? I think it's important for us to respect their wishes, so I'd like to find some ways to reduce the amount of non-recyclable packaging materials we use here at Meerson.\n\nSophie Moore [2:31 P.M.]\nWe recently lessened the amount of plastic foam we put inside boxes by 40 percent. Is there anything else we can do?\n\nBryce Turner [2:34 P.M.]\nCould we eliminate the foam completely and start using shredded newspaper instead?\n\nRandy Poehler [2:35 P.M.]\nAnd only our fragile items need the extra padding. Our detergents, for instance, come in plastic bottles, so they don't need any special protection.\n\nRandy Poehler [2:36 P.M.]\nInstead of focusing only on the shipping materials, what if we also changed some of our product containers?\n\nBryce Turner [2:38 P.M.]\nAre you proposing we use some other type of material for our containers? I don't see how that would be any better.\n\nRandy Poehler [2:39 P.M.]\nNo. I'm just saying that we could use plastic more efficiently. Some of our competitors sell detergents in pouches that can be used to refill empty bottles. They're using plastic but far less of it. We could do the same.\n\nBryce Turner [2:41 P.M.]\nThat would actually save us money, too.\n\nSophie Moore [2:42 P.M.]\nI'll look into whether we can make that change.\n\nBryce Turner [下午2:30]\n你們聽說了嗎？我們公司的股東希望我們減少廢棄物嗎？我認為我們尊重他們的期望是很重要的，所以我想找到一些在 Meerson 公司這裡減少不可回收包裝材料使用量的方法。\n\nSophie Moore [下午2:31]\n我們最近減少了 40% 放在箱子裡的發泡塑膠（保麗龍）用量。還有什麼我們能做的嗎？\n\nBryce Turner [下午2:34]\n我們有可能完全不用發泡塑膠，並且開始改用碎報紙嗎？\n\nRandy Poehler [下午2:35]\n而且只有我們的易碎物品需要額外填充。例如我們的洗潔劑裝在塑膠瓶裡，所以不需要任何特別保護。\n\nRandy Poehler [下午2:36]\n與其只著重於運送材料，不如我們也更換一些產品容器如何？\n\nBryce Turner [下午2:38]\n你是提議我們使用其他種類的容器材料嗎？我不知道還有什麼更好的材料。\n\nRandy Poehler [下午2:39]\n不是。我只是說我們可以更有效率地使用塑膠。有些競爭業者販賣可以用來填充空瓶的袋裝洗潔劑。他們使用塑膠，但用量少很多。我們可以做同樣的事。\n\nBryce Turner [下午2:41]\n這樣實際上也會幫我們省錢。\n\nSophie Moore [下午2:42]\n我會研究我們是否能這樣改變。","vocab":"shareholder n. 股東　cut down on phr. 削減……　packaging n. 包裝　lessen v. 減少　plastic foam phr. 發泡塑膠（保麗龍）　eliminate v. 排除，消除　shred v. 切碎　fragile adj. 易碎的，脆弱的　padding n. 墊充，填料　detergent n. 洗潔劑　container n. 容器　efficiently adv. 有效率地　competitor n. 競爭者，競爭業者","paraphrase":""},"172":{"type":"wh-問題 What","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問 Turner 先生想減少什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Turner want to reduce 有關的部分是 Bryce Turner 所說的 I'd like to find some ways to reduce the amount of non-recyclable packaging materials we use，他設想要找到一些減少不可回收包裝材料量的方法，所以 (B) 是正確答案。","vocab":"distribution network phr. 流通網絡","paraphrase":""},"173":{"type":"推論 細節資訊","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是和題目關鍵詞語 Meerson 有關的推論問題。Randy Poehler 在 only our fragile items need the extra padding. Our detergents ~ don't need any special protection. 的部分提到，只有易碎物品需要額外填充，洗潔劑則不需要任何特別保護，由此可以推知 Meerson 公司有些產品不需要填充物，所以 (D) 是正確答案。","vocab":"seek v. 尋求，尋找　cut v. 減少　warehouse n. 倉庫","paraphrase":""},"174":{"type":"推論 細節資訊","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是和題目關鍵詞語 the pouches 有關的推論問題。Randy Poehler 在 Some of our competitors sell detergents in pouches that can be used to refill empty bottles. 的部分提到，有些競爭業者販賣可以用來填充空瓶的袋裝洗潔劑，然後又說 They're using plastic，表示競爭業者使用塑膠，由此可以推知袋子是用塑膠做的，所以 (A) 是正確答案。","vocab":"","paraphrase":""},"175":{"type":"掌握意圖","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這一題問的是 Poehler 先生的訊息所表達的意圖，所以要掌握引用部分（We could do the same）前後文的情境。Poehler 先生說 Our detergents ~ come in plastic bottles ~，表示公司的洗潔劑裝在塑膠瓶裡，之後又提到 Some of our competitors sell detergents in pouches that can be used to refill empty bottles.，表示有些競爭業者販賣可以用來填充空瓶的袋裝洗潔劑，最後則表明 We could do the same.（我們可以做同樣的事），意味著他希望像競爭業者一樣使用袋裝補充包來裝洗潔劑，和目前的瓶裝不同，所以 (B) 是正確答案。","vocab":"cooperate with phr. 和……合作","paraphrase":""},"176":{"type":"尋找主題／目的 文章的主題","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這一題問的是公告（第一篇文章）的主題，所以要注意文章開頭的部分。Gold Frond Resorts ~ has chosen Gareth Sunderland as visitor services director at its newest property 的部分提到，Gold Frond 度假村選擇了 Gareth Sunderland 擔任最新設施的訪客服務主任，接下來的部分則是詳細說明將要升上這個職位的 Gareth Sunderland，所以 (C) 是正確答案。","vocab":"","paraphrase":""},"177":{"type":"Not/True Not 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要從公告（第一篇文章）中找出和關鍵詞語 a responsibility of the visitor services director 有關的內容，並且對照選項判斷答案。(A) 在 He will be in charge of our reservation ~ systems. 的部分提到，「他」（升職為訪客服務主任的 Sunderland 先生）將負責預約系統，符合選項敘述。(B) 在 he will help coordinate a range of fun pursuits for guests 的部分提到，Sunderland 先生將協助為住客安排一系列有趣的休閒活動，符合選項敘述。(C) 在 he will be responsible for staff training in order to ~ maintain quality service 的部分提到，Sunderland 先生將負責員工訓練，以維持高品質的服務，符合選項敘述。(D) 在文章中沒有提到，所以 (D) 是正確答案。\n變換表達方式\nbe in charge of our reservation ~ systems 負責預約系統 → Managing a booking system 管理預訂系統\ncoordinate ~ fun pursuits 安排有趣的休閒活動 → Organizing leisure activities 安排休閒活動","vocab":"handle v. 處理　facility n. 設施","paraphrase":""},"178":{"type":"推論 多篇文章對照題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是需要對照兩篇文章內容的推論題型，先看介紹題目關鍵詞語 Mr. Sunderland 的公告。\n線索1：公告（第一篇文章）中，he has served as the front office manager at our island location 的部分提到，Sunderland 先生之前在「我們」（Gold Frond 度假村）的島嶼據點擔任客務部經理，但沒有寫出那個據點的名稱，所以還需要參考廣告的內容。\n線索2：廣告（第二篇文章）中，Vergual Paradise、occupies an entire island 的部分顯示 Vergual Paradise 佔據整座島。\n綜合這兩個線索，可知 Sunderland 先生之前受雇於 Vergual Paradise，所以 (C) 是正確答案。","vocab":"career n. 職業生涯　employ v. 雇用，使用　graduate v. 畢業","paraphrase":""},"179":{"type":"Not/True True 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Gold Frond Resorts 有關的內容，所以要看介紹 Gold Frond 度假村的廣告（第一篇文章）。(A) 在 Our original property; recently expanded to 315 rooms 的部分提到，Gold Frond 最初的據點最近擴建至 315 間客房，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章中沒有提到。\n變換表達方式\nexpanded to 315 rooms 擴建至 315 間客房 → increased its capacity 增加容納空間","vocab":"capacity n. 容量，容納的能力　establish v. 建立，設立","paraphrase":""},"180":{"type":"wh-問題 How","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問人們可以怎樣（How）獲得度假村活動資訊的 wh- 問題，所以要從和題目的關鍵詞語 people get information on resort activities 有關的廣告（第二篇文章）找出相關的內容。廣告中的 You can find information on activities available at each resort at www.goldfrondresorts.com 提到可以在網站找到每座度假村可提供活動的資訊，所以 (A) 是正確答案。","vocab":"travel agent phr. 旅行社代辦人員","paraphrase":""},"181":{"type":"推論 細節資訊","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是要找出和題目關鍵詞語 the Spin Genie 400 相關內容的推論問題，所以要看提到 Spin Genie 400 的第一封電子郵件。I recently bought your company's Spin Genie 400 ~ and took it to a local bike shop for assembly 的部分提到，最近買了 FrameCaster Cycles 公司的 Spin Genie 400，並且把它帶到本地的腳踏車店組裝，由此可以推知可以購買未組裝的 Spin Genie 400 並自行組裝，所以 (A) 是正確答案。","voc function goLocal(){stopListeners();activeCode='';cloud.mode='local';input.value='';input.disabled=false;connect.disabled=false;leave.hidden=true;window.toeicClearRemote?.();info('本機模式：未連線雲端，作答只保存在此瀏覽器。')}
leave.addEventListener('click',goLocal);
connect.addEventListener('click',async()=>{const code=input.value.trim();if(!allowed.includes(code)){info('代號無效。請輸入管理員提供的 4 位代號。');return}if(activeCode===code&&cloud.ready)return;stopListeners();activeCode=code;cloud.mode='loading';cloud.ready=false;window.toeicApplyRemote?.({},{});connect.disabled=true;leave.hidden=false;info('正在載入雲端歷史紀錄，請不要作答…');let token=generation;
try{if(!auth.currentUser)await signInAnonymously(auth);if(token!==generation)return;
const a=onSnapshot(collection(db,'practiceCodes',code,'test06_answers'),snap=>{if(token!==generation)return;remoteAnswers={};snap.forEach(d=>{if(/^\d+$/.test(d.id))remoteAnswers[d.id]=d.data()});loadedA=true;sync()},err=>{if(token===generation){info('讀取雲端失敗：'+err.message+'。請檢查匿名驗證與 Firestore 規則。');connect.disabled=false}});
unsub.push(a);
const b=onSnapshot(collection(db,'practiceCodes',code,'test06_stars'),snap=>{if(token!==generation)return;remoteStars={};snap.forEach(d=>{if(/^\d+$/.test(d.id)&&d.data().marked)remoteStars[d.id]=true});loadedS=true;sync()},err=>{if(token===generation){info('讀取星號失敗：'+err.message);connect.disabled=false}});unsub.push(b);
const c=onSnapshot(collection(db,'practiceCodes',code,'test06_highlights'),snap=>{if(token!==generation)return;remoteExcerpts={};snap.forEach(d=>{const items=d.data().items;if(/^\d+$/.test(d.id)&&Array.isArray(items))remoteExcerpts[d.id]=items.filter(x=>typeof x==='string')});loadedE=true;sync()},err=>{if(token===generation){info('讀取文字摘錄失敗：'+err.message+'。請更新 Firestore 規則。');connect.disabled=false}});unsub.push(c);
}catch(err){if(token===generation){info('Firebase 連線失敗：'+err.message);connect.disabled=false}}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();connect.click()}});
// 在雲端讀取期間禁用作答；已離線作答不會自動上傳。
const originalSave=cloud.saveAnswer,originalStar=cloud.setStar,originalImport=cloud.importAnswers,originalReset=cloud.resetAnswers;
for(const [name,fn] of [['saveAnswer',originalSave],['deleteAnswer',cloud.deleteAnswer],['setStar',originalStar],['importAnswers',originalImport],['resetAnswers',originalReset],['saveExcerpts',cloud.saveExcerpts]])cloud[name]=async(...args)=>{if(cloud.mode==='loading'||activeCode&&!cloud.ready)throw Error('雲端正在載入或連線異常，無法儲存；請退出雲端模式後使用本機練習。');return fn(...args)};
onAuthStateChanged(auth,user=>{if(!user&&activeCode){info('Firebase 驗證已中斷，請重新按「載入雲端紀錄」。');stopListeners();connect.disabled=false}});
</script></body></html>
