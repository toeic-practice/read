in? She has a new blockbuster movie coming out in October, and having her on the cover would likely drive up magazine sales. Please contact her agent and try to make an arrangement.</p><p>Second, Russo Shampoo abruptly decided not to advertise in the September issue after all. Thus, we urgently need to fill pages 58 and 59. You mentioned that SameSide Cosmetics was interested in running an advertisement in our magazine. This would be for their new line of organic, environmentally friendly skin creams, which will be debuting in October. Could you confirm whether the company wants to take advantage of this opportunity? We could offer them a 20 percent discount.</p><p>Lastly, I'd like you to thoroughly check the facts mentioned in our article on the Canadian designer David Burns for the September issue.</p><p>Thanks,</p><p>Rachel Duval<br/>Editor in Chief<br/>PopFashion Magazine</p></div></section><section class=\"document-card type-catalog\"><div class=\"doc-ribbon\"><span>CATALOG</span><small>176-180 · 2/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">PopFashion Magazine September Issue</h2><div class=\"document-table-wrap\"><table><tr><td>Page</td><td>Content</td></tr><tr><td>11</td><td>Seasonal Beauty Trends: Read our reviews of new cosmetics products</td></tr><tr><td>16</td><td>Cover Story Interview: Michelle Ford talks about her upcoming Broadway stage debut</td></tr><tr><td>25</td><td>Fashion Industry Editorial: Meet seven of the most innovative US designers</td></tr><tr><td>35</td><td>Fashion Industry Editorial: Explore the work of New York's most prestigious tailor</td></tr><tr><td>48</td><td>Article: Learn why Berlin is becoming the fashion capital of Europe</td></tr><tr><td>52</td><td>Profile: Canada's number one designer reflects on his career ahead of retirement</td></tr><tr><td>60</td><td>Advice Fashion Quest: Find the best clothing items for your body type</td></tr><tr><td>68</td><td>Hairstyling Workshop: Follow our step-by-step guide to using hair dye</td></tr><tr><td>78</td><td>Special Feature Journey: Explore India's contemporary fashion scene</td></tr></table></div></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>181-185 · 1/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Go Shopping and Make a Difference!</h2><p>This year, Bristol's Support Your Local Business Day falls on Saturday, April 28. Instead of visiting nationwide chain stores on this day, shop at some of the smaller stores in your neighborhood. By doing so, you'll help the local economy since the revenue earned by such businesses remains in our town. In addition, a group of participating businesses, including the restaurant Birdy Beets, the crafts shop Tinker Time, and the clothing boutique Kara Lee's, have agreed to give 10 percent of their profits from this day to the Bristol Business Association (BBA). The BBA will use these proceeds to continue carrying out charitable projects in the area.</p><p>Along with the shopping opportunities, Support Your Local Business Day will feature special programs. Check www.bristolsylbd.com for a list of participating businesses and a schedule of events.</p></div></section><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>SCHEDULE</span><small>181-185 · 2/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">Support Your Local Business Day<br/>April 28 in Bristol</h2><p>Message for Community Members 9:00 A.M. to 9:30 A.M.<br/>Location: Anchor Square<br/>Emmanuel Perez, president of the Bristol Business Association (BBA), will give a speech about why local businesses are so important. He will also talk about some of the BBA's upcoming efforts.</p><p>Walking Tour 9:40 A.M. to 10:15 A.M.<br/>Meeting place: Craft Street Antiques<br/>Take a stroll down Dalton Street and learn about the history of its buildings. The last stop is Wayfair House, one of the oldest buildings in Bristol, which will be open to the public for the first time. Admission to Wayfair House is free.</p><p>Shop for Your Lunch 10:30 A.M. to 1:00 P.M.<br/>Location: Downtown Shopping District<br/>If you make a purchase in three different locally owned businesses, you will receive a coupon for a free lunch at a participating restaurant. Present your receipts at the visitors' bureau by 1:30 P.M.</p><p>Music on the Green 12:00 P.M. to 4:00 P.M.<br/>Location: Downtown Green Park<br/>Local bands will play 30-minute concerts on the stage at Green Park. At a tent nearby, plenty of fun arts and crafts workshops for kids will be offered.</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE</span><small>186-190 · 1/3</small></div><div class=\"document-body\"><p>February 12— At a press conference on February 10, Mayor David Wilkins announced the planned construction of a new four-lane bridge. The work is scheduled to begin on May 14 and end on December 23. It is expected to relieve traffic congestion in the city, particularly for commuters trying to reach the north side of the city from the downtown area. However, the traffic situation will likely worsen while the new bridge is under construction due to a number of temporary road closures.</p><p>Harris Road and Oak Boulevard will be closed from May 14 to August 1. In addition, Center Avenue will be inaccessible to motorists from August 5 to October 10, and Harbor Way will be shut down from October 12 to December 20. Commuters who regularly use these streets should visit the Department of Transportation's Web site for information about alternatives.</p></div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>MEMO</span><small>186-190 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>All Bellwood Sporting Goods Employees</strong></div><div class=\"doc-field\"><span>From</span><strong>Beth Ferrell, Manager</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Response plan</strong></div><div class=\"doc-field\"><span>Date</span><strong>July 10</strong></div></div><p>As I informed everyone in the staff meeting yesterday, the closure of the street in front of our store starting from August 5 will likely have a serious impact on in-store sales. As a result, I have decided to hold two online promotions during that period. Hopefully, we can generate enough sales through our Web site to compensate for having fewer customers coming into the store. All footwear in the shop and online will be marked down by 15 percent. In addition, anyone who places an order online will receive free shipping. Please make sure to tell our customers about these promotions.</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>186-190 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>customerservice@bellwood.com</strong></div><div class=\"doc-field\"><span>From</span><strong>jadams@ezmail.com</strong></div><div class=\"doc-field\"><span>Date</span><strong>August 12</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Order Number 029384</strong></div></div><p>On August 9, I bought a jacket on your Web site. Unfortunately, I just realized that the size I selected was a large rather than an extra large. I'd like to change this before the order is shipped so that I don't have to return the jacket. Would it be possible for you to just replace the item with the one I originally ordered? If not, I guess I will have to cancel my original order and place a new one. Please let me know.</p><p>Sincerely,<br/>Jeff Adams</p></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>191-195 · 1/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Jade Liu j.liu@zhongacademy.org</strong></div><div class=\"doc-field\"><span>From</span><strong>Jason Richards jasonrich382@goodmail.net</strong></div><div class=\"doc-field\"><span>Date</span><strong>November 20</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Sunday classes</strong></div></div><p>Dear Ms. Liu,</p><p>I'm interested in taking your business Chinese class on Sunday mornings. I've studied Chinese using language training software, so I'm somewhat proficient. However, I'd like to take a test to determine my fluency level before I register. Please let me know the procedure for this as I was unable to find information about it on your Web site.</p><p>Also, when checking class times online, I noticed that you have free screenings of popular Chinese movies at your academy. My friend went to the one you held on November 12 and said it was educational. I'd like to go to next month's showing, and I'm wondering if I need to sign up.</p><p>Kindest regards,<br/>Jason Richards</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM</span><small>191-195 · 2/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">ZHONG ACADEMY Class Registration for December</h2><div class=\"document-table-wrap\"><table><tr><td>Name</td><td>Jason Richards</td></tr><tr><td>Level According to Test</td><td>Beginner</td></tr><tr><td>Address</td><td>51 Rye Street, Concord, NH 03302</td></tr><tr><td>Preferred Class Time</td><td>Sundays 10 A.M. – 11:30 A.M.</td></tr><tr><td>Phone</td><td>555-7244</td></tr><tr><td>Tuition Fee</td><td>$200</td></tr><tr><td>E-mail</td><td>jasonrich382@goodmail.net</td></tr><tr><td>Tuition Due Date</td><td>November 30</td></tr><tr><td>Was our academy recommended to you by someone?</td><td>Yes</td></tr><tr><td>If so, please provide the name of this individual.</td><td>Robin Ghose</td></tr></table></div><p>To change your class time, make a request at our main desk. If you recommend us to someone and that person enrolls, you will receive a 15 percent discount on your next class.</p></div></section><section class=\"document-card type-newsletter\"><div class=\"doc-ribbon\"><span>NEWSLETTER</span><small>191-195 · 3/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">Zhong Academy Monthly Newsletter<br/>December 1</h2><p>Watching a Chinese movie is one way to improve your language skills. Two Chinese film events are taking place locally this month.</p><p>The Bright Lights Film Festival will be held at the Cloudbank Hotel on December 20. It will feature a new release from Xu Yue, the director of the critically acclaimed film Summer Shore. Xu's latest work, Washing Away, is about a young dancer from Shanghai. Tickets for the festival are $20 and can be purchased by logging on to www.blffest.org.</p><p>Additionally, you can attend a free viewing of Grave Mistakes by Chinese director Wei Chung. It will be shown on December 28 here at Zhong Academy. Viewings at the academy are held monthly and are strictly for students enrolled in intermediate or advanced classes. As we did last month after our showing of River Goddess, we will have a discussion in Chinese after this month's screening.</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>196-200 · 1/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Seeking Sources for TV Episode on Emerald Falls</h2><p>Director Hector Almonte is currently seeking interviewees for a television episode on the town of Emerald Falls. The episode is being produced for The Good Old Days, an award-winning documentary series that is hosted by Janet Leslie. For its second season, the series will be expanded from 10 to 12 episodes. It will continue to profile historic towns across Belize through video interviews and on-location footage. Interviewees do not need to reside in Emerald Falls but must have a strong connection with the town. For more information, please call (501) 555-7925.</p><p>In addition, Mr. Almonte hopes to gain access to letters, photos, and other items that can provide insights into the town's beginnings. If you have such artifacts and are prepared to loan them out, you are kindly asked to contact his assistant Chloe Benbow at c.benbow@sunrise.bz.</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>196-200 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Chloe Benbow c.benbow@sunrise.bz</strong></div><div class=\"doc-field\"><span>From</span><strong>Elaine Kershaw elaine.k@eurekamail.bz</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Old pictures of Emerald Falls</strong></div><div class=\"doc-field\"><span>Date</span><strong>July 25</strong></div></div><p>Dear Ms. Benbow,</p><p>I was excited to read that Emerald Falls will appear on The Good Old Days. I enjoyed last season's finale on Pepita de Oro.</p><p>Though I have never lived in Emerald Falls, my father was born there, and I have a collection of photographs and paintings of the town from the time when my grandfather was the mayor. My grandfather purchased the paintings from a local artist. Their titles are Picnic by the Falls, Plaza Esperanza, and The Grand Carnival.</p><p>I would be happy to loan you the photographs, but the paintings must remain in my home because of their value. If Mr. Almonte would like to film them, he may visit me here in Maracuyá.</p><p>Sincerely,<br/>Elaine Kershaw</p><p>Director Hector Almonte commented, \"For the second season, we looked for sources with personal links to the towns. The Emerald Falls episode turned out nicely thanks to everyone who shared stories and memorable objects.\"</p><p>Next week, episode 5 will be released. The director says that he wants the location to be a surprise.</p></div></section><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE</span><small>196-200 · 3/3</small></div><div class=\"document-body\"><p>BELIZE CITY (December 15)— Viewer ratings have been rising for The Good Old Days, a documentary series on the country's heritage towns. The most recent episode focused on Emerald Falls, a once thriving mining community that has since been depleted of its celebrated mineral deposits. Although the population has dwindled significantly, the town still looks much as it did before. In one scene of the episode, we are shown the Jana Haynes's painting Plaza Esperanza that reveals how life in Emerald Falls has changed.</p><p>Director Hector Almonte commented, \"For the second season, we looked for sources with personal links to the towns. The Emerald Falls episode turned out nicely thanks to everyone who shared stories and memorable objects.\"</p><p>Next week, episode 5 will be released. The director says that he wants the location to be a surprise.</p></div></section></div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>公司備忘錄</span><small>131-134 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>全體員工</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>辦公室經理 Warren Harris</strong></div><div class=\"doc-field\"><span>日期</span><strong>8月15日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>用電情形</strong></div></div><p>我要提醒各位，本月辦公室的水電費比去年同期高出將近15%。我認為這不可接受，尤其公司已實施多項節約成本的措施，例如去年秋季整修時安裝節能燈具和窗戶。因此，請各位採取明智的做法。只要有一點理性和良好判斷，我相信我們就能減少開支。首先，請關閉不使用的設備。感謝理解，如果您還有其他節能建議，歡迎告訴我。</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-press\"><div class=\"doc-ribbon\"><span>新聞稿</span><small>135-138 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">新聞稿—Basinet Books<br/>Basinet Books 即將推出自己的 Podcast</h2><p>Basinet Books 出版社即將為歷史小說愛好者製作每週播出的 Podcast。第一集將於7月15日上線，介紹這一文類近來的熱潮，以及歷史與小說之間的關係。之後每集都會聚焦一本小說；所有選書都將是新出版的作品。出版社暗示節目由一位知名演員主持，而這位演員據說曾主演多部小說改編電影。每集都能透過 StarLadder 行動應用程式收聽。</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>139-142 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Belinda Wright bw4637@advertx.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Jamie Garnett jg4548@advertx.com</strong></div><div class=\"doc-field\"><span>主旨</span><strong>緊急請求</strong></div><div class=\"doc-field\"><span>日期</span><strong>2月11日</strong></div></div><p>Belinda，你好：</p><p>假期過得如何？我知道你的休假到2月14日星期五，但想問你能否在那天返回公司。Nektar Beverages 突然要求更改他們委託的廣告。這很令人意外，因為上週他們似乎還很滿意。你是主要設計師，因此最適合處理最後修訂。工作大概需要五到六小時。</p><p>為了補償你，我們會依2月14日的標準加班費率付薪，並額外提供一天休假。</p><p>先謝謝你。<br/>Jamie</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>新聞／文章</span><small>143-146 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">GEOnet Solutions 的新展望</h2><p>波士頓（10月9日）— GEOnet Solutions 宣布將業務拓展至海外，在倫敦開設衛星分公司。20多年來，這家總部位於波士頓的技術開發先驅，創造許多使用地質科技的創新方法，並促成領域內無數進展。事實上，若沒有其努力，數百萬人每天使用的資料蒐集系統與追蹤工具便不會存在。</p><p>在昨日公布的聲明中，代表 Tomas Fuller 表示，此次擴張的首要目標是促進與倫敦技術中心的合作。雙方相信合作將互惠互利。</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>公司備忘錄</span><small>147-148 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>全體員工</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>執行長 Nadori Seiko</strong></div><div class=\"doc-field\"><span>主旨</span><strong>每月銷售挑戰</strong></div><div class=\"doc-field\"><span>日期</span><strong>12月2日</strong></div></div><p>感謝大家參與每月銷售競賽。因為各位的努力，我們爭取到幾名新客戶。這項挑戰原本著重個人成績，後來發展成良好的團隊合作經驗。Aaron 與 Marisol 的銷售額最高，兩人都將獲得 Spanto Restaurant 禮券。</p><p>我對活動帶來的熱情和團隊精神感到驚喜，因此每位同仁都可額外休假一天。主管團隊也決定將來再辦一次。請以電子郵件提供新的獎品建議，對象可以是個別員工或整個團隊。</p></div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>公告通知</span><small>149-150 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">Cole Theater 會員資訊</h2><p>可在 www.coletheater.com/join 或任一售票窗口申請會員。會員卡每12個月需更新一次。</p><p>會員福利<br/>• 獨家電影首映會門票，並有知名演員出席<br/>• 早場入場費6美元<br/>• 下午、晚上及週末場次享九折優惠<br/>• 可用獎勵點數兌換免費販賣部商品或電影票</p><p>詳情請寄信至 extras@coletheater.com。</p></div></section></div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 151-152</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>即時對話</span><small>151-152 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>上午11:33</time></div><div class=\"message-text\">你今天有為 Kent Street 的兩房住宅辦公開看屋活動嗎？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Connie Mills</strong><time>上午11:35</time></div><div class=\"message-text\">不到半小時就開始了。我正在現場布置。怎麼了？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>上午11:36</time></div><div class=\"message-text\">我忘了帶 North Avenue 182號公寓的鑰匙。我現在正在車上，記得你通常有備用鑰匙。我正開車經過 Sydney Mountain Mall。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Connie Mills</strong><time>上午11:38</time></div><div class=\"message-text\">我有。中午前都能來拿。車道要留給可能提前到的買家，請停在轉角那邊的路上。我看到人行道旁有幾個空位。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>上午11:41</time></div><div class=\"message-text\">太好了！非常感謝。</div></div></div></div></section></div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 153-154</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>正式信函</span><small>153-154 · 1/1</small></div><div class=\"document-body\"><p>Brugeri 美術館<br/>Empire Street 856號，Grants Pass, OR 97527<br/>9月9日</p><p>Robert Jansen<br/>3111 Helmsview Drive<br/>Arcata, CA 95521</p><p>Jansen 先生您好：</p><p>很遺憾通知您，您今年慷慨借給美術館的雕像《Descending Cherub》昨天受損。員工原本正把戶外雕塑花園的作品搬入主要展廳，天氣卻突然轉變，沒能及時處理您的作品。強風吹倒雕像，從底座跌落，造成左手斷裂。隨信附上損壞部位的照片。</p><p>保險公司當然會給予金錢賠償，我們也會支付專業修復費用。若您同意，我們可聘請專業人士；若您想自行指定修復者，只需告知，我們會立刻將作品寄還。</p><p>再次為這起意外致歉，期待您的回覆。<br/>Mia Hyman<br/>Brugeri 美術館策展人<br/>附件</p></div></section></div>","155-157":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 155-157</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>新聞／文章</span><small>155-157 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">Steel Works 新廠正式營運</h2><p>Steel Works 公司新廠開始營運。這座耗資6,000萬美元的煉鋼廠每年可生產約100萬噸鋼筋，將推動馬來西亞建築業成長。</p><p>執行長 Aiman Musa 表示，設於 Kampung Tebing 的新廠會向國內各地供應鋼筋，協助城市建設基礎設施。</p><p>這是 Steel Works 的第二座工廠。Rembau 的第一座廠目前所有產品都出口至其他亞洲國家，過去卻曾供應國內將近一半的鋼鐵需求。該廠去年完成升級，已是亞洲最現代化的鋼鐵廠之一。公司採用最新技術，兼顧高效率與低環境衝擊。</p><p>隨著 Kampung Tebing 廠成立，公司在馬來西亞的市場占有率預計上升至72%；新廠開幕後，當地證交所的公司股價上漲24%。</p></div></section></div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 158-160</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>158-160 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>全體行銷人員</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Linda Marks</strong></div><div class=\"doc-field\"><span>主旨</span><strong>會議交通安排</strong></div><div class=\"doc-field\"><span>日期</span><strong>10月14日</strong></div></div><p>各位同事：</p><p>許多人星期五將前往 Wilmington 參加社群媒體研討會。若打算搭公司包租巴士，請於 A 停車場集合，上午8:30準時出發。也可自行開車或搭大眾運輸工具，前一封郵件已提供 Wilmington 會議中心的路線資訊。</p><p>未出席會議的同仁請注意，我們上週新取得的客戶 Whitaker's Sports Apparel 代表約在上午10點來訪。我已告知他們因會議幾乎無人在辦公室，但他們當天恰好在城裡，仍希望順道拜訪。會計部 Robert Buck 會接待並簡介辦公室，有機會請向他們自我介紹。</p><p>謝謝。<br/>Linda Marks</p></div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 161-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>即時對話</span><small>161-164 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>上午11:08</time></div><div class=\"message-text\">昨天我遲到了，錯過11月初會議的部分內容，想請問加班政策有什麼更改。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>上午11:09</time></div><div class=\"message-text\">當然可以。你沒收到 Ward 先生剛寄的備忘錄嗎？裡面整理了新規定。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>上午11:10</time></div><div class=\"message-text\">我只快速看過，看到程序簡化。現在不用再交加班申請表了嗎？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>上午11:12</time></div><div class=\"message-text\">是的。以前很多同事加班完成專案，卻因沒有提交正式文件而只領到正常薪水。很多人覺得表格太複雜。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Gene Shipley</strong><time>上午11:13</time></div><div class=\"message-text\">現在每週工作超過40小時就會自動取得加班費，只要把資訊輸入薪資系統。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>上午11:13</time></div><div class=\"message-text\">沒錯。12月1日上午9點起生效，每月底主管會審查登錄內容；如果沒有問題，當時就會核准。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>上午11:15</time></div><div class=\"message-text\">這真是好消息，想到接下來幾週要做的大專案，特別有幫助。謝謝！</div></div></div></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>新聞／文章</span><small>165-167 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">DTA 準備全面翻修機場</h2><p>丹佛交通局（DTA）宣布將投入5,000萬美元改建丹佛郊外的 Franklin 機場。國家航空集團（NAG）認定該機場跑道對大型飛機構成危險，促成此次公告。NAG 負責制定全美機場的安全規定。</p><p>局長 Elaine Webster 表示：「11年前接管機場時，我們本想立刻重建，卻一直遇到預算延誤。如今依照 NAG 最新判定，終於取得聯邦資金，可修復跑道並擴建航廈。」</p><p>DTA 已聘請多家建築公司，預計18個月內完工。A航廈擴建完成才會開始B航廈施工，讓機場在工程期間持續全面運作。完工後，Franklin 機場將開始提供國際航班抵達與出發服務。</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>168-171 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Joan Stendhal joan.stendhal@mynextmail.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Robert Hamilton r.hamilton@pichaipartners.com</strong></div><div class=\"doc-field\"><span>日期</span><strong>9月18日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>您的應徵申請</strong></div></div><p>Stendhal 小姐您好：</p><p>恭喜！在數百名申請者中，我們選出您進入下一階段，到辦公室參加面試。[1]</p><p>面試安排於9月23日（星期五）下午1點至5點。不同活動之間可休息30分鐘。面試分兩階段：第一階段由高階主管組成的小組提問，完成後請留在附近等候第二階段通知。第二階段您將分析本所曾處理的實際法律案件，先花一小時獨立研究第一個案件，[2] 再兩人一組研究另一個案件，以評估溝通與團隊合作能力。更多細節當天提供。[3]</p><p>我們會提供所需文具、圖書館指定法律書籍等所有材料，[4] 因此您不必自行攜帶。也會提供茶點。</p><p>請回覆郵件確認出席；如有問題請撥555-4883。<br/>Robert Hamilton</p></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>公告通知</span><small>172-175 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">為公益而跑！</h2><p>Highland 就業中心的「技術訓練」計畫需要您的支持。許多人缺乏基本電腦技能，難以找到工作。我們希望募款聘請一名電腦講師，連續一年每週在中心開設免費工作坊，協助求職者增進技能與收入。</p><p>您可以參加8月15日在 Arthur Park 舉辦的10公里路跑。7月報名費40元；8月1日至14日45元；比賽當天50元。穿著創意服裝參賽者有機會贏得 Harlan Foods 100元禮券；服裝競賽結果將於賽後宣布。</p><p>跑者可領取包含號碼布與個人物品收納袋的選手包。兩小時內完成路跑者將獲得一張衝過終點線的個人照片。報名：www.highlandec.com/10k</p></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>176-180 · 1/2</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>寄件者</span><strong>Rachel Duval rduval@pfmagazine.com</strong></div><div class=\"doc-field\"><span>收件者</span><strong>John Hassan j.hassan@pfmagazine.com</strong></div><div class=\"doc-field\"><span>日期</span><strong>7月29日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>九月號</strong></div></div><p>John，你好：</p><p>雖然九月號已完成不少工作，我們仍有幾項決定要做。首先，必須選擇封面模特兒。這通常是全年最受歡迎的一期，因此我們需要邀請重量級名人。再次與 Su-min Yoo 合作如何？她有一部賣座電影將於十月上映，如果讓她登上封面，應有助於提高雜誌銷量。請聯絡她的經紀人，試著安排合作。</p><p>第二，Russo Shampoo 突然決定不在九月號刊登廣告。因此，我們急需填補第58與59頁。你提到 SameSide Cosmetics 有意在我們雜誌登廣告，宣傳十月推出的有機環保護膚乳霜新系列。能否確認他們是否願意把握這個機會？我們可以提供20%折扣。</p><p>最後，請徹底查核九月號關於加拿大設計師 David Burns 的文章內容。</p><p>謝謝。<br/>Rachel Duval<br/>總編輯，PopFashion 雜誌</p></div></section><section class=\"document-card type-catalog\"><div class=\"doc-ribbon\"><span>雜誌目錄</span><small>176-180 · 2/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">PopFashion 雜誌九月號目錄</h2><div class=\"document-table-wrap\"><table aria-label=\"中英文對照資料表\" class=\"document-table\"><tr><th>頁碼</th><th>內容</th></tr><tr><td>11</td><td>季節美容趨勢：新化妝品評測</td></tr><tr><td>16</td><td>封面人物專訪：Michelle Ford 談即將登場的百老匯首演</td></tr><tr><td>25</td><td>時尚產業專欄：七位最具創新精神的美國設計師</td></tr><tr><td>35</td><td>時尚產業專欄：探索紐約頂尖裁縫的作品</td></tr><tr><td>48</td><td>文章：柏林為何正成為歐洲時尚之都</td></tr><tr><td>52</td><td>人物側寫：加拿大首席設計師在退休前回顧職涯</td></tr><tr><td>60</td><td>穿搭建議：找出適合身形的服飾</td></tr><tr><td>68</td><td>染髮教學：逐步學會使用染髮劑</td></tr><tr><td>78</td><td>特別專題：探索印度當代時尚</td></tr></table></div></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>公告通知</span><small>181-185 · 1/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">購物也能帶來改變！</h2><p>今年布里斯托的「支持在地商家日」訂於4月28日（星期六）。當天請不要到全國連鎖店，而是到社區的小商店購物。如此能協助地方經濟，因為這些企業的營收會留在本鎮。此外，Birdy Beets 餐廳、Tinker Time 手工藝品店和 Kara Lee's 服飾精品店等參與商家同意捐出當日獲利的10%給布里斯托商業協會（BBA），用於持續推動當地慈善計畫。</p><p>除了購物，「支持在地商家日」還有特別活動。請至 www.bristolsylbd.com 查看參與商家與活動時程。</p></div></section><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>活動時程</span><small>181-185 · 2/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">支持在地商家日｜4月28日｜布里斯托</h2><p>給社區居民的演講｜上午9:00–9:30<br/>地點：Anchor Square<br/>布里斯托商業協會會長 Emmanuel Perez 將說明在地商家的重要性，並介紹協會即將推動的計畫。</p><p>徒步導覽｜上午9:40–10:15<br/>集合地點：Craft Street Antiques<br/>沿 Dalton Street 散步，認識街道建築的歷史。最後一站為布里斯托最古老的建築之一 Wayfair House，首次開放民眾參觀，免費入場。</p><p>購物換午餐｜上午10:30–下午1:00<br/>地點：市中心購物區<br/>若在三家不同的本地商店消費，即可獲得參與餐廳的免費午餐券。請於下午1:30前向遊客服務處出示收據。</p><p>綠地音樂會｜中午12:00–下午4:00<br/>地點：市中心 Green Park<br/>在地樂團將於 Green Park 舞台進行每場30分鐘的演出，附近帳篷也有提供給兒童的趣味美術與手工藝工作坊。</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>新聞／文章</span><small>186-190 · 1/3</small></div><div class=\"document-body\"><p>2月12日— 市長 David Wilkins 在2月10日記者會中宣布新建一座四車道橋梁的計畫。施工預定5月14日開始、12月23日結束，預期能緩解市內交通壅塞，特別是從市中心前往北區的通勤族。不過，由於部分道路將暫時封閉，施工期間交通可能更加壅塞。</p><p>Harris Road 與 Oak Boulevard 將於5月14日至8月1日封閉；Center Avenue 於8月5日至10月10日禁止汽車通行；Harbor Way 則於10月12日至12月20日封閉。經常使用這些道路的通勤族應至交通部網站查詢替代路線。</p></div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>公司備忘錄</span><small>186-190 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Bellwood Sporting Goods 全體員工</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Beth Ferrell，經理</strong></div><div class=\"doc-field\"><span>主旨</span><strong>因應計畫</strong></div><div class=\"doc-field\"><span>日期</span><strong>7月10日</strong></div></div><p>如我昨天在員工會議所說，從8月5日起，店門前道路封閉恐嚴重影響門市銷售。因此我決定在此期間推出兩項網路促銷，希望透過網站銷售彌補來店顧客減少的損失。店內及線上所有鞋類商品均降價15%，且所有線上訂單免運費。請務必告知顧客這些優惠。</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>186-190 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>customerservice@bellwood.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>jadams@ezmail.com</strong></div><div class=\"doc-field\"><span>日期</span><strong>8月12日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>訂單編號029384</strong></div></div><p>我8月9日在貴公司網站買了一件外套。遺憾的是，我才發現自己選的是大號，而非特大號。我希望在出貨前修改，以免之後退貨。可以直接將商品換成我原本想訂的尺寸嗎？如果不行，我想只能取消原訂單再重新下單。請告訴我是否可行。</p><p>祝好<br/>Jeff Adams</p></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>191-195 · 1/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Jade Liu j.liu@zhongacademy.org</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Jason Richards jasonrich382@goodmail.net</strong></div><div class=\"doc-field\"><span>日期</span><strong>11月20日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>星期日課程</strong></div></div><p>Liu 小姐您好：</p><p>我有興趣參加星期日上午的商務中文課。我曾使用語言學習軟體學中文，已有一定程度，但希望報名前先測驗自己的流利程度。網站上找不到相關程序，煩請告知。</p><p>另外，我查詢課程時間時發現學院免費放映熱門華語電影。我的朋友參加了11月12日的放映，覺得很有教育意義。我也想參加下個月的放映，不知道是否需要報名。</p><p>敬祝安好<br/>Jason Richards</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>報名表</span><small>191-195 · 2/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">ZHONG ACADEMY｜12月課程報名表</h2><div class=\"document-table-wrap\"><table aria-label=\"中英文對照資料表\" class=\"document-table\"><tr><th>姓名</th><th>Jason Richards</th></tr><tr><td>測驗分級</td><td>初級</td></tr><tr><td>地址</td><td>51 Rye Street, Concord, NH 03302</td></tr><tr><td>偏好上課時間</td><td>星期日 上午10:00–11:30</td></tr><tr><td>電話</td><td>555-7244</td></tr><tr><td>學費</td><td>$200</td></tr><tr><td>電子郵件</td><td>jasonrich382@goodmail.net</td></tr><tr><td>繳費期限</td><td>11月30日</td></tr><tr><td>是否有人向您推薦本學院？</td><td>是</td></tr><tr><td>推薦人</td><td>Robin Ghose</td></tr></table></div><p>若要更改上課時間，請至櫃台提出申請。若您推薦他人且對方報名，您的下一門課可享15%折扣。</p></div></section><section class=\"document-card type-newsletter\"><div class=\"doc-ribbon\"><span>電子報</span><small>191-195 · 3/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">中華學院每月電子報｜12月1日</h2><p>看華語電影是提升語言能力的一種方式。本月當地將舉辦兩場華語電影活動。</p><p>12月20日於 Cloudbank Hotel 舉行 Bright Lights 電影節，將放映曾執導獲影評界讚譽的《Summer Shore》的導演 Xu Yue 最新作品《Washing Away》，講述一位上海年輕舞者的故事。門票20元，可於 www.blffest.org 購買。</p><p>此外，12月28日可在 Zhong Academy 免費欣賞中國導演 Wei Chung 的《Grave Mistakes》。學院每月舉辦的放映僅限中級或高級班學生參與。與上個月放映《River Goddess》後相同，本次放映後也會以中文討論。</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>公告通知</span><small>196-200 · 1/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">徵求「Emerald Falls」電視節目受訪者</h2><p>導演 Hector Almonte 正在為介紹 Emerald Falls 小鎮的電視節目徵求受訪者。該集隸屬於 Janet Leslie 主持、獲獎紀錄片系列《The Good Old Days》。第二季將由10集增加至12集，繼續透過訪談與實地影像介紹貝里斯各地的歷史小鎮。受訪者不必住在 Emerald Falls，但必須與當地有深厚連結。詳情請致電 (501) 555-7925。</p><p>此外，導演希望借用能呈現小鎮早期歷史的信件、照片等物件。如您願意出借，請聯絡助理 Chloe Benbow：c.benbow@sunrise.bz。</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>196-200 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Chloe Benbow c.benbow@sunrise.bz</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Elaine Kershaw elaine.k@eurekamail.bz</strong></div><div class=\"doc-field\"><span>主旨</span><strong>Emerald Falls 的舊照片</strong></div><div class=\"doc-field\"><span>日期</span><strong>7月25日</strong></div></div><p>Benbow 小姐您好：</p><p>讀到 Emerald Falls 將登上《The Good Old Days》令我興奮。我很喜歡上一季以 Pepita de Oro 為題的最後一集。</p><p>雖然我從未住在 Emerald Falls，但父親出生於此，且我收藏祖父擔任鎮長時期拍攝的當地照片及畫作。祖父向本地藝術家購得《Picnic by the Falls》、《Plaza Esperanza》和《The Grand Carnival》三幅作品。</p><p>我願意借出照片，但畫作價值高，必須留在家中。如果 Almonte 先生希望拍攝畫作，歡迎到 Maracuyá 的家中拜訪。</p><p>敬祝安好<br/>Elaine Kershaw</p></div></section><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>新聞／文章</span><small>196-200 · 3/3</small></div><div class=\"document-body\"><p>貝里斯市（12月15日）— 紀錄片系列《The Good Old Days》介紹貝里斯歷史城鎮，收視率持續上升。最近一集聚焦 Emerald Falls，這個曾繁榮的採礦社區因著名礦藏耗盡而式微。雖然人口大幅下降，小鎮景貌仍保留舊時模樣。節目的一幕展示了 Jana Haynes 的畫作《Plaza Esperanza》，呈現當地生活的變遷。</p><p>導演 Hector Almonte 表示：「第二季我們尋找與小鎮有個人連結的受訪者。多虧大家分享故事和珍貴物件，Emerald Falls 那集完成得很成功。」</p><p>下週將播出第5集；導演希望保持該集地點的神祕感。</p></div></section></div>"};const DETAILED_EXPLANATIONS={"101":{"type":"【動詞位置】現在進行式","translation":"根據新聞報導，Philby 公司目前正在猶他州興建一間新辦公室。","reason":"句子（Philby Corporation ~ present）裡缺少動詞，所以動詞 (A) 和 (C) 是可能的答案。因為有表示現在時間的詞語（at present），所以表示現在進行中的事的現在進行式 (A) is building 是正確答案。未來式 (C) 表示未來發生的事、對於未來狀況的推測，或者意志。to 不定詞 (B) 和現在分詞 (D) 不能用在動詞位置。","vocab":"","paraphrase":""},"102":{"type":"【受詞位置】人稱代名詞的格","translation":"Wendt 小姐想親自與 Andrews 先生見面，但最後只能改打電話給他。","reason":"空格是動詞（call）的受詞，所以反身代名詞 (B) 和受格人稱代名詞 (C) 是可能的答案。因為要表達「Wendt 小姐想要親自見 Andrews 先生，但不得不改為打電話給他」，所以受格人稱代名詞 (C) him 是正確答案。反身代名詞 (B) 當受詞，表示和主詞相同的人或事物，而這裡的主詞（Ms. Wendt）和受詞並不是同一個人，所以不對。所有格人稱代名詞 (A) 和主格人稱代名詞 (D) 不能當受詞。就算把 (A) 當成所有代名詞「他的東西」，意思變成「Wendt 小姐不得不打電話給他的東西」，也說不通。","vocab":"in person phr. 親自，當面　instead adv. 取而代之，而是……","paraphrase":""},"103":{"type":"副詞選擇 強調副詞","translation":"Myers 小姐訓練了所有新進員工，甚至主動提出願意指導任何需要額外協助的人。","reason":"因為要表達「除了訓練所有新員工以外，甚至還主動提議指導任何需要額外幫助的人」，所以在單字或片語前面做強調的 (C) even（甚至）是正確答案。副詞 (A) well（很好地），通常在動詞後面做修飾，而在這裡意思會變成「很好地提議去指導」，也不恰當。副詞 (D) too（太……）通常在形容詞或副詞前面做強調，或是在句尾表示「也……」的意思。代名詞 (B) both（兩者都）在這個句子裡沒有適當的指稱對象。","vocab":"train v. 訓練　offer v. 提議，主動給予　mentor v. 指導 n. 導師，指導者","paraphrase":""},"104":{"type":"【可以接在 be 動詞後面的成分】被動態（be + p.p.）","translation":"承包商要求在星期五下午之前支付他的服務費用。","reason":"空格在 be 動詞（be）後面，所以能形成進行式的 -ing 形 (A) 和被動態的 p.p. 形 (B) 是可能的答案。因為要表達「付款被支付」的意思，所以能和空格前的 be 動詞形成被動態的動詞 make（做……）p.p. 形 (B) made 是正確答案。-ing 形構成現在進行式後，意思會變成「付款正在做……」，所以不對。動詞原形 (C) 和包含動詞 have 的原形的 (D) 不能接在 be 動詞後面。另外，請記得 suggest（建議）、ask（要求）、demand（要求）等等表示提議、要求、義務的動詞後面接 that 子句當受詞時，that 子句會使用動詞原形。","vocab":"contractor n. 承包商　make a payment phr. 付款","paraphrase":""},"105":{"type":"副詞位置","translation":"波特蘭熊貓隊勉強取得參加地區冰球錦標賽的資格。","reason":"可以修飾動詞（have qualified）的是副詞，所以副詞 (C) narrowly（勉強地，差一點）是正確答案。動詞或過去分詞 (A)、名詞 (B)、動詞或形容詞 (D) 都不能修飾動詞。另外，請記得副詞修飾完成式（have + p.p.）時，副詞會出現在 have 和 p.p. 之間或後面。","vocab":"qualify v. 獲得資格，擁有資格　regional adj. 地區的　championship n. 錦標賽　narrow v. 變窄 adj. 窄的　narrowness n. 狹窄","paraphrase":""},"106":{"type":"形容詞","translation":"該市人口快速成長，導致可用住宅供應短缺。","reason":"句意是「迅速的人口成長造成住宅缺乏」，所以形容詞 (A) rapid（迅速的）是正確答案。(B) tight 表示「緊的」，(C) tedious 表示「冗長乏味的」，(D) affluent 表示「富裕的」。另外，請記得 result in（導致……）這個慣用表達方式。","vocab":"scarcity n. 缺乏　housing n. 住宅，居住","paraphrase":""},"107":{"type":"介系詞選擇","translation":"儘管身為歌劇歌手有許多成就，Gloria Donahue 至今仍未獲得任何重大獎項。","reason":"因為要表達「儘管有許多身為歌劇歌手的成就，但還沒得過任何重大獎項」，所以表讓步的介系詞 (D) In spite of（儘管有……）是正確答案。(A) Next to 表示位置「在……旁」。(B) Far from 表示「遠離……，完全不是……」，(C) Because of 表示理由「因為……」。","vocab":"achievement n. 成就　major adj. 重要的，重大的","paraphrase":""},"108":{"type":"名詞詞彙","translation":"這家旅行社提高銷售額的策略，是在網站刊登顧客推薦心得。","reason":"句意是「旅行社增加銷售的策略是在網站上刊登顧客的見證文」，所以名詞 (C) strategy（策略）是正確答案。(A) landmark 表示「地標，重大事件」，(B) portfolio 表示「作品集，投資組合」，(D) approval 表示「批准，贊成」。","vocab":"travel agency phr. 旅行社　post v. 張貼　testimonial n. （產品或服務使用者所寫的）見證文，推薦文","paraphrase":""},"109":{"type":"【名詞位置】人物名詞 vs. 事物名詞","translation":"Rolstein 文學獎的得獎人將由多位文學愛好者選出。","reason":"空格在定冠詞（The）和介系詞（of）之間，所以名詞 (B) 和 (C)、功能相當於名詞的動名詞 (D) 是可能的答案。因為要表達「文學獎的得獎者將由一些文學熱愛者選出」，所以人物名詞 (C) recipient（接受者）是正確答案。事物名詞 (B) receipt（收據）和動名詞 (D) receiving（收到）會使意思變成「收據／收到將由一些文學熱愛者選出」，所以不對。動詞或過去分詞 (A) 不能用在名詞的位置。","vocab":"select v. 選擇，挑選　a number of phr. 一些……　literature n. 文學　enthusiast n. 熱愛者","paraphrase":""},"110":{"type":"形容詞位置","translation":"McGuire 先生只差一期罕見漫畫，就能湊齊整套收藏。","reason":"空格修飾後面的名詞（set），所以答案是形容詞 (B) complete（完整的）。名詞 (A)、(C)、(D) 不能修飾這裡的名詞。","vocab":"rare adj. 稀有的　completion n. 完成　completer n. 完成者　completeness n. 完整","paraphrase":""},"111":{"type":"動詞詞彙","translation":"許多航空公司無法負擔持續上升的成本，因此選擇取消國內航班的機上餐點服務。","reason":"句意是「由於無法跟上逐漸上升的成本，許多航空公司選擇去除國內航班的飛機餐服務」，所以 (B) eliminate（排除）是正確答案。(A) recover 表示「恢復，找回」，(C) calculate 表示「計算」，(D) recognize 表示「認出，認可」。","vocab":"keep up with phr. 跟上……　opt v. 選擇　in-flight adj. 飛行途中的　domestic adj. 國內的","paraphrase":""},"112":{"type":"【受詞位置】動名詞的角色、形態、意義上的主詞","translation":"研討會參加者可兌換歡迎資料包內的餐券，領取免費午餐。","reason":"空格前面有介系詞（by），所以能當介系詞受詞的動詞 redeem（兌換〔優惠券等〕）轉為動名詞的形態 (B) redeeming 是正確答案。動詞 (A) 和 (D)、動詞或過去分詞 (C) 不能當介系詞的受詞。","vocab":"participant n. 參加者　complimentary adj. 免費贈送的　voucher n. 禮券，優惠券，兌換券","paraphrase":""},"113":{"type":"副詞詞彙","translation":"工廠機器人讓製造工作能執行得更快速且精確。","reason":"句意是「機器人使得更快速且精確地執行製造工作成為可能」，所以副詞 (C) accurately（精確地）是正確答案。(A) assertively 表示「果斷地」，(B) statistically 表示「統計上」，(D) intentionally 表示「有意地，故意」。","vocab":"carry out phr. 實行，執行　manufacture v. 製造　task n. 任務，工作","paraphrase":""},"114":{"type":"介系詞選擇 位置","translation":"如果比賽以平手結束，獎金將由兩名參賽者平分。","reason":"因為要表達「獎金會被平分給兩位參賽者」，所以表示兩個對象間的位置或關係的介系詞 (D) between（在……之間）是正確答案。(A) within（在……之內）看中文翻譯似乎說得通，但它其實是表示期間或場所的範圍，所以不對。(B) off 表示位置「離開……」。(C) along 表示方向「沿著……」。就算把 off 和空格前面的動詞 divide 結合成動詞片語 divide off（把……分隔開）也不行，因為形成被動態（will be divided off）之後，就沒有可以接後面的名詞（both contestants）當受詞的成分了。","vocab":"in the event that phr. 如果，萬一……　competition n. 比賽，競賽　tie n. 平手 v. 平手　contestant n. 參賽者","paraphrase":""},"115":{"type":"【引導修飾性語句的成分】現在分詞 vs. 過去分詞","translation":"在機場抵達區領取行李的旅客應注意，許多行李箱外觀相似。","reason":"這個句子已經有具備主詞（Passengers）、動詞（should note）和受詞（that many bags look alike）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - luggage ~ arrival area 是修飾性的語句。修飾部分是修飾空格前面的名詞（Passengers），所以能引導修飾語句、在名詞後面做修飾的現在分詞 (A) 和過去分詞 (D) 是可能的答案。因為空格後面有受詞（luggage），而且被修飾的名詞（Passengers）和分詞在意義上是主動的關係「乘客領取行李」，所以動詞 claim（認領）的現在分詞 (A) claiming 是正確答案。過去分詞 (D) claimed 表示被動意義，而且後面不能接受詞，所以不對。動詞 (B) 和 (C) 不能引導修飾語句。","vocab":"passenger n. 乘客　luggage n. 行李","paraphrase":""},"116":{"type":"【形容詞位置】容易混淆的形容詞","translation":"陳先生擁有近三十年的廣告經驗，是該領域資歷豐富的專業人士。","reason":"空格修飾後面的名詞（professional），所以形容詞 (B) 和 (C) 是可能的答案。因為要表達「將近 30 年的廣告經驗，使他成為自己領域中經驗豐富的專家」，所以形容詞 (C) seasoned（經驗豐富的）是正確答案。如果使用 (B) seasonal（季節性的），意思會變成「將近 30 年的廣告經驗，使他成為自己領域中季節性的專家」，所以不對。名詞或動詞 (A)、副詞 (D) 不能修飾名詞。","vocab":"advertising n. 廣告　professional n. 專家　field n. 領域　season n. 季節 v. 調味　seasonally adv. 季節性地","paraphrase":""},"117":{"type":"名詞","translation":"Shane 小姐擔任公司董事以來，Emperor Fabrics 已簽訂多項獲利豐厚的協議。","reason":"句意是「Emperor Fabrics 公司簽了一些有利潤的協議」，所以名詞 (B) deals（協議）是正確答案。另外，請記得 sign a deal（簽定協議）這個慣用表達方式。(A) quote 表示「報價，引用」。(C) petition 表示「請願（書）」。(D) application 表示「申請（書），應徵」。","vocab":"a number of phr. 一些　profitable adj. 有利潤的","paraphrase":""},"118":{"type":"形容詞","translation":"新橋必須足夠堅固，才能承受經常經過當地的暴風雨。","reason":"句意是「新的橋必須夠堅固」，所以形容詞 (D) sturdy（堅固的）是正確答案。(A) severe 表示「嚴重的，嚴厲的」。(B) separate 表示「個別的，分開的」。(C) genuine 表示「真正的」。","vocab":"withstand v. 承受住，經得起　pass through phr. 通過，經過","paraphrase":""},"119":{"type":"名詞位置","translation":"依照購物中心政策，保全人員完成訓練後會獲發門禁識別證。","reason":"空格在介系詞（In）和介系詞（with）之間，所以名詞 (A) compliance（遵守，依從）是正確答案。另外，請記得 compliance 經常以 in compliance with（遵守，依照……）的形式使用。動詞 (B) 和 (D)、動詞或過去分詞 (C) 不能用在名詞的位置。","vocab":"policy n. 政策　security guard phr. 警衛　comply v. 遵守","paraphrase":""},"120":{"type":"數量表達方式 + 關係代名詞","translation":"Hamilton 鎮有七座公園，每座都曾在某個時候舉辦戶外音樂會。","reason":"這個句子已經有具備主詞（The town of Hamilton）、動詞（has）和受詞（seven parks）的完整子句，所以 all of - - - - - - - - - - - - - - - - - - - - at one time or another 是修飾性的語句。因為修飾部分的開頭有數量表達方式 all of，所以能接在數量表達方式後面，同時引導修飾部分的受格關係代名詞 (C) which 是正確答案。受格人稱代名詞 (A)、指示代名詞 (B)、所有代名詞 (D) 都不能引導修飾語句。","vocab":"host v. 主辦，舉辦 n. 主辦者，主人　at one time or another phr. 至少一次","paraphrase":""},"121":{"type":"【引導修飾性語句的成分】介系詞選擇 理由","translation":"由於雅典舉辦年度媒體會議，市中心大部分飯店都已訂滿。","reason":"這個句子已經有具備主詞（most downtown hotels）和動詞（are ~ booked）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - ~ Athens 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表達「由於在雅典舉行的年度媒體會議，大部分的市區飯店都預約滿了」，所以介系詞 (A) Due to（由於……）是正確答案。(C) Besides 表示「除了……還有」，(D) Such as 表示「例如……」。 (B) As soon as（一……就）引導的是修飾子句而不是片語。","vocab":"conference n. 會議　downtown adj. 市中心區的","paraphrase":""},"122":{"type":"主動態與被動態的區分","translation":"Morgan 先生因為先前的雇主對他的工作表現很滿意，而被推薦參與 Cuthright Tower 的電力設備安裝工作。","reason":"空格後面有使用於被動態的 by，而且句意是「Morgan 先生受推薦擔任電力設備安裝工作」，所以被動態 (C) was recommended 是正確答案。另外，請注意 recommend（推薦）經常以 recommend A for B（把 A 推薦給 B）的形式使用，但這個句子的動詞 recommend 使用被動態，所以原本的受詞（Mr. Morgan）變成了主詞。","vocab":"electrical installation phr. 電力設備安裝　former adj. 之前的　employer n. 雇主","paraphrase":""},"123":{"type":"動詞詞彙","translation":"Level Field Landscaping 最近因不當棄置庭院廢棄物而被市政府罰款。","reason":"句意是「因為垃圾處理不當而遭到罰款」，所以動詞 fine（罰款）的 p.p. 形 (D) fined 是正確答案。(A) commence 表示「開始」，(B) accelerate 表示「加速」，(C) measure 表示「測量」。","vocab":"recently adv. 最近　dispose of phr. 處理掉……　improperly adv. 不適當地","paraphrase":""},"124":{"type":"副詞子句連接詞","translation":"這座組裝廠正按進度超越拖拉機生產配額，就像上個月一樣。","reason":"這個句子已經有具備主詞（The assembly plant）、動詞（is）和介系詞片語（on schedule）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - it ~ last month 是修飾性的語句。修飾部分有動詞（did），所以能引導修飾子句的副詞子句連接詞 (A) 和 (D) 是可能的答案。因為要表達「就像上個月一樣超過曳引機的配額」，所以副詞子句連接詞 (A) just as（就像……一樣）是正確答案。(D) until 表示時間點「到……為止」。連接副詞 (B) in fact（事實上）和 (C) thus（因此）不能引導修飾子句。另外，請記得 be 動詞使用第 1 類句型（S + V）的時候，要有介系詞片語等副詞性質的修飾語句，才是完整的句子。","vocab":"assembly plant phr. 組裝工廠　exceed v. 超過　quota n. 配額","paraphrase":""},"125":{"type":"其他比較級表達方式","translation":"Denise Camic 在鼓舞人心的演講中主張，公司越有創意，就越成功。","reason":"因為要表達「公司越有創意就越成功」，所以能形成兩個子句（the ~ company is，the greater ~ success）對等連接句型「the + 比較級……，the + 比較級～」的比較級 (A) more creative 是正確答案。名詞 (B)、原級形容詞 (C)、最高級形容詞 (D) 不能用在這裡的比較級位置。","vocab":"inspirational adj. 鼓舞人心的　argue v. 主張　creativity n. 創造性，創造力","paraphrase":""},"126":{"type":"副詞","translation":"為確保資料以保密方式儲存，沒有密碼就無法存取資料庫中的檔案。","reason":"句意是「為了確保資訊被保密地儲存，資料庫裡的檔案沒有密碼無法存取」，所以副詞 (B) confidentially（秘密地，機密地）是正確答案。(A) productively 表示「有生產力地」，(C) unanimously 表示「全體一致地」，(D) voluntarily 表示「自發性地」。","vocab":"ensure v. 確保　store v. 儲存　access v. 存取 n. 存取","paraphrase":""},"127":{"type":"名詞慣用表達方式","translation":"Gordon 先生在年度企業家獎的得獎感言中，向投入工作的團隊成員表達感謝。","reason":"句意是「對專注於工作的團隊成員表達了感謝」，所以能和空格後面的介系詞（for）組成 appreciation for（對……的感謝）的名詞 (D) appreciation（感謝）是正確答案。(A) commitment 表示「奉獻，投入」，常搭配介系詞 to 使用。(B) interest 表示「興趣」，但要表達「對……的興趣」時，通常搭配介系詞 in 使用。(C) tribute 表示「讚揚，敬意」，意思似乎說得通，但要表達「讚揚，稱頌……」時，應該使用 pay tribute to 的句型。","vocab":"acceptance speech phr. 得獎演說　dedicated adj. 投入的，專注於某事的","paraphrase":""},"128":{"type":"倒裝句型","translation":"訪客不得進入建築物的特定區域，也不得在沒有導覽人員陪同下四處走動。","reason":"空格後面的子句（are they ~ guide）中，主詞（they）和動詞（are）倒裝，所以能引導倒裝句的 (A) 和 (C) 是可能的答案。空格前面的句子（Visitors ~ building）是有否定詞（not）的否定句，所以能在有否定詞的子句後面引導倒裝句的 (C) nor（也不……）是正確答案。(A) so 雖然也可以引導倒裝句，但是用在肯定句後面，表示「也一樣……」，所以不對。介系詞 (B) during（在……期間）和副詞 (D) though（雖然）不能引導倒裝句。","vocab":"allow v. 允許（進入）　certain adj. 特定的，確定的　section n. 區域，部分　wander around phr. 四處徘徊","paraphrase":""},"129":{"type":"介系詞片語","translation":"Rand 有機農場透過廣播廣告擴大了顧客群。","reason":"句意是「Rand's 有機農場藉由一支廣播廣告增加了顧客群」，所以表示手段的介系詞片語 (D) by means of（藉由……）是正確答案。(A) in common with 表示「與……共同」，(B) in addition to 表示「除了……以外」，(C) on behalf of 表示「代表……」。","vocab":"customer base phr. 顧客群　advertisement n. 廣告","paraphrase":""},"130":{"type":"名詞","translation":"幾位客服中心員工因年度考績優異而獲得加薪。","reason":"句意是「幾位客服中心員工獲得了傑出的年度評價，並且因此獲得了加薪」，所以名詞 (B) raise（加薪）是正確答案。(A) proximity 表示「接近」，(C) setback 表示「挫折」，(D) premiere 表示「首映」。","vocab":"outstanding adj. 傑出的　annual adj. 年度的　evaluation n. 評價","paraphrase":""},"131":{"type":"【副詞位置】副詞選擇","translation":"在這份備忘錄中，第 131 處空格應填入哪個選項？","reason":"空格修飾數量形容詞（15），所以副詞 (C) 和 (D) 是可能的答案。因為要表達「這個月的辦公室公用事業帳單比去年同月貴將近 15%」，所以副詞 (C) nearly（將近……）是正確答案。(D) nearby 表示位置「在附近」。形容詞的最高級 (A) 和比較級 (B) 不能修飾形容詞。就算把 near 當成「接近」的意思，使用最高級 (A) 和比較級 (B) 的句意變成「（物理位置上）最接近／比較接近 15%」，也不恰當。","vocab":"","paraphrase":""},"132":{"type":"【動詞位置】現在完成式 掌握上下文","translation":"在這份備忘錄中，第 132 處空格應填入哪個選項？","reason":"空格所在的句子缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。句意是「公司實施一些節省費用措施」，因為只看空格所在的句子無法判斷哪個動詞時態才正確，所以需要參考前後或整篇文章的內容。上一句請員工注意，這個月的辦公室公用事業帳單比去年同月貴將近 15%，而下一句提到措施包括在去年秋天整修時安裝了能源效率佳的燈和窗戶，由此可知「實施一些節省費用措施」是從過去持續到現在的事。因此，表達過去發生的事到現在仍有影響，或者剛完成的事的現在完成式 (D) has implemented 是正確答案。未來式 (B) 表示未來發生的事、對未來狀況的推測，或者意志。未來完成式 (C) 表示在未來特定時間點之前發生的行為，會在未來的這個時間點完成。動名詞或現在分詞 (A) 不能用在動詞位置。","vocab":"implement v. 實施","paraphrase":""},"133":{"type":"形容詞詞彙 掌握上下文","translation":"在這份備忘錄中，第 133 處空格應填入哪個選項？","reason":"句意是「我想提醒各位要＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到只要有一點理性和好的判斷，就能採取措施來減少花費，所以這裡應該是想提醒員工了解問題，形容詞 (A) sensible（明智的，覺知到的）是正確答案。(B) honest 表示「誠實的」，(C) impartial 表示「公正的」，(D) tolerant 表示「寬容的」。","vocab":"","paraphrase":""},"134":{"type":"選出適當的句子","translation":"哪個句子最適合填入備忘錄的第 134 處空格？","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 With just a bit of rationality and good judgment, I am confident we can take steps to reduce our expenses. 提到，只要有一點理性和好的判斷，就能採取措施來減少花費，而下一句 if you have any other ideas for saving energy, please let me know 則說，還有其他節能的主意請告知，所以空格的內容應該和減少花費的方法有關，(C) To start, we can all make sure to turn off anything that's not in use 是正確答案。\n(A) 給予這個機會，我相信各位之中有許多人將會自願參加。\n(B) 如果有疑問，只要參考發布在線上的會議議程即可。\n(C) 首先，我們可以確保關閉任何沒在使用的東西。\n(D) 結果，我們將不再有資格得到目前的服務折扣。","vocab":"given prep. 考慮到……　volunteer v. 自願，志願服務　in doubt phr. 有疑問，有疑慮　meeting agenda phr. 會議議程　qualify v. 有資格","paraphrase":""},"135":{"type":"形容詞詞彙","translation":"在這篇新聞稿中，第 135 處空格應填入哪個選項？","reason":"句意是「這系列的第一集將在 7 月 15 日播出」，所以表示「入門的，介紹性的」的形容詞 (D) introductory 是正確答案。(A) ultimate 表示「最終的」，(B) consecutive 表示「連續的」，(C) controversial 表示「有爭議的」。","vocab":"","paraphrase":""},"136":{"type":"名詞 掌握上下文","translation":"在這篇新聞稿中，第 136 處空格應填入哪個選項？","reason":"句意是「接下來的每一＿＿都將聚焦於單一的小說上」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到，這系列的第一集將在 7 月 15 日播出，而空格的上一句則提到第一集將討論這個類型最近受歡迎的情況，並探討歷史與小說之間有趣的關係，所以接下來會聚焦於單一小說的應該是其他的集數，正確答案是名詞 (C) episode（一集）。(A) review 表示「評論」，(B) workshop 表示「工作坊，研習會」，(D) poster 表示「海報」。","vocab":"","paraphrase":""},"137":{"type":"選出適當的句子","translation":"哪個句子最適合填入新聞稿的第 137 處空格？","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Each subsequent (episode) will focus on a single novel. 提到，接下來的每一集都將聚焦於單一的小說上，所以空格中的內容應該和每一集討論的小說有關，(B) The books that are chosen will all be new releases 是正確答案。","vocab":"","paraphrase":""},"138":{"type":"【名詞位置】人物名詞 vs. 抽象名詞","translation":"在這篇新聞稿中，第 138 處空格應填入哪個選項？","reason":"空格被前面的指示形容詞（this）修飾，所以名詞 (B) 和 (C) 是可能的答案。因為要表達「這個人主演過幾部電影」，所以答案是人物名詞 (C) individual（個人）。如果使用 (B) individuality（個性，特徵）的話，意思會變成「這個個性主演過幾部電影」，所以不對。形容詞 (A) 和副詞 (D) 不能用在名詞位置。","vocab":"individualistic adj. 個人主義的　individually adv. 個別地","paraphrase":""},"139":{"type":"動詞時態","translation":"在這封電子郵件中，第 139 處空格應填入哪個選項？","reason":"空格所在的句子缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。句意是「休假持續到星期五」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句問假期過得怎麼樣，而下一句說想知道對方是否能在那天（星期五）回來上班，由此可知假期是現在持續到未來的星期五，所以也能表示未來的現在式 (B) lasts 是正確答案。過去式 (A) 表示已經結束的過去動作或狀態，現在完成式 (C) 則用來表達過去開始、剛剛完成的事，或者過去發生的事影響持續到現在。to 不定詞 (D) 不能用在動詞的位置。","vocab":"last v. 持續","paraphrase":""},"140":{"type":"選出適當的句子","translation":"哪個句子最適合填入電子郵件的第 140 處空格？","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Nektar Beverages suddenly wants us to make some changes to the advertisement it commissioned 提到，Nektar Beverages 公司突然要求對於它委託的廣告做些改變，所以空格的內容應該和 Nektar Beverages 公司所要求的廣告修改有關，(D) This is surprising as they seemed happy with it last week 是正確答案。(A) 雖然也和變更有關，但這句話「他們」（Nektar Beverages）進行修改，而事實上是廣告公司 Advert X 要進行修改才對。","vocab":"apparently adv. 顯然，明顯地　corporate adj. 公司的　regulation n. 規定　contractor agreement phr. 承包合約　expire v. 到期","paraphrase":""},"141":{"type":"to 不定詞的形態","translation":"在這封電子郵件中，第 141 處空格應填入哪個選項？","reason":"空格前面有 to，而且句意是「為了補償你，我們會付你標準加班費」，所以能和空格前面的 to 形成 to 不定詞的動詞原形 (B) compensate（補償）是正確答案。名詞 (A) 和 (D)、動名詞或現在分詞 (C) 不能用在動詞原形的位置。","vocab":"compensator n. 補償者，補償器　compensation n. 補償","paraphrase":""},"142":{"type":"動詞","translation":"在這封電子郵件中，第 142 處空格應填入哪個選項？","reason":"句意是「也會＿＿額外的一天休假」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到會付標準加班費，所以這一句應該也是補償的方式之一，所以動詞 (C) provide（提供）是正確答案。(A) require 表示「要求，需要」，(B) record 表示「記錄」，(D) prohibit 表示「禁止」。","vocab":"","paraphrase":""},"143":{"type":"選出適當的句子","translation":"哪個句子最適合填入文章的第 143 處空格？","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 GEOnet Solutions has announced that it will be extending its reach overseas. 提到，GEOnet Solutions 公司宣布將拓展業務範圍至海外，所以空格的內容應該和 GEOnet Solutions 公司的海外擴張有關，(D) The company will be opening a satellite branch in London 是正確答案。\n(A) 顧客現在將可以在網路上下訂單。\n(B) 這次增加是全世界需求成長中的結果。\n(C) 市場已太過飽和，不適合再開設分公司。\n(D) 公司將於倫敦開設附屬分公司。","vocab":"place an order phr. 下訂單　demand n. 需求　solution n. 解決，解決方法　make a decision phr. 做決定　satellite adj. 附屬的，從屬的 n. （人造）衛星","paraphrase":""},"144":{"type":"單數主詞後面使用單數動詞，複數主詞後面使用複數動詞","translation":"在這篇文章中，第 144 處空格應填入哪個選項？","reason":"能和空格前面的指示形容詞（this）連用，並且可以當單數動詞（has created）主詞的單數名詞 (B) pioneer（先驅）是正確答案。動名詞或現在分詞 (A) 會使意思變成「這個技術開發的先驅行為，創造了創新的方式」，而如果當成分詞的話，也無法視為句子的主詞。動詞或過去分詞 (C) 不能用在主詞位置。複數名詞 (D) 不能搭配單數動詞或指示形容詞 this 使用。","vocab":"","paraphrase":""},"145":{"type":"連接副詞 掌握上下文","translation":"在這篇文章中，第 145 處空格應填入哪個選項？","reason":"空格和逗號一起出現在句子開頭的連接副詞位置，所以要掌握上一句和空格所在句子之間的關係，才能判斷答案。上一句提到這個技術開發先驅創造了利用地質工程學的創新方式，並且在這個領域實現了無數的進展，而空格所在的句子說沒有它的努力，數百萬人每天使用的資料收集系統與追蹤工具就不會存在，所以可以用來對上一句附加說明的 (B) In fact（事實上）是正確答案。(A) Notwithstanding 表示「儘管如此」，(C) Meanwhile 表示「與此同時」，(D) Instead 表示「取而代之」。","vocab":"notwithstanding prep. 儘管　meanwhile adv. 同時　instead adv. 取而代之","paraphrase":""},"146":{"type":"名詞詞彙 掌握整體文意","translation":"在這篇文章中，第 146 處空格應填入哪個選項？","reason":"句意是「這次＿＿的主要目的是促進與倫敦技術中心的合作」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到 GEOnet Solutions 公司宣布將拓展業務範圍至海外，將在倫敦開設附屬分公司，而空格所在句子的下一句提到雙方相信它們的合作將對彼此有利，因此可知促進與倫敦技術中心合作的是海外擴張的行動，名詞 (D) expansion（擴張）是正確答案。(A) experiment 表示「實驗」，(B) relocation 表示「遷移」，(C) policy 表示「政策」。","vocab":"","paraphrase":""},"147":{"type":"Not/True True 題型","translation":"關於這項銷售挑戰活動，文中指出什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 the challenge 有關的內容，並且對照選項判斷答案。(A) 在 Thank you all for contributing to the monthly sales challenge. 的部分提到，要感謝所有人對每月銷售挑戰的貢獻，而 the executive team has decided to hold this initiative again in the future 的部分提到執行團隊已經決定未來再度舉辦這項企畫，符合選項敘述，所以 (A) 是正確答案。(B) 在 We acquired several new clients due to your hard work. 的部分提到由於大家的努力，而獲得了幾個新客戶，所以活動是成功的，不符合選項敘述。(C) 和 (D) 在文章裡沒有提到。","vocab":"anonymous adj. 匿名的","paraphrase":""},"148":{"type":"wh-問題 What","translation":"Seiko 小姐希望員工做什麼？","reason":"這是問 Seiko 小姐希望員工做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Seiko want her staff members to do 有關的部分是 Please e-mail me some new prize ideas，這部分請員工用電子郵件寄一些新的獎品意見，所以 (B) 是正確答案。\nnew prize ideas 新的獎品意見 → potential rewards 可能的獎品","vocab":"evaluate v. 評價　potential adj. 可能的，潛在的　reward n. 報酬，獎賞","paraphrase":""},"149":{"type":"Not/True Not 題型","translation":"關於 Cole 影城會員，下列何者未被提及？","reason":"這是 Not/True 題型，要找出和關鍵詞語 members of Cole Theater 有關的內容，並且對照選項判斷答案。(A) 在 10 percent discount for ~ evening ~ showings 的部分提到，可以得到晚間場次的 10% 折扣，符合選項敘述。(B) 在 Membership cards must be renewed after 12 months. 的部分提到，會員卡必須在 12 個月後更新，符合選項敘述。(C) 在 Free concession stand items ~ in exchange for reward points 的部分提到，可以用回饋點數免費兌換飲食攤位商品，符合選項敘述。(D) 在文章裡沒有提到，所以 (D) 是正確答案。\nFree concession stand items ~ in exchange for reward points 用回饋點數免費兌換飲食攤位商品 → redeem points for snacks 用點數兌換點心","vocab":"rate n. 費率 v. 評價　redeem v. 兌換，兌現","paraphrase":""},"150":{"type":"Not/True True 題型","translation":"關於 Cole 影城，文章指出什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Cole Theater 有關的內容，並且對照選項判斷答案。(A)、(B)、(C) 在文章裡沒有提到。(D) 在 Tickets to our exclusive movie premieres, which are attended by famous actors 的部分提到知名演員出席的獨家電影首映會門票，符合選項敘述，所以 (D) 是正確答案。","vocab":"hold v. 舉辦　host v. 主辦　celebrity n. 名人","paraphrase":""},"151":{"type":"掌握意圖","translation":"上午 11:36，Pollard 先生說「我知道你通常有備用的」是什麼意思？","reason":"這一題問的是 Pollard 先生的訊息所表達的意圖，所以要掌握引用部分（I know you usually have a spare）前後文的情境。Pollard 先生說 I forgot the key to the apartment at 182 North Avenue.，表示自己忘了帶 North 大街 182 號公寓的鑰匙，並且接著說 I know you usually have a spare（我知道你通常會有備用鑰匙），對此 Connie Mills 回應 I do. Come get it anytime before noon.，表示自己的確有備用鑰匙，並且要 Pollard 先生在中午前去拿。因此，Pollard 先生要表達的意思是他需要建築物的鑰匙，(A) 是正確答案。","vocab":"","paraphrase":""},"152":{"type":"wh-問題 What","translation":"Mills 小姐要求 Pollard 先生做什麼？","reason":"這是問 Mills 小姐要求 Pollard 先生做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Mills ask Mr. Pollard to do 有關的部分是 Mills 小姐所說的 please park around the corner. I saw a few empty parking spaces along the sidewalk there.，她在這部分要求在街角附近停車，並且提到那裡的人行道旁有幾個空著的停車位，所以 (D) 是正確答案。","vocab":"","paraphrase":""},"153":{"type":"Not/True True 題型","translation":"關於《Descending Cherub》雕像，信中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Descending Cherub 有關的內容，並且對照選項判斷答案。(A) 和 (C) 在文章裡沒有提到。(B) 在 Our staff were in the process of moving all the works in the outdoor sculpture garden ~. Unfortunately, they did not get to your statue in time. A strong wind caused it to fall from its pedestal 的部分提到，工作人員正在搬動戶外雕塑花園的所有作品，但沒有及時照顧到那件雕塑品（《Descending Cherub》），而一陣強風造成它從底座倒下來，不符合選項敘述。(D) 在 Descending Cherub, the statue you so generously lent us 的部分提到，《Descending Cherub》是 Jansen 先生大方出借給「我們」（Brugeri 美術館）的雕塑品，符合選項敘述，所以 (D) 是正確答案。\nlent 出借了 → was loaned 被借出","vocab":"exhibit v. 展示　loan v. 借出（例如給博物館、美術館）","paraphrase":""},"154":{"type":"wh-問題 What","translation":"這封信附上了什麼？","reason":"這是問這封信附上了什麼（What）的 wh- 問題。和題目的關鍵詞語 included with the letter 有關的部分是 I have enclosed some pictures of the broken area.，這部分提到附上了破損區域的一些照片，所以 (B) 是正確答案。","vocab":"entrance ticket phr. 入場券　claim n. 理賠申請　reimbursement n. 補償，退款","paraphrase":""},"155":{"type":"尋找主題／目的 文章的目的","translation":"這篇文章的其中一個目的是什麼？","reason":"這一題問的是這篇文章的目的，所以要注意文章開頭的部分。Steel Works Inc. has begun operations at its new plant. 的部分提到，Steel Works 公司已經開始新工廠的營運，所以 (D) 是正確答案。\nhas begun operations at its new plant 已經開始新工廠的營運 → opening of a new factory 新工廠的開業","vocab":"","paraphrase":""},"156":{"type":"推論 細節資訊","translation":"關於 Rembau 的工廠，文章暗示什麼？","reason":"這是和題目關鍵詞語 the plant in Rembau 有關的推論問題。Its first mill in Rembau now exclusively exports its products to other Asian countries, though it once met almost half of Malaysia's steel demand. 的部分提到，位於 Rembau 的第一座煉鋼廠，現在只將產品出口到其他亞洲國家，雖然它曾經滿足馬來西亞將近一半的鋼鐵需求。由此可以推知，Rembau 的工廠現在已經不生產馬來西亞國內使用的鋼鐵製品，而是完全外銷，所以 (A) 是正確答案。","vocab":"no longer phr. 不再　local adj. 當地的　take over phr. 接管，收購　manufacture v. 製造","paraphrase":""},"157":{"type":"Not/True Not 題型","translation":"關於 Steel Works，下列何者未被提及？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Steel Works 有關的內容，並且對照選項判斷答案。(A) 在 The plant is Steel Works' second. Its first mill in Rembau now exclusively exports its products to other Asian countries. 的部分提到，這座工廠（Kampung Tebing 廠）是 Steel Works 公司的第二座，而它位於 Rembau 的第一座煉鋼廠，現在只將產品出口到其他亞洲國家，所以 Steel Works 公司有複數的煉鋼廠，符合選項敘述。(B) 在 The plant will help Malaysian cities develop their infrastructure 的部分提到，Kampung Tebing 廠將幫助馬來西亞城市發展基礎建設，符合選項敘述。(C) 在 Steel Works' market share in Malaysia is expected to rise to 72 percent 的部分提到，Steel Works 公司在馬來西亞的市佔率預期將上升至 72%，但不知道是不是過去的兩倍，所以 (C) 是正確答案。(D) 在 Steel Works' plants utilize the latest technology 的部分提到，Steel Works 公司的工廠運用最新技術，符合選項敘述。\nhelp ~ cities develop their infrastructure 幫助城市發展基礎建設 → aid ~ urban development 幫助都市發展\nutilize the latest technology 運用最新技術 → makes use of up-to-date technology 利用最新技術","vocab":"multiple adj. 多個的，複數的　facility n. 設施　urban adj. 都市的　make use of phr. 利用……　up-to-date adj. 最新的","paraphrase":""},"158":{"type":"wh-問題 How","translation":"根據電子郵件，員工如何取得前往設施的路線資訊？","reason":"這是問員工可以怎樣（How）獲得往某個設施的路線指引的 wh- 問題。和題目的關鍵詞語 employees get directions to a facility 有關的部分是 Directions to the Wilmington Conference Center were provided in a previous e-mail.，這部分提到往 Wilmington 會議中心的交通路線指引已經在上一封電子郵件提供了，所以 (C) 是正確答案。","vocab":"","paraphrase":""},"159":{"type":"推論 細節資訊","translation":"關於 Whitaker’s Sports Apparel，文中暗示什麼？","reason":"這是和題目關鍵詞語 Whitaker's Sports Apparel 有關的推論問題。~ Whitaker's Sports Apparel, the client we acquired last week ~ 的部分提到，Whitaker's 運動服裝公司是「我們」（Marks 小姐的公司）最近獲得的客戶，由此可以推知，Whitaker's 運動服裝公司最近和 Marks 小姐的公司達成了協議，所以 (B) 是正確答案。\nlast week 上週 → recently 最近","vocab":"revise v. 修訂　make a deal with phr. 和……達成協議","paraphrase":""},"160":{"type":"選擇句子位置","translation":"下列句子最適合放在標示 [1]、[2]、[3]、[4] 的哪個位置？「不過，他們仍想順道來訪，因為那天他們會在市區。」","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「不過，他們還是想要順道來訪，因為他們那天會在本市」，所以應該會出現在和「他們」（Whitaker's 運動服裝公司的代表）造訪有關的部分。[4] 前面的部分 the representatives from Whitaker's Sports Apparel ~ will be visiting the office around 10 A.M. 提到，Whitaker's 運動服裝的代表將在上午 10 點左右造訪公司，而 [4] 的上一句 I have already advised them that the office will be almost empty due to the conference. 說已經告知他們因為會議的關係，辦公室幾乎會是空的。將句子填入 [4] 的位置之後，可以表達「Whitaker's 運動服裝的代表將造訪公司，雖然已經告知辦公室幾乎會是空的，但他們因為當天會在市內，所以還是想要順道來訪」，文意通順，所以 (D) 是正確答案。","vocab":"stop by phr. （短暫地）順道拜訪","paraphrase":""},"161":{"type":"掌握意圖","translation":"上午 11:09，Bingham 小姐回覆「當然可以」是什麼意思？","reason":"這一題問的是 Bingham 小姐的訊息所表達的意圖，所以要掌握引用部分（Of course）前後文的情境。Ned O'Toole 說 I'd like to ask about the changes to our overtime work policy，表示自己想詢問加班政策的改變，而 Bingham 小姐回應 Of course.（當然可以），表示 Bingham 小姐願意告知 Ned O'Toole 關於加班政策的最新消息，所以 (C) 是正確答案。","vocab":"be willing to do phr. 願意做……　update v. 為……提供最新消息　paperwork n. 文書工作","paraphrase":""},"162":{"type":"Not/True True 題型","translation":"關於加班申請文件，對話提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 the overtime document 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章裡沒有提到。(B) 在 Karen Bingham 所說的 they didn't submit the official overtime document. Many found the form to be too complicated. 提到，過去員工沒有提交正式的加班文件，而很多人覺得那張表太複雜，符合選項敘述，所以 (B) 是正確答案。\nfound ~ to be too complicated 覺得太複雜 → difficult ~ to complete 很難填寫的","vocab":"complete v. 完成，填好（表格等）　distribute v. 分發，分配　in the process of phr. 在……的過程中　rewrite v. 重寫，修改","paraphrase":""},"163":{"type":"wh-問題 What","translation":"12 月 1 日將發生什麼事？","reason":"這是問 12 月 1 日會發生什麼（What）的 wh- 問題。和題目的關鍵詞語 December 1 有關的部分包括 Ned O'Toole 所說的 I'd like to ask about the changes to our overtime work policy，這部分表達想詢問加班政策的改變，以及 Karen Bingham 所說的 it's effective as of 9 A.M., December 1，表示前述的加班政策從 12 月 1 日上午 9 點開始實施，所以 (D) 是正確答案。\neffective 生效的 → take effect 生效","vocab":"manual n. 手冊，說明書 adj. 手動的　take effect phr. 生效","paraphrase":""},"164":{"type":"推論 細節資訊","translation":"關於 O’Toole 先生，對話暗示什麼？","reason":"這是和題目關鍵詞語 Mr. O'Toole 有關的推論問題。Gene Shipley 說 anyone who works over 40 hours a week automatically receives extra pay，表示任何一週工作超過 40 小時的人都會自動獲得額外的薪水，而 O'Toole 先生說 That's good to know, especially considering the big project that I'll be working on in the coming weeks，表示這是個好消息，因為他在接下來幾週要處理大型專案，由此可以推知 O'Toole 先生接下來應該會加班，而受惠於一週工作超過 40 小時自動獲得加班費的政策，(C) 是正確答案。","vocab":"misunderstand v. 誤解，誤會　make a complaint phr. 抱怨，投訴　procedure n. 程序","paraphrase":""},"165":{"type":"wh-問題 Why","translation":"Franklin 機場為什麼要整修？","reason":"這是問 Franklin 機場為什麼（Why）要整修的 wh- 問題。和題目的關鍵詞語 Franklin Airport be renovated 有關的部分是 The Denver Transportation Authority (DTA) has announced a $50 million renovation plan for Franklin Airport ~. The announcement comes as a result of the National Airlines Group (NAG) having labeled its runway as dangerous for large aircraft，這部分提到丹佛交通局宣布了 Franklin 機場耗資 5 千萬元的整修計畫，而之所以有這公告，是因為全國航空公司團體將這座機場的跑道判定為對大型飛機有危險，所以 (A) 是正確答案。\nlabeled ~ as dangerous 被判定為危險的 → safety concerns 安全問題","vocab":"address v. 處理，解決　concern n. 擔心的事，問題　budget surplus phr. 預算的剩餘　retail business phr. 零售業者","paraphrase":""},"166":{"type":"Not/True True 題型","translation":"關於整修計畫，下列何者正確？","reason":"這是 Not/True 題型，要找出和關鍵詞語 the renovation project 有關的內容，並且對照選項判斷答案。(A) 在 When we took over Franklin Airport 11 years ago, we intended to begin rebuilding it right away. Unfortunately, we encountered numerous budget-related delays. We will finally be able to repair our runway and expand our terminals 的部分提到，「我們」（DTA）11 年前接管 Franklin 機場時，本來打算立即重新建設，但遭遇了許多預算造成的延誤，而現在終於能夠修補跑道並擴建航廈，符合選項敘述，所以 (A) 是正確答案。(B) 在 we have managed to secure federal funding 的部分提到，DTA 設法獲得了聯邦政府的資金，不符合選項敘述。(C) 和 (D) 在文章裡沒有提到。","vocab":"decade n. 十年　fund v. 提供資金　private adj. 私人的，民間的　donation n. 捐贈，捐款","paraphrase":""},"167":{"type":"推論 細節資訊","translation":"關於 Franklin 機場，文章暗示什麼？","reason":"這是和題目關鍵詞語 Franklin Airport 有關的推論問題。After the project has concluded, Franklin Airport will begin serving as a point of arrival and departure for international flights. 的部分提到，計畫完成後，Franklin 機場將成為國際航班的抵達與出發點，由此可以推知，這座機場目前只有國內航線，所以 (C) 是正確答案。","vocab":"domestic adj. 國內的　shut down phr. 關閉","paraphrase":""},"168":{"type":"同義詞","translation":"第二段中的 immediate 一字，意思最接近哪個選項？","reason":"immediate 所在的語句 When you are done, you must stay in the immediate area until you are called for the second part of the interview. 之中，immediate 表示「附近的」的意思，所以同樣能表示「附近的」的 (B) 是正確答案。","vocab":"","paraphrase":""},"169":{"type":"wh-問題 What","translation":"這項工作的重要資格條件是什麼？","reason":"這是問對於這份工作，什麼（What）是重要資格條件的 wh- 問題。和題目的關鍵詞語 an important qualification for the job 有關的部分是 This activity will be used to evaluate your communication skills and ability to work with coworkers.，這部分提到面試的一項活動將被用來評價溝通技能，以及和同事合作的能力，所以 (A) 是正確答案。\nwork with coworkers 和同事合作 → cooperate with others 與他人合作","vocab":"qualification n. 資格　extensive adj. 廣泛的　willingness n. 意願","paraphrase":""},"170":{"type":"wh-問題 What","translation":"應徵者必須做什麼？","reason":"這是問應徵者被要求做什麼（What）的 wh- 問題。和題目的關鍵詞語 applicants required to do 有關的部分是 Please confirm your participation by replying to this e-mail.，這部分要求回覆這封電子郵件來確認參加，所以 (B) 是正確答案。","vocab":"submit v. 提交　reference n. 推薦信，參考文獻　present v. 提出，出示","paraphrase":""},"171":{"type":"選擇句子位置","translation":"下列句子最適合放在標示 [1]、[2]、[3]、[4] 的哪個位置？「因此您不需要自行攜帶任何材料。」","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「所以您不需要自行攜帶任何用品」，所以句子填入的部分應該和面試時提供的東西有關。[4] 的上一句 We will supply everything you need to complete the process, including paper, pens, and access to selected law books from our library. 提到，將供應完成這個程序所需的一切，包括紙、筆，以及從圖書館中挑選的一些法律書籍的使用權。將句子填入 [4] 的位置之後，可以表達「因為供應了包括紙、筆以及法律書籍等所需的一切，所以您不需要自行攜帶任何用品」，文意通順，所以 (D) 是正確答案。","vocab":"","paraphrase":""},"172":{"type":"尋找主題／目的 文章的目的","translation":"這則通知的其中一個目的是什麼？","reason":"這一題問的是通知的目的，所以要注意文章開頭的部分。Here at the Highland Employment Center, we need your support for our Tech Training initiative，we hope to raise enough funds 的部分提到，Highland 就業服務中心需要對 Tech Training 計畫的支持，以及希望募集足夠的資金，後面則詳細說明募款活動的內容，所以 (B) 是正確答案。","vocab":"fund-raiser n. 募款活動　fulfillment n. 完成，履行　recruit v. 募集","paraphrase":""},"173":{"type":"wh-問題 What","translation":"根據通知，路跑參加者可以做什麼？","reason":"這是問根據通知，路跑參加者可以做什麼（What）的 wh- 問題。和題目的關鍵詞語 race participants do 有關的部分是 Those who run in a creative costume will be eligible to win a $100 voucher for Harlan Foods.，這部分提到穿著創意服裝跑步的人有機會贏得 Harlan Foods 的 100 元禮券，所以 (B) 是正確答案。\nrace participants 路跑參加者 → Those who run 跑步的人\ncreative costume 創意服裝 → unusual clothing 奇特的服裝","vocab":"submit v. 提交　route n. 路線　distance n. 距離","paraphrase":""},"174":{"type":"Not/True True 題型","translation":"關於這項活動，通知指出什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 the event 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章裡沒有提到。(B) 在 The entry fee is $40 throughout July, $45 from August 1–14, and $50 on the day of the race. 的部分提到，參加費在整個 7 月都是 40 元，8 月 1–14 日是 45 元，路跑當日 50 元，符合選項敘述，所以 (B) 是正確答案。","vocab":"in advance phr. 事先，預先　depending on phr. 取決於……　deliver a speech phr. 發表演說　camera crew phr. 攝影團隊","paraphrase":""},"175":{"type":"wh-問題 What","translation":"兩小時內完成路跑的人會收到什麼？","reason":"這是問兩小時內跑完的人會得到什麼（What）的 wh- 問題。和題目的關鍵詞語 those who complete the run within two hours receive 有關的部分是 Those who finish within the two-hour time limit will receive a photograph of themselves crossing the finish line.，這部分提到在兩小時的時間限制內跑完的人，將得到自己通過終點線的照片，所以 (D) 是正確答案。","vocab":"souvenir n. 紀念品","paraphrase":""},"176":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"Duval 小姐為什麼寄出這封電子郵件？","reason":"【原文證據與推理】\n第一份電子郵件中，總編輯 Rachel Duval 向 John Hassan 表示九月號雜誌雖然已有進度，但「we still have some decisions to make」。接著逐一要求確認封面人物、處理 Russo Shampoo 取消廣告後空出的第 58～59 頁、接洽 SameSide Cosmetics，以及核實設計師 David Burns 專訪中的事實。四件事都屬於雜誌出版前的編輯與廣告安排，並非只討論一篇文章。\n\n【其他選項為何不對】\n(A) 信中沒有描述服裝；(C) 只是部分文章需要核查，並不是定案文章主題；(D) 沒有要求評估照片組。","vocab":"","paraphrase":"publication details＝出版相關細節；decisions to make＝仍有待決定的事項。"},"177":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"電子郵件第一段的 drive up 最接近哪個意思？","reason":"【原文證據與推理】\n信件第一段提議讓電影即將上映的 Su-min Yoo 再次擔任封面人物，理由是「having her on the cover would likely drive up magazine sales」。上下文是利用知名演員帶動九月號銷量，因此 drive up 是讓數量、銷售額「上升、增加」的意思。\n\n【其他選項為何不對】\n(A) operate 是操作或經營；(B) motivate 著重激勵人，不是推高銷售額的最直接替換；(D) travel 是旅行，均無法替換這裡的 drive up。","vocab":"","paraphrase":"drive up magazine sales＝stimulate magazine sales＝推升雜誌銷售。"},"178":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"根據電子郵件，SameSide Cosmetics 有興趣做什麼？","reason":"【原文證據與推理】\n第一封信第二段說 Russo Shampoo 突然決定不在九月號刊登廣告，導致第 58 和 59 頁需要立即填補。總編輯提及「SameSide Cosmetics was interested in running an advertisement in our magazine」，並要求 John 確認對方是否願意利用這次機會，甚至可提供 20% 折扣。由此可知其意向是購買雜誌的廣告版面。\n\n【其他選項為何不對】\n(A) 新有機護膚霜產品系列已在開發，文中詢問的是廣告；(B) 未提到產品示範會；(C) 產品環保不等於發起反化學成分活動。","vocab":"","paraphrase":"run an advertisement＝buy advertising space＝刊登／購買廣告版面。"},"179":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"關於 Duval 小姐，可以推論出什麼？","reason":"【原文證據與推理】\n本題必須將總編輯電子郵件與九月號目錄對照。第一份信說 Rachel 想再次合作 Su-min Yoo，請 John 聯繫她的經紀人安排封面拍攝；然而第二份已編成的九月號目錄卻把第 16 頁封面專訪列為「Michelle Ford talks about her upcoming Broadway stage debut」。封面人物與原提議不同，合理推論最初想合作的藝人未能按計畫參與。\n\n【其他選項為何不對】\n(B) 雜誌有關於裁縫師的文章，但不能推論是 Rachel 親自撰寫；(C) 沒有服飾展行程；(D) 沒有訂閱價格調漲資訊。","vocab":"","paraphrase":"How about working with Su-min Yoo again?（提議）→ Cover Story Interview: Michelle Ford（最終目錄）→ 原提議人選未能使用。"},"180":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"Burns 先生的文章出現在哪一頁？","reason":"【原文證據與推理】\n第一份電子郵件最後明確要求確認「our article on the Canadian designer David Burns」的事實是否正確。再看第二份九月號目錄，第 52 頁是「Profile: Canada’s number one designer reflects on his career ahead of retirement」，唯一對應加拿大設計師的人物專訪，因此答案為第 52 頁。\n\n【其他選項為何不對】\n(A) 第 16 頁是 Michelle Ford 的封面專訪；(B) 第 35 頁介紹紐約裁縫師；(D) 第 78 頁介紹印度當代時尚。","vocab":"","paraphrase":"Canadian designer David Burns ↔ Canada’s number one designer；Profile＝人物專訪。"},"181":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"這份資訊主要介紹什麼？","reason":"【原文證據與推理】\n第一份宣傳資訊的標題是「Go Shopping and Make a Difference!」，並指出 Bristol 在 4 月 28 日舉辦 Support Your Local Business Day，鼓勵市民改到住家附近的獨立小店購物，而不是全國連鎖店。文章還說參與商家會捐出當日部分利潤給 Bristol Business Association，繼續支持在地公益，所以主題是扶助小型地方企業的一日活動。\n\n【其他選項為何不對】\n(A) 並非新開的展示中心；(B) 沒有招募志工的場次；(D) 並未介紹公司稅負優惠。","vocab":"","paraphrase":"Support Your Local Business Day＝an event in support of small businesses。"},"182":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"關於 Bristol 商業協會（BBA），文中指出什麼？","reason":"【原文證據與推理】\n第一份資訊指出 Birdy Beets、Tinker Time 和 Kara Lee’s 等參加店家，願把活動當天利潤的 10% 捐給 Bristol Business Association（BBA）。接著明說 BBA 將用這些收入「continue carrying out charitable projects in the area」。這證明 BBA 透過慈善計畫回饋當地社區。\n\n【其他選項為何不對】\n(A) BBA 是協會而非大型連鎖店；(B) 10% 指商家捐出的利潤比例，不是會員費調漲；(C) 沒提進口稅立場。","vocab":"","paraphrase":"charitable projects in the area＝contributes to the local community。"},"183":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"Perez 先生會在演說中提到什麼資訊？","reason":"【原文證據與推理】\n第二份活動時程表列出上午 9:00～9:30 的「Message for Community Members」，地點為 Anchor Square，主講人 Emmanuel Perez 是 BBA 主席。活動敘述提到他不只會講地方商店的重要性，「He will also talk about some of the BBA’s upcoming efforts」，也就是介紹該組織接下來要採取的行動與計畫。\n\n【其他選項為何不對】\n(A) 沒有指定要談建築原因；(C) 沒提某項運動的成本；(D) 沒有重新開幕日期。","vocab":"","paraphrase":"upcoming efforts＝future plans；BBA president＝organization leader。"},"184":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"4 月 28 日的活動不包括下列哪一項？","reason":"【原文證據與推理】\n這是 NOT 題，應用活動表逐項核對。上午的 Walking Tour 會走訪 Dalton Street 的歷史建築，對應 (B)；中午 Music on the Green 有地方樂團的露天演出，對應 (C)；同一活動旁的帳棚提供孩童藝術手作課程，對應 (D)。整份時程沒有名廚的料理示範。\n\n【其他選項為何不對】\n(A) famous chef cooking demonstration 是沒有安排的活動，因此為正確答案；其餘三項都能在時程表找到明確對應。","vocab":"","paraphrase":"Walking Tour＝walk through a historic neighborhood；arts and crafts workshops＝instructional sessions for children。"},"185":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"訪客最可能在哪個地點使用免費午餐優惠券？","reason":"【原文證據與推理】\n第二份時程表的「Shop for Your Lunch」規定，在三家不同的本地獨立商店消費後，持收據到旅客服務處即可獲得參與餐廳的免費午餐優惠券。第一份資訊列出的參與業者包含餐廳 Birdy Beets、手工藝店 Tinker Time、服飾店 Kara Lee’s；而 Wayfair House 是歷史建築，不是餐廳。因此可使用午餐券的地點最可能是 Birdy Beets。\n\n【其他選項為何不對】\n(B) Tinker Time 是手工藝店；(C) Kara Lee’s 是服飾店；(D) Wayfair House 是步行導覽景點。","vocab":"","paraphrase":"participating restaurant ↔ Birdy Beets；coupon for a free lunch＝免費午餐優惠券。"},"186":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"Wilkins 市長在 2 月 10 日做了什麼？","reason":"【原文證據與推理】\n第一篇新聞開頭寫「At a press conference on February 10, Mayor David Wilkins announced the planned construction of a new four-lane bridge」。市長在 2 月 10 日記者會公開將興建新的四線道橋樑、施工日期與交通影響，這些都屬於公共基礎建設計畫。\n\n【其他選項為何不對】\n(A) 不是觀光會議；(B) 沒有帶領訪客參觀辦公室；(D) 並非就交通事故道歉。","vocab":"","paraphrase":"planned construction of a new bridge＝an infrastructure project；announced at a press conference＝公開發表。"},"187":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"根據文章，為什麼部分通勤者應查詢網站？","reason":"【原文證據與推理】\n第一篇新聞先說橋樑工程會使原本交通擁堵情況暫時惡化，接著列出 Harris Road、Oak Boulevard、Center Avenue 和 Harbor Way 各自的封閉日期。文章最後明確提醒常走這些道路的通勤者，到交通部門網站查看「information about alternatives」，也就是替代行車路線。\n\n【其他選項為何不對】\n(A) 沒提共乘媒合；(C) 沒邀請對政策提供意見；(D) 沒說要評估大眾運輸。","vocab":"","paraphrase":"information about alternatives＝route information／替代路線資訊。"},"188":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"Bellwood Sporting Goods 最可能位於哪條道路上？","reason":"【原文證據與推理】\n這是新聞與商店備忘錄的跨篇題。新聞列出 Center Avenue 將於「August 5 to October 10」禁止車輛通行；第二份備忘錄的商店經理表示店門前的道路「starting from August 5」開始封閉，因此可以用相同的開始日期鎖定店址。其他道路的封閉起點分別是 5 月 14 日或 10 月 12 日，均不符合。\n\n【其他選項為何不對】\n(A) Harris Road 與 (B) Oak Boulevard 自 5 月 14 日封閉；(D) Harbor Way 自 10 月 12 日封閉。","vocab":"","paraphrase":"closure starting from August 5 ↔ Center Avenue inaccessible from August 5。"},"189":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"關於 Adams 先生的訂單，文中暗示什麼？","reason":"【原文證據與推理】\n第二份備忘錄表示 Bellwood Sporting Goods 的兩項促銷為「All footwear ... marked down by 15 percent」及「anyone who places an order online will receive free shipping」。第三份 Jeff Adams 的郵件明言自己在 8 月 9 日透過網站購買的是一件 jacket（外套）。外套不是 footwear（鞋類），所以不能套用 15% 的商品折扣；但網路購買符合免運資格。\n\n【其他選項為何不對】\n(B) 郵件討論的是尺寸選錯，而非收到不同顏色；(C) 未說停產；(D) 沒提送到工作地址。","vocab":"","paraphrase":"footwear＝鞋類；jacket＝外套；a promotional discount 指 15% 鞋類優惠而非所有商品。"},"190":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"如果某項商品無法更換，Adams 先生會怎麼做？","reason":"【原文證據與推理】\n第三份信中 Jeff Adams 說自己買外套時選成 large，實際想要 extra large。他希望在出貨前直接更換，避免收到商品後退貨；最後提出備案：「If not, I guess I will have to cancel my original order and place a new one」。因此若店家無法直接更換商品，他會取消原訂單並重新下單，等同重新開始訂購流程。\n\n【其他選項為何不對】\n(A) 不是刪除帳戶；(B) 未說去製造商網站；(C) 沒提填寫客訴表。","vocab":"","paraphrase":"cancel my original order and place a new one＝start the ordering process over again。"},"191":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"根據電子郵件，Richards 先生在網站上找不到什麼資訊？","reason":"【原文證據與推理】\nJason Richards 在第一封電子郵件說自己已透過語言學習軟體學過中文，希望在報名之前先參加程度測驗，以確認流利程度。他問「Please let me know the procedure for this as I was unable to find information about it on your Web site」，此處的 this 指前一句的程度測驗程序，而不是開課時間。\n\n【其他選項為何不對】\n(A) 他說自己已在網站查過上課時間，代表並非找不到時間表；(B) 不在詢問服務費；(C) 沒問學院地址。","vocab":"","paraphrase":"take a test to determine my fluency level → testing process。"},"192":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"關於 Zhong Academy，下列何者未被提及？","reason":"【原文證據與推理】\n這是 NOT 題，需要比對學院報名表。報名表顯示 Jason 的程度為 Beginner，因此學院有初級班；另有「Preferred Class Time: Sundays 10 A.M.–11:30 A.M.」，證明週日有課。表單還說可到櫃檯申請更改時間，介紹新學員成功入學可獲下次課程 15% 折扣。所以只有「只在平日開課」與資料相反。\n\n【其他選項為何不對】\n(A) 改時段可提出申請；(B) Beginner 就是初級程度；(D) 推薦新學員有 15% 折扣，三項都有資料支持。","vocab":"","paraphrase":"Sundays＝星期日 → 並非 only weekday classes。"},"193":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"Richards 先生的朋友最可能看了哪部電影？","reason":"【原文證據與推理】\n第一封信日期為 11 月 20 日，Jason 說朋友參加了 11 月 12 日的院內免費電影放映；第三份 12 月 1 日電子報回顧「last month after our showing of River Goddess」，表示上個月放映的影片是 River Goddess。由於「上個月」相對於 12 月 1 日就是 11 月，可和朋友 11 月 12 日的觀影日期對上。\n\n【其他選項為何不對】\n(A) Summer Shore 是導演 Xu Yue 之前的作品；(B) Washing Away 是即將上映的影展新片；(C) Grave Mistakes 將於 12 月 28 日放映。","vocab":"","paraphrase":"last month（以 Dec. 1 為基準）＝November；showing of River Goddess＝十一月場次。"},"194":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"關於 Xu 女士，下列何者正確？","reason":"【原文證據與推理】\n12 月電子報說 Bright Lights Film Festival 將放映 Xu Yue 執導的新片 Washing Away，並稱她是「the director of the critically acclaimed film Summer Shore」。critically acclaimed 的意思是受到影評人高度肯定或好評，由此可知她過去的作品得到評論界的正面評價。\n\n【其他選項為何不對】\n(A) Summer Shore 不是她的第一部電影的明確證據；(B) Cloudbank Hotel 是影展場地，沒說她住過；(C) 沒提任何上海企業投資她的計畫。","vocab":"","paraphrase":"critically acclaimed＝received positive reviews from critics。"},"195":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"關於 Richards 先生，可以推論出什麼？","reason":"【原文證據與推理】\n這是三份文件對照推論。Jason 的第一封郵件表達想參加下個月的院內免費電影；第二份報名表卻記錄測驗等級是「Beginner」；第三份電子報明確規定學院免費放映「strictly for students enrolled in intermediate or advanced classes」。因 Jason 目前屬初級班，不符合中級或高級班限定資格，故無法參加十二月的免費放映。\n\n【其他選項為何不對】\n(A) 沒提他曾任語言學校員工；(B) 沒有證據他買了影展票；(D) 沒有出差中國的資訊。","vocab":"","paraphrase":"Beginner ≠ intermediate or advanced；strictly for＝僅限。"},"196":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"關於《The Good Old Days》，下列何者未被提及？","reason":"【原文證據與推理】\n第一份公告說《The Good Old Days》是得獎紀錄片系列，由 Janet Leslie 固定主持，以錄影訪談和實地拍攝介紹貝里斯的歷史城鎮。這些可分別支持 (A) 錄製訪問、(B) 老城鎮主題、(C) 固定主持人。全文沒有說旅遊業者贊助節目。\n\n【其他選項為何不對】\n(A) video interviews；(B) historic towns；(C) hosted by Janet Leslie 都有來源，只有 (D) travel agency sponsorship 沒有提到。","vocab":"","paraphrase":"NOT mentioned＝找出未獲原文支持的選項。"},"197":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"關於 Pepita de Oro，哪個敘述最可能正確？","reason":"【原文證據與推理】\n公告指出《The Good Old Days》第一季共有 10 集，第二季才從 10 集增加為 12 集；Elaine Kershaw 在第二份郵件表示自己喜歡「last season’s finale on Pepita de Oro」。finale 是最後一集，因此上一季的完結篇是第 10 集，內容是 Pepita de Oro。\n\n【其他選項為何不對】\n(A) 沒說該鎮有大廣場；(B) 沒提週年慶；(C) 沒有外國觀光客歡迎度的資料。","vocab":"","paraphrase":"last season’s finale＝上一季最後一集；season 1 有 10 episodes → episode 10。"},"198":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"Kershaw 女士的祖父向誰購買了一些畫作？","reason":"【原文證據與推理】\n第二份 Elaine Kershaw 的郵件明確描述祖父擔任 Emerald Falls 市長時收集的照片和畫作，並寫「My grandfather purchased the paintings from a local artist」。句子主詞是祖父、受詞是那些畫作、from 後面的對象就是賣畫的人，因此是當地藝術家。\n\n【其他選項為何不對】\n(A) Hector Almonte 是紀錄片導演；(B) Janet Leslie 是主持人；(C) Chloe Benbow 是導演助理；都不是出售畫作的人。","vocab":"","paraphrase":"purchased ... from＝向……購買；a local artist＝當地藝術家。"},"199":{"type":"閱讀理解｜逐篇證據與選項排除","translation":"關於 Almonte 先生，文章暗示什麼？","reason":"【原文證據與推理】\nElaine 在電子郵件說高價畫作 document.addEventListener('keydown', function(event) {

  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      target?.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(target?.tagName)) return;
  if (window.getSelection()?.toString()) return;
  // 鍵盤：←／Z 上一題，→／X 下一題；輸入欄位和文字選取時不啟用。
  const key = event.key.toLowerCase();

  } else if ((key === 'arrowleft' || key === 'z') && !$('#prev').disabled) {
    event.preventDefault(); $('#prev').click();

});

let swipeStart = null;
const swipeArea = '#quiz .stem, #quiz .answers, #quiz .feedback, #quiz .undo-answer-row';
const quizTouch = document.getElementById('quiz');
quizTouch.addEventListener('touchstart', event => {
  swipeStart = null;
  if (event.touches.length !== 1 || !event.target.closest(swipeArea)) return;
  if (event.target.closest('a, input, textarea, select')) return;
  const touch = event.touches[0];
  swipeStart = {x:touch.clientX, y:touch.clientY, time:Date.now()};
}, {passive:true});
quizTouch.addEventListener('touchend', event => {
  if (!swipeStart || event.changedTouches.length !== 1) {swipeStart=null;return;}
  const start = swipeStart; swipeStart=null;
  const touch=event.changedTouches[0];
  const dx=touch.clientX-start.x, dy=touch.clientY-start.y;
  // 至少水平移動 65px，且水平位移須明顯大於垂直位移。
  if (Math.abs(dx)<65 || Math.abs(dx)<Math.abs(dy)*1.6 || Date.now()-start.time>1500) return;
  if (window.getSelection()?.toString()) return;
  if (dx<0 && !$('#next').disabled) $('#next').click();

}, {passive:true});

$('#importCsv').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCsv(await file.text());if(!rows.length||rows[0].slice(0,6).join('|')!==CSV_HEADER.join('|'))throw Error('欄位格式不符，請使用本網站匯出的 CSV');const incoming={};for(let i=1;i<rows.length;i++){const r=rows[i],id=Number(r[0]),q=QS.find(x=>x.id===id),choice=(r[2]||'').trim();if(r.length<6||!q||!/[A-D]/.test(choice)||choice.length!==1||String(q.part)!==r[1].trim())throw Error('第 '+(i+1)+' 列的題號、Part 或選項有誤');if(r[3].trim()!==q.answer)throw Error('第 '+(i+1)+' 列答案版本不同，已停止匯入');incoming[id]={choice,correct:q.answer?choice===q.answer:null,at:r[5]||''}}const count=Object.keys(incoming).length;if(!confirm('CSV 有 '+count+' 筆有效作答紀錄。匯入後會覆蓋相同題號的現有作答，其餘題目保留。是否繼續？'))return;await window.toeicCloud.importAnswers(incoming);mode='all';index=0;setTabs();render();alert('已成功匯入 '+count+' 筆紀錄。')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};render();

<script>
/* Browser-offline fallback: Firebase is optional, local practice always works. */
(function(){
  if(window.toeicCloud) return;
  function persist(){
    localStorage.setItem(LOCAL_KEY,JSON.stringify(records));
    localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));
    localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts));
  }
  window.toeicCloud={ready:true,mode:'local',
    saveAnswer:async(id,data)=>{records[id]=data;persist();render()},
    deleteAnswer:async(id)=>{delete records[id];persist();render()},
    setStar:async(id,marked)=>{if(marked)stars[id]=true;else delete stars[id];persist();render()},
    saveExcerpts:async(id,items)=>{if(items.length)excerpts[id]=items;else delete excerpts[id];persist();render()},
    importAnswers:async(items)=>{records={...records,...items};persist();render()},
    resetAnswers:async()=>{records={};persist();render()}
  };
})();
</script>
<script id="reading-gate-script">(function(){const gate=document.getElementById('readingAccessGate'),input=document.getElementById('rgCode'),button=document.getElementById('rgEnter'),status=document.getElementById('rgStatus'),notice=document.getElementById('cloudNotice'),account=document.getElementById('accountCode');function lock(){document.body.classList.add('read-locked');gate.hidden=false;button.disabled=false}function unlock(){document.body.classList.remove('read-locked');gate.hidden=true;button.disabled=false}window.readingGate={lock,unlock};button.addEventListener('click',()=>{const code=input.value.trim();if(!code||code.length>32){status.textContent='請輸入使用者代號。';return}account.value=code;button.disabled=true;status.textContent='正在驗證代號並載入 Firebase 雲端資料…';document.getElementById('connectCode').click()});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();button.click()}});const observer=new MutationObserver(()=>{if(!gate.hidden){status.textContent=notice.textContent||'正在驗證…';if(!/正在載入|連線中|請不要作答/.test(notice.textContent))button.disabled=false}});observer.observe(notice,{childList:true,characterData:true,subtree:true});lock()})();</script><script type="module">

cloud.importAnswers=async(items)=>{if(!activeCode){records={...records,...items};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const entries=Object.entries(items);for(let i=0;i<entries.length;i+=400){const batch=writeBatch(db);for(const [id,data] of entries.slice(i,i+400))batch.set(doc(root('answers'),id),data);await batch.commit()}};
