 class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">TO</span><span class=\"mail-value\">Andrea Smith andreasmith@sunshineheights.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">FROM</span><span class=\"mail-value\">Ken Lin kenlin@ludlownautical.org</span></div><div class=\"mail-row\"><span class=\"mail-key\">DATE</span><span class=\"mail-value\">May 15</span></div><div class=\"mail-row\"><span class=\"mail-key\">SUBJECT</span><span class=\"mail-value\">Museum closure</span></div><div class=\"mail-row\"><span class=\"mail-key\">ATTACHMENT</span><span class=\"mail-value\">Ludlow notice</span></div></div><p>Dear Ms. Smith,</p><p>My records indicate that you scheduled a visit to Ludlow Nautical Museum next Tuesday for a group of senior citizens from Sunshine Heights. Regrettably, the museum had to close for renovations. I am attaching a notice about the current situation.</p><p>We hope that you are able to arrange an outing to a different site on Tuesday. My personal recommendation is Crescent Bay Aquarium.</p><p>If you would like to reschedule your visit after we reopen, please contact us at that time.</p><p>Yours truly,</p><p>Ken Lin<br/>Director, Ludlow Nautical Museum</p></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>MEMO 備忘錄</span><small>181-185 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">COMPANY MEMO</h2><p>TO: All team leaders<br/>FROM: Helen Malone, CEO, Daisy Corp.<br/>DATE: April 21<br/>SUBJECT: Upcoming Employee Evaluations</p><p>Although many of you are already familiar with this process, I'd like to remind you of a few details concerning our annual evaluations for staff members, which will begin on June 1. Next Monday, human resources staff will be e-mailing you information about each member of your team including their start dates at the company and their past evaluation results. Take some time to review this information before the end of May.</p><p>If an employee receives a positive performance evaluation and has not gotten a raise or bonus within the past three months, that staff member is eligible for a 5.5 percent salary increase. For questions or concerns, get in touch with Gail Cullen in the human resources department.</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 電子郵件</span><small>181-185 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">TO</span><span class=\"mail-value\">Gail Cullen gail.cullen@daisycorp.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">FROM</span><span class=\"mail-value\">Cody Long cody.long@daisycorp.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">DATE</span><span class=\"mail-value\">April 24</span></div><div class=\"mail-row\"><span class=\"mail-key\">SUBJECT</span><span class=\"mail-value\">Need Assistance</span></div></div><p>Dear Ms. Cullen,</p><p>I have a question regarding Shayla Barrie, one of the employees I'll be evaluating this coming June. Ms. Barrie does an excellent job as a software engineer on my team and has held that position for two years. Last month, she was awarded a bonus for successfully completing her part of a demanding 10-week project.</p><p>I figure she deserves a raise for being such a valuable member of my team. I'm wondering if I could request an exception for Ms. Barrie in this case. Just let me know what steps I should take. Also, if possible, I'd like to give her a larger pay increase than the standard rate. Please tell me if that's acceptable as well.</p><p>I appreciate your assistance.</p><p>Kind regards,</p><p>Cody Long<br/>Software Engineering Team Leader</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>LETTER 信件</span><small>186-190 · 1</small></div><div class=\"document-body source-passages\"><p>August 28</p><p>Mount Llanberis Park Office<br/>122 High Street<br/>Llanberis, Gwynedd LL55 4HB</p><p>To Whom It May Concern,</p><p>Ever since I was a teenager, I've visited Mount Llanberis Park to participate in some of my favorite activities. While at the park in recent months, I've witnessed some changes that concern me. There used to be a moderate number of people, but the park has begun attracting large crowds during the summer months. With the growing popularity of the area, a number of rules should be introduced.</p><p>For instance, I've seen a lot of people leaving the marked trails lately. I recommend that you create a regulation that prohibits people from doing so. Also, at the rock climbing area, I've noticed inexperienced climbers attempting the challenging routes. In order to prevent accidents, learners should be carefully monitored. I also believe that visitors should be required to fill out permission forms in order to engage in adventurous activities.</p><p>Thank you for your time.</p><p>Regards,<br/>Glenda Ree</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / TABLE 表單</span><small>186-190 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Mount Llanberis Park—Adventure Sports Registration Form</h2><p>Please submit this form to Mount Llanberis Park Ranger Station. You will be allowed to proceed only if your application has been approved by the ranger on duty. First-time visitors will not be allowed to proceed unless accompanied by a certified guide. Please inquire with us if you need to rent any gear.</p><p>Name: Branwen Pearse<br/>Group size: 4<br/>Date and time of visit: October 19 / 9:30 A.M.<br/>Expected duration of visit: 6 hours<br/>Is this your first visit? X Yes No</p><p>Planned activity and location:</p><div class=\"document-table-wrap\"><table class=\"document-table\"><tr><td>Rock climbing</td><td>Hiking</td><td>Mountain biking</td></tr><tr><td>Giant's Wall</td><td>Lloyd Peak X</td><td>Harlech Slope</td></tr><tr><td>Zipper Descent</td><td></td><td></td></tr><tr><td>Rules to keep in mind:</td></tr><tr><td>(1) Do not litter.</td></tr><tr><td>(2) The park is open from 6 A.M. to 6 P.M. Visitors must return to the park office by closing time.</td></tr><tr><td>(3) Always stay on marked trails.</td></tr><tr><td>(4) Do not feed the wildlife.</td></tr></table></div><p>** Violators will be subject to a $30 fine.<br/>** For assistance or to report violations of park regulations, call 555-2129.</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / TABLE 表單</span><small>186-190 · 3</small></div><div class=\"document-body source-passages\"><p>Mount Llanberis Park Ranger Station<br/>Visitors Taking Part in Adventure Sports on October 19</p><div class=\"document-table-wrap\"><table class=\"document-table\"><tr><td>Reservation time</td><td>Location visited</td><td>Name</td><td>Notes</td><td>Time of return</td></tr><tr><td>7:45 A.M.–3:45 P.M.</td><td>Giant's Wall</td><td>Bryn Hughes</td><td>Group of three people</td><td>3:40 P.M.</td></tr><tr><td>8:00 A.M.–10:15 A.M.</td><td>Zipper Descent</td><td>Gweneth Edwards</td><td>Mountain bike rented</td><td>11:00 A.M.</td></tr><tr><td>9:30 A.M.–3:30 P.M.</td><td>Lloyd Peak</td><td>Branwen Pearse</td><td>Accompanied by guide; Group of four people</td><td>2:45 P.M.</td></tr><tr><td>11:15 A.M.–4:00 P.M.</td><td>Giant's Wall</td><td>Dennis Roberts</td><td>Group of three people</td><td>3:55 P.M.</td></tr><tr><td>12:30 P.M.–5:00 P.M.</td><td>Harlech Slope</td><td>Owen Price</td><td>Hiking poles rented</td><td>6:10 P.M.</td></tr><tr><td>* Note for staff: Do not forget to record the times when visitors return.</td></tr></table></div></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-catalog\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT 廣告</span><small>191-195 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Viu Athleisure Shop</h2><p>Athleisure wear is popular for its versatility. We carry 10 brands and are currently offering special promotions until July 31. All discounts apply both online and in our store.</p><div class=\"catalog-grid\"><div class=\"catalog-item\"><h3>Bemba Team</h3><p>Bemba Team sells synthetic clothes made with advanced fibers. The material is extremely moisture-absorbent and dries quickly. Enjoy a 20 percent discount on selected products.</p><span class=\"offer-badge\">20% OFF</span></div><div class=\"catalog-item\"><h3>Ventra</h3><p>Ventra specializes in athletic shoes for a variety of sports. Ventra is new in our store and is offering an introductory discount of 30 percent.</p><span class=\"offer-badge\">30% OFF</span></div><div class=\"catalog-item\"><h3>Upstar Athletics</h3><p>Upstar Athletics manufactures its clothing using polyester made from recycled plastic water bottles. It is offering a general discount of 10 percent.</p><span class=\"offer-badge\">10% OFF</span></div><div class=\"catalog-item\"><h3>Yogana</h3><p>Yogana manufactures yoga apparel in many patterns and colors. Yoga shorts are currently on sale for 40 percent.</p><span class=\"offer-badge\">40% OFF</span></div></div><p>Enjoy free shipping on all orders over $80. Custom printing on apparel items is available for an added charge. Visit our store at 449 South State Street in Minneapolis or go to our Web site at www.viuathleisure.com.</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / TABLE 表單</span><small>191-195 · 2</small></div><div class=\"document-body source-passages\"><p>www.viuathleisure.com/contactus</p><p>Contact Form</p><p>Please reach out to us if you have any questions regarding our products and services. We promise to respond to your inquiry within 48 hours.</p><p>Name: Maria Cortez<br/>E-mail: maria@evanstonbball.com<br/>Date submitted: July 13</p><p>Comment:</p><p>I am interested in buying 35 sets of matching shirts and shorts for an amateur basketball team that I coach. As the team is composed of individuals from middle school and high school, I will need a range of sizes. Also, I was wondering if we could get a bulk discount in addition to the sales your store is running.</p></div></section><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE 文章</span><small>191-195 · 3</small></div><div class=\"document-body source-passages\"><p>http://www.upstar.com<br/>Review posted on August 4<br/>Author: Maria Cortez</p><p>Upstar Athletics is a great company, and their clothes are fantastic. The fabric stretches well and is perfect for sports. Unfortunately, I reached out to a store that carries Upstar Athletics among other brands, and they did not respond to my inquiry. So, I decided to contact Upstar Athletics directly. They sent 35 shirts and shorts in individual sizes with a generous quantity discount and printed our team's name on the clothes for free.</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-webpage\"><div class=\"doc-ribbon\"><span>ARTICLE 文章</span><small>196-200 · 1</small></div><div class=\"document-body source-passages\"><p>https://www.visionbath.com/serviceinquiry</p><p>Vision Bath</p><p>Vision Bath is an independent bathroom contractor that aims to provide customers with the best overall home renovation experience. Whether you wish to add a new bathroom to your home or remodel an existing one, we guarantee that our work is high quality. If you want to have the bathroom of your dreams, you'll first need to complete a brief questionnaire to let us know what you're looking for. Within 24 hours, one of our skilled designers will contact you by phone to discuss your preferences further. You'll receive a product catalog and will be able to schedule a face-to-face meeting when you're ready. During this consultation, your designer will present you with a contract, and work will commence shortly thereafter. Click here to begin the process.</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM / TABLE 表單</span><small>196-200 · 2</small></div><div class=\"document-body source-passages\"><p>https://www.visionbath.com/questionnaire</p><p>Vision Bath Questionnaire</p><p>Name: Margaret Collins<br/>Phone: 555-9911<br/>E-mail Address: margcollins@wyohi.com</p><p>Why do you want a new or remodeled bathroom?<br/>My family is too large to continue sharing a single bathroom, so we need another one built.</p><p>Which term best describes the style of bathroom you want?<br/>☑ Contemporary　☐ Traditional　☐ Luxurious</p><p>What colors do you want to be used? Blue and White</p><p>What type of floor material are you interested in?<br/>☐ Tile　☑ Hardwood　☐ Vinyl　☐ Other</p><p>What type of countertop would you like?<br/>☐ Granite　☑ Porcelain　☐ Glass　☐ Other</p><p>When would you like this project to begin? Early May</p><p>What is your budget? Between $10,000 and $15,000</p><p>SEND</p></div></section><section class=\"document-card type-review\"><div class=\"doc-ribbon\"><span>ARTICLE 文章</span><small>196-200 · 3</small></div><div class=\"document-body source-passages\"><p>https://www.businessreviews.com/visionbath</p><p>★★★★★ Margaret Collins May 25</p><p>I'm extremely impressed with Vision Bath. After submitting my questionnaire, I was contacted by a helpful designer named Sandra Reynolds. She had excellent ideas for everything from sink faucets to cabinet handles and was very patient with me. I spent quite a while studying Vision Bath's catalog and when she visited my home, we went over my selections together. I'm especially glad that she helped me choose the granite countertop. Although it cost more than my original choice, it looks better than I could've imagined.</p><p>Vision Bath</p></div></section></div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>通知</span><small>131-134</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">旅行者請注意</h2><p>自 10 月 5 日起，Barings 機場將開始建設新航廈來容納國際航班。132 新航廈的加入總計將增加我們的容量達百分之 40。新航廈稱為第 5 航廈，將位於和目前營運中的 4 座航廈不同的建築物。所以，它只能透過輕軌或接駁巴士前往。133 這兩種選項在其他四座航廈都將可以利用。134 機場部分區域可能也將暫時關閉，包括第 4 航廈某些部分。不過，所有航廈明年都將完全開放。</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-announcement type-translation\"><div class=\"doc-ribbon\"><span>公告</span><small>135-138</small></div><div class=\"document-body source-passages\"><p>杜魯斯大戲院很榮幸宣布，將於10月22日星期四晚上7點首映 Elwood Barker 的紀錄片《Gideon's Revenge》。活動總長3小時，影片放映115分鐘，接著 Barker 先生將利用剩餘時間回答觀眾提問。這應能讓影迷更加了解他的創作過程。</p><p>《Gideon's Revenge》取材自 Barker 先生四年來廣泛遊歷敘利亞、黎巴嫩與伊拉克的經歷。如果您想觀看這部關於中東生活的第一手紀錄，請儘快行動。門票數量有限。</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>信件</span><small>139-142</small></div><div class=\"document-body source-passages\"><p>3月17日<br/>Clara Rodriguez<br/>644 Lockley Street<br/>Galt City, Ontario N1R 3Y8</p><p>親愛的 Rodriguez 小姐：</p><p>我們寫信是關於您未支付上期網路服務費的情況。我們曾多次試著打電話聯絡您，卻都沒有成功。請注意，您在 Loft Net 尚欠的63.97元已於3月15日到期。根據我們的政策，付款期限過後一週內仍可繳款而不收取額外費用。超過該期限後，我們就必須收取利息。由於我們十分珍惜您的惠顧，希望您儘快處理此事。若要結清帳單，請撥打555-7843，並準備好您的信用卡。</p><p>此致<br/>Albert Sanders<br/>Loft Net 客服部</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>備忘錄</span><small>143-146</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Mila Larson，行銷傳播部主管</span></div><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">全體員工</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">Liang 公司宣傳活動</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">7月25日</span></div></div><h2 class=\"doc-heading\">各位同仁：</h2><p>感謝大家共同為 Liang 公司的促銷宣傳活動提出企劃案。Liang 公司的主管對我們的設計印象非常深刻，已決定雇用我們。至於電視廣告，我們將需要所有人參與。接下來幾週會有許多工作，因此各位的合作至關重要。我已安排大家於7月27日與 Liang 公司執行長會面，以便制定詳細時程。我們也將討論雜誌跨頁廣告的規劃。</p><p>如果您有任何意見或額外想法，請準備好在會議中提出。</p><p>謝謝！<br/>Mila Larson</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>對話</span><small>147-148</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>寄件者：555-8164</strong><time class=\"chat-time\">上午10:59</time></div><div class=\"message-text\">嗨，Jackson。我收到你電子報的最新草稿了。以下是我的想法。首先，謝謝你嘗試了我的建議。新的設計看起來很現代，應該會吸引我們的目標讀者。不過，現在看起來跟我們的網站太不一樣了。我認為品牌一致性很重要。我會建議使用和網站一樣的顏色。也可以請你換掉最後一張照片嗎？我們不能用那個，因為太舊了。我今天下午會用電子郵件寄另一張給你。你做好的時候，再寄給我下一張草稿。再次感謝！</div></div></div></div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>文章</span><small>149-150</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Sandi Vincent 將負責開球</h2><p>3 月 21 日— 鄉村音樂明星 Sandi Vincent 下個月將拜訪 Warwick，幫我們的棒球隊 Harpoons 開始新的球季。市長 Belinda Cutter 邀請 Vincent 小姐在 4 月 7 日的開幕賽開球（投第一顆球）。</p><p>Vincent 小姐靠著第三張專輯《Prairies and Plains》的成功，獲得了全國性的知名度。而在最近，她在電影《Uncle Trevor's Farm》獻出了演員身分的處女秀。</p><p>由於忙碌的巡迴演出行程，Vincent 小姐無法發表意見，但她的經紀人表示：「Sandi 很期待首次拜訪 Warwick。她是熱情的棒球迷，我相信她會玩得很開心。希望她投出幸運的一球，讓 Harpoons 有一個成功的球季。」</p></div></section></div>","151-153":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 151-153</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>通知</span><small>151-153</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Rumfax 共享園地即將開放</h2><p>Rumfax 共享園地（RSG）今年的種植季是 3 月 31 日至 9 月 15 日，所以現在就是您登記申請個人園地區塊的時候。再度申請的去年度園丁將支付 40 元會員費用，而新園丁將被收取 55 元。*歡迎任何居住於 Rumfax 的人士在 www.rumfaxgarden.com 申請。不過，請務必注意以下規定。</p><p>每位園丁有責任維護自己的地塊。這包括所有必要的澆水、除草與收成。除非經過 RSG 協調者特別同意，否則地塊不能擴張。增設於地塊的任何構造物在設置前也必須得到我們人員的同意。RSG 會員只能在自己的地塊種植，且必須確保種植的東西不會遮蔽鄰人植物（的陽光）。儲物小屋有工具供所有人使用，但事後必須歸還。</p><p>*會員費用於支付水、土壤與肥料的費用。</p></div></section></div>","154-155":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 154-155</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>對話</span><small>154-155</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Juliet Pau</strong> <time>[下午3:45]</time></div><div class=\"message-text\">你看過我們公司吉祥物的提案了嗎？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Chris Cormier</strong> <time>[下午3:48]</time></div><div class=\"message-text\">我午餐過後就看了。我想，Barrow 小姐把我們的想法詮釋得很好。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Juliet Pau</strong> <time>[下午3:49]</time></div><div class=\"message-text\">我也這麼認為。在三張草圖中，我真的很喜歡她在 A 案中畫角色服裝和身體的方式。但我對臉不太確定。你認為呢？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Chris Cormier</strong> <time>[下午3:50]</time></div><div class=\"message-text\">我算是同意。眼睛應該再大許多。C 案的臉比較接近我們想要的。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Juliet Pau</strong> <time>[下午3:51]</time></div><div class=\"message-text\">我知道了。我們 5 點開會，跟團隊其他人討論這些圖吧。Barrow 小姐明天會來聽取我們對於她作品的回饋意見。我們必須決定要求她改變什麼。</div></div></div></div></section></div>","156-158":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 156-158</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>文章</span><small>156-158</small></div><div class=\"document-body source-passages\"><p>沙蘭港（4 月 19 日）— Touchstone Ventures 公司昨天宣布收購了坦尚尼亞鐵路公司（TTL）。這是 Touchstone 公司於 2 月中收購 Umoja Transport 公司後又一次的收購交易。</p><p>公司領導人 Mieke de Graaf 表示：「我們對 TTL 的收購，將幫助我們進軍其他東非國家。在這個時間點，Touchstone 公司必須大膽拓展到迅速發展中的地區。— [1] —。」</p><p>TTL 先前為國營鐵路公司，難以維持獲利，而其部分鐵路急需修繕。Arusha 商業大學教授 Patrick Maguli 博士表示：「Touchstone 公司將必須大量投資於升級 TTL 的基礎設施。」</p><p>Maguli 博士補充：「根據我的研究，有越來越多坦尚尼亞人選擇開車或搭巴士，而不是搭火車。— [2] —。Touchstone 公司的挑戰在於扭轉這個趨勢。」</p><p>Touchstone 公司的計畫有四個部分。它的第一優先是修理並升級已建設的鐵路。然後，它計畫從柴油動力列車轉換為電車。第三階段則是建設新的路線，藉由與鄰國逐漸成長的往來貨物量獲利。— [3] —。最後，Touchstone Ventures 公司的目標是為了觀光目的發展 TTL 的鐵路網。例如，它可能開始提供蒸氣動力古董列車的觀景旅行。— [4] —。</p></div></section></div>","159-160":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 159-160</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-translation\"><div class=\"doc-ribbon\"><span>廣告</span><small>159-160</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Goliath 倉儲：您超量持有物品的安全便利空間！</h2><p>您的家裡或者公司已經滿到讓人不舒服了？那麼，與其搬家，請了解一下 Goliath 倉儲，位於 East Island 路 452 號，就在多倫多外圍。我們有超過 800 個倉儲單元，並且提供月租或年租的優惠價。長期租約可協商。您可以放心自己的物品會很安全——我們有最先進的（監視）攝影系統與 24 小時值勤的保全人員。對於本地企業，我們也有 10 個冷藏倉儲單位可租用，非常適合保存需要冷藏的商品。僅限 12 月當月，透過我們公司為儲藏物品購買保險者，將獲得 20% 的保險折扣！欲詢問可租用單位、價格與規定，請上 www.goliathstorage.on.ca。</p></div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 161-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>161-164</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">&lt;會員列表&gt;</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">info@windsorbiz.org</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">通知</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">12 月 2 日</span></div></div><p>親愛的會員們：</p><p>我們感謝各位持續作為本地業者會員參與 Windsor 商會。請參加我們接下來的免費研討會。— [1] —。在上個月的節約用電主題之後，本月的主題是減少水的浪費。研討會將於 12 月 13 日上午 10 點至中午 12 點於 Windsor 商務中心 B 室舉行。— [2] —。</p><p>生態學家暨節水專家 Calvin Randall 將會說明，本地業者能怎樣採取措施來減少成本並幫助保護環境。他將提供可遵循的簡單訣竅與技術。他也將在研討會後提供免費一對一諮詢。</p><p>Randall 先生是備受敬重的科學家，並且曾經在這幾年出演許多電視與廣播節目。— [3] —。這將是學習能如何同時減少水費並保護地球的好機會。另外也建議本地事業主攜帶最近的公用事業帳單明細，了解能節省的各種不同領域。</p><p>要報名參加這個月的研討會，請回覆這封電子郵件。— [4] —。謝謝。</p><p>Windsor 商會</p></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單／表格</span><small>165-167</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Arturo 不動產—顧客滿意度調查</h2><p>感謝您利用 Arturo 不動產。我們想要知道我們的服務滿足您需求的效果如何，所以請花一點時間填好這份問卷。</p><p>我當時在求購不動產<br/>我當時在求售不動產 X</p><p>為什麼選擇和我們合作？</p><p>我聯絡了幾家不動產仲介公司，但你們的公司最快回覆。另外，Hamlin 先生能夠很詳細地回答我一開始的問題。</p><p>您對我們服務的什麼方面最滿意？</p><p>在我接受買家的出價之後，Hamlin 先生在交易的每個步驟都持續告訴我消息。他定期打電話給我，讓我知道正在進行什麼事。</p><p>您對我們服務的什麼方面最失望？</p><p>我會希望潛在買家來看我家的時候，我能更早收到通知。至少 1 小時前收到通知會比較方便。</p><p>您會向家人或朋友推薦我們的服務嗎？</p><p>會 X 不會</p><p>您的姓名：Rosemary Woodard</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>對話</span><small>168-171</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Maria Sanchez</strong> <time>[中午12:06]</time></div><div class=\"message-text\">過去幾季銷售情況令人失望，線上和我們的店面都是。有什麼我們能扭轉局勢的主意？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>William Behar</strong> <time>[中午12:09]</time></div><div class=\"message-text\">我們和名人合作家具與家飾系列怎麼樣？我們需要有名又很有時尚品味的人。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Robert Gillibrand</strong> <time>[中午12:12]</time></div><div class=\"message-text\">Fiona Connolly 或許可以。她是有名的室內設計師。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>William Behar</strong> <time>[中午12:13]</time></div><div class=\"message-text\">那會很適合的。她的電視實境節目現在很受歡迎，我想她以前沒跟別的零售店合作過。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Maria Sanchez</strong> <time>[中午12:14]</time></div><div class=\"message-text\">還有，她在社交媒體有很多追蹤者。有任何想法，Gabrielle？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Gabrielle Shepard</strong> <time>[中午12:15]</time></div><div class=\"message-text\">我喜歡這個主意。我可以和她合作設計新的家具，但給她選擇布料的自由。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>William Behar</strong> <time>[中午12:17]</time></div><div class=\"message-text\">沒錯。或者舉例來說，你們可以合作設計一張新的床，她可以設計床單與枕套之類的相關物品。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Robert Gillibrand</strong> <time>[中午12:18]</time></div><div class=\"message-text\">OK。我會聯絡她的代表人。如果順利的話，可能會發展成持久的夥伴關係。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Maria Sanchez</strong> <time>[中午12:19]</time></div><div class=\"message-text\">我們也應該想想其他人選，以防萬一她拒絕我們。</div></div></div></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>信件</span><small>172-175</small></div><div class=\"document-body source-passages\"><p>Corrigan Technology 公司總部<br/>Shirlington 大道 703 號<br/>阿靈頓，維吉尼亞州 22206</p><p>10 月 20 日</p><p>敬啟者：</p><p>為了感謝您定期訂購我們的商品，我們想邀請您參加即將上市的產品系列非公開預覽活動。這些產品將在明年初發售，而且還沒有對大眾公開。</p><p>活動將於 11 月 9 日下午 5 點至 9 點，在這封信頂部提供的地址舉行。Corrigan Technology 公司執行長 Bill Schriver 將發表開場致詞，然後設計團隊主任 Pete Wellington 將簡報介紹我們新系列的家電。顧客不能拍照或錄影拍攝活動。傍晚 6:30 將供應晚餐，然後來賓將看到新產品的實際操作示範。</p><p>如果您打算出席，請在 10 月 27 日前撥打電話 555-4498 聯絡 Louise Geisler。如果她在那天之前沒有接到您的回覆，我們就視為您不會出席，並且將您的門票號碼從來賓名單中刪除。</p><p>門票號碼將被包括在特別抽獎活動中。獲獎號碼將在當晚結束時宣布，所以請務必攜帶這封信。</p><p>中獎者將得到優惠券，持有優惠券者在我們的新產品系列發售時可以獲得折扣。優惠券可以在全國各地的店頭使用。</p><p>希望您加入我們。</p><p>Matthew Schenk<br/>公共關係部長</p></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>通知</span><small>176-180 · 1</small></div><div class=\"document-body source-passages\"><p class=\"notice-subject\">Ludlow 航海博物館的特別通知<br/>5 月 14 日</p><p>我們很遺憾地宣布，Ludlow 航海博物館目前暫停對外開放。這是因為我們牆壁的隔熱材料需要替換。為了在整修期間保護我們的收藏品，我們已經將其中許多搬到 3 樓儲藏室。</p><p>下週，博物館館長 Ken Lin 將和董事會開會，決定重新開放的日期，希望會是夏季末的時候。如果您想收到關於我們工程進度的最新消息，請在 www.ludlownautical.org/emailsubscription 訂閱我們的電子報。</p><p>為了對於造成不便表示歉意，將寄給會員 Crescent Bay 水族館的折價券，它也是由 Ludlow 觀光組織所營運的。同時，將會郵寄我們紀念品店的免費鑰匙圈給被取消事先預約的每位來賓。</p><p>謝謝您的諒解。</p></div></section><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>176-180 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Andrea Smith andreasmith@sunshineheights.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Ken Lin kenlin@ludlownautical.org</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">5 月 15 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">博物館關閉</span></div><div class=\"mail-row\"><span class=\"mail-key\">附件</span><span class=\"mail-value\">Ludlow 通知</span></div></div><p>親愛的 Smith 小姐：</p><p>我的紀錄顯示，您安排了來自 Sunshine Heights 的年長者團體在下週二參觀 Ludlow 航海博物館。遺憾的是，博物館必須關閉進行整修。我附上了關於目前狀況的通知。</p><p>我們希望您星期二能將出遊安排在不同的地點。我個人推薦 Crescent Bay 水族館。</p><p>如果您想在我們重新開放後再次安排參觀，到時候請聯絡我們。</p><p>Ken Lin<br/>Ludlow 航海博物館館長</p></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>備忘錄</span><small>181-185 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">公司備忘錄</h2><p>收件者：所有團隊領導人<br/>寄件者：Helen Malone，執行長，Daisy 公司<br/>日期：4 月 21 日<br/>主旨：即將到來的員工評價</p><p>雖然你們有很多人已經熟悉這個過程，但我想提醒你們一些關於年度員工評價的細節，評價將從 6 月 1 日開始。下週一，人事部員工將會把關於各位的團隊中每個成員的資訊用電子郵件寄給你們，其中包括他們進公司的日期和過去的評價結果。請在 5 月底前花些時間檢視這些資訊。</p><p>如果員工獲得正面的表現評價，而在過去 3 個月不曾獲得加薪或獎金，該員工有資格獲得 5.5% 的加薪。如果有問題或在意的事，請聯絡人事部的 Gail Cullen。</p></div></section><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>181-185 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Gail Cullen gail.cullen@daisycorp.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Cody Long cody.long@daisycorp.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">4 月 24 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">需要協助</span></div></div><p>親愛的 Cullen 小姐：</p><p>我有個關於 Shayla Barrie 的問題，她是我在這個 6 月要評價的一位員工。Barrie 小姐在我的團隊擔任軟體工程師的工作表現傑出，她在這個職位任職 2 年了。上個月，她因為在長達 10 週、費時費力的專案中成功完成她的任務而獲得了獎金。</p><p>我認為她是我的團隊很寶貴的成員，而應該得到加薪。我想知道在這個情況下，我是否可以申請把 Barrie 小姐當成例外。請告訴我應該採取什麼步驟。還有，如果可能的話，我想要給她多於標準比率的加薪。也請告訴我那是否可以接受。</p><p>謝謝你的協助。</p><p>Cody Long<br/>軟體工程團隊領導人</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>信件</span><small>186-190 · 1</small></div><div class=\"document-body source-passages\"><p>蘭貝里斯山公園辦公室<br/>High 街 122 號<br/>蘭貝里斯，圭內德 LL55 4HB</p><p>敬啟者：</p><p>我十幾歲開始，我就會去蘭貝里斯山公園參加一些我最愛的活動。最近幾個月，我在公園看到一些令我擔心的變化。以前的人數中等，但在夏季月份，公園開始吸引更多的人潮。隨著這個地區越來越受歡迎，應該採取一些規定。</p><p>例如，最近我看到許多人脫離標示的路徑。我建議你們訂定禁止人們這麼做的規定。另外，在攀岩區，我注意到缺乏經驗的攀登者嘗試困難的路線。為了預防意外事故，初學者應該受到謹慎的監控。我也認為遊客應該被要求填好申請許可的表單，才能從事冒險的活動。</p><p>感謝您撥空閱讀。</p><p>Glenda Ree</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單／表格</span><small>186-190 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">蘭貝里斯山公園—冒險運動登記表</h2><p>請將這張表提交到蘭貝里斯山公園巡守站。只有在您的申請獲得執勤巡守員批准時，才能繼續前進。除非有認證導遊同行，否則初次到訪者不得繼續前進。如果需要租用任何裝備，請詢問我們。</p><p>姓名：Branwen Pearse<br/>團體人數：4<br/>造訪日期與時間：10 月 19 日／上午 9:30<br/>預計造訪時間長度：6 小時<br/>這是您第一次造訪？X 是　否</p><p>預定活動與地點：</p><div class=\"document-table-wrap\"><table class=\"document-table\"><tr><td>攀岩</td><td>登山健行</td><td>越野單車</td></tr><tr><td>Giant's Wall</td><td>Lloyd Peak X</td><td>Harlech Slope</td></tr><tr><td>Zipper Descent</td><td></td><td></td></tr><tr><td>請記住以下規定：</td></tr><tr><td>(1) 勿亂丟垃圾。</td></tr><tr><td>(2) 公園上午 6 點開放至下午 6 點。訪客必須在關閉時間前回到公園辦公室。</td></tr><tr><td>(3) 務必行走標示的路徑（不要脫離）。</td></tr><tr><td>(4) 勿餵食野生動物。</td></tr></table></div><p>** 違反者將被罰款 30 元。<br/>** 如需協助，或者要檢舉違反公園規定，請撥打 555-2129。</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單／表格</span><small>186-190 · 3</small></div><div class=\"document-body source-passages\"><p>蘭貝里斯山公園巡守站<br/>10 月 19 日進行冒險運動的訪客</p><div class=\"document-table-wrap\"><table class=\"document-table\"><tr><td>預約時間</td><td>造訪地點</td><td>姓名</td><td>備註</td><td>返回時間</td></tr><tr><td>上午7:45至下午3:45</td><td>Giant's Wall</td><td>Bryn Hughes</td><td>3 人團體</td><td>下午3:40</td></tr><tr><td>上午8:00至上午10:15</td><td>Zipper Descent</td><td>Gweneth Edwards</td><td>租用了登山車</td><td>上午11:00</td></tr><tr><td>上午9:30至下午3:30</td><td>Lloyd Peak</td><td>Branwen Pearse</td><td>有導遊同行；4 人團體</td><td>下午2:45</td></tr><tr><td>上午11:15至下午4:00</td><td>Giant's Wall</td><td>Dennis Roberts</td><td>3 人團體</td><td>下午3:55</td></tr><tr><td>中午12:30至下午5:00</td><td>Harlech Slope</td><td>Owen Price</td><td>租用了登山杖</td><td>下午6:10</td></tr><tr><td>* 請員工注意：不要忘了記錄訪客返回的時間。</td></tr><tr><td>文章1：participate v. 參與　witness v. 目擊 n. 目擊者　concern v. 使憂心　moderate adj. 中等的，不過度的　popularity n. 受歡迎的程度　mark v. 標記　trail n. 小徑，路徑　prohibit v. 禁止　inexperienced adj. 缺乏經驗的　challenging adj. 困難的，挑戰性的　prevent v. 預防　monitor v. 監控　permission n. 許可，允許　engage in phr. 參與，從事　adventurous adj. 冒險的</td></tr><tr><td>文章2：submit v. 提交　approve v. 批准　ranger n. （森林、國家公園）巡守員　on duty phr. 值勤中的　accompany v. 和……同行，伴隨……　certified adj. 經認證的　inquire v. 詢問　gear n. 裝備　duration n. 持續時間，期間　litter v. 亂丟垃圾　be subject to phr. 受到……的支配　fine n. 罰金 v. 對……處以罰金　violation n. 違反　regulation n. 規定</td></tr><tr><td>文章3：take part in phr. 參與　hiking pole phr. 登山杖　record v. 記錄 n. 紀錄</td></tr></table></div></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-translation type-catalog\"><div class=\"doc-ribbon\"><span>廣告</span><small>191-195 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Viu 運動休閒商店</h2><p>運動休閒服飾因為適合多種場合而受到歡迎。我們販售 10 個品牌，目前提供特別促銷活動至 7 月 31 日止。所有折扣在線上、店面都適用。</p><div class=\"catalog-grid\"><div class=\"catalog-item\"><h3>Bemba Team</h3><p>Bemba Team 販售高級纖維製成的合成面料服裝。這種材質非常吸濕而快乾。精選產品可享 20% 折扣。</p><span class=\"offer-badge\">20% 折扣</span></div><div class=\"catalog-item\"><h3>Ventra</h3><p>Ventra 專門製作各種運動項目的運動鞋。Ventra 是我們店內的新品牌，現正提供 30% 的新品牌介紹折扣。</p><span class=\"offer-badge\">30% 折扣</span></div><div class=\"catalog-item\"><h3>Upstar Athletics</h3><p>Upstar Athletics 用回收塑膠水瓶製成的聚酯纖維製造衣服。現正提供 10% 的一般折扣。</p><span class=\"offer-badge\">10% 折扣</span></div><div class=\"catalog-item\"><h3>Yogana</h3><p>Yogana 製造多種花樣與色彩的瑜伽服裝。瑜伽短褲目前 40% 折價特賣中。</p><span class=\"offer-badge\">40% 折扣</span></div></div><p>所有超過 80 元的訂單享有免運費。額外付費可利用服裝的客製印刷服務。請到我們位於明尼亞波利斯 South State 街 449 號的店面，或者上我們的網站 www.viuathleisure.com。</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單／表格</span><small>191-195 · 2</small></div><div class=\"document-body source-passages\"><p>www.viuathleisure.com/contactus</p><p>聯絡表單</p><p>如果您有任何關於我們產品與服務的問題，請聯絡我們。我們保證會在 48 小時內回覆您的詢問。</p><p>姓名：Maria Cortez<br/>電子郵件：maria@evanstonbball.com<br/>提交日期：7 月 13 日</p><p>意見：</p><p>我想為我擔任教練的業餘籃球隊購買 35 套上衣和短褲。因為球隊是國中和高中生組成的，所以我需要各種尺寸。還有，我也想知道除了貴店目前提供的折扣以外，我們是否能獲得大量訂購的折扣。</p><p>評論</p></div></section><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>文章</span><small>191-195 · 3</small></div><div class=\"document-body source-passages\"><p>8 月 4 日發表的評論<br/>作者：Maria Cortez</p><p>Upstar Athletics 是很好的公司，他們的衣服也很棒。布料很有彈性，也很適合運動。可惜的是，我聯絡了一家販售 Upstar Athletics 和其他品牌的店，而他們沒有答覆我的詢問。所以，我決定直接聯絡 Upstar Athletics。他們寄了尺寸各自不同的 35 件上衣和短褲，也提供很大的大量訂購折扣，並且免費在衣服上印了我們的隊名。<br/>文章1：athleisure n. 運動休閒（結合運動與休閒服飾的一種時裝風格）　versatility n. 多用途，適用多種目的　synthetic adj. 合成的，人造的　material n. 材料，原料　moisture-absorbent adj. 吸濕的　specialize in phr. 專門從事／製造……　introductory adj. 介紹的　manufacture v. 製造，生產　apparel n. 衣服（總稱）<br/>文章2：inquiry n. 詢問　compose of phr. 以……構成　bulk adj. 大量的<br/>文章3：stretch v. 伸縮，伸展　reach out phr. 聯絡……　generous adj. 慷慨的，大方的</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-translation type-webpage\"><div class=\"doc-ribbon\"><span>文章</span><small>196-200 · 1</small></div><div class=\"document-body source-passages\"><p>Vision Bath 是以顧客提供最佳住宅整修體驗為目標的獨立浴室（施工）承包商。不管您是希望為您的家增設新浴室，還是改造現有的浴室，我們都保證高品質的施工。如果您想要擁有夢想中的浴室，首先您需要填好一份簡短的問卷，讓我們知道您追求的是什麼。在 24 小時之內，我們熟練的設計師會打電話聯絡您，進一步討論您的偏好。您將收到一份產品目錄，並且能在您準備好的時候安排面對面會議。在諮詢過程中，您的設計師將向您出示一份合約，不久之後施工就會開始。點擊此處開始這個過程。</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單／表格</span><small>196-200 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Vision Bath 問卷</h2><p>姓名：Margaret Collins<br/>電話：555-9911<br/>電子郵件位址：margcollins@wyohi.com</p><p>為什麼您想要新浴室或改造浴室？<br/>我家裡人數太多了，很難繼續共用一間浴室，所以我們需要蓋另一間。</p><p>哪個詞最能形容您想要的浴室風格？<br/>☑ 現代的　☐ 傳統的　☐ 奢華的</p><p>您想要使用什麼顏色？藍色和白色</p><p>您對於哪一種地板材質有興趣？<br/>☐ 瓷磚　☑ 硬木　☐ 塑膠　☐ 其他</p><p>您想要哪一種檯面？<br/>☐ 花崗岩　☑ 陶瓷　☐ 玻璃　☐ 其他</p><p>您希望工程什麼時候開始？5 月初</p><p>您的預算有多少？10,000 到 15,000 元之間</p><p>送出</p></div></section><section class=\"document-card type-translation type-review\"><div class=\"doc-ribbon\"><span>文章</span><small>196-200 · 3</small></div><div class=\"document-body source-passages\"><p>★★★★★ Margaret Collins 5 月 25 日</p><p>我對 Vision Bath 感到非常滿意。提交問卷之後，就有一位名叫 Sandra Reynolds、樂於幫忙的設計師聯絡我。從洗手台水龍頭到櫃子的把手，她對每樣東西都有很棒的主意，而且對我非常耐心。我花了頗長的時間研究 Vision Bath 的目錄，而當她來我家的時候，我們一起把我的選擇檢視了一遍。我特別感謝她幫我選擇了花崗岩的檯面。雖然花的錢比我原本的選擇要多，但它看起來比我所能想像的更好。<br/>文章1：independent adj. 獨立的　contractor n. 承包商　remodel v. 改造　guarantee v. 保證　brief adj. 簡短的　skilled adj. 熟練的　preference n. 偏好　consultation n. 諮詢　commence v. 開始　thereafter adv. 在那之後<br/>文章2：term n. 用語，措詞　describe v. 形容，描述　contemporary adj. 現代的，當代的　luxurious adj. 奢華的　hardwood n. 硬木　countertop n. 檯面　granite n. 花崗岩　porcelain n. 陶瓷<br/>文章3：extremely adv. 極度地，非常　helpful adj. 有幫助的，樂於助人的　faucet n. 水龍頭　cabinet n. 櫃子　go over phr. 看過一遍，檢視</p></div></section></div>"};const DETAILED_EXPLANATIONS={"101":{"type":"【受詞位置】人稱代名詞的格","translation":"Ament 小姐打電話通知我們，她開會會遲到。","reason":"可以當及物動詞（notify）受詞的反身代名詞 (B) 和受格人稱代名詞 (D) 是可能的答案。因為要表達「Ament 小姐打電話通知我們，她會遲到會議」，所以受格人稱代名詞 (D) us 是正確答案。如果使用反身代名詞 (B) ourselves，會變成「Ament 小姐打電話通知我們自己」，而且不符合文法。反身代名詞是用在受詞指稱的對象與主詞相同的時候，或者加入句子裡強調主詞或受詞。主格人稱代名詞 (A) 和所有格人稱代名詞 (C) 不能用在受詞位置。","vocab":"notify v. 通知","paraphrase":""},"102":{"type":"介系詞選擇 位置","translation":"誠摯邀請每個人參加 Camellia 咖啡店的開幕典禮，這間店位於地下鐵市政府站旁。","reason":"因為要表達「位於地下鐵市政府站旁」，所以表示位置的介系詞 (D) beside（在……旁）是正確答案。(A) throughout 表示位置或期間「遍及……，貫穿……，在……的整個期間」。(B) about 表示「關於……」，(C) into 表示方向「往……裡面」。","vocab":"cordially adv. 誠摯地　invite v. 邀請　grand opening phr. 開幕典禮","paraphrase":""},"103":{"type":"【動詞位置】動詞數、語態、時態的一致性","translation":"一位個人助理每天上午檢視 Petrovsky 小姐的會面約定列表後，更新她的每日行程表。","reason":"句中缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。主詞（A personal assistant）是單數，而且空格後面接受詞（Ms. Petrovsky's daily schedule），所以動詞單數形主動態 (B) updates（更新）是正確答案。動詞複數形 (A) 要搭配複數主詞使用。被動態 (C) 會讓句意變成「個人助理被更新」，所以不對，而且這個被動態後面也不能接受詞。動名詞或現在分詞 (D) 不能用在動詞位置。","vocab":"","paraphrase":""},"104":{"type":"介系詞選擇 時間點","translation":"這座度假村的水上運動設備一次最多只能租用兩小時。","reason":"因為要表達「最多租用兩小時」，所以介系詞 (A) up to（最高……，最多……）是正確答案。(B) versus 表示兩者中相對的對象「對上……」，(C) despite 表示讓步「儘管……」，(D) as of 表示「（時間上）……開始」。","vocab":"equipment n. 設備","paraphrase":""},"105":{"type":"形容詞位置","translation":"McCabe 小姐是能在沒有直接監督的情況下工作的能幹員工。","reason":"空格要修飾後面的名詞（employee），所以形容詞 (A) capable（有能力的，能幹的）是正確答案。名詞 (B) 和 (C)、副詞 (D) 都不能修飾名詞。就算把名詞 (B) 和 (C) 當成 be 動詞（is）的補語，也會因為缺少連接詞，而無法和空格後面的部分連接起來，所以不對。","vocab":"supervision n. 監督　capability n. 能力　capableness n. 能幹　capably adv. 能幹地","paraphrase":""},"106":{"type":"【引導修飾性語句的成分】介系詞選擇","translation":"Coulter 先生習慣早起，所以他想要值早班而不是晚班。","reason":"句中包含的子句（he ~ night shift）是已經具備主詞（he）、動詞（wants）和受詞（to take the morning shift）的完整子句，所以 the night shift 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表達「想值早班而不是晚班」，所以介系詞 (A) instead of（而不是……）是正確答案。(C) due to 表示理由「由於……」，(D) regardless of 表示「不管，不顧……」。(B) aside（在旁，到旁）不能引導修飾片語。另外，請記得 aside 如果和 from 結合成 aside from，就可以接名詞而形成表示「除了……以外」的介系詞片語。","vocab":"shift n. 輪班工作時段","paraphrase":""},"107":{"type":"【名詞位置】可數名詞與不可數名詞","translation":"投資安全的金融產品可以保護退休者免於遭受重大的損失。","reason":"空格是動詞（protect）的受詞，所以名詞 (B) 和 (C) 是可能的答案。句意是「保護退休者免於重大的損失」，而且空格前面沒有冠詞，所以複數名詞 (C) retirees 是正確答案。單數名詞 (B) 必須加上冠詞。動詞 (A)、動詞或過去分詞 (D) 不能用在受詞位置。","vocab":"invest v. 投資　financial adj. 金融的　significant adj. 重大的","paraphrase":""},"108":{"type":"副詞","translation":"Bell Lake 公司在雇用了 150 名額外員工後，最近成為了這個地區最大的公司。","reason":"句意是「Bell Lake 公司最近成為了這個地區最大的公司」，所以 (C) recently（最近）是正確答案。(A) continuously 表示「持續地」。(B) commonly 表示「經常地，通常」。(D) occasionally 表示「偶爾」。","vocab":"additional adj. 額外的","paraphrase":""},"109":{"type":"表示建議、要求、義務的主要子句後面的 that 子句填入「動詞原形」","translation":"空服員要求在降落前歸還所有耳機麥克風。","reason":"主要子句（The flight attendant asked）有表示要求的動詞（asked），所以 that 子句（that all headphones ~ landing）的動詞要使用原形，動詞原形 (B) be 是正確答案。be 動詞的複數形 (A) 和過去形 (C)、to 不定詞 (D) 不能用在動詞原形的位置。","vocab":"landing n. 著陸，降落","paraphrase":""},"110":{"type":"【名詞位置】動名詞 vs. 名詞","translation":"Solomo Industries 公司將在總工廠實施新的品管程序。","reason":"空格是及物動詞（implement）的受詞位置，所以名詞 (A) 和 (D)、有名詞功能的動名詞 (B) 是可能的答案。因為要表達「實施新的品管程序」，所以名詞 (A) process（程序，過程）是正確答案。如果使用 (D) procession（行進隊伍）的話，意思會變成「在工廠實施新的品管行進隊伍」，所以不對。動名詞 (B) 不能接在不定冠詞（a）後面。動詞過去式或過去分詞 (C) 不能用在名詞位置。","vocab":"implement v. 實施　quality-control n. 品管（品質管理）　processing n. 加工，處理","paraphrase":""},"111":{"type":"副詞位置","translation":"維護工作人員無法在電源還開著的情況下安全地修理機器。","reason":"可以用在助動詞（cannot）和動詞原形（fix）之間，並且修飾動詞的副詞 (B) safely（安全地）是正確答案。動詞 (A)、名詞 (C)、形容詞 (D) 都不能修飾動詞。就算把 (A) save（拯救，留下）當成助動詞（cannot）後面的動詞原形，也會因為後面的 fix（修理）不能被視為名詞，而是接受詞（a machine）的及物動詞，而不能形成文法正確的句子。","vocab":"maintenance n. 維護　power n. 電，電源　safety n. 安全","paraphrase":""},"112":{"type":"【受詞位置】名詞子句連接詞 疑問詞","translation":"對於下屆市長選舉支持誰，居民的意見非常分歧。","reason":"空格之後的部分（~ election）是介系詞 on 的受詞，所以能引導名詞子句，而且後面可以接 to 不定詞的疑問詞 (B)、(C)、(D) 是可能的答案。因為要表達「對於選舉時支持誰，居民的意見非常分歧」，所以受格疑問代名詞 (B) whom（對誰）是正確答案。另外，這個句子使用「疑問詞 + to 不定詞」的結構當名詞子句，但也可以使用「疑問詞 + 主詞 + should + 動詞」的結構，也就是 whom they should support。如果使用 (C) which（哪個東西）、(D) whose（誰的東西）的話，意思會變成「對於選舉時支持哪個東西／誰的東西，居民的意見非常分歧」，所以不對。連接詞 (A) that 雖然也能引導名詞子句，但不能當介系詞的受詞；這裡也不可能把 that 當成關係代名詞，因為不能接在介系詞或逗號後面。","vocab":"deeply divided phr. 極度分裂的　mayoral adj. 市長的　election n. 選舉","paraphrase":""},"113":{"type":"動詞","translation":"研究顯示，受過衝突解決訓練的經理能建立比較強大而有效的團隊。","reason":"句意是「受過衝突解決訓練的經理能建立比較強大而有效的團隊」，所以動詞 train（訓練）的 p.p. 形 (C) trained 是正確答案。(A) sign 表示「簽名，簽署」，(B) submit 表示「提交」，(D) thank 表示「感謝」。","vocab":"conflict n. 衝突　resolution n. 解決，決心","paraphrase":""},"114":{"type":"形容詞","translation":"Hislop Industries 公司的新員工必須在受雇後的第一個月之內完成義務性的訓練課程。","reason":"句意是「必須完成義務性的訓練課程」，所以形容詞 (D) mandatory（強制的）是正確答案。(A) attentive 表示「關心的」，(B) intelligent 表示「聰明的」，(C) permanent 表示「永久的」。","vocab":"course n. 課程　employment n. 雇用，就業","paraphrase":""},"115":{"type":"【引導修飾性語句的成分】副詞子句連接詞 理由","translation":"因為 Vervaille 的另一家義式餐廳停業，所以 Gamberetti 非常忙碌。","reason":"這個句子已經有具備主詞（Gamberetti）、動詞（is）和補語（busy）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - closed down 是修飾性的語句。修飾部分有動詞（has closed down），所以能引導修飾子句的副詞子句連接詞 (A)、(B)、(D) 是可能的答案。因為要表達「由於另一家義式餐廳停業，所以 Gamberetti 非常忙碌」，所以表示理由的副詞子句連接詞 (D) now that（既然……，因為……）是正確答案。(A) unless 表示條件「除非……」，(B) in order that 表示目的「為了……」。介系詞 (C) owing to（由於……）不能引導修飾子句，而是引導修飾片語。","vocab":"close down phr. 停業","paraphrase":""},"116":{"type":"名詞","translation":"數百輛車必須被召回，因為它們不符合政府的排放標準。","reason":"句意是「車不符合政府的排放標準」，所以名詞 (B) standards（標準）是正確答案。(A) broadcast 表示「廣播」，(C) reminder 表示「作為提醒的事物，催促信」，(D) license 表示「許可證」。","vocab":"recall v. 召回　meet v. 符合，趕上（期限），見面","paraphrase":""},"117":{"type":"動詞慣用表達方式","translation":"Ventera 公司正在尋找能夠陪同高階主管到北京出差的中文翻譯。","reason":"句意是「Ventera 公司正在尋找中文翻譯」，所以能和空格後的介系詞 for 形成動詞片語 search for（尋找……）的 search 動詞 -ing 形 (D) searching 是正確答案。(B) dispatch（派遣）意思也合理，但因為是及物動詞，所以後面不能接介系詞 for。(A) order 表示「命令」，(C) refer 表示「談到，參考」。","vocab":"translator n. 翻譯者　accompany v. 陪同，伴隨　executive n. 高階主管　business trip phr. 出差","paraphrase":""},"118":{"type":"副詞位置","translation":"Victory Holdings 的執行長在公司擴張到歐洲後，自信地談到公司未來的願景。","reason":"空格修飾前面的動詞（spoke），所以副詞 (C) assuredly（自信地）是正確答案。動詞 (A)、動詞或過去分詞 (B)、名詞 (D) 都不能修飾動詞。如果把名詞 (D) 當成動詞 spoke 的受詞，意思會變成「執行長保證」，而且這也不是「保證……」的正確表達方式，所以不對。","vocab":"expansion n. 擴張　assure v. 保證　assurance n. 保證","paraphrase":""},"119":{"type":"介系詞選擇 關於……","translation":"這位顧客提出關於她 10 月 13 日下單的訂單的詢問。","reason":"因為要表達「提出關於訂單的詢問」，所以介系詞 (C) regarding（關於……）是正確答案。(A) along 表示場所或方向「沿著……」。 (B) between（在……之間）表示兩個對象之間的位置或時間關係，通常以 between A and B 的形式使用。(D) through 表示方向「穿過……，通過……」。","vocab":"inquiry n. 詢問","paraphrase":""},"120":{"type":"形容詞","translation":"市中心餐廳 Chez Jacques 的餐點很優秀，所以值得等待。","reason":"句意是「餐點很優秀，所以值得等待」，所以形容詞 (C) exceptional（優秀的）是正確答案。(A) effective 表示「有效的」。(B) ready 表示「備好的」。(D) defective 表示「有缺陷的」。","vocab":"downtown adj. 市中心的　worth adj. 值得……的","paraphrase":""},"121":{"type":"動詞","translation":"大量訂購 Blossom Kitchen 產品的顧客可以協商折扣。","reason":"句意是「大量訂購產品的顧客可以協商折扣」，所以動詞 (D) negotiate（協商）是正確答案。(A) diminish 表示「減少，縮減」。(B) target 表示「以……為目標」。(C) consider（考慮）的意思也說得通，但因為是及物動詞，所以後面必須直接接受詞。","vocab":"bulk order phr. 大筆訂單　discount n. 折扣","paraphrase":""},"122":{"type":"【補語位置】名詞補語 vs. 形容詞補語","translation":"雖然 McIntyre 先生在簡報時感到緊張，但他的不安對所有在場的人都不明顯。","reason":"空格是 be 動詞（was）的補語位置，所以能當補語的形容詞 (B)、名詞 (C) 和 (D) 是可能的答案。因為句意是「他的不安對所有人都不明顯」，而且補語說明主詞（his discomfort）的狀態，所以形容詞 (B) evident（明顯的）是正確答案。如果使用名詞 (C) evidence（證據）或 (D) evidences 的話，則是表示主詞本身，也就是「他的不安不是證據」，不符合要表達的意思。副詞 (A) 不能當補語。","vocab":"discomfort n. 不安，不適　present adj. 出席的，在場的　evidently adv. 明顯地　evidence n. 證據 v. 證明","paraphrase":""},"123":{"type":"副詞","translation":"產品樣品接受徹底分析，以找出每個可能需要改進的部分。","reason":"句意是「產品樣品接受徹底分析，以找出每個可能需要改進的部分」，所以副詞 (D) thoroughly（徹底地）是正確答案。(A) instinctively 表示「本能地，直覺地」。(B) partially 表示「部分地」。(C) abstractly 表示「抽象地」。","vocab":"","paraphrase":""},"124":{"type":"形容詞位置","translation":"昨晚的表演有優雅的舞者展現不費力的動作。","reason":"空格修飾後面的名詞（movements），所以形容詞 (A) effortless（不費力的）是正確答案。名詞 (B) 和 (D)、副詞 (C) 不能修飾名詞。","vocab":"graceful adj. 優雅的　movement n. 動作","paraphrase":""},"125":{"type":"副詞選擇 頻率副詞","translation":"10 樓的會議室很少使用，所以可能被改裝作為更實際的用途。","reason":"因為要表達「會議室很少使用，所以可能被改裝作為更實際的用途」，所以頻率副詞 (A) seldom（很少……）是正確答案。使用副詞 (B) almost（幾乎）、(C) always（總是）、(D) maybe（或許）的話，意思會變成「會議室幾乎被使用／總是被使用／或許被使用」，所以不對。","vocab":"convert v. 轉變，改裝　serve v. 適用（某種用途）　practical adj. 實際的，實用的","paraphrase":""},"126":{"type":"動詞","translation":"營運總監的目標是為水族館配備最先進的過濾系統。","reason":"句意是「目標是為水族館配備最先進的過濾系統」，所以動詞 (B) equip（為……配備）是正確答案。(A) oblige 表示「強迫」，(C) certify 表示「證明，保證」，(D) revolve 表示「旋轉」。另外，請記得 equip 的用法是 equip A with B（使 A 配備 B）。","vocab":"operation n. 營運　aim v. 以……為目標　state-of-the-art adj. 最先進的　filtration n. 過濾","paraphrase":""},"127":{"type":"形容詞慣用表達方式","translation":"接受購買超過 30 天後的退貨，是違背商店政策的。","reason":"句意是「接受購買超過 30 天後的退貨，是違背商店政策的」，所以能和空格前面的 be 動詞（is）、後面的 to 構成 be contrary to（和……相反）的 (C) contrary（相反的）是正確答案。(A) reverse（相反的）意思也類似，但當形容詞時只能在名詞前面做修飾。(B) dependent 表示「依賴的」，通常以 dependent on 的形式使用。(D) negative 表示「負面的」。","vocab":"merchandise n. 商品　purchase n. 購買　policy n. 政策","paraphrase":""},"128":{"type":"名詞位置","translation":"檢查員列出了一些在麵包店開幕前仍需滿足的必要條件。","reason":"空格被前面的數量形容詞（some）修飾，所以名詞 (B) requirements（必要條件）是正確答案。動詞 (A) 和 (D) 不能用在名詞位置。動名詞 (C) 不能用形容詞修飾，而要用副詞修飾。","vocab":"inspector n. 檢查員，視察員　list v. 列出 n. 列表","paraphrase":""},"129":{"type":"副詞子句連接詞 複合關係副詞 whenever","translation":"每當 Jackson 先生想吃價格低廉的午餐時，就會去 Central Market 的美食廣場。","reason":"這個句子已經有具備主詞（he）和動詞（goes）的完整子句，所以 ~ lunch 是修飾性的語句，而能夠引導空格後的子句（Mr. Jackson wants to eat an affordable lunch），形成副詞子句並表達「每當 Jackson 先生想吃價格低廉的午餐時，就會去美食廣場」的複合關係副詞 (D) Whenever（每當……）是正確答案。如果使用副詞子句連接詞 (A) As though（彷彿……）、(B) Rather than（而不是……）、(C) Until（直到……）的話，意思會變成「彷彿／不是／直到 Jackson 先生想吃價格低廉的午餐，他去美食廣場」，所以不對。","vocab":"affordable adj. （價格）可負擔的，不貴的","paraphrase":""},"130":{"type":"經常搭配使用的詞語","translation":"新公寓社區附近越來越頻繁地開設餐廳來服務居民。","reason":"句意是「越來越頻繁地開設餐廳來服務居民」，所以能和空格前面的 with、increasing 構成 with increasing frequency（越來越頻繁地）的 (B) frequency（頻率）是正確答案。(A) disagreement 表示「不一致，意見不合」，(C) knowledge 表示「知識」，(D) limitation 表示「限制」。","vocab":"apartment complex phr. 公寓社區　resident n. 居民","paraphrase":""},"131":{"type":"動詞詞彙","translation":"請選出最適合填入文章第 131 個空格的選項。","reason":"句意是「將開始建設容納國際航班的新航廈」，所以動詞 (D) accommodate（容納）是正確答案。(A) propose 表示「提議」。(B) transmit 表示「傳送」。(C) reassure 表示「使放心」。","vocab":"","paraphrase":""},"132":{"type":"連接副詞 掌握上下文","translation":"請選出最適合填入文章第 132 個空格的選項。","reason":"空格伴隨逗號一起出現在句首，是連接副詞的位置，所以要掌握空格所在的句子和上一句的關係來判斷答案。上一句提到 Barings 機場將開始建設容納國際航班的新航廈，而空格所在的句子說新航廈的加入將增加容量達百分之 40，所以表示要提及前述事物的具體數字，且追加說明的 (A) In all（總計）是正確答案。(B) Then again 表示「但另一方面」。(C) Even so 表示「儘管如此」。(D) To repeat 表示「再次重申」，意思都不恰當。","vocab":"","paraphrase":""},"133":{"type":"選出適當的句子","translation":"請選出最適合填入文章第 133 個空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Consequently, it will only be accessible by light rail train or shuttle bus. 提到，它（第 5 航廈）只能透過輕軌或接駁巴士前往，所以空格的內容應該和前往第 5 航廈的方法有關。(B) Both options will be available from the other four terminals 是正確答案。","vocab":"","paraphrase":""},"134":{"type":"介系詞","translation":"請選出最適合填入文章第 134 個空格的選項。","reason":"句意是「機場部分區域可能也將暫時關閉，包括第 4 航廈某些部分」，所以表示「包括……」的介系詞 (D) including 是正確答案。(A) later 表示「之後」，(B) meanwhile 表示「同時」，(C) according to 表示「根據……」。","vocab":"","paraphrase":""},"135":{"type":"【動詞位置】未來式 掌握上下文","translation":"請選出最適合填入文章第 135 個空格的選項。","reason":"that 子句（that ~ at 7:00 P.M.）裡只有主詞（it），缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到活動總共將進行 3 小時，其中電影放映時間為 115 分鐘，表示是未來的活動，所以能夠表示未來的現在進行式 (D) is premiering 是正確答案。請記得現在進行式（be + -ing）可以表示預定或即將發生的事。過去進行式 (B) 和過去式 (C) 不能表示未來的事。動名詞或現在分詞 (A) 不能充當動詞。","vocab":"","paraphrase":""},"136":{"type":"選出適當的句子","translation":"請選出最適合填入文章第 136 個空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Mr. Barker will then answer audience questions for the remaining time. 提到，Barker 先生將在剩下的時間回答觀眾的問題，所以空格的內容應該和觀眾提問時間有關，(C) This should give fans some insight into his creative process 是正確答案。\n選項翻譯\n(A) Barker 先生和他的家人一起出席了活動。\n(B) 散布電影的拷貝（盜拷）是法律嚴格禁止的。\n(C) 這應該能讓影迷稍微了解他的創作過程。\n(D) 我們平日下午 4 點、週末下午 2 點開始營業。","vocab":"attend v. 出席，參加　distribute v. 分發，散布　strictly adv. 嚴格地　prohibit v. 禁止　insight n. 洞察力，洞悉","paraphrase":""},"137":{"type":"形容詞詞彙","translation":"請選出最適合填入文章第 137 個空格的選項。","reason":"句意是「基於 Barker 先生在 4 年間遊歷敘利亞、黎巴嫩和伊拉克的廣泛範圍旅行」，所以形容詞 (C) extensive（廣闊的，大範圍的）是正確答案。(A) temporary 表示「暫時的，臨時的」，(B) upcoming 表示「即將到來的」，(D) concise 表示「簡潔的」。","vocab":"","paraphrase":""},"138":{"type":"副詞詞彙 掌握上下文","translation":"請選出最適合填入文章第 138 個空格的選項。","reason":"句意是「如果您有興趣觀賞中東生活的第一手紀錄，請＿＿行動」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到門票數量有限，所以副詞 (D) quickly（快速地）是正確答案。(A) professionally 表示「專業地」，(B) naturally 表示「自然地」，(C) responsibly 表示「負責地」。","vocab":"","paraphrase":""},"139":{"type":"名詞 掌握上下文","translation":"請選出最適合填入文章第 139 個空格的選項。","reason":"句意是「我們寫這封信是關於您＿＿上—期網路服務費」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到數次試圖打電話通知，但沒有聯絡上，之後又提到在 Loft Net 的待繳餘額已經在 3 月 15 日到期，所以名詞 (B) failure（失敗，沒有做到）是正確答案。(A) decision 表示「決定」，(C) demand 表示「要求」，(D) record 表示「紀錄」。","vocab":"","paraphrase":""},"140":{"type":"形容詞 掌握上下文","translation":"請選出最適合填入文章第 140 個空格的選項。","reason":"句意是「在 Loft Net 的（待繳）餘額已經在 3 月 15 日＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到政策是接受在截止期限後一週內付款，而不會有額外的費用，由此可知 3 月 15 日是付款的期限，形容詞 (D) due（到期的）是正確答案。(A) changed 表示「改變了的」，(B) received 表示「被收到的」，(C) lost 表示「失去的，遺失的」。","vocab":"","paraphrase":""},"141":{"type":"選出適當的句子","translation":"請選出最適合填入文章第 141 個空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 It is our policy to accept payments without applying additional fees for a week following the deadline. 提到，政策是接受在截止期限後一週內付款，而不會有額外的費用，而下一句 we would appreciate your prompt attention to this matter 則說希望對方儘快處理這件事，所以空格的內容應該和超過付款截止期限一週後會發生的事有關，(A) After that, we are forced to charge interest 是正確答案。\n選項翻譯\n(A) 在那之後，我們就必須收取利息。\n(B) 在我們紀錄上的信用卡已經過期了。\n(C) 或者，您可以電匯。\n(D) 請立即更新您的聯絡資訊。","vocab":"interest n. 利息　on file phr. 在（檔案）紀錄中的　expire v. 到期，過期　wire transfer phr. 電匯　contact details phr. 聯絡資訊","paraphrase":""},"142":{"type":"【引導修飾性語句的成分】to 不定詞的功能","translation":"請選出最適合填入文章第 142 個空格的選項。","reason":"這個句子是祈使句，所以沒有主詞，而句中已經有動詞（contact, have）和受詞（555-7843, your credit card），是完整的子句，所以 the bill 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語、含有現在分詞的 (B) 和 to 不定詞 (C) To settle 是可能的答案。因為要表達「為了付清帳單而聯絡」，所以表示目的的是 to 不定詞 (C) To settle 是正確答案。含有現在分詞的 (B) 會形成分詞構句「已經付清……」，表示時間、理由、條件、連續動作，不符合文意。動詞 (A) 和 (D) 不能引導修飾片語。","vocab":"","paraphrase":""},"143":{"type":"副詞位置","translation":"請選出最適合填入文章第 143 個空格的選項。","reason":"能修飾動詞（are impressed）的是副詞，所以副詞 (C) highly（非常）是正確答案。形容詞 (A)、形容詞的比較級 (B)、形容詞的最高級 (D) 都不能修飾動詞。就算想把 (A) 當成副詞「高高地」，或者把 (B) 和 (D) 當成副詞用法的比較級、最高級也不行，因為 high 的副詞用法只能在動詞後面做修飾。","vocab":"","paraphrase":""},"144":{"type":"【動詞位置】未來式 掌握上下文","translation":"請選出最適合填入文章第 144 個空格的選項。","reason":"句中缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。句意是「需要每個人參加」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到未來幾週會有許多工作，所以大家的配合很重要，由此可知「每個人參加」是未來會發生的事，所以未來式 (A) will need 是正確答案。過去式 (B) 和現在完成式 (C) 不能表示未來的事情。動名詞或現在分詞 (D) 不能當動詞用。","vocab":"","paraphrase":""},"145":{"type":"選出適當的句子","translation":"請選出最適合填入文章第 145 個空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 I have arranged for us all to meet with Liang Inc.'s CEO on July 27 so that we can figure out a detailed timeline. 提到，已經安排所有人和 Liang 公司的執行長會面，釐清詳細的時程規劃，所以空格的內容應該和與執行長會面討論的內容有關，所以 (D) We will also discuss plans for the magazine spread 是正確答案。\n選項翻譯\n(A) 我同意他們的建議比我們的好。\n(B) 廣告將在那時首次播出。\n(C) 這次討論解決了幾個重要問題。\n(D) 我們也將討論雜誌跨頁的計畫。","vocab":"contribute v. 貢獻　proposal n. 提案　executive n. 高階主管　commercial n. 廣告 adj. 商業的　cooperation n. 合作，協力　vital adj. 至關重要的　arrange v. 安排　figure out phr. 想出，弄清楚　detailed adj. 詳細的　timeline n. 時間表，時程規劃　input n. （例如資訊的）投入，輸入","paraphrase":""},"146":{"type":"祈使句沒有主詞，動詞原形開始","translation":"請選出最適合填入文章第 146 個空格的選項。","reason":"這個句子是祈使句，沒有主詞，所以能當祈使句動詞的原形 (A) be prepared（準備好）是正確答案。動名詞或現在分詞 (B)、介系詞片語 (C)、包含現在分詞的 (D) 都不能當祈使句的動詞。\n\nPART 7","vocab":"","paraphrase":""},"147":{"type":"尋找主題／目的","translation":"為什麼傳了這則訊息？","reason":"這一題問的是傳這則訊息的原因，所以要注意文章開頭的部分。I got your latest draft of the newsletter. Here are my thoughts. First, thanks for trying my suggestions. 的部分，收到了電子報的最新草稿，且感謝對方嘗試了自己的建議，接下來則是表達自己對於最新草稿的意見，所以 (A) 是正確答案。","vocab":"comment v. 發表意見，評論　cost estimate phr. 費用估價　procedure n. 程序","paraphrase":""},"148":{"type":"Not/True True 題型","translation":"關於電子報，文中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 a newsletter 有關的內容，並且對照選項判斷答案。(A)、(B)、(C) 在文章裡沒有提到。(D) 在 Could you also replace the last photo? We can't use it because it's too outdated. 的部分，問對方能不能換掉最後一張照片，因為照片太舊了，符合選項敘述，所以 (D) 是正確答案。","vocab":"inaccurate adj. 不正確的","paraphrase":""},"149":{"type":"尋找主題／目的 文章的目的","translation":"這篇文章主要是關於什麼？","reason":"這一題問的是這篇文章的目的，所以要注意文章開頭的部分。Country music star Sandi Vincent will visit Warwick next month to help our baseball team ~ start the new season. 的部分提到，鄉村音樂明星 Sandi Vincent 下個月將拜訪 Warwick，為棒球隊開始新的球季，之後則說明與開球活動相關的事項，所以 (D) 是正確答案。","vocab":"admission n. 准許進入　performance n. 表演　premiere n. 首映　celebrity n. 名人　participation n. 參與，參加","paraphrase":""},"150":{"type":"推論 細節資訊","translation":"關於 Vincent 小姐，文中暗示什麼？","reason":"這是和題目關鍵詞語 Ms. Vincent 有關的推論問題。Ms. Vincent gained nationwide fame through ~ her third album 的部分提到，Vincent 小姐靠著第三張專輯的成功，獲得了全國性的知名度，由此可以推知，Vincent 小姐錄製了至少三張專輯，(B) 是正確答案。","vocab":"athlete n. 運動員　on a regular basis phr. 定期地","paraphrase":""},"151":{"type":"推論 細節資訊","translation":"關於 Rumfax 共享園地，文中提到什麼？","reason":"這是和題目關鍵詞語 Rumfax Shared Garden 有關的推論問題。Anyone who lives in Rumfax is welcome to apply 的部分提到，歡迎任何居住於 Rumfax 的人申請，由此可以推知，Rumfax 的居民可以使用 Rumfax 共享園地，(A) 是正確答案。","vocab":"resident n. 居民　produce n. 農作物 v. 生產　corporation n. 企業　introduce v. 導入，採用","paraphrase":""},"152":{"type":"wh-問題 When","translation":"根據通知，地塊在什麼時候可以擴張？","reason":"這是問地塊在什麼時候（When）可以擴張的 wh- 問題。和題目的關鍵詞語 plots be expanded 有關的部分是 Plots may not be expanded unless RSG coordinators grant special consent.，這部分說除非經過 RSG 協調者特別同意，否則地塊不能擴張，所以 (C) 是正確答案。\n變換表達方式\ngrant special consent 特別同意 → give permission 允許","vocab":"","paraphrase":""},"153":{"type":"wh-問題 Why","translation":"Rumfax 共享園地為什麼必須收取會員費？","reason":"這是問為什麼（Why）Rumfax 共享園地必須收取會員費的 wh- 問題。和題目的關鍵詞語 Rumfax Shared Garden ~ charge for membership 有關的部分是 The membership fee is used to pay for water, soil, and fertilizer.，這部分提到會員費用於支付水、土壤與肥料的費用，所以 (D) 是正確答案。\n變換表達方式\nwater, soil, and fertilizer 水、土壤與肥料 → necessary supplies 必要的用品","vocab":"purchase v. 購買　material n. 材料　wage n. 薪水　supply n. 用品，供應品 v. 供應","paraphrase":""},"154":{"type":"推論 細節資訊","translation":"Barrow 小姐最有可能是什麼人？","reason":"這是和題目關鍵詞語 Ms. Barrow 有關的推論問題。Juliet Pau 說 Have you had a chance to inspect the proposal for our company mascot? 問對方是否看過公司吉祥物的提案，而 Chris Cormier 回應 Ms. Barrow interpreted our idea fairly well，表示 Barrow 小姐把他們的想法詮釋得很好，然後 Juliet Pau 又補充 I really like how she drew the character's outfit and body in Option A，表示自己真的很喜歡她（Barrow 小姐）在 A 案中畫角色服裝和身體的方式，由此可以推知 Barrow 小姐是負責製作吉祥物草圖的插畫家，(D) 是正確答案。","vocab":"","paraphrase":""},"155":{"type":"掌握意圖","translation":"下午 3 點 50 分，Cormier 先生的「I'm inclined to agree」最有可能意味什麼？","reason":"這一題問的是 Cormier 先生的訊息所表達的意圖，所以要掌握引用部分（I'm inclined to agree）前後文的情境。Juliet Pau 說 I'm not sure about the face ~. What do you think?，表示自己對於臉的部分不太確定（呈現的樣子是否理想），對此 Cormier 先生回應 I'm inclined to agree.（我算是同意），且說 The eyes should be significantly larger，表示自己認為眼睛應該再大上許多，可知 Cormier 先生同樣對於臉的部分不太滿意，所以 (B) 是正確答案。","vocab":"","paraphrase":""},"156":{"type":"Not/True Not 題型","translation":"關於 Touchstone Ventures 公司，何者不正確？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Touchstone Ventures 有關的內容，並且對照選項判斷答案。(A) 在 Touchstone's takeover of Umoja Transport in mid-February 的部分提到，Touchstone 公司在 2 月中收購了 Umoja Transport 公司，符合選項敘述。(B) 在 Touchstone's plan has four parts. 的部分提到，Touchstone 公司的計畫有四個部分，符合選項敘述。(C) 在文章裡沒有提到，所以 (C) 是正確答案。(D) 在 The third phase will be ~ to take advantage of the growing cargo traffic to and from neighboring countries. 的部分提到，Touchstone 公司計畫的第三階段是藉由與鄰國逐漸成長的往來貨物量獲利，符合選項敘述。","vocab":"previously adv. 之前　deal in phr. 經營","paraphrase":""},"157":{"type":"推論 細節資訊","translation":"關於 Maguli 博士，文中暗示什麼？","reason":"這是和題目關鍵詞語 Dr. Maguli 有關的推論問題。According to my research, a growing number of Tanzanians are choosing to drive or take a bus rather than a ride in a train. 的部分提到，根據「我」（Maguli 博士）的研究，有越來越多坦尚尼亞人選擇開車或搭巴士，而不是搭火車；後面的 Touchstone's challenge will be to reverse this tendency 又提到 Touchstone 公司的挑戰在於扭轉這個趨勢。由此可以推知，Maguli 博士研究過坦尚尼亞的運輸趨勢，所以 (B) 是正確答案。","vocab":"construction n. 建設　transportation n. 運輸　trend n. 趨勢　consulting n. 諮詢","paraphrase":""},"158":{"type":"選擇句子位置","translation":"以下句子最適合填入 [1]、[2]、[3]、[4] 的哪個位置？ 「它們被預期將吸引想要以悠閒的步調欣賞國內景色的旅客。」","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「它們（這些東西）被預期將吸引想要以悠閒的步調欣賞國內景色的旅客」，所以句子填入的部分應該和觀賞風景的旅行有關。[4] 的上一句 it may begin offering scenic journeys on steam-powered heritage trains 提到「它」（Touchstone Ventures 公司）可能開始提供蒸氣動力古董列車的觀景旅行。將句子填入 [4] 的位置之後，可以表達「Touchstone Ventures 公司將開始提供蒸氣動力古董列車的觀景旅行，而這些旅行被預期將吸引想要以悠閒的步調欣賞國內景色的旅客」，文意通順，所以 (D) 是正確答案。","vocab":"appeal v. 吸引　landscape n. 風景　leisurely adj. 悠閒的　pace n. 步調","paraphrase":""},"159":{"type":"推論 整體資訊","translation":"這則廣告最有可能給誰看的？","reason":"這是需要綜合文中各處的線索，推論廣告對象的問題。Has your home or business become uncomfortably full? Well, rather than relocating, check out Goliath Storage 的部分問讀者家裡或者公司是否已經滿到讓人不舒服，並且建議不要搬家，而是了解一下 Goliath 倉儲，之後的內容則是介紹這家業者提供的倉儲保管服務。因此可以推知，這則廣告的對象是物品存放空間不足的人，(D) 是正確答案。","vocab":"","paraphrase":""},"160":{"type":"wh-問題 What","translation":"正在提供什麼作為促銷的一部分？","reason":"這是問正在提供什麼（What）作為促銷的 wh- 問題。和題目的關鍵詞語 offered as part of a promotion 有關的部分是 For the month of December only, those purchasing insurance for their stored items through our office will receive a 20 percent discount on their policy!，這部分提到僅限 12 月當月，透過「我們公司」（Goliath 公司）為儲藏物品購買保險者，將獲得 20% 的保險折扣，所以 (D) 是正確答案。","vocab":"complimentary adj. 免費贈送的　pickup n. 收取","paraphrase":""},"161":{"type":"推論 細節資訊","translation":"關於 Windsor 商會，文中提到什麼？","reason":"這是和題目關鍵詞語 the Windsor Business Association 有關的推論問題。Following last month's topic on conserving electricity, this month's topic is about reducing water waste. 的部分提到，在上個月的節約用電主題之後，本月的主題是減少水的浪費，由此可以推知，Windsor 商會定期提供研討會，所以 (C) 是正確答案。","vocab":"relocate v. 遷移，搬遷　head office phr. 總辦公室，總公司　partner with phr. 和……合作","paraphrase":""},"162":{"type":"同義詞","translation":"第 2 段第 2 行的單字「steps」，意思最接近","reason":"steps 所在的語句 Calvin Randall will explain how local businesses can take steps to reduce costs 之中，steps 表示「措施」的意思，所以同樣能表示「措施」的 (D) 是正確答案。","vocab":"","paraphrase":""},"163":{"type":"wh-問題 What","translation":"有興趣的參加者被要求帶什麼？","reason":"這是問有興趣的參加者被要求帶什麼（What）的 wh- 問題。和題目的關鍵詞語 interested participants asked to bring 有關的部分是 It will be a good opportunity to learn how you can cut your water expenses and protect our planet at the same time. Local business owners are also encouraged to bring along recent utility statements to learn about the different areas where savings are possible.，這部分提到研討會將是學習能如何同時減少水費並保護地球的好機會，並且建議本地事業主攜帶最近的公用事業帳單明細，了解能節省的各種不同領域，其中應該就包含水費帳單，所以 (C) 是正確答案。\n變換表達方式\nare ~ asked 被要求 → are ~ encouraged 被鼓勵\nutility statements 公用事業帳單明細 → water bills 水費帳單","vocab":"","paraphrase":""},"164":{"type":"選擇句子位置","translation":"以下句子最適合填入 [1]、[2]、[3]、[4] 的哪個位置？ 「這就是您不該錯過這次研討會的理由。」","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「這就是您不該錯過這次研討會的理由」，所以應該會出現在和參加研討會的理由有關的部分。[3] 的上一句 Mr. Randall is a highly respected scientist and has appeared on numerous television and radio programs over the years. 提到，Randall 先生是備受敬重的科學家，並且曾經在這幾年出演許多電視與廣播節目。將句子填入 [3] 的位置之後，可以表達「Randall 先生是備受敬重的科學家，並且曾經在這幾年出演許多電視與廣播節目，而這就是您不該錯過這次研討會的理由」，文意通順，所以 (C) 是正確答案。","vocab":"","paraphrase":""},"165":{"type":"wh-問題 What","translation":"Woodard 小姐在選擇 Arturo 不動產之前做了什麼？","reason":"這是問 Woodard 小姐在選擇 Arturo 不動產之前做了什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Woodard do before choosing Arturo Realty 有關的部分是針對 Why did you choose to work with us?（為什麼您選擇和我們合作？）這個問題的回答：I got in touch with several real estate agencies, but yours responded the most promptly.，這部分提到「我」（Woodard 小姐）聯絡了幾家不動產仲介公司，但「你們的公司」（Arturo 不動產）最快回覆，所以 (D) 是正確答案。\n變換表達方式\ngot in touch with ~ real estate agencies 聯絡不動產仲介公司 → Contacted ~ realtors 聯絡不動產仲介","vocab":"realtor n. 不動產仲介","paraphrase":""},"166":{"type":"推論 細節資訊","translation":"Woodard 小姐可能會同意哪個敘述？","reason":"這是和題目關鍵詞語 statement would Ms. Woodard ~ agree 有關的推論問題。Mr. Hamlin kept me informed during every step of the transaction. He called me regularly to let me know what was going on. 的部分提到，Hamlin 先生在交易的每個步驟都持續告訴「我」（Woodard 小姐）消息，也定期打電話告知正在進行什麼事，由此可以推知 Woodard 小姐認為 Hamlin 先生經常提供最新資訊，所以 (C) 是正確答案。\n變換表達方式\nregularly ~ let me know what was going on 定期讓我知道正在進行什麼事 → provides frequent updates 經常提供最新資訊","vocab":"extensive adj. 廣泛的，大範圍的　comply with phr. 遵守……　frequent adj. 頻繁的　conveniently adv. 便利地","paraphrase":""},"167":{"type":"wh-問題 What","translation":"Woodard 小姐對於 Arturo 不動產服務的什麼方面不滿意？","reason":"這是問 Woodard 小姐對於 Arturo 不動產服務的什麼（What）方面不滿意的 wh- 問題。和題目的關鍵詞語 aspect of Arturo Realty's service ~ Ms. Woodard unsatisfied with 有關的部分是 I would have preferred receiving more advance notice when potential buyers came to look at my house.，這部分提到希望潛在買家來看房的時候，「我」（Woodard 小姐）能更早收到通知，所以 (B) 是正確答案。","vocab":"in person phr. 當面，親自　notification n. 通知　negotiation n. 協商，談判　conduct v. 進行　confidential adj. 機密的","paraphrase":""},"168":{"type":"尋找主題／目的 寫文章的理由","translation":"Sanchez 小姐為什麼傳訊息？","reason":"這一題問的是 Sanchez 小姐傳訊息的理由，所以要注意文章開頭的部分。Sanchez 小姐在 Sales have been disappointing these last few quarters, both online and at our stores. Any ideas how we might turn things around? 的部分提到，過去幾季銷售情況令人失望，線上和店面都是，並且問有什麼能扭轉局勢的主意，所以 (A) 是正確答案。","vocab":"solicit v. 請求，徵求　strategy n. 策略　inspection n. 檢查，視察","paraphrase":""},"169":{"type":"掌握意圖","translation":"中午 12:13，Behar 先生的「That would be a great fit」意味著什麼？","reason":"這一題問的是 Behar 先生的訊息所表達的意圖，所以要掌握引用部分（That would be a great fit）前後文的情境。Behar 先生說 How about working with a celebrity on a collection of furniture and home accessories?，詢問大家對於和名人合作家具與家飾系列的意見，對此 Robert Gillibrand 提議 Fiona Connolly might work. She's a famous interior decorator.，表示 Fiona Connolly 或許可以，因為她是有名的室內設計師。Behar 先生則回應 That would be a great fit.（那會很適合的），然後又補充 Her reality television show is popular right now, and I don't think she's worked with another retail store before，表示她的電視實境節目現在很受歡迎，以及認為她以前沒跟別的零售店合作過。因此，Behar 先生要表達的意思是他同意選擇這位設計師來合作，所以 (D) 是正確答案。","vocab":"transfer v. 轉移","paraphrase":""},"170":{"type":"推論 細節資訊","translation":"關於 Shepard 小姐，可以推知什麼？","reason":"這是和題目關鍵詞語 Ms. Shepard 有關的推論問題。Shepard 小姐說 I can collaborate with her on designing new furniture pieces，表示自己可以和「她」（Fiona Connolly）合作設計新的家具，由此可以推知，Shepard 小姐負責創作設計，所以 (C) 是正確答案。\n變換表達方式\ndesigning 設計 → creating designs 創作設計","vocab":"collaboration n. 合作，協力","paraphrase":""},"171":{"type":"wh-問題 What","translation":"Sanchez 小姐想做什麼？","reason":"這是問 Sanchez 小姐想做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Sanchez want to do 有關的部分是 Sanchez 小姐所說的 We should also think of other candidates in case she turns us down，她說也應該想想其他人選，以防萬一「她」（Fiona Connolly）拒絕，所以 (B) 是正確答案。\n變換表達方式\nthink of 思考 → Come up with 想出……","vocab":"come up with phr. 想出……　alternative n. 替代方案　directly adv. 直接","paraphrase":""},"172":{"type":"尋找主題／目的 文章的目的","translation":"這封信的目的是什麼？","reason":"這一題問的是文章的目的，所以要注意文章開頭的部分。To thank you for placing regular orders of our goods, we would like to invite you to a private preview of our upcoming product line 的部分提到，為了感謝收件者定期訂購商品，所以想邀請參加即將上市的產品系列非公開預覽活動，(C) 是正確答案。\n變換表達方式\na ~ preview 預覽 → an event 活動","vocab":"host v. 主辦　function n. 活動，功能　quarterly adj. 季度的　stockholder n. 股東","paraphrase":""},"173":{"type":"推論 細節資訊","translation":"關於新系列的產品，文中暗示什麼？","reason":"這是和題目關鍵詞語 the new line of products 有關的推論問題。These items will be released early next year and have not yet been revealed to the public. 的部分提到，這些產品將在明年初發售，而且還沒有對大眾公開，由此可以推知，新系列的產品還沒有被宣傳過，所以 (A) 是正確答案。","vocab":"","paraphrase":""},"174":{"type":"Not/True Not 題型","translation":"關於預覽活動，文中沒有提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 the preview 有關的內容，並且對照選項判斷答案。(A) 在 The event will fall on November 9 的部分提到，活動將於 11 月 9 日舉行，符合選項敘述。(B) 信件頂部的 Corrigan Technology Headquarters 顯示由 Corrigan Technology 總部寄出，而 The event will fall on November 9 ~ at the address given at the top of this letter. 的部分提到，11 月 9 日將在信件頂部提供的地址舉行活動，也就是在總部舉行，不符合選項敘述，所以 (B) 是正確答案。(C) 在 To thank you for placing regular orders of our goods, we would like to invite you to a private preview of our upcoming product line. 的部分提到，為了感謝定期訂購商品，想邀請收件者參加即將上市的產品系列非公開預覽活動，符合選項敘述。(D) 在 A dinner will be served 的部分提到將供應晚餐，符合選項敘述。","vocab":"branch office phr. 分公司","paraphrase":""},"175":{"type":"wh-問題 How","translation":"參加者怎樣可以獲得優惠券？","reason":"這是問參加者怎樣（How）可以獲得優惠券的 wh- 問題。和題目的關鍵詞語 attendees receive a voucher 有關的部分是 Ticket numbers will be included in a special draw，這部分提到門票號碼將被包括在特別抽獎活動中，而中獎者將得到優惠券，所以 (D) 是正確答案。","vocab":"present v. 出示　questionnaire n. 問卷","paraphrase":""},"176":{"type":"wh-問題 Why","translation":"根據通知，為什麼有些物品被搬到 3 樓了？","reason":"這是問根據通知（第一篇文章），為什麼（Why）有些物品被搬到 3 樓的 wh- 問題。To protect the objects in our collection during the renovation, we have moved many of them to a third-floor storage room. 的部分提到，為了在整修期間保護收藏品，已經將其中許多搬到 3 樓儲藏室，所以 (B) 是正確答案。","vocab":"exhibit n. 展示　restore v. 復原，恢復　respond v. 回應，回覆　seasonal adj. 季節的　drop n. 減少，下跌 v. 掉落","paraphrase":""},"177":{"type":"wh-問題 What","translation":"Lin 先生會跟董事會討論什麼？","reason":"這是問 Lin 先生會跟董事會討論什麼（What）的 wh- 問題，所以要從提到和董事會討論的通知（第一篇文章）找出和題目關鍵詞語 Mr. Lin discuss with the board of trustees 相關的內容。museum director Ken Lin will meet with the board of trustees and decide on the date of our reopening 的部分提到，博物館館長 Ken Lin 將和董事會開會，決定重新開放的日期，所以 (C) 是正確答案。\n變換表達方式\nthe date of ~ reopening 重新開放的日期 → When operations will resume 營運什麼時候恢復","vocab":"resume v. 恢復，繼續","paraphrase":""},"178":{"type":"Not/True True 題型","translation":"關於 Smith 小姐，文中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Ms. Smith 有關的內容，並且對照選項判斷答案，所以看寄給 Smith 小姐的電子郵件（第二篇文章）的內容。(A)、(B)、(C) 在文章中沒有提到。(D) 在 you scheduled a visit to Ludlow Nautical Museum ~ for a group of senior citizens 的部分提到，「您」（Smith 小姐）安排了年長者團體在下週二參觀 Ludlow 航海博物館，符合選項敘述，所以 (D) 是正確答案。\n變換表達方式\nscheduled a visit 安排參觀 → planned an outing 計畫了出遊","vocab":"volunteer v. 志願服務 n. 志工　supervise v. 監督　outing n. 出遊","paraphrase":""},"179":{"type":"wh-問題 多篇文章對照題型","translation":"Lin 先生推薦什麼？","reason":"這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 Mr. Lin recommend，要問 Lin 先生推薦什麼（What），所以先看 Lin 先生所寫的電子郵件。\n線索1：電子郵件（第二篇文章）中，We hope that you are able to arrange an outing to a different site ~. My personal recommendation is Crescent Bay Aquarium. 的部分提到，希望星期二能將出遊安排在不同的地點，且推薦 Crescent Bay 水族館。不過，這裡沒有提到 Crescent Bay 水族館的其他細節，所以還需要參考通知的內容。\n線索2：通知（第一篇文章）中，Crescent Bay Aquarium, which is ~ operated by the Ludlow Tourism Organization 的部分提到 Crescent Bay 水族館由 Ludlow 觀光組織營運。\n綜合這兩個線索，可知 Lin 先生推薦前往 Ludlow 觀光組織營運的 Crescent Bay 水族館，所以 (A) 是正確答案。","vocab":"","paraphrase":""},"180":{"type":"推論 多篇文章對照題型","translation":"Smith 小姐最有可能收到什麼？","reason":"這是需要對照兩篇文章內容的推論題型，先看和題目的關鍵詞語 Ms. Smith ~ receive 有關的電子郵件。\n線索1：電子郵件（第二篇文章）中，you scheduled a visit to Ludlow Nautical Museum next Tuesday ~ 的部分提到，安排了下週二參觀 Ludlow 航海博物館，然後 the museum had to close for renovations 又提到博物館必須關閉進行整修。不過，這裡沒有提到無法去博物館時會收到什麼，所以還需要參考通知的內容。\n線索2：通知（第一篇文章）中，a free key chain from our souvenir store will be mailed to each guest whose advance reservation has been canceled 的部分提到，將會郵寄紀念品店的免費鑰匙圈給被取消事先預約的每位來賓。\n綜合這兩個線索，可知 Smith 小姐因為參觀的預約被取消了，所以會收到紀念品店的鑰匙圈，(B) 是正確答案。","vocab":"refund v. 退款　deposit n. 押金，保證金　invoice n. 發票","paraphrase":""},"181":{"type":"尋找主題／目的 文章的目的","translation":"備忘錄的目的是什麼？","reason":"這一題問的是備忘錄（第一篇文章）的目的。在備忘錄中，I'd like to remind you of a few details concerning our annual evaluations for staff members 的部分提到，要提醒一些關於年度員工評價的細節，之後就詳細說明相關事項，所以 (D) 是正確答案。","vocab":"clarify v. 闡明　job opening phr. 職缺　procedure n. 程序","paraphrase":""},"182":{"type":"Not/True True 題型","translation":"關於人事部的員工，文中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 human resources staff 有關的內容，並且對照選項判斷答案，所以看提到人事部的備忘錄（第一篇文章）。(A) 在 human resources staff will be e-mailing you information about each member of your team including their start dates at the company and their past evaluation results 的部分提到，人事部員工將會用電子郵件寄送團隊中每個成員的資訊，其中包括他們進公司的日期和過去的評價結果，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章中沒有提到。","vocab":"screen v. 篩選　payroll n. 薪水帳冊，發薪","paraphrase":""},"183":{"type":"wh-問題 What","translation":"根據 Malone 小姐的說法，Cullen 小姐可以做什麼？","reason":"這是問根據 Malone 小姐的說法，Cullen 小姐可以做什麼（What）的 wh- 問題，所以要從 Malone 小姐所寫的備忘錄（第一篇文章）找出相關的內容。備忘錄中的 TO: All team leaders 顯示這是寫給所有團隊領導人看的，而 For questions or concerns, get in touch with Gail Cullen in the human resources department. 的部分提到，如果有問題或在意的事，請聯絡人事部的 Gail Cullen，由此可知 Gail Cullen 會答覆管理者的詢問，所以 (C) 是正確答案。","vocab":"candidate n. 人選　technical adj. 技術上的　inquiry n. 諮詢　approve v. 批准　promotion n. 升職","paraphrase":""},"184":{"type":"同義詞","translation":"在電子郵件中，第 2 段第 1 行的單字「figure」，意思最接近","reason":"在電子郵件（第二篇文章）中，figure 所在的語句 I figure she deserves a raise for being such a valuable member of my team. 之中，figure 表示「認為」的意思，所以同樣能表示「認為」的 (C) 是正確答案。","vocab":"","paraphrase":""},"185":{"type":"wh-問題 多篇文章對照題型","translation":"什麼因素使得 Barrie 小姐沒有資格獲得加薪？","reason":"這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 factor makes Ms. Barrie ineligible for a raise，要問什麼（What）因素使得 Barrie 小姐沒有資格獲得加薪，所以先看提到加薪資格的備忘錄。\n線索1：備忘錄（第一篇文章）中，If an employee receives a positive performance evaluation and has not gotten a raise or bonus within the past three months, that staff member is eligible for a 5.5 percent salary increase. 的 document.addEventListener('keydown', function(event) {
  const target = event.target;
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      target?.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(target?.tagName)) return;
  if (window.getSelection()?.toString()) return;
  // 鍵盤：←／Z 上一題，→／X 下一題；輸入欄位和文字選取時不啟用。
  const key = event.key.toLowerCase();

  } else if ((key === 'arrowleft' || key === 'z') && !$('#prev').disabled) {
    event.preventDefault(); $('#prev').click();
  }
});

// 手機僅在題幹、答案選項與答案解析區域左右滑動切題。

let swipeStart = null;
const swipeArea = '#quiz .stem, #quiz .answers, #quiz .feedback, #quiz .undo-answer-row';
const quizTouch = document.getElementById('quiz');
quizTouch.addEventListener('touchstart', event => {
  swipeStart = null;
  if (event.touches.length !== 1 || !event.target.closest(swipeArea)) return;
  if (event.target.closest('a, input, textarea, select')) return;
  const touch = event.touches[0];
  swipeStart = {x:touch.clientX, y:touch.clientY, time:Date.now()};
}, {passive:true});
quizTouch.addEventListener('touchend', event => {
  if (!swipeStart || event.changedTouches.length !== 1) {swipeStart=null;return;}
  const start = swipeStart; swipeStart=null;
  const touch=event.changedTouches[0];
  const dx=touch.clientX-start.x, dy=touch.clientY-start.y;
  // 至少水平移動 65px，且水平位移須明顯大於垂直位移。
  if (Math.abs(dx)<65 || Math.abs(dx)<Math.abs(dy)*1.6 || Date.now()-start.time>1500) return;
  if (window.getSelection()?.toString()) return;
  if (dx<0 && !$('#next').disabled) $('#next').click();
  else if (dx>0 && !$('#prev').disabled) $('#prev').click();
}, {passive:true});
quizTouch.addEventListener('touchcancel',()=>{swipeStart=null;},{passive:true});

function csvCell(x){const t=String(x??'');return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function parseCsv(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quotes=false;for(let i=0;i<text.length;i++){let c=text[i];if(quotes){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quotes=false;else field+=c}else if(c==='"')quotes=true;else if(c===','){row.push(field);field=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(quotes)throw Error('CSV 引號未關閉');row.push(field);if(row.some(x=>x!==''))rows.push(row);return rows}
$('#export').onclick=()=>{const rows=[CSV_HEADER];for(const q of QS){const r=records[q.id];if(!r)continue;rows.push([q.id,q.part,r.choice,q.answer,r.correct===true?'正確':r.correct===false?'錯誤':'未核定',r.at||''])}const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toeic-作答紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#importCsv').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCsv(await file.text());if(!rows.length||rows[0].slice(0,6).join('|')!==CSV_HEADER.join('|'))throw Error('欄位格式不符，請使用本網站匯出的 CSV');const incoming={};for(let i=1;i<rows.length;i++){const r=rows[i],id=Number(r[0]),q=QS.find(x=>x.id===id),choice=(r[2]||'').trim();if(r.length<6||!q||!/[A-D]/.test(choice)||choice.length!==1||String(q.part)!==r[1].trim())throw Error('第 '+(i+1)+' 列的題號、Part 或選項有誤');if(r[3].trim()!==q.answer)throw Error('第 '+(i+1)+' 列答案版本不同，已停止匯入');incoming[id]={choice,correct:q.answer?choice===q.answer:null,at:r[5]||''}}const count=Object.keys(incoming).length;if(!confirm('CSV 有 '+count+' 筆有效作答紀錄。匯入後會覆蓋相同題號的現有作答，其餘題目保留。是否繼續？'))return;await window.toeicCloud.importAnswers(incoming);mode='all';index=0;setTabs();render();alert('已成功匯入 '+count+' 筆紀錄。')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};render();

window.toeicApplyRemote=function(answers,starMap,excerptMap){records=answers;collectWrongAnswers();stars=starMap;excerpts=excerptMap||{};render()};
window.toeicClearRemote=function(){records=JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}')||{};collectWrongAnswers();stars=JSON.parse(localStorage.getItem(LOCAL_STAR_KEY)||'{}')||{};excerpts=JSON.parse(localStorage.getItem(LOCAL_EXCERPT_KEY)||'{}')||{};mode='all';index=0;showOverview=false;setTabs();render()};
</script>
<script>
/* Browser-offline fallback: Firebase is optional, local practice always works. */
(function(){
  if(window.toeicCloud) return;
  function persist(){
    localStorage.setItem(LOCAL_KEY,JSON.stringify(records));
    localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));
    localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts));
  }
  window.toeicCloud={ready:true,mode:'local',
    saveAnswer:async(id,data)=>{records[id]=data;persist();render()},
    deleteAnswer:async(id)=>{delete records[id];persist();render()},
    setStar:async(id,marked)=>{if(marked)stars[id]=true;else delete stars[id];persist();render()},
    saveExcerpts:async(id,items)=>{if(items.length)excerpts[id]=items;else delete excerpts[id];persist();render()},
    importAnswers:async(items)=>{records={...records,...items};persist();render()},
    resetAnswers:async()=>{records={};persist();render()}
  };
})();
</script>
<script id="reading-gate-script">(function(){const gate=document.getElementById('readingAccessGate'),input=document.getElementById('rgCode'),button=document.getElementById('rgEnter'),status=document.getElementById('rgStatus'),notice=document.getElementById('cloudNotice'),account=document.getElementById('accountCode');function lock(){document.body.classList.add('read-locked');gate.hidden=false;button.disabled=false}function unlock(){document.body.classList.remove('read-locked');gate.hidden=true;button.disabled=false}window.readingGate={lock,unlock};button.addEventListener('click',()=>{const code=input.value.trim();if(!code||code.length>32){status.textContent='請輸入使用者代號。';return}account.value=code;button.disabled=true;status.textContent='正在驗證代號並載入 Firebase 雲端資料…';document.getElementById('connectCode').click()});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();button.click()}});const observer=new MutationObserver(()=>{if(!gate.hidden){status.textContent=notice.textContent||'正在驗證…';if(!/正在載入|連線中|請不要作答/.test(notice.textContent))button.disabled=false}});observer.observe(notice,{childList:true,characterData:true,subtree:true});lock()})();</script><script type="module">
