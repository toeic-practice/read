<span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-translation\"><div class=\"doc-ribbon\"><span>廣告</span><small>131-134</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">時尚騎行</h2>\n<p>如果你熱愛騎自行車，現在就該選擇 Bango。我們的安全帽不僅時尚，還能保護你的安全。安全帽採用三層堅固耐用的材料製作，具有優異的衝擊吸收能力，符合國家安全委員會的要求。它們也為經常騎車的人提供便利。例如，安全帽可以整齊折疊成小巧的尺寸，方便收納。今天就試用 Bango 安全帽吧！現在購買就能享有特別優惠。若以原價購買一頂安全帽，第二頂可享五折優惠。請瀏覽 www.bangohelmets.com，和 Bango 一起展開下一趟自行車旅程。</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>135-138</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Hampton Institute accountmanage@hamptoninstitute.org</span></div><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Kate Whitman k.whitman@braxton.ca</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">付款方案</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">5 月 25 日</span></div></div>\n<p>親愛的 Whitman 小姐：</p>\n<p>這封訊息是要確認您已報名 Hampton Institute 於 6 月 30 日至 8 月 31 日舉辦的程式設計研習班。由於您選擇分期付款，我們將每月向您收費。第一張發票將於 7 月 1 日以電子郵件寄出。您隨時可以變更付款方案，只要登入帳戶並選擇「變更方案」即可；您也可以在此處變更。請注意，我們提供的最長付款方案為 18 個月。如果您遇到任何困難，請立即寄電子郵件給我，我很樂意協助。</p>\n<p>敬上， Hampton Institute 帳戶管理團隊</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>公告</span><small>139-142</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Lake 郡動物協會將舉辦募款大會</h2>\n<p class=\"notice-subject\">Lake 郡動物協會感謝大家多年來的貢獻。139 這些貢獻讓組織得以為數百隻動物提供食物與住處。</p>\n<p>請參加我們 12 月 11 日在 Morrissey Civic 中心的募款大會。這將會是個有良善目標、好玩的夜晚。140 我們將招待參加者享受晚餐與現場娛樂表演。入場券每張只要 100 元就能購買。141 活動收入將主要用於修繕本團體在 Willoughby 的設施，因為建築物的屋頂需要替換。142 不過，一部分收入也將用於擴大鼓勵人們在我們的收容所擔任志工的計畫。這些活動對於維持社區對我們工作的認知是必要的。</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>公告</span><small>143-146</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Jefferson 運動中心通知</h2>\n<p>143 從 4 月 8 日開始，室內游泳池將關閉一週。游泳池需要完全將水排空，然後清掃、修繕並且消毒。這是為每個人提供安全、衛生的環境而必須進行的年度程序。144 在這段時間，其他室內設施可以繼續使用。145 這些設施包括三溫暖、健身房與養生會館。室外游泳池也可以使用。我們對於這項工作可能造成的任何不便致歉。146 工作完成後，就會恢復正常營運。想知道更多消息與更新資訊，請在社交媒體上追蹤我們。</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-translation\"><div class=\"doc-ribbon\"><span>廣告</span><small>147-148</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">大部分的化妝品都會讓您起疹子或皮膚發癢嗎？Betteskin Cosmetics 公司正在找人來測試專為敏感肌的人所設計的新產品系列。</h2>\n<p>要報名參加，請上 www.betteskin.com。請在 6 月 30 日前回答簡短的線上問卷調查，幫助我們判定您的肌膚問題。我們會將產品試用品連同詳細說明寄到您家。每件產品都必須測試一週。作為回報，參加者將得到我們網站的 25 元優惠券。</p></div></section></div>","149-151":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 149-151</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>公告</span><small>149-151</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">給 Charlotte 食品雜貨店所有購物客的通知</h2>\n<p class=\"notice-subject\">Charlotte 食品雜貨店已經停止 Hero Coco Water 在店面的販售。由於在全世界的產品回收，這項商品目前無法取得，但只要回收命令解除就會重新進貨。</p>\n<p>目前，我們推薦試試看 Cocolait 與 Biba 品牌的椰子水。我們全國的店面都有販售這兩個品牌。與我們店面販售的所有產品相同，它們經過有機認證機構的認證，並且符合所有食品安全監管的要求。</p>\n<p>很抱歉造成不便。關於此事有任何疑慮，請到離您最近店面的顧客服務台。請記得在 www.charlottegrocer.com 註冊您的電子郵件位址，以獲得我們包含促銷優惠的每週電子報。</p></div></section></div>","152-153":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 152-153</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>對話訊息</span><small>152-153</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Christina Sanchez</strong><time class=\"chat-time\">[中午12:23]</time></div><div class=\"message-text\">Kenichi，可以請你延後我下午的會議嗎？我正在和 Kim 小姐吃午餐，她似乎準備好對 Lakewood 的房子出價了。所以，我不久就會開車載她到那間房子，希望我們會簽約。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kenichi Yamamoto</strong><time class=\"chat-time\">[中午12:24]</time></div><div class=\"message-text\">真是好消息。好，我可以把 Zhou 先生改到明天上午。你上午 9 點有空檔。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Christina Sanchez</strong><time class=\"chat-time\">[中午12:26]</time></div><div class=\"message-text\">我可以。請直接打電話給 Zhou 先生，不要寄電子郵件，因為這是臨時的變更。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kenichi Yamamoto</strong><time class=\"chat-time\">[中午12:27]</time></div><div class=\"message-text\">我會的。我面前有他的電話號碼。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Christina Sanchez</strong><time class=\"chat-time\">[中午12:29]</time></div><div class=\"message-text\">非常感謝你。除非有急事，不然請對其他任何打電話來的人都說我明天會回公司。</div></div></div></div></section></div>","154-155":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 154-155</span></div><div class=\"reading-stack\"><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>154-155</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Dennis Gunther d.gunther@bauerhoffarms.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Karina Schneider k.schneider@bauerhoffarms.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">最近的作物</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">8 月 19 日</span></div></div>\n<p>親愛的 Dennis：</p>\n<p>這一季，我們收穫的番茄似乎異常地多。數量遠遠超過我們的固定客戶在這一季開始前同意購買的。所以，我們需要想出賣掉多餘部分的方法。目前，我正在製作或許能在臨時通知的情況下接收我們多餘農作物的餐廳、飯店與小型食品雜貨店列表。同時，我希望你在我們本地的農夫市集販賣比平常更多的量。如果你認為有助於我們賣出更多番茄，就儘管降價。如果到了這禮拜的結尾，我們還是有太多番茄的話，我們可以把剩下的捐給社區中心或慈善團體。告訴我你是否有其他主意。我希望我們能將利潤最大化。</p>\n<p>Karina</p></div></section></div>","156-157":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 156-157</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>文章</span><small>156-157</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">共享經濟正走向盡頭？</h2>\n<p>4 月 23 日— 孟買正在採取措施，處理所謂共享經濟中的公司問題。昨天，孟買當局發布了針對公寓共享應用程式 Househunt 與運輸服務 CallAuto 之類公司的新規定。這兩家公司和其他類似公司，現在必須符合更嚴格的要求，才能在市內營運。例如，Househunt 將必須符合與市內飯店相同的衛生與安全標準，並且可能被限定於特定地區。至於 CallAuto，它將必須以對正職員工的方式對待它的司機，並且提供他們有薪假與健康保險。受影響的公司曾主張這些措施會傷害獲利能力。不過，官員反駁說，這些規定對於改善公眾安全與福利是必要的。</p></div></section></div>","158-161":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 158-161</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement type-translation\"><div class=\"doc-ribbon\"><span>廣告</span><small>158-161</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">介紹 Peacelid</h2>\n<p>Peacelid 是販賣可重複使用的杯子、吸管、用具的環保公司。我們的產品由 100% 竹子製造。Peacelid 的產品也是可生物分解的，所以它們在被丟棄後會安全且自然地分解。</p>\n<p>此外，Peacelid 提倡環保消費的實踐，並且將每次購買的 3% 捐給積極預防濫伐森林的組織。</p>\n<p>請上 www.peacelid.com 查看我們的產品目錄。新顧客第一次訂購可以在結帳頁面輸入代碼「PEACE20」享受 20% 折扣。此外，每筆 200 元以上訂單將附送免費可重複使用吸管。</p></div></section></div>","162-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 162-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>公告</span><small>162-164</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Gymspan 的顧客請注意</h2>\n<p class=\"notice-subject\">8 月開始，訂閱了 Gymspan 應用程式的使用者將無法在它的附屬健身中心網絡利用無限運動服務。我們對這項變更致歉，但這是必要的成本削減措施。</p>\n<p>目前加入無限量會員方案的顧客，可以繼續使用會員福利到目前的收費週期結束為止。之後，將自動被轉移到另一個方案。— [1] —。為了彌補這個改變，Gymspan 將贈送 500 點忠誠點數，它可以用來購買其他產品與服務。— [2] —。</p>\n<p>此外，Gymspan 已經對應用程式做了些改善。每個月，顧客都可以選擇輕鬆地轉換方案。您也可以在出國時暫時停止付款。— [3] —。最後，您有更多快速賺點數的方法。這些改善的用意是讓 Gymspan 的會員資格真正具有彈性，並且回應您的需求。— [4] —。欲知更多資訊，請上 www.gymspan.com，或者今天就下載應用程式。</p></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>信件</span><small>165-167</small></div><div class=\"document-body source-passages\"><p>11 月 20 日</p>\n<p>Bernard Davidson Whitfield 路 180 號 愛德蒙頓，亞伯達省 T5A 0A2</p>\n<p>親愛的 Davidson 先生：</p>\n<p>恭喜！在審閱您的申請資料後，我們決定頒發工程學學生的 Clark Newman 獎學金給您。這將能讓您在亞伯達技術學院追求機械工程學位時，獲得全額學費補助。</p>\n<p>如您所知，這項獎學金每年只頒發給 5 名申請者。申請者是依據其傑出的學業成績與對工程學的熱情而選出的。所有獲獎者是從超過 1,000 名申請者中選出的。</p>\n<p>在亞伯達技術學院的第一年，您會和其他工程學學生一起住在 Kensing House 這間小宿舍。它位於離工程大樓本館 Mitchell 館只有幾步路的地方。下週，我們會寄給您學生證和更多關於您居住環境的資訊。再次恭喜您！</p>\n<p>Donald Neilson 工程學院院長 亞伯達技術學院</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>文章</span><small>168-171</small></div><div class=\"document-body source-passages\"><p>聖莫尼卡（3 月 30 日）— 過去幾個月，一家提供客製化香水的新概念商店吸引了許多關注。它位於第 3 街觀光客頻繁往來的地點。顧客可以創造自己的香水，或者從數十種有獨特香氣組合的預製香水中購買。所有香水都使用天然精油。</p>\n<p>過去 4 年，店主 Sarah McKellen 靠著她關於香水的影片在社交媒體上培養了一群追隨者。— [1] —。去年，她開始在網路販賣她的創作。這項新創事業的成功，促使她在 1 月開設了第一家 Freesha 店面。令她驚訝的是，她在一週之內賣完了所有庫存。— [2] —。</p>\n<p>根據 McKellen 小姐的說法，大部分顧客喜歡創作香水這個主意。— [3] —。因此，她增設了最多可以讓 4 名來客同時觀看香水製作過程的小房間。未來 McKellen 小姐計畫擴展空間，以便舉辦較大團體的實作工作坊。— [4] —。</p></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>對話訊息</span><small>172-175</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">上午9:22</time></div><div class=\"message-text\">如你們所知道的，明天有為我們的植物園舉辦的重大募款活動。可以的話，我希望你們兩個在傍晚 6 點之前到。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sarah Chen</strong><time class=\"chat-time\">上午9:24</time></div><div class=\"message-text\">當然好。其實我打算提早到那裡。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Frank Daniels</strong><time class=\"chat-time\">上午9:27</time></div><div class=\"message-text\">我要到接近開始時間的時候才能到場，因為我必須在 Fry Factory 工作到傍晚 6:30。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">上午9:28</time></div><div class=\"message-text\">OK，謝謝你告訴我，Frank。Sarah，既然你會提早到，我想知道你能不能幫我擺設桌椅。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sarah Chen</strong><time class=\"chat-time\">上午9:30</time></div><div class=\"message-text\">我很樂意。我們決定好佈局配置了嗎？</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">上午9:31</time></div><div class=\"message-text\">好了。我會把房間應該呈現什麼樣子的圖片用電子郵件寄給你。Frank，既然你會在開始時間左右到這裡，可以請你在入口分發節目單嗎？</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Frank Daniels</strong><time class=\"chat-time\">上午9:32</time></div><div class=\"message-text\">好啊，當然。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">上午9:34</time></div><div class=\"message-text\">準備好迎接參加者，並且幫忙他們處理關於活動或如何捐款的任何問題。</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Frank Daniels</strong><time class=\"chat-time\">上午9:35</time></div><div class=\"message-text\">知道了。我會在傍晚 6:45 前到那裡，也就是活動開始的 15 分鐘前。</div></div></div></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>176-180 · 1</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Olivia Brunelli olivia@nathalieresort.fr</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Roger Keller roger.keller@lowefinances.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">3 月 21 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">詢問</span></div></div>\n<p>親愛的 Brunelli 小姐：</p>\n<p>去年休假期間，我偶然發現您在羅謝莫爾美麗的僻靜度假場所。我當時預約了按摩，也十分享受那次經驗。我負責籌辦公司今年 5 月的旅遊，想要跟您預約。我們會迎接幾名來自海外的投資者，並且想要集體在那裡度過放鬆的時光。</p>\n<p>我們將在 5 月 3 日到 7 日住宿度假村。我們會在 5 月 3 日比較晚的晚上抵達，並且在 5 月 7 日比較早的時候離開。您可以為我們的投資者預約 5 月 4 日的 spa 療程嗎？他們總共有 8 個人。在那之後是晚餐。如果天氣允許的話，我們想要坐在室外安靜的區域。</p>\n<p>在旅行期間，我們需要 12 間單人房。我們也對品酒和參觀薰衣草農園有興趣。</p>\n<p>請回覆這封電子郵件，告訴我這一切是否都可行。期待和您進一步檢討預約的內容。</p>\n<p>Roger Keller Lowe Finances 公司</p></div></section><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>176-180 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Roger Keller roger.keller@lowefinances.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Olivia Brunelli olivia@nathalieresort.fr</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">3 月 25 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">您的詢問</span></div></div>\n<p>Keller 先生：</p>\n<p>感謝您很棒的訊息。我很高興您上次造訪時過得很愉快。很開心跟您報告，我們可以為您的團體提供住宿。我們可以為您的晚餐預留整個室外區域。不過，如果您（的安排）有彈性的話，這必須改到隔天晚上。您提出的日期已經被預約了。當然，我們也有室內的用餐空間。</p>\n<p>此外，我們同時只能接受 6 個 spa 預約。關於其他活動，可以在您到達以後預約。</p>\n<p>請告訴我們您希望如何進行。</p>\n<p>Olivia Brunelli 度假村經理 Nathalie 度假村與 spa</p></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單</span><small>181-185 · 1</small></div><div class=\"document-body source-passages\"><p>表單</p>\n<p>所有入境乘客都必須填妥下表。如果您和家人一起旅行，請填寫一張代表團體。入境時，請向海關人員連同護照出示本表。</p>\n<div class=\"responsive-table\"><table><tr><th>欄位</th><th>填寫內容</th></tr><tr><td>姓</td><td>Larson</td></tr><tr><td>名</td><td>Harry</td></tr><tr><td>中間名</td><td>Hughes</td></tr><tr><td>同行家人數</td><td>3</td></tr><tr><td>住址</td><td>Pingree 路 88 號，史丹福，康乃狄克州 06831</td></tr><tr><td>護照發行國家</td><td>美國</td></tr><tr><td>本次旅行拜訪國家</td><td>西班牙、葡萄牙</td></tr></table></div><p class=\"form-answer\">本次旅行目的：□ 商務　□ 度假　☑ 其他</p>\n<div class=\"field-row\">□ 商務</div>\n<div class=\"field-row\">□ 度假</div>\n<div class=\"field-row\">☑ 其他</div>\n<p>其他目的請說明：我的家人和我飛到西班牙幫爸爸搬進新家。然後我們去葡萄牙進行了短暫的觀光。</p>\n<p>您是否攜帶任何水果、肉類或動物？</p>\n<div class=\"field-row\">□ 是</div>\n<div class=\"field-row\">□ 否</div>\n<p>若是，請在此列出：不適用</p>\n<p>簽名：Harry Larson</p></div></section><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>181-185 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">Harry Larson harrylarson@worldmail.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">顧客服務 service@internationalairlines.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">回覆：要求</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">7 月 28 日</span></div></div>\n<p>親愛的 Larson 先生：</p>\n<p>謝謝您寫信告訴我們您遺失了旅行袋。在大範圍搜尋後，我們終於找到它，而我們將會寄送到您的住家地址。很抱歉造成您的不便。</p>\n<p>為了補償您遺失旅行袋這件事，我們會在您的帳戶增加 8,000 個飛行點數。根據我們的紀錄，這意味著您現在有資格兌換一組國內來回機票。您可以隨時利用這個優惠。要使用這個優惠，請上我們的網站，並且在結帳過程中點擊「兌換我的飛行點數」。</p>\n<p>國際航空公司客服部</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-brochure type-translation type-catalog\"><div class=\"doc-ribbon\"><span>介紹手冊</span><small>186-190 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Mario's 地中海料理外燴服務</h2>\n<p>Mario's 已經營業超過 30 年。它仍然為創辦人 Mario Robledo 所擁有，但目前由他的弟弟 Sandro 經營。這家外燴公司供應種類廣泛的菜色。另外，它在 Market 街 7738 號還擁有包括室內與室外座位的活動空間。室外露台在 5 月 1 日至 9 月 30 日間開放。</p>\n<p>Mario's 也可以配合所有飲食需求與食物過敏的情況。</p>\n<p>可利用的菜單如下：</p>\n<div class=\"responsive-table\"><table><thead><tr><th>菜單</th><th>菜色種類</th><th>每人價格</th></tr></thead><tbody><tr><td>菜單 A</td><td>2 道開胃菜、2 道主菜、1 道甜點</td><td>30 元</td></tr><tr><td>菜單 B</td><td>菜單 A + 1 道開胃菜</td><td>35 元</td></tr><tr><td>菜單 C</td><td>菜單 B + 1 道主菜</td><td>40 元</td></tr><tr><td>菜單 D</td><td>菜單 C + 1 道甜點</td><td>45 元</td></tr></tbody></table></div>\n<div class=\"field-row\">* 40 人以上團體適用 20% 折扣</div>\n<p>除非另外標示，不然所有菜單都包含蔬菜選項。如果有特別要求，或者要完成預訂，請上 www.marios.com。</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單</span><small>186-190 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Mario's 外燴申請表</h2>\n<p>聯絡人姓名：Marissa Thomas 團體：Madison 私人銀行 電子郵件：m.thomas@madisonprivatebank.com 活動日期：8 月 28 日 活動時間：傍晚 7 點 賓客人數：45</p>\n<p>設施：Mario's X 其他 其他地點請在此說明：Madison 私人銀行辦公室</p>\n<p>偏好菜單： 菜單 A 菜單 B 菜單 C 菜單 D X</p>\n<p>備註： 我不記得我們在去年的活動吃了哪些菜，但非常美味。今年的客戶感謝晚宴來點不太一樣的也不錯，什麼都可以。請務必包含至少一份純素開胃菜和主菜。</p></div></section><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>186-190 · 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">團隊</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Marissa Thomas</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">8 月 25 日</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">即將到來的晚宴</span></div></div>\n<p>我想提醒各位，我們的年度客戶感謝晚宴在 9 月 3 日星期三舉行。請注意日期變更了。我們預期這次大部分是新客戶，我也相信他們會喜歡供應的東西。其中一位客戶 Kim 小姐是純素食者，所以我確保了會有她可以吃的一份主菜和一份開胃菜。而且，除了一般的點心以外，我也追加了我認為你們都會喜歡的水果拼盤。請務必穿著正式服裝，因為這被認為是商務場合。期待在那裡見到各位。</p></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-email type-translation\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>191-195 · 1</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">收件者</span><span class=\"mail-value\">全體員工 staff@craftmagazine.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">寄件者</span><span class=\"mail-value\">Alicia Mendez a.mendez@craftmagazine.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">主旨</span><span class=\"mail-value\">搬遷</span></div><div class=\"mail-row\"><span class=\"mail-key\">日期</span><span class=\"mail-value\">4 月 23 日</span></div></div>\n<p>親愛的員工：</p>\n<p>在漫長的尋找之後，我們終於決定了這家雜誌社新的辦公室。它是位於奧爾斯頓 Grant 街 82 號 5 樓的辦公室。它比我們目前的地點寬敞許多，所以能容納我們過去幾週雇用的新寫手與廣告宣傳員工。此外，它位於公車站附近，樓下有披薩店，也有眺望美麗的 Charles 河的窗景。</p>\n<p>我們將在租約開始的 5 月 1 日開始搬到新的辦公室。如果你在那個星期六有空，而且能幫忙的話，請告訴我。我原本會租兩輛卡車，但如果有人有大型廂型車或皮卡車能讓我們使用，我就只需要租一輛。如果有可以使用的車輛，請馬上告訴我。</p>\n<p>Alicia Mendez 總編輯，Craft 雜誌社</p></div></section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>表單</span><small>191-195 · 2</small></div><div class=\"document-body source-passages\"><p>www.bostontruckhire.com</p>\n<p>波士頓卡車租用</p>\n<div class=\"responsive-table\"><table><tr><th>租車項目</th><th>填寫內容</th></tr><tr><td>姓名</td><td>Alicia Mendez</td></tr><tr><td>電話號碼</td><td>555-9182</td></tr><tr><td>駕照號碼</td><td>013403412</td></tr><tr><td>租用日期</td><td>5 月 1、2 日</td></tr><tr><td>車輛數</td><td>1</td></tr><tr><td>預估行駛距離</td><td>10 英里</td></tr><tr><td>領車地點</td><td>Cooper 街 32 號，波士頓</td></tr><tr><td>還車地點</td><td>West Harding 街 918 號，波士頓</td></tr><tr><td>備註</td><td>目前，我需要用車 48 小時。如果我決定使用更長的時間，我會通知工作人員。</td></tr></table></div></div></section><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>網頁</span><small>191-195 · 3</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">波士頓 &gt; 分類廣告 &gt; 出售</h2>\n<p>Craft 雜誌正在搬往新地點，並更換設備，所以我們有一些物品要出售。其中包括 DX 彩色印表機、XRM6 傳真機、機齡 5 年的 Vista Plus 筆記型電腦、20 吋電腦螢幕、5 個鍵盤。如果您對這些物品有興趣，請寄信到 a.mendez@craftmagazine.com 聯絡 Alicia Mendez。價錢可以商量。我們甚至願意免費贈送一些物品。請注意，這些物品要到我們搬遷的第三天，也就是最後一天的 5 月 3 日才能取走。那一天我們會把最後一批東西裝進搬家卡車，並且永久關閉我們的舊辦公室。</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>網頁</span><small>196-200 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">關於 Rolando Esteban</h2>\n<p>Rolando Esteban 是一位視覺藝術家，他因為俐落的筆刷線條、動態的構圖與生動的色彩而贏得了讚賞。</p>\n<p>成長於馬尼拉，Esteban 先生接觸了各種形式的美國流行文化，並且受到著名漫畫插畫家 Chad Grohl 的啟發。Esteban 先生自學畫畫，儘管缺少正式訓練，他還是創作了許多代表性的電影與旅遊海報。他在 30 歲時離開馬尼拉，到馬德里追求繪畫獎學金，他最終在那裡發展了自己標誌性的繪畫風格。</p>\n<p>現在，馬德里的 Vivi 美術館將舉辦涵蓋 Esteban 先生後期作品的展覽。名為「Brush and Line」的這場展覽預定 8 月 21 日舉行開幕茶會，並且在 8 月 22 日開放大眾參觀。</p></div></section><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>備忘錄</span><small>196-200 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Vivi 視覺藝術美術館 備忘錄</h2>\n<p>收件者：Leon Aguilar 寄件者：Esther Hernandez 主旨：Brush and Line 日期：7 月 20 日</p>\n<p>我們必須將「Brush and Line」改期，因為展覽廳必須進行一些短暫的整修。我們唯一能安排這項工程開始的時間是開幕茶會當天。我跟藝術家談過了，他同意了 8 月 30 日這個新的開幕日期。這意味著我們必須把開幕茶會的日期改到 8 月 28 日。下一場預定的展覽也必須改期，所以我希望你跟那位藝術家溝通，看看哪些新日期是可以接受的。</p></div></section><section class=\"document-card type-schedule type-translation\"><div class=\"doc-ribbon\"><span>日期表</span><small>196-200 · 3</small></div><div class=\"document-body source-passages\"><p>Vivi 視覺藝術美術館 展覽檔期表</p>\n<p>美術館開放時間為週二至週六上午 10 點至下午 6 點。開幕茶會於週一下午 6 點至晚間 8 點舉行。</p>\n<p>7 月 12 日至 7 月 29 日 Delia Romano: Of One Mind 開幕茶會 7 月 10 日</p>\n<p>8 月 2 日至 8 月 19 日 Tom Moskowitz: Ba Bi Bo Bu 開幕茶會 7 月 31 日</p>\n<p>8 月 30 日至 9 月 20 日 Rolando Esteban: Brush and Line 開幕茶會 8 月 28 日</p>\n<p>9 月 27 日至 10 月 14 日 Remy Artaud: Up is Down 開幕茶會 9 月 25 日</p></div></section></div>"};const DETAILED_EXPLANATIONS={"101":{"type":"反身代名詞","translation":"透過投資退休金計畫，預先為自己的退休生活做好準備是明智的。","reason":"因為要表達「自己為退休做好準備」，所以反身代名詞 (D) oneself 是正確答案。所有格關係代名詞 (A) whose（……的）修飾名詞，所以後面應該接被修飾的名詞才對。(B) whichever 表示「（某個群體或提過的一些對象中的）不論哪個」，而這個句子並沒有提到某個群體或一些對象，所以不對。所有代名詞 (C) theirs（他們的東西）意思不對。","vocab":"prepare v. 準備　retirement n. 退休　invest v. 投資　pension plan phr. 退休金計畫","paraphrase":""},"102":{"type":"【動詞位置】主動態與被動態的區分","translation":"沒有 3 年相關經驗的 Carver Financial 公司職位應徵者，將不會被考慮。","reason":"助動詞（will）後面要接動詞原形，所以有 have 原形的 (A)、be 原形的 (B)、動詞原形 (D) 是可能的答案。consider 是及物動詞「考慮」，而空格後面不接受詞，再加上句意是「沒有 3 年相關經驗的應徵者不會被考慮」，所以被動態 (B) be considered 是正確答案，而主動態 (A) 和 (D) 不對。(C) 的現在分詞不能接在 will 後面，所以不對。","vocab":"applicant n. 應徵者　experience n. 經歷，經驗","paraphrase":""},"103":{"type":"動詞詞彙","translation":"LT 航空飛往巴塞隆納的乘客被要求在指定區域等候。","reason":"句意是「航班的乘客被要求在指定區域等待」，所以動詞 (A) wait（等待）是正確答案。(B) carry 表示「攜帶」。(C) reserve 表示「預約」。(D) accept 表示「接受」。","vocab":"passenger n. 乘客　designated adj. 指定的","paraphrase":""},"104":{"type":"名詞位置","translation":"籌備新產品上市，需要部門間的合作。","reason":"及物動詞（requires）受詞位置應該使用名詞，所以名詞 (B) cooperation（合作）是正確答案。動詞 (A) 和形容詞 (D) 不能用在名詞位置。就算想把 to 不定詞 (C) 當成動詞 requires 的受詞也不行，因為 require 後面要接 to 不定詞的話，句型是「require + 受詞 + to」，或者用 be required to do（被要求做……）的句型才行。(D) 就算當成名詞「合作企業」來看，用法也不對，因為它是可數名詞，必須搭配冠詞，或者以複數形式使用。","vocab":"organize v. 組織，籌辦　launch n. 上市　department n. 部門","paraphrase":""},"105":{"type":"副詞詞彙","translation":"這個基金會專注於協助颶風災民的期間，它平常的慈善活動被暫時中斷了。","reason":"句意是「平常的慈善活動被暫時中斷了」，所以 (B) temporarily（暫時）是正確答案。(A) evenly 表示「平均地」，(C) relatively 表示「相對地」，(D) morally 表示「道德上」。","vocab":"usual adj. 平常的　charitable adj. 慈善（團體）的　suspend v. 中斷，暫停　focus on phr. 著重於……，聚焦於……　assist v. 協助　victim n. 被害者，犧牲者　hurricane n. 颶風","paraphrase":""},"106":{"type":"名詞詞彙","translation":"為了保護顧客的私人資訊，Median 銀行遵守嚴格的方針。","reason":"句意是「為了保護顧客的私人資訊，Median 銀行遵守嚴格的方針」，所以名詞 (D) protection（保護）是正確答案。(A) profit 表示「收益」，(B) advice 表示「建議」，(C) connection 表示「連接」。","vocab":"strict adj. 嚴格的　guideline n. 方針　private adj. 私人的","paraphrase":""},"107":{"type":"介系詞選其他","translation":"在 16 家公司中，奧蘭多市選了 Flaremont 建設公司來建造新的體育場。","reason":"因為要表達「在 16 家公司中，奧蘭多市選了 Flaremont 建設公司來建造新的體育場」，所以介系詞 (A) Out of（在……之中）是正確答案。(B) In front of 表示「在……前面」，(C) Nearby 表示「在附近」，(D) Through 表示「通過……，透過……」。","vocab":"choose v. 選擇　sports stadium phr. 體育場","paraphrase":""},"108":{"type":"副詞詞彙","translation":"12 月 14 日的天氣預報預測會有寒流，所以人們應該依照預報穿衣服。","reason":"因為要表達「天氣預報預測會有寒流，所以人們應該依照預報穿衣服」，所以副詞 (A) accordingly（照著，相應地）是正確答案。(B) eagerly 表示「渴望地，熱切地」，(C) invitingly 表示「誘人地」，(D) ultimately 表示「最終地」。","vocab":"weather forecast phr. 天氣預報　call for phr. 預報（天氣）　cold wave phr. 寒流","paraphrase":""},"109":{"type":"【引導修飾性語句的成分】現在分詞 vs. 過去分詞","translation":"貿易展的代表在活動的一個月之前打電話給每個參加者確認出席。","reason":"這個句子已經有具備主詞（A trade show representative）、動詞（called）和受詞（each participant）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - their attendance 是修飾性的語句，能表達目的「為了確認出席」的 to 不定詞 (B) to confirm 是正確答案。動詞 (A)、(C)、(D) 不能引導修飾性語句，就算把 before 當成副詞子句連接詞、把空格當成主詞（the event）的動詞，意思也會變成「活動確認／將會確認／正在確認參加」（「活動」這件事進行確認的行為），所以不對。","vocab":"trade show phr. 貿易展　representative n. 代表人　participant n. 參加者　attendance n. 參加，出席","paraphrase":""},"110":{"type":"形容詞位置","translation":"根據最近的報告，Keller Auto 公司是澳洲領先的汽車輪胎製造業者之一。","reason":"能修飾空格後面名詞（manufacturers）的是形容詞，所以有形容詞功能的過去分詞 (A) 和形容詞 (C) 是可能的答案。因為要表達「澳洲領先的汽車輪胎製造業者之一」，所以形容詞 (C) leading（領先的）是正確答案。動詞 lead（領導）的過去分詞 (A) 會讓意思變成「澳洲被領導的汽車輪胎製造業者之一」，所以不對。如果使用名詞 (B) 而形成 leaders manufacturers，也不能看成複合名詞，因為複合名詞的複數是在後面的名詞加上 -s。動詞 (D) 不能用在形容詞位置。","vocab":"manufacturer n. 製造業者","paraphrase":""},"111":{"type":"動詞詞彙","translation":"那位藝術史學家在試圖證明那幅畫為原作的過程中，做了大量的研究。","reason":"句意是「藝術史學家在試圖證明畫是原作的過程中，做了大量的研究」，所以動詞 (C) authenticate（證明〔藝術品等〕為真品）是正確答案。(A) adapt 表示「使適應，改編」，(B) generate 表示「產生」，(D) commission 表示「委任，委託」。","vocab":"historian n. 歷史學家　copious adj. 大量的　research n. 研究　original n. 原作 adj. 原本的，原創的","paraphrase":""},"112":{"type":"介系詞選擇 其他","translation":"藉由降低串流服務價格，Jolio 公司的目標是觸及超越現有市場的顧客。","reason":"因為要表達「Jolio 公司的目標是觸及超越現有市場的顧客」，所以介系詞 (A) beyond（超越……）是正確答案。(B) aboard 表示位置「在（船、飛機等）上」，(C) after 表示時間點「在……之後」。(D) between 通常以 between A and B（在 A 和 B 之間）的形式使用，表示時間或兩個對象之間的關係、位置「在……之間」。","vocab":"lower v. 降低　aim v. 以……為目標　reach v. 觸及　existing adj. 現有的","paraphrase":""},"113":{"type":"形容詞","translation":"體操選手 Anna Stamos 將取代目前的 Knobel 早餐麥片品牌大使。","reason":"句意是「體操選手 Anna Stamos 將取代目前的 Knobel 早餐麥片品牌大使」，所以形容詞 (C) current（目前的）是正確答案。(A) gradual 表示「逐漸的」，(B) extreme 表示「極度的」，(D) entire 表示「整體的」。","vocab":"gymnast n. 體操選手　replace v. 取代　ambassador n. 大使，宣傳大使","paraphrase":""},"114":{"type":"副詞位置","translation":"經過數小時練習後，業務團隊得以順利地向客戶提出企畫案。","reason":"副詞可以修飾空格後面 to 不定詞中的動詞原形（present），所以副詞 (D) confidently（自信地）是正確答案。動詞 (A)、形容詞 (B)、動名詞或現在分詞 (C) 都不能修飾動詞。就算想把 present 當成名詞「禮物」，而在前面使用 (A) 構成 to 不定詞，文法上還是錯誤的，因為 present 是可數名詞，必須搭配冠詞或以複數形使用。","vocab":"practice n. 練習，實行 v. 練習　present v. 簡報 n. 禮物　proposal n. 提案（書）　confide v. 吐露（秘密等）　confident adj. 有信心的","paraphrase":""},"115":{"type":"形容詞","translation":"對於 Buyer's 俱樂部會員，美國國內運送免費，但國際運送需要支付額外費用。","reason":"句意是「對於 Buyer's 俱樂部會員，美國國內運送免費，但國際運送需要支付額外費用」，所以形容詞 (C) additional（額外的）是正確答案。(A) opportune 表示「時機合適的」，(B) intentional 表示「有意的，故意的」，(D) exchangeable 表示「可交換的」。","vocab":"international adj. 國際的　require v. 需要，要求","paraphrase":""},"116":{"type":"介系詞選方向","translation":"電動車充電機將被安裝在全國的加油站。","reason":"因為要表達「電動車充電機將被安裝在全國的加油站」，所以表示方向的 (A) across（遍及……，跨越……）是正確答案。(B) opposite 表示位置「在……對面」，(C) toward 表示方向「往……」，(D) onto 表示方向「往……上面」。","vocab":"charging n. 充電","paraphrase":""},"117":{"type":"形容詞位置","translation":"Davidson 車站的手扶梯必須接受例行檢查，以確保運作正常。","reason":"空格修飾後面的名詞（inspection），所以形容詞 (B) routine（定期的）是正確答案。副詞 (A)、名詞 (C)、動詞 (D) 不能修飾名詞。就算想用名詞 (C) 構成複合名詞，routines inspection 也不符合文法，因為複合名詞的複數是在後面的名詞加上 -s。","vocab":"be subject to phr. 受到……，是……的對象　inspection n. 檢查　ensure v. 確保　properly adv. 恰當地，正確地　routinely adv. 定期地，慣常地　routinize v. 常規化","paraphrase":""},"118":{"type":"不定形容詞","translation":"任何年收入少於 25,000 元的 West Bay 居民都有資格申請住宅補助。","reason":"能修飾空格後面單數可數名詞的不定形容詞 (C) Any（任何……）是正確答案。數量詞 (A) 和 (D) 後面要接複數可數名詞或不可數名詞，指示代名詞 (B) 是用在複數可數名詞前面。","vocab":"resident n. 居民　earn v. 賺取　be eligible to do phr. 有資格做……　housing assistance phr. 住宅補助","paraphrase":""},"119":{"type":"名詞慣用表達方式","translation":"新爐具的廣告強調它的外觀與容易使用。","reason":"句意是「新爐具的廣告著重於它的外觀與容易使用」，所以能和空格前面的動詞（place）、後面的介系詞（on）構成 place an emphasis on，表示「強調……」的 (B) emphasis（強調）是正確答案。(A) order 表示「順序，命令」，(C) investment 表示「投資」，(D) observation 表示「觀察」。","vocab":"stove n. 爐子　appearance n. 外觀　ease n. 容易","paraphrase":""},"120":{"type":"形容詞位置","translation":"Farroo 與 Slansea 公司之間的策略性合作關係將提升競爭力，使雙方受益。","reason":"空格修飾後面的名詞（partnership），所以形容詞 (C) strategic（策略的）是正確答案。名詞 (A)、動詞 (B)、副詞 (D) 不能修飾名詞。","vocab":"partnership n. 夥伴關係　benefit v. 帶來利益、好處 n. 利益、好處　competitive adj. 有競爭力的　strategy n. 策略　strategize v. 制定策略　strategic adj. 策略的，策略上重要的","paraphrase":""},"121":{"type":"名詞詞彙","translation":"Mill Creek 社區中心發起了一項清潔活動，清除鎮上的垃圾。","reason":"句意是「社區中心開始了清除城鎮周遭垃圾的清掃新措施」，所以名詞 (B) initiative（新措施）是正確答案。(A) status 表示「地位，身分」，(C) declaration 表示「宣布」，(D) compliance 表示「遵守」。","vocab":"community center phr. 社區中心　get rid of phr. 擺脫，去除……　litter n. 垃圾","paraphrase":""},"122":{"type":"形容詞位置","translation":"由於經濟情況不佳，公司可能決定停止聘用新員工。","reason":"空格要填入修飾後面名詞（economic conditions）的形容詞，所以形容詞最高級 (A)、有形容詞功能的現在分詞 (D) 是可能的答案。因為要表達「由於惡化中的經濟狀況，這家公司可能會決定停止雇用員工」，所以動詞 worsen（惡化）的現在分詞 (D) worsening 是正確答案。形容詞最高級 (A) worst（最差的）雖然意思也說得通，但「最高級 + 名詞」前面應該加 the，而且句中並沒有提到其他比較對象，所以不對。動詞 (B) 和 (C) 不能修飾名詞。","vocab":"due to phr. 由於……　condition n. 狀況，條件","paraphrase":""},"123":{"type":"名詞子句連接詞 疑問詞 which","translation":"Six Stars 飯店的代客泊車服務員不確定哪一輛車是 Carlton 先生的。","reason":"動詞部分（was unsure）後面接名詞子句（~ car ~ Mr. Carlton）當受詞，所以名詞子句連接詞 (A) 和 (D) 是可能的答案。因為空格後面有名詞（car），而且要表達「不確定哪輛車是 Carlton 先生的」，所以能和 car 結合成名詞子句主詞的疑問形容詞 (D) which 是正確答案。疑問代名詞 (A) whom 引導名詞子句時，擔任名詞子句中的受詞角色，但這裡的名詞子句裡已經有受詞了。(B) as 雖然可以當副詞子句連接詞，形成修飾主要子句的結構，但如果這樣的話，子句中的可數名詞 car 應該加上冠詞或使用複數形。數量詞 (C) both（兩個都）不能引導名詞子句。","vocab":"valet n. 代客泊車的人　attendant n. 服務員　unsure adj. 不確定的　belong to phr. 屬於……","paraphrase":""},"124":{"type":"形容詞詞彙","translation":"Grady 先生正在訓練新進員工如何冷靜應對要求很高的客戶。","reason":"句意是「Grady 先生正在訓練新進員工如何冷靜地處理要求很多的客人」，所以形容詞 (A) demanding（要求很多的）是正確答案。(B) measured 表示「慎重的」，(C) suitable 表示「適合的」，(D) sparse 表示「（分布）稀疏的」。","vocab":"train v. 訓練　handle v. 處理　calm adj. 冷靜的　manner n. 方式，態度","paraphrase":""},"125":{"type":"【引導修飾性語句的成分】副詞子句連接詞 條件","translation":"只有獲得他所要求的百分之二十加薪，Joseph Baker 才會接受升遷。","reason":"這個句子已經有具備主詞（Joseph Baker）、動詞（will accept）、受詞（the promotion）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - ~ asked for 是修飾性的語句。修飾部分有動詞（gets），所以能引導修飾子句的副詞子句連接詞 (A) only if（只有在……的情況下）是正確答案。連接副詞 (B) furthermore（而且，再者……）不能引導修飾子句。介系詞 (C) other than（……以外）和 (D) apart from（除了……）會形成修飾片語，而不是引導修飾子句。","vocab":"promotion n. 升職　raise n. 加薪 v. 提高","paraphrase":""},"126":{"type":"複合名詞","translation":"每一年，Corehouse Technics 公司的每位員工都會接受表現評價。","reason":"空格在名詞後面，所以能形成複合名詞（名詞 + 名詞）的名詞 (A) 和 (D)、可以在名詞後面做修飾的現在分詞 (B) 和 to 不定詞 (C) 都是可能的答案。因為句意是「每位員工都會接受表現評價」，所以能和空格前面的名詞 performance（表現）構成複合名詞 performance evaluation（表現評價）的名詞 (D) evaluation（評價）是正確答案。名詞 (A) evaluator、現在分詞 (B)、to 不定詞 (C) 會讓意思變成「每位員工都會受到表現評價者／在評價的表現／要評價的表現」，所以不對。","vocab":"undergo v. 接受，經歷　performance n. 表現，業績","paraphrase":""},"127":{"type":"介系詞選擇 位置","translation":"為了將運輸費用減到最少，這家公司搬遷到了離港口近的辦公室。","reason":"因為要表達「為了將運輸費用減到最少，這家公司搬遷到了離港口近的辦公室」，所以介系詞 (C) near（接近……）是正確答案。(A) per 表示「每……」，(B) regarding 表示「關於……」，(D) plus 表示「加上……」。","vocab":"minimize v. 最小化　transportation costs phr. 運輸費用　port n. 港口","paraphrase":""},"128":{"type":"形容詞位置","translation":"Rob Marshall 的《Smart Investor’s Guide》提供許多有助於了解股票市場的見解。","reason":"空格修飾後面的名詞（insights），所以有形容詞功能的過去分詞 (A) 以及形容詞 (B) 是可能的答案。因為要表達「提供許多有幫助的洞見」，所以形容詞 (B) helpful（有幫助的）是正確答案。如果使用過去分詞 (A) helped（受到幫助的），意思會變成「提供許多受到幫助的洞見」，所以不對。副詞 (C) 和動詞 (D) 不能修飾名詞。","vocab":"insight n. 洞見，洞察力　stock market phr. 股票市場","paraphrase":""},"129":{"type":"副詞選擇 時間副詞","translation":"10 月份會議的參加者會預先收到關於講者更詳細的資訊。","reason":"因為要表達「會預先收到關於講者更詳細的資訊」，所以表示時間的副詞 (D) beforehand（預先）是正確答案。(A) alongside 表示「在旁」，(B) either 表示「也（不）」，(C) further 表示「進一步」。","vocab":"attendee n. 參加者　detailed adj. 詳細的","paraphrase":""},"130":{"type":"動詞","translation":"這座倉儲設施使用能感知室內氣溫微小變化的系統。","reason":"句意是「這座倉儲設施使用能感知室內氣溫微小變化的系統」，所以動詞 sense（感知）的 -ing 形 (B) sensing 是正確答案。(A) act 表示「行動」，(C) cool 表示「冷卻」，(D) experiment 表示「實驗」。","vocab":"storage n. 倉儲　facility n. 設施　be capable of phr. 有……的能力　indoor adj. 室內的　temperature n. 溫度","paraphrase":""},"131":{"type":"相關連接詞","translation":"請選出最適合填入文章第 131 空格的選項。","reason":"句意是「安全帽不僅時尚，也能保護您的安全」，所以能和 Not only 構成相關連接詞 not only A but (also) B（不僅 A 而且 B）的 (B) but 是正確答案。疑問副詞 (A)、連接詞 (C) 和 (D) 不能搭配 Not only 使用。","vocab":"","paraphrase":""},"132":{"type":"名詞詞彙 掌握上下文","translation":"請選出最適合填入文章第 132 空格的選項。","reason":"句意是「也為一般騎士帶來＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到可以收摺成小巧的尺寸以便收納，由此可知這些安全帽會為一般騎士帶來便利，名詞 (D) convenience（便利）是正確答案。(A) speed 表示「速度」，(B) assistance 表示「協助」，(C) durability 表示「耐用」。","vocab":"","paraphrase":""},"133":{"type":"連接副詞 掌握上下文","translation":"請選出最適合填入文章第 133 空格的選項。","reason":"空格伴隨逗號一起出現在句首，是連接副詞的位置，所以要掌握空格所在的句子和上一句的關係來判斷答案。上一句提到為一般騎士帶來便利，而空格所在的句子說可以收摺成小巧的尺寸以便收納，所以針對上一句舉出例子時使用的 (A) For example（舉例來說）是正確答案。(B) Conversely 表示「相反地」，(C) If so 表示「如果是這樣的話」，(D) Otherwise 表示「否則」，用在這裡都不恰當。","vocab":"","paraphrase":""},"134":{"type":"選出適當的句子","translation":"請選出最適合填入文章第 134 空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 There is simply no excuse not to try a Bango helmet today. 提到，沒有藉口不在今天就試 Bango 安全帽，而下一句 If you buy one at full price, you will receive a second helmet at 50 percent off. 則說，如果以定價購買，將可以用折扣 50% 的價格購買第二頂安全帽，所以空格的內容應該和購買安全帽的優惠有關，(B) Get one now and take advantage of a special promotion 是正確答案。\n選項翻譯\n(A) 不要忘記報名安全工作坊。\n(B) 現在就買一頂，並且利用特別促銷活動。\n(C) 透過線上購物，找到種類最多元的品牌。\n(D) 我們的維修站就位在購物中心對面。","vocab":"safety n. 安全　take advantage of phr. 利用　promotion n. 促銷　repair shop phr. 修理店，維修站","paraphrase":""},"135":{"type":"名詞位置","translation":"請選出最適合填入文章第 135 空格的選項。","reason":"空格被前面的所有格人稱代名詞（your）修飾，所以名詞 (B) enrollment（報名）是正確答案。動詞 (A)、(C)、(D) 不能用在名詞的位置。","vocab":"","paraphrase":""},"136":{"type":"選出適當的句子","translation":"請選出最適合填入文章第 136 空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Since you have signed up to pay in installments, you will be charged on a monthly basis. 提到，由於對方以分期付款的方式報名，將會每月被收取費用，所以空格的內容應該和分期付款有關，(C) The first invoice will be sent by e-mail on July 1 是正確答案。\n選項翻譯\n(A) 系統必須立即被檢查是否有錯誤。\n(B) 折扣只會在限定期間提供。\n(C) 第一張發票將在 7 月 1 日以電子郵件寄出。\n(D) 請到接待處報到以取得學生證。","vocab":"immediately adv. 立即　discount n. 折扣　available adj. 可利用的　invoice n. 發票　reception desk phr. 接待處","paraphrase":""},"137":{"type":"動詞","translation":"請選出最適合填入文章第 137 空格的選項。","reason":"句意是「可以隨時自由＿＿付款方案」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，要進行修改，只要登入帳戶並選擇「變更方案」，之後也提到最長的方案是 18 個月，由此可知可以隨時修改付款方案，答案是動詞 (A) modify（修改）。(B) begin 表示「開始」，(C) approve 表示「批准」，(D) request 表示「要求」。","vocab":"","paraphrase":""},"138":{"type":"名詞","translation":"請選出最適合填入文章第 138 空格的選項。","reason":"句意是「如果有任何＿＿，就立刻寄電子郵件」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句說隨時樂意幫忙，由此可知寄件者是希望對方在遇到困難的時候，立刻寄電子郵件聯絡，所以名詞 (B) difficulties（困難）是正確答案。(A) option 表示「選項」，(C) symptom 表示「症狀」，(D) referral 表示「轉介，轉診」。","vocab":"","paraphrase":""},"139":{"type":"動詞慣用表達方式 掌握上下文","translation":"請選出最適合填入文章第 139 空格的選項。","reason":"句意是「這些＿＿組織為數百隻動物提供食物與住處」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到，Lake 郡動物協會感謝大家過去幾年的貢獻，所以可以和空格後面的 to 構成 enable A to do（使 A 能夠做……）的動詞 enable（使……能夠）p.p. 形 (C) enabled 是正確答案。(A) know 表示「知道」，(B) ask 表示「要求」，(D) instruct 表示「指示」。","vocab":"","paraphrase":""},"140":{"type":"**","translation":"請選出最適合填入文章第 140 空格的選項。","reason":"**\n這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的內容邀請參加 12 月 11 日在 Morrissey Civic 中心的募款大會，而上一句 It will be a night of fun for a good cause. 說這將會是個有良善目標、好玩的夜晚，下一句 Admission tickets will be available for only $100 each. 說入場券每張只要 100 元就能購買，所以空格的內容應該和即將舉辦的募款活動有關，(D) The attendees will be treated to dinner and live entertainment 是正確答案。\n選項翻譯\n(A) 當晚我們（收到）最大筆的捐款是 1500 元。\n(B) 會員每個月會收到時事通訊。\n(C) 他們會被移到更適合收容的較大設施。\n(D) 我們將招待參加者享受晚餐與現場娛樂表演。","vocab":"donation n. 捐款，捐贈　newsletter n. 時事通訊，電子報　accommodate v. 容納，為……提供住宿　attendee n. 參加者，出席者　treat v. 款待，對待　live entertainment phr. 現場娛樂表演","paraphrase":""},"141":{"type":"副詞詞彙 掌握上下文","translation":"請選出最適合填入文章第 141 空格的選項。","reason":"句意是「活動收入將用於修繕本團體在 Willoughby 的設施，因為建築物的屋頂需要替換」，(A) 和 (C) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，一部分收入也將用於擴大計畫，所以空格所在的句子應該是表達活動收入「主要」用於修繕設施，剩下的才用於擴大計畫，副詞 (A) chiefly（主要）是正確答案。(B) sometimes 表示「有時候」，(C) exclusively 表示「獨占地」，(D) seldom 表示「很少，幾乎不」。","vocab":"","paraphrase":""},"142":{"type":"【引導修飾性語句的成分】關係代名詞的位置與用法","translation":"請選出最適合填入文章第 142 空格的選項。","reason":"這個句子已經有具備主詞（a portion）、動詞（will ~ go to）和受詞（expanding programs）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - ~ shelters 是修飾性的語句。修飾部分是修飾空格前面的名詞（programs），所以包含可修飾名詞的主格關係代名詞與關係子句動詞的 (C) that encourage 是正確答案。動詞 (A) 和 (B) 不能引導修飾性的語句。「it + 動詞」(D) 會形成另一個子句，但無法在不加連接詞的情況下和前面的子句連接在一起，所以不對。","vocab":"","paraphrase":""},"143":{"type":"形容詞位置","translation":"請選出最適合填入文章第 143 空格的選項。","reason":"句意是「從 4 月 8 日開始，室內游泳池將關閉一週」，所以後面能接日期，構成慣用表達方式「effective + 日期」（從……開始生效）的形容詞 (D) Effective（有效的，生效的）是正確答案。名詞 (A) 和 (B)、副詞 (C) 無法和後面的日期形成正確的表達方式。","vocab":"","paraphrase":""},"144":{"type":"連接副詞 掌握上下文","translation":"請選出最適合填入文章第 144 空格的選項。","reason":"空格是連同逗號一起出現在句首的連接副詞位置，所以需要掌握空格所在句子和前面內容的關係來選擇答案。上一句提到這是為每個人提供安全、衛生的環境而必須進行的年度程序，而空格所在的句子則說其他室內設施可以繼續使用，所以表達和上一句同時發生其他情況的連接副詞 (C) In the meantime（同時）是正確答案。(A) After all 表示「畢竟」，(B) Likewise 表示「同樣地」，(D) For this reason 表示「因為這個原因」，用在這裡都不恰當。","vocab":"","paraphrase":""},"145":{"type":"名詞—代名詞一致 掌握上下文","translation":"請選出最適合填入文章第 145 空格的選項。","reason":"句意是「包括三溫暖、健身房與養生會館」，而且空格後面接動詞（include），所以所有代名詞 (A) 和 (C)、指示代名詞 (D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到其他室內設施可以繼續使用，所以能指稱其他室內設施的複數指示代名詞 (D) These 是正確答案。所有代名詞 (A) Mine 是指「我的東西」，無法指稱 other indoor facilities，而所有代名詞 (C) Theirs 是指「他們的東西」，意思會變成「他們的東西包括三溫暖、健身房與養生會館」，不符合文意。(B) Our 是第一人稱所有格人稱代名詞，不能獨自當主詞使用。","vocab":"","paraphrase":""},"146":{"type":"選出適當的句子","translation":"請選出最適合填入文章第 146 空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 We apologize for any inconvenience the work might cause. 對於這項工作（室內游泳池關閉進行保養）可能造成的任何不便致歉，所以空格的內容應該和游泳池關閉有關，(A) Normal operations will resume once it is done 是正確答案。\n選項翻譯\n(A) 工作完成後，就會恢復正常營運。\n(B) 我們最近的發文得到了數千個讚與觀看次數。\n(C) 我們正在調查這個問題。\n(D) 請向我們的失物招領櫃台通報遺失物。","vocab":"operation n. 營運　resume v. 繼續，恢復　investigate v. 調查","paraphrase":""},"147":{"type":"wh-問題 How","translation":"人們要怎麼參加測試？","reason":"這是問人們要怎麼（How）參加測試的 wh- 問題。和題目的關鍵詞語 participate in a test 有關的部分是 To sign up, go to www.betteskin.com. Answer a brief online survey before June 30，這部分提到報名方法是上 www.betteskin.com，在 6 月 30 日前回答簡短的線上問卷調查，所以 (B) 是正確答案。\n變換表達方式\nAnswer a ~ survey 回答問卷調查 → completing a survey 完成問卷調查","vocab":"promote v. 宣傳　submit v. 提交　attend v. 出席，參加　in person phr. 親自，親身","paraphrase":""},"148":{"type":"wh-問題 What","translation":"參加者會收到什麼？","reason":"這是問參加者會收到什麼（What）的 wh- 問題。和題目的關鍵詞語 participants receive 有關的部分是 participants will receive a $25 coupon for our Web site，這部分提到參加者將得到網站的 25 元優惠券，所以 (C) 是正確答案。\n變換表達方式\ncoupon 優惠券 → voucher 優惠券","vocab":"notification n. 通知　grocer n. 食品雜貨店，食品雜貨商　recall n. （不良品的）回收，召回 v. 回收，召回　restock v. 重新進貨，補貨　lift v. 解除，抬起　carry v. （在商店裡）備有、有售（商品）　nationwide adv. 在全國　certify v. 證明　certification n. 證書　regulatory adj. 監管的　requirement n. 要求　promotional adj. 促銷的","paraphrase":""},"149":{"type":"wh-問題 What","translation":"Charlotte Grocer 遇到了什麼問題？","reason":"這是問 Charlotte 食品雜貨店目前有什麼（What）問題的 wh- 問題。和題目的關鍵詞語 problem ~ Charlotte Grocer having 有關的部分是 The item is currently unavailable，這部分提到一項商品目前無法取得，所以 (C) 是正確答案。\n變換表達方式\nThe item is ~ unavailable 商品無法取得 → A product cannot be acquired 無法取得一種產品","vocab":"go out of business phr. 歇業，停止營運　cash register phr. 收銀機　acquire v. 獲得，取得","paraphrase":""},"150":{"type":"推論 細節資訊","translation":"關於 Charlotte 食品雜貨店，可以推知什麼？","reason":"這是和題目關鍵詞語 Charlotte Grocer 有關的推論問題。As with all products sold in our stores, they are certified by organic certification agencies and meet all regulatory requirements for food safety. 的部分提到，前述的產品與店面販售的所有產品相同，一樣經過有機認證機構的認證，並且符合所有食品安全監管的要求。由此可以推知，這家業者遵守特定的產品標準，所以 (D) 是正確答案。\n變換表達方式\nare certified by ~ certification agencies and meet ~ regulatory requirements 經過認證機構的認證，並且符合監管要求 → follows specific product standards 遵守特定的產品標準","vocab":"merge with phr. 和……合併　competitor n. 競爭者，競爭業者　maintain v. 維持　location n. 地點，據點　worldwide adv. 在全世界　standard n. 標準","paraphrase":""},"151":{"type":"wh-問題 Why","translation":"為什麼顧客應該在網站上註冊？","reason":"這是問為什麼（Why）顧客應該在網站上註冊的 wh- 問題。和題目的關鍵詞語 customers register on a Web site 有關的部分是 register your e-mail address at www.charlottegrocer.com to receive our weekly newsletter，這部分請顧客在 www.charlottegrocer.com 註冊電子郵件位址，以獲得每週電子報，所以 (D) 是正確答案。","vocab":"take part in phr. 參加　arrange v. 安排","paraphrase":""},"152":{"type":"尋找主題／目的 寫文章的理由","translation":"尋找主題／目的 寫文章的理由","reason":"這一題問的是 Sanchez 小姐聯絡 Yamamoto 先生的原因，所以要注意文章開頭的部分。Sanchez 小姐說 could you please postpone my afternoon meeting?，問 Yamamoto 先生可不可以延後她下午的會議，所以 (C) 是正確答案。\n變換表達方式\npostpone ~ meeting 延後會議 → move an appointment 更動會面的約定","vocab":"","paraphrase":""},"153":{"type":"掌握意圖","translation":"在中午 12:27，Yamamoto 先生的「Will do」最有可能意味著什麼？","reason":"這一題問的是 Yamamoto 先生的訊息所表達的意圖，所以要掌握引用部分（Will do）前後文的情境。Christina Sanchez 說 Please call Mr. Zhou directly rather than e-mail him，要求打電話給客戶 Zhou 先生而不是寄電子郵件，對此 Yamamoto 先生回應 Will do.（我會的），並且說 I have his phone number in front of me.，表示面前有他的電話號碼，意味著他會打電話聯絡客戶，所以 (A) 是正確答案。","vocab":"follow up on phr. 追蹤……的狀況　proposed adj. 被提出的，被提議的　place n. 位子，角色","paraphrase":""},"154":{"type":"Not/True True 題型","translation":"關於 Bauerhoff 農場的番茄，文中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Bauerhoff Farms' tomatoes 有關的內容，並且對照選項判斷答案。(A) 和 (C) 在文章裡沒有提到。(B) 在 The quantities far exceed what our regular clients agreed to buy 的部分提到，數量（收穫的番茄數量）遠遠超過固定客戶同意購買的，之後 we need to figure out a way to sell the excess. Currently, I am drawing up a list of restaurants, hotels, and small grocers that might be able to take our surplus produce on short notice. 的部分又說需要想出賣掉多餘部分的方法，目前正在製作有可能在臨時通知的情況下接收多餘農作物的餐廳、飯店與小型食品雜貨店列表，符合選項敘述，所以 (B) 是正確答案。(D) 在 The quantities far exceed what our regular clients agreed to buy 的部分提到，收穫的番茄數量遠遠超過固定客戶同意購買的，不符合選項敘述。","vocab":"harvest v. 收穫　reject v. 拒絕","paraphrase":""},"155":{"type":"wh-問題 What","translation":"Gunther 先生被要求做什麼？","reason":"這是問 Gunther 先生被要求做什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Gunther asked to do 有關的部分是 I'd like you to sell more quantities than usual at our local farmer's market，這部分希望對方（Gunther 先生）在當地的農夫市集販賣比平常更多的量，所以 (D) 是正確答案。\n變換表達方式\nsell more quantities 販賣更多的量 → Increase sales 增加銷售\nlocal farmer's market 當地的農民市集 → a local marketplace 當地市場","vocab":"instruction n. 指示　owner n. 所有人，物主　make arrangement with phr. 和……進行安排　increase v. 增加　marketplace n. 市場，市集","paraphrase":""},"156":{"type":"尋找主題／目的 文章的目的","translation":"這篇文章主要是關於什麼？","reason":"這一題問的是這篇文章的目的，所以要注意文章開頭的部分。Mumbai is taking steps to address issues with companies in the so-called sharing economy. 的部分提到，孟買正在採取措施，處理所謂共享經濟中的公司問題，所以 (C) 是正確答案。","vocab":"treatment n. 對待　accident n. 意外事故　regulate v. 管制","paraphrase":""},"157":{"type":"推論 細節資訊","translation":"關於 CallAuto，文中暗示什麼？","reason":"這是和題目關鍵詞語 CallAuto 有關的推論問題。As for CallAuto, it will have to treat its drivers as regular employees and provide them with paid vacations and health insurance. 的部分提到，CallAuto 將必須以對正職員工的方式對待它的司機，並且提供他們有薪假與健康保險，由此可以推知，CallAuto 將必須提供雇用福利給司機，(C) 是正確答案。\n變換表達方式\npaid vacations and health insurance 有薪假與健康保險 → employment benefits 雇用福利","vocab":"eco-friendly adj. 環保的　reusable adj. 可重複使用的　straw n. 吸管　utensil n. 用具　bamboo n. 竹　biodegradable adj. 可生物分解的　decompose v. 分解，腐爛　naturally adv. 自然地　discard v. 拋棄　advocate v. 提倡　environmentally friendly phr. 環保的　consumption n. 消費　practice n. 實踐　donate v. 捐贈","paraphrase":""},"158":{"type":"Not/True Not 題型","translation":"關於 Peacelid，何者不正確？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Peacelid 有關的內容，並且對照選項判斷答案。(A) 在 Peacelid is ~ selling reusable cups, straws, and utensils. 的部分提到，Peacelid 販賣可重複使用的杯子、吸管、用具，符合選項敘述。(B) 在 donates 3 percent of every purchase to organizations involved in preventing deforestation 的部分提到，將每次購買的 3% 捐給積極預防濫伐森林的組織，符合選項敘述。(C) 在 Our products are made from 100 percent bamboo. 的部分提到，產品由 100% 竹子製造，符合選項敘述。(D) 在文章裡沒有提到，所以 (D) 是正確答案。\n變換表達方式\ncups, straws, and utensils 杯子、吸管和用具 → products for eating and drinking 飲食時使用的產品\ndonates ~ to organizations 捐贈給組織 → supports ~ organizations 支持組織","vocab":"support v. 支持　natural adj. 天然的，自然的　material n. 材料","paraphrase":""},"159":{"type":"wh-問題 What","translation":"什麼是 Peacelid 產品的一項優點？","reason":"這是問什麼（What）是 Peacelid 產品優點的 wh- 問題。和題目的關鍵詞語 an advantage of Peacelid's products 有關的部分是 they decompose safely and naturally after being discarded，這部分提到「它們」（Peacelid 的產品）在被丟棄後會安全且自然地分解，所以 (B) 是正確答案。\n變換表達方式\ndecompose safely ~ after being discarded 被丟棄後安全地分解 → Safe disposal 安全的丟棄","vocab":"durability n. 耐久性　disposal n. （對廢棄物等的）處理，丟棄　affordable adj. 可負擔的　availability n. 可取得性","paraphrase":""},"160":{"type":"Not/True True 題型","translation":"關於優惠代碼，文中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 the coupon code 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章中沒有提到。(B) 在 New customers can enjoy a 20 percent discount on their first order by entering the code \"PEACE20\" 的部分提到，新顧客第一次訂購可以在結帳頁面輸入代碼「PEACE20」享受 20% 折扣，符合選項敘述，所以 (B) 是正確答案。","vocab":"apply v. 適用，申請　request v. 要求 n. 要求，請求　expire v. 到期","paraphrase":""},"161":{"type":"wh-問題 How","translation":"顧客可以怎樣獲得可重複使用的吸管？","reason":"這是問顧客可以怎樣（How）獲得可重複使用的吸管的 wh- 問題。和題目的關鍵詞語 customers obtain a reusable straw 有關的部分是 every order of $200 or more will include a free reusable straw，這部分提到每筆 200 元以上訂單將附送免費可重複使用吸管，所以 (A) 是正確答案。","vocab":"exchange v. 交換　volunteer v. 自願，做志願服務","paraphrase":""},"162":{"type":"Not/True True 題型","translation":"關於 Gymspan，文中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Gymspan 有關的內容，並且對照選項判斷答案。(A) 在 users who have a subscription to the Gymspan app will no longer be able to take advantage of unlimited workouts at its network of affiliated fitness centers 的部分提到，訂閱了 Gymspan 應用程式的使用者將無法在它的合作健身中心網絡利用無限運動服務，符合選項敘述，所以 (A) 是正確答案。(B) 和 (D) 在文章中沒有提到。(C) 在 To make up for the change, Gymspan will award 500 loyalty points 的部分提到，為了彌補這個改變（不再提供無限運動方案），Gymspan 將贈送 500 點忠誠點數（給受影響的使用者），不符合選項敘述。\n變換表達方式\nusers ~ will no longer be able to take advantage of 使用者無法再利用 → is removing 即將刪除","vocab":"tie n. 關係，連結　affiliate n. 附屬機構　merge v. 合併","paraphrase":""},"163":{"type":"wh-問題 What","translation":"根據公告，顧客可以做什麼？","reason":"這是問根據公告，顧客可以做什麼（What）的 wh- 問題。和題目的關鍵詞語 customers able to do 有關的部分是 Each month, customers have the option to easily switch from one plan to another.，表示顧客每個月都可以選擇輕鬆地轉換方案，所以 (C) 是正確答案。\n變換表達方式\nswitch from one plan to another 從一個方案轉換到另一個 → Adjust ~ plans 調整方案\nEach month 每月 → a monthly basis 以月為單位","vocab":"sign up for phr. 報名參加……　rate v. 評價，評等　adjust v. 調整　inquire v. 詢問　franchise n. （連鎖商店的）特許經營權　opportunity n. 機會","paraphrase":""},"164":{"type":"選擇句子位置","translation":"以下句子最適合填入 [1]、[2]、[3]、[4] 的哪個位置？","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「帳戶現在每年最多可以暫停 2 個月」，[3] 的上一句 You can also temporarily stop payments when you are out of the country. 提到也可以在出國時暫時停止付款。將句子填入 [3] 的位置之後，可以表達「可以在出國時暫時停止付款，而帳戶現在每年最多可以暫停 2 個月」，文意通順，所以 (C) 是正確答案。","vocab":"pause v. 暫停","paraphrase":""},"165":{"type":"尋找主題／目的 文章的目的","translation":"這封信的主要目的是什麼？","reason":"這一題問的是這封信的目的，所以要注意文章開頭的部分。After reviewing your application materials, we have decided to award you a Clark Newman Scholarship 的部分提到，在審閱「您」（Davidson 先生）的申請資料後，決定頒發 Clark Newman 獎學金，所以 (A) 是正確答案。","vocab":"follow-up adj. 進一步的 n. 進一步的行動","paraphrase":""},"166":{"type":"推論 細節資訊","translation":"關於 Davidson 先生，文中提到什麼？","reason":"這是和題目關鍵詞語 Mr. Davidson 有關的推論問題。this scholarship is only awarded to five applicants per year 的部分提到，這項獎學金每年只頒發給 5 名申請者，之後 All recipients were selected from a group of over 1,000 applicants. 又補充說獲獎者是從超過 1,000 名申請者中選出的，由此可以推知，Davidson 先生參與的競爭非常激烈，所以 (B) 是正確答案。","vocab":"major n. 主修科目，主修學生 v. 主修","paraphrase":""},"167":{"type":"wh-問題 What","translation":"什麼會在下週寄給 Davidson 先生？","reason":"這是問什麼（What）會在下週寄給 Davidson 先生的 wh- 問題。和題目的關鍵詞語 sent to Mr. Davidson in the next week 有關的部分是 Next week, we will send you your student card ~，表示下週會寄學生證給他，所以 (C) 是正確答案。\n變換表達方式\nstudent card 學生證 → An identification card 身分證件","vocab":"brochure n. 小冊子　financial adj. 財務的，金融的　aid n. 支援，幫助","paraphrase":""},"168":{"type":"尋找主題／目的 文章的主題","translation":"這篇文章主要是關於什麼？","reason":"這一題問的是文章的主題，所以要注意文章開頭的部分。Over the past few months, a new concept store ~ has been drawing lots of attention. 的部分提到，過去幾個月，一家新概念商店吸引了許多關注，接下來則詳細介紹這家店，所以 (A) 是正確答案。\n變換表達方式\nstore ~ has been drawing lots of attention 商店吸引了許多關注 → A recently established business 最近創立的事業體","vocab":"establish v. 建立，創立　ingredient n. 原料，成分　reopen v. 重新開幕","paraphrase":""},"169":{"type":"同義詞","translation":"第 1 段第 2 行的單字「spot」，意思最接近","reason":"spot 所在的語句 It occupies a busy spot for tourists along 3rd Street. 之中，spot 表示「地點」的意思，所以同樣能表示「地點」的 (B) 是正確答案。","vocab":"","paraphrase":""},"170":{"type":"推論 細節資訊","translation":"關於 Freesha，文中暗示什麼？","reason":"這是和題目關鍵詞語 Freesha 有關的推論問題。she has added a small room where up to four visitors at a time can watch how fragrances are made. In the future, Ms. McKellen plans to expand the room to accommodate hands-on workshops for larger groups. 的部分提到，增設了最多可以讓 4 名來客同時觀看香水製作過程的小房間，未來也計畫擴展空間，以便舉辦較大團體的實作工作坊，由此可以推知，以後會創造出可以容納 5 人以上的空間並舉辦工作坊，所以 (D) 是正確答案。","vocab":"supplier n. 供應商","paraphrase":""},"171":{"type":"選擇句子位置","translation":"以下句子最適合填入 [1]、[2]、[3]、[4] 的哪個位置？","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子說「McKellen 小姐當時必須雇用更多員工來幫助她滿足意外的需求」，所以應該會出現在和「意外的需求」有關的部分。[2] 的上一句 To her surprise, she sold out her entire inventory within a week. 提到，令她（McKellen 小姐）驚訝的是，她在一週之內賣完了所有庫存。將句子填入 [2] 的位置之後，可以表達「McKellen 小姐在一週之內賣完了所有庫存，而為了滿足這個意外的需求，McKellen 小姐當時必須雇用更多員工」，文意通順，所以 (B) 是正確答案。","vocab":"unexpected adj. 意料之外的","paraphrase":""},"172":{"type":"wh-問題 Why","translation":"為什麼 Daniels 先生不能早到？","reason":"這是問為什麼（Why）Daniels 先生不能早到的 wh- 問題。和題目的關鍵詞語 Mr. Daniels unavailable to come early 有關的部分是 Daniels 先生說的 I won't be able to show up until close to the starting time as I have to work at the Fry Factory until 6:30 P.M.，他因為自己必須在 Fry Factory 工作到傍晚 6:30，所以要到接近開始時間的時候才能到場，(A) 是正確答案。","vocab":"medical appointment phr. 診療預約","paraphrase":""},"173":{"type":"wh-問題 What","translation":"Jackson 先生請 Chen 小姐做什麼？","reason":"這是問 Jackson 先生要求 Chen 小姐做什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Jackson ask Ms. Chen to do 有關的部分是 Jackson 先生說的 I was wondering if you could help me set up the tables and chairs，他想知道 Chen 小姐能不能幫忙擺設桌椅，所以 (C) 是正確答案。\n變換表達方式\nset up the tables and chairs 擺設桌椅 → Arrange some furniture 擺設一些家具","vocab":"attendee n. 參加者　arrange v. 安排，佈置","paraphrase":""},"174":{"type":"掌握意圖","translation":"在上午 9:35，Daniels 先生的「Got it」意味著什麼？","reason":"這一題問的是 Daniels 先生的訊息所表達的意圖，所以要掌握引用部分（Got it）前後文的情境。Dwayne Jackson 說 Be ready to greet participants and help them with any questions they have about the event or about how to make a donation.，要求準備好迎接參加者，並且處理他們關於活動或如何捐款的任何問題，對此 Daniels 先生回應 Got it.（知道了），表示 Daniels 先生會對參加者提供協助，所以 (A) 是正確答案。\n變換表達方式\nhelp 幫忙 → provide assistance 提供協助","vocab":"note down phr. 做筆記寫下來","paraphrase":""},"175":{"type":"wh-問題 When","translation":"募款活動什麼時候正式開始？","reason":"這是問募款活動什麼時候（When）正式開始的 wh- 問題。和題目的關鍵詞語 the fundraiser officially start 有關的部分是 I'll be there by 6:45 P.M., which is 15 minutes before the event starts.，這部分提到會在活動開始 15 分鐘前的傍晚 6:45 到場，所以 (D) 是正確答案。","vocab":"officially adv. 正式地","paraphrase":""},"176":{"type":"尋找主題／目的","translation":"尋找主題／目的","reason":"這一題問的是 Keller 先生寫電子郵件的理由，所以要看他寫的電子郵件（第一篇文章）。在第一封電子郵件中，I am in charge of organizing a trip for my company this May, and I would like to make a reservation with you. 的部分提到 Keller 先生負責籌辦公司今年 5 月的旅遊，想要進行預約，所以 (D) 是正確答案。\n變換表達方式\nmake a reservation 預約 → make arrangements 安排","vocab":"partnership n. 合作　hospitality n. 款待　arrangement n. 安排","paraphrase":""},"177":{"type":"wh-問題 What","translation":"Keller 先生提到什麼必要條件？","reason":"這是問 Keller 先生提到什麼（What）需求的 wh- 問題，所以要從他寫的電子郵件（第一篇文章）中找出和題目關鍵詞語 Mr. Keller mention as a requirement 相關的內容。We will need 12 single rooms 的部分提到需要 12 間單人房，所以 (C) 是正確答案。\n變換表達方式\nsingle rooms 單人房 → single-occupancy rooms 單人房","vocab":"requirement n. 需要的事項　view n. 景觀，觀點","paraphrase":""},"178":{"type":"同義詞","translation":"在第一封電子郵件中，第 4 段第 1 行的片語「going over」，意思最接近","reason":"在第一封電子郵件，going over 所在的語句 I look forward to going over the reservation further with you. 之中，going over 表示「檢討」的意思，所以同樣能表示「檢討」的 (A) 是正確答案。","vocab":"","paraphrase":""},"179":{"type":"Not/True 多篇文章對照題型","translation":"關於室外區域，Brunelli 小姐提到什麼？","reason":"這是需要對照兩篇文章內容的題目。這是 Not/True 題型，要找出 Brunelli 小姐所提到、和關鍵詞語 an outdoor area 有關的內容，並且對照選項判斷答案，所以先看 Brunelli 小姐所寫的電子郵件（第二篇文章）。\n線索1：第二封電子郵件中，We can reserve the whole outdoor area for your dinner. However, it would have to be moved to the next night ~. The proposed date is already booked. 的部分提到，可以為晚餐預留整個室外區域，但必須改到隔天晚上，因為對方提出的日期已經被預約了。不過，這裡沒有說對方提出的日期是幾月幾日，所以還需要參考第一封電子郵件的內容。\n線索2：第一封電子郵件中，Can you reserve spa treatments ~ for the afternoon of May 4? This will be followed by dinner. If the weather permits, we would like to be seated outdoors 的部分詢問是否可以代為預約 5 月 4 日的 spa 療程和接下來的晚餐，而且表明如果天氣允許的話，想要坐在室外。\n綜合這兩個線索，可知可以吃晚餐的室外區域在 5 月 4 日已經被預訂了，所以 (C) 是正確答案。(A)、(B)、(D) 在文章中沒有提到。","vocab":"exotic adj. 異國風的","paraphrase":""},"180":{"type":"推論 多篇文章對照題型","translation":"關於投資者，可以推知什麼？","reason":"這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 the investors 出現的第一封電子郵件。\n線索1：第一封電子郵件中的 Can you reserve spa treatments for our investors ~? There are eight of them in total. 詢問是否可以為投資者預約 spa 療程，並且說總共有 8 個人。不過，這裡看不出來是否可以 8 個人同時接受 spa 療程，所以還需要參考第二封電子郵件中的相關內容。\n線索2：第二封電子郵件中的 we can only accommodate six spa appointments at once 提到，同時只能接受 6 個 spa 預約。\n綜合這兩個線索，可知因為同時只能接受 6 個 spa 預約，所以 8 名投資者不能同時接受 spa 療程，(D) 是正確答案。","vocab":"overnight adv. 一夜間，在夜間","paraphrase":""},"181":{"type":"尋找主題／目的 寫文章的理由","translation":"尋找主題／目的 寫文章的理由","reason":"這一題問的是填表（第一篇文章）的理由。在表單中，All arriving passengers must fill out the ~ form. 的部分提到所有入境乘客都必須填妥這張單子，所以 (B) 是正確答案。","vocab":"obtain v. 得到，取得　permission n. 許可　comply with phr. 遵守……","paraphrase":""},"182":{"type":"Not/True Not 題型","translation":"表單上沒有提供什麼資訊？","reason":"這是 Not/True 題型，要找出和關鍵詞語 information ~ provided on the form 有關的內容，並且對照選項判斷答案，所以看表單（第一篇文章）的內容。(A) 在 Number of Family Members With You, 3 的部分表明同行家人有 3 人，是符合選項的內容。(B) 在 Countries visited on this trip, Spain, Portugal 的部分表明這次旅行去過西班牙和葡萄牙，是符合選項的內容。(C) 在文章中沒有提到，所以 (C) 是正確答案。(D) 在 Passport Issued by, United States 的部分表明護照是美國發行的，是符合選項的內容。","vocab":"","paraphrase":""},"183":{"type":"wh-問題 Why","translation":"Larson 先生為什麼去旅行？","reason":"這是問 Larson 先生為什麼（Why）去旅行的 wh- 問題，所以要從他所填寫的表單（第一篇文章）中找出和關鍵詞語 Mr. Larson go on a trip 有關的內容。The primary purpose of this trip is I flew to Spain to help my father move into his new home 的部分提到，這次旅行的主要目的是飛到西班牙幫爸爸搬進新家，所以 (B) 是正確答案。\n變換表達方式\nto help ~ father 幫助爸爸 → To assist a family member 協助家人","vocab":"assist v. 協助","paraphrase":""},"184":{"type":"wh-問題 多篇文章對照題型","translation":"國際航空公司承諾做什麼？","reason":"這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 International Airlines promise to do，要問國際航空公司承諾做什麼（What），所以先看國際航空公司客服部所寫的電子郵件。\n線索1：電子郵件（第二篇文章）中，we will ship it to your home address 的部分提到，會把「它」（旅行袋）寄送到您（Larson 先生）的住家地址。不過，這裡沒有提到 Larson 先生的家在哪裡，所以還需要參考表單的內容。\n線索2：表單（第一篇文章）中，Address, 88 Pingree Drive, Stamford, CT 06831 的部分顯示 Larson 先生的家在康乃狄克州史丹福的 Pingree 路 88 號。\n綜合這兩個線索，可知國際航空公司承諾把物品運送到 Larson 先生在史丹福的家，所以 (C) 是正確答案。","vocab":"look into phr. 調查，研究　missing adj. 遺失的　correct v. 修正","paraphrase":""},"185":{"type":"wh-問題 How","translation":"Larson 先生如何利用免費的國內航班？","reason":"這是問 Larson 先生可以如何（How）利用免費國內航班的 wh- 問題，所以要從提到國內航班的電子郵件（第二篇文章）中找出和關鍵詞語 Mr. Larson take advantage of a free domestic flight 有關的內容。you are now entitled to one round-trip domestic flight. You can take advantage of this offer at any time. To use it, visit our Web site and click \"Redeem my flyer points\" during the checkout process. 的部分提到，「您」（Larson 先生）現在有資格兌換一組國內來回機票，可以隨時利用這個優惠，然後說明如果要使用優惠的話，要上網站並且在結帳過程中點擊「兌換我的飛行點數」，所以 (D) 是正確答案。\n變換表達方式\na free domestic flight 免費國內航班 → entitled to one round-trip domestic flight 有資格得到國內來回機票的","vocab":"","paraphrase":""},"186":{"type":"Not/True True 題型","translation":"關於 Mario's，提到了什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Mario's 有關的內容，並且對照選項判斷答案，所以看介紹這家業者的小冊子（第一篇文章）。(A)、(B)、(C) 在文章中沒有提到。(D) 在 It is still owned by founder Mario Robledo but is currently managed by his younger brother, Sandro. 的部分提到，「它」（Mario's）仍然為創辦人 Mario Robledo 所擁有，但目前由他的弟弟 Sandro 經營，符合選項敘述，所以 (D) 是正確答案。\n變換表達方式\nis ~ managed by 由……所經營 → is operated by 由……所營運","vocab":"earn v. 賺，獲得　award n. 獎項　operate v. 營運","paraphrase":""},"187":{"type":"Not/True True 題型","translation":"關於 Thomas 小姐，何者正確？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Ms. Thomas 有關的內容，並且對照選項判斷答案，所以看 Thomas 小姐所填的申請表（第二篇文章）。(A)、(C)、(D) 在文章中沒有提到。(B) 從 Mario's Catering Request Form 可以看出這是 Mario's 的外燴申請表，而 I don't remember which dishes we had at last year's event 的部分提到自己不記得在去年的活動吃了哪些菜，由此可知她使用過 Mario's 的服務，所以 (B) 是正確答案。","vocab":"strict adj. 嚴格的","paraphrase":""},"188":{"type":"推論 多篇文章對照題型","translation":"關於 Madison 私人銀行，文中提到什麼？","reason":"這是需要對照兩篇文章內容的推論題型，先看說明題目關鍵詞語 Madison Private Bank 相關細節的申請表。\n線索1：申請表（第二篇文章）中的 Organization: Madison Private Bank、Number of guests: 45、Preferred Menu: X Menu D 顯示，Madison 私人銀行要預訂 45 人的外燴服務，偏好的菜單是菜單 D。不過，這裡沒有提到預訂方案的其他細節，所以還需要參考小冊子的相關內容。\n線索2：小冊子（第一篇文章）中的 Menu D、A 20 percent discount is applicable for groups of 40 or more. 顯示，菜單 D 有 40 人以上團體的 20% 折扣。\n綜合這兩個線索，可知因為 Madison 私人銀行要預訂 45 人的菜單 D 服務，所以能得到 20% 折扣，(D) 是正確答案。\n變換表達方式\nA 20 percent discount is applicable 適用 20% 折扣 → is entitled to a 20 percent discount 有資格獲得 20% 折扣","vocab":"budget n. 預算　be entitled to phr. 有資格得到……","paraphrase":""},"189":{"type":"推論 多篇文章對照題型","translation":"關於客戶感謝晚宴，可以推知什麼？","reason":"這是需要對照兩篇文章內容的推論題型，先看提到關鍵詞語 the client appreciation dinner 相關要求的申請表。\n線索1：申請表（第二篇文章）中的 Date of event: August 28、this year's client appreciation dinner 顯示，年度客戶感謝晚宴申請的活動日期是 8 月 28 日。不過，這裡看不出活動實際執行的情況，所以還需要參考備忘錄中的相關內容。\n線索2：備忘錄（第三篇文章）中的 our annual client appreciation dinner takes place on Wednesday, September 3. Please note that the date has been changed. 提到，年度客戶感謝晚宴在 9 月 3 日星期三舉行，並且提醒注意日期變更了。\n綜合這兩個線索，可知年度客戶感謝晚宴原本預定在 8 月，後來被延到 9 月，所以 (C) 是正確答案。","vocab":"register v. 登記　postpone v. 延期","paraphrase":""},"190":{"type":"wh-問題 What","translation":"Thomas 小姐指示她的同事做什麼？","reason":"這是問 Thomas 小姐指示她的同事做什麼（What）的 wh- 問題，所以要從她所寫的備忘錄（第三篇文章）找出相關的內容。公告中的 Please make sure you wear formal attire 提醒務必穿著正式服裝，所以 (B) 是正確答案。\n變換表達方式\nwear formal let swipeStart = null;

const quizTouch = document.getElementById('quiz');
quizTouch.addEventListener('touchstart', event => {
  swipeStart = null;

  if (event.target.closest('a, input, textarea, select')) return;
  const touch = event.touches[0];

}, {passive:true});
quizTouch.addEventListener('touchend', event => {
  if (!swipeStart || event.changedTouches.length !== 1) {swipeStart=null;return;}
  const start = swipeStart; swipeStart=null;
  const touch=event.changedTouches[0];
  const dx=touch.clientX-start.x, dy=touch.clientY-start.y;
  // 至少水平移動 65px，且水平位移須明顯大於垂直位移。
  if (Math.abs(dx)<65 || Math.abs(dx)<Math.abs(dy)*1.6 || Date.now()-start.time>1500) return;
  if (window.getSelection()?.toString()) return;

cloud.setStar=async(id,marked)=>{if(!activeCode){if(marked)stars[id]=true;else delete stars[id];localSave();render();return}const ref=doc(root('stars'),String(id));if(marked)await setDoc(ref,{marked:true});else await deleteDoc(ref)};
cloud.importAnswers=async(items)=>{if(!activeCode){records={...records,...items};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const entries=Object.entries(items);for(let i=0;i<entries.length;i+=400){const batch=writeBatch(db);for(const [id,data] of entries.slice(i,i+400))batch.set(doc(root('answers'),id),data);await batch.commit()}};
cloud.saveDrill=async(data)=>{if(!activeCode||!cloud.ready)throw Error('錯題雲端尚未載入');await setDoc(doc(db,'practiceCodes',activeCode,'test06_drill','state'),data)};
cloud.resetAnswers=async()=>{if(!activeCode){records={};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const ids=Object.keys(remoteAnswers);for(let i=0;i<ids.length;i+=400){const batch=writeBatch(db);ids.slice(i,i+400).forEach(id=>batch.delete(doc(root('answers'),id)));await batch.commit()}};
function goLocal(){window.readingGate?.lock();stopListeners();activeCode='';cloud.mode='local';window.toeicRestoreLocalDrill?.();input.value='';input.disabled=false;connect.disabled=false;leave.hidden=true;window.toeicClearRemote?.();info('本機模式：未連線雲端，作答只保存在此瀏覽器。')}
leave.addEventListener('click',goLocal);
connect.addEventListener('click',async()=>{const code=input.value.trim();if(!allowed.includes(code)){info('代號無效，請輸入有效的使用者代號。');return}if(activeCode===code&&cloud.ready)return;stopListeners();activeCode=code;cloud.mode='loading';cloud.ready=false;window.toeicApplyRemote?.({},{});window.toeicApplyDrillRemote?.({});connect.disabled=true;leave.hidden=false;info('正在載入雲端歷史紀錄，請不要作答…');let token=generation;
try{if(!auth.currentUser)await signInAnonymously(auth);if(token!==generation)return;
const a=onSnapshot(collection(db,'practiceCodes',code,'test06_answers'),snap=>{if(token!==generation)return;remoteAnswers={};snap.forEach(d=>{if(/^\d+$/.test(d.id))remoteAnswers[d.id]=d.data()});loadedA=true;sync()},err=>{if(token===generation){info('讀取雲端失敗：'+err.message+'。請檢查匿名驗證與 Firestore 規則。');connect.disabled=false}});
unsub.push(a);
const b=onSnapshot(collection(db,'practiceCodes',code,'test06_stars'),snap=>{if(token!==generation)return;remoteStars={};snap.forEach(d=>{if(/^\d+$/.test(d.id)&&d.data().marked)remoteStars[d.id]=true});loadedS=true;sync()},err=>{if(token===generation){info('讀取星號失敗：'+err.message);connect.disabled=false}});unsub.push(b);
const c=onSnapshot(collection(db,'practiceCodes',code,'test06_highlights'),snap=>{if(token!==generation)return;remoteExcerpts={};snap.forEach(d=>{const items=d.data().items;if(/^\d+$/.test(d.id)&&Array.isArray(items))remoteExcerpts[d.id]=items.filter(x=>typeof x==='string')});loadedE=true;sync()},err=>{if(token===generation){info('讀取文字摘錄失敗：'+err.message+'。請更新 Firestore 規則。');connect.disabled=false}});unsub.push(c);
const d=onSnapshot(doc(db,'practiceCodes',code,'test06_drill','state'),snap=>{if(token!==generation)return;remoteDrill=snap.exists()?snap.data():{};drillVersion++;loadedD=true;sync()},err=>{if(token===generation){info('讀取錯題練習失敗：'+err.message+'。請先更新 Firebase Rules。');connect.disabled=false}});unsub.push(d);
}catch(err){if(token===generation){info('Firebase 連線失敗：'+err.message);connect.disabled=false}}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();connect.click()}});
// 在雲端讀取期間禁用作答；已離線作答不會自動上傳。
const originalSave=cloud.saveAnswer,originalStar=cloud.setStar,originalImport=cloud.importAnswers,originalReset=cloud.resetAnswers;
for(const [name,fn] of [['saveAnswer',originalSave],['deleteAnswer',cloud.deleteAnswer],['setStar',originalStar],['importAnswers',originalImport],['resetAnswers',originalReset],['saveExcerpts',cloud.saveExcerpts]])cloud[name]=async(...args)=>{if(cloud.mode==='loading'||activeCode&&!cloud.ready)throw Error('雲端正在載入或連線異常，無法儲存；請退出雲端模式後使用本機練習。');return fn(...args)};
onAuthStateChanged(auth,user=>{if(!user&&activeCode){window.readingGate?.lock();info('Firebase 驗證已中斷，請重新按「載入雲端紀錄」。');stopListeners();connect.disabled=false}});
</script></body></html>
