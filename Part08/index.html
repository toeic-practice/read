 cancel my original order and place a new one. Please let me know.</p><p>Sincerely,<br/>Jeff Adams</p></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>191-195 · 1/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Jade Liu j.liu@zhongacademy.org</strong></div><div class=\"doc-field\"><span>From</span><strong>Jason Richards jasonrich382@goodmail.net</strong></div><div class=\"doc-field\"><span>Date</span><strong>November 20</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Sunday classes</strong></div></div><p>Dear Ms. Liu,</p><p>I'm interested in taking your business Chinese class on Sunday mornings. I've studied Chinese using language training software, so I'm somewhat proficient. However, I'd like to take a test to determine my fluency level before I register. Please let me know the procedure for this as I was unable to find information about it on your Web site.</p><p>Also, when checking class times online, I noticed that you have free screenings of popular Chinese movies at your academy. My friend went to the one you held on November 12 and said it was educational. I'd like to go to next month's showing, and I'm wondering if I need to sign up.</p><p>Kindest regards,<br/>Jason Richards</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM</span><small>191-195 · 2/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">ZHONG ACADEMY Class Registration for December</h2><div class=\"document-table-wrap\"><table><tr><td>Name</td><td>Jason Richards</td></tr><tr><td>Level According to Test</td><td>Beginner</td></tr><tr><td>Address</td><td>51 Rye Street, Concord, NH 03302</td></tr><tr><td>Preferred Class Time</td><td>Sundays 10 A.M. – 11:30 A.M.</td></tr><tr><td>Phone</td><td>555-7244</td></tr><tr><td>Tuition Fee</td><td>$200</td></tr><tr><td>E-mail</td><td>jasonrich382@goodmail.net</td></tr><tr><td>Tuition Due Date</td><td>November 30</td></tr><tr><td>Was our academy recommended to you by someone?</td><td>Yes</td></tr><tr><td>If so, please provide the name of this individual.</td><td>Robin Ghose</td></tr></table></div><p>To change your class time, make a request at our main desk. If you recommend us to someone and that person enrolls, you will receive a 15 percent discount on your next class.</p></div></section><section class=\"document-card type-newsletter\"><div class=\"doc-ribbon\"><span>NEWSLETTER</span><small>191-195 · 3/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">Zhong Academy Monthly Newsletter<br/>December 1</h2><p>Watching a Chinese movie is one way to improve your language skills. Two Chinese film events are taking place locally this month.</p><p>The Bright Lights Film Festival will be held at the Cloudbank Hotel on December 20. It will feature a new release from Xu Yue, the director of the critically acclaimed film Summer Shore. Xu's latest work, Washing Away, is about a young dancer from Shanghai. Tickets for the festival are $20 and can be purchased by logging on to www.blffest.org.</p><p>Additionally, you can attend a free viewing of Grave Mistakes by Chinese director Wei Chung. It will be shown on December 28 here at Zhong Academy. Viewings at the academy are held monthly and are strictly for students enrolled in intermediate or advanced classes. As we did last month after our showing of River Goddess, we will have a discussion in Chinese after this month's screening.</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE</span><small>196-200 · 1/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Seeking Sources for TV Episode on Emerald Falls</h2><p>Director Hector Almonte is currently seeking interviewees for a television episode on the town of Emerald Falls. The episode is being produced for The Good Old Days, an award-winning documentary series that is hosted by Janet Leslie. For its second season, the series will be expanded from 10 to 12 episodes. It will continue to profile historic towns across Belize through video interviews and on-location footage. Interviewees do not need to reside in Emerald Falls but must have a strong connection with the town. For more information, please call (501) 555-7925.</p><p>In addition, Mr. Almonte hopes to gain access to letters, photos, and other items that can provide insights into the town's beginnings. If you have such artifacts and are prepared to loan them out, you are kindly asked to contact his assistant Chloe Benbow at c.benbow@sunrise.bz.</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL</span><small>196-200 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>To</span><strong>Chloe Benbow c.benbow@sunrise.bz</strong></div><div class=\"doc-field\"><span>From</span><strong>Elaine Kershaw elaine.k@eurekamail.bz</strong></div><div class=\"doc-field\"><span>Subject</span><strong>Old pictures of Emerald Falls</strong></div><div class=\"doc-field\"><span>Date</span><strong>July 25</strong></div></div><p>Dear Ms. Benbow,</p><p>I was excited to read that Emerald Falls will appear on The Good Old Days. I enjoyed last season's finale on Pepita de Oro.</p><p>Though I have never lived in Emerald Falls, my father was born there, and I have a collection of photographs and paintings of the town from the time when my grandfather was the mayor. My grandfather purchased the paintings from a local artist. Their titles are Picnic by the Falls, Plaza Esperanza, and The Grand Carnival.</p><p>I would be happy to loan you the photographs, but the paintings must remain in my home because of their value. If Mr. Almonte would like to film them, he may visit me here in Maracuyá.</p><p>Sincerely,<br/>Elaine Kershaw</p><p>Director Hector Almonte commented, \"For the second season, we looked for sources with personal links to the towns. The Emerald Falls episode turned out nicely thanks to everyone who shared stories and memorable objects.\"</p><p>Next week, episode 5 will be released. The director says that he wants the location to be a surprise.</p></div></section><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE</span><small>196-200 · 3/3</small></div><div class=\"document-body\"><p>BELIZE CITY (December 15)— Viewer ratings have been rising for The Good Old Days, a documentary series on the country's heritage towns. The most recent episode focused on Emerald Falls, a once thriving mining community that has since been depleted of its celebrated mineral deposits. Although the population has dwindled significantly, the town still looks much as it did before. In one scene of the episode, we are shown the Jana Haynes's painting Plaza Esperanza that reveals how life in Emerald Falls has changed.</p><p>Director Hector Almonte commented, \"For the second season, we looked for sources with personal links to the towns. The Emerald Falls episode turned out nicely thanks to everyone who shared stories and memorable objects.\"</p><p>Next week, episode 5 will be released. The director says that he wants the location to be a surprise.</p></div></section></div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>公司備忘錄</span><small>131-134 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>全體員工</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>辦公室經理 Warren Harris</strong></div><div class=\"doc-field\"><span>日期</span><strong>8月15日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>用電情形</strong></div></div><p>我要提醒各位，本月辦公室的水電費比去年同期高出將近15%。我認為這不可接受，尤其公司已實施多項節約成本的措施，例如去年秋季整修時安裝節能燈具和窗戶。因此，請各位採取明智的做法。只要有一點理性和良好判斷，我相信我們就能減少開支。首先，請關閉不使用的設備。感謝理解，如果您還有其他節能建議，歡迎告訴我。</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-press\"><div class=\"doc-ribbon\"><span>新聞稿</span><small>135-138 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">新聞稿—Basinet Books<br/>Basinet Books 即將推出自己的 Podcast</h2><p>Basinet Books 出版社即將為歷史小說愛好者製作每週播出的 Podcast。第一集將於7月15日上線，介紹這一文類近來的熱潮，以及歷史與小說之間的關係。之後每集都會聚焦一本小說；所有選書都將是新出版的作品。出版社暗示節目由一位知名演員主持，而這位演員據說曾主演多部小說改編電影。每集都能透過 StarLadder 行動應用程式收聽。</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>139-142 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Belinda Wright bw4637@advertx.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Jamie Garnett jg4548@advertx.com</strong></div><div class=\"doc-field\"><span>主旨</span><strong>緊急請求</strong></div><div class=\"doc-field\"><span>日期</span><strong>2月11日</strong></div></div><p>Belinda，你好：</p><p>假期過得如何？我知道你的休假到2月14日星期五，但想問你能否在那天返回公司。Nektar Beverages 突然要求更改他們委託的廣告。這很令人意外，因為上週他們似乎還很滿意。你是主要設計師，因此最適合處理最後修訂。工作大概需要五到六小時。</p><p>為了補償你，我們會依2月14日的標準加班費率付薪，並額外提供一天休假。</p><p>先謝謝你。<br/>Jamie</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>新聞／文章</span><small>143-146 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">GEOnet Solutions 的新展望</h2><p>波士頓（10月9日）— GEOnet Solutions 宣布將業務拓展至海外，在倫敦開設衛星分公司。20多年來，這家總部位於波士頓的技術開發先驅，創造許多使用地質科技的創新方法，並促成領域內無數進展。事實上，若沒有其努力，數百萬人每天使用的資料蒐集系統與追蹤工具便不會存在。</p><p>在昨日公布的聲明中，代表 Tomas Fuller 表示，此次擴張的首要目標是促進與倫敦技術中心的合作。雙方相信合作將互惠互利。</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>公司備忘錄</span><small>147-148 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>全體員工</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>執行長 Nadori Seiko</strong></div><div class=\"doc-field\"><span>主旨</span><strong>每月銷售挑戰</strong></div><div class=\"doc-field\"><span>日期</span><strong>12月2日</strong></div></div><p>感謝大家參與每月銷售競賽。因為各位的努力，我們爭取到幾名新客戶。這項挑戰原本著重個人成績，後來發展成良好的團隊合作經驗。Aaron 與 Marisol 的銷售額最高，兩人都將獲得 Spanto Restaurant 禮券。</p><p>我對活動帶來的熱情和團隊精神感到驚喜，因此每位同仁都可額外休假一天。主管團隊也決定將來再辦一次。請以電子郵件提供新的獎品建議，對象可以是個別員工或整個團隊。</p></div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>公告通知</span><small>149-150 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">Cole Theater 會員資訊</h2><p>可在 www.coletheater.com/join 或任一售票窗口申請會員。會員卡每12個月需更新一次。</p><p>會員福利<br/>• 獨家電影首映會門票，並有知名演員出席<br/>• 早場入場費6美元<br/>• 下午、晚上及週末場次享九折優惠<br/>• 可用獎勵點數兌換免費販賣部商品或電影票</p><p>詳情請寄信至 extras@coletheater.com。</p></div></section></div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 151-152</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>即時對話</span><small>151-152 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>上午11:33</time></div><div class=\"message-text\">你今天有為 Kent Street 的兩房住宅辦公開看屋活動嗎？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Connie Mills</strong><time>上午11:35</time></div><div class=\"message-text\">不到半小時就開始了。我正在現場布置。怎麼了？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>上午11:36</time></div><div class=\"message-text\">我忘了帶 North Avenue 182號公寓的鑰匙。我現在正在車上，記得你通常有備用鑰匙。我正開車經過 Sydney Mountain Mall。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Connie Mills</strong><time>上午11:38</time></div><div class=\"message-text\">我有。中午前都能來拿。車道要留給可能提前到的買家，請停在轉角那邊的路上。我看到人行道旁有幾個空位。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Neil Pollard</strong><time>上午11:41</time></div><div class=\"message-text\">太好了！非常感謝。</div></div></div></div></section></div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 153-154</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>正式信函</span><small>153-154 · 1/1</small></div><div class=\"document-body\"><p>Brugeri 美術館<br/>Empire Street 856號，Grants Pass, OR 97527<br/>9月9日</p><p>Robert Jansen<br/>3111 Helmsview Drive<br/>Arcata, CA 95521</p><p>Jansen 先生您好：</p><p>很遺憾通知您，您今年慷慨借給美術館的雕像《Descending Cherub》昨天受損。員工原本正把戶外雕塑花園的作品搬入主要展廳，天氣卻突然轉變，沒能及時處理您的作品。強風吹倒雕像，從底座跌落，造成左手斷裂。隨信附上損壞部位的照片。</p><p>保險公司當然會給予金錢賠償，我們也會支付專業修復費用。若您同意，我們可聘請專業人士；若您想自行指定修復者，只需告知，我們會立刻將作品寄還。</p><p>再次為這起意外致歉，期待您的回覆。<br/>Mia Hyman<br/>Brugeri 美術館策展人<br/>附件</p></div></section></div>","155-157":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 155-157</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>新聞／文章</span><small>155-157 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">Steel Works 新廠正式營運</h2><p>Steel Works 公司新廠開始營運。這座耗資6,000萬美元的煉鋼廠每年可生產約100萬噸鋼筋，將推動馬來西亞建築業成長。</p><p>執行長 Aiman Musa 表示，設於 Kampung Tebing 的新廠會向國內各地供應鋼筋，協助城市建設基礎設施。</p><p>這是 Steel Works 的第二座工廠。Rembau 的第一座廠目前所有產品都出口至其他亞洲國家，過去卻曾供應國內將近一半的鋼鐵需求。該廠去年完成升級，已是亞洲最現代化的鋼鐵廠之一。公司採用最新技術，兼顧高效率與低環境衝擊。</p><p>隨著 Kampung Tebing 廠成立，公司在馬來西亞的市場占有率預計上升至72%；新廠開幕後，當地證交所的公司股價上漲24%。</p></div></section></div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 158-160</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>158-160 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>全體行銷人員</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Linda Marks</strong></div><div class=\"doc-field\"><span>主旨</span><strong>會議交通安排</strong></div><div class=\"doc-field\"><span>日期</span><strong>10月14日</strong></div></div><p>各位同事：</p><p>許多人星期五將前往 Wilmington 參加社群媒體研討會。若打算搭公司包租巴士，請於 A 停車場集合，上午8:30準時出發。也可自行開車或搭大眾運輸工具，前一封郵件已提供 Wilmington 會議中心的路線資訊。</p><p>未出席會議的同仁請注意，我們上週新取得的客戶 Whitaker's Sports Apparel 代表約在上午10點來訪。我已告知他們因會議幾乎無人在辦公室，但他們當天恰好在城裡，仍希望順道拜訪。會計部 Robert Buck 會接待並簡介辦公室，有機會請向他們自我介紹。</p><p>謝謝。<br/>Linda Marks</p></div></section></div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 161-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>即時對話</span><small>161-164 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>上午11:08</time></div><div class=\"message-text\">昨天我遲到了，錯過11月初會議的部分內容，想請問加班政策有什麼更改。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>上午11:09</time></div><div class=\"message-text\">當然可以。你沒收到 Ward 先生剛寄的備忘錄嗎？裡面整理了新規定。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>上午11:10</time></div><div class=\"message-text\">我只快速看過，看到程序簡化。現在不用再交加班申請表了嗎？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>上午11:12</time></div><div class=\"message-text\">是的。以前很多同事加班完成專案，卻因沒有提交正式文件而只領到正常薪水。很多人覺得表格太複雜。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Gene Shipley</strong><time>上午11:13</time></div><div class=\"message-text\">現在每週工作超過40小時就會自動取得加班費，只要把資訊輸入薪資系統。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Karen Bingham</strong><time>上午11:13</time></div><div class=\"message-text\">沒錯。12月1日上午9點起生效，每月底主管會審查登錄內容；如果沒有問題，當時就會核准。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Ned O'Toole</strong><time>上午11:15</time></div><div class=\"message-text\">這真是好消息，想到接下來幾週要做的大專案，特別有幫助。謝謝！</div></div></div></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>新聞／文章</span><small>165-167 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">DTA 準備全面翻修機場</h2><p>丹佛交通局（DTA）宣布將投入5,000萬美元改建丹佛郊外的 Franklin 機場。國家航空集團（NAG）認定該機場跑道對大型飛機構成危險，促成此次公告。NAG 負責制定全美機場的安全規定。</p><p>局長 Elaine Webster 表示：「11年前接管機場時，我們本想立刻重建，卻一直遇到預算延誤。如今依照 NAG 最新判定，終於取得聯邦資金，可修復跑道並擴建航廈。」</p><p>DTA 已聘請多家建築公司，預計18個月內完工。A航廈擴建完成才會開始B航廈施工，讓機場在工程期間持續全面運作。完工後，Franklin 機場將開始提供國際航班抵達與出發服務。</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>168-171 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Joan Stendhal joan.stendhal@mynextmail.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Robert Hamilton r.hamilton@pichaipartners.com</strong></div><div class=\"doc-field\"><span>日期</span><strong>9月18日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>您的應徵申請</strong></div></div><p>Stendhal 小姐您好：</p><p>恭喜！在數百名申請者中，我們選出您進入下一階段，到辦公室參加面試。[1]</p><p>面試安排於9月23日（星期五）下午1點至5點。不同活動之間可休息30分鐘。面試分兩階段：第一階段由高階主管組成的小組提問，完成後請留在附近等候第二階段通知。第二階段您將分析本所曾處理的實際法律案件，先花一小時獨立研究第一個案件，[2] 再兩人一組研究另一個案件，以評估溝通與團隊合作能力。更多細節當天提供。[3]</p><p>我們會提供所需文具、圖書館指定法律書籍等所有材料，[4] 因此您不必自行攜帶。也會提供茶點。</p><p>請回覆郵件確認出席；如有問題請撥555-4883。<br/>Robert Hamilton</p></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>公告通知</span><small>172-175 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">為公益而跑！</h2><p>Highland 就業中心的「技術訓練」計畫需要您的支持。許多人缺乏基本電腦技能，難以找到工作。我們希望募款聘請一名電腦講師，連續一年每週在中心開設免費工作坊，協助求職者增進技能與收入。</p><p>您可以參加8月15日在 Arthur Park 舉辦的10公里路跑。7月報名費40元；8月1日至14日45元；比賽當天50元。穿著創意服裝參賽者有機會贏得 Harlan Foods 100元禮券；服裝競賽結果將於賽後宣布。</p><p>跑者可領取包含號碼布與個人物品收納袋的選手包。兩小時內完成路跑者將獲得一張衝過終點線的個人照片。報名：www.highlandec.com/10k</p></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>176-180 · 1/2</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>寄件者</span><strong>Rachel Duval rduval@pfmagazine.com</strong></div><div class=\"doc-field\"><span>收件者</span><strong>John Hassan j.hassan@pfmagazine.com</strong></div><div class=\"doc-field\"><span>日期</span><strong>7月29日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>九月號</strong></div></div><p>John，你好：</p><p>雖然九月號已完成不少工作，我們仍有幾項決定要做。首先，必須選擇封面模特兒。這通常是全年最受歡迎的一期，因此我們需要邀請重量級名人。再次與 Su-min Yoo 合作如何？她有一部賣座電影將於十月上映，如果讓她登上封面，應有助於提高雜誌銷量。請聯絡她的經紀人，試著安排合作。</p><p>第二，Russo Shampoo 突然決定不在九月號刊登廣告。因此，我們急需填補第58與59頁。你提到 SameSide Cosmetics 有意在我們雜誌登廣告，宣傳十月推出的有機環保護膚乳霜新系列。能否確認他們是否願意把握這個機會？我們可以提供20%折扣。</p><p>最後，請徹底查核九月號關於加拿大設計師 David Burns 的文章內容。</p><p>謝謝。<br/>Rachel Duval<br/>總編輯，PopFashion 雜誌</p></div></section><section class=\"document-card type-catalog\"><div class=\"doc-ribbon\"><span>雜誌目錄</span><small>176-180 · 2/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">PopFashion 雜誌九月號目錄</h2><div class=\"document-table-wrap\"><table aria-label=\"中英文對照資料表\" class=\"document-table\"><tr><th>頁碼</th><th>內容</th></tr><tr><td>11</td><td>季節美容趨勢：新化妝品評測</td></tr><tr><td>16</td><td>封面人物專訪：Michelle Ford 談即將登場的百老匯首演</td></tr><tr><td>25</td><td>時尚產業專欄：七位最具創新精神的美國設計師</td></tr><tr><td>35</td><td>時尚產業專欄：探索紐約頂尖裁縫的作品</td></tr><tr><td>48</td><td>文章：柏林為何正成為歐洲時尚之都</td></tr><tr><td>52</td><td>人物側寫：加拿大首席設計師在退休前回顧職涯</td></tr><tr><td>60</td><td>穿搭建議：找出適合身形的服飾</td></tr><tr><td>68</td><td>染髮教學：逐步學會使用染髮劑</td></tr><tr><td>78</td><td>特別專題：探索印度當代時尚</td></tr></table></div></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>公告通知</span><small>181-185 · 1/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">購物也能帶來改變！</h2><p>今年布里斯托的「支持在地商家日」訂於4月28日（星期六）。當天請不要到全國連鎖店，而是到社區的小商店購物。如此能協助地方經濟，因為這些企業的營收會留在本鎮。此外，Birdy Beets 餐廳、Tinker Time 手工藝品店和 Kara Lee's 服飾精品店等參與商家同意捐出當日獲利的10%給布里斯托商業協會（BBA），用於持續推動當地慈善計畫。</p><p>除了購物，「支持在地商家日」還有特別活動。請至 www.bristolsylbd.com 查看參與商家與活動時程。</p></div></section><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>活動時程</span><small>181-185 · 2/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">支持在地商家日｜4月28日｜布里斯托</h2><p>給社區居民的演講｜上午9:00–9:30<br/>地點：Anchor Square<br/>布里斯托商業協會會長 Emmanuel Perez 將說明在地商家的重要性，並介紹協會即將推動的計畫。</p><p>徒步導覽｜上午9:40–10:15<br/>集合地點：Craft Street Antiques<br/>沿 Dalton Street 散步，認識街道建築的歷史。最後一站為布里斯托最古老的建築之一 Wayfair House，首次開放民眾參觀，免費入場。</p><p>購物換午餐｜上午10:30–下午1:00<br/>地點：市中心購物區<br/>若在三家不同的本地商店消費，即可獲得參與餐廳的免費午餐券。請於下午1:30前向遊客服務處出示收據。</p><p>綠地音樂會｜中午12:00–下午4:00<br/>地點：市中心 Green Park<br/>在地樂團將於 Green Park 舞台進行每場30分鐘的演出，附近帳篷也有提供給兒童的趣味美術與手工藝工作坊。</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>新聞／文章</span><small>186-190 · 1/3</small></div><div class=\"document-body\"><p>2月12日— 市長 David Wilkins 在2月10日記者會中宣布新建一座四車道橋梁的計畫。施工預定5月14日開始、12月23日結束，預期能緩解市內交通壅塞，特別是從市中心前往北區的通勤族。不過，由於部分道路將暫時封閉，施工期間交通可能更加壅塞。</p><p>Harris Road 與 Oak Boulevard 將於5月14日至8月1日封閉；Center Avenue 於8月5日至10月10日禁止汽車通行；Harbor Way 則於10月12日至12月20日封閉。經常使用這些道路的通勤族應至交通部網站查詢替代路線。</p></div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>公司備忘錄</span><small>186-190 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Bellwood Sporting Goods 全體員工</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Beth Ferrell，經理</strong></div><div class=\"doc-field\"><span>主旨</span><strong>因應計畫</strong></div><div class=\"doc-field\"><span>日期</span><strong>7月10日</strong></div></div><p>如我昨天在員工會議所說，從8月5日起，店門前道路封閉恐嚴重影響門市銷售。因此我決定在此期間推出兩項網路促銷，希望透過網站銷售彌補來店顧客減少的損失。店內及線上所有鞋類商品均降價15%，且所有線上訂單免運費。請務必告知顧客這些優惠。</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>186-190 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>customerservice@bellwood.com</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>jadams@ezmail.com</strong></div><div class=\"doc-field\"><span>日期</span><strong>8月12日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>訂單編號029384</strong></div></div><p>我8月9日在貴公司網站買了一件外套。遺憾的是，我才發現自己選的是大號，而非特大號。我希望在出貨前修改，以免之後退貨。可以直接將商品換成我原本想訂的尺寸嗎？如果不行，我想只能取消原訂單再重新下單。請告訴我是否可行。</p><p>祝好<br/>Jeff Adams</p></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>191-195 · 1/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Jade Liu j.liu@zhongacademy.org</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Jason Richards jasonrich382@goodmail.net</strong></div><div class=\"doc-field\"><span>日期</span><strong>11月20日</strong></div><div class=\"doc-field\"><span>主旨</span><strong>星期日課程</strong></div></div><p>Liu 小姐您好：</p><p>我有興趣參加星期日上午的商務中文課。我曾使用語言學習軟體學中文，已有一定程度，但希望報名前先測驗自己的流利程度。網站上找不到相關程序，煩請告知。</p><p>另外，我查詢課程時間時發現學院免費放映熱門華語電影。我的朋友參加了11月12日的放映，覺得很有教育意義。我也想參加下個月的放映，不知道是否需要報名。</p><p>敬祝安好<br/>Jason Richards</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>報名表</span><small>191-195 · 2/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">ZHONG ACADEMY｜12月課程報名表</h2><div class=\"document-table-wrap\"><table aria-label=\"中英文對照資料表\" class=\"document-table\"><tr><th>姓名</th><th>Jason Richards</th></tr><tr><td>測驗分級</td><td>初級</td></tr><tr><td>地址</td><td>51 Rye Street, Concord, NH 03302</td></tr><tr><td>偏好上課時間</td><td>星期日 上午10:00–11:30</td></tr><tr><td>電話</td><td>555-7244</td></tr><tr><td>學費</td><td>$200</td></tr><tr><td>電子郵件</td><td>jasonrich382@goodmail.net</td></tr><tr><td>繳費期限</td><td>11月30日</td></tr><tr><td>是否有人向您推薦本學院？</td><td>是</td></tr><tr><td>推薦人</td><td>Robin Ghose</td></tr></table></div><p>若要更改上課時間，請至櫃台提出申請。若您推薦他人且對方報名，您的下一門課可享15%折扣。</p></div></section><section class=\"document-card type-newsletter\"><div class=\"doc-ribbon\"><span>電子報</span><small>191-195 · 3/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">中華學院每月電子報｜12月1日</h2><p>看華語電影是提升語言能力的一種方式。本月當地將舉辦兩場華語電影活動。</p><p>12月20日於 Cloudbank Hotel 舉行 Bright Lights 電影節，將放映曾執導獲影評界讚譽的《Summer Shore》的導演 Xu Yue 最新作品《Washing Away》，講述一位上海年輕舞者的故事。門票20元，可於 www.blffest.org 購買。</p><p>此外，12月28日可在 Zhong Academy 免費欣賞中國導演 Wei Chung 的《Grave Mistakes》。學院每月舉辦的放映僅限中級或高級班學生參與。與上個月放映《River Goddess》後相同，本次放映後也會以中文討論。</p></div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>公告通知</span><small>196-200 · 1/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading\">徵求「Emerald Falls」電視節目受訪者</h2><p>導演 Hector Almonte 正在為介紹 Emerald Falls 小鎮的電視節目徵求受訪者。該集隸屬於 Janet Leslie 主持、獲獎紀錄片系列《The Good Old Days》。第二季將由10集增加至12集，繼續透過訪談與實地影像介紹貝里斯各地的歷史小鎮。受訪者不必住在 Emerald Falls，但必須與當地有深厚連結。詳情請致電 (501) 555-7925。</p><p>此外，導演希望借用能呈現小鎮早期歷史的信件、照片等物件。如您願意出借，請聯絡助理 Chloe Benbow：c.benbow@sunrise.bz。</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>電子郵件</span><small>196-200 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-fields\"><div class=\"doc-field\"><span>收件者</span><strong>Chloe Benbow c.benbow@sunrise.bz</strong></div><div class=\"doc-field\"><span>寄件者</span><strong>Elaine Kershaw elaine.k@eurekamail.bz</strong></div><div class=\"doc-field\"><span>主旨</span><strong>Emerald Falls 的舊照片</strong></div><div class=\"doc-field\"><span>日期</span><strong>7月25日</strong></div></div><p>Benbow 小姐您好：</p><p>讀到 Emerald Falls 將登上《The Good Old Days》令我興奮。我很喜歡上一季以 Pepita de Oro 為題的最後一集。</p><p>雖然我從未住在 Emerald Falls，但父親出生於此，且我收藏祖父擔任鎮長時期拍攝的當地照片及畫作。祖父向本地藝術家購得《Picnic by the Falls》、《Plaza Esperanza》和《The Grand Carnival》三幅作品。</p><p>我願意借出照片，但畫作價值高，必須留在家中。如果 Almonte 先生希望拍攝畫作，歡迎到 Maracuyá 的家中拜訪。</p><p>敬祝安好<br/>Elaine Kershaw</p></div></section><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>新聞／文章</span><small>196-200 · 3/3</small></div><div class=\"document-body\"><p>貝里斯市（12月15日）— 紀錄片系列《The Good Old Days》介紹貝里斯歷史城鎮，收視率持續上升。最近一集聚焦 Emerald Falls，這個曾繁榮的採礦社區因著名礦藏耗盡而式微。雖然人口大幅下降，小鎮景貌仍保留舊時模樣。節目的一幕展示了 Jana Haynes 的畫作《Plaza Esperanza》，呈現當地生活的變遷。</p><p>導演 Hector Almonte 表示：「第二季我們尋找與小鎮有個人連結的受訪者。多虧大家分享故事和珍貴物件，Emerald Falls 那集完成得很成功。」</p><p>下週將播出第5集；導演希望保持該集地點的神祕感。</p></div></section></div>"};const DETAILED_EXPLANATIONS={"101":{"type":"副詞位置","translation":"消費者調查顯示，人們願意花最多 1,200 元在新電腦上。","reason":"能夠用在助動詞（would）和動詞原形（spend）之間，並且修飾動詞的副詞 (B) happily（樂意地）是正確答案。形容詞 (A) 和 (D)、名詞 (C) 都不能修飾動詞。","vocab":"consumer n. 消費者　survey n. （問卷）調查　happiness n. 幸福，快樂","paraphrase":""},"102":{"type":"人稱代名詞的格","translation":"人稱代名詞的格","reason":"可以在名詞（chances）前面做修飾，功能相當於形容詞的所有格人稱代名詞 (B) your 是正確答案。主格或受格人稱代名詞 (A)、所有代名詞 (C)、反身代名詞 (D) 都不能修飾名詞。","vocab":"well-organized adj. 有條理的　résumé n. 履歷　boost v. 提高，增加　chance n. 可能性，機會","paraphrase":""},"103":{"type":"【可以接在 be 動詞後面的成分】被動態（be + p.p.）","translation":"","reason":"空格接在 be 動詞後面，所以名詞 (A)、能構成被動態的 p.p. 形 (C)、能構成進行式的 -ing 形 (D) 是可能的答案。因為要表達插畫被刊載在雜誌上的被動意義，所以能和空格前面的 be 動詞（been）構成被動態的 p.p. 形 (C) published 是正確答案。名詞 (A) 雖然可以接在 be 動詞後面當補語，但因為表示和主詞相同的對象，所以意思會變成「插畫曾經是出版者」，並不恰當。如果使用 -ing 形 (D)，則會形成現在完成進行式，意思變成「插畫曾經在進行出版的行為」，所以不對。動詞原形 (B) 不能接在 be 動詞後面。","vocab":"illustration n. 插畫　publisher n. 出版者，出版社","paraphrase":""},"104":{"type":"接 to 不定詞的動詞","translation":"慈善商店的 24 小時投入箱，讓人們能夠在方便的時候隨時捐贈二手衣物。 接 to 不定詞的動詞","reason":"空格前面的動詞 allow（使……可以做……），後面可以接 to 不定詞當受詞補語，所以 to 不定詞 (A) to donate 是正確答案。第三人稱單數動詞 (B)、動名詞或現在分詞 (C)、名詞 (D) 不能用在 allow 的受詞補語（to 不定詞）位置。就算想把現在分詞 (C) 看成修飾前面名詞（people）的成分，但因為 allow 是第 5 類句型動詞，這樣會使句子缺少句型所需要的受詞補語，所以不對。雖然也可以把 allow 看成第 4 類句型動詞的用法「容許，給予」，並且使用選項 (D) donation 而構成「allow + 間接受詞（people）+ 直接受詞（donation）」；但缺少了能連結後面名詞 used clothes 的連接詞，所以不對。","vocab":"charity n. 慈善，慈善團體　used adj. 用過的，二手的　donate v. 捐贈　donation n. 捐款，捐獻","paraphrase":""},"105":{"type":"名詞慣用表達方式","translation":"Chemie's 冰淇淋提供每個季節不同的各種產品。","reason":"句意是「提供各種產品」，所以能和空格前面的不定冠詞（an）、後面的介系詞（of）構成 an assortment of（各種的）的名詞 (B) assortment（各種各樣的混合）是正確答案。(A) interest 表示「興趣」，(C) advent 表示「到來，出現」，(D) influence 表示「影響」。","vocab":"offer v. 提供","paraphrase":""},"106":{"type":"副詞比較級","translation":"","reason":"空格後面有 than ever before（比以往任何時候），所以需要比較級副詞 (C) more quickly 是正確答案。原級副詞 (B) 不能和 than 連用。形容詞 (A) 不能修飾動詞。最高級副詞 (D) 不能和 than 連用。","vocab":"reward points phr. 紅利點數　credit card phr. 信用卡","paraphrase":""},"107":{"type":"題意解析","translation":"","reason":"句意是「根據從用餐者收集到的回饋意見」，所以名詞 (C) feedback（回饋意見）是正確答案。(A) content 表示「內容」，(B) procedure 表示「程序」，(D) investigation 表示「調查」。","vocab":"diner n. 用餐者　be satisfied with phr. 對……感到滿意","paraphrase":""},"108":{"type":"介系詞選位置","translation":"","reason":"句意是「Sally's 糖果店是 Grant 街上從主廣場數來的第三棟建築物」，所以表示起點的介系詞 (A) from（從……）是正確答案。(B) among 表示「在……之中」，(C) under 表示「在……之下」，(D) above 表示「在……上方」。","vocab":"main square phr. 主廣場","paraphrase":""},"109":{"type":"攝影大賽的優勝者將由 5 名知名評審組成的評審團決定。","translation":"攝影大賽的優勝者將由 5 名知名評審組成的評審團決定。","reason":"句意是「大賽的優勝者會由評審團決定」，所以動詞 determine（決定）的 p.p. 形 (B) determined 是正確答案。(A) contain 表示「包含，含有」，(C) implement 表示「實施」，(D) interpret 表示「詮釋」。","vocab":"competition n. 比賽，競爭　panel of judges phr. 評審團　distinguished adj. 著名的","paraphrase":""},"110":{"type":"題意解析","translation":"","reason":"句意是「新車陣容將在明年初的車展揭曉」，所以副詞 (C) early（在初期）是正確答案。(A) previously 表示「之前」，(B) typically 表示「典型地，一般」，(D) highly 表示「非常」。","vocab":"unveil v. 揭露，發表（新計畫、產品等）　annual adj. 年度的，每年的","paraphrase":""},"111":{"type":"【動詞位置】主動態與被動態的區分","translation":"","reason":"when 引導的從屬子句（when she ~ vacation）只有主詞（she），缺少了動詞，所以動詞 (A) 和 (D) 是可能的答案。因為要表達「在 Springs 小姐休假完回到辦公室的時候」的主動意義，所以主動態 (A) returns 是正確答案。另外，表時間的副詞子句連接詞（when）後面，會用現在式表示未來的情況。如果使用被動態 (D) 的話，意思會變成「Springs 小姐從休假中被歸還」，所以不對。動名詞或現在分詞 (B) 和 to 不定詞 (C) 不能用在動詞的位置。","vocab":"","paraphrase":""},"112":{"type":"介系詞選位置","translation":"當公司最優先看待顧客的需求時，通常會帶來回頭客的生意。","reason":"When 引導的副詞子句（When companies ~ else）是已經具備主詞（companies）、動詞（prioritize）、受詞（their customers' needs）的完整子句，所以 all else 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表達「最優先看待顧客的需求」，所以表示位置的介系詞 (A) above（在……之上）是正確答案。(C) within 表示位置或範圍「在……之內」，(D) toward 表示方向「往……」。 (B) where 不能引導修飾片語。","vocab":"prioritize v. 優先考慮　need n. 需求　generate v. 產生　repeat business phr. 回頭客帶來的生意（再度購買）","paraphrase":""},"113":{"type":"名詞位置","translation":"工程師主張，對現有的太陽能板稍微修改，會使它們更有效。","reason":"空格在不定冠詞（a）後面，而且被形容詞（slight）修飾，所以名詞 (D) modification（修改）是正確答案。動詞 (A)、過去式動詞或過去分詞 (B)、形容詞 (C) 不能用在名詞位置。","vocab":"claim v. 主張　slight adj. 稍微的　existing adj. 現有的　solar adj. 太陽的　modify v. 修改　modifiable adj. 可修改的","paraphrase":""},"114":{"type":"動詞慣用表達方式","translation":"居住在 Waterford 公寓的房客，必須在每月 1 日支付房租。","reason":"句意是「居住在 Waterford 公寓的房客」，所以能和空格後面的介系詞（in）構成 reside in（居住在……）的動詞 (C) reside（居住）是正確答案。(A) occupy（佔據，住）意義上似乎說得通，但因為是及物動詞，所以不能和介系詞 in 一起使用。(B) engage 和空格後面的介系詞（in）連用而形成 engage in 時，表示「參與……」，意思不對。(D) visit 表示「拜訪」。","vocab":"tenant n. 租戶　rent n. 租金","paraphrase":""},"115":{"type":"形容詞","translation":"沒有足夠的公眾注資，Scott 基金會就必須從民間來源募集更多錢。","reason":"句意是「沒有足夠的公眾注資，必須從民間來源募集更多錢」，所以形容詞 (A) adequate（足夠的，適當的）是正確答案。(B) incompetent 表示「無能的」，(C) receptive 表示「善於接受的」，(D) delightful 表示「令人愉快的」。","vocab":"raise v. 募集　private adj. 私人的，民間的","paraphrase":""},"116":{"type":"【引導修飾性語句的成分】副詞子句連接詞","translation":"即使只有 2 年經驗，Black 先生還是被任命為 TVD 公司的區域業務主任。","reason":"這個句子已經有具備主詞（Mr. Black）、動詞（was named）、補語（the regional sales director）的完整子句，所以 ~ experience 是修飾性的語句。修飾部分有動詞（had），所以能引導修飾子句的副詞子句連接詞 (A) Even though（即使……）是正確答案。介系詞 (B) As a result of（因為……而造成結果）、(C) In spite of（儘管……）引導的是修飾片語，而不是子句。(D) So as to（為了……）後面要接動詞原形。","vocab":"experience n. 經歷，經驗 v. 經歷　name v. 任命　regional adj. 地區的","paraphrase":""},"117":{"type":"副詞位置","translation":"","reason":"空格修飾後面的過去分詞（charged），所以副詞 (B) accidentally（意外地）是正確答案。形容詞 (A)、名詞 (C) 和 (D) 不能修飾過去分詞。","vocab":"charge v. 收費　refund n. 退款　issue v. 發行，發出","paraphrase":""},"118":{"type":"Manuel 公司的員工現在將獲得人壽保險保障，作為其雇用福利之一。","translation":"Manuel 公司的員工現在將獲得人壽保險保障，作為其雇用福利之一。","reason":"句意是「作為其雇用福利之一」，所以名詞 (B) benefits（福利）是正確答案。(A) skills 表示「技能」，(C) concerns 表示「關切的事」，(D) deductions 表示「扣除額」。","vocab":"life insurance coverage phr. 人壽保險保障　employment n. 雇用","paraphrase":""},"119":{"type":"Jung 小姐得知自己將被調到休士頓辦公室時感到不悅，因為她從未要求調動。","translation":"Jung 小姐得知自己將被調到休士頓辦公室時感到不悅，因為她從未要求調動。","reason":"句意是「因為她從未要求調動」，所以副詞 (D) never（從未）是正確答案。(A) before 表示「之前」，(B) already 表示「已經」，(C) often 表示「經常」。","vocab":"displeased adj. 不悅的　transfer v. 調動","paraphrase":""},"120":{"type":"介系詞","translation":"","reason":"句意是「儘管天氣預報會下雨，本週末的鳳凰城馬拉松仍將按計畫舉行」，所以表示讓步的介系詞 (B) notwithstanding（儘管……）是正確答案。(A) aside from 表示「除了……以外」，(C) regarding 表示「關於……」，(D) according to 表示「根據……」。","vocab":"marathon n. 馬拉松　take place phr. 舉行　forecast n. 預報","paraphrase":""},"121":{"type":"形容詞","translation":"非常歡迎 Shiller 兒童博物館的參觀者和展示品互動。","reason":"句意是「歡迎參觀者和展示品互動」，所以形容詞 (B) welcome（受到歡迎的，被允許的）是正確答案。(A) pleasant（令人愉快的）意思似乎說得通，但它不能表達人的感情，而應該改用 pleased（高興的）來表達才對。(C) obvious 表示「明顯的」。(D) brilliant 表示「傑出的」。","vocab":"interact v. 互動　on display phr. 展示中的","paraphrase":""},"122":{"type":"對等連接詞","translation":"Paulson 電子公司可以用一般郵件或額外收費的快速運送產品。","reason":"介系詞（by）的受詞是 regular mail 和 express delivery 這兩個名詞片語，中間需要用對等連接詞連接，而且要表達「用一般郵件或快速運送產品」，所以對等連接詞 (D) or（或者）是正確答案。(A) so（所以）只能連接兩個子句，而不能連接單字或片語，所以不對。(B) up 表示「往……上」。(C) at 表示「在……」。","vocab":"ship v. 運送　express adj. 快速的，快捷的　involve v. 涉及，需要　charge n. 收費","paraphrase":""},"123":{"type":"類似意義的名詞","translation":"電視廣告播放後，Seaborn Cruises 公司收到大量來自潛在乘客的詢問。 類似意義的名詞","reason":"句意是「收到大量來自潛在乘客的詢問」，所以名詞 (D) volume（量）是正確答案。(A) size（規模，大小）意思似乎說得通，但它是表示事物或現象的大小，而不是數量。(B) result 表示「結果」。(C) majority（多數）似乎意思接近，但它是表示特定群體中的多數，所以不對。","vocab":"commercial n. 廣告 adj. 商業的　air v. 透過廣播、電視等方式播送　inquiry n. 詢問　potential adj. 潛在的，可能的　passenger n. 乘客","paraphrase":""},"124":{"type":"【引導修飾性語句的成分】副詞子句連接詞時間","translation":"","reason":"這個句子已經有具備主詞（The musicians）和動詞（practiced）的完整子句，所以 ~ set up 是修飾性的語句。修飾部分有動詞（was being set up），所以能引導修飾子句的副詞子句連接詞 (B) 和 (D) 是可能的答案。因為要表達「舞台搭建時，樂手們在後面的房間練習」，所以表示時間的副詞子句連接詞 (B) as（當……時）是正確答案。如果使用 (D) unless（除非……），意思會變成「除非舞台正在被搭建，不然樂手們就會在後面的房間練習」，不符合要表達的意思。(A) in order to（為了……）後面要接原形動詞，介系詞 (C) during 不能引導修飾子句。","vocab":"practice v. 練習　back room phr. 後面、後台的房間　set up phr. 設置，搭建","paraphrase":""},"125":{"type":"題意解析","translation":"","reason":"句意是「藉由回收電池，就有可能減少有毒物質總量」，所以 (B) reduce（減少）是正確答案。(A) seize 表示「抓住」，(C) satisfy 表示「滿足」，(D) reserve 表示「預約」。","vocab":"rather than phr. 而不是　discard v. 丟棄　toxic adj. 有毒的　landfill n. 垃圾掩埋場","paraphrase":""},"126":{"type":"數量表達方式","translation":"","reason":"能夠修飾空格後面複數可數名詞（two weeks）的數量詞 (A)、(B)、(C) 是可能的答案。因為要表達「服務生每 2 週領一次薪水，時薪 9 元」，所以數量詞 (C) every（每……）是正確答案。另外，請記得 every 表示「全體」的意思時，後面要接單數可數名詞。(A) most（大部分的）、(B) all（全部的）用在這裡會變成「大部分的／全部的 2 週」，不符合要表達的意思。限定詞 (D) either 表示兩個之中的任何一個，後面必須接單數名詞，也會搭配 or 以相關連接詞 either A or B（不是 A 就是 B）的形式使用。","vocab":"","paraphrase":""},"127":{"type":"【引導修飾性語句的成分】現在分詞 vs. 過去分詞","translation":"","reason":"這個句子已經有具備主詞（Novels）、動詞（are）和補語（popular）的完整子句，所以 ~ events 是修飾性的語句。修飾部分修飾空格前面的名詞（Novels），所以能引導修飾性語句，同時在名詞後面做修飾的過去分詞 (A) 和現在分詞 (D) 是可能的答案。因為被修飾的名詞（Novels）和分詞之間是「小說被建立在事實的基礎上」的被動關係，所以動詞 base（把……建立在某個基礎上）的過去分詞 (A) based 是正確答案。如果使用現在分詞 (D)，意思會變成「在進行建立基礎這個行為的小說」，所以不對。動詞 (B)、動詞或名詞 (C) 不能在名詞後面做修飾。","vocab":"popular adj. 受歡迎的　age group phr. 年齡層","paraphrase":""},"128":{"type":"【形容詞】","translation":"","reason":"句意是「在被設計得盡可能全面的訓練課程中，這份工作的所有方面都會被介紹到」，所以形容詞 (C) comprehensive（全面的）是正確答案。(A) decorative 表示「裝飾的」。(B) protective 表示「保護的」。(D) tentative 表示「暫定的，試驗性的」。","vocab":"aspect n. 方面　cover v. 涵蓋，包括　training course phr. 訓練課程","paraphrase":""},"129":{"type":"【名詞位置】可數名詞與不可數名詞","translation":"為了討論供給短缺的可能解決方法，總統會見了國內幾個最大的製造業者。","reason":"空格前面的形容詞可以修飾名詞，所以名詞 (A)、(C)、(D) 是可能的答案。因為空格前面有表達數量的 several of the，所以複數可數名詞 (D) manufacturers（製造業者們）是正確答案。(A) manufacturer（製造業者）是單數可數名詞，而 (C) manufacture 是不可數名詞，所以不對。另外，(C) 如果表示「產品」的話，是可數名詞，而會有複數形。動詞或過去分詞 (B) 不能被形容詞修飾。","vocab":"president n. 總統，總裁　shortage n. 短缺","paraphrase":""},"130":{"type":"未正確提交納稅申報單，可能會收到國稅局的修正要求。","translation":"未正確提交納稅申報單，可能會收到國稅局的修正要求。","reason":"句意是「沒有正確提交納稅申報單」，所以 (D) properly（適當地，正確地）是正確答案。(B) moderately（適度地）似乎意思相近，但實際上是用來表達程度不過度、數量適中而不過多的意思。(A) nearly 表示「幾乎」，(C) narrowly 表示「勉強地，差一點地」。","vocab":"file v. 提交　tax form phr. 納稅申報單　amendment n. 修正","paraphrase":""},"131":{"type":"選出適當的句子","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的內容提到會議的主要討論主題是明年的部門預算，而上一句 This is a subject of vital importance. 這是非常重要的主題，所以空格的內容應該和會議討論主題的重要性有關，(D) Therefore, the company's CEO will join us 是正確答案。(A) 雖然也和會議要討論的預算有關，但因為是要討論明年的預算，所以應該不會是已經決定了，而不能選這個答案。","vocab":"recognized adj. 公認的　expert n. 專家　temporary adj. 暫時的　setback n. 挫折","paraphrase":""},"132":{"type":"主動態與被動態的區分","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"動詞 need 後面可以接 to 不定詞當受詞，所以能和空格前的 to 組成 to 不定詞的動詞原形 (A)、包含動詞原形的 (C) 和 (D) 是可能的答案。另外，請注意 need 所在的 that 子句（that ~ budget）是由主格關係代名詞 that 引導的關係子句，修飾先行詞（changes）。因為空格後面沒有受詞，而且要表達「需要被做出的改變」，所以被動態 (C) be made 是正確答案。主動態 (A) 和 (D) 後面必須要有受詞，而且意思會變成「變化做～／變化正在做～」的意思，所以不對。過去式動詞或過去分詞 (B) 不能形成 to 不定詞。","vocab":"","paraphrase":""},"133":{"type":"名詞位置","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"空格被前面的形容詞（unnecessary）修飾，所以名詞 (D) expenses（花費）是正確答案。過去式動詞或過去分詞 (A)、動詞 (B)、形容詞 (C) 不能用在名詞的位置。","vocab":"expend v. 花費　expensive adj. 貴的","paraphrase":""},"134":{"type":"動詞詞彙 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「確認收到備忘錄」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，只要跟助理 Hertz 小姐確認出席就可以了，由此可知寄件者希望收件者通知 Hertz 小姐並確認出席，(D) acknowledge（確認收到）是正確答案。(A) explain 表示「說明」，(B) confide 表示「吐露（秘密）」，(C) remember 表示「記得」。","vocab":"","paraphrase":""},"135":{"type":"形容詞詞彙 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「得到了優秀的顧客服務」，所以 (B) excellent（優秀的）是正確答案。(A) questionable 表示「有問題的」，(C) deficient 表示「缺乏的」，(D) gradual 表示「逐漸的」。","vocab":"customer service phr. 顧客服務　not nearly phr. 一點也不……　approach v. 接近　excuse oneself phr. 請求准予離開　immediately adv. 馬上，立即　mistake n. 錯誤，失誤　attention n. 注意","paraphrase":""},"136":{"type":"選出適當的句子","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的部分提到進去的時候，店裡的櫃台沒有任何員工，等了 10 分鐘才有人走近，而空格的上一句 However, she excused herself almost immediately in order to go answer the phone. 說那個人幾乎是馬上就說要接電話而離開了，所以空格的內容應該和顧客遇到這種情況的反應有關，(C) Honestly, I was shocked to witness such unprofessional behavior 是正確答案。","vocab":"importantly adv. 重要地　loyal adj. 忠實的　witness v. 目擊，見證 n. 目擊者，見證人　various adj. 各種的，多樣的","paraphrase":""},"137":{"type":"過去完成式","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"主要子句（I ~ Candy Apple Red）發生的事「顧客要求 Candy Apple Red」，發生的時間比 but 引導的子句（but ~ instead）「得到 Scarlet Red」來得早。注意 but 引導的子句（but ~ instead）省略了重複的主詞（I）。因為 but 子句是過去式（was given），所以表示過去特定時間點之前曾經發生什麼的過去完成式 (C) had asked 是正確答案。過去式 (A)、現在進行式 (B)、未來式 (D) 不能表示過去特定時間點之前發生的事。","vocab":"","paraphrase":""},"138":{"type":"慣用的詞彙搭配","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「在比較關心顧客的店購物」，所以能和空格後面的 attention to 構成 pay attention to「關注……」的動詞 pay（付出）的第三人稱單數形 (A) pays 是正確答案。如果使用 (D) 的 draw（引起「注意」），意思會變成「去引起顧客關注的店購物」，不符合文章要表達的意思。而且，draw 的表達方式應該是 draw attention from（引起……的關注）才對。(B) consider 表示「考慮」，(C) understand 表示「理解」。","vocab":"","paraphrase":""},"139":{"type":"選出適當的句子","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 I recently saw your work at Wave Gallery and wanted to tell you that I was very impressed by your unique style. 提到，「我」（Whetzel 先生）最近在 Wave 藝廊看到 Evans 小姐的作品，想要表達自己對她獨特的風格印象深刻，所以空格的內容應該和看到作品的感想有關，(D) I've never seen paintings that look quite like yours 是正確答案。","vocab":"","paraphrase":""},"140":{"type":"【引導修飾性語句的成分】關係代名詞的位置與用法","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"as 開頭的從屬子句（as ~ week），是具備主詞（I）、動詞（run）和受詞（a small art studio）的完整子句，所以 ~ week 是修飾性的語句。修飾部分是修飾空格前面的名詞（art studio），所以包含可修飾名詞的主格關係代名詞與關係子句動詞的 (B)、包含現在分詞的 (D) 是可能的答案。因為要表達「每週舉辦幾次繪畫課的小型藝術工作室」，所以能夠引導以 art studio 為先行詞的關係子句，而且包括在關係子句中擔任主詞的主格關係代名詞、關係子句中的動詞的 (B) that holds 是正確答案。包含現在分詞的 (D) 是被動態，所以後面不能接受詞（painting classes）。動詞 (A) 和 (C) 不能在名詞後面做修飾。","vocab":"","paraphrase":""},"141":{"type":"名詞詞彙 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「您在規劃課程方面有許多＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到身為老師，「您」（Evans 小姐）會獨自決定要使用的材料，以及要教的概念，所以名詞 (A) flexibility（彈性）是正確答案。(B) assistance 表示「協助」，(C) restriction 表示「限制」，(D) demonstration 表示「示範操作」。","vocab":"","paraphrase":""},"142":{"type":"【引導修飾性語句的成分】副詞子句連接詞條件","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這個句子已經有具備主詞（This e-mail address）、動詞（is）和補語（the best way）的完整子句，所以 ~ interested 是修飾性的語句。修飾部分有動詞（are interested），所以需要填入能引導修飾子句的成分，而所有選項都是副詞子句連接詞，也都是可能的答案。因為要表達「要是您有興趣的話，這個電子郵件位址是聯絡我的最佳方式」，所以表示條件的副詞子句連接詞 (D) in case（假使……）是正確答案。(A) before 表示時間「在……之前」，(B) so that 表示目的「以便……」，(C) because 表示理由「因為……」。","vocab":"","paraphrase":""},"143":{"type":"【引導修飾性語句的成分】介系詞選擇 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這個句子已經有具備主詞（The Sebastian Hill Hotel）和動詞（is going to be closed）的完整子句，所以 ~ June 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。後面的部分提到，由於 6 月是最繁忙時期的開始，所以在合作據點有足夠的臨時職缺可以提供，由此可知這間飯店應該是在 6 月暫時關閉，所以表示期間的 (C) throughout（在……的整個期間）是正確答案。(A) except for 表示例外「除了……」。(D) following 表示「在……之後」，雖然本身的意義是合理的，但用在這裡表示「飯店 6 月後關閉，而會請合作據點在 6 月提供臨時職缺」，不合邏輯。副詞子句連接詞 (B) as long as（只要……）引導修飾子句而不是片語。","vocab":"renovation n. 翻修　seasonal adj. 季節性的，季節的　job opening phr. 職缺　preference n. 偏好　branch n. 分公司，分店　fulfill v. 滿足，履行　consider v. 考慮","paraphrase":""},"144":{"type":"未來式 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「Sebastian Hill 的所有員工在 5 月 31 日之後開始工作」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到 6 月是最繁忙時期的開始，所以在合作據點有足夠的臨時職缺可以提供，而下一句說如果有偏好工作的飯店，要在本週結束之前告訴分公司經理，所以開始在合作據點工作是未來的事情，未來式 (A) will begin 是正確答案。現在完成式 (B) 表示過去事件的影響持續至今、剛完成的事或者過去經驗，所以不對。過去式 (C) 和過去進行式 (D) 不能表達未來發生的事。","vocab":"","paraphrase":""},"145":{"type":"名詞詞彙 掌握上下文","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"句意是「他不能保證滿足任何＿＿，但會謹慎考慮」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到，如果有偏好工作的飯店，要在本週結束之前告訴分公司經理，由此可知分公司經理會考慮員工對於工作地點的要求，所以名詞 (C) requests（要求）是正確答案。(A) contract 表示「合約」，(B) commitment 表示「投入，奉獻」，(D) offer 表示「提議，提案」。","vocab":"","paraphrase":""},"146":{"type":"選出適當的句子","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的部分提到如果有偏好工作的飯店，要在本週結束之前告訴分公司經理，而空格的上一句 He cannot promise to fulfill any (requests) but will consider them carefully. 則說他不能保證滿足任何要求，但會謹慎考慮，所以空格的內容應該和分配工作地點的結果有關，(D) All decisions about temporary work locations will be made by May 20 是正確答案。","vocab":"complain v. 抱怨　candidate n. 人選，候選者　temporary adj. 臨時的，暫時的","paraphrase":""},"147":{"type":"Not/True True 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Global Engineering Monthly 有關的內容，並且對照選項判斷答案。(A)、(B)、(D) 在文章裡沒有提到。(C) 在 we've been the publication of choice for professionals in the engineering field 的部分提到，「我們」（Global Engineering 月刊）一直是工程領域專家喜好的刊物，符合選項敘述，所以 (C) 是正確答案。\n變換表達方式\nprofessionals in the engineering field 工程領域專家 → experts in their field 在自己領域中的專家","vocab":"individual adj. 個別的　sponsor v. 贊助　readership n. 讀者群　publisher n. 出版社，出版業者　title n. 一本出版物","paraphrase":""},"148":{"type":"wh-問題 What","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問 Cassar 小姐訂閱會獲得什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Cassar receive with her subscription 有關的部分包括 One-year subscription ■，由此可知她要訂閱 1 年，而 Customers who order a one-year subscription receive a free compact tool kit! 的部分顯示訂閱 1 年的訂戶將獲得免費的小型工具組，所以 (C) 是正確答案。","vocab":"edition n. （刊物的）版本","paraphrase":""},"149":{"type":"wh-問題 What","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問 Carson 醫學研究所打算做什麼（What）的 wh- 問題。和題目的關鍵詞語 the Carson Medical Institute planning to do 有關的部分是 We are currently developing a drug that may help rid people of insomnia. During the study, all you ha Sunderland 先生將協助為住客安排一系列有趣的休閒活動，符合選項敘述。(C) 在 he will be responsible for staff training in order to ~ maintain quality service 的部分提到，Sunderland 先生將負責員工訓練，以維持高品質的服務，符合選項敘述。(D) 在文章中沒有提到，所以 (D) 是正確答案。\n變換表達方式\nbe in charge of our reservation ~ systems 負責預約系統 → Managing a booking system 管理預訂系統\ncoordinate ~ fun pursuits 安排有趣的休閒活動 → Organizing leisure activities 安排休閒活動","vocab":"handle v. 處理　facility n. 設施","paraphrase":""},"178":{"type":"推論 多篇文章對照題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是需要對照兩篇文章內容的推論題型，先看介紹題目關鍵詞語 Mr. Sunderland 的公告。\n線索1：公告（第一篇文章）中，he has served as the front office manager at our island location 的部分提到，Sunderland 先生之前在「我們」（Gold Frond 度假村）的島嶼據點擔任客務部經理，但沒有寫出那個據點的名稱，所以還需要參考廣告的內容。\n線索2：廣告（第二篇文章）中，Vergual Paradise、occupies an entire island 的部分顯示 Vergual Paradise 佔據整座島。\n綜合這兩個線索，可知 Sunderland 先生之前受雇於 Vergual Paradise，所以 (C) 是正確答案。","vocab":"career n. 職業生涯　employ v. 雇用，使用　graduate v. 畢業","paraphrase":""},"179":{"type":"Not/True True 題型","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是 Not/True 題型，要找出和關鍵詞語 Gold Frond Resorts 有關的內容，所以要看介紹 Gold Frond 度假村的廣告（第一篇文章）。(A) 在 Our original property; recently expanded to 315 rooms 的部分提到，Gold Frond 最初的據點最近擴建至 315 間客房，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章中沒有提到。\n變換表達方式\nexpanded to 315 rooms 擴建至 315 間客房 → increased its capacity 增加容納空間","vocab":"capacity n. 容量，容納的能力　establish v. 建立，設立","paraphrase":""},"180":{"type":"wh-問題 How","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是問人們可以怎樣（How）獲得度假村活動資訊的 wh- 問題，所以要從和題目的關鍵詞語 people get information on resort activities 有關的廣告（第二篇文章）找出相關的內容。廣告中的 You can find information on activities available at each resort at www.goldfrondresorts.com 提到可以在網站找到每座度假村可提供活動的資訊，所以 (A) 是正確答案。","vocab":"travel agent phr. 旅行社代辦人員","paraphrase":""},"181":{"type":"推論 細節資訊","translation":"題意與完整文章翻譯請參照中文翻譯區塊。","reason":"這是要找出和題目關鍵詞語 the Spin Genie 400 相關內容的推論問題，所以要看提到 Spin Genie 400 的第一封電子郵件。I recently bought your company's Spin Genie 400 ~ and took it to a local bike shop for assembly 的部分提到，最近買了 FrameCa const explainSelect=$('#explainMode');explainSelect.value=explainMode;explainSelect.addEventListener('change',()=>{explainMode=explainSelect.value;localStorage.setItem('toeic-test08-explain-mode',explainMode);const d=document.querySelector('#quiz .answer-details');if(d)d.open=explainMode==='auto';});

$('#reset').onclick=async()=>{if(confirm('確定清除目前模式的所有作答紀錄嗎？星號標記會保留。')){try{await window.toeicCloud.resetAnswers();mode='all';index=0;setTabs();render()}catch(e){alert('清除失敗：'+e.message)}}};const CSV_HEADER=['題號','Part','作答選項','正確答案','答題結果','作答時間'];
function csvCell(x){const t=String(x??'');return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function parseCsv(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quotes=false;for(let i=0;i<text.length;i++){let c=text[i];if(quotes){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quotes=false;else field+=c}else if(c==='"')quotes=true;else if(c===','){row.push(field);field=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(quotes)throw Error('CSV 引號未關閉');row.push(field);if(row.some(x=>x!==''))rows.push(row);return rows}
$('#export').onclick=()=>{const rows=[CSV_HEADER];for(const q of QS){const r=records[q.id];if(!r)continue;rows.push([q.id,q.part,r.choice,q.answer,r.correct===true?'正確':r.correct===false?'錯誤':'未核定',r.at||''])}const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toeic-作答紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#importCsv').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCsv(await file.text());if(!rows.length||rows[0].slice(0,6).join('|')!==CSV_HEADER.join('|'))throw Error('欄位格式不符，請使用本網站匯出的 CSV');const incoming={};for(let i=1;i<rows.length;i++){const r=rows[i],id=Number(r[0]),q=QS.find(x=>x.id===id),choice=(r[2]||'').trim();if(r.length<6||!q||!/[A-D]/.test(choice)||choice.length!==1||String(q.part)!==r[1].trim())throw Error('第 '+(i+1)+' 列的題號、Part 或選項有誤');if(r[3].trim()!==q.answer)throw Error('第 '+(i+1)+' 列答案版本不同，已停止匯入');incoming[id]={choice,correct:q.answer?choice===q.answer:null,at:r[5]||''}}const count=Object.keys(incoming).length;if(!confirm('CSV 有 '+count+' 筆有效作答紀錄。匯入後會覆蓋相同題號的現有作答，其餘題目保留。是否繼續？'))return;await window.toeicCloud.importAnswers(incoming);mode='all';index=0;setTabs();render();alert('已成功匯入 '+count+' 筆紀錄。')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};render();

window.toeicApplyRemote=function(answers,starMap,excerptMap){records=answers;collectWrongAnswers();stars=starMap;excerpts=excerptMap||{};render()};
window.toeicClearRemote=function(){records=JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}')||{};collectWrongAnswers();stars=JSON.parse(localStorage.getItem(LOCAL_STAR_KEY)||'{}')||{};excerpts=JSON.parse(localStorage.getItem(LOCAL_EXCERPT_KEY)||'{}')||{};mode='all';index=0;showOverview=false;setTabs();render()};
</script>
<script>
/* Browser-offline fallback: Firebase is optional, local practice always works. */
(function(){
  if(window.toeicCloud) return;
  function persist(){
    localStorage.setItem(LOCAL_KEY,JSON.stringify(records));
    localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));
    localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts));
  }
  window.toeicCloud={ready:true,mode:'local',
    saveAnswer:async(id,data)=>{records[id]=data;persist();render()},
    deleteAnswer:async(id)=>{delete records[id];persist();render()},
    setStar:async(id,marked)=>{if(marked)stars[id]=true;else delete stars[id];persist();render()},
    saveExcerpts:async(id,items)=>{if(items.length)excerpts[id]=items;else delete excerpts[id];persist();render()},
    importAnswers:async(items)=>{records={...records,...items};persist();render()},
    resetAnswers:async()=>{records={};persist();render()}
  };
})();
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:'AIzaSyAA3gxE4CLmVsH3LXjzl4J0O-QhcN14laI',authDomain:'database-89162.firebaseapp.com',projectId:'database-89162',storageBucket:'database-89162.firebasestorage.app',messagingSenderId:'60538861815',appId:'1:60538861815:web:92aa03a61146f491cafbf2',measurementId:'G-JMEN6QNVQ8'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const allowed=['1000','0520','0608','0621','0000','1014'];
const input=document.getElementById('accountCode'),connect=document.getElementById('connectCode'),leave=document.getElementById('leaveCode'),notice=document.getElementById('cloudNotice');
let activeCode='',unsub=[],remoteAnswers={},remoteStars={},remoteExcerpts={},loadedA=false,loadedS=false,loadedE=false,generation=0;
const cloud={ready:false,mode:'local'};window.toeicCloud=cloud;
function info(msg){notice.textContent=msg}
function stopListeners(){generation++;unsub.forEach(fn=>fn());unsub=[];loadedA=false;loadedS=false;loadedE=false;remoteAnswers={};remoteStars={};remoteExcerpts={};cloud.ready=false}
function localSave(){localStorage.setItem(LOCAL_KEY,JSON.stringify(records));localStorage.setItem(LOCAL_STAR_KEY,JSON.stringify(stars));localStorage.setItem(LOCAL_EXCERPT_KEY,JSON.stringify(excerpts))}
function root(type){if(!activeCode||!cloud.ready)throw Error('雲端資料尚未載入');return collection(db,'practiceCodes',activeCode,'test08_'+type)}
function sync(){if(!activeCode||!loadedA||!loadedS||!loadedE)return;cloud.ready=true;cloud.mode='cloud';window.toeicApplyRemote?.({...remoteAnswers},{...remoteStars},{...remoteExcerpts});info('第八回雲端模式：'+activeCode+'，第八回的作答、星號與筆記已載入。');connect.disabled=false;leave.hidden=false}
cloud.saveExcerpts=async(id,items)=>{if(!activeCode){if(items.length)excerpts[id]=items;else delete excerpts[id];localSave();render();return}const ref=doc(root('highlights'),String(id));if(items.length)await setDoc(ref,{items});else await deleteDoc(ref)};
cloud.deleteAnswer=async(id)=>{
  if(!activeCode){delete records[id];localSave();render();return}
  await deleteDoc(doc(root('answers'),String(id)));
};
cloud.saveAnswer=async(id,data)=>{if(!activeCode){records[id]=data;localSave();render();return}await setDoc(doc(root('answers'),String(id)),data)};
cloud.setStar=async(id,marked)=>{if(!activeCode){if(marked)stars[id]=true;else delete stars[id];localSave();render();return}const ref=doc(root('stars'),String(id));if(marked)await setDoc(ref,{marked:true});else await deleteDoc(ref)};
cloud.importAnswers=async(items)=>{if(!activeCode){records={...records,...items};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const entries=Object.entries(items);for(let i=0;i<entries.length;i+=400){const batch=writeBatch(db);for(const [id,data] of entries.slice(i,i+400))batch.set(doc(root('answers'),id),data);await batch.commit()}};
cloud.resetAnswers=async()=>{if(!activeCode){records={};localSave();render();return}if(!cloud.ready)throw Error('雲端尚未載入');const ids=Object.keys(remoteAnswers);for(let i=0;i<ids.length;i+=400){const batch=writeBatch(db);ids.slice(i,i+400).forEach(id=>batch.delete(doc(root('answers'),id)));await batch.commit()}};
function goLocal(){stopListeners();activeCode='';cloud.mode='local';input.value='';input.disabled=false;connect.disabled=false;leave.hidden=true;window.toeicClearRemote?.();info('本機模式：未連線雲端，作答只保存在此瀏覽器。')}
leave.addEventListener('click',goLocal);
connect.addEventListener('click',async()=>{const code=input.value.trim();if(!allowed.includes(code)){info('代號無效。請輸入管理員提供的 4 位代號。');return}if(activeCode===code&&cloud.ready)return;stopListeners();activeCode=code;cloud.mode='loading';cloud.ready=false;window.toeicApplyRemote?.({},{});connect.disabled=true;leave.hidden=false;info('正在載入雲端歷史紀錄，請不要作答…');let token=generation;
try{if(!auth.currentUser)await signInAnonymously(auth);if(token!==generation)return;
const a=onSnapshot(collection(db,'practiceCodes',code,'test08_answers'),snap=>{if(token!==generation)return;remoteAnswers={};snap.forEach(d=>{if(/^\d+$/.test(d.id))remoteAnswers[d.id]=d.data()});loadedA=true;sync()},err=>{if(token===generation){info('讀取雲端失敗：'+err.message+'。請檢查匿名驗證與 Firestore 規則。');connect.disabled=false}});
unsub.push(a);
const b=onSnapshot(collection(db,'practiceCodes',code,'test08_stars'),snap=>{if(token!==generation)return;remoteStars={};snap.forEach(d=>{if(/^\d+$/.test(d.id)&&d.data().marked)remoteStars[d.id]=true});loadedS=true;sync()},err=>{if(token===generation){info('讀取星號失敗：'+err.message);connect.disabled=false}});unsub.push(b);
const c=onSnapshot(collection(db,'practiceCodes',code,'test08_highlights'),snap=>{if(token!==generation)return;remoteExcerpts={};snap.forEach(d=>{const items=d.data().items;if(/^\d+$/.test(d.id)&&Array.isArray(items))remoteExcerpts[d.id]=items.filter(x=>typeof x==='string')});loadedE=true;sync()},err=>{if(token===generation){info('讀取文字摘錄失敗：'+err.message+'。請更新 Firestore 規則。');connect.disabled=false}});unsub.push(c);
}catch(err){if(token===generation){info('Firebase 連線失敗：'+err.message);connect.disabled=false}}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();connect.click()}});
// 在雲端讀取期間禁用作答；已離線作答不會自動上傳。
const originalSave=cloud.saveAnswer,originalStar=cloud.setStar,originalImport=cloud.importAnswers,originalReset=cloud.resetAnswers;
for(const [name,fn] of [['saveAnswer',originalSave],['deleteAnswer',cloud.deleteAnswer],['setStar',originalStar],['importAnswers',originalImport],['resetAnswers',originalReset],['saveExcerpts',cloud.saveExcerpts]])cloud[name]=async(...args)=>{if(cloud.mode==='loading'||activeCode&&!cloud.ready)throw Error('雲端正在載入或連線異常，無法儲存；請退出雲端模式後使用本機練習。');return fn(...args)};
onAuthStateChanged(auth,user=>{if(!user&&activeCode){info('Firebase 驗證已中斷，請重新按「載入雲端紀錄」。');stopListeners();connect.disabled=false}});
