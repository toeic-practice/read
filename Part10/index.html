/* Part 6/7 閱讀文章和作答題目各自獨立成框 */
#quiz{border:0;background:transparent;padding:0;margin-top:15px}
#quiz .reading-panel,#quiz .question-panel{margin-top:0;background:#fff;border:1px solid #dfe6f1;border-radius:10px;padding:clamp(14px,3.5vw,28px);min-width:0}
#quiz .question-panel{margin-top:14px}
#quiz .question-panel:first-child{margin-top:0}
#quiz .reading-panel .translation-switch{margin-top:0}
#quiz .reading-panel .reading-stack{margin-bottom:0}
#quiz .reading-panel .reading-intro{margin-top:15px}
#quiz .question-panel .head{flex-wrap:wrap}
#quiz .question-panel .stem{margin-top:12px}

/* Part 6 / Part 7：閱讀框自行上下捲動，作答框不隨文章滾動 */
#quiz .reading-panel{
  height: min(62vh, 620px);
  min-height: 250px;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-gutter: stable;
  touch-action: pan-y;
}
#quiz .reading-panel .document-body table{overscroll-behavior-x:contain}
/* 所有裝置固定上下排列：標題與星號在閱讀文章上方，題目在下方。 */
#quiz.has-reading{display:block!important;grid-template-columns:none!important}
#quiz .reading-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:#fff;border:1px solid #dfe6f1;border-radius:10px;padding:13px clamp(14px,3.5vw,28px);margin-bottom:12px}
#quiz .reading-header h2{margin:0;font-size:22px}
#quiz.has-reading .question-panel{position:static!important;top:auto!important;margin-top:12px!important}
#quiz.has-reading .reading-panel{height:min(58vh,580px);min-height:240px;max-height:none}
@media(max-width:799px){#quiz.has-reading .reading-panel{height:40vh;min-height:210px;max-height:390px}#quiz .reading-header h2{font-size:19px}}

/* 緊湊工具列：標題／星號／進度／中英切換同一列 */
#quiz .reading-header{padding:8px 12px;gap:0;margin-bottom:10px}
#quiz .reading-header .head{display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:clamp(4px,1.2vw,12px);min-width:0;width:100%}
#quiz .reading-header h2{font-size:15px!important;line-height:1.25;white-space:nowrap;min-width:0}
#quiz .reading-header .star-button{font-size:12px;padding:6px 8px;white-space:nowrap;border-radius:7px}
#quiz .reading-header .tag{font-size:11px;padding:5px 7px;white-space:nowrap}
#quiz .reading-header .translate-button{font-size:12px;padding:7px 9px;border-radius:7px;white-space:nowrap;font-weight:650;flex-shrink:0}
#quiz .reading-title-short,#quiz .star-short{display:none}
/* 增加閱讀文章的可見高度，但僅文章框內上下捲動 */
#quiz.has-reading .reading-panel{height:min(75vh,780px);min-height:380px;max-height:none}
@media(max-width:799px){#quiz.has-reading .reading-panel{height:65vh;min-height:360px;max-height:none}}
@media(max-width:600px){
  #quiz .reading-header{padding:7px 8px}
  #quiz .reading-header .head{gap:3px}
  #quiz .reading-title-full,#quiz .star-full,#quiz .progress-full{display:none}
  #quiz .reading-title-short,#quiz .star-short{display:inline}
  #quiz .reading-header h2{font-size:13px!important;flex:0 0 auto}
  #quiz .reading-header .star-button{font-size:11px;padding:6px 5px}
  #quiz .reading-header .tag{font-size:10px;padding:5px 4px}
  #quiz .reading-header .translate-button{font-size:11px;padding:7px 5px}
}
@media(max-width:365px){#quiz .reading-header h2{font-size:12px!important}#quiz .reading-header .translate-button{font-size:10px;padding:7px 3px}#quiz .reading-header .tag{font-size:10px;padding:4px 3px}}
/* E-MAIL 的 TO/FROM/SUBJECT/DATE 緊靠文字，不保留舊版 75px 空白 */
#quiz .type-mail .mail-key{display:inline!important;min-width:0!important;width:auto!important;margin-right:0!important;letter-spacing:0}

/* 在選取文字的下方顯示快捷儲存按鈕 */
#selectionSave{position:fixed;z-index:1000;display:none;max-width:calc(100vw - 24px);padding:9px 14px;border:1px solid #194a86;border-radius:9px;background:#2453a6;color:#fff;box-shadow:0 4px 18px #152d5840;font:700 14px system-ui,"Noto Sans TC",sans-serif;cursor:pointer;touch-action:manipulation}
#selectionSave.is-visible{display:block}
#selectionSave:focus-visible{outline:3px solid #e6ad31;outline-offset:2px}

/* 第十回閱讀資料以原生文字呈現、保留反白摘錄與手機內捲 */
#quiz .source-passages{white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;font-size:15px;line-height:1.7}
#quiz .type-webpage .source-passages{padding-top:18px}
#quiz .source-passages::selection{background:#fce393}

/* TEST 02 · editorial document system, separate cards per original document */
:root{--t02-ink:#1d2d43;--t02-paper:#ffffff;--t02-blue:#22558c;--t02-line:#bfcddd}
#quiz .reading-stack{gap:20px}
#quiz .document-card{box-shadow:0 4px 15px #142d4210;border:1px solid #b9c6d5;background:var(--t02-paper)}
#quiz .doc-ribbon{padding:9px 15px;letter-spacing:.10em;background:#e8edf5;font-size:11px}

#quiz .document-body p{margin:0 0 14px;white-space:pre-line}
#quiz .document-body h2{font-size:23px!important;line-height:1.28;margin:0 0 15px!important}
#quiz .document-body h3{font-size:15px;margin:18px 0 8px;color:#1c3555}
#quiz .document-body ul,#quiz .document-body ol{margin:8px 0 14px;padding-left:24px}
#quiz .document-body li{margin:5px 0}
#quiz .document-body .subtitle{text-align:center;font-size:15px;color:#627d9b;font-weight:600}
#quiz .type-article .document-body,#quiz .type-review .document-body{font-family:Georgia,'Times New Roman',serif;line-height:1.85}
#quiz .type-article .document-body h2,#quiz .type-review .document-body h2{font-family:Georgia,'Times New Roman',serif!important;text-align:left!important;border-bottom:3px double #7588a2;padding-bottom:12px}
#quiz .byline{font-size:13px;color:#526982;font-style:italic;margin:-5px 0 17px;border-bottom:1px solid #e0e7ee;padding-bottom:9px}
#quiz .type-mail .mail-meta,#quiz .type-memo .mail-meta{background:#edf3f9;padding:14px 16px;margin:0 0 21px;border:1px solid #cbd6e2;display:grid;gap:7px;font-size:13.5px}
#quiz .mail-meta>div{display:grid;grid-template-columns:97px minmax(0,1fr);gap:8px;overflow-wrap:anywhere}
#quiz .mail-meta .mail-key{font-size:11px;font-weight:800;color:#385981;letter-spacing:.07em;margin:0;min-width:0!important}
#quiz .type-letter .document-body{padding:30px 34px}
#quiz .type-letter .document-body p{white-space:pre-line}
#quiz .type-memo .memo-title{text-align:center;border-bottom:2px solid #7588a2;margin-bottom:14px;font-size:17px;letter-spacing:.04em;font-weight:700;padding-bottom:12px}
#quiz .memo-title strong{display:block;font-size:21px;letter-spacing:.17em}
#quiz .stationery-brand{font-size:20px;font-weight:750;text-align:center;letter-spacing:.04em;border-bottom:1px solid #e0e5ea;padding:0 0 12px;margin-bottom:16px}
#quiz .stationery-brand small{display:block;font-size:12px;color:#6a8196;font-weight:400}
#quiz .right-date{display:block;text-align:right}
#quiz .type-chat .document-body{background:linear-gradient(#ecf3fa,#e6edf5)}
#quiz .conversation{display:grid;gap:11px}
#quiz .bubble{max-width:89%;justify-self:start;border-radius:4px 16px 16px 16px;background:#fff;padding:12px 14px;border-left:4px solid #3877ac;box-shadow:0 1px 3px #1f385319}
#quiz .bubble-alt{justify-self:end;background:#fffdfa;border-left-color:#ba9862;border-radius:16px 4px 16px 16px}
#quiz .bubble-meta{display:flex;flex-wrap:wrap;gap:7px 18px;justify-content:space-between;color:#25496e;font-size:13px;margin-bottom:5px}
#quiz .bubble-meta time{color:#7b8390;font-size:12px}
#quiz .bubble p{margin:0!important;font-size:15px;line-height:1.65}
#quiz .browser-chrome{background:#e6eef5;border-bottom:1px solid #c0d1dd;font:12px Arial;color:#48617b;padding:11px 16px;margin:-25px -33px 22px;overflow-wrap:anywhere}
#quiz .browser-dots{letter-spacing:.17em;color:#ae8478;margin-right:14px}
#quiz .site-head{border:1px solid #c8d6e6;margin:0 0 19px;background:#f7fafd}
#quiz .site-name{font-size:22px;font-weight:800;letter-spacing:.02em;padding:13px 15px 3px;color:#244b72}
#quiz .site-tagline{font-size:12px;color:#647b90;padding:0 15px 9px;overflow-wrap:anywhere}
#quiz .site-nav{display:flex;justify-content:space-around;gap:5px;flex-wrap:wrap;background:#1e4876;color:#fff;font:12px Arial;padding:11px 5px}
#quiz .site-nav span{padding:1px 5px}
#quiz .route-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:14px 0}
#quiz .route-grid>div{border:1px solid #cfdce8;background:#f8fbff;border-radius:7px;padding:9px 13px}
#quiz .route-grid h3{margin:0 0 6px}
#quiz .business-hours{border:1px solid #bcd0e5;border-left:5px solid #315d92;padding:12px 15px;background:#f3f8fe;margin:13px 0}
#quiz .business-hours p{margin:5px 0 0}
#quiz .web-cta{margin:18px 0 2px;background:#eaf2fc;border:1px solid #bdd1e9;padding:14px 16px;font-weight:650;color:#214b73}
#quiz .linkish{color:#175a9b;text-decoration:underline;overflow-wrap:anywhere}
#quiz .type-notice .document-body{margin:0;border:8px double #e4e9ef}
#quiz .notice-content{border-top:2px solid #ccd5e4;padding-top:11px}
#quiz .type-flyer .document-body{background:#fffdfa}
#quiz .notice-emphasis{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:#fff4df;border-left:5px solid #bf8834;padding:10px 13px;margin:16px 0}
#quiz .ad-hero{background:linear-gradient(115deg,#163b64,#2e6597);color:#fff;padding:21px 19px;margin:-25px -33px 20px}
#quiz .ad-hero h2{color:#fff!important;text-align:left!important;font:800 24px/1.25 Arial!important;margin:8px 0 13px!important;letter-spacing:0}
#quiz .ad-kicker{letter-spacing:.12em;font-weight:800;color:#ffe2a5;font-size:11px}
#quiz .ad-specs{display:flex;gap:6px;flex-wrap:wrap}
#quiz .ad-specs span{background:#ffffff22;border:1px solid #ffffff55;padding:5px 8px;border-radius:15px;font-size:11px}
#quiz .ad-cta{margin:17px -4px 0;padding:14px 16px;background:#fff5df;border-left:5px solid #c18b34}
#quiz .benefit-list li::marker{color:#1b6595}
#quiz .type-schedule .document-body{background:#fcfdff}
#quiz .schedule-note{padding:12px 14px;background:#f1f6fc;border-left:4px solid #527ba8;margin-top:17px;font-size:14px}
#quiz .schedule-note ul{margin-bottom:0}
#quiz .table-wrap{overflow-x:auto;max-width:100%;margin:13px 0;border:1px solid #cbd5df;overscroll-behavior-x:contain}
#quiz .document-body table{display:table;width:100%;min-width:560px;border-collapse:collapse;table-layout:auto;margin:0!important;font:13px/1.55 Arial,'Noto Sans TC',sans-serif}
#quiz .document-body table th{background:#2f537b;color:#fff;text-align:left;padding:10px 9px;white-space:normal;min-width:70px}
#quiz .document-body table td{padding:9px 8px;white-space:normal;vertical-align:top;min-width:70px}
#quiz .document-body table tr:nth-child(even){background:#f4f8fd}
#quiz .type-form .document-body{background:#fcfcfa}
#quiz .type-form .document-body h3{margin:16px 0 5px}
#quiz .form-answer{border:1px solid #c3d3e3;background:#fff;padding:13px;line-height:1.72}
#quiz .choice-row{display:flex;gap:23px;flex-wrap:wrap;margin:10px 0 13px}
#quiz .services-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px 13px;margin:11px 0 17px;font-size:13.5px}
#quiz .services-grid span{overflow-wrap:anywhere}
#quiz .insertion{display:inline-block;border:1px solid #91a8be;background:#f1f5fc;padding:0px 5px;border-radius:3px;color:#1a507e}
#quiz .blank-number{margin:0 3px;font-weight:800;color:#16466e;border-color:#a3b6c9}
#quiz .type-translation .document-body{font-family:'Noto Sans TC',system-ui,sans-serif;line-height:1.82;font-size:15.5px}
#quiz .type-translation .doc-ribbon{background:#dfedf9;color:#164e83}
#quiz .type-translation .ad-hero{background:linear-gradient(115deg,#2d5f81,#337b8e)}
#quiz .type-translation .document-body p{text-align:left;white-space:pre-line}
@media(max-width:600px){
 #quiz .document-body{padding:17px 14px;font-size:15px}
 #quiz .type-letter .document-body{padding:19px 15px}
 #quiz .ad-hero{margin:-17px -14px 18px;padding:19px 14px}
 #quiz .browser-chrome{margin:-17px -14px 17px}
 #quiz .route-grid{grid-template-columns:1fr}
 #quiz .services-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
 #quiz .mail-meta>div{grid-template-columns:71px minmax(0,1fr)}
 #quiz .document-body table{min-width:530px;font-size:12px}
 #quiz .type-translation .document-body{font-size:15px}
 #quiz .bubble{max-width:96%}
 #quiz .type-notice .document-body{border-width:4px;margin:7px;padding:12px}
}

</style></head><body><main class="shell"><section id="accountToolbar" class="panel" style="margin:0 0 14px"><div class="account-line"><label for="accountCode"><strong>使用者代號</strong></label><input id="accountCode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="自行輸入 4 位代號"><button id="connectCode" type="button">載入紀錄</button><button id="leaveCode" type="button" hidden>退出雲端模式</button><a class="home-link" href="../index.html" title="返回 TOEIC 練習中心首頁">🏠 回首頁</a><a class="exam-link" href="exam.html" title="前往第十回擬真模擬考（100 題計時測驗）">📝 擬真試題</a></div><p id="cloudNotice" role="status" class="small">未輸入代號：使用本機暫存。</p></section><header><h1>TOEIC 多益線上練習｜第十回</h1></header><section class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="right">0</b><span>答對</span></div><div class="stat"><b id="wrong">0</b><span>答錯</span></div><div class="stat"><b id="accuracy">0%</b><span>正確率</span></div></section><div class="toolbar"><select id="part"><option value="all">全部 Part</option><option value="5">Part 5</option><option value="6">Part 6</option><option value="7">Part 7</option></select><button id="all" class="active">全部題目</button><button id="missed">錯題專項練習 <span id="drillCount"></span></button><button id="starred">★ 星號題目</button><button id="overview">錯題總覽</button><button id="excerptsView" type="button">文字摘錄</button><button id="exportWrong">匯出錯題</button><button id="export">匯出作答 CSV</button><label class="import-button" for="importCsv">匯入作答 CSV</label><input id="importCsv" type="file" accept=".csv,text/csv" hidden><button id="reset">重新作答</button></div><div class="answer-pref"><label for="explainMode">作答後解析：</label><select id="explainMode" aria-label="選擇答題後解析開啟方式"><option value="auto">自動展開</option><option value="manual">點擊展開</option></select><span>解析依第十回答案詳解整理；閱讀文章可切換中英文全文</span></div><section id="drillTools" class="panel" hidden><div class="drill-toolbar"><strong>錯題專項練習</strong><span id="drillInfo"></span><button type="button" id="drillRestart">重新練習全部錯題</button><button type="button" id="drillRemove">手動移除此題</button></div><p class="small">錯題不會因答對而消失；作答後立即顯示正解與詳細解析。此模式完全不修改正式測驗的作答紀錄。</p></section><section id="wrongOverview" class="panel" hidden></section><section id="excerptOverview" class="panel" hidden></section><section id="quiz"></section><button type="button" id="selectionSave" aria-label="儲存選取的文字摘錄">✎ 儲存摘錄</button><div class="nav"><button id="prev">← 上一題</button><button id="next">下一題 →</button></div><section class="panel"><div class="head"><b>題號總覽</b><span class="small">綠色答對・紅色答錯・★ 已標記</span></div><div id="numbers" class="numbers"></div></section></main><script>
const DATA={"questions":[{"id":101,"part":5,"stem":"Users of social media sites should reset ______ login passwords every 60 days.","choices":["they","them","theirs","their"],"answer":"D","explanation":"空格在名詞（login passwords）前面做修飾，所以能像形容詞一樣修飾名詞的所有格人稱代名詞 (D) 是正確答案。主格人稱代名詞 (A)、受格人稱代名詞 (B)、所有代名詞 (C) 都不能修飾名詞。"},{"id":102,"part":5,"stem":"When taking customers' menu orders, please ______ to ask about food allergies.","choices":["remembering","remember","will remember","remembered"],"answer":"B","explanation":"please 開頭的子句（please ~ allergies）是沒有主詞、以動詞原形開始的祈使句，所以能當祈使句動詞的動詞原形 (B) remember（記得）是正確答案。動名詞或現在分詞 (A)、未來式動詞 (C)、過去式動詞或過去分詞 (D) 不能當祈使句的動詞。另外，請順便區分記住「remember + to 不定詞」（記得要做……）和「remember + 動名詞」（記得做過……）的意思。"},{"id":103,"part":5,"stem":"Holdwell Department Store is known for its ______ window displays, particularly around the holidays.","choices":["attraction","attractively","attractiveness","attractive"],"answer":"D","explanation":"空格修飾後面的名詞（window displays），所以形容詞 (D) attractive（吸引人的）是正確答案。名詞 (A) 和 (C)、副詞 (B) 不能修飾這裡的名詞。"},{"id":104,"part":5,"stem":"The CEO made the ______ prediction that the company would double its profits by the end of the year.","choices":["vertical","spacious","applicable","optimistic"],"answer":"D","explanation":"句意是「執行長做出了公司在年底前會將利潤翻倍的樂觀預測」，所以形容詞 (D) optimistic（樂觀的）是正確答案。(A) vertical 表示「垂直的」，(B) spacious 表示「寬敞的」，(C) applicable 表示「適用的」。"},{"id":105,"part":5,"stem":"Wanting to pursue a more ______ fulfilling career, Ms. Conway left her job as an accountant.","choices":["creatively","create","creating","creation"],"answer":"A","explanation":"空格在形容詞（fulfilling）前面做修飾，所以副詞 (A) creatively（有創意地，在創意方面）是正確答案。動詞 (B)、動名詞或現在分詞 (C)、名詞 (D) 都不能修飾形容詞。"},{"id":106,"part":5,"stem":"There is one ______ at Stonebridge Apartments, and the unit is available for viewing.","choices":["branch","condition","degree","vacancy"],"answer":"D","explanation":"句意是「公寓有一戶是空的，那個單位可以參觀」，所以名詞 (D) vacancy（空房，空位）是正確答案。(A) branch 表示「分公司，分店」，(B) condition 表示「狀態，條件」，(C) degree 表示「程度，等級」。"},{"id":107,"part":5,"stem":"The 8:00 A.M. train is usually ______ with people commuting to work.","choices":["disliked","crowded","clear","calm"],"answer":"B","explanation":"句意是「上午的列車擠滿通勤上班的人」，所以能和空格前面的 be 動詞（is）、後面的介系詞 with 構成 be crowded with「擠滿……」的形容詞 (B) crowded 是正確答案。(A) disliked 似乎可以解釋成「不受到喜愛」，但如果是這個意思的話，應該搭配介系詞 by 使用才對。(C) clear 表示「清楚的」，(D) calm 表示「平靜的」。"},{"id":108,"part":5,"stem":"Customer inquiries related to the product's quality must be answered as ______ as possible.","choices":["long","highly","soon","always"],"answer":"C","explanation":"因為要表達「關於產品品質的顧客詢問必須盡快回答」，所以時間副詞 (C) soon（快地，早地）是正確答案。請記得 as soon as possible（盡快）這個慣用表達方式。如果使用 (A) long（久，長）的話，意思會變成「關於產品品質的顧客詢問必須回答得盡量久一點」，所以不對。(A) 和 as 的搭配也不能看成副詞子句連接詞 as long as（只要……）的用法，因為副詞子句連接詞 as long as 後面應該接子句。(B) highly 表示「非常」，(D) always 表示「總是」。"},{"id":109,"part":5,"stem":"The venue for CRG Communications' annual conference ______ later this week.","choices":["deciding","will be decided","have decided","can decide"],"answer":"B","explanation":"句中缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。因為要表達「場地被決定」，而且時間在未來（later this week），所以 (B) will be decided 是正確答案。現在完成式 (C) 不能搭配表示未來時間的詞語使用。如果使用含有助動詞 can 的主動態 (D)，意思會變成「場地可以決定（場地做出決定的行為）」，所以不對。動名詞或現在分詞 (A) 不能當動詞使用。"},{"id":110,"part":5,"stem":"Mr. Richards ______ met the deadline for his report since his schedule was very busy with meetings.","choices":["carefully","barely","frequently","fairly"],"answer":"B","explanation":"句意是「因為行程塞滿會議而非常忙碌，所以很勉強才趕上報告的截止期限」，所以副詞 (B) barely（勉強地，「差一點就做不到」）是正確答案。另外，請記得 barely 也常常當頻率副詞「幾乎不」使用。(A) carefully 表示「小心地」，(C) frequently 表示「頻繁地，經常」，(D) fairly 表示「相當，非常」。"},{"id":111,"part":5,"stem":"A large ______ of valuable contemporary art has recently been donated to the Beldoni Museum.","choices":["collects","collected","collection","collector"],"answer":"C","explanation":"空格出現在不定冠詞（A）和介系詞（of）中間，並且被形容詞（large）修飾，所以名詞 (C) 和 (D) 是可能的答案。因為要表達「大量貴重的當代藝術收藏被捐給博物館」，所以事物名詞 (C) collection（收藏，收藏品）是正確答案。如果使用人物名詞 (D) collector（收藏者），意思會變成「大型的當代藝術收藏者被捐給博物館」，所以不對。動詞 (A) 和動詞或過去分詞 (B) 不能用在名詞位置。"},{"id":112,"part":5,"stem":"Mr. Godwin's flight reservations are ______ but he has yet to choose a hotel.","choices":["attended","maintained","founded","confirmed"],"answer":"D","explanation":"句意是「航班預約確認了，但還沒選擇飯店」，所以動詞 confirm（確認）的 p.p. 形 (D) confirmed 是正確答案。(A) attend 表示「出席」，(B) maintain 表示「維持」，(C) found 表示「創立」。"},{"id":113,"part":5,"stem":"Most companies advertise online as the Internet has a significant ______ on consumer behavior.","choices":["direction","influence","atmosphere","obligation"],"answer":"B","explanation":"句意是「網路對消費者行為有重大的影響」，所以能和空格前面的動詞（has）、後面的介系詞（on）構成 have an influence on「對……有影響」的名詞 (B) influence（影響）是正確答案。(A) direction 表示「方向」，(C) atmosphere 表示「氣氛，大氣」，(D) obligation 表示「義務」。"},{"id":114,"part":5,"stem":"______ becoming an actor and musician, Mr. Austin worked in the construction industry as an electrician.","choices":["Prior to","In case of","Provided that","In accordance with"],"answer":"A","explanation":"這個句子已經具備主詞（Mr. Austin）和動詞（worked），是完整的子句，所以 ~ musician 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(B)、(D) 是可能的答案。因為要表達「在成為演員及音樂人之前」，所以介系詞 (A) Prior to（在……之前）是正確答案。(B) In case of 表示「假如發生……」，(D) In accordance with 表示「符合……」。副詞子句連接詞 (C) Provided that（倘若，如果……）引導的是修飾子句，而不是修飾片語。"},{"id":115,"part":5,"stem":"In order to register for the class, prospective students have to ______ some paperwork.","choices":["check in","fill out","make over","give up"],"answer":"B","explanation":"句意是「為了報名上課，未來的學生必須填寫一些文件」，所以動詞慣用語 (B) fill out（填妥，填寫）是正確答案。(A) check in 表示「登記報到，登記入住，託運行李」，(C) make over 表示「轉讓，翻新」，(D) give up 表示「放棄」。"},{"id":116,"part":5,"stem":"The company gives a percentage of its sales revenue to charity, and many consumers have expressed ______ for this policy.","choices":["admires","admired","admire","admiration"],"answer":"D","explanation":"空格是及物動詞（have expressed）的受詞位置，所以名詞 (D) admiration（敬佩）是正確答案。動詞 (A) 和 (C)、動詞或過去分詞 (B) 都不能用在名詞位置。也請記得 express admiration for（對於……表達敬佩）這個慣用表達方式。"},{"id":117,"part":5,"stem":"Mr. Harrelson is the ideal candidate for the position as he possesses ______ work experience and the required academic credentials.","choices":["either","neither","not only","both"],"answer":"D","explanation":"能和空格後面的 and 形成相關連接詞 both A and B（A 和 B 都）的 (D) both（兩者都）是正確答案。在這個句子裡，both 連接動詞（possesses）的受詞 work experience 和 the required academic credentials。(A) either 是搭配 or 形成 either A or B（A 或 B 其中一個）。(B) neither 是搭配 nor 形成 neither A nor B（A 和 B 都不）。(C) not only 則是搭配 but 形成 not only A but (also) B（不止 A，B 也是）。"},{"id":118,"part":5,"stem":"Due to low consumer prices and a supply surplus, producing natural gas is no longer ______ for many companies.","choices":["profitability","profits","profitable","profit"],"answer":"C","explanation":"空格是 be 動詞（is）的補語位置，所以能當補語的名詞 (A)、(B)、(D) 和形容詞 (C) 都是可能的答案。句意是「生產天然氣不再有利可圖」，而補語表示主詞（producing natural gas）的狀態，所以形容詞 (C) profitable（可獲利的，有利潤的）是正確答案。如果使用名詞 (A) profitability（獲利能力）的話，表示和主詞相同的事物，意思會變成「生產天然氣不再是獲利能力」，所以不對。複數可數名詞 (B) profits（利潤）不能搭配單數動詞（is）使用，單數可數名詞 (D) profit 必須加上冠詞或使用複數形。"},{"id":119,"part":5,"stem":"Sewell Packaging originally wanted to open a factory in Ohio, but it chose to open one in Illinois ______.","choices":["yet","almost","instead","indeed"],"answer":"C","explanation":"句意是「原本想在俄亥俄州開設工廠，但後來選擇在伊利諾州開設」，所以副詞 (C) instead（反而，而是）是正確答案。(A) yet 表示「尚未，仍」或「然而」，(B) almost 表示「幾乎」，(D) indeed 表示「確實」。"},{"id":120,"part":5,"stem":"These documents ______ that a restaurant has passed its inspection and meets all the health and safety standards.","choices":["certify","protect","devise","qualify"],"answer":"A","explanation":"句意是「這些文件證明餐廳已經通過檢查」，所以動詞 (A) certify（證明）是正確答案。(B) protect 表示「保護」，(C) devise 表示「設計，發明」，(D) qualify 表示「使有資格」。"},{"id":121,"part":5,"stem":"There is ______ more important for Soundwave Inc. than regaining the trust of its clients.","choices":["other","whatever","anyone","nothing"],"answer":"D","explanation":"因為要表達「沒有比重新獲得客戶信任更重要的事」，所以不定代名詞 (D) nothing（沒有什麼）是正確答案。在這個句子裡，nothing 和比較級表達方式（more important than ~）一起使用，表示「沒有比……更重要的事」，也就是最高級的意義「……最重要」。不定形容詞 (A) other（其他的）表示在已經提過的事物以外的東西，修飾複數可數名詞或不可數名詞。複合關係代名詞或複合關係形容詞 (B) whatever（不管什麼）引導名詞子句，作為句中的主詞或受詞。不定代名詞 (C) anyone 在肯定句中表示「任何人（都……）」，用在這裡會使意思變成「有任何人都比重新獲得客戶信任更重要」，所以不對。"},{"id":122,"part":5,"stem":"The public's positive attitude ______ environmental protection has resulted in many businesses adopting ecologically friendly practices.","choices":["behind","by","toward","like"],"answer":"C","explanation":"因為要表達「大眾對環境保護的正面態度」，所以表示方向的介系詞 (C) toward（朝向，對於……）是正確答案。(A) behind 表示位置「在……後方」，(B) by 表示時間點「在……之前」，(D) like 表示「像，類似……」。"},{"id":123,"part":5,"stem":"______ new staff members for the company is a duty of the human resources department.","choices":["Recruited","Recruitment","Recruit","Recruiting"],"answer":"D","explanation":"句子裡有動詞（is），但缺少主詞，所以能當主詞的名詞 (B) 和 (C)、動名詞 (D) 是可能的答案。只有動名詞可以接後面的名詞當受詞，所以動詞 recruit 的動名詞形 (D) Recruiting 是正確答案。名詞 (B) 和 (C) 後面不能接受詞，動詞或過去分詞 (A) 不能當主詞。就算把 new staff members 當成主詞、過去分詞 (A) 當成修飾主詞的成分，也會變成錯的意思「被招募的新員工是人力資源部的一項職責」，而且這樣一來因為主詞是複數，所以不能使用單數動詞（is）。"},{"id":124,"part":5,"stem":"New businesses should consider participating in industry trade fairs to gain ______.","choices":["fluency","closure","exposure","proximity"],"answer":"C","explanation":"因為要表達「新企業應該考慮參加業界的貿易展來獲得曝光」，所以名詞 (C) exposure（曝光）是正確答案。請記得 gain exposure（獲得曝光）這個慣用表達方式。(A) fluency 表示「流利，流暢」，(B) closure 表示「關閉」，(D) proximity 表示「接近」。"},{"id":125,"part":5,"stem":"Coming up with ways ______ a business from its competitors can be challenging, especially in a global market.","choices":["differentiate","differentiation","to differentiate","differentiates"],"answer":"C","explanation":"這個句子已經有具備主詞（Coming up with ways）、動詞（can be）和補語（challenging）的完整子句，所以 a business ~ competitors 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語，並且在名詞（ways）後面做修飾，表示「差異化的方法」的 to 不定詞 (C) to differentiate 是正確答案。動詞 (A) 和 (D)、名詞 (B) 都不能引導修飾片語。另外，也請記得 way to do（做……的方法）這個慣用表達方式。"},{"id":126,"part":5,"stem":"Figure skater Erica Mikhailov earned an ______ high tournament score and is likely to become the new champion.","choices":["adversely","impressively","identically","importantly"],"answer":"B","explanation":"句意是「獲得了令人印象深刻的錦標賽高分，而很有可能成為新的冠軍」，所以副詞 (B) impressively（令人印象深刻地）是正確答案。(A) adversely 表示「不利地」，(C) identically 表示「相同地」，(D) importantly 表示「重要地」。"},{"id":127,"part":5,"stem":"According to various management experts, planning ahead and prioritizing tasks can help raise one's ______.","choices":["product","productivity","produced","producer"],"answer":"B","explanation":"空格接在所有格（one's）後面，所以名詞 (A)、(B)、(D) 是可能的答案。因為要表達「排定工作優先順序有助於提高生產力」，所以 (B) productivity（生產力）是正確答案。如果使用 (A) product（產品）或 (D) producer（生產者）的話，意思會變成「排定工作優先順序有助於提高產品／生產者」，所以不對。動詞或過去分詞 (C) 不能用在名詞位置。"},{"id":128,"part":5,"stem":"The actress who played singer Sabrina Newton in the movie Monochrome won an award ______ her excellent performance.","choices":["aside from","contrary to","together with","because of"],"answer":"D","explanation":"因為要表達「女演員因為優秀的表演而得獎」，所以表示理由的介系詞 (D) because of（因為……）是正確答案。(A) aside from 表示「除了……以外」，(B) contrary to 表示「和……相反」，(C) together with 表示「和……一起，包含……」。"},{"id":129,"part":5,"stem":"______ sell her home for less than its market value, Ms. Danvers decided to rent it out temporarily.","choices":["Unless","Only if","Rather than","Whether"],"answer":"C","explanation":"因為要表達「不是以低於市場價值的價格賣出房子，而是決定暫時出租」，所以比較表達方式 (C) Rather than（而不是……）是正確答案。請注意比較表達方式 Rather than（而不是……）後面可以接動詞原形。Rather than 以 A rather than B（A 而不是 B）的形態使用時，則是像對等連接詞一樣，連接相同的詞性或結構。副詞子句連接詞 (A) Unless（除非）、(B) Only if（只有在……的情況下）、(D) Whether（不管是否……）後面都要接子句才對。"},{"id":130,"part":5,"stem":"The mobile app allows users to ______ objects up to 20 times their actual size.","choices":["assume","magnify","provoke","multiply"],"answer":"B","explanation":"句意是「將物體放大到實際大小的 20 倍」，所以動詞 (B) magnify（放大）是正確答案。(A) assume 表示「假定」，(C) provoke 表示「激起」，(D) multiply 表示「使倍增」。"},{"id":131,"part":6,"stem":"Choose the best answer for blank 131 in the passage.","choices":["reserved","are reserved","will be reserved","were being reserved"],"answer":"B","explanation":"動詞 reserve（預留）是及物動詞，而空格後面沒有受詞，所以被動態 (B)、(C)、(D) 是可能的答案。句意是「有 10 個車位是預留給訪客的」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到「它們」（訪客車位）有清楚標示，並且位於電梯左邊，所以這 10 個車位是現在已經存在的，現在式 (B) are reserved 是正確答案。未來式 (C) 表示對於未來狀況的推測，或者表示意志，過去進行式 (D) 表示過去特定時間點進行中的事情。主動態 (A) 後面必須要有受詞。","group":"131-134"},{"id":132,"part":6,"stem":"Choose the best answer for blank 132 in the passage.","choices":["Outstanding tickets can be settled at our main office.","One of these is guaranteed in your rental agreement.","City parking meters can be found on the sidewalk.","Another option is to have security cameras put in."],"answer":"C","explanation":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 In the event that they are all occupied, guests should be able to find spots on Trenton Street. 提到，萬一「它們」（訪客車位）全部在使用中，訪客應該能在 Trenton 街找到車位，所以空格的內容應該和訪客停車的地方有關，(C) City parking meters can be found on the sidewalk 是正確答案。","group":"131-134"},{"id":133,"part":6,"stem":"Choose the best answer for blank 133 in the passage.","choices":["employees","vendors","customers","tenants"],"answer":"D","explanation":"句意是「未經授權佔用＿＿的車位的車輛將被拖吊」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到，公寓的地下停車場遭到拜訪租戶的訪客不當利用，所以應該是未經許可佔用租戶的車位會被拖吊，名詞 (D) tenants（房客，住戶）是正確答案。(A) employee 表示「員工」，(B) vendor 表示「小販」，(C) customer 表示「顧客」。","group":"131-134"},{"id":134,"part":6,"stem":"Choose the best answer for blank 134 in the passage.","choices":["For instance","However","Nonetheless","Furthermore"],"answer":"D","explanation":"空格和逗號一起出現在句子開頭的連接副詞位置，所以要掌握上一句和空格所在句子之間的關係，才能判斷答案。上一句提到未經授權佔用住戶車位的車輛將由管理部門決定拖吊，而空格所在的句子說車主將會被開 25 元的罰單，所以表示對上一句的內容進行補充的連接副詞 (D) Furthermore（而且，此外）是正確答案。(A) For instance 表示「例如」，(B) However 表示「然而，不過」，(C) Nonetheless 表示「儘管如此」，用在這裡意思都不恰當。","group":"131-134"},{"id":135,"part":6,"stem":"Choose the best answer for blank 135 in the passage.","choices":["has developed","is developing","will develop","developing"],"answer":"A","explanation":"空格所在的句子缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。句意是「開發新的行動應用程式」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。後面的部分提到，在這個行動應用程式推出以後，有許多使用者下載了，所以開發應用程式是過去發生的事。因此，表示過去發生的事影響力持續至今，或者剛完成某事的現在完成式 (A) has developed 是正確答案。現在進行式 (B) 表示現在進行中的事，未來式 (C) 表示未來發生的事、對未來狀況的預測，或者表示意志。動名詞或現在分詞 (D) 不能當動詞使用。","group":"135-138"},{"id":136,"part":6,"stem":"Choose the best answer for blank 136 in the passage.","choices":["proposed","launched","designed","financed"],"answer":"B","explanation":"句意是「它已經在 2 月 1 日被＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到信用卡公司 Echo 開發了新的行動應用程式，而空格所在句子的下一句又提到在發表後，很快就有將近 50,000 名使用者下載「它」（應用程式），所以應用程式應該是在 2 月 1 日被發表了，動詞 launch（推出，使上市）的 p.p. 形 (B) launched 是正確答案。(A) propose 表示「提議」，(C) design 表示「設計」，(D) finance 表示「提供資金」。","group":"135-138"},{"id":137,"part":6,"stem":"Choose the best answer for blank 137 in the passage.","choices":["returns","cancellations","purchases","searches"],"answer":"C","explanation":"句意是「因為儲存卡片詳細資料與運送資訊，所以完成線上＿＿比以往快得多」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，大部分網站的付款過程現在花費不到 5 秒，由此可知是線上購買的速度變快了，名詞 (C) purchases（購買）是正確答案。(A) return 表示「退貨」，(B) cancellation 表示「取消」，(D) search 表示「搜尋」。","group":"135-138"},{"id":138,"part":6,"stem":"Choose the best answer for blank 138 in the passage.","choices":["To dispute an unauthorized charge, contact the merchant directly.","Applying for a credit card over the Internet is fast and simple.","The back of the card must be signed by the user to be valid.","Using Echo's application also makes electronic transactions safer."],"answer":"D","explanation":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。下一句 We've incorporated cutting-edge security features that should give our clients peace of mind when shopping online 提到，納入了最尖端的安全功能，應該會讓客戶在網路購物時感到放心，所以空格的內容應該和線上交易的安全性有關，(D) Using Echo's application also makes electronic transactions safer 是正確答案。","group":"135-138"},{"id":139,"part":6,"stem":"Choose the best answer for blank 139 in the passage.","choices":["facilitator","facilitate","facilitation","facility"],"answer":"D","explanation":"能被形容詞最高級（newest）修飾的是名詞，所以名詞 (A)、(C)、(D) 是可能的答案。因為要表達「宣布最新的購物設施 River Reed 購物中心開幕」，所以名詞 (D) facility（設施）是正確答案。如果使用 (A) facilitator（協助者）或 (C) facilitation（便利化、促進）的話，意思會變成「宣布最新的協助者／便利化 River Reed 購物中心開幕」，所以不對。動詞 (B) 不能用在名詞位置。","group":"139-142"},{"id":140,"part":6,"stem":"Choose the best answer for blank 140 in the passage.","choices":["Don't forget to prepare for your speech.","Choose a time that conveniently suits your schedule.","It is open to the public and requires no reservations.","The event was deemed a great success."],"answer":"C","explanation":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 The ribbon-cutting ceremony will be held at 10:30 A.M. on March 15. 提到，剪綵儀式將於 3 月 15 日上午 10:30 舉行，而下一句 To attend, simply go to Harper Square on Boswell Street 則說，要參加活動，只要到 Boswell 街上的 Harper 廣場，所以空格的內容應該和參加活動的詳細說明有關，(C) It is open to the public and requires no reservations 是正確答案。(A) 和 (B) 雖然看起來也和參加活動有關，但邀請的對象——一般大眾並不會發表演說，而且開幕活動的時間已經定在上午 10:30，並不是可以選擇的，所以都不對。","group":"139-142"},{"id":141,"part":6,"stem":"Choose the best answer for blank 141 in the passage.","choices":["proceed to","take over","drive by","point out"],"answer":"A","explanation":"句意是「要參加活動，只要到 Boswell 街上的 Harper 廣場，然後前往正門」，所以動詞片語 (A) proceed to（前往……）是正確答案。(B) take over 表示「接管」，(C) drive by 表示「開車經過」，(D) point out 表示「指出」。","group":"139-142"},{"id":142,"part":6,"stem":"Choose the best answer for blank 142 in the passage.","choices":["free","freedom","freely","freeness"],"answer":"C","explanation":"空格修飾後面的動詞（explore），所以副詞 (C) freely（自由地）是正確答案。形容詞 (A)、名詞 (B) 和 (D) 不能修飾動詞。(A) 雖然也有副詞的用法，但當副詞時只能在動詞後面做修飾，所以不對。","group":"139-142"},{"id":143,"part":6,"stem":"Choose the best answer for blank 143 in the passage.","choices":["to take","taken","took","will take"],"answer":"A","explanation":"that 子句（that your request ~ approved）是具備主詞（your request）和動詞（has been approved）的完整子句，所以 ~ London Modern Art Gallery 是修飾性的語句。修飾部分沒有動詞，而且修飾空格前面的名詞，所以能引導修飾片語，並且在名詞後面做修飾的 to 不定詞 (A) 和過去分詞 (B) 是可能的答案。因為空格後面有受詞（pictures），而且要表達「為了攝影的申請」，所以 to 不定詞 (A) to take 是正確答案。過去分詞 (B) 不能接空格後面的受詞（pictures）。動詞 (C) 和 (D) 不能引導修飾片語。","group":"143-146"},{"id":144,"part":6,"stem":"Choose the best answer for blank 144 in the passage.","choices":["This would normally be possible, but we will be closed for renovations.","I have indicated which of the questions you neglected to answer.","In this case, you are allowed to take pictures without any charge.","Otherwise, you will not be able to bring your camera into the exhibits."],"answer":"D","explanation":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Be sure to bring the document enclosed with this letter and present it at the ticket desk when you arrive. 提醒務必攜帶這封信所附的文件，而且抵達時要在售票處出示它，所以空格的內容應該和在美術館攝影的規定有關，(D) Otherwise, you will not be able to bring your camera into the exhibits 是正確答案。(C) 雖然也和攝影有關，但下一句提到要付費用，和這個選項的敘述矛盾。","group":"143-146"},{"id":145,"part":6,"stem":"Choose the best answer for blank 145 in the passage.","choices":["maps","links","images","reviews"],"answer":"C","explanation":"句意是「在申請表上，您提到＿＿將出現在《Globe Traveler》雜誌上」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到在美術館攝影的申請已經獲得批准，所以會在雜誌出現的應該是照片，正確答案是 (C) images（影像）。(A) map 表示「地圖」，(B) link 表示「連結」，(D) review 表示「評論」。","group":"143-146"},{"id":146,"part":6,"stem":"Choose the best answer for blank 146 in the passage.","choices":["promptly","regularly","originally","never"],"answer":"A","explanation":"句意是「同意＿＿寄給我們一份」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句說期望在出版後的 3 個工作天內收到，所以收件人同意的應該是在出版後很快寄送一份（雜誌），副詞 (A) promptly（立即，迅速地）是正確答案。(B) regularly 表示「定期」，(C) originally 表示「原本」，(D) never 表示「從不，絕不」。","group":"143-146"},{"id":147,"part":7,"stem":"Who most likely is Ms. Ellis?","choices":["An electrician","A building manager","A marketing employee","A product designer"],"answer":"C","explanation":"這是和題目關鍵詞語 Ms. Ellis 有關的推論問題。Requested by: Anita Ellis 的部分顯示這是 Anita Ellis 填寫的申請表，而 The air conditioner in our marketing research office 的部分提到「我們」行銷研究部的冷氣，由此可以推知 Anita Ellis 是行銷研究部的員工，所以 (C) 是正確答案。","group":"147-148"},{"id":148,"part":7,"stem":"What is suggested about Shiner Electronics?","choices":["Its staff moved to a new office last month.","Its air conditioner underwent maintenance last summer.","It recently replaced some office equipment.","Most service requests will be handled within a week."],"answer":"D","explanation":"這是和題目關鍵詞語 Shiner Electronics 有關的推論問題。Priority: Low: Complete within one week 的部分顯示優先程度低的服務申請會在一週內處理完成，由此可以推知 Shiner 電子產品公司大部分的服務申請會在一週內獲得處理，所以 (D) 是正確答案。","group":"147-148"},{"id":149,"part":7,"stem":"What is indicated about Cerulean Tower?","choices":["It is a famous landmark.","It is newly refurbished.","It is almost fully occupied.","It is near a transit stop."],"answer":"C","explanation":"這是和題目關鍵詞語 Cerulean Tower 有關的推論問題。The last remaining ~ apartment at Cerulean Tower is available for rent. 的部分提到，Cerulean 大樓最後剩下的公寓可供出租，由此可以推知 Cerulean 大樓幾乎每個單位都有住戶了，所以 (C) 是正確答案。","group":"149-150"},{"id":150,"part":7,"stem":"What is NOT included with the advertised apartment?","choices":["Free parking area","Kitchen appliances","Pieces of furniture","Recreational facilities"],"answer":"A","explanation":"這是 Not/True 題型，要找出和關鍵詞語 included with the advertised apartment 有關的內容，並且對照選項判斷答案。(A) 在 Rental parking is available in a private garage nearby. 的部分提到，附近有私人停車場可租用停車位，而沒有提到免費停車區域，不符合選項敘述，所以 (A) 是正確答案。(B) 在 The kitchen is equipped with sleek appliances 的部分提到，廚房配備線條俐落的電器設備，符合選項敘述。(C) 在 The property comes with a sofa, coffee table, bed, nightstands 的部分提到，這間公寓附有沙發、咖啡桌、床、床頭櫃，符合選項敘述。(D) 在 Cerulean Tower is a ~ building with a theater and fitness center. 的部分提到，Cerulean 大樓設有電影院與健身中心，符合選項敘述。","group":"149-150"},{"id":151,"part":7,"stem":"What problem does Mr. Daniels mention?","choices":["He accidentally broke a lock.","He is late for a work shift.","He cannot access his apartment.","He cannot contact his supervisor."],"answer":"C","explanation":"這是問 Daniels 先生提到什麼（What）問題的 wh- 問題。和題目的關鍵詞語 problem ~ Mr. Daniels mention 有關的部分是 Daniels 先生所說的 are you in the apartment? I need to get in. I left my keys inside.，他問 Sarah Woolf 是否在公寓，因為他需要進去，把鑰匙留在裡面了，所以 (C) 是正確答案。","group":"151-152"},{"id":152,"part":7,"stem":"At 10:17 A.M., what does Ms. Woolf mean when she writes, \"Don't worry about it\"?","choices":["She will be at the apartment soon.","Mr. Daniels doesn't have to call a locksmith.","Some school materials are not important.","She will cover Mr. Daniels's shift."],"answer":"B","explanation":"這一題問的是 Woolf 小姐的訊息所表達的意圖，所以要掌握引用部分（Don't worry about it）前後文的情境。Eric Daniels 說 I don't want to call a locksmith to unlock the door，表示自己不想叫鎖匠開鎖，對此 Woolf 小姐回應 Don't worry about it.（別擔心），然後補充說 Just call the office downstairs. The building manager keeps a set of keys，表示只要打電話給樓下的辦公室就行了，因為大樓管理員有一套鑰匙。因此，Woolf 小姐要表達的意思是 Daniels 先生不必叫鎖匠，(B) 是正確答案。","group":"151-152"},{"id":153,"part":7,"stem":"What is one purpose of the notice?","choices":["To announce a fee increase","To report a project extension","To describe a new storage area","To warn against breaking a rule"],"answer":"B","explanation":"這一題問的是這則通知的目的，所以要注意文章開頭的部分。We are sorry to report to Waltrop Leisure Center members that our pool closure will be extended. We have ~ decided to retile the entire pool. 的部分，很遺憾地向 Waltrop 休閒中心的會員報告，游泳池的關閉期間將會延長，並且已經決定重鋪整座游泳池的瓷磚，之後的部分則是說明和施工有關的事項，所以 (B) 是正確答案。","group":"153-154"},{"id":154,"part":7,"stem":"What is suggested about Waltrop Leisure Center?","choices":["It will remain fully closed until July 16.","It is used by the citizens of several towns.","It has added content to its enrollment form.","It normally offers classes at its facility."],"answer":"D","explanation":"這是和題目關鍵詞語 Waltrop Leisure Center 有關的推論問題。Members who have paid for swimming lessons in advance can ~ credit their payments toward future lessons. 的部分提到，已經預先支付游泳課費用的會員，可以用已付的金額抵用未來的課程，由此可以推知 Waltrop 休閒中心提供課程，所以 (D) 是正確答案。","group":"153-154"},{"id":155,"part":7,"stem":"What did Mr. Benedict do yesterday?","choices":["Went shopping at a computer store","Transferred some funds to a consultant","Printed out some tax documents","Contacted a customer support service"],"answer":"D","explanation":"這是問 Benedict 先生昨天做了什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Benedict do yesterday 有關的部分是 Tanya Huang 所說的 I understand you sent a request for assistance yesterday regarding our accounting software.，這部分說自己知道 Benedict 先生昨天對於會計軟體提出了支援申請，所以 (D) 是正確答案。","group":"155-158"},{"id":156,"part":7,"stem":"What is Mr. Benedict having trouble doing?","choices":["Locating a misplaced file","Accessing an online account","Downloading an essential update","Sharing information between programs"],"answer":"D","explanation":"這是問 Benedict 先生做什麼（What）遇到了困難的 wh- 問題。和題目的關鍵詞語 Mr. Benedict having trouble doing 有關的部分是 Tanya Huang 說的 I understand you sent a request for assistance ~ regarding our accounting software.，這部分說自己知道 Benedict 先生昨天對於會計軟體提出了支援申請，而 Benedict 先生回應 That's correct. I can't figure out how to transfer some data in an Analyte file to Upcell.，表示的確申請了支援，並且說明自己找不到把 Analyte 檔的一些資料轉移到 Upcell 的方法，所以 (D) 是正確答案。","group":"155-158"},{"id":157,"part":7,"stem":"At 10:07 A.M., what does Mr. Benedict most likely mean when he writes, \"That's the thing\"?","choices":["He is surprised that a new item was released.","He has already attempted a solution.","He would like to redeem some points.","He is willing to make a compromise."],"answer":"B","explanation":"這一題問的是 Benedict 先生的訊息所表達的意圖，所以要掌握引用部分（That's the thing）前後文的情境。Tanya Huang 說 You need to click on \"File,\" choose \"Export,\" and select \"Upcell\" from the list.，告知應該點擊「檔案」，選擇「匯出」，並且從列表中選擇「Upcell」，但 Benedict 先生回應 That's the thing.（那就是問題所在），並且接著說 I tried that but it didn't work.，表示自己試了那個方法，但沒有用，意味著 Benedict 先生已經試過 Tanya Huang 教導的方法，所以 (B) 是正確答案。","group":"155-158"},{"id":158,"part":7,"stem":"What does Ms. Huang ask Mr. Benedict to do?","choices":["Select a mailing option from a list","Renew an expired subscription","Prepare to make a payment","Submit a form to another department"],"answer":"C","explanation":"這是問 Huang 小姐要求 Benedict 先生做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Huang ask Mr. Benedict to do 有關的部分是 I can connect you to our billing department, but you'll need to have your credit card ready.，這部分說可以幫忙轉接帳務部，需要準備好信用卡，所以 (C) 是正確答案。","group":"155-158"},{"id":159,"part":7,"stem":"What is the e-mail mainly about?","choices":["Invitations to an exercise class","Information about a focus group","Preparations for a trade fair","Details regarding a fitness plan"],"answer":"B","explanation":"這一題問的是這篇文章的主題，所以要注意文章開頭的部分。Thank you for agreeing to participate in Branca Fitness's focus group on exercise equipment. 的部分，感謝同意加入 Branca Fitness 關於運動器材的焦點團體訪談，之後則詳細說明焦點團體訪談的細節，所以 (B) 是正確答案。","group":"159-161"},{"id":160,"part":7,"stem":"What is Ms. Carpenter encouraged to do?","choices":["Bring along a guest","Post a product review","Wear an appropriate outfit","Park in front of a building"],"answer":"C","explanation":"這是問 Carpenter 小姐被鼓勵做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Carpenter encouraged to do 有關的部分是 Please make sure to wear comfortable clothing，這部分要求穿著舒適的衣服，所以 (C) 是正確答案。","group":"159-161"},{"id":161,"part":7,"stem":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?","choices":["[1]","[2]","[3]","[4]"],"answer":"D","explanation":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「這會花 2 到 3 天的時間」，所以應該會出現在和花費時間有關的部分。[4] 的上一句 a payment of $150 will be provided to each participant via bank transfer 提到，150 元的款項將透過銀行轉帳提供給每位參加者。將句子填入 [4] 的位置之後，可以表達「150 元的款項將透過銀行轉帳提供給每位參加者，這個過程會花 2 到 3 天的時間」，文意通順，所以 (D) 是正確答案。","group":"159-161"},{"id":162,"part":7,"stem":"What information is included in the Web page?","choices":["Reasons to buy some investment shares","The names of some business partners","Details about a company's beginnings","A link to an online shopping site"],"answer":"C","explanation":"這是問網頁包含什麼（What）資訊的 wh- 問題。和題目的關鍵詞語 information 有關的部分是 Maksma was founded 15 years ago in Estonia, with the goal of making it easier for people to shop online. When its original office opened, it had just 46 staff members.，這部分提到 Maksma 公司 15 年前創立於愛沙尼亞，目標是讓人們在網路上購物更容易，而最初的辦公室開設時，它只有 46 名員工，這些資訊和公司的一開始有關，所以 (C) 是正確答案。","group":"162-164"},{"id":163,"part":7,"stem":"According to the Web page, what benefit does Maksma offer customers?","choices":["A wide product selection","Specially negotiated discounts","The ability to defer payments","Chances to view used goods"],"answer":"C","explanation":"這是問根據網頁，Maksma 公司帶給顧客什麼（What）好處的 wh- 問題。和題目的關鍵詞語 benefit ~ Maksma 有關的部分是 Maksma differentiates itself by giving customers the option to pay ~ later, or in partial amounts over a specified period of time.，這部分提到 Maksma 公司藉由為顧客提供延後付款或者在指定期間付部分金額的選擇來達到差異化，所以 (C) 是正確答案。","group":"162-164"},{"id":164,"part":7,"stem":"What is stated about Maksma?","choices":["It employs senior managers from various countries.","It receives monthly payments from vendors.","It made a profit of over $2.5 billion last year.","It will be introducing a mobile application."],"answer":"A","explanation":"這是 Not/True 題型，要找出和關鍵詞語 Maksma 有關的內容，並且對照選項判斷答案。(A) 在 Its more than 1,500 employees are led by an international team of executives. 的部分提到，公司超過 1,500 名的員工由國際化的經營團隊帶領，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章裡沒有提到。","group":"162-164"},{"id":165,"part":7,"stem":"What is mentioned about Fillyan Master?","choices":["It requires expert training to learn how to operate.","It will be demonstrated at an industry event.","It must be connected to computer hardware.","It can be used with mobile devices."],"answer":"D","explanation":"這是 Not/True 題型，要找出和關鍵詞語 Fillyan Master 有關的內容，並且對照選項判斷答案。(A)、(B)、(C) 在文章裡沒有提到。(D) 在 It enables you to use a phone or tablet to monitor and manage audiovisual equipment, lighting, room temperature 的部分提到，「它」（Fillyan Master）讓使用者能用手機或平板監控並管理視聽設備、照明、室內溫度，符合選項敘述，所以 (D) 是正確答案。","group":"165-168"},{"id":166,"part":7,"stem":"What function of Fillyan Master is NOT indicated in the brochure?","choices":["It enables remote teams to work together.","It gathers information about energy use.","It determines optimal room layouts.","It adjusts the temperature in workspaces."],"answer":"C","explanation":"這是 Not/True 題型，要找出和關鍵詞語 function of Fillyan Master 有關的內容，並且對照選項判斷答案。(A) 在 collaborate with others by accessing voice and video channels from anywhere that has wireless Internet. 的部分提到，可以從任何有無線網路的地方，透過語音與影像管道與他人協作，符合選項敘述。(B) 在 Fillyan Master ~ enables you to collect data about ~ energy usage. 的部分提到，Fillyan Master 讓使用者能收集關於能源使用的資料，符合選項敘述。(C) 在文章裡沒有提到，所以 (C) 是正確答案。(D) 在 Program your window shades in order to maximize their cooling potential at various times of the day. 的部分提到，為電動窗戶遮陽簾編寫程式，藉以在一天中的各種時間將降溫能力最大化，符合選項敘述。","group":"165-168"},{"id":167,"part":7,"stem":"Why will some customers call a hotline number?","choices":["To order large quantities of an item","To arrange a product presentation","To schedule an office inspection","To obtain technical assistance"],"answer":"B","explanation":"這是問有些顧客會為了什麼（Why）打熱線電話號碼的 wh- 問題。和題目的關鍵詞語 some customers call a hotline number 有關的部分是 call our hotline ~ to schedule a demonstration，這部分提到打熱線電話安排示範操作的時間，所以 (B) 是正確答案。","group":"165-168"},{"id":168,"part":7,"stem":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?","choices":["[1]","[2]","[3]","[4]"],"answer":"C","explanation":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「這在觀眾參與方面創造新的可能」，所以應該會出現在和觀眾參與方式有關的部分。[3] 的上一句 Several participants can simultaneously view and collaborate on a presentation using a laptop or smart device. 提到，幾位參與者可以用筆記型電腦或智慧型裝置同時觀看簡報並協作。將句子填入 [3] 的位置之後，可以表達「參與者可以用筆記型電腦或智慧型裝置同時觀看簡報並協作，這樣會在觀眾參與方面創造新的可能」，文意通順，所以 (C) 是正確答案。","group":"165-168"},{"id":169,"part":7,"stem":"The word \"draw\" in paragraph 1, line 5, is closest in meaning to","choices":["gather","deduce","illustrate","extend"],"answer":"A","explanation":"draw 所在的語句 she would later draw inspiration for her writing 之中，draw 表示「獲得」的意思，所以意思最接近、表示「收集」的 (A) 是正確答案。","group":"169-171"},{"id":170,"part":7,"stem":"What is implied about There and Back?","choices":["Its story takes place in Louisiana.","It is one of four in a series.","It was written during a journey.","It is Ms. Foster's longest book."],"answer":"A","explanation":"這是和題目關鍵詞語 There and Back 有關的推論問題。Originally from Louisiana 的部分表示 Foster 小姐出生在路易斯安那州，而 Her current work in m referring specifically to Flight 293 from Zurich to Singapore 的部分提到自己指的是從蘇黎世到新加坡的 293 航班，由此可以推知 SwissLux 航空提供蘇黎世和新加坡之間的直飛航線，所以 (B) 是正確答案。","group":"172-175"},{"id":174,"part":7,"stem":"The word \"bear\" in paragraph 2, line 4, is closest in meaning to","choices":["carry","present","deliver","endure"],"answer":"D","explanation":"bear 所在的語句 the entertainment system was not working at all, which made the long flight more difficult to bear 之中，bear 表示「忍受」的意思，所以同樣能表示「忍受」的 (D) 是正確答案。","group":"172-175"},{"id":175,"part":7,"stem":"What is suggested about Mr. Holmes?","choices":["He booked his airline ticket late.","He received a reimbursement.","He has flown with SwissLux Airlines before.","He often travels to Singapore for business."],"answer":"C","explanation":"這是和題目關鍵詞語 Mr. Holmes 有關的推論問題。I have been a longtime member of your airline's loyalty program and have always been satisfied by the level of service I've received. 的部分提到自己是「你們航空公司」（SwissLux 航空）忠誠計畫的長期會員，並且一直對服務感到滿意，由此可以推知 Holmes 先生以前曾經搭乘 SwissLux 航空，所以 (C) 是正確答案。","group":"172-175"},{"id":176,"part":7,"stem":"What is NOT a benefit that Soleil Cruises offers its workers?","choices":["Daily meals","Health coverage","Tuition assistance","Free lodging"],"answer":"C","explanation":"這是 Not/True 題型，要找出和關鍵詞語 a benefit that Soleil Cruises offers its workers 有關的內容，並且對照選項判斷答案，所以要看 Soleil 遊輪的徵人廣告（第一篇文章）。(A) 和 (D) 在 we provide staff with accommodation and breakfast, lunch, and dinner each day 的部分提到，「我們」（Soleil 遊輪）提供員工每天的住宿與早、午、晚餐，符合選項內容。(B) 在 we also cover medical insurance 的部分提到也負擔醫療保險，符合選項內容。(C) 在文章裡沒有提到，所以 (C) 是正確答案。","group":"176-180"},{"id":177,"part":7,"stem":"What is a requirement of both job openings?","choices":["Willingness to fulfill passengers' special requests","Familiarity with a product line","The acquisition of a license","Experience working on a ship"],"answer":"D","explanation":"這是問什麼（What）是兩個職缺的共同必要條件的 wh- 問題，所以要針對題目關鍵詞語 a requirement of both job openings 從說明的徵人廣告（第一篇文章）找出相關內容。徵人廣告中的 Spa specialist ~ required to have served on a cruise ship in the past 顯示 spa 專家必須要有在遊輪船上服務的經驗，而 Restaurant manager ~ have held a similar position on a cruise ship for at least two years 也顯示餐廳經理要有在遊輪船上擔任類似職位至少兩年的經驗，所以 (D) 是正確答案。","group":"176-180"},{"id":178,"part":7,"stem":"What is one purpose of the letter?","choices":["To praise an educational background","To state a period of duty","To propose alternate arrangements","To ask about preferred destinations"],"answer":"B","explanation":"這一題問的是信件（第二篇文章）的主題。You'll be working six days a week for a period of nine months, from January to September. Then you will have the next three months off before beginning a new assignment. 的部分提到，「您」（Bates 先生）會在 1 月到 9 月的 9 個月期間每週工作 6 天，而在開始新的工作之前會有 3 個月的休假，所以 (B) 是正確答案。","group":"176-180"},{"id":179,"part":7,"stem":"What is suggested about Mr. Bates?","choices":["He is currently unemployed.","His résumé was sent by mail.","He will have to purchase a uniform.","His family will be able to travel for free."],"answer":"D","explanation":"這是需要對照兩篇文章內容的推論題型，先看寄給題目關鍵詞語 Mr. Bates 的信件。\n線索1：信件（第二篇文章）中，I ~ would like to offer you the position. As I mentioned, managerial staff schedules are demanding. 的部分提到，想把這個職位提供給「您」（Bates 先生），以及之前提過管理職員工的時間安排負擔很重，由此可知 Bates 先生得到了管理職的工作邀約。不過，這裡沒有提到管理職的其他資訊，所以還需要參考徵人廣告的內容。\n線索2：徵人廣告（第一篇文章）中，employees at the managerial level may bring their spouse and children on board free of charge 的部分提到，管理階層的員工可以免費帶配偶與小孩上船。\n綜合這兩個線索，可知 Bates 先生接受管理職之後，可以免費帶配偶與小孩上船，所以 (D) 是正確答案。","group":"176-180"},{"id":180,"part":7,"stem":"What does Mr. Lauzone indicate about kitchen staff?","choices":["They do not tend to work for a long period of time.","They come from various countries.","They live in shared accommodation.","They are hired by the restaurant manager."],"answer":"A","explanation":"這是 Not/True 題型，要找出和關鍵詞語 Mr. Lauzone indicate about kitchen staff 有關的內容，並且對照選項判斷答案，要看的是 Lauzone 先生所寫的信件（第二篇文章）。(A) 在 most of our kitchen and wait staff are students who work for two or three months at a time 的部分提到，大部分廚房與服 nization ~ ran educational advertisements about preventing and treating the flu. 的部分提到，由於「他」（Lima 醫師）的堅持，玻利維亞衛生組織刊登了關於預防及治療流感的教育性廣告，符合選項敘述，所以 (C) 是正確答案。","group":"186-190"},{"id":188,"part":7,"stem":"What is indicated about event tickets?","choices":["They are nonrefundable.","They come with only one drink.","They must be purchased in person.","They are for a standing section."],"answer":"A","explanation":"這是 Not/True 題型，要找出和關鍵詞語 event tickets 有關的內容，並且對照選項判斷答案，所以看介紹售票相關細節的網頁（第二篇文章）。(A) 在 All sales are final. 的部分提到，所有門票售出後都不能退換，符合選項敘述，所以 (A) 是正確答案。(B) 在 A ticket ~ includes ~ unlimited drinks 的部分提到，門票包含無限暢飲的飲料，不符合選項敘述。(C) 從 Purchase Tickets Now 的部分可以看出，可以透過網路購買門票，而不需要親臨現場，不符合選項敘述。(D) 在文章中沒有提到。","group":"186-190"},{"id":189,"part":7,"stem":"Who does Dr. Lima most likely work with?","choices":["Rodrigo Guerrero","Santiago Castillo","Maria Quintero","Stephanie Vera"],"answer":"C","explanation":"這是需要對照兩篇文章內容的推論題型，先看提到題目關鍵詞語 Dr. Lima most likely work with 相關內容的通知。\n線索1：通知（第一篇文章）中，One of Dr. Lima's colleagues will present him with the award 的部分提到，Lima 醫師的一位同事將會頒獎給他。不過，這裡沒有寫出那位同事的名字，所以還需要參考網頁的內容。\n線索2：網頁（第二篇文章）中，the renowned author Dr. Maria Quintero, who will be presenting Dr. Lima's award 的部分提到，著名作家 Maria Quintero 醫師將頒發 Lima 醫師的獎項。\n綜合這兩個線索，可知將會頒發 Lima 醫師獎項的 Maria Quintero 醫師是他的同事，(C) 是正確答案。","group":"186-190"},{"id":190,"part":7,"stem":"What is suggested about Ms. Vera?","choices":["She bought a ticket on a Web site.","She is driving a rented vehicle.","She will be reimbursed for an admission fee.","She is late for an award ceremony."],"answer":"A","explanation":"這是需要對照兩篇文章內容的推論題型，先看關鍵詞語 Ms. Vera 的停車收據。\n線索1：收據（第三篇文章）中，May 27、Stephanie Vera、event guest at Buena Vista Banquet Hall 顯示，Stephanie Vera 是參加 5 月 27 日 Buena Vista 宴會活動的賓客。不過，這裡沒有提到活動的其他細節，所以還需要參考通知的內容。\n線索2：通知（第一篇文章）中，Join us to honor Dr. Lima on May 27 ~ in the Buena Vista Banquet Hall、To purchase tickets for this event, visit www.lajm.com/tickets. 的部分邀請參加 5 月 27 日表揚 Lima 醫師的活動，並且提到要上網站購買活動門票。\n綜合這兩個線索，可知為了參加 5 月 27 日的活動，Stephanie Vera 在網站買了門票，(A) 是正確答案。","group":"186-190"},{"id":191,"part":7,"stem":"Why was the letter written?","choices":["To ask for a financial contribution","To confirm attendance at a talk","To clarify some research goals","To temporarily suspend a commitment"],"answer":"D","explanation":"這一題問的是寫信件（第一篇文章）的理由。I am writing to let you know that I will not be able to lead tours at the museum for all of January. 的部分提到，寫這封信是為了告知自己整個 1 月都不能帶領博物館的導覽，所以 (D) 是正確答案。","group":"191-195"},{"id":192,"part":7,"stem":"Which tour has Mr. Uttley been leading?","choices":["Dinosaurs and Fossils","The Technology around Us","Life in the Ocean","Our Place in the Universe"],"answer":"A","explanation":"這是需要對照兩篇文章內容的題目。題目的關鍵詞是 tour ~ Mr. Uttley been leading，要問 Uttley 先生帶領的是哪個（Which）導覽，所以先看 Uttley 先生寫的信。\n線索1：信件（第一篇文章）中，I have been leading tours on Sundays up to this point 的部分提到，「我」（Uttley 先生）到目前都是每週日帶領導覽。不過，這裡沒有寫出星期日的導覽名稱，所以還需要參考備忘錄的內容。\n線索2：備忘錄（第二篇文章）中，Dinosaurs and Fossils、Day Currently Held、Sunday 的部分顯示「恐龍與化石」到目前為止是在星期日進行。\n綜合這兩個線索，可知 Uttley 先生到目前為止帶領的是星期日的「恐龍與化石」導覽，所以 (A) 是正確答案。","group":"191-195"},{"id":193,"part":7,"stem":"According to the memo, why will a schedule be changed?","choices":["Some volunteers requested greater flexibility.","Season passes have been discontinued.","Some exhibit spaces are being renovated.","Large crowds visit on certain days."],"answer":"D","explanation":"這是問根據備忘錄（第二篇文章），為什麼時間表（Why）會被改變的 wh- 問題。our tours will be taking place on weekdays only ~. This is because our average number of weekend visitors has risen, and tour groups have become inconvenienced by the congestion. 的部分提到，導覽將只在平日進行，是因為週末平均參觀人數上升了，而導覽團體因為擁擠的情況而遭受不便，(D) 是正確答案。","group":"191-195"},{"id":194,"part":7,"stem":"What is indicated about Mr. Vinson?","choices":["He was unable to attend a team meeting.","He is not qualified to replace Dr. Uttley.","He has been granted access to a laboratory.","He has not yet signed a contract with the Grandville Science Museum."],"answer":"B","explanation":"這是需要對照兩篇文章內容的推論題型，先看題目關鍵詞語 Mr. Vinson 所寫的電子郵件。\n線索1：電子郵件（第三篇文章）中，I studied physics in university 的部分提到，「我」（Vinson 先生）在大學學物理。不過，這裡看不出大學主修的影響，所以還需要參考備忘錄的內容。\n線索2：備忘錄（第二篇文章）中，Please let me know ~ if you would be willing to take over for Dr. Uttley temporarily. All I require is that you have a degree in archaeology. 的部分提到，如果願意暫時接手 Uttley 博士，就寄電子郵件告知，以及需要有考古學學位。\n綜合這兩個線索，可知 Vinson 先生因為在大學學的是物理，所以沒有資格代替 Uttley 博士，(B) 是正確答案。","group":"191-195"},{"id":195,"part":7,"stem":"According to the e-mail, what is NOT true about the Grandville Science Museum?","choices":["It runs a dining facility for workers.","It limits the size of its tours.","It screens a movie once an hour.","It has an interactive section."],"answer":"C","explanation":"這是 Not/True 題型，要找出和題目關鍵詞語 the Grandville Science Museum 相關的內容，所以要看談到博物館內部細節的電子郵件（第三篇文章）。(A) 在 I'd be happy to discuss this further with you at the staff cafeteria during lunch 的部分提到，很樂意午餐時間在員工餐廳進一步討論，由此可知博物館經營員工餐廳，符合選項敘述。(B) 在 the number of participants in his tour exceeded our 25-person limit 的部分提到，導覽參加人數超過 25 人限制，由此可知導覽團體的大小有限制，符合選項敘述。(C) 在文章中沒有提到，所以 (C) 是正確答案。(D) 在 no new interactive exhibits will be added to the experience center that month 的部分提到，那個月不會有新的互動展示加到體驗中心，由此可知博物館有互動展示，符合選項敘述。","group":"191-195"},{"id":196,"part":7,"stem":"What is suggested about Devon Music Institute?","choices":["It has classes on musical composition.","It bought advertising space on Davis Street.","It has received funding from Periform Records.","It specializes in online learning."],"answer":"A","explanation":"這是要找出和題目關鍵詞語 Devon Music Institute 相關內容的推論問題，所以要看介紹 Devon 音樂學院的廣告（第一篇文章）。providing training for aspiring ~ composers 的部分提到為有志成為作曲家的人提供訓練，由此可以推知 Devon 音樂學院有作曲方面的課，所以 (A) 是正確答案。","group":"196-200"},{"id":197,"part":7,"stem":"What aspect of the workshop at Devon Music Institute did Mr. Hong find impressive?","choices":["Its affordable fees","Its flexible format","Its supplementary readings","Its amount of educational content"],"answer":"D","explanation":"這是問 Hong 先生覺得 Devon 音樂學院工作坊的什麼（What）方面令人印象深刻的 wh- 問題，所以要從提到題目關鍵詞語 aspect of the workshop ~ Mr. Hong find impressive 相關內容的備忘錄（第二篇文章）找出相關內容。備忘錄中的 I took one of the sessions—Early Italian Opera—last month. We were highly impressed by how much information was covered. 提到，「我」（Hong 先生）上個月參加了「早期義大利歌劇」工作坊，對於討論到的資訊量印象非常深刻，所以 (D) 是正確答案。","group":"196-200"},{"id":198,"part":7,"stem":"How much does Ms. Parker expect to be reimbursed?","choices":["$35","$55","$40","$60"],"answer":"B","explanation":"這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 Ms. Parker expect to be reimbursed，要問 Parker 小姐預期收到多少（How much）報銷退款，所以先看 Parker 小姐所寫的電子郵件。\n線索1：電子郵件（第三篇文章）中，I just wanted to follow up on my reimbursement request. It was for a workshop I joined at Devon Music Institute on May 13. 的部分提到，「我」（Parker 小姐）想追蹤報銷申請，而申請的是 5 月 13 日在 Devon 音樂學院參加工作坊的費用。不過，這裡沒有提到工作坊的報名費，所以還需要參考廣告的內容。\n線索2：廣告（第一篇文章）中，May 13、$55 顯示 5 月 13 日的工作坊費用是 55 元。\n綜合這兩個線索，可知 Parker 小姐預期收到參加 5 月 13 日工作坊的 55 元報銷退款，所以 (B) 是正確答案。","group":"196-200"},{"id":199,"part":7,"stem":"What is indicated about Ms. Parker?","choices":["She attended a seminar with one of her coworkers.","She received the wrong amount of money from the accounting department.","She planned to attend several workshops at an institute.","She submitted a request at least three weeks ago."],"answer":"D","explanation":"這是要找出和題目關鍵詞語 Ms. Parker 相關內容的推論問題，所以要看 Parker 小姐所寫的電子郵件（第三篇文章）。I just wanted to follow up on my reimbursement request. 的部分提到，「我」（Parker 小姐）想追蹤報銷申請，而 In the past, it has never taken more than three weeks. 的部分則說「它」（申請費用報銷）過去從來沒花超過 3 週，由此可以推知這次 Parker 小姐申請報銷到現在已經過了至少 3 週，所以 (D) 是正確答案。","group":"196-200"},{"id":200,"part":7,"stem":"Which department does Ms. Parker probably work in?","choices":["Promotion","Accounting","Marketing","Distribution"],"answer":"A","explanation":"這是需要對照兩篇文章內容的推論題型，先看提到題目關鍵詞語 department ~ Ms. Parker ~ work in 相關內容的電子郵件。\n線索1：電子郵件（第三篇文章）中，my manager, Mr. Hong 的部分提到「我」（Parker 小姐）的經理是 Hong 先生。不過，這裡沒有提到 Hong 先生所在的部門，所以還需要參考備忘錄的內容。\n線索2：備忘錄（第二篇文章）中，Greg Hong, promotions manager 的部分顯示 Greg Hong 是宣傳部經理。\n綜合這兩個線索，可知 Parker 小姐在 Hong 先生擔任經理的宣傳部工作，(A) 是正確答案","group":"196-200"}],"groups":{}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▤ NOTICE</span><small>131-134 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>Reminder about Guest Parking</strong></h2>\n<p>Recently, it has been reported that the basement parking area here at Deschamps Apartments is being used inappropriately by guests visiting our renters. Please note that 10 spaces <span class=\"reading-blank\">〔131〕</span> for visitors. They are clearly marked and located to the left of the elevator. In the event that they are all occupied, guests should be able to find spots on Trenton Street. <span class=\"reading-blank\">〔132〕</span></p>\n<p>Effective immediately, unauthorized vehicles occupying the spaces of <span class=\"reading-blank\">〔133〕</span> will be towed at the discretion of management. <span class=\"reading-blank\">〔134〕</span> their owners will be issued a $25 ticket. For more information, talk to Building Services Manager Vince Romoni.</p>\n</div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>135-138 · 1/1</small></div><div class=\"document-body\"><p>The credit card company Echo <span class=\"reading-blank\">〔135〕</span> a new mobile application. Named Vision Pay, it simplifies Internet shopping for Echo credit card users. It was <span class=\"reading-blank\">〔136〕</span> on February 1. Following this release, it was quickly downloaded by nearly 50,000 users.</p>\n<p>Because Vision Pay stores card details and shipping information, completing <span class=\"reading-blank\">〔137〕</span> online is much faster than it used to be. In fact, the payment process on most Web sites now takes under five seconds. <span class=\"reading-blank\">〔138〕</span> \"We've incorporated cutting-edge security features that should give our clients peace of mind when shopping online,\" says Echo Vice President Wallace Tan.</p>\n<p>If you own an Echo credit card and would like to begin using Vision Pay, visit your phone's application store.</p>\n</div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▤ NOTICE</span><small>139-142 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>Help Us Celebrate Our Grand Opening!</strong></h2>\n<p>We are pleased to announce the grand opening of River Reed Mall, Portland's newest shopping <span class=\"reading-blank\">〔139〕</span>. Standing at three stories and comprising 1.7 million square feet, River Reed Mall is home to more than 130 shops and restaurants as well as an aquarium and skating rink.</p>\n<p>The ribbon-cutting ceremony will be held at 10:30 A.M. on March 15. <span class=\"reading-blank\">〔140〕</span> To attend, simply go to Harper Square on Boswell Street and then <span class=\"reading-blank\">〔141〕</span> the main entrance. Here, a presentation will be given on the development of the mall, questions will be answered, and gift certificates will be distributed. Finally, the doors will officially open, giving attendees a chance to <span class=\"reading-blank\">〔142〕</span> explore the shopping center on their own.</p>\n</div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>✉ LETTER</span><small>143-146 · 1/1</small></div><div class=\"document-body\"><p>August 29</p>\n<p>Marcel Vastine\n77 Rue du Perche\nParis, France 75003</p>\n<p>Dear Mr. Vastine,</p>\n<p>I am writing to inform you that your request <span class=\"reading-blank\">〔143〕</span> pictures inside the London Modern Art Gallery has been approved. Be sure to bring the document enclosed with this letter and present it at the ticket desk when you arrive. <span class=\"reading-blank\">〔144〕</span> Also, make sure you are prepared to pay the fee of £300.</p>\n<p>On your application form, you stated that the <span class=\"reading-blank\">〔145〕</span> will appear in Globe Traveler magazine. Be aware that the gallery name must be mentioned in the article. Moreover, by signing the request form, you have agreed to <span class=\"reading-blank\">〔146〕</span> send us a copy. We expect to receive it within three business days of publication.</p>\n<p>Sincerely,</p>\n<p>Jane Rahman\nPublic Relations Officer\nLondon Modern Art Gallery</p>\n</div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>☷ FORM</span><small>147-148 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>Shiner Electronics</strong>\n<strong>Service Request Form</strong></h2>\n<p>Date of request: August 24\nTime of request: 1:20 P.M.\nRequested by: Anita Ellis\nLocation: Office 702</p>\n<p>Description of problem:</p>\n<p>The air conditioner in our marketing research office is leaking again. Normally, this would not be an urgent matter, but it is happening for the second time this month. We would appreciate a response in the next 24 hours, particularly since the weather has been especially warm these past few weeks.</p>\n<p>Priority:\nX High: Immediate attention required\nMedium: Complete within two to three days\nLow: Complete within one week</p>\n</div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>✦ ADVERTISEMENT</span><small>149-150 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>Magnificent One-Bedroom Apartment</strong></h2>\n<p>The last remaining one-bedroom apartment at Cerulean Tower is available for rent. Located on the 28th floor, it has a wide view of downtown Saint Paul below and the Mississippi River beyond. An elegant entrance area leads to spacious living and dining spaces. The kitchen is equipped with sleek appliances, the bedroom has large windows, and the bathroom has a contemporary-style bathtub. The property comes with a sofa, coffee table, bed, nightstands, and plenty of storage space. Cerulean Tower is a modern, full-service luxury building with a theater and fitness center. Rental parking is available in a private garage nearby. Call 555-5784 to arrange a viewing.</p>\n</div></section></div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 151-152</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>▤ MESSAGES</span><small>151-152 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Eric Daniels</strong><time class=\"chat-time\">10:12 A.M.</time></div><div class=\"message-text\">Hey, are you in the apartment? I need to get in. I left my keys inside.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Sarah Woolf</strong><time class=\"chat-time\">10:13 A.M.</time></div><div class=\"message-text\">Sorry, I just started working my shift. Can you wait until my lunch break?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Eric Daniels</strong><time class=\"chat-time\">10:16 A.M.</time></div><div class=\"message-text\">No. I need supplies for my class. It starts in an hour. I don't want to call a locksmith to unlock the door.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Sarah Woolf</strong><time class=\"chat-time\">10:17 A.M.</time></div><div class=\"message-text\">Don't worry about it. Just call the office downstairs. The building manager keeps a set of keys.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Eric Daniels</strong><time class=\"chat-time\">10:20 A.M.</time></div><div class=\"message-text\">Right. I didn't think of that. I'll call now.</div></div></div></div></section></div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 153-154</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▤ NOTICE</span><small>153-154 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>Notice: for all members</strong></h2>\n<p>We are sorry to report to Waltrop Leisure Center members that our pool closure will be extended. We have discovered a lot of damaged tiles and have decided to retile the entire pool.</p>\n<p>We understand that this closure is disruptive and are working hard to resolve the problem. Currently, the estimated date of completion for the repairs is July 16. In the meantime, the community of Eving has generously offered the free use of its swimming pool to our members. Members who have paid for swimming lessons in advance can obtain reimbursement or credit their payments toward future lessons.</p>\n<p>While our pool is being retiled, our gym, basketball court, and dance studio will remain open. As always, these facilities can be accessed from 7 A.M. to 9 P.M. every day of the week. We will post updates about the pool repairs on our Web site. Thank you.</p>\n</div></section></div>","155-158":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 155-158</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>▤ MESSAGES</span><small>155-158 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Tanya Huang</strong><time class=\"chat-time\">10:05 A.M.</time></div><div class=\"message-text\">Good afternoon, Mr. Benedict. I'm a member of the Analyte support team. I understand you sent a request for assistance yesterday regarding our accounting software.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Rick Benedict</strong><time class=\"chat-time\">10:06 A.M.</time></div><div class=\"message-text\">That's correct. I can't figure out how to transfer some data in an Analyte file to Upcell.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Tanya Huang</strong><time class=\"chat-time\">10:07 A.M.</time></div><div class=\"message-text\">I see. That's one of our competitors' programs, but it's compatible with Analyte software. You need to click on \"File,\" choose \"Export,\" and select \"Upcell\" from the list.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Rick Benedict</strong><time class=\"chat-time\">10:07 A.M.</time></div><div class=\"message-text\">That's the thing. I tried that but it didn't work.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Tanya Huang</strong><time class=\"chat-time\">10:08 A.M.</time></div><div class=\"message-text\">Oh, I'm sorry. Please give me a moment.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Tanya Huang</strong><time class=\"chat-time\">10:10 A.M.</time></div><div class=\"message-text\">Mr. Benedict, do you use our $15 a month plan by any chance? Because exporting to other programs, including Upcell, is only possible with plans of $35 and above.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Rick Benedict</strong><time class=\"chat-time\">10:12 A.M.</time></div><div class=\"message-text\">I see. Since I really need the access, is there any way you could upgrade me right now?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Tanya Huang</strong><time class=\"chat-time\">10:13 A.M.</time></div><div class=\"message-text\">Absolutely. I can connect you to our billing department, but you'll need to have your credit card ready.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Rick Benedict</strong><time class=\"chat-time\">10:14 A.M.</time></div><div class=\"message-text\">That's fine. Let's go ahead and do that.</div></div></div></div></section></div>","159-161":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 159-161</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>159-161 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-meta\">To: Alicia Carpenter alicia@epost.net\nFrom: Bobby McCord b.mccord@brancafitness.com\nSubject: Branca Fitness\nDate: January 4</div>\n<p>Dear Ms. Carpenter,</p>\n<p>Thank you for agreeing to participate in Branca Fitness's focus group on exercise equipment. Your session is scheduled for January 15, from 5 P.M. to 8 P.M. [1] The focus group will take place at our head office at 189 Bellflower Road in Seattle.</p>\n<p>Upon your arrival in the office, you will be asked to sign a confidentiality agreement. Since the products being tested have not yet been released to the public, please don't share any information about them with anyone.</p>\n<p>For the first activity, you will be asked to test some exercise equipment. Please make sure to wear comfortable clothing or bring an extra set of clothes. [2] This activity will be followed by a group discussion. During the discussion, you will be presented with different marketing ideas. When asked for your opinion on these ideas, please give honest and detailed answers. [3]</p>\n<p>As mentioned in the notice, a payment of $150 will be provided to each participant via bank transfer. [4] If you have any questions, feel free to contact me at any time.</p>\n<p>Sincerely,</p>\n<p>Bobby McCord</p>\n</div></section></div>","162-164":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 162-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-web\"><div class=\"doc-ribbon\"><span>◈ WEB PAGE</span><small>162-164 · 1/1</small></div><div class=\"document-body\"><p>Maksma was founded 15 years ago in Estonia, with the goal of making it easier for people to shop online. When its original office opened, it had just 46 staff members. Since then, Maksma has become one of Europe's largest payment gateways, facilitating online purchases for over 60 million consumers and 70,000 merchants in 22 countries. Maksma differentiates itself by giving customers the option to pay now, later, or in partial amounts over a specified period of time. Whichever option customers choose, they are guaranteed a secure, convenient experience. Merchants also benefit by being able to offer a wider range of payment options.</p>\n<p>Maksma is headquartered in Tallinn, with satellite offices in London and New York City. Its more than 1,500 employees are led by an international team of executives. It is valued at over $2.5 billion and handles roughly $10 billion in online sales per year.</p>\n</div></section></div>","165-168":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 165-168</span></div><div class=\"reading-stack\"><section class=\"document-card type-brochure\"><div class=\"doc-ribbon\"><span>▣ BROCHURE</span><small>165-168 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>FILLYAN MASTER</strong>\n<strong>CORPORATE SOLUTIONS INC.'S NEWEST PRODUCT</strong></h2>\n<p>In today's hypercompetitive world, companies must utilize every advantage available to them. Fillyan Master is a program that allows you to control the electronic equipment in your business environment using a mobile device. — [1] —</p>\n<p>It enables you to use a phone or tablet to monitor and manage audiovisual equipment, lighting, room temperature, and more. — [2] —. Program your electronic window shades in order to maximize their cooling potential at various times of the day.</p>\n<p>Moreover, you can collaborate with others by accessing voice and video channels from anywhere that has wireless Internet. Several participants can simultaneously view and collaborate on a presentation using a laptop or smart device. — [3] —</p>\n<p>Fillyan Master also enables you to collect data about room and energy usage. Use this information to guide budget decisions, save your company time and money, and maximize your resources. — [4] —</p>\n<p>Visit <a href=\"https://www.fillyan.com/\">www.fillyan.com</a> for more information about this and other products, or call our hotline at 555-5205 to schedule a demonstration.</p>\n</div></section></div>","169-171":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 169-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>169-171 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>Lynn Foster's Writing Career</strong></h2>\n<p>Lynn Foster is a fantasy novelist living and working in Portland, Oregon. Best known for The Last Rancher, she has been actively writing since she was 18 years old. Originally from Louisiana, she moved at the age of 11 to Butte, Montana. From its vast, open landscapes she would later <strong>draw</strong> inspiration for her writing.</p>\n<p>Ms. Foster began her career by contributing short stories to magazines across the country. Her short story Bear in the Creek won an award from the Montana Arts Council. Two years later, she published her first novel, Meadowlark. It was succeeded by a four-volume tale, The Darkening Brow, which was made into an animated movie. Her current work in progress, tentatively titled There and Back, is set in the town of her birth.</p>\n<p>Ms. Foster's books have been translated into over 20 languages.</p>\n</div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>172-175 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-meta\">To: Customer Service customerservice@swissluxair.ch\nFrom: Thomas Holmes thomas@holmessolutions.ch\nDate: August 5\nSubject: Booking Number 49994FGX</div>\n<p>To Whom It May Concern,</p>\n<p>I am writing to you about the experience I had while travelling with SwissLux Airlines. I am referring specifically to Flight 293 from Zurich to Singapore, which departed August 3 at 11 A.M.</p>\n<p>From the start, I noticed that the boarding process seemed unorganized. I had bought a seat upgrade online prior to checking in. However, I was told that the flight was overbooked, and I would have to move to a seat in
