="drillRestart">重新練習全部錯題</button><button type="button" id="drillRemove">手動移除此題</button></div><p class="small">錯題不會因答對而消失；作答後立即顯示正解與詳細解析。此模式完全不修改正式測驗的作答紀錄。</p></section><section id="wrongOverview" class="panel" hidden></section><section id="excerptOverview" class="panel" hidden></section><section id="quiz"></section><button type="button" id="selectionSave" aria-label="儲存選取的文字摘錄">✎ 儲存摘錄</button><div class="nav"><button id="prev">← 上一題</button><button id="next">下一題 →</button></div><section class="panel"><div class="head"><b>題號總覽</b><span class="small">綠色答對・紅色答錯・★ 已標記</span></div><div id="numbers" class="numbers"></div></section></main><script>
const DATA={"questions":[{"id":101,"part":5,"stem":"It is wise to prepare ______ for retirement by investing in a pension plan.","choices":["whose","whichever","theirs","oneself"],"answer":"D","explanation":"正確答案：(D) oneself。 因為要表達「自己為退休做好準備」，所以反身代名詞 (D) oneself 是正確答案。所有格關係代名詞 (A) whose（……的）修飾名詞，所以後面應該接被修飾的名詞才對。(B) whichever 表示「（某個群體或提過的一些對象中的）不論哪個」，而這個句子並沒有提到某個群體或一些對象，所以不對。所有代名詞 (C) theirs（他們的東西）意思不對。"},{"id":102,"part":5,"stem":"No applicant for a position at Carver Financial will ______without three years of related experience.","choices":["have considered","be considered","being considered","consider"],"answer":"B","explanation":"正確答案：(B) be considered。 助動詞（will）後面要接動詞原形，所以有 have 原形的 (A)、be 原形的 (B)、動詞原形 (D) 是可能的答案。consider 是及物動詞「考慮」，而空格後面不接受詞，再加上句意是「沒有 3 年相關經驗的應徵者不會被考慮」，所以被動態 (B) be considered 是正確答案，而主動態 (A) 和 (D) 不對。(C) 的現在分詞不能接在 will 後面，所以不對。"},{"id":103,"part":5,"stem":"Passengers of the LT Airlines flight to Barcelona were asked to ______in a designated area.","choices":["wait","carry","reserve","accept"],"answer":"A","explanation":"正確答案：(A) wait。 句意是「航班的乘客被要求在指定區域等待」，所以動詞 (A) wait（等待）是正確答案。(B) carry 表示「攜帶」。(C) reserve 表示「預約」。(D) accept 表示「接受」。"},{"id":104,"part":5,"stem":"Organizing a new product launch requires ______among departments.","choices":["cooperate","cooperation","to cooperate","cooperative"],"answer":"B","explanation":"正確答案：(B) cooperation。 及物動詞（requires）受詞位置應該使用名詞，所以名詞 (B) cooperation（合作）是正確答案。動詞 (A) 和形容詞 (D) 不能用在名詞位置。就算想把 to 不定詞 (C) 當成動詞 requires 的受詞也不行，因為 require 後面要接 to 不定詞的話，句型是「require + 受詞 + to」，或者用 be required to do（被要求做……）的句型才行。(D) 就算當成名詞「合作企業」來看，用法也不對，因為它是可數名詞，必須搭配冠詞，或者以複數形式使用。"},{"id":105,"part":5,"stem":"The foundation's usual charitable activities were ______suspended while it focused on assisting victims of the hurricane.","choices":["evenly","temporarily","relatively","morally"],"answer":"B","explanation":"正確答案：(B) temporarily。 句意是「平常的慈善活動被暫時中斷了」，所以 (B) temporarily（暫時）是正確答案。(A) evenly 表示「平均地」，(C) relatively 表示「相對地」，(D) morally 表示「道德上」。"},{"id":106,"part":5,"stem":"Median Bank follows strict guidelines for the ______of its customers' private information.","choices":["profit","advice","connection","protection"],"answer":"D","explanation":"正確答案：(D) protection。 句意是「為了保護顧客的私人資訊，Median 銀行遵守嚴格的方針」，所以名詞 (D) protection（保護）是正確答案。(A) profit 表示「收益」，(B) advice 表示「建議」，(C) connection 表示「連接」。"},{"id":107,"part":5,"stem":"______16 companies, the City of Orlando chose Flaremont Construction to build the new sports stadium.","choices":["Out of","In front of","Nearby","Through"],"answer":"A","explanation":"正確答案：(A) Out of。 因為要表達「在 16 家公司中，奧蘭多市選了 Flaremont 建設公司來建造新的體育場」，所以介系詞 (A) Out of（在……之中）是正確答案。(B) In front of 表示「在……前面」，(C) Nearby 表示「在附近」，(D) Through 表示「通過……，透過……」。"},{"id":108,"part":5,"stem":"The weather forecast for December 14 calls for a cold wave, so people should dress ______.","choices":["accordingly","eagerly","invitingly","ultimately"],"answer":"A","explanation":"正確答案：(A) accordingly。 因為要表達「天氣預報預測會有寒流，所以人們應該依照預報穿衣服」，所以副詞 (A) accordingly（照著，相應地）是正確答案。(B) eagerly 表示「渴望地，熱切地」，(C) invitingly 表示「誘人地」，(D) ultimately 表示「最終地」。"},{"id":109,"part":5,"stem":"A trade show representative called each participant a month before the event ______their attendance.","choices":["confirm","to confirm","will confirm","is confirming"],"answer":"B","explanation":"正確答案：(B) to confirm。 這個句子已經有具備主詞（A trade show representative）、動詞（called）和受詞（each participant）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - their attendance 是修飾性的語句，能表達目的「為了確認出席」的 to 不定詞 (B) to confirm 是正確答案。動詞 (A)、(C)、(D) 不能引導修飾性語句，就算把 before 當成副詞子句連接詞、把空格當成主詞（the event）的動詞，意思也會變成「活動確認／將會確認／正在確認參加」（「活動」這件事進行確認的行為），所以不對。"},{"id":110,"part":5,"stem":"According to a recent report, Keller Auto is one of the ______manufacturers of car tires in Australia.","choices":["led","leaders","leading","leads"],"answer":"C","explanation":"正確答案：(C) leading。 能修飾空格後面名詞（manufacturers）的是形容詞，所以有形容詞功能的過去分詞 (A) 和形容詞 (C) 是可能的答案。因為要表達「澳洲領先的汽車輪胎製造業者之一」，所以形容詞 (C) leading（領先的）是正確答案。動詞 lead（領導）的過去分詞 (A) 會讓意思變成「澳洲被領導的汽車輪胎製造業者之一」，所以不對。如果使用名詞 (B) 而形成 leaders manufacturers，也不能看成複合名詞，因為複合名詞的複數是在後面的名詞加上 -s。動詞 (D) 不能用在形容詞位置。"},{"id":111,"part":5,"stem":"The art historian did copious research while trying to ______the painting as an original.","choices":["adapt","generate","authenticate","commission"],"answer":"C","explanation":"正確答案：(C) authenticate。 句意是「藝術史學家在試圖證明畫是原作的過程中，做了大量的研究」，所以動詞 (C) authenticate（證明〔藝術品等〕為真品）是正確答案。(A) adapt 表示「使適應，改編」，(B) generate 表示「產生」，(D) commission 表示「委任，委託」。"},{"id":112,"part":5,"stem":"By lowering the price of its streaming service, Jolio Inc. aims to reach customers ______its existing market.","choices":["beyond","aboard","after","between"],"answer":"A","explanation":"正確答案：(A) beyond。 因為要表達「Jolio 公司的目標是觸及超越現有市場的顧客」，所以介系詞 (A) beyond（超越……）是正確答案。(B) aboard 表示位置「在（船、飛機等）上」，(C) after 表示時間點「在……之後」。(D) between 通常以 between A and B（在 A 和 B 之間）的形式使用，表示時間或兩個對象之間的關係、位置「在……之間」。"},{"id":113,"part":5,"stem":"Gymnast Anna Stamos will replace the ______brand ambassador of Knobel breakfast cereal.","choices":["gradual","extreme","current","entire"],"answer":"C","explanation":"正確答案：(C) current。 句意是「體操選手 Anna Stamos 將取代目前的 Knobel 早餐麥片品牌大使」，所以形容詞 (C) current（目前的）是正確答案。(A) gradual 表示「逐漸的」，(B) extreme 表示「極度的」，(D) entire 表示「整體的」。"},{"id":114,"part":5,"stem":"Thanks to hours of practice, the sales team was able to present its proposal to the client ______.","choices":["confide","confident","confiding","confidently"],"answer":"D","explanation":"正確答案：(D) confidently。 副詞可以修飾空格後面 to 不定詞中的動詞原形（present），所以副詞 (D) confidently（自信地）是正確答案。動詞 (A)、形容詞 (B)、動名詞或現在分詞 (C) 都不能修飾動詞。就算想把 present 當成名詞「禮物」，而在前面使用 (A) 構成 to 不定詞，文法上還是錯誤的，因為 present 是可數名詞，必須搭配冠詞或以複數形使用。"},{"id":115,"part":5,"stem":"Shipping within the United States is free for Buyer's Club members, but international shipping will require paying an ______fee.","choices":["opportune","intentional","additional","exchangeable"],"answer":"C","explanation":"正確答案：(C) additional。 句意是「對於 Buyer's 俱樂部會員，美國國內運送免費，但國際運送需要支付額外費用」，所以形容詞 (C) additional（額外的）是正確答案。(A) opportune 表示「時機合適的」，(B) intentional 表示「有意的，故意的」，(D) exchangeable 表示「可交換的」。"},{"id":116,"part":5,"stem":"Charging machines for electric cars will be installed in gas stations ______the country.","choices":["across","opposite","toward","onto"],"answer":"A","explanation":"正確答案：(A) across。 因為要表達「電動車充電機將被安裝在全國的加油站」，所以表示方向的 (A) across（遍及……，跨越……）是正確答案。(B) opposite 表示位置「在……對面」，(C) toward 表示方向「往……」，(D) onto 表示方向「往……上面」。"},{"id":117,"part":5,"stem":"The escalators at Davidson Station are subject to ______inspection to ensure they are working properly.","choices":["routinely","routine","routines","routinize"],"answer":"B","explanation":"正確答案：(B) routine。 空格修飾後面的名詞（inspection），所以形容詞 (B) routine（定期的）是正確答案。副詞 (A)、名詞 (C)、動詞 (D) 不能修飾名詞。就算想用名詞 (C) 構成複合名詞，routines inspection 也不符合文法，因為複合名詞的複數是在後面的名詞加上 -s。"},{"id":118,"part":5,"stem":"______resident of West Bay who earns less than $25,000 a year is eligible to apply for housing assistance.","choices":["Most","Those","Any","All"],"answer":"C","explanation":"正確答案：(C) Any。 能修飾空格後面單數可數名詞的不定形容詞 (C) Any（任何……）是正確答案。數量詞 (A) 和 (D) 後面要接複數可數名詞或不可數名詞，指示代名詞 (B) 是用在複數可數名詞前面。"},{"id":119,"part":5,"stem":"The advertisements for the new stove place an ______on its appearance and ease of use.","choices":["order","emphasis","investment","observation"],"answer":"B","explanation":"正確答案：(B) emphasis。 句意是「新爐具的廣告著重於它的外觀與容易使用」，所以能和空格前面的動詞（place）、後面的介系詞（on）構成 place an emphasis on，表示「強調……」的 (B) emphasis（強調）是正確答案。(A) order 表示「順序，命令」，(C) investment 表示「投資」，(D) observation 表示「觀察」。"},{"id":120,"part":5,"stem":"The ______partnership between Farroo and Slansea, Inc. will benefit the firms by making them more competitive.","choices":["strategy","strategize","strategic","strategically"],"answer":"C","explanation":"正確答案：(C) strategic。 空格修飾後面的名詞（partnership），所以形容詞 (C) strategic（策略的）是正確答案。名詞 (A)、動詞 (B)、副詞 (D) 不能修飾名詞。"},{"id":121,"part":5,"stem":"The Mill Creek Community Center started a cleanup ______to get rid of litter around town.","choices":["status","initiative","declaration","compliance"],"answer":"B","explanation":"正確答案：(B) initiative。 句意是「社區中心開始了清除城鎮周遭垃圾的清掃新措施」，所以名詞 (B) initiative（新措施）是正確答案。(A) status 表示「地位，身分」，(C) declaration 表示「宣布」，(D) compliance 表示「遵守」。"},{"id":122,"part":5,"stem":"Due to ______economic conditions, the company may decide to stop hiring employees.","choices":["worst","worsen","worsens","worsening"],"answer":"D","explanation":"正確答案：(D) worsening。 空格要填入修飾後面名詞（economic conditions）的形容詞，所以形容詞最高級 (A)、有形容詞功能的現在分詞 (D) 是可能的答案。因為要表達「由於惡化中的經濟狀況，這家公司可能會決定停止雇用員工」，所以動詞 worsen（惡化）的現在分詞 (D) worsening 是正確答案。形容詞最高級 (A) worst（最差的）雖然意思也說得通，但「最高級 + 名詞」前面應該加 the，而且句中並沒有提到其他比較對象，所以不對。動詞 (B) 和 (C) 不能修飾名詞。"},{"id":123,"part":5,"stem":"The valet attendant at the Six Stars Hotel was unsure ______car belonged to Mr. Carlton.","choices":["whom","as","both","which"],"answer":"D","explanation":"正確答案：(D) which。 動詞部分（was unsure）後面接名詞子句（~ car ~ Mr. Carlton）當受詞，所以名詞子句連接詞 (A) 和 (D) 是可能的答案。因為空格後面有名詞（car），而且要表達「不確定哪輛車是 Carlton 先生的」，所以能和 car 結合成名詞子句主詞的疑問形容詞 (D) which 是正確答案。疑問代名詞 (A) whom 引導名詞子句時，擔任名詞子句中的受詞角色，但這裡的名詞子句裡已經有受詞了。(B) as 雖然可以當副詞子句連接詞，形成修飾主要子句的結構，但如果這樣的話，子句中的可數名詞 car 應該加上冠詞或使用複數形。數量詞 (C) both（兩個都）不能引導名詞子句。"},{"id":124,"part":5,"stem":"Mr. Grady is training the new staff members on how to handle ______clients in a calm manner.","choices":["demanding","measured","suitable","sparse"],"answer":"A","explanation":"正確答案：(A) demanding。 句意是「Grady 先生正在訓練新進員工如何冷靜地處理要求很多的客人」，所以形容詞 (A) demanding（要求很多的）是正確答案。(B) measured 表示「慎重的」，(C) suitable 表示「適合的」，(D) sparse 表示「（分布）稀疏的」。"},{"id":125,"part":5,"stem":"Joseph Baker will accept the promotion ______he gets the 20 percent raise he asked for.","choices":["only if","furthermore","other than","apart from"],"answer":"A","explanation":"正確答案：(A) only if。 這個句子已經有具備主詞（Joseph Baker）、動詞（will accept）、受詞（the promotion）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - ~ asked for 是修飾性的語句。修飾部分有動詞（gets），所以能引導修飾子句的副詞子句連接詞 (A) only if（只有在……的情況下）是正確答案。連接副詞 (B) furthermore（而且，再者……）不能引導修飾子句。介系詞 (C) other than（……以外）和 (D) apart from（除了……）會形成修飾片語，而不是引導修飾子句。"},{"id":126,"part":5,"stem":"Each year, every employee at Corehouse Technics undergoes a performance ______.","choices":["evaluator","evaluating","to evaluate","evaluation"],"answer":"D","explanation":"正確答案：(D) evaluation。 空格在名詞後面，所以能形成複合名詞（名詞 + 名詞）的名詞 (A) 和 (D)、可以在名詞後面做修飾的現在分詞 (B) 和 to 不定詞 (C) 都是可能的答案。因為句意是「每位員工都會接受表現評價」，所以能和空格前面的名詞 performance（表現）構成複合名詞 performance evaluation（表現評價）的名詞 (D) evaluation（評價）是正確答案。名詞 (A) evaluator、現在分詞 (B)、to 不定詞 (C) 會讓意思變成「每位員工都會受到表現評價者／在評價的表現／要評價的表現」，所以不對。"},{"id":127,"part":5,"stem":"To minimize transportation costs, the company moved to an office ______the port.","choices":["per","regarding","near","plus"],"answer":"C","explanation":"正確答案：(C) near。 因為要表達「為了將運輸費用減到最少，這家公司搬遷到了離港口近的辦公室」，所以介系詞 (C) near（接近……）是正確答案。(A) per 表示「每……」，(B) regarding 表示「關於……」，(D) plus 表示「加上……」。"},{"id":128,"part":5,"stem":"Rob Marshall's Smart Investor's Guide offers a lot of ______insights for understanding the stock market.","choices":["helped","helpful","helpfully","help"],"answer":"B","explanation":"正確答案：(B) helpful。 空格修飾後面的名詞（insights），所以有形容詞功能的過去分詞 (A) 以及形容詞 (B) 是可能的答案。因為要表達「提供許多有幫助的洞見」，所以形容詞 (B) helpful（有幫助的）是正確答案。如果使用過去分詞 (A) helped（受到幫助的），意思會變成「提供許多受到幫助的洞見」，所以不對。副詞 (C) 和動詞 (D) 不能修飾名詞。"},{"id":129,"part":5,"stem":"Attendees of the conference in October will receive more detailed information about the speakers ______.","choices":["alongside","either","further","beforehand"],"answer":"D","explanation":"正確答案：(D) beforehand。 因為要表達「會預先收到關於講者更詳細的資訊」，所以表示時間的副詞 (D) beforehand（預先）是正確答案。(A) alongside 表示「在旁」，(B) either 表示「也（不）」，(C) further 表示「進一步」。"},{"id":130,"part":5,"stem":"The storage facility uses a system that is capable of ______small changes in indoor air temperature.","choices":["acting","sensing","cooling","experimenting"],"answer":"B","explanation":"正確答案：(B) sensing。 句意是「這座倉儲設施使用能感知室內氣溫微小變化的系統」，所以動詞 sense（感知）的 -ing 形 (B) sensing 是正確答案。(A) act 表示「行動」，(C) cool 表示「冷卻」，(D) experiment 表示「實驗」。"},{"id":131,"part":6,"stem":"Select the best option for blank 131 in the passage.","choices":["why","but","than","or"],"answer":"B","explanation":"正確答案：(B) but。 句意是「安全帽不僅時尚，也能保護您的安全」，所以能和 Not only 構成相關連接詞 not only A but (also) B（不僅 A 而且 B）的 (B) but 是正確答案。疑問副詞 (A)、連接詞 (C) 和 (D) 不能搭配 Not only 使用。","group":"131-134"},{"id":132,"part":6,"stem":"Select the best option for blank 132 in the passage.","choices":["speed","assistance","durability","convenience"],"answer":"D","explanation":"正確答案：(D) convenience。 句意是「也為一般騎士帶來＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到可以收摺成小巧的尺寸以便收納，由此可知這些安全帽會為一般騎士帶來便利，名詞 (D) convenience（便利）是正確答案。(A) speed 表示「速度」，(B) assistance 表示「協助」，(C) durability 表示「耐用」。","group":"131-134"},{"id":133,"part":6,"stem":"Select the best option for blank 133 in the passage.","choices":["For example","Conversely","If so","Otherwise"],"answer":"A","explanation":"正確答案：(A) For example。 空格伴隨逗號一起出現在句首，是連接副詞的位置，所以要掌握空格所在的句子和上一句的關係來判斷答案。上一句提到為一般騎士帶來便利，而空格所在的句子說可以收摺成小巧的尺寸以便收納，所以針對上一句舉出例子時使用的 (A) For example（舉例來說）是正確答案。(B) Conversely 表示「相反地」，(C) If so 表示「如果是這樣的話」，(D) Otherwise 表示「否則」，用在這裡都不恰當。","group":"131-134"},{"id":134,"part":6,"stem":"Select the best option for blank 134 in the passage.","choices":["Don't forget to sign up for the safety workshop.","Get one now and take advantage of a special promotion.","Find the widest variety of brands by shopping online.","Our repair shop is located right across from the mall."],"answer":"B","explanation":"正確答案：(B) Get one now and take advantage of a special promotion.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 There is simply no excuse not to try a Bango helmet today. 提到，沒有藉口不在今天就試 Bango 安全帽，而下一句 If you buy one at full price, you will receive a second helmet at 50 percent off. 則說，如果以定價購買，將可以用折扣 50% 的價格購買第二頂安全帽，所以空格的內容應該和購買安全帽的優惠有關，(B) Get one now and take advantage of a special promotion 是正確答案。","group":"131-134"},{"id":135,"part":6,"stem":"Select the best option for blank 135 in the passage.","choices":["enrolls","enrollment","enroll","enrolled"],"answer":"B","explanation":"正確答案：(B) enrollment。 空格被前面的所有格人稱代名詞（your）修飾，所以名詞 (B) enrollment（報名）是正確答案。動詞 (A)、(C)、(D) 不能用在名詞的位置。","group":"135-138"},{"id":136,"part":6,"stem":"Select the best option for blank 136 in the passage.","choices":["The system needs to be checked for errors immediately.","The discount will be available for a limited time only.","The first invoice will be sent by e-mail on July 1.","Please check in at the reception desk for your student ID."],"answer":"C","explanation":"正確答案：(C) The first invoice will be sent by e-mail on July 1.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Since you have signed up to pay in installments, you will be charged on a monthly basis. 提到，由於對方以分期付款的方式報名，將會每月被收取費用，所以空格的內容應該和分期付款有關，(C) The first invoice will be sent by e-mail on July 1 是正確答案。","group":"135-138"},{"id":137,"part":6,"stem":"Select the best option for blank 137 in the passage.","choices":["modify","begin","approve","request"],"answer":"A","explanation":"正確答案：(A) modify。 句意是「可以隨時自由＿＿付款方案」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，要進行修改，只要登入帳戶並選擇「變更方案」，之後也提到最長的方案是 18 個月，由此可知可以隨時修改付款方案，答案是動詞 (A) modify（修改）。(B) begin 表示「開始」，(C) approve 表示「批准」，(D) request 表示「要求」。","group":"135-138"},{"id":138,"part":6,"stem":"Select the best option for blank 138 in the passage.","choices":["options","difficulties","symptoms","referrals"],"answer":"B","explanation":"正確答案：(B) difficulties。 句意是「如果有任何＿＿，就立刻寄電子郵件」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句說隨時樂意幫忙，由此可知寄件者是希望對方在遇到困難的時候，立刻寄電子郵件聯絡，所以名詞 (B) difficulties（困難）是正確答案。(A) option 表示「選項」，(C) symptom 表示「症狀」，(D) referral 表示「轉介，轉診」。","group":"135-138"},{"id":139,"part":6,"stem":"Select the best option for blank 139 in the passage.","choices":["known","asked","enabled","instructed"],"answer":"C","explanation":"正確答案：(C) enabled。 句意是「這些＿＿組織為數百隻動物提供食物與住處」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到，Lake 郡動物協會感謝大家過去幾年的貢獻，所以可以和空格後面的 to 構成 enable A to do（使 A 能夠做……）的動詞 enable（使……能夠）p.p. 形 (C) enabled 是正確答案。(A) know 表示「知道」，(B) ask 表示「要求」，(D) instruct 表示「指示」。","group":"139-142"},{"id":140,"part":6,"stem":"Select the best option for blank 140 in the passage.","choices":["Our largest donation of the evening was $1,500.","Members receive a newsletter every month.","They will be moved to a larger facility to better accommodate them.","The attendees will be treated to dinner and live entertainment."],"answer":"D","explanation":"正確答案：(D) The attendees will be treated to dinner and live entertainment.。 ** 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。前面的內容邀請參加 12 月 11 日在 Morrissey Civic 中心的募款大會，而上一句 It will be a night of fun for a good cause. 說這將會是個有良善目標、好玩的夜晚，下一句 Admission tickets will be available for only $100 each. 說入場券每張只要 100 元就能購買，所以空格的內容應該和即將舉辦的募款活動有關，(D) The attendees will be treated to dinner and live entertainment 是正確答案。","group":"139-142"},{"id":141,"part":6,"stem":"Select the best option for blank 141 in the passage.","choices":["chiefly","sometimes","exclusively","seldom"],"answer":"A","explanation":"正確答案：(A) chiefly。 句意是「活動收入將用於修繕本團體在 Willoughby 的設施，因為建築物的屋頂需要替換」，(A) 和 (C) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，一部分收入也將用於擴大計畫，所以空格所在的句子應該是表達活動收入「主要」用於修繕設施，剩下的才用於擴大計畫，副詞 (A) chiefly（主要）是正確答案。(B) sometimes 表示「有時候」，(C) exclusively 表示「獨占地」，(D) seldom 表示「很少，幾乎不」。","group":"139-142"},{"id":142,"part":6,"stem":"Select the best option for blank 142 in the passage.","choices":["encourage","encouraged","that encourage","it can encourage"],"answer":"C","explanation":"正確答案：(C) that encourage。 這個句子已經有具備主詞（a portion）、動詞（will ~ go to）和受詞（expanding programs）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - ~ shelters 是修飾性的語句。修飾部分是修飾空格前面的名詞（programs），所以包含可修飾名詞的主格關係代名詞與關係子句動詞的 (C) that encourage 是正確答案。動詞 (A) 和 (B) 不能引導修飾性的語句。「it + 動詞」(D) 會形成另一個子句，但無法在不加連接詞的情況下和前面的子句連接在一起，所以不對。","group":"139-142"},{"id":143,"part":6,"stem":"Select the best option for blank 143 in the passage.","choices":["Effect","Effects","Effectively","Effective"],"answer":"D","explanation":"正確答案：(D) Effective。 句意是「從 4 月 8 日開始，室內游泳池將關閉一週」，所以後面能接日期，構成慣用表達方式「effective + 日期」（從……開始生效）的形容詞 (D) Effective（有效的，生效的）是正確答案。名詞 (A) 和 (B)、副詞 (C) 無法和後面的日期形成正確的表達方式。","group":"143-146"},{"id":144,"part":6,"stem":"Select the best option for blank 144 in the passage.","choices":["After all","Likewise","In the meantime","For this reason"],"answer":"C","explanation":"正確答案：(C) In the meantime。 空格是連同逗號一起出現在句首的連接副詞位置，所以需要掌握空格所在句子和前面內容的關係來選擇答案。上一句提到這是為每個人提供安全、衛生的環境而必須進行的年度程序，而空格所在的句子則說其他室內設施可以繼續使用，所以表達和上一句同時發生其他情況的連接副詞 (C) In the meantime（同時）是正確答案。(A) After all 表示「畢竟」，(B) Likewise 表示「同樣地」，(D) For this reason 表示「因為這個原因」，用在這裡都不恰當。","group":"143-146"},{"id":145,"part":6,"stem":"Select the best option for blank 145 in the passage.","choices":["Mine","Our","Theirs","These"],"answer":"D","explanation":"正確答案：(D) These。 句意是「包括三溫暖、健身房與養生會館」，而且空格後面接動詞（include），所以所有代名詞 (A) 和 (C)、指示代名詞 (D) 是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。上一句提到其他室內設施可以繼續使用，所以能指稱其他室內設施的複數指示代名詞 (D) These 是正確答案。所有代名詞 (A) Mine 是指「我的東西」，無法指稱 other indoor facilities，而所有代名詞 (C) Theirs 是指「他們的東西」，意思會變成「他們的東西包括三溫暖、健身房與養生會館」，不符合文意。(B) Our 是第一人稱所有格人稱代名詞，不能獨自當主詞使用。","group":"143-146"},{"id":146,"part":6,"stem":"Select the best option for blank 146 in the passage.","choices":["Normal operations will resume once it is done.","Our latest post received thousands of likes and views.","We are in the process of investigating the problem.","Please report missing items to our lost-and-found counter."],"answer":"A","explanation":"正確答案：(A) Normal operations will resume once it is done.。 這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 We apologize for any inconvenience the work might cause. 對於這項工作（室內游泳池關閉進行保養）可能造成的任何不便致歉，所以空格的內容應該和游泳池關閉有關，(A) Normal operations will resume once it is done 是正確答案。","group":"143-146"},{"id":147,"part":7,"stem":"How can people participate in a test?","choices":["By promoting a product line on the Internet","By completing a survey before a deadline","By submitting a letter of request","By attending an interview in person"],"answer":"B","explanation":"正確答案：(B) By completing a survey before a deadline。 這是問人們要怎麼（How）參加測試的 wh- 問題。和題目的關鍵詞語 participate in a test 有關的部分是 To sign up, go to www.betteskin.com. Answer a brief online survey before June 30，這部分提到報名方法是上 www.betteskin.com，在 6 月 30 日前回答簡短的線上問卷調查，所以 (B) 是正確答案。","group":"147-148"},{"id":148,"part":7,"stem":"What will participants receive?","choices":["A free meal","A membership card","An online voucher","An event invitation"],"answer":"C","explanation":"正確答案：(C) An online voucher。 這是問參加者會收到什麼（What）的 wh- 問題。和題目的關鍵詞語 participants receive 有關的部分是 participants will receive a $25 coupon for our Web site，這部分提到參加者將得到網站的 25 元優惠券，所以 (C) 是正確答案。","group":"147-148"},{"id":149,"part":7,"stem":"What problem is Charlotte Grocer having?","choices":["A food supplier went out of business.","A cash register system does not work.","A product cannot be acquired.","A store will have to close early."],"answer":"C","explanation":"正確答案：(C) A product cannot be acquired.。 這是問 Charlotte 食品雜貨店目前有什麼（What）問題的 wh- 問題。和題目的關鍵詞語 problem ~ Charlotte Grocer having 有關的部分是 The item is currently unavailable，這部分提到一項商品目前無法取得，所以 (C) 是正確答案。","group":"149-151"},{"id":150,"part":7,"stem":"What can be inferred about Charlotte Grocer?","choices":["It merged with a competitor.","It released its own brand of water.","It maintains locations worldwide.","It follows specific product standards."],"answer":"D","explanation":"正確答案：(D) It follows specific product standards.。 這是和題目關鍵詞語 Charlotte Grocer 有關的推論問題。As with all products sold in our stores, they are certified by organic certification agencies and meet all regulatory requirements for food safety. 的部分提到，前述的產品與店面販售的所有產品相同，一樣經過有機認證機構的認證，並且符合所有食品安全監管的要求。由此可以推知，這家業者遵守特定的產品標準，所以 (D) 是正確答案。","group":"149-151"},{"id":151,"part":7,"stem":"Why should customers register on a Web site?","choices":["To provide product feedback","To take part in a special event","To arrange home deliveries","To receive a newsletter by e-mail"],"answer":"D","explanation":"正確答案：(D) To receive a newsletter by e-mail。 這是問為什麼（Why）顧客應該在網站上註冊的 wh- 問題。和題目的關鍵詞語 customers register on a Web site 有關的部分是 register your e-mail address at www.charlottegrocer.com to receive our weekly newsletter，這部分請顧客在 www.charlottegrocer.com 註冊電子郵件位址，以獲得每週電子報，所以 (D) 是正確答案。","group":"149-151"},{"id":152,"part":7,"stem":"Why did Ms. Sanchez contact Mr. Yamamoto?","choices":["To invite him to a lunch meeting","To request a copy of a contract","To move an appointment","To schedule a visit to a house"],"answer":"C","explanation":"正確答案：(C) To move an appointment。 這一題問的是 Sanchez 小姐聯絡 Yamamoto 先生的原因，所以要注意文章開頭的部分。Sanchez 小姐說 could you please postpone my afternoon meeting?，問 Yamamoto 先生可不可以延後她下午的會議，所以 (C) 是正確答案。","group":"152-153"},{"id":153,"part":7,"stem":"At 12:27 P.M., what does Mr. Yamamoto most likely mean when he writes, \"Will do\"?","choices":["He will contact a client by phone.","He will follow up on a contract.","He accepts a proposed appointment.","He can take Ms. Sanchez's place at a meeting."],"answer":"A","explanation":"正確答案：(A) He will contact a client by phone.。 這一題問的是 Yamamoto 先生的訊息所表達的意圖，所以要掌握引用部分（Will do）前後文的情境。Christina Sanchez 說 Please call Mr. Zhou directly rather than e-mail him，要求打電話給客戶 Zhou 先生而不是寄電子郵件，對此 Yamamoto 先生回應 Will do.（我會的），並且說 I have his phone number in front of me.，表示面前有他的電話號碼，意味著他會打電話聯絡客戶，所以 (A) 是正確答案。","group":"152-153"},{"id":154,"part":7,"stem":"What is stated about Bauerhoff Farms' tomatoes?","choices":["They are not ready to be harvested.","Some of them need to be sold to new customers.","They are of a lower quality than last season's.","Some of them were rejected by regular clients."],"answer":"B","explanation":"正確答案：(B) Some of them need to be sold to new customers.。 這是 Not/True 題型，要找出和關鍵詞語 Bauerhoff Farms' tomatoes 有關的內容，並且對照選項判斷答案。(A) 和 (C) 在文章裡沒有提到。(B) 在 The quantities far exceed what our regular clients agreed to buy 的部分提到，數量（收穫的番茄數量）遠遠超過固定客戶同意購買的，之後 we need to figure out a way to sell the excess. Currently, I am drawing up a list of restaurants, hotels, and small grocers that might be able to take our surplus produce on short notice. 的部分又說需要想出賣掉多餘部分的方法，目前正在製作有可能在臨時通知的情況下接收多餘農作物的餐廳、飯店與小型食品雜貨店列表，符合選項敘述，所以 (B) 是正確答案。(D) 在 The quantities far exceed what our regular clients agreed to buy 的部分提到，收穫的番茄數量遠遠超過固定客戶同意購買的，不符合選項敘述。","group":"154-155"},{"id":155,"part":7,"stem":"What is Mr. Gunther asked to do?","choices":["Pass on instructions to employees","Contact some restaurant owners","Make arrangements with a charity","Increase sales at a local marketplace"],"answer":"D","explanation":"正確答案：(D) Increase sales at a local marketplace。 這是問 Gunther 先生被要求做什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Gunther asked to do 有關的部分是 I'd like you to sell more quantities than usual at our local farmer's market，這部分希望對方（Gunther 先生）在當地的農夫市集販賣比平常更多的量，所以 (D) 是正確答案。","group":"154-155"},{"id":156,"part":7,"stem":"What is the article mainly about?","choices":["A demand for better treatment of employees","A campaign to reduce the number of accidents","A city's effort to regulate certain types of companies","A plan to increase taxes on selected businesses"],"answer":"C","explanation":"正確答案：(C) A city's effort to regulate certain types of companies。 這一題問的是這篇文章的目的，所以要注意文章開頭的部分。Mumbai is taking steps to address issues with companies in the so-called sharing economy. 的部分提到，孟買正在採取措施，處理所謂共享經濟中的公司問題，所以 (C) 是正確答案。","group":"156-157"},{"id":157,"part":7,"stem":"What is suggested about CallAuto?","choices":["It has no competitors in an industry.","It has plans to leave the city of Mumbai.","It will have to give its drivers employment benefits.","It took steps to improve its service quality."],"answer":"C","explanation":"正確答案：(C) It will have to give its drivers employment benefits.。 這是和題目關鍵詞語 CallAuto 有關的推論問題。As for CallAuto, it will have to treat its drivers as regular employees and provide them with paid vacations and health insurance. 的部分提到，CallAuto 將必須以對正職員工的方式對待它的司機，並且提供他們有薪假與健康保險，由此可以推知，CallAuto 將必須提供雇用福利給司機，(C) 是正確答案。","group":"156-157"},{"id":158,"part":7,"stem":"What is NOT true about Peacelid?","choices":["It makes products for eating and drinking.","It supports other organizations.","It uses a natural material.","It operates a chain of stores."],"answer":"D","explanation":"正確答案：(D) It operates a chain of stores.。 這是 Not/True 題型，要找出和關鍵詞語 Peacelid 有關的內容，並且對照選項判斷答案。(A) 在 Peacelid is ~ selling reusable cups, straws, and utensils. 的部分提到，Peacelid 販賣可重複使用的杯子、吸管、用具，符合選項敘述。(B) 在 donates 3 percent of every purchase to organizations involved in preventing deforestation 的部分提到，將每次購買的 3% 捐給積極預防濫伐森林的組織，符合選項敘述。(C) 在 Our products are made from 100 percent bamboo. 的部分提到，產品由 100% 竹子製造，符合選項敘述。(D) 在文章裡沒有提到，所以 (D) 是正確答案。","group":"158-161"},{"id":159,"part":7,"stem":"What is an advantage of Peacelid's products?","choices":["Durability","Safe disposal","Affordable price","Wide availability"],"answer":"B","explanation":"正確答案：(B) Safe disposal。 這是問什麼（What）是 Peacelid 產品優點的 wh- 問題。和題目的關鍵詞語 an advantage of Peacelid's products 有關的部分是 they decompose safely and naturally after being discarded，這部分提到「它們」（Peacelid 的產品）在被丟棄後會安全且自然地分解，所以 (B) 是正確答案。","group":"158-161"},{"id":160,"part":7,"stem":"What is mentioned about the coupon code?","choices":["It can be used multiple times.","It only applies to some customers.","It must be requested by e-mail.","It expires after one month."],"answer":"B","explanation":"正確答案：(B) It only applies to some customers.。 這是 Not/True 題型，要找出和關鍵詞語 the coupon code 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章中沒有提到。(B) 在 New customers can enjoy a 20 percent discount on their first order by entering the code \"PEACE20\" 的部分提到，新顧客第一次訂購可以在結帳頁面輸入代碼「PEACE20」享受 20% 折扣，符合選項敘述，所以 (B) 是正確答案。","group":"158-161"},{"id":161,"part":7,"stem":"How can customers obtain a reusable straw?","choices":["By buying over $200 worth of goods","By donating to an environmental fund","By exchanging some plastic items","By volunteering for a cleanup effort"],"answer":"A","explanation":"正確答案：(A) By buying over $200 worth of goods。 這是問顧客可以怎樣（How）獲得可重複使用的吸管的 wh- 問題。和題目的關鍵詞語 customers obtain a reusable straw 有關的部分是 every order of $200 or more will include a free reusable straw，這部分提到每筆 200 元以上訂單將附送免費可重複使用吸管，所以 (A) 是正確答案。","group":"158-161"},{"id":162,"part":7,"stem":"What is mentioned about Gymspan?","choices":["It is removing a subscription plan.","It has cut ties with some affiliates.","It is offering points for new members.","It has merged with another firm."],"answer":"A","explanation":"正確答案：(A) It is removing a subscription plan.。 這是 Not/True 題型，要找出和關鍵詞語 Gymspan 有關的內容，並且對照選項判斷答案。(A) 在 users who have a subscription to the Gymspan app will no longer be able to take advantage of unlimited workouts at its network of affiliated fitness centers 的部分提到，訂閱了 Gymspan 應用程式的使用者將無法在它的合作健身中心網絡利用無限運動服務，符合選項敘述，所以 (A) 是正確答案。(B) 和 (D) 在文章中沒有提到。(C) 在 To make up for the change, Gymspan will award 500 loyalty points 的部分提到，為了彌補這個改變（不再提供無限運動方案），Gymspan 將贈送 500 點忠誠點數（給受影響的使用者），不符合選項敘述。","group":"162-164"},{"id":163,"part":7,"stem":"According to the announcement, what are customers able to do?","choices":["Sign up for a free trial membership","Rate fitness studios on an application","Adjust their plans on a monthly basis","Inquire about franchise opportunities"],"answer":"C","explanation":"正確答案：(C) Adjust their plans on a monthly basis。 這是問根據公告，顧客可以做什麼（What）的 wh- 問題。和題目的關鍵詞語 customers able to do 有關的部分是 Each month, customers have the option to easily switch from one plan to another.，表示顧客每個月都可以選擇輕鬆地轉換方案，所以 (C) 是正確答案。","group":"162-164"},{"id":164,"part":7,"stem":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Accounts can now be paused for up to two months in a year.\"","choices":["[1]","[2]","[3]","[4]"],"answer":"C","explanation":"正確答案：(C) [3]。 這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「帳戶現在每年最多可以暫停 2 個月」，[3] 的上一句 You can also temporarily stop payments when you are out of the country. 提到也可以在出國時暫時停止付款。將句子填入 [3] 的位置之後，可以表達「可以在出國時暫時停止付款，而帳戶現在每年最多可以暫停 2 個月」，文意通順，所以 (C) 是正確答案。","group":"162-164"},{"id":165,"part":7,"stem":"What is the primary purpose of the letter?","choices":["To inform Mr. Davidson about a scholarship","To give details about a new program","To recruit Mr. Davidson to a college","To request follow-up application materials"],"answer":"A","explanation":"正確答案：(A) To inform Mr. Davidson about a scholarship。 這一題問的是這封信的目的，所以要注意文章開頭的部分。After reviewing your application materials, we have decided to award you a Clark Newman Scholarship 的部分提到，在審閱「您」（Davidson 先生）的申請資料後，決定頒發 Clark Newman 獎學金，所以 (A) 是正確答案。","group":"165-167"},{"id":166,"part":7,"stem":"What is indicated about Mr. Davidson?","choices":["He wants to change his college major.","He took part in a highly competitive process.","He already made his first tuition payment.","He lives near Alberta Technical College."],"answer":"B","explanation":"正確答案：(B) He took part in a highly competitive process.。 這是和題目關鍵詞語 Mr. Davidson 有關的推論問題。this scholarship is only awarded to five applicants per year 的部分提到，這項獎學金每年只頒發給 5 名申請者，之後 All recipients were selected from a group of over 1,000 applicants. 又補充說獲獎者是從超過 1,000 名申請者中選出的，由此可以推知，Davidson 先生參與的競爭非常激烈，所以 (B) 是正確答案。","group":"165-167"},{"id":167,"part":7,"stem":"What will be sent to Mr. Davidson in the next week?","choices":["An event brochure","A housing application","An identification card","A financial aid form"],"answer":"C","explanation":"正確答案：(C) An identification card。 這是問什麼（What）會在下週寄給 Davidson 先生的 wh- 問題。和題目的關鍵詞語 sent to Mr. Davidson in the next week 有關的部分是 Next week, we will send you your student card ~，表示下週會寄學生證給他，所以 (C) 是正確答案。","group":"165-167"},{"id":168,"part":7,"stem":"What is the article mainly about?","choices":["A recently established business","A company's switch to natural ingredients","A busy street in a growing neighborhood","A newly reopened tourist attraction"],"answer":"A","explanation":"正確答案：(A) A recently established business。 這一題問的是文章的主題，所以要注意文章開頭的部分。Over the past few months, a new concept store ~ has been drawing lots of attention. 的部分提到，過去幾個月，一家新概念商店吸引了許多關注，接下來則詳細介紹這家店，所以 (A) 是正確答案。","group":"168-171"},{"id":169,"part":7,"stem":"The word \"spot\" in paragraph 1, line 2, is closest in meaning to","choices":["post","place","stain","situation"],"answer":"B","explanation":"正確答案：(B) place。 spot 所在的語句 It occupies a busy spot for tourists along 3rd Street. 之中，spot 表示「地點」的意思，所以同樣能表示「地點」的 (B) 是正確答案。","group":"168-171"},{"id":170,"part":7,"stem":"What is suggested about Freesha?","choices":["It opened a week later than planned.","It will soon have a second location.","It is seeking a new supplier of ingredients.","It will hold workshops for five or more people."],"answer":"D","explanation":"正確答案：(D) It will hold workshops for five or more people.。 這是和題目關鍵詞語 Freesha 有關的推論問題。she has added a small room where up to four visitors at a time can watch how fragrances are made. In the future, Ms. McKellen plans to expand the room to accommodate hands-on workshops for larger groups. 的部分提到，增設了最多可以讓 4 名來客同時觀看香水製作過程的小房間，未來也計畫擴展空間，以便舉辦較大團體的實作工作坊，由此可以推知，以後會創造出可以容納 5 人以上的空間並舉辦工作坊，所以 (D) 是正確答案。","group":"168-171"},{"id":171,"part":7,"stem":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Ms. McKellen had to hire more staff to help her meet the unexpected demand.\"","choices":["[1]","[2]","[3]","[4]"],"answer":"B","explanation":"正確答案：(B) [2]。 這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子說「McKellen 小姐當時必須雇用更多員工來幫助她滿足意外的需求」，所以應該會出現在和「意外的需求」有關的部分。[2] 的上一句 To her surprise, she sold out her entire inventory within a week. 提到，令她（McKellen 小姐）驚訝的是，她在一週之內賣完了所有庫存。將句子填入 [2] 的位置之後，可以表達「McKellen 小姐在一週之內賣完了所有庫存，而為了滿足這個意外的需求，McKellen 小姐當時必須雇用更多員工」，文意通順，所以 (B) 是正確答案。","group":"168-171"},{"id":172,"part":7,"stem":"Why is Mr. Daniels unavailable to come early?","choices":["He has to work at another job.","He must go to a medical appointment.","He will be attending a class.","He has to participate in a meeting."],"answer":"A","explanation":"正確答案：(A) He has to work at another job.。 這是問為什麼（Why）Daniels 先生不能早到的 wh- 問題。和題目的關鍵詞語 Mr. Daniels unavailable to come early 有關的部分是 Daniels 先生說的 I won't be able to show up until close to the starting time as I have to work at the Fry Factory until 6:30 P.M.，他因為自己必須在 Fry Factory 工作到傍晚 6:30，所以要到接近開始時間的時候才能到場，(A) 是正確答案。","group":"172-175"},{"id":173,"part":7,"stem":"What does Mr. Jackson ask Ms. Chen to do?","choices":["Send him a layout","Greet some attendees","Arrange some furniture","Clean up after the event"],"answer":"C","explanation":"正確答案：(C) Arrange some furniture。 這是問 Jackson 先生要求 Chen 小姐做什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Jackson ask Ms. Chen to do 有關的部分是 Jackson 先生說的 I was wondering if you could help me set up the tables and chairs，他想知道 Chen 小姐能不能幫忙擺設桌椅，所以 (C) 是正確答案。","group":"172-175"},{"id":174,"part":7,"stem":"At 9:35 a.m., what does Mr. Daniels mean when he writes, \"Got it\"?","choices":["He will provide assistance.","He has received an item.","He understands a layout.","He will note down a meeting time."],"answer":"A","explanation":"正確答案：(A) He will provide assistance.。 這一題問的是 Daniels 先生的訊息所表達的意圖，所以要掌握引用部分（Got it）前後文的情境。Dwayne Jackson 說 Be ready to greet participants and help them with any questions they have about the event or about how to make a donation.，要求準備好迎接參加者，並且處理他們關於活動或如何捐款的任何問題，對此 Daniels 先生回應 Got it.（知道了），表示 Daniels 先生會對參加者提供協助，所以 (A) 是正確答案。","group":"172-175"},{"id":175,"part":7,"stem":"When will the fundraiser officially start?","choices":["At 6:00 p.m.","At 6:30 p.m.","At 6:45 p.m.","At 7:00 p.m."],"answer":"D","explanation":"正確答案：(D) At 7:00 p.m.。 這是問募款活動什麼時候（When）正式開始的 wh- 問題。和題目的關鍵詞語 the fundraiser officially start 有關的部分是 I'll be there by 6:45 P.M., which is 15 minutes before the event starts.，這部分提到會在活動開始 15 分鐘前的傍晚 6:45 到場，所以 (D) 是正確答案。","group":"172-175"},{"id":176,"part":7,"stem":"Why did Mr. Keller write the e-mail?","choices":["To explain the reason for some changes","To inquire about a business partnership","To thank a colleague for her hospitality","To make arrangements for a trip"],"answer":"D","explanation":"正確 's?","choices":["It earned an award for its food.","It is testing out a new menu.","It plans to add an event space.","It is operated by the owner's brother."],"answer":"D","explanation":"正確答案：(D) It is operated by the owner's brother.。 這是 Not/True 題型，要找出和關鍵詞語 Mario's 有關的內容，並且對照選項判斷答案，所以看介紹這家業者的小冊子（第一篇文章）。(A)、(B)、(C) 在文章中沒有提到。(D) 在 It is still owned by founder Mario Robledo but is currently managed by his younger brother, Sandro. 的部分提到，「它」（Mario's）仍然為創辦人 Mario Robledo 所擁有，但目前由他的弟弟 Sandro 經營，符合選項敘述，所以 (D) 是正確答案。","group":"186-190"},{"id":187,"part":7,"stem":"What is true about Ms. Thomas?","choices":["She heard about Mario's from a client.","She has used Mario's services before.","She has strict dietary requirements.","She requested Mario's outdoor area."],"answer":"B","explanation":"正確答案：(B) She has used Mario's services before.。 這是 Not/True 題型，要找出和關鍵詞語 Ms. Thomas 有關的內容，並且對照選項判斷答案，所以看 Thomas 小姐所填的申請表（第二篇文章）。(A)、(C)、(D) 在文章中沒有提到。(B) 從 Mario's Catering Request Form 可以看出這是 Mario's 的外燴申請表，而 I don't remember which dishes we had at last year's event 的部分提到自己不記得在去年的活動吃了哪些菜，由此可知她使用過 Mario's 的服務，所以 (B) 是正確答案。","group":"186-190"},{"id":188,"part":7,"stem":"What is indicated about Madison Private Bank?","choices":["It is located on the same street as Mario's.","It recently increased the size of its staff.","It has a budget of $40 per person.","It is entitled to a 20 percent discount."],"answer":"D","explanation":"正確答案：(D) It is entitled to a 20 percent discount.。 這是需要對照兩篇文章內容的推論題型，先看說明題目關鍵詞語 Madison Private Bank 相關細節的申請表。 線索1：申請表（第二篇文章）中的 Organization: Madison Private Bank、Number of guests: 45、Preferred Menu: X Menu D 顯示，Madison 私人銀行要預訂 45 人的外燴服務，偏好的菜單是菜單 D。不過，這裡沒有提到預訂方案的其他細節，所以還需要參考小冊子的相關內容。 線索2：小冊子（第一篇文章）中的 Menu D、A 20 percent discount is applicable for groups of 40 or more. 顯示，菜單 D 有 40 人以上團體的 20% 折扣。 綜合這兩個線索，可知因為 Madison 私人銀行要預訂 45 人的菜單 D 服務，所以能得到 20% 折扣，(D) 是正確答案。","group":"186-190"},{"id":189,"part":7,"stem":"What can be inferred about the client appreciation dinner?","choices":["It was not registered on an online system.","It includes mostly vegan dishes.","It was postponed to the following month.","It must be paid for before September."],"answer":"C","explanation":"正確答案：(C) It was postponed to the following month.。 這是需要對照兩篇文章內容的推論題型，先看提到關鍵詞語 the client appreciation dinner 相關要求的申請表。 線索1：申請表（第二篇文章）中的 Date of event: August 28、this year's client appreciation dinner 顯示，年度客戶感謝晚宴申請的活動日期是 8 月 28 日。不過，這裡看不出活動實際執行的情況，所以還需要參考備忘錄中的相關內容。 線索2：備忘錄（第三篇文章）中的 our annual client appreciation dinner takes place on Wednesday, September 3. Please note that the date has been changed. 提到，年度客戶感謝晚宴在 9 月 3 日星期三舉行，並且提醒注意日期變更了。 綜合這兩個線索，可知年度客戶感謝晚宴原本預定在 8 月，後來被延到 9 月，所以 (C) 是正確答案。","group":"186-190"},{"id":190,"part":7,"stem":"What does Ms. Thomas instruct her coworkers to do?","choices":["Show up at a restaurant early","Follow a dress code","Carpool to an event","Pick up some clients"],"answer":"B","explanation":"正確答案：(B) Follow a dress code。 這是問 Thomas 小姐指示她的同事做什麼（What）的 wh- 問題，所以要從她所寫的備忘錄（第三篇文章）找出相關的內容。公告中的 Please make sure you wear formal attire 提醒務必穿著正式服裝，所以 (B) 是正確答案。","group":"186-190"},{"id":191,"part":7,"stem":"What did Craft Magazine do recently?","choices":["Published its first issue","Hired new employees","Created a Web site","Launched a campaign"],"answer":"B","explanation":"正確答案：(B) Hired new employees。 這是問 Craft 雜誌社最近做了什麼（What）的 wh- 問題，所以要從寄給 Craft 雜誌社員工的電子郵件（第一篇文章）找出相關的內容。電子郵件中的 the new writers and advertising staff we took on in the past few weeks 提到過去幾週雇用的新寫手與廣告宣傳員工，所以 (B) 是正確答案。","group":"191-195"},{"id":192,"part":7,"stem":"What is a feature of the new office?","choices":["A scenic view","A conference room","Access to a subway","An on-site gym"],"answer":"A","explanation":"正確答案：(A) A scenic view。 這是問什麼（What）是新辦公室的一項特色的 wh- 問題，所以要看介紹題目關鍵詞語 a feature of the new office 相關內容的電子郵件（第一篇文章）。電子郵件中的 windows overlooking the beautiful Charles River 提到眺望美麗的 Charles 河的窗景，所以 (A) 是正確答案。","group":"191-195"},{"id":193,"part":7,"stem":"What did one of Ms. Mendez's staff most likely do?","choices":["Arrived early in the morning to pack items","Asked to change a move-in date","Sent in some complaints","Lent a vehicle to use"],"answer":"D","explanation":"正確答案：(D) Lent a vehicle to use。 這是需要對照兩篇文章內容的推論題型，先看和題目的關鍵詞語 Ms. Mendez's staff most likely do 有關的電子郵件。 線索1：電子郵件（第一篇文章）中，I was going to rent two trucks, but if someone has a large van or pickup truck we can use, I'll only need to rent one. 的部分提到，「我」（Mendez 小姐）原本會租兩輛卡車，但如果有人有大型廂型車或皮卡車能提供使用，就只需要租一輛。不過，這裡看不出來是否有人出借車，所以還需要參考線上表單的內容。 線索2：線上表單（第二篇文章）中，BOSTON TRUCK HIRE、Number of vehicles, 1 的部分顯示只租了一輛車。 綜合這兩個線索，可知 Mendez 小姐只租了一輛車，是因為有員工出借大型廂型車或皮卡車供使用，所以 (D) 是正確答案。","group":"191-195"},{"id":194,"part":7,"stem":"What can be inferred about Craft Magazine?","choices":["It is replacing some of its equipment.","It is interested in buying secondhand furniture.","It is trying to raise money to pay for a service.","It is moving to be closer to clients."],"answer":"A","explanation":"正確答案：(A) It is replacing some of its equipment.。 這是和題目關鍵詞語 Craft Magazine 有關的推論問題。Craft Magazine is moving to a new location with new equipment, so we'll have some items for sale. 的部分提到，Craft 雜誌正在將新設備一起搬遷到新地點，所以會有一些物品要出售，由此可以推知它正在汰換一些設備，所以 (A) 是正確答案。","group":"191-195"},{"id":195,"part":7,"stem":"What is indicated about Craft Magazine's move?","choices":["It will cost less after a discount.","It will take longer than initially planned.","It will require traveling a longer distance than expected.","It will be delayed on account of bad weather."],"answer":"B","explanation":"正確答案：(B) It will take longer than initially planned.。 這是 Not/True 題型，要找出和關鍵詞語 Craft Magazine's move 有關的內容，並且對照選項判斷答案。(A)、(C)、(D) 在文章中沒有提到。(B) 在 We're going to start moving to the new office on May 1 ~. Please note that these items will not be available for pickup until the third and last day of our move on May 3. 的部分提到，5 月 1 日開始搬遷，而出售的物品要到搬遷的第三天，也就是最後一天的 5 月 3 日才能取走，符合選項敘述，所以 (B) 是正確答案。","group":"191-195"},{"id":196,"part":7,"stem":"Who was an early influence on Mr. Esteban?","choices":["An arts professor","A work colleague","A famous illustrator","A movie director"],"answer":"C","explanation":"正確答案：(C) A famous illustrator。 這是問 Esteban 先生早期影響來源是什麼人（Who）的 wh- 問題，所以要從介紹題目的關鍵詞語 Mr. Esteban 的網頁（第一篇文章）找出相關的內容。網頁中的 Mr. Esteban ~ became inspired by the noted comic-book illustrator Chad Grohl 提到，Esteban 先生受到著名漫畫插畫家 Chad Grohl 的啟發，所以 (C) 是正確答案。","group":"196-200"},{"id":197,"part":7,"stem":"What is NOT true about Mr. Esteban?","choices":["He grew up in the city of Manila.","He used to produce movie posters.","He attended art school in Manila.","He is known for using sharp colors."],"answer":"C","explanation":"正確答案：(C) He attended art school in Manila.。 這是 Not/True 題型，要找出和題目關鍵詞語 Mr. Esteban 相關的內容，所以要看介紹 Esteban 先生的網頁（第一篇文章）。(A) 在 Growing up in Manila 的部分提到，他成長於馬尼拉，符合選項敘述。(B) 在 produced many iconic movie and travel posters 的部分提到，他創作了許多代表性的電影與旅遊海報，符合選項敘述。(C) 在 Mr. Esteban taught himself to draw and ~ the lack of formal training 的部分提到，他自學畫畫而缺少正式訓練，不符合選項敘述，所以 (C) 是正確答案。(D) 在 has earned praise for his ~ vivid colors 的部分提到，他因為生動的色彩而贏得了讚賞，符合選項敘述。","group":"196-200"},{"id":198,"part":7,"stem":"When will the gallery close for renovations?","choices":["August 21","August 22","August 28","August 30"],"answer":"A","explanation":"正確答案：(A) August 21。 這是需要對照兩篇文章內容的題目。題目的關鍵詞語是 the gallery close for renovations，要問美術館什麼時候（When）會關閉進行整修，所以先看提到整修的備忘錄。 線索1：備忘錄（第二篇文章）中，We need to move Brush and Line because the exhibit hall needs to undergo some quick renovations. The only time we can schedule this work to begin is on the day of the reception. 的部分提到必須將「Brush and Line」改期，因為展覽廳必須進行一些短暫的整修，而唯一能安排這項工程開始的時間是開幕茶會當天。不過，這裡沒有寫出「Brush and Line」原本預定的開幕茶會日期，所以還需要參考網頁的內容。 線索2：網頁（第一篇文章）中，The exhibit, titled Brush and Line, opens ~ with a reception scheduled for August 21. 的部分提到「Brush and Line」展覽預定在 8 月 21 日舉行開幕茶會。 綜合這兩個線索，可知原本預定舉行「Brush and Line」開幕茶會的 8 月 21 日，將會開始進行美術館的整修，所以 (A) 是正確答案。","group":"196-200"},{"id":199,"part":7,"stem":"According to the schedule, what is indicated about Vivi Gallery?","choices":["It is closed on weekends.","It holds a reception before an opening.","It features only the work of local artists.","It does not sell any exhibited work."],"answer":"B","explanation":"正確答案：(B) It holds a reception before an opening.。 這是要從檔期表（第三篇文章）找出和題目關鍵詞語 Vivi Gallery 相關內容的推論問題。July 12 to July 29、Reception on July 10 顯示第一個展覽是 7 月 12 日到 7 月 29 日、開幕茶會是 7 月 10 日；August 2 to August 19、Reception on July 31 顯示第二個展覽是 8 月 2 日到 8 月 19 日、開幕茶會是 7 月 31 日；August 30 to September 20、Reception on August 28 顯示第三個展覽是 8 月 30 日到 9 月 20 日、開幕茶會是 8 月 28 日；September 27 to October 14、Reception on September 25 顯示第四個展覽是 9 月 27 日到 10 月 14 日、開幕茶會是 9 月 25 日。由此可以推知展覽前都會舉辦開幕茶會，所以 (B) 是正確答案。","group":"196-200"},{"id":200,"part":7,"stem":"Who most likely did Mr. Aguilar contact?","choices":["Delia Romano","Tom Moskowitz","Rolando Esteban","Remy Artaud"],"answer":"D","explanation":"正確答案：(D) Remy Artaud。 這是需要對照兩篇文章內容的推論題型，先看寄給題目關鍵詞語 Mr. Aguilar 相關的 Aguilar 先生的備忘錄（第二篇文章）。 線索1：備忘錄（第二篇文章）中的 We need to move Brush and Line because the exhibit hall needs to undergo some quick renovations. 提到必須將「Brush and Line」改期，因為展覽廳必須進行一些短暫的整修，之後 The next scheduled exhibit will also need to be moved, so I would like you to communicate with the artist 的部分則提到下一場預定的展覽也必須改期，所以希望「你」（Aguilar 先生）跟那位藝術家溝通。不過，這裡沒有寫出那位藝術家的名字，所以還需要參考檔期表中的相關內容。 線索2：檔期表（第三篇文章）中的 August 30 to September 20, Rolando Esteban: Brush and Line 顯示 Rolando Esteban 的「Brush and Line」展是 8 月 30 日至 9 月 20 日，而下一檔是 September 27 to October 14, Remy Artaud: Up is Down，也就是 9 月 27 日至 10 月 14 日的 Remy Artaud 展「Up is Down」。 綜合這兩個線索，可知 Aguilar 先生聯絡了 Rolando Esteban「Brush and Line」展的下一檔展覽藝術家 Remy Artaud，所以 (D) 是正確答案。","group":"196-200"}],"groups":{}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT 廣告</span><small>131-134</small></div><div class=\"document-body source-passages\"><h3>Ride in Style</h3>\n<p>If you're a cycling enthusiast, then it's time to get on board with Bango. Not only are our helmets stylish, 131 they keep you safe. The helmets are made with three layers of tough and sturdy materials for excellent impact absorption. They meet National Safety Board requirements. They also offer 132 for regular riders. 133 they fold neatly into a compact size for easy storage. There is simply no excuse not to try a Bango helmet today. 134 If you buy one at full price, you will receive a second helmet at 50 percent off. Check out www.bangohelmets.com, and start your next cycling journey with Bango.</p></div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 郵件</span><small>135-138</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">From</span><span class=\"mail-value\">Hampton Institute accountmanage@hamptoninstitute.org</span></div><div class=\"mail-row\"><span class=\"mail-key\">To</span><span class=\"mail-value\">Kate Whitman k.whitman@braxton.ca</span></div><div class=\"mail-row\"><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Payment Plan</span></div><div class=\"mail-row\"><span class=\"mail-key\">Date</span><span class=\"mail-value\">May 25</span></div></div>\n\n\n\n<p>Dear Ms. Whitman,</p>\n<p>This message is to confirm your 135 for Hampton Institute's coding seminar from June 30 through August 31. Since you have signed up to pay in installments, you will be charged on a monthly basis. 136 At any time, you are free to 137 the payment plan. To do this, simply log in to your account and select \"Change plan.\" You can also do this here. Please note that the longest plan we offer is for 18 months. E-mail me right away if you have any 138. I am always happy to help.</p>\n<p>Best, Hampton Institute Account Management Team</p></div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE 公告</span><small>139-142</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Lake County Animal Society to Hold Fundraising Gala</h2>\n<p>The Lake County Animal Society appreciates the contributions that have been made over the years. They have 139 the organization to provide food and shelter for hundreds of animals.</p>\n<p>Please join us for a fundraising gala on December 11 at the Morrissey Civic Center. It will be a night of fun for a good cause. 140 Admission tickets will be available for only $100 each. 141 Proceeds will be used to repair the group's Willoughby facility as the building's roof needs to be replaced. However, a portion will also go to expanding programs 142 people to volunteer at our shelters. These awareness campaigns are essential to maintaining community awareness of our work.</p></div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE 公告</span><small>143-146</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Jefferson Sports Center Notice</h2>\n<p>143 April 8, the indoor pool will be closed for one week. The pool needs to be completely drained before being cleaned, repaired, and sanitized. This is an annual procedure that is necessary to provide a safe and healthy environment for everyone. 144 other indoor facilities will remain available for use. 145 include the sauna, gym, and wellness area. The outdoor pool may be used as well. We apologize for any inconvenience the work might cause. 146 For more news and updates, follow us on social media.</p></div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT 廣告</span><small>147-148</small></div><div class=\"document-body source-passages\"><p>Do most cosmetics products give you a rash or make your skin itch? Betteskin Cosmetics is seeking individuals to test a new line of products designed specifically for people with sensitive skin.</p>\n<p>To sign up, go to www.betteskin.com. Answer a brief online survey before June 30 to help us identify your skin problems. We will mail product samples to your home along with detailed instructions. Each product must be tested for a week. In exchange, participants will receive a $25 coupon for our Web site.</p></div></section></div>","149-151":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 149-151</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE 公告</span><small>149-151</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Notification to All Charlotte Grocer Shoppers</h2>\n<p>Charlotte Grocer has stopped the sale of Hero Coco Water in its stores. The item is currently unavailable due to a worldwide product recall, but it will be restocked as soon as the recall order is lifted.</p>\n<p>For now, we recommend trying the Cocolait and Biba brands of coconut water. We carry both brands in our stores nationwide. As with all products sold in our stores, they are certified by organic certification agencies and meet all regulatory requirements for food safety.</p>\n<p>We apologize for the inconvenience. For any concerns regarding this matter, please visit the customer service desk at the store nearest you. And remember to register your e-mail address at www.charlottegrocer.com to receive our weekly newsletter containing promotional offers.</p></div></section></div>","152-153":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 152-153</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>MESSAGES 對話</span><small>152-153</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Christina Sanchez</strong><time class=\"chat-time\">[12:23 P.M.]</time></div><div class=\"message-text\">Kenichi, could you please postpone my afternoon meeting? I am at lunch with Ms. Kim, and she seems ready to make an offer on the Lakewood house. Therefore, I will be driving her to the property shortly, and we will hopefully sign a contract.</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kenichi Yamamoto</strong><time class=\"chat-time\">[12:24 P.M.]</time></div><div class=\"message-text\">That's great news. Yes, I can move Mr. Zhou to tomorrow morning. You have an opening at 9 A.M.</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Christina Sanchez</strong><time class=\"chat-time\">[12:26 P.M.]</time></div><div class=\"message-text\">That works for me. Please call Mr. Zhou directly rather than e-mail him since this is a last-minute change.</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Kenichi Yamamoto</strong><time class=\"chat-time\">[12:27 P.M.]</time></div><div class=\"message-text\">Will do. I have his phone number in front of me.</div></div>\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Christina Sanchez</strong><time class=\"chat-time\">[12:29 P.M.]</time></div><div class=\"message-text\">Thank you so much. Unless there is an urgent matter, please let any other callers know that I will be back in the office tomorrow.</div></div></div></div></section></div>","154-155":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 154-155</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 郵件</span><small>154-155</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">To</span><span class=\"mail-value\">Dennis Gunther d.gunther@bauerhoffarms.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">From</span><span class=\"mail-value\">Karina Schneider k.schneider@bauerhoffarms.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Latest crop</span></div><div class=\"mail-row\"><span class=\"mail-key\">Date</span><span class=\"mail-value\">August 19</span></div></div>\n\n\n\n<p>Dear Dennis,</p>\n<p>It appears that we've had an unusually large crop of tomatoes this season. The quantities far exceed what our regular clients agreed to buy before the season began. So, we need to figure out a way to sell the excess. Currently, I am drawing up a list of restaurants, hotels, and small grocers that might be able to take our surplus produce on short notice. At the same time, I'd like you to sell more quantities than usual at our local farmer's market. Feel free to mark down prices if you think it will help us sell more tomatoes. If we still have too many by the end of the week, we can donate the remaining ones to a community centre or charity. Let me know if you have other ideas. I am hoping we can maximise our profits.</p>\n<p>Thanks,</p>\n<p>Karina</p></div></section></div>","156-157":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 156-157</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE 文章</span><small>156-157</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Is the Sharing Economy Coming to an End?</h2>\n<p>April 23— Mumbai is taking steps to address issues with companies in the so-called sharing economy. Yesterday, it issued new regulations that target companies like the apartment-sharing application Househunt and the transportation service CallAuto. Both companies, and others like them, now have to meet more stringent requirements to operate in the city. For instance, Househunt will have to meet the same standards for hygiene and safety as the city's hotels and may be limited to certain neighborhoods. As for CallAuto, it will have to treat its drivers as regular employees and provide them with paid vacations and health insurance. The affected companies have argued that these measures will hurt profitability. However, officials counter that they are necessary to improve the public's safety and welfare.</p></div></section></div>","158-161":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 158-161</span></div><div class=\"reading-stack\"><section class=\"document-card type-advertisement\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT 廣告</span><small>158-161</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Introducing Peacelid</h2>\n<p>Peacelid is an eco-friendly company selling reusable cups, straws, and utensils. Our products are made from 100 percent bamboo. Peacelid's products are also biodegradable, so they decompose safely and naturally after being discarded.</p>\n<p>Furthermore, Peacelid advocates for environmentally friendly consumption practices and donates 3 percent of every purchase to organizations involved in preventing deforestation.</p>\n<p>Check out www.peacelid.com to see our catalog. New customers can enjoy a 20 percent discount on their first order by entering the code \"PEACE20\" on the checkout page. Moreover, every order of $200 or more will include a free reusable straw.</p></div></section></div>","162-164":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 162-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>NOTICE 公告</span><small>162-164</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Attention Gymspan Customers</h2>\n<p>Beginning in August, users who have a subscription to the Gymspan app will no longer be able to take advantage of unlimited workouts at its network of affiliated fitness centers. We apologize for this change, but it is a necessary cost-cutting measure.</p>\n<p>Customers who are presently enrolled in our unlimited membership plan may continue to use their benefits until the end of their current billing cycle. Afterward, they will be automatically moved to another plan. — [1] — To make up for the change, Gymspan will award 500 loyalty points, which can be used to purchase other products and services. — [2] —</p>\n<p>In addition, Gymspan has introduced some improvements to the app. Each month, customers have the option to easily switch from one plan to another. You can also temporarily stop payments when you are out of the country. — [3] — Lastly, you can enjoy more ways to earn points quickly. These improvements are intended to make your Gymspan membership truly flexible and responsive to your needs. — [4] — For additional information, visit www.gymspan.com or download the app today.</p></div></section></div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 165-167</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>LETTER 信件</span><small>165-167</small></div><div class=\"document-body source-passages\"><p>November 20</p>\n<p>Bernard Davidson 180 Whitfield Drive Edmonton, AL T5A 0A2</p>\n<p>Dear Mr. Davidson,</p>\n<p>Congratulations! After reviewing your application materials, we have decided to award you a Clark Newman Scholarship for engineering students. This will allow you to pursue a degree in mechanical engineering at Alberta Technical College with your tuition entirely paid for.</p>\n<p>As you know, this scholarship is only awarded to five applicants per year. The applicants are chosen based on their stellar academic record and their passion for engineering. All recipients were selected from a group of over 1,000 applicants.</p>\n<p>During your first year at Alberta Technical College, you will be living in a small dormitory, Kensing House, with other engineering students. It is located just steps from the main engineering building, Mitchell Hall. Next week, we will send you your student card as well as more information about your housing situation. Once again, congratulations!</p>\n<p>Sincerely,</p>\n<p>Donald Neilson Dean, College of Engineering Alberta Technical College</p></div></section></div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 168-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>ARTICLE 文章</span><small>168-171</small></div><div class=\"document-body source-passages\"><p>Santa Monica (March 30)— Over the past few months, a new concept store offering custom fragrances has been drawing lots of attention. It occupies a busy spot for tourists along 3rd Street. Customers can create their own fragrances or buy one of dozens of premade ones with unique combinations of scents. All fragrances use natural oils.</p>\n<p>Over the past four years, owner Sarah McKellen has developed a following on social media with her videos about fragrances. — [1] — Last year, she began selling her creations online. The success of that venture convinced her to open the first Freesha store in January. To her surprise, she sold out her entire inventory within a week. — [2] —</p>\n<p>According to Ms. McKellen, most customers enjoy the idea of creating fragrances. — [3] — That's why she has added a small room where up to four visitors at a time can watch how fragrances are made. In the future, Ms. McKellen plans to expand the room to accommodate hands-on workshops for larger groups. — [4] —</p></div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>MESSAGES 對話</span><small>172-175</small></div><div class=\"document-body source-passages\"><div class=\"chat-messages\">\n\n\n\n\n\n\n\n<div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">9:22 A.M.</time></div><div class=\"message-text\">As you know, we have a major fundraiser tomorrow for our botanical gardens. If possible, I'd like you two to arrive by 6 P.M.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sarah Chen</strong><time class=\"chat-time\">9:24 A.M.</time></div><div class=\"message-text\">Sure thing. I was actually going to be there early.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Frank Daniels</strong><time class=\"chat-time\">9:27 A.M.</time></div><div class=\"message-text\">I won't be able to show up until close to the starting time as I have to work at the Fry Factory until 6:30 P.M.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">9:28 A.M.</time></div><div class=\"message-text\">OK, thanks for letting me know, Frank. Sarah, since you're coming early, I was wondering if you could help me set up the tables and chairs.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Sarah Chen</strong><time class=\"chat-time\">9:30 A.M.</time></div><div class=\"message-text\">I'd be happy to. Have we decided on a layout?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">9:31 A.M.</time></div><div class=\"message-text\">Yes. I'll e-mail you pictures of how the room should look. Frank, since you're getting here around the start time, could you pass out programs at the entrance?</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Frank Daniels</strong><time class=\"chat-time\">9:32 A.M.</time></div><div class=\"message-text\">Yeah, sure.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Dwayne Jackson</strong><time class=\"chat-time\">9:34 A.M.</time></div><div class=\"message-text\">Be ready to greet participants and help them with any questions they have about the event or about how to make a donation.</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong>Frank Daniels</strong><time class=\"chat-time\">9:35 A.M.</time></div><div class=\"message-text\">Got it. I'll be there by 6:45 P.M., which is 15 minutes before the event starts.</div></div></div></div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 郵件</span><small>176-180 · 1</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">To</span><span class=\"mail-value\">Olivia Brunelli olivia@nathalieresort.fr</span></div><div class=\"mail-row\"><span class=\"mail-key\">From</span><span class=\"mail-value\">Roger Keller roger.keller@lowefinances.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">Date</span><span class=\"mail-value\">March 21</span></div><div class=\"mail-row\"><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Inquiry</span></div></div>\n\n\n\n<p>Dear Ms. Brunelli,</p>\n<p>During a vacation last year, I stumbled upon your beautiful retreat in Rochemaure. I was able to book a massage and thoroughly enjoyed my experience. I am in charge of organizing a trip for my company this May, and I would like to make a reservation with you. We are welcoming a few investors from overseas and want to spend some relaxing time there as a group.</p>\n<p>We will be staying at the resort from May 3 to 7. We would arrive late in the evening on May 3 and leave early on May 7. Can you reserve spa treatments for our investors for the afternoon of May 4? There are eight of them in total. This will be followed by dinner. If the weather permits, we would like to be seated outdoors and in a quiet area.</p>\n<p>We will need 12 single rooms for the duration of the trip. We are also interested in wine tasting and visiting lavender farms.</p>\n<p>Please let me know if all of this is possible by replying to this e-mail. I look forward to going over the reservation further with you.</p>\n<p>Best regards,</p>\n<p>Roger Keller Lowe Finances</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 郵件</span><small>176-180 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">To</span><span class=\"mail-value\">Roger Keller roger.keller@lowefinances.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">From</span><span class=\"mail-value\">Olivia Brunelli olivia@nathalieresort.fr</span></div><div class=\"mail-row\"><span class=\"mail-key\">Date</span><span class=\"mail-value\">March 25</span></div><div class=\"mail-row\"><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Your Inquiry</span></div></div>\n\n\n\n<p>Dear Mr. Keller,</p>\n<p>Thank you for your wonderful message. I am pleased you had a great time during your previous visit. We are happy to report that we can accommodate your party. We can reserve the whole outdoor area for your dinner. However, it would have to be moved to the next night if you are flexible. The proposed date is already booked. Of course, we also have a dining room indoors.</p>\n<p>Furthermore, we can only accommodate six spa appointments at once. About the other activities, they can be booked once you are here.</p>\n<p>Please let us know how you would like to proceed.</p>\n<p>Best regards,</p>\n<p>Olivia Brunelli Resort Manager Nathalie Resort &amp; Spa</p></div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM 表單</span><small>181-185 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">FORM</h2>\n<p>All arriving passengers must fill out the following form. If you are traveling with family members, fill out one form for the group. When you land, please present this form along with your passports to a customs official.</p>\n<div class=\"responsive-table\"><table><tr><th>Field</th><th>Entry</th></tr><tr><td>Family Name</td><td>Larson</td></tr><tr><td>First name</td><td>Harry</td></tr><tr><td>Middle name</td><td>Hughes</td></tr><tr><td>Number of Family Members With You</td><td>3</td></tr><tr><td>Address</td><td>88 Pingree Drive, Stamford, CT 06831</td></tr><tr><td>Passport Issued by</td><td>United States</td></tr><tr><td>Countries visited on this trip</td><td>Spain, Portugal</td></tr></table></div><p class=\"form-answer\">The primary purpose of this trip: □ Business　□ Vacation　☑ Other</p>\n<p>If other, please specify: My family and I flew to Spain to help my father move into his new home. Then we took a brief sightseeing trip to Portugal.</p>\n<p>Are you bringing any fruits, meats, or animals with you? Yes No</p>\n<p>If so, please list them here: N/A</p>\n<div class=\"field-row\">Signature: Harry Larson</div></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 郵件</span><small>181-185 · 2</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">TO</span><span class=\"mail-value\">Harry Larson harrylarson@worldmail.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">FROM</span><span class=\"mail-value\">Customer Service service@internationalairlines.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">SUBJECT</span><span class=\"mail-value\">Re: Request</span></div><div class=\"mail-row\"><span class=\"mail-key\">DATE</span><span class=\"mail-value\">July 28</span></div></div>\n\n\n\n<p>Dear Mr. Larson,</p>\n<p>Thank you for writing to us about your missing duffel bag. After an extensive search, we have finally located it, and we will ship it to your home address. We apologize for the inconvenience.</p>\n<p>To compensate you for the missing bag, we will add 8,000 flyer points to your account. According to our records, that means you are now entitled to one round-trip domestic flight. You can take advantage of this offer at any time. To use it, visit our Web site and click \"Redeem my flyer points\" during the checkout process.</p>\n<p>Best regards, International Airlines Customer Service</p></div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-brochure type-catalog\"><div class=\"doc-ribbon\"><span>BROCHURE 小冊</span><small>186-190 · 1</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Mario's Mediterranean cuisine catering service</h2>\n<p>Mario's has been in business for over 30 years. It is still owned by founder Mario Robledo but is currently managed by his younger brother, Sandro. The catering company serves a wide variety of dishes. Moreover, it owns an event space at 7738 Market Street with both indoor and outdoor seating. The outdoor patio is open from May 1 until September 30.</p>\n<p>Mario's can also accommodate all dietary requirements and food sensitivities.</p>\n<p>The following menu options are available:</p>\n<div class=\"responsive-table\"><table><thead><tr><th>Menu</th><th>Types of dishes</th><th>Price per person</th></tr></thead><tbody><tr><td>Menu A</td><td>2 appetizers, 2 main dishes, 1 dessert</td><td>$30</td></tr><tr><td>Menu B</td><td>Menu A + 1 appetizer</td><td>$35</td></tr><tr><td>Menu C</td><td>Menu B + 1 main dish</td><td>$40</td></tr><tr><td>Menu D</td><td>Menu C + 1 dessert</td><td>$45</td></tr></tbody></table></div>\n<div class=\"field-row\">* A 20 percent discount is applicable for groups of 40 or more.</div>\n<p>Unless otherwise indicated, all menus include a vegetarian option. For special requests or to complete a booking, please go to www.marios.com.</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM 表單</span><small>186-190 · 2</small></div><div class=\"document-body source-passages\"><h2 class=\"doc-heading\">Mario's Catering Request Form</h2>\n<div class=\"field-row\">Name of contact: Marissa Thomas</div>\n<div class=\"field-row\">Organization: Madison Private Bank</div>\n<div class=\"field-row\">E-mail: m.thomas@madisonprivatebank.com</div>\n<div class=\"field-row\">Date of event: August 28</div>\n<div class=\"field-row\">Time of event: 7 p.m.</div>\n<p>Number of guests: 45</p>\n<div class=\"field-row\">Facility: Mario's X Other</div>\n<p>If other, please specify here: Madison Private Bank office</p>\n<div class=\"field-row\">Preferred Menu:</div>\n<p>Menu A Menu B Menu C Menu D X</p>\n<p>Comments:</p>\n<p>I don't remember which dishes we had at last year's event, but they were absolutely delicious. It would be good to have something slightly different for this year's client appreciation dinner, but anything is fine. Please make sure to include at least one vegan appetizer and main dish.</p></div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 郵件</span><small>186-190 · 3</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">To</span><span class=\"mail-value\">Team</span></div><div class=\"mail-row\"><span class=\"mail-key\">From</span><span class=\"mail-value\">Marissa Thomas</span></div><div class=\"mail-row\"><span class=\"mail-key\">Date</span><span class=\"mail-value\">August 25</span></div><div class=\"mail-row\"><span class=\"mail-key\">Subject</span><span class=\"mail-value\">Upcoming Dinner</span></div></div>\n\n\n\n<p>I would like to remind you that our annual client appreciation dinner takes place on Wednesday, September 3. Please note that the date has been changed. We look forward to having mostly new clients this time, and I am sure they will like what will be served. One client, Ms. Kim, is vegan, so I made sure that there is one main and one appetizer dish she can eat. Furthermore, apart from the regular desserts, I have added a fruit platter which I assume all of you will enjoy as well. Please make sure you wear formal attire as this is considered a business affair. Looking forward to seeing you there.</p></div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>EMAIL 郵件</span><small>191-195 · 1</small></div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div class=\"mail-row\"><span class=\"mail-key\">TO</span><span class=\"mail-value\">All Staff staff@craftmagazine.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">FROM</span><span class=\"mail-value\">Alicia Mendez a.mendez@craftmagazine.com</span></div><div class=\"mail-row\"><span class=\"mail-key\">SUBJECT</span><span class=\"mail-value\">Moving</span></div><div class=\"mail-row\"><span class=\"mail-key\">DATE</span><span class=\"mail-value\">April 23</span></div></div>\n\n\n\n<p>Dear Staff,</p>\n<p>After a lengthy search, we've finally decided on the new office space for our magazine. It's a fifth-floor office at 82 Grant Street in Allston. It's much more spacious than our current location, so it can accommodate the new writers and advertising staff we took on in the past few weeks. In addition, it is near a bus stop, has a pizza place downstairs, and has windows overlooking the beautiful Charles River.</p>\n<p>We're going to start moving to the new office on May 1, when the lease begins. If you're free that Saturday and are able to assist, please let me know. I was going to rent two trucks, but if someone has a large van or pickup truck we can use, I'll only need to rent one. Please let me know immediately if you have one available.</p>\n<p>Best regards,</p>\n<p>Alicia Mendez Editor-in-Chief, Craft Magazine</p></div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>FORM 表單</span><small>191-195 · 2</small></div><div class=\"document-body source-passages\"><p>www.bostontruckhire.com</p>\n<p>BOSTON TRUCK HIRE</p>\n<div class=\"responsive-table\"><table><tr><th>Rental details</th><th>Value</th></tr><tr><td>Name</td><td>Alicia Mendez</td></tr><tr><td>Phone number</td><td>555-9182</td></tr><tr><td>Driver's license number</td><td>013403412</td></tr><tr><td>Rental date(s)</td><td>May 1, 2</td></tr><tr><td>Number of vehicles</td><td>1</td></tr><tr><td>Estimated distance to travel</td><td>10 miles</td></tr><tr><td>Pickup location</td><td>32 Cooper Street, Boston</td></tr><tr><td>Drop-off location</td><td>918 West Harding Street, Boston</td></tr><tr><td>Comments</td><td>Right now, I
