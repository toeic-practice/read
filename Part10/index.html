economy. Then, for most of the flight, the entertainment system was not working at all, which made the long flight more difficult to <strong>bear</strong>. Lastly, it appears that the airline did not prepare enough vegan meals for the flight. There weren't any left by the time it was my turn to receive one.</p>\n<p>Anyway, the whole experience left me feeling very disappointed. I have been a longtime member of your airline's loyalty program and have always been satisfied by the level of service I've received. However, this trip did not come close to my previous experiences. The airline staff tried their best to be courteous and apologetic. But I did not receive any form of compensation. I look forward to hearing how the airline plans to address this issue. Please reply as soon as possible. Thank you.</p>\n<p>Sincerely,</p>\n<p>Thomas Holmes</p>\n</div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>✦ ADVERTISEMENT</span><small>176-180 · 1/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>Work for Soleil Cruises</strong></h2>\n<p>If you're looking for the chance of a lifetime, a job with Soleil Cruises may be for you! Among the many benefits of working for Soleil Cruises is the opportunity to save money. Not only do we provide staff with accommodation and breakfast, lunch, and dinner each day, but we also cover medical insurance and travel expenses. Even the family of crew members benefit; employees at the managerial level may bring their spouse and children on board free of charge, while family members of all other staff are entitled to discounts on package trips.</p>\n<p><strong>Positions Available</strong></p>\n<p><strong>Spa specialist</strong>\nProvides facials and skincare treatments to passengers. Sells bath and beauty products. Must possess an aesthetician license. Also required to have served on a cruise ship in the past.</p>\n<p><strong>Restaurant manager</strong>\nCoordinates restaurant and bar staff. Responsibilities include maintaining service standards and handling passenger concerns. Must have strong organizational skills and have held a similar position on a cruise ship for at least two years.</p>\n<p>Call 555-8800 to find out more.</p>\n</div></section><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>✉ LETTER</span><small>176-180 · 2/2</small></div><div class=\"document-body\"><p>Richard Bates\n36 Bayview Road\nPygery, South Australia 5655\nAustralia</p>\n<p>November 1</p>\n<p>Dear Mr. Bates,</p>\n<p>I enjoyed meeting with you at our office in Sydney last week and would like to offer you the position. As I mentioned, managerial staff schedules are demanding. You'll be working six days a week for a period of nine months, from January to September. Then you will have the next three months off before beginning a new assignment.</p>\n<p>You'll have to regularly train new recruits as most of our kitchen and wait staff are students who work for two or three months at a time. Fortunately, your experience working at Luzollo Cruise restaurant has prepared you for such a high turnover rate.</p>\n<p>I should also mention that you will have to return to Sydney for two weeks of training starting on December 6. If all goes well, you will likely be assigned to one of our ships by late December, which should give you enough time to get your affairs in order.</p>\n<p>I look forward to hearing back from you.</p>\n<p>Regards,</p>\n<p>Corey Lauzone</p>\n</div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▤ NOTICE</span><small>181-185 · 1/2</small></div><div class=\"document-body\"><p>At Polson Electronics, we take great pride in the quality of our merchandise. If you are unhappy with one of our products, you may return it for a refund or exchange it for another item. The following terms and conditions apply to purchases made through our Web site and at any of our 28 stores nationwide:</p>\n<p>Products may be returned within 21 days of purchase as long as the packaging remains sealed. Returns of online purchases by mail take 7 to 14 days to process. The original receipt must be included with all returns. Discounted products cannot be returned. Items that have been removed from their packaging can only be returned in exchange for store credit.</p>\n<p>Thank you for shopping at Polson Electronics.</p>\n</div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>☷ FORM</span><small>181-185 · 2/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>Polson Electronics - Product Return Form</strong></h2>\n<p>Customer: Beth Yang\nPhone Number: 555-0393\nAddress: 35 Elm Street, Chicago, IL 60176\nE-Mail: b.yang@dmail.com</p>\n<p>Product Name: Digital 350X Printer\nDate of Purchase: May 7\nModel Number: 7849484XE\nPlace of Purchase: Harrisburg Branch</p>\n<p><strong>Reason for Return:</strong></p>\n<p>Despite my best efforts, I cannot get this printer to work with my laptop. After checking a few online forums, I realized that it has compatibility issues with my computer. I even took both devices to a service center on May 11, but the technician was unable to solve the problem. So, I decided to put it back in its box and return it. Rather than immediately purchasing another model, I would like to wait and get the Sonicall MDM-0. I have read that it will be released next month. Please let me know by e-mail when exactly you will begin selling it.</p>\n<p>Action Requested: Exchange Refund</p>\n</div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>186-190 · 1/3</small></div><div class=\"document-body\"><p>May 6</p>\n<p>The Latin American Journal of Medicine is pleased to announce that Dr. Juan Lima is the winner of this year's Health Service Award. For decades, Dr. Lima has been working as a general surgeon in Domingo Hospital in Bolivia, his home country. We are honoring him because he launched a national health campaign to alert the population about a new strain of flu virus last year. While treating many infants and elderly people—the two groups that were most affected by the outbreak—Dr. Lima advocated for help from the government. Due to his insistence, the Bolivian Health Organization, headed by Mr. Rodrigo Guerrero, ran educational advertisements about preventing and treating the flu.</p>\n<p>Join us to honor Dr. Lima on May 27 at 8 P.M. in the Buena Vista Banquet Hall. One of Dr. Lima's colleagues will present him with the award. Last year's winner, Dr. Santiago Castillo, will be in attendance. To purchase tickets for this event, visit <a href=\"https://www.lajm.com/tickets\">www.lajm.com/tickets</a>.</p>\n</div></section><section class=\"document-card type-web\"><div class=\"doc-ribbon\"><span>◈ WEB PAGE</span><small>186-190 · 2/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>The Latin American Journal of Medicine Awards Ceremony</strong>\nMay 27 at 8 P.M.\nBuena Vista Banquet Hall</h2>\n<p>Thank you for your interest in attending our awards ceremony. Please read through the following information before purchasing your tickets. All sales are final.</p>\n<p>All event attendees must have a paper or electronic ticket. This will need to be scanned at the door by one of our event staff. A ticket includes free parking in either the Buena Vista Parking Lot on the corner of Sunset Street and Orange Avenue or the Belmonte Parking Garage on La Paz Street. A ticket also includes a buffet dinner, unlimited drinks, and participation in a networking session with the renowned author Dr. Maria Quintero, who will be presenting Dr. Lima's award.</p>\n<p>We look forward to seeing you at the ceremony!</p>\n</div></section><section class=\"document-card type-receipt\"><div class=\"doc-ribbon\"><span>▧ RECEIPT</span><small>186-190 · 3/3</small></div><div class=\"document-body\"><p><strong>Belmonte Parking Garage Receipt</strong></p>\n<p>Receipt Date: May 27\nDriver: Stephanie Vera\nPrice: Not applicable—event guest at Buena Vista Banquet Hall\nTime In: 7:45 P.M.\nCar Model: Volper 900\nCar Color: Blue\nLicense Plate Number: SXC 894</p>\n<p>*Please place this receipt on the dashboard of your car while it is parked in the garage. A security guard will ask you for it on your way out.</p>\n</div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>✉ LETTER</span><small>191-195 · 1/3</small></div><div class=\"document-body\"><p>November 9</p>\n<p>Elisabeth Baker\nGrandville Science Museum\n4747 Prairie Street SW\nGrandville, MI 49418</p>\n<p>Dear Ms. Baker,</p>\n<p>I am writing to let you know that I will not be able to lead tours at the museum for all of January. This is because I will be going on a research trip to South America with several of my colleagues at Lakeshore University. During our expedition, we will be digging for the remains of extinct life-forms in the Atacama Desert.</p>\n<p>I look forward to guiding museum guests again from February 2 onward. While I have been leading tours on Sundays up to this point, I would like to switch to Saturdays after I return. Also, if you are in need of any speakers for the museum's Real Science lecture series, I would be glad to give a presentation on my findings during the trip.</p>\n<p>Sincerely,</p>\n<p>James Uttley</p>\n</div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>191-195 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-meta\">TO: All staff\nFROM: Michelle Lawrence, museum director\nSUBJECT: Changes regarding tours\nDATE: November 13</div>\n<p>I have several announcements for you about our tour program here at Grandville Science Museum. Firstly, our tours will be taking place on weekdays only, effective December 1. This is because our average number of weekend visitors has risen, and tour groups have become inconvenienced by the congestion. As before, all tours will begin at 10 A.M. and end at noon. The new schedule will be posted on our Web site and on the wall behind our ticket counter. The changes are as follows:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>Tour</strong></th>\n<th style=\"text-align:left\"><strong>Day Currently Held</strong></th>\n<th style=\"text-align:left\"><strong>Day to Be Held Starting Dec. 1</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Dinosaurs and Fossils</td>\n<td style=\"text-align:left\">Sunday</td>\n<td style=\"text-align:left\">Monday</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">The Technology around Us</td>\n<td style=\"text-align:left\">Monday</td>\n<td style=\"text-align:left\">Tuesday</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Life in the Ocean</td>\n<td style=\"text-align:left\">Thursday</td>\n<td style=\"text-align:left\">Wednesday</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Our Place in the Universe</td>\n<td style=\"text-align:left\">Saturday</td>\n<td style=\"text-align:left\">Friday</td>\n</tr>\n</tbody>\n</table>\n<p>Secondly, one of our volunteers, Dr. James Uttley, will not be able to lead his tour in January. Please let me know by e-mail if you would be willing to take over for Dr. Uttley temporarily. All I require is that you have a degree in archaeology.</p>\n</div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>191-195 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-meta\">FROM: Dale Vinson dalevins@grandvilless.com\nTO: Michelle Lawrence michlawr@grandvilless.com\nDATE: November 19\nSUBJECT: Tour Opportunity</div>\n<p>Dear Ms. Lawrence,</p>\n<p>While I'm enjoying my work coordinating our museum's Energy Sources experience center, I'm keen to lead Dr. Uttley's tour during his absence. I don't think this would interfere with my regular duties because no new interactive exhibits will be added to the experience center that month. As you know, I studied physics in university, which is not directly related to the tour. However, I'm highly familiar with each of our facility's exhibit halls. I also assisted Dr. Uttley when the number of participants in his tour exceeded our 25-person limit due to a registration error. If you'd like, I'd be happy to discuss this further with you at the staff cafeteria during lunch. Let me know if you want to meet.</p>\n<p>Best,</p>\n<p>Dale Vinson\nJunior Curator, Grandville Science Museum</p>\n</div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀原文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>✦ ADVERTISEMENT</span><small>196-200 · 1/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\"><strong>Satisfy Your Thirst for Knowledge at Devon Music Institute</strong></h2>\n<p>At Devon Music Institute, we know that the desire to learn doesn't stop after graduation from university. That's why, in addition to providing training for aspiring performers and composers, we offer a range of continuing education courses taught by highly qualified instructors. If you'd like to enhance your life through a better understanding of music, consider taking one of our upcoming music history workshops.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><strong>Workshop</strong></th>\n<th style=\"text-align:left\"><strong>Instructor</strong></th>\n<th style=\"text-align:left\"><strong>Date</strong></th>\n<th style=\"text-align:left\"><strong>Cost</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Early Italian Opera</td>\n<td style=\"text-align:left\">Denise Murray</td>\n<td style=\"text-align:left\">May 6</td>\n<td style=\"text-align:left\">$35</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">The Madrigal Tradition</td>\n<td style=\"text-align:left\">Clayton Higgins</td>\n<td style=\"text-align:left\">May 13</td>\n<td style=\"text-align:left\">$55</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">North American Folk Music</td>\n<td style=\"text-align:left\">Lara Wiseman</td>\n<td style=\"text-align:left\">May 20</td>\n<td style=\"text-align:left\">$40</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Improvisational Music in the Middle East</td>\n<td style=\"text-align:left\">Zoe Gomez</td>\n<td style=\"text-align:left\">May 27</td>\n<td style=\"text-align:left\">$60</td>\n</tr>\n</tbody>\n</table>\n<p>Additional information about these workshops is available at <a href=\"https://www.devonmusicinstitute.com/\">www.devonmusicinstitute.com</a>.</p>\n<p>To register, drop by our facility on the corner of Bedford Avenue and Davis Street.</p>\n</div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>196-200 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-meta\">To: Promotion Department Staff, Periform Records\nFrom: Greg Hong, promotions manager, Periform Records\nDate: April 15\nSubject: Workshops</div>\n<p>At our April 10 meeting, I asked you to tell me how you think our workplace can be improved. Several of you indicated that you would like to be given more opportunities to learn about music. I called Devon Music Institute yesterday morning and confirmed that each of its regularly offered one-day workshops will take place next month. Staff members interested in attending any of these workshops should register and pay themselves. Then they should request reimbursement from the accounting department. I would like to add that I took one of the sessions—Early Italian Opera—last month with supervisors from the marketing and distribution departments. We were highly impressed by how much information was covered.</p>\n</div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>196-200 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-meta\">To: Darrel Wilson d.wilson@periform.com\nFrom: Mandy Parker m.parker@periform.com\nDate: July 1\nSubject: Reimbursement Request</div>\n<p>Dear Mr. Wilson,</p>\n<p>I just wanted to follow up on my reimbursement request. It was for a workshop I joined at Devon Music Institute on May 13. Do you have any idea why my request has not been processed yet? In the past, it has never taken more than three weeks. One of my coworkers who participated in a training session at the same institute on May 20 has already received the funds he requested. The workshop I attended was authorized by my manager, Mr. Hong. You may want to call him at extension 457 to confirm this. Thank you.</p>\n<p>Sincerely,</p>\n<p>Mandy Parker</p>\n</div></section></div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 131-134</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▤ NOTICE</span><small>131-134 · 1/1</small></div><div class=\"document-body\"><p>訪客停車提醒</p>\n<p>近期有住戶反映，Deschamps 公寓地下室停車場被訪客不當使用。請注意，有 10 個車位〔<span class=\"reading-blank\">〔131〕</span>〕供訪客停放，位於電梯左側並有清楚標示。若這些車位全部被使用，訪客可以在 Trenton 街尋找停車位。<span class=\"reading-blank\">〔132〕</span></p>\n<p>即日起，未經允許占用〔<span class=\"reading-blank\">〔133〕</span>〕車位的車輛將由管理處決定拖吊。<span class=\"reading-blank\">〔134〕</span>〕車主也會收到 25 元罰單。如需更多資訊，請洽大樓服務經理 Vince Romoni。</p>\n</div></section></div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 135-138</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>135-138 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Vision Pay</h2>\n<p>信用卡公司 Echo <span class=\"reading-blank\">〔135〕</span>〕一款新的行動應用程式 Vision Pay，讓 Echo 信用卡用戶線上購物更加方便。它於 2 月 1 日〔<span class=\"reading-blank\">〔136〕</span>，推出後很快獲得近 50,000 次下載。</p>\n<p>因為 Vision Pay 儲存卡片資料及運送資訊，完成線上〔<span class=\"reading-blank\">〔137〕</span>〕的速度比過去更快。大部分網站的付款流程如今只需不到五秒。<span class=\"reading-blank\">〔138〕</span>〕Echo 副總裁 Wallace Tan 表示：「我們加入了先進的安全功能，應能讓客戶在線上購物時更安心。」</p>\n<p>Echo 信用卡持卡人若要使用 Vision Pay，請前往手機應用程式商店。</p>\n</div></section></div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 139-142</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▤ NOTICE</span><small>139-142 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">邀您共襄盛舉，慶祝盛大開幕！</h2>\n<p>我們很高興宣布波特蘭最新購物〔<span class=\"reading-blank\">〔139〕</span> River Reed Mall 盛大開幕。商場有三層樓，面積達 170 萬平方英尺，匯集超過 130 間商店與餐廳，還有水族館及溜冰場。</p>\n<p>剪綵典禮將於 3 月 15 日上午 10:30 舉行。<span class=\"reading-blank\">〔140〕</span>〕欲參加者只需前往 Boswell 街的 Harper 廣場，再〔<span class=\"reading-blank\">〔141〕</span>〕正門。現場將介紹商場的開發過程、回答問題並發放禮券。最後正式開門，讓參加者可以〔<span class=\"reading-blank\">〔142〕</span>〕自行探索商場。</p>\n</div></section></div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 143-146</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>✉ LETTER</span><small>143-146 · 1/1</small></div><div class=\"document-body\"><p>8 月 29 日</p>\n<p>Marcel Vastine\n77 Rue du Perche\nParis, France 75003</p>\n<p>親愛的 Vastine 先生：</p>\n<p>謹通知您在 London Modern Art Gallery 內〔<span class=\"reading-blank\">〔143〕</span>〕照片的申請已獲批准。抵達時請攜帶此信所附文件，並於售票處出示。<span class=\"reading-blank\">〔144〕</span>〕此外請準備支付 300 英鎊的費用。</p>\n<p>您在申請表中說明〔<span class=\"reading-blank\">〔145〕</span>〕將刊登在《Globe Traveler》雜誌。請確保文章提及美術館名稱。此外，您簽署申請表時，已同意〔<span class=\"reading-blank\">〔146〕</span>〕寄給我們一份雜誌。我們預期於刊出後三個工作天內收到。</p>\n<p>敬祝順心\nJane Rahman\n公關專員\nLondon Modern Art Gallery</p>\n</div></section></div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 147-148</span></div><div class=\"reading-stack\"><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>☷ FORM</span><small>147-148 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Shiner 電子產品公司 服務申請表</h2>\n<p>申請日期：8 月 24 日\n申請時間：下午 1:20\n申請者：Anita Ellis\n地點：702 辦公室</p>\n<p>問題說明：</p>\n<p>我們行銷研究部的冷氣又漏水了。這通常不是緊急的事，但這是這個月第二次發生了。我們希望在未來 24 小時內得到回覆，尤其是因為過去幾週天氣特別熱。</p>\n<p>優先程度：\nX 高：需要立即處理\n中：2 至 3 天內完成\n低：一週內完成</p>\n</div></section></div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 149-150</span></div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>✦ ADVERTISEMENT</span><small>149-150 · 1/1</small></div><div class=\"document-body\"><p>豪華一房公寓</p>\n<p>Cerulean 大樓最後剩下的一房公寓可供出租。位於 28 樓，它擁有下方聖保羅市區與遠方密西西比河的開闊景觀。優雅的玄關通往寬敞的客廳與餐廳。廚房配備線條俐落的電器設備，寢室有大窗，浴室有現代風格的浴缸。這間公寓附有沙發、咖啡桌、床、床頭櫃，以及許多收納空間。Cerulean 大樓是提供完整服務的現代豪華大樓，設有電影院與健身中心。附近有私人停車場可租用停車位。請撥打 555-5784 安排參觀。</p>\n</div></section></div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 151-152</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>▤ MESSAGES</span><small>151-152 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Eric Daniels</strong><time class=\"chat-time\">上午10:12</time></div><div class=\"message-text\">嘿，你在公寓裡嗎？我需要進去。我把我的鑰匙留在裡面了。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Sarah Woolf</strong><time class=\"chat-time\">上午10:13</time></div><div class=\"message-text\">抱歉，我剛開始值班工作。你可以等到我的午餐休息時間嗎？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Eric Daniels</strong><time class=\"chat-time\">上午10:16</time></div><div class=\"message-text\">不行。我需要我上課的用品。課一小時後開始。我不想叫鎖匠開鎖。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Sarah Woolf</strong><time class=\"chat-time\">上午10:17</time></div><div class=\"message-text\">別擔心。只要打電話給樓下的辦公室就行了。大樓管理員有一套鑰匙。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Eric Daniels</strong><time class=\"chat-time\">上午10:20</time></div><div class=\"message-text\">對耶。我都沒想到。我現在打電話。</div></div></div></div></section></div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 153-154</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▤ NOTICE</span><small>153-154 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">通知：給所有會員</h2>\n<p>我們很遺憾地向 Waltrop 休閒中心的會員報告，我們游泳池的關閉期間將會延長。我們發現了許多破損的瓷磚，並且已經決定重鋪整座游泳池的瓷磚。</p>\n<p>我們明白這次關閉造成了困擾，並且正在努力解決這個問題。目前，預估的維修完成日期是 7 月 16 日。同時，Eving 社區大方地為我們的會員提供了社區游泳池的免費使用權。已經預先支付游泳課費用的會員，可以得到退款，或者用已付的金額抵用未來的課程。</p>\n<p>在我們的游泳池重鋪瓷磚的期間，我們的健身房、籃球場和舞蹈工作室將保持開放。如同往常，這些設施可以在一週之中的每天上午 7 點到晚上 9 點使用。我們會在網站發布游泳池維修的最新消息。謝謝。</p>\n</div></section></div>","155-158":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 155-158</span></div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>▤ MESSAGES</span><small>155-158 · 1/1</small></div><div class=\"document-body\"><div class=\"chat-messages\"><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Tanya Huang</strong><time class=\"chat-time\">上午10:05</time></div><div class=\"message-text\">下午好，Benedict 先生。我是 Analyte 支援團隊的成員。我知道您昨天對於我們的會計軟體提出了支援申請。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Rick Benedict</strong><time class=\"chat-time\">上午10:06</time></div><div class=\"message-text\">是的。我找不到把 Analyte 檔的一些資料轉移到 Upcell 的方法。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Tanya Huang</strong><time class=\"chat-time\">上午10:07</time></div><div class=\"message-text\">我明白了。那是我們競爭業者的一款程式，但它和 Analyte 軟體相容。您需要點擊「檔案」，選擇「匯出」，並且從列表中選「Upcell」。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Rick Benedict</strong><time class=\"chat-time\">上午10:07</time></div><div class=\"message-text\">那就是問題所在。我試了那個方法，但沒有用。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Tanya Huang</strong><time class=\"chat-time\">上午10:08</time></div><div class=\"message-text\">噢，我很抱歉。請稍等。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Tanya Huang</strong><time class=\"chat-time\">上午10:10</time></div><div class=\"message-text\">Benedict 先生，您不會是使用我們的每月 15 元方案吧？因為只有 35 元以上的方案可以匯出到其他程式，包括 Upcell。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Rick Benedict</strong><time class=\"chat-time\">上午10:12</time></div><div class=\"message-text\">我明白了。因為我真的需要（這個功能的）使用權，您有任何立刻幫我升級的方法嗎？</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Tanya Huang</strong><time class=\"chat-time\">上午10:13</time></div><div class=\"message-text\">當然。我可以幫您轉接我們的帳務部，但您需要準備好您的信用卡。</div></div><div class=\"message-bubble\"><div class=\"message-meta\"><strong class=\"chat-sender\">Rick Benedict</strong><time class=\"chat-time\">上午10:14</time></div><div class=\"message-text\">可以。那就這樣做吧。</div></div></div></div></section></div>","159-161":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 159-161</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>159-161 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-meta\">收件者：Alicia Carpenter alicia@epost.net\n寄件者：Bobby McCord b.mccord@brancafitness.com\n主旨：Branca Fitness\n日期：1 月 4 日</div>\n<p>親愛的 Carpenter 小姐：</p>\n<p>感謝您同意加入 Branca Fitness 關於運動器材的焦點團體訪談。您的時段安排在 1 月 15 日下午 5 點到 8 點。— [1] —。焦點團體訪談將在我們位於西雅圖 Bellflower 路 189 號的總公司舉行。</p>\n<p>您抵達辦公室時，將被要求簽署保密協議。由於要測試的產品尚未對大眾公開，所以請勿與任何人分享相關資訊。</p>\n<p>在第一個活動中，您將被要求測試一些運動器材。請務必穿著舒適的衣服或多攜帶一套衣服。— [2] —。這項活動之後將進行團體討論。在討論中，將會對您呈現一些不同的行銷概念。當被詢問對於這些概念的意見時，請提供誠實且詳細的回答。— [3] —。</p>\n<p>如同在通知中提到的，150 元的款項將透過銀行轉帳提供給每位參加者。— [4] —。如果您有任何問題，請隨時聯絡我。</p>\n<p>Bobby McCord</p>\n</div></section></div>","162-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 162-164</span></div><div class=\"reading-stack\"><section class=\"document-card type-web\"><div class=\"doc-ribbon\"><span>◈ WEB PAGE</span><small>162-164 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Maksma 公司</h2>\n<p>Maksma 公司 15 年前創立於愛沙尼亞，目標是讓人們在網路上購物更容易。最初的辦公室開設時，它只有 46 名員工。之後，Maksma 公司成為歐洲最大的支付管道之一，讓 22 個國家超過 6 千萬名消費者與 7 萬個商家的網路付款更便利。Maksma 公司藉由為顧客提供立即付款、延後付款或者在指定期間付部分金額的選擇來達到差異化。不管顧客選擇哪一項，都一定能得到安全、便利的體驗。商家也因為能提供更多樣的付款選擇而受益。</p>\n<p>Maksma 公司的總部位於塔林，在倫敦和紐約設有衛星辦公室。公司超過 1,500 名的員工由國際化的經營團隊帶領。公司市值超過 25 億美元，每年處理大約 100 億美元的網路銷售。</p>\n</div></section></div>","165-168":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 165-168</span></div><div class=\"reading-stack\"><section class=\"document-card type-brochure\"><div class=\"doc-ribbon\"><span>▣ BROCHURE</span><small>165-168 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">CORPORATE SOLUTIONS 公司的最新產品</h2>\n<p>在今日高度競爭的世界，企業必須利用每項可用的優勢。Fillyan Master 是讓您能用行動裝置控制企業環境中電子設備的程式。— [1] —。</p>\n<p>它讓您能用手機或平板監控並管理視聽設備、照明、室內溫度等等。— [2] —。為您的電動窗戶遮陽簾編寫程式，藉以在一天中的各種時間將降溫能力最大化。</p>\n<p>此外，您可以在任何有無線網路的地方，透過語音與影像管道與他人協作。幾位參與者可以用筆記型電腦或智慧型裝置同時觀看簡報並協作。— [3] —。</p>\n<p>Fillyan Master 也讓您能收集關於空間與能源使用的資料。用這項資訊來引導預算決定、為您的公司節省時間與金錢，並且將您的資源最大化。— [4] —。</p>\n<p>請上 www.fillyan.com 獲取關於這項產品與其他產品的更多資訊，或者撥打我們的熱線電話 555-5205 安排示範操作的時間。</p>\n</div></section></div>","169-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 169-171</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>169-171 · 1/1</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Lynn Foster 的寫作生涯</h2>\n<p>Lynn Foster 是在奧勒岡州的波特蘭生活與工作的奇幻小說家。她最為人知的作品是《The Last Rancher》，並且從 18 歲開始活躍寫作至今。她出生於路易斯安那州，11 歲時搬到蒙大拿州的標特。之後，她從那裡廣闊而開放的景色獲得寫作靈感。</p>\n<p>Foster 小姐透過向全國各地雜誌投稿短篇故事，開始了她的寫作生涯。她的短篇故事《Bear in the Creek》贏得了蒙大拿藝術委員會的獎項。兩年後，她出版了第一本小說《Meadowlark》。接著出版的是四冊的故事《The Darkening Brow》，它被改編成動畫電影。她目前進行中、暫定標題為《There and Back》的作品，（背景）設定在她出生的城市。</p>\n<p>Foster 小姐的書已經被翻譯成超過 20 種語言。</p>\n</div></section></div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 172-175</span></div><div class=\"reading-stack\"><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>172-175 · 1/1</small></div><div class=\"document-body\"><div class=\"doc-meta\">收件者：顧客服務 customerservice@swissluxair.ch\n寄件者：Thomas Holmes thomas@holmessolutions.ch\n日期：8 月 5 日\n主旨：預訂編號 49994FGX</div>\n<p>敬啟者：</p>\n<p>我寫這封信，是要告訴你們我搭乘 SwissLux 航空的經驗。具體來說，我指的是從蘇黎世到新加坡的 293 航班，8 月 3 日上午 11 點出發。</p>\n<p>一開始，我就注意到登機過程似乎漫無章法。報到之前，我早已在網路購買了座位升級。然而，我被告知這個航班被超賣，而我必須換成經濟艙的座位。然後，在飛行中的大部分時間，娛樂系統完全不能運作，使得長途飛行更難以忍受。最後，航空公司似乎沒有為這個航班準備足夠的純素餐點。輪到我收取餐點的時候，已經一個也不剩了。</p>\n<p>總之，這整個經驗讓我感覺非常失望。我是你們航空公司忠誠計畫的長期會員，並且一直對我受到的服務感到滿意。然而，這次旅程遠遠比不上我（以前）珍貴的體驗。航空公司的人員盡力表現禮貌與道歉。但我沒有得到任何形式的補償。我期待收到關於航空公司打算如何處理這個問題的回覆。請儘快回覆。謝謝。</p>\n<p>Thomas Holmes</p>\n</div></section></div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 176-180</span></div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>✦ ADVERTISEMENT</span><small>176-180 · 1/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">在 Soleil 遊輪工作</h2>\n<p>如果你在尋找此生難得的機會，在 Soleil 遊輪的工作可能適合您！在 Soleil 遊輪工作的許多好處之一，是有機會省錢。我們不但提供員工每天的住宿與早、午、晚餐，還負擔醫療保險與旅行費用。就連船上人員的家人也享有優惠；管理階層的員工可以免費帶配偶與小孩上船，而其他所有員工的家人有資格得到套裝旅行的折扣。</p>\n<p>可應徵職位</p>\n<p>Spa 專家\n為乘客提供做臉與護膚療程。銷售沐浴及美容產品。必須有美容師執照。也必須擁有在遊輪船上服務的經驗。</p>\n<p>餐廳經理\n管理餐廳與酒吧員工。職責包括維持服務水準與處理乘客問題。必須有強大的組織能力，並且曾經在遊輪船上擔任類似職位至少兩年。</p>\n<p>請撥打 555-8800 了解更多。</p>\n</div></section><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>✉ LETTER</span><small>176-180 · 2/2</small></div><div class=\"document-body\"><p>Richard Bates\n36 Bayview Road\nPygery, South Australia 5655\nAustralia</p>\n<p>11 月 1 日</p>\n<p>親愛的 Bates 先生：</p>\n<p>上週在我們的雪梨辦公室和您會面很開心，我也想把這個職位提供給您。如同我所提過的，管理職員工的時間安排負擔很重。您會在 1 月到 9 月的 9 個月期間每週工作 6 天。接下來，在開始新的工作之前，您會有 3 個月的休假。</p>\n<p>您必須定期訓練新人，因為我們大部分廚房與服務人員是一次工作 2、3 個月的學生。幸好，您在 Luzollo 遊輪餐廳工作的經驗，已經讓您對這麼高的人員流動率有所準備。</p>\n<p>我也應該提一下，您將必須回到雪梨，接受從 12 月 6 日開始的 2 週訓練。如果一切順利，您很有可能在 12 月底前被分派到我們其中一艘船，這樣應該會讓您有足夠的時間處理好自己的事情。</p>\n<p>期待您的回覆。</p>\n<p>Corey Lauzone</p>\n</div></section></div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 181-185</span></div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>▤ NOTICE</span><small>181-185 · 1/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">在 Polson 電子產品公司，我們自豪於自家商品的品質。如果您對我們的產品不滿意，可以退貨並要求退款，或者換成其他產品。以下條款適用於透過我們的網站以及全國 28 家店面中任何一家購買的產品：</h2>\n<p>只要包裝保持未拆封，產品可以在購買後 21 天內退回。以郵寄方式退回網路購買的產品，需要 7 至 14 天處理。所有退貨都必須附上收據正本。折扣產品不可退貨。已經從包裝取出的產品，只能退回後換取店內抵用金。</p>\n<p>感謝您在 Polson 電子產品公司購物。</p>\n</div></section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>☷ FORM</span><small>181-185 · 2/2</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">Polson 電子產品公司—產品退貨表單</h2>\n<p>顧客：Beth Yang\n電話號碼：555-0393\n住址：Elm 街 35 號，芝加哥，伊利諾州 60176\n電子郵件：b.yang@dmail.com</p>\n<p>產品名稱：Digital 350X 印表機\n型號：7849484XE\n購買日期：5 月 7 日\n購買地點：Harrisburg 分店</p>\n<p>退貨原因：</p>\n<p>儘管我努力嘗試，我還是不能讓這台印表機搭配我的筆記型電腦使用。查看一些網路論壇之後，我了解到它和我的電腦有相容性問題。我甚至在 5 月 11 日把兩台設備都帶到服務中心，但技術人員無法解決問題。所以，我決定把它放回箱子並且退貨。我不想馬上購買其他型號，而想等待並且購買 Sonicall MDM-0。我已經讀到它下個月將會發售的消息。請用電子郵件告訴我你們會開始販售的確切時間。</p>\n<p>要求的處置：□ 換貨　■ 退款</p>\n</div></section></div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 186-190</span></div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>▤ ARTICLE</span><small>186-190 · 1/3</small></div><div class=\"document-body\"><p>5 月 6 日</p>\n<p>《拉丁美洲醫學期刊》很高興宣布，Juan Lima 醫師是今年醫療服務獎的得主。數十年來，Lima 醫師一直在他的母國玻利維亞的 Domingo 醫院任一般外科醫師。我們表揚他，是因為他去年發起全國性的健康活動來提醒民眾注意新種流感病毒。在治療許多幼兒與老年人時——在疾病爆發時受到最大影響的兩群人——Lima 醫師主張政府應提供協助。由於他的堅持，由 Rodrigo Guerrero 先生領導的玻利維亞衛生組織刊登了關於預防及治療流感的教育性廣告。</p>\n<p>5 月 27 日晚上 8 點在 Buena Vista 宴會廳，請和我們一起表揚 Lima 醫師。Lima 醫師的一位同事將會頒獎給他。去年的得主 Santiago Castillo 醫師將會出席。要購買這次活動的門票，請上 www.lajm.com/tickets。</p>\n</div></section><section class=\"document-card type-web\"><div class=\"doc-ribbon\"><span>◈ WEB PAGE</span><small>186-190 · 2/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">《拉丁美洲醫學期刊》頒獎典禮\n5 月 27 日晚上 8 點\nBuena Vista 宴會廳</h2>\n<p>感謝您有興趣參加我們的頒獎典禮。購買門票前請仔細閱讀以下資訊。票券售出概不退換。</p>\n<p>所有活動參加者必須持有紙本或電子門票。門票必須在門口接受我們的活動工作人員掃描。</p>\n<p>門票內含 Sunset 街與 Orange 大街路口的 Buena Vista 停車場或 La Paz 街上的 Belmonte 室內停車場的免費停車。</p>\n<p>門票也包含自助式晚餐、飲料無限暢飲，以及參加與著名作家 Maria Quintero 醫師共同進行的社交活動，她將頒發 Lima 醫師的獎項。</p>\n<p>期待在典禮上與您見面！</p>\n</div></section><section class=\"document-card type-receipt\"><div class=\"doc-ribbon\"><span>▧ RECEIPT</span><small>186-190 · 3/3</small></div><div class=\"document-body\"><p>Belmonte 室內停車場收據</p>\n<p>收據日期：5 月 27 日\n駕駛人：Stephanie Vera\n停車費：不適用——Buena Vista 宴會廳的活動來賓\n入場時間：晚上 7:45\n車款：Volper 900\n車輛顏色：藍色\n車牌號碼：SXC 894</p>\n<ul>\n<li>車輛停放於停車場期間，請將此收據置於車輛儀表板上面。出場時警衛將請您出示。</li>\n</ul>\n</div></section></div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 191-195</span></div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>✉ LETTER</span><small>191-195 · 1/3</small></div><div class=\"document-body\"><p>11 月 9 日</p>\n<p>Elisabeth Baker\n格蘭維爾科學博物館\nPrairie 街 SW 4747 號\n格蘭維爾，密西根州 49418</p>\n<p>親愛的 Baker 小姐：</p>\n<p>我寫信是要讓你知道，我整個 1 月都不能帶領博物館的導覽。這是因為我會和幾位 Lakeshore 大學的同事一起去南美洲做研究旅行。探險期間，我們會在阿他加馬沙漠挖掘絕種生物的遺骸。</p>\n<p>我預計 2 月 2 日開始再度為博物館訪客導覽。雖然我目前都是每週日帶領導覽，但我在回來之後想改到每週六。還有，如果你需要博物館的「真實科學」講座系列的講者，我很樂意報告我在旅途中的研究結果。</p>\n<p>James Uttley</p>\n</div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>191-195 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-meta\">收件者：全體員工\n寄件者：Michelle Lawrence，博物館館長\n主旨：導覽相關的改變\n日期：11 月 13 日</div>\n<p>我要對各位公告關於我們格蘭維爾科學博物館導覽計畫的幾件事。首先，我們的導覽將只在平日進行，12 月 1 日開始實施。這是因為我們週末平均參觀人數上升了，而導覽團體因為擁擠的情況而遭受不便。和以前相同，所有導覽都將在上午 10 點開始，中午結束。新的時間表將發布在我們的網站，以及我們售票處後方的牆上。變更如下：</p>\n<div class=\"document-table-wrap\"><table class=\"document-table\"><tr><th>導覽</th><th>目前舉行星期</th><th>12 月 1 日起的舉行星期</th></tr><tr><td>恐龍與化石</td><td>星期日</td><td>星期一</td></tr><tr><td>我們身邊的科技</td><td>星期一</td><td>星期二</td></tr><tr><td>海洋裡的生命</td><td>星期四</td><td>星期三</td></tr><tr><td>我們在宇宙中的位置</td><td>星期六</td><td>星期五</td></tr></table></div><p>第二，我們的一位志工 James Uttley 博士 1 月時無法帶領他的導覽。如果你願意暫時接手 Uttley 博士，請寄電子郵件告訴我。我需要的就只是有考古學學位。</p>\n</div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>191-195 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-meta\">寄件者：Dale Vinson dalevins@grandvilless.com\n收件者：Michelle Lawrence michlawr@grandvilless.com\n日期：11 月 19 日\n主旨：導覽的機會</div>\n<p>親愛的 Lawrence 小姐：</p>\n<p>雖然我很喜歡自己管理博物館「能量來源」體驗中心的工作，但我很想在 Uttley 博士不在的期間帶領他的導覽。我認為這不會妨礙我的正規工作，因為那個月不會有新的互動展示加到體驗中心。你知道的，我在大學學物理，跟導覽不是直接相關。不過，我很熟悉我們設施的每個展示廳。我也在 Uttley 博士的導覽參加人數因為報名上的錯誤而超過 25 人限制的時候協助過他。如果你想的話，我很樂意午餐時間跟你在員工餐廳進一步討論這件事。如果你想會面的話，請告訴我。</p>\n<p>Dale Vinson\n初級研究員，格蘭維爾科學博物館</p>\n</div></section></div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文</span><span>Questions 196-200</span></div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>✦ ADVERTISEMENT</span><small>196-200 · 1/3</small></div><div class=\"document-body\"><h2 class=\"doc-heading enhanced-heading\">在 Devon 音樂學院滿足你對知識的渴望</h2>\n<p>在 Devon 音樂學院，我們知道學習的渴望在大學畢業後也不會停止。所以，除了為有志成為表演者與作曲家的人提供訓練以外，我們也提供多種由極為勝任的講師所教導的進修教育課程。如果您想藉由對音樂更加理解來提升您的生活，請考慮參加我們即將舉行的音樂史工作坊。</p>\n<div class=\"document-table-wrap\"><table class=\"document-table\"><tr><th>工作坊</th><th>講師</th><th>日期</th><th>費用</th></tr><tr><td>早期義大利歌劇</td><td>Denise Murray</td><td>5 月 6 日</td><td>35 元</td></tr><tr><td>牧歌傳統</td><td>Clayton Higgins</td><td>5 月 13 日</td><td>55 元</td></tr><tr><td>北美民謠</td><td>Lara Wiseman</td><td>5 月 20 日</td><td>40 元</td></tr><tr><td>中東即興音樂</td><td>Zoe Gomez</td><td>5 月 27 日</td><td>60 元</td></tr></table></div><p>關於這些工作坊的額外資訊可以在 www.devonmusicinstitute.com 取得。</p>\n<p>報名請至我們位於 Bedford 大街與 Davis 街路口的設施。</p>\n</div></section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>▣ MEMO</span><small>196-200 · 2/3</small></div><div class=\"document-body\"><div class=\"doc-meta\">收件者：宣傳部人員，Periform 唱片公司\n寄件者：Greg Hong，宣傳部經理，Periform 唱片公司\n日期：4 月 15 日\n主旨：工作坊</div>\n<p>在我們 4 月 10 日的會議，我請你們告訴我，你們認為可以怎樣改善我們的職場。有幾個人提到想得到更多了解音樂的機會。我昨天早上打電話給 Devon 音樂學院，確認了下個月每場定期提供的一日工作坊都會舉行。有興趣參加其中任何一場工作坊的員工，應該報名並且自行付費。然後他們應該跟會計部申請報銷。我想再補充，我上個月跟行銷部和流通部的主管參加了其中一個工作坊——早期義大利歌劇。我們對於討論到的資訊量印象非常深刻。</p>\n</div></section><section class=\"document-card type-email\"><div class=\"doc-ribbon\"><span>✉ EMAIL</span><small>196-200 · 3/3</small></div><div class=\"document-body\"><div class=\"doc-meta\">收件者：Darrel Wilson d.wilson@periform.com\n寄件者：Mandy Parker m.parker@periform.com\n日期：7 月 1 日\n主旨：報銷申請</div>\n<p>親愛的 Wilson 先生：</p>\n<p>我只是想追蹤我的報銷申請。那是為了我 5 月 13 日在 Devon 音樂學院參加的工作坊申請的。您知道我的申請為什麼還沒處理嗎？過去從來沒花超過 3 週。我一個 5 月 20 日在同一家學院參加訓練的同事已經收到他申請的款項。我參加的工作坊是由我的經理 Hong 先生批准的。您可能會想打分機 457 聯絡他來確認這件事。謝謝。</p>\n<p>Mandy Parker</p>\n</div></section></div>"};const DETAILED_EXPLANATIONS={"101":{"type":"文法與語意解析","translation":"社群媒體網站使用者應每隔 60 天重新設定自己的登入密碼。","reason":"空格在名詞（login passwords）前面做修飾，所以能像形容詞一樣修飾名詞的所有格人稱代名詞 (D) 是正確答案。主格人稱代名詞 (A)、受格人稱代名詞 (B)、所有代名詞 (C) 都不能修飾名詞。","paraphrase":"","vocab":"詞：reset v. 重新設定　password n. 密碼"},"102":{"type":"文法與語意解析","translation":"接受顧客點餐時，請記得詢問食物過敏症。","reason":"please 開頭的子句（please ~ allergies）是沒有主詞、以動詞原形開始的祈使句，所以能當祈使句動詞的動詞原形 (B) remember（記得）是正確答案。動名詞或現在分詞 (A)、未來式動詞 (C)、過去式動詞或過去分詞 (D) 不能當祈使句的動詞。另外，請順便區分記住「remember + to 不定詞」（記得要做……）和「remember + 動名詞」（記得做過……）的意思。","paraphrase":"","vocab":"詞：take an order phr. 接訂單，接受點餐　allergy n. 過敏（症）"},"103":{"type":"文法與語意解析","translation":"Holdwell 百貨公司以吸引人的櫥窗展示聞名，尤其在節日期間。","reason":"空格修飾後面的名詞（window displays），所以形容詞 (D) attractive（吸引人的）是正確答案。名詞 (A) 和 (C)、副詞 (B) 不能修飾這裡的名詞。","paraphrase":"","vocab":"詞：be known for phr. 以……聞名　window display phr. 櫥窗展示　particularly adv. 尤其　attraction n. 吸引力，名勝　attractively adv. 吸引人地　attractiveness n. 吸引力（程度）"},"104":{"type":"文法與語意解析","translation":"執行長做出了公司在年底前會將利潤翻倍的樂觀預測。","reason":"句意是「執行長做出了公司在年底前會將利潤翻倍的樂觀預測」，所以形容詞 (D) optimistic（樂觀的）是正確答案。(A) vertical 表示「垂直的」，(B) spacious 表示「寬敞的」，(C) applicable 表示「適用的」。","paraphrase":"","vocab":"詞：prediction n. 預測"},"105":{"type":"文法與語意解析","translation":"因為想要追求在創意方面比較能帶來滿足感的工作，Conway 小姐離開了會計師的工作。","reason":"空格在形容詞（fulfilling）前面做修飾，所以副詞 (A) creatively（有創意地，在創意方面）是正確答案。動詞 (B)、動名詞或現在分詞 (C)、名詞 (D) 都不能修飾形容詞。","paraphrase":"","vocab":"詞：pursue v. 追求，從事　fulfilling adj. 令人滿足的　career n. 職業，經歷　leave v. 離開　accountant n. 會計師　create v. 創造　creation n. 創造，創作"},"106":{"type":"文法與語意解析","translation":"Stonebridge 公寓目前有一戶空房，並可安排參觀。","reason":"句意是「公寓有一戶是空的，那個單位可以參觀」，所以名詞 (D) vacancy（空房，空位）是正確答案。(A) branch 表示「分公司，分店」，(B) condition 表示「狀態，條件」，(C) degree 表示「程度，等級」。","paraphrase":"","vocab":"詞：available adj. 可利用的，可得的　unit n. （公寓之類的共同住宅內的）一戶，一個單位"},"107":{"type":"文法與語意解析","translation":"上午八點的列車通常擠滿了通勤上班的人。","reason":"句意是「上午的列車擠滿通勤上班的人」，所以能和空格前面的 be 動詞（is）、後面的介系詞 with 構成 be crowded with「擠滿……」的形容詞 (B) crowded 是正確答案。(A) disliked 似乎可以解釋成「不受到喜愛」，但如果是這個意思的話，應該搭配介系詞 by 使用才對。(C) clear 表示「清楚的」，(D) calm 表示「平靜的」。","paraphrase":"","vocab":"詞：commute v. 通勤"},"108":{"type":"文法與語意解析","translation":"關於產品品質的顧客詢問必須盡快回答。","reason":"因為要表達「關於產品品質的顧客詢問必須盡快回答」，所以時間副詞 (C) soon（快地，早地）是正確答案。請記得 as soon as possible（盡快）這個慣用表達方式。如果使用 (A) long（久，長）的話，意思會變成「關於產品品質的顧客詢問必須回答得盡量久一點」，所以不對。(A) 和 as 的搭配也不能看成副詞子句連接詞 as long as（只要……）的用法，因為副詞子句連接詞 as long as 後面應該接子句。(B) highly 表示「非常」，(D) always 表示「總是」。","paraphrase":"","vocab":"詞：inquiry n. 詢問"},"109":{"type":"文法與語意解析","translation":"CRG Communications 公司年會的場地將在本週稍後決定。","reason":"句中缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。因為要表達「場地被決定」，而且時間在未來（later this week），所以 (B) will be decided 是正確答案。現在完成式 (C) 不能搭配表示未來時間的詞語使用。如果使用含有助動詞 can 的主動態 (D)，意思會變成「場地可以決定（場地做出決定的行為）」，所以不對。動名詞或現在分詞 (A) 不能當動詞使用。","paraphrase":"","vocab":"詞：venue n. （進行某事的）地點，場地　annual adj. 年度的，每年的　decide v. 決定"},"110":{"type":"文法與語意解析","translation":"Richards 先生很勉強才趕上他報告的截止期限，因為他的行程塞滿會議而非常忙碌。","reason":"句意是「因為行程塞滿會議而非常忙碌，所以很勉強才趕上報告的截止期限」，所以副詞 (B) barely（勉強地，「差一點就做不到」）是正確答案。另外，請記得 barely 也常常當頻率副詞「幾乎不」使用。(A) carefully 表示「小心地」，(C) frequently 表示「頻繁地，經常」，(D) fairly 表示「相當，非常」。","paraphrase":"","vocab":"詞：deadline n. 截止期限"},"111":{"type":"文法與語意解析","translation":"最近有大量貴重的當代藝術收藏被捐給 Beldoni 博物館。","reason":"空格出現在不定冠詞（A）和介系詞（of）中間，並且被形容詞（large）修飾，所以名詞 (C) 和 (D) 是可能的答案。因為要表達「大量貴重的當代藝術收藏被捐給博物館」，所以事物名詞 (C) collection（收藏，收藏品）是正確答案。如果使用人物名詞 (D) collector（收藏者），意思會變成「大型的當代藝術收藏者被捐給博物館」，所以不對。動詞 (A) 和動詞或過去分詞 (B) 不能用在名詞位置。","paraphrase":"","vocab":"詞：valuable adj. 貴重的，寶貴的　contemporary adj. 當代的，同時代的　donate v. 捐贈　collect v. 收集"},"112":{"type":"文法與語意解析","translation":"Godwin 先生的機票訂位已獲確認，但他尚未選好飯店。","reason":"句意是「航班預約確認了，但還沒選擇飯店」，所以動詞 confirm（確認）的 p.p. 形 (D) confirmed 是正確答案。(A) attend 表示「出席」，(B) maintain 表示「維持」，(C) found 表示「創立」。","paraphrase":"","vocab":"詞：have yet to do phr. 還沒做……"},"113":{"type":"文法與語意解析","translation":"大部分公司在網路上打廣告，因為網路對消費者行為有重大的影響。","reason":"句意是「網路對消費者行為有重大的影響」，所以能和空格前面的動詞（has）、後面的介系詞（on）構成 have an influence on「對……有影響」的名詞 (B) influence（影響）是正確答案。(A) direction 表示「方向」，(C) atmosphere 表示「氣氛，大氣」，(D) obligation 表示「義務」。","paraphrase":"","vocab":"詞：significant adj. 重大的　consumer n. 消費者　behavior n. 行為"},"114":{"type":"文法與語意解析","translation":"在成為演員及音樂人之前，Austin 先生在建設業界當電工。","reason":"這個句子已經具備主詞（Mr. Austin）和動詞（worked），是完整的子句，所以 ~ musician 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (A)、(B)、(D) 是可能的答案。因為要表達「在成為演員及音樂人之前」，所以介系詞 (A) Prior to（在……之前）是正確答案。(B) In case of 表示「假如發生……」，(D) In accordance with 表示「符合……」。副詞子句連接詞 (C) Provided that（倘若，如果……）引導的是修飾子句，而不是修飾片語。","paraphrase":"","vocab":"詞：construction n. 建設　electrician n. 電工"},"115":{"type":"文法與語意解析","translation":"為了報名上課，未來的學生必須填寫一些文件。","reason":"句意是「為了報名上課，未來的學生必須填寫一些文件」，所以動詞慣用語 (B) fill out（填妥，填寫）是正確答案。(A) check in 表示「登記報到，登記入住，託運行李」，(C) make over 表示「轉讓，翻新」，(D) give up 表示「放棄」。","paraphrase":"","vocab":"詞：register for phr. 報名……　prospective adj. 未來的，預期的　paperwork n. 文件"},"116":{"type":"文法與語意解析","translation":"這家公司將銷售收入的一定百分比捐給慈善團體，而許多消費者對這項政策表達了敬佩。","reason":"空格是及物動詞（have expressed）的受詞位置，所以名詞 (D) admiration（敬佩）是正確答案。動詞 (A) 和 (C)、動詞或過去分詞 (B) 都不能用在名詞位置。也請記得 express admiration for（對於……表達敬佩）這個慣用表達方式。","paraphrase":"","vocab":"詞：give v. 給　percentage n. 百分比，部分　revenue n. 收入　charity n. 慈善團體　consumer n. 消費者　admire v. 敬佩，讚賞"},"117":{"type":"文法與語意解析","translation":"Harrelson 先生是這個職位的理想人選，因為他擁有工作經驗和必要的學歷。","reason":"能和空格後面的 and 形成相關連接詞 both A and B（A 和 B 都）的 (D) both（兩者都）是正確答案。在這個句子裡，both 連接動詞（possesses）的受詞 work experience 和 the required academic credentials。(A) either 是搭配 or 形成 either A or B（A 或 B 其中一個）。(B) neither 是搭配 nor 形成 neither A nor B（A 和 B 都不）。(C) not only 則是搭配 but 形成 not only A but (also) B（不止 A，B 也是）。","paraphrase":"","vocab":"詞：ideal adj. 理想的　candidate n. 人選，候選者　possess v. 有　work experience phr. 工作經驗　required adj. 必要的　academic credentials phr. 學歷"},"118":{"type":"文法與語意解析","translation":"由於低消費者物價與供給過剩，生產天然氣對許多公司而言不再有利可圖。","reason":"空格是 be 動詞（is）的補語位置，所以能當補語的名詞 (A)、(B)、(D) 和形容詞 (C) 都是可能的答案。句意是「生產天然氣不再有利可圖」，而補語表示主詞（producing natural gas）的狀態，所以形容詞 (C) profitable（可獲利的，有利潤的）是正確答案。如果使用名詞 (A) profitability（獲利能力）的話，表示和主詞相同的事物，意思會變成「生產天然氣不再是獲利能力」，所以不對。複數可數名詞 (B) profits（利潤）不能搭配單數動詞（is）使用，單數可數名詞 (D) profit 必須加上冠詞或使用複數形。","paraphrase":"","vocab":"詞：consumer price phr. 消費者物價　supply n. 供給　surplus n. 過剩　no longer phr. 不再"},"119":{"type":"文法與語意解析","translation":"Sewell Packaging 原本想在俄亥俄州開設工廠，但後來選擇在伊利諾州開設。","reason":"句意是「原本想在俄亥俄州開設工廠，但後來選擇在伊利諾州開設」，所以副詞 (C) instead（反而，而是）是正確答案。(A) yet 表示「尚未，仍」或「然而」，(B) almost 表示「幾乎」，(D) indeed 表示「確實」。","paraphrase":"","vocab":"詞：originally adv. 原本　factory n. 工廠"},"120":{"type":"文法與語意解析","translation":"這些文件證明一家餐廳已經通過檢查，並且符合所有健康與安全標準。","reason":"句意是「這些文件證明餐廳已經通過檢查」，所以動詞 (A) certify（證明）是正確答案。(B) protect 表示「保護」，(C) devise 表示「設計，發明」，(D) qualify 表示「使有資格」。","paraphrase":"","vocab":"詞：inspection n. 檢查　standard n. 標準"},"121":{"type":"文法與語意解析","translation":"對 Soundwave 公司而言，沒有比重新獲得客戶信任更重要的事了。","reason":"因為要表達「沒有比重新獲得客戶信任更重要的事」，所以不定代名詞 (D) nothing（沒有什麼）是正確答案。在這個句子裡，nothing 和比較級表達方式（more important than ~）一起使用，表示「沒有比……更重要的事」，也就是最高級的意義「……最重要」。不定形容詞 (A) other（其他的）表示在已經提過的事物以外的東西，修飾複數可數名詞或不可數名詞。複合關係代名詞或複合關係形容詞 (B) whatever（不管什麼）引導名詞子句，作為句中的主詞或受詞。不定代名詞 (C) anyone 在肯定句中表示「任何人（都……）」，用在這裡會使意思變成「有任何人都比重新獲得客戶信任更重要」，所以不對。","paraphrase":"","vocab":"詞：regain v. 重新獲得，找回"},"122":{"type":"文法與語意解析","translation":"大眾對環境保護的正面態度，已經導致許多企業採取環保的做法。","reason":"因為要表達「大眾對環境保護的正面態度」，所以表示方向的介系詞 (C) toward（朝向，對於……）是正確答案。(A) behind 表示位置「在……後方」，(B) by 表示時間點「在……之前」，(D) like 表示「像，類似……」。","paraphrase":"","vocab":"詞：attitude n. 態度　adopt v. 採取，採納　ecologically friendly phr. 環保的　practice n. 實踐"},"123":{"type":"文法與語意解析","translation":"為公司招募新員工是人力資源部的職責。","reason":"句子裡有動詞（is），但缺少主詞，所以能當主詞的名詞 (B) 和 (C)、動名詞 (D) 是可能的答案。只有動名詞可以接後面的名詞當受詞，所以動詞 recruit 的動名詞形 (D) Recruiting 是正確答案。名詞 (B) 和 (C) 後面不能接受詞，動詞或過去分詞 (A) 不能當主詞。就算把 new staff members 當成主詞、過去分詞 (A) 當成修飾主詞的成分，也會變成錯的意思「被招募的新員工是人力資源部的一項職責」，而且這樣一來因為主詞是複數，所以不能使用單數動詞（is）。","paraphrase":"","vocab":"詞：duty n. 職務，義務　recruit n. 新進員工 v. 招募　recruitment n. 招募"},"124":{"type":"文法與語意解析","translation":"新企業應該考慮參加業界的貿易展來獲得曝光。","reason":"因為要表達「新企業應該考慮參加業界的貿易展來獲得曝光」，所以名詞 (C) exposure（曝光）是正確答案。請記得 gain exposure（獲得曝光）這個慣用表達方式。(A) fluency 表示「流利，流暢」，(B) closure 表示「關閉」，(D) proximity 表示「接近」。","paraphrase":"","vocab":"詞：industry n. 業界，產業界　trade fair phr. 貿易展"},"125":{"type":"文法與語意解析","translation":"想出一家企業與競爭者差異化的方法可能很困難，尤其在全球市場裡。","reason":"這個句子已經有具備主詞（Coming up with ways）、動詞（can be）和補語（challenging）的完整子句，所以 a business ~ competitors 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語，並且在名詞（ways）後面做修飾，表示「差異化的方法」的 to 不定詞 (C) to differentiate 是正確答案。動詞 (A) 和 (D)、名詞 (B) 都不能引導修飾片語。另外，也請記得 way to do（做……的方法）這個慣用表達方式。","paraphrase":"","vocab":"詞：come up with phr. 想出……　challenging adj. 挑戰性的，困難的　differentiate v. 差異化　differentiation n. 區分，變異"},"126":{"type":"文法與語意解析","translation":"花式溜冰選手 Erica Mikhailov 獲得了令人印象深刻的錦標賽高分，很有可能成為新的冠軍。","reason":"句意是「獲得了令人印象深刻的錦標賽高分，而很有可能成為新的冠軍」，所以副詞 (B) impressively（令人印象深刻地）是正確答案。(A) adversely 表示「不利地」，(C) identically 表示「相同地」，(D) importantly 表示「重要地」。","paraphrase":"","vocab":"詞：earn v. 獲得，得到　be likely to do phr. 很有可能做……"},"127":{"type":"文法與語意解析","translation":"根據多位管理專家的說法，事先計畫與排定工作優先順序有助於提高一個人的生產力。","reason":"空格接在所有格（one's）後面，所以名詞 (A)、(B)、(D) 是可能的答案。因為要表達「排定工作優先順序有助於提高生產力」，所以 (B) productivity（生產力）是正確答案。如果使用 (A) product（產品）或 (D) producer（生產者）的話，意思會變成「排定工作優先順序有助於提高產品／生產者」，所以不對。動詞或過去分詞 (C) 不能用在名詞位置。","paraphrase":"","vocab":"詞：according to phr. 根據……　ahead adv. 事先　prioritize v. 排定優先順序　raise v. 提高 n. 提高，加薪"},"128":{"type":"文法與語意解析","translation":"在電影《Monochrome》中飾演歌手 Sabrina Newton 的女演員因為優秀的表演而得獎。","reason":"因為要表達「女演員因為優秀的表演而得獎」，所以表示理由的介系詞 (D) because of（因為……）是正確答案。(A) aside from 表示「除了……以外」，(B) contrary to 表示「和……相反」，(C) together with 表示「和……一起，包含……」。","paraphrase":"","vocab":"詞：win an award phr. 得獎　performance n. 表演，表現"},"129":{"type":"文法與語意解析","translation":"Danvers 小姐不是以低於市場價值的價格賣出她的房子，而是決定暫時出租。","reason":"因為要表達「不是以低於市場價值的價格賣出房子，而是決定暫時出租」，所以比較表達方式 (C) Rather than（而不是……）是正確答案。請注意比較表達方式 Rather than（而不是……）後面可以接動詞原形。Rather than 以 A rather than B（A 而不是 B）的形態使用時，則是像對等連接詞一樣，連接相同的詞性或結構。副詞子句連接詞 (A) Unless（除非）、(B) Only if（只有在……的情況下）、(D) Whether（不管是否……）後面都要接子句才對。","paraphrase":"","vocab":"詞：market value phr. 市場價值　rent out phr. 出租……　temporarily adv. 暫時"},"130":{"type":"文法與語意解析","translation":"這個行動應用程式讓使用者能將物體放大到實際大小的 20 倍。","reason":"句意是「將物體放大到實際大小的 20 倍」，所以動詞 (B) magnify（放大）是正確答案。(A) assume 表示「假定」，(C) provoke 表示「激起」，(D) multiply 表示「使倍增」。","paraphrase":"","vocab":"詞：up to phr. 最高、最大到……（特定的數字、程度）　actual adj. 實際的"},"131":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 131 題空格的選項。","reason":"動詞 reserve（預留）是及物動詞，而空格後面沒有受詞，所以被動態 (B)、(C)、(D) 是可能的答案。句意是「有 10 個車位是預留給訪客的」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到「它們」（訪客車位）有清楚標示，並且位於電梯左邊，所以這 10 個車位是現在已經存在的，現在式 (B) are reserved 是正確答案。未來式 (C) 表示對於未來狀況的推測，或者表示意志，過去進行式 (D) 表示過去特定時間點進行中的事情。主動態 (A) 後面必須要有受詞。","paraphrase":"","vocab":""},"132":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 132 題空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 In the event that they are all occupied, guests should be able to find spots on Trenton Street. 提到，萬一「它們」（訪客車位）全部在使用中，訪客應該能在 Trenton 街找到車位，所以空格的內容應該和訪客停車的地方有關，(C) City parking meters can be found on the sidewalk 是正確答案。","paraphrase":"","vocab":"詞：outstanding adj. 未付款的，優秀的　settle v. 付清欠款　guarantee v. 保證，保障　rental agreement phr. 租賃合約　sidewalk n. 人行道　put in phr. 加進，安裝"},"133":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 133 題空格的選項。","reason":"句意是「未經授權佔用＿＿的車位的車輛將被拖吊」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到，公寓的地下停車場遭到拜訪租戶的訪客不當利用，所以應該是未經許可佔用租戶的車位會被拖吊，名詞 (D) tenants（房客，住戶）是正確答案。(A) employee 表示「員工」，(B) vendor 表示「小販」，(C) customer 表示「顧客」。","paraphrase":"","vocab":""},"134":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 134 題空格的選項。","reason":"空格和逗號一起出現在句子開頭的連接副詞位置，所以要掌握上一句和空格所在句子之間的關係，才能判斷答案。上一句提到未經授權佔用住戶車位的車輛將由管理部門決定拖吊，而空格所在的句子說車主將會被開 25 元的罰單，所以表示對上一句的內容進行補充的連接副詞 (D) Furthermore（而且，此外）是正確答案。(A) For instance 表示「例如」，(B) However 表示「然而，不過」，(C) Nonetheless 表示「儘管如此」，用在這裡意思都不恰當。","paraphrase":"","vocab":""},"135":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 135 題空格的選項。","reason":"空格所在的句子缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。句意是「開發新的行動應用程式」，因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。後面的部分提到，在這個行動應用程式推出以後，有許多使用者下載了，所以開發應用程式是過去發生的事。因此，表示過去發生的事影響力持續至今，或者剛完成某事的現在完成式 (A) has developed 是正確答案。現在進行式 (B) 表示現在進行中的事，未來式 (C) 表示未來發生的事、對未來狀況的預測，或者表示意志。動名詞或現在分詞 (D) 不能當動詞使用。","paraphrase":"","vocab":""},"136":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 136 題空格的選項。","reason":"句意是「它已經在 2 月 1 日被＿＿」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到信用卡公司 Echo 開發了新的行動應用程式，而空格所在句子的下一句又提到在發表後，很快就有將近 50,000 名使用者下載「它」（應用程式），所以應用程式應該是在 2 月 1 日被發表了，動詞 launch（推出，使上市）的 p.p. 形 (B) launched 是正確答案。(A) propose 表示「提議」，(C) design 表示「設計」，(D) finance 表示「提供資金」。","paraphrase":"","vocab":""},"137":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 137 題空格的選項。","reason":"句意是「因為儲存卡片詳細資料與運送資訊，所以完成線上＿＿比以往快得多」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句提到，大部分網站的付款過程現在花費不到 5 秒，由此可知是線上購買的速度變快了，名詞 (C) purchases（購買）是正確答案。(A) return 表示「退貨」，(B) cancellation 表示「取消」，(D) search 表示「搜尋」。","paraphrase":"","vocab":""},"138":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 138 題空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。下一句 We've incorporated cutting-edge security features that should give our clients peace of mind when shopping online 提到，納入了最尖端的安全功能，應該會讓客戶在網路購物時感到放心，所以空格的內容應該和線上交易的安全性有關，(D) Using Echo's application also makes electronic transactions safer 是正確答案。","paraphrase":"","vocab":"詞：dispute v. 對……提出異議　unauthorized adj. 未經授權的　charge n. 收費　merchant n. 商家　valid adj. 有效的　transaction n. 交易"},"139":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 139 題空格的選項。","reason":"能被形容詞最高級（newest）修飾的是名詞，所以名詞 (A)、(C)、(D) 是可能的答案。因為要表達「宣布最新的購物設施 River Reed 購物中心開幕」，所以名詞 (D) facility（設施）是正確答案。如果使用 (A) facilitator（協助者）或 (C) facilitation（便利化、促進）的話，意思會變成「宣布最新的協助者／便利化 River Reed 購物中心開幕」，所以不對。動詞 (B) 不能用在名詞位置。","paraphrase":"","vocab":"詞：facilitate v. 促進，使容易"},"140":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 140 題空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 The ribbon-cutting ceremony will be held at 10:30 A.M. on March 15. 提到，剪綵儀式將於 3 月 15 日上午 10:30 舉行，而下一句 To attend, simply go to Harper Square on Boswell Street 則說，要參加活動，只要到 Boswell 街上的 Harper 廣場，所以空格的內容應該和參加活動的詳細說明有關，(C) It is open to the public and requires no reservations 是正確答案。(A) 和 (B) 雖然看起來也和參加活動有關，但邀請的對象——一般大眾並不會發表演說，而且開幕活動的時間已經定在上午 10:30，並不是可以選擇的，所以都不對。","paraphrase":"","vocab":"詞：conveniently adv. 便利地，方便地　suit v. 適合　require v. 需要　reservation n. 預約　deem v. 認為"},"141":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 141 題空格的選項。","reason":"句意是「要參加活動，只要到 Boswell 街上的 Harper 廣場，然後前往正門」，所以動詞片語 (A) proceed to（前往……）是正確答案。(B) take over 表示「接管」，(C) drive by 表示「開車經過」，(D) point out 表示「指出」。","paraphrase":"","vocab":""},"142":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 142 題空格的選項。","reason":"空格修飾後面的動詞（explore），所以副詞 (C) freely（自由地）是正確答案。形容詞 (A)、名詞 (B) 和 (D) 不能修飾動詞。(A) 雖然也有副詞的用法，但當副詞時只能在動詞後面做修飾，所以不對。","paraphrase":"","vocab":""},"143":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 143 題空格的選項。","reason":"that 子句（that your request ~ approved）是具備主詞（your request）和動詞（has been approved）的完整子句，所以 ~ London Modern Art Gallery 是修飾性的語句。修飾部分沒有動詞，而且修飾空格前面的名詞，所以能引導修飾片語，並且在名詞後面做修飾的 to 不定詞 (A) 和過去分詞 (B) 是可能的答案。因為空格後面有受詞（pictures），而且要表達「為了攝影的申請」，所以 to 不定詞 (A) to take 是正確答案。過去分詞 (B) 不能接空格後面的受詞（pictures）。動詞 (C) 和 (D) 不能引導修飾片語。","paraphrase":"","vocab":""},"144":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 144 題空格的選項。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 Be sure to bring the document enclosed with this letter and present it at the ticket desk when you arrive. 提醒務必攜帶這封信所附的文件，而且抵達時要在售票處出示它，所以空格的內容應該和在美術館攝影的規定有關，(D) Otherwise, you will not be able to bring your camera into the exhibits 是正確答案。(C) 雖然也和攝影有關，但下一句提到要付費用，和這個選項的敘述矛盾。","paraphrase":"","vocab":"詞：renovation n. 整修　indicate v. 指出，標示　neglect v. 沒做（該做的事）　otherwise adv. 否則　exhibit n. 展覽"},"145":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 145 題空格的選項。","reason":"句意是「在申請表上，您提到＿＿將出現在《Globe Traveler》雜誌上」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。前面的部分提到在美術館攝影的申請已經獲得批准，所以會在雜誌出現的應該是照片，正確答案是 (C) images（影像）。(A) map 表示「地圖」，(B) link 表示「連結」，(D) review 表示「評論」。","paraphrase":"","vocab":""},"146":{"type":"文法與閱讀解析","translation":"請依文章上下文，選出最適合填入第 146 題空格的選項。","reason":"句意是「同意＿＿寄給我們一份」，所有選項都是可能的答案。因為只看空格所在的句子無法判斷答案，所以需要參考前後或整篇文章的內容。下一句說期望在出版後的 3 個工作天內收到，所以收件人同意的應該是在出版後很快寄送一份（雜誌），副詞 (A) promptly（立即，迅速地）是正確答案。(B) regularly 表示「定期」，(C) originally 表示「原本」，(D) never 表示「從不，絕不」。","paraphrase":"","vocab":""},"147":{"type":"文法與閱讀解析","translation":"Ellis 小姐最有可能是什麼人？","reason":"這是和題目關鍵詞語 Ms. Ellis 有關的推論問題。Requested by: Anita Ellis 的部分顯示這是 Anita Ellis 填寫的申請表，而 The air conditioner in our marketing research office 的部分提到「我們」行銷研究部的冷氣，由此可以推知 Anita Ellis 是行銷研究部的員工，所以 (C) 是正確答案。","paraphrase":"","vocab":"詞：electrician n. 電工"},"148":{"type":"文法與閱讀解析","translation":"關於 Shiner 電子產品公司，文中暗示什麼？","reason":"這是和題目關鍵詞語 Shiner Electronics 有關的推論問題。Priority: Low: Complete within one week 的部分顯示優先程度低的服務申請會在一週內處理完成，由此可以推知 Shiner 電子產品公司大部分的服務申請會在一週內獲得處理，所以 (D) 是正確答案。","paraphrase":"","vocab":"詞：undergo v. 經歷　maintenance n. 維護，保養　equipment n. 設備　handle v. 處理"},"149":{"type":"文法與閱讀解析","translation":"關於 Cerulean 大樓，文中提到什麼？","reason":"這是和題目關鍵詞語 Cerulean Tower 有關的推論問題。The last remaining ~ apartment at Cerulean Tower is available for rent. 的部分提到，Cerulean 大樓最後剩下的公寓可供出租，由此可以推知 Cerulean 大樓幾乎每個單位都有住戶了，所以 (C) 是正確答案。","paraphrase":"","vocab":"詞：landmark n. 地標，地標建築　refurbish v. 重新裝修　occupy v. 佔用，住（建築物）　transit n. 運輸"},"150":{"type":"文法與閱讀解析","translation":"廣告宣傳的公寓不包含什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 included with the advertised apartment 有關的內容，並且對照選項判斷答案。(A) 在 Rental parking is available in a private garage nearby. 的部分提到，附近有私人停車場可租用停車位，而沒有提到免費停車區域，不符合選項敘述，所以 (A) 是正確答案。(B) 在 The kitchen is equipped with sleek appliances 的部分提到，廚房配備線條俐落的電器設備，符合選項敘述。(C) 在 The property comes with a sofa, coffee table, bed, nightstands 的部分提到，這間公寓附有沙發、咖啡桌、床、床頭櫃，符合選項敘述。(D) 在 Cerulean Tower is a ~ building with a theater and fitness center. 的部分提到，Cerulean 大樓設有電影院與健身中心，符合選項敘述。","paraphrase":"a sofa, coffee table, bed, nightstands 沙發、咖啡桌、床、床頭櫃 → Pieces of furniture 一些家具\ntheater and fitness center 電影院與健身中心 → Recreational facilities 娛樂設施","vocab":""},"151":{"type":"文法與閱讀解析","translation":"Daniels 先生提到什麼問題？","reason":"這是問 Daniels 先生提到什麼（What）問題的 wh- 問題。和題目的關鍵詞語 problem ~ Mr. Daniels mention 有關的部分是 Daniels 先生所說的 are you in the apartment? I need to get in. I left my keys inside.，他問 Sarah Woolf 是否在公寓，因為他需要進去，把鑰匙留在裡面了，所以 (C) 是正確答案。","paraphrase":"get in 進入 → access 進入","vocab":"詞：accidentally adv. 不小心，意外地　access v. 接近，進入 n. 接近，進入　supervisor n. 主管，監督者"},"152":{"type":"文法與閱讀解析","translation":"上午 10:17，Woolf 小姐的「Don't worry about it」意味著什麼？","reason":"這一題問的是 Woolf 小姐的訊息所表達的意圖，所以要掌握引用部分（Don't worry about it）前後文的情境。Eric Daniels 說 I don't want to call a locksmith to unlock the door，表示自己不想叫鎖匠開鎖，對此 Woolf 小姐回應 Don't worry about it.（別擔心），然後補充說 Just call the office downstairs. The building manager keeps a set of keys，表示只要打電話給樓下的辦公室就行了，因為大樓管理員有一套鑰匙。因此，Woolf 小姐要表達的意思是 Daniels 先生不必叫鎖匠，(B) 是正確答案。","paraphrase":"","vocab":"詞：material n. 材料，資料　cover v. 代替，頂替（例如請假不能上班的人值班）"},"153":{"type":"文法與閱讀解析","translation":"這則通知的一個目的是什麼？","reason":"這一題問的是這則通知的目的，所以要注意文章開頭的部分。We are sorry to report to Waltrop Leisure Center members that our pool closure will be extended. We have ~ decided to retile the entire pool. 的部分，很遺憾地向 Waltrop 休閒中心的會員報告，游泳池的關閉期間將會延長，並且已經決定重鋪整座游泳池的瓷磚，之後的部分則是說明和施工有關的事項，所以 (B) 是正確答案。","paraphrase":"","vocab":""},"154":{"type":"文法與閱讀解析","translation":"關於 Waltrop 休閒中心，文中暗示什麼？","reason":"這是和題目關鍵詞語 Waltrop Leisure Center 有關的推論問題。Members who have paid for swimming lessons in advance can ~ credit their payments toward future lessons. 的部分提到，已經預先支付游泳課費用的會員，可以用已付的金額抵用未來的課程，由此可以推知 Waltrop 休閒中心提供課程，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"155":{"type":"文法與閱讀解析","translation":"Benedict 先生昨天做了什麼？","reason":"這是問 Benedict 先生昨天做了什麼（What）的 wh- 問題。和題目的關鍵詞語 Mr. Benedict do yesterday 有關的部分是 Tanya Huang 所說的 I understand you sent a request for assistance yesterday regarding our accounting software.，這部分說自己知道 Benedict 先生昨天對於會計軟體提出了支援申請，所以 (D) 是正確答案。","paraphrase":"sent a request for assistance 提出支援申請 → Contacted a customer support service 聯絡顧客支援服務","vocab":""},"156":{"type":"文法與閱讀解析","translation":"Benedict 先生做什麼遇到了困難？","reason":"這是問 Benedict 先生做什麼（What）遇到了困難的 wh- 問題。和題目的關鍵詞語 Mr. Benedict having trouble doing 有關的部分是 Tanya Huang 說的 I understand you sent a request for assistance ~ regarding our accounting software.，這部分說自己知道 Benedict 先生昨天對於會計軟體提出了支援申請，而 Benedict 先生回應 That's correct. I can't figure out how to transfer some data in an Analyte file to Upcell.，表示的確申請了支援，並且說明自己找不到把 Analyte 檔的一些資料轉移到 Upcell 的方法，所以 (D) 是正確答案。","paraphrase":"transfer some data 轉移一些資料 → Sharing information between programs 在程式間分享資訊","vocab":"詞：locate v. 找出……的位置　misplaced adj. （因為隨便亂放而）弄丟的　account n. 帳戶　essential adj. 必要的　information n. 資訊"},"157":{"type":"文法與閱讀解析","translation":"上午 10:07，Benedict 先生的「That's the thing」最有可能意味著什麼？","reason":"這一題問的是 Benedict 先生的訊息所表達的意圖，所以要掌握引用部分（That's the thing）前後文的情境。Tanya Huang 說 You need to click on \"File,\" choose \"Export,\" and select \"Upcell\" from the list.，告知應該點擊「檔案」，選擇「匯出」，並且從列表中選擇「Upcell」，但 Benedict 先生回應 That's the thing.（那就是問題所在），並且接著說 I tried that but it didn't work.，表示自己試了那個方法，但沒有用，意味著 Benedict 先生已經試過 Tanya Huang 教導的方法，所以 (B) 是正確答案。","paraphrase":"","vocab":"詞：release v. 發行　attempt v. 企圖，試圖　redeem v. 兌現，兌換　make a compromise phr. 妥協"},"158":{"type":"文法與閱讀解析","translation":"Huang 小姐要求 Benedict 先生做什麼？","reason":"這是問 Huang 小姐要求 Benedict 先生做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Huang ask Mr. Benedict to do 有關的部分是 I can connect you to our billing department, but you'll need to have your credit card ready.，這部分說可以幫忙轉接帳務部，需要準備好信用卡，所以 (C) 是正確答案。","paraphrase":"have your credit card ready 準備好信用卡 → Prepare to make a payment 準備付款","vocab":"詞：mailing n. 郵寄　renew v. 更新　expired adj. 到期的　subscription n. 訂閱　make a payment phr. 付款"},"159":{"type":"文法與閱讀解析","translation":"這封電子郵件主要是關於什麼？","reason":"這一題問的是這篇文章的主題，所以要注意文章開頭的部分。Thank you for agreeing to participate in Branca Fitness's focus group on exercise equipment. 的部分，感謝同意加入 Branca Fitness 關於運動器材的焦點團體訪談，之後則詳細說明焦點團體訪談的細節，所以 (B) 是正確答案。","paraphrase":"","vocab":"詞：preparation n. 準備　trade fair phr. 貿易展　detail n. 細節 v. 詳述"},"160":{"type":"文法與閱讀解析","translation":"Carpenter 小姐被鼓勵做什麼？","reason":"這是問 Carpenter 小姐被鼓勵做什麼（What）的 wh- 問題。和題目的關鍵詞語 Ms. Carpenter encouraged to do 有關的部分是 Please make sure to wear comfortable clothing，這部分要求穿著舒適的衣服，所以 (C) 是正確答案。","paraphrase":"clothing 衣服 → outfit 服裝","vocab":"詞：appropriate adj. 適當的　outfit n. 全套服裝"},"161":{"type":"文法與閱讀解析","translation":"以下句子最適合放在文章標示的 [1]、[2]、[3]、[4] 哪個位置？「這將需要兩到三天。」","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「這會花 2 到 3 天的時間」，所以應該會出現在和花費時間有關的部分。[4] 的上一句 a payment of $150 will be provided to each participant via bank transfer 提到，150 元的款項將透過銀行轉帳提供給每位參加者。將句子填入 [4] 的位置之後，可以表達「150 元的款項將透過銀行轉帳提供給每位參加者，這個過程會花 2 到 3 天的時間」，文意通順，所以 (D) 是正確答案。","paraphrase":"","vocab":""},"162":{"type":"文法與閱讀解析","translation":"網頁包含什麼資訊？","reason":"這是問網頁包含什麼（What）資訊的 wh- 問題。和題目的關鍵詞語 information 有關的部分是 Maksma was founded 15 years ago in Estonia, with the goal of making it easier for people to shop online. When its original office opened, it had just 46 staff members.，這部分提到 Maksma 公司 15 年前創立於愛沙尼亞，目標是讓人們在網路上購物更容易，而最初的辦公室開設時，它只有 46 名員工，這些資訊和公司的一開始有關，所以 (C) 是正確答案。","paraphrase":"","vocab":"詞：investment n. 投資　share n. 股票，股份　business partner phr. 商業夥伴"},"163":{"type":"文法與閱讀解析","translation":"根據網頁，Maksma 公司帶給顧客什麼好處？","reason":"這是問根據網頁，Maksma 公司帶給顧客什麼（What）好處的 wh- 問題。和題目的關鍵詞語 benefit ~ Maksma 有關的部分是 Maksma differentiates itself by giving customers the option to pay ~ later, or in partial amounts over a specified period of time.，這部分提到 Maksma 公司藉由為顧客提供延後付款或者在指定期間付部分金額的選擇來達到差異化，所以 (C) 是正確答案。","paraphrase":"pay ~ later, or in partial amounts over a specified period of time 延後付款或者在指定期間付部分金額 → ability to defer payments 延後付款的權利","vocab":"詞：negotiated adj. 協議的　defer v. 推遲，延期　used good phr. 二手商品"},"164":{"type":"文法與閱讀解析","translation":"關於 Maksma 公司，文中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Maksma 有關的內容，並且對照選項判斷答案。(A) 在 Its more than 1,500 employees are led by an international team of executives. 的部分提到，公司超過 1,500 名的員工由國際化的經營團隊帶領，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章裡沒有提到。","paraphrase":"international team of executives 國際化的經營團隊 → senior managers from various countries 來自多個國家的高階管理者","vocab":"詞：employ v. 雇用　senior manager phr. 高階管理者　vendor n. 銷售者　introduce v. 引入，採用"},"165":{"type":"文法與閱讀解析","translation":"關於 Fillyan Master，文中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Fillyan Master 有關的內容，並且對照選項判斷答案。(A)、(B)、(C) 在文章裡沒有提到。(D) 在 It enables you to use a phone or tablet to monitor and manage audiovisual equipment, lighting, room temperature 的部分提到，「它」（Fillyan Master）讓使用者能用手機或平板監控並管理視聽設備、照明、室內溫度，符合選項敘述，所以 (D) 是正確答案。","paraphrase":"phone or tablet （行動）電話或平板 → mobile devices 行動裝置","vocab":"詞：operate v. 操作"},"166":{"type":"文法與閱讀解析","translation":"小冊子沒有提到 Fillyan Master 的什麼功能？","reason":"這是 Not/True 題型，要找出和關鍵詞語 function of Fillyan Master 有關的內容，並且對照選項判斷答案。(A) 在 collaborate with others by accessing voice and video channels from anywhere that has wireless Internet. 的部分提到，可以從任何有無線網路的地方，透過語音與影像管道與他人協作，符合選項敘述。(B) 在 Fillyan Master ~ enables you to collect data about ~ energy usage. 的部分提到，Fillyan Master 讓使用者能收集關於能源使用的資料，符合選項敘述。(C) 在文章裡沒有提到，所以 (C) 是正確答案。(D) 在 Program your window shades in order to maximize their cooling potential at various times of the day. 的部分提到，為電動窗戶遮陽簾編寫程式，藉以在一天中的各種時間將降溫能力最大化，符合選項敘述。","paraphrase":"collect data 收集資料 → gathers information 收集資訊","vocab":"詞：remote adj. 遠距的，遙遠的　gather v. 收集　optimal adj. 最佳的　layout n. 室內格局　adjust v. 調整"},"167":{"type":"文法與閱讀解析","translation":"有些顧客會為了什麼打熱線電話號碼？","reason":"這是問有些顧客會為了什麼（Why）打熱線電話號碼的 wh- 問題。和題目的關鍵詞語 some customers call a hotline number 有關的部分是 call our hotline ~ to schedule a demonstration，這部分提到打熱線電話安排示範操作的時間，所以 (B) 是正確答案。","paraphrase":"schedule a demonstration 安排示範操作的時間 → arrange a product presentation 安排產品簡報","vocab":"詞：quantity n. 量　arrange v. 安排　inspection n. 檢查　obtain v. 獲得"},"168":{"type":"文法與閱讀解析","translation":"以下句子最適合放在文章標示的 [1]、[2]、[3]、[4] 哪個位置？「這為觀眾參與創造了新的可能性。」","reason":"這是要依照前後文內容選擇句子適當位置的題目。題目所給的句子「這在觀眾參與方面創造新的可能」，所以應該會出現在和觀眾參與方式有關的部分。[3] 的上一句 Several participants can simultaneously view and collaborate on a presentation using a laptop or smart device. 提到，幾位參與者可以用筆記型電腦或智慧型裝置同時觀看簡報並協作。將句子填入 [3] 的位置之後，可以表達「參與者可以用筆記型電腦或智慧型裝置同時觀看簡報並協作，這樣會在觀眾參與方面創造新的可能」，文意通順，所以 (C) 是正確答案。","paraphrase":"","vocab":"詞：when it comes to phr. 說到……方面　involvement n. 參與，投入"},"169":{"type":"文法與閱讀解析","translation":"第 1 段第 5 行的單字「draw」，意思最接近","reason":"draw 所在的語句 she would later draw inspiration for her writing 之中，draw 表示「獲得」的意思，所以意思最接近、表示「收集」的 (A) 是正確答案。","paraphrase":"","vocab":""},"170":{"type":"文法與閱讀解析","translation":"關於《There and Back》，文中暗示什麼？","reason":"這是和題目關鍵詞語 There and Back 有關的推論問題。Originally from Louisiana 的部分表示 Foster 小姐出生在路易斯安那州，而 Her current work in progress, tentatively titled There and Back, is set in the town of her birth. 的部分提到她目前進行中的作品暫定標題為《There and Back》，而背景設定在她出生的城市，由此可以推知《There and Back》的故事發生在 Foster 小姐出生的路易斯安那州，所以 (A) 是正確答案。","paraphrase":"","vocab":""},"171":{"type":"文法與閱讀解析","translation":"關於 Foster 小姐，何者不正確？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Ms. Foster 有關的內容，並且對照選項判斷答案。(A) 在 Ms. Foster began her career by contributing short stories to magazines across the country. 的部分提到，Foster 小姐透過向全國各地雜誌投稿短篇故事，開始了她的寫作生涯，符合選項敘述。(B) 在 Ms. Foster's books have been translated into over 20 languages. 的部分提到，Foster 小姐的書已經被翻譯成超過 20 種語言，符合選項敘述。(C) 在 a four-volume tale, The Darkening Brow, which was made into an animated movie 的部分提到，由四本書構成的《The Darkening Brow》被改編成動畫電影，符合選項敘述。(D) 在 Her short story Bear in the Creek won an award from the Montana Arts Council. 的部分提到，她的短篇故事《Bear in the Creek》贏得了蒙大拿藝術委員會的獎項，但文章內容無法判斷這是不是她就讀大學時發生的事，所以 (D) 是正確答案。","paraphrase":"","vocab":"詞：story n. 故事　publication n. 刊物，出版物　foreign adj. 外國的"},"172":{"type":"文法與閱讀解析","translation":"Holmes 先生為什麼寫這封電子郵件？","reason":"這一題問的是 Holmes 先生寫電子郵件的理由，所以要注意文章開頭的部分。I am writing to you about the experience I had while travelling with SwissLux Airlines. 的部分提到，寫這封信是要告知搭乘 SwissLux 航空的經驗，而最後一段的 Anyway, the whole experience left me feeling very disappointed. 表達對整個經驗感覺非常失望，所以 (D) 是正確答案。","paraphrase":"","vocab":"詞：inquire v. 詢問　report v. 報告　baggage n. 行李"},"173":{"type":"文法與閱讀解析","translation":"關於 SwissLux 航空，可以推知什麼？","reason":"這是和題目關鍵詞語 SwissLux Airlines 有關的推論問題。I am referring specifically to Flight 293 from Zurich to Singapore 的部分提到自己指的是從蘇黎世到新加坡的 293 航班，由此可以推知 SwissLux 航空提供蘇黎世和新加坡之間的直飛航線，所以 (B) 是正確答案。","paraphrase":"","vocab":"詞：direct route phr. 直達路線　serve v. 供應"},"174":{"type":"文法與閱讀解析","translation":"第 2 段第 4 行的單字「bear」，意思最接近","reason":"bear 所在的語句 the entertainment system was not working at all, which made the long flight more difficult to bear 之中，bear 表示「忍受」的意思，所以同樣能表示「忍受」的 (D) 是正確答案。","paraphrase":"","vocab":""},"175":{"type":"文法與閱讀解析","translation":"關於 Holmes 先生，文中暗示什麼？","reason":"這是和題目關鍵詞語 Mr. Holmes 有關的推論問題。I have been a longtime member of your airline's loyalty program and have always been satisfied by the level of service I've received. 的部分提到自己是「你們航空公司」（SwissLux 航空）忠誠計畫的長期會員，並且一直對服務感到滿意，由此可以推知 Holmes 先生以前曾經搭乘 SwissLux 航空，所以 (C) 是正確答案。","paraphrase":"","vocab":"詞：reimbursement n. 賠償，退款"},"176":{"type":"文法與閱讀解析","translation":"什麼不是 Soleil 遊輪提供給員工的福利？","reason":"這是 Not/True 題型，要找出和關鍵詞語 a benefit that Soleil Cruises offers its workers 有關的內容，並且對照選項判斷答案，所以要看 Soleil 遊輪的徵人廣告（第一篇文章）。(A) 和 (D) 在 we provide staff with accommodation and breakfast, lunch, and dinner each day 的部分提到，「我們」（Soleil 遊輪）提供員工每天的住宿與早、午、晚餐，符合選項內容。(B) 在 we also cover medical insurance 的部分提到也負擔醫療保險，符合選項內容。(C) 在文章裡沒有提到，所以 (C) 是正確答案。","paraphrase":"breakfast, lunch, and dinner 早、午、晚餐 → Daily meals 每日餐點\nmedical insurance 醫療保險 → Health coverage 健康保險\nprovide ~ accommodation 提供住宿 → Free lodging 免費住宿","vocab":"詞：tuition n. 學費　lodging n. 寄宿"},"177":{"type":"文法與閱讀解析","translation":"什麼是兩個職缺的共同必要條件？","reason":"這是問什麼（What）是兩個職缺的共同必要條件的 wh- 問題，所以要針對題目關鍵詞語 a requirement of both job openings 從說明的徵人廣告（第一篇文章）找出相關內容。徵人廣告中的 Spa specialist ~ required to have served on a cruise ship in the past 顯示 spa 專家必須要有在遊輪船上服務的經驗，而 Restaurant manager ~ have held a similar position on a cruise ship for at least two years 也顯示餐廳經理要有在遊輪船上擔任類似職位至少兩年的經驗，所以 (D) 是正確答案。","paraphrase":"","vocab":"詞：willingness n. 願意　fulfill v. 滿足　familiarity n. 熟悉　acquisition n. 取得，獲得"},"178":{"type":"文法與閱讀解析","translation":"信件的一個目的是什麼？","reason":"這一題問的是信件（第二篇文章）的主題。You'll be working six days a week for a period of nine months, from January to September. Then you will have the next three months off before beginning a new assignment. 的部分提到，「您」（Bates 先生）會在 1 月到 9 月的 9 個月期間每週工作 6 天，而在開始新的工作之前會有 3 個月的休假，所以 (B) 是正確答案。","paraphrase":"","vocab":"詞：praise v. 讚美　educational background phr. 教育背景，學歷　propose v. 提議　alternate adj. 交替的 v. 輪流，交替"},"179":{"type":"文法與閱讀解析","translation":"關於 Bates 先生，文中暗示什麼？","reason":"這是需要對照兩篇文章內容的推論題型，先看寄給題目關鍵詞語 Mr. Bates 的信件。\n線索1：信件（第二篇文章）中，I ~ would like to offer you the position. As I mentioned, managerial staff schedules are demanding. 的部分提到，想把這個職位提供給「您」（Bates 先生），以及之前提過管理職員工的時間安排負擔很重，由此可知 Bates 先生得到了管理職的工作邀約。不過，這裡沒有提到管理職的其他資訊，所以還需要參考徵人廣告的內容。\n線索2：徵人廣告（第一篇文章）中，employees at the managerial level may bring their spouse and children on board free of charge 的部分提到，管理階層的員工可以免費帶配偶與小孩上船。\n綜合這兩個線索，可知 Bates 先生接受管理職之後，可以免費帶配偶與小孩上船，所以 (D) 是正確答案。","paraphrase":"","vocab":"詞：résumé n. 履歷"},"180":{"type":"文法與閱讀解析","translation":"關於廚房員工，Lauzone 先生提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 Mr. Lauzone indicate about kitchen staff 有關的內容，並且對照選項判斷答案，要看的是 Lauzone 先生所寫的信件（第二篇文章）。(A) 在 most of our kitchen and wait staff are students who work for two or three months at a time 的部分提到，大部分廚房與服務人員是一次工作 2、3 個月的學生，而且 such a high turnover rate 的部分提到很高的人員流動率，符合選項敘述，所以 (A) 是正確答案。(B)、(C)、(D) 在文章中沒有提到。","paraphrase":"","vocab":"詞：tend to do phr. 傾向於做……　various adj. 多樣的"},"181":{"type":"文法與閱讀解析","translation":"資訊的目的是什麼？","reason":"這一題問的是資訊（第一篇文章）的目的。If you are unhappy with one of our products, you may return it for a refund or exchange it for another item. The following terms and conditions apply to purchases made through our Web site and at any of our 28 stores nationwide 的部分提到，如果對產品不滿意，可以退貨要求退款，或者換成其他產品，並且說明以下條款適用於透過網站以及全國 28 家店面中任何一家購買的產品。之後的部分是對於退款與換貨的詳細說明，所以 (C) 是正確答案。","paraphrase":"terms and conditions 條款 → policies 政策","vocab":"詞：incentive n. 獎勵措施　concern n. 擔憂　merger n. 合併"},"182":{"type":"文法與閱讀解析","translation":"關於 Polson 電子產品公司，資訊中沒有提到什麼？","reason":"這是 Not/True 題型，要找出和題目關鍵詞語 Polson Electronics 相關的內容，所以要看提供這家公司相關資訊的資訊（第一篇文章）。(A) 和 (C) 在 The following terms and conditions apply to purchases made through our Web site and at any of our 28 stores nationwide 的部分提到，以下條款適用於透過網站以及全國 28 家店面中任何一家購買的產品，符合選項敘述。(B) 在文章中沒有提到，所以 (B) 是正確答案。(D) 在 Discounted products cannot be returned. 的部分提到，折扣產品不可退貨，符合選項敘述。","paraphrase":"","vocab":"詞：branch n. 分店　throughout prep. 遍及　implement v. 實施　prohibit v. 禁止　sale item phr. 特賣商品"},"183":{"type":"文法與閱讀解析","translation":"關於 Yang 小姐，何者最有可能是正確的？","reason":"這是需要對照兩篇文章內容的推論題型，先看題目的關鍵詞語 Ms. Yang 填寫的表單。\n線索1：表單（第二篇文章）中，I decided to put it back in its box and return it 的部分提到，「我」（Yang 小姐）決定把「它」（購買的印表機）放回箱子並且退貨。不過，從這裡看不出 Yang 小姐退回印表機之後會發生什麼事，所以還需要參考資訊的內容。\n線索2：資訊（第一篇文章）中，Items that have been removed from their packaging can only be returned in exchange for store credit. 的部分提到，已經從包裝取出的產品，只能退回後換取店內抵用金。\n綜合這兩個線索，可知把購買的印表機取出使用後再放回箱子退貨的 Yang 小姐，會得到店內抵用金，所以 (C) 是正確答案。","paraphrase":"","vocab":""},"184":{"type":"文法與閱讀解析","translation":"Yang 小姐為什麼要退回印表機？","reason":"這是問 Yang 小姐為什麼（Why）要退回印表機的 wh- 問題，所以要看 Yang 小姐填寫的表單（第二篇文章）。表單中的 I realized that it has compatibility issues with my computer 提到，「我」（Yang 小姐）了解到「它」（購買的印表機）和電腦有相容性問題，所以 (B) 是正確答案。","paraphrase":"has compatibility issues with ~ computer 和電腦有相容性問題 → is incompatible with another device 和其他設備不相容","vocab":"詞：fit in phr. 適合　incompatible adj. 不相容的　recall v. 召回　manufacturer n. 製造商"},"185":{"type":"文法與閱讀解析","translation":"Yang 小姐要求什麼資訊？","reason":"這是問 Yang 小姐要求什麼（What）資訊的 wh- 問題，所以要看 Yang 小姐填寫的表單（第二篇文章）。表單中的 Please let me know by e-mail when exactly you will begin selling it. 要求用電子郵件告知會開始販售「它」（即將上市的 Sonicall MDM-0）的確切時間，所以 (C) 是正確答案。","paraphrase":"begin selling 開始販售 → be on sale（被）發售","vocab":"詞：sales assistant phr. 銷售人員　specific adj. 特定的，具體的"},"186":{"type":"文法與閱讀解析","translation":"Lima 醫師為什麼會獲得獎項？","reason":"這是問 Lima 醫師為什麼（Why）會獲得獎項的 wh- 問題，所以要看和題目關鍵詞語 Dr. Lima be receiving an award 有關的通知（第一篇文章）。通知中的 We are honoring him because he launched a national health campaign to alert the population about a new strain of flu virus last year. 提到，之所以表揚「他」（Lima 醫師），是因為去年發起全國性的健康活動來提醒民眾注意新種流感病毒這件事，所以 (B) 是正確答案。","paraphrase":"launched a national health campaign 發起了全國性的健康活動 → raised awareness about a medical issue 提高了對於一個醫療問題的認知度","vocab":"詞：overseas adv. 在海外 adj. 海外的，國外的　raise awareness about phr. 提高對於（議題等）的認知度　praise v. 稱讚　operate v. 經營"},"187":{"type":"文法與閱讀解析","translation":"關於玻利維亞衛生組織，文中提到什麼？","reason":"這是 Not/True 題型，要找出和關鍵詞語 the Bolivian Health Organization 有關的內容，並且對照選項判斷答案，所以看提到這個組織的通知（第一篇文章）。(A)、(B)、(D) 在文章中沒有提到。(C) 在 Due to his insistence, the Bo document.addEventListener('keydown', function(event) {
  const target = event.target;
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      target?.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(target?.tagName)) return;
  if (window.getSelection()?.toString()) return;
  // 鍵盤：←／Z 上一題，→／X 下一題；輸入欄位和文字選取時不啟用。
  const key = event.key.toLowerCase();

    event.preventDefault(); $('#next').click();
  } else if ((key === 'arrowleft' || key === 'z') && !$('#prev').disabled) {
    event.preventDefault(); $('#prev').click();
  }
});

let swipeStart = null;
const swipeArea = '#quiz .stem, #quiz .answers, #quiz .feedback, #quiz .undo-answer-row';
const quizTouch = document.getElementById('quiz');
quizTouch.addEventListener('touchstart', event => {
  swipeStart = null;
  if (event.touches.length !== 1 || !event.target.closest(swipeArea)) return;
  if (event.target.closest('a, input, textarea, select')) return;
  const touch = event.touches[0];
  swipeStart = {x:touch.clientX, y:touch.clientY, time:Date.now()};
}, {passive:true});
quizTouch.addEventListener('touchend', event => {
  if (!swipeStart || event.changedTouches.length !== 1) {swipeStart=null;return;}
  const start = swipeStart; swipeStart=null;
  const touch=event.changedTouches[0];
  const dx=touch.clientX-start.x, dy=touch.clientY-start.y;
  // 至少水平移動 65px，且水平位移須明顯大於垂直位移。
  if (Math.abs(dx)<65 || Math.abs(dx)<Math.abs(dy)*1.6 || Date.now()-start.time>1500) return;
  if (window.getSelection()?.toString()) return;
  if (dx<0 && !$('#next').disabled) $('#next').click();
  else if (dx>0 && !$('#prev').disabled) $('#prev').click();
}, {passive:true});

function parseCsv(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quotes=false;for(let i=0;i<text.length;i++){let c=text[i];if(quotes){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quotes=false;else field+=c}else if(c==='"')quotes=true;else if(c===','){row.push(field);field=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(quotes)throw Error('CSV 引號未關閉');row.push(field);if(row.some(x=>x!==''))rows.push(row);return rows}
