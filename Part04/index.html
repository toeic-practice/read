n Internet connection at its booth."],"group":"186-190","answer":"A","explanation":"正確答案：(A) It has multiple overseas offices."},{"id":191,"part":7,"stem":"Why was the article written?","choices":["To propose a technological solution","To criticize the handling of a situation","To describe some policy changes","To announce the hiring of an executive"],"group":"191-195","answer":"C","explanation":"正確答案：(C) To describe some policy changes"},{"id":192,"part":7,"stem":"What can Dorwing Air passenger service agents do if a flight is overbooked?","choices":["Provide hotel accommodations","Offer discount vouchers","Contact partner airlines","Cancel unconfirmed reservations"],"group":"191-195","answer":"B","explanation":"正確答案：(B) Offer discount vouchers"},{"id":193,"part":7,"stem":"What are ticket holders who give up their seats just before boarding entitled to?","choices":["A seat upgrade","A sum of up to $1,000","Entry to premium waiting space","Extra mileage points"],"group":"191-195","answer":"B","explanation":"正確答案：(B) A sum of up to $1,000"},{"id":194,"part":7,"stem":"What is suggested about Mr. Hunt?","choices":["He will go directly from an airport to an office.","He was able to reach an agreement with a new client.","He was in Roystonville for several days.","He was given access to an exclusive waiting area."],"group":"191-195","answer":"D","explanation":"正確答案：(D) He was given access to an exclusive waiting area."},{"id":195,"part":7,"stem":"What does Mr. Hopps ask Ms. Kreeger to do?","choices":["Ensure that a file is correct","Meet with representatives of a partner company","Forward a flight itinerary","Book an international flight"],"group":"191-195","answer":"A","explanation":"正確答案：(A) Ensure that a file is correct"},{"id":196,"part":7,"stem":"Why did Ms. Walker contact Dr. Fraser?","choices":["To invite him to become a member of a society","To schedule a symposium at a university","To request his participation in a conference","To critique a newly developed system"],"group":"196-200","answer":"C","explanation":"正確答案：(C) To request his participation in a conference"},{"id":197,"part":7,"stem":"What is suggested about the panel discussion on scanning technology?","choices":["It was held on April 24.","It featured a surprise guest.","It was attended by a large audience.","It included a technical demonstration."],"group":"196-200","answer":"A","explanation":"正確答案：(A) It was held on April 24."},{"id":198,"part":7,"stem":"According to the announcement, why should some people visit a Web site?","choices":["To provide some feedback","To upload some photographs","To view a seating chart","To complete a transaction"],"group":"196-200","answer":"D","explanation":"正確答案：(D) To complete a transaction"},{"id":199,"part":7,"stem":"What did Dr. Brown probably receive for free from Eden Lake Hotel?","choices":["A computer accessory","Access to a fitness center","Unlimited Internet usage","A treatment at a spa"],"group":"196-200","answer":"B","explanation":"正確答案：(B) Access to a fitness center"},{"id":200,"part":7,"stem":"What is indicated about Dr. Brown?","choices":["She traveled with some coworkers.","She drove a rental car during her stay in Auckland.","She booked flights with two different airlines.","She spent $23 to reach Centennial Hotel."],"group":"196-200","answer":"C","explanation":"正確答案：(C) She booked flights with two different airlines."}],"groups":{}};const QS=DATA.questions, GROUPS=DATA.groups;const GROUP_HTML={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 131–134 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-manual\"><div class=\"doc-ribbon\"><span>INSTRUCTIONS<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>To replace a printer cartridge, start by opening the top of the printer. This will cause the ink cartridges to move to the center of the printing area and then stop. <strong class=\"blank-number\">131<\/strong> It should slide out easily. <strong class=\"blank-number\">132<\/strong> you have your new cartridge ready, shake it to move the ink around. This will ensure even color <strong class=\"blank-number\">133<\/strong>. Next, look for a piece of protective tape sealing the bottom. This must be peeled off prior to use. Otherwise, the ink will not be <strong class=\"blank-number\">134<\/strong>. Finally, close the top of the printer and print a few test pages to make sure that the colors match those on the monitor.<\/p>\n<\/div><\/section><\/div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 135–138 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-webpage\"><div class=\"doc-ribbon\"><span>WEB PAGE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><div class=\"browser-chrome\"><span class=\"browser-dots\">● ● ●<\/span><span>WEBSITE &nbsp; • &nbsp; TOEIC Practice<\/span><\/div><p><a href=\"http://www.weissert.com/\">http://www.weissert.com<\/a><\/p>\n<p>HOME | ABOUT | ACCOUNT | HELP | CONTACT US<\/p>\n<p>Weissert Antivirus safeguards computers and networks. Since it was launched five years ago, it has become one of the leading forms of protection against viruses and malware. Download a free <strong class=\"blank-number\">135<\/strong> version today. You'll get full access to our services on any single device for 90 days. At the end of this period, you can easily <strong class=\"blank-number\">136<\/strong> the service. Simply choose a subscription plan, and enter your payment information. <strong class=\"blank-number\">137<\/strong> That's all there is to it. <strong class=\"blank-number\">138<\/strong> 90 days, we won't charge you at all. To start your installation, click here.<\/p>\n<\/div><\/section><\/div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 139–142 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL CORRESPONDENCE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">To<\/span><span>Cynthia Ryerson cynry@terratiles.com<\/span><\/div><div><span class=\"mail-key\">From<\/span><span>Alex Jones jones@jonesinteriors.com<\/span><\/div><div><span class=\"mail-key\">Date<\/span><span>November 18<\/span><\/div><div><span class=\"mail-key\">Subject<\/span><span>Purchase order<\/span><\/div><\/div><p>Dear Ms. Ryerson,<\/p>\n<p>I appreciate your sending the tile <strong class=\"blank-number\">139<\/strong> as requested. The actual products look better than they do on your Web site. I visited my client and showed them to her. Although she was impressed with the stone and ceramic tiles, she found neither of these options <strong class=\"blank-number\">140<\/strong>. On the other hand, the terra-cotta tiles are exactly what she is looking for. <strong class=\"blank-number\">141<\/strong> will complement her Mediterranean-themed restaurant perfectly.<\/p>\n<p>I've provided you with the measurements, so could you tell me what the total price will be for the materials and installation? <strong class=\"blank-number\">142<\/strong> I believe my client is expecting her furniture and appliances to arrive in two weeks, so it would be best to do the installation before then.<\/p>\n<p>Thanks again, and I hope to hear from you soon.<\/p>\n<p>Alex Jones\nJones Interiors<\/p>\n<\/div><\/section><\/div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 143–146 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>NEWS & ARTICLES<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>Jackson City is showing strong signs of an economic recovery, attracting a great influx of both residents and businesses. This growth is due to the sale of a 3.7-million-square-foot plot of land along Highway 34 that <strong class=\"blank-number\">143<\/strong> accommodated Sibbet Manufacturing. The company went bankrupt after three years of operation and closed its doors over a decade ago, leaving the infrastructure on the property unused. The new proprietors plan <strong class=\"blank-number\">144<\/strong> everything and build new office buildings. If this development is successful, it will provide more than 50,000 jobs over the next few years. <strong class=\"blank-number\">145<\/strong> The demand for housing is already on the rise. <strong class=\"blank-number\">146<\/strong>, commercial properties that will ultimately cater to the future residents are being rented at an unprecedented rate.<\/p>\n<\/div><\/section><\/div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 147–148 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>OFFICIAL NOTICE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Cancellation Policy for Whitmore River Campground<\/strong><\/p>\n<p>If you need to cancel your reservation, we will return your full deposit provided that you call the park office at 555-7722 a minimum of 48 hours before your scheduled arrival. Please note that the park office is only open until 5 p.m. each day, and cancellation notifications sent by text message and e-mail are not accepted. If you cancel at short notice or fail to arrive, you will lose your deposit, and we will be entitled to accommodate another guest at your campsite.<\/p>\n<\/div><\/section><\/div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 149–150 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>SCHEDULE & TABLE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Volunteer Applications<\/strong><\/p>\n<p>Thank you for your interest in volunteering at Coral Rock Aquarium. We are no longer accepting applications for fall volunteer positions as that quarterly period is currently under way. If you wish to apply for another quarterly period, please see the chart below for relevant dates.<\/p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\"><strong>Quarterly period<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Dates for volunteering commitment<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Dates for accepting applications<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">Spring<\/td>\n  <td style=\"text-align:left\">March 1 to May 31<\/td>\n  <td style=\"text-align:left\">December 15 to February 15<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Summer<\/td>\n  <td style=\"text-align:left\">June 1 to August 31<\/td>\n  <td style=\"text-align:left\">March 15 to May 15<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Fall<\/td>\n  <td style=\"text-align:left\">September 1 to November 30<\/td>\n  <td style=\"text-align:left\">June 15 to August 15<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Winter<\/td>\n  <td style=\"text-align:left\">December 1 to February 28<\/td>\n  <td style=\"text-align:left\">September 15 to November 15<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The first part of the application process involves submitting a form and being interviewed by our volunteer director. If you meet our requirements, you will need to join a three-hour orientation session, which Coral Rock Aquarium is offering on February 24, May 23, August 22, and November 22.<\/p>\n<\/div><\/section><\/div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 151–152 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>INSTANT MESSAGES<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong class=\"chat-sender\">Charlene Timmerson<\/strong> <span class=\"chat-time\">July 11, 3:00 P.M.\nHi. I&#x27;m sorry, but I won&#x27;t be able to make it home in time to meet the electrician for my 3:30 P.M. appointment today. Something came up, and I can&#x27;t leave work early after all. I can make it by 5 P.M., though. Can it be moved<\/span><br>back?<\/p><p><strong class=\"chat-sender\">McGovern Electrical Repair<\/strong> <span class=\"chat-time\">July 11, 3:08 P.M.\nHello. Unfortunately, our technicians are very busy, and there are no remaining time slots today. Our next opening is July 15 at 1 P.M. Or, we could probably fit you in at noon on July 18 or<\/span><br>19.<\/p><p><strong class=\"chat-sender\">Charlene Timmerson<\/strong> <span class=\"chat-time\">July 11, 3:15 P.M.\nI see. I just talked to my boss, and she said I can stay home from work on July<\/span><br>19.<\/p><\/div><\/section><\/div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 153–154 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong>It's Never Been So Easy to Buy Our Books!<\/strong><\/p>\n<p>At Bell Tower Publishing, we have long been known for our wide selection of science textbooks, reasonable prices, and top-notch customer service. Until recently, our products could only be ordered on our Web site. But now there is a faster, more convenient way to shop with us: Bell Tower Helper, an application for mobile phones and tablets.<\/p>\n<p>All you have to do is download Bell Tower Helper from an application store and create a user profile. Then log in, select some titles, and push the &quot;Order&quot; button. Having a profile allows you to save your payment details and check the status of your orders. As always, discounts are provided for bulk orders, though they vary depending on the books. Of course, you can still order at <a href=\"https://www.belltowerpublishing.com/\">www.belltowerpublishing.com<\/a> if you prefer.<\/p>\n<\/div><\/section><\/div>","155-157":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 155–157 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-flyer\"><div class=\"doc-ribbon\"><span>PROMOTIONAL FLYER<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong>South Loop Yard Sale<\/strong><\/p>\n<p>Join our second annual neighborhood yard sale, organized by the South Loop Community Center. Last year's event topped all expectations and inspired the creation of an annual tradition. The event will take place on Saturday, September 2. Come and shop for bargains, listen to local music, and taste great food.<\/p>\n<p>This year, we have moved to the Dearborn Center. It offers more room for participants than last year's location. Booth spaces are still available for sellers. To sign up, simply register for a spot at <a href=\"https://www.southloop.org/yardsale\">www.southloop.org/yardsale<\/a>.<\/p>\n<p>Unlike last year, we will require a participation fee of $50. This will go directly to funding the organization's gift-giving activities this Christmas. If you are interested in making a donation, go to <a href=\"https://www.southloop.org/donate\">www.southloop.org/donate<\/a>.<\/p>\n<\/div><\/section><\/div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 158–160 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-report\"><div class=\"doc-ribbon\"><span>PRESS RELEASE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Newberry Continues to Capture Market Share<\/strong><\/p>\n<p>March 1— Newberry Inc. has quickly gained ground on its competitors in the market for e-readers. Its latest product has attracted a strong following with features such as a full-colour display, multiple dictionaries, and a wide selection of computer voices that can read text aloud. Unlike any other device, Newberry's product can also connect to speaker systems wirelessly. This lets users hear books read aloud with greater audio clarity.<\/p>\n<p>Because of these features and more, the Newberry E-Reader has experienced consistent growth in its market share. Each month since the product was released two years ago, the company has added more and more new users. It currently accounts for nearly 22 percent of e-reader sales, placing it third behind the much older and larger firms Vandaread and Speclight Reader. Analysts believe that Newberry's share is likely to increase further.<\/p>\n<p>Newberry Inc. CEO Ross Franklin announced recently that the company has signed a contract with popular fantasy author Larry Hamlin to promote the Newberry E-reader in an upcoming advertising campaign. The campaign will include television advertisements and speaking engagements at select branches of the country's biggest bookstores. The company also plans to release a new version of the product next year that features increased memory capacity.<\/p>\n<\/div><\/section><\/div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 161–164 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-letter\"><div class=\"doc-ribbon\"><span>BUSINESS LETTER<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>Gloria Schaeffer\n1763 Stanton Road\nChandler, Arizona 85226<\/p>\n<p>11 February<\/p>\n<p>Dear Ms. Schaeffer,<\/p>\n<p>My name is Maury Dekalb, and I have worked as a real estate agent in the Chandler area for over two decades. — [1] —. I noticed that you have been trying to sell your house independently by listing it in local property guides. I believe that I can find a buyer for your home. — [2] —.<\/p>\n<p>Many properties are up for sale all over the city, but there are not a lot of buyers at the moment. There is no doubt in my mind that these conditions will make it challenging to sell your home. — [3] —. I guarantee that, if you hire me, you will no longer have to worry so much. I will generate interest in your property among potential buyers, set up appointments with them so they can see your home, and act as a mediator during negotiations. — [4] —.<\/p>\n<p>If you would like to meet with me sometime, please let me know. Together, we can come up with a sales strategy that meets your needs. I am available day or night at 555-7411.<\/p>\n<p>Best wishes,\nMaury Dekalb\nDekalb Realty<\/p>\n<\/div><\/section><\/div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 165–167 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Tulsa College Seeks Research Assistant<\/strong><\/p>\n<p>The Tulsa College economics department is seeking a knowledgeable research assistant to help gather and analyze income data. The assistant must be willing to dedicate at least 40 hours a week to the job. Normal work hours are from Monday to Friday, from 8 A.M. to 5 P.M. The job will last six months and pays $18 per hour.<\/p>\n<p>Job responsibilities include:\n• Collecting income data from published research studies\n• Creating spreadsheets and infographics based on data\n• Writing reports on the progress of multiple ongoing projects<\/p>\n<p>All applicants must:\n• Have at least a bachelor's degree in economics\n• Have earned at least a 3.5 GPA during college\n• Demonstrate knowledge of their field during an interview<\/p>\n<p>If you are interested, please submit a resume and cover letter to the head of Tulsa College's economics department, Dr. William Ling, at w.ling@tulsacollege.edu. Successful applicants will be contacted by e-mail to arrange an interview date. All interviews will take place on-site with members of a hiring committee.<\/p>\n<\/div><\/section><\/div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 168–171 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>OFFICIAL NOTICE<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Notice to North Portal Street Residents<\/strong><\/p>\n<p>Renwah Productions will be filming several scenes for an upcoming episode of QCC's television series Farther Gone on North Portal Street. — [1] —. Filming is set to take place from May 8 to May 12 at the following locations and times:<\/p>\n<ol>\n<li>Monday, May 8, &amp; Tuesday, May 9: Charbonneau Café, 1542 North Portal Street, from 8:30 A.M. until 7:00 P.M.<\/li>\n<li>Wednesday, May 10, &amp; Thursday, May 11: Outside of Azalea Apartments, 1294 North Portal Street, from 5:00 A.M. to 3:00 P.M.<\/li>\n<li>Friday, May 12: Get-and-Grab Convenience, 1628 North Portal Street, from 10:00 A.M. to 9:00 P.M.<\/li>\n<\/ol>\n<p>In order to accommodate the film crew's vehicles and equipment, &quot;NO PARKING&quot; signs will be set up near the filming locations on the relevant dates and times. — [2] —<\/p>\n<p>Renwah Productions has promised to keep traffic disruptions to a minimum. — [3] —. Please note that the first and third filming sites will be closed to the public while filming is under way. Access will be granted to the second location through its rear entrance only. — [4] —<\/p>\n<p>Thank you for your understanding and cooperation.<\/p>\n<\/div><\/section><\/div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 172–175 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat\"><div class=\"doc-ribbon\"><span>INSTANT MESSAGES<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong class=\"chat-sender\">Jeff Hervey<\/strong> <span class=\"chat-time\">10:35 A.M.<\/span><br>Rosanne, are you in the office now? I have a favor to ask.<\/p><p><strong class=\"chat-sender\">Rosanne Rutherford<\/strong> <span class=\"chat-time\">10:37 A.M.<\/span><br>Hey. Aren&#x27;t you supposed to be at the house on Vermont Street replacing roof tiles?<\/p><p><strong class=\"chat-sender\">Jeff Hervey<\/strong> <span class=\"chat-time\">10:39 A.M.<\/span><br>That&#x27;s the problem. I&#x27;m here now, and there&#x27;s more work to do than expected. I must have made a mistake with my measurements last time. I need several people to come and help me.<\/p><p><strong class=\"chat-sender\">Rosanne Rutherford<\/strong> <span class=\"chat-time\">10:43 A.M.<\/span><br>I&#x27;m not in the office right now, but I can help you. Todd might be available too. The fencing job he was scheduled to do on Grant Street was canceled.<\/p><p><strong class=\"chat-sender\">Jeff Hervey<\/strong> <span class=\"chat-time\">10:45 A.M.<\/span><br>That&#x27;s a relief. Thanks!<\/p><p><strong class=\"chat-sender\">Jeff Hervey<\/strong> <span class=\"chat-time\">10:46 A.M.<\/span><br>Todd, do you have time to help out on a roofing job at 62 Vermont Street? I may need you to bring extra tools.<\/p><p><strong class=\"chat-sender\">Todd Billings<\/strong> <span class=\"chat-time\">10:48 A.M.<\/span><br>Hi, Jeff. Yes, I&#x27;ve got the time.<\/p><p><strong class=\"chat-sender\">Jeff Hervey<\/strong> <span class=\"chat-time\">10:49 A.M.<\/span><br>Thanks, Todd! Let me know how soon you can get here.<\/p><p><strong class=\"chat-sender\">Rosanne Rutherford<\/strong> <span class=\"chat-time\">10:52 A.M.<\/span><br>Jeff, I notified Ms. Richards, and she gave her approval for us to go over there. I&#x27;ll be leaving shortly.<\/p><p><strong class=\"chat-sender\">Todd Billings<\/strong> <span class=\"chat-time\">10:53 A.M.<\/span><br>OK, Jeff. I can be there in about 45 minutes.<\/p><\/div><\/section><\/div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 176–180 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL CORRESPONDENCE<\/span><small>DOCUMENT 1 / 2<\/small><\/div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">To<\/span><span>Jake Boyne jake_boyne@renswoodinc.com<\/span><\/div><div><span class=\"mail-key\">From<\/span><span>Betty Herzfeld betty_herzfeld@renswoodinc.com<\/span><\/div><div><span class=\"mail-key\">Subject<\/span><span>Broken projector<\/span><\/div><div><span class=\"mail-key\">Date<\/span><span>August 5<\/span><\/div><\/div><p>Hi, Jake,<\/p>\n<p>As I mentioned to you yesterday, the projector in the second-floor conference room isn't working properly. I want to get a new device rather than have it fixed because the warranty expired last year. Apparently, the current one has a bulb that lasts 4,000 hours. I'd like to get a device that's better in this respect. If possible, I'd also like to upgrade to a projector with higher resolution.<\/p>\n<p>I haven't been very pleased with the current projector, so let's get a GelwayCo device this time around. Anyway, please do some investigating together with the other interns and let me know when you find a suitable device. The maximum amount we can spend on this item is $600.<\/p>\n<p>Thanks,<\/p>\n<p>Betty Herzfeld\nPurchasing Department<\/p>\n<\/div><\/section><section class=\"document-card type-ad\"><div class=\"doc-ribbon\"><span>ADVERTISEMENT<\/span><small>DOCUMENT 2 / 2<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Want to improve your meetings?<\/strong><\/p>\n<p>A GelwayCo projector may be just what your office needs!<\/p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\"><strong>Model<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Cost<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Brightness<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Resolution<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Lamp hours<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">DR-7 (Our classic projector, tailored for business use)<\/td>\n  <td style=\"text-align:left\">$550<\/td>\n  <td style=\"text-align:left\">2,000 lumens<\/td>\n  <td style=\"text-align:left\">1024 x 768<\/td>\n  <td style=\"text-align:left\">5,000<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">DR-8 (Our wireless option)<\/td>\n  <td style=\"text-align:left\">$650<\/td>\n  <td style=\"text-align:left\">3,000 lumens<\/td>\n  <td style=\"text-align:left\">1280 x 800<\/td>\n  <td style=\"text-align:left\">5,000<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">BR-103X (Our slim, lightweight model)<\/td>\n  <td style=\"text-align:left\">$1,200<\/td>\n  <td style=\"text-align:left\">3,000 lumens<\/td>\n  <td style=\"text-align:left\">1280 x 800<\/td>\n  <td style=\"text-align:left\">4,000<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">F6-UR (Our model for displaying images in tight spaces)<\/td>\n  <td style=\"text-align:left\">$850<\/td>\n  <td style=\"text-align:left\">2,700 lumens<\/td>\n  <td style=\"text-align:left\">1024 x 768<\/td>\n  <td style=\"text-align:left\">5,000<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>We are committed to helping customers get the most out of their devices by providing easy access to software updates, manuals, and FAQ pages. Support is available online, in person at any of our stores nationwide, and over the phone at 1-800-555-9222.<\/p>\n<\/div><\/section><\/div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 181–185 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>NEWS & ARTICLES<\/span><small>DOCUMENT 1 / 2<\/small><\/div><div class=\"document-body source-passages\"><p>Concord Newsletter, September 30 edition<\/p>\n<p><strong>Seasonal Drinks Fuel Cafe Sales in Concord<\/strong><\/p>\n<p>Local cafes have been attracting more customers and boosting their sales by offering seasonally themed coffee beverages. At the Concord Food &amp; Drink Convention on September 23, a group of cafe owners announced plans to add more seasonal drinks to their menus and carry out various promotions. They believe that, by doing so, they can turn Concord into a destination for coffee enthusiasts from neighboring areas. Their ultimate aim is to make the town the flavored-coffee capital of the U.S.<\/p>\n<p>Already, unique coffee-based drinks can be found in Concord year-round. Olivia Lang, the owner of Bean Brewers, says that Pumpkin Spice is her cafe's most popular flavor during the fall. At Creative Cups, the staff members try to increase winter sales by inventing flavors with unique names. Last year, they served the winter-themed coffee drinks Xmas Espresso and Christmas Tree Cappuccino. This year, they plan to introduce the Santa Latte.<\/p>\n<p>Meanwhile, the coffee shop Chill will bring back its refreshing Coconut Java, which debuted last March and was served until June, and 4th Street Coffee intends to make its popular Cherry Cappuccino available again in the summer.<\/p>\n<\/div><\/section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL CORRESPONDENCE<\/span><small>DOCUMENT 2 / 2<\/small><\/div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">To<\/span><span>Concord Newsletter advertising department advertising@connews.com<\/span><\/div><div><span class=\"mail-key\">From<\/span><span>Kiana Lee kianalee@entrepreneur.com<\/span><\/div><div><span class=\"mail-key\">Date<\/span><span>October 5<\/span><\/div><div><span class=\"mail-key\">Subject<\/span><span>Advertisement<\/span><\/div><div><span class=\"mail-key\">Attachment<\/span><span>advertisement_draft<\/span><\/div><\/div><p>Dear advertising department,<\/p>\n<p>I was excited to see that my coffee shop, Creative Cups, was mentioned in an article in your September 30 edition. This week, a few customers have already asked when we will start selling our new flavor. I appreciate the publicity and wish to follow up by placing an advertisement in your newsletter:<\/p>\n<p>The size I am interested in is one-eighth of a page. I have attached a draft of the advertisement. Your staff can recommend changes if needed. I reviewed the pricing on your Web site and saw that it costs $200 per month to advertise in your publication's Food and Dining section. As soon as you confirm that this is the correct amount, I will submit my payment.<\/p>\n<p>I look forward to hearing back from you.<\/p>\n<p>Thank you,<\/p>\n<p>Kiana Lee<\/p>\n<\/div><\/section><\/div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 186–190 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice\"><div class=\"doc-ribbon\"><span>OFFICIAL NOTICE<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Hyde Park Job Fair<\/strong>\nWhen: October 13\nWhere: Hyde Park Community Center, Main Hall<\/p>\n<p>Are you a recent graduate with a bachelor's or master's degree? Come to the Hyde Park Job Fair and apply directly for positions in various fields from health care to software development and more. The fair is free for applicants as the City of Tampa has provided funding for the event.<\/p>\n<p>Participating companies include local and international businesses with immediate openings for skilled applicants. These include part-time, full-time, and paid internship positions. We advise participants to do prior research on participating companies and to bring multiple copies of their resumes. The Hyde Park Community Center will also be providing professional resume advice for students who require it.<\/p>\n<\/div><\/section><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>SCHEDULE & TABLE<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Hyde Park Community Center List of Attending Companies<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\"><strong>Name<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Industry<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Details<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Company Representative<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">Brentura Diagnostics<\/td>\n  <td style=\"text-align:left\">Science<\/td>\n  <td style=\"text-align:left\">Seeking laboratory consultants with a master's degree in chemistry or biology *prefer graduates from local universities<\/td>\n  <td style=\"text-align:left\">Sandra Parker<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Gerber Inc.<\/td>\n  <td style=\"text-align:left\">Engineering<\/td>\n  <td style=\"text-align:left\">Seeking engineering majors for projects in the construction industries<\/td>\n  <td style=\"text-align:left\">Carter Lewis<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Heston<\/td>\n  <td style=\"text-align:left\">Telecommunications<\/td>\n  <td style=\"text-align:left\">Seeking marketing graduates to fill various open positions<\/td>\n  <td style=\"text-align:left\">Eun-jung Bae<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Jones Industries<\/td>\n  <td style=\"text-align:left\">Software Development<\/td>\n  <td style=\"text-align:left\">Seeking knowledgeable programmers for project-based work<\/td>\n  <td style=\"text-align:left\">Mario Lopez<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Spitexx<\/td>\n  <td style=\"text-align:left\">Health Care<\/td>\n  <td style=\"text-align:left\">Seeking interns for positions in medical sales<\/td>\n  <td style=\"text-align:left\">Angela Mitchell<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Verity Care<\/td>\n  <td style=\"text-align:left\">Services<\/td>\n  <td style=\"text-align:left\">Seeking individuals qualified to work with children<\/td>\n  <td style=\"text-align:left\">Belinda Hough<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Many more companies will be added to the list once their job postings have been confirmed. Please check back for continuous updates.<\/p>\n<\/div><\/section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL CORRESPONDENCE<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">To<\/span><span>Alex Conner aconner@hydeparkcenter.org<\/span><\/div><div><span class=\"mail-key\">From<\/span><span>Eun-jung Bae e.bae@heston.us<\/span><\/div><div><span class=\"mail-key\">Subject<\/span><span>Fair Attendance<\/span><\/div><div><span class=\"mail-key\">Date<\/span><span>October 9<\/span><\/div><\/div><p>Dear Mr. Conner,<\/p>\n<p>Thank you for confirming our booth reservation at the upcoming job fair. We are looking forward to meeting many qualified applicants and have heard that graduates from top schools will be attending.<\/p>\n<p>Our plan is to hire several people as quickly as possible. Therefore, we will be screening applicants at the event. I would also like to conduct interviews on the same day. I'd like my colleagues in Singapore and Japan to participate in the process virtually. Is it possible to rent a small meeting room with Wi-Fi for this purpose? An hour should be sufficient. Please let me know.<\/p>\n<p>Sincerely,<\/p>\n<p>Eun-jung Bae\nHuman Resource Manager\nHeston<\/p>\n<\/div><\/section><\/div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 191–195 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article\"><div class=\"doc-ribbon\"><span>NEWS & ARTICLES<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Dorwing Air Continues to Adapt<\/strong>\nBy Aaron Sheffield<\/p>\n<p>For any given flight, it is almost guaranteed that some passengers with reservations will not show up. Unsurprisingly, most airlines attempt to fill the empty seats by overbooking. This method is not without controversy, however, as it occasionally results in more passengers than seats and some ticket holders having to make alternative travel arrangements.<\/p>\n<p>To ease some of the stress faced by passengers who are forced to miss a flight, the international airline Dorwing Air has recently changed its overbooking policy. Some affected passengers in economy class will be offered a business class seat on the next flight. If all else fails, Dorwing Air will also offer some ticket holders up to $1,000 in compensation. &quot;We are confident that these measures will help us improve our customer satisfaction rate,&quot; said Dorwing Air CEO Valery Suarez.<\/p>\n<\/div><\/section><section class=\"document-card type-memo\"><div class=\"doc-ribbon\"><span>INTERNAL MEMO<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">To<\/span><span>All Dorwing Air passenger service agents<\/span><\/div><div><span class=\"mail-key\">From<\/span><span>Dorwing Air administration<\/span><\/div><div><span class=\"mail-key\">Subject<\/span><span>Overbooking policy reminders<\/span><\/div><div><span class=\"mail-key\">Date<\/span><span>November 5<\/span><\/div><\/div><p>I'm sure you've all been briefed on the new policy by now, but here are some reminders just in case:<\/p>\n<ol>\n<li>If a flight has been overbooked, offer SkySaver coupons to passengers who volunteer to take a later flight. They can use these to get reduced fares when booking future Dorwing Air flights.<\/li>\n<li>If the flight remains overbooked within 30 minutes of the departure time, offer passengers a business class seat on the next available flight and access to our VIP lounge while they wait.<\/li>\n<li>If the issue has still not been resolved by the time that passengers are about to start boarding, you may offer the maximum compensation amount available for that flight.<\/li>\n<\/ol>\n<\/div><\/section><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL CORRESPONDENCE<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">To<\/span><span>Joan Kreeger joan_kreeger@wentleco.com<\/span><\/div><div><span class=\"mail-key\">From<\/span><span>Lewis Hopps lew_hopps@wentleco.com<\/span><\/div><div><span class=\"mail-key\">Subject<\/span><span>Mr. Hunt&#x27;s flight<\/span><\/div><div><span class=\"mail-key\">Date<\/span><span>November 10<\/span><\/div><div><span class=\"mail-key\">Attachment<\/span><span>Cost estimates<\/span><\/div><\/div><p>Hi, Joan,<\/p>\n<p>I just received a message from Mr. Hunt. He said the meeting he had yesterday with the Vorin Construction representative went well. He's at the airport in Roystonville now and said he'll arrive about an hour late. His 1:10 PM flight is overbooked, but Dorwing Air has secured him a business class seat on a plane that'll be leaving at 2:05 PM. That'll give you more time to get to the airport. You can leave the office to pick him up at about 5:00 PM. Until then, please check the accuracy of the file I'm sending you.<\/p>\n<p>Best regards,\nLewis<\/p>\n<\/div><\/section><\/div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">閱讀資料<\/span><span>Questions 196–200 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail\"><div class=\"doc-ribbon\"><span>E-MAIL CORRESPONDENCE<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body source-passages\"><div class=\"mail-meta\"><div><span class=\"mail-key\">To<\/span><span>Bennet Fraser b.fraser@invercargill.com<\/span><\/div><div><span class=\"mail-key\">From<\/span><span>Clara Walker c.walker@pos.co.nz<\/span><\/div><div><span class=\"mail-key\">Subject<\/span><span>5th Annual POS Congress<\/span><\/div><div><span class=\"mail-key\">Date<\/span><span>December 8<\/span><\/div><\/div><p>Dear Dr. Fraser,<\/p>\n<p>Here at the Pacific Orthodontic Society (POS), we have begun making preparations for next year's congress, which will take place from April 23 to 24. Along with a special lecture and symposiums, we'd like to host a panel discussion. As you've led groundbreaking research at your workplace, I'd like to invite you to talk about your work on stage with Dr. Ellie Williams and Dr. Hannah Brown on the second day of the gathering.<\/p>\n<p>Each speaker receives $2,000 in compensation. In addition, travel expenses are reimbursed and an all-access guest pass is provided for the activities, which include a private party in the ballroom of the conference venue. Rooms have been reserved for speakers at a local hotel, which is well equipped with various facilities. I'm sure you would appreciate the hotel's gym—all guests can use it for free. There's also a spa, which charges a reasonable entrance fee.<\/p>\n<p>I look forward to hearing back from you.<\/p>\n<p>Sincerely,<\/p>\n<p>Clara Walker, Congress Organizer<\/p>\n<\/div><\/section><section class=\"document-card type-schedule\"><div class=\"doc-ribbon\"><span>SCHEDULE & TABLE<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Announcement of the 5th Annual POS Congress, scheduled for April 23 &amp; 24<\/strong><\/p>\n<p>This year's gathering of the Pacific Orthodontic Society (POS) will be held in Auckland. Leading experts from the South Pacific region will present on the latest techniques and technologies for straightening teeth. The following events have already been confirmed:<\/p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\"><strong>Event<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Topic<\/strong><\/th>\n  <th style=\"text-align:left\"><strong>Speaker(s)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">Special Lecture<\/td>\n  <td style=\"text-align:left\">The Latest Advances in Braces<\/td>\n  <td style=\"text-align:left\">Dr. James Reid<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Symposium<\/td>\n  <td style=\"text-align:left\">New Types of Dental Implants<\/td>\n  <td style=\"text-align:left\">Dr. Serena Singh<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Symposium<\/td>\n  <td style=\"text-align:left\">Low-cost Tooth-Alignment Kits<\/td>\n  <td style=\"text-align:left\">Dr. Hazel Collins<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\">Panel Discussion<\/td>\n  <td style=\"text-align:left\">Scanning Technology<\/td>\n  <td style=\"text-align:left\">Dr. Hannah Brown, Dr. Bennet Fraser, Dr. Ellie Williams<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The fees are $540 for POS members and $600 for nonmembers, and the payment deadline is March 30. Payments can be made by credit card at <a href=\"https://www.pos.co.nz/congress5\">www.pos.co.nz/congress5<\/a>.<\/p>\n<\/div><\/section><section class=\"document-card type-form\"><div class=\"doc-ribbon\"><span>REGISTRATION FORM<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body source-passages\"><p><strong>POS Travel Compensation Form<\/strong><\/p>\n<p>Thank you for contributing to the POS. To ensure that you are properly compensated, please complete this form and send a scanned copy of it and all receipts to Blake Henry at bh.accounting@pos.co.nz. Your stay at Eden Lake Hotel has already been paid for by the POS.<\/p>\n<p>Name of Participant: Hannah Brown\nEvent Attended: 5th Annual POS Congress\nEvent Location: Centennial Hotel, Auckland<\/p>\n<p><strong>Expenditures<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>Date<\/th>\n  <th>Description<\/th>\n  <th style=\"text-align:right\">Cost<\/th>\n  <th style=\"text-align:right\">Total<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>April 22<\/td>\n  <td>Te Anau Air, economy class<\/td>\n  <td style=\"text-align:right\">$547<\/td>\n  <td style=\"text-align:right\">$556<\/td>\n<\/tr>\n<tr>\n  <td>April 22<\/td>\n  <td>Stationery supplies<\/td>\n  <td style=\"text-align:right\">$9<\/td>\n  <td style=\"text-align:right\"><\/td>\n<\/tr>\n<tr>\n  <td>April 24<\/td>\n  <td>Connection cord for laptop<\/td>\n  <td style=\"text-align:right\">$90.75<\/td>\n  <td style=\"text-align:right\">$90.75<\/td>\n<\/tr>\n<tr>\n  <td>April 25<\/td>\n  <td>Ether Airlines, business class<\/td>\n  <td style=\"text-align:right\">$612<\/td>\n  <td style=\"text-align:right\">$635<\/td>\n<\/tr>\n<tr>\n  <td>April 25<\/td>\n  <td>Early morning taxi to airport<\/td>\n  <td style=\"text-align:right\">$23<\/td>\n  <td style=\"text-align:right\"><\/td>\n<\/tr>\n<tr>\n  <td><strong>TOTAL<\/strong><\/td>\n  <td><\/td>\n  <td style=\"text-align:right\"><\/td>\n  <td style=\"text-align:right\"><strong>$1,281.75<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div><\/section><\/div>"};const GROUP_TRANSLATIONS={"131-134":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 131–134 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-manual type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>要更換印表機墨水匣，請先打開印表機頂部。這樣會使墨水匣移動到列印區域中間並停止。 選擇要更換的墨水匣，並且往您的方向拉。它應該會很容易滑出來。 當您準備好新的墨水匣時，搖晃它，使墨水（在墨水匣內）流動。 這樣將確保均勻的色彩分布。接下來，找到封住底部的保護膠帶。使用前必須撕下。 不然，墨水不會被釋出。最後，關上印表機頂部，並且印幾張測試頁，確認顏色與螢幕上相同。<\/p>\n<\/div><\/section><\/div>","135-138":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 135–138 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-webpage type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong>Weissert 防毒軟體<\/strong><\/p>\n<p>首頁｜關於我們｜帳戶｜說明｜聯絡我們<\/p>\n<p>Weissert 防毒軟體保護電腦與網路。自五年前推出以來，它已成為抵禦病毒與惡意軟體的主要防護工具之一。立即下載免費試用版，便可在一台裝置上完整使用我們的服務 90 天。<\/p>\n<p>試用期結束後，您可輕鬆延長服務：只要選擇訂閱方案並輸入付款資訊。我們接受各大信用卡，也支援直接扣款。就是這麼簡單。在未滿 90 天的試用期間，我們完全不會收取費用。要開始安裝，請按這裡。<\/p>\n<\/div><\/section><\/div>","139-142":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 139–142 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>收件者：Cynthia Ryerson cynry@terratiles.com\n寄件者：Alex Jones jones@jonesinteriors.com\n日期：11 月 18 日\n主旨：購買訂單<\/p>\n<p>親愛的 Ryerson 小姐：<\/p>\n<p>感謝您依要求寄來瓷磚樣品。實際產品比你們的網站上看起來更好。我拜訪了客戶，並且給她看了樣品。 雖然她對石材與陶瓷瓷磚印象深刻，但她覺得這兩個選擇都不是她負擔得起的。另一方面，赤陶磚正是她要找的。 它們將會非常搭配她地中海主題的餐廳。<\/p>\n<p>我提供了尺寸給您，所以可以請您告訴我材料與安裝的總價？ 我也想知道你們可以多早（開始）進行工程。我的客戶預期她的家具和家電在 2 週後送到，所以在那之前進行安裝會是最好的。<\/p>\n<p>再次感謝，希望很快收到您的回覆。<\/p>\n<p>Jones 室內設計公司<\/p>\n<p>Alex Jones\nJones 室內設計公司<\/p>\n<\/div><\/section><\/div>","143-146":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 143–146 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>Jackson 市正顯現強勁的經濟復甦跡象，吸引大量居民與企業遷入。這股成長來自 34 號公路旁一塊面積達 370 萬平方英尺的土地售出，該地先前曾是 Sibbet 製造公司的廠址。這家公司營運三年後宣告破產，並於十多年前停業，使土地上的基礎設施一直閒置。<\/p>\n<p>新地主計畫拆除原有設施，興建新的辦公大樓。如果開發順利，未來幾年將創造超過五萬個工作機會。受此影響，鄰近地區的居民也陸續遷往 Jackson 市。當地住房需求已經上升。同樣地，未來可服務新居民的商業不動產，也正以空前的速度被租下。<\/p>\n<\/div><\/section><\/div>","147-148":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 147–148 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>Whitmore 河露營地（預約）取消政策<\/p>\n<p>如果您需要取消預約，只要您在預定抵達的至少 48 小時前撥打 555-7722 聯絡公園辦公室，我們就會退給您全額保證金。請注意公園辦公室只營業到每天下午 5 點，且不接受以文字訊息及電子郵件發送的取消通知。如果您臨時通知取消或無法到場，將損失保證金，而我們有權讓其他來客使用您的營地。<\/p>\n<\/div><\/section><\/div>","149-150":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 149–150 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-schedule type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>志工報名<\/p>\n<p>感謝您有興趣在 Coral Rock 水族館擔任志工。我們現在不再接受秋季志工報名，因為這個季別正在進行中。如果您希望報名其他季別，請在下表查看相關日期。<\/p>\n<table>\n<thead>\n<tr>\n  <th>季別<\/th>\n  <th>志工服務日期<\/th>\n  <th>接受報名日期<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>春<\/td>\n  <td>3 月 1 日至 5 月 31 日<\/td>\n  <td>12 月 15 日至 2 月 15 日<\/td>\n<\/tr>\n<tr>\n  <td>夏<\/td>\n  <td>6 月 1 日至 8 月 31 日<\/td>\n  <td>3 月 15 日至 5 月 15 日<\/td>\n<\/tr>\n<tr>\n  <td>秋<\/td>\n  <td>9 月 1 日至 11 月 30 日<\/td>\n  <td>6 月 15 日至 8 月 15 日<\/td>\n<\/tr>\n<tr>\n  <td>冬<\/td>\n  <td>12 月 1 日至 2 月 28 日<\/td>\n  <td>9 月 15 日至 11 月 15 日<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>報名程序的第一部分包括提交申請表以及接受志工主任面試。如果您符合我們的要求，您將必須參加 3 小時的培訓，Coral Rock 水族館將在 2 月 24 日、5 月 23 日、8 月 22 日及 11 月 22 日提供培訓。<\/p>\n<\/div><\/section><\/div>","151-152":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 151–152 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>Charlene Timmerson [7 月 11 日，下午 3:00]\n嗨。不好意思，我今天沒辦法及時到家跟約好下午 3:30 的電工見面了。突然有事情，我完全沒辦法提早下班。不過，我下午 5 點可以到。可以往後延嗎？<\/p>\n<p>McGovern 電氣設備修理 [7 月 11 日，下午 3:08]\n哈囉。很遺憾，我們的技術人員非常忙，今天沒有剩下的時段了。我們的下個空檔是 7 月 15 日下午 1 點。或者，我們或許可以在 7 月 18 或 19 日中午和您見面。<\/p>\n<p>Charlene Timmerson [7 月 11 日，下午 3:15]\n我明白了。我剛剛跟我的上司談過了，她說我 7 月 19 日可以待在家不上班。<\/p>\n<\/div><\/section><\/div>","153-154":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 153–154 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p><strong>購買我們的書籍，現在比以往更加方便！<\/strong><\/p>\n<p>在 Bell Tower 出版社，我們長久以來以種類豐富的科學教科書、合理的價格與一流的顧客服務聞名。直到最近，我們的產品都只能在我們的網站上訂購。但現在向我們購買有更快、更便利的方法：Bell Tower Helper，一款手機與平板的應用程式。<\/p>\n<p>您只需要從應用程式商店下載 Bell Tower Helper 並建立使用者個人檔案。然後登入、選擇書籍，再按下「訂購」按鈕。擁有個人檔案，能讓您保存付款細節，並且查看訂單狀態。如同往常，我們提供大批訂購折扣，但折扣隨著書籍而各有不同。當然，如果您希望的話，仍然可以在 www.belltowerpublishing.com 訂購。<\/p>\n<\/div><\/section><\/div>","155-157":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 155–157 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-flyer type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>South Loop 舊物售賣活動<\/p>\n<p>請參加我們的第 2 屆年度鄰里舊物售賣活動，由 South Loop 社區中心籌辦。去年的活動超越了所有期待，並且啟發我們創造一年一度的傳統。活動將在 9 月 2 日星期六舉行。請來選購便宜的物品、聽本地的音樂，並且品嚐美味的食物。<\/p>\n<p>今年，我們移師到 Dearborn 中心。這裡為參加者提供比去年的地點更多的空間。現在仍然有供銷售者使用的攤位空間。如果想要報名，請上 www.southloop.org/yardsale 登記申請攤位即可。<\/p>\n<p>和去年不同的是，我們將要求 50 元的參加費用。這筆錢將直接用於本組織今年聖誕節的禮物贈送活動。如果您有興趣捐款，請到 www.southloop.org/donate。<\/p>\n<\/div><\/section><\/div>","158-160":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 158–160 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-report type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>Newberry 公司持續占市場份額<\/p>\n<p>3 月 1 日— Newberry 公司在電子閱讀器市場已經迅速進逼競爭者。憑著全彩螢幕、多種字典，以及能朗讀文字的各式電腦語音等特色，它最近的產品吸引了一群忠實支持者。不同於其他任何設備，Newberry 的產品也能無線連接音響系統。這讓使用者能用更清晰的音質聽書被朗讀出來。<\/p>\n<p>因為這些功能和更多的因素，Newberry 電子閱讀器經歷了市場份額的持續成長。自這款產品 2 年前上市後，這家公司每個月增加越來越多新使用者。它目前佔有將近 22% 的電子閱讀器銷售額，在歷史和規模都勝過許多的 Vandared 與 Speclight Reader 公司之後佔據第三名。分析師認為 Newberry 公司的市場份額很可能進一步增加。<\/p>\n<p>Newberry 公司執行長 Ross Franklin 最近宣布，該公司已經與人氣奇幻作家 Larry Hamlin 簽約，將在廣告活動中宣傳 Newberry 電子閱讀器。本次活動將包括電視廣告，以及在國內幾家最大的書店分店演講的預定。該公司也計畫在明年推出儲存容量增加的產品新版本。<\/p>\n<\/div><\/section><\/div>","161-164":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 161–164 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-letter type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>Stanton 路 1763 號\n錢德勒，亞利桑那州 85226<\/p>\n<p>2 月 11 日<\/p>\n<p>親愛的 Schaeffer 小姐：<\/p>\n<p>我的名字是 Maury Dekalb，在錢德勒地區擔任不動產仲介超過 20 年。— [1] —。我注意到您試圖藉由刊登於本地不動產指南來獨自銷售您的房屋。我相信自己可以為您的房子找到買家。— [2] —。<\/p>\n<p>整個城市裡有許多待售的不動產，但目前的買家不多。我認為這樣的情況無疑將使您賣房變得困難。— [3] —。我保證，如果您聘請我，就不用再如此擔憂了。我會讓潛在買家對您的不動產有興趣、和他們約定看房，並且居中斡旋。— [4] —。<\/p>\n<p>如果您想找時間和我會面，請告訴我。我們可以一起構想符合您需求的銷售策略。我白天和晚上都可以透過電話 555-7411 聯絡。<\/p>\n<p>Dekalb 不動產<\/p>\n<\/div><\/section><\/div>","165-167":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 165–167 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-ad type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>Tulsa 大學徵求研究助理<\/p>\n<p>Tulsa 大學經濟學系正在徵求知識豐富的研究助理來協助收集並分析所得資料。助理必須願意每週投入至少 40 小時從事這份工作。正常工作時間為週一至週五上午 8 點到下午 5 點。這份工作為期 6 個月，時薪 18 元。<\/p>\n<p>職責包括：\n• 從已發表的研究收集所得資料\n• 依照資料製作試算表與資訊圖表\n• 撰寫多個進行中專案的進度報告<\/p>\n<p>所有應徵者必須：\n• 至少擁有經濟學學士學位\n• 大學期間 GPA 至少得到 3.5 分\n• 在面試時展現對於自身領域的知識<\/p>\n<p>如果您有興趣，請將履歷與求職信寄到 w.ling@tulsacollege.edu 給 Tulsa 大學經濟系主任 William Ling 博士。符合資格的應徵者將以電子郵件聯絡安排面試日期。所有面試都將在現場與聘任委員會成員一起進行。<\/p>\n<\/div><\/section><\/div>","168-171":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 168–171 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>給 North Portal 街居民的通知<\/p>\n<p>Renwah 製作公司將在 North Portal 街為 QCC 的電視影集《Farther Gone》接下來的一集拍攝幾個場面。— [1] —。拍攝預定 5 月 8 日至 5 月 12 日於以下場所與時間進行：<\/p>\n<p>5 月 8 日星期一 &amp; 5 月 9 日星期二：Charbonneau 咖啡廳，North Portal 街 1542 號，上午 8:30 至晚間 7:00<\/p>\n<p>5 月 10 日星期三 &amp; 5 月 11 日星期四：Azalea 公寓外，North Portal 街 1294 號，上午 5:00 至下午 3:00<\/p>\n<p>5 月 12 日星期五：Get-and-Grab 便利商店，North Portal 街 1628 號，上午 10:00 至晚間 9:00<\/p>\n<p>為了提供空間給拍攝團隊的車輛與設備，在相關日期與時間，拍攝場所附近將設置「禁止停車」標誌。— [2] —<\/p>\n<p>Renwah 製作公司承諾將對交通的干擾減到最少。— [3] —。請注意第 1 和第 3 個拍攝地點在拍攝進行時將不開放公眾進入。第 2 個地點將只開放由後門進入。— [4] —<\/p>\n<p>感謝您的理解與配合。<\/p>\n<\/div><\/section><\/div>","172-175":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 172–175 · 1 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-chat type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 1<\/small><\/div><div class=\"document-body source-passages\"><p>Jeff Hervey [上午 10:35] Rosanne，你現在在辦公室嗎？我想請你幫個忙。<\/p>\n<p>Rosanne Rutherford [上午 10:37] 嘿。你不是應該在 Vermont 街的房子換屋頂的瓦片嗎？<\/p>\n<p>Jeff Hervey [上午 10:39] 那正是問題。我現在在這裡，而要做的工作比預期的多。我上次肯定是測量錯了。我需要幾個人來幫我。<\/p>\n<p>Rosanne Rutherford [上午 10:43] 我現在不在辦公室，但我可以幫你。Todd 或許也可以去。他原本預定在 Grant 街做的圍籬施工取消了。<\/p>\n<p>Jeff Hervey [上午 10:45] 真是鬆了口氣。謝謝！<\/p>\n<p>Jeff Hervey [上午 10:46] Todd，你有時間幫忙 Vermont 街 62 號的屋頂施工嗎？我可能需要你帶額外的工具。<\/p>\n<p>Todd Billings [上午 10:48] 嗨，Jeff。是的，我有時間。<\/p>\n<p>Jeff Hervey [上午 10:49] 謝謝，Todd！告訴我你多快可以到這裡。<\/p>\n<p>Rosanne Rutherford [上午 10:52] Jeff，我通知了 Richards 小姐，她准許我們去那裡了。我很快就會出發。<\/p>\n<p>Todd Billings [上午 10:53] OK，Jeff。我可以在大約 45 分鐘之後到那裡。<\/p>\n<\/div><\/section><\/div>","176-180":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 176–180 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 2<\/small><\/div><div class=\"document-body source-passages\"><p>收件者：Jake Boyne jake_boyne@renswoodinc.com\n寄件者：Betty Herzfeld betty_herzfeld@renswoodinc.com\n主旨：壞掉的投影機\n日期：8 月 5 日<\/p>\n<p>嗨，Jake：<\/p>\n<p>就像昨天跟你提到的，2 樓會議室裡的投影機故障了。我想買新的設備，而不是請人修理，因為保固去年到期了。看起來，目前這台配備壽命 4,000 小時的燈泡。我想買一台在這方面比較好的設備。可能的話，我也想升級成解析度比較高的投影機。<\/p>\n<p>我不太滿意目前的投影機，所以我們這次買 GelwayCo 公司的設備吧。總之，請和其他實習生一起做些調查，找到適合的設備時請告訴我。我們能花在這件物品上的最高金額是 600 元。<\/p>\n<p>謝謝<\/p>\n<p>採購部<\/p>\n<p>Betty Herzfeld<\/p>\n<\/div><\/section><section class=\"document-card type-ad type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 2 / 2<\/small><\/div><div class=\"document-body source-passages\"><p>想改善您的會議嗎？<\/p>\n<p>GelwayCo 公司的投影機可能就是您的辦公室所需要的！<\/p>\n<table>\n<thead>\n<tr>\n  <th>型號<\/th>\n  <th>價格<\/th>\n  <th>亮度<\/th>\n  <th>解析度<\/th>\n  <th>燈泡壽命時數<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>DR-7（我們的經典款投影機，專為商用打造）<\/td>\n  <td>550 元<\/td>\n  <td>2,000 流明<\/td>\n  <td>1024 x 768<\/td>\n  <td>5,000<\/td>\n<\/tr>\n<tr>\n  <td>DR-8（我們的無線選擇）<\/td>\n  <td>650 元<\/td>\n  <td>3,000 流明<\/td>\n  <td>1280 x 800<\/td>\n  <td>5,000<\/td>\n<\/tr>\n<tr>\n  <td>BR-103X（我們的薄型、輕量款式）<\/td>\n  <td>1,200 元<\/td>\n  <td>3,000 流明<\/td>\n  <td>1280 x 800<\/td>\n  <td>4,000<\/td>\n<\/tr>\n<tr>\n  <td>F6-UR（我們在狹窄空間顯示影像的款式）<\/td>\n  <td>850 元<\/td>\n  <td>2,700 流明<\/td>\n  <td>1024 x 768<\/td>\n  <td>5,000<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>藉由提供容易取用的軟體更新、使用手冊與 FAQ 頁面，我們致力於幫助顧客充分利用設備。我們提供線上支援、在我們全國各地店面的現場協助，以及 1-800-555-9222 專線電話的協助。<\/p>\n<\/div><\/section><\/div>","181-185":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 181–185 · 2 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 2<\/small><\/div><div class=\"document-body source-passages\"><p>康科德時事通訊，9 月 30 日號<\/p>\n<p>季節性飲料刺激康科德的咖啡廳營業<\/p>\n<p>本地咖啡廳藉由供應季節主題的咖啡飲料，吸引了更多顧客，並提升了營業額。在 9 月 23 日的康科德食品飲料大會上，一群咖啡廳店主宣布了在菜單上增加更多季節性飲料，並且實施各種促銷活動的計畫。藉由這樣的做法，他們認為可以將康科德變成鄰近地區咖啡愛好者的目的地。他們的最終目標是讓本市成為美國的加味咖啡重鎮。<\/p>\n<p>在康科德，已經一整年都可以看到獨特的咖啡基底飲料了。Bean Brewers 的店主 Olivia Lang 表示，Pumpkin Spice 是她的咖啡廳秋季最受歡迎的口味。在 Creative Cups，員工試圖藉由發明名稱獨特的口味來增加冬季營業額。去年，他們供應了冬季主題的咖啡飲料 Xmas Espresso 與 Christmas Tree Cappuccino。今年，他們打算推出 Santa Latte。<\/p>\n<p>同時，Chill 咖啡廳將重新推出清爽的 Coconut Java，它在今年 3 月（最接近現在的 3 月）登場，並且供應到 6 月為止，而 4th Street Coffee 則打算在夏季再度供應受歡迎的 Cherry Cappuccino。<\/p>\n<\/div><\/section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 2 / 2<\/small><\/div><div class=\"document-body source-passages\"><p>收件者：康科德時事通訊廣告部 advertising@connews.com\n寄件者：Kiana Lee kianalee@entrepreneur.com\n日期：10 月 5 日\n主旨：廣告\n附件：廣告_草圖<\/p>\n<p>親愛的廣告部：<\/p>\n<p>看到我的咖啡廳 Creative Cups 在你們 9 月 30 日號的文章中被提及，我感到很興奮。這禮拜，有些顧客已經詢問我們什麼時候會開始販售新口味。感謝你們的宣傳，我也希望進一步在你們的時事通訊下廣告。<\/p>\n<p>我希望的尺寸是 1/8 頁。我附上了廣告的草圖。如果需要的話，你們的員工可以建議變更。我查看了你們網站上的定價，看到在你們刊物的食品與餐飲版打廣告，每個月要 200 元。只要您確認這是正確的金額，我就會付款。<\/p>\n<p>期待您的回覆。<\/p>\n<p>謝謝<\/p>\n<p>Kiana Lee<\/p>\n<\/div><\/section><\/div>","186-190":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 186–190 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-notice type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body source-passages\"><p>Hyde Park 就業博覽會\n日期：10 月 13 日\n地點：Hyde Park 社區中心，本館<\/p>\n<p>您是剛畢業的學士或碩士嗎？請來 Hyde Park 就業博覽會，直接應徵從健康照護到軟體開發等各種領域的職位。本次博覽會提供應徵者免費參加，因為坦帕市為活動提供了資金。<\/p>\n<p>參加企業包括國內外業者，提供立即聘用的職缺給有技術的應徵者。職缺包括兼職、正職與支薪實習職位。我們建議參加者先行研究參加企業，並且攜帶多份履歷複本。Hyde Park 社區中心也將為需要的學生提供專業的履歷建議。<\/p>\n<\/div><\/section><section class=\"document-card type-schedule type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body source-passages\"><p>Hyde Park 社區中心參加企業列表<\/p>\n<table>\n<thead>\n<tr>\n  <th>名稱<\/th>\n  <th>產業<\/th>\n  <th>詳細內容<\/th>\n  <th>公司代表<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Brentura Diagnostics<\/td>\n  <td>科學<\/td>\n  <td>尋找有化學或生物學碩士學位的實驗室顧問 *偏好本地大學的畢業生<\/td>\n  <td>Sandra Parker<\/td>\n<\/tr>\n<tr>\n  <td>Gerber 公司<\/td>\n  <td>工程<\/td>\n  <td>為建設業的計畫尋找主修工程學者<\/td>\n  <td>Carter Lewis<\/td>\n<\/tr>\n<tr>\n  <td>Heston 公司<\/td>\n  <td>電信<\/td>\n  <td>尋找填補各種職缺的行銷科系畢業生<\/td>\n  <td>Eun-jung Bae<\/td>\n<\/tr>\n<tr>\n  <td>Jones Industries<\/td>\n  <td>軟體開發<\/td>\n  <td>為專案導向的工作尋找知識豐富的程式設計師<\/td>\n  <td>Mario Lopez<\/td>\n<\/tr>\n<tr>\n  <td>Spitexx 公司<\/td>\n  <td>健康照護<\/td>\n  <td>尋找醫療銷售職位的實習生<\/td>\n  <td>Angela Mitchell<\/td>\n<\/tr>\n<tr>\n  <td>Verity Care 公司<\/td>\n  <td>服務<\/td>\n  <td>尋找有資格從事應對小孩工作的人<\/td>\n  <td>Belinda Hough<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div><\/section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body source-passages\"><p>收件者：Alex Conner aconner@hydeparkcenter.org\n寄件者：Eun-jung Bae e.bae@heston.us\n主旨：博覽會參加\n日期：10 月 9 日<\/p>\n<p>親愛的 Conner 先生：<\/p>\n<p>謝謝您確認我們在即將到來的就業博覽會中的攤位預約。我們期待見到許多符合資格的應徵者，也聽說會有一流學校的畢業生參加。<\/p>\n<p>我們的計畫是盡快雇用幾個人。所以，我們將在活動上篩選應徵者。我也想在同一天進行面試。我希望新加坡和日本的同事透過視訊（虛擬）方式參加這個過程。有可能為了這個目的租用有 Wi-Fi 的小會議室嗎？1 個小時應該就夠了。敬請告知。<\/p>\n<p>人事經理\nHeston 公司<\/p>\n<p>Eun-jung Bae\n人事經理\nHeston<\/p>\n<\/div><\/section><\/div>","191-195":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 191–195 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-article type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body source-passages\"><p>Dorwing 航空公司持續調整\nAaron Sheffield 撰稿<\/p>\n<p>任何特定航班，幾乎都一定會有些預約乘客不出現。不意外地，大部分航空公司試圖藉由超額預訂（超賣）來填滿空位。不過，這個方法並非沒有爭議，因為偶爾會造成乘客比座位多，而一些有票的人必須做替代的旅行安排。<\/p>\n<p>為了減輕被迫錯過航班的旅客所面臨的壓力，國際航空公司 Dorwing 航空最近改變了超額預訂政策。經濟艙某些受影響的乘客將得到下個航班的商務艙座位。如果其他所有方法都行不通，Dorwing 航空也將提供某些持有機票者最高 1,000 元的補償。Dorwing 航空執行長 Valery Suarez 表示：「我們相信這些措施將有助於我們改善顧客滿意度」。<\/p>\n<\/div><\/section><section class=\"document-card type-memo type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body source-passages\"><p>收件者：Dorwing 航空公司所有乘客服務人員\n寄件者：Dorwing 航空公司管理階層\n主旨：超額預訂政策提醒\n日期：11 月 5 日<\/p>\n<p>我相信你們現在都已經聽過關於新政策的簡報，但為防萬一，這裡有一些提醒：<\/p>\n<p>如果航班被超額預訂，提供 SkySaver 優惠券給自願搭乘較晚航班的乘客。他們可以在預訂未來 Dorwing 航空航班時使用這些優惠券來獲得折扣票價。<\/p>\n<p>如果在離出發時間不到 30 分鐘時，航班仍然處於超額預訂狀態，就提供乘客下一個可利用航班的商務艙座位，以及等待時使用我們 VIP 休息室的權利。<\/p>\n<p>如果在乘客即將開始登機時，問題仍然沒有解決，可以提供當次航班可用的最高補償金額。<\/p>\n<\/div><\/section><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body source-passages\"><p>收件者：Joan Kreeger joan_kreeger@wentleco.com\n寄件者：Lewis Hopps lew_hopps@wentleco.com\n主旨：Hunt 先生的航班\n日期：11 月 10 日\n附件：費用估價<\/p>\n<p>嗨，Joan：<\/p>\n<p>我剛收到 Hunt 先生的訊息。他說昨天和 Vorin 建設公司的代表開會很順利。他現在在 Roystonville 的機場，且他會晚大約 1 小時到。他下午 1:10 的航班被超訂了，但 Dorwing 航空公司幫他取得了下午 2:05 出發的航班上的商務艙座位。這樣你就有比較多時間去機場了。你可以在下午大約 5:00 的時候從辦公室出發去接他。在那之前，請檢查我寄給你的檔案的正確性。<\/p>\n<p>Lewis<\/p>\n<\/div><\/section><\/div>","196-200":"<div class=\"reading-intro\"><span class=\"reading-label\">繁體中文全文<\/span><span>Questions 196–200 · 3 documents<\/span><\/div><div class=\"reading-stack\"><section class=\"document-card type-mail type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 1 / 3<\/small><\/div><div class=\"document-body source-passages\"><p>收件者：Bennet Fraser b.fraser@invercargill.com\n寄件者：Clara Walker c.walker@pos.co.nz\n主旨：第五屆年度 POS 會議\n日期：12 月 8 日<\/p>\n<p>親愛的 Fraser 醫師：<\/p>\n<p>在太平洋齒顎矯正協會（POS），我們已經開始為明年 4 月 23 至 24 日舉行的會議做準備。除了特別演說與討論會以外，我們也想舉辦座談會。由於您曾經在職場上主持突破性的研究，我想邀請您在會議第二天上台，和 Ellie Williams 與 Hannah Brown 醫師談談您的研究。<\/p>\n<p>每位講者都會收到 2,000 元的酬勞。另外，旅費可以報銷，而且會得到各種活動都能參加的來賓通行證，活動包括在會議場地宴會廳舉行的非公開派對。講者在本地飯店的房間已經預約了，這間飯店有各種完備的設施。我相信您會喜歡飯店的健身房——所有住客都可以免費使用。那裡也有 spa，它收取合理的入場費。<\/p>\n<p>期待您的回覆。<\/p>\n<p>Clara Walker，會議籌辦委員<\/p>\n<\/div><\/section><section class=\"document-card type-schedule type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 2 / 3<\/small><\/div><div class=\"document-body source-passages\"><p>預定 4 月 23 &amp; 24 日舉行的第 5 屆年度 POS 會議公告<\/p>\n<p>太平洋齒顎矯正協會（POS）本屆年會將在奧克蘭舉行。南太平洋地區的頂尖專家將介紹牙齒矯正的最新技術與科技。以下活動均已確認。<\/p>\n<table>\n<thead>\n<tr>\n  <th>活動<\/th>\n  <th>主題<\/th>\n  <th>講者<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>特別演說<\/td>\n  <td>矯正器的最新發展<\/td>\n  <td>Dr. James Reid<\/td>\n<\/tr>\n<tr>\n  <td>討論會<\/td>\n  <td>新型植牙<\/td>\n  <td>Dr. Serena Singh<\/td>\n<\/tr>\n<tr>\n  <td>討論會<\/td>\n  <td>費用低的牙齒矯正套組<\/td>\n  <td>Dr. Hazel Collins<\/td>\n<\/tr>\n<tr>\n  <td>座談會<\/td>\n  <td>掃描技術<\/td>\n  <td>Dr. Hannah Brown、Dr. Bennet Fraser、Dr. Ellie Williams<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>參加費用為 POS 會員 540 元，非會員 600 元，繳費期限為 3 月 30 日。費用支付可於 www.pos.co.nz/congress5 以信用卡進行。<\/p>\n<\/div><\/section><section class=\"document-card type-form type-translation\"><div class=\"doc-ribbon\"><span>中文全文翻譯<\/span><small>DOCUMENT 3 / 3<\/small><\/div><div class=\"document-body source-passages\"><p>POS 旅費報銷表<\/p>\n<p>感謝您對 POS 的貢獻。為了確保您的費用正確報銷，請填妥本表，並且將掃描版本與所有收據寄至 bh.accounting@pos.co.nz 給 Blake Henry。您於 Eden Lake 飯店的住宿已由 POS 支付費用。<\/p>\n<p>參加者姓名：Hannah Brown\n參加活動：第 5 屆年度 POS 會議\n活動場所：奧克蘭 Centennial 飯店<\/p>\n<p><strong>支出明細<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>日期<\/th>\n  <th>說明<\/th>\n  <th style=\"text-align:right\">費用<\/th>\n  <th style=\"text-align:right\">當日合計<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>4 月 22 日<\/td>\n  <td>Te Anau 航空，經濟艙<\/td>\n  <td style=\"text-align:right\">$547<\/td>\n  <td style=\"text-align:right\">$556<\/td>\n<\/tr>\n<tr>\n  <td>4 月 22 日<\/td>\n  <td>文具用品<\/td>\n  <td style=\"text-align:right\">$9<\/td>\n  <td style=\"text-align:right\"><\/td>\n<\/tr>\n<tr>\n  <td>4 月 24 日<\/td>\n  <td>筆記型電腦連接線<\/td>\n  <td style=\"text-align:right\">$90.75<\/td>\n  <td style=\"text-align:right\">$90.75<\/td>\n<\/tr>\n<tr>\n  <td>4 月 25 日<\/td>\n  <td>Ether 航空，商務艙<\/td>\n  <td style=\"text-align:right\">$612<\/td>\n  <td style=\"text-align:right\">$635<\/td>\n<\/tr>\n<tr>\n  <td>4 月 25 日<\/td>\n  <td>清晨搭乘計程車前往機場<\/td>\n  <td style=\"text-align:right\">$23<\/td>\n  <td style=\"text-align:right\"><\/td>\n<\/tr>\n<tr>\n  <td><strong>總計<\/strong><\/td>\n  <td><\/td>\n  <td style=\"text-align:right\"><\/td>\n  <td style=\"text-align:right\"><strong>$1,281.75<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div><\/section><\/div>"};const DETAILED_EXPLANATIONS={"101":{"type":"【受詞位置】反身代名詞","translation":"在訪談中，Billy Zuckerman 提到他自己學會了彈吉他。","reason":"空格是介系詞（by）的受詞，所以反身代名詞 (B)、受格人稱代名詞 (C)、文法角色與所有格代名詞相同的 (D) 是可能的答案。句意是「自己學會彈吉他」，所以能構成表示「獨自，靠自己」的片語（all）by oneself 的反身代名詞 (B) himself 是正確答案。如果使用受格人稱代名詞 (C)，意思會變成「Billy Zuckerman 在他（Billy Zuckerman 以外的另一個男性）身邊學會彈吉他」；如果要表達「跟 B 學 A」的話，應該以 learn A from B 的方式表達，介系詞是 from 而不是 by。文法角色與所有格代名詞相同的 (D) his own 如果要表達「獨自，靠自己」的話，應該搭配介系詞 on，以 on one's own 的形式使用才對。主格人稱代名詞 (A) 不能當介系詞的受詞。","vocab":"mention v. 提到","paraphrase":""},"102":{"type":"副詞詞彙","translation":"安裝說明精確地敘述使用者應該做什麼。","reason":"句意是「精確地敘述使用者應該做什麼」，所以副詞 (B) precisely（精確地）是正確答案。(A) enormously 表示「非常，龐大地」，(C) invisibly 表示「隱形地，看不見地」，(D) privately 表示「私下，私營地」。","vocab":"installation n. 安裝　instruction n. 說明　describe v. 敘述　user n. 使用者","paraphrase":""},"103":{"type":"名詞位置","translation":"財務長和部門主管們進行了關於新福利政策的對話。","reason":"能夠當及物動詞（had）的受詞，而且接在不定冠詞（a）後面的是名詞，所以名詞 (D) conversation（對話）是正確答案。另外，請把 have a conversation（進行對話）這個慣用表達方式記起來。動詞 (A) 不能用在名詞位置，就算把 converse 當成現代少用的名詞意義「談話」，因為是不可數名詞的關係，所以不會有複數形，也不會加上不定冠詞（a）。動詞或過去分詞 (B)、形容詞 (C) 不能用在名詞位置。","vocab":"department supervisor phr. 部門主管　converse v. 交談 n.（書面用法）談話　conversational adj. 口語的，對話的","paraphrase":""},"104":{"type":"形容詞詞彙","translation":"Baron 公司比較希望讓已經熟悉公司海外營運的內部人選升職。","reason":"句意是「比較希望讓內部人選升職」，所以形容詞 (C) internal（內部的）是正確答案。(A) extensive 表示「廣泛的」，(B) apparent 表示「明顯的」，(D) irrational 表示「非理性的」。","vocab":"promote v. 使升職，促進　candidate n. 人選　be familiar with phr. 熟悉……","paraphrase":""},"105":{"type":"不定代名詞","translation":"這棟建築物的電梯狀態都很好，除了其中一部以外，它可能必須更換。 不定代名詞","reason":"要表達「電梯狀態都很好，除了其中一部以外」的意思，所以代稱單數可數名詞的 (C) one（一個）是正確答案。這裡的 one 是指前面 The building's elevators（這棟建築物的電梯）的其中一部。(A) another（另一個）表示前面提過的一個東西以外的另一個。(B) other（其他的）當形容詞時用來修飾前面提過事物以外的那些，而當代名詞時則會以 others（其他的一些東西）或 the other(s)（兩個之中的另一個／特定範圍裡的其餘全部）的形態使用。(D) any other（其他任何的）當形容詞時用來修飾前面提過事物以外的對象，而當代名詞時則會以 any others 的形態使用，表示「（已經提過的東西之外的）其他任何東西」。","vocab":"in good condition phr. 狀態良好的　except for phr. 除了……以外　replace v. 替換，更換","paraphrase":""},"106":{"type":"【動詞位置】主動態與被動態的區分","translation":"市長正打算藉由在 62 號高速公路建設高乘載車道來減少交通堵塞。","reason":"句子裡有主詞（The mayor），但缺少動詞，所以動詞 (C) 和 (D) 是可能的答案。動詞 plan（計畫，打算）是及物動詞，在這裡要接空格後面的受詞（to reduce），表示「市長打算減少交通堵塞」的主動意義，所以主動態的 (D) is planning 是正確答案。如果使用被動態 (C)，意思會變成「市長被計畫減少交通堵塞」，所以不對。動名詞或現在分詞 (A)、to 不定詞 (B) 不能用在動詞位置。","vocab":"reduce v. 減少　traffic congestion phr. 交通堵塞，塞車　construct v. 建設　high-occupancy vehicle phr. （車內人數較多的）高乘載車輛　lane n. 車道　along prep. 沿著……","paraphrase":""},"107":{"type":"動詞詞彙","translation":"Medland 公司的用人單位主管要求寫作樣本連同履歷一起提交。","reason":"句意是「要求提交寫作樣本」，所以動詞 request（要求）的過去式 (B) requested 是正確答案。(A) inquire 表示「詢問」，(D) predict 表示「預測」。(C) persuade（說服）意思好像說得通，但因為必須接人當受詞，而不是接 that 子句，所以不對。另外，因為主要子句（The Medland hiring manager）的動詞（requested）表示要求，所以 that 子句（that ~ resumes）使用動詞原形（be submitted）。","vocab":"hiring manager phr. 用人單位主管（正在招募手下人才的未來直屬經理）　submit v. 提交　along with phr. 連同……　résumé n. 履歷","paraphrase":""},"108":{"type":"【動詞位置】主格關係子句的先行詞與動詞的數一致","translation":"","reason":"主格關係子句（who ~ commercial hub）中缺少動詞，所以動詞 (C) 和 (D) 是可能的答案。主格關係代名詞（who）的先行詞（city officials）是複數名詞，所以複數動詞 (D) have agreed 是正確答案。單數動詞 (C) 不能搭配複數主詞使用。動名詞或現在分詞 (A) 和名詞 (B) 不能用在動詞位置。","vocab":"approve v. 批准　city official phr. 市府官員　redevelop v. 重新開發，再開發　commercial hub phr. 商業中心","paraphrase":""},"109":{"type":"名詞","translation":"","reason":"句意是「在廣大的選擇範圍中選一套免費的高爾夫球」，所以 (C) selection（供挑選的範圍）是正確答案。(A) partition 表示「隔間，隔板」，(B) designation 表示「指定」，(D) decision 表示「決定」。","vocab":"vast adj. 廣大的，大的","paraphrase":""},"110":{"type":"副詞位置","translation":"","reason":"可以修飾空格前面動詞（rise）的是副詞，所以副詞 (C) markedly（顯著地）是正確答案。動詞或名詞 (A)、動詞或過去分詞 (B)、動名詞或現在分詞 (D) 不能修飾動詞。另外，因為使役動詞的用法是「make + 受詞 + 原形不定詞」，所以這裡的受詞（flour production costs）後面是接原形不定詞 rise。","vocab":"wheat n. 小麥　flour n. 麵粉　production cost phr. 生產成本　mark v. 標記 n. 記號","paraphrase":""},"111":{"type":"to 不定詞的角色","translation":"to 不定詞的角色","reason":"空格後面接動詞原形，而且句意是「為了職業生涯更上一層樓而搬到這座城市」，所以能形成 to 不定詞、表示目的的 (D) in order to（為了做……）是正確答案。副詞子句連接詞 (A) even if（即使……）和 (C) given that（考慮到……）後面要接有主詞和動詞的完整子句。介系詞 (B) in regard to（關於……）後面接的是名詞。請記得表示目的的 to 不定詞也可以用 in order to 或 so as to 來表達。","vocab":"advance one's career phr. 使職業生涯更上一層樓　real estate agent phr. 不動產仲介","paraphrase":""},"112":{"type":"【受詞位置】動名詞 vs. 名詞","translation":"在開設她的餐廳前，廚師 Andrea Michaels 曾在幾個獲獎的（餐廳）廚房受訓。","reason":"空格是介系詞（Before）的受詞位置，所以動名詞 (C) 和名詞 (D) 是可能的答案。因為其中只有動名詞可以接空格後面的受詞（her restaurant），所以動詞 open（開設）的動名詞 (C) opening 是正確答案。名詞 (D) 後面不能接受詞。動詞 (A) 和 (B) 不能當介系詞的受詞。就算想把 Before 當成副詞子句連接詞「在……之前」，把名詞 (D) 當成主詞，但因為這裡的 Before 後面無法形成有主詞和動詞的完整子句，所以不可能成立。","vocab":"chef n. 廚師　train v. 受訓　award-winning adj. 得獎的　openness n. 坦誠，開放","paraphrase":""},"113":{"type":"【名詞位置】可數名詞與不可數名詞","translation":"","reason":"空格是動詞（posted）的受詞位置，所以名詞 (A) 和 (C) 是可能的答案。因為空格前面有不定冠詞（a），而且句意是「發布公司靜修度假的照片」，所以可數名詞 (A) photograph（照片）是正確答案。不可數名詞 (C) 不能搭配不定冠詞（a）使用。動詞或過去分詞 (B) 和現在分詞 (D) 不能用在受詞位置。就算把 (D) 當成動名詞「照片拍攝」，變成「張貼公司靜修度假的拍攝」，意思也不恰當，而且動名詞不能搭配不定冠詞（a）使用。","vocab":"post v. 張貼，發布　retreat n. （公司的）靜修度假活動 v. 撤退　photography n. 攝影（術）","paraphrase":""},"114":{"type":"【形容詞位置】現在分詞 vs. 過去分詞","translation":"","reason":"空格修飾後面的名詞（brochures），所以有形容詞功能的現在分詞 (C) 和過去分詞 (D) 是可能的答案。被修飾的名詞（brochures）和分詞表示「被附上的小冊子」的被動意義，所以動詞（附上）的過去分詞 (D) enclosed 是正確答案。如果使用現在分詞 (C) enclosing（附上的），意思會變成「正在做附上這個行為的冊子」。動詞 (A) 和 (B) 不能修飾名詞。","vocab":"brochure n. 小冊子","paraphrase":""},"115":{"type":"【補語位置】名詞補語 vs. 形容詞補語","translation":"Emerald 灣帆船賽。","reason":"空格是 be 動詞（were）的補語位置，所以能當補語的名詞 (A)、形容詞 (B)、形容詞或名詞 (D) 是可能的答案。因為要表達「天氣很適合舉行帆船賽」，所以形容詞 (B) favorable（適合的，有利的）是正確答案。如果使用名詞 (A) favor（好意），則會變成「天氣狀況是好意」的意思，所以不對。(D) 當形容詞「最愛的」時，只能在名詞前面做修飾，而不能當 be 動詞的補語；當名詞時是可數名詞，必須搭配冠詞或為複數形。副詞 (C) 不能當補語。","vocab":"weather condition phr. 天氣狀況　favorably adv. 適合地，有利地　favorite adj. 最愛的 n. 最喜愛的事物","paraphrase":""},"116":{"type":"名詞詞彙","translation":"","reason":"句意是「如果被發現違反規定，市議會有權停止建設」，所以答案是 (C) authority（權力）。(A) notice 表示「通知」，(D) deliberation 表示「深思熟慮，慎重」。(B) objection（反對，異議）以 have an objection to（對……有異議）的形式使用時，to 是介系詞，而不是 to 不定詞的一部分，所以後面要接名詞才對。","vocab":"council n. 議會　halt v. 停止　code n. 法規　violation n. 違反　discover v. 發現","paraphrase":""},"117":{"type":"題意與語法解析","translation":"","reason":"與動詞連用的介系詞慣用表達方式\n因為要表達「依靠事業夥伴的建議」，所以能和空格前面的動詞 relied 構成 rely upon（依靠……）的介系詞 (A) upon 是正確答案。另外，也請記住和 rely upon 意思相同的 rely on。(B) beside 表示「在……旁」，(C) toward 表示「朝向……」，(D) with 表示「和……一起」。","vocab":"operate v. 營運，經營　retail store phr. 零售店　business partner phr. 事業夥伴","paraphrase":""},"118":{"type":"題意與語法解析","translation":"","reason":"數量表達方式\n能夠修飾空格後面單數可數名詞（employee）的數量詞 (A) each（每個）是正確答案。關係代名詞或疑問詞 (B) which 引導子句時，因為本身就是其中的主詞，所以後面只會接動詞的部分；這裡因為後面接有主詞（employee）和動詞（is entitled）的完整子句，所以不適用這個選項。數量詞 (C) some（一些）修飾可數名詞時，名詞必須是複數。指示代名詞或指示形容詞 (D) those 可以代稱前面提過的複數名詞，或者以「those + 修飾語（關係子句、分詞或介系詞片語）」的形式表示「……的人」，但這裡的句子並沒有這兩種情況，所以不對。","vocab":"regardless of phr. 不論……，不管……　seniority n. 年資　paid vacation phr. 帶薪休假","paraphrase":""},"119":{"type":"副詞子句連接詞時間","translation":"客戶一到達大樓的大廳，就馬上通知他。","reason":"能連接子句（Mr. Alden ~ notified）和子句（the clients ~ lobby）的副詞子句連接詞 (A)、(B)、(C) 和對等連接詞 (D) 都是可能的答案。因為要表達「客戶一到就馬上獲得通知」的意思，所以表示時間的副詞子句連接詞 (C) as soon as（一……就……）是正確答案。如果使用副詞子句連接詞 (A) whereas（然而……）或 (B) so that（以便……）的話，意思會變成「要求獲得通知，然而客戶抵達／好讓客戶抵達」，所以不對。如果使用對等連接詞 (D) or else（不然的話），意思會變成「要求獲得通知，不然客戶會抵達」，也不正確。","vocab":"notify v. 通知","paraphrase":""},"120":{"type":"名詞子句連接詞 疑問詞 how","translation":"員工穿著的樣子反映公司（的形象），所以在一整週的工作時間都請穿著正式服裝。","reason":"空格所在的子句（~ staff members dress）是動詞（is）的主詞，而每個選項都是可以引導名詞子句的連接詞，所以都是可能的答案。因為空格所在的子句是已經具有主詞（staff members）和動詞（dress）的完整子句，而且要表達的意思是「員工穿著的樣子反映公司的形象」，所以疑問副詞 (C) How（如何做……，做……的方式）是正確答案。疑問副詞 (A) When（什麼時候……）用在這裡會變成「員工什麼時候穿著，反映公司的形象」，所以不對。疑問代名詞或疑問形容詞 (B) What（什麼）與疑問代名詞 (D) Who（誰）如果用在這裡，表示動詞（dress）的受詞，意思則是「員工什麼／誰穿衣服，反映公司的形象」，所以不對。","vocab":"dress v. （給……）穿衣服　reflection n. 反映　professional adj. 專業的 n. 專家　attire n. 服裝，衣服","paraphrase":""},"121":{"type":"動詞詞彙","translation":"獨立紀念日年度煙火秀將在晚間 8 點於 Stapleton 公園後方開始。","reason":"句意是「煙火秀將在晚間 8 點開始」，所以 (B) commence（開始）是正確答案。(A) enter 表示「進入」，(C) withstand 表示「承受」，(D) originate 表示「發源，起源」。","vocab":"annual adj. 年度的，每年的　Independence Day phr. 獨立紀念日　firework n. 煙火","paraphrase":""},"122":{"type":"假設語氣過去完成式","translation":"要是當時協商沒有破裂的話，Jenkins Hospitality 就會收購 Starlite 飯店了。 假設語氣過去完成式","reason":"句意為「要是當時協商沒有破裂，就會收購飯店」，if 子句（if ~ down）的動詞是過去完成式（had not broken down），在假設語氣句型中，表示與過去事實相反的假設。所以，主要子句的形式應該是 would/could/might/should have p.p.，(D) would have acquired 是正確答案。未來式 (A)、過去式 (B)、現在完成式 (C) 都不是這個假設句的主要子句應該使用的時態。","vocab":"negotiation n. 協商　break down phr. 破裂，失敗　acquire v. 取得，收購","paraphrase":""},"123":{"type":"類似意義的形容詞","translation":"Sutter 小姐把登記表上的一些部分留空了，因為她不知道填好這張表需要的所有資訊。 類似意義的形容詞","reason":"句意是「因為不知道所有必要的資訊，所以把一些部分留空」，所以 (C) blank（空白的）是正確答案。(A) hollow（中空的）看中文翻譯似乎說得通，但這個詞是表達物理上的空洞，所以不對。(B) flat 表示「平的」。(D) pure 表示「純的」。","vocab":"portion n. 部分　registration form phr. 登記表　complete v. 完成，填好（表單）","paraphrase":""},"124":{"type":"副詞位置","translation":"Dearden 公司必須藉由在每個樓層設置清楚可見的緊急出口標誌，來遵守安全規定。","reason":"空格修飾後面的形容詞（visible），所以副詞 (C) clearly（清楚地）是正確答案。動詞 (A)、名詞 (B)、動詞或過去分詞 (D) 都不能修飾形容詞。就算把名詞 (B) clearance（清除，清理）當成動名詞 placing 的受詞，也無法和後面的名詞片語 visible emergency exit signs 組成文法正確的結構，所以不對。","vocab":"comply with phr. 遵守　safety regulation phr. 安全規定　place v. 放置，設置　visible adj. 可見的　emergency exit phr. 緊急出口　sign n. 標誌，看板　clear v. 清除 adj. 清楚的","paraphrase":""},"125":{"type":"介系詞選理由","translation":"由於預期將侵襲休士頓的風暴，明天的棒球賽被取消了。","reason":"因為要表達「由於風暴的關係，棒球賽被取消了」，所以表示理由的介系詞 (C) on account of（由於……）是正確答案。(A) unlike 表示「不像……，與……不同」，(B) up to 表示「最多……，取決於……」，(D) on behalf of 表示「代表……」。","vocab":"","paraphrase":""},"126":{"type":"動詞","translation":"大部分的健身專家推薦低卡路里、高纖維的飲食給希望減重的人。","reason":"句意是「推薦低卡路里、高纖維的飲食給希望減重的人」，所以 (B) recommend（推薦）是正確答案。(A) express 表示「表達」，(D) examine 表示「檢查」。(C) compliment（稱讚）雖然意思好像說得通，但正確的用法是接人物受詞，而這裡的受詞是事物，所以不對。請記得 compliment A on B（稱讚 A 的 B 這方面）這個慣用語。","vocab":"fitness n. 體適能，健康　low-calorie adj. 低卡路里（低熱量）的　high-fiber adj. 高纖維的　diet n. 飲食（法）　attempt v. 試圖，嘗試做","paraphrase":""},"127":{"type":"【引導修飾性語句的成分】副詞子句連接詞條件","translation":"除非有緊急情況，不然不應該打擾 Simpson 小姐。","reason":"這個句子已經有具備主詞（Ms. Simpson）和動詞（is meeting, should not be disturbed）的完整子句，所以 ~ emergency 是修飾性的語句。修飾部分有動詞（is），所以能引導修飾子句的副詞子句連接詞 (A)、(B)、(C) 是可能的答案。因為要表達「除非有緊急情況，不然不應該被打擾」，所以表示條件的副詞子句連接詞 (C) unless（除非……）是正確答案。(A) only if 和 (B) as long as 表示「只有在……的情況」和「只要……」，用在這裡會變成「要是有緊急情況，就不應該被打擾」的意思，所以不對。連接副詞 (D) thereafter（之後）不能引導修飾子句。","vocab":"board of directors phr. 董事會　disturb v. 打擾　emergency n. 緊急情況","paraphrase":""},"128":{"type":"【副詞位置】副詞選擇 時間副詞","translation":"Ray's Sandwiches 在 10 年前開幕，在那之後就成為受到 Weyburn 上班族歡迎的午餐地點。","reason":"空格修飾動詞（has become），所以副詞 (A)、(B)、(C) 是可能的答案。因為要表達「在 10 年前開幕，而在那之後成為受到上班族歡迎的午餐地點」，所以表示時間的副詞 (B) since（自那之後）是正確答案。(A) yet 表示「尚未，還沒」，(C) still 表示「仍然」。副詞子句連接詞 (D) while（在……期間）不能修飾動詞。另外，請記得 since 可以當表示時間點的介系詞「自從……」，或者表示理由的副詞子句連接詞「由於……」。","vocab":"office worker phr. 辦公室員工，上班族","paraphrase":""},"129":{"type":"【引導修飾性語句的成分】介系詞選擇 附加","translation":"除了幾個很容易修正的打字錯誤以外，這份報告看起來可以提交了。","reason":"這個句子已經有具備主詞（the report）、動詞（looks）和補語（ready）的完整子句，所以 - - - - - - - - - - - - - - - - - - - - ~ fixed 是修飾性的語句。修飾部分沒有動詞，所以能引導修飾片語的介系詞 (D) Apart from（除了……以外）是正確答案。逗號前面的部分雖然有動詞，但這個動詞事實上是屬於修飾先行詞（a few typos）的關係子句（that 子句），而先行詞和關係子句構成一個接在介系詞後面的名詞片語。副詞子句連接詞 (A) Supposing（假如……）、(B) In case（萬一……）、(C) As though（彷彿……）是引導修飾子句，而不是片語。","vocab":"typo n. 打字、排版錯誤　submit v. 提交","paraphrase":""},"130":{"type":"形容詞詞彙","translation":"天體物理學家 Bryan Healy 博士與航太工程師 Marie Duns 博士是各自領域裡的專家。","reason":"句意是「Bryan Healy 博士和 Marie Duns 博士是兩人各自領域裡的專家」，所以 (B) respective（各自的）是正確答案。(A) plausible 表示「似乎合理的」，(C) negligible 表示「可忽略的」，(D) intrusive 表示「侵入的」。","vocab":"astrophysicist n. 天體物理學家　aerospace n. 航空與太空","paraphrase":""},"131":{"type":"選出適當的句子","translation":"詳見上方閱讀文章的「中文翻譯」及以下題意解析。","reason":"這是選擇適當句子的題目，所以需要參考前後或整篇文章的內容。上一句 This will cause the ink cartridges to move to the center of the printing area and then stop. 提到，「這」（打開印表機的頂部）會使墨水匣移動到列印區域中間並停止，而下一句 It should slide out easily. 說它應該會很容易滑出來。因此，空格的內容應該和取下墨水匣有關，(A) Select the cartridge you wish to change and pull it toward you 是正確答案。(C) 雖然也和墨水匣有關，但提到的是重新裝滿墨水匣，所以不對。","vocab":"pull v. 拉　line up phr. 把……排列好　stack n. 一疊　prevent v. 預防　jammed adj. 堵塞的，卡住的　economical adj. 經濟的，省錢的　refer to phr. 參考……　identify v. 辨認，認出","paraphrase":""},"132":{"type":"【引導修飾性語句的成分】副詞子句連接詞時間","translation":"詳見上方閱讀文章的「中文翻
